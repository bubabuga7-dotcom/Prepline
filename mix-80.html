<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m061_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">25 столбов → 24 промежутка по 1,5 м.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>36 + 25 · 0,16 = 36 + 4 = 40 м. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 25 промежутков без столбов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Промежутков на 1 меньше.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m061_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1,3·10¹⁷ : 3,2·10⁷.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>≈ 0,41·10¹⁰ = 4,1·10⁹. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неверная мантисса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мантиссы и степени отдельно.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m061_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Q = 6k + 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2Q + 6 = 12k + 14 — не кратно 6. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные кратны 6.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте Q = 4.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m061_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма углов △ABC: x + (37 + z) + 70 = 180.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 73 − z. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол B = 37 + z.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m061_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3⁹ − 3⁸ = 2 · 3⁸, 3⁷ − 3⁶ = 2 · 3⁶.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 3¹⁴. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — потеряли 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите меньшую степень.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m061_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>ab</span><span>√</span></span>(ab) = (ab)^{<span class=\"fr\"><span>1</span><span>2</span></span>}; корень 4-й степени: (ab)^{<span class=\"fr\"><span>1</span><span>8</span></span>}.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Квадрат: (ab)^{<span class=\"fr\"><span>1</span><span>4</span></span>} — нет среди A–D. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — (ab)^{<span class=\"fr\"><span>3</span><span>4</span></span>}.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Показатели перемножаются.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m061_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">B = bc ≥ 2 · 1 = 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В 214 B = 1 — невозможно. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>221: a = c = 1, b = 2 ✔.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите минимум.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m061_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">A продано 10, B — 11 (тыс.); цена B = 1,6p.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Выручка A 10p, B 17,6p → <span class=\"fr\"><span>10</span><span>27,6</span></span> ≈ 36%. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — по штукам.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выручка = цена × количество.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m061_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проекция CD на землю: CD · cos 30°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10√3 · <span class=\"fr\"><span>√3</span><span>2</span></span> = 15. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сам отрезок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прилежащий катет.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m061_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наименьшая окружность — с диаметром PQ: r = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A ≥ π, больше — без ограничений. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — π достижимо.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Хорда ≤ диаметр.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m061_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AB = 4, DH = 2, BE = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Белое 4 + 1 = 5 из 16 → закрашено <span class=\"fr\"><span>11</span><span>16</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без малого квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доли площадей.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m061_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель 2¹⁵: 8 + 8 + 6 + 4 = 26.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>26</span><span>2¹⁵</span></span> = <span class=\"fr\"><span>13</span><span>2¹⁴</span></span>. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — числители без множителей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите к 2¹⁵.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m061_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Оба курса: x + y − (n − z).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Доля <span class=\"fr\"><span>x + y + z</span><span>n</span></span> − 1. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Включения-исключения.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m061_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь квадрата 64 минус три угловых треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 5 · DE + ½ · 5 · EC + ½ · 3 · 8 = 2,5 · 8 + 12 = 32.</li><li>64 − 32 = 32. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посчитали не те треугольники.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> DE + EC = 8 — положение E не важно.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m061_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Среднее геометрическое: √((3 − 2√2)(3 + 2√2)).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(9 − 8) = 1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — среднее арифметическое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> b² = ac.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m061_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">⁴√<span class=\"fr\"><span>16a⁸b⁴</span><span>10⁻⁴c¹²</span></span> = <span class=\"fr\"><span>2a²b</span><span>0,1c³</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · <span class=\"fr\"><span>1</span><span>9</span></span> · <span class=\"fr\"><span>1</span><span>10</span></span> / (0,1 · <span class=\"fr\"><span>8</span><span>27</span></span>) = <span class=\"fr\"><span>1</span><span>45</span></span> · <span class=\"fr\"><span>27</span><span>0,8</span></span> = <span class=\"fr\"><span>3</span><span>4</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала упростите корень.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m061_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одинаковый множитель k за 3 ч: 10k² = 14,4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 1,2 → 12 г. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — среднее арифметическое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Геометрический рост.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m061_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5* = 4* · <span class=\"fr\"><span>1</span><span>5</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>5</span></span>. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Произведения сокращаются.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m061_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">z ≥ x − 2 → x ≤ z + 2; z ≤ x + 5 → x ≥ z − 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>z − 5 ≤ x ≤ z + 2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите x из каждой части.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m061_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">На квадрат остаётся 40 − 2πr → сторона 10 − <span class=\"fr\"><span>πr</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>πr² + (10 − ½πr)². Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — периметр вместо стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сторона = периметр/4.</div></div>"}, {"id": 31, "topic": "M4.15", "text": "<p>Solve the simultaneous equations \\(x + 4y = 25\\) and \\(4x - 3y = -14\\).</p><p>What is \\(x + y\\)?</p>", "image": "", "options": ["−7", "−5", "6", "7", "9"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исключите одну переменную сложением или вычитанием.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Решение: x = 1, y = 6 (проверьте подстановкой в оба уравнения).</li><li>x + y = 7. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — это x − y.</li><li>C — это xy.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте ответ в оба уравнения.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.7", "text": "<p>Find the distance between \\((3, 0)\\) and \\((-3, 8)\\).</p>", "image": "", "options": ["8", "10", "11", "14", "100"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">d = √(Δx² + Δy²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δx = 6, Δy = 8.</li><li>√(36 + 64) = 10. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили координаты.</li><li>D — сложили разности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак разности неважен — она в квадрате.</div></div>", "src": "PL"}, {"id": 33, "topic": "M3.7", "text": "<p>Asel and Bota share 1600 stickers in the ratio 3 : 5. Asel then gives \\(\\dfrac{2}{5}\\) of her stickers to Bota.</p><p>How many stickers does Bota have now?</p>", "image": "", "options": ["360", "600", "1000", "1240", "1640"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала поделите в отношении, потом возьмите дробь от доли Асель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Асель: 1600 · <span class=\"fr\"><span>3</span><span>8</span></span> = 600, Бота: 1000.</li><li>Асель отдаёт <span class=\"fr\"><span>2</span><span>5</span></span> · 600 = 240 → у Боты 1240. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это сколько осталось у Асель.</li><li>B — это доля Асель до подарка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Читайте «от чего» берётся дробь.</div></div>", "src": "PL"}, {"id": 34, "topic": "M2.11", "text": "<p>Simplify \\(\\sqrt{18} + \\sqrt{50}\\).</p>", "image": "", "options": ["\\(8\\sqrt{4}\\)", "\\(9\\sqrt{2}\\)", "\\(\\sqrt{68}\\)", "\\(8\\sqrt{2}\\)", "\\(15\\sqrt{2}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вынесите полные квадраты из-под корня.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√18 = 3√2, √50 = 5√2.</li><li>3√2 + 5√2 = 8√2. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — √a + √b ≠ √(a + b).</li><li>E — перемножили коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывать можно только одинаковые корни.</div></div>", "src": "PL"}, {"id": 35, "topic": "M2.14", "text": "<p>By rounding each number to 1 significant figure, estimate \\(\\dfrac{7.91 \\times 48.2}{0.0193}\\).</p>", "image": "", "options": ["8", "400", "2000", "20,000", "200,000"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Округлите до 1 значащей цифры: 8, 50, 0,02.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 · 50 : 0,02 = 20 000. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — умножили на знаменатель.</li><li>B — забыли разделить.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на 0,2 — то же, что умножение на 5.</div></div>", "src": "PL"}, {"id": 36, "topic": "M2.1", "text": "<p>Which symbol makes this statement true?</p><p>\\(\\dfrac{5}{6} \\;\\square\\; \\dfrac{9}{11}\\)</p>", "image": "", "options": ["≤", "≥", ">", "<", "="], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравните перекрёстным умножением.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 11 = 55 и 9 · 6 = 54. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — дроби не равны, нужен строгий знак.</li><li>B — дроби не равны, нужен строгий знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У отрицательных: больше по модулю — меньше.</div></div>", "src": "PL"}, {"id": 37, "topic": "M4.3", "text": "<p>Find the value of \\(2a^2 - 3ab + b^2\\) when \\(a = 4\\) and \\(b = -1\\).</p>", "image": "", "options": ["−19", "21", "43", "45", "77"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляйте отрицательные числа в скобках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2·(4)² = 32; −3·(4)·(−1) = 12; (−1)² = 1.</li><li>Сумма: 45. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посчитали a² как отрицательное число.</li><li>E — возвели в квадрат 2a.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (−3)² = 9, а −3² = −9.</div></div>", "src": "PL"}, {"id": 38, "topic": "M4.12", "text": "<p>\\(f(x) = 3x - 1\\) and \\(g(x) = x^2 - 1\\).</p><p>Find \\(f(g(3))\\).</p>", "image": "", "options": ["16", "23", "26", "63", "64"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала внутренняя функция g, потом f.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>g(3) = 8.</li><li>f(8) = 3·8 − 1 = 23. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили f и g.</li><li>D — это g(f(3)) — порядок обратный.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> f(g(x)): g действует первой.</div></div>", "src": "PL"}, {"id": 39, "topic": "M1.1", "text": "<p>A metal has density 2.5 g/cm³. A block of it has volume 20 cm³.</p><p>What is the mass of the block?</p>", "image": "", "options": ["5 g", "8 g", "50 g", "70 g", "100 g"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Масса = плотность × объём.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2,5 · 20 = 50 г. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — разделили объём на плотность.</li><li>D — сложили вместо умножения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Треугольник m = ρ·V помогает не перепутать.</div></div>", "src": "PL"}, {"id": 40, "topic": "M2.12", "text": "<p>A rectangle is 15 cm long and 6 cm wide, both measured to the nearest centimetre.</p><p>What is the upper bound of its area?</p>", "image": "", "options": ["79.75 cm²", "90 cm²", "93 cm²", "100.75 cm²", "112 cm²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верхняя граница произведения = верхняя × верхняя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Границы: 15,5 и 6,5 см.</li><li>15,5 · 6,5 = 100,75 см². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это нижняя граница.</li><li>B — это значение без учёта точности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> До ближайшего целого — это ±0,5.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
