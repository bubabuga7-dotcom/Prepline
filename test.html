<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "section": "math", "text": "Aygerim, Almaz, Yerkezhan, Kaisar and Madina are going for a drive in a jeep that has five seats, including one driver's seat and four passenger seats. If only Almaz can drive, the number of possible different seating arrangements is", "options": ["12", "18", "24", "120", "15"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Место водителя фиксировано, остальные рассаживаются произвольно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Водитель — только Алмаз: 1 способ.</li><li>4 человека на 4 места: 4! = 24.</li><li>Итого 24.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (120) — 5!, забыли ограничение.</li><li>A, B, E — неверный счёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала фиксируйте ограниченные позиции, потом считайте остальные.</div></div>"}, {"id": 2, "section": "math", "text": "If 40% of x is equal to 160% of y, what is the value of (3x − 12y)/5?", "options": ["3", "1", "2", "4", "0"], "correct": 4, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из условия выражаем x через y и подставляем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40% x = 160% y → 0,4x = 1,6y → x = 4y.</li><li>3x − 12y = 12y − 12y = 0.</li><li>0 ÷ 5 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — получаются, если неверно выразить x (например, x = <span class=\"fr\"><span>y</span><span>4</span></span>).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала упростите связь (x = 4y), потом подставляйте.</div></div>"}, {"id": 3, "section": "math", "text": "If ab = 8/3, bc = 12 and ac = 2, what is the cube root of abc?", "options": ["2", "1", "3", "5", "4"], "correct": 0, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем три равенства: (abc)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(ab)(bc)(ac) = (abc)² = <span class=\"fr\"><span>8</span><span>3</span></span> · 12 · 2 = 64.</li><li>abc = 8.</li><li>∛8 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (4) — квадратный корень вместо кубического.</li><li>B, C, D — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же приём, что и с xy, xz, yz: перемножить всё.</div></div>"}, {"id": 4, "section": "math", "text": "If 4^(x+2) = 64, what is 8x?", "options": ["8", "4", "16", "1", "32"], "correct": 0, "topic": "M2.7", "explain": "64 = 4³, so x + 2 = 3 and x = 1. 8x = 8."}, {"id": 5, "section": "math", "text": "The operation ∆ is defined by a∆b = a/b − b/a. Find k such that 3∆k = k∆2.", "options": ["±2.0", "±2.4", "±3.0", "±5.5", "±6.0"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем обе стороны по определению и решаем уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3∆k = <span class=\"fr\"><span>3</span><span>k</span></span> − <span class=\"fr\"><span>k</span><span>3</span></span>; k∆2 = <span class=\"fr\"><span>k</span><span>2</span></span> − <span class=\"fr\"><span>2</span><span>k</span></span>.</li><li><span class=\"fr\"><span>3</span><span>k</span></span> + <span class=\"fr\"><span>2</span><span>k</span></span> = <span class=\"fr\"><span>k</span><span>2</span></span> + <span class=\"fr\"><span>k</span><span>3</span></span> → <span class=\"fr\"><span>5</span><span>k</span></span> = <span class=\"fr\"><span>5k</span><span>6</span></span>.</li><li>k² = 6 → k = ±√6 ≈ ±2,45 ≈ ±2,4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (±2), C (±3) — неверно собрали подобные.</li><li>D, E — ошибки в знаменателях.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переносите слагаемые с <span class=\"fr\"><span>1</span><span>k</span></span> в одну сторону, с k — в другую.</div></div>"}, {"id": 6, "section": "math", "text": "f(x) = kx (k ≠ 0) and g(x) = x + k. Which of these statements is always true? I. f(2x) = 2f(x)  II. f(x + 2) = f(x) + 2  III. f(g(x)) = g(f(x))", "options": ["I only", "II only", "I and II", "I and III", "I, II and III"], "correct": 0, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение для произвольного k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I: f(2x) = k·2x = 2kx = 2f(x) — верно всегда ✓.</li><li>II: f(x + 2) = kx + 2k, а f(x) + 2 = kx + 2 — равны только при k = 1.</li><li>III: f(g(x)) = k(x + k) = kx + k²; g(f(x)) = kx + k — равны только при k = 1.</li><li>Всегда верно только I.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — содержат II, которое неверно при k ≠ 1.</li><li>D — содержит III.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Always true» — достаточно одного контрпримера (k = 2), чтобы отбросить утверждение.</div></div>"}, {"id": 7, "section": "math", "text": "√(10 × (6⁴ − 16)/32) = ?", "options": ["√5", "15", "20", "24", "√10"], "correct": 2, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычисляем по порядку, начиная с внутренних скобок.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6⁴ = 1296.</li><li>1296 − 16 = 1280.</li><li>1280 ÷ 32 = 40.</li><li>10 · 40 = 400 → √400 = 20.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — ошибки в счёте.</li><li>A, E — забыли умножить на 10 или не извлекли корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6⁴ = 36² = 1296 — удобно считать через квадрат.</div></div>"}, {"id": 8, "section": "math", "text": "A cube is inscribed in a sphere of radius 3. What is the volume of the cube?", "options": ["12√3", "24√3", "3√3", "48√3", "72√3"], "correct": 1, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Куб, вписанный в шар: диагональ куба = диаметр шара.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диагональ куба со стороной s: s√3.</li><li>s√3 = 2 · 3 = 6 → s = <span class=\"fr\"><span>6</span><span>√3</span></span> = 2√3.</li><li>Объём: (2√3)³ = 8 · 3√3 = 24√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (12√3) — ошибка при возведении в куб.</li><li>D, E — взяли диаметр как сторону или забыли √3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагональ грани — s√2, пространственная диагональ — s√3.</div></div>"}, {"id": 9, "section": "math", "text": "At which positive value of x does the parabola y = (x − 1)² − 4 cross the x-axis?", "options": ["−2", "3", "−1", "−3", "1"], "correct": 1, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пересечение с осью x — там, где y = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 1)² − 4 = 0 → (x − 1)² = 4.</li><li>x − 1 = ±2 → x = 3 или x = −1.</li><li>Положительный корень — 3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (−1) — второй корень, но отрицательный.</li><li>E (1) — это x вершины.</li><li>A, D — неверные знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Форма (x − h)² + k сразу даёт вершину (h; k) и упрощает решение.</div></div>"}, {"id": 10, "section": "math", "text": "The volume and the surface area of a cube are numerically equal. What is the length of one edge?", "options": ["1", "9", "6", "2", "4"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём куба s³, площадь поверхности 6s². Приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s³ = 6s².</li><li>Делим на s² (s > 0): s = 6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (1) — тогда объём 1, площадь 6.</li><li>B, D, E — не удовлетворяют s³ = 6s².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У куба 6 граней, поэтому поверхность 6s².</div></div>"}, {"id": 11, "section": "math", "text": "On her 18th birthday in 2012 Aigerim was 159 cm tall, having grown 6% since 2011. How tall was she in 2011?", "options": ["155 cm", "140 cm", "145 cm", "150 cm", "160 cm"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рост на 6% означает: 159 см = 106% от роста в 2011 году.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x · 1,06 = 159.</li><li>x = 159 ÷ 1,06 = 150 см.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (155) — вычли 6% от 159 (≈ 9,5) неверно.</li><li>C (145) — другое округление.</li><li>B, E — не проходят проверку 150 · 1,06 = 159.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ловушка: «вырос на 6%» — процент от <b>старого</b> значения. Нельзя просто вычесть 6% от нового.</div></div>"}, {"id": 12, "section": "math", "text": "An icosagon is a polygon with 20 sides. What is the sum of all the interior angles of a regular icosagon?", "options": ["3340°", "3240°", "3640°", "3440°", "3540°"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма внутренних углов n-угольника = (n − 2) · 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 20 → (20 − 2) · 180° = 18 · 180° = 3240°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ошибки в умножении или взяли n − 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый n-угольник делится на n − 2 треугольника.</div></div>"}, {"id": 13, "section": "math", "text": "A cone is inscribed in a hemisphere of radius r so that the base of the cone coincides with the base of the hemisphere. What is the ratio of the volume of the cone to the volume of the hemisphere?", "options": ["1/2", "1/4", "2r/3", "r/2", "r/3"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота конуса равна радиусу полусферы, основания совпадают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конус: V = ⅓πr²h = ⅓πr²·r = ⅓πr³.</li><li>Полусфера: V = ½ · <span class=\"fr\"><span>4</span><span>3</span></span>πr³ = ⅔πr³.</li><li>Отношение: ⅓ ÷ ⅔ = ½.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (¼) — взяли объём целого шара.</li><li>C, D, E — отношение объёмов не может зависеть от r.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение объёмов подобных фигур — безразмерное число, буквы r в ответе быть не может.</div></div>"}, {"id": 14, "section": "math", "text": "ASB is a quarter circle. PQRS is a rectangle with PQ = 8 and PS = 6. What is the length of the arc AQB?", "options": ["5π", "25", "28", "10π", "14"], "correct": 0, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершина Q прямоугольника лежит на дуге, значит, SQ — радиус. А SQ — диагональ прямоугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>SQ = √(8² + 6²) = √100 = 10 → r = 10.</li><li>Длина четверти окружности: ¼ · 2πr = ¼ · 20π = 5π.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (10π) — половина окружности.</li><li>B, C, E — длины без π: сложили стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В фигурах «прямоугольник в четверти круга» диагональ = радиус.</div></div>"}, {"id": 15, "section": "math", "text": "The perimeter of a triangle is 13. The two shorter sides have integer lengths x and x + 1. What could the length of the third side be?", "options": ["8", "10", "6", "2", "4"], "correct": 2, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Третья сторона выражается через x; применяем неравенство треугольника и условие «две короткие стороны».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>c = 13 − x − (x + 1) = 12 − 2x.</li><li>c — самая длинная: 12 − 2x ≥ x + 1 → x ≤ 3.</li><li>Неравенство треугольника: 12 − 2x < x + (x + 1) → x > 2,75.</li><li>x — целое → x = 3, c = 6. (Стороны 3, 4, 6.)</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — третья сторона больше суммы двух других.</li><li>D, E — тогда третья сторона не самая длинная.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Неравенство треугольника: самая длинная сторона меньше суммы двух других.</div></div>"}, {"id": 16, "section": "math", "text": "What is the length of the line segment with endpoints (−2, −2) and (2, 3)?", "options": ["√31", "9", "√41", "3", "7"], "correct": 2, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина отрезка — формула расстояния (теорема Пифагора).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δx = 2 − (−2) = 4, Δy = 3 − (−2) = 5.</li><li>d = √(4² + 5²) = √41.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (9) — сложили 4 + 5.</li><li>A, D, E — арифметические ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус на минус: 3 − (−2) = 5.</div></div>"}, {"id": 17, "section": "math", "text": "A 3 by 4 rectangle is inscribed in a circle. What is the circumference of the circle?", "options": ["4π", "5π", "2.5π", "10π", "3π"], "correct": 1, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прямоугольник, вписанный в окружность: его диагональ — это диаметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диагональ = √(3² + 4²) = √25 = 5.</li><li>Диаметр d = 5.</li><li>Длина окружности C = πd = 5π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (2,5π) — это πr, а не 2πr.</li><li>D (10π) — взяли 5 как радиус.</li><li>A, E — по сторонам, а не по диагонали.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Египетский треугольник 3-4-5 встречается очень часто — узнавай его сразу.</div></div>"}, {"id": 18, "section": "math", "text": "Through how many degrees does the hour hand turn between noon and 14:30 on the same day?", "options": ["180", "65", "75", "60", "720"], "correct": 2, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Часовая стрелка проходит 30° в час.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С 12:00 до 14:30 — 2,5 часа.</li><li>2,5 · 30° = 75°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (180°) — угол минутной стрелки за 30 мин.</li><li>E (720°) — путь минутной стрелки.</li><li>B, D — неточные расчёты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 360° ÷ 12 ч = 30°/ч.</div></div>"}, {"id": 19, "section": "math", "text": "m and n are the roots of x² + 5x + 8 = 0. What is √(m² + n²)?", "options": ["9", "5", "4", "3", "6"], "correct": 3, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не ищем корни — используем теорему Виета и формулу m² + n² = (m + n)² − 2mn.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m + n = −5, mn = 8.</li><li>m² + n² = 25 − 16 = 9.</li><li>√9 = 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (9) — забыли извлечь корень.</li><li>B (5) — взяли |m + n|.</li><li>C, E — ошибка в 2mn.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Симметричные выражения корней (m² + n², <span class=\"fr\"><span>1</span><span>m</span></span> + <span class=\"fr\"><span>1</span><span>n</span></span> …) всегда считаются через сумму и произведение.</div></div>"}, {"id": 20, "section": "math", "text": "If g(x − 1) = x² + 2, what is g(x + 1)?", "options": ["x²+3", "x²+4x+6", "x²+2x+4", "x²+5", "x²+4x+2"], "correct": 1, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Заменой находим g(u) в общем виде, потом подставляем x + 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>u = x − 1 → x = u + 1 → g(u) = (u + 1)² + 2.</li><li>g(x + 1) = (x + 2)² + 2 = x² + 4x + 4 + 2 = x² + 4x + 6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — забыли +4 из квадрата.</li><li>C — подставили x + 1 вместо x + 2.</li><li>A, D — неверный сдвиг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> g(x + 1) — это g(x − 1) со сдвигом на 2: подставьте x + 2 вместо x в x² + 2.</div></div>"}, {"id": 22, "section": "math", "text": "If x = −8, what is the value of x^(2/3) + 2x⁰?", "options": ["−2", "4", "−4", "6", "−6"], "correct": 3, "topic": "M2.7", "explain": "(−8)^(2/3) = (∛−8)² = (−2)² = 4, and x⁰ = 1, so 4 + 2 = 6."}, {"id": 23, "section": "math", "text": "Under which condition is the expression xy/(x − y) negative?", "options": ["0 < y < x", "x < y < 0", "x < 0 < y", "y < x < 0", "None of these"], "correct": 1, "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знак дроби = знак числителя × знак знаменателя. Проверяем каждый случай.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: x < y < 0 → оба отрицательные, xy > 0; x < y → x − y < 0.</li><li>Положительное ÷ отрицательное = отрицательное ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: 0 < y < x → xy > 0, x − y > 0 → положительно.</li><li>C: x < 0 < y → xy < 0, x − y < 0 → положительно.</li><li>D: y < x < 0 → xy > 0, x − y > 0 → положительно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах на знаки подставьте конкретные числа: например, x = −2, y = −1.</div></div>"}, {"id": 24, "section": "math", "text": "What is the sum of the roots of 2x³ − 4x² + 9x = 0?", "options": ["4", "3", "1/2", "3/4", "2"], "correct": 4, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выносим x за скобку: один корень 0, остальные — по Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x(2x² − 4x + 9) = 0.</li><li>x = 0 — первый корень.</li><li>Сумма корней квадратного: −<span class=\"fr\"><span>−4</span><span>2</span></span> = 2.</li><li>Всего: 0 + 2 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4) — забыли поделить на 2.</li><li>B, C, D — ошибки с коэффициентами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для кубического ax³ + bx² + … сумма всех корней = <span class=\"fr\"><span>−b</span><span>a</span></span> = <span class=\"fr\"><span>4</span><span>2</span></span> = 2 — то же самое сразу.</div></div>"}, {"id": 25, "section": "math", "text": "The mean of the roots of a quadratic equation is 3 and the difference between the roots is 2. Which equation fits?", "options": ["x² − 5x + 6 = 0", "x² + 5x + 6 = 0", "x² − 6x + 8 = 0", "x² − 6x − 8 = 0", "x² − 6x + 6 = 0"], "correct": 2, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Среднее корней 3 → сумма 6; разность 2 → корни 2 и 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x₁ + x₂ = 6, x₁ − x₂ = 2 → x₁ = 4, x₂ = 2.</li><li>(x − 2)(x − 4) = x² − 6x + 8.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — корни 2 и 3 (среднее 2,5).</li><li>B — корни отрицательные.</li><li>D, E — произведение корней не 8.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уравнение по корням: x² − (сумма)x + (произведение) = 0.</div></div>"}, {"id": 26, "section": "math", "text": "If 24 of the 40 students in a club are girls, what is the ratio of boys to girls?", "options": ["2:5", "3:5", "2:3", "3:2", "5:2"], "correct": 2, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мальчиков 40 − 24 = 16, затем сокращаем отношение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 : 24 = 2 : 3 (делим на 8).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (3:2) — девочки к мальчикам.</li><li>B (3:5) — девочки к общему числу.</li><li>A — мальчики к общему.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Следите за порядком: «boys to girls».</div></div>"}, {"id": 31, "topic": "M4.18", "text": "<p>The sequence 11, 15, 19, 23, … is arithmetic.</p><p>What is its 20th term?</p>", "image": "", "options": ["79", "80", "87", "91", "220"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">aₙ = a₁ + (n − 1)d.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a₁ = 11, d = 4.</li><li>11 + 19·4 = 87. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли первый член.</li><li>D — взяли d·n вместо d·(n − 1).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте формулу на n = 1.</div></div>", "src": "PL"}, {"id": 32, "topic": "M4.10", "text": "<p>Line L has gradient 3. Line M is perpendicular to L.</p><p>What is the gradient of M?</p>", "image": "", "options": ["−\\(\\dfrac{1}{3}\\)", "6", "\\(\\dfrac{1}{3}\\)", "−3", "3"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Произведение градиентов перпендикулярных прямых = −1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m₂ = −1 : 3 = −<span class=\"fr\"><span>1</span><span>3</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — перевернули, но не сменили знак.</li><li>D — поменяли только знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перевернуть и сменить знак.</div></div>", "src": "PL"}, {"id": 33, "topic": "M5.14", "text": "<p>A prism has a triangular cross-section with base 8 cm and perpendicular height 5 cm. The prism is 12 cm long.</p><p>What is its volume?</p>", "image": "", "options": ["20 cm³", "25 cm³", "80 cm³", "240 cm³", "480 cm³"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = площадь сечения × длина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½·8·5 = 20.</li><li>20 · 12 = 240 см³. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли длину.</li><li>B — сложили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Призма — без ⅓, пирамида — с ⅓.</div></div>", "src": "PL"}, {"id": 34, "topic": "M5.5", "text": "<p>In triangle ABC, D is on AB and E is on AC with DE parallel to BC. AD = 6 cm, DB = 9 cm and DE = 8 cm.</p><p>Find BC.</p>", "image": "", "options": ["3.2 cm", "12 cm", "17 cm", "20 cm", "22 cm"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольники ADE и ABC подобны; AB = 15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 15 : 6.</li><li>BC = 8 · <span class=\"fr\"><span>15</span><span>6</span></span> = 20 см. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — коэффициент перевёрнут.</li><li>B — взяли DB : AD вместо AB : AD.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте со всей стороной AB, а не с DB.</div></div>", "src": "PL"}, {"id": 35, "topic": "M2.3", "text": "<p>Write 1200 as a product of its prime factors.</p>", "image": "", "options": ["\\(2^{4} \\times 3 \\times 5^{2}\\)", "\\(48 \\times 25\\)", "\\(2 \\times 3^{4} \\times 5^{2}\\)", "\\(2^{4} \\times 3 \\times 5^{3}\\)", "\\(2^{3} \\times 3^{2} \\times 5^{2}\\)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делите на 2, пока делится, затем на 3, затем на 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1200 = 2<sup>4</sup> · 3<sup>1</sup> · 5<sup>2</sup>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — множитель 48 не простой.</li><li>C — перепутали показатели у 2 и 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте: перемножьте ответ обратно.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1560, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;
  const label = q.section === 'math' ? 'Mathematics' : 'Critical Thinking';

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length} · ${label}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      return `<div class="review-item"><span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</span></div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1560, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
