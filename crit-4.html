<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"The expense of advertising adds greatly to overall production costs and thus to the prices of goods when they reach the public. There is particular public resentment of mass advertising for rival brands of products such as petrol or detergents - which, most people suspect, are so similar in character as to be virtually indistinguishable except in their packaging. Much of the huge sum devoted to advertising could be used more fruitfully to bring down prices. Therefore, advertising disadvantages the consumer.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>","options":["Manufacturers wouldn’t spend money on ads unless they believed it would benefit  public.","By increasing competition, advertising leads to an overall improvement in quality of goods.","Advertising does not affect in any way what customers choose to buy.","The advertising industry is able to employ people who would otherwise be out of work.","Advertisements often make misleading claims about the quality of the product."],"correct":1,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: реклама вредит покупателю. Ослабить — показать пользу рекламы для него.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если реклама усиливает конкуренцию и качество товаров растёт — покупатель выигрывает. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — мнение производителей ничего не доказывает.</li><li>C — не показывает пользы.</li><li>D — польза для работников, не для покупателей.</li><li>E — усиливает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабить «вредит X» — найти выгоду именно для X.</div></div>"},{"id":2,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":0,"src":"MC","image":"images/q-60a1e21850.png","topic":"MC","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — итог последней фразы («and hence…»).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Массовая безработица подрывает общество. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — посылки.</li><li>C — шаг к выводу.</li><li>D — не сказано прямо.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Hence» указывает на вывод.</div></div>"},{"id":3,"text":"Only John Lewis, the nationally adored and trusted UK retail group, can get away with the shamelessly sentimental marketing that they do. More than 100,000 people watched and rewatched on YouTube in the first week it was available their most popular 'Always a Woman' advertisement. If anyone else had dreamt it up, they would have been pilloried as sexist and out-of-touch. In it, John Lewis offers a politically incorrect view of modern womanhood: pair-bonding and breeding are significant milestones, they say, not making CEO of a company. Surprisingly however, figures show that the retailer has magnificently outperformed every single rival.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?</b>","options":["The British public will accept anything from John Lewis.","Marketing that plays on our emotions is morally reprehensible.","Marriage and motherhood suit women more than business achievement.","The number of hits on YouTube is a good measure of success.","In the right hands an appeal to sentiment can be a successful marketing tool."],"correct":4,"src":"CON","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Реклама сентиментальная, но компания обогнала всех конкурентов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, обращение к чувствам в умелых руках может работать. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно.</li><li>B, C — оценки автора не делается.</li><li>D — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод с «can» — надёжный.</div></div>"},{"id":4,"text":"Young people are becoming ever more responsible. They are less likely to take drugs or drink than past generations. Very few have serious problems with alcohol or drugs. It is people in their forties who are most likely to be admitted to hospital for drinking-related problems. The latest figures on drug addiction show that 39% of heroin addicts are now over the age of forty, up from 19% in 2006. Fewer than ever are under the age of twenty-four. The number of young adults in prison is falling, but our overcrowded prisons are increasingly home to the older generation: between 2002 and 2013, the number of middle-aged men locked up increased by 130%. The same is true of suicide rates: on both sides of the Atlantic fewer young people but more middle-aged men are killing themselves.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?</b>","options":["Young people have far fewer health problems than older generations.","Some social problems are increasingly the problems of middle-aged people.","People who drink are more likely to engage in criminal activity.","Drink, drugs and suicide are the biggest killers of middle-aged people.","Young people are likely to develop harmful behaviors later in life."],"correct":1,"src":"CON","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все примеры: у молодых проблем меньше, у людей среднего возраста больше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, некоторые социальные проблемы всё больше касаются людей среднего возраста. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — про здоровье в целом не сказано.</li><li>C, D — не следуют.</li><li>E — противоречит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обобщите все примеры одной фразой.</div></div>"},{"id":5,"text":"The most popular theory about the origin of the Moon is that it was formed from debris breaking off the Earth in a planetary collision 4.5 billion years ago. If this were true, the Moon would be made of the same material as is found on Earth. Examination of Moon rocks shows this to be the case, although there is little iron in Moon rocks. However, this can be explained because, according to the theory, the material that formed the Moon would have come from the Earth's crust, not its iron-rich core. Thus we should accept the theory as true.<br><br><b>Which one of the following identifies the flaw in the above argument?</b>","options":["The popularity of a theory is not what determines its truth.","Evidence that is inconsistent with a theory proves that the theory is false.","The explanation offered in the passage is not consistent with the theory.","Evidence that confirms a theory's predictions does not prove that the theory is true.","A theory that is not consistent with the facts should be rejected, not modified."],"correct":3,"src":"FLAW","topic":"FLAW","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: факты совпали с предсказанием теории, значит, теория верна.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Совпадение с предсказанием подтверждает теорию, но не доказывает её. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — автор на популярность не опирается.</li><li>B, C, E — не относятся к тексту.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подтверждение ≠ доказательство.</div></div>"},{"id":6,"text":"\"I tried a speed reading course and read 'War and Peace' in three hours. It's about Russia.\" Woody Allen's joke strikes a chord with many who doubt the effectiveness of speed reading techniques. These techniques usually involve moving your finger smoothly and quickly along lines of text and training your eyes to follow, so preventing your eyes going back over words you have already read, which is what we normally do. There have been reports of readers achieving incredible speeds using these techniques, but such achievements are of limited benefit to many readers, particularly students, who have to gain a deep understanding of what they read.<br><br><b>Which of the following, if true, would weaken the above argument?</b>","options":["For many tasks a student has to do, speed reading can lead to a superficial understanding.","Speed reading techniques are more difficult to acquire the older you are.","A student, after reading the argument, commented, \"I find I understand what I am reading better if I read quickly.\"","A student, after reading the argument, commented, \"I use speed reading for easy texts. I have to read slowly if the content is difficult.\"","Speed readers have found they have difficulty in reading for pleasure (for example when reading novels or magazines)."],"correct":2,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: быстрое чтение мало помогает студентам, которым нужно глубокое понимание.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если студент понимает лучше, когда читает быстро — довод ослаблен. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — усиливают.</li><li>B — про возраст.</li><li>D — согласуется с автором.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрпример напрямую бьёт по выводу.</div></div>"},{"id":7,"text":"A study of shooting victims in Philadelphia has found that people who carry guns are far more likely to be shot than those who are unarmed. Researchers at the University of Pennsylvania looked at 677 shootings over two and a half years, taking into account various factors such as the age and socioeconomic status of those involved. The researchers concluded that armed citizens were 4.5 times more likely to get shot and 4.2 times more likely to get killed than those who were unarmed. Therefore, it is significantly safer not to carry a gun in Philadelphia.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["Some of those shot were carrying concealed weapons.","People carrying guns have a sense of empowerment.","People who are at risk of getting shot are more likely to carry a gun.","People carrying guns are likely to overreact in potentially violent situations.","The bearing of arms is protected by the Second Amendment of the US Constitution."],"correct":2,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: ношение оружия делает опаснее. Ослабить — обратная причина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если оружие носят те, кому и так грозит опасность — причина не в оружии. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — не про причину.</li><li>D — усиливает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"},{"id":8,"text":"When preparing for examinations, it is important that students do not suppress any emotional or other problems they might be having during their course of study. A good way of revealing problems is the creation of a partnership and a discussion between students, parents and teachers. This is far preferable to the problems only becoming apparent with the arrival of the results causing upset and disappointment for all concerned. Therefore, if schools and colleges create as many opportunities as possible for three-way meetings between students, parents and teachers, they will make a valuable contribution to their students' achievements in examinations.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>","options":["Other factors besides emotional problems are not important in determining examination success.","The three parties involved are able to exchange views constructively when they meet.","Students often do not communicate as well with their parents as they do with teachers.","The problems revealed by the three-way discussion can always be solved.","Emotional factors are just as important for students' success as their academic ability."],"correct":1,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: больше встреч студент–родитель–учитель → лучше результаты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если на встречах они могут конструктивно обсуждать проблемы. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — слишком сильно.</li><li>C — не нужно.</li><li>D — «всегда» слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если встречи бесполезны — вывод рушится.</div></div>"},{"id":9,"text":"Powdered rhinoceros horn has often been claimed to have aphrodisiac properties. However, a recent investigation showed no evidence that it has any chemical effect whatsoever on the human nervous system. What is more, in an experiment in which 100 people were given powdered rhinoceros horn and another 100 people were given powdered rice, without knowing what they were taking, more of those taking the rice indicated that they felt an increase in sexual arousal than did those taking the rhinoceros horn. This demonstrates conclusively that rhinoceros horn is not an aphrodisiac.<br><br><b>Which one of the above is an underlying assumption of the argument in the passage?</b>","options":["Powdered rice does not have significant aphrodisiac properties.","Claims made about aphrodisiacs are in general untrustworthy.","Powdered rice has no effect on the human nervous system.","The claims about its aphrodisiac properties are spread to create a demand for rhinoceros horn.","A ban on the trade in rhinoceros horn should be enforced worldwide."],"correct":0,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор сравнивает рог и рис, чтобы доказать: рог не действует.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если сам рис — не возбуждающее средство. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — про нервную систему, а важен эффект.</li><li>B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрольное вещество должно быть «пустым».</div></div>"},{"id":10,"text":"We live in an information-rich world where communication is quicker and easier than ever before. We don’t have to wait for journalists and photographers to report news to us. Anyone can talk about or take photographs of significant events and share them immediately. Traditional ways of reporting meant that news could be effectively censored, but this is no longer the case. Similarly, incorrect information cannot be removed from the public domain without great difficulty. Governments and the traditional media will therefore need to find new ways to cope with these challenges and adapt to new technology.<br><br><b>Which one of the following, if true, most strengthens the above argument?</b>","options":["Some governments have successfully restricted the information available on the internet in their countries.","Journalists occasionally film material on their mobile phones.","Information can be posted anonymously on the internet, thus avoiding possible prosecution.","Legal proceedings have been brought against those publishing false and incriminating material on the internet.","In the past, individuals often took photographs that they then sold to the press."],"correct":2,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: правительства и СМИ должны приспособиться, потому что информацию трудно контролировать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если информацию можно публиковать анонимно и без наказания — контролировать её ещё сложнее. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — ослабляют.</li><li>B, E — не связаны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усиливает то, что подтверждает «нельзя контролировать».</div></div>"},{"id":11,"text":"The battery life of laptop computers means that they cannot be used for the duration of a long haul flight without needing to be recharged from an onboard power point. Not all aeroplanes have this facility. Therefore, laptop computers should not be allowed as carry on items for long haul flights on planes that do not have onboard power points, regardless of whether they are intended for personal or business use, as they will be of limited use to their owners and take up a disproportionate amount of space in the cabin.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>","options":["Some companies expect their employees to work on long haul flights.","There is no chance of a laptop becoming damaged if it is stored in a suitcase in the hold.","A laptop may run out of battery on a short haul flight, too.","The passenger cannot choose whether or not they book a flight with an onboard power point.","Passengers could make some use of their laptop even if the battery does run out."],"correct":4,"src":"FLAW","topic":"FLAW","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: без зарядки ноутбук бесполезен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но им можно пользоваться, пока батарея не села. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — не про ошибку.</li><li>B — не связано.</li><li>C — не относится к длинным рейсам.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ошибка «всё или ничего».</div></div>"},{"id":12,"text":"The effect of shortening degree courses at universities from three years to two would be that students would have two-thirds as much time to think about their subject. The result would be graduates whose understanding of their subject was shallower and whose intellectual development was much less extended. Any measure that leads to a lowering of the quality of graduates should be resisted by universities.<br><br><b>Which one of the following conclusions can reliably be drawn from the above passage?</b>","options":["University graduates at present have an in-depth understanding of their subject.","Universities should oppose the shortening of degree courses to two years.","Universities are not proposing to reduce the length of degree courses to two years.","Students should oppose moves by universities to shorten degree courses.","Universities should adopt more rigorous standards for the award of degrees."],"correct":1,"src":"CON","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Соединяем посылки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Двухлетний курс ухудшит выпускников.</li><li>Университеты должны выступать против всего, что ухудшает выпускников.</li><li>Значит, они должны выступать против двухлетних курсов. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в crit-1.</div></div>"},{"id":13,"text":"In today's 24/7 media environment, public figures have the ability to influence the behaviour of millions of young people, for better and for worse. There are celebrities who don’t give in to social pressures and are in the news because of good deeds which have a positive influence on young people, such as giving to charity. However, there are others who glamorise destructive behaviour such as drinking, smoking, swearing and sexual promiscuity, giving young people the impression that this is socially acceptable or even desirable. Although many celebrities maintain that they do not wish to be regarded as role models, it seems that this attitude is not only unrealistic but also irresponsible, as their behaviour will undoubtedly be imitated.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?</b>","options":["We are living in an age of celebrity culture.","Celebrities should act responsibly because they are role models whether they like it or not.","Less media coverage of celebrities would stop young people imitating their role models.","Parents should monitor what their children are being exposed to in the media.","Celebrities should not be regarded as role models."],"correct":1,"src":"CON","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знаменитости — примеры для подражания, хотят они того или нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, они должны вести себя ответственно. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посылка.</li><li>C, D — новые идеи.</li><li>E — противоречит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод объединяет «они влияют» и «отказ безответственен».</div></div>"},{"id":14,"text":"When you install a burglar alarm in your home, you do so presumably because the cost of the alarm is less than the expected benefits. The cost of a burglary, if one occurs, is likely to be much higher than the cost of fitting an alarm. A clearly visible box on an outside wall of an alarmed house alerts and discourages potential thieves. Because your house is less likely to be burgled, your neighbour's house may be more vulnerable. Therefore, while there may be little impact on overall crime levels, expensive security devices reduce crimes against those with the devices but increase crimes against those without.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>","options":["For similar houses, a higher percentage of those without intruder alarms are burgled than those with alarms.","As the percentage of houses with intruder alarms increased from 40% to 90%, house burglary rates fell by 60% and there was a rise in street muggings of 100%.","Burglars perceive an alarm as a signal that there are items well worth stealing in a house, while no alarm indicates less valuable contents.","Only 60% of houses with alarms set the alarm every day.","Burglars know that 25% of all visible alarm boxes are fakes, but cannot tell the fake from the genuine."],"correct":2,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: сигнализация защищает её хозяина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если воры видят в сигнализации знак ценностей — такие дома как раз грабят. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — усиливает.</li><li>B — про другие преступления.</li><li>D, E — частично.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что защита работает наоборот.</div></div>"},{"id":15,"text":"For the second year running the Silver Star Prize for art was awarded to a video artist, raising agair the big question: What is great art? Many have condemned this year's choice on the grounds that a documentary-style video film cannot be considered as creative art at all in the way that, say, painting and sculpture can. The Silver Star jury, however, praised the 'emotional force of the work and its complexity beneath an apparently simple surface'. If they are right in this evaluation then clearly video is as much a medium for great art as any other form of expression.<br><br><b>Which one of the following is an underlying assumption of the argument above?</b>","options":["Any work with emotional force and complexity is capable of being great art.","The decision of the jury to award the prize for a video was the right one.","No-one can really answer the question: What is great art?","This year's winning exhibit was deceptively simple.","Painting and sculpture are the highest forms of creative art."],"correct":0,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: если у работы есть эмоциональная сила и сложность, видео — это искусство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: всё, что обладает эмоциональной силой и сложностью, может быть великим искусством. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — автор говорит «если».</li><li>C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Связка «если X, то искусство» — скрытая.</div></div>"},{"id":16,"text":"Some say that religion is crucial for providing us with a moral framework, for giving clear strong moral guidance. Without religion, some say, people might lose their sense of morality altogether. But those who argue this ought to consider the Ancient Greeks. The Greeks pondered obsessively the question of what makes a good life and how to live well. In fact the word ‘ethics’ comes from them. And although they had their own set of gods, those gods were hardly moral role models (Zeus himself was a serial adulterer). Moreover, there was nothing by way of an agreed religious text from which to obtain their moral rules. There was even an atheist movement in Ancient Greece. The Greeks alone are proof that if we are to lose our faith in God, this does not mean we must also lose our faith in morality.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["Some Greek gods were capable of great and heroic deeds.","The Ancient Greeks took their moral guidance as much from poetry and drama as from religion.","Many Ancient Greeks questioned the value or purpose of being moral.","In many parts of the world faith in God is currently getting stronger.","Believers often disagree about how best to interpret their own religious text."],"correct":2,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: греки показывают, что мораль возможна без религии.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если многие греки сомневались в ценности морали — пример не так убедителен. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — про богов.</li><li>B — усиливает.</li><li>D, E — не связаны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабьте пример, на котором держится вывод.</div></div>"},{"id":17,"text":"In the UK, house prices have risen at far greater rates than inflation, fuelled by unprecedented levels of borrowing. Because of these high prices, owning their own home has become unaffordable for many people. Those who are able to 'own' their own home must do so burdened by a huge level of debt. Since the recent financial crisis can be attributed in part to those who were unable to meet the repayments on their debts, governments should attempt to tackle the problem at its root and take action to prevent a continued rise in house prices above the level of inflation.<br><br><b>Which one of the following, if true, most strengthens the above argument?</b>","options":["The gap between the average house price and average salary has continued to widen over the past five years.","House prices have fallen sharply and are no longer increasing at such dramatic rates.","Mortgage companies are more reluctant to lend money without substantial deposits.","There are few practical interventions that governments could make to lower house prices.","Many people are dependent on the value of their property increasing more than the value of their loan in order to pay off their mortgage."],"correct":0,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: правительство должно остановить рост цен выше инфляции.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если разрыв между ценами и зарплатами растёт — проблема становится серьёзнее. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — проблема уходит.</li><li>C — частично решает иначе.</li><li>D — ослабляет.</li><li>E — ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что проблема реальна и растёт.</div></div>"},{"id":18,"text":"Some recent films have been very expensive to make, but have not been the big box-office hits that would have justified the expense. At the same time, there have been films made very cheaply which have been received with both huge critical and popular acclaim. Indeed, some directors who have made successful low-budget films have gone on to make unsuccessful but expensive films. It is obvious then that if directors want to make popular films, they should stick to low budgets.<br><br><b>Which one of the following is the best statement of the flaw in the argument above?</b>","options":["Critics are often wrong in their predictions about the popularity of films.","The cost of making a film is normally greater than its original budget.","The cost of a film need not be the factor that determines its popularity.","The popularity of a film would justify a high level of expense in making it.","The public does not necessarily know whether a film has been expensive or cheap to make."],"correct":2,"src":"FLAW","topic":"FLAW","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: дешёвые фильмы популярнее.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но успех мог зависеть не от бюджета, а от других причин. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"},{"id":19,"text":"Socialist politicians are often taunted by their opponents for leading lifestyles similar to those of their capitalist counterparts. The theme of the taunts runs like this; 'You object on socialist principles to gross inequalities in the distribution of wealth; yet you enjoy a higher personal standard of living than the majority of the population. Therefore you are not really a socialist'. But the jibe can easily be answered, for there is no hypocrisy in arguing, even from a privileged position, for a fairer and more equal society.<br><br><b>Which of the following is a conclusion which can be reliably drawn from the passage as a whole?</b>","options":["Socialists who enjoy personal wealth cannot object to others who amass even greater wealth.","Someone can be a genuine socialist whilst enjoying a high standard of living.","Calls for reform are more effective if they come from the more privileged classes of society.","There is nothing immoral about inequalities in the distribution of wealth.","It is hypocritical to claim to be a socialist if one enjoys a standard of living above the average."],"correct":1,"src":"CON","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор отвечает на упрёк: нет лицемерия в том, чтобы бороться за равенство, будучи богатым.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, можно быть настоящим социалистом и жить хорошо. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — мнение оппонентов.</li><li>A, C, D — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод опровергает упрёк.</div></div>"},{"id":20,"text":"If drivers were made to pay for road use according to the amount of time they spent on the road, they would drive more dangerously. Experiments were conducted with volunteers using a driving simulator. In the first experiment, the volunteers were charged for time spent driving below 10mph in order to see how people coped with trying to avoid congestion. In the second experiment, they were charged for the time spent in a particular area. The results were alarming. The volunteers in the first experiment jumped many red lights in an attempt to keep their speed up. Those in the second frequently broke the speed limit, and overtook in dangerous situations. In the interests of road safety, we should not introduce such payment schemes.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>","options":["Driving simulators are a reliable guide to real-life driving.","We need to do more experiments on schemes of payment for road use.","More people should practise their driving skills using a simulator.","Schemes involving payment for road use will not solve the problem of road congestion.","Road congestion could be solved in ways other than payment for road-use schemes."],"correct":0,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод по реальным дорогам сделан из опытов на симуляторе.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: симулятор надёжно показывает реальное вождение. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перенос из эксперимента в жизнь — частое допущение.</div></div>"},{"id":21,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":0,"src":"CON","image":"images/q-e74a52dcf1.png","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Официальные цифры падают, но много аварий не регистрируют, а госпитализаций не меньше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, оптимизм по поводу безопасности может быть необоснован. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — слишком сильно.</li><li>C — не доказано.</li><li>D — противоречит.</li><li>E — рекомендация.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «May be» — безопасная формулировка.</div></div>"},{"id":22,"text":"The Eurovision Song Contest is coming in for increasing criticism. No matter how awful the song, Greece can always be relied on to give a maximum 12 points to Cyprus and Russia will vote for the Ukraine. In one year the political voting was so blatant that the commentator for the UK described it as 'ridiculous'. With more Eastern European countries competing, their power blocs are so strong that Western European countries have little hope of winning. The result of the Eurovision Song Contest is now determined by geo-politics and not by music.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>","options":["Britain nearly always gives high marks to the Irish song.","The Eastern European songs are usually sung in English.","Eastern European countries have shared tastes in music.","Western European countries have won 75% of contests in the past.","Poland has never won the Eurovision Song Contest."],"correct":2,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: голосуют по политике, а не за музыку. Ослабить — другая причина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если у соседних стран похожие музыкальные вкусы — они голосуют за песни, а не за политику. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — усиливает.</li><li>B, E — не связаны.</li><li>D — про прошлое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативное объяснение.</div></div>"},{"id":23,"text":"Success in modern America is very much measured by the quantity of material possessions one has. A lack of material possessions means one is judged to be unsuccessful. Those people with few material possessions therefore must feel a strong sense of failure.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>","options":["Most modern Americans are successful.","Success can be precisely measured.","Over-emphasis on material possessions creates social problems.","Excessive desire for material possessions is psychologically damaging.","People in America with few material possessions want to be seen as successful."],"correct":4,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: люди с небольшим имуществом должны чувствовать себя неудачниками.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если они хотят выглядеть успешными. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Чувство провала требует желания успеха.</div></div>"},{"id":24,"text":"The health service urgently needs more blood donors to meet demands on its ‘blood bank’ for transfusions. Most of us ignore this need, but we are only too glad to receive the blood of other donors in emergencies. To boost the blood bank, transfusions should only be given to those who have indicated they are donors or agree to become donors. In this fairer system, receiving and giving within the blood service would become clear in everyone’s mind and the blood bank given all the donations it needs.<br><br><b>Which one of the following, if true, weakens the above argument?</b>","options":["Some people are ineligible to give blood.","There is greater demand for certain blood types.","A high proportion of existing blood donors have themselves had blood transfusions.","Blood donations are at an all-time low.","Many people are wary of receiving blood because of infections."],"correct":0,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предложение: переливание только донорам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но некоторые не могут сдавать кровь по здоровью — это несправедливо к ним. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — не про систему.</li><li>C — усиливает.</li><li>E — не связано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, кого система несправедливо исключит.</div></div>"},{"id":25,"text":"Scientists at University College London investigating the effects of bedtime routine on child development asked children to complete a number of tests including basic number skills, reading out word cards, and constructing designs from flat or solid shapes. Although the hour that children went to bed had little or no effect on their performance, having no set bedtime often led to lower scores. The effect was most striking in three-year-olds, where boys and girls scored lower on reading, maths and spatial skills tests than children of the same age who kept to a more rigid schedule.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?</b>","options":["The more fixed the bedtime routine, the better the child’s intellectual development.","Irregular bedtimes may disrupt cognitive development in young children.","Parents ought to take more care when thinking about their children’s bedtime.","Reduced or disrupted sleep, especially if it occurs at key times in development, could have important impacts on health throughout life.","Varying a child’s bedtime routine is likely to lead to cognitive disorders."],"correct":1,"src":"CON","topic":"CON","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет режима сна — хуже результаты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод: нерегулярный сон может мешать развитию маленьких детей. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «чем строже, тем лучше» не следует.</li><li>C — рекомендация.</li><li>D — новое.</li><li>E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «May» — правильная степень уверенности.</div></div>"},{"id":26,"text":"The main reason private schools thrive in Britain is that they are extremely good at getting their students into elite universities. In the UK only 7% of students attend private schools but they account for 40% of students at Oxford and Cambridge. As entry to the top universities is dependent on examination results (particularly A-level results), private school students must be achieving higher grades than those in the state sector. Higher grades are the result of good teaching, so the teaching in private schools must be better than the teaching in state schools.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>","options":["A-levels are not the only exams that can be used for admission to Oxford or Cambridge.","Only people from wealthy families can go to private schools.","More than 40% of students at Oxford and Cambridge attended state schools.","A higher proportion of private school candidates take A-levels than those from the state sector.","Many private schools now accept scholarship students from poorer backgrounds."],"correct":3,"src":"EF","topic":"EF","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: больше мест в Оксфорде → выше оценки → лучше учителя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если ученики частных школ чаще сдают A-level — их больше в Оксфорде не из-за оценок. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — частично.</li><li>B, E — не про качество обучения.</li><li>C — неверно по числам.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите другую причину той же статистики.</div></div>"},{"id":27,"text":"Car owners must have insurance in case they have an accident. Similarly, home owners have insurance in case anyone on their property is injured and claims compensation. However, insurance is not required for dog owners. Any injury caused by a dog is compensated by taking the owner to court, which is not easy. A law must be passed to make insurance compulsory for every dog owner. Any injuries would be paid for by the insurance companies, not long-suffering taxpayers.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>","options":["Dog owners would find it hard to pay for insurance.","All insurance companies would want to participate in the scheme.","All dog owners would obey the law.","Most injuries are caused by illegal breeds of dog.","Injured parties can afford to take dog owners to court."],"correct":2,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: страховка у всех владельцев собак избавит налогоплательщиков от расходов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если все владельцы будут соблюдать закон. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ослабляет.</li><li>B — не нужно «все».</li><li>D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Закон помогает только тогда, когда его выполняют.</div></div>"},{"id":28,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":1,"src":"MC","image":"images/q-94c6ae37a9.png","topic":"MC","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — первая фраза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Приватизация тюрем неправильна. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — посылки.</li><li>E — промежуточный шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «…is nonetheless wrong» — вывод.</div></div>"},{"id":29,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":1,"src":"MC","image":"images/q-2d8d7a86ca.png","topic":"MC","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — рекомендация в конце.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нам стоит использовать иву для производства электричества. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посылка.</li><li>C, D, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «We should follow their example» — вывод.</div></div>"},{"id":30,"text":"In the 1920s and 1930s there were successes for extremist parties in elections across Europe. Several of these parties formed governments and were directly involved in starting the Second World War. In recent elections extremist parties were particularly successful at the expense of the more traditional parties. It is possible that this dangerous situation will get worse. Our schools must teach children about the link between extremist politics and war in order to reduce the likelihood of future wars.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>","options":["Events in history inevitably repeat themselves in the future.","It is not the job of parents to teach children about politics.","Teaching about the link between extremist politics and war will cause fewer people to vote for extremist parties.","Extremism is the main reason that countries go to war.","The recent election success of extremist parties will continue to grow."],"correct":2,"src":"ASM","topic":"ASM","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: обучение в школах снизит вероятность войны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если такое обучение уменьшит число голосующих за экстремистов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — слишком сильно.</li><li>B — не нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение связывает меру и результат.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
