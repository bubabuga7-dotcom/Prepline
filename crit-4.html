<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CT Тест 4 — Prepline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

ve been pilloried as sexist and out-of-touch. In it, John Lewis offers a politically incorrect view of modern womanhood: pair-bonding and breeding are significant milestones, they say, not making CEO of a company. Surprisingly however, figures show that the retailer has magnificently outperformed every single rival.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?<\/b>", "options": ["The British public will accept anything from John Lewis.", "Marketing that plays on our emotions is morally reprehensible.", "Marriage and motherhood suit women more than business achievement.", "The number of hits on YouTube is a good measure of success.", "In the right hands an appeal to sentiment can be a successful marketing tool."], "correct": 4, "src": "CON"}, {"id": 4, "text": "Young people are becoming ever more responsible. They are less likely to take drugs or drink than past generations. Very few have serious problems with alcohol or drugs. It is people in their forties who are most likely to be admitted to hospital for drinking-related problems. The latest figures on drug addiction show that 39% of heroin addicts are now over the age of forty, up from 19% in 2006. Fewer than ever are under the age of twenty-four. The number of young adults in prison is falling, but our overcrowded prisons are increasingly home to the older generation: between 2002 and 2013, the number of middle-aged men locked up increased by 130%. The same is true of suicide rates: on both sides of the Atlantic fewer young people but more middle-aged men are killing themselves.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?<\/b>", "options": ["Young people have far fewer health problems than older generations.", "Some social problems are increasingly the problems of middle-aged people.", "People who drink are more likely to engage in criminal activity.", "Drink, drugs and suicide are the biggest killers of middle-aged people.", "Young people are likely to develop harmful behaviors later in life."], "correct": 1, "src": "CON"}, {"id": 5, "text": "The most popular theory about the origin of the Moon is that it was formed from debris breaking off the Earth in a planetary collision 4.5 billion years ago. If this were true, the Moon would be made of the same material as is found on Earth. Examination of Moon rocks shows this to be the case, although there is little iron in Moon rocks. However, this can be explained because, according to the theory, the material that formed the Moon would have come from the Earth's crust, not its iron-rich core. Thus we should accept the theory as true.<br><br><b>Which one of the following identifies the flaw in the above argument?<\/b>", "options": ["The popularity of a theory is not what determines its truth.", "Evidence that is inconsistent with a theory proves that the theory is false.", "The explanation offered in the passage is not consistent with the theory.", "Evidence that confirms a theory's predictions does not prove that the theory is true.", "A theory that is not consistent with the facts should be rejected, not modified."], "correct": 3, "src": "FLAW"}, {"id": 6, "text": "\"I tried a speed reading course and read 'War and Peace' in three hours. It's about Russia.\" Woody Allen's joke strikes a chord with many who doubt the effectiveness of speed reading techniques. These techniques usually involve moving your finger smoothly and quickly along lines of text and training your eyes to follow, so preventing your eyes going back over words you have already read, which is what we normally do. There have been reports of readers achieving incredible speeds using these techniques, but such achievements are of limited benefit to many readers, particularly students, who have to gain a deep understanding of what they read.<br><br><b>Which of the following, if true, would weaken the above argument?<\/b>", "options": ["For many tasks a student has to do, speed reading can lead to a superficial understanding.", "Speed reading techniques are more difficult to acquire the older you are.", "A student, after reading the argument, commented, \"I find I understand what I am reading better if I read quickly.\"", "A student, after reading the argument, commented, \"I use speed reading for easy texts. I have to read slowly if the content is difficult.\"", "Speed readers have found they have difficulty in reading for pleasure (for example when reading novels or magazines)."], "correct": 2, "src": "EF"}, {"id": 7, "text": "A study of shooting victims in Philadelphia has found that people who carry guns are far more likely to be shot than those who are unarmed. Researchers at the University of Pennsylvania looked at 677 shootings over two and a half years, taking into account various factors such as the age and socioeconomic status of those involved. The researchers concluded that armed citizens were 4.5 times more likely to get shot and 4.2 times more likely to get killed than those who were unarmed. Therefore, it is significantly safer not to carry a gun in Philadelphia.<br><br><b>Which one of the following, if true, most weakens the above argument?<\/b>", "options": ["Some of those shot were carrying concealed weapons.", "People carrying guns have a sense of empowerment.", "People who are at risk of getting shot are more likely to carry a gun.", "People carrying guns are likely to overreact in potentially violent situations.", "The bearing of arms is protected by the Second Amendment of the US Constitution."], "correct": 2, "src": "EF"}, {"id": 8, "text": "When preparing for examinations, it is important that students do not suppress any emotional or other problems they might be having during their course of study. A good way of revealing problems is the creation of a partnership and a discussion between students, parents and teachers. This is far preferable to the problems only becoming apparent with the arrival of the results causing upset and disappointment for all concerned. Therefore, if schools and colleges create as many opportunities as possible for three-way meetings between students, parents and teachers, they will make a valuable contribution to their students' achievements in examinations.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["Other factors besides emotional problems are not important in determining examination success.", "The three parties involved are able to exchange views constructively when they meet.", "Students often do not communicate as well with their parents as they do with teachers.", "The problems revealed by the three-way discussion can always be solved.", "Emotional factors are just as important for students' success as their academic ability."], "correct": 1, "src": "ASM"}, {"id": 9, "text": "Powdered rhinoceros horn has often been claimed to have aphrodisiac properties. However, a recent investigation showed no evidence that it has any chemical effect whatsoever on the human nervous system. What is more, in an experiment in which 100 people were given powdered rhinoceros horn and another 100 people were given powdered rice, without knowing what they were taking, more of those taking the rice indicated that they felt an increase in sexual arousal than did those taking the rhinoceros horn. This demonstrates conclusively that rhinoceros horn is not an aphrodisiac.<br><br><b>Which one of the above is an underlying assumption of the argument in the passage?<\/b>", "options": ["Powdered rice does not have significant aphrodisiac properties.", "Claims made about aphrodisiacs are in general untrustworthy.", "Powdered rice has no effect on the human nervous system.", "The claims about its aphrodisiac properties are spread to create a demand for rhinoceros horn.", "A ban on the trade in rhinoceros horn should be enforced worldwide."], "correct": 0, "src": "ASM"}, {"id": 10, "text": "We live in an information-rich world where communication is quicker and easier than ever before. We don’t have to wait for journalists and photographers to report news to us. Anyone can talk about or take photographs of significant events and share them immediately. Traditional ways of reporting meant that news could be effectively censored, but this is no longer the case. Similarly, incorrect information cannot be removed from the public domain without great difficulty. Governments and the traditional media will therefore need to find new ways to cope with these challenges and adapt to new technology.<br><br><b>Which one of the following, if true, most strengthens the above argument?<\/b>", "options": ["Some governments have successfully restricted the information available on the internet in their countries.", "Journalists occasionally film material on their mobile phones.", "Information can be posted anonymously on the internet, thus avoiding possible prosecution.", "Legal proceedings have been brought against those publishing false and incriminating material on the internet.", "In the past, individuals often took photographs that they then sold to the press."], "correct": 2, "src": "EF"}, {"id": 11, "text": "The battery life of laptop computers means that they cannot be used for the duration of a long haul flight without needing to be recharged from an onboard power point. Not all aeroplanes have this facility. Therefore, laptop computers should not be allowed as carry on items for long haul flights on planes that do not have onboard power points, regardless of whether they are intended for personal or business use, as they will be of limited use to their owners and take up a disproportionate amount of space in the cabin.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?<\/b>", "options": ["Some companies expect their employees to work on long haul flights.", "There is no chance of a laptop becoming damaged if it is stored in a suitcase in the hold.", "A laptop may run out of battery on a short haul flight, too.", "The passenger cannot choose whether or not they book a flight with an onboard power point.", "Passengers could make some use of their laptop even if the battery does run out."], "correct": 4, "src": "FLAW"}, {"id": 12, "text": "The effect of shortening degree courses at universities from three years to two would be that students would have two-thirds as much time to think about their subject. The result would be graduates whose understanding of their subject was shallower and whose intellectual development was much less extended. Any measure that leads to a lowering of the quality of graduates should be resisted by universities.<br><br><b>Which one of the following conclusions can reliably be drawn from the above passage?<\/b>", "options": ["University graduates at present have an in-depth understanding of their subject.", "Universities should oppose the shortening of degree courses to two years.", "Universities are not proposing to reduce the length of degree courses to two years.", "Students should oppose moves by universities to shorten degree courses.", "Universities should adopt more rigorous standards for the award of degrees."], "correct": 1, "src": "CON"}, {"id": 13, "text": "In today's 24/7 media environment, public figures have the ability to influence the behaviour of millions of young people, for better and for worse. There are celebrities who don’t give in to social pressures and are in the news because of good deeds which have a positive influence on young people, such as giving to charity. However, there are others who glamorise destructive behaviour such as drinking, smoking, swearing and sexual promiscuity, giving young people the impression that this is socially acceptable or even desirable. Although many celebrities maintain that they do not wish to be regarded as role models, it seems that this attitude is not only unrealistic but also irresponsible, as their behaviour will undoubtedly be imitated.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?<\/b>", "options": ["We are living in an age of celebrity culture.", "Celebrities should act responsibly because they are role models whether they like it or not.", "Less media coverage of celebrities would stop young people imitating their role models.", "Parents should monitor what their children are being exposed to in the media.", "Celebrities should not be regarded as role models."], "correct": 4, "src": "CON"}, {"id": 14, "text": "When you install a burglar alarm in your home, you do so presumably because the cost of the alarm is less than the expected benefits. The cost of a burglary, if one occurs, is likely to be much higher than the cost of fitting an alarm. A clearly visible box on an outside wall of an alarmed house alerts and discourages potential thieves. Because your house is less likely to be burgled, your neighbour's house may be more vulnerable. Therefore, while there may be little impact on overall crime levels, expensive security devices reduce crimes against those with the devices but increase crimes against those without.<br><br><b>Which one of the following, if true, would most weaken the above argument?<\/b>", "options": ["For similar houses, a higher percentage of those without intruder alarms are burgled than those with alarms.", "As the percentage of houses with intruder alarms increased from 40% to 90%, house burglary rates fell by 60% and there was a rise in street muggings of 100%.", "Burglars perceive an alarm as a signal that there are items well worth stealing in a house, while no alarm indicates less valuable contents.", "Only 60% of houses with alarms set the alarm every day.", "Burglars know that 25% of all visible alarm boxes are fakes, but cannot tell the fake from the genuine."], "correct": 2, "src": "EF"}, {"id": 15, "text": "For the second year running the Silver Star Prize for art was awarded to a video artist, raising agair the big question: What is great art? Many have condemned this year's choice on the grounds that a documentary-style video film cannot be considered as creative art at all in the way that, say, painting and sculpture can. The Silver Star jury, however, praised the 'emotional force of the work and its complexity beneath an apparently simple surface'. If they are right in this evaluation then clearly video is as much a medium for great art as any other form of expression.<br><br><b>Which one of the following is an underlying assumption of the argument above?<\/b>", "options": ["Any work with emotional force and complexity is capable of being great art.", "The decision of the jury to award the prize for a video was the right one.", "No-one can really answer the question: What is great art?", "This year's winning exhibit was deceptively simple.", "Painting and sculpture are the highest forms of creative art."], "correct": 0, "src": "ASM"}, {"id": 16, "text": "Some say that religion is crucial for providing us with a moral framework, for giving clear strong moral guidance. Without religion, some say, people might lose their sense of morality altogether. But those who argue this ought to consider the Ancient Greeks. The Greeks pondered obsessively the question of what makes a good life and how to live well. In fact the word ‘ethics’ comes from them. And although they had their own set of gods, those gods were hardly moral role models (Zeus himself was a serial adulterer). Moreover, there was nothing by way of an agreed religious text from which to obtain their moral rules. There was even an atheist movement in Ancient Greece. The Greeks alone are proof that if we are to lose our faith in God, this does not mean we must also lose our faith in morality.<br><br><b>Which one of the following, if true, most weakens the above argument?<\/b>", "options": ["Some Greek gods were capable of great and heroic deeds.", "The Ancient Greeks took their moral guidance as much from poetry and drama as from religion.", "Many Ancient Greeks questioned the value or purpose of being moral.", "In many parts of the world faith in God is currently getting stronger.", "Believers often disagree about how best to interpret their own religious text."], "correct": 2, "src": "EF"}, {"id": 17, "text": "In the UK, house prices have risen at far greater rates than inflation, fuelled by unprecedented levels of borrowing. Because of these high prices, owning their own home has become unaffordable for many people. Those who are able to 'own' their own home must do so burdened by a huge level of debt. Since the recent financial crisis can be attributed in part to those who were unable to meet the repayments on their debts, governments should attempt to tackle the problem at its root and take action to prevent a continued rise in house prices above the level of inflation.<br><br><b>Which one of the following, if true, most strengthens the above argument?<\/b>", "options": ["The gap between the average house price and average salary has continued to widen over the past five years.", "House prices have fallen sharply and are no longer increasing at such dramatic rates.", "Mortgage companies are more reluctant to lend money without substantial deposits.", "There are few practical interventions that governments could make to lower house prices.", "Many people are dependent on the value of their property increasing more than the value of their loan in order to pay off their mortgage."], "correct": 0, "src": "EF"}, {"id": 18, "text": "Some recent films have been very expensive to make, but have not been the big box-office hits that would have justified the expense. At the same time, there have been films made very cheaply which have been received with both huge critical and popular acclaim. Indeed, some directors who have made successful low-budget films have gone on to make unsuccessful but expensive films. It is obvious then that if directors want to make popular films, they should stick to low budgets.<br><br><b>Which one of the following is the best statement of the flaw in the argument above?<\/b>", "options": ["Critics are often wrong in their predictions about the popularity of films.", "The cost of making a film is normally greater than its original budget.", "The cost of a film need not be the factor that determines its popularity.", "The popularity of a film would justify a high level of expense in making it.", "The public does not necessarily know whether a film has been expensive or cheap to make."], "correct": 2, "src": "FLAW"}, {"id": 19, "text": "Socialist politicians are often taunted by their opponents for leading lifestyles similar to those of their capitalist counterparts. The theme of the taunts runs like this; 'You object on socialist principles to gross inequalities in the distribution of wealth; yet you enjoy a higher personal standard of living than the majority of the population. Therefore you are not really a socialist'. But the jibe can easily be answered, for there is no hypocrisy in arguing, even from a privileged position, for a fairer and more equal society.<br><br><b>Which of the following is a conclusion which can be reliably drawn from the passage as a whole?<\/b>", "options": ["Socialists who enjoy personal wealth cannot object to others who amass even greater wealth.", "Someone can be a genuine socialist whilst enjoying a high standard of living.", "Calls for reform are more effective if they come from the more privileged classes of society.", "There is nothing immoral about inequalities in the distribution of wealth.", "It is hypocritical to claim to be a socialist if one enjoys a standard of living above the average."], "correct": 1, "src": "CON"}, {"id": 20, "text": "If drivers were made to pay for road use according to the amount of time they spent on the road, they would drive more dangerously. Experiments were conducted with volunteers using a driving simulator. In the first experiment, the volunteers were charged for time spent driving below 10mph in order to see how people coped with trying to avoid congestion. In the second experiment, they were charged for the time spent in a particular area. The results were alarming. The volunteers in the first experiment jumped many red lights in an attempt to keep their speed up. Those in the second frequently broke the speed limit, and overtook in dangerous situations. In the interests of road safety, we should not introduce such payment schemes.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["Driving simulators are a reliable guide to real-life driving.", "We need to do more experiments on schemes of payment for road use.", "More people should practise their driving skills using a simulator.", "Schemes involving payment for road use will not solve the problem of road congestion.", "Road congestion could be solved in ways other than payment for road-use schemes."], "correct": 0, "src": "ASM"}, {"id": 21, "text": "<b>Выбери ответ по изображению выше:<\/b>", "options": ["A", "B", "C", "D", "E"], "correct": 0, "src": "CON", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABC4AAAJGBAMAAABmdtmYAAAAGFBMVEX///////7+//7t7e2kpKRUVVMmJyUFBgVvfbKuAAC94klEQVR42uz925Mcx5UnDP7co0gAGqLSPRKgBDaJ8ohISCP2AMyMSFA732c2TVQWxdcZXrbfV5qe97XW90/smu27Wuo/oCloZm0f1j6qqghJM60FURkZvOiCZsalAIooSJURngUJBU4j3PfBI29VWQBIgRI1ymNGFjLC/fg5x0/4/ecHWNCCFrSgBS1oQQta0IIWtKAFLWhBC3oUsvw/WcnAxf/9678E0Oh8Jf0DGFH/1tKrd+XUE29l51NL8/qTO49ZQerf+jwZvnw2ezxsL/5vvzj0rNFxy52q0GPygUkft6UpQFwHAGyX/SEFuS0QZ6bk4DPwsx+747utz5WhzR4TWyLmFOVMCs0enPTTW/rBglMAgADAH3M5n0n6/LH7xWOruPkMC/k5NuZk0JWfkxYPoyUAmjDAYhJ/ctJd9Wc2Auh/ngKzovun0osC0HsMwLIEYK2tNQEX7TUBVwCg5qtvr3UAKhodoLHWpIK6AFwA1po/xerGWmecetyfrHUAk16M0tNRuuYoAay1joBKbrgwKa211QkD6gJod0Qljgs01pqVQC7aHYC6dK0z4SsAV1hrzVFjCFeYh3StOUplra1SFxTtJmjbsLPWmrAqC3SA9iEpR4qaZwCyrEqLKqO11jSijow5SjvO4lprYsSuSmKtvTRtrcoaAhCVMoDrYlIdVfr22qqxLFzAG/EHnZLb gnore this need, but we are only too glad to receive the blood of other donors in emergencies. To boost the blood bank, transfusions should only be given to those who have indicated they are donors or agree to become donors. In this fairer system, receiving and giving within the blood service would become clear in everyone’s mind and the blood bank given all the donations it needs.<br><br><b>Which one of the following, if true, weakens the above argument?<\/b>", "options": ["Some people are ineligible to give blood.", "There is greater demand for certain blood types.", "A high proportion of existing blood donors have themselves had blood transfusions.", "Blood donations are at an all-time low.", "Many people are wary of receiving blood because of infections."], "correct": 0, "src": "EF"}, {"id": 25, "text": "Scientists at University College London investigating the effects of bedtime routine on child development asked children to complete a number of tests including basic number skills, reading out word cards, and constructing designs from flat or solid shapes. Although the hour that children went to bed had little or no effect on their performance, having no set bedtime often led to lower scores. The effect was most striking in three-year-olds, where boys and girls scored lower on reading, maths and spatial skills tests than children of the same age who kept to a more rigid schedule.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?<\/b>", "options": ["The more fixed the bedtime routine, the better the child’s intellectual development.", "Irregular bedtimes may disrupt cognitive development in young children.", "Parents ought to take more care when thinking about their children’s bedtime.", "Reduced or disrupted sleep, especially if it occurs at key times in development, could have important impacts on health throughout life.", "Varying a child’s bedtime routine is likely to lead to cognitive disorders."], "correct": 1, "src": "CON"}, {"id": 26, "text": "The main reason private schools thrive in Britain is that they are extremely good at getting their students into elite universities. In the UK only 7% of students attend private schools but they account for 40% of students at Oxford and Cambridge. As entry to the top universities is dependent on examination results (particularly A-level results), private school students must be achieving higher grades than those in the state sector. Higher grades are the result of good teaching, so the teaching in private schools must be better than the teaching in state schools.<br><br><b>Which one of the following, if true, would most weaken the above argument?<\/b>", "options": ["A-levels are not the only exams that can be used for admission to Oxford or Cambridge.", "Only people from wealthy families can go to private schools.", "More than 40% of students at Oxford and Cambridge attended state schools.", "A higher proportion of private school candidates take A-levels than those from the state sector.", "Many private schools now accept scholarship students from poorer backgrounds."], "correct": 3, "src": "EF"}, {"id": 27, "text": "Car owners must have insurance in case they have an accident. Similarly, home owners have insurance in case anyone on their property is injured and claims compensation. However, insurance is not required for dog owners. Any injury caused by a dog is compensated by taking the owner to court, which is not easy. A law must be passed to make insurance compulsory for every dog owner. Any injuries would be paid for by the insurance companies, not long-suffering taxpayers.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["Dog owners would find it hard to pay for insurance.", "All insurance companies would want to participate in the scheme.", "All dog owners would obey the law.", "Most injuries are caused by illegal breeds of dog.", "Injured parties can afford to take dog owners to court."], "correct": 2, "src": "ASM"}, {"id": 28, "text": "<b>Выбери ответ по изображению выше:<\/b>", "options": ["A", "B", "C", "D", "E"], "correct": 1, "src": "MC", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAI2BAMAAACrkUDgAAAAGFBMVEX////7+/vr6+uys7JjZGMzNDIUFBMGBwVQvKR+AADIhUlEQVR42uz9fXMcN5YnjP6QlFuUbTEBpKZtyjIrE0n32pRtsSopz27b/WK9zNxnZm7sTHe7N56I+9duPPsJ9vkY9wvs7N4PMO3e3efPZ0TKPXEjZu+2mVWUJ1qetpnILLpHpNsqAFmyTfqFifsHMuuFpN5sd7c9wxOhEKsKODg4OIkEDvA7BzimYzqmYzqmYzqmYzqmYzqmY/qm0gwAECHmZ809SgnfPCzjL1Dl7vWJ8EuhJ34lbI8/ebgBflac+jLtEvppZPcOfnmPrrDZvbsyY3sP2Tp/4qFFv1cVMqUxAITu3bf/kyVqDXsAiFi5cqUT3aNqTB9a21+gyhQFy5Oix6GXTKkmAu8crpNcuXL5SzRMOtRLwkPfxuHdKnji7o3d67e7qKz98Fq+R5VpjQFEsPs+l1NGwB1zDwCJ/bR35h4mQvjDq937kiYy3R1v+gsiKBg9/Ni0B2l5T1u/j8wCOMIc+N0Vc4+2ePTwcxi+0irsoHroA/R/sj4dmQgLU5n1RPiVvsFum6+UHWx6wGSOGJRO1pXplvjijTysCsg9KrCH1udg43eoscMmc5SNHPXlCQBsThUY/oB+pQJK+xWbiLz/8mXulxIk+H5YfDPXhWrw+9bYA9EJAEQbQJUERERKGi9UBqLqR0b4MgcRYdMWF77Mm/+8NhvkhvvDtpIGpDP61I0j1QWrjGNHEqqkAeCFRvipJ/zUgAuq5DBUBpxKgER1kzp2TUYDAAgimxkI01EAmAYR0SA3ABh9PAKCtpKmEQogXPUAK39AXUfKqCpAImWCtpKGROWyJNaLBj0IHfuySOqmlDScGmGzMgK/g1psAKQWBwARkZW5FxrhZ8WoSRKCF6Pi4L7jbnNwWgAcBhDWC2UhwlFbXlguZ/2DlTjlVeE3bbsGat0S3tZSA4CoCvC5QrheII5UPSpdDQG+3wM4NaKSxgtJ2GUmUgYkUqWIrMwjSsJipK1aGsLbOjPEjXVIPwuHflDJYZs5RTc7mmBZGgDaxCtLwub8z28ZcvWjD/798PLZk29j8Yp44tOPCgB85btnT+4a7/zls0/ocuXy2UjvnFs+0xFqhyRXmk/R+4udaHfnpdNFvLIk9E5y+WykdwB4P/708ln72OV5mwcr3z0b6U//nx/t4Km/urkH70q1g5eefvcKScQT2gSvLNHykX8MrnQE9CdXWeIP99/7SUqSv6hZvfBv+BPvP/F4R6gd8vzls09qA8BLflMA2JvdNotXRGTev+jnmPnxx59dWYqhP/vxo8nJ03RFhNvmKjsvTn76sji5vbd4RURm+6lXH/uusFtXmNC0+9grSzH0HuBdIZfPntz+5PxH/eQVcfbk9qf/fnj57Ozb3vOXzj67bYCZnzwa3QpWloTNAeDFf3VuierymX/1Ns791a///NFnpQG5yFbEE8Mr4om8biv43090doevLAmr9wC88Oy5pXDbvPhs/OydlzYWrwhhc/L85bPP7u688OziUqR3gitLwt/eA8jVbxV44eJbF/0VEW6b4JWlqJzb4Be/e9bf/uQiezn8e+Cpv5r5rrD5mf/tzHPmld6Vagdn/vc8fkWcPfn+9+bjj7aev3T2SWUAkPiKqJlDf/aTvctnT+5+59mnvnXiufi5fPHy2UjvPPVEr5lFtBeT3KYgwVzqdeSd5sUUpt6FcEvsp5y9DwA8TEn let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Вопрос ${state.idx+1} из ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img src="${q.image}" class="question-img" alt="Рисунок к вопросу">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Назад</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Завершить тест</button>'
        : '<button class="nav-btn" id="next">Далее &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: история результатов (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // первая попытка — истории ещё нет
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">История попыток &middot; лучший результат ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Итог</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Процент</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Не отвечено</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Твой ответ: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Правильный: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Пройти ещё раз</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline × Supabase: авторизация + облачное сохранение ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: перехватываем saveAttempt — localStorage остаётся, добавляем облако */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: saveAttempt нет, оборачиваем finish */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>
