<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q2 · Problem solving</p>", "image": "images/ct-pp/ct038_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Статья противопоставляет «дом с одной акушеркой» и «палату с экспертами».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Так подразумевается, что сильное обезболивание и вмешательство есть только в родильном отделении. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные занимают позицию, которой в тексте нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите, что следует из самой подачи.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct038_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3}, {"id": 4, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q4 · Main conclusion</p>", "image": "images/ct-pp/ct038_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Малая вероятность против высокой стоимости.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Для недавнего снега меры стоили бы слишком дорого: правительство право, что не тратилось. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — доводы или слишком широко.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод — оценка конкретного решения.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct038_q05.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В апреле 3 пары близнецов (6 детей).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Остальные 11 месяцев: 2 пары близнецов закрывают 2 месяца, ещё минимум 9 одиночек.</li><li>Минимум 6 + 4 + 9 = 19.</li><li>Внучек вдвое больше внуков → общее кратно 3 → 21. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>19, 20 — не кратны 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте последнее условие.</div></div>"}, {"id": 6, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q6 · Weaken</p>", "image": "images/ct-pp/ct038_q06.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 6, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: кампании могут быть причиной малого числа смертей.</li><li>2: 100 смертей в верховой езде приняты как норма без доводов.</li><li>3: смерти надо сравнивать на одного пользователя.</li><li>Все три — слабости. Ответ G.</li></ol><div class=\"ex-a\">Ответ: <b>G</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пропускают пункты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Количество» без учёта числа пользователей — ловушка.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct038_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Gold = Silver, когда 100 + 0,5n = 80 + n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 40 прокатов.</li><li>Bronze: 70 + 3 · 40 = 190 £; <span class=\"fr\"><span>Gold</span><span>Silver</span></span>: 120 £.</li><li>Экономия 70 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала найдите n из равенства.</div></div>"}, {"id": 8, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q8 · Assumption</p>", "image": "images/ct-pp/ct038_q08.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из 421 несообщивших 133 считали преступление неважным.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>133 : 421 ≈ 0,32 — между 0,25 и 0,33. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот диапазон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знаменатель — только несообщившие.</div></div>"}, {"id": 9, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q9 · Drawing a conclusion</p>", "image": "images/ct-pp/ct038_q09.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 6, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждый вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: не сообщили 38% → шанс ниже 50%.</li><li>2: недовольство считали только среди сообщивших.</li><li>3: 224 + 324 = 548 укладывается в 698 без двойных причин.</li><li>Ни один не следует. Ответ G.</li></ol><div class=\"ex-a\">Ответ: <b>G</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — принимают ложный пункт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Следите за группой, по которой считают.</div></div>"}, {"id": 10, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q10 · Drawing a conclusion</p>", "image": "images/ct-pp/ct038_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">215 из 421 не доверяют полиции.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Лучше всего объясняется прошлыми провалами с заявлениями. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — опрос про них ничего не говорит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Объяснение должно опираться на данные.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q11 · Problem solving</p>", "image": "images/ct-pp/ct038_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем фигуры дважды пополам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Большой прямоугольный равнобедренный треугольник D → меньший такой же → нужная фигура. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие не дают треугольник за два сгиба.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сгиб пополам сохраняет форму у равнобедренного прямоугольного треугольника.</div></div>"}, {"id": 12, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q12 · Weaken</p>", "image": "images/ct-pp/ct038_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: строгое лицензирование, чтобы защитить от незнания.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: вводятся понятные предупреждения → проблема решается без контроля, как у лекарств. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не дают альтернативу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабить = показать другой путь к той же цели.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q13 · Problem solving</p>", "image": "images/ct-pp/ct038_q13.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В каждом мешке шариков столько же, сколько было.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в правом был один цвет и шариков больше двух — после обмена максимум один другого цвета.</li><li>Половина зелёных, половина красных невозможна → 2 и 4 вместе не могут быть верны. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пропускают это противоречие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обмен 1 на 1 меняет максимум один шарик.</div></div>"}, {"id": 14, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q14 · Assumption</p>", "image": "images/ct-pp/ct038_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цвета успокаивают подозреваемых, чтобы улучшить допрос.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: спокойные люди рассказывают больше. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Звено: «спокойнее» → «больше информации».</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q15 · Problem solving</p>", "image": "images/ct-pp/ct038_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct038_q18.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Золото : все медали.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Китай 0,51; Великобритания ≈ 0,40; США ≈ 0,33; Россия ≈ 0,32.</li><li>Великобритания — 2-я. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — по общему числу медалей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте долю, а не количество.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct038_q19.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 5, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Взвешенные очки: Норвегия ≈ 21, Исландия ≈ 2, Словения 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: 3 золота + 5 серебра = 19 + 2 бронзы = 21 ✔.</li><li>2: 3 медали дают минимум 3 ✘.</li><li>3: 3 + 2 + 4 = 9 ✔.</li><li>Ответ F (1 и 3).</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте каждый пункт по очкам.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct038_q20.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Очки на миллион жителей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Великобритания ≈ 1,6, Словения 4,5, США ≈ 0,7 → между ними ✔.</li><li>Россия ≈ 0,98 < 1 ✔.</li><li>Оба верны. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пропускают один пункт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на население в миллионах.</div></div>"}, {"id": 22, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q22 · Assumption</p>", "image": "images/ct-pp/ct038_q22.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Похвала ценна, если заслужена и получатель это знает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужно: получатель оценивает, что заслужил (1), и дающий знает правильную меру (2). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — лишние пункты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение нужно обеим сторонам.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q23 · Problem solving</p>", "image": "images/ct-pp/ct038_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первые 3 цифры — месяц (июнь 1983 = 001), потом день.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Месяц 294 — ноябрь 2007, в нём 30 дней.</li><li>31 число невозможно. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Июль 2004, май 2005, март 2006, январь 2007 — по 31 дню.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте месяцы от точки отсчёта.</div></div>"}, {"id": 24, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q24 · Drawing a conclusion</p>", "image": "images/ct-pp/ct038_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждый вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: о непьющих ничего не известно.</li><li>2: нет доказательства, что алкоголь — причина.</li><li>3: 40% беременных до 16, а не всех девушек.</li><li>Ни один. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — принимают ложный пункт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент от какой группы?</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct038_q25.webp", "options": ["A", "B", "C", "D"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точки (прогулы; % 5 A*–C).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>St Cuthbert's (6,6; 70), Greendale (7,4; 76), Casterford (8,3; 56), Shelley (8,8; 18), Castle (9,1; 40).</li><li>Самая высокая — вторая слева, самая низкая — четвёртая. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не тот порядок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите максимум и минимум.</div></div>"}, {"id": 26, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q26 · Drawing a conclusion</p>", "image": "images/ct-pp/ct038_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Бабочка выживает, подражая звукам муравьёв.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, звуки колонии могут помогать выживанию некоторых видов. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные выходят за текст.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод «can» обычно верный.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q27 · Problem solving</p>", "image": "images/ct-pp/ct038_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пусть обед стоит c жетонов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тим впервые не может на 7-й рабочий день: 20 + 5(7 − c) ≥ c, 20 + 6(7 − c) < c → c = 9.</li><li>Дальше: 15→13→11→9→7, 7 < 9.</li><li>Это 12-й рабочий день — вторник. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка счёта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала найдите цену обеда.</div></div>"}, {"id": 28, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q28 · Flaw</p>", "image": "images/ct-pp/ct038_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Планеты в зоне жизни — условия, а не жизнь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Аргумент считает такие планеты достаточными для жизни. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Необходимое ≠ достаточное.</div></div>"}, {"id": 29, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q29 · Problem solving</p>", "image": "images/ct-pp/ct038_q29.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3}, {"id": 30, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q30 · Main conclusion</p>", "image": "images/ct-pp/ct038_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Систематические исследования надёжнее бытовых объяснений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бытовые объяснения реже бывают верными. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — слишком сильно.</li><li>B, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнительный вывод, а не абсолютный.</div></div>"}, {"id": 31, "topic": "FLAW", "text": "Everyone who wins the national maths olympiad practises for at least two hours a day. Bota practises for at least two hours a day, so she will win the olympiad.<br><br><b>Which one of the following best describes the flaw in the above argument?</b>", "image": "", "options": ["It assumes that what is needed to win is enough to guarantee winning.", "It generalises from a single example.", "It attacks Bota rather than her ideas.", "It relies on the opinion of an expert.", "It assumes that practising for more than two hours a day is harmful."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Победитель → тренируется 2 часа. Обратное не следует.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тренировка — необходимое условие, а не достаточное. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — обобщения по одному случаю нет.</li><li>C, D, E — этого в тексте нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Классическая ошибка: путать необходимое и достаточное.</div></div>", "src": "PL"}, {"id": 32, "topic": "PS", "text": "A clock gains 3 minutes every hour. It is set to the correct time at 9:00 am.<br><br><b>What time does the clock show when the correct time is 5:00 pm on the same day?</b>", "image": "", "options": ["5:08 pm", "5:21 pm", "5:24 pm", "5:27 pm", "5:32 pm"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">С 9:00 до 17:00 — 8 часов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 · 3 = 24 минуты вперёд → 17:24. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 7 часов.</li><li>D — 9 часов.</li><li>A — 8 минут вместо 8·3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте точно интервал.</div></div>", "src": "PL"}, {"id": 33, "topic": "MC", "text": "Some people say that because electric cars produce no exhaust, switching to them will solve the city's air pollution problem. But much of the dust in city air comes from tyres and brakes wearing down, and electric cars, being heavier, wear their tyres faster. Electric cars will help, but on their own they will not make the city's air clean.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "image": "", "options": ["Electric cars produce no exhaust.", "Switching to electric cars will not on its own make the city's air clean.", "Electric cars wear their tyres faster than other cars.", "The city should reduce the number of cars on its roads.", "Much of the dust in city air comes from tyres and brakes."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор спорит с мнением «электромобили решат проблему».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пыль от шин и тормозов — довод, последний тезис — вывод. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — чужая позиция.</li><li>C, E — доводы.</li><li>D — в тексте не предлагается.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Главный вывод часто стоит после «But» и опровергает чужое мнение.</div></div>", "src": "PL"}, {"id": 34, "topic": "PS", "text": "Five friends — Arman, Bota, Chingis, Dana and Erlan — sit in a row of five seats. Chingis sits at the left-hand end. Arman does not sit at either end and does not sit next to Chingis. Dana sits immediately to the right of Arman. Bota sits next to Erlan.<br><br><b>Who sits at the right-hand end?</b>", "image": "", "options": ["Arman", "Bota", "Chingis", "Dana", "Erlan"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Места 1–5, Чингис на 1. Арман не на краю и не рядом с Чингисом → место 3 или 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Арман 3 → Дана 4, свободны 2 и 5 — Бота и Ерлан не рядом. Не подходит.</li><li>Арман 4 → Дана 5, Бота и Ерлан на 2 и 3 — рядом. Справа Дана. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — у края только при Армане на 2, но он не может сидеть рядом с Чингисом.</li><li>A — не на краю по условию.</li><li>C — слева.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебирайте позицию самого ограниченного человека.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
