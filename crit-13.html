<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<script>
const questions = [{"id":1,"text":"<p>The table below shows 'audience numbers' and 'time per visit' for a number of popular social networking sites. A comparison of figures for the month of February is shown for two consecutive years.</p><table class=\"q-table\"><thead><tr><th>Site</th><th>Audience (000's) February 2008</th><th>Time per visit (hr:min:sec) February 2008</th><th>Audience (000's) February 2007</th><th>Time per visit (hr:min:sec) February 2007</th></tr></thead><tbody><tr><td>myspace.com</td><td>55 419</td><td>2:12:19</td><td>53 362</td><td>2:00:24</td></tr><tr><td>Facebook</td><td>20 043</td><td>1:06:43</td><td>9 923</td><td>1:04:54</td></tr><tr><td>LinkedIn</td><td>7 392</td><td>0:10:31</td><td>1 990</td><td>0:05:10</td></tr><tr><td>Flixster</td><td>2 619</td><td>0:07:38</td><td>1 591</td><td>0:12:28</td></tr><tr><td>Reunion.com</td><td>4 323</td><td>0:04:34</td><td>4 348</td><td>0:04:49</td></tr><tr><td>Meetup.com</td><td>1 940</td><td>0:12:16</td><td>1 215</td><td>0:07:07</td></tr><tr><td>Last.fm</td><td>1 938</td><td>0:06:43</td><td>1 508</td><td>0:02:24</td></tr><tr><td>myYearbook</td><td>1 738</td><td>0:07:02</td><td>2 368</td><td>0:09:04</td></tr></tbody></table><p>How many sites had an increase in both 'audience numbers' and 'time per visit' from 2007 to 2008?</p>","image":"","options":["1","2","3","5","6"],"correct":3,"src":"CRIT38","orig":"images/q-0e79d89915.jpg"},{"id":2,"text":"<p>There is a tendency to think that carnivores, given their precarious place at the top of the food chain, are the most at risk from extinction. Yet over the course of history it is likely that the opposite has been the case. Herbivores are often more specialist – evolved to suit a particular environment, to eat a particular plant. Carnivores, on the other hand, have tended to retain a more general set of attributes: teeth that could cut as well as chew; physical agility and acute senses, making them less vulnerable to changes in environment. After all, meat remains meat through even the most dramatic of environmental upheavals; whereas grassland might be converted to forest – with serious consequences for the herbivores that are grazing specialists.</p><p>Which one of the following best expresses the conclusion of the above argument?</p>","image":"","options":["Herbivores are more threatened by environmental changes than carnivores.","It is natural to think that carnivores are more at risk of extinction than herbivores.","Herbivores are more at risk of extinction than carnivores.","Carnivores are better at adapting to changes in environment than herbivores.","Carnivores' success is mostly down to their having more general adaptions than herbivores."],"correct":2,"src":"CRIT38","orig":"images/q-1427aa18e9.jpg"},{"id":3,"text":"<p>A car manufacturer claims its vehicles are the safest on the market because their customers report feeling safe while driving. However, the company provides no accident statistics or comparisons with competitors. The manufacturer concludes that feeling safe proves their cars are the best in safety.</p><p>Which of the following best identifies the flaw in the argument above?</p>","image":"","options":["It relies on subjective feelings rather than objective data.","It fails to consider customer loyalty.","It does not mention insurance costs.","It assumes older drivers are more careful.","It overlooks maintenance standards."],"correct":0,"src":"CRIT38","orig":"images/q-172864c2ef.jpg"},{"id":4,"text":"<p>A library recently expanded its digital offerings, including e-books, online courses, and virtual events. Since the change, library membership has increased, especially among younger users. Staff note that users now engage more frequently and for longer periods. Based on this, the library director argues that modernizing services is essential to attracting and retaining members.</p><p>Which of the following best expresses the main conclusion of the argument above?</p>","image":"","options":["Younger people prefer digital content over print.","Modern library services lead to greater engagement.","Libraries must compete with social media platforms.","E-books are more cost-effective than physical books.","People are reading more now than in the past."],"correct":1,"src":"CRIT38","orig":"images/q-a343780566.jpg"},{"id":5,"text":"<p>A workplace wellness program claims that weekly meditation sessions reduce employee stress. The claim is based on self-reported surveys where participants indicated they felt calmer after each session. The program director argues that this justifies further investment in mindfulness practices.</p><p>Which of the following, if true, would most weaken the argument above?</p>","image":"","options":["Participants felt obligated to report positive results.","Meditation is not popular among younger employees.","The sessions were led by an external consultant.","Other wellness programs exist in the same company.","Most employees attended fewer than three sessions."],"correct":0,"src":"CRIT38","orig":"images/q-8ef35019ee.jpg"},{"id":6,"text":"<p>A password to open the safe in a hotel room uses an array of five names in a particular order selected from the names of the members of the owner's family. They are: Rick, Betty, Oscar, Gavin, Yasmin, Graham and Bertha. In any password a name can only be used once and no two names with the same starting letter are allowed. Jeremy is trying to remember the password he set and tries: Betty Rick Oscar Gavin Yasmin The safe doesn't open because whilst the second, fourth and fifth names are correct, the first and third names are wrong.</p><p>Which of these could be the correct combination to open the safe?</p>","image":"","options":["Bertha Rick Oscar Gavin Yasmin","Bertha Rick Graham Gavin Yasmin","Betty Rick Bertha Gavin Yasmin","Oscar Rick Graham Gavin Yasmin","Oscar Rick Bertha Gavin Yasmin"],"correct":4,"src":"CRIT38","orig":"images/q-e2ef188662.jpg"},{"id":7,"text":"<p>In response to a rise in bicycle thefts, a city council launched a public awareness campaign about securing bikes properly. The number of thefts dropped by 20% in the following year. The council claimed this decline proved the campaign's success. However, that same year, the police introduced undercover patrols targeting bicycle thieves and installed new CCTV cameras in high-risk areas. These additional actions were not mentioned in the council's report.</p><p>Which of the following is the best statement of the flaw in the above argument?</p>","image":"","options":["It confuses correlation with causation.","It assumes thefts were previously unreported.","It overlooks the role of police efforts.","It ignores seasonal trends in crime.","It overestimates the public's response to campaigns."],"correct":2,"src":"CRIT38","orig":"images/q-546209c847.jpg"},{"id":8,"text":"<p>An education researcher argues that students learn more effectively when lessons are broken into shorter segments with breaks in between. She bases this on a study showing students who took short breaks every 20 minutes scored higher on retention tests than those who sat through hour-long lectures. She concludes that all classes should adopt this segmented approach for better learning outcomes.</p><p>Which one of the following is an underlying assumption of the above argument?</p>","image":"","options":["The only factor influencing learning is lesson length.","Retention tests are a reliable measure of learning.","All students prefer short breaks.","Teachers are trained to deliver segmented lessons.","Students with low attention spans benefit more."],"correct":1,"src":"CRIT38","orig":"images/q-dc7dd3f5d7.jpg"},{"id":9,"text":"<p>A local government introduced a tax on plastic bags to reduce environmental waste. One year later, landfill data showed a 15% reduction in plastic waste. However, critics argue this could be due to improved recycling habits or other unrelated initiatives. Supporters maintain that the tax directly influenced consumer behaviour.</p><p>Which of the following, if true, would most strengthen the above argument?</p>","image":"","options":["Overall use of plastic bags declined sharply after the tax.","Recycling rates remained constant during the year.","Public awareness campaigns ran at the same time.","Other types of waste increased.","Some retailers continued offering free bags."],"correct":1,"src":"CRIT38","orig":"images/q-249d887307.jpg"},{"id":10,"text":"<p>Andy wants a challenge and he has decided to cycle from Jamestown to Country End, a distance of 1600km. He never cycles more than 150km each day, but in order to conserve his energies, he has decided on the following restrictions: After he has cycled 150km for each of two consecutive days he will cycle only 75km the next day. On Saturdays he will cycle only 75 km and on Sundays he will have a rest day. On each day he will cycle the maximum permitted within these restrictions. Andy will leave Jamestown early on a Wednesday morning. If he completes the ride without any unexpected delays, on what day of the week will Andy arrive in Country End?</p>","image":"","options":["Monday","Tuesday","Wednesday","Thursday","Friday"],"correct":3,"src":"CRIT38","orig":"images/q-ad0362b79f.jpg"},{"id":11,"text":"<p>A child's toy consists of four interlocking wooden wheels with fixed centres and 10, 15, 20 and 40 identical teeth. The wheel on the left has a handle as shown and the wheel on the right has a star marked at A. Fred uses the handle to turn the wheel on the left through 3 complete turns clockwise.</p><p>In which position does the star finish?</p>","image":"images/q-f97867ddd8.jpg","options":["Position A","Position B","Position C","Position D","None of them"],"correct":3,"src":"CRIT38","orig":"images/q-f97867ddd8.jpg","review":true},{"id":12,"text":"<p>A fitness chain introduced free weekend yoga classes for all members. Following this change, member engagement increased, as shown by a rise in attendance and participation in other classes. Many members also renewed their memberships earlier than usual. The company concludes that adding free wellness programs boosts customer loyalty.</p><p>Which of the following expresses the main conclusion of the above argument?</p>","image":"","options":["People like free yoga classes.","Membership renewals increased.","Wellness programs improve gym attendance.","Free programs help improve customer loyalty.","Fitness chains should offer more classes."],"correct":3,"src":"CRIT38","orig":"images/q-cc76adba94.jpg"},{"id":13,"text":"<p>Cabbi Taxis used to charge $7.50 per journey, plus 40¢ per ½ kilometre or part of ½ kilometre. Recently the company has changed its fare structure and now charges $10 for all journeys of 5 kilometres or less, plus an extra $1 for every further kilometre or part of a kilometre. Whenever I travel by train I hire Cabbi Taxis to take me to the station, a journey of 11.3 kilometres. How much more or less than previously does my journey to the station now cost?</p>","image":"","options":["70¢ more","30¢ more","10¢ less","20¢ less","30 ¢ more"],"correct":1,"src":"CRIT38","orig":"images/q-3749f2aea8.jpg"},{"id":14,"text":"<p>I want to attend one football match this month. Since I want to see a good match, I have decided to see a team who finished within four places of my team last year. My team finished 8th last year. I also want to watch an away game, but would like to travel the shortest distance possible to reach the game. I have summarised the information about this month's matches for my team in the table shown below.</p><table class=\"q-table\"><thead><tr><th>Week</th><th>Location</th><th>Wednesday game Distance to travel (km)</th><th>Wednesday game Ticket price ($)</th><th>Wednesday game Opponent's position last year</th><th>Location</th><th>Saturday game Distance to travel (km)</th><th>Saturday game Ticket price ($)</th><th>Saturday game Opponent's position last year</th></tr></thead><tbody><tr><td>1</td><td>Home</td><td>2</td><td>40</td><td>17</td><td>Away</td><td>21</td><td>50</td><td>1</td></tr><tr><td>2</td><td>Away</td><td>52</td><td>38</td><td>5</td><td>Away</td><td>32</td><td>42</td><td>11</td></tr><tr><td>3</td><td>Home</td><td>2</td><td>35</td><td>9</td><td>Home</td><td>2</td><td>45</td><td>14</td></tr><tr><td>4</td><td>Away</td><td>14</td><td>47</td><td>2</td><td>Home</td><td>2</td><td>40</td><td>7</td></tr></tbody></table><p>Which match will I go to see?</p>","image":"","options":["Week 1 Saturday","Week 2 Wednesday","Week 2 Saturday","Week 3 Wednesday","Week 3 Saturday"],"correct":2,"src":"CRIT38","orig":"images/q-a589c8ac95.jpg"},{"id":15,"text":"<p>Jack has decided that he would like to improve his Japanese and is considering a number of options that are available to him. The options are summarised in the table below.</p><table class=\"q-table\"><thead><tr><th>Option</th><th>Initial cost</th><th>Monthly price</th><th>Time</th><th>Levels available</th></tr></thead><tbody><tr><td>Computer programme</td><td>$200</td><td>N/A</td><td>Any time</td><td>Beginner, Intermediate, Advanced</td></tr><tr><td>Lessons at local college</td><td>$20</td><td>$30</td><td>Mondays 18:00 – 19:00</td><td>Beginner</td></tr><tr><td>Lessons at local college</td><td>$20</td><td>$15</td><td>Fridays 13:00 – 14:00</td><td>Intermediate</td></tr><tr><td>Lessons at local college</td><td>$20</td><td>$35</td><td>Thursdays 19:00 – 20:00</td><td>Intermediate</td></tr><tr><td>Lessons at local college</td><td>$20</td><td>$25</td><td>Tuesdays 10:00 – 11:00</td><td>Advanced</td></tr><tr><td>Online course</td><td>N/A</td><td>$45</td><td>Any time</td><td>Beginner, Intermediate, Advanced</td></tr></tbody></table><p>Jack needs an Intermediate course starting immediately and lasting for six months. He can afford to pay up to $50 in total in any month. As he works between 09:00 and 17:00 each day Monday to Friday he needs a course that is not within these times.</p><p>What is the cheapest total cost that Jack could pay for his course?</p>","image":"","options":["$110","$200","$230","$270","$290"],"correct":3,"src":"CRIT38","orig":"images/q-89da7e08fd.jpg"},{"id":16,"text":"<p>The 'Healthy Options' shop serves a range of organic foods. The manager has employed a new assistant and has asked her to prepare 30kg of their standard 'nut and raisin' mix, which should consist of 30% peanuts, 20% hazelnuts and 50% raisins. The assistant has, however, made a mix using 10 kg of each. The manager told her to add the minimum amount of extra ingredients to make the proportions right.</p><p>What should be the mass of the final mix (to the nearest 1 kg if necessary)?</p>","image":"","options":["30kg","33kg","40kg","55kg","50kg"],"correct":4,"src":"CRIT38","orig":"images/q-888f66eb21.jpg"},{"id":17,"text":"<p>Jenny, Kim, Lance, Mary and Nathan were the contestants in a recent talent competition. After they had all performed, each of the six judges awarded 9 points to one of them, 5 points to another and 2 points to a third. Mary was the only contestant who received points from all six judges, but she was second overall, 8 points behind Kim. What is the greatest number of points that Mary could have received?</p>","image":"","options":["30","33","34","37","38"],"correct":0,"src":"CRIT38","orig":"images/q-141dacdd1d.jpg"},{"id":18,"text":"<p>James is going to see a film at the cinema this evening. For both the journey to the cinema and the journey home James will take the bus. The buses run at 30-minute intervals in both directions. It takes 20 minutes for the bus to travel between the stop outside James's house and the stop by the cinema. James will take the latest bus that gets him to the cinema at or before 20:00 and the first bus home after 22:05.</p><p>Which of the following additional pieces of information would be sufficient to work out the time between James getting on the bus to go to the cinema and getting off the bus having returned home?</p>","image":"","options":["15 minutes after any bus passes James's house, another passes in the opposite direction","The first bus that James will be able to get to return home will leave at 22:30","The gaps between buses passing the cinema in either direction are 5 minutes and 25 minutes","The latest bus that will get James to the cinema on time will leave James's house at 19:25","None of them"],"correct":0,"src":"CRIT38","orig":"images/q-f8d3dda6d0.jpg"},{"id":19,"text":"<p>Dogs and cats have shorter lives than humans. A vet estimates that a dog ages 6 times as fast as a human for the first 3 human years of its life and 4 times as fast thereafter. The same vet estimates that a cat ages 7 times as fast as a human for the first 4 human years of its life and 3 times as fast thereafter. I was born exactly three years before my cat and my dog. Using the vet's estimates, how much 'older' than me will they be when they are the same age as each other?</p>","image":"","options":["24","33","36","39","40"],"correct":1,"src":"CRIT38","orig":"images/q-67d7f4341d.jpg"},{"id":20,"text":"<p>Although the Earth supports life, it has a mysterious carbon deficit. Compared with other bodies in the solar system the Earth has far less carbon than would be expected for a planet that supports life. Originally it was thought that in the inner region of the dust disc where the Earth formed, temperatures soared high enough for the carbon to boil away. However, observations of developing solar systems have now suggested that the temperature would not have been high enough. It is more likely that fire is to blame. Hot oxygen atoms would have readily combined with carbon, burning to produce carbon dioxide. There would have been fewer of these oxygen atoms further away from the Sun. Which one of the following, if true, would most strengthen the above argument?</p>","image":"","options":["The carbon that is present on the Earth could have arrived at a later date from an asteroid.","The abundance of carbon in the asteroid belt surrounding the inner planets increases the further away you get from the Sun.","There is no theoretical reason why life has to be carbonbased.","There are other solar systems with Earthlike planets that have an abundance of carbon on them.","At temperatures that are high enough for carbon to boil away, oxygen would also have boiled away."],"correct":1,"src":"CRIT38","orig":"images/q-2add87a763.jpg"},{"id":21,"text":"<p>Tom is having a celebration and needs to send out 50 invitation cards. The cards must be at least 6 cm wide and at least 8 cm high and Tom wants to put a photo on the card. Each type of card has a standard version and a deluxe version. The prices (per card) that have been quoted to Tom are shown in the table below:</p><table class=\"q-table\"><thead><tr><th>Width (cm)</th><th>Height (cm)</th><th>Photo?</th><th>Personalised greeting?</th><th>Price (standard)</th><th>Price (deluxe)</th></tr></thead><tbody><tr><td>6</td><td>6</td><td>Y</td><td>N</td><td>€0.90</td><td>€1.65</td></tr><tr><td>6</td><td>10</td><td>N</td><td>Y</td><td>€1.00</td><td>€1.60</td></tr><tr><td>6</td><td>10</td><td>Y</td><td>Y</td><td>€1.75</td><td>€2.15</td></tr><tr><td>7</td><td>7</td><td>Y</td><td>N</td><td>€1.40</td><td>€1.90</td></tr><tr><td>7</td><td>10</td><td>Y</td><td>N</td><td>€1.50</td><td>€1.95</td></tr><tr><td>7</td><td>10</td><td>Y</td><td>Y</td><td>€1.60</td><td>€2.15</td></tr><tr><td>10</td><td>10</td><td>Y</td><td>N</td><td>€2.25</td><td>€2.95</td></tr></tbody></table><p>Tom wants to buy the cheapest type of card possible but is willing to pay for the deluxe version instead of the standard. What is the total extra that Tom would have to pay to buy the deluxe cards?</p>","image":"","options":["€30.00","€20.00","€25.00","€22.50","€27.50"],"correct":3,"src":"CRIT38","orig":"images/q-de865ea832.jpg"},{"id":22,"text":"<p>Now, it might be thought an amazing coincidence if Earth were the only planet in the galaxy on which intelligent life evolved. If it happened here, the one planet we have studied closely, surely one would expect it to have happened on a lot of other planets in the galaxy – planets we have not yet had the chance to examine. This objection, however, rests on a fallacy: it overlooks what is known as an 'observation selection effect', so it wouldn't be such a coincidence. Whether intelligent life is common or rare, every observer is guaranteed to originate from a place where intelligent life did, in fact, arise. Since only the successes give rise to observers who can wonder about their existence, it would be a mistake to regard our planet as a randomly selected sample from all planets.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>","image":"","options":["Our planet is not a randomly selected sample from all planets.","However common intelligent life is, every observer will certainly originate from a place where intelligent life did, in fact, arise.","If life had evolved here on Earth, it would probably have happened on a lot of other planets in the galaxy.","There would be no amazing coincidence if we discovered that Earth were the only planet in the galaxy on which intelligent life evolved.","It would be an amazing coincidence if Earth were the only planet in the galaxy on which intelligent life evolved."],"correct":3,"src":"CRIT38","orig":"images/q-9961370bd7.jpg"},{"id":23,"text":"<p>A tech startup claims its new productivity app increases users' efficiency by organizing tasks based on priority and estimated time. In a small internal study, employees who used the app reported completing more tasks and feeling less overwhelmed. The company argues that this proves the app is effective for improving work performance. However, external reviewers have not yet tested the app, and no long-term data has been collected.</p><p>Which of the following, if true, would most weaken the above argument?</p>","image":"","options":["Employees felt obligated to report positive outcomes during internal testing.","Other productivity apps have similar features.","The app is not compatible with older devices.","Most people don't use productivity tools regularly.","Task completion depends on industry type."],"correct":0,"src":"CRIT38","orig":"images/q-a967c037ac.jpg"},{"id":24,"text":"<p>A university allows students to reschedule exams only for official medical emergencies. One professor argues that this policy is too rigid, especially when unexpected life events such as family crises or mental health struggles can severely affect a student's ability to perform. She proposes a revised policy that permits flexibility when students provide a credible reason, even if it's non-medical.</p><p>Which of the following best illustrates the principle underlying the argument above?</p>","image":"","options":["Fair policies account for individual circumstances beyond one's control.","Students should not be allowed to take exams late.","Professors must be strict to uphold academic integrity.","Only physical illnesses are valid reasons for accommodations.","Flexible policies encourage students to lie."],"correct":0,"src":"CRIT38","orig":"images/q-abbbc3c094.jpg"},{"id":25,"text":"<p>Concern about the effects of chemicals upon the environment has led to calls for more research. But we should not wait for further research before we ban some of the chemicals used by industry. If anyone has a good reason to think something is harmful, it should not be used until, or unless, the risk is found to be zero. We know enough about past mistakes to be forewarned. Much of the harm to wildlife and humans is longterm, and the disturbing results we see today reflect the chemical environment 40 years ago. Thousands more chemicals have been released into the environment since then.</p><p>Which one of the following most closely matches the reasoning above?</p>","image":"","options":["People should not be able to adopt children until proper checks have been carried out. Serious consequences may follow if adoptive parents are unsuitable.","A suspected terrorist should be arrested at once. Waiting for conclusive evidence in the past has resulted in atrocities that could have been avoided by acting on suspicion, and the threat of terrorism has grown.","Some homes for the elderly have been found to give dangerously substandard care. Therefore they should be closed down and the residents found acceptable alternatives.","Cyclists should not place too much confidence in the benefits of helmets, because there is no conclusive evidence as yet that helmets prevent serious injuries.","Some cars that have passed the annual roadworthiness test would not pass 6 months later. Cars should be tested more than once a year once they pass a certain age."],"correct":1,"src":"CRIT38","orig":"images/q-0c0c95af5b.jpg"},{"id":26,"text":"<p>Climate scientists in Greenland studying patterns of plant growth have suggested that the early arrival of spring in the Arctic threatens to drive down populations of migrating animals such as caribou. However, comparable studies elsewhere show that their fears are unfounded. A recent study of great tits in Oxfordshire showed the birds are capable of adapting to climate change better than many scientists expected. Over the past half century, the birds have brought forward the date they lay their eggs by two weeks, so that young are born when planteating grubs are most plentiful.</p><p>Which one of the following is an underlying assumption of the above argument?</p>","image":"","options":["Migrating animals in the Arctic can adapt to climate change as successfully as great tits in Oxfordshire.","Birds are more adaptable than large mammals such as caribou.","Unless animals like the caribou produce their young earlier in the year, their population will fall.","The scientists working in Oxfordshire have greater expertise than those working in Greenland.","Climate change in Greenland and climate change in Oxfordshire are of the same scale."],"correct":0,"src":"CRIT38","orig":"images/q-e2faeb4b94.jpg"},{"id":27,"text":"<p>A large corporation interviews people to fill positions in their business. Each man who applies is twice as likely as each woman to be offered a job. Three times as many women apply as men. What proportion of those offered a job are expected to be men?</p>","image":"","options":["1/3","2/5","1/2","2/3","3/4"],"correct":1,"src":"CRIT38","orig":"images/q-db3e6bae41.jpg"},{"id":28,"text":"<p>Every day from Monday to Saturday last week Roger ate one packet of sandwiches and drank one carton of fruit juice for his lunch. Roger went to the store to buy sandwiches and/or cartons of fruit juice each evening. The cartons of fruit juice are only sold in packs of 3. The amounts that he spent each night last week are as shown in the table.</p><table class=\"q-table\"><thead><tr><th>Sunday</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thusrsday</th><th>Friday</th></tr></thead><tbody><tr><td>$5</td><td>$2</td><td>$3</td><td>$3</td><td>$2</td><td>$2</td></tr></tbody></table><p>Roger did not have any sandwiches or cartons of fruit juice left before he went shopping on Sunday and did not have any sandwiches or cartons of fruit juice left after his lunch on Saturday. On one day Roger was able to take advantage of a \"Buy one, get one half price\" offer on sandwiches when at the store.</p><p>On which day did the store have the offer in place?</p>","image":"","options":["Monday","Wednesday","Tuesday","Thursday","Friday"],"correct":2,"src":"CRIT38","orig":"images/q-ed32240023.jpg"},{"id":29,"text":"<p>Undercover police investigators sometimes commit 'crimes' in order to convince the 'real criminals' that they are on the same side as them. Some of these activities have victims, although in the main these are other criminals – rival gang members for example. In committing what are technically offences the officers are preventing many more serious crimes by helping to convict and imprison dangerous criminals who might otherwise remain at liberty. But that is not really the point. A breach of the law is a breach of the law, whoever commits it and for whatever reason. Preventing a crime does not make it right to commit another crime.</p><p>Which one of the following is the general principle underlying the above argument?</p>","image":"","options":["An act is criminal only if it is committed for criminal reasons.","Serious crime must be prevented by any reasonable means.","The police have a duty to protect lawabiding citizens from violence.","There is no such thing as a victimless crime.","The end does not justify the means."],"correct":4,"src":"CRIT38","orig":"images/q-596188c91b.jpg"},{"id":30,"text":"<p>Children are being encouraged to take up gardening through special events at shows and activities in schools. It is hoped that an interest in gardening, and particularly growing one's own food, will make children more interested in learning about their food and they will therefore be deterred from eating junk food. The initiative should be supported and spread to more schools as quickly as possible.</p><p>Which one of the following, if true, would most weaken the above argument?</p>","image":"","options":["The practical experience of gardening is not a traditional academic subject.","The events to encourage children to garden also included stands where junk food was for sale.","Some schools do not have a garden.","It tends to be older people who are interested in gardening and growing their own food.","Most children have enjoyed the events provided, but have not gained an interest in gardening itself."],"correct":4,"src":"CRIT38","orig":"images/q-e862f708a0.jpg"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Your answers are saved per question so the platform can show which specification
       topics you are weakest on. That needs an account — it takes about twenty seconds.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
