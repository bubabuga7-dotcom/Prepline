<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q26 · Main conclusion</p>", "image": "images/ct-pp/ct040_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Публика (при поддержке правительства) подняла спрос на ночную помощь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главная мысль: проблема отчасти создана самой публикой. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — детали или не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите мысль, которую доказывает весь текст.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q27 · Problem solving</p>", "image": "images/ct-pp/ct040_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У Фила 20 очков, нужно ещё ≥ 10 за 2 дротика, секции разные.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Целясь в 9, худшие попадания — 4, 9 или 6; из любого есть безопасный последний бросок. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>4, 7, 10, 11 могут оставить позицию без безопасного броска.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте худший случай попадания.</div></div>"}, {"id": 3, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q28 · Strengthen</p>", "image": "images/ct-pp/ct040_q03.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Утверждение: публику настроило само имя, а не факты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если газета писала точно (1) — содержание не объясняет реакцию → усиливает.</li><li>2 и 3 — другие пути влияния → ослабляют. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 2 или 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усилитель убирает альтернативные объяснения.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q29 · Problem solving</p>", "image": "images/ct-pp/ct040_q04.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">7 яблок = 1390 г; две упаковки — от 1194 до 1206 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Лишнее яблоко — 184–196 г → только 188.</li><li>Проверка: 173 + 207 + 219 = 599, 182 + 197 + 224 = 603. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — вне диапазона.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите вес лишнего через сумму.</div></div>"}, {"id": 5, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q30 · Assumption</p>", "image": "images/ct-pp/ct040_q05.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем то, что аргумент НЕ допускает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A, C, D — нужны.</li><li>Общее «любая дорогая схема не оправдана» — не нужно. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — действительно допущения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В вопросах «не допущение» проверяйте каждый вариант.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct040_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сложите исходную развёртку: какие символы напротив и как они стоят.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только D даёт те же пары напротив и ту же ориентацию. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пары или ориентация не совпадают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала пары напротив, потом ориентация.</div></div>"}, {"id": 7, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q32 · Principle</p>", "image": "images/ct-pp/ct040_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Богатые 20%: 50 656 + 162 029 = 212 685.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бедные 20%: 16 203 + 17 338 = 33 541.</li><li>212 685 : 33 541 ≈ 6,3 → около 6 : 1. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не то соотношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте по два дециля.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q33 · Problem solving</p>", "image": "images/ct-pp/ct040_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Среднее 40 000 $ → сумма децилей 400 000 $.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Верхний дециль 162 029 $ ≈ 40%. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма = среднее × 10.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q34 · Problem solving</p>", "image": "images/ct-pp/ct040_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20% дохода двух верхних децилей: 0,2 · 212 685 ≈ 42 537.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Делим на 8 децилей ≈ 5317 каждому.</li><li>Нижние 10%: 16 203 + 5317 ≈ 21 500 $. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не на 8 делили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деньги делят на остальных 8.</div></div>"}, {"id": 10, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q35 · Drawing a conclusion</p>", "image": "images/ct-pp/ct040_q10.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Графики сравнивают целые страны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>О богатых и бедных внутри страны — ничего (1 ✘).</li><li>Меньше неравенства — лучше здоровье (2 ✔). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Данные по странам ≠ данные по людям.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct040_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сопоставляем строки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Облачность — A, дождь — B, ветер — C, температура — E.</li><li>Остаётся D. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие уже заняты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Метод исключения.</div></div>"}, {"id": 12, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q2 · Drawing a conclusion</p>", "image": "images/ct-pp/ct040_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Текст: песни громче, выше, проще.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Он не доказывает вымирание, остановку ветряков, успешную адаптацию или вину шума. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — выходят за текст.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не выводите больше, чем сказано.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct040_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делюкс без питания + машина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(80 − 15) · 6 = 390.</li><li>Машина: 5 + 5 · 6 = 35.</li><li>Итого 425 $. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — с питанием или без машины.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внимательно с «без питания».</div></div>"}, {"id": 14, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q4 · Flaw</p>", "image": "images/ct-pp/ct040_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">От «игры на компьютере» к «дети менее общительны».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не показано, что игроки онлайн перестали общаться. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Онлайн-игра тоже может быть общением.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct040_q15.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 5, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Плитка в X должна давать оба отражения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поворачиваем каждую плитку, сверяем точку и квадратик.</li><li>Подходят только 3 и 4. Ответ F.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не совпадают с отражениями.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Зеркало меняет лево и право.</div></div>"}, {"id": 16, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q6 · Assumption</p>", "image": "images/ct-pp/ct040_q16.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Различия в мозге могли быть и до обучения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чтобы назвать причиной обучение, надо допустить, что раньше снимки были бы другими. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Причина или отбор?</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct040_q17.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подходят самолёты с дальностью ≥ 5600 и местами ≥ 177: A, B, D, G, H.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Топливо на милю: A 4,77; B 7,37; D 6,57; G 18,05; H 15,39.</li><li>Меньше всего — Boeing 737. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — больше топлива или не подходят.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала фильтр, потом расчёт.</div></div>"}, {"id": 18, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q8 · Drawing a conclusion</p>", "image": "images/ct-pp/ct040_q18.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разрыв 22,8% в 40 лет и 20,6% в 50 лет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Женщины получают 77–79 пенсов на 1 £ мужчин — меньше 80 пенсов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — о возрасте пика или найме, данных нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переведите разрыв в долю.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct040_q19.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Женщины получают на 22,8% меньше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 000 = 0,772 · M → M ≈ 20 700 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — прибавили 22,8% к 16 000.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент от зарплаты мужчин, не женщин.</div></div>"}, {"id": 20, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q10 · Assumption</p>", "image": "images/ct-pp/ct040_q20.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Долгие часы отпугивают матерей от повышений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: иначе они выбрали бы эти должности. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение о желании, а не о способности.</div></div>"}, {"id": 21, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q11 · Drawing a conclusion</p>", "image": "images/ct-pp/ct040_q21.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разрыв частичной занятости 41,2% → 58,8% от ставки мужчин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,588 · 15 = 8,82 £. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 100% − разрыв.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct040_q22.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Классифицируем плитки по узору, повороты — одна плитка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Различных типов 6. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — считали повороты отдельно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поворот не делает плитку новой.</div></div>"}, {"id": 23, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q13 · Strengthen</p>", "image": "images/ct-pp/ct040_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Язык связан с HAR1, если повреждение HAR1 вредит языку.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мутация, вызывающая особое нарушение речи, — такое доказательство. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — косвенные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Лучшее доказательство — прямой эффект.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q14 · Problem solving</p>", "image": "images/ct-pp/ct040_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По 4 игры; разбираем очки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Central 2 = 2 ничьи; Western 1 = 1; Northern 8 = 2В 2Н; Southern 5 = 1В 2Н 1П.</li><li>Ничьих в сумме чётно → у Eastern нечётно.</li><li>С 1 ничьей: 26 очков всего, Eastern = 26 − 16 = 10. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — нарушают чётность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая ничья считается у двух команд.</div></div>"}, {"id": 25, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q15 · Weaken</p>", "image": "images/ct-pp/ct040_q25.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент считает, что конституционное право не может быть правом человека.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это слабость (2). 1 и 3 не допускаются. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 1 или 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите скрытое «или — или».</div></div>"}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct040_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя глубина = объём : площадь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Байкал 23 600 : 31 500 ≈ 0,75 км — максимум.</li><li>Танганьика ≈ 0,57, Каспий ≈ 0,20. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Самое большое озеро ≠ самое глубокое.</div></div>"}, {"id": 27, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q17 · Assumption</p>", "image": "images/ct-pp/ct040_q27.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прогноз ещё двух вспышек (M-V и V-V).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, без M-M тоже можно заболеть → вариант M не обязателен (3).</li><li>2 противоречит, 1 не нужно. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 1 или 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прогноз раскрывает допущение.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct040_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Джаспер: 240 + 5 · 22 + 20 · 6 = 470.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Руби: 510 = 240 + 5 · 14 + 20y → y = 10 лет.</li><li>На 4 больше Джаспера. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Составьте уравнение по формуле.</div></div>"}, {"id": 29, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q23 · Problem solving</p>", "image": "images/ct-pp/ct040_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Свободные числа: 2, 4, 6, 7, 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Левый столбец: TL + x = 13 = 6 + 7.</li><li>Правый: TR + BR = 10; верх: TL + TM + TR = 12.</li><li>TL = 6, TR = 2, BR = 8, TM = 4 → дом между 3 и 5 — 7. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — нарушают суммы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте с самой жёсткой суммы.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q24 · Problem solving</p>", "image": "images/ct-pp/ct040_q30.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Петермасс играет, только если Фредерикс не здоров».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Играет → Ф не здоров; то же: Ф здоров → не играет (Джед).</li><li>Нед — обратное, Тед — противоположное; не следуют. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают Неда или Теда.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Только если» — стрелка вправо.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
