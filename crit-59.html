<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q30 · Problem solving</p>", "image": "images/ct-pp/ct080_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Музыка: 6 : 10 = 0,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Биология 24 : 41 ≈ 0,59 — ближе всего. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>География 0,81, немецкий 0,25, математика 1,7, социология 0,27.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте отношения, а не разности.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct080_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пять конвертов по 70 г, три — по 110 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 29c + 3 · 36c = 1,45 + 1,08 = 2,53 $. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та весовая ступень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите ступень «не больше».</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct080_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК(90 с, 120 с, 50 с).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1800 с = 30 мин. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переведите в секунды.</div></div>"}, {"id": 4, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q33 · Drawing a conclusion</p>", "image": "images/ct-pp/ct080_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Бумагу делают из выращиваемой хвойной древесины, а не из дикого леса.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Переработка бумаги не спасает природные леса напрямую. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — слишком сильно.</li><li>D — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод.</div></div>"}, {"id": 5, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q34 · Main conclusion</p>", "image": "images/ct-pp/ct080_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод в конце.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Добычу торфа прекратить и продвигать альтернативу. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация = вывод.</div></div>"}, {"id": 6, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q35 · Flaw</p>", "image": "images/ct-pp/ct080_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Солнечные пятна совпадают со штормами → причина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Совпадение не доказывает причинности. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q36 · Problem solving</p>", "image": "images/ct-pp/ct080_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Значения: 1; 2,2; 3,3; 5; 7; 9,7 в любом порядке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только в C высоты столбиков совпадают с этим набором. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>В других есть лишние или неверные высоты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте набор, порядок не важен.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q37 · Problem solving</p>", "image": "images/ct-pp/ct080_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Максимум — в выходные: с 9:00 до 19:00 = 600 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поездка 3 + пауза 2 = 5 мин → 120 поездок. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — с паузой 5 мин; C — в будни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минимальная пауза, максимальное время.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q38 · Problem solving</p>", "image": "images/ct-pp/ct080_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одна книга: 2 · 30 + 2 · 2 + 2 · 20 + 2 · 2 = 108 см; ушло 126 → бант 18 см.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n книг: 100 + 8n + 18 = 150 → n = 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли бант.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Толщина пачки = 2n.</div></div>"}, {"id": 10, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q39 · Strengthen</p>", "image": "images/ct-pp/ct080_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Специалисты не заметили подделку, а цена упала.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если картину считали шедевром до раскрытия — ценность явно не в художественных качествах. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — ослабляет.</li><li>A, B, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что качество не изменилось.</div></div>"}, {"id": 11, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q40 · Assumption</p>", "image": "images/ct-pp/ct080_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Совет: есть другое мясо вместо телятины.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: другое мясо не производится так же жестоко. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернатива должна быть лучше.</div></div>"}, {"id": 12, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q41 · Weaken</p>", "image": "images/ct-pp/ct080_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Развивающимся странам неизбежно нужно больше ресурсов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если новые технологии уменьшат потребность в ресурсах — вывод слабеет. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — не о ресурсах на единицу.</li><li>B — не ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ломайте «неизбежно».</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q42 · Problem solving</p>", "image": "images/ct-pp/ct080_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужна гарантия золотого ножа и золотой вилки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В худшем случае первые 6 — серебряные → по 7 штук. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — нет гарантии.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Худший случай + 1.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q43 · Problem solving</p>", "image": "images/ct-pp/ct080_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">11:00–16:00 по 2 £, 16:00–19:00 по 1 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 + 3 = 13 £ — дешевле суточного (15 £). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — суточный дороже.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Залог возвращается.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q44 · Problem solving</p>", "image": "images/ct-pp/ct080_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">На крючке 4 червя; после каждого заброса (кроме последнего в пруду) — замена 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Час: 4 + 11 = 15; полтора часа: 4 + 17 = 21.</li><li>4 · 15 + 21 = 81. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (86) — замена и после последнего заброса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Замена — перед следующим забросом.</div></div>"}, {"id": 16, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q45 · Parallel reasoning</p>", "image": "images/ct-pp/ct080_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Убытки → увольнения → удар по экономике города. Цепочка «если — то».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: засуха → нормирование → жалобы; без дождя будут жалобы. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — «чтобы получить — надо».</li><li>B, D — вывод не той формы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка из двух условий.</div></div>"}, {"id": 17, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q46 · Main conclusion</p>", "image": "images/ct-pp/ct080_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод в конце.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Число болезней пожилого возраста продолжит снижаться. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прогноз = вывод.</div></div>"}, {"id": 18, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q47 · Assumption</p>", "image": "images/ct-pp/ct080_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сонный паралич объясняет все сообщения о похищениях → похищений нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: похищенные всегда сообщили бы. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> А вдруг кто-то промолчал?</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q48 · Problem solving</p>", "image": "images/ct-pp/ct080_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">12n = 10(n + 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 10 → купит 12 (≥ 8, скидка действует). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — число, которое планировала мама.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деньги одни и те же.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q49 · Problem solving</p>", "image": "images/ct-pp/ct080_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена на 100 £ товара Saw Sharp с учётом ваучеров.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Make It 95; Saw Sharp 95; Nuts'n Bolts ≈ 93,8; Trowel 94,5; Plumb It ≈ 94,1.</li><li>Nuts'n Bolts. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — дороже.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ваучер = скидка на %.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q50 · Problem solving</p>", "image": "images/ct-pp/ct080_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одна духовка: хлеб и мясо — по очереди; я один.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тесто 20 + хлеб 60 + мясо 120 + соус 5 + нарезка 5 = 210 мин.</li><li>13:00 − 3 ч 30 мин = 9:30. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — забыли соус или нарезку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всё прочее — пока что-то печётся.</div></div>"}, {"id": 22, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q3 · Principle</p>", "image": "images/ct-pp/ct080_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Amnesty защищает права человека из Декларации.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Теологические принципы — не её основание. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — совместимы с правами человека.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите чужое основание.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q4 · Problem solving</p>", "image": "images/ct-pp/ct080_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Осталось 2 красных и 3 жёлтых.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Из трёх следующих хотя бы один жёлтый — красных всего 2. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — зелёного нет.</li><li>B, C, E — не обязательно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип Дирихле.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct080_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Без мелких деталей: машинка, мишка, поезд.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мишка (Алиса, Ханна) + поезд (Джордж) = 7 + 8 = 15 €. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — с мелкими деталями или не всем.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Фильтр, потом покрытие.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct080_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Посетители: 23, 41, 35, 60, 40, 15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только гистограмма E. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неверный столбик 16–18.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте каждый столбец.</div></div>"}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q10 · Problem solving</p>", "image": "images/ct-pp/ct080_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК(8, 15) = 120 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 ч. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Встреча — НОК периодов.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q11 · Problem solving</p>", "image": "images/ct-pp/ct080_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем в «базовых часах» (×11 €).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Алиса 32 + 12 + 12 = 56 — больше всех. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Бен и Эллен 55, Дэниел 54, Четан 52.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не умножайте на 11 — сравнивайте единицы.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct080_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Месяц перевёрнут, возраст 11–16 перевёрнут, дата перевёрнута.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>602124: дата «24» → 42 — такого дня нет. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные коды возможны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переворачивайте каждую часть.</div></div>"}, {"id": 29, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q13 · Parallel reasoning</p>", "image": "images/ct-pp/ct080_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У умных животных мозг больше ожидаемого для размера тела.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Относительный размер мозга — лучший показатель, чем абсолютный. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — не следуют.</li><li>E — слабее и не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод из сравнения.</div></div>"}, {"id": 30, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2011 · original Q14 · Assumption</p>", "image": "images/ct-pp/ct080_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Запрет до 24 лет, чтобы снизить аварии.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: большинство аварий с молодыми — по их вине. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мера должна бить по причине.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
