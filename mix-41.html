<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m025_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Радиус в точке касания перпендикулярен QR: OX ⊥ QR.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Расстояние от O до QR = r = √3; в треугольнике OXR угол R = 60° → OR = <span class=\"fr\"><span>√3</span><span>sin</span></span> 60° = 2, XR = 1.</li><li>PR = PO + OR = √3 + 2.</li><li>QX = QR − XR = 2 + √3 − 1 = 1 + √3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это радиус.</li><li>Остальные — неверно найдены OR или XR.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Касательная ⊥ радиусу в точке касания.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m025_q02.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выносим √3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√75 = 5√3, √48 = 4√3, √27 = 3√3.</li><li>5√3 + 4√3 − 3√3 = 6√3 = √108.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — арифметика.</li><li>Остальные — неверное упрощение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6√3 = √(36 · 3).</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m025_q03.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пересечение ⇔ D ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>kx = (x − 1)² → x² − (2 + k)x + 1 = 0.</li><li>D = (2 + k)² − 4 ≥ 0 → |2 + k| ≥ 2 → k ≥ 0 или k ≤ −4.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — промежуток без пересечений.</li><li>A, B — только одна часть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> |a| ≥ b — два луча.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m025_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внутренний круг разбит на 4 части, кольцо — на 10; все 14 частей равны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Одна часть: <span class=\"fr\"><span>π</span><span>4</span></span>.</li><li>Весь большой круг: 14 · <span class=\"fr\"><span>π</span><span>4</span></span> = 3,5π = πR² → R = <span class=\"fr\"><span>√14</span><span>2</span></span>.</li><li>x = R − 1 = <span class=\"fr\"><span>√14</span><span>2</span></span> − 1.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — R = √14.</li><li>Остальные — неверное число частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь части малого круга даёт «единицу» площади.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m025_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем всё на 2 и 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Числитель: 2<sup>r + s</sup> · 3<sup>r + s</sup> · 2<sup>2r − 2s</sup> · 3<sup>r − s</sup> = 2<sup>3r − s</sup> · 3<sup>2r</sup>.</li><li>Знаменатель: 2<sup>3r</sup> · 3<sup>2r + 4s</sup>.</li><li>Результат: 2<sup>−s</sup> · 3<sup>−4s</sup> — целое ⇔ s ≤ 0.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — r сокращается и не влияет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 12 = 2² · 3, 8 = 2³, 9 = 3².</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m025_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол треугольника больше любого несмежного внутреннего.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠7 — внутренний угол треугольника с углами 6, 7, 8.</li><li>∠11 смежен с ∠8 → это внешний угол этого треугольника → ∠11 = ∠6 + ∠7 &gt; ∠7.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Про ∠1, ∠4, ∠5, ∠6 по рисунку вывода сделать нельзя.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите внешний угол нужного треугольника.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m025_q08.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S₅ = S₈ ⇔ a₆ + a₇ + a₈ = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма трёх подряд = 3a₇ = 0 → a₇ = 0.</li><li>a + 6d = 0 → a = −6d.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — a₈ = 0.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма симметричных членов = число членов × средний.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m025_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два случая: правая часть отрицательна или нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>ОДЗ: x ≥ <span class=\"fr\"><span>−5</span><span>2</span></span>.</li><li>x &lt; −1: правая часть отрицательна — верно всегда → <span class=\"fr\"><span>−5</span><span>2</span></span> ≤ x &lt; −1.</li><li>x ≥ −1: 2x + 5 &gt; x² + 2x + 1 → x² &lt; 4 → −1 ≤ x &lt; 2.</li><li>Итого: <span class=\"fr\"><span>−5</span><span>2</span></span> ≤ x &lt; 2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без ОДЗ и случая x &lt; −1.</li><li>C — потеряна часть решений.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При отрицательной правой части возводить в квадрат нельзя.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m025_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Навстречу — скорости складываются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>25 + 5 = 30 м/с.</li><li><span class=\"fr\"><span>150</span><span>30</span></span> = 5 с.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — <span class=\"fr\"><span>150</span><span>25</span></span>.</li><li>D — разность скоростей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Встречное движение — сумма скоростей.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m025_q11.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 5, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Замена u = <span class=\"fr\"><span>x</span><span>3</span></span> + 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3u² − u − 4 = 0 → u = <span class=\"fr\"><span>4</span><span>3</span></span> или −1.</li><li>x = 3(u − 2): −2 и −9.</li><li>Сумма −11.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сумма u.</li><li>Остальные — не вернулись к x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После замены вернитесь к x.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m025_q12.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Направление из T на Q — 270°, на P — 250°: угол QTP = 20°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>PQ = QT → треугольник равнобедренный с вершиной Q.</li><li>Углы при T и P по 20° → ∠PQT = 140°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный угол при T.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Запад — пеленг 270°.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m025_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратные действия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y + 6 = (4x + 5)².</li><li>4x + 5 = √(y + 6) → x = <span class=\"fr\"><span>√(y + 6) − 5</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — y − 6.</li><li>C — +5.</li><li>E — делили на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последнее действие «−6» снимаем первым.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m025_q14.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем коэффициенты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3500 · 1,3 · 0,8 · 0,5 = 1820.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — среда.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый процент — от предыдущего дня.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m025_q15.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 1, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя скорость = весь путь / всё время.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подъём: 16 · 0,5 = 8 км.</li><li>Весь путь 16 км при 20 км/ч → 0,8 ч.</li><li>Спуск: 0,3 ч → <span class=\"fr\"><span>8</span><span>0,3</span></span> = <span class=\"fr\"><span>80</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — среднее арифметическое скоростей.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя скорость ≠ среднее скоростей.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m025_q16.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AB = AC = AD — радиусы → равнобедренные треугольники.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>ABD: ∠ADB = 48° → ∠BAD = 84°.</li><li>∠DAC = 360° − 84° − 56° = 220° — значит, центральный угол DAC с другой стороны 140°.</li><li>Треугольник ADC: ∠DCA = <span class=\"fr\"><span>180 − 140</span><span>2</span></span> = 20°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно найден ∠DAC.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиусы → равнобедренные треугольники.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m025_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">R ∝ v².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,6² = 0,36 → уменьшение на 64%.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — новое значение.</li><li>C — без квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Уменьшение» = 1 − коэффициент.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m025_q18.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 5, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(a + b)² − (a − b)² = 4ab.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · √10 · √7 = 4√70.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E, G — сумма квадратов.</li><li>D — 2ab.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не раскрывайте — используйте формулу.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m025_q19.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим вершины треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С осью y: (0; 10) и (0; −23) → основание 33.</li><li>Пересечение прямых: 5x + 6x − 46 = 20 → x = 6.</li><li>S = ½ · 33 · 6 = 99.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без ½.</li><li>Остальные — неверное основание.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Основание на оси y, высота = |x| вершины.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m025_q20.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,4(5) = <span class=\"fr\"><span>45 − 4</span><span>90</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>41</span><span>90</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — <span class=\"fr\"><span>44</span><span>90</span></span>.</li><li>D — 0,444…</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смешанная периодическая: (число − непериод. часть)/90.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m025_q21.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AD = BC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D = A + BC = (3 − 4; 4 + 6) = (−1; 10).</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — использовали AB.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В параллелограмме противоположные стороны — равные векторы.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m025_q22.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x = 8008 · <span class=\"fr\"><span>10</span><span>770</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8008 = 4 · 2002; 770 = 2002 · <span class=\"fr\"><span>5</span><span>13</span></span>.</li><li>x = 104 = 2³ · 13.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное сокращение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократите 10 и 770 первым делом.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m025_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пирамида с вершиной F: рёбра FB, FE, FG взаимно перпендикулярны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V = ⅓ · ½a² · a = <span class=\"fr\"><span>a³</span><span>6</span></span>.</li><li>Отношение <span class=\"fr\"><span>1</span><span>6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — дважды поделили на 2.</li><li>B, C — неверная формула.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угловая пирамида куба = ⅙ объёма.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m025_q24.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол при A тоже 60° (трапеция равнобедренная).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>DH = 3 · tg 60° = 3√3.</li><li>AB = 3 + 5 + 3 = 11.</li><li>S = <span class=\"fr\"><span>5 + 11</span><span>2</span></span> · 3√3 = 24√3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — AB = 8.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Свес с каждой стороны одинаковый.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m025_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">t · d² = const.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,2 · 64 = 12,8.</li><li>t = <span class=\"fr\"><span>12,8</span><span>100</span></span> = 0,128 = <span class=\"fr\"><span>16</span><span>125</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — прямая пропорциональность или без квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная пропорциональность.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m025_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4 четверти круга радиуса 5 = один круг.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>100 − 25π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — половина квадрата.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус 5 — половина стороны.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m025_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доля P: в X <span class=\"fr\"><span>3</span><span>5</span></span>, в Y <span class=\"fr\"><span>4</span><span>5</span></span>, нужно <span class=\"fr\"><span>5</span><span>7</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x<span class=\"fr\"><span>3</span><span>5</span></span> − <span class=\"fr\"><span>5</span><span>7</span></span> + y<span class=\"fr\"><span>4</span><span>5</span></span> − <span class=\"fr\"><span>5</span><span>7</span></span> = 0.</li><li>x · <span class=\"fr\"><span>−4</span><span>35</span></span> + y · <span class=\"fr\"><span>3</span><span>35</span></span> = 0 → x : y = 3 : 4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное уравнение смеси.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Правило рычага: расстояния до целевой доли.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m025_q29.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 7, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем степени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16<sup>3⁄4</sup> = 8; 25<sup>−½</sup> = <span class=\"fr\"><span>1</span><span>5</span></span>; 8<sup>2⁄3</sup> = 4.</li><li>8 · <span class=\"fr\"><span>1</span><span>5</span></span> / 4 = <span class=\"fr\"><span>2</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>H</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки со степенями.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала корень, потом степень.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m025_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поворот по часовой: (x; y) → (y; −x).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>M → (4; −3), N → (−2; 2); середина RS (1; −½).</li><li>(6; −3) − (1; −½) = (5; <span class=\"fr\"><span>−5</span><span>2</span></span>).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — поворот против часовой или иная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Достаточно повернуть середину отрезка.</div></div>"}, {"id": 31, "topic": "M5.5", "text": "<p>In triangle ABC, D is on AB and E is on AC with DE parallel to BC. AD = 4 cm, DB = 6 cm and DE = 10 cm.</p><p>Find BC.</p>", "image": "", "options": ["4 cm", "15 cm", "16 cm", "25 cm", "27 cm"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольники ADE и ABC подобны; AB = 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 10 : 4.</li><li>BC = 10 · <span class=\"fr\"><span>10</span><span>4</span></span> = 25 см. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — коэффициент перевёрнут.</li><li>B — взяли DB : AD вместо AB : AD.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте со всей стороной AB, а не с DB.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.8", "text": "<p>Calculate \\((2.5 \\times 10^{5}) \\times (8 \\times 10^{3})\\), giving your answer in standard form.</p>", "image": "", "options": ["\\(2 \\times 10^{9}\\)", "\\(2 \\times 10^{8}\\)", "\\(2 \\times 10^{15}\\)", "\\(2 \\times 10^{10}\\)", "\\(1.05 \\times 10^{9}\\)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножьте числа и отдельно степени десятки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2,5 · 8 = 20.</li><li>10<sup>5</sup> · 10<sup>3</sup> = 10<sup>8</sup>; приводим к виду 1 ≤ a &lt; 10: 2 · 10<sup>9</sup>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не перенесли разряд, когда произведение стало ≥ 10.</li><li>C — перемножили показатели.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В стандартном виде множитель от 1 до 10.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
