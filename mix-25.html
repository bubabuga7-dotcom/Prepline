<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m005_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат и выделяем полный квадрат по x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y² = (x² + 2ax)/b → by² = x² + 2ax.</li><li>x² + 2ax + a² = by² + a² → (x + a)² = by² + a².</li><li>x = (by² + a²)^(1/2) − a.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли a².</li><li>C — b² y вместо by².</li><li>D — без корня.</li><li>E — −a внутри корня.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x² + 2ax — неполный квадрат, добавьте a².</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m005_q02.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y² = z/x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,2 · 10¹³ / (3 · 10⁻⁶) = 0,4 · 10¹⁹ = 4 · 10¹⁸.</li><li>y = 2 · 10⁹.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — забыли корень из 4.</li><li>A, B — ошибка в степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √10¹⁸ = 10⁹.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m005_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2πr² + 2πrh = πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Делим на πr: 2r + 2h = rh.</li><li>h(r − 2) = 2r → h = 2r/(r − 2).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полная поверхность — с двумя основаниями.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m005_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычитаем показатели.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x: 6 − (−2) = 8.</li><li>y: −3 − 4 = −7.</li><li>z: 5 − 5 = 0.</li><li>x⁸/y⁷.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — x⁶/x⁻² = x⁸, не x⁴.</li><li>D — z не сокращён.</li><li>E — y¹.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на x⁻² = умножение на x².</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m005_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый новый квадрат — 5/9 площади предыдущего.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(1/3)² + (2/3)² = 5/9.</li><li>Четвёртый — три шага: (5/9)³ = 125/729.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — два шага.</li><li>B, E — коэффициент для стороны.</li><li>A — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Первый квадрат — исходный.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m005_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доля кислоты a/(a + 4) = 0,24.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 0,24a + 0,96 → 0,76a = 0,96 → a ≈ 1,26 л.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (0,96) — 24% от 4.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент — от всего раствора, а не от воды.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m005_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">BC ∥ DE → треугольники ABC и ADE подобны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = AB + BD = 4 + x − 4 = x.</li><li>BC/DE = AB/AD: x/(x + 3) = 4/x.</li><li>x² = 4x + 12 → x = 6.</li><li>DE = 9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — неверное подобие.</li><li>D, E — ошибка в AD.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соответственные стороны: AB ↔ AD, BC ↔ DE.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m005_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр: радиус r, высота 2r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Шар (4/3)πr³, цилиндр 2πr³ → 2/3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — ошибка в объёме.</li><li>B — формула конуса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Факт Архимеда: ⅔.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m005_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади ∝ d²: 1, 4, 9, 16 (в единицах πd²/4).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Заштриховано: (16 − 9) + (4 − 1) = 10 единиц.</li><li>10 · πd²/4 = (5/2)πd².</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без /4.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь через диаметр: πD²/4.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m005_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По определению y◇x = yˣ/x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2◇3 = 8/3.</li><li>(8/3)◇2 = (64/9)/2 = 32/9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — первый шаг.</li><li>D, A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок аргументов важен.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m005_q11.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратные действия в обратном порядке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y + 10 = 5(x/2 − 3)².</li><li>(x/2 − 3)² = (y + 10)/5 → x/2 − 3 = ±√((y + 10)/5).</li><li>x = ±2√((y + 10)/5) + 6.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — −6 вместо +6.</li><li>C — y − 10.</li><li>E — y + 50.</li><li>F — +3 (забыли умножить на 2).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последнее действие над x было «÷2, −3» — снимаем: «+3, ×2».</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m005_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Независимые события с возвращением — перемножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P(красный) = x/(x + y + z).</li><li>P(синий) = y/(x + y + z).</li><li>P = xy/(x + y + z)².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — знаменатели без возвращения/неверные.</li><li>A, D — сложение вместо умножения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Replaced» → вероятности не меняются.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m005_q13.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Функция t^(3/5) возрастает на всей прямой (нечётный корень).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x^(3/5) < y^(3/5) ⇔ x < y — достаточно ✓.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — чётная степень теряет знак.</li><li>C, D — 1/x меняет порядок, зависит от знаков.</li><li>F — даёт y < x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нечётные степени и корни сохраняют порядок.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m005_q14.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем точки в оба неравенства.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(1; 6): 6 ≥ 4 ✓; 1 ≥ 1/6 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — нарушают y ≥ x² + 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте сначала более строгое условие.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m005_q15.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В оригинале скобки в квадрате: (√5 − √2)² · (√5 + √2)². Перемножаем сначала скобки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√5 − √2)(√5 + √2) = 5 − 2 = 3.</li><li>3² = 9.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — раскрыли каждую скобку отдельно с ошибками.</li><li>C — сложили 5 + 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a²b² = (ab)². (В скане квадраты почти не видны.)</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m005_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем площадь поверхности и объём, приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь треугольника: (√3/4)(2x)² = √3x².</li><li>T = 2√3x² + 3 · 2x · d = 2√3x² + 6xd.</li><li>V = √3x² · d.</li><li>√3x²d − 6xd = 2√3x² → d = 2√3x/(√3x − 6) = 2x/(x − 2√3).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное деление на √3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делим числитель и знаменатель на √3.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m005_q17.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь = ½ · катет · катет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 + √2)(2 − √2) = 8 − 4√2 + 2√2 − 2 = 6 − 2√2.</li><li>½ → 3 − √2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — неверное раскрытие.</li><li>B, F — знаки.</li><li>D — забыли −2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √2 · √2 = 2.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m005_q18.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Члены 4, 4r, 4r³ образуют арифметическую прогрессию: средний = среднее соседних.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 4r = 4 + 4r³ → r³ − 2r + 1 = 0.</li><li>(r − 1)(r² + r − 1) = 0 → r = (√5 − 1)/2 (0 < r < 1).</li><li>S = 4/(1 − r) = 8/(3 − √5) = 8(3 + √5)/4 = 2(3 + √5).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это r/2... неверно.</li><li>B — знак.</li><li>C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> r = 1 — корень, его выделяем делением.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m005_q19.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Фигура = равносторонний треугольник + полукруг на AC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Треугольник: (√3/4)x² = 2√3x²/8.</li><li>Полукруг радиуса x/2: ½π(x/2)² = πx²/8.</li><li>Сумма: x²(2√3 + π)/8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — неверная площадь треугольника.</li><li>C — без треугольника.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус полукруга — половина стороны.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m005_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат каждый множитель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4x³y⁶/z.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — неверные показатели.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x^(3/2))² = x³; (√z)² = z.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m005_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не пересекаются ⇔ уравнение без действительных корней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 и 4: 1 − x² = x + 6 → x² + x + 5 = 0, D < 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Все другие пары дают уравнения с корнями.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте дискриминант.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m005_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычитаем дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(n + 1)/(n + 2) − n/(n + 1) = ((n + 1)² − n(n + 2))/((n + 1)(n + 2)).</li><li>Числитель: n² + 2n + 1 − n² − 2n = 1.</li><li>1/((n + 1)(n + 2)).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (n+1)-й член: подставьте n + 1 вместо n.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m005_q23.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² − (сумма)x + произведение = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 7x + 9 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак суммы.</li><li>B, D — знак произведения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Виета.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m005_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол A лежит против BC = 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 = 9 + 4 − 2 · 3 · 2 · cos A.</li><li>cos A = (13 − 16)/12 = −1/4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Положительные варианты — перепутали стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Против наибольшей стороны — наибольший угол; cos < 0 → угол тупой.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m005_q25.webp", "options": ["A", "B", "C", "D"], "correct": 3, "verified": false, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переносим всё влево и раскладываем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + 2x − 8 ≥ 0 → (x + 4)(x − 2) ≥ 0.</li><li>x ≤ −4 или x ≥ 2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — промежуток между корнями (для ≤ 0).</li><li>A — неполно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ≥ 0 — снаружи корней.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m005_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для целых y: y² ≥ y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x > y² ≥ y → x > y.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — есть контрпримеры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте и отрицательные числа.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m005_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = 2^x: положительна, возрастает, проходит через (0; 1), слева прижимается к оси x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это график B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — симметричный (1/x²).</li><li>C — логарифм.</li><li>D — убывающая (2^(−x)).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Показательная функция никогда не пересекает ось x.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m005_q28.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к одной степени 10⁷.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 7y = 4,6 + 1,4 = 6 (·10⁷).</li><li>x − 2y = 4,6 − 0,4 = 4,2 (·10⁷).</li><li>6/4,2 = 10/7.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки с порядками.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2 · 10⁶ = 0,2 · 10⁷.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m005_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перпендикуляр из центра делит хорду пополам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>DB = 8, OB = 10 → OD = 6.</li><li>OC = 10 → CD = 10 − 6 = 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — неверное OD.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6-8-10.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m005_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый следующий треугольник подобен предыдущему; его больший катет — гипотенуза предыдущего.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Малый: катеты 1 и 3, гипотенуза √10, площадь 1,5.</li><li>Коэффициент подобия k = √10/3 → площадь × 10/9 на каждом шаге.</li><li>Наибольший (два шага): 1,5 · (10/9)² = 1,5 · 100/81 = 50/27.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — неверный коэффициент.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь растёт в k² раз.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">

    <div class="row">

      <button class="back" id="plGateBack">Back to the list</button>
    </div>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
