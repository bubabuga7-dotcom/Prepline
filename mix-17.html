<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Solve the system of exponential equations for x and y:</p><p>\\(2^x * 4^y = 32\\)</p><p>\\(\\frac{9^x}{3^y} = 3\\)</p>", "image": "", "options": ["\\(x = 1/5, y = 2\\)", "\\(x = 2/3, y = 1/3\\)", "\\(x = 7/5, y = 9/5\\)", "\\(x = 1, y = 1\\)", "\\(x = 2, y = 1/5\\)"], "correct": 2, "verified": true, "src": "M38", "orig": "images/q-5cbebdadcd.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждое уравнение приводим к одному основанию → линейная система.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2<sup>x</sup> · 2<sup>2y</sup> = 2⁵ → x + 2y = 5.</li><li>3<sup>2x</sup> / 3<sup>y</sup> = 3¹ → 2x − y = 1.</li><li>y = 2x − 1 → x + 4x − 2 = 5 → x = <span class=\"fr\"><span>7</span><span>5</span></span>, y = <span class=\"fr\"><span>9</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (1; 1) — 1 + 2 ≠ 5.</li><li>A, B, E — не удовлетворяют системе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте ответ в обоих уравнениях.</div></div>"}, {"id": 2, "text": "<p>Two similar cylinders have volumes of \\(16\\pi \\text{ cm}^3\\) and \\(54\\pi \\text{ cm}^3\\). The height of the smaller cylinder is 4 cm. What is the height of the larger cylinder?</p>", "image": "", "options": ["6 cm", "8 cm", "9 cm", "12 cm", "13.5 cm"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-5bdfe08160.jpg", "review": true, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объёмы подобных тел ∝ k³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>54</span><span>16</span></span> = <span class=\"fr\"><span>27</span><span>8</span></span> → k = ∛<span class=\"fr\"><span>27</span><span>8</span></span> = <span class=\"fr\"><span>3</span><span>2</span></span>.</li><li>Высота: 4 · 1,5 = 6 см.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (13,5) — умножили на <span class=\"fr\"><span>27</span><span>8</span></span>.</li><li>C (9) — на <span class=\"fr\"><span>9</span><span>4</span></span>.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Из отношения объёмов → кубический корень.</div></div>"}, {"id": 3, "text": "<p>Calculate the value of P in standard form given:</p><p>\\(A = 4 \\times 10^{5},\\quad B = 2 \\times 10^{-3},\\quad P = \\dfrac{A}{B^{2}}\\)</p>", "image": "", "options": ["\\(10 \\times 10^{10}\\)", "\\(1 \\times 10^{11}\\)", "\\(2 \\times 10^{8}\\)", "\\(2 \\times 10^{11}\\)", "\\(4 \\times 10^{11}\\)"], "correct": 1, "verified": true, "src": "M38", "orig": "images/q-ac703cc97b.jpg", "review": true, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим B в квадрат и делим степени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B² = 4 · 10⁻⁶.</li><li>P = 4 · 10⁵ / (4 · 10⁻⁶) = 10¹¹.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не стандартная форма.</li><li>C, D, E — ошибки в степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 10⁵ / 10⁻⁶ = 10¹¹.</div></div>"}, {"id": 4, "text": "<p>If the roots of the quadratic equation \\(2x^2 - 5x + k = 0\\) are α and β, and it is given that \\(\\alpha^2 + \\beta^2 = \\frac{13}{4}\\), find the value of k.</p>", "image": "", "options": ["1", "2", "3", "4", "-2"], "correct": 2, "verified": true, "src": "M38", "orig": "images/q-00620ab644.jpg", "review": true, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Виета + α² + β² = (α + β)² − 2αβ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>α + β = <span class=\"fr\"><span>5</span><span>2</span></span>, αβ = <span class=\"fr\"><span>k</span><span>2</span></span>.</li><li><span class=\"fr\"><span>25</span><span>4</span></span> − k = <span class=\"fr\"><span>13</span><span>4</span></span> → k = 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не дают <span class=\"fr\"><span>13</span><span>4</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте делить на a = 2.</div></div>"}, {"id": 5, "text": "<p>In triangle ABC, a line segment DE is drawn parallel to BC, with D on AB and E on AC.</p><p>The area of triangle ADE is 16 cm\\(^2\\) and the area of the trapezium DBCE is 33 cm\\(^2\\).</p><p>What is the ratio of the lengths AD:DB?</p>", "image": "images/q-101140ea3c.jpg", "options": ["16 : 33", "4 : 7", "4 : 3", "3 : 4", "16 : 4"], "correct": 2, "verified": true, "src": "M38", "orig": "images/q-101140ea3c.jpg", "review": true, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади подобных треугольников ∝ k².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S(ABC) = 16 + 33 = 49.</li><li><span class=\"fr\"><span>AD</span><span>AB</span></span> = √<span class=\"fr\"><span>16</span><span>49</span></span> = <span class=\"fr\"><span>4</span><span>7</span></span>.</li><li>AD : DB = 4 : 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (4 : 7) — AD : AB.</li><li>A, E — отношение площадей.</li><li>D — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> DB = AB − AD → 7 − 4 = 3.</div></div>"}, {"id": 6, "text": "<p>Make g the subject of the formula for the period of a pendulum:</p><p>\\(T = 2\\pi\\sqrt{\\dfrac{L}{g}}\\)</p>", "image": "", "options": ["\\(g = \\dfrac{T^2}{4\\pi L}\\)", "\\(g = \\dfrac{2\\pi T^2}{\\pi^2}\\)", "\\(g = \\dfrac{4\\pi^2 L}{T^2}\\)", "\\(g = \\dfrac{4\\pi T^2}{\\pi^2}\\)"], "correct": 2, "verified": true, "src": "M38", "review": true, "orig": "images/q-1038e87832.jpg", "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем корень, возводим в квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>T</span><span>2π</span></span> = √<span class=\"fr\"><span>L</span><span>g</span></span>.</li><li><span class=\"fr\"><span>T²</span><span>4π²</span></span> = <span class=\"fr\"><span>L</span><span>g</span></span>.</li><li>g = <span class=\"fr\"><span>4π²L</span><span>T²</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перевёрнуто и π не в квадрате.</li><li>B, D — L потеряна.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: g растёт при уменьшении T — ✓ (T в знаменателе).</div></div>"}, {"id": 7, "text": "<p>Which pair of linear equations represents lines that will never intersect?</p><ol><li>\\(y = 5x - 2\\)</li><li>\\(y = 2x + 5\\)</li><li>\\(y = 5x + 10\\)</li><li>\\(y = -5x - 2\\)</li></ol>", "image": "", "options": ["2 and 4", "1 and 3", "1 and 2", "1 and 4"], "correct": 1, "verified": true, "src": "M38", "review": true, "orig": "images/q-d6d9efdca2.jpg", "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не пересекаются — параллельны: одинаковый наклон, разный свободный член.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклоны: 5, 2, 5, −5.</li><li>1 и 3: оба 5, перехваты −2 и 10 → параллельны.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — разные наклоны → пересекаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наклоны 5 и −5 — не параллельны.</div></div>"}, {"id": 8, "text": "<p>A solid metal shape is formed by joining a hemisphere to the base of a cone. The cone and the hemisphere have the same radius r = 6 cm. The height of the cone is h = 8 cm.</p><p>What is the total volume of the solid?</p>", "image": "images/q-5c58236313.jpg", "options": ["\\(240\\pi\\) cm\\(^3\\)", "\\(288\\pi\\) cm\\(^3\\)", "\\(384\\pi\\) cm\\(^3\\)", "\\(96\\pi\\) cm\\(^3\\)", "\\(192\\pi\\) cm\\(^3\\)"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-5c58236313.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём конуса + объём полушара.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конус: ⅓π · 36 · 8 = 96π.</li><li>Полушар: ⅔π · 216 = 144π.</li><li>240π.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — только конус.</li><li>B — целый шар без конуса.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полушар = ⅔πr³.</div></div>"}, {"id": 9, "text": "<p>Simplify the following expression as much as possible:</p><p>\\(\\dfrac{x}{x+2} - \\dfrac{x^2-4}{x^2+5x+6}\\)</p>", "image": "", "options": ["\\(\\dfrac{4}{x+3}\\)", "\\(\\dfrac{3x+4}{x^2+5x+6}\\)", "\\(\\dfrac{3x-4}{(x+2)(x+3)}\\)", "\\(\\dfrac{x+3}{x+4}\\)"], "correct": 1, "verified": true, "src": "M38", "review": true, "orig": "images/q-63baa7f5b8.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сокращаем вторую дробь, затем общий знаменатель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>x² − 4</span><span>x² + 5x + 6</span></span> = (x − 2)<span class=\"fr\"><span>x + 2</span><span>(x + 2)(x + 3)</span></span> = <span class=\"fr\"><span>x − 2</span><span>x + 3</span></span>.</li><li>Общий знаменатель (x + 2)(x + 3).</li><li>x(x + 3) − (x − 2)(x + 2) = x² + 3x − x² + 4 = 3x + 4.</li><li><span class=\"fr\"><span>3x + 4</span><span>x² + 5x + 6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак у 4.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> −(x − 2)(x + 2) = −x² + 4 — следите за знаком.</div></div>"}, {"id": 11, "text": "<p>Three circles, centered at A, B, and C, are exteriorly tangent to one another. The circle with center A has radius 3. The circle with center C has radius 2. The circle with center B has radius 5. The measure of \\(\\angle BAC\\) is \\(\\pi/3\\) (in radians). What is the measure of \\(\\angle ABC\\)?</p>", "image": "images/q-d9e3083f42.jpg", "options": ["\\(\\pi/4\\)", "\\(\\arccos(11/14)\\)", "\\(\\arccos(3/8)\\)", "\\(\\pi/6\\)", "\\(\\pi/7\\)"], "correct": 1, "verified": true, "src": "M38", "orig": "images/q-d9e3083f42.jpg", "review": true, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касающиеся окружности: расстояния между центрами = суммы радиусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = 8, AC = 5, BC = 7.</li><li>По теореме косинусов в B: cos B = <span class=\"fr\"><span>64 + 49 − 25</span><span>2 · 8 · 7</span></span> = <span class=\"fr\"><span>88</span><span>112</span></span> = <span class=\"fr\"><span>11</span><span>14</span></span>.</li><li>∠ABC = arccos<span class=\"fr\"><span>11</span><span>14</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — косинус для другого угла.</li><li>A, D, E — «красивые» углы, не подходят.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол <span class=\"fr\"><span>π</span><span>3</span></span> при A — проверка: 7² = 64 + 25 − 40 ✓.</div></div>"}, {"id": 14, "text": "<p>Find the equation of the perpendicular bisector of the line segment joining the points A(-2, 5) and B(4, 1).</p>", "image": "", "options": ["\\(y = \\left(\\frac{3}{2}\\right)x + \\frac{3}{2}\\)", "\\(y = \\left(-\\frac{2}{3}\\right)x + \\frac{11}{3}\\)", "\\(y = \\left(\\frac{3}{2}\\right)x + \\frac{11}{3}\\)", "\\(y = \\left(\\frac{3}{2}\\right)x - \\frac{3}{2}\\)", "\\(y = \\left(-\\frac{2}{3}\\right)x + 3\\)"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-053f9d233a.jpg", "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Серединный перпендикуляр: через середину, наклон <span class=\"fr\"><span>−1</span><span>k</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Середина: (1; 3).</li><li>Наклон AB = <span class=\"fr\"><span>−4</span><span>6</span></span> = <span class=\"fr\"><span>−2</span><span>3</span></span> → перпендикуляр <span class=\"fr\"><span>3</span><span>2</span></span>.</li><li>y = 1,5(x − 1) + 3 = 1,5x + 1,5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — наклон самого AB.</li><li>C, D — неверный перехват.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: середина (1; 3) на прямой: 1,5 + 1,5 = 3 ✓.</div></div>"}, {"id": 15, "text": "<p>Simplify \\(4 * (2 * (5^2 - 3 * 7) + \\sqrt{625})^{0.5} + 12\\)</p>", "image": "", "options": ["\\(4\\sqrt{33}\\)", "\\(4(\\sqrt{33} + 1)\\)", "\\(4(\\sqrt{33} + 3)\\)", "\\(4(\\sqrt{33} + 4)\\)"], "correct": 2, "verified": true, "src": "M38", "review": true, "orig": "images/q-1eade6bad5.jpg", "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Порядок действий: скобки изнутри.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5² − 3 · 7 = 25 − 21 = 4.</li><li>2 · 4 + √625 = 8 + 25 = 33.</li><li>4√33 + 12 = 4(√33 + 3).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли 12.</li><li>B, D — неверный множитель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите общий множитель 4.</div></div>"}, {"id": 17, "text": "<p>ABC is an isosceles triangle where AB=AC=10 cm and the base BC=12 cm. What is the value of the tangent of angle ABC?</p>", "image": "", "options": ["\\(\\frac{3}{4}\\)", "\\(\\frac{4}{3}\\)", "\\(\\frac{5}{3}\\)", "\\(\\frac{3}{5}\\)", "\\(\\frac{2}{3}\\)"], "correct": 1, "verified": true, "src": "M38", "orig": "images/q-67f9c9645d.jpg", "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота из A делит основание пополам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Половина основания 6, высота √(100 − 36) = 8.</li><li>tg B = <span class=\"fr\"><span>8</span><span>6</span></span> = <span class=\"fr\"><span>4</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перевёрнуто.</li><li>C, D — с гипотенузой.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6-8-10 — пифагорова тройка.</div></div>"}, {"id": 18, "text": "<p>A school fundraiser splits its profits between three departments: Science, Art, and Sports, in the ratio 3:4:7. The Sports department received £2,800. What was the total amount of money raised during the fundraiser? (Why science so small ☹)</p>", "image": "", "options": ["2000", "2600", "3000", "4600", "5600"], "correct": 4, "verified": true, "src": "M38", "orig": "images/q-2f2242a066.jpg", "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Спорт — 7 частей из 14.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 часть = <span class=\"fr\"><span>2800</span><span>7</span></span> = 400.</li><li>Всего 14 · 400 = 5600.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — неверное число частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма частей 3 + 4 + 7 = 14.</div></div>"}, {"id": 20, "text": "<p>In the figure below, O is the center of a quarter circle. The radius of the circle is R=OA=OB=10 cm. A straight chord connects point A and point B, creating a right-angled triangle △OAB within the sector.</p><p>Find the area of the shaded segment (the region between the arc AB and the chord AB). <em>(Use π=3.14 for this calculation)</em></p>", "image": "images/q-856d6280e4.jpg", "options": ["25.0 cm", "28.5 cm", "50.0 cm", "78.5 cm"], "correct": 1, "verified": true, "src": "M38", "review": true, "orig": "images/q-856d6280e4.jpg", "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сегмент = четверть круга − прямоугольный треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Четверть: ¼ · 3,14 · 100 = 78,5.</li><li>Треугольник: ½ · 10 · 10 = 50.</li><li>Сегмент: 28,5 см².</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — вся четверть.</li><li>C — треугольник.</li><li>A — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сегмент всегда = сектор − треугольник.</div></div>"}, {"id": 21, "text": "<p>Solve the inequality: \\(\\frac{(2x-5)}{(x+3)} \\leq 1\\)</p>", "image": "", "options": ["-3 &lt; x ≤ 8", "x &lt; -3 or x ≥ 8", "-3 &lt; x ≤ 2", "x ≤ 8", "x &gt; -3"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-c43bb65f03.jpg", "review": true, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переносим 1 влево и решаем методом интервалов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2x − 5</span><span>x + 3</span></span> − 1 = <span class=\"fr\"><span>x − 8</span><span>x + 3</span></span> ≤ 0.</li><li>Нули: 8 (входит), −3 (выколота).</li><li>−3 < x ≤ 8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — противоположные промежутки.</li><li>C — неверный корень.</li><li>D, E — неполно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нельзя умножать на (x + 3) без учёта знака — используйте интервалы.</div></div>"}, {"id": 22, "text": "<p>If \\(\\frac{4^x+4^x+4^x+4^x}{8^x+8^x}= 2^{10}\\) what is the value of x?</p>", "image": "", "options": ["-9", "-8", "-7", "8", "9"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-73cecc9c75.jpg", "review": true, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем суммы одинаковых степеней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 4<sup>x</sup> = 2² · 2<sup>2x</sup> = 2<sup>2x+2</sup>.</li><li>2 · 8<sup>x</sup> = 2<sup>3x+1</sup>.</li><li>2<sup>2x + 2 − 3x − 1</sup> = 2<sup>1 − x</sup> = 2¹⁰ → x = −9.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — знак.</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4<sup>x</sup> + 4<sup>x</sup> + 4<sup>x</sup> + 4<sup>x</sup> = 4 · 4<sup>x</sup>.</div></div>"}, {"id": 23, "text": "<p>The figure shows a sector of a circle with center O. The area of the sector is 27 cm , and the length of the arc is 9 cm.</p><p>What is the area of the remainder of the circle (the major sector)?</p>", "image": "images/q-f6092b722c.jpg", "options": ["\\(36\\pi\\) cm\\(^2\\)", "\\((25\\pi - 27)\\) cm\\(^2\\)", "\\(25\\pi\\) cm\\(^2\\)", "\\((36\\pi - 27)\\) cm\\(^2\\)", "\\(81\\) cm\\(^2\\)"], "correct": 3, "verified": true, "src": "M38", "orig": "images/q-f6092b722c.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь сектора = ½ · r · дуга.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>27 = ½ · r · 9 → r = 6.</li><li>Круг: 36π.</li><li>Остаток: 36π − 27.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — весь круг.</li><li>B, C — неверный радиус.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобная формула без угла: S = ½rl.</div></div>", "topic": "M5.16"}, {"id": 24, "text": "<p>Find the set of values of k for which the line y = 2x + k intersects the curve \\(y = x^2 + 5x - 4\\) at two distinct points.</p>", "image": "", "options": ["k &gt; -25/4", "k &lt; -25/4", "k &gt; 25/4", "k &lt; 25/4", "k &gt; 0"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-7b23de45be.jpg", "review": true, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две точки пересечения ⇔ D > 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + 3x − (4 + k) = 0.</li><li>D = 9 + 4(4 + k) > 0 → 25 + 4k > 0 → k > <span class=\"fr\"><span>−25</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — нет пересечения.</li><li>C, D, E — ошибка в знаке.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перенесите всё в одну сторону перед вычислением D.</div></div>"}, {"id": 25, "text": "<p>Currently, the ratio of the ages of a father and his son is 4:1. In 20 years, the ratio will be 2:1. Find the sum of their ages in 5 years.</p>", "image": "", "options": ["8", "24", "32", "60", "96"], "correct": 3, "verified": true, "src": "M38", "orig": "images/q-f777ae0975.jpg", "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возрасты 4s и s; через 20 лет отношение 2 : 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4s + 20 = 2(s + 20) → 2s = 20 → s = 10, отец 40.</li><li>Через 5 лет: 15 + 45 = 60.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — сумма сейчас (50) или ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Через 5 лет прибавляем 5 к <b>каждому</b>.</div></div>"}, {"id": 26, "text": "<p>Consider vectors</p><p>\\(\\vec{a} = (2,\\ 3)\\), \\(\\vec{b} = (5,\\ 6)\\), \\(\\vec{c} = (-4, -2)\\)</p><p>Find the answer for expression 4A-B+2C?</p>", "image": "", "options": ["(0,\\ 0)", "(-5,\\ 2)", "(-7,\\ 4)", "(2,\\ -6)", "(5,\\ 0)"], "correct": 1, "verified": true, "src": "M38", "orig": "images/q-5781980fa0.jpg", "review": true, "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Действия с векторами покомпонентно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4a = (8; 12); −b = (−5; −6); 2c = (−8; −4).</li><li>Сумма: (−5; 2).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — ошибки знаков.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте x и y отдельно.</div></div>"}, {"id": 27, "text": "<p>In the figure below, ABCD is a large rectangle with an area of 120 cm . Points E, F, G, and H are placed on the sides such that they divide each side in a specific ratio:</p><ul><li>AE=1/4AB</li><li>BF=1/3BC</li><li>CG=1/4CD</li><li>DH=1/3DA</li></ul><p>Find the area of quadrilateral EFGH.</p>", "image": "images/q-a20a4b34e1.jpg", "options": ["50 cm", "60 cm", "70 cm", "80 cm"], "correct": 2, "verified": true, "src": "M38", "review": true, "orig": "images/q-a20a4b34e1.jpg", "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычитаем из прямоугольника четыре угловых треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = 4a, BC = 3b → 12ab = 120 → ab = 10.</li><li>Угловые треугольники: ½ · 3a · b, ½ · 2b · a, ½ · 3a · b, ½ · 2b · a.</li><li>Сумма: 1,5ab + ab + 1,5ab + ab = 5ab = 50.</li><li>EFGH = 120 − 50 = 70.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (50) — площадь треугольников.</li><li>B, D — неверные отрезки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно задать стороны кратными знаменателям (4a, 3b).</div></div>"}, {"id": 28, "text": "<p>In an arithmetic progression, the sum of the first n terms is given by \\(S_n = 4n^2 - n\\). (This is not the general formula, it is for the sake of this problem only).</p><p>What is the 6th term of this sequence?</p>", "image": "", "options": ["43", "138", "141", "47", "39"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-5f56f46380.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n-й член = Sₙ − Sₙ₋₁.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S₆ = 144 − 6 = 138.</li><li>S₅ = 100 − 5 = 95.</li><li>a₆ = 43.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (138) — это S₆.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> aₙ = Sₙ − Sₙ₋₁ — универсальная формула.</div></div>"}, {"id": 29, "text": "<p>Two numbers are in the ratio 3:5. If 4 is added to both numbers, the ratio becomes 2:3. What is the smaller of the original numbers?</p>", "image": "", "options": ["9", "12", "15", "18", "21"], "correct": 1, "verified": true, "src": "M38", "orig": "images/q-b5bddbaa26.jpg", "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числа 3k и 5k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>3k + 4</span><span>5k + 4</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span> → 9k + 12 = 10k + 8 → k = 4.</li><li>Меньшее: 12.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не дают 2 : 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: <span class=\"fr\"><span>16</span><span>24</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span> ✓.</div></div>"}, {"id": 30, "text": "<p>Determine the coordinates of the center and the radius of the circle with the equation:</p><p>\\(x^{2} + y^{2} - 6x + 8y = 0\\)</p>", "image": "", "options": ["Center (3, -4), Radius = 5", "Center (-3, 4), Radius = 5", "Center (3, -4), Radius = 25", "Center (6, -8), Radius = 5", "Center (-3, 4), Radius = 25"], "correct": 0, "verified": true, "src": "M38", "orig": "images/q-befbe6e19e.jpg", "review": true, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Полные квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 3)² − 9 + (y + 4)² − 16 = 0.</li><li>(x − 3)² + (y + 4)² = 25 → центр (3; −4), r = 5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — знаки.</li><li>C, E — радиус = r².</li><li>D — без деления на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Окружность проходит через начало координат (свободного члена нет).</div></div>"}, {"id": 31, "topic": "M4.14", "text": "<p>Find the gradient of the line joining \\((-1, -4)\\) and \\((3, 4)\\).</p>", "image": "", "options": ["2", "−2", "1", "\\(\\dfrac{1}{2}\\)", "4"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m = <span class=\"fr\"><span>y₂ − y₁</span><span>x₂ − x₁</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 − (−4)) : (3 − (−1)) = 2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ошибка в знаке.</li><li>D — Δx/Δy вместо Δy/Δx.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте в одном порядке сверху и снизу.</div></div>", "src": "PL"}, {"id": 32, "topic": "M1.1", "text": "<p>A metal has density 2.5 g/cm³. A block of it has volume 50 cm³.</p><p>What is the mass of the block?</p>", "image": "", "options": ["0.05 g", "12.5 g", "20 g", "125 g", "175 g"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Масса = плотность × объём.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2,5 · 50 = 125 г. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — разделили плотность на объём.</li><li>C — разделили объём на плотность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Треугольник m = ρ·V помогает не перепутать.</div></div>", "src": "PL"}, {"id": 33, "topic": "M4.3", "text": "<p>Find the value of \\(2a^2 - 3ab + b^2\\) when \\(a = 5\\) and \\(b = -2\\).</p>", "image": "", "options": ["−16", "24", "76", "84", "134"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляйте отрицательные числа в скобках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2·(5)² = 50; −3·(5)·(−2) = 30; (−2)² = 4.</li><li>Сумма: 84. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посчитали a² как отрицательное число.</li><li>E — возвели в квадрат 2a.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (−3)² = 9, а −3² = −9.</div></div>", "src": "PL"}, {"id": 34, "topic": "M2.10", "text": "<p>Arman spends \\(\\dfrac{1}{3}\\) of his money on a game and \\(\\dfrac{1}{2}\\) of what is left on lunch. He has ₸3000 left.</p><p>How much did he start with?</p>", "image": "", "options": ["₸4500", "₸5500", "₸9000", "₸9600", "₸18,000"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Остаток = (1 − <span class=\"fr\"><span>1</span><span>3</span></span>)(1 − <span class=\"fr\"><span>1</span><span>2</span></span>) от начальной суммы = <span class=\"fr\"><span>1</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3000 : <span class=\"fr\"><span>1</span><span>3</span></span> = 9000. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли про обед.</li><li>B — прибавили доли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Работайте с остатками, а не с потраченным.</div></div>", "src": "PL"}, {"id": 35, "topic": "M4.2", "text": "<p>Simplify \\(\\dfrac{10x^{4}}{5x^{-2}}\\).</p>", "image": "", "options": ["\\(2 x^{-6}\\)", "\\(5 x^{6}\\)", "\\(2 x^{-2}\\)", "\\(2 x^{2}\\)", "\\(2 x^{6}\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коэффициенты делятся, показатели вычитаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 : 5 = 2; 4 − (−2) = 6. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычитали в обратном порядке.</li><li>B — вычли коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> xᵃ / xᵇ = xᵃ⁻ᵇ.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="vendor/supabase/supabase.js?v=2.118.0"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){

        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
