<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {

  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;

  }
  .review-item {

  @media (max-width: 480px) {

  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q8 · Main conclusion</p>", "image": "images/ct-pp/ct043_q01.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "The 'No, really?' mocks research that 'proves' what everyone already knows, like the chocolate and blonde examples. The author goes on to agree with the finding — D."}, {"id": 2, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q9 · Drawing a conclusion</p>", "image": "images/ct-pp/ct043_q02.webp", "options": ["A", "B", "C", "D"], "correct": 0, "explain": "Twice the money with more misery shows only that wealth doesn't necessarily bring happiness — A. It says nothing about children specifically or about less wealth making them happier."}, {"id": 3, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q10 · Assumption</p>", "image": "images/ct-pp/ct043_q03.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "Kahneman's link is that success takes time and energy away from other things. It needn't assume shorter hours give children more time (1). It needn't assume failure is stress-free (2). Neither — D."}, {"id": 4, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q11 · Drawing a conclusion</p>", "image": "images/ct-pp/ct043_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "The support is one story about a family the author knows and a two-year-old. That's anecdotal evidence — B."}, {"id": 5, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q15 · Weaken</p>", "image": "images/ct-pp/ct043_q05.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "The argument finds extreme sports puzzling, because sport is meant to relieve the pressures of work. If people want to escape the safety obsession at work, risky sport makes sense — B."}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct043_q06.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 2, "explain": "J months: Jan, Jun, Jul. A: Apr, Aug. M: Mar, May. Alice–Michael 5 months apart: only Aug–Mar works. Jenny 2 months from August: June. June to March = 3 months — C."}, {"id": 7, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q17 · Weaken</p>", "image": "images/ct-pp/ct043_q07.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "The argument says lack of sleep causes memory loss. Memory loss could cause poor sleep instead (1), or ageing could cause both (3). Individual variation (2) doesn't touch the causal claim — D."}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct043_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "In September the month is 09. The other three numbers must be different non-zero squares other than 9. Hour: 01, 04, 16 (3). Day: 01, 04, 16, 25 excluding the hour (3). Minute: 01, 04, 16, 25, 36, 49 excluding both (4). 3 × 3 × 4 = 36 — B."}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct043_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "Look at which coloured regions touch X. The colours of its neighbours rule some out, and the rest of the map can be recoloured to allow the others. X could only be yellow, blue or red — B."}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct043_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "A circle inside one square, or one whose pieces line up with the pattern, can use the existing colours. But a circle crossing squares can create regions that touch both colours, so it needs a third colour. Never more than one extra — C."}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q21 · Problem solving</p>", "image": "images/ct-pp/ct043_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "Any map made only from straight lines that cross the whole island can be coloured with 2 colours: swap the colours on one side of each line. 2 always suffice — A."}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q22 · Problem solving</p>", "image": "images/ct-pp/ct043_q12.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "Each pyramid's 5 side faces form a ring of 5, an odd number, so 2 colours can't alternate around it. 3 colours do work — B."}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q23 · Problem solving</p>", "image": "images/ct-pp/ct043_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "Compare tiles by their pattern of black and white (allowing rotations). Corner, edge and centre tiles of the motifs give 8 distinct types — D."}, {"id": 14, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q24 · Strengthen</p>", "image": "images/ct-pp/ct043_q14.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "The argument is that lower consumption needs higher prices. If Scottish consumption doubled as prices fell, price clearly drives consumption — B."}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct043_q15.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 1, "explain": "The clocks are 41 minutes apart. Check every time: only 19:56/20:37 and 19:57/20:38 use 8 different digits. Across these two minutes 0, 1, 2, 3, 5, 6, 7, 8, 9 all appear. Only 4 never does — B."}, {"id": 16, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q26 · Problem solving</p>", "image": "images/ct-pp/ct043_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "Roll the die one triangle at a time, keeping track of which face lands down each time and using opposite faces adding to 9. After P, Q and R, the face down on S is 1 — A."}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q27 · Problem solving</p>", "image": "images/ct-pp/ct043_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "If Beth is unmarried, married Al is looking at her. If Beth is married, she is looking at unmarried Charles. Either way the answer is yes — C."}, {"id": 18, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q28 · Principle</p>", "image": "images/ct-pp/ct043_q18.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "The argument says schools should stop because children are harmed by seeing their animals slaughtered. The supporting principle is that children should be protected from harm — D."}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q29 · Problem solving</p>", "image": "images/ct-pp/ct043_q19.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "Fold the net and check each view: which faces meet at a corner and where their black squares are. Views 2, 4, 5 and 6 are possible, but 1 and 3 aren't — E."}, {"id": 20, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q30 · Assumption</p>", "image": "images/ct-pp/ct043_q20.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "The conclusion that wrinkles help us is based on better grip on wet objects. So it assumes gripping underwater is useful (1). The claim that this 'must have evolved' because of the advantage assumes advantageous traits evolve for that reason (3) — D."}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct043_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "Free numbers: 3, 4, 7, 8, 11. Bottom row 10 + e + 12 + d = 29, so e + d = 7 = 3 + 4. Right column b + c + 6 + d = 29. With d = 3, b + c = 20 is impossible, so d = 4, e = 3, b + c = 19 = 8 + 11. Top row 5 + 9 + a + b = 29, so a + b = 15: b = 8, a = 7, c = 11. Opposite 9 is e = 3 — A."}, {"id": 22, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct043_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "20% of 10,000 = 2,000 users. Their risk is 1.41 × 1% = 1.41%, and 1.41% of 2,000 ≈ 28 — B."}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q33 · Problem solving</p>", "image": "images/ct-pp/ct043_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "Per person: users 0.2 × 1.41 = 0.282, non-users 0.8 × 1 = 0.8. Total 1.082. The extra due to cannabis is 0.2 × 0.41 = 0.082, and 0.082/1.082 ≈ 8% — A."}, {"id": 24, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q34 · Weaken</p>", "image": "images/ct-pp/ct043_q24.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "If people prone to psychosis turn to drugs, the causation runs the other way: illness leads to cannabis use — B."}, {"id": 25, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q35 · Strengthen</p>", "image": "images/ct-pp/ct043_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "A dose–response link points to cause: stronger cannabis going with more psychosis among users strengthens it — C."}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct043_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "Both up: myspace, Facebook, LinkedIn, Meetup, Last.fm. Flixster's time fell, Reunion's both fell, myYearbook's both fell. 5 — D."}, {"id": 27, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q2 · Main conclusion</p>", "image": "images/ct-pp/ct043_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "The point is that, contrary to the usual view, herbivores have been more at risk of extinction than carnivores. The rest (specialisation, general traits) is support — C."}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct043_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "Rick, Gavin and Yasmin are fixed in positions 2, 4 and 5. Graham is ruled out (G clashes with Gavin). The first name can't be Betty and the third can't be Oscar. Bertha and Betty can't both be used. Oscar … Bertha fits all the rules — E."}, {"id": 29, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q4 · Drawing a conclusion</p>", "image": "images/ct-pp/ct043_q29.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "Compensation exceeds the sheep's value, and wolf attacks are hard to tell from attacks by the many wild dogs. So wolf-attack claims should be treated with caution — B."}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct043_q30.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 6, "explain": "Use the rule that no black squares may touch, even at corners. Check each tile against the black squares bordering the gap, rotating as needed. Only G fits — G."}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
