<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q8 · Main conclusion</p>", "image": "images/ct-pp/ct043_q01.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«No, really?» высмеивает исследования, которые «доказывают» очевидное.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Примеры с шоколадом и блондинками; дальше автор соглашается с выводом. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не главная мысль.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ирония в тексте — подсказка к выводу.</div></div>"}, {"id": 2, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q9 · Drawing a conclusion</p>", "image": "images/ct-pp/ct043_q02.webp", "options": ["A", "B", "C", "D"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Денег вдвое больше, а несчастья больше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, богатство не обязательно приносит счастье. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — про детей или «меньше денег — больше счастья», этого нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не расширяйте вывод.</div></div>"}, {"id": 3, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q10 · Assumption</p>", "image": "images/ct-pp/ct043_q03.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Связь Канемана: успех отнимает время и силы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не нужно допускать, что короткий день даст детям время (1), или что неудача без стресса (2). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают лишнее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте, нужен ли пункт для вывода.</div></div>"}, {"id": 4, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q11 · Drawing a conclusion</p>", "image": "images/ct-pp/ct043_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поддержка — история одной знакомой семьи и двухлетки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это анекдотические доказательства. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не тот тип доводов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один пример ≠ данные.</div></div>"}, {"id": 5, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q15 · Weaken</p>", "image": "images/ct-pp/ct043_q05.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автору непонятен экстрим, ведь спорт снимает рабочее напряжение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если люди бегут от одержимости безопасностью на работе — риск логичен. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не объясняют загадку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабить = объяснить «странное».</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct043_q06.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">J: янв, июн, июл; A: апр, авг; M: мар, май.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Алиса — Майкл через 5 месяцев: только авг — мар.</li><li>Дженни через 2 от августа: июнь.</li><li>Июнь → март = 3 месяца. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — нарушают разницы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с самой жёсткой пары.</div></div>"}, {"id": 7, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q17 · Weaken</p>", "image": "images/ct-pp/ct043_q07.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: недосып вызывает потерю памяти.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Может быть наоборот (1), или возраст вызывает оба (3).</li><li>Индивидуальные различия (2) не мешают. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причина и общая причина.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct043_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сентябрь = 09; остальные — разные ненулевые квадраты, не 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Час: 01, 04, 16 (3). День: без часа (3). Минута: без двух (4).</li><li>3 · 3 · 4 = 36. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не исключили повторы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Умножайте варианты по шагам.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct043_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Смотрим, какие цвета касаются X.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Остальную карту можно перекрасить; X — только жёлтый, синий или красный. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пропускают перекраску.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соседи ограничивают цвет.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct043_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Круг поверх клеток может касаться обоих цветов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужен максимум один дополнительный цвет. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — больше или меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте худший случай.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q21 · Problem solving</p>", "image": "images/ct-pp/ct043_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Карта из прямых через весь остров.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Меняем цвета по одну сторону каждой прямой — хватает 2 цветов. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — больше, чем нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая прямая — смена цвета.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q22 · Problem solving</p>", "image": "images/ct-pp/ct043_q12.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5 боковых граней пирамиды — кольцо из нечётного числа.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 цвета не чередуются, 3 — хватает. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не то число.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нечётный цикл требует 3 цвета.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q23 · Problem solving</p>", "image": "images/ct-pp/ct043_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем плитки по узору с учётом поворотов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угловые, краевые и центральные дают 8 типов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — считали повороты отдельно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поворот — тот же тип.</div></div>"}, {"id": 14, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q24 · Strengthen</p>", "image": "images/ct-pp/ct043_q14.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: меньше пить можно только при росте цен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в Шотландии потребление удвоилось при падении цен — цена решает. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про цену.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пример в обратную сторону тоже усиливает.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct043_q15.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Часы отличаются на 41 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только 19:<span class=\"fr\"><span>56</span><span>20</span></span>:37 и 19:<span class=\"fr\"><span>57</span><span>20</span></span>:38 дают 8 разных цифр.</li><li>В них есть 0, 1, 2, 3, 5, 6, 7, 8, 9 — нет только 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие цифры появляются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебор узкого диапазона.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q26 · Problem solving</p>", "image": "images/ct-pp/ct043_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Катим кубик по треугольникам, противоположные грани дают 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После P, Q, R внизу на S — 1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — ошибка в повороте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Записывайте нижнюю грань на каждом шаге.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q27 · Problem solving</p>", "image": "images/ct-pp/ct043_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рассмотрим оба случая для Бет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бет не замужем → на неё смотрит женатый Ал.</li><li>Бет замужем → она смотрит на неженатого Чарльза.</li><li>В любом случае «да». Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>«Нет» и «нельзя определить» — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбор случаев.</div></div>"}, {"id": 18, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q28 · Principle</p>", "image": "images/ct-pp/ct043_q18.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Школы должны прекратить: дети страдают от вида забоя своих животных.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Принцип: детей нужно защищать от вреда. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не поддерживают вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип = общее правило под выводом.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q29 · Problem solving</p>", "image": "images/ct-pp/ct043_q19.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем развёртку, проверяем углы и чёрные квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Возможны виды 2, 4, 5, 6; невозможны 1 и 3. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — неверный набор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смотрите, какие грани сходятся в углу.</div></div>"}, {"id": 20, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q30 · Assumption</p>", "image": "images/ct-pp/ct043_q20.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод о пользе морщин — по лучшему хвату мокрых предметов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущения: хват под водой полезен (1) и полезные признаки развиваются из-за пользы (3). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 2 или пропускают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Must have evolved» — скрытое допущение.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct043_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Свободные: 3, 4, 7, 8, 11.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Низ: e + d = 7 = 3 + 4. Справа при d = 3 — невозможно → d = 4, e = 3.</li><li>b + c = 19 = 8 + 11; верх a + b = 15 → b = 8, a = 7, c = 11.</li><li>Напротив 9 стоит 3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — нарушают суммы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте с самой маленькой суммы.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct043_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20% из 10 000 = 2000 потребителей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Риск 1,41 · 1% = 1,41%; 1,41% от 2000 ≈ 28. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — без учёта 1,41.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Относительный риск × базовый.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q33 · Problem solving</p>", "image": "images/ct-pp/ct043_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">На человека: потребители 0,282, остальные 0,8 → всего 1,082.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Лишнее из-за каннабиса: 0,2 · 0,41 = 0,082.</li><li>0,082 : 1,082 ≈ 8%. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доля = лишнее : всё.</div></div>"}, {"id": 24, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q34 · Weaken</p>", "image": "images/ct-pp/ct043_q24.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если склонные к психозу тянутся к наркотикам —</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>причинность обратная: болезнь ведёт к каннабису. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про направление связи.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причина.</div></div>"}, {"id": 25, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2013 · original Q35 · Strengthen</p>", "image": "images/ct-pp/ct043_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доза — эффект указывает на причину.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сильнее каннабис — больше психозов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дозовая зависимость усиливает причинность.</div></div>"}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct043_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Растут оба показателя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>myspace, Facebook, LinkedIn, Meetup, Last.fm — 5. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Flixster, Reunion, myYearbook — падают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте оба столбца.</div></div>"}, {"id": 27, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q2 · Main conclusion</p>", "image": "images/ct-pp/ct043_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вопреки обычному мнению, травоядные вымирали чаще хищников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это главный вывод, остальное — доводы. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — поддержка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Вопреки» часто вводит вывод.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct043_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Rick, Gavin, Yasmin — на местах 2, 4, 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Graham исключён (G уже есть). Первым не Betty, третьим не Oscar; Bertha и Betty не вместе.</li><li>Подходит Oscar … Bertha. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — нарушают правило.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Фиксируйте известные места.</div></div>"}, {"id": 29, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q4 · Drawing a conclusion</p>", "image": "images/ct-pp/ct043_q29.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Компенсация выше цены овцы, атаки волков сложно отличить от собак.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Заявки об атаках волков стоит проверять. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2014 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct043_q30.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 6, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чёрные клетки не касаются, даже углами.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проверяем каждую плитку с поворотами — подходит только G. Ответ G.</li></ol><div class=\"ex-a\">Ответ: <b>G</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — касаются чёрных.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте все 4 стороны и углы.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
