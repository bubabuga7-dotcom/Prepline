<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m029_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота треугольника из O к касательной PQ — радиус r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>πr² = ½ · PQ · r → PQ = 2πr.</li><li>PQ равна длине окружности → 1 : 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, E — потеряна двойка или π.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Касательная ⊥ радиусу — радиус и есть высота.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m029_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к √2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√2 + 2√2 + 3√2 = 6√2 = √72.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 6² без 2.</li><li>E — 12√2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a√b = √(a²b).</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m029_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол правильного 10-угольника 36°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Общая сторона вертикальна; каждая следующая сторона поворачивается на 36°.</li><li>Нижняя сторона десятиугольника (через одну) повернута на 72° от вертикали → 18° к горизонтали.</li><li>Верхняя сторона квадрата горизонтальна → x = 18°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (27), A (15) — неверный счёт поворотов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поворот направления = сумма внешних углов.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m029_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждую кривую на вершинах (0;0), (1;0), (1;1), (0;1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + y² = 1: (1;0), (0;1) → 2 ✓.</li><li>y = −x² + 1: (0;1), (1;0) → 2 ✓.</li><li>y = x: (0;0), (1;1) → 2 ✓.</li><li>y = x + 1 и y = 1/x — по одной вершине.</li><li>Итого 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропущена или добавлена кривая.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставляйте каждую вершину.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m029_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена литра.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40/50 = 0,8; 50/40 = 1,25.</li><li>1,25/0,8 = 1,5625 → +56%.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — неверный расчёт.</li><li>A — грубо.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте цену за единицу.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m029_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Образующая √(r² + 8r²) = 3r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A = πr² + 3πr² = 4πr².</li><li>V = ⅓πr² · 2√2r.</li><li>V/A = √2r/6 = 50√2 → r = 300.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — без основания в A.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √5000 = 50√2.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m029_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пересечения: (4;0), (6;0), (0;24). Центр окружности над x = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Степень начала: 4 · 6 = 24 · y₂ → второе пересечение с осью y: (0; 1) → центр (5; 12,5).</li><li>Подставим y = (x − 5)² − 1: получаем (x − 5)² = 1 или 25.</li><li>Новая точка: (10; 24) → расстояние √(100 + 576) = 26.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный центр.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Произведения отрезков секущих из одной точки равны.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m029_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма квадратов корней через Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a² − 2b = b² − 2a → (a − b)(a + b + 2) = 0.</li><li>a ≠ b → a + b = −2.</li><li>500 − 20 = 480.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — знак a + b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m029_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадрат 10 × 10; правая вершина треугольника — нижний правый угол квадрата, левая сторона проходит через верхний левый угол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Левая сторона под 60° → выступ слева 10/√3.</li><li>Сторона треугольника: 10 + 10/√3; периметр 30 + 10√3.</li><li>a = 30, b = 10, p = 3 → 210 + 50 + 9 = 269.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная сторона.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 10/√3 · 3 = 10√3.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m029_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Составляем уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,4a + 1,6b = 1,54(a + b) → 0,06b = 0,14a.</li><li>a : b = 3 : 7 → 33 + 91 = 124.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — перевёрнутое отношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средневзвешенное.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m029_q11.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 1, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол ABC = 270° − 150° = 120°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Равнобедренный с углом 120° → AC = AB√3.</li><li>AB = 16/√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — умножили вместо деления.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Основание = боковая × √3.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m029_q12.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Система.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d + q = 31; 0,1d + 0,25q = 5,95 → q = 19, d = 12.</li><li>4,75 − 1,20 = 3,55.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте d = 31 − q.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m029_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всё через 2ˣ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16ˣ + 8ˣ = 2²ˣ(2²ˣ + 2ˣ).</li><li>Сокращаем → √(2²ˣ) = 2ˣ.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без корня.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выносите общий множитель.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m029_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон −½.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y − 3 = −½(x − 4) → 2y + x = 10.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 11.</li><li>A, D — неверный наклон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> k₁ · k₂ = −1.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m029_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Суммарное смещение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Восток 3 − 6 = −3; север −4 + 8 = 4.</li><li>√(9 + 16) = 5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сумма путей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3-4-5.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m029_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нумеруем A=0 … E=4. R: i → i + 1; S: i → −i (mod 5). D = 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C: R R S R S R: 3 → 4 → 0 → 0 → 1 → 4 → 0 = A.</li><li>Остальные варианты возвращают D в 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — D на месте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отражение в оси y: A на месте, B ↔ E, C ↔ D.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m029_q17.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 4, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Женщины, сдавшие сразу: 200 − 143 = 57.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>167 − 57 = 110.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — женщины.</li><li>G — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не перепутайте «сдали» и «не сдали».</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m029_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">|2√n − 7| &lt; 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 &lt; √n &lt; 4 → 9 &lt; n &lt; 16.</li><li>n = 10 … 15 → 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — включили концы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m029_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S = 4πr².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4π(¼ + 1 + 4 + 9)r² = 57πr².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без ¼.</li><li>Остальные — ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (r/2)² = r²/4.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m029_q20.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 5, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x√y = const.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 · 3 = 24 → √y = 4 → y = 16.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная к корню.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m029_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">× 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4x + 8 − 9x + 9 &gt; 24 − 12x.</li><li>7x &gt; 7 → x &gt; 1.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки раскрытия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> −¾(x − 1) = −¾x + ¾.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m029_q22.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 5, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь 12-угольника = 3R² = 108.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(3√3/2)x² = 108 → x² = 24√3.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без √3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-43.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m029_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стороны a и 3a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(a − 1 + 3a − 1) = 36 → a = 5.</li><li>S = 5 · 15 = 75.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный a.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Срезаем по 1 см с каждой стороны.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m029_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">159 = 1,06 · x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 150.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 159 − 6% от 159.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент — от старого роста.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m029_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проволока = 3 прямых отрезка + дуги (вместе полная окружность).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Отрезки: 3 · 8 = 24.</li><li>Дуги: 2π · 4 = 8π.</li><li>8(π + 3).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — радиус вместо диаметра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма дуг — ровно одна окружность.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m029_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время Дэвида 54 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>54 · 1,8 = 97,2 мин = 1,62 ч.</li><li>70 · 1,62 = 113,4 ≈ 113 км.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное время.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Данные «50 км/ч, 45 км» — проверка: 45/50 = 0,9 ч ✓.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m029_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">÷ 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16/3,6 = 40/9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 км/ч = 5/18 м/с.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m029_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ребро 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>DB = 4√2 (диагональ грани).</li><li>S = 4√2 · 4 = 16√2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ребро 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прямоугольник: диагональ основания × высота.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m029_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём ÷ 125 → линейный масштаб ÷ 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь × 25 → 2500.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — × 5.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площади ∝ k².</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m029_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Половина стороны основания: √(169 − 144) = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона 10; боковая: 4 · ½ · 10 · 12 = 240.</li><li>+ основание 100 = 340.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без основания.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Апофема — высота боковой грани.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">

    <div class="row">

      <button class="back" id="plGateBack">Back to the list</button>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
