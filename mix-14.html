<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Solve the inequality:</p><p>\\(2(3 - x^2) &lt; 9x + 1\\)</p>", "image": "", "options": ["x&lt;-5 or x &gt; 1/2", "x &lt; 5/6 or x &gt; 1/2", "x &gt; 1", "x &lt; 1", "x &gt; 2.5"], "correct": 0, "verified": true, "src": "M35", "orig": "images/q-5ece6078d4.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переносим всё в одну сторону, раскладываем на множители.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 − 2x² < 9x + 1 → 2x² + 9x − 5 > 0.</li><li>(2x − 1)(x + 5) > 0 → корни −5 и ½.</li><li>Ветви вверх → больше 0 снаружи: x < −5 или x > ½.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — неверный корень.</li><li>C, D, E — однородные промежутки, а решение из двух частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При переносе знак у x² меняется — следите за направлением неравенства.</div></div>"}, {"id": 2, "text": "<p>The roots of the quadratic equation \\(x^2 + kx + 12 = 0\\) are \\(\\alpha\\) and \\(\\beta\\).</p><p>Given that \\(\\alpha^2 + \\beta^2 = 25\\), find the possible positive value of k.</p>", "image": "", "options": ["5", "6", "7", "8", "9"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-62c1cf92b2.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">α² + β² через Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>α + β = −k, αβ = 12.</li><li>α² + β² = k² − 24 = 25 → k² = 49 → k = 7.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (5) — k² = 25 без −24.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> α² + β² = (α + β)² − 2αβ.</div></div>"}, {"id": 3, "text": "<p>Simplify the expression: \\(\\dfrac{\\left(27^{\\frac{2}{3}}+16^{\\frac{3}{4}}\\right)}{\\left(4^{-\\frac{1}{2}}\\right)}\\)</p>", "image": "", "options": ["17", "34", "68", "9", "24"], "correct": 1, "verified": true, "src": "M35", "orig": "images/q-97d5728c37.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дробные степени: сначала корень, потом степень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>27<sup>2⁄3</sup> = 3² = 9.</li><li>16<sup>3⁄4</sup> = 2³ = 8.</li><li>4<sup>−1⁄2</sup> = ½.</li><li>17 ÷ ½ = 34.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (17) — забыли разделить на ½.</li><li>C (68) — разделили на ¼.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на ½ = умножение на 2.</div></div>"}, {"id": 5, "text": "<p>If \\(f(x) = 2x - 3\\) and \\(g(x) = x^2 + 1\\), find the value of \\(f(g(2))\\).</p>", "image": "", "options": ["1", "5", "7", "9", "11"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-63f3171854.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Композиция: сначала g, потом f.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>g(2) = 4 + 1 = 5.</li><li>f(5) = 10 − 3 = 7.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — g(f(2)) = 1² + 1 = 2? (порядок перепутан).</li><li>B — это g(2).</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> f(g(x)) — внутреннюю считаем первой.</div></div>"}, {"id": 6, "text": "<p>The third term of a geometric sequence is 12 and the fifth term is 48.</p><p>Which of the following could be the second term?</p>", "image": "", "options": ["3", "4", "6", "8", "10"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-76f5a2b47a.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знаменатель прогрессии через отношение членов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>u₅/u₃ = r² = 4 → r = ±2.</li><li>u₂ = <span class=\"fr\"><span>u₃</span><span>r</span></span> = <span class=\"fr\"><span>12</span><span>±2</span></span> = ±6 → 6 есть среди вариантов.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (3) — первый член при r = 2 (3, 6, 12).</li><li>B, D, E — не получаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Между 3-м и 5-м членом два шага → r².</div></div>"}, {"id": 7, "text": "<p>A large bowl contains a mixture of Fruit Punch that is 20% juice and 80% water.</p><ol><li>You add a certain amount of pure (100%) juice to the bowl. This causes the total volume of the liquid to increase by 25%.</li><li>After sitting in the sun, 10% of the new total volume (which is mostly water) evaporates</li></ol><p>What is the final percentage of juice in the mixture after these two steps?</p>", "image": "", "options": ["10%", "20%", "15%", "40%", "No change"], "correct": 3, "verified": true, "src": "M35", "orig": "images/q-04a521ba6e.jpg", "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем объёмы, взяв исходный объём 100.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Было: сок 20, всего 100.</li><li>Добавили 25 сока (объём +25%) → сок 45, всего 125.</li><li>Испарилось 10% от 125 = 12,5 (вода) → всего 112,5.</li><li><span class=\"fr\"><span>45</span><span>112,5</span></span> = 40%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — забыли добавленный сок.</li><li>A, C — неверный расчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Испаряется вода — сок остаётся.</div></div>"}, {"id": 8, "text": "<p>In the figure below, triangle ABC is a right-angled triangle at B. BD is the altitude to the hypotenuse AC.</p><p>If AD = 4 and DC = 9, what is the length of BD?</p>", "image": "images/q-e0004de284.jpg", "options": ["5", "6", "6.5", "13", "36"], "correct": 1, "verified": true, "src": "M35", "orig": "images/q-e0004de284.jpg", "review": true, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота из прямого угла к гипотенузе: BD² = AD · DC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>BD² = 4 · 9 = 36 → BD = 6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (36) — забыли корень.</li><li>D (13) — гипотенуза.</li><li>A, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота — среднее геометрическое отрезков гипотенузы.</div></div>"}, {"id": 9, "text": "<p>Find the possible solution pair (x, y) for the simultaneous equations:</p><p>\\(y = 2x^2 - 3x + 4\\) and \\(y = 4x + 1\\)</p>", "image": "", "options": ["(6, 3)", "(5, 4)", "(4, 15)", "(6, -3)", "(3, 13)"], "correct": 4, "verified": true, "src": "M35", "orig": "images/q-30c1bf0279.jpg", "review": true, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приравниваем y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² − 3x + 4 = 4x + 1 → 2x² − 7x + 3 = 0.</li><li>(2x − 1)(x − 3) = 0 → x = 3 или ½.</li><li>x = 3 → y = 13 → (3; 13).</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные пары не лежат на прямой y = 4x + 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте вариант на прямой — это быстрее.</div></div>"}, {"id": 10, "text": "<p>Evaluate: \\(\\dfrac{4}{\\sqrt{2}+\\sqrt{25}-\\sqrt{9}}\\)</p>", "image": "", "options": ["\\(1\\)", "\\(-2\\sqrt{2}+4\\)", "\\(\\sqrt{2}+3\\)", "\\(5\\)", "\\(-2\\sqrt{2}\\)"], "correct": 1, "verified": true, "src": "M35", "orig": "images/q-4343c76199.jpg", "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем знаменатель, затем избавляемся от корня.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√25 − √9 = 5 − 3 = 2 → знаменатель √2 + 2.</li><li><span class=\"fr\"><span>4</span><span>2 + √2</span></span> · <span class=\"fr\"><span>2 − √2</span><span>2 − √2</span></span> = 4<span class=\"fr\"><span>2 − √2</span><span>2</span></span> = 4 − 2√2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без 4.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Умножайте на сопряжённое.</div></div>"}, {"id": 11, "text": "<p>The figure shows a trapezium ABCD where AB is parallel to DC.</p><p>AB = 6 cm, DC = 10 cm, and the height of the trapezium is 5 cm.</p><p>What is the ratio of area of ABCD to the area of the triangle formed by AD and height?</p>", "image": "images/q-ffe6f10cf9.jpg", "options": ["2:1", "4:3", "8:1", "7:5", "9:2"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-ffe6f10cf9.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь трапеции и маленького треугольника у боковой стороны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S трапеции = ½(6 + 10) · 5 = 40.</li><li>Треугольник: основание <span class=\"fr\"><span>10 − 6</span><span>2</span></span> = 2, высота 5 → 5.</li><li>40 : 5 = 8 : 1.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверное основание треугольника.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Свес с каждой стороны = (большее − меньшее)/2 (для равнобедренной).</div></div>"}, {"id": 12, "text": "<p>For what values of k does the equation \\(kx^2 + 4x + 1 = 0\\) have exactly one real solution?</p>", "image": "", "options": ["k = 0 only", "k = 4 only", "k = 2 or k = -2", "k = 4 or k = 0", "k = 1"], "correct": 3, "verified": true, "src": "M35", "orig": "images/q-45e1377a7b.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два случая: линейное уравнение (k = 0) и квадратное с D = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 0: 4x + 1 = 0 → одно решение ✓.</li><li>k ≠ 0: D = 16 − 4k = 0 → k = 4.</li><li>Ответ: k = 4 или k = 0.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — только один случай.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте, что при k = 0 уравнение перестаёт быть квадратным.</div></div>"}, {"id": 13, "text": "<p>The operation Δ is defined as \\(a \\mathbin{\\Delta} b = \\dfrac{a^2+b^2}{a(a+b)}\\)</p><p>Find the value of (3 Δ 1) Δ 2.</p>", "image": "", "options": ["21/36", "31/36", "169/85", "51/36", "61/36"], "correct": 2, "src": "M35", "orig": "images/q-20a887c22a.jpg", "review": true, "topic": "M4.6"}, {"id": 14, "text": "<p>In the figure below, two concentric circles have a radius of 3 cm and 5 cm.</p><p>What is the area of the shaded region (the ring between the circles)?</p>", "image": "images/q-5355989cb4.jpg", "options": ["\\(4\\pi\\)", "\\(8\\pi\\)", "\\(16\\pi\\)", "\\(25\\pi\\)", "\\(9\\pi\\)"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-5355989cb4.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кольцо = большой круг − малый.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>π(5² − 3²) = π(25 − 9) = 16π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4π) — π(5 − 3)².</li><li>B (8π) — неверно.</li><li>D, E — площадь одного круга.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> r₁² − r₂² ≠ (r₁ − r₂)².</div></div>"}, {"id": 15, "text": "<p>If \\(2^{x+3} = 64\\), find the value of \\(3^{x-1}\\).</p>", "image": "", "options": ["3", "9", "27", "81", "1"], "correct": 1, "verified": true, "src": "M35", "orig": "images/q-2698999333.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к основанию 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>64 = 2⁶ → x + 3 = 6 → x = 3.</li><li>3<sup>x − 1</sup> = 3² = 9.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (27) — 3³.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают 3<sup>x−1</sup>, а не x.</div></div>"}, {"id": 16, "text": "<p>16 Question</p><p>The sum of the interior angles of a regular polygon is 1440°. How many sides does the polygon have?</p>", "image": "", "options": ["8", "9", "10", "12", "14"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-af9f336ae5.jpg", "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(n − 2) · 180° = 1440°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n − 2 = 8 → n = 10.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (8) — это n − 2.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая сторона добавляет 180°.</div></div>"}, {"id": 17, "text": "<p>In the coordinate plane, line L passes through points A(1, 2) and B(4, 8).</p><p>What is the equation of the line perpendicular to L that passes through the midpoint of AB?</p>", "image": "images/q-aaf1b2769b.jpg", "options": ["\\(y = -0.5x + 6.25\\)", "\\(y = 2x - 3\\)", "\\(y = -0.5x + 5\\)", "\\(x + 2y = 10\\)", "\\(2x + y = 15\\)"], "correct": 0, "verified": true, "src": "M35", "orig": "images/q-aaf1b2769b.jpg", "review": true, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перпендикуляр: наклон <span class=\"fr\"><span>−1</span><span>k</span></span>; проходит через середину AB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон L = <span class=\"fr\"><span>8 − 2</span><span>4 − 1</span></span> = 2 → перпендикуляр −½.</li><li>Середина AB: (2,5; 5).</li><li>y = −½(x − 2,5) + 5 = −0,5x + 6,25.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — параллельная L.</li><li>C, D — через другую точку.</li><li>E — неверный наклон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Произведение наклонов перпендикулярных прямых = −1.</div></div>"}, {"id": 18, "text": "<p>Simplify the algebraic fraction: \\(\\frac{(x^2-9)}{(x^2+6x+9)}+1\\)</p>", "image": "", "options": ["\\(2x / (x + 3)\\)", "\\((x + 3) / (x - 3)\\)", "\\(2x\\)", "-1", "\\((x - 9) / (x + 9)\\)"], "correct": 0, "verified": true, "src": "M35", "orig": "images/q-1cafec2807.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сокращаем дробь, затем прибавляем 1 = <span class=\"fr\"><span>x + 3</span><span>x + 3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 3)<span class=\"fr\"><span>x + 3</span><span>x + 3</span></span>² = <span class=\"fr\"><span>x − 3</span><span>x + 3</span></span>.</li><li>+ 1 = <span class=\"fr\"><span>x − 3 + x + 3</span><span>x + 3</span></span> = <span class=\"fr\"><span>2x</span><span>x + 3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перевёрнуто без +1.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте +1 после сокращения.</div></div>", "topic": "M4.6"}, {"id": 19, "text": "<p>In the figure, ABC is an equilateral triangle with side length 6.</p><p>Points P, Q, and R are midpoints of AB, BC, and CA respectively.</p><p>What is the area of triangle PQR?</p>", "image": "images/q-41b76119de.jpg", "options": ["6", "9", "\\(\\frac{9\\sqrt{3}}{4}\\)", "\\(\\frac{11\\sqrt{3}}{4}\\)", "\\(\\frac{9\\sqrt{5}}{4}\\)"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-41b76119de.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольник из средних линий подобен исходному с коэффициентом ½.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона PQR = 3.</li><li>S = <span class=\"fr\"><span>√3</span><span>4</span></span> · 9 = <span class=\"fr\"><span>9√3</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — без √3.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь средне-линейного треугольника = ¼ исходной: <span class=\"fr\"><span><span class=\"fr\"><span>√3</span><span>4</span></span> · 36</span><span>4</span></span>.</div></div>"}, {"id": 21, "text": "<p>Factorize completely: \\(x^2 - 12y^2 - 2xy + 6xy\\)</p>", "image": "", "options": ["\\(2y(x - 3)^2\\)", "\\((x + 6y)(x - 2y)\\)", "\\((x^2 - 9)y\\)", "\\(x(2x - 18y)\\)", "\\(x(x + 6)(y + 1)\\)"], "correct": 1, "verified": true, "src": "M35", "orig": "images/q-7499d5ab49.jpg", "topic": "M4.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим подобные: −2xy + 6xy = 4xy.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + 4xy − 12y².</li><li>Ищем множители −12 с суммой 4: 6 и −2.</li><li>(x + 6y)(x − 2y).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — при раскрытии не дают исходное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала приведите подобные, потом раскладывайте.</div></div>"}, {"id": 22, "text": "<p>A cylinder has a volume of V. If the radius is doubled and the height is halved, what is the new volume?</p><p>Cylinder 1 has radius \\(r\\) and height \\(h\\), Volume = V</p><p>Cylinder 2 has radius \\(2r\\) and height \\(\\frac{h}{2}\\), New Volume = ?</p>", "image": "", "options": ["V", "2V", "4V", "0.5V", "8V"], "correct": 1, "verified": true, "src": "M35", "orig": "images/q-7937f2590f.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = πr²h; радиус в квадрате.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>π(2r)²<span class=\"fr\"><span>h</span><span>2</span></span> = π · 4r² · <span class=\"fr\"><span>h</span><span>2</span></span> = 2πr²h = 2V.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (4V) — забыли уменьшить высоту.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус ×2 → объём ×4.</div></div>"}, {"id": 23, "text": "<p>Which of the following numbers is the largest?</p>", "image": "", "options": ["0.2", "22/100", "\\(0.2^2\\)", "\\(5^{-2}\\)", "\\(\\sqrt{0.05}\\)"], "correct": 4, "verified": true, "src": "M35", "orig": "images/q-ce809fc1b4.jpg", "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим всё в десятичные дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,2; 0,22; 0,04; 0,04; √0,05 ≈ 0,224.</li><li>Наибольшее — √0,05.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (0,22) — чуть меньше 0,224.</li><li>A, C, D — меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √ числа меньше 1 больше самого числа.</div></div>"}, {"id": 24, "text": "<p>The mean of a set of n numbers is 12. When a new number, 30, is added to the set, the new mean of all the numbers becomes 14. Find the value of n (the original number of values in the set).</p>", "image": "", "options": ["8", "9", "12", "15", "16"], "correct": 0, "verified": true, "src": "M35", "orig": "images/q-9c38f001e5.jpg", "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12n + 30 = 14(n + 1) → 2n = 16 → n = 8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не удовлетворяют уравнению.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средние → суммы.</div></div>"}, {"id": 25, "text": "<p>In the figure, PQR is a triangle with vertices P(0,0), Q(6,0), and R(3, 3\\(\\sqrt{3}\\)).</p><p>What type of triangle is PQR?</p>", "image": "images/q-c5f73e0cb1.jpg", "options": ["Right-Angled", "Isosceles Right-Angled", "Equilateral", "Isosceles but not Equilateral", "Obtuse"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-c5f73e0cb1.jpg", "review": true, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем все три стороны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>PQ = 6.</li><li>PR = √(9 + 27) = 6.</li><li>QR = √(9 + 27) = 6.</li><li>Все равны → равносторонний.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — нет прямого угла.</li><li>D — все три равны.</li><li>E — углы по 60°.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота 3√3 = <span class=\"fr\"><span>√3</span><span>2</span></span>·6 — признак равностороннего треугольника.</div></div>"}, {"id": 26, "text": "<p>Make 'a' the subject of the formula: \\(P = \\frac{(n^2 + a)}{(n - a)}\\)</p>", "image": "", "options": ["\\(a = \\frac{(Pn - n^2)}{(1 + P)}\\)", "\\(a = \\frac{(Pn + n^2)}{(P - 1)}\\)", "\\(a = \\frac{(Pn - n^2)}{(1 - P)}\\)", "\\(a = \\frac{(n^2 - Pn)}{(1 + P)}\\)", "\\(a = P(n - 1)\\)"], "correct": 0, "verified": true, "src": "M35", "orig": "images/q-4d2a13ac42.jpg", "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Освобождаемся от знаменателя и собираем a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P(n − a) = n² + a.</li><li>Pn − n² = a + Pa = a(1 + P).</li><li>a = <span class=\"fr\"><span>Pn − n²</span><span>1 + P</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — знаки в знаменателе.</li><li>D — перевёрнут знак числителя.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Все слагаемые с a — в одну сторону.</div></div>"}, {"id": 27, "text": "<p>The curve \\(y = x^2 - 6x + c\\) has its minimum value at \\(y = -4\\). Find the value of c.</p>", "image": "", "options": ["1", "2", "5", "9", "13"], "correct": 2, "verified": true, "src": "M35", "orig": "images/q-42f64f4bf2.jpg", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершина при x = 3, значение там −4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = <span class=\"fr\"><span>−b</span><span>2a</span></span> = 3.</li><li>9 − 18 + c = −4 → c = 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (9) — минимум был бы 0.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x − 3)² + (c − 9): минимум c − 9 = −4.</div></div>"}, {"id": 28, "text": "<p>28 Question</p><p>An athlete is training for a marathon on a route consisting of three segments:</p><p>Uphill: She runs x km at a constant speed of 8 km/h.</p><p>Flat: She runs for 45 minutes at a constant speed of 12 km/h.</p><p>Downhill: She runs the final 6 km at a speed of v km/h.</p><p>If the total distance of the route is 20 km, find the value of x.</p>", "image": "", "options": ["2", "3", "4", "5", "6"], "correct": 3, "verified": true, "src": "M35", "orig": "images/q-e7f8c11e14.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим длину ровного участка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>45 мин = 0,75 ч → 12 · 0,75 = 9 км.</li><li>x = 20 − 9 − 6 = 5 км.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — ошибка в 45 мин (0,45 ч?).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 45 мин = ¾ часа.</div></div>"}, {"id": 29, "text": "<p>If sin(x) = 0.6 and x is an acute angle, what is the value of cos(x)?</p>", "image": "", "options": ["0.4", "0.5", "0.64", "0.8", "0.75"], "correct": 3, "verified": true, "src": "M35", "orig": "images/q-6fe6f589b8.jpg", "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">sin² + cos² = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>cos² = 1 − 0,36 = 0,64.</li><li>cos = 0,8 (острый угол → положительный).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (0,4) — 1 − 0,6.</li><li>C (0,64) — забыли корень.</li><li>E (0,75) — это tg.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Треугольник 3-4-5: sin = 0,6, cos = 0,8.</div></div>"}, {"id": 30, "text": "<p>The distance between the points (1, 2) and (4, k) is 5. Which of the following is a possible value for k?</p>", "image": "", "options": ["5", "4", "7", "-1", "-2"], "correct": 4, "verified": true, "src": "M35", "orig": "images/q-d346eecb08.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Формула расстояния.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 − 1)² + (k − 2)² = 25 → (k − 2)² = 16.</li><li>k − 2 = ±4 → k = 6 или −2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — не дают расстояние 5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Два ответа из-за ± — проверьте оба по вариантам.</div></div>"}, {"id": 31, "topic": "M4.8", "text": "<p>Given that \\(x^2 + 6x + 7 \\equiv (x + a)^2 + b\\) for all \\(x\\), find \\(b\\).</p>", "image": "", "options": ["−2", "2", "3", "7", "16"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделите полный квадрат: a = половина коэффициента при x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 3, (x + 3)² = x² + 6x + 9.</li><li>b = 7 − 9 = −2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — это a, а не b.</li><li>D — взяли свободный член без поправки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте коэффициенты при одинаковых степенях.</div></div>", "src": "PL"}, {"id": 32, "topic": "M3.9", "text": "<p>\\(y\\) is directly proportional to \\(x^2\\). When \\(x = 6\\), \\(y = 108\\).</p><p>Find \\(y\\) when \\(x = 8\\).</p>", "image": "", "options": ["24", "60.75", "144", "192", "384"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = kx²: найдите k по первой паре.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 108 : 36 = 3.</li><li>y = 3 · 64 = 192. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли возвести в квадрат.</li><li>B — посчитали как обратную пропорцию.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коэффициент k находится один раз и используется дальше.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="vendor/supabase/supabase.js?v=2.118.0"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  }

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

(function(){
  // render math the moment it lands in the page: MutationObserver callbacks run before the next paint, so raw LaTeX is never shown
  var opts = {delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}], throwOnError: false};
  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){
    render(document.body);
    new MutationObserver(function(ms){
      var done = [];
      for (var i = 0; i < ms.length; i++) {
        var t = ms[i].target;
        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
      }
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
