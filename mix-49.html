<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;

    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }

  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;

    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;

  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;

  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }

  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }

    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 2, "text": "", "image": "images/math-new/m039_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь сферы 4πr². Складываем для всех радиусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Квадраты радиусов: <span class=\"fr\"><span>r²</span><span>4</span></span>, r², 4r², 9r².</li><li>Сумма: 14,25r².</li><li>4π · 14,25r² = 57πr².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли <span class=\"fr\"><span>r²</span><span>4</span></span> или посчитали неверно.</li><li>B — сложили радиусы и возвели сумму в квадрат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возводите в квадрат каждый радиус отдельно.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m039_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">€32 — это 80% старой цены.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>32 : 0,8 = 40.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — прибавили 20% к 32: процент берётся от старой цены, а не от новой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скидка считается от исходной цены.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m039_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первая вещь больше письма, значит это посылка. Вторая помещается в размеры письма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Посылка 300 г: первые 30 г — $1,22, ещё 270 г = 9 доплат по $0,17 = $1,53. Итого $2,75.</li><li>Письмо 110 г: первые 30 г — $0,44, ещё 80 г = 3 доплаты (неполные 30 г тоже считаются) = $0,51. Итого $0,95.</li><li>Всего: 2,75 + 0,95 = $3,70.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — первая вещь посчитана как письмо.</li><li>D, E — неверное число доплат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Or part thereof» — неполные 30 г считаются как полные.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m039_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала Фрея убегает, а Сью идёт к ней. Потом Фрея бежит назад навстречу Сью.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Убегает: расстояние растёт, но медленно, потому что Сью идёт следом.</li><li>Возвращается: обе движутся навстречу, расстояние уменьшается быстро.</li><li>График: медленный рост, затем быстрое падение до нуля. Это B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — быстрый рост и медленное падение (наоборот).</li><li>A, C — начинаются с 20 м, а вначале Фрея рядом со Сью.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Навстречу — скорости складываются, вслед — вычитаются.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m039_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем систему.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Из второго: y = 2x − 5.</li><li>x + 6x − 15 = 13, x = 4, y = 3.</li><li>x + y = 7.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в подстановке.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 4 + 9 = 13 и 8 − 3 = 5.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m039_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем с суммой, а не со средним.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a + b + c = 3 · 8 = 24.</li><li>Новая сумма: 24 + 1 + 2 + 6 + 3 = 36.</li><li>Среднее: 36 : 4 = 9.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сумма без деления.</li><li>B — делили на 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее × количество = сумма.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m039_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность квадратов: a² − b² = (a − b)(a + b).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>27² − 23² = 4 · 50 = 200.</li><li>14² − 6² = 8 · 20 = 160.</li><li>200 + 160 = 360.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки в счёте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не возводите большие числа в квадрат.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m039_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пронумеруем вершины: A = 0, B = 1, C = 2, D = 3, E = 4. R прибавляет 1 (после 4 идёт 0). S меняет местами B и E, C и D, A остаётся.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Следим, куда попадает D (номер 3).</li><li>A: R R S R S R: 3 → 4 → 0 → 0 → 1 → 4 → 0. D оказалась в A — сдвинулась.</li><li>B: S R: 3 → 2 → 3. Вернулась.</li><li>C, D, E тоже возвращают D на место.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — D остаётся на месте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте по одной вершине, шаг за шагом.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m039_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Катеты a и 2a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · a · 2a = a² = 18.</li><li>Гипотенуза² = a² + 4a² = 5 · 18 = 90.</li><li>√90 = 3√10.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная площадь или Пифагор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √90 = √(9 · 10).</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m039_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель x² − 1 = (x − 1)(x + 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>x − 1</span></span> = <span class=\"fr\"><span>x + 1</span><span>x² − 1</span></span>.</li><li>2 − (x + 1) = 1 − x.</li><li><span class=\"fr\"><span>1 − x</span><span>(x − 1)(x + 1)</span></span> = <span class=\"fr\"><span>−1</span><span>x + 1</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — не сократили и ошиблись в знаке.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 − x = −(x − 1).</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m039_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим точки на осях.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = 0: x = 4, A(4; 0).</li><li>x = 0: y = 6, B(0; 6).</li><li>Центр — середина AB: (2; 3).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перепутаны координаты.</li><li>D — это сами a и b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Середина = полусумма координат.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m039_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем числа и степени отдельно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 · 5 = 15, 10<sup>m</sup> · 10<sup>n</sup> = 10<sup>m+n</sup>.</li><li>15 · 10<sup>m+n</sup> = 1,5 · 10<sup>m+n+1</sup>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — верно по значению, но не в стандартном виде.</li><li>B, D — степени перемножены вместо сложения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В стандартном виде число перед 10 от 1 до 10.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m039_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два случая: из A переложили звезду или сердце.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Звезда из A: <span class=\"fr\"><span>4</span><span>6</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>. Тогда в B 3 звезды из 4: <span class=\"fr\"><span>3</span><span>4</span></span>.</li><li>Сердце из A: <span class=\"fr\"><span>1</span><span>3</span></span>. Тогда в B 2 звезды из 4: <span class=\"fr\"><span>1</span><span>2</span></span>.</li><li><span class=\"fr\"><span>2</span><span>3</span></span> · <span class=\"fr\"><span>3</span><span>4</span></span> + <span class=\"fr\"><span>1</span><span>3</span></span> · <span class=\"fr\"><span>1</span><span>2</span></span> = <span class=\"fr\"><span>1</span><span>2</span></span> + <span class=\"fr\"><span>1</span><span>6</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — больше 1, так не бывает.</li><li>A — перемножили не те дроби.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбейте на случаи и сложите.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m039_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставим x = <span class=\"fr\"><span>1</span><span>4</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>x</span></span> = 4; x² = <span class=\"fr\"><span>1</span><span>16</span></span>; <span class=\"fr\"><span>1</span><span>1 + x</span></span> = 0,8; <span class=\"fr\"><span>1</span><span>√x</span></span> = 2; √x = 0,5.</li><li>Больше всех <span class=\"fr\"><span>1</span><span>x</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 2, меньше 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте конкретное число из промежутка.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m039_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разница между 2√n и 7 меньше 1: 6 &lt; 2√n &lt; 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 &lt; √n &lt; 4.</li><li>9 &lt; n &lt; 16: n = 10, 11, 12, 13, 14, 15.</li><li>6 чисел.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — включили 9 и 16.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство — концы не входят.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m039_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Серединный перпендикуляр проходит через середину AB и перпендикулярен AB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Середина: (4; 2).</li><li>Наклон AB: <span class=\"fr\"><span>2</span><span>4</span></span> = <span class=\"fr\"><span>1</span><span>2</span></span>, перпендикуляр: −2.</li><li>y = −2x + 10.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — наклон −2, но не через середину.</li><li>A, B — наклон 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: −8 + 10 = 2.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m039_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вырезан полукруг диаметром s (сторона квадрата).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Полукруг: ½ · π · <span class=\"fr\"><span>s</span><span>2</span></span>² = <span class=\"fr\"><span>πs²</span><span>8</span></span>.</li><li>s² − <span class=\"fr\"><span>πs²</span><span>8</span></span> = 100, s²<span class=\"fr\"><span>8 − π</span><span>8</span></span> = 100.</li><li>s² = <span class=\"fr\"><span>800</span><span>8 − π</span></span> = 400 · <span class=\"fr\"><span>2</span><span>8 − π</span></span>.</li><li>s = 20√<span class=\"fr\"><span>2</span><span>8 − π</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — вырезали четверть круга.</li><li>C — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус полукруга — половина стороны.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m039_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Большее a, меньшее b.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a − b = 4; a + 2b = 13.</li><li>Вычитаем: 3b = 9, b = 3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в системе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Половина разности 2» — разность 4.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m039_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два деления по частям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Брату <span class=\"fr\"><span>5</span><span>8</span></span> · 5000 = 3125.</li><li>3 + 1 + 1 = 5 частей, 3125 : 5 = 625.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 2 части.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Второе деление — от доли брата.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m039_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Убираем всё лишнее вокруг y по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5n − n = 4n = m<span class=\"fr\"><span>ny − e²</span><span>p</span></span>.</li><li>4np = mny − me².</li><li>y = <span class=\"fr\"><span>4np + me²</span><span>mn</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли вычесть n из 5n (взяли 3n).</li><li>D — лишнее m.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала перенесите n.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m039_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Векторы не параллельны → коэффициенты при p и q сравниваем отдельно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>При p: 3 = 2y, y = 1,5.</li><li>При q: x − 2 = −5, x = −3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не параллельные векторы — сравнивайте коэффициенты.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m039_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Большая плитка в 4 раза больше по площади.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>600 : 4 = 150.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — делили на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сторона ×2 — площадь ×4.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m039_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем две части.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 2 ≤ 5 + 3x: −3 ≤ 2x, x ≥ −1,5.</li><li>5 + 3x ≤ 2x + 7: x ≤ 2.</li><li>−1,5 ≤ x ≤ 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — левая граница больше правой.</li><li>C — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-5.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m039_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пусть цена 5. Муж платит 3, жена 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цена 10, муж платит те же 3, жена 7.</li><li>3 : 7.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно взять цену равной сумме частей.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m039_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем через Кэрол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Кэрол c, Брайан 3c, Энн 6c.</li><li>10c = 400, c = 40.</li><li>Брайан: 120.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — двойная доля Кэрол.</li><li>C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> За единицу берите самую маленькую долю.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m039_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем через изюм.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Изюм r, сахар 1,5r, мука 3r.</li><li>5,5r = 550, r = 100.</li><li>Мука 300 г.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное соотношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно: изюм 2, сахар 3, мука 6 частей, всего 11.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m039_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем коэффициенты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,2 · 1,2 : 1,2 = 1,2.</li><li>Рост на 20%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сложили 20% + 20%.</li><li>A, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y в знаменателе отменяет рост одного множителя.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m039_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Навстречу — скорости складываются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 + 6 = 10 м/с.</li><li>1000 : 10 = 100 с.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 км = 1000 м.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m039_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время Мэриан больше на 80%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>54 · 1,8 = 97,2 мин = 1,62 ч.</li><li>70 · 1,62 = 113,4 ≈ 113 км.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — половина.</li><li>C — удвоено.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-45.</div></div>"}, {"id": 31, "topic": "M3.9", "text": "<p>\\(y\\) is directly proportional to \\(x^2\\). When \\(x = 3\\), \\(y = 45\\).</p><p>Find \\(y\\) when \\(x = 8\\).</p>", "image": "", "options": ["40", "120", "160", "320", "640"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = kx²: найдите k по первой паре.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 45 : 9 = 5.</li><li>y = 5 · 64 = 320. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли возвести в квадрат.</li><li>B — взяли y ∝ x, а не x².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коэффициент k находится один раз и используется дальше.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
