<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p>In her analysis of Six Degrees of Separation, Jennifer Gillan discusses how the \"buddy formula\" in American cinema often masks racial difference by presenting interracial relationships as evidence of social equality. She argues that such narratives allow white audiences to feel reassured about racial harmony without confronting systemic inequality. Gillan notes that the film's apparent progressiveness relies on characters who can move seamlessly between racialized spaces. At the same time, this movement is only possible because racial difference is rendered invisible or culturally neutral. As a result, race appears to be transcended rather than addressed. This strategy, Gillan suggests, is consistent with broader Hollywood traditions.</p><p>Which of the following best expresses the main conclusion of the argument?</p>", "image": "", "options": ["Six Degrees of Separation presents interracial friendships more subtly than earlier Hollywood films.", "The buddy formula in American cinema often gives audiences a false sense of racial equality.", "Hollywood films have historically avoided representing racial conflict directly.", "Racial difference becomes irrelevant when characters share similar social class backgrounds.", "The success of Six Degrees of Separation depends primarily on its appeal to white audiences."], "correct": 1, "src": "CRIT36", "orig": "images/q-b5d3415058.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — главный вывод. Текст идёт от частного (фильм «Six Degrees») к общему: такой приём — часть традиции Голливуда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Найдите, что доказывают все факты: «формула напарников» показывает межрасовую дружбу как равенство, но скрывает неравенство.</li><li>Итог: зритель получает ложное ощущение расового равенства. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сравнения «тоньше, чем раньше» в тексте нет.</li><li>C — про «избегание конфликта» в целом автор не говорит; она говорит про маскировку различий.</li><li>D — социальный класс в тексте вообще не упоминается.</li><li>E — успех фильма и его причины не обсуждаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод часто шире примера: если текст начинается с одного фильма, а заканчивается «традицией Голливуда», вывод — про общий приём.</div></div>"}, {"id": 2, "topic": "CON", "text": "<p>Kesner explains that the terracotta soldiers of the First Emperor appear highly individualized at first glance. Each figure has distinct facial features, posture, and expression. However, archaeological and stylistic analysis shows that these variations were produced through standardized molds and controlled modifications. The army was designed to represent an idealized vision of imperial order rather than actual individuals. Individuality, therefore, serves a symbolic rather than personal function. The emphasis remains on collective power and authority.</p><p>Which of the following conclusions can most reliably be drawn from the passage?</p>", "image": "", "options": ["The terracotta army was intended to portray specific historical soldiers.", "The figures' individuality proves that ancient Chinese artists rejected standardization.", "Apparent individuality in the terracotta army does not contradict its function as a symbol of imperial control.", "The First Emperor valued personal identity over political authority.", "Archaeological evidence cannot determine the purpose of the terracotta army."], "correct": 2, "src": "CRIT36", "orig": "images/q-4d89ae5022.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — вывод, который надёжно следует. Две мысли: фигуры выглядят разными, но сделаны по шаблону ради образа власти.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Текст прямо говорит: индивидуальность символическая, акцент — на коллективной власти.</li><li>Значит, видимые различия не мешают армии быть символом имперского контроля. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — прямо противоречит: армия изображала идеал, а не реальных людей.</li><li>B — противоречит: вариации сделаны через стандартные формы.</li><li>D — наоборот, акцент на власти, а не на личности.</li><li>E — текст сам опирается на археологический анализ, чтобы объяснить цель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Most reliably» — выбирайте вариант, который соединяет обе части текста и не добавляет ничего нового.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p>Alex regularly travels between the towns of Northbridge and Eastport. For each trip he can choose between two train services called Standard and Saver.</p><p>Standard charges a fixed fare of $30 for every journey.</p><p>Saver has a loyalty discount scheme. The first journey costs $45, the second costs $44, the third $43, and so on. Each journey is $1 cheaper than the previous one until the fare reaches $15, after which there are no further reductions.</p><p>After how many journeys would it become cheaper in total to use Saver rather than Standard?</p>", "image": "", "options": ["the 16th journey", "the 17th journey", "the 31st journey", "the 32nd journey", "the 46th journey"], "correct": 3, "src": "CRIT36", "orig": "images/q-e0e9414613.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Saver: 45, 44, … до 15 (31-я поездка), дальше 15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разница с Standard за n поездок (n ≤ 31): 15n − n<span class=\"fr\"><span>n − 1</span><span>2</span></span>.</li><li>При n = 31: 465 − 465 = 0 — сравнялись.</li><li>32-я поездка: Saver 15 против 30 → Saver дешевле. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — Saver ещё дороже.</li><li>C — равенство, а не «дешевле».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите момент равенства и сделайте ещё шаг.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p>Population density depends on both population and land area. For example, the density of Norland is found by dividing its population of 240,000 by its area of 20,000 km , giving a density of 12 people per square kilometre.</p><p>Find the country in the table that has the smallest population density. Which option includes this country?</p><table class=\"q-table\"><thead><tr><th>Country</th><th>Population</th><th>Area (km )</th></tr></thead><tbody><tr><td>Norland</td><td>240,000</td><td>20,000</td></tr><tr><td>Eastavia</td><td>800,000</td><td>40,000</td></tr><tr><td>Silver Coast</td><td>1,200,000</td><td>60,000</td></tr><tr><td>Highlandia</td><td>2,000,000</td><td>50,000</td></tr><tr><td>Sunterra</td><td>3,000,000</td><td>75,000</td></tr><tr><td>Lakora</td><td>1,500,000</td><td>30,000</td></tr></tbody></table><table class=\"q-table\"><thead><tr><th>Country</th><th>Population</th><th>Area (km )</th></tr></thead><tbody><tr><td>Montara</td><td>600,000</td><td>12,000</td></tr><tr><td>Green Territory</td><td>180,000</td><td>90,000</td></tr><tr><td>Coral Isles</td><td>240,000</td><td>15,000</td></tr><tr><td>Oceanica</td><td>480,000</td><td>24,000</td></tr><tr><td>Equatoria</td><td>500,000</td><td>25,000</td></tr><tr><td>Microstate</td><td>30,000</td><td>1</td></tr><tr><td>Bay Islands</td><td>320,000</td><td>16,000</td></tr><tr><td>Remote Isles</td><td>100</td><td>5</td></tr><tr><td>Pacifica</td><td>210,000</td><td>14,000</td></tr></tbody></table>", "image": "", "options": ["Norland, Eastavia, Silver Coast", "Highlandia, Sunterra, Lakora", "Montara, Green Territory, Coral Isles", "Oceanica, Equatoria, Microstate", "Bay Islands, Remote Isles, Pacifica"], "correct": 2, "src": "CRIT36", "orig": "images/q-8b92cddc76.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Плотность = население : площадь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Green Territory: 180 000 : 90 000 = 2 чел./км² — меньше всех. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Microstate и Remote Isles — маленькая площадь, плотность большая.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же тип, что crit-6.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p>Karim had <strong>840 ml</strong> of orange juice. He wanted to divide it completely among his three cousins: Lina, Maya and Noor. It was agreed that the youngest cousin, <strong>Lina</strong>, would receive the <strong>smallest share</strong>, which would be exactly <strong>half of Maya's share</strong>. <strong>Noor</strong> would receive the <strong>largest share</strong>, which would be <strong>double Maya's share</strong>.</p><p>How much orange juice would <strong>Maya</strong> receive?</p>", "image": "", "options": ["120 ml", "160 ml", "200 ml", "240 ml", "280 ml"], "correct": 3, "src": "CRIT36", "orig": "images/q-6e56d5b78e.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мая — m, Лина — <span class=\"fr\"><span>m</span><span>2</span></span>, Нур — 2m.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3,5m = 840 → m = 240 мл. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная пропорция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите всех через одну долю.</div></div>"}, {"id": 6, "topic": "ASM", "text": "<p>Siler argues that The Grapes of Wrath is an effective tool for teaching students about the Great Depression. He claims that the novel conveys economic hardship in a way that statistical data cannot. By engaging emotionally with the characters, students gain a deeper understanding of historical suffering. This emotional engagement, according to Siler, promotes stronger historical empathy. As a result, literature should play a central role in history education. Therefore, teachers should incorporate Steinbeck's novel into their curriculum on the Great Depression.</p><p>Which of the following is an underlying assumption of the argument?</p>", "image": "", "options": ["Students prefer novels to textbooks in all academic subjects.", "Emotional understanding contributes meaningfully to historical learning.", "Statistical data about the Great Depression is inaccurate or misleading.", "All literary works are suitable tools for teaching history.", "Teachers are currently unwilling to change their teaching methods."], "correct": 1, "src": "CRIT36", "orig": "images/q-5425c46726.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — допущение. Цепочка: роман вызывает эмоции → эмоции дают лучшее понимание истории → роман нужен на уроках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Слабое звено — переход «эмоции → понимание истории». Автор его не доказывает, а принимает.</li><li>Проверка отрицанием: если эмоции НЕ помогают изучать историю, весь вывод рушится. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «во всех предметах» не нужно: речь только об истории.</li><li>C — автор говорит, что статистика не передаёт страдание, а не что она неточна.</li><li>D — нужен один роман, а не «все литературные произведения».</li><li>E — нежелание учителей менять методы для вывода не важно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте допущение отрицанием: подставьте «НЕ» — если вывод падает, это оно.</div></div>"}, {"id": 7, "topic": "STR", "text": "<p>Spongberg describes the development of interspecific magnolia hybrids through controlled cross-breeding. He notes that many hybrids combine desirable traits such as hardiness, flowering time, and resistance to disease. These outcomes suggest that hybridization expands the possibilities available to horticulturists. The article contrasts deliberate hybrid creation with reliance on naturally occurring species. From this, it is argued that hybridization represents progress in botanical cultivation. Therefore, intentional hybrid breeding should be preferred over exclusive reliance on traditional species.</p><p>Which of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Many naturally occurring magnolia species have survived unchanged for thousands of years.", "Some magnolia hybrids fail to reproduce consistently across generations.", "Hybrids developed through controlled breeding have shown greater adaptability across diverse climates.", "Botanical gardens often prioritize the preservation of rare wild species.", "Certain magnolia species are culturally valued for their historical authenticity."], "correct": 2, "src": "CRIT36", "orig": "images/q-2156ce5533.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — усиление. Вывод: целенаправленное выведение гибридов лучше, чем опора только на дикие виды.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Усилить = добавить ещё одну причину, почему гибриды выигрывают у диких видов.</li><li>Лучшая приспособляемость к разным климатам — новое практическое преимущество гибридов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — довод за дикие виды: они и так стабильны.</li><li>B — ослабляет: гибриды ненадёжно размножаются.</li><li>D — про приоритеты ботсадов, это аргумент в пользу диких видов.</li><li>E — культурная ценность диких видов — тоже довод против вывода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В усилении сначала определите направление вывода, потом отбросьте всё, что тянет в другую сторону.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p>Arman wants to save $240.</p><p>He earns money by completing units of work each evening.</p><ul><li>For the <strong>first 8 units</strong>, he earns <strong>$3 per unit</strong>.</li><li>For any <strong>additional units</strong>, he earns <strong>$1.50 extra per unit</strong>.</li></ul><p>Each evening, Arman completes <strong>12 units</strong> of work.</p><p>He works <strong>only from Monday to Friday</strong>. After working for <strong>5 evenings</strong>, Arman becomes ill and <strong>misses the next 2 working days</strong>. He starts working on <strong>Monday, 3 November</strong>.</p><p>On which date will Arman have earned <strong>enough money to stop working</strong>?</p>", "image": "", "options": ["12 November", "13 November", "14 November", "17 November", "18 November"], "correct": 0, "src": "CRIT36", "orig": "images/q-4ac38fe334.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">За вечер: 8 · 3 + 4 · 4,50 = $42.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>240 : 42 ≈ 5,7 → нужно 6 вечеров.</li><li>3–7 ноября — 5 вечеров; 10 и 11 ноября болеет.</li><li>6-й вечер — 12 ноября. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно учтены выходные или болезнь.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> $1,50 — доплата сверх $3.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p>Thabo works as a driver for Ubuntu Minibuses, transporting passengers between suburb X and city Y.</p><ul><li>His first trip from X to Y starts at 06:00 and takes 1 hour.</li><li>All subsequent journeys take 40 minutes.</li><li><strong>At no time during the day do any passengers travel from Y back to X.</strong></li><li>The minibus can legally carry 10 passengers, and it is full on every trip from X to Y.</li><li>Each passenger pays 20 Rands per journey.</li><li>Thabo must pay 800 Rands per day for the vehicle and fuel.</li><li>At the end of the day, he must return the minibus to suburb X.</li></ul><p>What is the <strong>earliest time</strong> Thabo can finish work and still have <strong>300 Rands left</strong> after paying Ubuntu Minibuses?</p>", "image": "", "options": ["13:40", "14:00", "14:20", "14:40", "15:00"], "correct": 2, "src": "CRIT36", "orig": "images/q-dc5b23f759.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно 800 + 300 = 1100 рэндов. Рейс с 10 пассажирами — 200.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужно 6 рейсов (1200 ≥ 1100).</li><li>1-й: 06:00–07:00; дальше круги по 80 мин: рейсы 2–6 заканчиваются в 8:20, 9:40, 11:00, 12:20, 13:40.</li><li>Вернуться в X: 14:20. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без возврата.</li><li>Остальные — лишние рейсы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте пустой рейс обратно.</div></div>"}, {"id": 10, "topic": "WKN", "text": "<p>Gibbs argues that rock music in Vietnam developed primarily through local reinterpretation rather than direct imitation of Western models. He points out that Vietnamese musicians adapted rock to fit local political constraints and cultural expectations. These adaptations shaped both musical style and performance practices. According to the article, this process produced a distinct Vietnamese rock identity. The argument implies that Western influence was secondary to local agency. Thus, Vietnamese rock should not be understood as merely derivative of Western rock.</p><p>Which of the following, if true, would most weaken the argument?</p>", "image": "", "options": ["Vietnamese rock musicians frequently cited Western bands as early inspirations.", "Rock music was officially restricted by Vietnamese authorities for long periods.", "Many Vietnamese rock songs closely replicated Western melodies, lyrics, and performance styles.", "Local audiences interpreted rock music through their own cultural frameworks.", "Musical exchange between Vietnam and the West increased after economic reforms."], "correct": 2, "src": "CRIT36", "orig": "images/q-d2c8061f3b.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — ослабление. Вывод: вьетнамский рок — не копия, а местная переработка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ослабить = показать, что это всё-таки копирование.</li><li>Если многие песни почти повторяли западные мелодии, тексты и подачу — вывод прямо опровергнут. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вдохновение ≠ копирование: можно вдохновиться и сделать своё.</li><li>B — ограничения властей автор сам приводит как причину местной адаптации.</li><li>D — местное восприятие поддерживает вывод о местной роли.</li><li>E — рост обмена не говорит, копировали или переосмысляли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Самое сильное ослабление — прямой контрпример к выводу, а не косвенный факт.</div></div>"}, {"id": 11, "topic": "FLAW", "text": "<p>Carroll argues that horror narratives are defined by the emotional response they provoke, particularly fear and disgust. He explains that audiences are attracted to horror because these emotions are elicited in a controlled, fictional context. From this, the following conclusion is drawn: since horror relies on fear and disgust, any work that provokes these emotions must belong to the horror genre. Therefore, if a film or artwork causes fear or disgust, it should be classified as horror. This conclusion appears to follow directly from the nature of the genre as described.</p><p>Which of the following best identifies the flaw in the argument?</p>", "image": "", "options": ["It assumes that all audience members experience fear and disgust in the same way.", "It treats emotional responses as irrelevant to genre classification.", "It confuses a characteristic that is common in horror with a defining condition that is sufficient on its own.", "It ignores the historical development of horror as a genre.", "It relies on an example rather than general reasoning."], "correct": 2, "src": "CRIT36", "orig": "images/q-2f08b9261e.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — ошибка в рассуждении. Посылка: ужасы вызывают страх. Вывод: всё, что вызывает страх, — ужасы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это переворот: «ужасы → страх» превратили в «страх → ужасы».</li><li>Черта, типичная для жанра, принята за достаточное условие. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — разное восприятие у людей не причина ошибки в логике.</li><li>B — наоборот, автор строит всё на эмоциях.</li><li>D — история жанра не нужна, чтобы увидеть логическую ошибку.</li><li>E — пример в тексте не используется, рассуждение общее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Если A, то B» не значит «если B, то A». Ищите переворот условия.</div></div>"}, {"id": 12, "topic": "PAR", "text": "<p>Mahonen discusses the increasing use of medicinal cannabis to manage chronic pain. The article notes that many patients report reduced suffering after using cannabis-based treatments. From this, the following reasoning is presented: if a medical treatment significantly reduces pain for patients, then it should be considered a legitimate therapeutic option. Medicinal cannabis reduces pain for many patients. Therefore, medicinal cannabis should be considered a legitimate therapeutic option. The argument relies on a conditional relationship between effectiveness and legitimacy.</p><p>Which of the following arguments has the same logical structure as the one above?</p>", "image": "", "options": ["If a policy is popular, it must be morally justified. This policy is morally justified, so it must be popular.", "If a substance is addictive, it should be banned. Medicinal cannabis should be banned, so it must be addictive.", "If a method improves student learning outcomes, it should be used in schools. This method improves learning outcomes, so it should be used in schools.", "If an illness is widespread, it deserves public attention. This illness does not receive public attention, so it is not widespread.", "If a treatment is natural, it is safer than synthetic alternatives. Medicinal cannabis is natural, so it is safer."], "correct": 2, "src": "CRIT36", "orig": "images/q-68fdb9abcb.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — та же структура. Схема: если X, то стоит делать Y; X есть → стоит делать Y (прямой вывод из условия).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Запишите C буквами: если метод улучшает обучение (X), его стоит применять (Y); улучшает → применять.</li><li>Совпадают и форма, и тип вывода — рекомендация «следует применять». Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — переворот: из Y выводится X.</li><li>B — тоже переворот: из «нужно запретить» выводят «вызывает зависимость».</li><li>D — схема «нет Y → нет X», а не «X → Y».</li><li>E — форма похожа, но вывод — факт («безопаснее»), а не рекомендация, как в исходном доводе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если подходят два варианта по форме, сравните тип вывода: факт или «следует».</div></div>"}, {"id": 13, "topic": "PRIN", "text": "<p>Kaeppler argues that dance should not be analyzed solely as aesthetic performance. She emphasizes that dance is embedded in social structures, cultural values, and systems of meaning. According to her, removing dance from its cultural context leads to misunderstanding its purpose and significance. Dance functions as a form of knowledge and communication within a society. Therefore, proper analysis of dance requires attention to the cultural system in which it operates. Evaluating dance purely by external or universal standards distorts its meaning.</p><p>Which of the following best illustrates the principle underlying the author's argument?</p>", "image": "", "options": ["A ritual chant should be interpreted according to the beliefs and practices of the community that uses it, rather than by musical standards from another culture.", "Classical ballet should be considered superior to folk dance because it requires formal training.", "Dance performances should be judged primarily by their technical difficulty.", "Cultural practices lose meaning when they are adapted for international audiences.", "All artistic expression communicates universal human emotions regardless of context."], "correct": 0, "src": "CRIT36", "orig": "images/q-c0ffbb7663.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — принцип. Принцип автора: явление культуры нужно понимать внутри его культуры, а не по чужим стандартам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ищите вариант из другой области с той же логикой.</li><li>Ритуальное пение оценивают по верованиям общины, а не по музыкальным нормам другой культуры. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ставит один танец выше другого по «универсальному» критерию — это то, против чего автор.</li><li>C — оценка по технике — тот же внешний стандарт.</li><li>D — про адаптацию для иностранцев, автор об этом не говорит.</li><li>E — прямо противоположно: «вне зависимости от контекста».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Правильный принцип обычно звучит в другой теме, но с той же логикой.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p>When three interlocking rings are picked up, the bottom ring may stay in the same plane as the top ring or rotate about 180°, depending on how the links are arranged.</p><p>If there are <strong>6 rings in a row</strong>, what is the <strong>maximum</strong> number of <strong>180° twists from end to end</strong> that the chain could make when picked up?</p>", "image": "images/q-ccbaa33869.jpg", "options": ["2", "3", "4", "5", "6"], "correct": 3, "src": "CRIT36", "orig": "images/q-ccbaa33869.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поворот на 180° возможен в каждом соединении колец.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 колец в ряд — 5 соединений.</li><li>Максимум — 5 поворотов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный подсчёт соединений.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соединений на одно меньше, чем колец.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p>Danial has saved <strong>$400</strong>. He will not need the money for <strong>two years</strong> and is deciding between two banks.</p><ul><li><strong>River Bank</strong> offers a <strong>simple interest</strong> rate of <strong>6% per year</strong> on the original amount invested.</li><li><strong>Hilltop Bank</strong> offers <strong>compound interest</strong> at a rate of <strong>5% per year</strong>, with interest added at the end of each year.</li></ul><p>How do the two investments compare after <strong>two years</strong>?</p>", "image": "", "options": ["River Bank would be better by $9.00.", "River Bank would be better by $8.00.", "River Bank would be better by $7.00.", "River Bank would be better by $6.00.", "They would both be the same."], "correct": 2, "src": "CRIT36", "orig": "images/q-f71db84882.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем проценты за 2 года.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>River: 400 · 0,06 · 2 = $48.</li><li>Hilltop: 400 · 1,05² = 441 → $41.</li><li>River лучше на $7. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1,05² = 1,1025.</div></div>"}, {"id": 16, "topic": "ASM", "text": "<p>The berry bushes in my yard do not produce berries in their first year. They produce berries for the next two years, after which they are removed because they become too old. Sometimes some bushes die during winter.</p><p>Over the last five years, the number of bushes that produced berries was: <strong>0, 8, 13, 19, 14</strong></p><p>Assuming that <strong>no bushes die this winter</strong> and that <strong>no new bushes will be added (planted) this year</strong>, what is the fewest number of bushes that could produce berries next year?</p>", "image": "", "options": ["0", "2", "5", "6", "15"], "correct": 0, "src": "CRIT36", "orig": "images/q-2ac6918e8b.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Куст даёт ягоды на 2-й и 3-й год после посадки. Восстановите посадки по годам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ягоды в год t = посадки года t−1 + посадки года t−2.</li><li>Из 0, 8, 13, 19, 14 получаем посадки: 8, 5, 14, 0 (годы 1–4).</li><li>В следующем году ягоды дадут посадки годов 4 и 5: 0 + 0 (в этом году ничего не сажают). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не учли, что в 4-м году посадок не было, а кусты 3-го года уже отслужат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Работайте с посадками, а не с урожаем.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p>Aruzhan wants to use her aunt's old recipe to bake muffins for a school fair. According to the recipe, the ingredients needed for one muffin batch are:</p><ul><li>1 cup of butter</li><li>2 cups of milk</li><li>1 cup of sugar</li><li>4 cups of flour</li><li>3 eggs</li></ul><p>She only has the following ingredients at home:</p><ul><li>720 g of butter</li><li>1.8 litres of milk</li><li>900 g of sugar</li><li>1.92 kg of flour</li><li>30 eggs</li></ul><p>She also uses this conversion table:</p><ul><li>1 cup of butter = 180 g</li><li>1 cup of milk = 300 millilitres</li><li>1 cup of sugar = 150 g</li><li>1 cup of flour = 120 g</li></ul><p>How many full batches of muffins can Aruzhan make with the available ingredients?</p>", "image": "", "options": ["3", "4", "5", "6", "8"], "correct": 0, "src": "CRIT36", "orig": "images/q-42bc80c9c1.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим запасы в чашки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Масло: 720 : 180 = 4 → 4 партии.</li><li>Молоко: 1800 : 300 = 6 чашек → 3 партии.</li><li>Сахар: 6 → 6; мука: 16 → 4; яйца: 10.</li><li>Минимум — 3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли молоко.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ограничивает самый дефицитный продукт.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p>The following tables show the number of children in families visiting a large science museum.</p><p><strong>Spain</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>4</td></tr><tr><td>1</td><td>6</td></tr><tr><td>2</td><td>5</td></tr><tr><td>3</td><td>3</td></tr><tr><td>4+</td><td>2</td></tr></tbody></table><p><strong>Italy</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>2</td></tr><tr><td>1</td><td>5</td></tr><tr><td>2</td><td>4</td></tr><tr><td>3</td><td>1</td></tr><tr><td>4+</td><td>0</td></tr></tbody></table><p><strong>Germany</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>1</td></tr><tr><td>1</td><td>4</td></tr><tr><td>2</td><td>6</td></tr><tr><td>3</td><td>2</td></tr><tr><td>4+</td><td>0</td></tr></tbody></table><p>A total of 45 families were surveyed. You may assume that no child is counted in more than one family.</p><p>Ignoring the usefulness of the statistics, which one of the following averages could <strong>not</strong> be calculated from the information given above alone?</p>", "image": "", "options": ["The mean number of children per family from Germany.", "The mean number of families per child from Italy.", "The mean number of families per row in the table from Spain.", "The mean number of families per country in the survey.", "The mean number of children per family from Spain and Italy."], "correct": 4, "src": "CRIT36", "orig": "images/q-3ba9a31c98.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Строка «4+» не даёт точного числа детей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В Испании 2 семьи с «4+» — точно посчитать детей нельзя.</li><li>Среднее по Испании и Италии посчитать нельзя. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — в Германии и Италии «4+» = 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же тип, что crit-6.</div></div>"}, {"id": 19, "topic": "MC", "text": "<p>The authors examine the global popularity of K-pop, focusing on how performances like Gangnam Style circulate through Western media systems. They argue that K-pop is often embraced not as a serious cultural form but as a playful, ironic spectacle. This framing allows Western audiences to consume Asian popular culture while maintaining cultural distance. At the same time, the authors point out that such reception reinforces existing hierarchies of taste. What appears to be global inclusion may therefore reproduce exclusion at another level. The notion of \"unpopular culture\" is central to this process.</p><p>Which of the following best states the main conclusion of the passage?</p>", "image": "", "options": ["Gangnam Style became popular because it appealed to universal musical tastes.", "Western audiences misunderstand the cultural origins of K-pop performances.", "The global success of K-pop challenges traditional distinctions between high and low culture.", "The Western reception of K-pop often reinforces cultural hierarchies rather than dismantling them.", "Asian popular culture gains visibility only through parody and irony."], "correct": 3, "src": "CRIT36", "orig": "images/q-f4cd40c4e1.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — главный вывод. Ключевой поворот: «то, что кажется глобальным включением, воспроизводит исключение».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Все факты (ирония, дистанция, иерархии вкуса) ведут к одному: западное восприятие K-pop укрепляет иерархии, а не ломает их. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — текст объясняет популярность иронией, а не «универсальным вкусом».</li><li>B — о непонимании происхождения не говорится.</li><li>C — противоположно: иерархии не разрушены, а укреплены.</li><li>E — «только через пародию» — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слова «therefore», «may therefore» указывают на вывод. Ищите их.</div></div>"}, {"id": 20, "topic": "CON", "text": "<p>Pearson argues that animals, particularly dogs, have often been treated as passive elements in historical narratives. He notes that dogs are usually discussed only in relation to human intentions or actions. However, historical evidence shows that dogs influenced military practices, policing, and everyday social life in ways that were not entirely controlled by humans. These interactions sometimes altered human behavior and historical outcomes. Ignoring animal agency simplifies complex historical processes. A more inclusive approach to history is therefore required.</p><p>Which of the following conclusions can best be drawn from the passage as a whole?</p>", "image": "", "options": ["Dogs have played a more important role in history than humans.", "Historians should abandon human-centered narratives entirely.", "The influence of animals in history has been exaggerated by recent scholars.", "Recognizing animal agency can change how historical events are interpreted.", "Dogs act independently of human societies in all historical contexts."], "correct": 3, "src": "CRIT36", "orig": "images/q-ae6720557e.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — вывод из текста в целом. Собаки влияли на события → если это игнорировать, история упрощается.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осторожный вывод: учёт действий животных может изменить понимание событий. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «важнее людей» — текст этого не утверждает.</li><li>B — «полностью отказаться» — слишком сильно; автор просит более широкий подход.</li><li>C — противоречит: автор говорит, что роль животных недооценивали.</li><li>E — «всегда независимо» — текст говорит «не полностью контролировались».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слова «entirely», «all», «always» в вариантах — частая ловушка «слишком сильно».</div></div>"}, {"id": 21, "topic": "ASM", "text": "<p>The authors describe how outbreaks of plague were shaped not only by biological factors but also by social conditions such as trade networks, warfare, and religious practices. They emphasize that responses to the plague varied widely across regions and periods. These variations affected mortality rates and long-term demographic change. The article suggests that focusing exclusively on medical explanations gives an incomplete picture of historical pandemics. Understanding plague history therefore requires a multidisciplinary approach. This broader perspective allows historians to better explain differences in historical outcomes.</p><p>Which of the following assumptions is necessary for the authors' conclusion to hold?</p>", "image": "", "options": ["Medical science was incapable of explaining disease in premodern societies.", "Social and cultural factors can influence the spread and impact of disease.", "Religious beliefs were the primary cause of plague outbreaks.", "Warfare always increases the likelihood of pandemics.", "Modern pandemics are identical to historical plagues."], "correct": 1, "src": "CRIT36", "orig": "images/q-3927693191.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — необходимое допущение. Вывод: чума требует междисциплинарного подхода, а не только медицинского.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чтобы социальные факторы стоило изучать, они должны реально влиять на болезнь.</li><li>Отрицание: если общество НЕ влияет на распространение — вывод рушится. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «медицина не могла ничего объяснить» — слишком сильно, автор говорит «неполная картина».</li><li>C — «главная причина» — автор говорит о сочетании факторов.</li><li>D — «always» — не нужно для вывода.</li><li>E — современные пандемии вообще не обсуждаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Необходимое допущение — минимальное: ровно то, без чего вывод не работает.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p>Alex is trying to move a section of concrete pipe. He finds that he can move it by walking inside the pipe.</p><p>The radius of the circle forming the <strong>inside</strong> of the pipe is <strong>3 m</strong>, and the radius of the circle forming the <strong>outside</strong> of the pipe is <strong>6 m</strong>.</p><p>How far must Alex walk <strong>inside the pipe</strong> if he wants to move it <strong>18 m</strong>?</p>", "image": "images/q-c8bf7bacf5.jpg", "options": ["9 m", "12 m", "18 m", "36 m", "54 m"], "correct": 0, "src": "CRIT36", "orig": "images/q-c8bf7bacf5.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Труба катится: её смещение = угол поворота · внешний радиус.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18 м : 6 м = 3 радиана поворота.</li><li>Алекс идёт по внутренней поверхности: 3 · 3 = 9 м. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — путь трубы.</li><li>Остальные — неверные радиусы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Путь по окружности = угол · радиус.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p>Sanzhar planned to buy <strong>20 individual notebooks</strong> for his class.</p><ul><li>Price per individual notebook: <strong>$3</strong></li><li>A discount of <strong>20%</strong> applies only if the total spend is <strong>more than $250</strong>.</li></ul><p>By mistake, Sanzhar ordered <strong>20 packs</strong> of notebooks instead of 20 individual notebooks.</p><ul><li>Each pack costs <strong>$15</strong>.</li></ul><p>How much <strong>more</strong> did Sanzhar pay than he intended to pay?</p>", "image": "", "options": ["$180", "$175", "$170", "$165", "$160"], "correct": 0, "src": "CRIT36", "orig": "images/q-6267b33ca3.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Планировал: 20 · $3 = $60.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Фактически: 20 · $15 = $300 &gt; 250 → скидка 20% → $240.</li><li>Переплата: 240 − 60 = $180. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли скидку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте условие скидки.</div></div>"}, {"id": 24, "topic": "FLAW", "text": "<p>Hassler describes the prayer wheel as an object through which spiritual reflection can be practiced repeatedly and mechanically. He notes that turning the wheel allows prayers to be enacted without conscious verbal repetition. From this observation, the following conclusion is made: because prayer wheels enable prayer without deliberate reflection, they necessarily weaken the spiritual sincerity of religious practice. Therefore, practices involving prayer wheels are less meaningful than spoken prayer. The factual descriptions of the prayer wheel itself are not in dispute.</p><p>Which of the following best describes the flaw in the argument?</p>", "image": "", "options": ["It assumes that intentional reflection is the only valid form of spiritual engagement.", "It mistakenly claims that prayer wheels originated outside religious traditions.", "It generalizes from a single religious practice to all forms of prayer.", "It assumes that mechanical repetition always increases spiritual value.", "It confuses historical description with symbolic interpretation."], "correct": 0, "src": "CRIT36", "orig": "images/q-3c55ec1862.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — ошибка. Автор: колесо работает без осознанного размышления → значит, молитва менее искренняя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Скрытый шаг: только сознательное размышление — настоящая духовность.</li><li>Этого автор не доказал, а просто принял. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — происхождение колёс не обсуждается.</li><li>C — автор сравнивает с устной молитвой, а не делает вывод обо всех молитвах.</li><li>D — противоположно: автор считает, что механика снижает ценность.</li><li>E — описание и не оспаривается; ошибка в оценке.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите скрытое «только»: автор считает один вид чего-то единственно правильным.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p>The ingredients for bread must be added in the correct order and measured accurately. The recipe book gives the following information:</p><table class=\"q-table\"><thead><tr><th></th><th>White</th><th>French</th><th>Wholemeal</th><th>Brown</th><th>Granary</th><th>Pizza Dough</th><th>Unit</th></tr></thead><tbody><tr><td>Water</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>Cup</td></tr><tr><td>Milk powder</td><td>1</td><td>2</td><td>2</td><td>2</td><td>2</td><td>0</td><td>Tsp</td></tr><tr><td>Sugar</td><td>2</td><td>1</td><td>2</td><td>3</td><td>2</td><td>2</td><td>Tsp</td></tr><tr><td>Salt</td><td>1</td><td>1</td><td>2</td><td>1</td><td>1</td><td>1</td><td>Tsp</td></tr><tr><td>Oil</td><td>2</td><td>1</td><td>2</td><td>2</td><td>2</td><td>1</td><td>Tbsp</td></tr><tr><td>Flour</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td><td>Cup</td></tr><tr><td>Yeast</td><td>1</td><td>1</td><td>2</td><td>1</td><td>1</td><td>1</td><td>Tsp</td></tr></tbody></table><p>White sugar is used with white bread and brown sugar with brown bread.</p><p>I have made <strong>10 mixes</strong> of various types. So far I have used:</p><ul><li><strong>16 tsp of milk powder</strong></li><li><strong>12 tsp of yeast</strong></li><li><strong>30 cups of flour</strong></li></ul><p>What is the <strong>most that can be said</strong> about how much <strong>salt</strong> I have used?</p>", "image": "", "options": ["It must be <strong>10 tsp</strong>", "It must be <strong>12 tsp</strong>", "It must be <strong>14 tsp</strong>", "There must have been <strong>some pizza dough used</strong>, but from these figures one cannot be sure what else.", "The exact amount cannot be worked out without more information."], "correct": 1, "src": "CRIT36", "orig": "images/q-11d2b663e0.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дрожжи: 2 ч. л. только у Wholemeal, у остальных 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 ч. л. на 10 замесов → ровно 2 замеса Wholemeal.</li><li>Соль: у Wholemeal 2, у остальных 1 → 8 + 4 = 12 ч. л. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — соль определяется однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите ингредиент, который выдаёт тип хлеба.</div></div>"}, {"id": 26, "topic": "MC", "text": "<p>Park examines the relationship between transnational adoption and the global circulation of Korean popular culture. She argues that adoptees are often positioned ambiguously within narratives of Korean national identity. While <em>Hallyu</em> promotes an image of cultural cohesion and global appeal, adoptees may experience exclusion from this imagined community. The article highlights how popular culture celebrates \"Koreanness\" while simultaneously defining who can legitimately belong. This tension reveals contradictions in the politics of cultural nationalism. These contradictions are not accidental but structurally embedded in the global promotion of Korean culture.</p><p><strong>Which of the following best expresses the main conclusion of the argument?</strong></p>", "image": "", "options": ["The global promotion of Korean popular culture relies on narratives that both affirm national cohesion and structurally exclude certain Korean subjects.", "Korean popular culture presents an idealized version of national identity that fails to reflect the lived experiences of all Koreans.", "Transnational adoption exposes unresolved tensions within Korean cultural nationalism that become visible through global media circulation.", "Hallyu prioritizes global appeal over internal social inclusion, resulting in contradictions in national representation.", "Adoptees occupy a marginal position because global audiences prefer simplified images of Koreanness."], "correct": 0, "src": "CRIT36", "orig": "images/q-b22530197a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — главный вывод. Последнее предложение — итог: противоречия не случайны, а встроены в саму структуру продвижения K-культуры.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Полный вывод состоит из двух частей: (1) Hallyu создаёт образ единства, (2) этот же процесс определяет, кто «настоящий кореец», и исключает других (например, усыновлённых).</li><li>Плюс слово «structurally» — исключение заложено в систему.</li><li>Только A содержит обе части и идею «структурно». Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — «идеализированный образ» — это только часть 1; нет исключения и нет «структурно».</li><li>C — делает главным усыновление, а в тексте это пример, на котором видно противоречие.</li><li>D — «ставит глобальную привлекательность выше» — сравнения приоритетов в тексте нет.</li><li>E — причина «аудитория любит упрощение» — в тексте её нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последняя фраза текста («not accidental but structurally embedded») часто и есть вывод. Ищите вариант, где есть все её ключевые слова.</div></div>"}, {"id": 27, "topic": "ASM", "text": "<p>Price traces the history of the plastic pink flamingo as an object of mass-produced kitsch. She explains how the flamingo moved from being a symbol of bad taste to an ironic cultural icon. This shift, she argues, reflects changing attitudes toward consumption, authenticity, and class. Objects once dismissed as tasteless can later be revalued as playful or subversive. From this, the argument concludes that cultural value is not inherent in objects themselves but is assigned by social context. Therefore, judgments of taste are historically and socially contingent.</p><p>Which of the following is an underlying assumption of the argument?</p>", "image": "", "options": ["Mass-produced objects were originally designed to challenge elite notions of taste.", "Cultural elites are always responsible for defining what counts as good taste.", "Irony eliminates all class distinctions in cultural consumption.", "Objects possess fixed meanings independent of how people use or interpret them.", "Social attitudes play a decisive role in determining how cultural objects are valued."], "correct": 4, "src": "CRIT36", "orig": "images/q-fc3911e517.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — допущение. Вывод: ценность не в самих вещах, её задаёт общество.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чтобы перейти от истории фламинго к общему выводу, нужно принять: общественные взгляды решающе влияют на оценку вещей. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — замысел производителей не важен.</li><li>B — «всегда элиты» — автор говорит о меняющемся обществе, а не только об элитах.</li><li>C — «устраняет все классовые различия» — слишком сильно.</li><li>D — прямо противоположно выводу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если вариант почти повторяет вывод, это может быть допущение. Проверьте отрицанием.</div></div>"}, {"id": 28, "topic": "PAR", "text": "<p>Uther explains that the fox appears across many literary traditions as a symbol of cunning and intelligence. He notes that although the fox is depicted differently in various cultures, its role is consistently shaped by human storytelling conventions. From this, the following conclusion is drawn: if an animal appears repeatedly in literature with similar traits, then those traits reflect narrative traditions rather than biological reality. The fox appears repeatedly with similar traits in literature. Therefore, those traits reflect narrative traditions rather than the animal's real nature.</p><p>Which of the following arguments matches the structure of the reasoning above?</p>", "image": "", "options": ["If a belief is widely shared, it must be true. This belief is widely shared, so it must be true.", "If a character is historically accurate, it will be portrayed consistently. This character is portrayed consistently, so it is historically accurate.", "If a rule has exceptions, it cannot be useful. This rule has exceptions, so it cannot be useful.", "If repeated patterns appear in myths, they are shaped by cultural storytelling. Repeated patterns appear in myths, so they are shaped by cultural storytelling.", "If animals behave intelligently, humans will attribute meaning to them. Humans attribute meaning to foxes, so foxes behave intelligently."], "correct": 3, "src": "CRIT36", "orig": "images/q-e8b86789b2.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — та же структура. Схема: если повторяется образ с одинаковыми чертами → это культура рассказа, а не реальность; повторяется → культура.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D совпадает и по форме (если X, то Y; X → Y), и по содержанию связи: повторяющийся шаблон → создан культурой рассказа. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A и C — та же форма, но связь другая («распространено → истинно», «есть исключения → бесполезно»), поэтому D ближе.</li><li>B — переворот: из Y выводят X.</li><li>E — тоже переворот: из «придают смысл» выводят «ведут себя умно».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала отсейте перевороты. Если остаются несколько вариантов той же формы — выберите тот, где тип связи ближе к исходному.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "<p>Galiev discusses how historical narratives in Kazakhstan have been selectively shaped to construct national identity. He explains that certain traditions are presented as ancient and continuous, even when they were recently formalized or reinterpreted. This process serves political and cultural purposes in the present. According to Galiev, mythologized history often functions less as an accurate account of the past and more as a tool for contemporary legitimacy. Historical accuracy becomes secondary to symbolic value. Thus, invented traditions play an active role in nation-building.</p><p>Which of the following most clearly reflects the principle used in the argument?</p>", "image": "", "options": ["Historical research should always aim to eliminate national myths.", "Traditions are only meaningful if they can be traced directly to ancient origins.", "National identity naturally emerges without political influence.", "Mythologized histories are harmless as long as they promote unity.", "Narratives about the past can be shaped to serve present social or political needs."], "correct": 4, "src": "CRIT36", "orig": "images/q-e255e8b966.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тип — принцип. Принцип: прошлое пересказывают так, как нужно настоящему.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Галиев показывает, что традиции подают как древние ради сегодняшних политических целей.</li><li>Общий принцип: рассказы о прошлом подстраивают под нужды настоящего. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «всегда устранять мифы» — автор описывает, а не призывает.</li><li>B — противоположно: традиции ценны и без древнего происхождения.</li><li>C — противоречит: автор говорит о политическом влиянии.</li><li>D — автор не оценивает, вредно это или нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип — обобщение вывода без имён и конкретики. Перескажите вывод своими словами и сравните.</div></div>"}, {"id": 31, "topic": "STR", "text": "The school canteen should stop selling sugary drinks. If students cannot buy them at school, they will drink less sugar overall, and this will improve their health.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "image": "", "options": ["Sugary drinks are the canteen's most profitable item.", "Students rarely bring drinks from home or buy them in shops near the school.", "Several schools in other countries have stopped selling sugary drinks.", "Some fruit juices sold in the canteen contain as much sugar as fizzy drinks.", "Many students say they like the taste of sugary drinks."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Слабое место: ученики могут купить напитки в другом месте.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если они почти не приносят и не покупают напитки вне школы, запрет действительно снизит сахар. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — довод против запрета.</li><li>C — нет данных о результате.</li><li>D — ослабляет: сахар останется в соках.</li><li>E — не о результате запрета.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усиливает то, что закрывает лазейку в рассуждении.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }

  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  var opts = {delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}], throwOnError: false};
  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){
    render(document.body);
    new MutationObserver(function(ms){
      var done = [];
      for (var i = 0; i < ms.length; i++) {
        var t = ms[i].target;
        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
      }
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
