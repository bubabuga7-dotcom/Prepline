<style>

<script>
const questions = [{"id": 1, "text": "Modern aeroplanes are for the most part ‘flown’ by autoflight computers. These computers can take over when the plane is just 30 metres off the ground, maintain whatever speed and height is tapped into the flight management system, and land the aircraft automatically. But when autoflight computers experience situations they haven’t been programmed to handle – sudden structural damage to the aircraft, or extreme weather – they can throw back responsibility to the pilot, who may become confused over the level of control they have. The confusion is made worse by flight deck computers overloading pilots with a blizzard of alerts. This is when crashes are most likely to happen.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?</b>", "options": ["Developing autoflight computers further to allow pilotless planes is likely to be safer than the current arrangement.", "Automated systems can be refined to the extent that air crashes will not happen.", "The combination of computer and human control over an aircraft is unsafe in most situations.", "Autoflight computers can be controlled as easily from the ground as from inside the plane.", "Human error in entering data into autoflight computers will always pose a risk."], "correct": 0, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аварии чаще всего случаются, когда компьютер передаёт управление человеку и тот путается.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Опасен именно момент совместного управления.</li><li>Значит, полностью автоматический самолёт без пилота, скорее всего, был бы безопаснее нынешней схемы. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — «аварий не будет» — слишком сильно.</li><li>C — «в большинстве ситуаций» — неверно, опасны только особые случаи.</li><li>D, E — в тексте нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите, где именно текст видит риск.</div></div>"}, {"id": 2, "text": "We should restore capital punishment for the offence of pre-meditated murder. It is true that, in the past, occasional mistakes have been made and innocent men have been hanged. However, with the improvements in forensic science and DNA testing, the chances of a mistake have receded. Restoring capital punishment would ensure real justice is done and, incidentally, it would also save the country a considerable amount of money in housing prisoners on long life sentences.<br><br><b>Which one of the following is an assumption of the above argument?</b>", "options": ["Forensic science is a foolproof way of determining guilt.", "Real justice can still be achieved even if there are occasional miscarriages.", "Financial considerations are the most important factors when considering criminal justice legislation.", "Long life sentences will not deter people from committing murder.", "The public would not be against the restoration of capital punishment."], "correct": 1, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор признаёт, что ошибки бывали, но всё равно говорит о «настоящей справедливости».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, он допускает: справедливость возможна, даже если иногда казнят невиновных. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — автор говорит, что ошибок стало меньше, а не что их нет.</li><li>C — деньги названы «incidentally», не главное.</li><li>D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение позволяет автору не обращать внимания на признанную проблему.</div></div>"}, {"id": 3, "text": "There is a lot more to interpreting and recognising faces than you might think. Forgetting people we used to know is not that uncommon, and is something we are in fact all guilty of. But next time you’re standing in the supermarket having a conversation with someone you don’t recognise but act like you remember them, take heed that the likelihood is that they will know you are lying. Lying is a lot harder than most people realise, and hiding the fact we are lying is harder still. This is because we all make brief, involuntary facial expressions when we try to conceal or repress something, such as trying to remember someone. These have been termed micro-expressions. So when someone you don’t recognise starts talking to you, you should just confess straight away because your micro-expressions will probably give you away anyway<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["When someone that you don’t recognise starts to talk to you, it is never because they have mistaken you for someone else.", "People are able to recognise the micro-expressions that show that someone is lying.", "People would prefer to know that they have not been recognised rather than have someone pretend to know them.", "The person talking to you will not be embarrassed that you did not recognise them.", "People who are talking to someone that they know never lie."], "correct": 1, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Совет «признайся сразу» держится на том, что собеседник заметит ложь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Микровыражения выдадут, только если люди умеют их распознавать. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно.</li><li>C, D — не нужны.</li><li>E — не связано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если никто не видит микровыражений — совет бесполезен.</div></div>"}, {"id": 4, "text": "The siting of mobile phone masts is a controversial matter in the UK, particularly when they are situated at or near schools and hospitals. The Stewart Report concluded that the balance of evidence indicated that there was no general risk to the health of people living near mobile phone masts but recommended a regular audit of Radio Frequency Radiation (RFR) emissions from masts sited near schools and hospitals. The Government have complied with this latter recommendation and carried out regular audits all of which show that RFR emissions are far below the levels of national and international guidelines. Therefore, mobile phone masts are safe and not injurious to health and can be sited anywhere.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["RFR emissions are more injurious to younger people.", "RFR emissions can affect sensitive equipment in hospitals.", "The audits are not carried out frequently.", "Mobile phones are an essential part of modern communications.", "The only health risk from mobile phone masts is RFR emissions."], "correct": 4, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод «мачты безопасны» сделан только по уровню излучения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если излучение — единственный возможный вред от мачт. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — ослабляют.</li><li>C — противоречит тексту.</li><li>D — не нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод «безопасно везде» требует, чтобы других рисков не было.</div></div>"}, {"id": 5, "text": "The production of standard disposable nappies from petrochemicals is wholly unsustainable. It is estimated that, while in disposable nappies, a baby will generate two tonnes of used nappies which will end up in landfill. Washable nappies have a significantly reduced environmental impact at production and at eventual disposal. Landfill sites are already in short supply, with recycling programmes aiming to reduce waste. However, if the Government wants to meet its sustainability targets it must do more to increase the use of washable nappies.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["The washing process of nappies involves further energy consumption.", "Some disposable nappies are made of natural polymers and are compostable.", "Most disposable nappies would take in excess of 500 years to biodegrade in landfill conditions.", "Several local authorities have incentive programmes to encourage parents to choose washable over disposable nappies.", "By 2014 all local authorities must offer doorstep recycling and many already offer composting bins and appliance collection."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: правительство должно больше продвигать многоразовые подгузники.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если одноразовые подгузники разлагаются больше 500 лет — вред от них ещё сильнее. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — ослабляют.</li><li>D — уже делается, не усиливает «должно делать больше».</li><li>E — про другие отходы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усиливает то, что делает вред сильнее.</div></div>"}, {"id": 6, "text": "In some countries hunting clubs can arrange for members to hunt and kill just about anything that moves around on land. Despite the high costs of these hunts the clubs have grown in popularity as rich businessmen look for new ways to entertain their clients. Rare and endangered species of bears are often the target of the hunts and so there is a risk that these species will become extinct. The growth of these hunting clubs should be opposed.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Other popular activities such as motor sports also do considerable damage to the environment, but are not opposed.", "The high costs of the hunts mean that small number of people are taking part in this activity.", "The amount of endangered bears hasn’t  changed largely since hunting clubs were formed.", "There are plenty of alternative ways for the rich businessmen to entertain their clients.", "Many hunters kill animals other than their target during the course of a hunt."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: клубам нужно противостоять, потому что медведи могут вымереть.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если число редких медведей почти не изменилось с появления клубов — угрозы нет. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — другие занятия не оправдывают.</li><li>B — частично.</li><li>D — не про вред.</li><li>E — усиливает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Опровергните последствие, на которое опирается вывод.</div></div>"}, {"id": 7, "text": "Birds of the tit family are very fond of tearing paper - wallpaper, newspaper, notices and bank notes included. They make no use of the paper they have torn. We might explain this puzzling behaviour by noting that the technique that they use for tearing paper is identical to their technique for stripping tree bark to search for insects to eat. This indicates that tits that tear paper are searching for food.<br><br><b>Which of the following, if true, would most weaken the above argument?</b>", "options": ["On many occasions tits reject food on bird tables to tear paper.", "Tits carry on tearing paper even when it is obvious to humans that no food is forthcoming.", "Eighty per cent of householders who reported paper tearing behaviour fed the birds.", "Tits use moss from trees and wool from dead sheep for nesting materials.", "Animals often engage in apparently pointless activities that turn out to have a purpose."], "correct": 0, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: синицы рвут бумагу, чтобы искать еду.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если они бросают настоящую еду, чтобы рвать бумагу, — дело не в поиске пищи. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не опровергает: птица может не знать.</li><li>C — не связано.</li><li>D, E — не опровергают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поведение, противоречащее предложенной цели, ослабляет объяснение.</div></div>"}, {"id": 8, "text": "Critics of homeopathic medicine argue that much of the apparent success of its remedies is due to the placebo effect (a placebo is a substance containing no medication). The remedies work because the patients believe they will work. In rebuttal, homeopaths often refer to a study involving a herd of pedigree Friesian cows. The herd was divided into two groups of 41 cows each. One group, the treatment group, was given a homeopathic remedy against mastitis, while the control group was given a placebo. The findings showed that 10 of the cows in the control group developed mastitis, while only one in the treatment group developed it.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["The beneficial effects of homeopathy are entirely due to the placebo effect.", "The beneficial effects of homeopathy are apparent and not genuine.", "The beneficial effects of homeopathy in cows cannot be due to the placebo effect.", "The beneficial effects of homeopathy are experienced only by animals.", "The beneficial effects of homeopathy are subject to a great deal of ill-informed criticism."], "correct": 2, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коровы не знают, что их лечат, — плацебо на них не действует.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разница 10 против 1 не может объясняться эффектом плацебо. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — противоречат опыту.</li><li>D — только животные — не следует.</li><li>E — оценка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Плацебо работает только через веру пациента.</div></div>"}, {"id": 9, "text": "Thankfully, logicians did not devise the British Constitution. It has evolved through the work of ordinary people, who have adapted the Government of the country to meet the needs of their age. They have always preserved sufficient flexibility to permit such adaptation. And we have avoided a lot of problems because we have never been guided in anything we have done by logic. If you study the period of history from the Civil War, in the middle of the 17th century, to the accession of George I in 1714, you will see the benefits of not making the Constitution too rigid by writing it down. It proves how much there is to be said for ignoring logic and following common sense.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["As the British Constitution was devised by logicians, it cannot be adapted to meet contemporary needs.", "The need to write down the British Constitution became inevitable over time.", "Britain was fortunate that its Constitution evolved flexibly as a result of the work of ordinary people.", "It is not possible to follow both logic and common sense because they will always produce different results.", "It is always right to ignore logic and follow common sense because such a course of action produces the best results."], "correct": 3, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор противопоставляет логику и здравый смысл: «игнорировать логику и следовать здравому смыслу».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это имеет смысл, только если логика и здравый смысл всегда ведут к разным результатам. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — противоречит.</li><li>B — противоречит.</li><li>C — это вывод.</li><li>E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Противопоставление «или–или» скрывает допущение.</div></div>"}, {"id": 10, "text": "Unlike motorways in many European countries, British motorways were built with hard shoulders for use in a breakdown or emergency. The proposal to use the hard shoulders to relieve congestion during peak traffic hours should not be adopted. It would be inconvenient for emergency services because when the hard shoulders are in use, it would be difficult for emergency vehicles to reach an accident. Nor would it be likely to significantly reduce congestion because it would be difficult to remove obstructions caused by broken down vehicles, and in any case the volume of traffic is increasing massively each year. But the most important reason is that we should seek to maintain Britain's relatively good record of safety on motorways. Other ways of relieving congestion must be sought.<br><br><b>Which of the following is an assumption underlying the above argument?</b>", "options": ["Britain's record for motorway safety is the best in Europe.", "Congestion on British motorways is not a major problem.", "Accidents are more likely to happen when motorways are congested.", "Changing the design of British motorways will not solve the problem of congestion.", "Britain's good safety record for motorways is partly attributable to the presence of hard shoulders."], "correct": 4, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Самый важный довод: сохранить хорошую безопасность на дорогах.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это относится к обочинам, только если хорошая безопасность отчасти связана с обочинами. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «лучший в Европе» не нужен.</li><li>B — противоречит.</li><li>C, D — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Довод должен быть связан с предметом спора.</div></div>"}, {"id": 11, "text": "A palaeontologist has argued that T.rex could not have been a predator. He says this because few predators have small eyes (needed to see prey) small arms (needed to hold prey), and huge legs (meaning slow speed), all of which are true of T.rex and that there is no evidence for predation such as bones with T.rex teeth embedded in them. Instead, he argues, it must have been a scavenger as its skull shows it had a good sense of smell and its legs were suited for walking long distances. Other scientists disagree, pointing out that many predators do not use forelimbs in hunting and that the speed of any dinosaur is very hard to assess.<br><br><b>Which one of the following is an underlying assumption of the palaeontologist's argument?</b>", "options": ["Predators do not leave their teeth embedded in the bones of their victims.", "Generalizations cannot be made between modern and prehistoric periods.", "T.rex could not have been both a scavenger and a predator.", "All predators must be able to move quickly.", "There are not enough fossilised remains yet for scientists to make a judgement."], "correct": 2, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Учёный: у T.rex признаки падальщика, значит, он не хищник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если нельзя быть одновременно и падальщиком, и хищником. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — противоречит доводу про зубы.</li><li>B, E — не нужны.</li><li>D — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ложная дилемма.</div></div>"}, {"id": 12, "text": "Crazy as it seems, it looks as if lead poisoning could be the major cause of the rise and fall of violent crime. Lead is so toxic that it is unsafe at any level and in Europe it has been banned from many products, including paint and petrol, since the 1990s. Lead poisoning in infancy, even at very low levels, impairs the development of those parts of the brain that regulate behaviour and mood. The effect is stronger in boys than in girls. Lead poisoning is associated with attention deficit disorder, impulsiveness, aggression and, some think, psychopathy. Studies between cities, states and nations show that the rise and fall in violent crime follows, with a roughly 20-year lag, the rise and fall in the exposure of infants to trace quantities of lead. Virtually all studies agree there is a strong correlation.<br><br><b>Which one of the following could be drawn as a conclusion from the above passage?</b>", "options": ["European countries could soon expect to see a fall in levels of violent crime.", "Possible causes of violent crime such as poor social conditions and drugs can now be discounted.", "If lead in petrol and paint is banned worldwide, violent crime will become almost unknown.", "Countries with less commitment to safety standards will be reluctant to ban lead from products.", "Boys who are exposed to lead in infancy are highly likely to go on to commit violent crimes in their early twenties."], "correct": 0, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Свинец запретили в Европе в 1990-х, а преступность следует за уровнем свинца с задержкой 20 лет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, в Европе скоро можно ожидать снижения насилия. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — «можно не учитывать» — слишком сильно.</li><li>C — «почти исчезнет» — слишком сильно.</li><li>D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соедините «запрет в 1990-х» и «задержка 20 лет».</div></div>"}, {"id": 13, "text": "In attempting to reduce the high injury toll from road offences such as drink-driving, successive governments have tended to rely on the deterrent effect of increasingly severe penalties. However, severe penalties can act as a deterrent only if potential offenders believe that the chances of being detected are moderate or high. Recent surveys have shown that people perceive the chance of detection for the offence of drink-driving as being very small.<br><br><b>Which one of the following can be concluded from the passage above?</b>", "options": ["Severe penalties for the offence of drink-driving do not constitute an effective deterrent.", "Successive governments have not tackled the problem of drink-driving.", "Drink-driving offenders have a misguided perception of their chances of detection.", "Penalties for road offences such as drink-driving should be even more severe.", "There must be better ways to tackle drink-driving, for example education."], "correct": 0, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наказание пугает, только если люди думают, что их поймают. Люди так не думают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, строгие наказания за вождение в нетрезвом виде не сдерживают. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — правительства действовали.</li><li>C — «ошибочно» не доказано.</li><li>D — противоречит.</li><li>E — новое предложение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соедините условие и факт.</div></div>"}, {"id": 14, "text": "The so-called 'baby-boomer' generation (people born in Britain in the late 1940's /early 1950's) will enjoy a good chance of reaching a ripe old-age. They benefited from a diet that was austere but healthy when they were children and this has influenced their adult tastes. In addition, people in this age group have given up unhealthy activities such as smoking cigarettes. In contrast, the generation represented by those currently in their 20's and early 30's are in danger of experiencing serious health problems which would decrease their life expectancy. This is the 'Big Mac' generation whose childhood diet was high in fat and sugar, which they continue to crave. They also show worrying tendencies to indulge in 'binge drinking' and other health-threatening activities.<br><br><b>Which of the following is a conclusion that can be drawn from the above passage?</b>", "options": ["Health is largely determined by factors which the individual can control.", "Health education is becoming less effective in controlling behaviour.", "The trend towards ever-increasing life expectancy will be reversed.", "The 'Big Mac' generation would be wise to change their lifestyle.", "The health service will be put under greater strain in the future."], "correct": 3, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поколение «Биг Мак» рискует здоровьем из-за привычек.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, им разумно изменить образ жизни. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — шире текста.</li><li>B, C, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожная рекомендация.</div></div>"}, {"id": 15, "text": "Currently 56% of British school children do not study a foreign language at all at GCSE, and seven university language departments have closed in the past seven years. People with only one language feel disempowered, whereas those who speak other languages are comfortable to travel the world. Once you can speak their languages, some of the mystique of foreigners goes away and you feel less intimidated by them. Good language skills are also important in the international business world.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["British education does not adequately equip people to interact in a global environment.", "If Britons were more proficient in languages they would enjoy holidays overseas more.", "The drop in language learning in Britain has put many language teachers out of work.", "Britons do not see the need to learn other languages, as most foreigners learn English.", "The poor language skills of British businessmen are holding back many potentially lucrative deals."], "correct": 0, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Британцы мало учат языки, а языки важны для поездок и бизнеса.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, британское образование плохо готовит к общению в мире. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — про удовольствие.</li><li>C, D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обобщите факты.</div></div>"}, {"id": 16, "text": "The number of crimes carried out by girls has increased significantly. The rise in offences such as criminal damage, public disorder, robbery and minor assaults by girls under 18 are all seen as linked to a rise in alcohol consumption. So the greater availability of alcohol is contributing to rising crime levels among young girls.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Greater alcohol consumption is associated with crime in males as well as females.", "Girls who commit offences are now more likely to be prosecuted for them.", "The greater availability of alcohol affects all age groups.", "Offences of violence and disorder were traditionally associated with males.", "Girls under 18 are drinking to much higher levels than in previous years."], "correct": 1, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор связывает рост преступлений девушек с алкоголем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если девушек просто чаще стали привлекать к суду — рост в статистике, а не в преступлениях. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — не опровергают.</li><li>E — усиливает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изменение учёта — альтернативное объяснение.</div></div>"}, {"id": 17, "text": "A dishonest act, such as stealing money from a handbag or cheating in school, may arise for one of many different reasons. But the reasons may be consistent with the personality of the individual involved. One child may steal, for example, in order to show off; another, to get money to support a hobby (or to get a birthday present for a younger sister); another, to express aggression or hatred against the person from whom he or she steals. One child may cheat in order to avoid punishment for academic failure; another, because of personal ambition; another to express contempt for the system.<br><br><b>Which one of the following is a conclusion that can be drawn from the passage above?</b>", "options": ["It is wrong to assume that a child who is dishonest in one kind of situation will be dishonest in others.", "A child who cheats does so for very complex reasons.", "A child whose motive is generosity towards someone else should not be blamed for stealing.", "Underlying all dishonest acts is hostility towards others.", "Children who are neither exhibitionist nor aggressive nor acquisitive are unlikely to steal money."], "correct": 0, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У одного поступка — разные причины, связанные с характером.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, неверно считать, что ребёнок, нечестный в одной ситуации, будет нечестен и в других. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — «очень сложные» не следует.</li><li>C — оценка.</li><li>D — противоречит.</li><li>E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод о разнообразии причин.</div></div>"}, {"id": 18, "text": "The demand for blood donors is increasing all over the world. In Western countries, in particular, demand has been rising so rapidly that shortages have begun to appear. In all such countries, demand is growing much faster than rates of growth in populations aged 18-65 from whom donors are drawn. And, despite a massive research effort to find alternatives, it remains true that in medicine there is no substitute for human blood.<br><br><b>Which one of the following conclusions can be drawn from the passage?</b>", "options": ["As the demand for blood has increased, so has the supply fallen.", "The rate of growth of the blood-donor population has been slowing recently.", "The increase in the rate of demand for blood is mainly due to population growth.", "If more blood donors could be found, there would be no need to find a substitute for human blood.", "The problem of the increase in demand for blood shows no sign of disappearing."], "correct": 4, "src": "CON", "image": "", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Спрос растёт быстрее числа доноров, замены нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, проблема не исчезнет. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «предложение падает» не сказано.</li><li>B, C — не следуют.</li><li>D — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Безопасный вывод.</div></div>"}, {"id": 19, "text": "Cannabis smoking is widespread, even though it is illegal. It is also more dangerous to health than most people realise. If we want to reduce the use of cannabis, it should be legalised. People do not turn away from dangerous habits unless they are fully aware of the damage these habits can cause. We should have learnt this lesson from the example of tobacco smoking, which has declined dramatically because people have seen that it results in deaths from lung cancer.<br><br><b>Which one of the following is an assumption underlying the above argument?</b>", "options": ["People who still smoke tobacco are unaware that it can affect their health.", "Unless cannabis smoking is legalised, its dangers will not be widely known.", "If tobacco smoking had been illegal, it would have been less widespread.", "There has been insufficient research on the damage caused by cannabis smoking.", "Cannabis users are motivated by the fact that they are engaging in an illegal activity."], "correct": 1, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: легализуйте каннабис, чтобы люди узнали о вреде.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если без легализации об опасности не узнают. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение связывает легализацию и осведомлённость.</div></div>"}, {"id": 20, "text": "Concern has been expressed about the UK Government policy of expanding the number of university places available. It is argued that the economy does not need the number of graduates that this policy produces. However, graduate unemployment has actually decreased since the policy of expansion was implemented. This shows that the Government has wisely anticipated the employment demands of an expanding modern 'high-tech' economy and that the policy of increasing the supply of university places is an appropriate response.<br><br><b>Which one of the following is an assumption underlying the above argument?</b>", "options": ["An increasing number of graduates is necessary for any economic growth.", "Modern 'high-tech' economies will always need a substantial supply of graduates.", "Graduates have not taken large numbers of jobs previously done by non-graduates.", "Many jobs done by graduates do not require a graduate qualification.", "Expansion of university places is always in response to the needs of the economy."], "correct": 2, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Безработица выпускников упала — автор считает, что экономике нужны выпускники.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если выпускники заняли места, где диплом не нужен, падение ничего не доказывает.</li><li>Допущение: они не заняли массово такие места. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — противоположно.</li><li>A, B, E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Опровергните альтернативу, чтобы найти допущение.</div></div>"}, {"id": 21, "text": "Some of the great sea-mammals, such as the sperm whale, have brains many times larger than ours. It is a fact of evolution that organs do not grow or remain large unless they are used; if they are not used they shrink or even disappear. It must be concluded therefore that the sperm whale makes intelligent use of the vast brain it possesses, perhaps at thought levels well beyond our understanding.<br><br><b>Which of the following would, if true, weaken the argument?</b>", "options": ["Humans have developed intelligence despite having smaller brains than whales.", "Whales lack the ability to communicate in language.", "Large brains may have uses that do not involve intelligence.", "There is no correlation between the size of the animal and the size of its brain.", "Whale intelligence may be of a kind that humans do not recognise."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: большой мозг используется → кит умный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если большой мозг нужен для чего-то, кроме интеллекта, — вывод неверен. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — частично.</li><li>E — усиливает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Другое использование органа ослабляет вывод.</div></div>"}, {"id": 22, "text": "Many rich countries protect their farming sectors with generous subsidies. It may be claimed that this policy can benefit countries in which people are starving or malnourished by encouraging farmers to produce more food than can be consumed in their own countries. But the policy is not in the best interests of poorer countries. Poor countries do not want charitable handouts — they want to develop the ability to feed their populations by their own efforts. If the amount spent on the European Commission's Common Agricultural Policy were invested in, say, irrigation schemes, that would transform the agriculture of many impoverished nations. This would surely be a better way to solve the problem of world hunger.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["Malnutrition is less likely to occur in countries with slow population growth.", "Wars and natural disasters such as floods are major causes of malnutrition.", "Much of the excess food produced by rich countries rots before it can be exported.", "Without subsidies to farmers in rich countries, the countryside would deteriorate.", "Agriculture in poor countries is less mechanised than in rich countries."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: субсидии богатых стран не помогают бедным.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если излишки еды гниют, не доходя до бедных стран, — субсидии точно бесполезны. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — не про субсидии.</li><li>D — ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что старая политика не работает.</div></div>"}, {"id": 31, "topic": "ASM", "text": "Since a cycle lane opened on Kenesary Street two years ago, the number of accidents involving cyclists on that street has fallen by half. A cycle lane on Abay Street would therefore make cycling there safer too.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "image": "", "options": ["The fall in accidents on Kenesary Street was caused by the cycle lane rather than by something else.", "A cycle lane on Abay Street would cost no more than the one on Kenesary Street.", "Cycling is the most popular way of getting around the town.", "Accidents involving cyclists on Kenesary Street had been rising before the lane opened.", "Most cyclists in the town use Abay Street."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Довод: после появления дорожки аварий стало вдвое меньше. Вывод: дорожка сделает безопаснее и Абая.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Аргумент считает, что именно дорожка снизила число аварий.</li><li>Проверка отрицанием: если аварий стало меньше по другой причине, вывод рушится. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — о цене в аргументе речи нет.</li><li>C, E — популярность не нужна для вывода о безопасности.</li><li>D — рост до открытия не нужен.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «После» не значит «из-за». Ищите скрытую причинную связь.</div></div>", "src": "PL"}, {"id": 32, "topic": "CON", "text": "Every student who passed the entrance exam was offered a place on the programme. Nobody who was offered a place had to pay a registration fee. Aliya had to pay a registration fee.<br><br><b>Which one of the following conclusions can be reliably drawn from the above passage?</b>", "image": "", "options": ["Aliya applied for a place on a programme abroad.", "Aliya did not pass the entrance exam.", "Everyone who did not pay a registration fee passed the entrance exam.", "Everyone who was offered a place passed the entrance exam.", "Aliya was offered a place but turned it down."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цепочка: сдал → получил место → не платил взнос.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Алия платила → места не получила → экзамен не сдала. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — об этом ничего нет.</li><li>C, D — обращения утверждений, они не следуют.</li><li>E — получивший место взнос не платит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> й.</li><li>C — рекомендация, а не вывод из фактов.</li><li>A, D — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Надёжный вывод не требует догадок сверх текста.</div></div>", "src": "PL"}, {"id": 36, "topic": "ASM", "text": "The new shopping centre being built in the northern districts will reduce traffic in the city centre. At present, many people who live in the northern districts drive into the city centre to do their shopping.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "image": "", "options": ["Many northern residents who now drive to the city centre to shop will shop at the new centre instead.", "Traffic in the city centre is worse than traffic in the northern districts.", "People from the southern districts will also use the new shopping centre.", "The new shopping centre will have more shops than the city centre.", "The new shopping centre will have a large car park."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пробки уменьшатся, только если жители севера перестанут ездить в центр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Без этого допущения новый центр ничего не меняет для трафика в центре. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — южные районы не нужны для вывода.</li><li>D — «больше магазинов» не обязательно.</li><li>E — парковка не обязательна.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение — мостик между доводом и выводом.</div></div>", "src": "PL"}, {"id": 37, "topic": "EF", "text": "Children who learn to swim at school are less likely to drown later in life. All schools should therefore offer swimming lessons.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "image": "", "options": ["Building a swimming pool is expensive.", "Most people who drown never learned to swim properly.", "Some children are afraid of water.", "Most schools already have a sports hall.", "Drowning is more common in summer than in winter."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно подтвердить связь «умение плавать → меньше утоплений».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если тонут в основном не умеющие плавать, уроки плавания действительно спасают. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ослабляет рекомендацию.</li><li>C, D, E — не о связи.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усиливает факт, который делает довод весомее.</div></div>", "src": "PL"}, {"id": 38, "topic": "CON", "text": "Bus fares in the city were cut by 30% in January. Over the next three months the number of bus journeys rose by 10%, but the money the bus company received from fares fell.<br><br><b>Which one of the following conclusions can be reliably drawn from the above passage?</b>", "image": "", "options": ["The fare cut was a mistake.", "Most of the new passengers used to travel by car.", "The rise in the number of journeys was not enough to make up for the lower fare per journey.", "The bus company will raise its fares again.", "The number of bus journeys will continue to rise."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выручка = число поездок × цена. Цена ×0,7, поездки ×1,1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,7 · 1,1 = 0,77 — выручка упала, значит, рост поездок не покрыл скидку. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — оценка: у снижения могли быть другие цели.</li><li>B, D, E — догадки, в тексте их нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отличайте факт из текста от мнения о нём.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1320, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1320, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
