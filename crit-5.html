<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "text": "Modern aeroplanes are for the most part ‘flown’ by autoflight computers. These computers can take over when the plane is just 30 metres off the ground, maintain whatever speed and height is tapped into the flight management system, and land the aircraft automatically. But when autoflight computers experience situations they haven’t been programmed to handle – sudden structural damage to the aircraft, or extreme weather – they can throw back responsibility to the pilot, who may become confused over the level of control they have. The confusion is made worse by flight deck computers overloading pilots with a blizzard of alerts. This is when crashes are most likely to happen.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?<\/b>", "options": ["Developing autoflight computers further to allow pilotless planes is likely to be safer than the current arrangement.", "Automated systems can be refined to the extent that air crashes will not happen.", "The combination of computer and human control over an aircraft is unsafe in most situations.", "Autoflight computers can be controlled as easily from the ground as from inside the plane.", "Human error in entering data into autoflight computers will always pose a risk."], "correct": 0, "src": "CON"}, {"id": 2, "text": "We should restore capital punishment for the offence of pre-meditated murder. It is true that, in the past, occasional mistakes have been made and innocent men have been hanged. However, with the improvements in forensic science and DNA testing, the chances of a mistake have receded. Restoring capital punishment would ensure real justice is done and, incidentally, it would also save the country a considerable amount of money in housing prisoners on long life sentences.<br><br><b>Which one of the following is an assumption of the above argument?<\/b>", "options": ["Forensic science is a foolproof way of determining guilt.", "Real justice can still be achieved even if there are occasional miscarriages.", "Financial considerations are the most important factors when considering criminal justice legislation.", "Long life sentences will not deter people from committing murder.", "The public would not be against the restoration of capital punishment."], "correct": 1, "src": "ASM"}, {"id": 3, "text": "There is a lot more to interpreting and recognising faces than you might think. Forgetting people we used to know is not that uncommon, and is something we are in fact all guilty of. But next time you’re standing in the supermarket having a conversation with someone you don’t recognise but act like you remember them, take heed that the likelihood is that they will know you are lying. Lying is a lot harder than most people realise, and hiding the fact we are lying is harder still. This is because we all make brief, involuntary facial expressions when we try to conceal or repress something, such as trying to remember someone. These have been termed micro-expressions. So when someone you don’t recognise starts talking to you, you should just confess straight away because your micro-expressions will probably give you away anyway<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["When someone that you don’t recognise starts to talk to you, it is never because they have mistaken you for someone else.", "People are able to recognise the micro-expressions that show that someone is lying.", "People would prefer to know that they have not been recognised rather than have someone pretend to know them.", "The person talking to you will not be embarrassed that you did not recognise them.", "People who are talking to someone that they know never lie."], "correct": 1, "src": "ASM"}, {"id": 4, "text": "The siting of mobile phone masts is a controversial matter in the UK, particularly when they are situated at or near schools and hospitals. The Stewart Report concluded that the balance of evidence indicated that there was no general risk to the health of people living near mobile phone masts but recommended a regular audit of Radio Frequency Radiation (RFR) emissions from masts sited near schools and hospitals. The Government have complied with this latter recommendation and carried out regular audits all of which show that RFR emissions are far below the levels of national and international guidelines. Therefore, mobile phone masts are safe and not injurious to health and can be sited anywhere.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["RFR emissions are more injurious to younger people.", "RFR emissions can affect sensitive equipment in hospitals.", "The audits are not carried out frequently.", "Mobile phones are an essential part of modern communications.", "The only health risk from mobile phone masts is RFR emissions."], "correct": 4, "src": "ASM"}, {"id": 5, "text": "The production of standard disposable nappies from petrochemicals is wholly unsustainable. It is estimated that, while in disposable nappies, a baby will generate two tonnes of used nappies which will end up in landfill. Washable nappies have a significantly reduced environmental impact at production and at eventual disposal. Landfill sites are already in short supply, with recycling programmes aiming to reduce waste. However, if the Government wants to meet its sustainability targets it must do more to increase the use of washable nappies.<br><br><b>Which one of the following, if true, would most strengthen the above argument?<\/b>", "options": ["The washing process of nappies involves further energy consumption.", "Some disposable nappies are made of natural polymers and are compostable.", "Most disposable nappies would take in excess of 500 years to biodegrade in landfill conditions.", "Several local authorities have incentive programmes to encourage parents to choose washable over disposable nappies.", "By 2014 all local authorities must offer doorstep recycling and many already offer composting bins and appliance collection."], "correct": 2, "src": "EF"}, {"id": 6, "text": "In some countries hunting clubs can arrange for members to hunt and kill just about anything that moves around on land. Despite the high costs of these hunts the clubs have grown in popularity as rich businessmen look for new ways to entertain their clients. Rare and endangered species of bears are often the target of the hunts and so there is a risk that these species will become extinct. The growth of these hunting clubs should be opposed.<br><br><b>Which one of the following, if true, would most weaken the above argument?<\/b>", "options": ["Other popular activities such as motor sports also do considerable damage to the environment, but are not opposed.", "The high costs of the hunts mean that small number of people are taking part in this activity.", "The amount of endangered bears hasn’t  changed largely since hunting clubs were formed.", "There are plenty of alternative ways for the rich businessmen to entertain their clients.", "Many hunters kill animals other than their target during the course of a hunt."], "correct": 2, "src": "EF"}, {"id": 7, "text": "Birds of the tit family are very fond of tearing paper - wallpaper, newspaper, notices and bank notes included. They make no use of the paper they have torn. We might explain this puzzling behaviour by noting that the technique that they use for tearing paper is identical to their technique for stripping tree bark to search for insects to eat. This indicates that tits that tear paper are searching for food.<br><br><b>Which of the following, if true, would most weaken the above argument?<\/b>", "options": ["On many occasions tits reject food on bird tables to tear paper.", "Tits carry on tearing paper even when it is obvious to humans that no food is forthcoming.", "Eighty per cent of householders who reported paper tearing behaviour fed the birds.", "Tits use moss from trees and wool from dead sheep for nesting materials.", "Animals often engage in apparently pointless activities that turn out to have a purpose."], "correct": 0, "src": "EF"}, {"id": 8, "text": "Critics of homeopathic medicine argue that much of the apparent success of its remedies is due to the placebo effect (a placebo is a substance containing no medication). The remedies work because the patients believe they will work. In rebuttal, homeopaths often refer to a study involving a herd of pedigree Friesian cows. The herd was divided into two groups of 41 cows each. One group, the treatment group, was given a homeopathic remedy against mastitis, while the control group was given a placebo. The findings showed that 10 of the cows in the control group developed mastitis, while only one in the treatment group developed it.<br><br><b>Which one of the following conclusions is best supported by the passage above?<\/b>", "options": ["The beneficial effects of homeopathy are entirely due to the placebo effect.", "The beneficial effects of homeopathy are apparent and not genuine.", "The beneficial effects of homeopathy in cows cannot be due to the placebo effect.", "The beneficial effects of homeopathy are experienced only by animals.", "The beneficial effects of homeopathy are subject to a great deal of ill-informed criticism."], "correct": 2, "src": "CON"}, {"id": 9, "text": "Thankfully, logicians did not devise the British Constitution. It has evolved through the work of ordinary people, who have adapted the Government of the country to meet the needs of their age. They have always preserved sufficient flexibility to permit such adaptation. And we have avoided a lot of problems because we have never been guided in anything we have done by logic. If you study the period of history from the Civil War, in the middle of the 17th century, to the accession of George I in 1714, you will see the benefits of not making the Constitution too rigid by writing it down. It proves how much there is to be said for ignoring logic and following common sense.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["As the British Constitution was devised by logicians, it cannot be adapted to meet contemporary needs.", "The need to write down the British Constitution became inevitable over time.", "Britain was fortunate that its Constitution evolved flexibly as a result of the work of ordinary people.", "It is not possible to follow both logic and common sense because they will always produce different results.", "It is always right to ignore logic and follow common sense because such a course of action produces the best results."], "correct": 3, "src": "ASM"}, {"id": 10, "text": "Unlike motorways in many European countries, British motorways were built with hard shoulders for use in a breakdown or emergency. The proposal to use the hard shoulders to relieve congestion during peak traffic hours should not be adopted. It would be inconvenient for emergency services because when the hard shoulders are in use, it would be difficult for emergency vehicles to reach an accident. Nor would it be likely to significantly reduce congestion because it would be difficult to remove obstructions caused by broken down vehicles, and in any case the volume of traffic is increasing massively each year. But the most important reason is that we should seek to maintain Britain's relatively good record of safety on motorways. Other ways of relieving congestion must be sought.<br><br><b>Which of the following is an assumption underlying the above argument?<\/b>", "options": ["Britain's record for motorway safety is the best in Europe.", "Congestion on British motorways is not a major problem.", "Accidents are more likely to happen when motorways are congested.", "Changing the design of British motorways will not solve the problem of congestion.", "Britain's good safety record for motorways is partly attributable to the presence of hard shoulders."], "correct": 4, "src": "ASM"}, {"id": 11, "text": "A palaeontologist has argued that T.rex could not have been a predator. He says this because few predators have small eyes (needed to see prey) small arms (needed to hold prey), and huge legs (meaning slow speed), all of which are true of T.rex and that there is no evidence for predation such as bones with T.rex teeth embedded in them. Instead, he argues, it must have been a scavenger as its skull shows it had a good sense of smell and its legs were suited for walking long distances. Other scientists disagree, pointing out that many predators do not use forelimbs in hunting and that the speed of any dinosaur is very hard to assess.<br><br><b>Which one of the following is an underlying assumption of the palaeontologist's argument?<\/b>", "options": ["Predators do not leave their teeth embedded in the bones of their victims.", "Generalizations cannot be made between modern and prehistoric periods.", "T.rex could not have been both a scavenger and a predator.", "All predators must be able to move quickly.", "There are not enough fossilised remains yet for scientists to make a judgement."], "correct": 2, "src": "ASM"}, {"id": 12, "text": "Crazy as it seems, it looks as if lead poisoning could be the major cause of the rise and fall of violent crime. Lead is so toxic that it is unsafe at any level and in Europe it has been banned from many products, including paint and petrol, since the 1990s. Lead poisoning in infancy, even at very low levels, impairs the development of those parts of the brain that regulate behaviour and mood. The effect is stronger in boys than in girls. Lead poisoning is associated with attention deficit disorder, impulsiveness, aggression and, some think, psychopathy. Studies between cities, states and nations show that the rise and fall in violent crime follows, with a roughly 20-year lag, the rise and fall in the exposure of infants to trace quantities of lead. Virtually all studies agree there is a strong correlation.<br><br><b>Which one of the following could be drawn as a conclusion from the above passage?<\/b>", "options": ["European countries could soon expect to see a fall in levels of violent crime.", "Possible causes of violent crime such as poor social conditions and drugs can now be discounted.", "If lead in petrol and paint is banned worldwide, violent crime will become almost unknown.", "Countries with less commitment to safety standards will be reluctant to ban lead from products.", "Boys who are exposed to lead in infancy are highly likely to go on to commit violent crimes in their early twenties."], "correct": 0, "src": "CON"}, {"id": 13, "text": "In attempting to reduce the high injury toll from road offences such as drink-driving, successive governments have tended to rely on the deterrent effect of increasingly severe penalties. However, severe penalties can act as a deterrent only if potential offenders believe that the chances of being detected are moderate or high. Recent surveys have shown that people perceive the chance of detection for the offence of drink-driving as being very small.<br><br><b>Which one of the following can be concluded from the passage above?<\/b>", "options": ["Severe penalties for the offence of drink-driving do not constitute an effective deterrent.", "Successive governments have not tackled the problem of drink-driving.", "Drink-driving offenders have a misguided perception of their chances of detection.", "Penalties for road offences such as drink-driving should be even more severe.", "There must be better ways to tackle drink-driving, for example education."], "correct": 0, "src": "CON"}, {"id": 14, "text": "The so-called 'baby-boomer' generation (people born in Britain in the late 1940's /early 1950's) will enjoy a good chance of reaching a ripe old-age. They benefited from a diet that was austere but healthy when they were children and this has influenced their adult tastes. In addition, people in this age group have given up unhealthy activities such as smoking cigarettes. In contrast, the generation represented by those currently in their 20's and early 30's are in danger of experiencing serious health problems which would decrease their life expectancy. This is the 'Big Mac' generation whose childhood diet was high in fat and sugar, which they continue to crave. They also show worrying tendencies to indulge in 'binge drinking' and other health-threatening activities.<br><br><b>Which of the following is a conclusion that can be drawn from the above passage?<\/b>", "options": ["Health is largely determined by factors which the individual can control.", "Health education is becoming less effective in controlling behaviour.", "The trend towards ever-increasing life expectancy will be reversed.", "The 'Big Mac' generation would be wise to change their lifestyle.", "The health service will be put under greater strain in the future."], "correct": 3, "src": "CON"}, {"id": 15, "text": "Currently 56% of British school children do not study a foreign language at all at GCSE, and seven university language departments have closed in the past seven years. People with only one language feel disempowered, whereas those who speak other languages are comfortable to travel the world. Once you can speak their languages, some of the mystique of foreigners goes away and you feel less intimidated by them. Good language skills are also important in the international business world.<br><br><b>Which one of the following conclusions is best supported by the passage above?<\/b>", "options": ["British education does not adequately equip people to interact in a global environment.", "If Britons were more proficient in languages they would enjoy holidays overseas more.", "The drop in language learning in Britain has put many language teachers out of work.", "Britons do not see the need to learn other languages, as most foreigners learn English.", "The poor language skills of British businessmen are holding back many potentially lucrative deals."], "correct": 0, "src": "CON"}, {"id": 16, "text": "The number of crimes carried out by girls has increased significantly. The rise in offences such as criminal damage, public disorder, robbery and minor assaults by girls under 18 are all seen as linked to a rise in alcohol consumption. So the greater availability of alcohol is contributing to rising crime levels among young girls.<br><br><b>Which one of the following, if true, would most weaken the above argument?<\/b>", "options": ["Greater alcohol consumption is associated with crime in males as well as females.", "Girls who commit offences are now more likely to be prosecuted for them.", "The greater availability of alcohol affects all age groups.", "Offences of violence and disorder were traditionally associated with males.", "Girls under 18 are drinking to much higher levels than in previous years."], "correct": 1, "src": "EF"}, {"id": 17, "text": "A dishonest act, such as stealing money from a handbag or cheating in school, may arise for one of many different reasons. But the reasons may be consistent with the personality of the individual involved. One child may steal, for example, in order to show off; another, to get money to support a hobby (or to get a birthday present for a younger sister); another, to express aggression or hatred against the person from whom he or she steals. One child may cheat in order to avoid punishment for academic failure; another, because of personal ambition; another to express contempt for the system.<br><br><b>Which one of the following is a conclusion that can be drawn from the passage above?<\/b>", "options": ["It is wrong to assume that a child who is dishonest in one kind of situation will be dishonest in others.", "A child who cheats does so for very complex reasons.", "A child whose motive is generosity towards someone else should not be blamed for stealing.", "Underlying all dishonest acts is hostility towards others.", "Children who are neither exhibitionist nor aggressive nor acquisitive are unlikely to steal money."], "correct": 0, "src": "CON"}, {"id": 18, "text": "The demand for blood donors is increasing all over the world. In Western countries, in particular, demand has been rising so rapidly that shortages have begun to appear. In all such countries, demand is growing much faster than rates of growth in populations aged 18-65 from whom donors are drawn. And, despite a massive research effort to find alternatives, it remains true that in medicine there is no substitute for human blood.<br><br><b>Which one of the following conclusions can be drawn from the passage?<\/b>", "options": ["As the demand for blood has increased, so has the supply fallen.", "The rate of growth of the blood-donor population has been slowing recently.", "The increase in the rate of demand for blood is mainly due to population growth.", "If more blood donors could be found, there would be no need to find a substitute for human blood.", "The problem of the increase in demand for blood shows no sign of disappearing."], "correct": 4, "src": "CON", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA/QAAAEuBAMAAADSMUQxAAAAGFBMVEX////6+vrl5eWwsLB1dXVMTEwoKCgDAwNAQWGPAAA6WUlEQVR42u29S5ccx5Um+F0LqM6ZLiLjmkdCPKdVQvojSS4kMeMFcjGqEjIjwNl2UUTNetRV6v3Uo//EzB+oKvXMugjwnOmdkBGZqtqRiBep2kDMcPcEexaQMtwsEtKcoyqE2yzMPfKBJ4VIKQLwu2ASEeHm1+2za3bvdbufAYUUUkghhRRSSCGFFFJIIYUUUkghhRRSSCGFFFJIIYUUUkghhfzBhICAi2547WSscQlYv170xOsmZqJxCVBGr4K2Uq3ELFpeic5kAJcAzDqr0KcfrYKWuPKdn62AluLDDHqEK6BtCWm8CtCvSGcCEMW697pKAX0BfSEF9IUU0BdSQF9IAX0hBfSFFNAXsrpy6aWudvzyOP696uvbbJlvot/pcvIS/cRmv2Z7Dr9Y0k64AF6sbeG+QJNOOXrCheefyX+hxOdLWX3pRqt5swaI+vyjwH3uVS/wk2cM1Q8ZQOnG79gGtZ984Vv/6Ws0Uqli/c9fcFK9efPmzZu1ZzWWf1n54RPvdFY2d04/zKYLpwbxQ1CDT3/+lndahcZFQN/YSCKxAwTV597n1B1bL3PLULgAgnL0O0LPTzR6POXjpz7Ai75GlFBKTXeeoVCznP/UPH6n5mPtnf6R2Na0WYY0urJ9Wn9yT2sXVC8AelEb/8PH+yUX/vxW gers will not be widely known.", "If tobacco smoking had been illegal, it would have been less widespread.", "There has been insufficient research on the damage caused by cannabis smoking.", "Cannabis users are motivated by the fact that they are engaging in an illegal activity."], "correct": 1, "src": "ASM"}, {"id": 20, "text": "Concern has been expressed about the UK Government policy of expanding the number of university places available. It is argued that the economy does not need the number of graduates that this policy produces. However, graduate unemployment has actually decreased since the policy of expansion was implemented. This shows that the Government has wisely anticipated the employment demands of an expanding modern 'high-tech' economy and that the policy of increasing the supply of university places is an appropriate response.<br><br><b>Which one of the following is an assumption underlying the above argument?<\/b>", "options": ["An increasing number of graduates is necessary for any economic growth.", "Modern 'high-tech' economies will always need a substantial supply of graduates.", "Graduates have not taken large numbers of jobs previously done by non-graduates.", "Many jobs done by graduates do not require a graduate qualification.", "Expansion of university places is always in response to the needs of the economy."], "correct": 2, "src": "ASM"}, {"id": 21, "text": "Some of the great sea-mammals, such as the sperm whale, have brains many times larger than ours. It is a fact of evolution that organs do not grow or remain large unless they are used; if they are not used they shrink or even disappear. It must be concluded therefore that the sperm whale makes intelligent use of the vast brain it possesses, perhaps at thought levels well beyond our understanding.<br><br><b>Which of the following would, if true, weaken the argument?<\/b>", "options": ["Humans have developed intelligence despite having smaller brains than whales.", "Whales lack the ability to communicate in language.", "Large brains may have uses that do not involve intelligence.", "There is no correlation between the size of the animal and the size of its brain.", "Whale intelligence may be of a kind that humans do not recognise."], "correct": 2, "src": "EF"}, {"id": 22, "text": "Many rich countries protect their farming sectors with generous subsidies. It may be claimed that this policy can benefit countries in which people are starving or malnourished by encouraging farmers to produce more food than can be consumed in their own countries. But the policy is not in the best interests of poorer countries. Poor countries do not want charitable handouts — they want to develop the ability to feed their populations by their own efforts. If the amount spent on the European Commission's Common Agricultural Policy were invested in, say, irrigation schemes, that would transform the agriculture of many impoverished nations. This would surely be a better way to solve the problem of world hunger.<br><br><b>Which one of the following, if true, would most strengthen the above argument?<\/b>", "options": ["Malnutrition is less likely to occur in countries with slow population growth.", "Wars and natural disasters such as floods are major causes of malnutrition.", "Much of the excess food produced by rich countries rots before it can be exported.", "Without subsidies to farmers in rich countries, the countryside would deteriorate.", "Agriculture in poor countries is less mechanised than in rich countries."], "correct": 2, "src": "EF"}];

    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Назад</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Завершить тест</button>'
        : '<button class="nav-btn" id="next">Далее &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: история результатов (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // первая попытка — истории ещё нет
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">История попыток &middot; лучший результат ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Итог</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Процент</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Не отвечено</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Твой ответ: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Правильный: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Пройти ещё раз</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1320, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline × Supabase: авторизация + облачное сохранение ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: перехватываем saveAttempt — localStorage остаётся, добавляем облако */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: saveAttempt нет, оборачиваем finish */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>
