<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;

  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;

  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;

    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "Zoos should no longer keep elephants. In the wild, elephants walk many kilometres a day and live in large family groups, but even the best zoo enclosures cannot provide enough space or a natural social life. As a result, elephants in zoos often show signs of stress, such as constant swaying, and they live significantly shorter lives than elephants in protected wild areas. Supporters of zoos argue that seeing elephants close up encourages visitors to support conservation. However, there is little evidence that zoo visitors give more to conservation charities than other people, and high-quality wildlife films now allow people to watch elephants behaving naturally without any animal being kept in captivity.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Wildlife films are a better way than zoos of teaching people about elephants.", "Zoo enclosures cannot give elephants enough space or a natural social life.", "Seeing elephants in zoos does not encourage people to support conservation.", "Zoos should stop keeping elephants.", "Elephants in zoos live shorter lives than elephants in protected wild areas."], "correct": 3, "explain": "The opening sentence is the claim that everything else supports. B and E are reasons. C overstates the passage, which only says there is 'little evidence' for the opposing view. A is close to a point used against the opposing view, but it is not what the passage is trying to prove."}, {"id": 2, "text": "Return train tickets between two cities cost:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Ticket</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Conditions</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Anytime</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£48</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any train</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Off-peak</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£30</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Cannot leave before 09:30 on weekdays</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Advance</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£22</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Only valid on one booked train; no changes</td></tr></table>A railcard costs £30 for a year and gives one third off any of these tickets. This year Marat will make 6 return journeys, all leaving at 08:15 on weekdays. He must be able to change his train at short notice.<br><br><b>What is the least he can spend in total this year on tickets and, if he buys one, a railcard?</b>", "options": ["£150", "£180", "£222", "£258", "£288"], "correct": 2, "explain": "Off-peak tickets cannot be used at 08:15 on weekdays, and Advance tickets cannot be changed, so he needs Anytime tickets. Without a railcard: 6 × £48 = £288. With a railcard: £30 + 6 × £32 = £222. £150 uses Off-peak tickets with a railcard, which he cannot use."}, {"id": 3, "text": "Some employers refuse to consider job applicants who have gaps in their employment history, believing that such gaps show a lack of commitment. This policy is unfair and should be abandoned. People leave paid work for many reasons, such as caring for a sick relative, raising children or recovering from illness, and none of these says anything about how committed they would be to a job. Moreover, employers who reject such applicants may miss out on talented people who have gained valuable skills, such as organisation and patience, during their time away from paid work.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["People leave paid work for many different reasons.", "Employers may miss out on talented people by rejecting such applicants.", "People who have spent time away from paid work are more organised and patient than other applicants.", "Employers should stop rejecting applicants simply because there are gaps in their employment history.", "Gaps in a person's employment history do not show a lack of commitment."], "correct": 3, "explain": "The conclusion is in the second sentence: the policy should be abandoned. E, A and B are the reasons given for it. C is not claimed; the passage only says such people may have gained these skills."}, {"id": 4, "text": "A printer prints 24 pages per minute, and every print job also needs 30 seconds to start up. A teacher prints 15 copies of a 16-page worksheet, sending each copy as a separate job.<br><br><b>How long does the printing take altogether?</b>", "options": ["10 minutes", "10 minutes 30 seconds", "17 minutes 30 seconds", "18 minutes", "25 minutes"], "correct": 2, "explain": "Each job takes 16 ÷ 24 minutes = 40 seconds of printing plus 30 seconds to start: 70 seconds. 15 jobs take 1,050 seconds = 17 minutes 30 seconds. 10 minutes 30 seconds would be correct if all copies were sent as one job."}, {"id": 5, "text": "Since the city introduced a charge for driving into the centre, the number of cars entering the centre has fallen by 30%. Shopkeepers in the centre had feared that they would lose customers, but their total sales have in fact risen slightly. Surveys show that the proportion of shoppers who arrive by bus, by bicycle or on foot has increased.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Most shoppers now travel to the city centre by bus.", "The fall in the number of cars entering the centre has not led to a fall in the shops' total sales.", "The charge has reduced air pollution in the city centre.", "Shoppers who arrive by car spend less than shoppers who arrive on foot.", "Other cities should introduce a similar charge for driving into their centres."], "correct": 1, "explain": "Cars fell by 30% but sales did not fall, so B is directly supported. A is not supported: the proportion arriving by bus increased, but we do not know it is a majority. E is a recommendation going beyond one city. D and C introduce information that is not in the passage."}, {"id": 6, "text": "In a town, 60% of adults own a car. Of the adults who own a car, 25% also own a bicycle. Of the adults who do not own a car, 50% own a bicycle.<br><br><b>What percentage of all the adults in the town own a bicycle?</b>", "options": ["25%", "35%", "37.5%", "45%", "75%"], "correct": 1, "explain": "Car owners with a bicycle: 25% of 60% = 15% of adults. Non-car-owners with a bicycle: 50% of 40% = 20%. Total 35%. 37.5% is the simple average of 25% and 50%, which ignores the sizes of the two groups."}, {"id": 7, "text": "At a language summer school, every student who passes the final test receives a certificate, and only students who pass the final test receive one. Students who attend fewer than 80% of the classes are not allowed to take the final test. Timur received a certificate.<br><br><b>Which one of the following must be true?</b>", "options": ["Timur attended every class.", "Some students who attended fewer than 80% of the classes received a certificate.", "Timur achieved the highest mark in the final test.", "Every student who attended at least 80% of the classes received a certificate.", "Timur attended at least 80% of the classes."], "correct": 4, "explain": "Timur has a certificate, so he passed the test; to take the test he must have attended at least 80% of classes. A goes further than this. D does not follow: attending is required but does not guarantee passing. C is not stated, and B contradicts the rules."}, {"id": 8, "text": "Asel needs 3 packs of notebooks, 2 packs of pens and 1 calculator. Three shops sell them at these prices:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Shop</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Notebooks (pack)</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Pens (pack)</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Calculator</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Other conditions</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">X</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">900 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">400 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,500 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Free delivery</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Y</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">800 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">450 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Delivery 700 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Z</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">850 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">380 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,200 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10% off orders over 8,000 ₸; free delivery</td></tr></table>She will buy everything from one shop.<br><br><b>What is the lowest total she can pay?</b>", "options": ["8,559 ₸", "9,000 ₸", "9,510 ₸", "10,000 ₸", "10,700 ₸"], "correct": 0, "explain": "X: 2,700 + 800 + 6,500 = 10,000 ₸. Y: 2,400 + 900 + 6,000 + 700 = 10,000 ₸. Z: 2,550 + 760 + 6,200 = 9,510 ₸, which is over 8,000 ₸, so 10% off gives 8,559 ₸. 9,510 ₸ forgets the discount."}, {"id": 9, "text": "Our town's population has grown by 20% over the past five years, but the number of doctors at the local health centre has stayed the same. Patients are therefore having to wait longer for appointments than they did five years ago.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The doctors at the health centre are not now able to see more patients each day than they could five years ago.", "Other towns have more doctors per person than our town.", "Waiting time is the most important measure of a health service.", "Most of the new residents are elderly.", "The town's population will continue to grow."], "correct": 0, "explain": "More people sharing the same number of doctors only means longer waits if each doctor cannot see more patients than before (for example through longer hours or shorter appointments). So A is assumed. D, B, C and E are not needed for the conclusion."}, {"id": 10, "text": "A plane leaves Astana at 23:40 local time and lands in London at 03:10 London time the next morning. At this time of year, Astana time is 5 hours ahead of London time.<br><br><b>How long is the flight?</b>", "options": ["3 hours 30 minutes", "5 hours", "8 hours 30 minutes", "9 hours 30 minutes", "13 hours 30 minutes"], "correct": 2, "explain": "23:40 in Astana is 18:40 in London. From 18:40 to 03:10 the next day is 8 hours 30 minutes. 3 hours 30 minutes simply subtracts the two clock times and ignores the time difference."}, {"id": 11, "text": "In the past, students at our school who chose to study a third language achieved better results in all their subjects than students who did not. So if we make a third language compulsory for every student, the school's overall results will improve.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Studying a third language helps students to do better in their other subjects, rather than stronger students simply being more likely to choose it.", "Results in language subjects are usually higher than results in other subjects.", "Students who chose a third language worked harder in all their subjects.", "Languages are more useful than science subjects.", "Students enjoy learning foreign languages."], "correct": 0, "explain": "The argument moves from a link (language students do better) to a cause (making everyone study a language will raise results). That only works if the language itself helps, not if able students simply choose it. C describes an alternative explanation that would weaken the argument; E, D and B are not required."}, {"id": 12, "text": "A password has four characters: two different letters chosen from A, B, C and D, followed by two different digits chosen from 1, 2 and 3. The order of the characters matters.<br><br><b>How many different passwords are possible?</b>", "options": ["36", "48", "72", "144", "256"], "correct": 2, "explain": "Letters: 4 choices, then 3 = 12 ordered pairs. Digits: 3, then 2 = 6. Total 12 × 6 = 72. 144 wrongly uses 12 choices for the digits as well; 256 allows any of the four letters in every position."}, {"id": 13, "text": "The bus company's new smartphone app, which lets passengers buy tickets on their phones, will save the company money, because it will no longer need to pay staff to sell tickets at the bus station.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Passengers prefer to buy tickets from members of staff.", "Other bus companies have introduced similar apps.", "Ticket prices will not change when the app is introduced.", "The cost of running the app will be less than the cost of the staff who currently sell tickets.", "The app will be especially popular with young passengers."], "correct": 3, "explain": "Saving money on staff is not the same as saving money overall: if the app costs more to run than the staff did, the company would lose money. So D must be assumed. A would weaken the argument; E, C and B are not required."}, {"id": 14, "text": "To share £120 between Ali and Bota in the ratio 3 : 1, I calculate 120 ÷ 4 = 30, so Ali receives 3 × 30 = £90.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["To make 2 litres of paint mixed 3 parts blue to 1 part white, I find 2 ÷ 4 = 0.5, so I need 3 × 0.5 = 1.5 litres of blue.", "£120 is 20% more than £100.", "On a map with scale 1 : 4, a line 3 cm long represents 3 × 4 = 12 cm.", "A rectangle 3 cm by 1 cm has a perimeter of 2 × (3 + 1) = 8 cm.", "If 3 pens cost £1.20, one pen costs £1.20 ÷ 3 = 40p."], "correct": 0, "explain": "The example adds the parts of the ratio (3 + 1 = 4), divides the total by this, and multiplies by the share wanted. Only A does all three steps. C multiplies by a scale, D finds a perimeter and E only divides."}, {"id": 15, "text": "Several studies show that people who drink green tea every day are less likely to develop heart disease than people who do not. A tea company therefore claims that drinking green tea protects people against heart disease.<br><br><b>Which one of the following, if true, would most weaken the tea company's claim?</b>", "options": ["Green tea contains less caffeine than coffee.", "Many people dislike the taste of green tea.", "The studies included people from several different countries.", "People who drink green tea every day are also much more likely than others to exercise regularly and not to smoke.", "Heart disease is the most common cause of death in many countries."], "correct": 3, "explain": "If green-tea drinkers also exercise more and smoke less, these habits could explain their lower rate of heart disease, so the tea itself may have no effect. C slightly strengthens the claim; A, B and E are irrelevant to it."}, {"id": 16, "text": "Gulnara lives in a village and must reach the city by 09:30. Buses leave the village for the town at 06:10, 06:50, 07:30 and 08:10, and the journey takes 35 minutes. From the bus stop in the town it is a 10-minute walk to the railway station, and she wants to be at the station at least 5 minutes before her train leaves. Trains from the town to the city leave at 07:25, 08:05, 08:45 and 09:30, and take 1 hour 5 minutes.<br><br><b>What is the latest bus she can catch?</b>", "options": ["06:10", "06:50", "07:30", "08:10", "She cannot arrive in time"], "correct": 1, "explain": "To arrive by 09:30 she needs the 08:05 train (arrives 09:10); the 08:45 train arrives at 09:50. She must be at the station by 08:00, so at the bus stop by 07:50, so the bus must leave by 07:15. The 06:50 bus arrives at 07:25. The 07:30 bus arrives at 08:05, too late."}, {"id": 17, "text": "Last year, a city replaced the traffic lights at 20 dangerous junctions with roundabouts. In the following twelve months, the number of accidents at these junctions fell by half. The city should therefore replace traffic l  "correct": 3, "explain": "The original reasons: if X then Y; Y; so X. Yellow leaves (or a stopped car) could have other causes. D makes the same mistake. E, A and B are valid. C makes a different mistake (not X, so not Y)."}, {"id": 28, "text": "A fully charged phone battery lasts 20 hours if the phone is left idle, 8 hours if it is used only for calls, or 5 hours if it is used only to watch videos. Starting with a full battery, Dias watches videos for 2 hours and then makes calls for 2 hours.<br><br><b>For how many more hours can the phone then be left idle before the battery runs out?</b>", "options": ["3", "5", "7", "9", "12"], "correct": 2, "explain": "Videos use 2/5 of the battery and calls use 2/8, a total of 0.4 + 0.25 = 0.65. The remaining 0.35 of the battery lasts 0.35 × 20 = 7 hours when idle."}, {"id": 29, "text": "A company should not advertise a product as 'healthy' if it contains a large amount of sugar, even if it also contains vitamins, because customers are likely to be misled about the product's overall effect on their health.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["A newspaper should correct its mistakes as soon as possible.", "Shops should not sell sugary food to young children.", "A doctor should always recommend the cheapest medicine that works.", "A restaurant should list every ingredient used in its dishes.", "An estate agent should not describe a flat as 'close to the park' if a busy motorway separates the flat from the park."], "correct": 4, "explain": "The principle is that a description which is partly true should not be used if it gives a misleading overall impression. E applies this. D is about giving full information in general, not about avoiding misleading claims; B, C and A concern other principles."}, {"id": 30, "text": "An LED light bulb costs £6, lasts 10 years and uses £2 of electricity a year. An old-style bulb costs £1, lasts only 1 year and uses £7 let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
        ${q.explain ? `<details style="margin-top:8px;font-size:14px;line-height:1.55"><summary style="cursor:pointer;color:var(--gold,#C9A227);font-weight:600">Why ${'ABCDE'[q.correct]}?</summary><div style="margin-top:6px;opacity:.9">${q.explain}</div></details>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

           background:rgba(6,10,20,.78);backdrop-filter:blur(4px);padding:20px}

  #pl-gate h3{font-family:Sora,Inter,sans-serif;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}

  #pl-gate button{font:600 14px Inter,sans-serif;padding:11px 22px;border-radius:5px;cursor:pointer;border:0}
  #pl-gate .go{background:#C9A227;color:#10192C}
  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6ECF7}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
