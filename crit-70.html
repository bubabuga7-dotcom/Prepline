<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "Zoos should no longer keep elephants. In the wild, elephants walk many kilometres a day and live in large family groups, but even the best zoo enclosures cannot provide enough space or a natural social life. As a result, elephants in zoos often show signs of stress, such as constant swaying, and they live significantly shorter lives than elephants in protected wild areas. Supporters of zoos argue that seeing elephants close up encourages visitors to support conservation. However, there is little evidence that zoo visitors give more to conservation charities than other people, and high-quality wildlife films now allow people to watch elephants behaving naturally without any animal being kept in captivity.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Wildlife films are a better way than zoos of teaching people about elephants.", "Zoo enclosures cannot give elephants enough space or a natural social life.", "Seeing elephants in zoos does not encourage people to support conservation.", "Zoos should stop keeping elephants.", "Elephants in zoos live shorter lives than elephants in protected wild areas."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тезис — в первом предложении.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Зоопарки должны перестать держать слонов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — доводы.</li><li>A — не сказано так сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всё остальное подкрепляет первую фразу.</div></div>"}, {"id": 2, "topic": "PS", "text": "Return train tickets between two cities cost:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Ticket</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Conditions</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Anytime</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£48</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any train</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Off-peak</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£30</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Cannot leave before 09:30 on weekdays</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Advance</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£22</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Only valid on one booked train; no changes</td></tr></table>A railcard costs £30 for a year and gives one third off any of these tickets. This year Marat will make 6 return journeys, all leaving at 08:15 on weekdays. He must be able to change his train at short notice.<br><br><b>What is the least he can spend in total this year on tickets and, if he buys one, a railcard?</b>", "options": ["£150", "£180", "£222", "£258", "£288"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">8:15 в будни → не off-peak; нужна гибкость → не advance → Anytime 48 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Без карты: 6 · 48 = 288 £.</li><li>С картой: 30 + 6 · 32 = 222 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — запрещённые билеты.</li><li>E — без карты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала отсейте по условиям.</div></div>"}, {"id": 3, "topic": "MC", "text": "Some employers refuse to consider job applicants who have gaps in their employment history, believing that such gaps show a lack of commitment. This policy is unfair and should be abandoned. People leave paid work for many reasons, such as caring for a sick relative, raising children or recovering from illness, and none of these says anything about how committed they would be to a job. Moreover, employers who reject such applicants may miss out on talented people who have gained valuable skills, such as organisation and patience, during their time away from paid work.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["People leave paid work for many different reasons.", "Employers may miss out on talented people by rejecting such applicants.", "People who have spent time away from paid work are more organised and patient than other applicants.", "Employers should stop rejecting applicants simply because there are gaps in their employment history.", "Gaps in a person's employment history do not show a lack of commitment."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Политику отказа надо отменить.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: работодателям не стоит отклонять кандидатов из-за перерывов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — промежуточный вывод.</li><li>A, B — доводы.</li><li>C — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Should be abandoned» — вывод.</div></div>"}, {"id": 4, "topic": "PS", "text": "A printer prints 24 pages per minute, and every print job also needs 30 seconds to start up. A teacher prints 15 copies of a 16-page worksheet, sending each copy as a separate job.<br><br><b>How long does the printing take altogether?</b>", "options": ["10 minutes", "10 minutes 30 seconds", "17 minutes 30 seconds", "18 minutes", "25 minutes"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одна копия: 16 стр. = 40 с + 30 с запуск = 70 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>15 · 70 = 1050 с = 17 мин 30 с. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без запуска.</li><li>B — запуск один раз.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Запуск — для каждой задачи.</div></div>"}, {"id": 5, "topic": "CON", "text": "Since the city introduced a charge for driving into the centre, the number of cars entering the centre has fallen by 30%. Shopkeepers in the centre had feared that they would lose customers, but their total sales have in fact risen slightly. Surveys show that the proportion of shoppers who arrive by bus, by bicycle or on foot has increased.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Most shoppers now travel to the city centre by bus.", "The fall in the number of cars entering the centre has not led to a fall in the shops' total sales.", "The charge has reduced air pollution in the city centre.", "Shoppers who arrive by car spend less than shoppers who arrive on foot.", "Other cities should introduce a similar charge for driving into their centres."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Машин на 30% меньше, продажи слегка выросли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Спад машин не привёл к спаду продаж. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод из фактов.</div></div>"}, {"id": 6, "topic": "PS", "text": "In a town, 60% of adults own a car. Of the adults who own a car, 25% also own a bicycle. Of the adults who do not own a car, 50% own a bicycle.<br><br><b>What percentage of all the adults in the town own a bicycle?</b>", "options": ["25%", "35%", "37.5%", "45%", "75%"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Велосипед: 60% · 25% + 40% · 50%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>15% + 20% = 35%. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — среднее 25 и 50.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Взвешенное среднее.</div></div>"}, {"id": 7, "topic": "CON", "text": "At a language summer school, every student who passes the final test receives a certificate, and only students who pass the final test receive one. Students who attend fewer than 80% of the classes are not allowed to take the final test. Timur received a certificate.<br><br><b>Which one of the following must be true?</b>", "options": ["Timur attended every class.", "Some students who attended fewer than 80% of the classes received a certificate.", "Timur achieved the highest mark in the final test.", "Every student who attended at least 80% of the classes received a certificate.", "Timur attended at least 80% of the classes."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сертификат ↔ сдал тест; тест — только при ≥ 80% посещений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тимур получил сертификат → сдал → посещал ≥ 80%. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — не обязательно.</li><li>B — противоречит.</li><li>D — сдать могли не все.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка необходимых условий.</div></div>"}, {"id": 8, "topic": "PS", "text": "Asel needs 3 packs of notebooks, 2 packs of pens and 1 calculator. Three shops sell them at these prices:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Shop</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Notebooks (pack)</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Pens (pack)</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Calculator</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Other conditions</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">X</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">900 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">400 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,500 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Free delivery</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Y</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">800 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">450 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Delivery 700 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Z</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">850 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">380 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,200 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10% off orders over 8,000 ₸; free delivery</td></tr></table>She will buy everything from one shop.<br><br><b>What is the lowest total she can pay?</b>", "options": ["8,559 ₸", "9,000 ₸", "9,510 ₸", "10,000 ₸", "10,700 ₸"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">X: 2700 + 800 + 6500 = 10 000; Y: 2400 + 900 + 6000 + 700 = 10 000.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Z: 2550 + 760 + 6200 = 9510 > 8000 → −10% = 8559 ₸. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — Z без скидки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте порог скидки.</div></div>"}, {"id": 9, "topic": "ASM", "text": "Our town's population has grown by 20% over the past five years, but the number of doctors at the local health centre has stayed the same. Patients are therefore having to wait longer for appointments than they did five years ago.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The doctors at the health centre are not now able to see more patients each day than they could five years ago.", "Other towns have more doctors per person than our town.", "Waiting time is the most important measure of a health service.", "Most of the new residents are elderly.", "The town's population will continue to grow."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Людей +20%, врачей столько же → ждать дольше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: врачи не стали принимать больше пациентов в день. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> А если производительность выросла?</div></div>"}, {"id": 10, "topic": "PS", "text": "A plane leaves Astana at 23:40 local time and lands in London at 03:10 London time the next morning. At this time of year, Astana time is 5 hours ahead of London time.<br><br><b>How long is the flight?</b>", "options": ["3 hours 30 minutes", "5 hours", "8 hours 30 minutes", "9 hours 30 minutes", "13 hours 30 minutes"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вылет 23:40 Астаны = 18:40 Лондона.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>До 03:10 по Лондону: 8 ч 30 мин. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без разницы поясов.</li><li>E — разница прибавлена не туда.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переведите в один пояс.</div></div>"}, {"id": 11, "topic": "ASM", "text": "In the past, students at our school who chose to study a third language achieved better results in all their subjects than students who did not. So if we make a third language compulsory for every student, the school's overall results will improve.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Studying a third language helps students to do better in their other subjects, rather than stronger students simply being more likely to choose it.", "Results in language subjects are usually higher than results in other subjects.", "Students who chose a third language worked harder in all their subjects.", "Languages are more useful than science subjects.", "Students enjoy learning foreign languages."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Третий язык = лучшие оценки → сделать обязательным.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: сам язык улучшает оценки, а не сильные ученики его выбирали. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — альтернативная причина (ослабляет).</li><li>B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Причина или отбор?</div></div>"}, {"id": 12, "topic": "PS", "text": "A password has four characters: two different letters chosen from A, B, C and D, followed by two different digits chosen from 1, 2 and 3. The order of the characters matters.<br><br><b>How many different passwords are possible?</b>", "options": ["36", "48", "72", "144", "256"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две разные буквы из 4: 4 · 3 = 12; две разные цифры из 3: 3 · 2 = 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 · 6 = 72. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сочетания без порядка.</li><li>E — с повторами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок важен — размещения.</div></div>"}, {"id": 13, "topic": "ASM", "text": "The bus company's new smartphone app, which lets passengers buy tickets on their phones, will save the company money, because it will no longer need to pay staff to sell tickets at the bus station.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Passengers prefer to buy tickets from members of staff.", "Other bus companies have introduced similar apps.", "Ticket prices will not change when the app is introduced.", "The cost of running the app will be less than the cost of the staff who currently sell tickets.", "The app will be especially popular with young passengers."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приложение сэкономит, т. к. не нужен персонал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: приложение обходится дешевле персонала. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Новые расходы.</div></div>"}, {"id": 14, "topic": "PS", "text": "To share £120 between Ali and Bota in the ratio 3 : 1, I calculate 120 ÷ 4 = 30, so Ali receives 3 × 30 = £90.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["To make 2 litres of paint mixed 3 parts blue to 1 part white, I find 2 ÷ 4 = 0.5, so I need 3 × 0.5 = 1.5 litres of blue.", "£120 is 20% more than £100.", "On a map with scale 1 : 4, a line 3 cm long represents 3 × 4 = 12 cm.", "A rectangle 3 cm by 1 cm has a perimeter of 2 × (3 + 1) = 8 cm.", "If 3 pens cost £1.20, one pen costs £1.20 ÷ 3 = 40p."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: сумма : (сумма частей) · часть.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 2 л : 4 = 0,5 → 3 · 0,5 = 1,5 л синей. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — масштаб.</li><li>B, D, E — другой метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление в отношении.</div></div>"}, {"id": 15, "topic": "WKN", "text": "Several studies show that people who drink green tea every day are less likely to develop heart disease than people who do not. A tea company therefore claims that drinking green tea protects people against heart disease.<br><br><b>Which one of the following, if true, would most weaken the tea company's claim?</b>", "options": ["Green tea contains less caffeine than coffee.", "Many people dislike the taste of green tea.", "The studies included people from several different countries.", "People who drink green tea every day are also much more likely than others to exercise regularly and not to smoke.", "Heart disease is the most common cause of death in many countries."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чай → меньше болезней сердца?</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если любители чая чаще занимаются спортом — дело может быть в спорте. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Третий фактор.</div></div>"}, {"id": 16, "topic": "PS", "text": "Gulnara lives in a village and must reach the city by 09:30. Buses leave the village for the town at 06:10, 06:50, 07:30 and 08:10, and the journey takes 35 minutes. From the bus stop in the town it is a 10-minute walk to the railway station, and she wants to be at the station at least 5 minutes before her train leaves. Trains from the town to the city leave at 07:25, 08:05, 08:45 and 09:30, and take 1 hour 5 minutes.<br><br><b>What is the latest bus she can catch?</b>", "options": ["06:10", "06:50", "07:30", "08:10", "She cannot arrive in time"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В городе к 9:30 → поезд 8:05 (приезд 9:10).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На станции к 8:00 → на остановке к 7:50.</li><li>Автобус 6:50 приезжает в 7:25 ✔; 7:30 → 8:05 — поздно. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — поезд 8:45 приходит в 9:50.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте от конца.</div></div>"}, {"id": 17, "topic": "WKN", "text": "Last year, a city replaced the traffic lights at 20 dangerous junctions with roundabouts. In the following twelve months, the number of accidents at these junctions fell by half. The city should therefore replace traffic lights with roundabouts at all its junctions.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Roundabouts are cheaper to maintain than traffic lights.", "Traffic lights were first used before roundabouts.", "Some of the accidents at the new roundabouts involved cyclists.", "The 20 junctions were chosen because they had had an unusually high number of accidents in the year before the change.", "Most drivers in the city say they prefer roundabouts to traffic lights."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перекрёстки выбрали из-за необычно большого числа аварий.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Спад мог быть просто возвратом к норме, а не эффектом кругов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — усиливают.</li><li>B, C — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возврат к среднему.</div></div>"}, {"id": 18, "topic": "PS", "text": "Five runners finished a race, with no two finishing together.<br>• Dana finished ahead of Erlan but behind Askar.<br>• Bolat finished immediately after Erlan.<br>• Kamila finished ahead of Dana and was not last.<br>• Askar did not win.<br><br><b>Who finished third?</b>", "options": ["Askar", "Bolat", "Dana", "Erlan", "Kamila"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аскар > Дана > Ерлан > Болат (сразу); Камила > Дана, не последняя; Аскар не первый.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая — Камила; порядок: Камила, Аскар, Дана, Ерлан, Болат.</li><li>Третья — Дана. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другой расстановки нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соберите цепочку.</div></div>"}, {"id": 19, "topic": "STR", "text": "In a study, students who took handwritten notes during lectures remembered more of the content a week later than students who typed their notes on laptops. The researchers concluded that writing by hand helps students to process and remember information.<br><br><b>Which one of the following, if true, would most strengthen the researchers' conclusion?</b>", "options": ["The students were randomly assigned to take notes either by hand or on a laptop.", "Laptops are becoming cheaper every year.", "Students who took handwritten notes were more likely to attend every lecture.", "Many lecturers do not allow laptops in their lectures.", "Some students use both methods in different lectures."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рукописные заметки → лучше память.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если студентов распределили случайно — различия не из-за отбора. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — альтернативная причина.</li><li>B, D, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Случайное распределение.</div></div>"}, {"id": 20, "topic": "PS", "text": "A recipe for 12 biscuits uses 150 g of butter, 200 g of flour and 100 g of sugar. Butter is sold in 250 g blocks. Erkezhan wants to make 42 biscuits.<br><br><b>How many blocks of butter must she buy?</b>", "options": ["1", "2", "3", "4", "5"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">42 = 3,5 · 12 → масла 3,5 · 150 = 525 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>525 : 250 = 2,1 → 3 бруска. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — округлили вниз.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покупаем — вверх.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "Dr Seitkali argues that the city should build more cycle lanes. But Dr Seitkali drives to work every day, so we should not take his proposal seriously.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that everyone who drives is against cycle lanes.", "It rejects a proposal because of the behaviour of the person who made it, instead of considering the reasons for it.", "It does not say how many cycle lanes should be built.", "It ignores the possibility that Dr Seitkali lives a long way from his work.", "It assumes that cycle lanes are expensive to build."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предложение отвергают из-за поведения автора.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ошибка «к человеку». Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Атака на личность.</div></div>"}, {"id": 22, "topic": "PS", "text": "In a football league, a win earns 3 points, a draw 1 point and a loss 0 points. After 8 matches, a team has 14 points and has lost 2 matches.<br><br><b>How many of its matches did the team draw?</b>", "options": ["1", "2", "3", "4", "6"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">8 матчей, 2 поражения → 6 = победы + ничьи.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3w + d = 14, w + d = 6 → w = 4, d = 2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают 14 очков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Система двух уравнений.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "Either we raise the price of tickets for the school concert, or we will not be able to pay for the hall. Nobody wants to cancel the concert, so we must raise ticket prices.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that the concert will be a success.", "It assumes that every student will attend the concert.", "It confuses the cost of the hall with the price of the tickets.", "It does not say how much the hall costs to hire.", "It overlooks other ways of paying for the hall, such as selling more tickets or finding a sponsor."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Либо поднять цены, либо не оплатить зал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ложная дилемма: есть другие способы оплатить зал. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Только два варианта?</div></div>"}, {"id": 24, "topic": "PS", "text": "A car travels 240 km on 16 litres of fuel. To travel 360 km it will need 360 ÷ (240 ÷ 16) = 24 litres.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A runner covers 10 km in 50 minutes. At the same pace, 15 km will take 15 ÷ (10 ÷ 50) = 75 minutes.", "A 3 kg bag of rice costs £6, so 5 kg costs 5 × (6 ÷ 3) = £10.", "A train travels 360 km at 90 km/h, so the journey takes 360 ÷ 90 = 4 hours.", "16 litres of fuel at £1.50 per litre costs 16 × 1.50 = £24.", "A 40-litre tank of fuel lasts 600 km, so the car travels 600 ÷ 40 = 15 km per litre."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: делим на «норму» (расход на 1 л).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 15 : (10 : 50) = 75 мин. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — умножение на цену за кг.</li><li>C, D, E — один шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на дробь.</div></div>"}, {"id": 25, "topic": "FLAW", "text": "Last year, 10% of the burglaries in our town were in houses that had alarms. So houses with alarms are much less likely to be burgled than houses without them.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that alarms are always switched on.", "It uses figures from only one year.", "It ignores burglaries of shops and offices.", "It assumes that burglars know which houses have alarms.", "It does not consider what proportion of the town's houses have alarms."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">10% краж — в домах с сигнализацией.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не учтено, какая доля домов вообще с сигнализацией. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нужна базовая доля.</div></div>"}, {"id": 26, "topic": "PS", "text": "A rectangular sheet of card measures 30 cm by 20 cm. A square 5 cm by 5 cm is cut from each corner, and the sides are folded up to make an open box.<br><br><b>What is the volume of the box?</b>", "options": ["750 cm³", "1,000 cm³", "1,500 cm³", "2,000 cm³", "3,000 cm³"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание (30 − 10) × (20 − 10) = 20 × 10, высота 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>20 · 10 · 5 = 1000 см³. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без вычета углов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вырез — с обеих сторон.</div></div>"}, {"id": 27, "topic": "FLAW", "text": "If a plant gets too little water, its leaves turn yellow. The leaves of this plant have turned yellow. So it must have had too little water.<br><br><b>Which one of the following contains the same flaw as the above argument?</b>", "options": ["If the oven is on, its light is lit. The light is not lit. So the oven is not on.", "All the plants in this room need water. This plant is in this room. So it needs water.", "If a student cheats, she is disqualified. Asel did not cheat. So she was not disqualified.", "If a car runs out of fuel, it stops. Aidos's car has stopped. So it must have run out of fuel.", "If it snows, the school closes. It is snowing. So the school is closed."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если A → B; B → значит A (обращение).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: кончилось топливо → стоит; стоит → кончилось топливо. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — верные выводы.</li><li>C — отрицание условия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте буквы.</div></div>"}, {"id": 28, "topic": "PS", "text": "A fully charged phone battery lasts 20 hours if the phone is left idle, 8 hours if it is used only for calls, or 5 hours if it is used only to watch videos. Starting with a full battery, Dias watches videos for 2 hours and then makes calls for 2 hours.<br><br><b>For how many more hours can the phone then be left idle before the battery runs out?</b>", "options": ["3", "5", "7", "9", "12"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Видео 2 ч = <span class=\"fr\"><span>2</span><span>5</span></span> заряда; звонки 2 ч = <span class=\"fr\"><span>2</span><span>8</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40% + 25% = 65%; осталось 35%.</li><li>35% · 20 ч = 7 ч. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные доли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте доли заряда.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "A company should not advertise a product as 'healthy' if it contains a large amount of sugar, even if it also contains vitamins, because customers are likely to be misled about the product's overall effect on their health.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["A newspaper should correct its mistakes as soon as possible.", "Shops should not sell sugary food to young children.", "A doctor should always recommend the cheapest medicine that works.", "A restaurant should list every ingredient used in its dishes.", "An estate agent should not describe a flat as 'close to the park' if a busy motorway separates the flat from the park."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нельзя описывать продукт так, чтобы ввести в заблуждение, даже если отчасти верно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: «рядом с парком», если рядом и шумная трасса. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Частичная правда вводит в заблуждение.</div></div>"}, {"id": 30, "topic": "PS", "text": "An LED light bulb costs £6, lasts 10 years and uses £2 of electricity a year. An old-style bulb costs £1, lasts only 1 year and uses £7 of electricity a year.<br><br><b>Over 3 years, how much is saved by using one LED bulb instead of old-style bulbs?</b>", "options": ["£3", "£9", "£12", "£15", "£18"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 года: LED 6 + 3 · 2 = 12 £; старые 3 · (1 + 7) = 24 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Экономия 12 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — неверный счёт ламп.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покупка + электричество.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
