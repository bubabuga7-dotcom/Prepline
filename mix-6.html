<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"text": "Which pair of numbers from {378, 392, 420, 450} has highest common factor 28?", "options": ["378 and 392", "392 and 420", "420 and 450", "378 and 450", "378 and 420"], "correct": 1, "src": "M11", "id": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем числа на простые множители и ищем пару с общей частью 2² · 7 = 28.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>378 = 2 · 3³ · 7; 392 = 2³ · 7²; 420 = 2² · 3 · 5 · 7; 450 = 2 · 3² · 5².</li><li>392 и 420: общие 2² и 7 → НОД = 28 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (378, 392): общее 2 · 7 = 14.</li><li>C (420, 450): 2 · 3 · 5 = 30.</li><li>D: 2 · 3² = 18. E: 2 · 3 · 7 = 42.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 28 = 4 · 7: оба числа должны делиться на 4 и на 7 — у 378 и 450 нет делителя 4.</div></div>"}, {"text": "The surface area of a cube is equal to the square root of six times its volume, S = √(6V). What is the length of an edge of the cube?", "options": ["2/3", "1/6", "1/9", "1/3", "2/9"], "correct": 1, "src": "M8", "id": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S = 6s², V = s³. Подставляем в данное равенство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6s² = √(6s³).</li><li>Возводим в квадрат: 36s⁴ = 6s³.</li><li>s = <span class=\"fr\"><span>6</span><span>36</span></span> = <span class=\"fr\"><span>1</span><span>6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не удовлетворяют равенству: например, при s = <span class=\"fr\"><span>1</span><span>3</span></span>: <span class=\"fr\"><span>6</span><span>9</span></span> ≠ √<span class=\"fr\"><span>6</span><span>27</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После возведения в квадрат делим на s³ (s > 0).</div></div>"}, {"text": "Luggage up to a certain weight is carried free of charge, and beyond that the charge is $5 per kg. Laa-Laa's luggage weighs 70 kg and she paid $200. Po's luggage weighs 45 kg. How much will Po pay?", "options": ["$0", "$25", "$50", "$75", "$225"], "correct": 3, "src": "M12", "id": 3, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из данных о Лаа-Лаа находим бесплатную норму.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Платных кг: 200 ÷ 5 = 40 → бесплатно 70 − 40 = 30 кг.</li><li>По: 45 − 30 = 15 платных кг → 15 · $5 = $75.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E ($225) — все 45 кг платные.</li><li>A — 45 > 30, бесплатно не получится.</li><li>B, C — неверная норма.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала найдите скрытую величину, потом применяйте.</div></div>"}, {"text": "What angle do the hands of a clock make at 9:20?", "options": ["160°", "150°", "145°", "130°", "30°"], "correct": 0, "src": "M11", "id": 4, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Минутная стрелка — 6° в минуту, часовая — 30° в час + 0,5° в минуту.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минутная: 20 · 6° = 120°.</li><li>Часовая: 9 · 30° + 20 · 0,5° = 270° + 10° = 280°.</li><li>Разница: 280° − 120° = 160°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (150°) — забыли сдвиг часовой стрелки (+10°).</li><li>E (30°) — угол между 9 и 10.</li><li>C, D — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая стрелка не стоит на месте: за 20 минут она сдвигается на 10°.</div></div>"}, {"text": "A right-angled triangle has hypotenuse 7x − 3 and shorter sides x + 3 and 6x. Find x.", "options": ["3", "4", "5", "6", "7"], "correct": 1, "src": "M11", "id": 5, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема Пифагора с выражениями.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x + 3)² + (6x)² = (7x − 3)².</li><li>x² + 6x + 9 + 36x² = 49x² − 42x + 9.</li><li>0 = 12x² − 48x → x = 4 (x ≠ 0).</li><li>Проверка: стороны 7, 24, 25 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не дают прямоугольный треугольник.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 7-24-25 — ещё одна пифагорова тройка.</div></div>"}, {"text": "Evaluate: (1/4)^(−(1/4)^(1/2))", "options": ["2", "1/2", "1/16", "1/√2", "√2"], "correct": 0, "src": "M12", "id": 6, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала считаем показатель степени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>4</span></span><sup>1⁄2</sup> = <span class=\"fr\"><span>1</span><span>2</span></span> → показатель <span class=\"fr\"><span>−1</span><span>2</span></span>.</li><li><span class=\"fr\"><span>1</span><span>4</span></span><sup>−1⁄2</sup> = 4<sup>1⁄2</sup> = 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (½) — забыли минус в показателе.</li><li>C, D, E — неверный порядок действий.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Степень вычисляется сверху вниз: сначала верхний этаж.</div></div>"}, {"text": "A solid sphere of diameter 10 sits inside a cylinder of length 10 and diameter 10. What is the ratio of the volume of the cylinder to the volume of the sphere?", "options": ["1/2", "2/1", "1/1", "3/2", "2/3"], "correct": 3, "src": "M12", "id": 7, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Радиус 5 у шара и цилиндра, высота цилиндра 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цилиндр: π · 25 · 10 = 250π.</li><li>Шар: <span class=\"fr\"><span>4</span><span>3</span></span>π · 125 = <span class=\"fr\"><span>500π</span><span>3</span></span>.</li><li>250π ÷ <span class=\"fr\"><span>500π</span><span>3</span></span> = <span class=\"fr\"><span>3</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E <span class=\"fr\"><span>2</span><span>3</span></span> — перевёрнутое отношение (шар к цилиндру).</li><li>A, B, C — ошибки в формулах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цилиндр к вписанному шару — всегда 3 : 2.</div></div>"}, {"text": "Alan was x years old y years ago. In z years' time he will be", "options": ["x + y + z", "x − y + z", "z − x − y", "y − x + z"], "correct": 0, "src": "M10", "id": 8, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала находим нынешний возраст.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y лет назад было x → сейчас x + y.</li><li>Через z лет: x + y + z.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вычли y вместо прибавления.</li><li>C, D — перепутаны знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «y years ago» → сейчас на y больше.</div></div>"}, {"text": "Equilateral triangle ABC has side x. Its area is", "options": ["3x²/4", "√3·x²/4", "2√3·x", "10√3", "3x/4"], "correct": 1, "src": "M8", "id": 9, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь равностороннего треугольника = <span class=\"fr\"><span>√3</span><span>4</span></span>a².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = ½ · x · x · sin 60° = ½ · x² · <span class=\"fr\"><span>√3</span><span>2</span></span> = <span class=\"fr\"><span>√3</span><span>4</span></span>x².</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без √3.</li><li>C, E — не квадрат длины (размерность).</li><li>D — число без x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь должна содержать x² — это сразу отсекает C, D, E.</div></div>"}, {"text": "One device beeps every 40 seconds and another beeps every 42 seconds. They beep together at 10:00. When do they next beep together?", "options": ["10:14", "10:16", "10:20", "10:28", "10:42"], "correct": 0, "src": "M12", "id": 10, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Совпадения через НОК(40, 42).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40 = 2³ · 5; 42 = 2 · 3 · 7.</li><li>НОК = 2³ · 3 · 5 · 7 = 840 с = 14 мин.</li><li>10:00 + 14 мин = 10:14.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (10:28) — удвоенный НОК (произведение/60).</li><li>B, C, E — неверный НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 40 · 42 = 1680 — это не НОК, общий множитель 2 надо учесть один раз.</div></div>"}, {"text": "The price of a bicycle is reduced by 25%, and the new price is then reduced by a further 20%. The two reductions together are equal to a single reduction of", "options": ["32.5%", "45%", "35%", "30%", "40%"], "correct": 4, "src": "M8", "id": 11, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем оставшиеся доли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После −25%: 0,75.</li><li>После −20%: 0,75 · 0,8 = 0,6.</li><li>Осталось 60% → одна скидка 40%.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (45%) — сложили проценты.</li><li>A, C, D — неверный расчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скидки не складываются — перемножаются оставшиеся доли.</div></div>"}, {"text": "Which of these numbers is odd?", "options": ["1⁴ + 1", "3⁴ + 2", "5⁴ + 3", "7⁴ + 5", "11⁴ + 7"], "correct": 1, "src": "M12", "id": 12, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чётность: нечётное в любой степени — нечётное.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1⁴, 3⁴, 5⁴, 7⁴, 11⁴ — все нечётные.</li><li>Нечётное + нечётное = чётное; нечётное + чётное = нечётное.</li><li>Только в B прибавляется чётное число 2 → 83 нечётное.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: 1 + 1 = 2; C: 625 + 3 = 628; D: 2401 + 5 = 2406; E: … + 7 — все чётные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не нужно ничего считать — достаточно чётности.</div></div>"}, {"text": "Which equation has roots 1 − √3 and 1 + √3?", "options": ["x² − 2x − 2 = 0", "x² + 2x − 2 = 0", "x² − x − √3 = 0", "x² − 2x + 2 = 0", "x² − 6 = 0"], "correct": 0, "src": "M12", "id": 13, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по Виета: x² − (сумма)x + произведение = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма: (1 − √3) + (1 + √3) = 2.</li><li>Произведение: 1 − 3 = −2.</li><li>x² − 2x − 2 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак суммы.</li><li>D — знак произведения.</li><li>C, E — неверные коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сопряжённые корни a ± √b дают целые коэффициенты.</div></div>"}, {"text": "The largest integer x satisfying x² − 13x + 36 < 0 is", "options": ["13", "7", "-8", "8", "-13"], "correct": 3, "src": "M10", "id": 14, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем и решаем неравенство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 13x + 36 = (x − 4)(x − 9) < 0.</li><li>4 < x < 9.</li><li>Наибольшее целое: 8.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (13), E — коэффициенты из уравнения.</li><li>B (7) — не наибольшее.</li><li>C — отрицательное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство — 9 не входит.</div></div>"}, {"text": "A quarter of a third of two fifths of a number is 21. What is 30% of that number?", "options": ["169", "189", "219", "229", "241"], "correct": 1, "src": "M11", "id": 15, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем доли: ¼ · ⅓ · ⅖ = <span class=\"fr\"><span>1</span><span>30</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>n</span><span>30</span></span> = 21 → n = 630.</li><li>30% от 630 = 189.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — арифметические ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Of» = умножение.</div></div>"}, {"text": "A line passes through A(2, 1) and B(0, 3). Its equation is", "options": ["y = x − 3", "y = −x + 3", "y = x + 2", "y = −x − 3", "y = 3 − 3x"], "correct": 1, "src": "M12", "id": 16, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон и пересечение с осью y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон = <span class=\"fr\"><span>3 − 1</span><span>0 − 2</span></span> = −1.</li><li>B(0; 3) — это y-перехват → y = −x + 3.</li><li>Проверка A(2; 1): −2 + 3 = 1 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — положительный наклон.</li><li>D — неверный перехват.</li><li>E — наклон −3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если одна из точек на оси y — перехват виден сразу.</div></div>"}, {"text": "Factorise: 3x³ − 10x² − 8x", "options": ["x(3x − 4)(x + 2)", "x(x − 2)(3x + 4)", "x(x + 4)(3x − 2)", "x(3x + 2)(x − 4)", "x(x − 8)(3x + 1)"], "correct": 3, "src": "M12", "id": 17, "topic": "M4.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выносим x, затем раскладываем квадратный трёхчлен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3x³ − 10x² − 8x = x(3x² − 10x − 8).</li><li>Ищем числа с произведением 3 · (−8) = −24 и суммой −10: −12 и 2.</li><li>3x² − 12x + 2x − 8 = 3x(x − 4) + 2(x − 4) = (3x + 2)(x − 4).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Раскройте любой другой вариант: например, B: (x − 2)(3x + 4) = 3x² − 2x − 8 ≠.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте разложение обратным раскрытием.</div></div>"}, {"text": "A number is decreased by 50% and then increased by 50%. The result is what percentage of the original number?", "options": ["25%", "50%", "75%", "100%", "125%"], "correct": 2, "src": "M11", "id": 18, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последовательные проценты перемножаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>× 0,5, затем × 1,5 = × 0,75 → 75%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (100%) — «−50% и +50% компенсируют» — ловушка.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После −50% и +50% всегда остаётся меньше исходного.</div></div>"}, {"text": "The positive solution of the system 4x² + y² + 10y = 47 and 2x − y = 5 is", "options": ["x = 3, y = 1", "x = 3, y = 3", "x = 3, y = 2", "x = 1, y = −3", "x = 1, y = 1"], "correct": 0, "src": "M11", "id": 19, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подстановка y = 2x − 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4x² + (2x − 5)² + 10(2x − 5) = 47.</li><li>4x² + 4x² − 20x + 25 + 20x − 50 = 47 → 8x² − 25 = 47 → x² = 9.</li><li>x = 3 (положительное) → y = 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — не удовлетворяют 2x − y = 5.</li><li>D — y отрицательный.</li><li>E — проверка: 2 − 1 ≠ 5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка линейного уравнения сразу отсекает лишние пары.</div></div>"}, {"text": "Which expression is equivalent to 3√2/(√3 − √2)?", "options": ["3√6 + 6", "√6 − 6", "√6 + 3", "3√6 − 6", "√6 + 6"], "correct": 0, "src": "M11", "id": 20, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Убираем иррациональность: умножаем на сопряжённое √3 + √2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Знаменатель: (√3 − √2)(√3 + √2) = 3 − 2 = 1.</li><li>Числитель: 3√2(√3 + √2) = 3√6 + 3 · 2 = 3√6 + 6.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знак минус (умножили на неверное сопряжённое).</li><li>B, C, E — без множителя 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сопряжённое — та же пара с противоположным знаком.</div></div>"}, {"text": "A 1 by √35 rectangle is inscribed in a circle. What is the volume of the sphere obtained by rotating this circle about a diameter?", "options": ["48π", "45π", "24π", "36π", "30π"], "correct": 3, "src": "M8", "id": 21, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ вписанного прямоугольника = диаметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d = √(1 + 35) = 6 → r = 3.</li><li>V = <span class=\"fr\"><span>4</span><span>3</span></span>π · 27 = 36π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — неверный радиус или формула.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вращение круга вокруг диаметра даёт шар того же радиуса.</div></div>"}, {"text": "x − y = 12 and xy = 108. Find x + y.", "options": ["±20", "±24", "±28", "±30", "±32"], "correct": 1, "src": "M12", "id": 22, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x + y)² = (x − y)² + 4xy.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x + y)² = 144 + 432 = 576.</li><li>x + y = ±24 (например, 18 и 6 или −6 и −18).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — неверный квадрат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Связь: (x + y)² − (x − y)² = 4xy.</div></div>"}, {"text": "A clock shows 5:40. What is the angle between the hour hand and the minute hand?", "options": ["65°", "70°", "75°", "80°", "85°"], "correct": 1, "src": "M11", "id": 23, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Минутная 6°/мин, часовая 30°/ч + 0,5°/мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минутная: 40 · 6 = 240°.</li><li>Часовая: 5 · 30 + 40 · 0,5 = 150 + 20 = 170°.</li><li>Разница 70°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B ✓; A, C, D, E — неверный сдвиг часовой стрелки (например, 90° без сдвига).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формула: |30·H − 5,5·M| = |150 − 220| = 70°.</div></div>"}, {"text": "Write (4√3 + 5√60)/(2√3) in the form a + b√b. What are a and b?", "options": ["a = 1, b = 2", "a = 5, b = 2", "a = 2, b = 5", "a = 2, b = 1", "a = 3, b = 5"], "correct": 2, "src": "M11", "id": 24, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим каждое слагаемое на 2√3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>4√3</span><span>2√3</span></span> = 2.</li><li><span class=\"fr\"><span>5√60</span><span>2√3</span></span> = <span class=\"fr\"><span>5</span><span>2</span></span>√20 = <span class=\"fr\"><span>5</span><span>2</span></span> · 2√5 = 5√5.</li><li>2 + 5√5 → a = 2, b = 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверно упростили √20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √20 = 2√5.</div></div>"}, {"text": "436 921 is rounded to the nearest thousand and written in standard form. The result is", "options": ["4.369×10²", "4.369×10⁵", "4.37×10⁴", "4.37×10⁵", "4.4×10⁵"], "correct": 3, "src": "M8", "id": 25, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Округляем до тысяч, затем стандартная форма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>436 921 → 437 000 (сотни 9 → округляем вверх).</li><li>437 000 = 4,37 · 10⁵.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не округлено.</li><li>C — неверная степень.</li><li>E — округлено до десятков тысяч.</li><li>A — неверная степень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стандартная форма: 1 ≤ a < 10.</div></div>"}, {"text": "Three numbers are in the ratio 2 : 3 : 5. The smallest is 16. What is their sum?", "options": ["64", "72", "80", "96", "144"], "correct": 2, "src": "M12", "id": 26, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2 части = 16 → 1 часть = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Всего 2 + 3 + 5 = 10 частей.</li><li>10 · 8 = 80.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверное число частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите «цену» одной части.</div></div>"}, {"text": "£400 is shared between Ann, Brian and Carol. Ann receives twice as much as Brian, and Brian receives three times as much as Carol. How much does Brian receive?", "options": ["£80", "£90", "£100", "£110", "£120"], "correct": 4, "src": "M11", "id": 27, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем всех через Кэрол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Кэрол c, Брайан 3c, Энн 2 · 3c = 6c.</li><li>10c = 400 → c = 40.</li><li>Брайан: 120.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (£80) — Кэрол × 2.</li><li>D, B, C — неверная пропорция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выберите за единицу того, кого меньше всех.</div></div>"}, {"text": "The symbol ♦ is defined by a♦b = √(ab). Evaluate (8♦2)♦(4♦9).", "options": ["2√3", "4√3", "2√6", "4√6", "√6"], "correct": 2, "src": "M12", "id": 28, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выполняем операции по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8♦2 = √16 = 4.</li><li>4♦9 = √36 = 6.</li><li>4♦6 = √24 = 2√6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — √96.</li><li>A, B, E — неверно упростили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √24 = √(4 · 6) = 2√6.</div></div>"}, {"text": "There are 300 sandwiches at a picnic. Half of them are tuna, and in 3/5 of those the tuna is out of date. What percentage of all the sandwiches is still edible?", "options": ["60", "40", "30", "70", "120"], "correct": 3, "src": "M8", "id": 29, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем испорченные бутерброды.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тунец: 150.</li><li>Просрочено <span class=\"fr\"><span>3</span><span>5</span></span> · 150 = 90.</li><li>Съедобно 300 − 90 = 210 → 70%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (60%) — <span class=\"fr\"><span>3</span><span>5</span></span> от всех.</li><li>C (30%) — доля испорченных.</li><li>B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «<span class=\"fr\"><span>3</span><span>5</span></span> of those» — от тунцовых, а не от всех.</div></div>"}, {"text": "A circle with centre (3, 4) touches the x-axis. What is its circumference?", "options": ["4π", "6π", "8π", "12π", "16π"], "correct": 2, "src": "M12", "id": 30, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Окружность касается оси x → радиус = расстояние от центра до оси = |y| = 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r = 4.</li><li>C = 2πr = 8π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (6π) — r = 3 (расстояние до оси y).</li><li>A — диаметр 4.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Касание оси x → r = |y центра|; оси y → r = |x центра|.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
