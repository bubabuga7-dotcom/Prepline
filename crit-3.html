<style>

  @media (max-width: 480px) {

<script>
const questions = [{"id":1,"text":"Increasing attention is being paid to the environmental consequences of the plastic ‘single-use’ shopping bags provided to customers by supermarkets and other retailers. Not only does the production of these bags represent a wasteful use of natural resources, but there are also problems surrounding their disposal. For instance, the bags often end up as litter, and in the marine environment, they kill many animals that become entangled in them or mistake them for food. Numerous countries and individual cities have banned these bags, but experts on the environmental impacts of products warn that no perfect alternative exists. Whether using fabric or heavier plastic, manufacturing bags that are stronger and thus more reusable requires significantly greater quantities of natural resources than the vilified ‘single-use’ ones.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?</b>","options":["Encouraging consumers to change their behaviour is not an effective solution to environmental problems.","Product bans are never an effective solution to environmental problems.","The solution to environmental problems lies in limiting human population growth.","Recycled paper bags should be used instead of plastic bags.","When comparing two products from an environmental standpoint, it is important to consider their manufacturing processes, length of use, and disposal."],"correct":4,"src":"CON","topic":"CON"},{"id":2,"text":"The Executive of the Students' Union has recently carried out a survey to identify dangerous areas on campus. The survey led to the recommendation and implementation of measures such as improved lighting in suspect areas. Such reforms can only help to reduce the number of attacks on campus. However, the University lake and its surrounding area was not included in the survey as, despite being considered part of the campus, it actually belongs to the City Council. This means the University has no direct influence over safety standards in the area. It should therefore definitely be avoided by lone students at night.<br><br><b>Which one of the following is an underlying assumption of this argument?</b>","options":["Students do not look after their own safety but rely on others to take safety measures on their behalf.","The City Council regards the lake area as part of the campus.","Students walking on and off campus at night would go via the university lake.","The safety measures taken by the City Council are either non-existent or are inferior to those implemented by the Student Union.","The Executive of the Student Union is not merely seeking popularity in implementing its reforms but is genuinely concerned about safety risks."],"correct":3,"src":"ASM","topic":"ASM"},{"id":3,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":3,"src":"MC","image":"images/q-d15cad0274.png","topic":"MC"},{"id":4,"text":"A two-month study of major producers of ivory products showed that worldwide demand for elephant tusks for ivory had fallen sharply. Consequently it is safe to assume that there will be a general decline in elephant poaching.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>","options":["There are far fewer elephants than there were ten years ago, so poachers are finding it increasingly difficult to make a living from the ivory trade.","Poachers now use high-powered rifles which make it far easier for them to kill larger numbers of elephants than was possible in the past.","The worldwide demand for ivory fluctuates considerably at certain times of the year, so poachers stockpile ivory to sell when the market improves.","More and more synthetic materials are being used as substitutes for ivory in the construction of such things as piano keys and billiard balls.","The worldwide demand for ivory has been falling consistently for the last twenty years and many ivory poachers have found alternative sources of income."],"correct":2,"src":"EF","topic":"EF"},{"id":5,"text":"Political legitimacy, the moral right to use state power, can only be derived from the consent of the governed. So, in democracies that uphold this principle, regular elections are held to ensure that political power is legitimate. Therefore, in these cases, the more voters participate in elections, the more legitimate the democratic political system is.<br><br><b>Which one of the following is an assumption underlying the above argument?</b>","options":["Electoral turnout is always higher in democratic political systems.","Voting at elections implies consent to the political system as a whole.","There is always a need for a government.","The more people who vote, the more the common interests are met.","Non-democratic political systems rely on coercion as a basis of state power."],"correct":1,"src":"ASM","topic":"ASM"},{"id":6,"text":"Some public institutions, such as the central bank and the constitutional court in many countries, are nominally independent but are actually captive to political interests. Their leading officials are appointed by the government and these appointments are always the result of political power games. Moreover, it is fundamentally undemocratic to delegate too much power to people who have not been popularly elected. Therefore, in order to ensure the real independence and the democratic nature of these institutions, the most prominent public officials should be elected in general elections.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["Once appointed, the holders of independent public offices pursue strategies inconsistent with the political goals of those who appointed them.","Opinion polls show that people are not interested in electing public officials leading independent institutions.","A politician vouches for the independence of a candidate to the head of the central bank.","A former judge of the constitutional court was recently jailed for electoral fraud.","Heads of central banks often have strong connections to political parties."],"correct":0,"src":"EF","topic":"EF"},{"id":7,"text":"When police raided a London nightclub known for selling illegal drugs, nine people were arrested. However, everybody was led outside, searched and photographed, whether or not drugs were found in their possession. Visiting a nightclub is not yet a crime, so it is a troubling breach of civil liberties that the police should keep a record of these people. Many of us are more comfortable with dealers operating in dark corners of nightclubs, rather than selling crack openly on busy daytime streets. Therefore, we should simply accept that drugs will be sold in nightclubs and hope they can be contained there.<br><br><b>Which one of the following best expresses a flaw in the argument?</b>","options":["It assumes that the only alternative to excessive use of police powers and open drug dealing is acceptance of nightclubs selling drugs.","It does not follow that the police abused people's civil rights by photographing them.","It uses one example of a nightclub where drugs are sold to draw the conclusion that nightclubs sell drugs.","It uses extreme and illogical steps to move from one nightclub raid to the unlikely prospect of crack being sold openly on the streets.","Just because some people were not in possession of drugs does not mean that they were innocent of taking drugs."],"correct":0,"src":"FLAW","topic":"FLAW"},{"id":8,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":1,"src":"CON","image":"images/q-523ffcf0d2.png","topic":"CON"},{"id":9,"text":"Recent news stories have mistakenly implied that animals can understand mathematics better than humans. Participants in a study were asked to state a choice of one of three doors, behind one of which there was a prize. Then the researcher opened one of the other two doors, revealing that there was no prize behind it. Asked if they would like to change their choice, most chose not to change. Switching to the remaining closed door would have increased their chance of winning. Even after playing the game many times, which allowed them to observe that they would win more often if they switched, most did not do so. When pigeons played a similar game, after a few attempts they switched every time. So the pigeons learnt from experience, whereas the people overanalyze and became confused.<br><br><b>Which one of the following is an assumption underlying the above argument?</b>","options":["Birds are better than human beings at learning from experience.","Most people did not notice that they won more often if they switched.","The people were no better than the pigeons at calculating probability.","Most people thought that the probability of winning remained the same.","Learning from experience is not a mathematical process."],"correct":4,"src":"ASM","topic":"ASM"},{"id":10,"text":"Zoos are entirely unsuitable places for animals. People visit zoos to learn about animal behaviour but the animals they see are likely to be behaving in abnormal and neurotic ways because of the cramped and unnatural conditions in which they are kept. Zoos should be closed down and the money saved should be reallocated to the protection of natural habitats.<br><br><b>Which of the following, if true, would most weaken the above argument?</b>","options":["Humans living in cramped conditions can also become neurotic.","Schoolchildren can learn a great deal about animals from visiting zoos.","Many of the animals at present in zoos would not be capable of living in the wild.","The protection of wildlife habitats is very costly.","Zoos enable endangered species to survive by breeding them in captivity and then re-introducing them to the wild."],"correct":4,"src":"EF","topic":"EF"},{"id":11,"text":"<b>Choose your answer from the image above:</b>","options":["A","B","C","D","E"],"correct":2,"src":"MC","image":"images/q-1fc59beaef.png","topic":"MC"},{"id":12,"text":"There is widespread dissatisfaction and disillusionment in Britain with politics and with politicians, who are seen as untrustworthy. Many of the electorate do not even bother to vote in a general election. In Switzerland democracy is more direct than in Britain, in the sense that many referendums take place, and many important political decisions are thus based directly on the votes of citizens rather than on those of their elected representatives. Surveys show that in those parts of Switzerland where more of these important decisions are made by referendum, the citizens are happier than in those areas where there is less opportunity to influence decisions. So if we were to adopt the Swiss system in Britain, the dissatisfied and disillusioned British electorate would be much happier.<br><br><b>Which one of the following identifies the flaw in the above argument?</b>","options":["It assumes that most Swiss citizens vote in general elections.","It assumes that there is only one reason why some Swiss citizens are happier.","It assumes that British citizens would trust politicians if there were more referendums.","It assumes that there is only one reason why the British are disillusioned with politics.","It assumes that better policies emerge when important decisions are made by referendum."],"correct":1,"src":"FLAW","topic":"FLAW"},{"id":13,"text":"Heroin and cocaine are not the only illegal drugs with a terrible impact on global health. Counterfeit medicines can also do damage. Some of these fakes contain potentially toxic chemicals, and when taken to treat a disease they can kill. Others are like homeopathic remedies – while harmless in themselves, as they contain no active ingredients, they do not work as advertised. Efforts to tackle drug crime have prioritised illegal drugs and so have not dealt with crimes that are just as serious. This should now be remedied.<br><br><b>Which one of the following best expresses the main conclusion of the above passage?</b>","options":["Heroin and cocaine have a terrible impact on global health.","Counterfeit medicines can be just as dangerous as heroin and cocaine.","Homeopathic remedies are not effective.","Counterfeit medicines may contain toxic chemicals.","More time and effort should be put into tackling counterfeit medicines."],"correct":4,"src":"MC","topic":"MC"},{"id":14,"text":"Asthma has increased globally by about 160% in the last two decades. In the UK alone, 1318 people have died from asthma attacks within the last year. However new research has shown that asthma rates fall significantly in those parts of cities which have more trees and green spaces indicating that we can reduce asthma attacks by a programme of tree planting in our inner city waste lands.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>","options":["Planting more trees in inner city areas could lead to an increase in hay fever.","The cost of planting large numbers of trees in inner city areas could divert funds from other more important needs such as reducing crime in those areas.","Urban areas which have more trees and green spaces are invariably further removed from factories and congested roads which are known to trigger asthma.","There are fewer people living in areas with more green spaces so there are bound to be fewer cases of asthma.","Asthma has increased by 160% in two decades but there is no evidence that trees have been removed at the same rate from urban centres."],"correct":2,"src":"EF","topic":"EF"},{"id":15,"text":"A pioneering scheme started two years ago in Cambridgeshire assigns an individual caseworker to the most vulnerable homeless people. The caseworker helps the homeless person navigate through the health, justice and housing systems until his or her life improves. It has already shown that an average of £1000 a month per homeless person has been saved – money that would otherwise have been spent on providing emergency support.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?</b>","options":["Individual case workers should be assigned to homeless people.","Vulnerable homeless people are costing too much.","Some systems are hard for homeless people to deal with.","Homeless people rely on emergency support at present.","The lives of homeless people are improved when they can easily access support."],"correct":0,"src":"CON","topic":"CON"},{"id":16,"text":"When the government issued its guidelines to the public to improve health by eating five portions of fruit and vegetables per day, it underestimated the possible negative consequences for farmers and the landscape. The reduction in the demand for meat and dairy products would impact on farmers' livelihoods from raising cattle, and without cattle grazing, the countryside would become overgrown with weeds and gorse. The government should stop telling people what to eat!<br><br><b>Which of the following expresses the flaw in the argument?</b>","options":["Farmers' profits and the landscape are not necessarily less important than public health.","Eating five portions of fruit and vegetables per day is not necessarily beneficial to health.","The consumption of meat and dairy products is not necessarily bad for one's health.","Livestock and dairy farmers could not necessarily switch to production of fruit and vegetables.","The increased consumption of fruit and vegetables will not necessarily result in the decreased consumption of meat and dairy products."],"correct":4,"src":"FLAW","topic":"FLAW"},{"id":17,"text":"Recently a pioneering natural flood management scheme slowed river peak flow by 15 to 20 per cent, saving a small town’s museum and several homes. As part of this scheme, special dams, designed to leak water gradually, were installed in nearby hills to slow the flow of water off the slopes. An upstream flood storage reservoir was installed, along with the planting of thousands of trees and the restoration of heather moorland, which acted as a sponge. Around half of the reduction in flood water in the town was due to the upstream land management measures, and half due to the effect of the flood storage area. Natural flood management measures improve water quality, prevent erosion and, in some cases, store carbon.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?</b>","options":["The reduction in peak flow of a river would be insufficient to prevent flooding if there was very heavy rainfall.","The benefits of natural flood management schemes go beyond reducing flood risk.","All natural flood management methods are equally effective in reducing river flow.","Natural flood management should be introduced in all areas at risk of flooding.","Natural flood management methods are most effective in hilly upland areas."],"correct":1,"src":"CON","topic":"CON"},{"id":18,"text":"The world is now producing more farmed fish than beef. In 2012, fish production reached a record 66 million tonnes; cattle-farm output levelled out at 63 million tonnes. This ought to be good news for the environment. Cattle farming is one of the biggest contributors to global warming, while fish farming – as well as being sustainable – produces little pollution. Fish such as the silver carp can be reared on existing rice paddies, and they feed on grass, plankton and detritus. Species such as salmon, however, are carnivorous and are fed on smaller fish like anchovies caught in the wild. As a result, salmon can only be farmed by further depleting wild fish stocks.<br><br><b>Which one of the following can most reliably be drawn as a conclusion from the above passage?</b>","options":["Fish farmers who produce carnivorous fish should switch to producing non-carnivorous fish.","Fish farming is likely to become increasingly more widespread in comparison to beef farming.","Fish farming will always be better for the environment than cattle farming.","It would be better for the environment if a greater proportion of farmed fish was non-carnivorous.","Where possible, farmers should opt for more environmentally friendly forms of farming."],"correct":3,"src":"CON","topic":"CON"},{"id":19,"text":"Chiropractors rely heavily on manipulating their patients’ spines. This has benefits for some patients, but more than half of all patients suffer mild to moderate adverse effects after seeing a chiropractor. These are mostly local and referred pains that usually last for two to three days. Chiropractors often claim that these are necessary steps on the road to getting better. However, several hundred cases have been documented in which patients were seriously and often permanently damaged after chiropractic manipulations. What usually happens in these tragic instances is that, upon manipulation of the upper spine, an artery supplying the brain is overstretched and simply breaks up, leading to a stroke that can prove fatal.<br><br><b>Which one of the following is a conclusion that can be drawn from the above passage?</b>","options":["Chiropractic therapy should be banned.","Chiropractic therapy may do more harm than good.","The spine is the most delicate part of the human body.","People should see a doctor before going to a chiropractor.","Pain is a necessary part of the healing process."],"correct":1,"src":"CON","topic":"CON"},{"id":20,"text":"In the UK 45% of the workforce is female, but the percentage of women in senior positions, both in the professions and in business, is considerably lower. This is unfair to women, and also bad for the economy, in that those who are promoted to senior positions may not be the most able. Women may be discouraged from seeking promotion because employers require senior employees to work long and inflexible hours. Women may also be perceived as being unwilling to subordinate the demands of family to the demands of the job. So employers must be urged to offer flexibility in working hours, and to seek to move away from the UK's culture of long working hours.<br><br><b>Which one of the following is an assumption underlying the above argument?</b>","options":["Most women are not interested in seeking promotion to senior positions.","Men would not object to the promotion of a higher percentage of women.","Women would be better leaders than men if they were promoted to senior positions.","Women are no less likely than men to have the abilities required for working in senior positions.","Working hours would be more flexible if employers promoted more women to senior positions."],"correct":3,"src":"ASM","topic":"ASM"},{"id":21,"text":"While it is a woman, Ada Lovelace, who is often credited with originating the concept of software, today’s computer tech-related jobs are held mostly by men. The tech sector must continue to work against factors that inhibit gender equality within it. One such factor appears to be prejudice about women’s abilities to write computer programming code. A recent study of a program-sharing and development website analysed the rates by which suggested code changes were accepted by website users according to the gender of the user contributing the changes. In cases where the contributor’s gender was not made clear on the website, 72 per cent of the suggestions made by women were accepted. In cases where the contributor’s gender was revealed to be female, the acceptance rate fell to 63 per cent.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["Over the time period the website was studied, more female users than male users rejected suggested code changes overall.","Leading firms in the tech sector have undertaken a variety of high-profile initiatives to encourage more women to pursue computer programming careers.","No meaningful differences existed between the code changes suggested by female users who revealed their gender on the website and those who did not.","Even by modern standards, Ada Lovelace received an extensive education in math and sciences.","Male contributors to the website experienced a similar drop in their code change acceptance rates when their gender was revealed."],"correct":4,"src":"EF","topic":"EF"},{"id":22,"text":"At Everthorpe Prison in Yorkshire, prisoners made no attempt to escape using ladders placed against the outside walls by drug dealers and prostitutes plying their trades. A prison officer spokesperson said that this was because the authorities had made prisons too comfortable and thus failed to deter criminals. A large number of released prisoners quickly reoffended and returned to prison, where they had all the comforts of home: a television in each cell, breakfast in bed, a wage and cash bonuses for good behaviour.<br><br><b>Which one of the following is an implicit assumption upon which the spokesperson's argument rests?</b>","options":["Prisoners would not reoffend if prisons were less comfortable.","Many criminals are habitual offenders.","Not all prisoners are interested in drugs or prostitutes.","The conditions inside prisons are determined by the prison officers.","Reoffending rates have recently risen."],"correct":0,"src":"ASM","topic":"ASM"},{"id":23,"text":"A kidney can be taken safely from a living person, and can save the life of a dying patient. Given that the demand for kidney transplants exceeds the supply of donated kidneys, the law in the UK that forbids people to sell one of their kidneys should be abolished, because this would result in a greater number of successful kidney transplants. People are worried that it would involve rich patients exploiting poor potential donors. But selling one’s kidney to support one’s family is not very much different from supporting one’s family by working in a dangerous occupation. Some patients have bought kidneys and received transplants in other countries, where the risks to their life from such operations can be great.<br><br><b>Which of the following is an assumption underlying the above argument?</b>","options":["Poor people are not able to receive kidney transplants.","Some people in the UK would be willing to sell a kidney.","Selling one’s kidney is less dangerous than some occupations.","Kidney transplants carried out in other countries are rarely successful.","Changing the law would ensure an adequate supply of kidneys for transplant."],"correct":1,"src":"ASM","topic":"ASM"},{"id":24,"text":"Shooting is not just positive for rural economies, but is also necessary for conservation efforts. In various peripheral rural places in Britain, sport shooting related jobs are a mainstay of local economies, often accounting for as much as a third of the labour market. However, since humans disturbed the ecosystem by eradicating the top predators, destroying habitats and introducing non-native species, we are also now responsible for reducing further damage – conserving – by continuous management. This means shooting overpopulated species to minimise the risks of disease and starvation, and dominant foreign species in order to conserve weaker native ones. Additionally, the management of the environment for the purposes of sport shooting can have very positive conservation effects; for example, many endangered birds of prey now thrive on shooting estates.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["Wild flower numbers and bee populations have increased on shooting estates.","Many animals that are shot are sold on to butchers and enter the food market.","People from all over the world travel to Britain to engage in sport shooting.","Many native species such as the red squirrel are at threat from foreign species.","Re-introducing top predators such as wolves is a more effective means of conservation."],"correct":4,"src":"EF","topic":"EF"},{"id":25,"text":"Undoubtedly, early upbringing affects your social adjustment in later life. A recent study demonstrated that many children of parents who act aggressively towards their offspring grow up to be violent as adults. Consequently, if we could stop parents behaving aggressively towards their children, we would be able to eliminate a significant proportion of violence from our society.<br><br><b>Which of the following, if true, most weakens the above argument?</b>","options":["It is not possible to legislate against aggressive behaviour of parents towards their children.","In many cases children who are treated violently by their parents make sure that their own children do not suffer in the same way.","What were considered reasonable methods of discipline in previous generations are considered to be assault today.","Continuing poverty and deprivation are the major causes of aggressive behaviour in both adults and their children.","Many parents become violent when they are unable to control their children's behaviour."],"correct":3,"src":"EF","topic":"EF"},{"id":26,"text":"A band of rebellious traders in Wales has decided to take their whole town ‘offshore’ in protest at the insignificant amounts of UK tax paid by big businesses. An alliance of shopkeepers from the town want to use the same controversial loopholes favoured by huge multinationals such as Google so that they too can legally avoid UK tax. The coffee giant Starbucks, for example, has been branded immoral for transferring revenues out of the UK and into the Netherlands and Switzerland, where they receive sweetened tax deals. But the shopkeepers of the town cannot have it both ways. If they believe it is immoral for Starbucks to avoid UK tax, it is immoral for them, too. They should continue to pay UK tax in full.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["The sole purpose of the protest is to pressure the government into tackling tax avoidance by big business.","If the shopkeepers are successful, every town could follow their lead, harming the UK economy even further.","Small businesses acting alone cannot obtain the same tax breaks as the giant corporations.","Every time the government comes up with a way of tackling tax avoidance, lawyers simply find a new loophole.","One of the town traders found that last year he paid seven times more corporation tax than Facebook."],"correct":0,"src":"EF","topic":"EF"},{"id":27,"text":"If children are sitting in rows in a classroom, the teacher can have eye contact with all of them while she is explaining something to them. This is not always possible if they are sitting in groups around tables. Also, when they look up, instead of seeing the child opposite in a group and being tempted to talk, they see the teacher. So, sitting in rows helps children to concentrate better on their work and should therefore be the standard arrangement in every school classroom.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>","options":["Rows of desks take up no more classroom space than tables.","Some children are easily distracted whether they sit in rows or in groups.","Sitting in groups of between four and seven makes discussion work easier.","Traditionalists argue that teaching the whole class in rows is best.","If desks are arranged in rows, children can all see visual aids more easily."],"correct":4,"src":"EF","topic":"EF"},{"id":28,"text":"The financial circumstances of many young people make it difficult for them to forego paid employment for an extended period in order to undertake unpaid internships or work experience placements. In many industries, it is unlikely that a young person will gain entry- level paid employment unless he or she has held one of these temporary unpaid positions. Therefore, the current system of unpaid internships creates an unfair advantage for individuals from more affluent backgrounds.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>","options":["Unpaid internships and work experience placements often provide young people with an important opportunity for gaining references.","The highest proportion of unpaid internships and work experience placements are based in a few central locations, such as London.","Unpaid internships and work experience placements come in various lengths of duration from one to two days up to a number of months.","Some young people find themselves moving from one unpaid position to another without being able to land a paid job.","Some schools and other organisations have programmes in place to help match young people with internships or work experience placements."],"correct":2,"src":"EF","topic":"EF"},{"id":29,"text":"The award of a Nobel Prize in economics, but not in psychology, sociology or anthropology, seems to imply that economics is not a social science, but an exact one, like chemistry or physics. Underpinning this idea is the thought that the human world operates like the physical world. Economists themselves perpetuate this impression by dealing in hard quantitative data, as opposed to observation and qualitative analysis. The defining feature of the natural sciences is their consistent success in making predictions, but almost all economists failed to predict the 2008 financial crisis. The striking collapse of LTCM, a hedge fund set up by two economists who were later awarded the Nobel Prize, further underscores the limits of economics to make accurate forecasts.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?</b>","options":["The Nobel Prize should not be awarded for economics.","The human world is not part of the physical world.","Economics is not a science like chemistry or physics.","Economists cannot predict the behaviour of markets.","Hard quantitative data has no role in economics."],"correct":2,"src":"CON","topic":"CON"},{"id":30,"text":"The number one reason for people changing their jobs is to escape from ‘difficult people’, followed by seeking higher pay and promotion. In particular, many people cite a poor relationship with their boss as a reason for leaving. Typically, they’ll go to another job and find another difficult boss and the process continues. One of the areas that contributes to altercations with other people is the issue of unmet expectations. We easily see ourselves as being let down by the difficult person who fails to do what we expect them to. Very often these expectations are entirely in our own heads. We put the responsibility for knowing our expectations onto the difficult person and then blame them when they disappoint us. If only people worked towards having honest conversations with difficult people, staff turnover might decrease.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>","options":["Expectations of other people are always realistic.","Difficult people are aware that they are difficult.","People are not honest about their reasons for leaving a company.","Staff turnover is damaging for a company.","People cannot be trained to have honest conversations."],"correct":2,"src":"ASM","topic":"ASM"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  #pl-gate button{font:600 14px Inter,sans-serif;padding:11px 22px;border-radius:5px;cursor:pointer;border:0}
  #pl-gate .go{background:#C9A227;color:#10192C}
  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6ECF7}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script src="test-ux.js"></script>
</body>
</html>
