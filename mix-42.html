<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m026_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма четырёх нечётных простых чётна → среди них должно быть 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 + 3 + 5 + 7 = 17 — простое.</li><li>Наибольшее: 7.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — суммы без 2 чётные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2 — единственное чётное простое.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m026_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность квадратов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(5x + 2y)(5x − 2y) = 72.</li><li>8 · (5x − 2y) = 72 → 9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 25x² − 4y² = (5x)² − (2y)².</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m026_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">OA = OB = OC — радиусы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠OBA = ∠OAB = 20°; ∠OBC = ∠OCB = 52°.</li><li>∠ABC = 52° − 20° = 32°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — сумма углов.</li><li>B, C — один из углов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиусы → равнобедренные треугольники.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m026_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стороны квадратов s (большой) и t (малый).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>NL² = s² + t² = 100 (KL = s, KN = t).</li><li>Заштриховано: s² − t² = 62.</li><li>2t² = 38 → t = √19.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — t² = 25.</li><li>Остальные — неверная система.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложите/вычтите два уравнения.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m026_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Встреча в M: пройденные пути равны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p + r = q + MN, MN = √(r² + (p + q)²).</li><li>(p + r − q)² = r² + (p + q)² → 2pr − 2qr = 4pq.</li><li>q = <span class=\"fr\"><span>pr</span><span>2p + r</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не из равенства путей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одинаковая скорость + одновременный старт = равные пути.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m026_q07.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 1, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подкоренные выражения — полные квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9 − 4√2 = (2√2 − 1)².</li><li>17 − 12√2 = (3 − 2√2)².</li><li>2√2 − 1 + 3 − 2√2 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно извлечён корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √(a²) = |a| — берите положительное.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m026_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вторые разности постоянны: −2 → a = −1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>−n² + bn + c: n = 1 → b + c = 20; n = 2 → 2b + c = 19.</li><li>b = −1, c = 21 → −n² − n + 21.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают 19, 15, 9, 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a = (вторая разность)/2.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m026_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20 · X — квадрат ⇔ X = 5k².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Двузначные X: 20, 45, 80.</li><li>Числа 2020, 2045, 2080 → 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропущены или лишние.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 20 = 4 · 5 → недостающий множитель 5.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m026_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый «воздушный змей» — шестая часть правильного шестиугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 змеев = 8√3 → один = √3 = <span class=\"fr\"><span>√3</span><span>4</span></span>s² → сторона шестиугольника s = 2.</li><li>Стороны змея: 1 и √3.</li><li>Периметр шляпы складывается из отрезков длины 1 (вместе 8) и √3 (6 штук): 8 + 6√3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный счёт сторон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте отрезки контура по рисунку.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m026_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∠C = 120° → ∠B = 60°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Высота: 6 sin 60° = 3√3; свес 3 с каждой стороны → AB = 14.</li><li>S = <span class=\"fr\"><span>8 + 14</span><span>2</span></span> · 3√3 = 33√3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное основание.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Свес = 6 cos 60°.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m026_q12.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,7 · 0,8 = 0,56 → снижение 44%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сложили 30 + 20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вторая скидка — от сниженной цены.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m026_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Y не меняется.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>X = 1,5, Y = 4,5 кг.</li><li>Y = 60% → всего 7,5 → X = 3 → добавить 1,5 кг.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте через неизменную часть.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m026_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность цилиндров.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>π(4,5² − 1,5²) · 10 = π · 18 · 10 = 180π.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — диаметр вместо радиуса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус = половина диаметра.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m026_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим обе константы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P = <span class=\"fr\"><span>Q²</span><span>8</span></span>; Q = <span class=\"fr\"><span>10</span><span>R</span></span>.</li><li>P = <span class=\"fr\"><span>100</span><span>8R²</span></span> = <span class=\"fr\"><span>25</span><span>2R²</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные константы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-40.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m026_q16.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S = ½(a + b)h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½(2x + 4)x = 120 → x² + 2x − 120 = 0 → x = 10.</li><li>RS = 15.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — это x.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте подставить x.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m026_q17.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сокращаем дробь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>4 − x²</span><span>x(x − 2)</span></span> = −<span class=\"fr\"><span>x + 2</span><span>x</span></span> = −1 − <span class=\"fr\"><span>2</span><span>x</span></span>.</li><li>4 − 1 − <span class=\"fr\"><span>2</span><span>x</span></span> = 3 − <span class=\"fr\"><span>2</span><span>x</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li><li>C — забыли −1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 − x² = −(x − 2)(x + 2).</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m026_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол пятиугольника 108°, треугольника 60°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠TSU = 108° − 60° = 48°.</li><li>ST = SU → ∠STU = <span class=\"fr\"><span>180 − 48</span><span>2</span></span> = 66°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это ∠TSU.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стороны пятиугольника и треугольника равны.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m026_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">× 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,75 · 3,6 = 6,3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не v></div>"}, {"id": 23, "text": "", "image": "images/math-new/m026_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не пересекаются ⇔ D &lt; 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 и 4: x² + x + 5 = 0, D &lt; 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные пары имеют общие точки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-8.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m026_q24.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 0, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корни 1 и 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p² + q² = 10 → 100.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x² − 4x + 3 = (x − 1)(x − 3).</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m026_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">PS — диаметр и шестиугольника, и восьмиугольника: PS = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Половина шестиугольника: ½ · <span class=\"fr\"><span>3√3</span><span>2</span></span> · 16 = 12√3.</li><li>Восьмиугольник с радиусом 4: 2√2 · 16 = 32√2, половина 16√2.</li><li><span class=\"fr\"><span>16√2</span><span>12√3</span></span> = <span class=\"fr\"><span>4√6</span><span>9</span></span> → 1 : <span class=\"fr\"><span>4</span><span>9</span></span>√6.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без √2.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь правильного 8-угольника = 2√2R².</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m026_q26.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 2, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратные действия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(1 − <span class=\"fr\"><span>x</span><span>4</span></span>)² = <span class=\"fr\"><span>5 − y</span><span>3</span></span>.</li><li>1 − <span class=\"fr\"><span>x</span><span>4</span></span> = ±√<span class=\"fr\"><span>5 − y</span><span>3</span></span>.</li><li>x = 4 ± 4√<span class=\"fr\"><span>5 − y</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак 4.</li><li>D — множитель 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Умножая на 4, умножаем и корень.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m026_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разности квадратов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 50 = 200; 8 · 20 = 160.</li><li>360.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a² − b² = (a − b)(a + b).</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m026_q28.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 5, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">60⁶⁰ = 2¹²⁰ · 3⁶⁰ · 5⁶⁰; 60% = <span class=\"fr\"><span>3</span><span>5</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>× <span class=\"fr\"><span>3</span><span>5</span></span>: 2¹²⁰ · 3⁶¹ · 5⁵⁹.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 60 = 2² · 3 · 5.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m026_q29.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,3(7) = <span class=\"fr\"><span>37 − 3</span><span>90</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>34</span><span>90</span></span> = <span class=\"fr\"><span>17</span><span>45</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A <span class=\"fr\"><span>34</span><span>90</span></span> — тоже верно, это та же дробь без сокращения.</li><li>D — 0,37 без периода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задании два равных варианта: A и E.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m026_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем по частям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Числитель: 81 · 10⁸ − 10⁸ + 1200 · 10⁸ = 1280 · 10⁸.</li><li>Знаменатель: 0,1 − 0,098 = 0,002.</li><li>6,4 · 10¹³ = 64 · 10¹² → ∛ = 4 · 10⁴.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите все слагаемые к 10⁸.</div></div>"}, {"id": 31, "topic": "M4.3", "text": "<p>Find the value of \\(2a^2 - 3ab + b^2\\) when \\(a = -3\\) and \\(b = 2\\).</p>", "image": "", "options": ["4", "32", "40", "58", "80"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляйте отрицательные числа в скобках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2·(−3)² = 18; −3·(−3)·(2) = 18; (2)² = 4.</li><li>Сумма: 40. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посчитали a² как отрицательное число.</li><li>D — возвели в квадрат 2a.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (−3)² = 9, а −3² = −9.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
