<script>
const questions = [{"id": 1, "topic": "M4.13", "text": "<p>A speed–time graph shows a cyclist speeding up steadily from rest to 15 m/s in 4 s, staying at 15 m/s for 20 s, then slowing steadily to rest in 6 s.</p><p>How far does the cyclist travel?</p>", "image": "", "options": ["187.5 m", "300 m", "375 m", "405 m", "450 m"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">На графике скорость–время пройденный путь равен площади под графиком. Фигуру режем на треугольник, прямоугольник и ещё один треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разгон 0 → 15 м/с за 4 с: треугольник, площадь ½ · 4 · 15 = 30 м.</li><li>Едет 20 с со скоростью 15 м/с: прямоугольник, 20 · 15 = 300 м.</li><li>Торможение 15 → 0 за 6 с: треугольник, ½ · 6 · 15 = 45 м.</li><li>Сумма: 30 + 300 + 45 = 375 м.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (450 м) — забыл ½ у треугольников: 60 + 300 + 90 = 450.</li><li>B (300 м) — посчитал только участок с постоянной скоростью.</li><li>A (187.5 м) — взял ½ от всего времени 25 с: ½ · 25 · 15, будто весь график один треугольник.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь треугольника на графике — всегда ½ · основание · высота. Если график трапеция, можно сразу ½ · (20 + 30) · 15 = 375.</div></div>", "src": "PL"}, {"id": 2, "topic": "M2.9", "text": "<p>Write \\(\\dfrac{11}{25}\\) as a percentage.</p>", "image": "", "options": ["4.4%", "41.5%", "44%", "49%", "440%"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Процент — это дробь со знаменателем 100. Доводим 25 до 100.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>25 · 4 = 100, значит числитель тоже умножаем на 4: 11 · 4 = 44.</li><li><span class=\"fr\"><span>11</span><span>25</span></span> = <span class=\"fr\"><span>44</span><span>100</span></span> = 44%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4.4%) — сдвинул запятую не туда: 11 ÷ 25 = 0.44, а потом разделил ещё на 10.</li><li>E (440%) — умножил 0.44 на 1000 вместо 100.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка на прикидку: <span class=\"fr\"><span>11</span><span>25</span></span> чуть меньше половины, значит ответ чуть меньше 50%.</div></div>", "src": "PL"}, {"id": 3, "topic": "M4.5", "text": "<p>Factorise \\(x^2 - x - 12\\).</p>", "image": "", "options": ["\\((x + 3)(x + 4)\\)", "\\((x + 4)(x - 5)\\)", "\\((x + 3)(x - 4)\\)", "\\((x - 3)(x + 4)\\)", "\\((x - 3)(x - 4)\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² + bx + c = (x + p)(x + q), где p · q = c и p + q = b. Нужны два числа: произведение −12, сумма −1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пары с произведением −12: (3, −4), (−3, 4), (2, −6), (−2, 6), (1, −12), (−1, 12).</li><li>Сумма −1 только у пары 3 и −4: 3 + (−4) = −1.</li><li>Ответ: (x + 3)(x − 4). Проверка: x² − 4x + 3x − 12 = x² − x − 12.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (x − 3)(x + 4) — перепутал знаки: даёт x² + x − 12, средний член +x.</li><li>A (x + 3)(x + 4) — даёт +12 в конце, а нужно −12.</li><li>E (x − 3)(x − 4) — тоже +12: минус на минус даёт плюс.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всегда раскрой скобки обратно — это 10 секунд и ловит ошибку в знаке.</div></div>", "src": "PL"}, {"id": 4, "topic": "M3.5", "text": "<p>A recipe for 8 people uses 200 g of flour.</p><p>How much flour is needed for 12 people?</p>", "image": "", "options": ["240 g", "300 g", "325 g", "400 g", "\\(\\dfrac{400}{3}\\) g"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Количество муки пропорционально числу людей: находим, сколько на одного, и умножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На одного: 200 ÷ 8 = 25 г.</li><li>На 12 человек: 12 · 25 = 300 г.</li><li>Или короче: <span class=\"fr\"><span>12</span><span>8</span></span> = 1.5, значит 200 · 1.5 = 300 г.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (240 г) — прибавил разницу людей к массе: 4 человека → +40 г, это не пропорция.</li><li>E (<span class=\"fr\"><span>400</span><span>3</span></span> г) — перевернул отношение: 200 · <span class=\"fr\"><span>8</span><span>12</span></span> вместо 200 · <span class=\"fr\"><span>12</span><span>8</span></span>. Людей стало больше, а муки меньше — уже нелогично.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка смыслом: людей больше → муки больше. Ответ меньше 200 сразу отбрасывай.</div></div>", "src": "PL"}, {"id": 5, "topic": "M5.19", "text": "<p>What is the magnitude of the vector \\(\\begin{pmatrix}-6\\\\-8\\end{pmatrix}\\)?</p>", "image": "", "options": ["2", "10", "11", "14", "100"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина вектора (a, b) — это гипотенуза: √(a² + b²). Знаки не важны, при возведении в квадрат минус исчезает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−6)² + (−8)² = 36 + 64 = 100.</li><li>√100 = 10.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (14) — сложил модули 6 + 8, а не по Пифагору.</li><li>E (100) — забыл извлечь корень.</li><li>A (2) — вычел 8 − 6.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Запомни тройку 6-8-10 (это 3-4-5 ·2) — встречается постоянно.</div></div>", "src": "PL"}, {"id": 6, "topic": "M5.13", "text": "<p>A boat sails 3 km south and 3 km east of a harbour H.</p><p>What is the bearing of the boat from H?</p>", "image": "", "options": ["045°", "135°", "180°", "225°", "315°"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пеленг (bearing) отсчитывается от севера по часовой стрелке, всегда тремя цифрами.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 км на юг и 3 км на восток — равные катеты, значит направление ровно посередине между востоком и югом.</li><li>Восток = 090°, юг = 180°. Середина: (90 + 180) ÷ 2 = 135°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (045°) — это северо-восток: перепутал юг с севером.</li><li>D (225°) — это юго-запад: перепутал восток с западом.</li><li>C (180°) — учёл только движение на юг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуй крест N-E-S-W и стрелку — 5 секунд, и ошибка с направлением исключена.</div></div>", "src": "PL"}, {"id": 7, "topic": "M5.6", "text": "<p>The point (3, 1) is rotated 90° clockwise about the origin.</p><p>Where does it go?</p>", "image": "", "options": ["(1, -3)", "(1, 3)", "(-3, -1)", "(-1, 3)", "(3, -1)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поворот на 90° по часовой стрелке вокруг начала координат: (x, y) → (y, −x).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 3, y = 1.</li><li>(y, −x) = (1, −3).</li><li>Проверка: точка была в I четверти, после поворота по часовой стрелке уходит в IV четверть (x > 0, y < 0). (1, −3) там.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (−1, 3) — повернул против часовой стрелки: там правило (x, y) → (−y, x).</li><li>C (−3, −1) — это поворот на 180°.</li><li>E (3, −1) — это отражение в оси x, а не поворот.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сомневаешься в формуле — нарисуй точку и поверни лист бумаги.</div></div>", "src": "PL"}, {"id": 8, "topic": "M3.10", "text": "<p>A cube has surface area 150 cm². Every edge is multiplied by 4.</p><p>What is the surface area of the new cube?</p>", "image": "", "options": ["154 cm²", "600 cm²", "1200 cm²", "2400 cm²", "9600 cm²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если все размеры умножить на k, площадь умножается на k².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 4, значит площадь увеличится в 4² = 16 раз.</li><li>150 · 16 = 2400 см².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (600) — умножил на 4, как длину, а не на 4².</li><li>E (9600) — умножил на 4³ = 64: так меняется объём, а не площадь.</li><li>A (154) — прибавил 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длина ×k, площадь ×k², объём ×k³. Это же правило работает для подобных фигур.</div></div>", "src": "PL"}, {"id": 9, "topic": "M2.6", "text": "<p>What is the smallest positive whole number \\(k\\) such that \\(50 k\\) is a perfect square?</p>", "image": "", "options": ["2", "3", "4", "8", "50"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разложи 50 на простые множители. В полном квадрате каждый простой множитель стоит в чётной степени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>50 = 2 · 5².</li><li>5 уже в квадрате, а 2 — в первой степени. Не хватает одной двойки.</li><li>k = 2: 50 · 2 = 100 = 10².</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (50) — тоже даёт квадрат (2500), но не наименьший.</li><li>D (8) — 50 · 8 = 400 = 20², тоже квадрат, но 2 меньше.</li><li>C (4) — 50 · 4 = 200, не квадрат: 4 уже квадрат и ничего не исправляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вопрос «наименьшее k» — добавляй только недостающие множители, ничего лишнего.</div></div>", "src": "PL"}, {"id": 10, "topic": "M3.4", "text": "<p>In a club the ratio of boys to girls is 5 : 3. There are 20 more boys than girls.</p><p>How many girls are there?</p>", "image": "", "options": ["30", "40", "50", "60", "80"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отношение 5 : 3 означает 5 частей мальчиков и 3 части девочек. Разница в частях даёт размер одной части.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разница: 5 − 3 = 2 части = 20 человек.</li><li>1 часть = 20 ÷ 2 = 10.</li><li>Девочек: 3 · 10 = 30.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (50) — это мальчики, а спрашивали девочек.</li><li>E (80) — это все вместе: 8 частей · 10.</li><li>D (60) — разделил 20 на 1 часть вместо 2 и умножил на 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перед ответом перечитай, кого спрашивают: в задачах на отношения ответ про другую группу всегда стоит среди вариантов.</div></div>", "src": "PL"}, {"id": 11, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(1 \\lt n \\le 4\\)?</p>", "image": "", "options": ["1", "2", "3", "4", "5"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выпиши все целые числа, которые подходят. Строгий знак < не включает границу, ≤ — включает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 < n: значит 1 не подходит, начинаем с 2.</li><li>n ≤ 4: значит 4 подходит.</li><li>Числа: 2, 3, 4 — их 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (4) — включил 1, хотя знак строгий.</li><li>B (2) — исключил 4, хотя там ≤.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При строгом знаке (<, >) граница не входит, при нестрогом (≤, ≥) входит.</div></div>", "src": "PL"}, {"id": 12, "topic": "M3.11", "text": "<p>After two years at 10% compound interest per year an account holds $1,210.</p><p>How much was put in at the start?</p>", "image": "", "options": ["$968", "$980", "$1,000", "$1,008", "$1,100"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сложный процент: сумма умножается на 1.1 каждый год. Чтобы вернуться назад, делим, а не вычитаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>За 2 года: начальная сумма · 1.1² = начальная сумма · 1.21.</li><li>Начальная сумма = 1210 ÷ 1.21 = 1000 $.</li><li>Проверка: 1000 → 1100 → 1210.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A ($968) — отнял 2 · 10% от конечной суммы: 1210 − 242 = 968. Но проценты начислялись на начальную сумму, а не на 1210.</li><li>E ($1,100) — откатил только один год: 1210 ÷ 1.1.</li><li>B ($980) — проверка: 980 · 1.21 = 1185.8 ≠ 1210, не подходит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная задача на проценты — всегда деление на множитель, никогда не вычитание процента от итога.</div></div>", "src": "PL"}, {"id": 13, "topic": "M1.2", "text": "<p>A jug holds 4 litres. How many cm³ is that?</p>", "image": "", "options": ["40 cm³", "400 cm³", "4,000 cm³", "40,000 cm³", "4,000,000 cm³"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 литр = 1000 см³. Это нужно знать наизусть.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 л = 4 · 1000 = 4000 см³.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (400) — умножил на 100.</li><li>E (4 000 000) — перепутал: 1 м³ = 1 000 000 см³, а не 1 литр.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 л = 1 дм³ = 1000 см³ = 1000 мл. Значит, 1 см³ = 1 мл.</div></div>", "src": "PL"}, {"id": 14, "topic": "M4.2", "text": "<p>Solve \\(8^{x} = 16^{x-2}\\).</p>", "image": "", "options": ["-8", "6", "8", "9", "16"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приведи обе стороны к одному основанию. 8 и 16 — степени двойки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 = 2³, значит 8ˣ = 2³ˣ.</li><li>16 = 2⁴, значит 16ˣ⁻² = 2⁴⁽ˣ⁻²⁾ = 2⁴ˣ⁻⁸.</li><li>Основания равны → показатели равны: 3x = 4x − 8 → x = 8.</li><li>Проверка: 8⁸ = 2²⁴ и 16⁶ = 2²⁴. Сходится.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (16) — раскрыл 4(x − 2) как 4x − 16: тогда 3x = 4x − 16 → x = 16.</li><li>A (−8) — ошибка в знаке при переносе: из 3x − 4x = −8 получается x = 8, а не −8.</li><li>B (6) — проверка: 8⁶ = 2¹⁸, а 16⁴ = 2¹⁶. Не равны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После переноса проверь знак подстановкой — одна строка, и ошибка видна сразу.</div></div>", "src": "PL"}, {"id": 15, "topic": "M2.10", "text": "<p>After a 12% increase a coat costs ₸16,800.</p><p>What did it cost before the increase?</p>", "image": "", "options": ["₸13,548", "₸14,784", "₸15,000", "₸15,200", "₸16,680"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена после повышения на 12% = старая цена · 1.12. Чтобы найти старую цену, делим на 1.12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Старая цена · 1.12 = 16 800.</li><li>Старая цена = 16 800 ÷ 1.12 = 15 000 ₸.</li><li>Проверка: 15 000 · 0.12 = 1 800; 15 000 + 1 800 = 16 800.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (14 784) — отнял 12% от 16 800: 16 800 · 0.88. Но 12% считались от старой цены, а не от новой.</li><li>E (16 680) — отнял 120 ₸ вместо 12%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Классическая ловушка: «+12%, потом −12%» не возвращает к исходной цене. Только деление на 1.12.</div></div>", "src": "PL"}, {"id": 16, "topic": "M4.13", "text": "<p>On a speed–time graph a straight line joins (0, 2) to (3, 8), with time in seconds and speed in m/s.</p><p>What is the acceleration?</p>", "image": "", "options": ["2 m/s²", "4 m/s²", "5 m/s²", "\\(\\dfrac{1}{2}\\) m/s²", "\\(\\dfrac{8}{3}\\) m/s²"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ускорение — это наклон (градиент) графика скорость–время: изменение скорости ÷ изменение времени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Изменение скорости: 8 − 2 = 6 м/с.</li><li>Изменение времени: 3 − 0 = 3 с.</li><li>Ускорение = 6 ÷ 3 = 2 м/с².</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E <span class=\"fr\"><span>8</span><span>3</span></span> — поделил конечную скорость 8 на 3, забыл, что начальная 2 м/с, а не 0.</li><li>D (½) — перевернул: время ÷ скорость = <span class=\"fr\"><span>3</span><span>6</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наклон графика скорость–время = ускорение, площадь под ним = путь. Это два главных факта по этим графикам.</div></div>", "src": "PL"}, {"id": 17, "topic": "M2.9", "text": "<p>Which fraction equals \\(0.\\overline{45}\\)?</p>", "image": "", "options": ["\\(\\dfrac{10}{11}\\)", "\\(\\dfrac{5}{11}\\)", "\\(\\dfrac{9}{20}\\)", "\\(\\dfrac{5}{12}\\)", "\\(\\dfrac{6}{11}\\)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Периодическая дробь 0.(ab) с периодом из двух цифр равна <span class=\"fr\"><span>ab</span><span>99</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0.4545… = <span class=\"fr\"><span>45</span><span>99</span></span>.</li><li>Сокращаем на 9: <span class=\"fr\"><span>45</span><span>99</span></span> = <span class=\"fr\"><span>5</span><span>11</span></span>.</li><li>Проверка: 5 ÷ 11 = 0.4545… Сходится.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C <span class=\"fr\"><span>9</span><span>20</span></span> — это 0.45 ровно, без периода: <span class=\"fr\"><span>45</span><span>100</span></span>.</li><li>E <span class=\"fr\"><span>6</span><span>11</span></span> — это 0.5454…, цифры в другом порядке.</li><li>A <span class=\"fr\"><span>10</span><span>11</span></span> — это 0.9090…</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период из 1 цифры → /9, из 2 цифр → /99, из 3 цифр → /999.</div></div>", "src": "PL"}, {"id": 18, "topic": "M4.5", "text": "<p>Expand \\((3x + 1)(x + 4)\\).</p>", "image": "", "options": ["\\(3x^2 + 11x + 4\\)", "\\(3x^2 + 13x + 4\\)", "\\(3x^2 + 12x + 4\\)", "\\(3x^2 + 13x - 4\\)", "\\(4x^2 + 13x + 4\\)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый член первой скобки умножь на каждый член второй (4 произведения), потом сложи подобные.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3x · x = 3x².</li><li>3x · 4 = 12x и 1 · x = x. Вместе: 13x.</li><li>1 · 4 = 4.</li><li>Итого: 3x² + 13x + 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (12x) — забыл произведение 1 · x.</li><li>A (11x) — ошибся при сложении: 12 − 1 вместо 12 + 1.</li><li>E (4x²) — сложил 3x + x вместо умножения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Быстрая проверка: подставь x = 1. (3 + 1)(1 + 4) = 20, и 3 + 13 + 4 = 20. Сходится.</div></div>", "src": "PL"}, {"id": 19, "topic": "M3.5", "text": "<p>A recipe for 5 people uses 250 g of flour.</p><p>How much flour is needed for 8 people?</p>", "image": "", "options": ["280 g", "400 g", "425 g", "500 g", "\\(\\dfrac{625}{4}\\) g"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пропорция: находим муку на одного человека и умножаем на новое число людей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На одного: 250 ÷ 5 = 50 г.</li><li>На 8 человек: 8 · 50 = 400 г.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (280 г) — прибавил 3 человека как 30 г: это не пропорция.</li><li>E (<span class=\"fr\"><span>625</span><span>4</span></span> г) — перевернул отношение: 250 · <span class=\"fr\"><span>5</span><span>8</span></span>. Людей больше, а муки меньше — нелогично.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Это та же задача, что №4. Метод «сколько на одного» работает всегда.</div></div>", "src": "PL"}, {"id": 20, "topic": "M5.19", "text": "<p>What is the magnitude of the vector \\(\\begin{pmatrix}-7\\\\-24\\end{pmatrix}\\)?</p>", "image": "", "options": ["17", "25", "26", "31", "625"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина вектора = √(a² + b²). Минусы исчезают при возведении в квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−7)² + (−24)² = 49 + 576 = 625.</li><li>√625 = 25.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (31) — сложил 7 + 24 без Пифагора.</li><li>E (625) — забыл корень.</li><li>A (17) — вычел 24 − 7.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тройка 7-24-25 — ещё одна стандартная пифагорова тройка, её полезно знать вместе с 3-4-5 и 5-12-13.</div></div>", "src": "PL"}, {"id": 21, "topic": "M5.13", "text": "<p>The bearing of B from A is 072°.</p><p>What is the bearing of A from B?</p>", "image": "", "options": ["108°", "162°", "252°", "262°", "288°"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный пеленг отличается ровно на 180°: если исходный меньше 180°, прибавляем 180°, если больше — вычитаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>072° < 180°, значит прибавляем.</li><li>72 + 180 = 252°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (108°) — посчитал 180 − 72: это не обратное направление.</li><li>E (288°) — посчитал 360 − 72: это отражение, а не разворот.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуй два севера — в точке A и в точке B. Направления «туда» и «обратно» всегда отличаются на 180°.</div></div>", "src": "PL"}, {"id": 22, "topic": "M5.6", "text": "<p>The point (-1, -6) is translated by the vector \\(\\begin{pmatrix}-4\\\\1\\end{pmatrix}\\).</p><p>What are the coordinates of its image?</p>", "image": "", "options": ["(-4, 1)", "(-5, -5)", "(0, -10)", "(3, -7)", "(4, -6)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перенос на вектор (a, b): к x прибавляем a, к y прибавляем b.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x: −1 + (−4) = −5.</li><li>y: −6 + 1 = −5.</li><li>Образ: (−5, −5).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (3, −7) — вычел вектор вместо прибавления: −1 − (−4) = 3, −6 − 1 = −7.</li><li>A (−4, 1) — записал сам вектор вместо ответа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Верхнее число вектора — сдвиг по x, нижнее — по y. Минус значит влево / вниз.</div></div>", "src": "PL"}, {"id": 23, "topic": "M3.10", "text": "<p>Two mathematically similar bottles have heights in the ratio 2 : 5. The smaller bottle holds 128 ml.</p><p>How much does the larger bottle hold?</p>", "image": "", "options": ["320 ml", "800 ml", "2000 ml", "2128 ml", "4000 ml"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У подобных тел объём увеличивается в k³ раз, где k — коэффициент подобия длин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>5</span><span>2</span></span> = 2.5.</li><li>k³ = 2.5³ = 15.625.</li><li>128 · 15.625 = 2000 мл.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (320 мл) — умножил на k = 2.5, как длину.</li><li>B (800 мл) — умножил на k² = 6.25, как площадь.</li><li>D (2128 мл) — прибавил 2000 к 128 вместо того, чтобы взять результат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно считать так: 128 ÷ 2³ = 16, затем 16 · 5³ = 16 · 125 = 2000.</div></div>", "src": "PL"}, {"id": 24, "topic": "M2.6", "text": "<p>Evaluate \\(\\sqrt{225} + \\sqrt[3]{8}\\).</p>", "image": "", "options": ["15", "16", "17", "18", "19"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадратный корень — какое число в квадрате даёт 225. Кубический — какое число в кубе даёт 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√225 = 15, потому что 15² = 225.</li><li>∛8 = 2, потому что 2³ = 8.</li><li>15 + 2 = 17.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (19) — взял ∛8 как 8 ÷ 2 = 4: 15 + 4 = 19.</li><li>B (16) — посчитал ∛8 как 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадраты до 20² и кубы до 10³ нужно знать наизусть — экономит минуты на экзамене.</div></div>", "src": "PL"}, {"id": 25, "topic": "M3.4", "text": "<p>Three numbers are in the ratio 2 : 3 : 5. The largest is 75 more than the smallest.</p><p>What is their total?</p>", "image": "", "options": ["75", "225", "250", "275", "750"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2 : 3 : 5 — это 2, 3 и 5 частей. Разница между наибольшим и наименьшим даёт размер одной части.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разница: 5 − 2 = 3 части = 75.</li><li>1 часть = 75 ÷ 3 = 25.</li><li>Всего частей: 2 + 3 + 5 = 10. Сумма = 10 · 25 = 250.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (225) — посчитал части как 9 вместо 10.</li><li>E (750) — умножил 75 на 10, забыл найти одну часть.</li><li>A (75) — дал разницу вместо суммы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Записывай отдельно, чему равна 1 часть — тогда любой вопрос (сумма, одно из чисел) решается за строку.</div></div>", "src": "PL"}, {"id": 26, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(0 \\lt n \\le 9\\)?</p>", "image": "", "options": ["7", "8", "9", "10", "11"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0 < n — значит 0 не входит. n ≤ 9 — значит 9 входит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Числа: 1, 2, 3, …, 9.</li><li>Их 9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (10) — включил 0, хотя знак строгий.</li><li>B (8) — исключил 9, хотя там ≤.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Количество целых от a до b включительно = b − a + 1. Здесь 9 − 1 + 1 = 9.</div></div>", "src": "PL"}, {"id": 27, "topic": "M3.11", "text": "<p>₸10,000 is invested at 4% per year compound interest.</p><p>What is it worth after 3 years, to the nearest tenge?</p>", "image": "", "options": ["₸1,200", "₸10,816", "₸11,200", "₸11,249", "₸11,699"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сложный процент: каждый год сумма умножается на 1.04. За 3 года — на 1.04³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1.04² = 1.0816.</li><li>1.04³ = 1.0816 · 1.04 = 1.124864.</li><li>10 000 · 1.124864 = 11 248.64 ≈ 11 249 ₸.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (11 200) — посчитал простые проценты: 3 · 4% = 12%.</li><li>B (10 816) — посчитал только 2 года.</li><li>A (1 200) — дал только прибыль, причём по простому проценту.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Без калькулятора: 1.04³ ≈ 1 + 3 · 0.04 + 3 · 0.04² = 1.1248. Сразу видно, что ответ чуть больше 11 200.</div></div>", "src": "PL"}, {"id": 28, "topic": "M1.2", "text": "<p>A jug holds 1.5 litres. How many cm³ is that?</p>", "image": "", "options": ["15 cm³", "150 cm³", "1,500 cm³", "15,000 cm³", "1,500,000 cm³"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 литр = 1000 см³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1.5 л = 1.5 · 1000 = 1500 см³.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (150) — умножил на 100.</li><li>D (15 000) — умножил на 10 000.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Та же задача, что №13. Литр — это куб 10 × 10 × 10 см.</div></div>", "src": "PL"}, {"id": 29, "topic": "M4.2", "text": "<p>Solve \\(8^{x} = 16^{x-3}\\).</p>", "image": "", "options": ["-12", "9", "12", "13", "24"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к основанию 2: 8 = 2³, 16 = 2⁴.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8ˣ = 2³ˣ.</li><li>16ˣ⁻³ = 2⁴⁽ˣ⁻³⁾ = 2⁴ˣ⁻¹².</li><li>3x = 4x − 12 → x = 12.</li><li>Проверка: 8¹² = 2³⁶ и 16⁹ = 2³⁶. Сходится.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (24) — раскрыл 4(x − 3) как 4x − 24.</li><li>A (−12) — ошибка в знаке при переносе.</li><li>B (9) — проверка: 8⁹ = 2²⁷, а 16⁶ = 2²⁴. Не равны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Та же схема, что №14: одно основание → приравниваешь показатели → проверка подстановкой.</div></div>", "src": "PL"}, {"id": 30, "topic": "M2.10", "text": "<p>Dana has ₸120. She spends \\(\\dfrac{2}{5}\\) of it on books and then \\(\\dfrac{1}{3}\\) of what remains on food.</p><p>How much is left?</p>", "image": "", "options": ["₸16", "₸32", "₸48", "₸58", "₸72"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вторая дробь берётся от остатка, а не от исходной суммы. Считаем по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На книги: <span class=\"fr\"><span>2</span><span>5</span></span> · 120 = 48 ₸. Остаток: 120 − 48 = 72 ₸.</li><li>На еду: <span class=\"fr\"><span>1</span><span>3</span></span> · 72 = 24 ₸. Остаток: 72 − 24 = 48 ₸.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (₸72) — это остаток после книг, забыл про еду.</li><li>B (₸32) — взял ⅓ от всех 120 (40 ₸), а не от остатка: 120 − 48 − 40 = 32.</li><li>A (₸16) — потратил ⅓ остатка дважды или взял ⅓ от 48. Проверяй, от чего берётся дробь.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Короче: остаток = 120 · <span class=\"fr\"><span>3</span><span>5</span></span> · <span class=\"fr\"><span>2</span><span>3</span></span> = 48. Каждое «потратил часть» умножает остаток на (1 − дробь).</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Shyn: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;

      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });

        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);

  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          const vq = qs.filter(q => q.verified !== false);
          vq.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, vq.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
