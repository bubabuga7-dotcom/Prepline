  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }

<script>
const questions = [{"id": 1, "topic": "M4.13", "text": "<p>A speed–time graph shows a cyclist speeding up steadily from rest to 15 m/s in 4 s, staying at 15 m/s for 20 s, then slowing steadily to rest in 6 s.</p><p>How far does the cyclist travel?</p>", "image": "", "options": ["187.5 m", "300 m", "375 m", "405 m", "450 m"], "correct": 2, "explain": "Distance is the area under the graph: two triangles and a rectangle, ½·4·15 + 20·15 + ½·6·15 = 375 m.", "src": "PL"}, {"id": 2, "topic": "M2.9", "text": "<p>Write \\(\\dfrac{11}{25}\\) as a percentage.</p>", "image": "", "options": ["4.4%", "41.5%", "44%", "49%", "440%"], "correct": 2, "explain": "11 ÷ 25 = 0.44 = 44%.", "src": "PL"}, {"id": 3, "topic": "M4.5", "text": "<p>Factorise \\(x^2 - x - 12\\).</p>", "image": "", "options": ["\\((x + 3)(x + 4)\\)", "\\((x + 4)(x - 5)\\)", "\\((x + 3)(x - 4)\\)", "\\((x - 3)(x + 4)\\)", "\\((x - 3)(x - 4)\\)"], "correct": 2, "explain": "Find two numbers with product -12 and sum -1: 3 and -4.", "src": "PL"}, {"id": 4, "topic": "M3.5", "text": "<p>A recipe for 8 people uses 200 g of flour.</p><p>How much flour is needed for 12 people?</p>", "image": "", "options": ["240 g", "300 g", "325 g", "400 g", "\\(\\dfrac{400}{3}\\) g"], "correct": 1, "explain": "200 ÷ 8 × 12 = 300 g.", "src": "PL"}, {"id": 5, "topic": "M5.19", "text": "<p>What is the magnitude of the vector \\(\\begin{pmatrix}-6\\\\-8\\end{pmatrix}\\)?</p>", "image": "", "options": ["2", "10", "11", "14", "100"], "correct": 1, "explain": "Magnitude = √(6² + 8²) = √100 = 10.", "src": "PL"}, {"id": 6, "topic": "M5.13", "text": "<p>A boat sails 3 km south and 3 km east of a harbour H.</p><p>What is the bearing of the boat from H?</p>", "image": "", "options": ["045°", "135°", "180°", "225°", "315°"], "correct": 1, "explain": "Bearings are measured clockwise from north; this direction is 135°.", "src": "PL"}, {"id": 7, "topic": "M5.6", "text": "<p>The point (3, 1) is rotated 90° clockwise about the origin.</p><p>Where does it go?</p>", "image": "", "options": ["(1, -3)", "(1, 3)", "(-3, -1)", "(-1, 3)", "(3, -1)"], "correct": 0, "explain": "90° clockwise about the origin sends (x, y) to (y, −x).", "src": "PL"}, {"id": 8, "topic": "M3.10", "text": "<p>A cube has surface area 150 cm². Every edge is multiplied by 4.</p><p>What is the surface area of the new cube?</p>", "image": "", "options": ["154 cm²", "600 cm²", "1200 cm²", "2400 cm²", "9600 cm²"], "correct": 3, "explain": "Areas scale by the square of the length factor: 150 × 4² = 2400 cm².", "src": "PL"}, {"id": 9, "topic": "M2.6", "text": "<p>What is the smallest positive whole number \\(k\\) such that \\(50 k\\) is a perfect square?</p>", "image": "", "options": ["2", "3", "4", "8", "50"], "correct": 0, "explain": "Write 50 in prime factors; the primes with an odd power multiply to 2, and 50 × 2 = 100 = 10².", "src": "PL"}, {"id": 10, "topic": "M3.4", "text": "<p>In a club the ratio of boys to girls is 5 : 3. There are 20 more boys than girls.</p><p>How many girls are there?</p>", "image": "", "options": ["30", "40", "50", "60", "80"], "correct": 0, "explain": "The difference is 2 part(s) = 20, so one part is 10 and girls = 3 × 10 = 30.", "src": "PL"}, {"id": 11, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(1 \\lt n \\le 4\\)?</p>", "image": "", "options": ["1", "2", "3", "4", "5"], "correct": 2, "explain": "They are 2, 3, 4: 3 integers. The left end is not included, the right end is.", "src": "PL"}, {"id": 12, "topic": "M3.11", "text": "<p>After two years at 10% compound interest per year an account holds $1,210.</p><p>How much was put in at the start?</p>", "image": "", "options": ["$968", "$980", "$1,000", "$1,008", "$1,100"], "correct": 2, "explain": "Undo two increases: 1,210 ÷ 1.1² = 1,210 ÷ 1.21 = 1,000. Taking 20% off is wrong, because the percentages were of different amounts.", "src": "PL"}, {"id": 13, "topic": "M1.2", "text": "<p>A jug holds 4 litres. How many cm³ is that?</p>", "image": "", "options": ["40 cm³", "400 cm³", "4,000 cm³", "40,000 cm³", "4,000,000 cm³"], "correct": 2, "explain": "1 litre = 1000 cm³.", "src": "PL"}, {"id": 14, "topic": "M4.2", "text": "<p>Solve \\(8^{x} = 16^{x-2}\\).</p>", "image": "", "options": ["-8", "6", "8", "9", "16"], "correct": 2, "explain": "Write both as powers of 2: 3·x = 4(x − 2), so x = 8.", "src": "PL"}, {"id": 15, "topic": "M2.10", "text": "<p>After a 12% increase a coat costs ₸16,800.</p><p>What did it cost before the increase?</p>", "image": "", "options": ["₸13,548", "₸14,784", "₸15,000", "₸15,200", "₸16,680"], "correct": 2, "explain": "The new price is 112% of the old: 16,800 ÷ 1.12 = 15,000. Taking 12% off the new price is wrong.", "src": "PL"}, {"id": 16, "topic": "M4.13", "text": "<p>On a speed–time graph a straight line joins (0, 2) to (3, 8), with time in seconds and speed in m/s.</p><p>What is the acceleration?</p>", "image": "", "options": ["2 m/s²", "4 m/s²", "5 m/s²", "\\(\\dfrac{1}{2}\\) m/s²", "\\(\\dfrac{8}{3}\\) m/s²"], "correct": 0, "explain": "Acceleration is the gradient: (8 − 2) ÷ 3 = 2 m/s².", "src": "PL"}, {"id": 17, "topic": "M2.9", "text": "<p>Which fraction equals \\(0.\\overline{45}\\)?</p>", "image": "", "options": ["\\(\\dfrac{10}{11}\\)", "\\(\\dfrac{5}{11}\\)", "\\(\\dfrac{9}{20}\\)", "\\(\\dfrac{5}{12}\\)", "\\(\\dfrac{6}{11}\\)"], "correct": 1, "explain": "Let x be the decimal and subtract a shifted copy to remove the repeating part; x = \\(\\dfrac{5}{11}\\).", "src": "PL"}, {"id": 18, "topic": "M4.5", "text": "<p>Expand \\((3x + 1)(x + 4)\\).</p>", "image": "", "options": ["\\(3x^2 + 11x + 4\\)", "\\(3x^2 + 13x + 4\\)", "\\(3x^2 + 12x + 4\\)", "\\(3x^2 + 13x - 4\\)", "\\(4x^2 + 13x + 4\\)"], "correct": 1, "explain": "Multiply each term: 3x² + 12x + 1x + 4, then collect the x terms.", "src": "PL"}, {"id": 19, "topic": "M3.5", "text": "<p>A recipe for 5 people uses 250 g of flour.</p><p>How much flour is needed for 8 people?</p>", "image": "", "options": ["280 g", "400 g", "425 g", "500 g", "\\(\\dfrac{625}{4}\\) g"], "correct": 1, "explain": "250 ÷ 5 × 8 = 400 g.", "src": "PL"}, {"id": 20, "topic": "M5.19", "text": "<p>What is the magnitude of the vector \\(\\begin{pmatrix}-7\\\\-24\\end{pmatrix}\\)?</p>", "image": "", "options": ["17", "25", "26", "31", "625"], "correct": 1, "explain": "Magnitude = √(7² + 24²) = √625 = 25.", "src": "PL"}, {"id": 21, "topic": "M5.13", "text": "<p>The bearing of B from A is 072°.</p><p>What is the bearing of A from B?</p>", "image": "", "options": ["108°", "162°", "252°", "262°", "288°"], "correct": 2, "explain": "Back bearing = 072° + 180° = 252°.", "src": "PL"}, {"id": 22, "topic": "M5.6", "text": "<p>The point (-1, -6) is translated by the vector \\(\\begin{pmatrix}-4\\\\1\\end{pmatrix}\\).</p><p>What are the coordinates of its image?</p>", "image": "", "options": ["(-4, 1)", "(-5, -5)", "(0, -10)", "(3, -7)", "(4, -6)"], "correct": 1, "explain": "Add the vector to each coordinate: (-1 + (-4), -6 + (1)) = (-5, -5).", "src": "PL"}, {"id": 23, "topic": "M3.10", "text": "<p>Two mathematically similar bottles have heights in the ratio 2 : 5. The smaller bottle holds 128 ml.</p><p>How much does the larger bottle hold?</p>", "image": "", "options": ["320 ml", "800 ml", "2000 ml", "2128 ml", "4000 ml"], "correct": 2, "explain": "Volumes scale by the cube of the length ratio: 128 × (5/2)³ = 2000 ml.", "src": "PL"}, {"id": 24, "topic": "M2.6", "text": "<p>Evaluate \\(\\sqrt{225} + \\sqrt[3]{8}\\).</p>", "image": "", "options": ["15", "16", "17", "18", "19"], "correct": 2, "explain": "√225 = 15 and ∛8 = 2, so 17.", "src": "PL"}, {"id": 25, "topic": "M3.4", "text": "<p>Three numbers are in the ratio 2 : 3 : 5. The largest is 75 more than the smallest.</p><p>What is their total?</p>", "image": "", "options": ["75", "225", "250", "275", "750"], "correct": 2, "explain": "The difference is 5 − 2 = 3 parts = 75, so one part is 25 and the total is 10 × 25 = 250.", "src": "PL"}, {"id": 26, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(0 \\lt n \\le 9\\)?</p>", "image": "", "options": ["7", "8", "9", "10", "11"], "correct": 2, "explain": "They are 1, 2, 3, 4, 5, 6, 7, 8, 9: 9 integers. The left end is not included, the right end is.", "src": "PL"}, {"id": 27, "topic": "M3.11", "text": "<p>₸10,000 is invested at 4% per year compound interest.</p><p>What is it worth after 3 years, to the nearest tenge?</p>", "image": "", "options": ["₸1,200", "₸10,816", "₸11,200", "₸11,249", "₸11,699"], "correct": 3, "explain": "10,000 × 1.04^3 = 11,249. Simple interest would ignore the interest earned on interest.", "src": "PL"}, {"id": 28, "topic": "M1.2", "text": "<p>A jug holds 1.5 litres. How many cm³ is that?</p>", "image": "", "options": ["15 cm³", "150 cm³", "1,500 cm³", "15,000 cm³", "1,500,000 cm³"], "correct": 2, "explain": "1 litre = 1000 cm³.", "src": "PL"}, {"id": 29, "topic": "M4.2", "text": "<p>Solve \\(8^{x} = 16^{x-3}\\).</p>", "image": "", "options": ["-12", "9", "12", "13", "24"], "correct": 2, "explain": "Write both as powers of 2: 3·x = 4(x − 3), so x = 12.", "src": "PL"}, {"id": 30, "topic": "M2.10", "text": "<p>Dana has ₸120. She spends \\(\\dfrac{2}{5}\\) of it on books and then \\(\\dfrac{1}{3}\\) of what remains on food.</p><p>How much is left?</p>", "image": "", "options": ["₸16", "₸32", "₸48", "₸58", "₸72"], "correct": 2, "explain": "After books: 72. Food takes \\(\\dfrac{1}{3}\\) of that, leaving 48.", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
        ${q.explain ? `<details style="margin-top:8px;font-size:14px;line-height:1.55"><summary style="cursor:pointer;color:var(--gold,#C9AA6A);font-weight:600">Why ${'ABCDE'[q.correct]}?</summary><div style="margin-top:6px;opacity:.9">${q.explain}</div></details>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">

    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
