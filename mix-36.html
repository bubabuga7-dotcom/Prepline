<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m020_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Срез делит цилиндр на две одинаковые половины.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V цилиндра = π · 2² · 5 = 20π.</li><li>Половина: 10π.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — весь цилиндр.</li><li>D, E — радиус 4 вместо 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 см — диаметр, радиус 2.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m020_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6s² = 24a² → s = 2a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V = (2a)³ = 8a³.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — не объём (a²).</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У куба 6 граней.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m020_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время ∝ объём.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V₁ = π · 16 · 6 = 96π; V₂ = π · 36 · 8 = 288π.</li><li><span class=\"fr\"><span>288</span><span>96</span></span> = 3 → 3 · 3 = 9 ч.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — отношение радиусов.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скорость наполнения одинаковая.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m020_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр: радиус 2, высота = 3 диаметра = 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V = π · 4 · 12 = 48π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — высота 4.</li><li>Остальные — неверная высота.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Три шара в ряд — высота 6r.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m020_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внутренний объём: вычитаем стенки и дно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Длина 10 − 2 = 8, ширина 8 − 2 = 6, высота 3 − 1 = 2.</li><li>8 · 6 · 2 = 96.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 7 · ... вычли по одной стенке.</li><li>C — полный объём 10 · 8 · 3 / 2.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стенки с двух сторон, дно — только снизу.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m020_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одна окрашенная грань — внутренние кубики каждой грани: (a − 2)(b − 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Грани 3 × 4: 1 · 2 = 2, две грани → 4.</li><li>Грани 3 × 5: 1 · 3 = 3 → 6.</li><li>Грани 4 × 5: 2 · 3 = 6 → 12.</li><li>Итого 22.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный подсчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рёбра и углы имеют 2–3 окрашенные грани.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m020_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольник: противолежащий m, прилежащий 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Гипотенуза √(m² + 1).</li><li>sin x = <span class=\"fr\"><span>m</span><span>√</span></span>(m² + 1).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это cos x.</li><li>B, D, E — 1 − m² вместо 1 + m².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> tg = <span class=\"fr\"><span>sin</span><span>cos</span></span>.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m020_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">B(−3; −3).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = 8, BC = 15, AC = 17.</li><li>cos C = <span class=\"fr\"><span>BC</span><span>AC</span></span> = <span class=\"fr\"><span>15</span><span>17</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — sin C.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 8-15-17 — пифагорова тройка.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m020_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC — диаметр → ∠B = 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = sin θ, BC = cos θ.</li><li>S = ½ sin θ cos θ.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — tg.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Гипотенуза 1 → катеты = sin и cos.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m020_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дуга AD — четверть окружности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2πr</span><span>4</span></span> = <span class=\"fr\"><span>πr</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — восьмая часть.</li><li>D — площадь.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадрат делит окружность на 4 равные дуги.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m020_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">r = 6; периметр сектора = 2r + дуга.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дуга: <span class=\"fr\"><span>12π</span><span>8</span></span> = 1,5π.</li><li>12 + 1,5π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — один радиус.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У сектора два радиуса.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m020_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x − a)² + (y − b)² = r².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Центр (−2; 0) → (x + 2)²; r² = 49.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — знак центра.</li><li>B — r² = 7.</li><li>E — минус перед y².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь πr² = 49π → r² = 49.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m020_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанный угол 30° → дуга 60°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>60</span><span>360</span></span> = <span class=\"fr\"><span>1</span><span>6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — <span class=\"fr\"><span>30</span><span>360</span></span>.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дуга = 2 × вписанный угол.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m020_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Полная поверхность: 2πr² + 2πrh.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>32π + 40π = 72π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только боковая.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Два основания.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m020_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центры кругов — квадрат со стороной 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Квадрат: 64.</li><li>Внутри — 4 четверти кругов = один круг 16π.</li><li>64 − 16π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 четверти = целый круг.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m020_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый круг без сектора 60°, вырезанного треугольником.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Два круга: 18π.</li><li>Вырезано: 2 · ⅙ · 9π = 3π.</li><li>15π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — вырезали по 120°.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол равностороннего треугольника 60°.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m020_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Незаштрихованный сектор: 36π − 24π = 12π → 120°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угол при O = 120°.</li><li>Треугольник равнобедренный: x = <span class=\"fr\"><span>180 − 120</span><span>2</span></span> = 30.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>12π</span><span>36π</span></span> = ⅓ круга.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m020_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ квадрата = a√2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 6√2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 45-45-90.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m020_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы 60° → треугольник ABC равносторонний со стороной 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>BD — высота и медиана → DC = 5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — высота BD.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота равностороннего делит основание пополам.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m020_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона квадрата 2 — сторона треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = <span class=\"fr\"><span>√3</span><span>4</span></span> · 4 = √3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>√3</span><span>4</span></span>a².</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m020_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подобие конусов: <span class=\"fr\"><span>2</span><span>1</span></span> = <span class=\"fr\"><span>6</span><span>H</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>H = 3 → нижняя часть 3 − 1 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — вся высота.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус ×3 → высота ×3.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m020_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Неравенство треугольника: z &lt; x + y = 10 − z.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2z &lt; 10 → z &lt; 5 → z = 4 (например, 3, 3, 4).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — z = 5 даёт вырожденный треугольник.</li><li>C, D, E — нарушают неравенство.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наибольшая сторона меньше половины периметра.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m020_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">DE соответствует AB = 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>9</span><span>6</span></span> = 1,5.</li><li>P = 20 · 1,5 = 30.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — периметр ABC.</li><li>Остальные — неверное соответствие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соответствие по порядку букв: A↔D, B↔E.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m020_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">DE ∥ AB → подобие.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>BC = √(81 + 144) = 15.</li><li>k = <span class=\"fr\"><span>6</span><span>9</span></span> = ⅔ → CE = 10.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный коэффициент.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 9-12-15.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m020_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Третий угол большого треугольника, затем смежный угол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>180 − 60 − 50 = 70°.</li><li>Смежный: 110°.</li><li>y = 180 − 110 − 40 = 30.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Развёрнутый угол 180°.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m020_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x — внешний угол треугольника, образованного секущими и прямой m (или l).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Перенесём a на прямую m (соответственные углы).</li><li>x = a + b.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = сумма двух несмежных.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m020_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы по одну сторону прямой в сумме 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сверху: x + 45 = 180 → x = 135.</li><li>Снизу: 80 + y = 180 → y = 100.</li><li>x + y = 235.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите прямую, проходящую через точку.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m020_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отмечены все углы двух четырёхугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>360 + 360 = 720.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — один четырёхугольник.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма углов любого четырёхугольника 360°.</div></div>"}, {"id": 31, "topic": "M4.8", "text": "<p>Given that \\(x^2 + 10x + 22 \\equiv (x + a)^2 + b\\) for all \\(x\\), find \\(b\\).</p>", "image": "", "options": ["−3", "3", "5", "22", "47"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделите полный квадрат: a = половина коэффициента при x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 5, (x + 5)² = x² + 10x + 25.</li><li>b = 22 − 25 = −3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — это a, а не b.</li><li>D — взяли свободный член без поправки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте коэффициенты при одинаковых степенях.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.10", "text": "<p>Arman spends \\(\\dfrac{1}{4}\\) of his money on a game and \\(\\dfrac{2}{3}\\) of what is left on lunch. He has ₸1800 left.</p><p>How much did he start with?</p>", "image": "", "options": ["₸2400", "₸3450", "₸7200", "₸7800", "₸21,600"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Остаток = (1 − <span class=\"fr\"><span>1</span><span>4</span></span>)(1 − <span class=\"fr\"><span>2</span><span>3</span></span>) от начальной суммы = <span class=\"fr\"><span>1</span><span>4</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1800 : <span class=\"fr\"><span>1</span><span>4</span></span> = 7200. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли про обед.</li><li>B — прибавили доли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Работайте с остатками, а не с потраченным.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
