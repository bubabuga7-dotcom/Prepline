<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p>Recent studies suggest that people who own pets often report lower levels of stress and loneliness. In one national survey, 76% of dog owners claimed that having a pet helped them stay active, maintain routines, and engage socially with others. Some health professionals have taken note of these findings and have begun recommending pet adoption to individuals struggling with anxiety or mild depression. Proponents argue that the emotional bond formed with animals has measurable therapeutic effects. Given this trend, it appears that adopting a pet can be considered a valid form of medical support for anxiety.</p><p>Which one of the following best expresses the main conclusion of the argument?</p>", "image": "", "options": ["Doctors are now prescribing pet adoption for some patients.", "Pets help people feel less lonely and more active.", "Adopting a pet is an effective medical treatment for anxiety.", "Dog owners report lower stress than others.", "Surveys show that many people love their pets."], "correct": 2, "src": "CRIT34", "orig": "images/q-4765c1567f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — последняя фраза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Завести питомца можно считать медицинской поддержкой при тревожности. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — посылки и детали.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Given this trend, it appears…» — вывод.</div></div>"}, {"id": 2, "topic": "FLAW", "text": "<p>A prominent university recently claimed to offer the highest level of student satisfaction in the country. This conclusion was based on the results of an online survey hosted on the university's own website, where current students were invited to provide feedback. The majority of respondents gave highly positive ratings in areas such as teaching quality, campus life, and student services. University officials interpreted these results as clear evidence that their institution outperforms others in delivering the best student experience. However, no comparison was made with surveys from other universities, and it was unclear how many students participated or whether the sample was representative.</p><p>Which of the following best identifies the flaw in the argument?</p>", "image": "", "options": ["Some students might not have internet access.", "Not all universities conduct their own surveys.", "Positive survey responses may not reflect reality.", "The survey results may be biased due to self-selection.", "Satisfaction is not the same as academic performance."], "correct": 3, "src": "CRIT34", "orig": "images/q-4d8e185429.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Опрос на своём сайте, кто захотел — тот ответил.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Выборка сама себя отобрала и может быть предвзятой. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — слишком общо.</li><li>A, B, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Добровольный опрос ≠ представительный.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p>A clothing store announces a limited-time promotion: \"Buy 2 shirts at full price and get the 3rd one for 50% off.\" Each shirt is priced at $24, and customers must purchase three shirts in a single transaction to qualify. The store hopes this deal will increase sales volume by encouraging larger purchases. A shopper is considering whether the discount makes a significant difference in total cost.</p><p>What would be the average cost per shirt under this promotion?</p>", "image": "", "options": ["$18.00", "$20.00", "$21.00", "$22.00", "$23.00"], "correct": 1, "src": "CRIT34", "orig": "images/q-1e9e5e698f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем три рубашки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>24 + 24 + 12 = $60.</li><li>60 : 3 = $20. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — скидка на все.</li><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скидка только на третью.</div></div>"}, {"id": 4, "topic": "ASM", "text": "<p>In recent debates about education, some parents and school officials have advocated for a complete ban on smartphones in schools. They argue that smartphones are a constant source of distraction, preventing students from fully engaging in lessons. According to this view, removing the devices will help learners focus better, leading to improved academic outcomes. Although there is limited long-term research supporting this policy, some schools report anecdotal benefits like higher test scores and fewer classroom disruptions. Still, critics point out that technology can also support learning when used properly.</p><p>Which of the following is an assumption made in the argument for banning smartphones?</p>", "image": "", "options": ["Students use phones only for entertainment.", "All distractions harm learning equally.", "Lack of long-term studies means the policy is flawed.", "Reduced distractions will lead to better focus and results.", "Teachers can't monitor phone usage effectively."], "correct": 3, "src": "CRIT34", "orig": "images/q-56272d159f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: без телефонов результаты лучше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, если меньше отвлечений → лучше концентрация и результаты. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — слишком сильно.</li><li>C, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение о механизме.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p>A university department has a high-speed printer used for producing exam materials. According to previous use logs, the printer takes exactly 8 minutes to print 20 pages when operating at a consistent rate without any interruptions. Before an upcoming exam session, the printer is scheduled to run continuously for 30 minutes to prepare handouts for multiple classrooms. Assuming the printer maintains the same speed and doesn't require additional setup or warm-up time, the department wants to know how many pages it can expect to print during this time.</p><p>How many pages will the printer produce in 30 minutes?</p>", "image": "", "options": ["60 pages", "70 pages", "75 pages", "80 pages", "90 pages"], "correct": 2, "src": "CRIT34", "orig": "images/q-84c15ee90f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Скорость: 20 страниц за 8 мин = 2,5 стр./мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2,5 · 30 = 75. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите «в минуту».</div></div>"}, {"id": 6, "topic": "WKN", "text": "<p>A recent advertisement promoting green tea claimed that people who consume it daily experience significantly lower levels of stress. This claim was based on a small study involving 50 volunteers, all of whom drank green tea every day for one week. At the end of the trial, most participants reported feeling calmer and more relaxed. The company behind the advertisement concluded that green tea directly reduces stress and recommended it as a natural solution. However, the study included no control group and relied entirely on self-reported data.</p><p>Which of the following, if true, most weakens the argument?</p>", "image": "", "options": ["The participants already preferred green tea before the study.", "Stress is difficult to measure objectively.", "The study didn't compare green tea to other drinks.", "Only 50 people participated in the study.", "People often exaggerate their feelings in surveys."], "correct": 0, "src": "CRIT34", "orig": "images/q-d845cab33c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: зелёный чай снижает стресс.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если участники уже любили чай — они заранее были настроены хвалить его. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D, E — общие слабости.</li><li>C — описано в тексте, но A — конкретная причина предвзятости.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предвзятость участников сильнее всего бьёт по выводу.</div></div>"}, {"id": 7, "topic": "PRIN", "text": "<p>It is time for graffiti to be legalized. It has been illegal for decades, and yet it is still present in every modern city. Clearly, its being illegal does not provide enough of a deterrent to prevent people from engaging in it. We are never going to eradicate graffiti entirely, so we should give up trying and legalize it. Money that is currently spent on prosecuting graffiti artists could be better used elsewhere.\"</p><p>Which one of the following illustrates the principle used in the above argument?</p>", "image": "", "options": ["Property owners should be compensated for damage, but the artists themselves should not be prosecuted.", "Some people will commit murders, whether or not murder is illegal, so murder should not be illegal.", "People who engage in minor vandalism largely as a result of a background of poverty should not be prosecuted.", "Modern crimes, such as cyber-terrorism, should be the focus of police forces rather than street crimes.", "We should not waste money trying to rehabilitate young vandals who repeat their offenses."], "correct": 1, "src": "CRIT34", "orig": "images/q-b6da6a5da9.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Принцип: если запрет не останавливает всех — нужно отменить запрет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>То же в B: убийства всё равно совершают → не запрещать. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип доводят до крайности, чтобы проверить.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p>A large underground water tank is equipped with two separate filling pipes: Pipe A and Pipe B. Pipe A, when functioning alone, can completely fill the tank in exactly 4 hours. Pipe B is also a filling pipe that can fill the same tank in 6 hours. During operation, both pipes were opened at the same time while the tank was empty. How long will it take for the tank to become completely full under these conditions?</p>", "image": "", "options": ["5 hours", "6 hours", "8 hours", "12 hours", "12/5 hours (2 hours 24 minutes)"], "correct": 4, "src": "CRIT34", "orig": "images/q-f5efe8721a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем скорости труб.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>4</span></span> + <span class=\"fr\"><span>1</span><span>6</span></span> = <span class=\"fr\"><span>5</span><span>12</span></span> бака в час.</li><li>Время: <span class=\"fr\"><span>12</span><span>5</span></span> ч = 2 ч 24 мин. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — среднее.</li><li>D — НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вместе быстрее, чем быстрейшая.</div></div>"}, {"id": 9, "topic": "MC", "text": "<p>A public museum recently introduced a policy that allows visitors to enter free of charge every Monday. Following the introduction of this policy, the museum reported a 40% increase in attendance on Mondays compared to previous months. Museum administrators argue that this rise shows cost was a significant barrier preventing people from engaging with cultural institutions. Although some critics suggest that other factors such as improved publicity or seasonal changes may have contributed to the increase, the museum director maintains that free admission is the decisive factor. On this basis, the director believes that entrance fees are the main obstacle to public engagement with culture.</p><p>Which one of the following best expresses the main conclusion of the argument?</p>", "image": "", "options": ["Museums should open for free every day.", "People like to save money on cultural events.", "Free entry increases museum attendance.", "Removing entrance fees is the best way to boost cultural interest.", "Mondays are the most popular museum days."], "correct": 3, "src": "CRIT34", "orig": "images/q-26bf16db8b.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — мнение директора в конце.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Входная плата — главное препятствие → убрать её — лучший способ. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — посылка.</li><li>A, B, E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «On this basis, the director believes…» — вывод.</div></div>"}, {"id": 10, "topic": "PAR", "text": "<p>Amrik cannot afford to buy the Advanced version of the software. The Professional version is even more expensive, so Amrik cannot afford that either.</p><p>Which one of the following most closely parallels the reasoning used in the above argument?</p>", "image": "", "options": ["Amrik does not like foods containing garlic. This pizza contains garlic and anchovies, so Amrik won't like it either.", "It is too far for Amrik to walk to the garden centre. The shops are closer, so he will go there instead.", "Amrik cannot sleep at night if he drinks a cup of tea after 9pm, because tea contains caffeine. Coffee contains more caffeine than tea, so Amrik won't drink that after 9pm either.", "Amrik didn't have enough patience to complete the 1000 piece jigsaw he got for his birthday. The Times crossword also requires patience, so he won't complete that either.", "Amrik's hair is shorter, and Callum's hair is longer, than Bill's. So Amrik's hair is shorter than Callum's."], "correct": 2, "src": "CRIT34", "orig": "images/q-d9a5b6c3f2.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Структура: не может X; Y ещё «больше» по тому же признаку → не может и Y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>То же в C: чай мешает спать из-за кофеина; в кофе кофеина больше → его тоже не пьёт. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — состав, а не степень.</li><li>D — общий признак, но без «больше».</li><li>B, E — другое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите «ещё больше того же».</div></div>"}, {"id": 11, "topic": "CON", "text": "<p>Recent innovations in urban farming have enabled cities to grow fresh produce in vertical gardens using hydroponic systems. A study conducted in three major cities found that these gardens yielded high amounts of vegetables with minimal space and water. Additionally, local restaurants reported a reduction in costs and delivery times when sourcing from nearby urban farms. As global populations continue to concentrate in urban areas, some experts see vertical farming as an important tool for future food security.</p><p>Which one of the following can most reasonably be concluded from the information above?</p>", "image": "", "options": ["Vertical farming is more productive than traditional farming.", "Cities will become self-sufficient in food production.", "Urban farming may help address food needs in growing cities.", "Hydroponics is the best method for growing vegetables.", "Restaurants should only buy food locally."], "correct": 2, "src": "CRIT34", "orig": "images/q-932efb245c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вертикальные фермы дают много продукции на малой площади.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Они могут помочь кормить растущие города. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «May» — правильная осторожность.</div></div>"}, {"id": 12, "topic": "ASM", "text": "<p>Governments often subsidise higher education to ensure that all capable students have access to university, regardless of their financial background. One argument in favour of this policy is that an educated population brings broad social benefits, such as reduced crime rates and increased civic engagement. Critics, however, argue that university education mainly benefits individuals through better job opportunities and higher income. Despite these concerns, public investment in university education continues to grow in many countries.</p><p>Which of the following is an assumption underlying the argument in favour of public funding for higher education?</p>", "image": "", "options": ["Not everyone who attends university graduates.", "Educated individuals are more likely to earn higher salaries.", "Social benefits from education outweigh the individual gains.", "Public funds are not needed to support primary education.", "Crime rates are only indirectly affected by education."], "correct": 2, "src": "CRIT34", "orig": "images/q-0b7e5b41ee.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторонники: образование полезно всему обществу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тратить общественные деньги разумно, если общая польза больше личной. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — довод критиков.</li><li>A, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение отвечает на возражение критиков.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p>The number of new dwellings completed each quarter by a builder for 3 years is shown below.</p><table class=\"q-table\"><thead><tr><th></th><th><strong>2004</strong></th><th></th><th></th><th></th><th><strong>2005</strong></th><th></th><th></th><th></th><th><strong>2006</strong></th><th></th><th></th><th></th></tr></thead><tbody><tr><td><strong>Quarter</strong></td><td>1</td><td>2</td><td>3</td><td>4</td><td>1</td><td>2</td><td>3</td><td>4</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><td>Bungalows</td><td>7</td><td>12</td><td>14</td><td>9</td><td>6</td><td>10</td><td>13</td><td>4</td><td>5</td><td>8</td><td>12</td><td>3</td></tr><tr><td>Terraced houses</td><td>6</td><td>9</td><td>11</td><td>7</td><td>9</td><td>12</td><td>17</td><td>7</td><td>10</td><td>16</td><td>19</td><td>9</td></tr><tr><td>Semi-detached houses</td><td>15</td><td>29</td><td>32</td><td>20</td><td>18</td><td>27</td><td>34</td><td>17</td><td>20</td><td>33</td><td>37</td><td>26</td></tr><tr><td>Detached houses</td><td>8</td><td>14</td><td>16</td><td>13</td><td>9</td><td>16</td><td>19</td><td>12</td><td>24</td><td>27</td><td>27</td><td>21</td></tr></tbody></table><p>How many more semi-detached houses were built in the second half of 2006 than were built in the first half of 2004?</p>", "image": "", "options": ["1", "11", "19", "26", "41"], "correct": 2, "src": "CRIT34", "orig": "images/q-3b3862a0b4.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Берём строку «Semi-detached».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2006, 2-е полугодие: 37 + 26 = 63.</li><li>2004, 1-е полугодие: 15 + 29 = 44.</li><li>63 − 44 = 19. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не те строки или кварталы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полугодие = 2 квартала.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p>In Bankland the banks are dosed on two successive days, but not on Saturday and Sunday. You can deposit cheques with the cashier or, when the banks are dosed, at the box outside the bank. Cheque processing always starts on the first working day after the cheque is deposited. The bank always processes it within the same number of working days. When you deposit a cheque on Monday the bank will then process the cheque and the money will be available on Sunday. When you deposit a cheque on Wednesday the money will be available on Monday. When you deposit a cheque on Friday the money will be available on Tuesday. The weekend falls on:</p>", "image": "", "options": ["Monday and Tuesday.", "Tuesday and Wednesday.", "Wednesday and Thursday.", "Thursday and Friday.", "Friday and Saturday."], "correct": 2, "src": "CRIT34", "orig": "images/q-befda9f78f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверим вариант «выходные — среда и четверг».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Понедельник → рабочие дни вт, пт, сб, вс → деньги в воскресенье ✓.</li><li>Среда (выходной) → пт, сб, вс, пн → понедельник ✓.</li><li>Пятница → сб, вс, пн, вт → вторник ✓. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные варианты не дают все три даты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте варианты по всем условиям.</div></div>"}, {"id": 15, "topic": "STR", "text": "<p>Some companies have introduced four-day work weeks without reducing employee pay. Early reports suggest that employees are just as productive, if not more so, and experience lower levels of stress. Critics argue that reduced hours will harm long-term output and client satisfaction. However, proponents claim that improved employee well-being leads to fewer sick days and higher motivation, which ultimately benefits business performance.</p><p>Which of the following, if true, would most strengthen the proponents' argument?</p>", "image": "", "options": ["Employees prefer flexible hours over longer weekends.", "Companies offering four-day weeks report a drop in absenteeism.", "Clients often contact businesses outside standard work hours.", "Most employees work remotely at least once a week.", "Some sectors cannot operate on a reduced schedule."], "correct": 1, "src": "CRIT34", "orig": "images/q-f6bf6a7d30.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторонники: лучшее самочувствие → меньше больничных.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в таких компаниях стало меньше прогулов — довод подтверждается. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — не связаны.</li><li>C, E — ослабляют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подтвердите механизм данными.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p>Aruzhan is using a traditional family recipe that calls for 3 cups of flour to make 12 shelpeks. The recipe proportions are carefully balanced to ensure the texture and taste come out just right. One day, the Aruzhan decides to make only 8 muffins, since she doesn't need the full batch. She wants to keep the ingredient ratios consistent so that the quality of the muffins remains unchanged. To do this, she needs to calculate how much flour is required when preparing a smaller portion.</p><p>How much flour should she use to make 8 shelpek?</p>", "image": "", "options": ["1.5 cups", "2 cups", "2.25 cups", "2.5 cups", "3 cups"], "correct": 1, "src": "CRIT34", "orig": "images/q-001f8db23a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пропорция: 3 чашки на 12 штук.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На одну: <span class=\"fr\"><span>1</span><span>4</span></span> чашки.</li><li>На 8: 2 чашки. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная пропорция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 8 — это <span class=\"fr\"><span>2</span><span>3</span></span> от 12.</div></div>"}, {"id": 17, "topic": "FLAW", "text": "<p>A school reports that students who participate in extracurricular clubs tend to achieve higher grades than those who do not. Based on this, the school concludes that joining clubs improves academic performance. However, no consideration was given to other factors such as motivation or time management. It's possible that students who choose to join clubs are already more organised or driven.</p><p>Which one of the following best identifies the flaw in the school's argument?</p>", "image": "", "options": ["Not all students are interested in extracurricular activities.", "Club members may receive help from teachers.", "Correlation between two factors does not prove one causes the other.", "Some students focus only on academics.", "Participation in clubs varies by age."], "correct": 2, "src": "CRIT34", "orig": "images/q-357adad599.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Клубы и оценки связаны, но причина может быть другой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Связь не доказывает причину. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"}, {"id": 18, "topic": "PRIN", "text": "<p>A community garden charges members a small monthly fee to help cover costs. One member argues that those who use the garden most should pay more, while occasional users should pay less. Others believe the fixed fee is fair, since everyone has equal access regardless of how often they visit.</p><p>Which principle best supports the fixed-fee model?</p>", "image": "", "options": ["Access should be restricted based on frequency of use.", "Fairness requires that contributions reflect usage.", "Equal opportunity justifies equal cost, regardless of use.", "Community resources should be free for all.", "Participation rates are hard to measure."], "correct": 2, "src": "CRIT34", "orig": "images/q-c260184f0a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Фиксированная плата — у всех одинаковый доступ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Принцип: равная возможность → равная плата. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — поддерживает другую идею.</li><li>A, D, E — не про плату.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип должен оправдывать именно эту модель.</div></div>"}, {"id": 19, "topic": "CON", "text": "<p>A recent public health campaign encouraged people to cycle or walk to work rather than drive. Surveys conducted before and after the campaign showed a slight increase in active commuting, particularly among young adults. While it is too early to assess long-term health outcomes, cities reported decreased traffic congestion during peak hours. Several local governments are now considering expanding pedestrian zones and cycling lanes in response to these trends.</p><p>Which one of the following can most reasonably be concluded from the information above?</p>", "image": "", "options": ["Health campaigns are the most effective way to change behaviour.", "Fewer people drive during peak hours on weekdays.", "Small changes in commuting habits can lead to broader urban planning responses.", "Young adults are more interested in cycling than older people.", "Congestion is the main factor affecting urban health outcomes"], "correct": 2, "src": "CRIT34", "orig": "images/q-2cd11b6e24.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Небольшое изменение привычек → города расширяют дорожки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Небольшие изменения могут вызвать крупные решения в планировке. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — слишком сильно.</li><li>B — не следует точно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обобщите без крайностей.</div></div>"}, {"id": 20, "topic": "PAR", "text": "<p>Some people argue that eating out is always unhealthy. But just because many restaurant meals are high in calories does not mean all of them are. In fact, many places now offer balanced and nutritious options. It is unreasonable to assume that eating out always leads to poor nutrition.</p><p>Which one of the following most closely parallels the reasoning in the above argument?</p>", "image": "", "options": ["Not all movies are bad just because some get poor reviews.", "Restaurants should clearly label their menu items.", "People can cook unhealthy meals at home too.", "Eating habits vary by culture.", "Nutrition education should begin early."], "correct": 0, "src": "CRIT34", "orig": "images/q-7638c702b7.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Структура: «многие X плохие» ≠ «все X плохие».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>То же в A: не все фильмы плохие, раз некоторые получили плохие отзывы. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — другое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите ту же логическую форму.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p>A bicycle with 'dérailleur' gears enables the rider to change the ratio between the number of turns of the pedal and of the wheel. One that is sold as '12-speed' has two large cogs on the pedal and six smaller ones on the rear wheel.</p><p>On the cogs attached to the pedal, the numbers of teeth are 40 and 48. On the cogs attached to the rear wheel, the numbers of teeth are 12, 15, 17, 20, 24, and 28.</p><p>How many different gear ratios can be used on this bicycle?</p>", "image": "images/q-8afb9feba9.jpg", "options": ["8", "9", "10", "11", "12"], "correct": 3, "src": "CRIT34", "orig": "images/q-8afb9feba9.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего пар: 2 · 6 = 12. Ищем одинаковые отношения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>40</span><span>20</span></span> = <span class=\"fr\"><span>48</span><span>24</span></span> = 2 — совпадают.</li><li>Других совпадений нет.</li><li>12 − 1 = 11. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — не учли совпадение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократите каждую дробь.</div></div>"}, {"id": 22, "topic": "FLAW", "text": "<p>Several social media platforms have introduced \"well-being\" features, such as screen time reminders and automatic app locks after a certain usage period. Platform executives claim these tools demonstrate their commitment to users' mental health. However, these features are often buried in menus, easy to disable, and rarely used. Despite this, companies continue to promote their mental health features in public campaigns.</p><p>Which of the following best identifies the flaw in the platforms' argument?</p>", "image": "", "options": ["People can still use social media outside the app.", "The features are difficult for some users to find.", "Making a feature available does not guarantee it is effective.", "Most users are not aware of mental health tools.", "Companies should not be responsible for user behaviour."], "correct": 2, "src": "CRIT34", "orig": "images/q-d831828f86.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Функции есть, но ими почти не пользуются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наличие функции не значит, что она работает. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в crit-8.</div></div>"}, {"id": 23, "topic": "ASM", "text": "<p>Some employers have introduced mandatory \"email-free hours\" during the workday to increase productivity. They argue that constant email checking reduces focus and increases stress. They claim employees get more meaningful work done when not interrupted by messages. However, some workers feel disconnected and worry about missing urgent updates.</p><p>Which of the following is an assumption made by employers promoting email-free hours?</p>", "image": "", "options": ["Emails rarely contain urgent information.", "Employees prefer to work without digital interruptions.", "Productivity increases when workers can concentrate without distractions.", "Most workplace stress is caused by emails.", "Email checking habits are the same across industries."], "correct": 2, "src": "CRIT34", "orig": "images/q-82ed5b6ba5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работодатели: без почты — больше работы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: без отвлечений продуктивность растёт. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в crit-8.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p>The codenames for Chinese spies involve a colour (red, orange, green, blue, black, white or gold) followed by an animal from the horoscope (dragon, snake, horse, sheep, monkey, rooster, dog. pig, rat, ox, tiger or rabbit), e.g. green dog.</p><p>Sometimes documents are published with text black-out so that the reader is not supposed to be able to read one or more words.</p><p>Clearly a spy is mentioned in the following extract from a declassified CIA report, which uses a fixed-with font:</p><p>What sort of animal was in the codename of the spy in question?</p><p>the reference to an ████████ was found in a notebook obtained when the suspect was detained. Three ████ people were...</p>", "image": "", "options": ["Sheep", "Rooster", "Pig", "Ox", "Rabbit"], "correct": 3, "src": "CRIT34", "orig": "images/q-0378832af4.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перед закрытым словом стоит «an» — значит, слово начинается с гласной.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Из цветов с гласной начинается только orange.</li><li>Короткая длина затёртого фрагмента подходит к «orange ox». Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные животные дают более длинное слово.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Артикль «an» — подсказка.</div></div>"}, {"id": 25, "topic": "STR", "text": "<p>A non-profit organisation runs a program let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  function draw() {

    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
