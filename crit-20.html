<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q19 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем ожидаемую прибыль.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бурить: −72 000 + 0,8 · 400 000 + 0,1 · 3 800 000 = 628 000.</li><li>Не бурить: 0,2 · 1 000 000 + 0,6 · 500 000 = 500 000.</li><li>Бурить выгоднее. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное сравнение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ожидаемое значение = Σ прибыль × вероятность.</div></div>"}, {"id": 2, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q20 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q02.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя находка — 80%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Продажа за ≥ 500 000 $: 20% + 60% = 80%.</li><li>Одинаково. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное сложение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте подходящие исходы.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q21 · Problem solving</p>", "image": "images/ct-pp/ct041_q03.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 5, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Расходы Y-Oil: 500 000 + 800 000 = 1,3 млн.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Средняя находка (1,2 млн) — убыток (1); прибыль только при большой (2).</li><li>Бурение на 25% дешевле → 1,1 млн < 1,2 млн → средняя даст прибыль (3). Ответ F.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пропускают пункт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте каждый пункт расчётом.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q22 · Problem solving</p>", "image": "images/ct-pp/ct041_q04.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ожидаемая цена разлива: 0,03 · 10 млн = 300 000.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не бурить: 500 000.</li><li>Бурить со страховкой: 628 000 − 200 000 = 428 000.</li><li>Без страховки: 628 000 − 300 000 = 328 000.</li><li>Порядок 3, 1, 2. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот порядок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте ожидаемые потери.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct041_q05.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вливаем 90 мл (45 масла) в смесь <span class=\"fr\"><span>2</span><span>3</span></span> (120 масла).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Получаем 270 мл, масла 165.</li><li>Забираем 90 мл = треть → 55 мл масла.</li><li>Малая: 45 + 55 = 100; большая: 165 − 55 = 110. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли пропорцию.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Забранная часть — с той же долей масла.</div></div>"}, {"id": 6, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q26 · Main conclusion</p>", "image": "images/ct-pp/ct041_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Быстрое обнаружение рядом + 10–20% из сотен миллиардов систем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главная мысль: пригодные для жизни планеты очень распространены. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — доводы или слишком узко.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Все доводы ведут к одному выводу.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q27 · Problem solving</p>", "image": "images/ct-pp/ct041_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три фигуры должны покрыть 12 клеток.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 × 3 с прямой фигурой оставляет 4 × 2 — нужны две одинаковые, а их по одной.</li><li>Другие варианты 4 × 3 и 6 × 2 тоже не работают. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — невозможные раскладки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте все формы прямоугольника.</div></div>"}, {"id": 8, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q28 · Flaw</p>", "image": "images/ct-pp/ct041_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для сравнения CO₂ на маршрут нужны: расстояние на тонну (1), CO₂ от сжигания (3), CO₂ от доставки топлива (4).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автобусы ездят по тем же маршрутам → недельное расстояние (2) не нужно. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 2 или пропускают нужное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одинаковое у обоих вариантов сокращается.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q29 · Problem solving</p>", "image": "images/ct-pp/ct041_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Клэр вышла на 20 мин позже — её обогнали на 3 км раньше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чарльз там на <span class=\"fr\"><span>3</span><span>v</span></span> ч раньше; Клэр (6 км/ч) — на 30 мин раньше.</li><li><span class=\"fr\"><span>3</span><span>v</span></span> + <span class=\"fr\"><span>1</span><span>3</span></span> = <span class=\"fr\"><span>1</span><span>2</span></span> → <span class=\"fr\"><span>3</span><span>v</span></span> = <span class=\"fr\"><span>1</span><span>6</span></span> → v = 18 км/ч. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка уравнения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте моменты в одной точке.</div></div>"}, {"id": 10, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q30 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q10.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стерильные нейтрино объяснили бы быстрые пульсары.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Другие причины не исключены → они могли бы быть причиной. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Could» безопаснее, чем «is».</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct041_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вид из X: 2, 1, 3, 3, 2, 1 → внешние стопки = 6 цилиндров.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Остальные 14 — в 6 средних стопках по 1–3.</li><li>В виде C средний ряд высотой 1 → 2 стопки по 1, остальные 4 по 3.</li><li>Тогда внешние ряды показали бы 3, а C показывает 2. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие виды возможны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите противоречие в подсчёте.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct041_q12.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5,26 приёма × 1500 пациентов : 250 дней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>≈ 31,6 → около 32 в день. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте делить на рабочие дни.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q33 · Problem solving</p>", "image": "images/ct-pp/ct041_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доля медсестёр: <span class=\"fr\"><span>0,8</span><span>3,90</span></span> ≈ 20,5% (1995), <span class=\"fr\"><span>1,8</span><span>5,26</span></span> ≈ 34,2% (2006).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>34,2 : 20,5 ≈ 1,67 → +67%. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — разница процентных пунктов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рост доли, а не пунктов.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q34 · Problem solving</p>", "image": "images/ct-pp/ct041_q14.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2006, 20–29 лет: женщины ≈ 5,6, мужчины ≈ 2,2 → ≈ 2,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С возрастом линии сходятся (≈ 1). Это график C. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не та форма.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте начало и конец графика.</div></div>"}, {"id": 15, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2011 · original Q35 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q15.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Опросы меряют возрастные группы, а не одних и тех же людей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>То, что все стали на 11 лет старше, не меняет частоту в группе. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — путают группу с людьми.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Срез ≠ наблюдение за одними людьми.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct041_q16.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">10% населения = 862 871, 20% площади = 5263 км².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Далтон: 793 845 (9,2%) на 5448 км² (20,7%). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не то соотношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте обе доли.</div></div>"}, {"id": 17, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q2 · Main conclusion</p>", "image": "images/ct-pp/ct041_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доводы ведут к рекомендации.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Светлокожих надо добавить в список для витамина D. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация = вывод.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct041_q18.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 5, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Узоры на 6 плитках: 6, 7, 6, 5, 6 = 30.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На пяти плитках 25 → по 5 каждого.</li><li>Убранная плитка: 1 пусто, 2 клетка, 1 полосы, 0 точек, 1 чёрный. Это F. Ответ F.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не тот набор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Лишнее = всё − нужное.</div></div>"}, {"id": 19, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q4 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q19.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доп. спрос на электромобили — из ископаемого топлива, пока нет новых АЭС.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, пока нельзя заряжать их без доп. CO₂. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — выбросы бензиновых машин не сравнивали.</li><li>Другие — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не сравнивайте то, что не сравнивали в тексте.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct041_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сад 18 · 12 = 216 м²; клумбы 106 м².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дорожки и патио: 110 м².</li><li>Плитка 0,25 м² → 110 : 0,25 = 440. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите всё, что не мостят.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q6 · Flaw</p>", "image": "images/ct-pp/ct041_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исследование показывает только связь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод «обсуждение поможет читать» — причина и следствие. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct041_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вокруг шестиугольника 6 квадратов и 6 треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Квадрат делят 2 шестиугольника, треугольник — 3.</li><li>На шестиугольник: 3 квадрата, 2 треугольника → 1 : 2 : 3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли общие фигуры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на число соседей.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct041_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Организация 4: 3 случая на 41 981 пациенто-день.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 : 41 981 · 100 000 ≈ 7,15. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — один год.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложите оба года.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct041_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего в 2009: 69 случаев; у организации 3 — 26.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>26 : 69 ≈ 38%. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доля от всех случаев.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q10 · Problem solving</p>", "image": "images/ct-pp/ct041_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">16 163 пациенто-дня за 11 месяцев.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>За год ≈ 16 163 · <span class=\"fr\"><span>12</span><span>11</span></span> ≈ 17 632.</li><li>1 случай → 100 000 : 17 632 ≈ 5,67. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не пересчитали на год.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приводите к 12 месяцам.</div></div>"}, {"id": 26, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q11 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Таблица смешивает типы больниц.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ни A–D нельзя надёжно вывести. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — нужны данные по типам.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нет нужной разбивки — нет вывода.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct041_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первый автобус в четверг: 09:15 → 10:05.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чтобы успеть до 17:00 — автобус 15:20 (прибытие 16:10).</li><li>10:05 → 15:20 = 5 ч 15 мин. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот рейс.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смотрите расписание нужного дня.</div></div>"}, {"id": 28, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q13 · Drawing a conclusion</p>", "image": "images/ct-pp/ct041_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Погода совпадает с эффектом таяния льда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Другие причины не исключены → лишь могло быть причиной. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — слишком уверенно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Совпадение ≠ доказательство.</div></div>"}, {"id": 29, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q14 · Problem solving</p>", "image": "images/ct-pp/ct041_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем развёртку: пары напротив.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Горизонтальная — вертикальная полоса, треугольник — круг, крест — чёрная точка.</li><li>Исключаем кубы с парой напротив вместе или не той ориентацией. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — нарушают пары.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала пары напротив.</div></div>"}, {"id": 30, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2012 · original Q15 · Weaken</p>", "image": "images/ct-pp/ct041_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: спреи вредят здоровью детей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если доза слишком мала для эффекта — вреда нет. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не опровергают вред.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабитель отрицает механизм.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
