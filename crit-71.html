<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "Many universities now record their lectures and put them online. Some lecturers worry that students will then stop coming to lectures. Yet attendance at universities that record their lectures has hardly changed, and students say they use the recordings mainly to revise difficult material or to catch up when they are ill. Recording lectures therefore helps students to learn without harming attendance, so universities that do not yet record their lectures should begin to do so. The cost of the equipment is small compared with the benefit to students who would otherwise miss important material.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Attendance has hardly changed at universities that record their lectures.", "Students mainly use recorded lectures to revise difficult material.", "The cost of recording equipment is small.", "Universities that do not yet record their lectures should start doing so.", "Recording lectures helps students to learn without harming attendance."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Запись помогает и не вредит посещаемости → стоит записывать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: университетам без записи стоит начать. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — промежуточный вывод.</li><li>A, B, C — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «So … should» — вывод.</div></div>"}, {"id": 2, "topic": "PS", "text": "Three companies hire out cars:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Company</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Charges</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">P</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£40 per day, unlimited distance</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Q</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£25 per day; the first 100 km each day are free, then 20p per km</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">R</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£150 for any period up to 7 days, plus 10p for every km driven</td></tr></table>Saule needs a car for 4 days and will drive 150 km each day.<br><br><b>What is the least she can pay?</b>", "options": ["£140", "£160", "£180", "£200", "£210"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4 дня по 150 км = 600 км.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P: 4 · 40 = 160 £.</li><li>Q: 4 · 25 + 4 · 50 · 0,20 = 100 + 40 = 140 £.</li><li>R: 150 + 60 = 210 £. Минимум 140 £. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — тариф P.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте все варианты.</div></div>"}, {"id": 3, "topic": "MC", "text": "The common claim that cities are bad for the environment is mistaken. It is true that cities produce a large share of a country's pollution, but that is because most people live in them. Per person, city dwellers usually use less energy than people in the countryside: they live in smaller homes that share walls, they drive less, and they can reach shops and services on foot or by public transport. If the same number of people were spread out across the countryside, their total energy use would almost certainly be higher.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Contrary to a common claim, cities are not bad for the environment.", "Cities produce a large share of a country's pollution.", "City dwellers use less energy per person than people in the countryside.", "Public transport reduces the amount of energy people use.", "People should move from the countryside into cities."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тезис: распространённое мнение ошибочно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Города не вредны для природы, вопреки расхожему мнению. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — доводы.</li><li>B — уступка.</li><li>E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Первое предложение — вывод.</div></div>"}, {"id": 4, "topic": "PS", "text": "The pages of a book are numbered 1, 2, 3, … Printing all the page numbers used 192 digits in total.<br><br><b>How many pages does the book have?</b>", "options": ["64", "96", "99", "100", "192"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1–9: 9 цифр; 10–99: 180 цифр → всего 189.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осталось 3 цифры → страница 100.</li><li>100 страниц. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 189 цифр.</li><li>B — 192 : 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте по разрядам.</div></div>"}, {"id": 5, "topic": "CON", "text": "A survey of 500 secondary-school students found that those who slept for fewer than seven hours a night were twice as likely to say they often felt anxious as those who slept for more than eight hours. The students who slept less were also much more likely to use their phones in bed.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Among these students there is a link between short sleep and anxiety, but the survey does not show which, if either, causes the other.", "Using a phone in bed causes anxiety.", "Most secondary-school students sleep for fewer than seven hours a night.", "Anxiety causes students to sleep less.", "Students should sleep for at least eight hours a night."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корреляция сна и тревоги; телефоны — возможный третий фактор.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Есть связь, но причину по этим данным не установить. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — причинность не доказана.</li><li>C, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция без причины.</div></div>"}, {"id": 6, "topic": "PS", "text": "A shop buys jackets for £40 each and sells them at a price 50% higher. In a sale, it reduces the selling price by 30%.<br><br><b>What profit or loss does the shop make on each jacket it sells in the sale?</b>", "options": ["A loss of £8", "A loss of £2", "No profit or loss", "A profit of £2", "A profit of £8"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена 40 · 1,5 = 60 £; скидка 30% → 42 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>42 − 40 = 2 £ прибыли. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 50 − 30 = 20% от 40.</li><li>C — проценты «взаимоуничтожились».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проценты от разных баз.</div></div>"}, {"id": 7, "topic": "CON", "text": "Every student on the school's maths olympiad team has passed the advanced algebra course. Nobody who passed the advanced algebra course failed the basic geometry course. Some students who failed the basic geometry course are on the chess team.<br><br><b>Which one of the following must be true?</b>", "options": ["Some members of the maths olympiad team failed basic geometry.", "No member of the chess team is on the maths olympiad team.", "Some members of the chess team are not on the maths olympiad team.", "Every student who passed advanced algebra is on the maths olympiad team.", "Every member of the chess team failed basic geometry."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Олимпиада ⊂ алгебра; сдавшие алгебру не провалили геометрию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Кто провалил геометрию — не в олимпиадной команде.</li><li>Часть шахматистов провалила → они не в олимпиаде. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — слишком сильно.</li><li>A — противоречит.</li><li>D — обращение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка «все — никто — некоторые».</div></div>"}, {"id": 8, "topic": "PS", "text": "Aigerim's lessons finish at 15:30 on weekdays, and it then takes her 20 minutes to reach the library. She has no lessons at the weekend. She wants to study there for at least 2 hours without a break. The library's opening hours are:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Mon</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Tue</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Wed</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Thu</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Fri</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Sat</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Sun</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:00–17:00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:00–19:00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12:00–20:00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:00–17:00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:00–18:00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10:00–14:00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Closed</td></tr></table><br><br><b>On how many days of the week can she do this?</b>", "options": ["2", "3", "4", "5", "6"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В будни приходит в 15:50 → нужно открыто до 17:50.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вт (19:00), Ср (20:00), Пт (18:00) — да; Пн, Чт (17:00) — нет.</li><li>Сб 10:00–14:00 — да; Вс закрыто. Итого 4. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли субботу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выходные — без уроков.</div></div>"}, {"id": 9, "topic": "ASM", "text": "Many young people in our city cannot afford to buy a home. The council plans to solve this problem by building 2,000 new flats over the next five years. Since there are currently about 2,000 young people on the council's housing waiting list, the shortage of homes for young people will soon be over.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Other cities have similar waiting lists.", "Young people would rather live in flats than in houses.", "The new flats will be affordable for, and offered to, the young people on the waiting list.", "The council has not built flats before.", "The population of the city is falling."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2000 квартир = 2000 человек в очереди → проблема решена.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: квартиры доступны по цене и достанутся именно им. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квартиры именно для них?</div></div>"}, {"id": 10, "topic": "PS", "text": "Ainur and Berik walk towards each other along a road between two towns 18 km apart. Ainur walks at 5 km/h and leaves at 09:00. Berik walks at 4 km/h and leaves at 09:36.<br><br><b>At what time do they meet?</b>", "options": ["10:36", "11:16", "11:30", "11:40", "12:00"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">До 9:36 Айнур прошла 3 км.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осталось 15 км, сближение 9 км/ч → 1 ч 40 мин.</li><li>9:36 + 1:40 = 11:16. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — старт одновременно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала фора, потом сближение.</div></div>"}, {"id": 11, "topic": "ASM", "text": "Our new advertising campaign has increased the number of visitors to our online shop by 50%. Since all our sales are made through the website, our sales will rise by about 50% as well.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The new visitors are about as likely to buy something as the visitors who came before the campaign.", "Most of the shop's sales are made in the evening.", "The website is easy to use.", "The advertising campaign was cheap.", "Competitors have not started similar campaigns."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Посетителей +50% → продаж +50%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: новые посетители покупают так же часто, как старые. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Конверсия та же?</div></div>"}, {"id": 12, "topic": "PS", "text": "Three different books are to be given to two children, Aru and Bek. Each book goes to one child, and each child must receive at least one book.<br><br><b>In how many different ways can this be done?</b>", "options": ["3", "6", "8", "9", "12"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждая из 3 книг — одному из 2 детей: 2³ = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минус 2 случая «всё одному» → 6. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли условие «хотя бы одна».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите запрещённые случаи.</div></div>"}, {"id": 13, "topic": "ASM", "text": "Teenagers today spend much less time reading books than teenagers did thirty years ago. This is worrying, because reading books develops the ability to concentrate for long periods.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Teenagers thirty years ago enjoyed reading more than teenagers today.", "Teenagers today read more on screens than on paper.", "Teenagers today are not developing the ability to concentrate for long periods in other ways.", "Books today are shorter than books were thirty years ago.", "The ability to concentrate is more important than any other skill."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Меньше читают → это тревожно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: концентрацию не развивают другим способом. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> А если есть замена?</div></div>"}, {"id": 14, "topic": "PS", "text": "A rope 200 cm long is cut into pieces 30 cm long. 200 ÷ 30 = 6.67, so 6 pieces can be cut.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["Fifty eggs are packed into boxes of 6. 50 ÷ 6 = 8.33, so 9 boxes are needed.", "A shelf 100 cm long holds books 4 cm wide. 100 ÷ 4 = 25, so 25 books fit.", "A bus holds 40 people. 130 ÷ 40 = 3.25, so 4 buses are needed for 130 people.", "Tickets cost £8 each. 50 ÷ 8 = 6.25, so 6 tickets can be bought with £50.", "Six pieces of rope 30 cm long use 6 × 30 = 180 cm of rope."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Деление и округление вниз.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: 50 : 8 = 6,25 → 6 билетов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — округление вверх.</li><li>B — без остатка.</li><li>E — умножение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Целое число «влезает».</div></div>"}, {"id": 15, "topic": "WKN", "text": "In a trial, patients with back pain who were given a new drug reported much less pain after two weeks than before they started taking it. The manufacturer claims that the drug is effective at relieving back pain.<br><br><b>Which one of the following, if true, would most weaken the manufacturer's claim?</b>", "options": ["Some of the patients in the trial reported mild headaches.", "The trial lasted for only two weeks.", "The drug is also used to treat other kinds of pain.", "The new drug is more expensive than other painkillers.", "Most back pain gets better on its own within two weeks, whether or not it is treated."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через 2 недели болит меньше → лекарство работает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если боль в спине обычно проходит сама за 2 недели — эффект не доказан. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — не по сути.</li><li>B — слабее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нет контрольной группы.</div></div>"}, {"id": 16, "topic": "PS", "text": "A ferry timetable is as follows:<br>• Monday to Friday: every 90 minutes from 06:30 until 21:30 (the last departure).<br>• Saturday: every 2 hours from 08:00 until 20:00.<br>• Sunday: at 10:00, 14:00 and 18:00 only.<br><br><b>How many times does the ferry depart in a full week?</b>", "options": ["55", "62", "63", "65", "70"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пн–Пт: с 6:30 до 21:30 каждые 90 мин → 11 рейсов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 11 = 55; Сб: 8:00–20:00 каждые 2 ч → 7; Вс → 3.</li><li>55 + 7 + 3 = 65. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только будни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Интервалов на 1 меньше, чем рейсов.</div></div>"}, {"id": 17, "topic": "STR", "text": "Since the school started serving free breakfasts, pupils' test results have improved. The head teacher believes that this is because the breakfasts help pupils to concentrate in morning lessons.<br><br><b>Which one of the following, if true, would most strengthen the head teacher's explanation?</b>", "options": ["The breakfasts are popular with pupils.", "The school appointed several new teachers in the same year.", "The improvement has been mainly in subjects taught in the morning rather than those taught in the afternoon.", "Parents approve of the free breakfasts.", "Several other schools also serve free breakfasts."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Завтраки → концентрация на утренних уроках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если улучшились именно утренние предметы — объяснение подтверждается. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — альтернативная причина.</li><li>A, D, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте механизм.</div></div>"}, {"id": 18, "topic": "PS", "text": "Four houses stand in a row, numbered 1 to 4 from left to right. They are painted red, blue, green and yellow, one colour each.<br>• The red house is next to the blue house, and has a lower number.<br>• The green house is at one end of the row.<br>• The yellow house is not next to the green house, and has a lower number than the green house.<br>• The blue house is not at an end of the row.<br><br><b>What colour is house number 3?</b>", "options": ["Red", "Blue", "Green", "Yellow", "It cannot be determined"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Зелёный на краю и выше жёлтого → зелёный 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Жёлтый не рядом с зелёным → 1 или 2; синий не на краю → 2 или 3.</li><li>Красный сразу левее синего: жёлтый 1, красный 2, синий 3. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Жёлтый 2 — красному нет места.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебор от фиксированного.</div></div>"}, {"id": 19, "topic": "WKN", "text": "Over the last decade, the number of people diagnosed with allergies has increased greatly. This shows that people today are more likely to develop allergies than people in the past.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["The number of doctors in the country has increased slightly.", "Allergies are more common in cities than in the countryside.", "Doctors are now much better at recognising allergies, and more people see a doctor about minor symptoms.", "Some allergies are much more serious than others.", "Many allergies first appear in childhood."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагнозов больше → люди чаще болеют.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если врачи лучше распознают аллергию и больше людей обращаются — рост может быть кажущимся. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про причину роста.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Больше выявляют ≠ больше болеют.</div></div>"}, {"id": 20, "topic": "PS", "text": "A runner runs the first 6 km of a 10 km race at an average pace of 6 minutes per kilometre, and the last 4 km at 5 minutes per kilometre.<br><br><b>What is her average pace for the whole race?</b>", "options": ["5 min 30 s per km", "5 min 36 s per km", "5 min 40 s per km", "5 min 50 s per km", "6 min per km"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время: 6 · 6 + 4 · 5 = 56 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>56 : 10 = 5,6 мин = 5 мин 36 с на км. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — простое среднее темпов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее — по общему времени.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "This brand of trainers must be the best on the market, because it is the best-selling brand in the country.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not explain what is meant by 'trainers'.", "It assumes that everyone wears trainers.", "It does not say how many pairs of trainers were sold.", "It ignores trainers sold in other countries.", "It assumes that the product that sells most must be the best, when sales may depend on other things such as price or advertising."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Самый продаваемый → лучший.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Продажи зависят и от цены, рекламы и т. п. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Популярное ≠ лучшее.</div></div>"}, {"id": 22, "topic": "PS", "text": "A swimming pool is 25 m long and 10 m wide. Its depth increases steadily from 1 m at the shallow end to 2 m at the deep end. 1 m³ = 1,000 litres.<br><br><b>How many litres of water does the full pool hold?</b>", "options": ["3,750", "37,500", "250,000", "375,000", "500,000"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя глубина 1,5 м.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>25 · 10 · 1,5 = 375 м³ = 375 000 л. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — ошибка в единицах.</li><li>E — глубина 2 м везде.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Равномерный уклон → среднее.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "Every player in our team is among the best in the league, so our team must be the best team in the league.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not say how many players there are in the team.", "It assumes that the league is very competitive.", "It ignores the possibility that other teams also have good players.", "It relies on the opinion of the team's supporters.", "It assumes that what is true of each member of a group must be true of the group as a whole."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый игрок лучший → команда лучшая.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Свойство частей перенесено на целое. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — возможно, но не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Части ≠ целое.</div></div>"}, {"id": 24, "topic": "PS", "text": "A train leaves every 12 minutes, the first at 06:00. The 10th train leaves 9 × 12 = 108 minutes after the first, at 07:48.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A clock strikes once every hour, so in 8 hours it strikes 8 times.", "A path 28 m long divided into 4 m sections has 28 ÷ 4 = 7 sections.", "A lesson starts at 09:00 and lasts 45 minutes, so it ends at 09:45.", "Eight lengths of cable, each 4 m long, contain 8 × 4 = 32 m of cable.", "Trees are planted every 4 m along a path, the first at the start. The 8th tree is 7 × 4 = 28 m from the start."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n-й элемент — через (n − 1) интервалов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: 8-е дерево — через 7 · 4 = 28 м. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — другой метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Интервалов на 1 меньше.</div></div>"}, {"id": 25, "topic": "FLAW", "text": "If we allow students to use calculators in maths lessons, they will stop learning their times tables. Then they will be unable to do basic arithmetic, and eventually they will be unable to manage their own money. So calculators should be banned from maths lessons.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes, without good reason, that one small change will inevitably lead to a series of increasingly serious consequences.", "It assumes that managing money requires a calculator.", "It does not say which kind of calculator is used.", "It assumes that calculators are expensive.", "It ignores the fact that some students prefer to use calculators."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Калькулятор → … → неспособность управлять деньгами.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>«Скользкая дорожка» без оснований. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка без доказательств.</div></div>"}, {"id": 26, "topic": "PS", "text": "Aliya is 4 years older than her brother. In 6 years' time, the sum of their ages will be 40.<br><br><b>How old is Aliya now?</b>", "options": ["14", "16", "18", "20", "22"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через 6 лет сумма 40 → сейчас 28.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a + (a − 4) = 28 → a = 16. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — сумма без вычета 12.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждому +6 → сумма +12.</div></div>"}, {"id": 27, "topic": "PAR", "text": "All the members of the orchestra can read music. None of the people who can read music failed the entrance test. So none of the members of the orchestra failed the entrance test.<br><br><b>Which one of the following most closely parallels the reasoning in the above argument?</b>", "options": ["Some books are long. All long books are expensive. So some books are expensive.", "All cats are mammals. Some mammals can swim. So some cats can swim.", "All good students do their homework. Bota does her homework. So Bota is a good student.", "No fish is a mammal. All whales are mammals. So no whale is a fish.", "All the cakes in this shop contain sugar. No food that contains sugar is allowed on Dana's diet. So no cake from this shop is allowed on her diet."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все A — B; ни один B не C → ни один A не C.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: все торты с сахаром; сахар запрещён → ни один торт не разрешён. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — та же форма, но другая структура посылок.</li><li>A, B, C — другие структуры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте буквы.</div></div>"}, {"id": 28, "topic": "PS", "text": "A bank exchanges currency at these rates:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\"></th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Bank buys US$</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Bank sells US$</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Rate per $1</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">470 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">480 ₸</td></tr></table>It also charges a fee of 960 ₸ for each exchange, which is taken from the amount being exchanged. Daulet gives the bank 96,960 ₸ to change into dollars.<br><br><b>How many dollars does he receive?</b>", "options": ["$198", "$200", "$202", "$204", "$206"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Комиссия 960 ₸ берётся из суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>96 960 − 960 = 96 000 ₸.</li><li>Банк продаёт доллары по 480: 96 000 : 480 = 200 $. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — курс покупки 470.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Клиент покупает → курс продажи банка.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "It is wrong for a shop to keep the extra money when a customer pays too much by mistake, even if the customer never notices, because the shop has done nothing to earn that money.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["If a cash machine gives you 5,000 ₸ more than you asked for, you should return the extra money to the bank.", "A person who finds money in the street may keep it if nobody claims it.", "A customer who breaks an item in a shop should pay for it.", "Someone who works extra hours should be paid for them.", "A shop should give discounts to its regular customers."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нельзя оставлять деньги, которых не заработал, даже если никто не заметит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: банкомат выдал лишнее — верните. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — противоположно.</li><li>C, D, E — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Незаработанное — вернуть.</div></div>"}, {"id": 30, "topic": "PS", "text": "A rectangular floor 5.5 m by 4 m is to be covered with square carpet tiles measuring 50 cm by 50 cm. Tiles are sold in boxes of 10, and they will not need to be cut.<br><br><b>How many boxes of tiles are needed?</b>", "options": ["8", "9", "10", "22", "88"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5,5 м = 11 плиток, 4 м = 8 плиток.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>11 · 8 = 88 плиток → 9 коробок. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — плитки, а не коробки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коробки — вверх.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<style id="prepline-gate-css">
  #pl-gate{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;
           background:rgba(12,14,17,.78);backdrop-filter:blur(4px);padding:20px}

  #pl-gate .box{max-width:420px;width:100%;background:#1D2127;border:1px solid rgba(255,255,255,.14);
