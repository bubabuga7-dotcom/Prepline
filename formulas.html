  {n:'Volume of a hemisphere', f:'<i>V</i> = {2|3}π<i>r</i>³', t:['<i>V</i> = {4|3}π<i>r</i>³','<i>V</i> = 2π<i>r</i>²','<i>V</i> = {1|3}π<i>r</i>³']},
  {n:'Surface area of a sphere', f:'<i>S</i> = 4π<i>r</i>²', t:['<i>S</i> = {4|3}π<i>r</i>³','<i>S</i> = 2π<i>r</i>²','<i>S</i> = π<i>r</i>²']},
  {n:'Volume of a pyramid', f:'<i>V</i> = ⅓ × base area × height', t:['<i>V</i> = base area × height','<i>V</i> = ½ × base area × height','<i>V</i> = ⅓ × base perimeter × height']},
  {n:'Volume of a prism', f:'<i>V</i> = area of cross-section × length', t:['<i>V</i> = ½ × area of cross-section × length','<i>V</i> = perimeter of cross-section × length','<i>V</i> = ⅓ × area of cross-section × length']},
  {n:'Curved surface area of a cylinder', f:'<i>S</i> = 2π<i>rh</i>', t:['<i>S</i> = π<i>r</i>²<i>h</i>','<i>S</i> = π<i>rh</i>','<i>S</i> = 2π<i>r</i>²<i>h</i>']},
  {n:'Curved surface area of a cone (l is the slant height)', f:'<i>S</i> = π<i>rl</i>', t:['<i>S</i> = π<i>r</i>²<i>l</i>','<i>S</i> = 2π<i>rl</i>','<i>S</i> = ⅓π<i>rl</i>']}
 ]],
 ['Coordinates', [
  {n:'Gradient of the line through (x₁, y₁) and (x₂, y₂)', f:'<i>m</i> = {<i>y</i>₂ − <i>y</i>₁|<i>x</i>₂ − <i>x</i>₁}', t:['<i>m</i> = {<i>x</i>₂ − <i>x</i>₁|<i>y</i>₂ − <i>y</i>₁}','<i>m</i> = {<i>y</i>₂ + <i>y</i>₁|<i>x</i>₂ + <i>x</i>₁}','<i>m</i> = {<i>y</i>₂ − <i>y</i>₁|<i>x</i>₁ − <i>x</i>₂}'], s:'Rise over run: change in y over change in x, in the same order.'},
  {n:'Midpoint of (x₁, y₁) and (x₂, y₂)', f:'({<i>x</i>₁ + <i>x</i>₂|2}, {<i>y</i>₁ + <i>y</i>₂|2})', t:['({<i>x</i>₂ − <i>x</i>₁|2}, {<i>y</i>₂ − <i>y</i>₁|2})','(<i>x</i>₁ + <i>x</i>₂, <i>y</i>₁ + <i>y</i>₂)','({<i>x</i>₁ + <i>y</i>₁|2}, {<i>x</i>₂ + <i>y</i>₂|2})']},
  {n:'Distance between (x₁, y₁) and (x₂, y₂)', f:'<i>d</i> = sqrt{(<i>x</i>₂ − <i>x</i>₁)² + (<i>y</i>₂ − <i>y</i>₁)²}', t:['<i>d</i> = (<i>x</i>₂ − <i>x</i>₁)² + (<i>y</i>₂ − <i>y</i>₁)²','<i>d</i> = (<i>x</i>₂ − <i>x</i>₁) + (<i>y</i>₂ − <i>y</i>₁)','<i>d</i> = sqrt{(<i>x</i>₂ + <i>x</i>₁)² + (<i>y</i>₂ + <i>y</i>₁)²}'], s:'Pythagoras on the horizontal and vertical differences.'},
  {n:'Line with gradient m through (x₁, y₁)', f:'<i>y</i> − <i>y</i>₁ = <i>m</i>(<i>x</i> − <i>x</i>₁)', t:['<i>y</i> + <i>y</i>₁ = <i>m</i>(<i>x</i> + <i>x</i>₁)','<i>x</i> − <i>x</i>₁ = <i>m</i>(<i>y</i> − <i>y</i>₁)','<i>y</i> − <i>y</i>₁ = <i>mx</i> − <i>x</i>₁']},
  {n:'Gradients of perpendicular lines', f:'<i>m</i>₁ × <i>m</i>₂ = −1', t:['<i>m</i>₁ = <i>m</i>₂','<i>m</i>₁ × <i>m</i>₂ = 1','<i>m</i>₁ + <i>m</i>₂ = 0'], s:'Parallel lines have equal gradients.'},
  {n:'Circle with centre (a, b) and radius r', f:'(<i>x</i> − <i>a</i>)² + (<i>y</i> − <i>b</i>)² = <i>r</i>²', t:['(<i>x</i> + <i>a</i>)² + (<i>y</i> + <i>b</i>)² = <i>r</i>²','(<i>x</i> − <i>a</i>)² + (<i>y</i> − <i>b</i>)² = <i>r</i>','(<i>x</i> − <i>a</i>)² − (<i>y</i> − <i>b</i>)² = <i>r</i>²']}
 ]],
 ['Trigonometry', [
  {n:'sin θ in a right-angled triangle', f:'sin θ = {opposite|hypotenuse}', t:['sin θ = {adjacent|hypotenuse}','sin θ = {opposite|adjacent}','sin θ = {hypotenuse|opposite}'], s:'SOH CAH TOA.'},
  {n:'cos θ in a right-angled triangle', f:'cos θ = {adjacent|hypotenuse}', t:['cos θ = {opposite|hypotenuse}','cos θ = {adjacent|opposite}','cos θ = {hypotenuse|adjacent}']},
  {n:'tan θ in a right-angled triangle', f:'tan θ = {opposite|adjacent}', t:['tan θ = {adjacent|opposite}','tan θ = {opposite|hypotenuse}','tan θ = {hypotenuse|adjacent}']},
  {n:'Pythagorean identity', q:'sin²θ + cos²θ =', f:'1', t:['0','tan²θ','2']},
  {n:'tan θ in terms of sin and cos', q:'tan θ =', f:'{sin θ|cos θ}', t:['{cos θ|sin θ}','sin θ × cos θ','1 − cos θ']},
  {n:'Sine rule', f:'{<i>a</i>|sin <i>A</i>} = {<i>b</i>|sin <i>B</i>} = {<i>c</i>|sin <i>C</i>}', t:['{<i>a</i>|sin <i>B</i>} = {<i>b</i>|sin <i>A</i>}','<i>a</i> sin <i>A</i> = <i>b</i> sin <i>B</i>','{<i>a</i>|cos <i>A</i>} = {<i>b</i>|cos <i>B</i>}']},
  {n:'Cosine rule', f:'<i>a</i>² = <i>b</i>² + <i>c</i>² − 2<i>bc</i> cos <i>A</i>', t:['<i>a</i>² = <i>b</i>² + <i>c</i>² + 2<i>bc</i> cos <i>A</i>','<i>a</i>² = <i>b</i>² + <i>c</i>² − 2<i>bc</i> sin <i>A</i>','<i>a</i>² = <i>b</i>² + <i>c</i>² − <i>bc</i> cos <i>A</i>'], s:'With A = 90°, cos A = 0 and it becomes Pythagoras.'},
  {n:'Exact value', q:'sin 30° =', f:'½', t:['{sqrt{3}|2}','{sqrt{2}|2}','1']},
  {n:'Exact value', q:'cos 30° =', f:'{sqrt{3}|2}', t:['½','{sqrt{2}|2}','sqrt{3}']},
  {n:'Exact value', q:'tan 45° =', f:'1', t:['{sqrt{2}|2}','sqrt{3}','0']},
  {n:'Exact value', q:'tan 60° =', f:'sqrt{3}', t:['{sqrt{3}|3}','{sqrt{3}|2}','1']}
 ]],
 ['Sequences', [
  {n:'n-th term of an arithmetic sequence', f:'<i>a</i>ₙ = <i>a</i> + (<i>n</i> − 1)<i>d</i>', t:['<i>a</i>ₙ = <i>a</i> + <i>nd</i>','<i>a</i>ₙ = <i>a</i> · <i>d</i>^{<i>n</i> − 1}','<i>a</i>ₙ = (<i>a</i> + <i>n</i>)<i>d</i>']},
  {n:'Sum of the first n terms of an arithmetic sequence', f:'<i>S</i>ₙ = {<i>n</i>|2}(2<i>a</i> + (<i>n</i> − 1)<i>d</i>)', t:['<i>S</i>ₙ = <i>n</i>(2<i>a</i> + (<i>n</i> − 1)<i>d</i>)','<i>S</i>ₙ = {<i>n</i>|2}(<i>a</i> + (<i>n</i> − 1)<i>d</i>)','<i>S</i>ₙ = {<i>n</i>|2}(2<i>a</i> + <i>nd</i>)'], s:'Same as n × (first + last) ÷ 2.'},
  {n:'n-th term of a geometric sequence', f:'<i>a</i>ₙ = <i>a</i> · <i>r</i>^{<i>n</i> − 1}', t:['<i>a</i>ₙ = <i>a</i> · <i>r</i>^{<i>n</i>}','<i>a</i>ₙ = <i>a</i> + (<i>n</i> − 1)<i>r</i>','<i>a</i>ₙ = (<i>ar</i>)^{<i>n</i> − 1}']},
  {n:'Sum 1 + 2 + 3 + … + n', f:'{<i>n</i>(<i>n</i> + 1)|2}', t:['<i>n</i>(<i>n</i> + 1)','{<i>n</i>(<i>n</i> − 1)|2}','{<i>n</i>²|2}']}
 ]],
 ['Probability and statistics', [
  {n:'Probability that A does not happen', f:'<i>P</i>(not <i>A</i>) = 1 − <i>P</i>(<i>A</i>)', t:['<i>P</i>(not <i>A</i>) = −<i>P</i>(<i>A</i>)','<i>P</i>(not <i>A</i>) = {1|<i>P</i>(<i>A</i>)}','<i>P</i>(not <i>A</i>) = <i>P</i>(<i>A</i>) − 1']},
  {n:'P(A and B) for independent events', f:'<i>P</i>(<i>A</i>) × <i>P</i>(<i>B</i>)', t:['<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>)','<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>) − 1','{<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>)|2}']},
  {n:'P(A or B) for events that cannot both happen', f:'<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>)', t:['<i>P</i>(<i>A</i>) × <i>P</i>(<i>B</i>)','<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>) − 1','1 − <i>P</i>(<i>A</i>)<i>P</i>(<i>B</i>)']},
  {n:'P(A or B) for any two events', f:'<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>) − <i>P</i>(<i>A</i> and <i>B</i>)', t:['<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>)','<i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>) + <i>P</i>(<i>A</i> and <i>B</i>)','<i>P</i>(<i>A</i>) × <i>P</i>(<i>B</i>)']},
  {n:'Expected number of times an outcome happens in n trials', f:'<i>n</i> × <i>P</i>', t:['{<i>n</i>|<i>P</i>}','<i>n</i> + <i>P</i>','{<i>P</i>|<i>n</i>}']},
  {n:'Mean of two groups together (sizes n₁, n₂; means x̄₁, x̄₂)', f:'{<i>n</i>₁<i>x̄</i>₁ + <i>n</i>₂<i>x̄</i>₂|<i>n</i>₁ + <i>n</i>₂}', t:['{<i>x̄</i>₁ + <i>x̄</i>₂|2}','{<i>x̄</i>₁ + <i>x̄</i>₂|<i>n</i>₁ + <i>n</i>₂}','<i>n</i>₁<i>x̄</i>₁ + <i>n</i>₂<i>x̄</i>₂'], s:'Only use the simple average when the groups are the same size.'},
  {n:'Ways to arrange n different objects in a row', f:'<i>n</i>!', t:['<i>n</i>²','2<i>n</i>','<i>n</i>(<i>n</i> − 1)']},
  {n:'Ways to choose r objects from n when the order does not matter', f:'{<i>n</i>!|<i>r</i>!(<i>n</i> − <i>r</i>)!}', t:['{<i>n</i>!|(<i>n</i> − <i>r</i>)!}','{<i>n</i>!|<i>r</i>!}','<i>n</i>^{<i>r</i>}'], s:'n!/(n − r)! counts ordered selections.'}
 ]]
];

/* ---------- typesetting ---------- */
function tex(s) {
  var prev;
  do { prev = s; s = s.replace(/sqrt\{([^{}]*)\}/g, '√<span class="rt"><span>$1</span></span>'); } while (s !== prev);
  do { prev = s; s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>'); } while (s !== prev);
  do { prev = s; s = s.replace(/\{([^{}|]*)\|([^{}]*)\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>'); } while (s !== prev);
  return '<span class="fx">' + s + '</span>';
}

var ALL = [];
G.forEach(function (g) { g[1].forEach(function (it, i) { it.g = g[0]; it.id = g[0] + ':' + i; ALL.push(it); }); });

/* ---------- views ---------- */
function $(id) { return document.getElementById(id); }
function view(v) {
  ['setup', 'run', 'sheet'].forEach(function (k) { $('v-' + k).classList.toggle('on', k === v); });
  [].forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === (v === 'run' ? 'setup' : v)); });
}
$('tabs').onclick = function (e) { var b = e.target.closest('button'); if (b) view(b.getAttribute('data-v')); };

/* setup */
var picked = {}; G.forEach(function (g) { picked[g[0]] = true; });
var count = 10;
function drawGroups() {
  $('groups').innerHTML = G.map(function (g) {
    return '<button class="chip' + (picked[g[0]] ? ' on' : '') + '" data-g="' + g[0] + '">' + g[0] + '<span>' + g[1].length + '</span></button>';
  }).join('');
}
$('groups').onclick = function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  var g = b.getAttribute('data-g');
  var on = Object.keys(picked).filter(function (k) { return picked[k]; });
  if (on.length === G.length) { Object.keys(picked).forEach(function (k) { picked[k] = false; }); picked[g] = true; } // first tap: only this topic
  else { picked[g] = !picked[g]; if (!Object.keys(picked).some(function (k) { return picked[k]; })) G.forEach(function (x) { picked[x[0]] = true; }); }
  drawGroups();
};
$('count').onclick = function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  count = +b.getAttribute('data-n');
  [].forEach.call($('count').children, function (x) { x.classList.toggle('on', x === b); });
};
function best() {
  try { var b = JSON.parse(localStorage.getItem('prepline:formula-best') || 'null'); if (b) $('best').textContent = 'Your best: ' + b.s + '/' + b.n + ' (' + Math.round(100 * b.s / b.n) + '%)'; } catch (e) {}
}

/* run */
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var run = null;
function makeQ(it) {
  var group = G.filter(function (g) { return g[0] === it.g; })[0][1];
  // "what does this formula give?" for items with a real name and unique formula (a third of the time)
  var canRev = !it.q && it.n !== 'Exact value' && group.filter(function (x) { return !x.q && x.n !== 'Exact value'; }).length >= 4;
  if (canRev && Math.random() < 0.33) {
    var others = shuffle(group.filter(function (x) { return x !== it && !x.q && x.n !== 'Exact value'; })).slice(0, 3);
    var opts = shuffle([it].concat(others));
    return { it: it, rev: true, opts: opts.map(function (x) { return x.n; }), ans: opts.indexOf(it) };
  }
  var o = shuffle([it.f].concat(shuffle(it.t.slice()).slice(0, 3)));
  return { it: it, rev: false, opts: o, ans: o.indexOf(it.f) };
}
function start() {
  var pool = ALL.filter(function (it) { return picked[it.g]; });
  pool = shuffle(pool.slice());
  if (count) pool = pool.slice(0, count);
  run = { qs: pool.map(makeQ), i: 0, ok: 0, miss: [], done: false };
  view('run'); show();
}
$('start').onclick = start;
function show() {
  var q = run.qs[run.i], it = q.it, n = run.qs.length;
  var L = 'ABCD';
  var prompt = q.rev ? 'What does this formula give?' + tex(it.f)
             : it.q ? tex(it.q) : 'Which is the formula for: ' + it.n.charAt(0).toLowerCase() + it.n.slice(1) + '?';
  $('card').innerHTML =
    '<div class="card-top"><span>Question <b>' + (run.i + 1) + '</b> of ' + n + '</span><span><b>' + run.ok + '</b> correct</span></div>' +
    '<div class="prog"><i style="width:' + (100 * run.i / n) + '%"></i></div>' +
    '<span class="gtag">' + it.g + '</span>' +
    '<div class="q-text">' + prompt + '</div>' +
    '<div class="opts' + (q.rev ? ' names' : '') + '">' + q.opts.map(function (o, k) {
      return '<button class="opt" data-k="' + k + '"><b>' + L[k] + '</b><span>' + (q.rev ? o : tex(o)) + '</span></button>';
    }).join('') + '</div>' +
    '<div class="res" id="res"></div>' +
    '<div class="actions"><button class="btn" id="nx" style="display:none">' + (run.i + 1 < n ? 'Next →' : 'See result') + '</button>' +
    '<span class="keys">A–D answer · Enter next</span></div>';
  $('card').querySelector('.opts').onclick = function (e) { var b = e.target.closest('.opt'); if (b) answer(+b.getAttribute('data-k')); };
  $('nx').onclick = next;
}
function answer(k) {
  var q = run.qs[run.i];
  if (q.picked !== undefined) return;
  q.picked = k;
  var btns = $('card').querySelectorAll('.opt');
  [].forEach.call(btns, function (b, j) { b.disabled = true; if (j === q.ans) b.classList.add('c'); else if (j === k) b.classList.add('u'); });
  var ok = k === q.ans, it = q.it;
  if (ok) run.ok++; else run.miss.push(it);
  var r = $('res');
  r.className = 'res ' + (ok ? 'ok' : 'no');
  r.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + (it.q ? tex(it.q) + ' ' : it.n + ': ') + tex(it.f) + (it.s ? '<br>' + it.s : '');
  $('nx').style.display = '';
  $('nx').focus();
}
function next() {
  run.i++;
  if (run.i < run.qs.length) { show(); return; }
  var n = run.qs.length, p = Math.round(100 * run.ok / n);
  try {
    var b = JSON.parse(localStorage.getItem('prepline:formula-best') || 'null');
    if (n >= 10 && (!b || run.ok / n > b.s / b.n)) localStorage.setItem('prepline:formula-best', JSON.stringify({ s: run.ok, n: n }));
  } catch (e) {}
  $('card').innerHTML =
    '<span class="gtag">Result</span><div class="big">' + run.ok + '/' + n + '</div>' +
    '<p class="muted">' + (p === 100 ? 'Every formula right.' : p >= 80 ? 'Strong. Learn the ones below and they are yours.' : 'Learn the formulas below, then try again.') + '</p>' +
    (run.miss.length ? '<div class="miss">' + run.miss.map(function (it) {
      return '<div class="row"><span>' + it.n + '</span>' + tex((it.q ? it.q + ' ' : '') + it.f) + '</div>';
    }).join('') + '</div>' : '') +
    '<div class="actions">' + (run.miss.length ? '<button class="btn" id="again-miss">Retry the ' + run.miss.length + ' missed</button>' : '') +
    '<button class="btn ghost" id="again">New quiz</button><button class="btn ghost" id="to-sheet">All formulas</button></div>';
  var m = $('again-miss');
  if (m) m.onclick = function () { var miss = run.miss.slice(); run = { qs: shuffle(miss).map(makeQ), i: 0, ok: 0, miss: [] }; show(); };
  $('again').onclick = function () { best(); view('setup'); };
  $('to-sheet').onclick = function () { view('sheet'); };
}
document.addEventListener('keydown', function (e) {
  if (!$('v-run').classList.contains('on') || !run || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var q = run.qs[run.i];
  var k = 'abcd'.indexOf(e.key.toLowerCase());
  if (k < 0 && /^[1-4]$/.test(e.key)) k = +e.key - 1;
  if (k >= 0 && q && q.picked === undefined && k < q.opts.length) { answer(k); e.preventDefault(); }
  else if (e.key === 'Enter' && q && q.picked !== undefined && document.activeElement !== $('nx')) { next(); e.preventDefault(); }
});

/* sheet */
function drawSheet() {
  var f = ($('find').value || '').trim().toLowerCase(), h = '';
  G.forEach(function (g) {
    var rows = g[1].filter(function (it) {
      if (!f) return true;
      return (it.n + ' ' + (it.q || '') + ' ' + it.f).replace(/<[^>]+>/g, '').toLowerCase().indexOf(f) >= 0 || g[0].toLowerCase().indexOf(f) >= 0;
    });
    if (!rows.length) return;
    h += '<div class="grp">' + g[0] + '</div>' + rows.map(function (it) {
      return '<div class="row"><div class="nm">' + it.n + (it.s ? '<small>' + it.s + '</small>' : '') + '</div><div>' + tex((it.q ? it.q + ' ' : '') + it.f) + '</div></div>';
    }).join('');
  });
  $('sheet').innerHTML = h || '<p class="muted">Nothing found.</p>';
}
$('find').oninput = drawSheet;

drawGroups(); best(); drawSheet();
if (location.hash === '#all') view('sheet');
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
