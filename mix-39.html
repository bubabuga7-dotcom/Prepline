<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m023_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в куб каждый множитель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>6</span><span>3</span></span>³ = 8.</li><li>(∛x)³ = x; y³; (z²)³ = z⁶.</li><li><span class=\"fr\"><span>8xy³</span><span>z⁶</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 6 и z⁴: забыли куб.</li><li>C, E — y² вместо y³.</li><li>D — 4 вместо 8.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (z²)³ = z⁶ — показатели перемножаются.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m023_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">70% = <span class=\"fr\"><span>7</span><span>10</span></span>, а 70 = 2 · 5 · 7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>70⁷⁰ = 2⁷⁰ · 5⁷⁰ · 7⁷⁰.</li><li>· <span class=\"fr\"><span>7</span><span>2 · 5</span></span> = 2⁶⁹ · 5⁶⁹ · 7⁷¹.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — делили не на 10 или не умножили на 7.</li><li>E — лишний раз поделили на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент = умножение на дробь.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m023_q03.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 5, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m · n³ = const.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 · (0,3)³ = 6 · 0,027 = 0,162.</li><li>n = 30 → n³ = 27 000.</li><li>m = <span class=\"fr\"><span>0,162</span><span>27</span></span> 000 = 6 · 10⁻⁶ = 0,6 · 10⁻⁵.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 6 · 10⁻⁵: ошибка на порядок.</li><li>Остальные — неверный расчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> n выросло в 100 раз → m уменьшилось в 100³ = 10⁶ раз.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m023_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный пеленг = пеленг ± 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Караганда от Экибастуза: 210°.</li><li>Экибастуз от Караганды: 210° − 180° = 030°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пытались использовать равнобедренный треугольник; здесь это лишние данные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не все данные в условии нужны.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m023_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем коэффициенты изменений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>−30% → × 0,7; +150% → × 2,5.</li><li>0,7 · 2,5 = 1,75 = <span class=\"fr\"><span>35</span><span>20</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — +150% понято как × 1,5.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Увеличили на 150%» = × 2,5.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m023_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратные действия в обратном порядке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y − 3 = (2x − 1)³.</li><li>2x − 1 = ∛(y − 3).</li><li>x = ∛<span class=\"fr\"><span>y − 3</span><span>2</span></span> + ½.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак у 3 и ½.</li><li>D, E — куб вместо корня.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последним действием было «+3» — снимаем его первым.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m023_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центры кругов — равносторонний треугольник со стороной 4; закрашено = треугольник − 3 сектора по 60°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Треугольник: <span class=\"fr\"><span>√3</span><span>4</span></span> · 16 = 4√3.</li><li>Три сектора 60° радиуса 2 = половина круга: ½ · 4π = 2π.</li><li>4√3 − 2π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сторона 2 вместо 4.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3 × 60° = 180° — полкруга.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m023_q08.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 1, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем квадратное неравенство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>108 − 2n² &gt; 5n + 3 → 2n² + 5n − 105 &lt; 0.</li><li>Корень: n = <span class=\"fr\"><span>−5 + √865</span><span>4</span></span> ≈ 6,1.</li><li>Наибольшее целое n = 6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (7): T = 10, S = 38 — уже меньше.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка n = 6: T = 36 &gt; S = 33 ✓.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m023_q09.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Минутная 6°/мин, часовая 0,5°/мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минутная: 50 · 6 = 300°.</li><li>Часовая: 150 + 50 · 0,5 = 175°.</li><li>300 − 175 = 125°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>F — без сдвига часовой.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая стрелка тоже движется.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m023_q10.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 0, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корни r и r + 1, сумма по Виета −3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2r + 1 = −3 → r = −2.</li><li>Корни −2 и −1 → больший −1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — меньший корень.</li><li>C, D — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: c = 2, x² + 3x + 2 = (x + 1)(x + 2) ✓.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m023_q11.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 3, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона ромба — из половин диагоналей, затем коэффициент подобия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона: √(16 + 9) = 5; площадь 8 · <span class=\"fr\"><span>6</span><span>2</span></span> = 24.</li><li>k = <span class=\"fr\"><span>√300</span><span>5</span></span> → k² = <span class=\"fr\"><span>300</span><span>25</span></span> = 12.</li><li>24 · 12 = 288.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — k вместо k² или неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь растёт в k² раз.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m023_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Жидкость — подобный конус с k = ⅔.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V = (⅔)³ · V_полн = <span class=\"fr\"><span>8</span><span>27</span></span> V_полн → V_полн = <span class=\"fr\"><span>27V</span><span>8</span></span>.</li><li>Добавить: <span class=\"fr\"><span>27V</span><span>8</span></span> − V = <span class=\"fr\"><span>19V</span><span>8</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — линейно по высоте.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Объёмы подобных тел ∝ k³.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m023_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала скобка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 ⊕ 2 = <span class=\"fr\"><span>2</span><span>3</span></span> − <span class=\"fr\"><span>3</span><span>2</span></span> = <span class=\"fr\"><span>−5</span><span>6</span></span>.</li><li>1 ⊕ <span class=\"fr\"><span>−5</span><span>6</span></span> = <span class=\"fr\"><span>−5</span><span>6</span></span> − <span class=\"fr\"><span>1</span><span><span class=\"fr\"><span>−5</span><span>6</span></span></span></span> = <span class=\"fr\"><span>−5</span><span>6</span></span> + <span class=\"fr\"><span>6</span><span>5</span></span> = <span class=\"fr\"><span>11</span><span>30</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — только внутренний шаг.</li><li>Остальные — ошибки со знаками.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a ⊕ b = <span class=\"fr\"><span>b</span><span>a</span></span> − <span class=\"fr\"><span>a</span><span>b</span></span> — порядок важен.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m023_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем нижние компоненты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 11 + 5 · (−k) = 42 → 22 − 5k = 42 → k = −4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — делили на 10.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Компоненты векторов складываются отдельно.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m023_q16.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 4, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем на 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(x − 5) + 3(7 − 2x) + 48 &gt; 0.</li><li>2x − 10 + 21 − 6x + 48 &gt; 0 → 59 − 4x &gt; 0.</li><li>x &lt; <span class=\"fr\"><span>59</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>F — знак не перевернули при делении на −4.</li><li>Остальные — ошибки раскрытия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делим на отрицательное — знак меняется.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m023_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По частям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 · 10²)² = 16 · 10⁴.</li><li>16 · 10⁴ · 5 · 10⁻⁴ = 80 = 8 · 10¹.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 10⁴ · 10⁻⁴ = 1.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m023_q20.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две полусферы = шар; плюс боковая поверхность цилиндра.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Шар: 4π · 225 = 900π.</li><li>Цилиндр: 2π · 15 · 88 = 2640π.</li><li>3540π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная длина цилиндра (118 вместо 88) или полусфера одна.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Основания цилиндра внутри — не считаются.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m023_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем точки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Q(0; −2): 2b = −9 → b = −4,5.</li><li>P(2; −4): 2a + 4b = −9 → 2a = 9 → a = 4,5.</li><li>a + b = 0.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только a.</li><li>Остальные — ошибки знака.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точка на оси убирает одну переменную.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m023_q22.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольник ACD прямоугольный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = √(3 + 1) = 2 → BD = 2.</li><li>BC = 3 → AB = √(3 + 9) = 2√3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это AD.</li><li>F — BD + BD.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> AB — гипотенуза треугольника ABC.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m023_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два различных корня ⇔ D &gt; 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² − 4x − (13 + k) = 0.</li><li>D = 16 + 8(13 + k) &gt; 0 → k &gt; −15.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка при переносе k.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перенесите k в левую часть.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m023_q24.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадрат a × a и четыре полукруга диаметра a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Полукругов 4 = два круга радиуса <span class=\"fr\"><span>a</span><span>2</span></span>: 2 · <span class=\"fr\"><span>πa²</span><span>4</span></span> = <span class=\"fr\"><span>πa²</span><span>2</span></span>.</li><li>S = a² + ½πa².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — два полукруга.</li><li>Остальные — без квадрата или неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус = <span class=\"fr\"><span>a</span><span>2</span></span>.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m023_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем площади поверхностей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Было: 6 · 16 = 96.</li><li>Стало: 64 · 6 = 384.</li><li>Рост: <span class=\"fr\"><span>288</span><span>96</span></span> = 300%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — новое значение в процентах от старого.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Увеличение» = (новое − старое)/старое.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m023_q27.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ветви вверх, ≤ 0 — между корнями.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 ≤ x ≤ 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — неверные корни.</li><li>B — неполно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корни видны сразу: 1 и 3.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m023_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем варианты: медленная работала 9 ч, быстрая — 2 ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: <span class=\"fr\"><span>9</span><span>12</span></span> + <span class=\"fr\"><span>2</span><span>8</span></span> = ¾ + ¼ = 1 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные: сумма ≠ 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Медленная труба работала 7 + 2 = 9 часов.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m023_q29.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем все три уравнения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>15x + 15y + 15z + 13 = 58.</li><li>x + y + z = 3.</li><li>3 − 34 = −31.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное сложение свободных членов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коэффициенты при каждой переменной в сумме 15 — так и задумано.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m023_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одинаковые единицы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>600 : 2200 = 6 : 22 = 3 : 11.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки в переводе кг в г.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2,2 кг = 2200 г.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
