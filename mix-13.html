<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {

    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"<p>Given the simultaneous equations, \\(2x + 3y - z = 2\\), \\(3x - 2y + 2z = 15\\) and \\(5x + y + 3z = 22\\) The expression \\(xyz\\) is</p>","image":"","options":["\\(-12.5\\)","\\(-3.75\\)","\\(0\\)","\\(3.75\\)","\\(12.5\\)"],"correct":1,"verified":true,"src":"M34","orig":"images/q-1eafd1257b.jpg"},{"id":2,"text":"<p>Find the set of x values that satisfy both inequalities:</p><p>\\(\\frac{x^2-4}{x-1} \\leq 0\\)</p><p>\\(|2x - 5| &gt; 0\\)</p>","image":"","options":["\\(-2 \\leq x &lt; 1\\)","\\(x \\leq -2\\) and \\(1 &lt; x \\leq 2\\)","\\(1 &lt; x &lt; 4\\)","\\(1 &lt; x \\leq 2\\)"],"correct":1,"verified":true,"src":"M34","review":true,"orig":"images/q-50265754be.jpg"},{"id":3,"text":"<p>Simplify the following expression into the form \\(a + \\sqrt{b}\\), where a and b are integers:</p><p>\\[\\frac{4\\sqrt{20}+6\\sqrt{45}-\\sqrt{80}}{2}\\]</p>","image":"","options":["\\(7 + \\sqrt{5}\\)","\\(0 + \\sqrt{125}\\)","\\(0 + \\sqrt{605}\\)","\\(5 + \\sqrt{11}\\)","\\(7 + \\sqrt{12}\\)"],"correct":2,"verified":true,"src":"M34","orig":"images/q-d312f4aceb.jpg"},{"id":4,"text":"<p>Both solution A and solution B contain acid and water. In solution A, the ratio of acid to water is 1:4. When equal amounts of solution A and solution B are mixed, the ratio of acid to water in the new mixture is 1:3. What is the ratio of acid to water in solution B?</p>","image":"","options":["3:7","1:2","3:17","1:4","None of these"],"correct":0,"verified":true,"src":"M34","orig":"images/q-f97caf2eb0.jpg"},{"id":5,"text":"<p>Suppose that 1 and −2 are roots of \\(x^3 + ax^2 + bx + c = 0\\)</p><p>Given that 3a+b=−4, find the value of a</p>","image":"","options":["a=0","\\(-\\frac{1}{4}\\)","\\(-\\frac{3}{4}\\)","\\(-\\frac{2}{6}\\)"],"correct":1,"verified":true,"src":"M34","review":true,"orig":"images/q-cc1537ce1d.jpg"},{"id":6,"text":"<p>The largest integer k such that \\(3^k\\) divides 4(9!)+5(6!)+2(3!) is:</p>","image":"","options":["1","2","3","4","5"],"correct":0,"verified":true,"src":"M34","orig":"images/q-5a333aa32c.jpg"},{"id":7,"text":"<p>Given</p><p>\\(K = \\dfrac{x(3y-5)+4}{2y+7}\\)</p><p>Rearrange the formula to make y the subject.</p>","image":"","options":["\\(y = \\dfrac{7K-4+5x}{3x-2K}\\)","\\(y = \\dfrac{7K-4-5x}{3x-2K}\\)","\\(y = \\dfrac{3x-2K}{7K-4-5x}\\)","\\(y = \\dfrac{7K+4+5x}{3x+2K}\\)"],"correct":0,"verified":true,"src":"M34","review":true,"orig":"images/q-8d77d4d480.jpg"},{"id":8,"text":"<p>A teacher is handing out pencils to a class. If she gives 4 pencils to each student, she has 10 pencils left over. If she gives 7 pencils to each student, she is short by 5 pencils. If x pencils are given to each student such that there are no pencils left over, what is x?</p>","image":"","options":["4","5","6","7","8"],"correct":2,"verified":true,"src":"M34","orig":"images/q-9c090f0591.jpg"},{"id":9,"text":"<p>If \\(3x + (3x)^{-1} = 4\\), find the value of \\(81x^4 + \\dfrac{1}{81x^4}\\)</p>","image":"","options":["194","196","254","142","225"],"correct":0,"verified":true,"src":"M34","orig":"images/q-ae0bc8d8f4.jpg"},{"id":10,"text":"<p>The area of a right triangle is 30, and its perimeter is 30. Find the length of the shortest side.</p>","image":"","options":["5","13","12","6"],"correct":0,"verified":true,"src":"M34","review":true,"orig":"images/q-06ce1bf37d.jpg"},{"id":11,"text":"<p>If n is an even integer and m is an odd integer, which of the following statements are always true?</p><ol><li>\\((n + m)^2\\) is an odd integer</li><li>\\(n^2 + m\\) is an even integer</li><li>nm+1 is an odd integer.</li></ol>","image":"","options":["1 only","2 only","1 and 3 only","2 and 3 only","1, 2, and 3"],"correct":2,"verified":true,"src":"M34","orig":"images/q-00949beba1.jpg"},{"id":12,"text":"<p>A trapezoid has:</p><ul><li>Height h=6 units</li><li>Top base AB=8 units</li><li>Bottom base CD=14 units</li></ul><p>The non-parallel sides (legs) are equal in length.</p><p>Find the perimeter of the trapezoid.</p>","image":"","options":["22","\\(22 + 6\\sqrt{5}\\)","\\(22 + 3\\sqrt{5}\\)","\\(22 + \\sqrt{5}\\)"],"correct":1,"verified":true,"src":"M34","review":true,"orig":"images/q-5399762339.jpg"},{"id":13,"text":"<p>In the figure shown, OAB and ODC are sectors of two concentric circles centered at O. The length of OD is one-third the length of OA. What is the ratio of the area of the region ABCD to the area of the sector ODC?</p>","image":"images/q-1747a0e40d.jpg","options":["7","8","10","11","12"],"correct":1,"verified":true,"src":"M34","orig":"images/q-1747a0e40d.jpg","review":true},{"id":14,"text":"<p>The expression (x−c) is a factor of \\(x^3 - (c + 3)x^2 + (3c + 4)x - 20\\), where c is a non-zero real number. Find the value of c.</p>","image":"","options":["1","2","4","5","10"],"correct":3,"verified":true,"src":"M34","orig":"images/q-68f753d94b.jpg"},{"id":15,"text":"<p>A figure is constructed on a coordinate-like plane with the following segments:</p><ol><li>Segment AB: A horizontal base of length 25 units. B is to the right of A.</li><li>Segment BC: A vertical line of length 12 units, such that \\(\\angle ABC=90°\\).</li><li>Segment CD: A horizontal line of length 9 units, extending from C toward the left (parallel to AB).</li><li>Dashed Segments: A line connecting B to D and a line connecting A to D.</li></ol><p>What is the sum of the distances AD and BD in the figure described?</p>","image":"","options":["28","30","32","34","35"],"correct":4,"verified":true,"src":"M34","orig":"images/q-5e402549a6.jpg"},{"id":16,"text":"<p>Simplify the expression and find the value of x</p><p>\\(\\frac{7^{x+5} \\cdot 49^{x-1}}{343^x \\cdot 7^{-2}} = 49\\)</p>","image":"","options":["2","3","4","5","No solution"],"correct":-1,"verified":false,"src":"M34","orig":"images/q-792636b4c9.jpg"},{"id":17,"text":"<p>Consider the following three statements regarding equilateral triangles:</p><ol><li>It is an equilateral triangle if it has three equal angles.</li><li>It is an equilateral triangle only if it has three equal angles.</li><li>It is an equilateral triangle if and only if it has three equal angles.</li></ol><p>Which of the statements is/are true?</p>","image":"","options":["None of them","1 only","2 only","3 only","1 and 2 only","3 and 2 only","1 and 3 only","1, 2, and 3"],"correct":7,"verified":true,"src":"M34","orig":"images/q-befd1e6ea3.jpg"},{"id":18,"text":"<p>In the Figure shown, ABCD and DCFE are rectangles with AB = 4, AC = 5, and BC = CF. What is AF?</p>","image":"images/q-9a2200de74.jpg","options":["\\(5\\sqrt{2}\\)","\\(4\\sqrt{3}\\)","\\(3\\sqrt{5}\\)","\\(3\\sqrt{6}\\)","\\(2\\sqrt{13}\\)"],"correct":4,"verified":true,"src":"M34","orig":"images/q-9a2200de74.jpg","review":true},{"id":19,"text":"<p>Suppose ABCD is a square, and that A, B, C, and D are the midpoints of BP , CQ, DR, and AS, respectively. What is the ratio of the perimeter of PQRS to the perimeter of ABCD ?</p>","image":"images/q-2d700da7dd.jpg","options":["5","\\(5\\sqrt{5}\\)","\\(\\sqrt{5}\\)","\\(2\\sqrt{5}\\)","3"],"correct":2,"verified":true,"src":"M34","orig":"images/q-2d700da7dd.jpg","review":true},{"id":20,"text":"<p>20 Question</p><p>A magician has a total of 300 gold coins in two bags. He takes one third of the coins in the first bag and puts them into the second bag. He then takes 10 coins from the first bag and puts them into the second bag. If the second bag now contains twice as many coins as the first bag, how many coins were originally in the first bag?</p>","image":"","options":["120","150","165","180","210"],"correct":2,"verified":true,"src":"M34","orig":"images/q-c8d02aaf3e.jpg"},{"id":21,"text":"<p>The sum of five consecutive odd integers is 285. How many of these integers are prime?</p>","image":"","options":["1","2","3","4","5"],"correct":2,"verified":true,"src":"M34","orig":"images/q-a68438fde0.jpg"},{"id":22,"text":"<p>The midpoints of three of the edges of a cube are labeled A, B, and C as shown in the diagram. What is the measure of angle ABC?</p>","image":"images/q-48b597b646.jpg","options":["90","105","120","135","150"],"correct":-1,"verified":false,"src":"M34","orig":"images/q-48b597b646.jpg","review":true},{"id":23,"text":"<p>The area of the rectangle ABCD is 30. The diagonal AC is drawn from vertex A to vertex C. Two points, E and F, are placed on the diagonal AC such that they divide the diagonal into three equal segments (AE=EF=FC). A shaded triangle is formed by connecting vertices E, B, and F. What is the area of \\(\\triangle AEB\\)?</p>","image":"images/q-5599f41a4e.jpg","options":["5","6","7","10","12"],"correct":0,"verified":true,"src":"M34","orig":"images/q-5599f41a4e.jpg","review":true},{"id":24,"text":"<p>Two chords XY and ZW of a circle intersect at point E. Given that XE=3, EY=8, ZE=4, EW=6, and \\(\\angle\\)XEZ=90°. What is the radius of the circle?</p>","image":"","options":["\\(\\sqrt{31}\\)","\\(\\sqrt{31.25}\\)","\\(\\sqrt{41}\\)","\\(5\\sqrt{2}\\)","7.4"],"correct":1,"verified":true,"src":"M34","orig":"images/q-45545151c8.jpg"},{"id":25,"text":"<p>What is the largest power of 2 that divides \\(2^{1000} + 6^{1000}\\)?</p>","image":"","options":["\\(2^{1000}\\)","\\(2^{1001}\\)","\\(2^{1002}\\)","\\(2^{1003}\\)","\\(2^{1004}\\)"],"correct":1,"verified":true,"src":"M34","orig":"images/q-bd9403ce54.jpg"},{"id":26,"text":"<p>Consider two sequences:</p><ol><li>An arithmetic sequence where the first term is a1=3 and the common difference is d.</li><li>A geometric sequence where the first term is g1=3 and the common ratio is r.</li></ol><p>It is known that the second term of the arithmetic sequence is equal to the second term of the geometric sequence. Furthermore, the fifth term of the arithmetic sequence is equal to the third term of the geometric sequence. Given that \\(r \\neq 1\\), find the value of the common ratio r.</p>","image":"","options":["2","3","4","5","6"],"correct":1,"verified":true,"src":"M34","orig":"images/q-b7e4dae5c0.jpg"},{"id":27,"text":"<p>Suppose x and y are positive integers such that \\((x + 3y)(x - y) = 21\\). What is the smallest possible value of x+y?</p>","image":"","options":["5","6","7","8","10"],"correct":0,"verified":true,"src":"M34","orig":"images/q-626658efd6.jpg"},{"id":28,"text":"<p>Two runners, Alice and Bob, start at the same point on a circular track with a circumference of 400 meters. They both run in a clockwise direction at constant speeds. Alice is the faster runner, moving at V meters per second, while Bob moves at v meters per second.</p><ol><li>If they run in the same direction, Alice overtakes Bob every 80 seconds.</li><li>If Bob were to run in the opposite direction (counter-clockwise) while Alice continues clockwise, they would pass each other every 20 seconds.</li></ol><p>What is the speed of the faster runner, Alice (V), in meters per second?</p>","image":"","options":["10","12.5","15","17.5","20"],"correct":1,"verified":true,"src":"M34","orig":"images/q-42afd354c4.jpg"},{"id":29,"text":"<p>The value of a stock starts at $200. On Monday, the price increases by 15%. On Tuesday, the new price decreases by 10%.</p><p>What is the final price of the stock at the end of Tuesday?</p>","image":"","options":["204","207","230","250","273"],"correct":1,"verified":true,"src":"M34","orig":"images/q-b7c95f2201.jpg"},{"id":30,"text":"<p>Suppose 5x−3y=2x+y. Given that x and y are non-zero, what is the value of \\(\\frac{3x-2y}{x+y}\\)</p>","image":"","options":["6/7","1/3","2/3","1","4/3"],"correct":0,"verified":true,"src":"M34","orig":"images/q-c4d7a30931.jpg"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

    <div class="row">

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
