<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }

  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;

  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;

  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;

  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }

  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 2, "text": "", "image": "images/math-new/m051_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Фигура — шестиугольник (4 угла + 2 «вогнутые» вершины).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(6 − 2) · 180 = 720°. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли вогнутые углы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте вершины.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m051_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">32 = 2⁵ — может давать одно число (например, 32).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Достаточно одного чётного. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — не обязательно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите минимальный пример.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m051_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычтем: y + 2z = 25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + y + z = (x + 3y + 5z) − 2(y + 2z) = 200 − 50 = 150. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — подбор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Комбинируйте уравнения.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m051_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма 1 + 3 + … + 17 = 81.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 строки: 81 : 3 = 27. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая строка — треть суммы.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m051_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x = 3: 27 + 18 + 5 = 10C → C = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>При x²: A + C = 3 → A = −2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — это C.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобное x обнуляет скобку.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m051_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма за день 1 + … + n = n<span class=\"fr\"><span>n + 1</span><span>2</span></span>; за 4 дня всем 26n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2n(n + 1) = 26n → n = 12. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не подходят.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте двумя способами.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m051_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AM = 6 · AC → коэффициент 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Отношение площадей 36 — нет в A–D. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 24.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площади ∝ k².</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m051_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>1</span><span>1024</span></span> = <span class=\"fr\"><span>5¹⁰</span><span>10¹⁰</span></span> = 0,0009765625.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5¹⁰ = 9 765 625 → сумма цифр 40. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 41.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>1</span><span>2¹⁰</span></span> = <span class=\"fr\"><span>5¹⁰</span><span>10¹⁰</span></span>.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m051_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">7n + 10 = 8n + 5 → n = 5, карт 45.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>45 = 9 · 5 → x = 9. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — это n.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Составьте уравнение.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m051_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x − 2 кратно НОК(3, 5, 6) = 30.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 32 → 3 + 2 = 5. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — x = 2 исключён.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> НОК.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m051_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Британский флаг»: AE² + CE² = BE² + DE².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AE² = 16 + 64 − 25 = 55 → √55. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — √60.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для любой точки в прямоугольнике.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m051_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">При 45° поверхность опускается на диаметр 6 по высоте.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Уровни 10 и 4 → средний 7; V = 9π · 7 = 63π. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — средний <span class=\"fr\"><span>25</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Срез — средняя высота.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m051_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый внешний треугольник имеет стороны двух квадратов и угол 180° − угол ABC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin(180° − α) = sin α → площади равны. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — частные случаи.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = ½ab sin C.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m051_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из видов 1 и 3: вокруг грани 1 — 3 (верх), 2, 4 (низ).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Во втором виде 3 соседствует с 4 — а верх 3 противоположен 4, значит это другая грань с 3. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают противоречия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Противоположные грани не соседствуют.</div></div>"}, {"id": 101, "text": "", "image": "images/math-new/m052_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2w(l + 3) = 3wl.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2l + 6 = 3l → l = 6. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — подбор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ширина сокращается.</div></div>"}, {"id": 102, "text": "", "image": "images/math-new/m052_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 # x = 3 + x + 3x = 3 + 4x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4x = 20 → x = 5. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без +3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте в определение.</div></div>"}, {"id": 103, "text": "", "image": "images/math-new/m052_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центры образуют равносторонний треугольник со стороной 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√3 − 3 · <span class=\"fr\"><span>π</span><span>6</span></span> = √3 − <span class=\"fr\"><span>π</span><span>2</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — половина.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Треугольник минус три сектора по 60°.</div></div>"}, {"id": 105, "text": "", "image": "images/math-new/m052_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">f(2) = f(1) + f(1) + 1 = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(3) = f(2) + f(1) + 1 = 8. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без +1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наращивайте по шагу.</div></div>"}, {"id": 106, "text": "", "image": "images/math-new/m052_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена (1 − <span class=\"fr\"><span>p</span><span>100</span></span>); нужно ×<span class=\"fr\"><span>1</span><span>1 − <span class=\"fr\"><span>p</span><span>100</span></span></span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Рост = <span class=\"fr\"><span>p</span><span>100 − p</span></span> · 100% = <span class=\"fr\"><span>100p</span><span>100 − p</span></span>%. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — p% мало.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент от новой базы.</div></div>"}, {"id": 107, "text": "", "image": "images/math-new/m052_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Под картой i: S − hᵢ; сумма подписей 5S.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5S = 28 → S = 5,6. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — <span class=\"fr\"><span>28</span><span>6</span></span> неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждое число входит 5 раз.</div></div>"}, {"id": 109, "text": "", "image": "images/math-new/m052_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(y − x)(y + x) = 187 = 11 · 17.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y − x = 11, y + x = 17 → x = 3, y = 14 → xy = 42. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают 187.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность квадратов.</div></div>"}, {"id": 115, "text": "", "image": "images/math-new/m052_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель 3 · 5 · 7 · 11 · 13 = 15015; числитель 13 + 11 + 7 + 5 + 3 = 39.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>39</span><span>15015</span></span> = <span class=\"fr\"><span>1</span><span>385</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не сократили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократите на 39.</div></div>"}, {"id": 116, "text": "", "image": "images/math-new/m052_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя линия PM делит CN пополам → CN = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>O — центроид: CO = ⅔ · 8 = <span class=\"fr\"><span>16</span><span>3</span></span> → OQ = <span class=\"fr\"><span>16</span><span>3</span></span> − 4 = <span class=\"fr\"><span>4</span><span>3</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центроид делит медиану 2 : 1.</div></div>"}, {"id": 121, "text": "", "image": "images/math-new/m052_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый сыграл G − 12 игр; сумма степеней = 2G.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8(G − 12) = 2G → 6G = 96 → G = 16. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (14) — в старом ключе, неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая игра — два участника.</div></div>"}, {"id": 122, "text": "", "image": "images/math-new/m052_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">A ≈ 4,51; B = 2 · <span class=\"fr\"><span>3</span><span>2</span></span> · <span class=\"fr\"><span>5</span><span>4</span></span> · <span class=\"fr\"><span>7</span><span>6</span></span> · <span class=\"fr\"><span>11</span><span>10</span></span> · <span class=\"fr\"><span>13</span><span>12</span></span> ≈ 5,21; C = H₁₆ ≈ 3,38.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B > A > C. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — A и B перепутаны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (1 − <span class=\"fr\"><span>1</span><span>p</span></span>)⁻¹ = 1 + <span class=\"fr\"><span>1</span><span>p</span></span> + <span class=\"fr\"><span>1</span><span>p²</span></span> + …</div></div>"}, {"id": 125, "text": "", "image": "images/math-new/m052_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр на прямой через O и (0; 2) → (0; k).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>36 + k² = (k − 2)² → k = −8 → (0; −8) — нет среди A–D. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — (0; −9).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Касание → центры и точка на одной прямой.</div></div>"}, {"id": 127, "text": "", "image": "images/math-new/m052_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">P — центр вписанной окружности, r = 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = r · p (полупериметр): 24 = 2p → p = 12, периметр 24. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — полупериметр.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = r · p.</div></div>"}, {"id": 128, "topic": "M2.11", "text": "<p>Write \\(\\dfrac{4}{\\sqrt{2}}\\) with a rational denominator, in its simplest form.</p>", "image": "", "options": ["\\(4\\sqrt{2}\\)", "\\(8\\sqrt{2}\\)", "\\(\\dfrac{\\sqrt{2}}{4}\\)", "\\(\\dfrac{4}{2}\\)", "\\(2\\sqrt{2}\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножьте числитель и знаменатель на √2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>4√2</span><span>2</span></span>, сокращаем. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли разделить на 2.</li><li>C — перевернули дробь.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √n · √n = n.</div></div>", "src": "PL"}, {"id": 129, "topic": "M2.10", "text": "<p>Arman spends \\(\\dfrac{1}{4}\\) of his money on a game and \\(\\dfrac{2}{3}\\) of what is left on lunch. He has ₸3000 left.</p><p>How much did he start with?</p>", "image": "", "options": ["₸4000", "₸5750", "₸12,000", "₸12,600", "₸36,000"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Остаток = (1 − <span class=\"fr\"><span>1</span><span>4</span></span>)(1 − <span class=\"fr\"><span>2</span><span>3</span></span>) от начальной суммы = <span class=\"fr\"><span>1</span><span>4</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3000 : <span class=\"fr\"><span>1</span><span>4</span></span> = 12,000. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли про обед.</li><li>B — прибавили доли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Работайте с остатками, а не с потраченным.</div></div>", "src": "PL"}, {"id": 130, "topic": "M5.18", "text": "<p>In a right-angled triangle the side opposite angle θ is 3 cm, the side adjacent to θ is 4 cm and the hypotenuse is 5 cm.</p><p>What is \\(\\tan\\theta\\)?</p>", "image": "", "options": ["\\(\\dfrac{3}{5}\\)", "\\(\\dfrac{3}{4}\\)", "\\(\\dfrac{7}{5}\\)", "\\(\\dfrac{4}{5}\\)", "\\(\\dfrac{4}{3}\\)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">SOH CAH TOA.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>tan θ = <span class=\"fr\"><span>3</span><span>4</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перепутали функцию.</li><li>D — дробь перевёрнута.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> sin = противолежащий/гипотенуза, cos = прилежащий/гипотенуза, tan = противолежащий/прилежащий.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
