<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Simplify the following expression:</p><p>\\(\\dfrac{\\dfrac{1}{x}+\\dfrac{1}{y}}{\\dfrac{x^2-y^2}{xy}}\\)</p>", "image": "", "options": ["\\(\\dfrac{1}{x-y}\\)", "\\(-\\dfrac{1}{x+y}\\)", "\\(\\dfrac{y-x}{x+y}\\)", "\\(x-y\\)"], "correct": 0, "verified": true, "src": "M33", "review": true, "orig": "images/q-5f1fe7042b.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим числитель к одной дроби, знаменатель раскладываем как разность квадратов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>x</span></span> + <span class=\"fr\"><span>1</span><span>y</span></span> = <span class=\"fr\"><span>x + y</span><span>xy</span></span>.</li><li><span class=\"fr\"><span>x² − y²</span><span>xy</span></span> = (x − y)<span class=\"fr\"><span>x + y</span><span>xy</span></span>.</li><li>Делим: <span class=\"fr\"><span>x + y</span><span>xy</span></span> · <span class=\"fr\"><span>xy</span><span>(x − y)(x + y)</span></span> = <span class=\"fr\"><span>1</span><span>x − y</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сократили не тот множитель и потеряли знак.</li><li>C, D — неверное деление дробей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на дробь = умножение на перевёрнутую.</div></div>"}, {"id": 2, "text": "<p>Let the operation \\(\\odot\\) be defined for all positive real numbers as: \\[a \\odot b = \\frac{ab + a}{2}\\] Find the value of n such that \\((2 \\odot 3) \\odot n = 12\\)</p>", "image": "", "options": ["3", "4", "5", "6", "8"], "correct": 2, "verified": true, "src": "M33", "orig": "images/q-fd3c8356b7.jpg", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2⊙3 = <span class=\"fr\"><span>6 + 2</span><span>2</span></span> = 4.</li><li>4⊙n = <span class=\"fr\"><span>4n + 4</span><span>2</span></span> = 2n + 2 = 12 → n = 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — подстановка не даёт 12.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала вычисляйте внутреннюю операцию.</div></div>"}, {"id": 3, "text": "<p>Find the solution set for the following system of inequalities.</p><p>\\(x^2 + 8x &gt; 0\\)</p><p>\\(18 + 3x &lt; 23 + x\\)</p>", "image": "", "options": ["\\((-inf; -8]\\)", "\\((0; 2.5)\\)", "\\(x &lt; -8\\) and \\(0 &lt; x &lt; 2.5\\)", "\\(x &lt; -8\\) and \\(x \\geq 2.5\\)"], "correct": 2, "verified": true, "src": "M33", "review": true, "orig": "images/q-13c978fcf2.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем каждое неравенство и берём пересечение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x(x + 8) > 0 → x < −8 или x > 0.</li><li>18 + 3x < 23 + x → 2x < 5 → x < 2,5.</li><li>Пересечение: x < −8 или 0 < x < 2,5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — квадратная скобка у −8 (строгое неравенство) и потерян промежуток (0; 2,5).</li><li>B — потеряна часть x < −8.</li><li>D — x ≥ 2,5 противоречит второму неравенству.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пересечение с объединением — рисуйте числовую прямую.</div></div>"}, {"id": 4, "text": "<p>Solve the following equation for x and choose the x which gives the smallest y:</p><p>\\(\\sqrt{2x + 15} - x = 6\\)</p><p>\\(x^2 - 2x + 6 - y = 0\\)</p>", "image": "", "options": ["-3 only", "-7 only", "-3 and -7", "no solution"], "correct": 0, "verified": true, "src": "M33", "review": true, "orig": "images/q-dd8a0e4843.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем корень, возводим в квадрат и обязательно проверяем корни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(2x + 15) = x + 6.</li><li>2x + 15 = x² + 12x + 36 → x² + 10x + 21 = 0 → x = −3 или −7.</li><li>Правая часть x + 6 ≥ 0 → x ≥ −6. x = −7 не подходит (√1 = 1 ≠ −1).</li><li>Остаётся x = −3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — посторонний корень.</li><li>C — включён посторонний корень.</li><li>D — решение есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После возведения в квадрат всегда проверяйте: корень ≥ 0.</div></div>"}, {"id": 5, "text": "<p>Evaluate:</p><p>\\(\\sqrt{7+4\\sqrt{3}}-\\sqrt{7-4\\sqrt{3}}\\)</p>", "image": "", "options": ["\\(2\\sqrt{3}\\)", "\\(4\\)", "\\(\\sqrt{14}\\)", "\\(2\\)"], "correct": 0, "verified": true, "src": "M33", "review": true, "orig": "images/q-979a3e4457.jpg", "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражения под корнями — полные квадраты: 7 ± 4√3 = (2 ± √3)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2 + √3)² = 4 + 4√3 + 3 = 7 + 4√3.</li><li>√(7 + 4√3) = 2 + √3; √(7 − 4√3) = 2 − √3 (положительно).</li><li>Разность: 2√3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (4) — сумма корней.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a + 2√b·… ищите в виде (m + √n)².</div></div>"}, {"id": 6, "text": "<p>A delivery drone travels from a warehouse to a customer location at a constant speed of 40 km/h. The distance between a warehouse and a customer location is 20km. After completing the delivery, the drone returns to the warehouse.</p><p>On the return trip:</p><ul><li>During the first 10 km, the drone flies in a restricted airspace and slows down to 20 km/h.</li><li>For the remaining distance, it flies at a speed of v km/h.</li></ul><p>If the average speed for the entire journey (going and returning) is 25 km/h, find the value of v.</p>", "image": "", "options": ["\\(\\frac{20}{3}\\)", "\\(\\frac{25}{3}\\)", "\\(\\frac{35}{3}\\)", "\\(\\frac{47}{3}\\)", "\\(\\frac{50}{3}\\)"], "correct": 4, "verified": true, "src": "M33", "orig": "images/q-00af990019.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя скорость = весь путь ÷ всё время; находим время последнего участка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Весь путь 40 км при 25 км/ч → 1,6 ч.</li><li>Туда: <span class=\"fr\"><span>20</span><span>40</span></span> = 0,5 ч.</li><li>Обратно первые 10 км: <span class=\"fr\"><span>10</span><span>20</span></span> = 0,5 ч.</li><li>Остаток времени: 1,6 − 1 = 0,6 ч на 10 км → v = <span class=\"fr\"><span>10</span><span>0,6</span></span> = <span class=\"fr\"><span>50</span><span>3</span></span> км/ч.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — неверное время последнего участка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя скорость ≠ среднее скоростей.</div></div>"}, {"id": 8, "text": "<p>A merchant buys an item for $C. He wants to set a marked price such that even after giving a 20% discount on the marked price, he still makes a profit of 25% on his original cost.</p><p>Express the required Marked Price (M) in terms of the Cost Price (C).</p>", "image": "", "options": ["M=1.45C", "M=1.5625C", "M=5C/4", "M=2C"], "correct": 1, "verified": true, "src": "M33", "review": true, "orig": "images/q-b48bd5d916.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена после скидки = себестоимость + 25%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,8M = 1,25C.</li><li>M = <span class=\"fr\"><span>1,25C</span><span>0,8</span></span> = 1,5625C.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили 20% + 25%.</li><li>C (1,25C) — забыли скидку.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скидка — от наценённой цены, прибыль — от себестоимости.</div></div>"}, {"id": 9, "text": "<p>Find the distance between the centers of the two circles defined by the following equations:</p><p>\\(x^2 + y^2 - 4x + 6y - 3 = 0\\) \\(x^2 + y^2 + 8x - 10y + 5 = 0\\)</p>", "image": "", "options": ["\\(6\\sqrt{2}\\)", "\\(10\\)", "\\(\\sqrt{130}\\)", "\\(2\\sqrt{34}\\)", "\\(12\\)"], "correct": 1, "verified": true, "src": "M33", "orig": "images/q-1af052ea31.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр окружности x² + y² + Dx + Ey + F = 0: <span class=\"fr\"><span>−D</span><span>2</span></span>; <span class=\"fr\"><span>−E</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая: (2; −3). Вторая: (−4; 5).</li><li>d = √(6² + 8²) = 10.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ошибки знаков в центрах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак меняется: −4x → центр x = +2.</div></div>"}, {"id": 10, "text": "<p>Triangle ABC is such that:</p><ul><li>AB=13, AC=15</li><li>The altitude from A to side BC meets BC at point D</li><li>BD=5</li><li>CD is not given directly</li></ul><p>Find the area of triangle ABC.</p>", "image": "", "options": ["60", "70", "76", "80", "84"], "correct": 4, "verified": true, "src": "M33", "orig": "images/q-0df2095f18.jpg", "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота делит треугольник на два прямоугольных.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = √(169 − 25) = 12.</li><li>DC = √(225 − 144) = 9.</li><li>BC = 14 → S = ½ · 14 · 12 = 84.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (60) — только треугольник ABD... нет, 30; ошибки в BC.</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 5-12-13 и 9-12-15 — две пифагоровы тройки с общим катетом 12.</div></div>"}, {"id": 11, "text": "<p>Simplify the following expression into its simplest form: \\(\\dfrac{x^3-27}{x^2+2x-15}\\)</p>", "image": "", "options": ["\\(\\dfrac{x^2-3x+9}{x-5}\\)", "x-3", "\\(\\dfrac{x^2+3x+9}{x+5}\\)", "\\(\\dfrac{x+3}{x-5}\\)", "\\(x^2+9\\)"], "correct": 2, "verified": true, "src": "M33", "orig": "images/q-eb0760189b.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность кубов в числителе и разложение знаменателя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x³ − 27 = (x − 3)(x² + 3x + 9).</li><li>x² + 2x − 15 = (x − 3)(x + 5).</li><li>Сокращаем (x − 3): <span class=\"fr\"><span>x² + 3x + 9</span><span>x + 5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак в неполном квадрате.</li><li>D — неверное разложение.</li><li>B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a³ − b³ = (a − b)(a² + ab + b²) — плюс в скобке.</div></div>"}, {"id": 12, "text": "<p>Three variables p, q, and r are related in the following ways:</p><ul><li>p is directly proportional to the cube of r.</li><li>q is inversely proportional to the square of r.</li></ul><p>Which of the following correctly describes the relationship between p and q?</p>", "image": "", "options": ["The square of p is directly proportional to the cube of q.", "The square of p is inversely proportional to the cube of q", "The cube of p is directly proportional to the square of q.", "The cube of p is inversely proportional to the square of q."], "correct": 1, "verified": true, "src": "M33", "review": true, "orig": "images/q-d0eedd3749.jpg", "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исключаем r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p ∝ r³; q ∝ r⁻² → r ∝ q<sup>−1⁄2</sup>.</li><li>p ∝ q<sup>−3⁄2</sup>.</li><li>p² ∝ q⁻³: квадрат p обратно пропорционален кубу q.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — прямая пропорциональность (p растёт, q падает → обратная).</li><li>D — степени перепутаны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возводите в степень, чтобы избавиться от дробных показателей.</div></div>"}, {"id": 13, "text": "<p>A solid sphere is perfectly inscribed in a right circular cylinder. The cylinder has a radius of 3 units and a height of 6 units.</p><p>Find the volume of the space inside the cylinder but outside the sphere.</p>", "image": "", "options": ["\\(6\\pi\\)", "\\(12\\pi\\)", "\\(15\\pi\\)", "\\(18\\pi\\)", "\\(20\\pi\\)"], "correct": 3, "verified": true, "src": "M33", "orig": "images/q-57f33fc7a3.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём цилиндра минус объём шара.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цилиндр: π · 9 · 6 = 54π.</li><li>Шар: <span class=\"fr\"><span>4</span><span>3</span></span>π · 27 = 36π.</li><li>54π − 36π = 18π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — неверные формулы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Остаток всегда ⅓ цилиндра: <span class=\"fr\"><span>54π</span><span>3</span></span> = 18π.</div></div>"}, {"id": 15, "text": "<p>Two right-angled triangles are joined together to make a quadrilateral PQRS, as shown in the diagram.</p><p>Given:</p><ul><li>\\(\\tan\\theta=4/3\\)</li><li>\\(\\sin\\phi=7/9\\)</li></ul><p>Find the ratio of length PQ : length PS</p>", "image": "images/q-4c7c609717.jpg", "options": ["27:28", "4:7", "28:45", "20:63", "27:35", "36:35", "12:7"], "correct": 4, "verified": true, "src": "M33", "review": true, "orig": "images/q-4c7c609717.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем через общую сторону PR.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Треугольник PQR: tg θ = <span class=\"fr\"><span>QR</span><span>PQ</span></span> = <span class=\"fr\"><span>4</span><span>3</span></span> → PQ = 3t, QR = 4t, PR = 5t.</li><li>Треугольник PSR: sin φ = <span class=\"fr\"><span>PS</span><span>PR</span></span> = <span class=\"fr\"><span>7</span><span>9</span></span> → PS = <span class=\"fr\"><span>35t</span><span>9</span></span>.</li><li>PQ : PS = 3 : <span class=\"fr\"><span>35</span><span>9</span></span> = 27 : 35.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — перепутаны стороны или функции.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Общая сторона двух треугольников — мост между ними.</div></div>", "topic": "M5.18"}, {"id": 16, "text": "<p>Find</p><p>\\(\\dfrac{3\\sqrt{8}+2\\sqrt{18}}{\\sqrt{2}}\\)</p>", "image": "", "options": ["5", "12", "15", "20", "25"], "correct": 1, "verified": true, "src": "M33", "orig": "images/q-c8d580b9f0.jpg", "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем корни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3√8 = 3 · 2√2 = 6√2.</li><li>2√18 = 2 · 3√2 = 6√2.</li><li>12√2 ÷ √2 = 12.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — неверное упрощение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √8 = 2√2, √18 = 3√2.</div></div>"}, {"id": 17, "text": "<p>If an arc with a length of \\(6\\pi\\) is 1/4 of the circumference of a circle, what is the shortest distance between the endpoints of the arc?</p>", "image": "", "options": ["6", "\\(6\\sqrt{2}\\)", "12", "\\(12\\sqrt{2}\\)", "24"], "correct": 3, "verified": true, "src": "M33", "orig": "images/q-2bd34c77c3.jpg", "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Хорда четверти окружности — гипотенуза равнобедренного прямоугольного треугольника из радиусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Окружность 4 · 6π = 24π → r = 12.</li><li>Хорда = r√2 = 12√2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (12) — радиус.</li><li>E (24) — диаметр.</li><li>A, B — неверный радиус.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол 90° между радиусами.</div></div>"}, {"id": 18, "text": "<p>In a parallelepiped, d is the distance from vertex F to vertex G. The base is square, and the height is twice the width. What is the volume of the solid in terms of d?</p>", "image": "images/q-a3ccf10f60.jpg", "options": ["\\(12d^3\\sqrt{6}\\)", "\\(10d^3\\sqrt{5}\\)", "\\(6d^3\\sqrt{2}\\)", "\\(2d^3\\sqrt{5} * \\frac{1}{5}\\)", "\\(\\frac{d^3\\sqrt{6}}{18}\\)"], "correct": 4, "verified": true, "src": "M33", "orig": "images/q-a3ccf10f60.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">FG — пространственная диагональ параллелепипеда w × w × 2w.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d² = w² + w² + (2w)² = 6w² → w = <span class=\"fr\"><span>d</span><span>√6</span></span>.</li><li>V = w · w · 2w = 2w³ = <span class=\"fr\"><span>2d³</span><span>6√6</span></span> = <span class=\"fr\"><span>d³</span><span>3√6</span></span>.</li><li><span class=\"fr\"><span>d³</span><span>3√6</span></span> = <span class=\"fr\"><span>d³√6</span><span>18</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — огромные коэффициенты.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пространственная диагональ: √(a² + b² + c²).</div></div>"}, {"id": 19, "text": "<p>Using the physics-based formula for kinetic energy related to momentum,</p><p>\\(K = \\frac{p^2}{2m}\\)</p><p>Calculate the value of p when:</p><p>\\(m = 4 * 10^2\\)</p><p>\\(K = 1.8 * 10^7\\)</p>", "image": "", "options": ["1.2 * 10\\(^4\\)", "1.2 * 10\\(^5\\)", "1.44 * 10\\(^9\\)", "1.44 * 10\\(^{10}\\)"], "correct": 1, "verified": true, "src": "M33", "review": true, "orig": "images/q-2450775446.jpg", "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">p² = 2mK.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 400 · 1,8 · 10⁷ = 1440 · 10⁷ = 1,44 · 10¹⁰.</li><li>p = √(1,44 · 10¹⁰) = 1,2 · 10⁵.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка в степени.</li><li>C, D — забыли корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √10¹⁰ = 10⁵.</div></div>"}, {"id": 20, "text": "<p>In the prism, the bases of the right uniform solid are triangles with sides of lengths 5, 12, and 13. If the surface area of the solid is 360, what is the volume?</p>", "image": "images/q-0c73bbf196.jpg", "options": ["30", "180", "300", "600", "780"], "correct": 2, "verified": true, "src": "M33", "orig": "images/q-0c73bbf196.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание — прямоугольный треугольник 5-12-13.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь основания ½ · 5 · 12 = 30.</li><li>Поверхность: 2 · 30 + 30h = 360 → h = 10.</li><li>V = 30 · 10 = 300.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (600) — забыли ½.</li><li>B (180), A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Боковая поверхность призмы = периметр основания × высота.</div></div>"}, {"id": 21, "text": "<p>The ratio of DE to EF is 4 to 9. If DF = 2, what is the distance from D to the midpoint of EF?</p>", "image": "images/q-1309d99250.jpg", "options": ["9/13", "12/13", "14/13", "16/13", "17/13"], "correct": 4, "verified": true, "src": "M33", "orig": "images/q-1309d99250.jpg", "review": true, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим DF = 2 в отношении 4 : 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>DE = <span class=\"fr\"><span>4</span><span>13</span></span> · 2 = <span class=\"fr\"><span>8</span><span>13</span></span>; EF = <span class=\"fr\"><span>18</span><span>13</span></span>.</li><li>Середина EF на <span class=\"fr\"><span>9</span><span>13</span></span> дальше E.</li><li><span class=\"fr\"><span>8</span><span>13</span></span> + <span class=\"fr\"><span>9</span><span>13</span></span> = <span class=\"fr\"><span>17</span><span>13</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A <span class=\"fr\"><span>9</span><span>13</span></span> — только половина EF.</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение 4 : 9 → 13 частей.</div></div>"}, {"id": 22, "text": "<p>The radius of Circle A is increased by 200 percent to create Circle B. If the radius of Circle B is then decreased by 50 percent to create Circle C, by what percent is the area of Circle B greater than the combined areas of Circle A and Circle C?</p>", "image": "", "options": ["25%", "80%", "125%", "177%"], "correct": 3, "verified": true, "src": "M33", "review": true, "orig": "images/q-065a3d71a9.jpg", "topic": "M3.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади ∝ r².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>+200% → r_B = 3r; −50% → r_C = 1,5r.</li><li>Площади ∝ 1, 9, 2,25.</li><li>9 / 3,25 ≈ 2,77 → B больше на ≈ 177%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (125%) — неверный радиус B (2r).</li><li>A, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Increased by 200%» = ×3, а не ×2.</div></div>"}, {"id": 23, "text": "<p>For a certain integer n, the expressions</p><p>\\(9n+20\\) and \\(6n+14\\)</p><p>have a common factor greater than 1.</p><p>What is the only possible value of this common factor?</p>", "image": "", "options": ["2", "3", "4", "5"], "correct": 0, "verified": true, "src": "M33", "review": true, "orig": "images/q-320a26b604.jpg", "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий делитель делит любую линейную комбинацию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(9n + 20) − 3(6n + 14) = 40 − 42 = −2.</li><li>Значит, общий делитель делит 2 → только 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — не делят 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подберите коэффициенты, убирающие n.</div></div>"}, {"id": 24, "text": "<p><strong>24 question</strong></p><p>In a triangle, the three interior angles are x, y, and z. It is given that:</p><ul><li>\\(x &gt; 110\\)</li><li>\\(y = z + 5\\)</li><li>z is an integer</li></ul><p>What is the greatest possible value of y?</p>", "image": "images/q-49048ce929.jpg", "options": ["35", "36", "37", "38", "39"], "correct": 2, "verified": true, "src": "M33", "orig": "images/q-49048ce929.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма углов 180°; x > 110 ограничивает y + z.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y + z < 70 → 2z + 5 < 70 → z < 32,5.</li><li>z целое ≤ 32 → y ≤ 37.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D, E — нарушают x > 110.</li><li>A, B — не наибольшие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство + целое → округлить вниз.</div></div>"}, {"id": 25, "text": "<p>In the Figure, the perimeter of the isosceles trapezoid WXYZ is 62. If ZY = 7 and WX = 25, what is the length of diagonal WY?</p>", "image": "images/q-97d6213d5b.jpg", "options": ["15", "17", "20", "25", "26"], "correct": 2, "verified": true, "src": "M33", "orig": "images/q-97d6213d5b.jpg", "review": true, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим боковые стороны, высоту, затем диагональ через Пифагора.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Боковые: <span class=\"fr\"><span>62 − 25 − 7</span><span>2</span></span> = 15.</li><li>Свес: <span class=\"fr\"><span>25 − 7</span><span>2</span></span> = 9 → высота √(225 − 81) = 12.</li><li>По горизонтали от W до Y: 9 + 7 = 16.</li><li>WY = √(16² + 12²) = 20.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (15) — боковая сторона.</li><li>D, E, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проекция диагонали = свес + меньшее основание.</div></div>"}, {"id": 26, "text": "<p>Simplify \\(\\left(\\frac{9^{x+1} * 3^{2x-1}}{27^x}\\right)^{1/2}\\)</p>", "image": "", "options": ["\\(3^{0.5x+0.5}\\)", "\\(3^{0.5x-0.5}\\)", "\\(3^{0.5x}\\)", "\\(3^{0.005x}\\)"], "correct": 0, "verified": true, "src": "M33", "review": true, "orig": "images/q-d0bd5b908e.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всё к основанию 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9<sup>x+1</sup> = 3<sup>2x+2</sup>; 27<sup>x</sup> = 3<sup>3x</sup>.</li><li>3<sup>2x+2</sup> · 3<sup>2x−1</sup> / 3<sup>3x</sup> = 3<sup>x+1</sup>.</li><li>Корень: 3<sup>(x+1)⁄2</sup> = 3<sup>0,5x + 0,5</sup>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Степени: складываем при умножении, вычитаем при делении.</div></div>"}, {"id": 27, "text": "<p>A cyclist travels a route in two parts. On each part, the cyclist can ride at either 12 m/s or 8 m/s.</p><ul><li>If the cyclist rides the first part at 12 m/s and the second part at 8 m/s, the total time is 140 s.</li><li>If the cyclist rides the first part at 8 m/s and the second part at 12 m/s, the total time is 130 s.</li></ul><p>Find the total length of the route.</p>", "image": "", "options": ["1000 m", "1200 m", "1296 m", "1304 m"], "correct": 2, "verified": true, "src": "M33", "review": true, "orig": "images/q-087931842f.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем уравнения — получаем сумму длин сразу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>a</span><span>12</span></span> + <span class=\"fr\"><span>b</span><span>8</span></span> = 140; <span class=\"fr\"><span>a</span><span>8</span></span> + <span class=\"fr\"><span>b</span><span>12</span></span> = 130.</li><li>(a + b)<span class=\"fr\"><span>1</span><span>12</span></span> + <span class=\"fr\"><span>1</span><span>8</span></span> = 270.</li><li>(a + b) · <span class=\"fr\"><span>5</span><span>24</span></span> = 270 → a + b = 1296 м.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — неверная сумма коэффициентов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Симметричная система → сложение уравнений.</div></div>"}, {"id": 28, "text": "<p>The height of cone A is 8 cm, and the height of a similar cone B is 12 cm. The volume of cone A is 256 cm\\(^3\\).</p><p>Calculate the volume of cone B, in cm\\(^3\\).</p>", "image": "", "options": ["500", "650", "735", "864", "913"], "correct": 3, "verified": true, "src": "M33", "orig": "images/q-28c7df7bba.jpg", "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объёмы подобных тел ∝ кубу коэффициента подобия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>12</span><span>8</span></span> = 1,5 → k³ = 3,375.</li><li>256 · 3,375 = 864.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — использовали k или k².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длины ×k, площади ×k², объёмы ×k³.</div></div>"}, {"id": 29, "text": "<p>Points P and Q are given as: P(1,4) and Q(5,8).</p><p>Find the distance between points P and Q.</p>", "image": "", "options": ["4", "\\(4\\sqrt{2}\\)", "2", "\\(2\\sqrt{2}\\)"], "correct": 1, "verified": true, "src": "M33", "review": true, "orig": "images/q-ac4f136264.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Формула расстояния.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δx = 4, Δy = 4.</li><li>d = √32 = 4√2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только Δx.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √32 = √(16 · 2) = 4√2.</div></div>"}, {"id": 30, "text": "<p>An increase in speed of 6 km/h on a journey of 45 km reduces the time taken by 3 hours. Find the approximation original speed.</p>", "image": "", "options": ["7 km/h", "9 km/h", "11 km/h", "13 km/h", "15 km/h"], "correct": 0, "verified": true, "src": "M33", "orig": "images/q-b2cd4dff20.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разница во времени 3 часа.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>45</span><span>v</span></span> − <span class=\"fr\"><span>45</span><span>v + 6</span></span> = 3 → 270 = 3v(v + 6).</li><li>v² + 6v − 90 = 0 → v = −3 + √99 ≈ 6,95 ≈ 7 км/ч.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — разница во времени не 3 ч (например, при 9: 5 − 3 = 2 ч).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Здесь подставлять варианты и сравнивать разницу времени — быстрее.</div></div>"}, {"id": 31, "topic": "M4.10", "text": "<p>Find the equation of the straight line through \\((-1, 4)\\) and \\((1, 0)\\).</p>", "image": "", "options": ["\\(y = 2x + 6\\)", "\\(y = -2x - 2\\)", "\\(y = -2x + 2\\)", "\\(y = -\\tfrac{1}{2}x + \\tfrac{7}{2}\\)", "\\(y = -2x + 4\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Градиент m = Δy/Δx, затем подставьте точку.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m = −2.</li><li>c = 4 − −2·(−1) = 2. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка в знаке градиента.</li><li>D — градиент перевёрнут (Δx/Δy).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте вторую точку подстановкой.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.12", "text": "<p>A rectangle is 20 cm long and 9 cm wide, both measured to the nearest centimetre.</p><p>What is the upper bound of its area?</p>", "image": "", "options": ["165.75 cm²", "180 cm²", "184.5 cm²", "194.75 cm²", "210 cm²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верхняя граница произведения = верхняя × верхняя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Границы: 20,5 и 9,5 см.</li><li>20,5 · 9,5 = 194,75 см². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это нижняя граница.</li><li>B — это значение без учёта точности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> До ближайшего целого — это ±0,5.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
