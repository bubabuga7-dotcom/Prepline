<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m021_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание 5 × 5, высота = объём / площадь основания.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>h = <span class=\"fr\"><span>100</span><span>25</span></span> = 4.</li><li>Два основания: 2 · 25 = 50.</li><li>Четыре боковые грани: 4 · 5 · 4 = 80.</li><li>Итого 130.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — неверная высота.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь поверхности — все 6 граней.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m021_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Без краски — внутренний куб (5 − 2)³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3³ = 27.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно сняли слой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слой снимается с обеих сторон.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m021_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего кубиков 4 · 4 · 4 = 64. Не касаются коробки — внутренние, кроме открытого верха.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не касаются: 2 · 2 по горизонтали и 3 слоя по высоте (верхний слой касается только сверху — там крышки нет) → 12.</li><li>64 − 12 = 52.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — все кубики.</li><li>B, D — не учли открытый верх.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Открытый верх — верхний слой не касается крышки.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m021_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём = площадь сечения ступенек × ширина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сечение: три столбика глубиной <span class=\"fr\"><span>5</span><span>3</span></span> и высотой 0,2, 0,4, 0,6 → <span class=\"fr\"><span>5</span><span>3</span></span> · 1,2 = 2 м².</li><li>V = 2 · 6 = 12 м³.</li><li>Масса: 12 · 130 = 1560 кг.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный объём.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Плотность × объём = масса.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m021_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">sin(90° − α) = cos α.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin 50° = cos 40° = a.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 90 − a не имеет смысла.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дополнительные углы.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m021_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">cos(90° − θ) = sin θ, sin(90° − θ) = cos θ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin θ + sin θ + cos θ + cos θ = 2(sin θ + cos θ).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные формулы приведения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формулы дополнительного угла.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m021_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три диаметра малых кругов = диаметр большого.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r = 3 → 3 · 6 = 18 → R = 9.</li><li>81π.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный радиус.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 9π → r = 3.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m021_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC — диаметр → ∠B = 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AC = 2, AB = 1 → cos A = ½ → 60°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Катет = половина гипотенузы → 60° у этого катета.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m021_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дуга равностороннего треугольника — треть окружности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r = 6 → C = 12π.</li><li><span class=\"fr\"><span>12π</span><span>3</span></span> = 4π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центральный угол 120°.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m021_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касательная ⊥ радиусу BC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = 8, BC = 4.</li><li>AC = √(64 − 16) = 4√3.</li><li>S = ½ · 4 · 4√3 = 8√3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прямой угол при C.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m021_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр (−2; −4), r = 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I ✗ — знаки.</li><li>II: расстояние до оси x = 4 ≠ 2 ✗.</li><li>III: расстояние до оси y = 2 = r ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — включают ложные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x + 2) → центр x = −2.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m021_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AB ∥ CD → треугольники ABE и DCE подобны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>BE</span><span>CE</span></span> = <span class=\"fr\"><span>4</span><span>3</span></span>.</li><li>AB = 6 · <span class=\"fr\"><span>4</span><span>3</span></span> = 8.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная пропорция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Накрест лежащие углы равны.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m021_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота к основанию делит его пополам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>h = √(25 − 16) = 3.</li><li>S = ½ · 8 · 3 = 12.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3-4-5.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m021_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два параллелограмма и подобие треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>GH ∥ AB → треугольник GHC подобен ABC: AB : BC = GH : HC = 5 : 10 = 1 : 2.</li><li>Треугольник GEF тоже подобен ABC: GE = 2 → EF = 4 → DF = 5.</li><li>Треугольник ADF подобен ABC: AD = <span class=\"fr\"><span>DF</span><span>2</span></span> = 2,5.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные соответствия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Параллельные прямые → подобные треугольники.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m021_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20 − 8 &lt; p &lt; 20 + 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 &lt; p &lt; 28 → 13 … 27 → 15 чисел.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — включили концы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгие неравенства.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m021_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">BC — кратчайшая → ∠A — наименьший угол. Треугольник равнобедренный: ∠B = ∠C.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠A &lt; ∠B = <span class=\"fr\"><span>180 − ∠A</span><span>2</span></span> → ∠A &lt; 60.</li><li>Наибольшее кратное 10: 50 → ∠B = 65°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (60°) — тогда треугольник равносторонний.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Против меньшей стороны — меньший угол.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m021_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разница высот 8, расстояние 15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(64 + 225) = 17.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 8-15-17.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m021_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим верхнее основание через треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сдвиг: √(625 − 576) = 7.</li><li>Верх: 35 − 7 = 28.</li><li>P = 35 + 24 + 28 + 25 = 112.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный верх.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 7-24-25.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m021_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стороны прямоугольника — гипотенузы равнобедренных прямоугольных треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>WZ = √2 (катеты 1 и 1).</li><li>WX = 2√2 (катеты 2 и 2).</li><li>P = 2(√2 + 2√2) = 6√2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Катеты 1 и 3 − 1 = 2.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m021_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон <span class=\"fr\"><span>−3</span><span>4</span></span> → треугольник 3-4-5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB — гипотенуза 15 → вертикальный катет 15 · <span class=\"fr\"><span>3</span><span>5</span></span> = 9.</li><li>B на оси y ниже нуля: n = −9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный катет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Параллельные прямые — одинаковый наклон.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m021_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ квадрата 2 → сторона √2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r = <span class=\"fr\"><span>√2</span><span>2</span></span> → S = <span class=\"fr\"><span>π</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — r = ½.</li><li>C — r = 1.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный круг: d = сторона.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m021_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">k — внешний угол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Внутренний угол слева: 180 − 140 = 40.</li><li>j = 180 − 50 − 40 = 90.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смежные углы — 180°.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m021_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма углов 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + y + (x + y) = 180 → x + y = 90.</li><li>y = 50.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте x = 40.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m021_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верхний треугольник даёт верхний угол; затем большой треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Верхний угол: 180 − 70 − 30 = 80.</li><li>a + b = 180 − 80 = 100.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Общий угол у двух треугольников.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m021_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Смежные углы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 40 + x = 180 → x = 70.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Развёрнутый угол.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m021_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внутренний угол шестиугольника 120°; в прямоугольном треугольнике.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вертикаль отсекает от угла 120° прямой угол 90°.</li><li>x = 120 − 90 = 30.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол правильного шестиугольника 120°.</div></div>"}, {"id": 31, "topic": "M2.3", "text": "<p>Write 1800 as a product of its prime factors.</p>", "image": "", "options": ["\\(2^{4} \\times 3 \\times 5^{2}\\)", "\\(2^{3} \\times 3^{2} \\times 5^{2}\\)", "\\(2^{3} \\times 3^{2} \\times 5^{3}\\)", "\\(72 \\times 25\\)", "\\(2^{2} \\times 3^{3} \\times 5^{2}\\)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делите на 2, пока делится, затем на 3, затем на 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1800 = 2<sup>3</sup> · 3<sup>2</sup> · 5<sup>2</sup>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — произведение не равно 1800.</li><li>C — лишняя пятёрка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте: перемножьте ответ обратно.</div></div>", "src": "PL"}, {"id": 32, "topic": "M3.6", "text": "<p>5 workers can paint a school in 12 days.</p><p>How long would 4 workers take, working at the same rate?</p>", "image": "", "options": ["9.6 days", "13 days", "15 days", "17 days", "60 days"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше рабочих — меньше дней: объём работы w·d постоянен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 12 = 60 человеко-дней.</li><li>60 : 4 = 15 дней. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посчитали как прямую пропорцию.</li><li>B — вычли разницу в рабочих.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала проверьте: прямая или обратная пропорция?</div></div>", "src": "PL"}, {"id": 33, "topic": "M2.9", "text": "<p>Write 0.\\(\\dot{5}\\) as a fraction in its simplest form.</p>", "image": "", "options": ["\\(\\dfrac{5}{99}\\)", "\\(\\dfrac{1}{18}\\)", "\\(\\dfrac{1}{2}\\)", "\\(\\dfrac{5}{9}\\)", "\\(\\dfrac{3}{5}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножьте на 10ⁿ (n — длина периода) и вычтите.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 0,555…, 10x = 5,55…</li><li>9x = 5 → x = <span class=\"fr\"><span>5</span><span>9</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это 0,0505…</li><li>B — это 0,055…</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период из k цифр → знаменатель из k девяток.</div></div>", "src": "PL"}, {"id": 34, "topic": "M4.16", "text": "<p>Solve \\(2x^{2} - 5x - 12 = 0\\).</p>", "image": "", "options": ["\\(x = -\\dfrac{2}{3}\\) or \\(x = 4\\)", "\\(x = -3\\) or \\(x = 4\\)", "\\(x = \\dfrac{3}{2}\\) or \\(x = -4\\)", "\\(x = -\\dfrac{3}{2}\\) or \\(x = -4\\)", "\\(x = -\\dfrac{3}{2}\\) or \\(x = 4\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разложите на множители.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² - 5x - 12 = (2x + 3)(x − 4).</li><li>x = −<span class=\"fr\"><span>3</span><span>2</span></span> или x = 4. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — дробь перевёрнута.</li><li>B — забыли разделить на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте корни подстановкой.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
