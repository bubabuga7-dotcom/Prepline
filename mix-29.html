<style>

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }

    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;

  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }

  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;

  @media (max-width: 480px) {

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m013_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим каждый вариант в обычную десятичную дробь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 67,5 · 10⁻³ = 0,0675.</li><li>B: 6,75 · 10⁻² = 0,0675; C: 0,675 · 10⁻¹ = 0,0675; E: 0,0000675 · 10³ = 0,0675.</li><li>D: 0,00675 · 10² = 0,675 ≠ 0,0675.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — все равны 0,0675.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Умножение на 10ⁿ сдвигает запятую на n знаков вправо.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m013_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вращение катетов даёт конусы. Катеты a &lt; b, площадь ½ab = 4 → ab = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вокруг длинного катета b: конус радиуса a, высоты b → ⅓πa²b = 16.</li><li>a²b = a · ab = 8a → ⅓π · 8a = 16 → a = <span class=\"fr\"><span>6</span><span>π</span></span>, b = <span class=\"fr\"><span>8</span><span>a</span></span> = <span class=\"fr\"><span>4π</span><span>3</span></span>.</li><li>Вокруг короткого катета: ⅓πb²a = ⅓π · 8b = ⅓π · 8 · <span class=\"fr\"><span>4π</span><span>3</span></span> = <span class=\"fr\"><span>32π²</span><span>9</span></span> ≈ 35,09.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (16,93), B, A, E — неверно найдены катеты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Используйте ab = 8, чтобы не решать систему напрямую.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m013_q03.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по Виета: x² − (a + b)x + ab = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>−(a + b) = 5, ab = 3.</li><li>x² + 5x + 3 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак у 5x.</li><li>E, B — знак у 3.</li><li>D, F — перепутаны коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус перед суммой корней — главная ловушка.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m013_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Полная поверхность 2πr² + 2πrh = объём πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Делим на πr: 2r + 2h = rh.</li><li>h(r − 2) = 2r → h = <span class=\"fr\"><span>2r</span><span>r − 2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак в знаменателе.</li><li>C, D, E — неверное преобразование.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полная поверхность — с двумя основаниями.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m013_q06.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим r в квадрат и перемножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r² = 9 · 10⁻⁶.</li><li>P = 2 · 9 · 10⁻⁶ · 2,5 · 10⁴ = 45 · 10⁻² = 4,5 · 10⁻¹.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — верно по значению, но не стандартная форма.</li><li>A, C, E — ошибка в r² или степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стандартная форма: 1 ≤ a &lt; 10.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m013_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Система: количество и сумма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + y = 50; 5x + 10y = 400.</li><li>5x + 10(50 − x) = 400 → 500 − 5x = 400 → x = 20.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (30) — это 10-тенговые монеты.</li><li>A, C, E — сумма ≠ 400.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 20 · 5 + 30 · 10 = 400 ✓.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m013_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема Пифагора: катет² = гипотенуза² − другой катет².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(6 + √5)² = 41 + 12√5.</li><li>(3 + 2√5)² = 29 + 12√5.</li><li>Разность 12 → 2√3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложили квадраты.</li><li>C — забыли корень.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 12√5 сокращаются — так задача и задумана.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m013_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S = ½ · катет · катет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(6 + √6)(4 − √6) = 24 − 6√6 + 4√6 − 6 = 18 − 2√6.</li><li>½ · (18 − 2√6) = 9 − √6.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знак у √6.</li><li>B, C, E — неверное раскрытие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √6 · √6 = 6.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m013_q10.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выписываем первые члены — последовательность периодична.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a₁ = 2; a₂ = 2 + (−1)¹ = 1; a₃ = 1 + (−1)² = 2; a₄ = 1 …</li><li>Члены чередуются: 2, 1, 2, 1, …</li><li>100 членов = 50 пар по 3 → 150.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (−4750) — в ключе, но не следует из условия.</li><li>B, D — неверный период.</li><li>E, F — формулы геометрической прогрессии здесь ни при чём.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте 4–5 первых членов — закономерность видна сразу. (Исходный ключ C — исправлено.)</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m013_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Заштрихованы круг и треугольник вместе; общая часть — сектор 45°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 8 · AB = 32 → AB = 8 → треугольник равнобедренный, ∠AOB = 45°.</li><li>Круг: 64π; треугольник: 32.</li><li>Внутри круга часть треугольника — сектор 45°: ⅛ · 64π = 8π (AB касается круга в A).</li><li>64π + 32 − 8π = 56π + 32.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — общая часть посчитана дважды.</li><li>B, D, E — неверный сектор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь объединения = сумма − пересечение.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m013_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанные углы, опирающиеся на одну дугу, равны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>φ равен вписанному углу, опирающемуся на ту же дугу, в треугольнике с углом 30°.</li><li>Угол 70° при пересечении хорд — внешний угол этого треугольника.</li><li>70° = 30° + φ → φ = 40°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — неверное соотношение углов.</li><li>E (987) — опечатка в скане.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = сумма двух несмежных внутренних.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m013_q14.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём = цилиндр + полушар.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цилиндр: πr²l.</li><li>Полушар: ⅔πr³.</li><li>Сумма: <span class=\"fr\"><span>πr²</span><span>3</span></span> · (3l + 2r).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — целый шар (4r).</li><li>C — потерян r при 2.</li><li>D — l без 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите <span class=\"fr\"><span>πr²</span><span>3</span></span> и проверьте скобку.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m013_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем степень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3ⁿ⁻² = 36 − 9 = 27 = 3³.</li><li>n − 2 = 3 → n = 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (3) — это n − 2.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают n, а не показатель.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m013_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре подряд: n, n + 1, n + 2, n + 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3n = 2(n + 3) → n = 6.</li><li>Наибольшее: 9.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (6) — наименьшее.</li><li>A, D, E — не удовлетворяют условию.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 3 · 6 = 18 = 2 · 9 ✓.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m013_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центры больших кругов образуют квадрат, малый круг — в центре.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4πr² = 36π → r = 3.</li><li>Сторона квадрата центров 6, диагональ 6√2.</li><li>Диагональ = 2r + d → d = 6√2 − 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — это радиус малого круга.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагональ проходит через центр малого круга.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m013_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исключаем z: выражаем его через y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x ∝ z²; y ∝ z⁻³ → z ∝ y<sup>−1⁄3</sup>.</li><li>x ∝ y<sup>−2⁄3</sup>.</li><li>Возводим в куб: x³ ∝ y⁻² → куб x обратно пропорционален квадрату y.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — x² ∝ y⁻³ даёт x ∝ y<sup>−3⁄2</sup>, а не y<sup>−2⁄3</sup>.</li><li>A, C, E — прямая пропорциональность: а при росте z x растёт, y падает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возводите в степень, чтобы показатели стали целыми. (Исходный ключ B — исправлено.)</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m013_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Строим треугольник: угол A, смежный с 130° и вертикальный с 8x + 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угол треугольника справа: 180° − 130° = 50°.</li><li>(3x − 6) + 50 + (8x + 4) = 180 → 11x = 132 → x = 12.</li><li>∠A = 3 · 12 − 6 = 30°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (12) — это x.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают угол, а не x.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m013_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем «A процентов от B» формулой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C = A · <span class=\"fr\"><span>B</span><span>100</span></span>.</li><li>C — это 1% от AB.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — означало бы C = AB.</li><li>B, C — неверная запись.</li><li>E — определяется.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «A% of B» = <span class=\"fr\"><span>AB</span><span>100</span></span>.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m013_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Целые стороны с периметром 10: 1 × 4 или 2 × 3. Выбираем тот, что даёт больше штук.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь листа 24 · 60 = 1440.</li><li>1 × 4: 24 ÷ 4 = 6 полос, по 60 штук → 360 (лист заполнен полностью).</li><li>2 × 3: максимум <span class=\"fr\"><span>1440</span><span>6</span></span> = 240.</li><li>Наибольшее — 360.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (240) — посчитали только прямоугольники 2 × 3.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Меньше площадь фигуры — больше штук, если она укладывается без остатка. (Исходный ключ C — исправлено.)</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m013_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">pᵠ = 1 с натуральными p, q возможно только при p = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p = 1 → q¹ = 4 − q → 2q = 4 → q = 2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 0 не натуральное.</li><li>B, D, E — не удовлетворяют q = 4 − q.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 в любой степени = 1.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m013_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена одной книги <span class=\"fr\"><span>x</span><span>20</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>70 · <span class=\"fr\"><span>x</span><span>20</span></span> = <span class=\"fr\"><span>7x</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — перевёрнуто.</li><li>B, C — неверно.</li><li>E — цена 70 книг по x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка смыслом: 70 книг дороже 20 → коэффициент больше 1.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m013_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем, существует ли каждый треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C: 4 + 2 &lt; 7 — нарушено неравенство треугольника.</li><li>B: стороны 1 и 1 равны, а противолежащие углы 10° и 20° — нет: противоречие.</li><li>E: стороны 2, 2, 3 — у такого равнобедренного угол не 60°.</li><li>A: тупой угол 120° лежит против стороны 5, но против тупого угла должна быть наибольшая сторона (6 &gt; 5).</li><li>D: 4, 5, 6 — неравенство выполнено, по трём сторонам треугольник единственный.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — противоречивые данные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Против большего угла — большая сторона.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m013_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вводим координаты: стороны w и h, wh = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P(<span class=\"fr\"><span>w</span><span>2</span></span>; 0), Q(w; <span class=\"fr\"><span>h</span><span>2</span></span>), T — середина RS: <span class=\"fr\"><span>w</span><span>4</span></span>; <span class=\"fr\"><span>3h</span><span>4</span></span>.</li><li>PQ = <span class=\"fr\"><span>w</span><span>2</span></span>; <span class=\"fr\"><span>h</span><span>2</span></span>, PT = <span class=\"fr\"><span>−w</span><span>4</span></span>; <span class=\"fr\"><span>3h</span><span>4</span></span>.</li><li>S = ½ |<span class=\"fr\"><span>w</span><span>2</span></span> · <span class=\"fr\"><span>3h</span><span>4</span></span> + <span class=\"fr\"><span>h</span><span>2</span></span> · <span class=\"fr\"><span>w</span><span>4</span></span>| = ½ · <span class=\"fr\"><span>wh</span><span>2</span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — неверные координаты T.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ не зависит от формы прямоугольника — можно взять квадрат 1 × 1.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m013_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Система по количеству и стоимости.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>t + c = 10; 8t + 12c = 104.</li><li>80 + 4c = 104 → c = 6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4) — это помидоры.</li><li>Остальные — сумма ≠ 104.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 4 · 8 + 6 · 12 = 104 ✓.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m013_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приравниваем объёмы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>⅓πx² · 2x = ⅔πx³.</li><li><span class=\"fr\"><span>4</span><span>3</span></span>πR³ = ⅔πx³ → R³ = <span class=\"fr\"><span>x³</span><span>2</span></span>.</li><li>R = x/∛2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — R³ = x³.</li><li>E — перевёрнуто.</li><li>C, D — без x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус должен содержать x — это сразу отсекает C и D.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m013_q28.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стороны кубов 2, √2, 1 (квадрат на серединах сторон грани имеет сторону <span class=\"fr\"><span>a</span><span>√2</span></span>).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площади граней: 4, 2, 1 → всего граней 6 · 7 = 42.</li><li>Каждое соединение прячет площадь меньшей грани дважды: 2 · 2 + 2 · 1 = 6.</li><li>42 − 6 = 36 см².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>F (42) — без спрятанных граней.</li><li>E (39) — вычли по одной грани.</li><li>A, B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-8.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m013_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² − (сумма)x + произведение = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 6x + 8 = 0 (корни 2 и 4).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — произведение −8.</li><li>B — сумма −8.</li><li>C, D — неверные сумма/произведение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак свободного члена = знак произведения. (Исходный ключ E — исправлено.)</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m013_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все пять чисел отрицательны (лежат левее 0), значит, все произведения положительны. Наибольшее — у двух самых больших по модулю.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>По рисунку: q ≈ −2,2; r ≈ −1,8; s ≈ −1,2; t ≈ −0,8; u ≈ 0.</li><li>Самые большие по модулю — q и r.</li><li>qr ≈ 4 — наибольшее.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (rs ≈ 2,2) — r и s ближе к нулю, чем q.</li><li>A, E — t близко к 0.</li><li>B — u ≈ 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус на минус — плюс; дальше от нуля — больше произведение. (Исходный ключ C — исправлено.)</div></div>"}];

  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

  const q = questions[state.idx];

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
