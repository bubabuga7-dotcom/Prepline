<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "ASM", "text": "<p>A company introduced a mandatory remote work policy, believing it would improve productivity and employee satisfaction. Initial reports showed an increase in output and fewer reported sick days. However, after six months, internal surveys revealed rising feelings of isolation and decreased collaboration among teams. The company still insists that the new policy is a net positive for both morale and performance.</p><p>Which one of the following is an underlying assumption of the company's position?</p>", "image": "", "options": ["Productivity is more important than collaboration in long-term success.", "Employees value flexibility more than social interaction.", "Remote work will eventually lead to cost savings.", "Feelings of isolation do not significantly reduce overall employee performance.", "Sick days are a reliable indicator of employee well-being."], "correct": 3, "src": "CRIT37", "orig": "images/q-4d10a718c5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Компания признаёт изоляцию, но считает политику успешной для производительности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если изоляция заметно не снижает работу людей. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — не обязательно.</li><li>C, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение снимает признанную проблему.</div></div>"}, {"id": 2, "topic": "PRIN", "text": "<p>A university has a policy of rejecting any research funding that comes from companies involved in environmentally harmful industries. A professor argued that even if the funding is used for neutral or beneficial projects, accepting it sends the wrong message and undermines the university's ethical standards.</p><p>Which of the following best illustrates the principle underlying the professor's argument?</p>", "image": "", "options": ["The source of financial support matters as much as its use.", "Universities should remain financially independent.", "Ethical research is always more expensive.", "Donations should be screened by a third party.", "Environmental damage should be reversed by those who caused it."], "correct": 0, "src": "CRIT37", "orig": "images/q-6b629d035f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Профессор: даже на хорошие цели «плохие» деньги брать нельзя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Принцип: важен не только способ использования денег, но и их источник. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — другие идеи.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перескажите довод одной фразой.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p>I am going on holiday and want to make camera only needs one battery and I know that a new battery will work the camera for between 10 and 12 hours. I plan to use the camera on at least 9 days of my holiday but no more than 12. On each day I will use the camera for between 5 and 7 hours.</p><p>What is the smallest number of batteries that I should take to make sure that I do not run out?</p>", "image": "", "options": ["6", "7", "8", "9", "10"], "correct": 3, "src": "CRIT37", "orig": "images/q-d34f82eb05.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Худший случай: 12 дней по 7 часов, батарея на 10 часов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 · 7 = 84 часа.</li><li>84 : 10 = 8,4 → 9 батарей. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не худший случай.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Чтобы точно хватило» = берите худший вариант.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p>The average weight of a particular group of people is 72.1 kg. The group is joined by Wilf and Zak. Which one of the following sets of information may not be sufficient to calculate the average weight of the new group including Wilf and Zak?</p>", "image": "", "options": ["The number of people in the original group and the combined weight of Wilf and Zak.", "The percentage increase in both total weight and total number of people when Wilf and Zak join.", "The total weight of the original group and the combined weight of Wilf and Zak.", "Wilf's and Zak's individual weights and the number of people in the original group heavier than each.", "All of them above."], "correct": 3, "src": "CRIT37", "orig": "images/q-97bbc35047.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чтобы найти новое среднее, нужны размер группы и общий вес новых людей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: известны веса Уилфа и Зака, но не размер исходной группы.</li><li>Без него среднее не найти. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — данных хватает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее = общий вес : число людей.</div></div>"}, {"id": 5, "topic": "WKN", "text": "<p>A city council claims that expanding public parks will reduce local crime. Their argument is based on a study showing that neighborhoods with more green space reported fewer thefts and assaults. The council plans to convert several unused lots into small community gardens and play areas.</p><p>Which of the following, if true, would most weaken the above argument?</p>", "image": "", "options": ["The neighborhoods with more green space also had higher incomes and better policing.", "Residents prefer shopping centers over parks.", "Most crimes in the city occur indoors.", "The number of parks has remained unchanged for a decade.", "Community gardens require frequent maintenance."], "correct": 0, "src": "CRIT37", "orig": "images/q-2af63fea07.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Совет связывает зелень и меньше преступлений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в зелёных районах ещё и доходы выше, и полиция лучше — причина может быть в этом. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не опровергают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p>John feeds the wild birds in his garden with bird seed placed in three feeders. Two of these containers have the same capacity, each holding 300 grams of seed, whilst the third feeder holds 900 grams of seed. His seed storage bin contains 18 kilograms of seed. Because more birds can visit the large container, it takes the same amount of time to become empty as the smaller ones, and all three containers have to be refilled every second day.</p><p>How many days will he be able to feed the birds for?</p>", "image": "", "options": ["20 days", "23 days", "24 days", "30 days", "33 days"], "correct": 2, "src": "CRIT37", "orig": "images/q-446d49bf83.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждые 2 дня нужно 300 + 300 + 900 = 1500 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18 000 : 1500 = 12 заправок.</li><li>12 · 2 дня = 24 дня. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 18 кг = 18 000 г.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p>Packaging for chocolates is in the form of a prism, as shown below. The prism is made by folding up card from a net.</p><p>Which one of the nets below will not fold into the prism?</p>", "image": "images/q-4ae97e761d.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 1, "src": "CRIT37", "review": true, "orig": "images/q-4ae97e761d.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три прямоугольника сворачиваются в трубку; треугольники должны закрыть её торцы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В B треугольники пристроены к верхнему и нижнему краю полосы — это не торцы трубки.</li><li>Такая развёртка не сложится. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — треугольники на торцах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Определите, вокруг какой оси сворачивается полоса.</div></div>"}, {"id": 8, "topic": "MC", "text": "<p>Surveys show that people who regularly volunteer are more likely to report higher levels of happiness and satisfaction with life. In one longitudinal study, those who volunteered weekly were significantly less likely to suffer from depression. Based on this, several public health officials have proposed that volunteering should be promoted as part of national mental health initiatives.</p><p>Which of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Volunteering leads to better mental health outcomes.", "People who are mentally healthy are more likely to volunteer.", "Public health policies ignore non-medical factors.", "Depression rates are higher in those who don't volunteer.", "Community engagement benefits both volunteers and recipients."], "correct": 0, "src": "CRIT37", "orig": "images/q-10b901e1f4.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — что предлагают чиновники и почему.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Волонтёрство улучшает психическое здоровье. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — обратная причина.</li><li>C, D, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предложение основано на этом выводе.</div></div>"}, {"id": 9, "topic": "EF", "text": "<p>The Dee Street car park in Tayforth has spaces for 40 cars. The charge for parking is a flat rate of 80 cents per hour, or part of an hour, but only applies from 8 am to 6 pm each day. Upon arrival, a driver must take a ticket from the machine at the entrance. When leaving, the driver has to insert the ticket into the machine at the exit, and pay the required amount of money, before the barrier will rise to allow departure. This machine will not give change. Clyde empties the machine at the exit at 9 pm every day. As was the case yesterday, there were no cars in the car park when he arrived this evening. He has just taken $357.20 out of the machine, despite the fact that 40 x 10 hours x 80 cents per hour = $320.</p><p>Which one of the following could not be a contributory factor to the day's income being greater than the apparent maximum?</p>", "image": "", "options": ["No car leaves before 9 am.", "Some cars arrive after 5 pm.", "Some cars leave less than an hour after arrival.", "Some drivers are not able to put the correct amount of money into the machine.", "All of them above."], "correct": 0, "src": "CRIT37", "orig": "images/q-3af5c88504.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доход выше $320 возможен, если места используются больше раз и люди переплачивают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C: короткие визиты — каждый платит за целый час, а место освобождается.</li><li>B: приезд после 17:00 — платят за неполный час.</li><li>D: без сдачи — переплата.</li><li>A: никто не уезжает до 9:00 — это уменьшает оборот, не может увеличить доход. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — могут увеличить доход.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите фактор, который не помогает.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p>Part of the bus timetable for journeys between Abbotsbury and Brenton is shown below.</p><table class=\"q-table\"><thead><tr><th>Abbotsbury (dep)</th><th>Brenton (arr)</th></tr></thead><tbody><tr><td>6.55 am</td><td>7.40 am</td></tr><tr><td>7.05 am</td><td>7.55 am</td></tr><tr><td>7.20 am</td><td>8.05 am</td></tr><tr><td>7.35 am</td><td>8.25 am</td></tr><tr><td>8.00 am</td><td>8.45 am</td></tr></tbody></table><p>Carol lives in Abbotsbury and works in Brenton. It takes her 20 minutes to walk from home to the bus stop in Abbotsbury and 15 minutes to walk from the bus stop in Brenton to her place of work. She works from 8.30 am to 5.15 pm.</p><p>What is the latest time she can leave her house in the morning to arrive at work on time?</p>", "image": "", "options": ["7.00 am", "7.05 am", "7.15 am", "7.20 am", "7.40 am"], "correct": 0, "src": "CRIT37", "orig": "images/q-aaa2bbb5fc.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работа с 8:30, от остановки 15 мин → автобус должен прибыть до 8:15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подходит автобус 7:20 (прибытие 8:05); 7:35 приходит в 8:25 — поздно.</li><li>До остановки 20 мин → выйти в 7:00. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — время отправления автобуса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Идите от конца назад.</div></div>"}, {"id": 11, "topic": "ASM", "text": "<p>When driving, if the car in front of you brakes suddenly, you need to be able to stop without crashing into it. The easiest ruleofthumb is the two second rule. You choose a reference point that the vehicle in front of you is passing then say aloud: 'Only a fool breaks the two second rule'. If you reach the reference point before you have finished the saying you need to pull back. This works at all speeds. However, when there are adverse road conditions or the road is narrow you need to double your braking distance. These practices will enable you to avoid such crashes.</p><p>Which one of the following is an underlying assumption of the argument above?</p>", "image": "", "options": ["Adopting the 'two second rule' will avoid all accidents.", "Most crashes are caused by cars running into the car in front.", "Those who do not use the rule do not value road safety.", "Some drivers brake more suddenly than others.", "It will not take less than two seconds to repeat the saying."], "correct": 4, "src": "CRIT37", "orig": "images/q-cb69ae3cf8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Правило: если не успел сказать фразу — слишком близко.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если на фразу уходит не меньше двух секунд. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно.</li><li>B, C, D — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение делает правило точным.</div></div>"}, {"id": 12, "topic": "FLAW", "text": "<p>Research reveals that, in a given period of the 20th century, top footballers (defined as those who had played for their country's team) lived, on average, almost 5 years longer than middle ranking footballers. We can conclude therefore that for the top footballers, success had a beneficial effect on their lifespan.</p><p>Which one of the following is the best statement of the flaw in the argument above?</p>", "image": "", "options": ["Life expectancy increased generally in the 20th century.", "It assumes that the longer lifespan could not be explained by other factors.", "Living longer is not necessarily a good thing.", "Playing football regularly may have health benefits which contribute to longer lifespan.", "The study was limited to footballers in a given period of time."], "correct": 1, "src": "CRIT37", "orig": "images/q-9180487fb7.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: успех продлевает жизнь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разница могла быть из-за других причин (здоровье, деньги, отбор). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — частные причины.</li><li>C, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"}, {"id": 13, "topic": "MC", "text": "<p>Despite much opposition to the idea, modern musical trends such as hiphop have a place in the world of opera. Traditional opera is a powerful musical experience. However, modern musicians should not necessarily stick with the traditional form. Modern musical forms which fuse staged drama, singing and contemporary or ethnic trends in music are also powerful musical experiences. Glydebourne's youth operas 'Misper' and 'Zoe', and its Mozart hiphopera, 'School 4 Lovers', enjoyed critical and box office success and attracted hiphop audiences. Moving away from the snobbery of tradition gives a much wider audience access to transformative musical experience.</p><p>Which one of the following best expresses the main conclusion of the passage?</p>", "image": "", "options": ["Creating new operatic performances allows more people to access this exciting art form.", "Contemporary music forms have a place in performances of opera.", "Musicians are entitled to fuse new forms and old to create exciting musical experiences.", "Hiphop is as powerful and dramatic as opera.", "Contemporary music has a place in the musical world in addition to traditional operatic performances."], "correct": 1, "src": "CRIT37", "orig": "images/q-58d7546fcd.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — первая фраза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Современные музыкальные формы имеют место в опере. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — доводы или слишком широко.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Despite much opposition…» — тезис.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p>Sally owns a small business which produces handcrafted jewellery. The materials used to create a necklace cost €1.50 on average. She pays her staff €5.40 an hour. For a standard piece of jewellery she charges 70% more than it costs to produce. To make a particular Italian style glass necklace it takes 30 minutes.</p><p>How much does she sell this single necklace for?</p>", "image": "", "options": ["€11.73", "€2.94", "€7.14", "€11.34", "€5.40"], "correct": 2, "src": "CRIT37", "orig": "images/q-b3fcff95e1.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Себестоимость = материалы + работа.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,50 + 5,40 · 0,5 = 4,20 €.</li><li>Наценка 70%: 4,20 · 1,7 = 7,14 €. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без работы.</li><li>E — почасовая ставка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 30 минут = половина часа.</div></div>"}, {"id": 15, "topic": "WKN", "text": "<p>There is concern at the moment about the way in which football referees are treated by players during games. The Football Association and the Referees' Association feel that there is too much verbal (and physical) abuse directed at referees. Various solutions have been suggested such as only allowing the captain of each team to approach and talk to the referee. The major difficulty is how such new rules should be introduced. The preferred suggestion seems to be that the rules should be changed first in the amateur game, the aim being to improve discipline in the game from the bottom upwards, until the whole game is improved.</p><p>Which one of the following, if true, would most weaken the argument above?</p>", "image": "", "options": ["By introducing it first to amateur players, it reaches those who spend the least time playing football.", "Not many professional players start out in the amateur leagues.", "Amateur players are more likely to abuse referees than are professionals.", "Referees should use their existing powers to control abusive players.", "Referees in the amateur game are less proficient than those in the professional games."], "correct": 1, "src": "CRIT37", "orig": "images/q-73eb0e44f5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предложение: начать с любителей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если немногие профессионалы начинали в любительских лигах — улучшение «снизу» до них не дойдёт. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — частично.</li><li>C — усиливает.</li><li>D, E — не про план.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Механизм «снизу вверх» должен работать.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p>Tessa makes bracelets. She works five days each week, from Monday to Friday. Her contract requires her to make a minimum of 150 bracelets every working day, for which she is paid a basic wage of $320 per week. She can also earn a bonus of $3 per bracelet for every one above 175 that she makes on any particular day.</p><p>Last week, Tessa earned $515 in total. On Friday she made 205 bracelets, the most she has ever made in one day.</p><p>What is the minimum number of bracelets that Tessa made last week?</p>", "image": "", "options": ["940", "805", "890", "865", "815"], "correct": 2, "src": "CRIT37", "orig": "images/q-c79aeeaa66.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Премия: 515 − 320 = $195 → 65 браслетов сверх 175.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пятница: 205 → 30 сверх нормы. Остаётся 35 на другие дни.</li><li>Больше 205 в день нельзя → максимум 29 сверх (204).</li><li>Минимум: 205 + 204 + 181 + 150 + 150 = 890. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли ограничение 205.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минимум — дни без премии по 150.</div></div>"}, {"id": 17, "topic": "ASM", "text": "<p>A travel agency argues that offering virtual tours of popular destinations will increase future bookings. They believe that once potential customers see the beauty and culture of a place—even on screen—they'll be more inclined to visit in person. Critics, however, argue that virtual experiences may satisfy curiosity without creating real travel interest.</p><p>Which one of the following is an assumption required by the travel agency's reasoning?</p>", "image": "", "options": ["Most people prefer virtual previews before making purchases.", "Virtual experiences do not replace the desire to travel.", "Critics of the policy have never used virtual tours.", "Customers book trips based on video quality.", "Seeing a place virtually creates no emotional attachment."], "correct": 1, "src": "CRIT37", "orig": "images/q-865ba6cca2.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Агентство: виртуальный тур → больше поездок.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если виртуальный тур не заменяет желание поехать. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — не нужны.</li><li>E — противоречит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение отвечает на возражение критиков.</div></div>"}, {"id": 18, "topic": "STR", "text": "<p>An online learning platform claims that its bite-sized video lessons help students retain information more effectively than traditional lectures. They point to student testimonials praising the format. Skeptics argue that testimonials are not reliable evidence and that students may simply prefer shorter content.</p><p>Which of the following, if true, would most strengthen the platform's claim?</p>", "image": "", "options": ["Students spend less time using the platform than in traditional classes.", "A controlled study showed higher test scores for students using the platform versus lecture-based learners.", "Most users of the platform are under age 25.", "Traditional lectures have existed for centuries.", "Bite-sized videos are easier to produce."], "correct": 1, "src": "CRIT37", "orig": "images/q-259a83a08d.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Скептики: отзывы ненадёжны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Контролируемое исследование с более высокими баллами — надёжное доказательство. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не про запоминание.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгие данные сильнее отзывов.</div></div>"}, {"id": 19, "topic": "PRIN", "text": "<p>A judge rules that a wealthy defendant should not receive a lighter sentence simply because they can afford better legal representation. She explains that fairness in sentencing requires that outcomes not be influenced by wealth or privilege.</p><p>Which of the following best illustrates the principle applied by the judge?</p>", "image": "", "options": ["The justice system must remain free of political influence.", "Equality before the law requires that outcomes depend on actions, not advantages.", "Legal representation should be publicly funded.", "Sentencing laws should be updated regularly.", "Only juries should decide sentencing outcomes."], "correct": 1, "src": "CRIT37", "orig": "images/q-aecf2d5b30.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Судья: приговор не должен зависеть от богатства.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Принцип: равенство перед законом — результат зависит от поступков, а не от преимуществ. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите общий принцип.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p>A golf tournament is played over 10 rounds, on successive Saturdays. The winner of each round scores 3 points and the player finishing second scores 1 point. The tournament is won by the competitor with the most points over the 10 rounds.</p><p>Alan Vinci, Barry Durand, Carl Johansson and Daniel and Eric Lim were the participants in this year's tournament. All five won at least one round, but either Barry, Daniel or Eric finished second on each occasion. The 12 finishing order was different every round, and the Lim brothers didn't both score points in the same round at any time.</p><p>Who won this year's tournament?</p>", "image": "", "options": ["Eric Lim", "Daniel Lim", "Barry Durand", "Carl Johansson", "Alan Vinci"], "correct": 2, "src": "CRIT37", "orig": "images/q-d381bf46b5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Логическая задача: каждый выиграл хотя бы раз; вторые места занимали только Барри, Дэниел или Эрик; братья не набирали очки в одном туре.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Перебор возможных распределений побед и вторых мест показывает, что больше всего очков у Барри. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — набирают меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с ограничений на вторые места.</div></div>"}, {"id": 21, "topic": "WKN", "text": "<p>In many countries shocking images of the damage smoking can do to the body are displayed on cigarette packets. Images of rotting teeth, mouth tumours and cancerous lungs are among the grim pictures. A review concluded that shocking pictures of the damage smoking can do are a cost effective way to help smokers to quit and discourage others from starting. All countries should introduce these kinds of images to discourage smoking.</p><p>Which one of the following, if true, most weakens the above argument?</p>", "image": "", "options": ["Pictures that arouse emotions are especially effective.", "Smokers are likely to die younger than nonsmokers.", "The USA is planning to display shocking images on cigarette packets.", "Governments receive a significant amount of revenue from taxes on tobacco products.", "In countries using the images there are high taxes on tobacco and a ban on advertising."], "correct": 3, "src": "CRIT37", "orig": "images/q-ad0548d885.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: картинки — дешёвый способ снизить курение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в странах с картинками ещё высокие налоги и запрет рекламы — снижение может быть из-за них. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — усиливает.</li><li>B, C, D — не опровергают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p>The owner of a hotel needs to decorate 20 rooms. He has found prices for four different types of interior wood paint and calculated the volume of paint he needs for each room. He will use the same type of paint for all the rooms.</p><table class=\"q-table\"><thead><tr><th>Type of paint</th><th>375 ml</th><th>750 ml</th><th>1.25 l</th><th>2.5 l</th><th>Volume needed per room</th></tr></thead><tbody><tr><td>Non Drip Gloss</td><td>€4.50</td><td>€8.00</td><td>€10.00</td><td>€16.00</td><td>1.4 litres</td></tr><tr><td>Satinwood</td><td>€5.00</td><td>€8.00</td><td>€11.00</td><td>€20.00</td><td>1.1 litres</td></tr><tr><td>Quick Dry Gloss</td><td>N/A</td><td>€10.00</td><td>N/A</td><td>€20.00</td><td>1.0 litres</td></tr><tr><td>Once Gloss</td><td>€4.50</td><td>€8.00</td><td>€12.00</td><td>€18.00</td><td>0.8 litres</td></tr></tbody></table><p>What is the least amount he needs to spend on paint?</p>", "image": "", "options": ["€116", "€120.", "€126", "€112", "€108"], "correct": 1, "src": "CRIT37", "orig": "images/q-965b451e73.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем самый дешёвый вариант для каждой краски.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Once Gloss: 20 · 0,8 = 16 л; 6 банок по 2,5 л (€108) + 1,25 л (€12) = €120.</li><li>Другие краски выходят дороже. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — меньше, чем нужно краски.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Берите большие банки — они дешевле за литр.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p>Last month Karl walked from Starton to Endham, raising money for charity. His target, successfully achieved, was to complete the walk in ten days. He started later than intended and had only completed 12 km by the end of the first day. However, he walked 45 km on each of the second, third and fourth days, and after the fifth day he was exactly half way. Poor weather on the sixth day restricted his progress, but 41 km on both the seventh and eighth days meant that he had completed exactly threequarters of the walk with two days left. On the ninth day he covered threefifths of the remaining distance, completing the last 36 km on the tenth day.</p><p>How far did Karl walk from Starton to Endham?</p>", "image": "", "options": ["360 km", "240 km", "328 km", "384 km", "294 km"], "correct": 0, "src": "CRIT37", "orig": "images/q-1ebcbd9a16.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последние два дня = четверть пути.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10-й день = <span class=\"fr\"><span>2</span><span>5</span></span> от четверти = <span class=\"fr\"><span>D</span><span>10</span></span> = 36 км.</li><li>D = 360 км. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — ключ ошибочен: проверка 360 км сходится со всеми условиями.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Идите от конца. (Исходный ключ C — исправлено.)</div></div>"}, {"id": 24, "topic": "PS", "text": "<p>There is a special offer on jars of coffee this week. Customers who buy two jars at the normal price have the option to buy up to four more jars at one quarter of the normal price.</p><p>For customers buying coffee this week, which of these bar graphs shows how the average cost per jar (as a percentage of the normal cost) varies with the number of jars bought?</p>", "image": "images/q-9daf6f233f.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 2, "src": "CRIT37", "review": true, "orig": "images/q-9daf6f233f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя цена банки при n банках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1–2 банки: 100%.</li><li>3: (200 + 25) : 3 = 75%; 4: 62,5%; 5: 55%; 6: 50%.</li><li>Это график C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ступенчатый.</li><li>E — другие значения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте каждую точку.</div></div>"}, {"id": 25, "topic": "ASM", "text": "<p>Smoking cigarettes causes a speeding up in the rate of blood flow, which in turn increases the risk of heart disease. It was thought that this speeding up of blood flow was caused solely by the gas carbon monoxide, which is absorbed during smoking, and not by nicotine, which is also absorbed from the smoke in the lungs. However, tests have shown that using nicotine patches (from which nicotine is absorbed through the skin) or chewing nicotine gum also causes the rate of blood flow to increase. This shows that the nicotine in cigarettes is also responsible for the increased risk of heart disease among smokers.</p><p>Which one of the following is not an assumption of the argument in the passage above?</p>", "image": "", "options": ["Any differences between the amount of nicotine absorbed from smoking and the amount absorbed from nicotine patches and chewing gum can be disregarded.", "Carbon monoxide is not absorbed from nicotine patches and nicotine chewing gum.", "Carbon monoxide would not produce a rise in the rate of blood flow in the absence of nicotine.", "The effect of nicotine on the body does not depend on the way in which it was absorbed.", "There is nothing else in nicotine patches and chewing gum which might cause an increase in the rate of blood flow."], "correct": 2, "src": "CRIT37", "orig": "images/q-fcafc798cd.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем то, что НЕ нужно для вывода.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод: никотин тоже ускоряет кровоток.</li><li>Нужны A, B, D, E — чтобы пластырь был честным сравнением.</li><li>C не нужно: вывод не требует, чтобы угарный газ сам по себе ничего не делал. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — нужные допущения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте каждое: рушится ли вывод без него.</div></div>"}, {"id": 26, "topic": "FLAW", "text": "<p>We constantly split our attention between the people we are with and what's happening on our mobile phone screens. Onscreen multitasking makes us less efficient as well as less emotionally engaged with others. It takes 64 seconds to recover our train of thought after interruption by a message (that's 8.5 hours a week wasted if we check our screens every five minutes) and when we've sent an email or SMS text message, the brain goes through a series of semiconscious calculations as we wonder when and how the recipient will reply. The result is that we're not 'present' for several minutes afterwards. In order to function effectively in the workplace, we need to switch off our communication hardware.</p><p>Which one of the following is the best statement of the flaw in the above argument?</p>", "image": "", "options": ["People may be unwilling to make less use of their mobile phones.", "We may need to have some 'down time' in order to recharge our mental batteries.", "In many work environments you may not be allowed to use personal mobile phones.", "Without the means to send and receive information instantly, our effectiveness may be compromised.", "It may only be the younger workers who use mobile phone technology to excess."], "correct": 3, "src": "CRIT37", "orig": "images/q-68b25a1ff5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: нужно выключить телефоны, чтобы работать эффективно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но без мгновенной связи работа тоже может пострадать. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — не про логику.</li><li>B — не против вывода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите вред от предложенного решения.</div></div>"}, {"id": 27, "topic": "CON", "text": "<p>If for a number of hours each day you're having experiences on the computer where there are no consequences, that may have an implication for antisocial behaviour. In real life you can't undo something; you can't bring someone back to life once you've stabbed them. On a computer you can play the game again. It may be that for people who spend most of their time playing computer games involving killing others, real bleeding to death has no meaning. Studies of brain activity show that there is less prefrontal cortex activity in the brains of screen obsessed teenagers than in the brains of those who spend little time on computer games. The pre-frontal cortex area of the brain is where we process ideas of sequence, consequences and empathy.</p><p>Which one of the following can be drawn as a conclusion of the passage above?</p>", "image": "", "options": ["Brain structure is altered by environmental factors.", "People who spend a lot of time playing computer games are the main culprits in knife crime.", "There may be a link between use of computer games and violence.", "Young people cannot distinguish the difference between fantasy and reality.", "Computer games should not be available for children under 18 years of age."], "correct": 2, "src": "CRIT37", "orig": "images/q-0991c252f8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Текст осторожный: «may», «may be».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Может существовать связь между играми и насилием. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод.</div></div>"}, {"id": 28, "topic": "MC", "text": "<p>If the media give publicity to certain types of crime, it may encourage criminals to carry out 'copy cat' offences. If, however, they were forbidden to divulge details of crimes, this would amount to censorship. The freedom of speech of the media is too important to sacrifice, so the media should be free to report crime even if this means some crimes are committed which would not otherwise be committed.</p><p>Which one of the following expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Publicity about crimes can encourage others to commit similar offences.", "Censorship of the media would reduce the crime rate.", "The media should be permitted to report crimes even if other crimes sometimes result from this reporting.", "The media should not report all the details of a crime.", "Freedom of speech is a right that is too important to give up."], "correct": 2, "src": "CRIT37", "orig": "images/q-eb6c59c8cd.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — после «so».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>СМИ должны сообщать о преступлениях, даже если иногда это вызывает новые. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — посылки.</li><li>B, D — противоречат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «So…» — вывод.</div></div>"}, {"id": 29, "topic": "PS", "text": "<p>The diagram below shows the layout of a game playing board with the square board numbered as indicated. The numbers on the board start with 1 on the bottom left and finish with 25 at the top right.</p><table class=\"q-table\"><thead><tr><th>21</th><th>22</th><th>23</th><th>24</th><th>25</th></tr></thead><tbody><tr><td>20</td><td>19</td><td>18</td><td>17</td><td>16</td></tr><tr><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td></tr><tr><td>10</td><td>9</td><td>8</td><td>7</td><td>6</td></tr><tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></tbody></table><p>A larger, square playing board is numbered in a similar way and divided into pieces which fit together to make the whole board. One piece of this larger board is shown below:</p><table class=\"q-table\"><thead><tr><th>27</th><th>26</th><th></th></tr></thead><tbody><tr><td>16</td><td>17</td><td>18</td></tr><tr><td></td><td>12</td><td></td></tr></tbody></table><p>How many squares are there on this larger board?</p>", "image": "", "options": ["49", "81", "25", "121", "64"], "correct": 0, "src": "CRIT37", "orig": "images/q-975968d961.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нумерация «змейкой». Над 17 стоит 26, над 16 — 27.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Для доски 7 × 7: 3-й ряд — 15…21 вправо, 4-й ряд — 28…22 влево.</li><li>Над 16 — 27, над 17 — 26; под 17 — 12. Всё сходится.</li><li>7 · 7 = 49. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные размеры не дают такие числа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте соседей по вертикали.</div></div>"}, {"id": 30, "topic": "WKN", "text": "<p>A local mayor claims that installing more streetlights will reduce crime in poorly lit areas. This decision is based on a correlation between low lighting and higher crime rates. However, some community leaders argue that deeper social factors are at play.</p><p>Which of the following, if true, would most weaken the mayor's argument?</p>", "image": "", "options": ["Most crimes occur in broad daylight.", "Some areas already have sufficient lighting.", "Streetlight installation is costly.", "Crime fluctuates regardless of lighting.", "Citizens often feel safer in well-lit spaces."], "correct": 0, "src": "CRIT37", "orig": "images/q-5bc8c75189.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мэр: больше фонарей → меньше преступлений ночью.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если большинство преступлений происходит днём — фонари мало помогут. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — не опровергают.</li><li>D — частично.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что мера не попадает в проблему.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
