<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Solve the equation for x: \\(x^3 + 3x^2 + 2x + 6 = 0\\)</p>", "image": "", "options": ["-1", "-2", "-3", "-4", "-6"], "correct": 2, "verified": true, "src": "M40", "orig": "images/q-37775e16e8.jpg", "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Группировка: выносим общие множители парами.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x²(x + 3) + 2(x + 3) = (x + 3)(x² + 2).</li><li>x² + 2 > 0 всегда → единственный корень x = −3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — подстановка не даёт 0 (например, x = −2: −8 + 12 − 4 + 6 = 6).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 слагаемых → пробуйте группировку 2 + 2.</div></div>"}, {"id": 2, "text": "<p>In the figure below, points A, B, C, and D lie on a circle. The chords AC and BD intersect at point E.  If angle ABD = 30° and angle BAC = 45°, what is the size of angle AED?</p>", "image": "images/q-89d2d89aae.jpg", "options": ["75°", "80°", "90°", "105°", "120°"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-89d2d89aae.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем в треугольнике ABE; ∠AED — смежный с ∠AEB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠BAE = 45°, ∠ABE = 30° → ∠AEB = 105°.</li><li>∠AED = 180° − 105° = 75°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (105°) — это ∠AEB.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Хорды пересекаются → смежные углы в сумме 180°.</div></div>"}, {"id": 3, "text": "<p>For what values of k does the equation \\(2x^2 - 4x + k = 0\\) have real and distinct roots?</p>", "image": "", "options": ["\\(k = 2\\)", "\\(k &lt; 2\\)", "\\(k &gt; 2\\)", "\\(k &lt; -2\\)", "\\(k &gt; -2\\)"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-dfef09645c.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Различные действительные корни ⇔ D > 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D = 16 − 8k > 0 → k < 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — D = 0 (совпадающие корни).</li><li>C — нет корней.</li><li>D, E — неверная граница.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Distinct» — строго больше нуля.</div></div>"}, {"id": 4, "text": "<p>Rearrange the formula to make k the subject: \\(w = \\sqrt{\\dfrac{k+m}{k-m}}\\)</p>", "image": "", "options": ["\\(m\\left(\\dfrac{w^2+1}{w^2-1}\\right)\\)", "\\(\\dfrac{w^2-m}{w^2+m}\\)", "\\(m\\left(\\dfrac{w^2-1}{w^2+1}\\right)\\)", "\\(w^2m\\)"], "correct": 0, "verified": true, "src": "M40", "review": true, "orig": "images/q-f6ddb52d7f.jpg", "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат, собираем k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>w² = <span class=\"fr\"><span>k + m</span><span>k − m</span></span>.</li><li>w²k − w²m = k + m.</li><li>k(w² − 1) = m(w² + 1) → k = m<span class=\"fr\"><span>w² + 1</span><span>w² − 1</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — перевёрнуто.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Все слагаемые с k — в одну сторону.</div></div>"}, {"id": 5, "text": "<p>The line \\(px+qy=12\\) passes through the points M(2,2) and N(6,0). Find the value of p−q.</p>", "image": "", "options": ["-2", "0", "6", "-4", "4"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-61f7d267d2.jpg", "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем обе точки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>N(6; 0): 6p = 12 → p = 2.</li><li>M(2; 2): 4 + 2q = 12 → q = 4.</li><li>p − q = −2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — q − p.</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точка на оси убирает одну переменную.</div></div>"}, {"id": 7, "text": "<p>The original price of a luxury watch is x.</p><ol><li>The price is first increased by 150%.</li><li>The new price is then decreased by 30% to a final price of y.</li></ol><p>The relationship between the original price x and the final price y can be expressed as:</p><p>\\(kx=y\\)</p><p>What is the value of k?</p>", "image": "", "options": ["k=1.05", "k=1.20", "k=1.75", "k=2.20", "k=2.50"], "correct": 2, "verified": true, "src": "M40", "orig": "images/q-d2b21bd8d4.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Увеличение на 150% = ×2,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>×2,5, затем ×0,7.</li><li>k = 1,75.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — только рост.</li><li>A — ×1,5 вместо ×2,5.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Increased by 150%» ≠ «to 150%».</div></div>"}, {"id": 8, "text": "<p>M is the midpoint of the side of the rectangle.</p><p>What is the area (in square units) of the triangle PRM?</p>", "image": "images/q-fee3f547ee.jpg", "options": ["3 square units", "5 square units", "6 square units", "7 square units", "8 square units"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-fee3f547ee.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Координаты: P(0; 0), R(3; 4), M(3; 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>RM вертикальна, длина 2.</li><li>Расстояние от P до прямой x = 3: 3.</li><li>S = ½ · 2 · 3 = 3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без ½.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вертикальный отрезок — удобное основание.</div></div>", "topic": "M5.14"}, {"id": 9, "text": "<p>A set of 10 numbers has a mean of 12. If the number 30 is removed from the set, what is the new mean of the remaining 9 numbers?</p>", "image": "", "options": ["9", "10", "11", "12", "14"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-40c8f5339e.jpg", "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 · 12 = 120 → без 30: 90.</li><li><span class=\"fr\"><span>90</span><span>9</span></span> = 10.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — <span class=\"fr\"><span>90</span><span>10</span></span>.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удаление числа выше среднего снижает среднее.</div></div>"}, {"id": 11, "text": "<p>Tom and Jerry started with identical rectangular sheets of paper. Each of them cut his sheet in half. Tom obtained two rectangles, each with a perimeter of 23, while Jerry obtained two rectangles, each with a perimeter of 37. What was the perimeter of Tom's original sheet of paper?</p>", "image": "", "options": ["20", "30", "40", "50", "60"], "correct": 2, "verified": true, "src": "M40", "orig": "images/q-67bd3a0a8c.jpg", "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лист a × b; разрезали по-разному.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Том: 2(<span class=\"fr\"><span>a</span><span>2</span></span> + b) = a + 2b = 23.</li><li>Джерри: 2a + b = 37.</li><li>Сложим: 3(a + b) = 60 → a + b = 20.</li><li>Периметр 40.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — a + b.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложение уравнений даёт сразу a + b.</div></div>"}, {"id": 12, "text": "<p>The diagram shows a cuboid in which the area of the shaded face is one quarter of the area of each of the two visible unshaded faces. The total surface area of the cuboid is 72 \\(cm^2\\)</p><p>What is the area of one of the unshaded faces of the cuboid?</p>", "image": "images/q-d90e6b527e.jpg", "options": ["13", "14", "15", "16", "18"], "correct": 3, "verified": true, "src": "M40", "orig": "images/q-d90e6b527e.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Торцевая грань x, длинные — 4x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>У параллелепипеда 2 торца и 4 длинные грани.</li><li>2x + 16x = 72 → x = 4.</li><li>Незаштрихованная: 16.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (18) — <span class=\"fr\"><span>72</span><span>4</span></span>.</li><li>A, B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая видимая грань имеет невидимую пару.</div></div>"}, {"id": 13, "text": "<p>Solve the inequality: \\(\\frac{x+2}{x-4} &lt; 0\\)</p>", "image": "", "options": ["x &lt; -2 or x &gt; 4", "-2 &lt; x &lt; 4", "x &lt; -2", "x &gt; 4", "x = -2"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-20c0b797ab.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дробь < 0 при разных знаках числителя и знаменателя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нули: −2 и 4.</li><li>Отрицательна между ними: −2 < x < 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — дробь положительна.</li><li>C, D — части.</li><li>E — дробь = 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Метод интервалов.</div></div>"}, {"id": 14, "text": "<p>Solve \\(3x^4 - 6x^2 - 9 = 0\\)</p>", "image": "", "options": ["\\(x = \\pm\\sqrt{2}\\)", "\\(x = \\pm\\sqrt{3}\\)", "\\(x = \\pm5\\)", "\\(x = \\pm\\sqrt{5}\\)", "\\(x = \\pm1\\)"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-e556458434.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Биквадратное: замена x².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x⁴ − 2x² − 3 = (x² − 3)(x² + 1) = 0.</li><li>x² = 3 → x = ±√3 (x² = −1 нет решений).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — x² = 1 не корень.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала поделите на общий множитель 3.</div></div>"}, {"id": 16, "text": "<p>The equation \\(y^2 = 6(x - 4y)\\) is shifted 3 units to the left and 5 units up. Write the new equation of the parabola in the form \\(y^2 = ax + by + c\\).</p>", "image": "", "options": ["\\(y^2 = 6x - 14y + 113\\)", "\\(y^2 = 6x + 14y + 113\\)", "\\(y^2 = 6x - 14y - 113\\)", "\\(y^2 = 6x - 13y + 113\\)", "\\(y^2 = 6x + 13y + 113\\)"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-c45ef090ab.jpg", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сдвиг влево на 3: x → x + 3; вверх на 5: y → y − 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(y − 5)² = 6((x + 3) − 4(y − 5)).</li><li>y² − 10y + 25 = 6x + 18 − 24y + 120.</li><li>y² = 6x − 14y + 113.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак у 14y.</li><li>C — знак у 113.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сдвиг вверх — вычитаем из y (против интуиции).</div></div>"}, {"id": 17, "text": "<p>In triangle ABC, the length of side AB is 10 cm, angle BAC is 45°, and angle ACB is 30°. Find the length of side BC.</p>", "image": "images/q-b757846589.jpg", "options": ["\\(5\\sqrt{2}\\)", "\\(10\\sqrt{2}\\)", "20", "\\(10/\\sqrt{2}\\)", "5"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-b757846589.jpg", "review": true, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема синусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>BC</span><span>sin</span></span> A = <span class=\"fr\"><span>AB</span><span>sin</span></span> C.</li><li>BC = 10 · sin 45°/sin 30° = 10 · <span class=\"fr\"><span>√2</span><span>2</span></span> · 2 = 10√2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без деления на sin 30°.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Против известного угла — известная сторона.</div></div>"}, {"id": 18, "text": "<p>When the expression \\((3x - 1)^2 - (x + 4)^2\\) is written in the form \\(p(x + q)^2 + r\\) where p,q, and r are constants, what is the value of r?</p>", "image": "", "options": ["\\(-169/8\\)", "\\(-8/169\\)", "\\(-168/8\\)", "\\(169/8\\)", "\\(-69/8\\)"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-e6620c816e.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскрываем и выделяем полный квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9x² − 6x + 1 − x² − 8x − 16 = 8x² − 14x − 15.</li><li>8(x² − <span class=\"fr\"><span>7x</span><span>4</span></span>) − 15 = 8(x − <span class=\"fr\"><span>7</span><span>8</span></span>)² − 8 · <span class=\"fr\"><span>49</span><span>64</span></span> − 15.</li><li>= 8(x − <span class=\"fr\"><span>7</span><span>8</span></span>)² − <span class=\"fr\"><span>49</span><span>8</span></span> − <span class=\"fr\"><span>120</span><span>8</span></span> = 8(x − <span class=\"fr\"><span>7</span><span>8</span></span>)² − <span class=\"fr\"><span>169</span><span>8</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перевёрнуто.</li><li>D — знак.</li><li>C, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При выносе 8 не забудьте умножить <span class=\"fr\"><span>49</span><span>64</span></span> на 8.</div></div>"}, {"id": 19, "text": "<p>Rationalize the denominator and simplify: \\(\\dfrac{10}{\\sqrt{7}+\\sqrt{2}}\\)</p>", "image": "", "options": ["\\(2(\\sqrt{7}-\\sqrt{2})\\)", "\\(2(\\sqrt{7}+\\sqrt{2})\\)", "\\(5(\\sqrt{7}-\\sqrt{2})\\)", "\\(\\sqrt{7}-\\sqrt{2}\\)", "\\(10(\\sqrt{7}-\\sqrt{2})\\)"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-dfa40fa18f.jpg", "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем на сопряжённое.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√7 + √2)(√7 − √2) = 5.</li><li>10<span class=\"fr\"><span>√7 − √2</span><span>5</span></span> = 2(√7 − √2).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li><li>C, E — неверное сокращение.</li><li>D — без 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность квадратов в знаменателе.</div></div>"}, {"id": 20, "text": "<p>In the figure below, P is an external point of a circle. A secant line PAB intersects the circle at A and B. Another secant line, PCD, intersects the circle at C and D.</p><p>If PA = 4 cm, AB = 5 cm, and PC = 3 cm, what is the length of CD?</p>", "image": "images/q-358c27e6b0.jpg", "options": ["6 cm", "7 cm", "9 cm", "12 cm", "15 cm"], "correct": 2, "verified": true, "src": "M40", "orig": "images/q-358c27e6b0.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема о секущих: PA · PB = PC · PD.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>PB = 4 + 5 = 9 → 36 = 3 · PD → PD = 12.</li><li>CD = 12 − 3 = 9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (12) — это PD.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешняя часть × вся секущая.</div></div>"}, {"id": 21, "text": "<p>A light aircraft flies from City A to City B, which are 600 km apart. When flying with a tailwind (the wind blowing in the same direction as the plane), the trip takes 2.5 hours. On the return journey from City B to City A, flying against the same constant wind (headwind), the trip takes 3 hours.</p><p>What is the speed of the wind and the speed of the aircraft in still air?</p>", "image": "", "options": ["Aircraft: 220 km/h, Wind: 20 km/h", "Aircraft: 200 km/h, Wind: 40 km/h", "Aircraft: 210 km/h, Wind: 30 km/h", "Aircraft: 225 km/h, Wind: 15 km/h", "Aircraft: 250 km/h, Wind: 50 km/h"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-68feb42c79.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Скорость по ветру и против ветра.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>v + w = <span class=\"fr\"><span>600</span><span>2,5</span></span> = 240.</li><li>v − w = <span class=\"fr\"><span>600</span><span>3</span></span> = 200.</li><li>v = 220, w = 20.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не дают обе скорости.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма и разность → половина суммы = собственная скорость.</div></div>"}, {"id": 22, "text": "<p>The quantities p and q are positive. p is directly proportional to the cube of q. When p=16, q=2. What is the value of q when p=54?</p>", "image": "", "options": ["1", "2", "⅓", "3", "2/3"], "correct": 3, "verified": true, "src": "M40", "orig": "images/q-5d6696c546.jpg", "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">p = kq³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 = 8k → k = 2.</li><li>54 = 2q³ → q³ = 27 → q = 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — исходное q.</li><li>A, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте кубический корень.</div></div>"}, {"id": 23, "text": "<p>Two spheres have radii in the ratio 2:3. What is the ratio of their surface areas?</p>", "image": "", "options": ["2:3", "4:9", "8:27", "3:2", "9:4"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-f46b8f9199.jpg", "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади ∝ r².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 : 9.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — радиусы.</li><li>C — объёмы.</li><li>D, E — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длины k, площади k², объёмы k³.</div></div>"}, {"id": 24, "text": "<p>If a,b, and c are positive real numbers such that ab=20, ac=50, and bc=40, what is the value of a+b+c?</p>", "image": "", "options": ["\\(10 + 2\\sqrt{5}\\)", "\\(15\\sqrt{2}\\)", "19", "\\(10\\sqrt{10}\\)", "\\(11\\sqrt{2}\\)"], "correct": 2, "verified": true, "src": "M40", "orig": "images/q-bd9d4b632f.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(abc)² = произведение всех трёх.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(abc)² = 20 · 50 · 40 = 40 000 → abc = 200.</li><li>a = <span class=\"fr\"><span>200</span><span>40</span></span> = 5, b = 4, c = 10.</li><li>Сумма 19.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: ab = 20 ✓, ac = 50 ✓, bc = 40 ✓.</div></div>"}, {"id": 26, "text": "<p>Find the coordinates of the points where the line \\(y = x + 3\\) intersects the curve \\(y = x^2 - 2x + 3\\).</p>", "image": "", "options": ["(0, 3) and (3, 6)", "(1, 4) and (2, 5)", "(0, 3) and (-1, 2)", "(3, 6) and (-1, 2)", "(4, 7) and (0, 3)"], "correct": 0, "verified": true, "src": "M40", "orig": "images/q-8d642c553a.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 3 = x² − 2x + 3 → x² − 3x = 0.</li><li>x = 0 или 3 → (0; 3), (3; 6).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные пары не лежат на обеих линиях.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка на прямой.</div></div>"}, {"id": 27, "text": "<p>The sum of the first n terms of an arithmetic progression is given by \\(S_n = 3n^2 + n\\).</p><p>What is the 10th term \\((a_{10})\\) of this sequence?</p>", "image": "", "options": ["310", "301", "59", "58", "61"], "correct": 3, "verified": true, "src": "M40", "orig": "images/q-16d4e98701.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">aₙ = Sₙ − Sₙ₋₁.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S₁₀ = 300 + 10 = 310.</li><li>S₉ = 243 + 9 = 252.</li><li>a₁₀ = 58.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — S₁₀.</li><li>C, E — ошибки ±1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формула работает для любой последовательности.</div></div>"}, {"id": 28, "text": "<p>The algebraic fraction a/b is equal to \\(3 - \\frac{2x}{x+2}\\). Which one of the following is equivalent to \\(\\left(\\frac{a}{b}\\right)^{-2}\\) in terms of x?</p>", "image": "", "options": ["\\(\\frac{(x+2)^2}{(x+6)^2}\\)", "\\(\\frac{(x+6)^2}{(x+2)^2}\\)", "\\(\\frac{(x+2)^2}{(3x+6)^2}\\)", "\\(\\frac{(x+2)^2}{(x+10)^2}\\)"], "correct": 0, "verified": true, "src": "M40", "review": true, "orig": "images/q-b4cbc876ac.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем <span class=\"fr\"><span>a</span><span>b</span></span>, затем степень −2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 − <span class=\"fr\"><span>2x</span><span>x + 2</span></span> = <span class=\"fr\"><span>3x + 6 − 2x</span><span>x + 2</span></span> = <span class=\"fr\"><span>x + 6</span><span>x + 2</span></span>.</li><li>(…)⁻² = (x + 2)²/(x + 6)².</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не перевернули.</li><li>C, D — неверное упрощение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отрицательная степень → переворот.</div></div>"}, {"id": 29, "text": "<p>Given the function \\(f(x) = x^2 - 4\\) for the restricted domain \\(x \\geq 0\\). What is the range of this function?</p>", "image": "", "options": ["\\(y \\geq 0\\)", "\\(y \\geq -4\\)", "\\(y &gt; -4\\)", "All real numbers", "\\(y \\leq -4\\)"], "correct": 1, "verified": true, "src": "M40", "orig": "images/q-d970a13acf.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">При x ≥ 0 x² ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минимум при x = 0: −4.</li><li>Range: y ≥ −4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без −4.</li><li>C — −4 достигается.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Range — значения y.</div></div>"}, {"id": 30, "text": "<p>Find the minimum value of the curve \\(y = x^2 - 3x + 2\\)</p>", "image": "", "options": ["-1/2", "-1/3", "-1/4", "0", "1/2"], "correct": 2, "verified": true, "src": "M40", "orig": "images/q-fc1a9b4aa3.jpg", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершина параболы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 1,5.</li><li>y = 2,25 − 4,5 + 2 = −0,25.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — неверно.</li><li>D — y в корнях.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минимум = <span class=\"fr\"><span>−D</span><span>4a</span></span> = −<span class=\"fr\"><span>9 − 8</span><span>4</span></span> = −¼.</div></div>"}, {"id": 31, "topic": "M5.10", "text": "<p>A circle has equation \\(x^2 + (y + 2)^2 = 36\\).</p><p>What are its centre and radius?</p>", "image": "", "options": ["centre (0, 2), radius 6", "centre (−2, 0), radius 6", "centre (0, −2), radius 36", "centre (0, 2), radius 36", "centre (0, −2), radius 6"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x − a)² + (y − b)² = r²: центр (a; b), радиус r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Центр (0; −2), r = √36 = 6. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знаки в скобках меняются.</li><li>B — перепутали координаты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус в скобке — плюс в координате и наоборот.</div></div>", "src": "PL"}, {"id": 32, "topic": "M3.7", "text": "<p>Asel and Bota share 1920 stickers in the ratio 5 : 7. Asel then gives \\(\\dfrac{1}{4}\\) of her stickers to Bota.</p><p>How many stickers does Bota have now?</p>", "image": "", "options": ["600", "800", "1120", "1320", "1600"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала поделите в отношении, потом возьмите дробь от доли Асель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Асель: 1920 · <span class=\"fr\"><span>5</span><span>12</span></span> = 800, Бота: 1120.</li><li>Асель отдаёт <span class=\"fr\"><span>1</span><span>4</span></span> · 800 = 200 → у Боты 1320. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это сколько осталось у Асель.</li><li>B — это доля Асель до подарка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Читайте «от чего» берётся дробь.</div></div>", "src": "PL"}, {"id": 33, "topic": "M2.6", "text": "<p>Evaluate \\(\\sqrt{64} - \\sqrt[3]{-8}\\).</p>", "image": "", "options": ["−10", "6", "10", "12", "62"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∛(−8) = −2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√64 = 8.</li><li>8 − (−2) = 10. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — кубический корень из отрицательного числа отрицателен: −(−2) = +2.</li><li>D — посчитали ∛ как квадратный корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Куб отрицательного числа отрицателен, поэтому ∛ отрицательного существует.</div></div>", "src": "PL"}, {"id": 34, "topic": "M2.3", "text": "<p>Two buses leave the station together. One returns every 84 minutes and the other every 24 minutes.</p><p>After how many minutes are they next at the station together?</p>", "image": "", "options": ["12", "108", "168", "336", "2016"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно наименьшее общее кратное (НОК).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОД(84, 24) = 12.</li><li>НОК = 84 · 24 : 12 = 168. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это НОД, а нужен НОК.</li><li>B — сложили интервалы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Снова вместе» — НОК; «разделить поровну» — НОД.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  var pending = null;

    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }

    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
