<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m030_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим уравнение на x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + 2 = 4x → x + <span class=\"fr\"><span>2</span><span>x</span></span> = 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пытались найти x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не решайте уравнение — преобразуйте его.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m030_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Складываем три суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(T + J + A) = 72 → сумма 36.</li><li>T = 12, J = 11, A = 13.</li><li>144 + 121 + 169 = 434.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждое имя входит в две суммы.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m030_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC — диаметр → ∠B = 90°; радиус малой окружности OM ⊥ BC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>OM ∥ AB, O — середина AC → OM — средняя линия: AB = 2r.</li><li>r = 70 → R = 3r = 210.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — R = 90.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя линия = половина параллельной стороны.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m030_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь шестиугольника через радиус вписанной окружности: 2√3r².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r² = 64√3.</li><li>2√3 · 64√3 = 384.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 576 = 9 · 64.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шестиугольник = 6 треугольников с высотой r.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m030_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр движется по квадрату, отступив на 1 от каждой стороны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона 5 − 2 = 3 → путь 12.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — периметр большого квадрата.</li><li>A, D — путь точки на окружности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внутри угла центр не поворачивает по дуге.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m030_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы вокруг точки: 360°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угол шестиугольника 120°, угол квадрата 90°, диагональ к центру делит угол квадрата: 45°.</li><li>α = 360 − 120 − 90 − 45 = 105°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный набор углов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отрезок от центра к вершине квадрата — половина диагонали, угол 45°.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m030_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вода = время × скорость.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>¾ · ¾ = <span class=\"fr\"><span>9</span><span>16</span></span> → экономия <span class=\"fr\"><span>7</span><span>16</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — оставшаяся доля.</li><li>B, A — сложили или вычли неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократить на ¼ — умножить на ¾.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m030_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прямая через центр круга делит круг пополам; чтобы делить и прямоугольник — она должна пройти через его центр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Центр прямоугольника (50; 25).</li><li>Наклон: <span class=\"fr\"><span>30 − 25</span><span>75 − 50</span></span> = <span class=\"fr\"><span>1</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не через центр прямоугольника.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Любая прямая через центр симметричной фигуры делит её площадь пополам.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m030_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Встреча: <span class=\"fr\"><span>550</span><span>10 + 1</span></span> = 50 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ёж пробежал 50 м, разворачивается: ещё 50 с → финиш на 100 с.</li><li>Кролик: <span class=\"fr\"><span>550</span><span>10</span></span> = 55 с.</li><li>100 − 55 = 45.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (50) — время встречи.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Встречное движение — скорости складываются.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m030_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим варианты в квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−3 + 2√5)² = 9 + 20 − 12√5 = 29 − 12√5 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: (2 − 4√5)² = 84 − 16√5.</li><li>E: 89 + 24√5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удвоенное произведение 2ab√n = −12√5 → ab = −6.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m030_q12.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 4, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">P ∝ <span class=\"fr\"><span>1</span><span>Q²</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>1,2²</span></span> ≈ 0,694 → снижение ≈ 31%.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коэффициент <span class=\"fr\"><span>2</span><span>3</span></span> не влияет на проценты.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m030_q13.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2ˣ: положительна, возрастает, проходит (0; 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 2<sup>−x</sup>.</li><li>C — логарифм.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Показательная функция не пересекает ось x.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m030_q14.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр + полушар.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>πr²l + ⅔πr³ = <span class=\"fr\"><span>πr²</span><span>3</span></span> · (2r + 3l).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — целый шар.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите <span class=\"fr\"><span>πr²</span><span>3</span></span>.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m030_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По рисунку NL (длинная) переходит в PR, LM — в PQ: это поворот на 90° по часовой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>L(a; a) → P(a; −a).</li><li>Поворот на 90° (против часовой), затем на 180° = поворот на 90° по часовой.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (5, затем 4) = отражение в y = 0: длинная сторона ушла бы вниз.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отслеживайте, куда идёт длинная сторона.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m030_q16.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к 10⁷.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>4,6 + 1,4</span><span>4,6 − 0,4</span></span> = <span class=\"fr\"><span>6</span><span>4,2</span></span> = <span class=\"fr\"><span>10</span><span>7</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки порядков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2 · 10⁶ = 0,2 · 10⁷.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m030_q18.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(a − b)² = (a + b)² − 4ab.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>100 − 40 = 60 → 2√15.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 100 − 80.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не нужны сами числа.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m030_q19.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет пересечения ⇔ D &lt; 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 и 4: 1 − x² = 2 − x → x² − x + 1 = 0, D &lt; 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные пары дают D ≥ 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приравняйте и посчитайте дискриминант.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m030_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">32 = 0,8 · цена.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>32</span><span>0,8</span></span> = 40.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 32 · 1,2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скидка — от исходной цены.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m030_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">w + 3w = 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>w = 5, l = 15 → 75.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полупериметр = 20.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m030_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC горизонтальна.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AC = 6, высота 6 − 2 = 4 → 12.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная высота.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Горизонтальное основание удобно.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m030_q23.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 5, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(a + b)² − (a − b)² = 4ab.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4√70.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 2ab.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не раскрывайте полностью.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m030_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">+125% = × 2,25; −40% = × 0,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,35 = <span class=\"fr\"><span>27</span><span>20</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — +125% как × 1,25.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же тип, что mix-43.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m030_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанная трапеция с AB = BC = CD (равнобедренная) → дуги по 60°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠BCD опирается на дугу BAD = 60° + 180° = 240°.</li><li>∠BCD = 120°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная дуга.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный угол = половина дуги.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m030_q26.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² − 4x − 6 = 0 → x = 3, −1.</li><li>Точки (3; −9), (−1; −1): наклон −2 → y = −2x − 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не проходят через точки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте обе точки.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m030_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол между запад (270°) и 150° — 120°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Равнобедренный с боковой 1300 и углом 120° → основание 1300√3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — половина.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же тип, что mix-40.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m030_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2ab = (a + b)² − (a² + b²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>144 − 74 = 70 → 35.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Числа 5 и 7.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m030_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,7(8) = <span class=\"fr\"><span>78 − 7</span><span>90</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>71</span><span>90</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — <span class=\"fr\"><span>78</span><span>90</span></span> = 0,8(6).</li><li>A — 0,(78).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смешанная периодическая дробь.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m030_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переносим 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>x + 2</span><span>x − 3</span></span> − 1 = <span class=\"fr\"><span>5</span><span>x − 3</span></span> &gt; 0 → x &gt; 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — подставили только числа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не умножайте на x − 3 без учёта знака.</div></div>"}, {"id": 31, "topic": "M4.10", "text": "<p>Find the equation of the straight line through \\((2, 0)\\) and \\((4, -4)\\).</p>", "image": "", "options": ["\\(y = -2x + 6\\)", "\\(y = -2x + 4\\)", "\\(y = -2x - 4\\)", "\\(y = -\\tfrac{1}{2}x + 1\\)", "\\(y = 2x - 4\\)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Градиент m = Δy/Δx, затем подставьте точку.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m = −2.</li><li>c = 0 − −2·(2) = 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка при нахождении c.</li><li>D — градиент перевёрнут (Δx/Δy).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте вторую точку подстановкой.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.7", "text": "<p>A ladder 15 m long leans against a wall. Its foot is 9 m from the wall.</p><p>How high up the wall does it reach?</p>", "image": "", "options": ["6 m", "13 m", "\\(\\sqrt{306}\\) m", "12 m", "144 m"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лестница — гипотенуза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(15² − 9²) = √144 = 12 м. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли длины.</li><li>C — сложили квадраты — но лестница и есть гипотенуза.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала найдите, какая сторона — гипотенуза.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
