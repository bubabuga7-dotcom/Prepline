<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"topic":"FLAW","text":"<p>In a recent city report, officials stated that since the installation of more traffic cameras, there has been a decline in road accidents. They conclude that the cameras are directly responsible for improved road safety. However, the report also mentions that during the same period, major road repairs were completed and new pedestrian crossings were added throughout the city. Despite these concurrent changes, the officials attribute all improvements solely to the cameras.</p><p>Which of the following best identifies the flaw in the argument?</p>","image":"","options":["The report ignores the opinions of local drivers.","It assumes only one factor caused the decrease in accidents.","The data was collected over too short a time period.","Traffic cameras do not capture all types of road incidents.","Other cities did not experience similar improvements."],"correct":1,"src":"CRIT33","orig":"images/q-81b53ef968.jpg"},{"id":2,"topic":"MC","text":"<p>A new health app allows users to track their daily steps and receive motivational badges for achieving activity goals. After six months of use, a survey found that over 70% of users reported increased physical activity. Many of these users also said they felt more energetic and less stressed. Based on this, the app's developers claim that their product significantly improves users' overall well-being. While some experts note that lifestyle changes involve many variables, the developers remain confident in their conclusion.</p><p>Which of the following best expresses the main conclusion of the argument?</p>","image":"","options":["Many users feel more energetic after using the app.","The app is effective in tracking physical activity.","The app significantly improves users' overall well-being.","Experts disagree on the app's effectiveness.","Motivation is key to improving health."],"correct":2,"src":"CRIT33","orig":"images/q-2a1fd45e4e.jpg"},{"id":3,"topic":"PS","text":"<p>A team of students is planning a fundraiser and needs to print flyers. They discover that one printer can complete the job alone in 10 hours, while a second printer can do it in 15 hours. If both printers are used together and operate continuously at their normal rates, the team wonders how long the job will take. They want to calculate the shortest time to finish printing all the flyers by combining the efforts of both machines.</p><p>How long will it take the two printers to complete the job together?</p>","image":"","options":["5 hours","6 hours","8 hours","9 hours","7 hours"],"correct":1,"src":"CRIT33","orig":"images/q-939149fa9a.jpg"},{"id":4,"topic":"ASM","text":"<p>In response to declining test scores, a school district decided to increase homework assignments in core subjects like math and science. The district believes that more practice outside class will help students master key concepts and perform better on exams. However, some parents are concerned that the additional workload could lead to stress and burnout. Despite this, the district proceeds with the plan, confident it will raise academic achievement.</p><p>Which one of the following is an underlying assumption of the above argument?</p>","image":"","options":["Students have enough time and resources at home to complete extra work.","Teachers will be available to support students after school.","Parents will assist their children with homework.","Test scores reflect teaching quality.","Students perform better with individual learning styles."],"correct":0,"src":"CRIT33","orig":"images/q-c7371bfe1d.jpg"},{"id":5,"topic":"CON","text":"<p>In a nationwide survey, 65% of respondents said they preferred to shop online rather than in physical stores. The survey also revealed that younger age groups were more likely to cite convenience, while older respondents mentioned better prices. Over the past year, several large retail chains have announced store closures and shifted more investment into their e-commerce platforms.</p><p>Which of the following can most reasonably be concluded from the information above?</p>","image":"","options":["Retail chains prefer to sell products online.","Consumers are more price-sensitive than convenience-focused.","Online shopping is growing in popularity and affecting business strategies.","Store closures are unrelated to consumer preferences.","Older shoppers are more active online than younger ones."],"correct":2,"src":"CRIT33","orig":"images/q-c20514eacc.jpg"},{"id":6,"topic":"STR","text":"<p>Some communities have implemented curbside compost collection programs to reduce landfill waste. Although participation is voluntary, several neighborhoods have reported a notable drop in the amount of garbage sent to landfills. Critics argue that the success may be temporary or due to seasonal changes in waste production. Supporters maintain that the programs encourage environmentally responsible habits.</p><p>Which of the following, if true, would most strengthen the above argument?</p>","image":"","options":["Compost programs are more expensive than standard garbage collection.","Landfill waste has continued to drop over several years in areas with composting.","Only a small percentage of residents use the compost bins.","People often forget to separate compostable items from other trash.","Some cities have banned food waste from landfills."],"correct":1,"src":"CRIT33","orig":"images/q-8ec5d3caf7.jpg"},{"id":7,"topic":"PAR","text":"<p>If Nusra is to find a job that really interests her, then she must be prepared to earn much less than she does in her present job. However, because she is unwilling to sacrifice her current high wage, she will not find a job that would interest her.</p><p>Which one of the following most closely parallels the reasoning in the argument above?</p>","image":"","options":["If Lopez wants to do better at school, he will need to give up his part-time job. He stresses that he wants to improve his school work, so he will obviously have to give up his job.","If Julie and Mike are to adopt a child, they have to be able to show that they have a stable relationship. Unfortunately, they haven't got a good history of stability in their marriage, so they are going to have to work hard at improving this.","If Myra is to start up her own business, she will need at least £5000 to cover her start up costs. She has only £1000, so she will need to borrow the rest from the bank.","If Paul and Lisa are to be happily married, they must talk to each other more. Their counselling sessions have shown, however, that they find this impossible, so their marriage will not be a happy one.","If Carl and Tesfa are going to go through with their divorce, they must be sure that they don't want to give their marriage another go. They have both insisted that divorce is the only option, so further counselling is pointless."],"correct":3,"src":"CRIT33","orig":"images/q-6e3e7d2aba.jpg"},{"id":8,"topic":"PS","text":"<p>A farmer wants to divide a rectangular plot of land equally between two crops: corn and tomatoes. The plot measures 80 meters in length and 60 meters in width.</p><p>He plans to divide the area diagonally so that each crop gets a triangular section. He needs to calculate the area of land each crop will occupy.</p><p>What is the area (in square meters) that each crop will receive?</p>","image":"","options":["2400 m\\(^2\\)","4800 m\\(^2\\)","3600 m\\(^2\\)","4000 m\\(^2\\)","6000 m\\(^2\\)"],"correct":0,"src":"CRIT33","orig":"images/q-ab80134f0d.jpg"},{"id":9,"topic":"FLAW","text":"<p>An energy drink company conducted a survey in which 90% of respondents claimed they felt more alert after consuming the product. Based on these results, the company claims that their drink is guaranteed to improve mental performance. However, the company selected survey participants from customers who had previously expressed satisfaction with the product.</p><p>Which of the following best identifies the flaw in the argument?</p>","image":"","options":["The sample was biased because it included only satisfied customers.","Feeling alert is not the same as improved mental performance.","The survey had too few participants.","Energy drinks can have side effects.","Not all drinks work equally well."],"correct":0,"src":"CRIT33","orig":"images/q-2d17109557.jpg"},{"id":10,"topic":"ASM","text":"<p>To improve voter turnout, a city decided to make Election Day a public holiday. Officials argued that people would be more likely to vote if they had the day off work. However, some skeptics believe people will use the day for leisure rather than civic participation.</p><p>Which of the following is an assumption made by the city officials?</p>","image":"","options":["Voter turnout is affected by work obligations.","Citizens will be punished for not voting.","Public holidays reduce economic productivity.","Voting is more important than relaxation.","All voters care about the election's outcome."],"correct":0,"src":"CRIT33","orig":"images/q-db2dbd3134.jpg"},{"id":11,"topic":"PS","text":"<p>I've bought a present for one of my friends and want to get it wrapped. Since the present is some extra pieces for one of his favourite games I need to put them in a box. I don't mind if I need to use two or three boxes, but I don't want there to be more than three boxes in total. The shape of the box doesn't matter. I need there to be a total volume of at least 95 cm'. The prices for the boxes are shown in the table.</p><table class=\"q-table\"><thead><tr><th>Length (cm)</th><th>Width (cm)</th><th>Depth (cm)</th><th>Price (cents)</th></tr></thead><tbody><tr><td>3</td><td>2</td><td>2</td><td>9</td></tr><tr><td>5</td><td>3</td><td>3</td><td>25</td></tr><tr><td>6</td><td>5</td><td>2</td><td>35</td></tr></tbody></table><p>What is the lowest total cost that I will need to pay to buy the boxes?</p>","image":"","options":["59¢","60¢","62¢","70¢","72¢"],"correct":0,"src":"CRIT33","orig":"images/q-d3e09157ef.jpg"},{"id":12,"topic":"PS","text":"<p>The cost of plastic plant pots used by a garden centre is shown below. Pots can only be purchased in multiples of 50 or 100.</p><table class=\"q-table\"><thead><tr><th>Diameter in inches</th><th>Depth in inches</th><th>Per 50</th><th>Per 100</th></tr></thead><tbody><tr><td>2.5</td><td>3.0</td><td>£1.75</td><td>£3.25</td></tr><tr><td>3.0</td><td>3.5</td><td>£2.95</td><td>£5.45</td></tr><tr><td>4.0</td><td>5.0</td><td>£3.25</td><td>£5.95</td></tr><tr><td>5.5</td><td>6.5</td><td>£8.50</td><td>£14.95</td></tr><tr><td>6.0</td><td>5.5</td><td>£9.50</td><td>£17.50</td></tr><tr><td>8.0</td><td>7.5</td><td>£11.00</td><td>£23.85</td></tr><tr><td>10.0</td><td>9.5</td><td>£13.50</td><td>£33.95</td></tr><tr><td>12.0</td><td>11.5</td><td>£16.00</td><td>£54.85</td></tr></tbody></table><p>What is the minimum cost of pots for 47 plants requiring 3-inch diameter pots and 95 plants requiring 5.5-inch diameter pots?</p>","image":"","options":["£13.95","£17.90","£18.20","£19.25","£20.40"],"correct":1,"src":"CRIT33","orig":"images/q-e6669b770c.jpg"},{"id":13,"topic":"PS","text":"<p>An internet provider offers a promotional package where the first 3 months are billed at $20 per month, and the remaining months in a 12-month contract are billed at $40 per month. A customer wants to know the total cost of the full 12-month subscription.</p><p>What is the total cost of the year-long plan?</p>","image":"","options":["$400","$420","$440","$460","$480"],"correct":1,"src":"CRIT33","orig":"images/q-043c0f1ea0.jpg"},{"id":14,"topic":"FLAW","text":"<p>A cosmetics company advertises a new anti-aging cream, claiming that 85% of users noticed firmer skin after two weeks of use. However, the company fails to mention that the cream was only tested on individuals under 40, and the term \"firmer\" was based solely on users' self-assessments rather than clinical evaluations.</p><p>Which of the following is the best statement of the flaw in the above argument?</p>","image":"","options":["The company didn't test for long-term results.","The results may not apply to older individuals.","Firmer skin doesn't mean fewer wrinkles.","Some people might be allergic to the product.","The sample included too many participants."],"correct":1,"src":"CRIT33","orig":"images/q-9040e1bd7a.jpg"},{"id":15,"topic":"STR","text":"<p>A city library introduced a program that allows residents to borrow digital books online. After one year, the library recorded an increase in total book checkouts and a broader range of titles being accessed. Some critics claim this is due to population growth, not the digital initiative. However, the library staff believes the new program has encouraged more reading.</p><p>Which of the following, if true, would most strengthen the above argument?</p>","image":"","options":["Digital book borrowing rose most sharply in areas with no population change.","Paper book checkouts stayed the same.","Library staff worked extra hours to promote the program.","Online users read shorter books on average.","Other cities have also seen growth in library usage."],"correct":0,"src":"CRIT33","orig":"images/q-9ca31ab158.jpg"},{"id":16,"topic":"PS","text":"<p>Alikhan and Sabina both carry pedometers when walking, to monitor how far they go. One day they go the same route, which Sabina completes in 53 minutes, while Alikhan only takes 45 minutes. Sabina's pedometer registers the route length as 5.27 km but Alikhan's pedometer suggests that it is 5.69 km.</p><p>Neither knows whether their pedometer is accurate, so Sabina takes hers to a reliable expert who tells her that her pedometer has been under-estimating distances travelled by 3.26%. Alikhan knows that his pedometer may consistently under or over estimate distances but does not get it checked.</p><p>Alikhan wishes to calculate as accurately as possible his average speed on the route he took with Sabina, and his average speed on future walks he takes with his own pedometer. Which one of the pieces of information given above is unnecessary to complete such calculations?</p>","image":"","options":["Sabina completed the route in 53 minutes.","Sabina's pedometer registered the route as 5.27 km long.","Sabina's pedometer under-estimates distance by 3.26%.","Alikhan completed the route in 45 minutes.","Alikhan's pedometer registered the route as 5.69 km long."],"correct":0,"src":"CRIT33","orig":"images/q-1b2081e23b.jpg"},{"id":17,"topic":"STR","text":"<p>A city government launched a new policy offering tax breaks to companies that hired unemployed residents. A few months later, unemployment in the city decreased slightly. Critics claim the improvement was due to seasonal hiring trends, not the new policy. However, data shows a larger decrease in unemployment among companies that used the tax break than in those that did not.</p><p>Which of the following, if true, would most strengthen the above argument?</p>","image":"","options":["Most companies were unaware of the new tax policy.","The unemployment drop occurred in cities without such tax breaks.","Companies using the tax break hired more local workers than usual.","Seasonal jobs are common in the area.","The policy was unpopular with large corporations."],"correct":2,"src":"CRIT33","orig":"images/q-e6ce90b5f6.jpg"},{"id":18,"topic":"ASM","text":"<p>Some companies have started implementing four-day work weeks without cutting pay, arguing it boosts productivity and morale. Managers claim that with fewer meetings and better focus, employees complete the same amount of work in less time. However, skeptics argue the results may not apply across all industries. Still, firms continue to adopt the model with confidence.</p><p>Which one of the following is an underlying assumption of the above argument?</p>","image":"","options":["All industries will benefit equally from reduced hours.","Employees value longer weekends more than higher salaries.","Productivity will not drop despite fewer hours worked.","Meetings are the main reason for low productivity.","Clients will adapt easily to a shorter workweek."],"correct":2,"src":"CRIT33","orig":"images/q-7a29de3f2a.jpg"},{"id":19,"topic":"PS","text":"<p>I have to award the prizes to the participants in a recent set of competitions. There are guidelines for the values of the prizes that I am allowed to give for each event shown in the table below:</p><p>John was the most successful of the participants. He won three competitions: the crossword, logic puzzle and mental arithmetic competitions.</p><p>What is the greatest difference that there could be between the value of two of John's individual prizes?</p><table class=\"q-table\"><thead><tr><th>Competition</th><th>Minimum prize (£)</th><th>Maximum prize (£)</th></tr></thead><tbody><tr><td>Crossword</td><td>30</td><td>45</td></tr><tr><td>Logic Puzzle</td><td>10</td><td>15</td></tr><tr><td>Wordsearch</td><td>15</td><td>35</td></tr><tr><td>Mental Arithmetic</td><td>30</td><td>35</td></tr><tr><td>General Knowledge Quiz</td><td>10</td><td>20</td></tr><tr><td>Chess Tournament</td><td>30</td><td>50</td></tr></tbody></table>","image":"","options":["£20","£25","£35","£40","£45"],"correct":2,"src":"CRIT33","orig":"images/q-4a86220471.jpg"},{"id":20,"topic":"PS","text":"<p>One corner is sliced off a solid cube to the midpoints of the three edges which meet at this corner.</p><p>Which one of the following could NOT be a view of the resulting solid from some direction?</p>","image":"images/q-94744d8607.jpg","options":["A","B","C","D","E"],"correct":1,"src":"CRIT33","review":true,"orig":"images/q-94744d8607.jpg"},{"id":21,"topic":"STR","text":"<p>An environmental study found that neighborhoods with more green spaces had lower average temperatures and better air quality. Residents in these areas also reported fewer stress-related illnesses and more time spent outdoors. The researchers suggest that increasing urban greenery may offer both physical and mental health benefits.</p><p>Which of the following is most supported by the passage?</p>","image":"","options":["Air pollution is the primary cause of urban stress.","People prefer living near parks for recreational purposes.","Green spaces contribute to better urban living conditions.","Cities should ban construction near parks.","Urban areas should reduce population density."],"correct":2,"src":"CRIT33","orig":"images/q-da288b7619.jpg"},{"id":22,"topic":"FLAW","text":"<p>Several social media platforms have introduced \"well-being\" features, such as screen time reminders and automatic app locks after a certain usage period. Platform executives claim these tools demonstrate their commitment to users' mental health. However, these features are often buried in menus, easy to disable, and rarely used. Despite this, companies continue to promote their mental health features in public campaigns.</p><p>Which of the following best identifies the flaw in the above argument?</p>","image":"","options":["People can still use social media outside the app.","The features are difficult for some users to find.","Making a feature available does not guarantee it is effective.","Most users are not aware of mental health tools.","Companies should not be responsible for user behaviour."],"correct":2,"src":"CRIT33","orig":"images/q-00231a0c51.jpg"},{"id":23,"topic":"ASM","text":"<p>Some employers have introduced mandatory \"email-free hours\" during the workday to increase productivity. They argue that constant email checking reduces focus and increases stress. They claim employees get more meaningful work done when not interrupted by messages. However, some workers feel disconnected and worry about missing urgent updates.</p><p>Which one of the following is an underlying assumption of the above argument?</p>","image":"","options":["Emails rarely contain urgent information.","Employees prefer to work without digital interruptions.","Productivity increases when workers can concentrate without distractions.","Most workplace stress is caused by ogram already owned personal bicycles.","The city also ran an advertising campaign promoting eco-friendly commuting.","Congestion levels returned to normal during holidays when the program was not used.","A neighboring city without a bike program experienced a similar drop in car usage."],"correct":0,"src":"CRIT33","orig":"images/q-eb1ad29458.jpg"},{"id":26,"topic":"PS","text":"<p>Some time ago I visited Tintaria. The unit of currency there is the crome. There are five types of coin, all different colours, but none of them has a value marked on it. The colours are blue, green, orange, red and yellow.</p><p>On my first day I bought souvenirs that cost a total of 81 cromes. Having no idea of the coin values, I held out a handful. The shop assistant told me I could give her a blue, an orange and five yellows, or a green, three reds and four yellows. Alternatively, if I gave her two blues and two oranges, she would give me a red as change.</p><p>Shortly afterwards I was told the value of the yellow coin.</p><p>Knowledge of the value of the yellow coin enabled me to deduce the value of how many of the other types of coin?</p>","image":"","options":["0","1","2","3","4"],"correct":2,"src":"CRIT33","orig":"images/q-15250c2dbd.jpg"},{"id":27,"topic":"PS","text":"<p>Daniel lives in Berlin. He has three close friends who live in different parts of the world:</p><ul><li>Alex lives in Toronto (which is 6 hours behind Berlin),</li><li>Ben lives in Sydney (which is 9 hours ahead of Berlin),</li><li>Clara lives in Dubai (which is 2 hours ahead of Berlin).</li></ul><p>They often coordinate video calls despite the time differences.</p><p>One evening, Alex sent a message that read:</p><p>\"Let's talk on Friday at 22:00 your time.\"</p><p>However, the message was accidentally sent to Ben instead of Clara, for whom it was originally intended. Ben followed the instructions exactly and called at the time stated in the message.</p><p>How much later than expected did Alex's phone actually ring?</p>","image":"","options":["7 hours","9 hours","11 hours","15 hours","18 hours"],"correct":0,"src":"CRIT33","orig":"images/q-6c162f6eb3.jpg"},{"id":28,"topic":"PS","text":"<p>Bill works for GardenMart, selling furniture to garden centres. The graph below shows Bill's annual salary as a function of his sales.</p><p>Which of the following relationships would give a graph of the shape shown?</p>","image":"images/q-712cb9c4ee.jpg","options":["Bill's salary is a fixed percentage of his sales.","Bill's salary consists of a fixed amount plus a percentage of all his sales.","Bill's salary is a fixed amount either reduced by a percentage of sales below his target sales or increased by the same percentage above his target.","Bill's salary is a fixed amount for sales up to a target plus a percentage of his sales above his target.","Bill's salary is a fixed amount plus a percentage of his sales which increases with the sales volume."],"correct":3,"src":"CRIT33","orig":"images/q-712cb9c4ee.jpg","review":true},{"id":29,"topic":"PAR","text":"<p>The proportion of people's income spent on housing has remained largely unchanged over the past century. So as average incomes rise, people will simply choose to live in more expensive homes.</p><p>Which of the following most closely parallels the reasoning in the above argument?</p>","image":"","options":["The average size of homes has increased over time, meaning people want more space.","House prices have grown faster than wages in most major cities.","The percentage of household budgets spent on food has stayed the same, so rising incomes mean families will buy more expensive food.","People spend less on food now than in the past because technology makes it cheaper.","Incomes are rising, so more people will be able to afford their own homes."],"correct":2,"src":"CRIT33","orig":"images/q-1a62395495.jpg"},{"id":30,"topic":"PS","text":"<p>There is an old saying, \"a hen and a half lays an egg and a half in a day and a half\".</p><p>If let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
