<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p>In recent years, governments around the world have introduced taxes on sugary drinks in an attempt to reduce obesity rates. In the UK, for example, the introduction of a sugar tax led several major beverage companies to reformulate their products with less sugar to avoid the tax. Sales data show that, since the tax began, consumption of sugary drinks has declined, particularly among young people. Although critics argue that this is government overreach, the evidence suggests that such taxes are effective in reducing sugar consumption.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Beverage companies reformulate their products for profit.", "Taxes on sugary drinks are effective in reducing sugar consumption.", "Young people consume more sugary drinks than older people.", "Critics are wrong to oppose the sugar tax.", "Obesity is caused primarily by sugar."], "correct": 1, "src": "CRIT31", "orig": "images/q-2754ed377f.jpg", "explain": "The final sentence sums up: the evidence shows sugar taxes are effective in reducing sugar consumption — B. The rest (reformulation, falling sales) supports it; D is not what's argued."}, {"id": 2, "topic": "ASM", "text": "<p>Marat fancied a new iPad costing $700.00. He had been saving hard throughout the holidays, but was still short of $270.00. He took up casual evening work after school at a local factory assembling kettle parts. Each assembly earned him $2.50 per kettle up to 10 kettles. Over that number, he was paid, in addition, a bonus of $1.20 per kettle. He could assemble 13 kettles per evening. After 6 evenings of work, he stayed away for three days owing to a toothache.</p><p>If he had started work on a Monday, October 6th, on what date would he have earned enough money to quit, assuming that he did not take any other time off? [The factory operated on a Monday to Friday work basis.]</p>", "image": "", "options": ["20th October", "21st October", "22nd October", "23rd October", "24th October"], "correct": 0, "src": "CRIT31", "orig": "images/q-f5739833b7.jpg", "explain": "Pay per evening: 10 × $2.50 = $25, plus 3 × ($2.50 + $1.20) = $11.10, so $36.10. He needs $270: 7 evenings give $252.70, 8 give $288.80, so 8 evenings. Evenings 1–6: 6–10 Oct and 13 Oct. Off 14–16 Oct. Evening 7: 17 Oct, evening 8: Monday 20 Oct."}, {"id": 3, "topic": "ASM", "text": "<p>In recent years, several cities have replaced conventional streetlights with LED lights to reduce energy consumption and lower maintenance costs. These LED systems are brighter, last longer, and use significantly less electricity. Although the initial cost of installation is higher, supporters argue that the investment pays for itself over time through savings. Critics, however, argue that the brightness of LED lights may disrupt sleep patterns in nearby residents. Still, the energy savings are so substantial that the switch to LEDs is clearly the best option for municipalities.</p><p>Which of the following is an assumption on which the argument depends?</p>", "image": "", "options": ["Residents are willing to tolerate some disruption to their sleep.", "The brightness of LED lights does not outweigh the benefits of energy savings.", "Cities have enough funding to pay for the LED systems upfront.", "Maintenance costs are not significant for most cities.", "People prefer brighter lighting in public areas."], "correct": 1, "src": "CRIT31", "orig": "images/q-d91e1e31d5.jpg", "explain": "The argument admits the brightness may disturb sleep but still calls LEDs 'clearly the best option'. That assumes the disturbance does not outweigh the energy savings — B."}, {"id": 4, "topic": "MC", "text": "<p>Public funding for the arts has long been controversial. Opponents argue that taxpayer money should not be spent on things like experimental theatre or abstract sculpture that do not benefit everyone. However, supporters point out that public funding has enabled access to art for wider audiences, supported cultural education in schools, and preserved national heritage. Without such funding, many smaller projects would never get off the ground. Therefore, government support for the arts is a justified and important use of public funds.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Art should be accessible to everyone.", "Supporting the arts helps preserve national identity.", "The arts deserve public funding.", "Most people do not appreciate experimental theatre.", "Public funds are often wasted."], "correct": 2, "src": "CRIT31", "orig": "images/q-23a7966427.jpg", "explain": "The last sentence, introduced by \"Therefore\", is the conclusion: government support for the arts is a justified use of public funds — C. A and B are reasons supporting it; D and E are not claimed."}, {"id": 5, "topic": "ASM", "text": "<p>Some companies offer unlimited paid vacation policies, allowing employees to take time off whenever they choose, as long as their work is completed. Advocates of the policy claim it leads to increased productivity, improved morale, and greater employee loyalty. However, some studies have shown that employees at such companies actually take fewer vacation days than before. Advocates respond that the sense of freedom and trust this policy creates is more important than the number of days taken.</p><p>Which of the following is an assumption that supports the advocates' argument?</p>", "image": "", "options": ["Employees value trust and autonomy more than time off.", "Most employees use vacation time to recover from burnout.", "Companies with unlimited vacation save money on HR policies.", "Unlimited vacation is becoming a common workplace trend.", "Employees will eventually start using more vacation days."], "correct": 0, "src": "CRIT31", "orig": "images/q-ea03b3fedb.jpg", "explain": "Advocates say the freedom and trust matter more than the number of days taken. That assumes employees value trust and autonomy more than actual time off — A."}, {"id": 6, "topic": "PS", "text": "<p>Aisha has won prize money of $400. She does not need the money for three years from now and considers investing it in one of two banks. Freedom Banking offers her a simple fixed interest of 5.5% per year on the capital amount invested for three years. Simple interest means the same amount of interest is earned every year based only on the original capital invested. Jusan. offers a compound interest rate of 5% per year, with interest added at the end of each year. Compound interest means that interest is payable every subsequent year on the cumulative total amount of capital plus previously earned interest.</p><p>How do the two investments compare?</p>", "image": "", "options": ["Freedom would be better by $6.00.", "Freedom would be better by $3.95.", "Freedom would be better by $2.95.", "Freedom would be better by $2.00.", "They would both be the same."], "correct": 2, "src": "CRIT31", "orig": "images/q-9595abd09c.jpg", "explain": "Simple: 400 × 0.055 × 3 = $66. Compound: 400 × 1.05³ = $463.05, so $63.05. Freedom is better by $2.95."}, {"id": 7, "topic": "PRIN", "text": "<p>A city bans the use of single-use plastic bags in supermarkets. The law is meant to reduce plastic waste and promote environmental responsibility. Some customers complain about the inconvenience, but city officials argue that small sacrifices are acceptable when they serve a greater public good.</p><p>Which of the following principles best justifies the city's policy?</p>", "image": "", "options": ["Environmental protection sometimes requires individuals to accept inconvenience.", "Customer satisfaction should always be the top priority.", "Personal habits are hard to change.", "Supermarkets should offer alternatives to plastic bags.", "Policies should avoid upsetting the public."], "correct": 0, "src": "CRIT31", "orig": "images/q-500d9fbaa1.jpg", "explain": "The officials justify inconvenience by a greater public good. The principle: environmental protection sometimes requires people to accept inconvenience — A."}, {"id": 8, "topic": "ASM", "text": "<p>The following tables show the number of children in families visiting a major tourist attraction.</p><p><strong>Mexico</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>5</td></tr><tr><td>1</td><td>6</td></tr><tr><td>2</td><td>5</td></tr><tr><td>3</td><td>4</td></tr><tr><td>4+</td><td>3</td></tr></tbody></table><p><strong>USA</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>3</td></tr><tr><td>1</td><td>4</td></tr><tr><td>2</td><td>4</td></tr><tr><td>3</td><td>2</td></tr><tr><td>4+</td><td>0</td></tr></tbody></table><p><strong>Canada</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>0</td></tr><tr><td>1</td><td>4</td></tr><tr><td>2</td><td>7</td></tr><tr><td>3</td><td>2</td></tr><tr><td>4+</td><td>0</td></tr></tbody></table><p>49 families were surveyed in total. You can assume that no child is counted in more than one family</p><p>Ignoring the usefulness of the statistics, which one of the following averages could not be calculated from the above information alone?</p>", "image": "", "options": ["The mean number of children per family from Canada.", "The mean number of families per child from the USA.", "The mean number of families per row in the table from Mexico.", "The mean number of families per country in the survey.", "The mean number of children per family from Mexico and the USA."], "correct": 4, "src": "CRIT31", "orig": "images/q-e7a10b9235.jpg", "explain": "Mexico has 3 families with '4+' children, so the exact number of Mexican children is unknown and any mean that needs it can't be calculated. E includes Mexico. The USA and Canada have no '4+' families, so A and B work, and C and D only need family counts."}, {"id": 9, "topic": "PAR", "text": "<p>People who regularly donate to charities often report a sense of fulfilment and purpose. While critics argue that many charitable organisations are inefficient, donating remains one of the few ways individuals can directly contribute to social change. Therefore, as long as a person believes in the cause, it is reasonable ,even admirable for them to continue supporting it.</p><p>Which one of the following most closely parallels the reasoning used in the above argument?</p>", "image": "", "options": ["Although some eco-friendly products are not perfectly sustainable, individuals who care about the environment are justified in continuing to purchase them.", "People should always research the sustainability of products before making purchases.", "If a product is advertised as green but isn't, it should be removed from the market.", "Supporting flawed environmental solutions only delays real progress.", "Most people are misled about how eco-friendly their purchases actually are."], "correct": 0, "src": "CRIT31", "orig": "images/q-f605c89b4e.jpg", "explain": "Structure: the thing has flaws (inefficient charities), but if you believe in it, it's reasonable to keep supporting it. A matches: products aren't perfectly sustainable, but people who care are justified in buying them."}, {"id": 10, "topic": "WKN", "text": "<p>A city council introduced a program that rewards households with cash incentives for reducing water usage. After one year, data showed a 15% decrease in average water consumption. Officials concluded that the incentive program was responsible for this success.</p><p>Which one of the following, if true, would most weaken the officials' conclusion?</p>", "image": "", "options": ["The city also experienced unusually high rainfall that year.", "Some households did not participate in the program.", "People are becoming more environmentally conscious in general.", "A few residents misused the reporting system for rewards.", "Other cities have used similar programs in the past."], "correct": 0, "src": "CRIT31", "orig": "images/q-501b01f784.jpg", "explain": "The officials credit the incentives for the 15% drop. A gives another cause: a very rainy year means less watering and lower use."}, {"id": 11, "topic": "PS", "text": "<p>Population density depends on both population and country area. Thus, the density of Belize is the population 269,736 divided by the country area 22,968, giving a density of about 12 people per square kilometre.</p><p>Find the country in the table which has the smallest population density. Which option includes this country?</p><table class=\"q-table\"><thead><tr><th>Country</th><th>Population</th><th>Area (km\\(^2\\))</th></tr></thead><tbody><tr><td>Belize</td><td>269,736</td><td>22,968</td></tr><tr><td>Djibouti</td><td>793,078</td><td>23,200</td></tr><tr><td>Estonia</td><td>1,329,697</td><td>45,108</td></tr><tr><td>Latvia</td><td>2,306,988</td><td>64,600</td></tr><tr><td>Panama</td><td>3,231,502</td><td>75,517</td></tr><tr><td>Bhutan</td><td>2,162,546</td><td>47,000</td></tr><tr><td>Montenegro</td><td>630,548</td><td>14,026</td></tr><tr><td>French Guiana</td><td>187,056</td><td>91,000</td></tr><tr><td>New Caledonia</td><td>236,838</td><td>18,575</td></tr><tr><td>Solomon Islands</td><td>477,742</td><td>28,896</td></tr><tr><td>Equatorial Guinea</td><td>503,519</td><td>28,051</td></tr><tr><td>Monaco</td><td>35,253</td><td>1</td></tr><tr><td>The Bahamas</td><td>323,063</td><td>13,878</td></tr><tr><td>Pitcairn Islands</td><td>67</td><td>5</td></tr><tr><td>Vanuatu</td><td>211,367</td><td>12,189</td></tr></tbody></table>", "image": "", "options": ["Belize, Djibouti, Estonia", "Latvia, Panama, Bhutan", "Montenegro, French Guiana, New Caledonia", "Solomon Islands, Equatorial Guinea, Monaco", "The Bahamas, Pitcairn Islands, Vanuatu"], "correct": 2, "src": "CRIT31", "orig": "images/q-b88c2855fb.jpg", "explain": "Density = population ÷ area. Most countries are above 10 people/km² (Monaco is about 35,000). French Guiana: 187,056 ÷ 91,000 ≈ 2 people/km² — by far the smallest. It is in option C."}, {"id": 12, "topic": "PS", "text": "<p>Ahmed was given 1050ml of rose water in a jug. He wanted to divide it entirely amongst his three sisters, Tanya, Nadya, and Polina. It was decided that the youngest sister, Tanya should get the smallest portion, which was to be exactly half of Nadya's, while Polina should get the lion's share, i.e. double that of Nadya's.</p><p>How much rose water would Nadya get?</p>", "image": "", "options": ["210ml", "300ml", "316ml", "333ml", "350ml"], "correct": 1, "src": "CRIT31", "orig": "images/q-6f0596b334.jpg", "explain": "Let Nadya have N: Tanya N/2, Polina 2N. 3.5N = 1050, N = 300 ml."}, {"id": 13, "topic": "PS", "text": "<p>Amir saw a sign at Invictus Fitness Studio:</p><p>\"Buy 8 classes for the price of 6 and save $7.20.\"</p><p>Amir doesn't want to buy 8 classes but is trying to determine how much he would pay for 3 separate classes, purchased one at a time at the regular, undiscounted price.</p><p><strong>How much would Amir pay in total?</strong></p>", "image": "", "options": ["$7.20", "$9.00", "$10.80", "$12.00", "$14.40"], "correct": 2, "src": "CRIT31", "orig": "images/q-e94bb02cab.jpg", "explain": "8 classes for the price of 6 saves the price of 2 classes = $7.20, so one class costs $3.60. Three classes cost $10.80."}, {"id": 14, "topic": "PS", "text": "<p>Where trees have a constant water supply the width of growth each year increases with warmer weather. You can tell from the curve of the tree rings which one is the oldest. The average temperatures in our local wood for the last ten years given in degrees were:</p><p>20 22 19 24 21 21 20 20 23 25</p><p>Which one of the following could be entirely from wood growing during the last ten years? (Widths are measured in mm.)</p>", "image": "images/q-4b39c0eda0.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 1, "src": "CRIT31", "review": true, "orig": "images/q-4b39c0eda0.jpg", "explain": "Ring width rises with temperature, so equal temperatures give equal widths and hotter years give wider rings. B (widths 1, 7, 3) fits three consecutive years 19°, 24°, 21°: the coolest year is narrowest, the hottest widest. The other patterns can't be matched to any run of the ten temperatures."}, {"id": 15, "topic": "PRIN", "text": "<p>A teacher believes that grading students based on fixed external standards does not fairly reflect their efforts. She argues that a more meaningful way to assess learning is by measuring how much each student has improved from their starting point. As a result, she decides to evaluate students based on individual progress, even if this leads to more students receiving high grades than usual.</p><p>Which one of the following principles most clearly justifies the teacher's approach?</p>", "image": "", "options": ["Students should be assessed according to their personal development rather than universal benchmarks.", "Teachers should give higher grades when class averages are low.", "Standards in education must be the same for all students.", "A student's effort is more important than their understanding.", "Grades should be limited to reflect a normal distribution"], "correct": 0, "src": "CRIT31", "orig": "images/q-d07ed92532.jpg", "explain": "The teacher grades progress from each student's starting point instead of fixed standards. Principle A says exactly that."}, {"id": 16, "topic": "WKN", "text": "<p>Some argue that artificial intelligence (AI) will eventually eliminate the need for human workers in many professions. They claim that machines are already more efficient at processing information and performing repetitive tasks. However, critics believe that fears about AI are overstated and that human intuition and creativity cannot be replicated. Still, the increasing presence of AI in sectors like law and medicine suggests that full automation is inevitable.</p><p>Which one of the following, if true, would most seriously weaken the argument that full automation is inevitable?</p>", "image": "", "options": ["AI systems can now compose music and write news articles.", "Many AI projects still rely heavily on human supervision.", "People are afraid of machines making life-or-death decisions.", "Some countries have banned certain forms of AI use.", "There are ethical concerns about using AI in creative fields."], "correct": 1, "src": "CRIT31", "orig": "images/q-d4c2ac7a95.jpg", "explain": "The argument says AI's spread in law and medicine shows full automation is inevitable. B weakens it: many AI projects still depend on human supervision."}, {"id": 17, "topic": "WKN", "text": "<p>A recent initiative encouraged schools to replace desks and chairs with standing workstations. The organisers argued that sitting for long periods is harmful to children's health and that standing while working would reduce obesity and improve concentration. Some early pilot schools have reported positive student feedback. Therefore, all schools should adopt standing workstations to improve academic outcomes.</p><p>Which one of the following, if true, would most weaken the argument?</p>", "image": "", "options": ["Standing for long periods can cause discomfort and fatigue in children.", "Some schools lack the budget to replace all furniture.", "Not all students prefer to stand while working.", "Pilot schools had additional support during implementation.", "Students are already active during breaks and PE lessons."], "correct": 3, "src": "CRIT31", "orig": "images/q-b75cce8be8.jpg", "explain": "The argument generalises from positive feedback in pilot schools. D weakens it: those schools had extra support, so others may not see the same results."}, {"id": 18, "topic": "FLAW", "text": "<p>In a survey of employees at a large tech company, 85% of respondents reported that they were satisfied with their jobs. Therefore, job satisfaction in the tech industry is clearly very high.</p><p>Which one of the following best identifies a flaw in the argument?</p>", "image": "", "options": ["The survey did not measure job performance.", "Job satisfaction cannot be measured through surveys.", "One company's results do not represent an entire industry.", "Respondents may have misunderstood the question.", "The company may have excluded negative responses."], "correct": 2, "src": "CRIT31", "orig": "images/q-05602223b3.jpg", "explain": "A survey of one company is used to conclude about the whole industry — C."}, {"id": 19, "topic": "STR", "text": "<p>Many city councils are considering banning private cars from city centres to reduce air pollution. Supporters argue that fewer cars will lead to cleaner air and better public health. They point to the success of pedestrianised zones in a small number of European cities. Although some residents worry about inconvenience, advocates maintain that the environmental benefits justify the policy.</p><p>Which one of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Public transport usage increased significantly in cities that banned cars from their centres.", "Some businesses prefer locations outside city centres.", "Air pollution has many different causes besides cars.", "Not all European cities have the same infrastructure.", "Residents initially opposed the policy in most cities."], "correct": 0, "src": "CRIT31", "orig": "images/q-059b3ba681.jpg", "explain": "The argument says banning cars improves air. A supports it: people switched to public transport, so the ban reduced car journeys rather than just moving them."}, {"id": 20, "topic": "MC", "text": "<p>Over the past two decades, there has been a sharp rise in the number of university graduates entering the job market. At the same time, many employers now require a degree for positions that previously did not need one. This phenomenon, often referred to as \"credential inflation,\" has led to concerns that the value of a degree is declining. If everyone has a degree, it no longer serves as a meaningful indicator of higher skill or intelligence. Consequently, job seekers may be forced to pursue additional qualifications just to stand out.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Employers demand too many qualifications.", "A university degree no longer sets job applicants apart.", "Credential inflation is making higher education unaffordable.", "Many degrees are not useful in today's job market.", "More students are attending university than in the past."], "correct": 1, "src": "CRIT31", "orig": "images/q-49de3de0bc.jpg", "explain": "With almost everyone having a degree, it no longer signals higher skill — a degree no longer sets applicants apart (B). The need for extra qualifications follows from this."}, {"id": 21, "topic": "MC", "text": "<p>Many people assume that working long hours is a sign of dedication and productivity. However, research consistently shows that people who work more than 50 hours a week are actually less productive overall. Fatigue, stress, and poor work-life balance contribute to a decline in focus and efficiency. Some companies that adopted shorter workweeks have even reported increased output. Clearly, working fewer hours can lead to better overall performance.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Long hours damage workers' health.", "Companies should let employees choose their hours.", "Productivity decreases when people work too much.", "Working fewer hours can increase productivity.", "Employees prefer shorter workweeks."], "correct": 3, "src": "CRIT31", "orig": "images/q-ba180be336.jpg", "explain": "The final sentence (\"Clearly…\") is the conclusion: working fewer hours can  yet the simple explanation is that the conductivity of heat from the light and fluffy coals to the walker's feet is very poor. As long as you don't stand still, you will not get burned</p><p>Which one of the following is an inference that is supported by the above passage?</p>", "image": "", "options": ["There are no truly paranormal occurrences.", "Everything that occurs has an explanation.", "The lack of a simple explanation does not make an occurrence paranormal.", "Feats such as spoon-bending and telepathy do not really occur.", "None of the above"], "correct": 2, "src": "CRIT31", "orig": "images/q-7fb29a5890.jpg", "explain": "The passage argues that being unable to explain something doesn't make it paranormal (fire-walking has a simple explanation) — C.<br>A, B and D go further than the passage."}, {"id": 24, "topic": "PS", "text": "<p>There must be some reason why BBQ sausages are sold in packets of 10 and the lavash in packets of 12. I bought just enough packets of each to have the same number of each.</p><p>How many items were on the receipt?</p>", "image": "", "options": ["2", "10", "11", "12", "22"], "correct": 2, "src": "CRIT31", "orig": "images/q-27a59ae8c8.jpg", "explain": "LCM(10, 12) = 60: 6 packets of sausages and 5 packets of lavash, 11 items."}, {"id": 25, "topic": "STR", "text": "<p>Some economists argue that fines for traffic violations should be adjusted according to a driver's income. A flat fine may act as a serious deterrent for low-income drivers but have little impact on wealthy individuals. If fines are intended to discourage dangerous behaviour, they should affect all drivers equally, regardless of income level.</p><p>Which one of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Wealthy drivers receive more parking tickets than low-income drivers.", "Income-based fines have successfully reduced repeat offences in countries where they are used.", "Traffic accidents are more common in urban areas.", "Most drivers believe current fines are fair.", "Administering income-based fines would require additional bureaucracy."], "correct": 1, "src": "CRIT31", "orig": "images/q-6b0aa1010a.jpg", "explain": "The argument: income-based fines deter everyone equally. B shows such fines actually reduced repeat offending where used."}, {"id": 26, "topic": "MC", "text": "<p>A number of cities have introduced electric scooter-sharing systems to reduce traffic congestion and pollution. These scooters are promoted as eco-friendly alternatives to cars and are popular among younger commuters. However, multiple studies have shown that scooters often replace walking or public transport rather than car trips. In addition, the production and charging of scooters require electricity and materials with their own environmental impact. So, although electric scooters may appear to be a green solution, their actual environmental benefit is questionable.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Electric scooters are used more by young people.", "Public transport is more eco-friendly than scooters.", "Electric scooters do not reduce pollution as much as claimed.", "Scooter-sharing systems are poorly managed in cities.", "Scooters are not as fun as they look."], "correct": 2, "src": "CRIT31", "orig": "images/q-08cd3d4257.jpg", "explain": "Scooters replace walking and buses more than cars, and making/charging them has its own impact, so their environmental benefit is questionable — C."}, {"id": 27, "topic": "FLAW", "text": "<p>Many people believe that listening to classical music increases intelligence. In a controlled experiment, two groups of university students were given identical conditions, except that one group listened to Mozart before taking a spatial reasoning test while the other sat in silence. The group that listened to Mozart performed slightly better. Therefore, listening to classical music clearly makes people smarter.</p><p>Which one of the following best expresses the flaw in the argument?</p>", "image": "", "options": ["The students may have performed better for unrelated reasons.", "Spatial reasoning is only one aspect of intelligence.", "Some people do not enjoy classical music.", "The experiment only used one piece by Mozart.", "Music affects emotions, not intelligence."], "correct": 1, "src": "CRIT31", "orig": "images/q-866517a872.jpg", "explain": "One spatial test is used to claim music makes people 'smarter' in general. Spatial reasoning is only one part of intelligence — B."}, {"id": 28, "topic": "ASM", "text": "<p>Many health experts recommend raising taxes on fast food as a way to combat rising rates of obesity. They argue that higher prices will discourage frequent consumption, particularly among young people, and encourage healthier choices. While some critics say that such a tax unfairly targets low-income individuals, proponents maintain that the long-term health benefits outweigh short-term costs. If people eat less fast food, overall public health is likely to improve.</p><p>Which of the following is an assumption made by the argument?</p>", "image": "", "options": ["Low-income people eat more fast food than wealthy people.", "People will change their eating habits in response to higher prices.", "Obesity is primarily caused by fast food.", "Healthier food options are always more expensive.", "Most people agree with health experts on this issue."], "correct": 1, "src": "CRIT31", "orig": "images/q-eacc9f302d.jpg", "explain": "The tax works only if higher prices change what people eat — B."}, {"id": 29, "topic": "FLAW", "text": "<p>A recent study showed that people who own more books at home tend to perform better on reading comprehension tests. Based on this, educators have concluded that providing more books to students from low-income backgrounds will significantly improve their reading abilities.</p><p>Which one of the following best identifies a flaw in the reasoning?</p>", "image": "", "options": ["The study did not include students from all income levels.", "Owning books does not guarantee that they are being read.", "Students from low-income backgrounds may not enjoy reading.", "Reading comprehension is not the only important academic skill.", "Some students perform well even without books at home."], "correct": 1, "src": "CRIT31", "orig": "images/q-93b13075a9.jpg", "explain": "Owning books is linked to better reading, but giving books helps only if they are read. Owning books doesn't guarantee reading — B."}, {"id": 30, "topic": "STR", "text": "<p>Some educators argue that homework should be abolished in primary schools. They claim that long hours of homework increase stress and reduce children's interest in learning. Studies have shown that younger children learn more effectively through play and interaction than through formal written tasks. Therefore, removing homework at an early age would benefit children's overall development.</p><p>Which one of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Children with less homework spend more time on extracurricular activities.", "Teachers often assign homework without clear objectives.", "Countries with little or no primary-school homework perform well in international education rankings.", "Parents often help children with homework.", "Older students still benefit from structured homework."], "correct": 2, "src": "CRIT31", "orig": "images/q-f3a4201dca.jpg", "explain": "The argument says removing primary homework benefits children. C supports it: countries with little primary homework do well in international rankings."}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

    justify-content: space-between; margin-top: 8px; padding: 12px 4px;
    background: rgba(21,24,29,0.9); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .pl-bar .pl-count { font: 500 13px 'Inter', system-ui, sans-serif; opacity: .75; }
  .pl-bar .pl-submit {
    font: 600 14px 'Inter', system-ui, sans-serif; color: #fff; cursor: pointer; border: 0;
    background: linear-gradient(90deg,#8EADD2,#8EADD2,#C9AA6A);
    padding: 11px 26px; border-radius: 999px;
  }
  .pl-noselect, .pl-noselect * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  @media print { body.pl-noprint * { display: none !important; } }
</style>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">

    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

})();
