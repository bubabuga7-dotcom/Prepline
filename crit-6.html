<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #9DB8DC;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #9DB8DC 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(157,184,220,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p>In recent years, governments around the world have introduced taxes on sugary drinks in an attempt to reduce obesity rates. In the UK, for example, the introduction of a sugar tax led several major beverage companies to reformulate their products with less sugar to avoid the tax. Sales data show that, since the tax began, consumption of sugary drinks has declined, particularly among young people. Although critics argue that this is government overreach, the evidence suggests that such taxes are effective in reducing sugar consumption.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Beverage companies reformulate their products for profit.", "Taxes on sugary drinks are effective in reducing sugar consumption.", "Young people consume more sugary drinks than older people.", "Critics are wrong to oppose the sugar tax.", "Obesity is caused primarily by sugar."], "correct": 1, "src": "CRIT31", "orig": "images/q-2754ed377f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Main Conclusion: нужно найти главный тезис, который автор доказывает фактами. Здесь автор утверждает, что налоги на сладкие напитки помогают уменьшить потребление сахара.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В начале объясняется цель налога: снизить потребление сахара и, в перспективе, уровень ожирения. Это контекст, а не доказательство успеха политики.</li><li>Затем приводятся два факта: производители стали уменьшать содержание сахара, чтобы избежать налога, а потребление сладких напитков снизилось, особенно среди молодёжи.</li><li>Фраза «the evidence suggests that such taxes are effective in reducing sugar consumption» прямо формулирует вывод автора. Именно к нему ведут предыдущие факты.</li><li>Ответ B передаёт этот вывод без добавления новых утверждений. Снижение потребления после введения налога поддерживает вывод, хотя само по себе ещё не доказывает причинную связь окончательно.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — подмена объяснения. Компании действительно меняли рецептуру, чтобы избежать налога, но автор не делает главным выводом их стремление к прибыли. Поведение производителей используется как доказательство действия налога.</li><li>C — неправильное сравнение. В тексте говорится, что снижение потребления было особенно заметным среди молодых людей. Это не означает, что молодые люди изначально потребляли больше сладких напитков, чем пожилые.</li><li>D — слишком широкий вывод. Автор признаёт наличие критики государственного вмешательства, но показывает эффективность налога по одной цели. Даже эффективный налог можно критиковать по другим причинам, например из-за его стоимости для покупателей.</li><li>E — чрезмерное утверждение о причинах ожирения. Автор связывает налог со снижением потребления сахара, но не утверждает, что сахар является главной причиной ожирения. Для такого вывода потребовались бы дополнительные данные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В Main Conclusion найди утверждение, которому служат доказательствами остальные предложения. Не путай цель государственной политики с выводом о её эффективности.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p>Marat fancied a new iPad costing $700.00. He had been saving hard throughout the holidays, but was still short of $270.00. He took up casual evening work after school at a local factory assembling kettle parts. Each assembly earned him $2.50 per kettle up to 10 kettles. Over that number, he was paid, in addition, a bonus of $1.20 per kettle. He could assemble 13 kettles per evening. After 6 evenings of work, he stayed away for three days owing to a toothache.</p><p>If he had started work on a Monday, October 6th, on what date would he have earned enough money to quit, assuming that he did not take any other time off? [The factory operated on a Monday to Friday work basis.]</p>", "image": "", "options": ["20th October", "21st October", "22nd October", "23rd October", "24th October"], "correct": 0, "src": "CRIT31", "orig": "images/q-f5739833b7.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Это задача на расчёт, а не на логику: считаем заработок за вечер, число нужных вечеров и переводим вечера в даты с учётом выходных и пропуска.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Заработок за вечер: 13 чайников. Первые 10 по $2.50, а за каждый сверх 10 ещё бонус $1.20. Итого 13 × 2.50 + 3 × 1.20 = 32.50 + 3.60 = $36.10.</li><li>Нужно $270. 7 вечеров = 7 × 36.10 = $252.70 — не хватает. 8 вечеров = $288.80 — хватает. Значит, нужно 8 рабочих вечеров.</li><li>Календарь. Пн 6 октября — пт 10 октября: 5 вечеров. Пн 13 октября: 6-й вечер. Затем 3 дня пропуска: вт 14, ср 15, чт 16.</li><li>Пт 17 октября — 7-й вечер, сб и вс фабрика не работает, пн 20 октября — 8-й вечер. В этот день набирается нужная сумма. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (21 октября) — забыт бонус: 13 × 2.50 = $32.50 за вечер. Тогда 270 ÷ 32.50 = 8.3, то есть 9 вечеров, и 9-й вечер приходится на 21 октября.</li><li>C (22 октября) — бонус $1.20 посчитан вместо $2.50 за чайники сверх 10, а не в дополнение: 10 × 2.50 + 3 × 1.20 = $28.60. Нужно 10 вечеров, 10-й — 22 октября.</li><li>D (23 октября) — оплачены только первые 10 чайников: $25 за вечер. Нужно 11 вечеров, 11-й — 23 октября.</li><li>E (24 октября) — это 12 вечеров, то есть заработок не больше $24.50 за вечер. Это меньше даже оплаты за 10 чайников ($25), так что ни одно прочтение условия к этой дате не ведёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах «на какую дату» сначала найди число нужных рабочих дней (с проверкой n−1 и n), и только потом листай календарь по одному дню, отмечая выходные и пропуски.</div></div>"}, {"id": 3, "topic": "ASM", "text": "<p>In recent years, several cities have replaced conventional streetlights with LED lights to reduce energy consumption and lower maintenance costs. These LED systems are brighter, last longer, and use significantly less electricity. Although the initial cost of installation is higher, supporters argue that the investment pays for itself over time through savings. Critics, however, argue that the brightness of LED lights may disrupt sleep patterns in nearby residents. Still, the energy savings are so substantial that the switch to LEDs is clearly the best option for municipalities.</p><p>Which of the following is an assumption on which the argument depends?</p>", "image": "", "options": ["Residents are willing to tolerate some disruption to their sleep.", "The brightness of LED lights does not outweigh the benefits of energy savings.", "Cities have enough funding to pay for the LED systems upfront.", "Maintenance costs are not significant for most cities.", "People prefer brighter lighting in public areas."], "correct": 1, "src": "CRIT31", "orig": "images/q-d91e1e31d5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Assumption: нужно найти скрытое условие, без которого вывод автора теряет обоснование. Автор считает LED-освещение лучшим вариантом, несмотря на возможное нарушение сна жителей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сначала автор перечисляет преимущества LED: меньший расход электричества, долгий срок службы и экономию на обслуживании.</li><li>Затем появляется возражение: «the brightness of LED lights may disrupt sleep patterns». Значит, у решения есть потенциальный вред, который необходимо учитывать.</li><li>Автор всё равно заключает, что переход на LED — «clearly the best option». Для такого сравнения необходимо предположить, что возможные проблемы от яркости не перевешивают преимущества.</li><li>Ответ B содержит именно это условие. Проверим отрицанием: если вред от яркости превышает выгоду от экономии, прежнее обоснование выбора LED уже не работает.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком узкое допущение. Готовность жителей терпеть неудобство могла бы облегчить внедрение, но не доказывает, что LED объективно лучше. Люди могут соглашаться терпеть вред, даже если его последствия серьёзны.</li><li>C — практическое условие внедрения, а не главная логическая предпосылка сравнения. Наличие средств важно, но автор рассуждает о выгодах и недостатках технологии. Кроме того, первоначальные затраты могут покрываться не только существующим бюджетом.</li><li>D — противоречит одному из аргументов автора. Экономия на обслуживании названа преимуществом LED. Утверждение о незначительности этих расходов не помогает обосновать выбор.</li><li>E — подмена критерия. Предпочтение людей к яркому освещению не является условием вывода об экономической и экологической выгоде LED. Кроме того, предпочтение яркости не устраняет возможных проблем со сном.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Применяй Negation Test: мысленно отрицай выбранное допущение. Если после отрицания аргумент теряет важную опору, вероятно, найдено нужное условие.</div></div>"}, {"id": 4, "topic": "MC", "text": "<p>Public funding for the arts has long been controversial. Opponents argue that taxpayer money should not be spent on things like experimental theatre or abstract sculpture that do not benefit everyone. However, supporters point out that public funding has enabled access to art for wider audiences, supported cultural education in schools, and preserved national heritage. Without such funding, many smaller projects would never get off the ground. Therefore, government support for the arts is a justified and important use of public funds.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Art should be accessible to everyone.", "Supporting the arts helps preserve national identity.", "The arts deserve public funding.", "Most people do not appreciate experimental theatre.", "Public funds are often wasted."], "correct": 2, "src": "CRIT31", "orig": "images/q-23a7966427.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Main Conclusion: задача требует отличить основное утверждение от причин, которые его поддерживают. Автор защищает государственное финансирование искусства.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В начале представлена позиция противников: государственные деньги не следует тратить на искусство, которое приносит пользу не всем. Это возражение, а не позиция автора.</li><li>Сторонники приводят аргументы в пользу финансирования: искусство становится доступнее, поддерживается культурное образование и сохраняется национальное наследие.</li><li>Предложение «Without such funding, many smaller projects would never get off the ground» добавляет ещё одну причину поддерживать государственные расходы на искусство.</li><li>После «Therefore» сформулирован главный вывод: государственная поддержка искусства является оправданным и важным использованием общественных средств. Ответ C точно передаёт его смысл.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — отдельная ценность, а не главный вывод. Расширение доступа к искусству используется как причина поддерживать финансирование. Автор не устанавливает всеобщую доступность искусства как самостоятельную цель своего аргумента.</li><li>B — сужение вывода до одного преимущества. Сохранение национального наследия действительно упомянуто, но это только одна из нескольких причин государственного финансирования. Основной вывод касается самого финансирования.</li><li>D — искажение позиции оппонентов. Они сомневаются в пользе экспериментального искусства для всех налогоплательщиков. Это не равнозначно утверждению, что большинство людей такое искусство не ценит.</li><li>E — подмена позиции автора позицией критиков. Автор не заявляет, что общественные средства часто расходуются впустую. Напротив, он приводит аргументы, почему расходы на искусство могут быть оправданными.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если в тексте есть «Therefore», проверь следующее за ним утверждение. Затем убедись, что остальные предложения действительно служат его обоснованием.</div></div>"}, {"id": 5, "topic": "ASM", "text": "<p>Some companies offer unlimited paid vacation policies, allowing employees to take time off whenever they choose, as long as their work is completed. Advocates of the policy claim it leads to increased productivity, improved morale, and greater employee loyalty. However, some studies have shown that employees at such companies actually take fewer vacation days than before. Advocates respond that the sense of freedom and trust this policy creates is more important than the number of days taken.</p><p>Which of the following is an assumption that supports the advocates' argument?</p>", "image": "", "options": ["Employees value trust and autonomy more than time off.", "Most employees use vacation time to recover from burnout.", "Companies with unlimited vacation save money on HR policies.", "Unlimited vacation is becoming a common workplace trend.", "Employees will eventually start using more vacation days."], "correct": 0, "src": "CRIT31", "orig": "images/q-ea03b3fedb.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Assumption: нужно найти условие, поддерживающее ответ сторонников политики на возражение. Они считают, что доверие и свобода выбора могут быть ценнее фактического количества отпускных дней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторонники неограниченного отпуска обещают повышение продуктивности, настроения и лояльности сотрудников.</li><li>Исследования создают проблему для этой позиции: сотрудники иногда берут меньше выходных, чем раньше. Поэтому количество дней отдыха не обязательно увеличивается.</li><li>В ответ сторонники заявляют: «the sense of freedom and trust this policy creates is more important than the number of days taken». Они переносят внимание с продолжительности отпуска на ощущение самостоятельности.</li><li>Ответ A лучше всего поддерживает этот переход: если сотрудники действительно высоко ценят доверие и автономию, сокращение фактического отдыха не обязательно уничтожает преимущества политики. Однако A сформулирован слишком широко: не обязательно, чтобы все сотрудники ценили автономию больше отдыха.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — постороннее объяснение назначения отпуска. Даже если большинство сотрудников отдыхает ради восстановления после переутомления, это не доказывает, что чувство доверия компенсирует уменьшение числа отпускных дней.</li><li>C — подмена преимуществ для сотрудников экономией компании. Снижение административных расходов могло бы быть аргументом для работодателя, но сторонники защищают психологическую ценность свободы и доверия.</li><li>D — аргумент о популярности вместо полезности. Распространение неограниченного отпуска среди компаний не показывает, что сотрудники ценят его преимущества или становятся продуктивнее.</li><li>E — предположение о будущем вместо ответа на нынешнюю проблему. Сторонники не утверждают, что сотрудники обязательно начнут чаще отдыхать. Их ответ строится на ценности автономии даже при меньшем количестве отпускных дней.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В Assumption после возражения сначала найди, как именно автор защищает свою позицию. Ищи скрытое условие этого ответа, а не просто положительный факт о предложенной политике.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p>Aisha has won prize money of $400. She does not need the money for three years from now and considers investing it in one of two banks. Freedom Banking offers her a simple fixed interest of 5.5% per year on the capital amount invested for three years. Simple interest means the same amount of interest is earned every year based only on the original capital invested. Jusan. offers a compound interest rate of 5% per year, with interest added at the end of each year. Compound interest means that interest is payable every subsequent year on the cumulative total amount of capital plus previously earned interest.</p><p>How do the two investments compare?</p>", "image": "", "options": ["Freedom would be better by $6.00.", "Freedom would be better by $3.95.", "Freedom would be better by $2.95.", "Freedom would be better by $2.00.", "They would both be the same."], "correct": 2, "src": "CRIT31", "orig": "images/q-9595abd09c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем доход в обоих банках.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Простые проценты: 400 · 0,055 · 3 = $66.</li><li>Сложные: 400 · 1,05³ = 463,05 → доход $63,05.</li><li>Разница: 66 − 63,05 = $2,95. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — ошибки в счёте.</li><li>E — суммы разные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1,05³ = 1,157625.</div></div>"}, {"id": 7, "topic": "PRIN", "text": "<p>A city bans the use of single-use plastic bags in supermarkets. The law is meant to reduce plastic waste and promote environmental responsibility. Some customers complain about the inconvenience, but city officials argue that small sacrifices are acceptable when they serve a greater public good.</p><p>Which of the following principles best justifies the city's policy?</p>", "image": "", "options": ["Environmental protection sometimes requires individuals to accept inconvenience.", "Customer satisfaction should always be the top priority.", "Personal habits are hard to change.", "Supermarkets should offer alternatives to plastic bags.", "Policies should avoid upsetting the public."], "correct": 0, "src": "CRIT31", "orig": "images/q-500d9fbaa1.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Principle: нужно выбрать общее правило, которое оправдывает конкретное решение. Город допускает небольшие личные неудобства ради уменьшения пластиковых отходов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Город запрещает одноразовые пластиковые пакеты. Цель запрета — сократить пластиковые отходы и поддержать экологически ответственное поведение.</li><li>Покупатели жалуются на неудобство, но чиновники отвечают: «small sacrifices are acceptable when they serve a greater public good». Это центральное обоснование политики.</li><li>Нужный принцип должен соединять личное неудобство с общественной экологической выгодой, а не просто описывать возможные последствия запрета.</li><li>Ответ A выражает подходящее правило: защита окружающей среды иногда требует принятия неудобств отдельными людьми. Оно прямо оправдывает решение города.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — противоположный приоритет. Если удовлетворённость покупателей всегда важнее всего, запрет пакетов следовало бы отменить при возникновении жалоб. Чиновники, наоборот, допускают неудобство ради общественной выгоды.</li><li>C — описание сложности изменения привычек, а не оправдание. Даже если привычки менять трудно, из этого не следует, что запрет пластиковых пакетов является правильной политикой.</li><li>D — дополнительная мера вместо общего принципа. Предоставление альтернативных пакетов могло бы смягчить неудобства, но не объясняет, почему город вправе ограничить использование одноразового пластика.</li><li>E — противоречие позиции чиновников. Если политика должна избегать недовольства населения, жалобы покупателей становятся основанием отказаться от запрета. Автор допускает такое недовольство ради экологической цели.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверь принцип фразой «Это решение оправданно, потому что...». Правильный вариант должен объяснять допустимость самого решения, а не только описывать ситуацию.</div></div>"}, {"id": 8, "topic": "ASM", "text": "<p>The following tables show the number of children in families visiting a major tourist attraction.</p><p><strong>Mexico</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>5</td></tr><tr><td>1</td><td>6</td></tr><tr><td>2</td><td>5</td></tr><tr><td>3</td><td>4</td></tr><tr><td>4+</td><td>3</td></tr></tbody></table><p><strong>USA</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>3</td></tr><tr><td>1</td><td>4</td></tr><tr><td>2</td><td>4</td></tr><tr><td>3</td><td>2</td></tr><tr><td>4+</td><td>0</td></tr></tbody></table><p><strong>Canada</strong></p><table class=\"q-table\"><thead><tr><th>Number of children</th><th>Frequency</th></tr></thead><tbody><tr><td>0</td><td>0</td></tr><tr><td>1</td><td>4</td></tr><tr><td>2</td><td>7</td></tr><tr><td>3</td><td>2</td></tr><tr><td>4+</td><td>0</td></tr></tbody></table><p>49 families were surveyed in total. You can assume that no child is counted in more than one family</p><p>Ignoring the usefulness of the statistics, which one of the following averages could not be calculated from the above information alone?</p>", "image": "", "options": ["The mean number of children per family from Canada.", "The mean number of families per child from the USA.", "The mean number of families per row in the table from Mexico.", "The mean number of families per country in the survey.", "The mean number of children per family from Mexico and the USA."], "correct": 4, "src": "CRIT31", "orig": "images/q-e7a10b9235.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>Assumption</span><span>Data</span></span> Sufficiency: задача проверяет, достаточно ли данных для вычисления разных средних значений. Главная ловушка — категория «4+», которая не сообщает точного числа детей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сначала проверяем, какие средние требуют точного количества детей. Для Канады и США категория «4+» имеет частоту 0, поэтому число детей в каждой учтённой семье известно.</li><li>Для Мексики ситуация другая: в категории «4+» находятся три семьи. Это могут быть семьи с четырьмя, пятью или большим количеством детей. Поэтому общий результат по детям нельзя определить точно.</li><li>Варианты C и D используют количество семей, а не неизвестное число детей: для Мексики частоты равны 5, 6, 5, 4 и 3, а всего опрошено 49 семей из трёх стран.</li><li>Ответ E: для среднего числа детей на семью по Мексике и США нужно знать точное число детей в мексиканских семьях категории «4+». Ключ E верен. При этом вариант B сформулирован необычно, но при буквальном понимании среднего числа семей на ребёнка для США необходимые данные имеются.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — все необходимые данные доступны. В Канаде 4 семьи с одним ребёнком, 7 с двумя и 2 с тремя. Всего 13 семей и 24 ребёнка, поэтому среднее равно <span class=\"fr\"><span>24</span><span>13</span></span>.</li><li>B — необычная формулировка, но данные для США полные. Там 13 семей и 18 детей. Если понимать показатель буквально как отношение числа семей к числу детей, получаем <span class=\"fr\"><span>13</span><span>18</span></span>. В отличие от Мексики, неизвестной категории с ненулевой частотой здесь нет.</li><li>C — путаница между числом семей и числом детей. Частоты мексиканской таблицы известны полностью: 5 + 6 + 5 + 4 + 3 = 23 семьи. На пять строк приходится в среднем <span class=\"fr\"><span>23</span><span>5</span></span> = 4,6 семьи.</li><li>D — это среднее по странам, а не по детям. Известно, что обследованы 49 семей из трёх стран, поэтому среднее количество семей на страну равно <span class=\"fr\"><span>49</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перед вычислением среднего проверь два условия: точно ли известны сумма учитываемой величины и количество объектов? Открытая категория вроде «4+» мешает только тем вычислениям, где требуется её точное значение.</div></div>"}, {"id": 9, "topic": "PAR", "text": "<p>People who regularly donate to charities often report a sense of fulfilment and purpose. While critics argue that many charitable organisations are inefficient, donating remains one of the few ways individuals can directly contribute to social change. Therefore, as long as a person believes in the cause, it is reasonable ,even admirable for them to continue supporting it.</p><p>Which one of the following most closely parallels the reasoning used in the above argument?</p>", "image": "", "options": ["Although some eco-friendly products are not perfectly sustainable, individuals who care about the environment are justified in continuing to purchase them.", "People should always research the sustainability of products before making purchases.", "If a product is advertised as green but isn't, it should be removed from the market.", "Supporting flawed environmental solutions only delays real progress.", "Most people are misled about how eco-friendly their purchases actually are."], "correct": 0, "src": "CRIT31", "orig": "images/q-f605c89b4e.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Parallel Reasoning: нужно найти аргумент с такой же логической структурой, а не с похожей темой. Структура исходного рассуждения: деятельность несовершенна, но её ценность всё равно оправдывает продолжение поддержки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор признаёт возражение: «many charitable organisations are inefficient». Значит, благотворительная деятельность имеет недостатки, которые могут вызывать сомнения.</li><li>Затем приводятся положительные основания: пожертвования дают ощущение смысла и позволяют непосредственно способствовать социальным изменениям.</li><li>Вывод: если человек верит в цель, продолжать поддержку разумно и даже достойно уважения. Недостаток деятельности сам по себе не означает, что от неё необходимо отказаться.</li><li>Ответ A повторяет ту же схему: экологичные товары не всегда полностью устойчивы, но заботящиеся о природе люди могут быть оправданы в продолжении их покупки. Меняется предмет обсуждения, а логика сохраняется.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — другая структура рассуждения. Вариант требует предварительно изучать экологичность товаров, то есть предлагает проверку перед действием. Исходный аргумент оправдывает продолжение деятельности несмотря на известные недостатки.</li><li>C — противоположная реакция на недостаток. Здесь предлагается убрать товар с рынка при несоответствии рекламе. Исходный аргумент не требует прекращать благотворительность из-за несовершенства организаций.</li><li>D — противоположный вывод. Вариант утверждает, что поддержка несовершенных решений препятствует прогрессу. Исходный аргумент считает продолжение поддержки оправданным при наличии ценной цели.</li><li>E — описание возможного заблуждения людей. Вариант говорит о неверных представлениях покупателей, но не строит вывод о том, следует ли продолжать деятельность при наличии недостатков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для Parallel Reasoning запиши аргумент в виде схемы: «Хотя X имеет недостаток Y, оно приносит пользу Z, поэтому продолжать X допустимо». Затем ищи вариант с той же схемой независимо от темы.</div></div>"}, {"id": 10, "topic": "WKN", "text": "<p>A city council introduced a program that rewards households with cash incentives for reducing water usage. After one year, data showed a 15% decrease in average water consumption. Officials concluded that the incentive program was responsible for this success.</p><p>Which one of the following, if true, would most weaken the officials' conclusion?</p>", "image": "", "options": ["The city also experienced unusually high rainfall that year.", "Some households did not participate in the program.", "People are becoming more environmentally conscious in general.", "A few residents misused the reporting system for rewards.", "Other cities have used similar programs in the past."], "correct": 0, "src": "CRIT31", "orig": "images/q-501b01f784.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Weakening: нужно найти факт, который ставит под сомнение объяснение результата. Чиновники приписывают снижение потребления воды программе денежных вознаграждений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Известно, что после введения программы среднее потребление воды снизилось на 15%. Это наблюдаемый результат.</li><li>Чиновники утверждают, что именно программа вызвала снижение. Здесь возникает возможная ошибка: событие произошло после введения программы, но причина результата ещё не установлена.</li><li>Ответ A предлагает альтернативную причину: необычно сильные дожди могли уменьшить необходимость поливать сады и другие территории.</li><li>Если потребление сократилось хотя бы частично из-за дождей, чиновники не могут уверенно приписывать весь успех денежным стимулам. Поэтому A — лучший ответ, хотя дождливая погода сама по себе не доказывает неэффективность программы.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — неполное участие не опровергает эффективность программы. Даже если некоторые семьи не участвовали, снижение потребления у остальных могло привести к общему уменьшению расхода воды.</li><li>C — слишком общее альтернативное объяснение. Рост экологической сознательности мог повлиять на экономию воды, но вариант не устанавливает, что именно в этом городе за рассматриваемый год произошли изменения, объясняющие снижение на 15%.</li><li>D — проблема достоверности части отчётов, но без указания масштаба. Несколько случаев злоупотребления системой могут искажать данные о наградах, однако не показано, что они объясняют общее снижение среднего потребления.</li><li>E — сведения о других городах не ослабляют вывод. Использование подобных программ в прошлом ничего не сообщает о том, сработала ли конкретная программа и какую роль сыграли другие факторы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Когда автор утверждает «после X произошло Y, значит X вызвало Y», ищи альтернативную причину Y. Особенно сильны варианты, связанные с тем же местом и периодом.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p>Population density depends on both population and country area. Thus, the density of Belize is the population 269,736 divided by the country area 22,968, giving a density of about 12 people per square kilometre.</p><p>Find the country in the table which has the smallest population density. Which option includes this country?</p><table class=\"q-table\"><thead><tr><th>Country</th><th>Population</th><th>Area (km\\(^2\\))</th></tr></thead><tbody><tr><td>Belize</td><td>269,736</td><td>22,968</td></tr><tr><td>Djibouti</td><td>793,078</td><td>23,200</td></tr><tr><td>Estonia</td><td>1,329,697</td><td>45,108</td></tr><tr><td>Latvia</td><td>2,306,988</td><td>64,600</td></tr><tr><td>Panama</td><td>3,231,502</td><td>75,517</td></tr><tr><td>Bhutan</td><td>2,162,546</td><td>47,000</td></tr><tr><td>Montenegro</td><td>630,548</td><td>14,026</td></tr><tr><td>French Guiana</td><td>187,056</td><td>91,000</td></tr><tr><td>New Caledonia</td><td>236,838</td><td>18,575</td></tr><tr><td>Solomon Islands</td><td>477,742</td><td>28,896</td></tr><tr><td>Equatorial Guinea</td><td>503,519</td><td>28,051</td></tr><tr><td>Monaco</td><td>35,253</td><td>1</td></tr><tr><td>The Bahamas</td><td>323,063</td><td>13,878</td></tr><tr><td>Pitcairn Islands</td><td>67</td><td>5</td></tr><tr><td>Vanuatu</td><td>211,367</td><td>12,189</td></tr></tbody></table>", "image": "", "options": ["Belize, Djibouti, Estonia", "Latvia, Panama, Bhutan", "Montenegro, French Guiana, New Caledonia", "Solomon Islands, Equatorial Guinea, Monaco", "The Bahamas, Pitcairn Islands, Vanuatu"], "correct": 2, "src": "CRIT31", "orig": "images/q-b88c2855fb.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Плотность = население : площадь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Французская Гвиана: 187 056 : 91 000 ≈ 2 чел./км² — меньше всех.</li><li>Она в варианте C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Монако и Питкэрн — очень маленькая площадь, плотность большая.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите маленькое население при большой площади.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p>Ahmed was given 1050ml of rose water in a jug. He wanted to divide it entirely amongst his three sisters, Tanya, Nadya, and Polina. It was decided that the youngest sister, Tanya should get the smallest portion, which was to be exactly half of Nadya's, while Polina should get the lion's share, i.e. double that of Nadya's.</p><p>How much rose water would Nadya get?</p>", "image": "", "options": ["210ml", "300ml", "316ml", "333ml", "350ml"], "correct": 1, "src": "CRIT31", "orig": "images/q-6f0596b334.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначим долю Нади n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Таня <span class=\"fr\"><span>n</span><span>2</span></span>, Полина 2n.</li><li><span class=\"fr\"><span>n</span><span>2</span></span> + n + 2n = 3,5n = 1050 → n = 300 мл. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 1050 : 5.</li><li>E — 1050 : 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите всех через одного.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p>Amir saw a sign at Invictus Fitness Studio:</p><p>\"Buy 8 classes for the price of 6 and save $7.20.\"</p><p>Amir doesn't want to buy 8 classes but is trying to determine how much he would pay for 3 separate classes, purchased one at a time at the regular, undiscounted price.</p><p><strong>How much would Amir pay in total?</strong></p>", "image": "", "options": ["$7.20", "$9.00", "$10.80", "$12.00", "$14.40"], "correct": 2, "src": "CRIT31", "orig": "images/q-e94bb02cab.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Экономия $7,20 — это стоимость двух бесплатных занятий.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Одно занятие: 7,20 : 2 = $3,60.</li><li>Три занятия: $10,80. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это экономия.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 8 за цену 6 — 2 занятия бесплатно.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p>Where trees have a constant water supply the width of growth each year increases with warmer weather. You can tell from the curve of the tree rings which one is the oldest. The average temperatures in our local wood for the last ten years given in degrees were:</p><p>20 22 19 24 21 21 20 20 23 25</p><p>Which one of the following could be entirely from wood growing during the last ten years? (Widths are measured in mm.)</p>", "image": "images/q-4b39c0eda0.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 1, "src": "CRIT31", "review": true, "orig": "images/q-4b39c0eda0.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теплее → кольцо шире; одинаковая температура → одинаковая ширина. Ищем подряд идущие годы с таким же порядком.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: 1, 7, 3 — узкое, широкое, среднее.</li><li>Подходит 19°, 24°, 21° (подряд в списке). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 7, 5, 2, 2: нет четырёх лет подряд с таким порядком температур.</li><li>A, D, E — порядок ширины не совпадает ни с одной серией лет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте порядок, а не сами числа.</div></div>"}, {"id": 15, "topic": "PRIN", "text": "<p>A teacher believes that grading students based on fixed external standards does not fairly reflect their efforts. She argues that a more meaningful way to assess learning is by measuring how much each student has improved from their starting point. As a result, she decides to evaluate students based on individual progress, even if this leads to more students receiving high grades than usual.</p><p>Which one of the following principles most clearly justifies the teacher's approach?</p>", "image": "", "options": ["Students should be assessed according to their personal development rather than universal benchmarks.", "Teachers should give higher grades when class averages are low.", "Standards in education must be the same for all students.", "A student's effort is more important than their understanding.", "Grades should be limited to reflect a normal distribution"], "correct": 0, "src": "CRIT31", "orig": "images/q-d07ed92532.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Principle: необходимо выбрать общее правило, оправдывающее способ оценивания учителя. Она считает личный прогресс более важным показателем обучения, чем соответствие одинаковым стандартам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Учитель критикует фиксированные внешние стандарты: одинаковый результат может скрывать разницу в том, насколько сильно ученики улучшили свои знания.</li><li>Вместо сравнения всех с одним уровнем она предлагает измерять «how much each student has improved from their starting point». Это основной критерий её решения.</li><li>Возможное увеличение количества высоких оценок она считает допустимым следствием, а не целью. Оценки должны отражать достигнутый индивидуальный прогресс.</li><li>Ответ A формулирует подходящий принцип: оценивать учащихся по личному развитию, а не по универсальным контрольным показателям.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — подмена критерия оценивания. Учитель не предлагает повышать оценки из-за низкого среднего балла класса. Оценка должна зависеть от того, насколько продвинулся конкретный ученик.</li><li>C — прямое противоречие подходу учителя. Единые стандарты для всех именно то, что она считает недостаточно справедливым для оценки индивидуального прогресса.</li><li>D — смешение усилий и результатов развития. Хотя учитель упоминает старания, измерять она собирается улучшение знаний и навыков относительно начального уровня. Сильное старание без прогресса не равнозначно измеренному улучшению.</li><li>E — противоположное отношение к распределению оценок. Учитель допускает, что высокие оценки получит больше учеников, если они действительно улучшили результаты. Ограничение оценок ради нормального распределения нарушило бы её принцип.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах на Principle отделяй критерий принятия решения от побочного результата. Здесь критерий — индивидуальный прогресс, а увеличение высоких оценок — возможное следствие.</div></div>"}, {"id": 16, "topic": "WKN", "text": "<p>Some argue that artificial intelligence (AI) will eventually eliminate the need for human workers in many professions. They claim that machines are already more efficient at processing information and performing repetitive tasks. However, critics believe that fears about AI are overstated and that human intuition and creativity cannot be replicated. Still, the increasing presence of AI in sectors like law and medicine suggests that full automation is inevitable.</p><p>Which one of the following, if true, would most seriously weaken the argument that full automation is inevitable?</p>", "image": "", "options": ["AI systems can now compose music and write news articles.", "Many AI projects still rely heavily on human supervision.", "People are afraid of machines making life-or-death decisions.", "Some countries have banned certain forms of AI use.", "There are ethical concerns about using AI in creative fields."], "correct": 1, "src": "CRIT31", "orig": "images/q-d4c2ac7a95.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Weakening: нужно ослабить утверждение о неизбежности полной автоматизации. Сильнейший ответ должен показать серьёзное препятствие замене человеческого труда искусственным интеллектом.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторонники автоматизации указывают, что машины эффективнее выполняют повторяющиеся задачи и обрабатывают информацию.</li><li>Из распространения ИИ в юриспруденции и медицине делается гораздо более сильный вывод: «full automation is inevitable». Но использование ИИ в профессии не обязательно означает полную замену людей.</li><li>Ответ B указывает, что многие проекты ИИ всё ещё сильно зависят от человеческого контроля. Это ослабляет переход от автоматизации отдельных операций к полной автономности систем.</li><li>B — лучший ответ по ключу. Однако зависимость от людей сегодня не доказывает, что она сохранится навсегда. Поэтому вариант ослабляет уверенность в неизбежности полной автоматизации, но не опровергает её окончательно.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — скорее усиливает исходную позицию. Способность ИИ создавать музыку и новости показывает расширение круга автоматизируемых задач. Она не демонстрирует препятствий для автоматизации.</li><li>C — общественные опасения вместо технического или практического препятствия. Страх перед решениями машин может замедлить внедрение, но из него не следует, что человек обязательно останется необходимым участником всех процессов.</li><li>D — серьёзный, но менее прямой конкурент B. Запреты в некоторых странах могут препятствовать внедрению ИИ, однако они относятся только к определённым применениям и территориям. Сам факт таких запретов не показывает, что полная автоматизация технически невозможна.</li><li>E — этические сомнения ограничены отдельной областью. Проблемы использования ИИ в творчестве не доказывают, что автоматизация других профессий остановится или обязательно потребует человека.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если вывод содержит слово «inevitable», проверяй, действительно ли доказана неизбежность, а не просто высокая вероятность или быстрое распространение технологии.</div></div>"}, {"id": 17, "topic": "WKN", "text": "<p>A recent initiative encouraged schools to replace desks and chairs with standing workstations. The organisers argued that sitting for long periods is harmful to children's health and that standing while working would reduce obesity and improve concentration. Some early pilot schools have reported positive student feedback. Therefore, all schools should adopt standing workstations to improve academic outcomes.</p><p>Which one of the following, if true, would most weaken the argument?</p>", "image": "", "options": ["Standing for long periods can cause discomfort and fatigue in children.", "Some schools lack the budget to replace all furniture.", "Not all students prefer to stand while working.", "Pilot schools had additional support during implementation.", "Students are already active during breaks and PE lessons."], "correct": 3, "src": "CRIT31", "orig": "images/q-b75cce8be8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Weakening: нужно найти слабое место в переходе от предварительных положительных отзывов к рекомендации для всех школ. Ключевой вопрос — можно ли считать результаты пилотных школ показательными.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Организаторы утверждают, что работа стоя уменьшит ожирение и улучшит концентрацию. Однако в тексте сообщается лишь о положительных отзывах учащихся некоторых пилотных школ, а не о доказанном улучшении учебных результатов.</li><li>На основании этих ограниченных данных делается общий вывод: «all schools should adopt standing workstations to improve academic outcomes». Это гораздо более сильное утверждение, чем позволяют сделать отзывы.</li><li>Ответ D показывает возможный смешивающий фактор: пилотные школы получили дополнительную поддержку во время внедрения. Их положительный опыт мог зависеть от этой поддержки, а не только от рабочих мест стоя.</li><li>Ключ D можно принять, но он не бесспорен. Вариант A также существенно ослабляет рекомендацию, поскольку длительное стояние может вызывать усталость и ухудшать концентрацию. D лучше атакует надёжность пилотных результатов, тогда как A — предполагаемую пользу самого решения.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сильное альтернативное возражение, а не полностью посторонняя идея. Дискомфорт и усталость могут мешать концентрации, поэтому вариант ослабляет аргумент. Однако он не показывает, насколько часто возникает этот эффект и превышает ли он предполагаемые преимущества.</li><li>B — практическое препятствие распространению. Недостаток бюджета делает рекомендацию для всех школ менее осуществимой, но не показывает, что работа стоя не улучшает здоровье или академические результаты.</li><li>C — предпочтения не равнозначны результативности. Даже если некоторые ученики предпочитают сидеть, из этого ещё не следует, что рабочие места стоя не могут повысить их концентрацию или успеваемость.</li><li>E — неполное возражение о физической активности. Активность на переменах и уроках физкультуры не устанавливает, что дополнительное сокращение сидячего времени бесполезно. Эти меры могут дополнять друг друга.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Когда вывод распространяет результат пилотного проекта на всех, проверяй две вещи: были ли в пилоте особые условия и измерялось ли именно то улучшение, которое обещает автор.</div></div>"}, {"id": 18, "topic": "FLAW", "text": "<p>In a survey of employees at a large tech company, 85% of respondents reported that they were satisfied with their jobs. Therefore, job satisfaction in the tech industry is clearly very high.</p><p>Which one of the following best identifies a flaw in the argument?</p>", "image": "", "options": ["The survey did not measure job performance.", "Job satisfaction cannot be measured through surveys.", "One company's results do not represent an entire industry.", "Respondents may have misunderstood the question.", "The company may have excluded negative responses."], "correct": 2, "src": "CRIT31", "orig": "images/q-05602223b3.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Flaw: нужно определить ошибку в переходе от ограниченной выборки к слишком широкому выводу. Данные об одной технологической компании используются для оценки всей отрасли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Исследование сообщает конкретный результат: 85% ответивших сотрудников одной крупной технологической компании довольны своей работой.</li><li>Вывод автора касается уже всей технологической индустрии: «job satisfaction in the tech industry is clearly very high». Масштаб вывода существенно шире масштаба исследования.</li><li>Даже крупная компания может отличаться от остальных зарплатами, условиями труда, руководством и корпоративной культурой.</li><li>Ответ C указывает на ошибку обобщения: результаты одной компании нельзя автоматически считать репрезентативными для целой отрасли.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — подмена исследуемого показателя. Исследование посвящено удовлетворённости работой, а не эффективности сотрудников. Отсутствие измерений производительности не мешает изучать именно удовлетворённость.</li><li>B — необоснованный абсолютный запрет на метод. Опросы могут измерять самооценку удовлетворённости. У них есть ограничения, но утверждать, что удовлетворённость вообще невозможно изучать опросами, слишком сильно.</li><li>D — возможная, но неподтверждённая ошибка измерения. Респонденты могли неправильно понять вопрос, однако текст не даёт оснований считать это главной проблемой. Даже идеально понятный опрос одной компании не характеризует всю отрасль.</li><li>E — предположение о манипуляции данными. Исключение отрицательных ответов исказило бы результат, но никаких сведений о таком исключении нет. Главная ошибка сохраняется и при честно проведённом опросе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сопоставляй две группы: кого реально исследовали и о ком сделали вывод. Если вторая группа значительно шире первой, проверь репрезентативность выборки.</div></div>"}, {"id": 19, "topic": "STR", "text": "<p>Many city councils are considering banning private cars from city centres to reduce air pollution. Supporters argue that fewer cars will lead to cleaner air and better public health. They point to the success of pedestrianised zones in a small number of European cities. Although some residents worry about inconvenience, advocates maintain that the environmental benefits justify the policy.</p><p>Which one of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Public transport usage increased significantly in cities that banned cars from their centres.", "Some businesses prefer locations outside city centres.", "Air pollution has many different causes besides cars.", "Not all European cities have the same infrastructure.", "Residents initially opposed the policy in most cities."], "correct": 0, "src": "CRIT31", "orig": "images/q-059b3ba681.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Strengthening: необходимо выбрать факт, который делает аргумент в пользу ограничения автомобилей убедительнее. Предлагаемая политика должна уменьшать использование машин и загрязнение воздуха.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторонники запрета исходят из следующей цепочки: меньше частных автомобилей в центре — меньше загрязнения — лучше общественное здоровье.</li><li>Примеры пешеходных зон в нескольких европейских городах поддерживают предложение, но сами по себе не раскрывают, как жители меняют свои транспортные привычки.</li><li>Ответ A добавляет важное звено: после запрета автомобилей в подобных городах значительно выросло использование общественного транспорта. Это согласуется с предположением, что часть поездок на машинах была заменена другим транспортом.</li><li>A — лучший из предложенных вариантов, но доказательство неполное: рост пользования общественным транспортом не гарантирует снижения общего загрязнения. Ещё сильнее аргумент поддержали бы прямые измерения уменьшения автомобильного трафика и выбросов.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — информация о размещении бизнеса вместо экологического эффекта. Предпочтение некоторых компаний находиться за пределами центра не показывает, что запрет автомобилей улучшит качество воздуха.</li><li>C — возможное ограничение эффективности политики. Если значительная часть загрязнения возникает из других источников, сокращение количества машин может дать меньший результат, чем ожидают сторонники. Это скорее ослабляет аргумент.</li><li>D — проблема переноса опыта. Различия инфраструктуры европейских городов означают, что успешная политика в одном месте может работать иначе в другом. Это делает обобщение менее надёжным.</li><li>E — описание первоначального отношения жителей. Даже если жители сначала были против запрета, это не показывает, уменьшились ли выбросы и улучшилось ли здоровье населения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для Strengthening найди причинную цепочку аргумента и выбери факт, который подтверждает её слабое звено. Не путай поддержку политики населением с доказательством её эффективности.</div></div>"}, {"id": 20, "topic": "MC", "text": "<p>Over the past two decades, there has been a sharp rise in the number of university graduates entering the job market. At the same time, many employers now require a degree for positions that previously did not need one. This phenomenon, often referred to as \"credential inflation,\" has led to concerns that the value of a degree is declining. If everyone has a degree, it no longer serves as a meaningful indicator of higher skill or intelligence. Consequently, job seekers may be forced to pursue additional qualifications just to stand out.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Employers demand too many qualifications.", "A university degree no longer sets job applicants apart.", "Credential inflation is making higher education unaffordable.", "Many degrees are not useful in today's job market.", "More students are attending university than in the past."], "correct": 1, "src": "CRIT31", "orig": "images/q-49de3de0bc.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — это мысль, ради которой написан текст и которую поддерживают остальные фразы. Здесь всё сводится к одному: когда диплом есть почти у всех, он перестаёт выделять кандидата.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разметь роли фраз. Рост числа выпускников и требование диплома от работодателей — факты (посылки).</li><li>«If everyone has a degree, it no longer serves as a meaningful indicator…» — вывод из этих фактов: диплом больше не отличает сильного кандидата от остальных.</li><li>«Consequently, job seekers may be forced to pursue additional qualifications» — следствие из этого вывода. Строго говоря, это шаг ещё дальше, но такого варианта среди ответов нет.</li><li>Из предложенных вариантов именно B передаёт вывод, на котором держится вся цепочка. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «работодатели требуют слишком много»: оценка, которой в тексте нет. Автор описывает требование диплома как факт, а не осуждает его.</li><li>C — «образование стало недоступным»: о цене обучения в тексте ни слова. Это посторонняя идея.</li><li>D — подмена смысла. Текст не говорит, что дипломы бесполезны. Он говорит, что диплом перестал выделять кандидата среди других. Полезность знаний и отличительная сила диплома — разные вещи.</li><li>E — «студентов стало больше»: это посылка из первой фразы, а не вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка вывода: поставь «therefore» перед вариантом и прочитай после всех фактов. «Many graduates… therefore a degree no longer sets applicants apart» звучит логично. Если вариант просто повторяет факт (E) или добавляет оценку, которой не было (A, C, D), это не вывод.</div></div>"}, {"id": 21, "topic": "MC", "text": "<p>Many people assume that working long hours is a sign of dedication and productivity. However, research consistently shows that people who work more than 50 hours a week are actually less productive overall. Fatigue, stress, and poor work-life balance contribute to a decline in focus and efficiency. Some companies that adopted shorter workweeks have even reported increased output. Clearly, working fewer hours can lead to better overall performance.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Long hours damage workers' health.", "Companies should let employees choose their hours.", "Productivity decreases when people work too much.", "Working fewer hours can increase productivity.", "Employees prefer shorter workweeks."], "correct": 3, "src": "CRIT31", "orig": "images/q-ba180be336.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Main Conclusion: нужно отделить доказательства вреда чрезмерной работы от итогового утверждения о пользе сокращения часов. Автор считает, что меньшее количество рабочих часов может повысить производительность.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сначала автор описывает распространённое представление: длительная работа воспринимается как показатель преданности делу и продуктивности.</li><li>Затем приводятся возражения: люди, работающие больше 50 часов в неделю, менее продуктивны, а усталость и стресс снижают концентрацию.</li><li>Пример компаний с сокращённой рабочей неделей, сообщивших об увеличении выпуска продукции, дополнительно поддерживает позицию автора.</li><li>Фраза «Clearly, working fewer hours can lead to better overall performance» выражает итоговый вывод. Ответ D сохраняет важное слово «can»: сокращение часов может повысить продуктивность, но не обязательно делает это в каждом случае.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сужение темы до здоровья. Усталость и стресс упоминаются как причины снижения эффективности, но автор не делает главным выводом ущерб здоровью работников.</li><li>B — новая рекомендация вместо авторского вывода. Сокращение рабочей недели не означает предоставление сотрудникам права самостоятельно выбирать любые рабочие часы.</li><li>C — доказательство вместо главного вывода. Снижение производительности при чрезмерной работе поддерживает аргумент автора. Но заключение идёт дальше: меньшая продолжительность работы может улучшить результаты.</li><li>E — неподтверждённое предположение о предпочтениях. Автор рассматривает производительность и эффективность, а не доказывает, что сотрудники предпочитают сокращённую неделю.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не путай отрицательный факт и положительный вывод. «Слишком много часов вредят производительности» поддерживает, но не полностью заменяет утверждение «меньше часов могут повысить производительность».</div></div>"}, {"id": 22, "topic": "PS", "text": "<p>Alikhan is a driver for the Uber Taxis business. He drives passengers on the route from Medeo to Shymbulak, starting the first trip at 05:00 in the morning. The first journey from M to S takes 1 hour. The remaining journeys take only 30 minutes each way because there is less traffic. There are never any passengers to carry from B to A in the morning. At the end of his working day, he has to Return the taxi to the Medeo parking. The taxi can legally carry 8 passengers plus the driver. Alikhan does not break the law. He is paid 25 dollars per journey by each passenger. Alikhan gets to keep all fares paid by his passengers. But he must pay 1000 dollars to Uber Taxis per day for the use of the rental and fuel. What is the earliest time Alikhan could finish work and have 400 dollars in his pocket after paying Uber Taxis?</p>", "image": "", "options": ["09:00", "10:30", "12:00", "12:30", "15:30"], "correct": 3, "src": "CRIT31", "orig": "images/q-5afeb1d263.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно заработать 1000 + 400 = $1400.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Один рейс M → S с 8 пассажирами: 8 · 25 = $200.</li><li>Нужно 7 рейсов (обратно пассажиров нет).</li><li>05:00–06:00 первый рейс, дальше каждый круг (туда-обратно) — 1 час: рейсы в 6:30, 7:30 … 7-й заканчивается в 12:00.</li><li>Вернуть машину в Медео: ещё 30 мин → 12:30. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли вернуть машину.</li><li>A, B — меньше рейсов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Учитывайте обратный путь без пассажиров.</div></div>"}, {"id": 23, "topic": "CON", "text": "<p>Many people think that if they or 'the experts' - cannot explain something, it must therefore be truly paranormal. An amateur archaeologist declares that because he cannot figure out how the pyramids were built, they must have been constructed by aliens. Feats such as the bending of spoons or telepathy, are often thought of as paranormal or mystical. But if they were explained, people would respond, \"Yes, of course\" or \"That's obvious once yo see it.\" Fire-walking is a case in point. People speculate about the supernatural powers of fire-walkers over pain and heat, yet the simple explanation is that the conductivity of heat from the light and fluffy coals to the walker's feet is very poor. As long as you don't stand still, you will not get burned</p><p>Which one of the following is an inference that is supported by the above passage?</p>", "image": "", "options": ["There are no truly paranormal occurrences.", "Everything that occurs has an explanation.", "The lack of a simple explanation does not make an occurrence paranormal.", "Feats such as spoon-bending and telepathy do not really occur.", "None of the above"], "correct": 2, "src": "CRIT31", "orig": "images/q-7fb29a5890.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>Conclusion</span><span>Inference</span></span>: нужно выбрать осторожный вывод, который действительно следует из примеров. Главная мысль: неспособность объяснить явление не доказывает его сверхъестественную природу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор начинает с распространённой ошибки: «if they or 'the experts' cannot explain something, it must therefore be truly paranormal». Неизвестное объяснение ошибочно принимается за доказательство сверхъестественного.</li><li>Пример пирамид показывает такую ошибку: археолог не понимает способ строительства и поэтому приписывает его инопланетянам. Но незнание способа строительства само по себе не указывает на инопланетян.</li><li>Затем приводится пример хождения по углям, которое иногда воспринимается как сверхъестественная способность, хотя автор предлагает объяснение через теплопроводность.</li><li>Ответ C формулирует обоснованный вывод: отсутствие простого объяснения не делает событие паранормальным. Он не требует утверждать, что вообще никаких необъяснённых или паранормальных явлений не существует.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильное обобщение. Автор показывает, что некоторые кажущиеся паранормальными явления имеют обычные объяснения. Из нескольких примеров невозможно заключить, что действительно паранормальных событий не существует вообще.</li><li>B — универсальное утверждение, выходящее за пределы аргумента. Примеры показывают возможность найти объяснение некоторым событиям, но не доказывают, что каждое существующее явление обязательно имеет доступное человеку объяснение.</li><li>D — подмена вопроса о природе явления вопросом о его существовании. Автор обсуждает, как интерпретируют сгибание ложек и телепатию. Он не доказывает, что все сообщения о подобных действиях ложны или что сами наблюдаемые события никогда не происходят.</li><li>E — неверное исключение остальных ответов. Вариант C прямо поддерживается рассуждением автора, поэтому утверждение, что ни один вариант не подходит, ошибочно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В Inference выбирай минимально достаточный вывод. Разница между «мы не можем объяснить X» и «X имеет сверхъестественную причину» — отсутствие доказанного перехода.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p>There must be some reason why BBQ sausages are sold in packets of 10 and the lavash in packets of 12. I bought just enough packets of each to have the same number of each.</p><p>How many items were on the receipt?</p>", "image": "", "options": ["2", "10", "11", "12", "22"], "correct": 2, "src": "CRIT31", "orig": "images/q-27a59ae8c8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одинаковое количество — НОК(10, 12) = 60.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сосиски: 6 пачек, лаваш: 5 пачек.</li><li>Всего в чеке 11 позиций. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D, E — неверный подсчёт пачек.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В чеке — пачки, а не штуки.</div></div>"}, {"id": 25, "topic": "STR", "text": "<p>Some economists argue that fines for traffic violations should be adjusted according to a driver's income. A flat fine may act as a serious deterrent for low-income drivers but have little impact on wealthy individuals. If fines are intended to discourage dangerous behaviour, they should affect all drivers equally, regardless of income level.</p><p>Which one of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Wealthy drivers receive more parking tickets than low-income drivers.", "Income-based fines have successfully reduced repeat offences in countries where they are used.", "Traffic accidents are more common in urban areas.", "Most drivers believe current fines are fair.", "Administering income-based fines would require additional bureaucracy."], "correct": 1, "src": "CRIT31", "orig": "images/q-6b0aa1010a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Strengthening: нужно найти дополнительное доказательство эффективности штрафов, зависящих от дохода. Автор считает, что денежное наказание должно одинаково эффективно удерживать людей с разными доходами от нарушений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор объясняет недостаток фиксированного штрафа: одна и та же сумма серьёзно влияет на малообеспеченного водителя, но может почти не влиять на богатого.</li><li>Затем устанавливается цель наказания: «fines are intended to discourage dangerous behaviour». Значит, важна не одинаковая сумма штрафа, а его способность предотвращать нарушения.</li><li>Ответ B сообщает, что в странах с доходозависимыми штрафами удалось уменьшить количество повторных нарушений. Это практическое свидетельство того, что механизм может работать.</li><li>Поэтому B лучше всего усиливает аргумент. Однако снижение повторных нарушений само по себе не доказывает, что эффект одинаков для всех доходных групп; для полной проверки понадобились бы данные отдельно по этим группам.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — косвенная и недостаточная информация. Более частое получение штрафов за парковку богатыми водителями может иметь разные причины: больше поездок, иные привычки парковки или особенности контроля. Это не доказывает, что доходозависимые штрафы лучше предотвращают опасное поведение.</li><li>C — смена предмета обсуждения. Частота аварий в городах не позволяет определить, должны ли размеры штрафов зависеть от доходов нарушителей.</li><li>D — оценка справедливости вместо оценки сдерживающего эффекта. Даже если большинство водителей считает существующие штрафы справедливыми, это не означает, что они одинаково эффективно предотвращают нарушения среди богатых и бедных.</li><li>E — дополнительный недостаток предлагаемой системы. Необходимость расширять административные процедуры увеличивает издержки внедрения. Это скорее создаёт возражение против политики, чем подтверждает её эффективность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В Strengthening проверяй, какую цель автор пытается достичь. Здесь цель — предотвращать нарушения, поэтому результативность штрафов важнее популярности или удобства их администрирования.</div></div>"}, {"id": 26, "topic": "MC", "text": "<p>A number of cities have introduced electric scooter-sharing systems to reduce traffic congestion and pollution. These scooters are promoted as eco-friendly alternatives to cars and are popular among younger commuters. However, multiple studies have shown that scooters often replace walking or public transport rather than car trips. In addition, the production and charging of scooters require electricity and materials with their own environmental impact. So, although electric scooters may appear to be a green solution, their actual environmental benefit is questionable.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Electric scooters are used more by young people.", "Public transport is more eco-friendly than scooters.", "Electric scooters do not reduce pollution as much as claimed.", "Scooter-sharing systems are poorly managed in cities.", "Scooters are not as fun as they look."], "correct": 2, "src": "CRIT31", "orig": "images/q-08cd3d4257.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Main Conclusion: нужно найти итоговую оценку экологической пользы электросамокатов. Автор сомневается, что они настолько экологичны, как утверждают сторонники.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сначала объясняется заявленная цель проката самокатов: уменьшение транспортных заторов и загрязнения воздуха.</li><li>Затем приводятся два возражения. Самокаты часто заменяют пешие прогулки или общественный транспорт, а не поездки на автомобилях. Кроме того, их производство и зарядка требуют ресурсов.</li><li>Оба факта поддерживают заключение: «their actual environmental benefit is questionable». То есть предполагаемая экологическая выгода может быть меньше ожидаемой.</li><li>Ответ C — наиболее точное приближение к заключению. Однако формулировка «do not reduce pollution as much as claimed» немного категоричнее оригинала: автор ставит пользу под сомнение, а не приводит окончательное количественное доказательство её завышения.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — второстепенная характеристика пользователей. Популярность самокатов среди молодёжи упоминается во введении, но не объясняет сама по себе их экологическую эффективность.</li><li>B — слишком конкретное сравнение. Автор говорит, что самокаты иногда заменяют общественный транспорт и имеют собственный экологический след. Но он не приводит прямого сравнения полного воздействия общественного транспорта и самокатов на окружающую среду.</li><li>D — посторонняя причина проблем. Автор критикует экологический эффект самокатов, а не качество управления системами проката. Даже хорошо организованный прокат может иметь указанные недостатки.</li><li>E — смена критерия оценки. Привлекательность или удовольствие от поездки не рассматриваются как аргументы. Вывод автора касается загрязнения и ресурсов, а не впечатлений пользователей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если заключение содержит осторожное слово вроде «questionable», не превращай его в категорическое «бесполезно» или «вредно». Вариант ответа должен сохранять степень уверенности автора.</div></div>"}, {"id": 27, "topic": "FLAW", "text": "<p>Many people believe that listening to classical music increases intelligence. In a controlled experiment, two groups of university students were given identical conditions, except that one group listened to Mozart before taking a spatial reasoning test while the other sat in silence. The group that listened to Mozart performed slightly better. Therefore, listening to classical music clearly makes people smarter.</p><p>Which one of the following best expresses the flaw in the argument?</p>", "image": "", "options": ["The students may have performed better for unrelated reasons.", "Spatial reasoning is only one aspect of intelligence.", "Some people do not enjoy classical music.", "The experiment only used one piece by Mozart.", "Music affects emotions, not intelligence."], "correct": 1, "src": "CRIT31", "orig": "images/q-866517a872.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Flaw: автор неправомерно обобщает улучшение одного вида мышления на интеллект человека в целом. Эксперимент измерял пространственное мышление, а вывод касается общего уровня интеллекта.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В контролируемом эксперименте одна группа студентов слушала Моцарта перед тестом, а другая находилась в тишине. Условия, согласно тексту, были одинаковыми, кроме музыкального воздействия.</li><li>Группа, слушавшая музыку, показала немного лучший результат в тесте пространственного мышления. Это конкретный измеренный эффект.</li><li>Однако автор заключает: «listening to classical music clearly makes people smarter». Пространственное мышление — лишь один аспект интеллекта, поэтому такой широкий вывод не обоснован одним тестом.</li><li>Ответ B прямо указывает на расширение вывода за пределы измеренного показателя. Даже если музыка действительно улучшила результаты теста, это не доказывает повышение общего интеллекта.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — возможная альтернативная причина, но не главная ошибка представленного рассуждения. Эксперимент описан как контролируемый, поэтому произвольное предположение о других причинах слабее конкретного замечания о несоответствии измеренного показателя выводу.</li><li>C — не относится к проверяемой гипотезе. Нелюбовь некоторых людей к классической музыке не опровергает возможность её
