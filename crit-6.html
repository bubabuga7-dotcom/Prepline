влияния на пространственное мышление или интеллект.</li><li>D — реальное ограничение обобщения на всю классическую музыку, но менее основная ошибка. Использование одного произведения Моцарта действительно не гарантирует аналогичного эффекта других произведений. Однако даже при испытании многих произведений результат одного вида теста не доказывал бы рост общего интеллекта.</li><li>E — необоснованное категорическое утверждение. Музыка может влиять на эмоции, но это не доказывает отсутствия влияния на внимание или выполнение интеллектуальных заданий. Автору нельзя возразить простым противопоставлением эмоций и интеллекта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах Flaw сравнивай, что эксперимент действительно измерил, с тем, что автор объявил доказанным. Один показатель не всегда позволяет судить о более широкой способности.</div></div>"}, {"id": 28, "topic": "ASM", "text": "<p>Many health experts recommend raising taxes on fast food as a way to combat rising rates of obesity. They argue that higher prices will discourage frequent consumption, particularly among young people, and encourage healthier choices. While some critics say that such a tax unfairly targets low-income individuals, proponents maintain that the long-term health benefits outweigh short-term costs. If people eat less fast food, overall public health is likely to improve.</p><p>Which of the following is an assumption made by the argument?</p>", "image": "", "options": ["Low-income people eat more fast food than wealthy people.", "People will change their eating habits in response to higher prices.", "Obesity is primarily caused by fast food.", "Healthier food options are always more expensive.", "Most people agree with health experts on this issue."], "correct": 1, "src": "CRIT31", "orig": "images/q-eacc9f302d.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Assumption: нужно обнаружить скрытую зависимость между повышением цен и изменением поведения покупателей. Аргумент работает, только если налог действительно способен уменьшить потребление фастфуда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторонники предлагают увеличить налог на фастфуд, чтобы сделать такую еду дороже. Само по себе повышение цен ещё не означает изменения питания.</li><li>Следующее звено аргумента — «higher prices will discourage frequent consumption». Автор предполагает, что покупатели начнут реже приобретать фастфуд и выбирать другие продукты.</li><li>Если люди продолжат покупать то же количество еды независимо от цены, предполагаемая цепочка от налога к уменьшению потребления не сработает.</li><li>Ответ B лучше всего выражает необходимую предпосылку: люди должны реагировать изменением пищевых привычек на повышение цен. Для достижения общественного эффекта достаточно реакции значимой части покупателей, а не абсолютно каждого человека.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — лишнее сравнение доходных групп. Даже если малообеспеченные люди не потребляют больше фастфуда, чем богатые, повышение цен всё равно может изменить поведение покупателей. Различия в исходном потреблении не являются необходимым условием эффекта налога.</li><li>C — чрезмерное утверждение о причине ожирения. Фастфуд не обязан быть главной причиной ожирения, чтобы сокращение его частого потребления могло приносить пользу здоровью.</li><li>D — неподходящее утверждение о стоимости альтернатив. Автор ожидает перехода к более здоровым продуктам, но для этого не требуется, чтобы они всегда были дороже. Напротив, доступность альтернатив может облегчать изменение поведения.</li><li>E — смешение согласия и причинного эффекта. Люди могут не поддерживать налог, но всё равно покупать меньше фастфуда из-за высокой цены. Популярность предложения не является необходимым условием его воздействия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбей аргумент на цепочку «налог → цена → покупки → здоровье». Затем спроси, какое звено не доказано фактами. Часто именно оно скрывает необходимое допущение.</div></div>"}, {"id": 29, "topic": "FLAW", "text": "<p>A recent study showed that people who own more books at home tend to perform better on reading comprehension tests. Based on this, educators have concluded that providing more books to students from low-income backgrounds will significantly improve their reading abilities.</p><p>Which one of the following best identifies a flaw in the reasoning?</p>", "image": "", "options": ["The study did not include students from all income levels.", "Owning books does not guarantee that they are being read.", "Students from low-income backgrounds may not enjoy reading.", "Reading comprehension is not the only important academic skill.", "Some students perform well even without books at home."], "correct": 1, "src": "CRIT31", "orig": "images/q-93b13075a9.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Flaw: аргумент смешивает корреляцию с причинностью. Наличие книг дома связано с лучшими результатами чтения, но из этой связи не следует, что простая выдача дополнительных книг обязательно значительно улучшит навыки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Исследование обнаружило статистическую связь: «people who own more books at home tend to perform better on reading comprehension tests». Оно не устанавливает, что именно количество книг вызвало лучшие результаты.</li><li>Педагоги превращают эту связь в практический вывод: если предоставить больше книг учащимся из малообеспеченных семей, их навыки чтения значительно улучшатся.</li><li>Ответ B указывает на разрыв между владением книгами и их использованием. Книги могут находиться дома, но это не означает, что ученики читают их и развивают соответствующие навыки.</li><li>B — лучший ответ по ключу, но он отражает только часть проблемы. Даже если ученики читают книги, связь может объясняться другими факторами: интересом семьи к образованию, поддержкой родителей или уже сформированными навыками чтения. Полная ошибка — переход от корреляции к уверенной причинной рекомендации.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — предполагаемый недостаток выборки, который не установлен условием. Текст не сообщает, какие доходные группы вошли в исследование. Даже если они представлены неравномерно, главная проблема остаётся в том, что связь между владением книгами и результатами не доказывает причинность.</li><li>C — неподтверждённое обобщение о малообеспеченных учениках. Принадлежность к определённой доходной группе не означает отсутствия интереса к чтению. Вариант предлагает возможную причину слабого эффекта, но не раскрывает основную логическую ошибку исследования.</li><li>D — смена предмета оценки. Успеваемость по другим дисциплинам действительно важна, но педагоги предлагают улучшить именно навыки чтения. Ограниченность чтения как одной учебной способности не опровергает данную рекомендацию.</li><li>E — исключения не разрушают статистическую связь. Некоторые ученики могут хорошо читать без большого количества книг, даже если в среднем наличие книг связано с более высокими результатами. Главное возражение касается причинного механизма, а не существования исключений.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для корреляционных исследований задай три вопроса: что именно связано, доказано ли направление причинности и какой третий фактор может объяснять оба наблюдения?</div></div>"}, {"id": 30, "topic": "STR", "text": "<p>Some educators argue that homework should be abolished in primary schools. They claim that long hours of homework increase stress and reduce children's interest in learning. Studies have shown that younger children learn more effectively through play and interaction than through formal written tasks. Therefore, removing homework at an early age would benefit children's overall development.</p><p>Which one of the following, if true, would most strengthen the argument?</p>", "image": "", "options": ["Children with less homework spend more time on extracurricular activities.", "Teachers often assign homework without clear objectives.", "Countries with little or no primary-school homework perform well in international education rankings.", "Parents often help children with homework.", "Older students still benefit from structured homework."], "correct": 2, "src": "CRIT31", "orig": "images/q-f3a4201dca.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Strengthening: нужно выбрать факт, который делает отмену домашних заданий в начальной школе более обоснованной. Автор считает, что уменьшение формальных заданий может улучшить развитие детей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сначала приводятся предполагаемые недостатки домашних заданий: длительная работа увеличивает стресс и уменьшает интерес ребёнка к обучению.</li><li>Затем автор ссылается на исследования, согласно которым младшие дети эффективнее учатся через игру и взаимодействие, чем через формальные письменные задания.</li><li>Вывод: «removing homework at an early age would benefit children's overall development». Здесь предполагается, что сокращение домашних заданий не нанесёт существенного ущерба обучению и позволит получить другие преимущества.</li><li>Ответ C показывает, что страны с небольшим количеством домашних заданий в начальной школе или без них могут хорошо выступать в международных образовательных рейтингах. Это поддерживает идею, что большой объём заданий не обязателен для высоких учебных результатов. Однако рейтинги не доказывают причинную связь и не измеряют развитие ребёнка во всех его аспектах.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — возможная дополнительная польза, но не прямое доказательство. Большее время на внеклассные занятия может способствовать развитию, однако вариант не уточняет, какие это занятия и улучшают ли они состояние, навыки или результаты детей.</li><li>B — критика качества конкретных заданий, а не доказательство необходимости их полной отмены. Если учителя иногда дают задания без ясной цели, это может оправдывать улучшение практики преподавания вместо отказа от всех домашних заданий.</li><li>D — факт об участии родителей без ясного направления влияния. Помощь родителей может как улучшать выполнение заданий, так и уменьшать самостоятельность ребёнка. Из этого нельзя уверенно заключить, что отмена домашних заданий принесёт пользу.</li><li>E — утверждение о другой возрастной группе. Польза структурированных заданий для старших учеников совместима с их меньшей полезностью для младших. Поэтому вариант почти не меняет оценку предлагаемой политики в начальной школе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для Strengthening ищи данные, которые проверяют главный прогноз аргумента. При этом отличай простую совместимость двух явлений от доказательства, что одно действительно вызвало другое.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Shyn: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="vendor/supabase/supabase.js?v=2.118.0"></script>
<script src="prepline-supabase.js?v=9d5a56b9"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Shyn]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          const vq = qs.filter(q => q.verified !== false);
          vq.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, vq.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Shyn]', e); }
    };
  }
})();

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
