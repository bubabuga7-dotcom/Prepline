<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "A father is three times as old as his son and the sum of their ages is 76 years. How old is the son?", "options": ["19", "21", "25", "31"], "correct": 0, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем возраст сына s, отца 3s, складываем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s + 3s = 76 → 4s = 76 → s = 19.</li><li>Проверка: отцу 57, 57 + 19 = 76 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — сумма с утроенным возрастом не даёт 76 (например, 21 + 63 = 84).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всегда делайте быструю проверку подстановкой.</div></div>"}, {"id": 2, "text": "A regular hexagon is divided into 6 equal triangles. The perimeter of the hexagon is 48 cm. What is the height of each triangle?", "options": ["4", "4√3", "6√3", "8", "8√3"], "correct": 1, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Правильный шестиугольник состоит из 6 равносторонних треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона = 48 ÷ 6 = 8 см.</li><li>Высота равностороннего треугольника = <span class=\"fr\"><span>√3</span><span>2</span></span> · 8 = 4√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (8√3) — забыли поделить на 2.</li><li>D (8) — это сторона.</li><li>A, C — неверная формула.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота равностороннего: <span class=\"fr\"><span>√3</span><span>2</span></span>·a.</div></div>"}, {"id": 3, "text": "A jewellery shop offers a discount of 40%, and then a further 20% off the reduced price. How much will you pay for a ring priced at $200?", "options": ["$80", "$120", "$96", "$140", "$125"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две скидки подряд перемножаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После 40%: 200 · 0,6 = 120.</li><li>После ещё 20%: 120 · 0,8 = 96.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A ($80) — сложили скидки: 60%.</li><li>B ($120) — только первая скидка.</li><li>D, E — неверный расчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 40% + 20% ≠ 60%: вторая скидка — от уже сниженной цены.</div></div>"}, {"id": 4, "text": "The curved surface of a skateboard ramp is a quarter of a cylinder of radius r feet and height h feet, together with a flat rectangular section. Which formula gives the area of the top surface of the ramp?", "options": ["2rh + 2πr²", "2rh + 2πrh", "2rh + (1/4)πr²", "2rh + (1/2)πrh", "None of these formulae"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верхняя поверхность = ¼ боковой поверхности цилиндра + плоский прямоугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Боковая поверхность цилиндра = 2πrh; четверть = ½πrh.</li><li>Плоская часть — прямоугольник 2r × h = 2rh.</li><li>Сумма: 2rh + ½πrh.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — использовали πr² (площадь круга), а не боковую поверхность.</li><li>B — взяли всю боковую поверхность цилиндра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изогнутая поверхность — это часть боковой поверхности (2πrh), а не основания.</div></div>"}, {"id": 5, "text": "For which value of b does the system {2x + 5y = 3; −5x + by = 14} have no solution?", "options": ["5", "5/2", "−25/2", "5/3", "5/14"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет решений ⇔ прямые параллельны: коэффициенты при x и y пропорциональны, а свободные члены — нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2</span><span>−5</span></span> = <span class=\"fr\"><span>5</span><span>b</span></span> → 2b = −25 → b = <span class=\"fr\"><span>−25</span><span>2</span></span>.</li><li>Проверка: <span class=\"fr\"><span>3</span><span>14</span></span> ≠ <span class=\"fr\"><span>2</span><span>−5</span></span> → прямые не совпадают ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не дают пропорциональности коэффициентов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропорциональны и свободные члены → бесконечно много решений; не пропорциональны → решений нет.</div></div>"}, {"id": 6, "text": "If 3x + 2y = 5 and 5x + 4y = 9, what is 4x + 3y?", "options": ["6", "7", "0", "4", "5"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не решаем систему — складываем уравнения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(3x + 2y) + (5x + 4y) = 5 + 9.</li><li>8x + 6y = 14 → 4x + 3y = 7.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — следствие лишних вычислений с ошибкой. (Решение x = 1, y = 1 подтверждает: 4 + 3 = 7.)</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите комбинацию уравнений, дающую нужное выражение сразу.</div></div>"}, {"id": 8, "text": "How many four-digit numbers can be formed from the digits 0, 2, 4 and 8 without repeating a digit?", "options": ["18", "36", "27", "24", "64"], "correct": 0, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем перестановки, помня, что число не начинается с 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая цифра: 2, 4 или 8 → 3 варианта.</li><li>Оставшиеся 3 цифры (включая 0) ставим в любом порядке: 3! = 6.</li><li>3 · 6 = 18.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (24) — все 4! перестановок, включая начинающиеся с 0.</li><li>B, C, E — повторы цифр или неверный подсчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ограничение на первую цифру учитывайте первым.</div></div>"}, {"id": 9, "text": "If x = 1 + √2, what is the value of x² − 2x + 1?", "options": ["1 + √2", "√2 − 1", "2", "√2", "2 + √2"], "correct": 2, "topic": "M4.5", "explain": "x² − 2x + 1 = (x − 1)² = (√2)² = 2."}, {"id": 10, "text": "The operation ∇x = 3x − 3 is defined for x > 0. What is ∇7/∇3, expressed in the form ∇(?)", "options": ["∇3", "∇8", "∇2", "∇9", "∇6"], "correct": 2, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем ∇7 и ∇3, делим, и находим, при каком x операция даёт это число.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∇7 = 21 − 3 = 18; ∇3 = 9 − 3 = 6.</li><li>18 ÷ 6 = 3.</li><li>∇x = 3 → 3x − 3 = 3 → x = 2 → ответ ∇2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (∇3) — ∇3 = 6, а не 3.</li><li>B, D, E — не дают значение 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ должен быть в виде ∇(?): решите уравнение ∇x = результату.</div></div>"}, {"id": 11, "text": "Given x² − 3x + 1 = 0, what is the value of x³ + 1/x³?", "options": ["15", "36", "18", "9", "24"], "correct": 2, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим уравнение на x, получаем x + <span class=\"fr\"><span>1</span><span>x</span></span>, а потом используем формулу куба суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 3x + 1 = 0 → делим на x: x − 3 + <span class=\"fr\"><span>1</span><span>x</span></span> = 0 → x + <span class=\"fr\"><span>1</span><span>x</span></span> = 3.</li><li>(x + <span class=\"fr\"><span>1</span><span>x</span></span>)³ = x³ + 3x + <span class=\"fr\"><span>3</span><span>x</span></span> + <span class=\"fr\"><span>1</span><span>x³</span></span> = x³ + <span class=\"fr\"><span>1</span><span>x³</span></span> + 3(x + <span class=\"fr\"><span>1</span><span>x</span></span>).</li><li>x³ + <span class=\"fr\"><span>1</span><span>x³</span></span> = 3³ − 3·3 = 27 − 9 = 18.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (15), D (9) — неправильно вычли 3(x + <span class=\"fr\"><span>1</span><span>x</span></span>).</li><li>B (36), E (24) — другие ошибки в формуле.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шаблон: если известно x + <span class=\"fr\"><span>1</span><span>x</span></span> = a, то x² + <span class=\"fr\"><span>1</span><span>x²</span></span> = a² − 2, x³ + <span class=\"fr\"><span>1</span><span>x³</span></span> = a³ − 3a.</div></div>"}, {"id": 12, "text": "If f(x) = √(9 − x²), how many integers lie in the domain of f?", "options": ["6", "0", "7", "5", "Infinitely many"], "correct": 2, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Под корнем должно быть неотрицательное число.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9 − x² ≥ 0 → x² ≤ 9 → −3 ≤ x ≤ 3.</li><li>Целые: −3, −2, −1, 0, 1, 2, 3 — всего 7.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (6) — забыли 0.</li><li>D (5) — не включили концы ±3.</li><li>E — промежуток конечный.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте 0 и концы промежутка, если неравенство нестрогое.</div></div>"}, {"id": 13, "text": "Simplify: (x² − 4x)/(x² − 16)", "options": ["x/4", "x/(x+4)", "x/(x−4)", "1/4", "(x−4)/(x−16)"], "correct": 1, "topic": "M4.6", "explain": "x(x − 4)/((x − 4)(x + 4)) = x/(x + 4)."}, {"id": 14, "text": "The sum of the numerator and the denominator of a fraction is 47. If 2 is subtracted from the denominator and 5 is added to the numerator, the value of the fraction becomes 2/3. Find the fraction.", "options": ["15/32", "15/64", "30/64", "15/28", "None of these"], "correct": 0, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем дробь <span class=\"fr\"><span>n</span><span>d</span></span> и составляем систему из двух условий.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n + d = 47.</li><li><span class=\"fr\"><span>n + 5</span><span>d − 2</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span> → 3(n + 5) = 2(d − 2) → 3n + 15 = 2d − 4.</li><li>Подставляем d = 47 − n: 3n + 15 = 94 − 2n − 4 → 5n = 75 → n = 15, d = 32.</li><li>Проверка: <span class=\"fr\"><span>20</span><span>30</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span> ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — сумма числителя и знаменателя не 47.</li><li>D <span class=\"fr\"><span>15</span><span>28</span></span> — сумма 43.</li><li>E — ответ есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте варианты на первое условие (сумма 47) — это быстро отсекает лишние.</div></div>"}, {"id": 15, "text": "x₁ and x₂ are the non-negative roots of 3x² + 2mx + 1 = 0, where x₁ = 3x₂. Find m.", "options": ["−2", "2", "4", "1", "−4"], "correct": 0, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корни 3t и t. Используем Виета: произведение и сумма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Произведение: 3t · t = 3t² = <span class=\"fr\"><span>c</span><span>a</span></span> = <span class=\"fr\"><span>1</span><span>3</span></span> → t² = <span class=\"fr\"><span>1</span><span>9</span></span> → t = <span class=\"fr\"><span>1</span><span>3</span></span> (неотрицательный).</li><li>Сумма: 3t + t = 4t = <span class=\"fr\"><span>4</span><span>3</span></span>.</li><li>По Виета сумма = <span class=\"fr\"><span>−2m</span><span>3</span></span> → <span class=\"fr\"><span>−2m</span><span>3</span></span> = <span class=\"fr\"><span>4</span><span>3</span></span> → m = −2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (2) — потеряли знак в <span class=\"fr\"><span>−b</span><span>a</span></span>.</li><li>C, E (±4) — забыли поделить на коэффициент 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если корни связаны (x₁ = 3x₂), обозначьте их через один параметр.</div></div>"}, {"id": 16, "text": "Which is the equation of the line through the points (−1, −4) and (3, 8)?", "options": ["y = x/3 + 7", "y = −x/3 + 9", "y = 3x − 1", "y = −3x − 7"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим угловой коэффициент, затем свободный член.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон = <span class=\"fr\"><span>8 − (−4)</span><span>3 − (−1)</span></span> = <span class=\"fr\"><span>12</span><span>4</span></span> = 3.</li><li>y = 3x + c, подставляем (−1; −4): −4 = −3 + c → c = −1.</li><li>y = 3x − 1. Проверка: (3; 8): 9 − 1 = 8 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — наклон ±<span class=\"fr\"><span>1</span><span>3</span></span> (перевёрнутая дробь).</li><li>D — наклон −3 (ошибка в знаке).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте обе точки в ответ — быстрая проверка.</div></div>"}, {"id": 17, "text": "Find the y-intercept of f(x) = 2x² − 11x.", "options": ["0", "11/2", "2/11", "1/2", "5"], "correct": 0, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точка пересечения с осью y — это значение функции при x = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подставляем x = 0: f(0) = 2·0² − 11·0.</li><li>f(0) = 0, значит, график проходит через начало координат (0; 0).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B <span class=\"fr\"><span>11</span><span>2</span></span> — это второй корень, точка пересечения с осью <b>x</b>.</li><li>C, D, E — случайные числа, не f(0).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y-intercept → подставь x = 0; x-intercepts → реши f(x) = 0. Не путай.</div></div>"}, {"id": 18, "text": "John is 20 years older than Brian. Twelve years ago John was twice as old as Brian. How old is Brian now?", "options": ["32", "31", "30", "33", "34"], "correct": 0, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Составляем уравнение «12 лет назад».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сейчас: Брайан B, Джон B + 20.</li><li>12 лет назад: B − 12 и B + 8.</li><li>B + 8 = 2(B − 12) → B = 32.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не проходят проверку: при B = 32 Джону 52; 12 лет назад 40 = 2 · 20 ✓.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разница в возрасте не меняется со временем.</div></div>"}, {"id": 19, "text": "Nicky and Christina run a race. Christina gives Nicky a head start of 36 metres. Christina runs at 5 m/s and Nicky at 3 m/s. After how many seconds does Christina catch Nicky?", "options": ["15 s", "18 s", "25 s", "30 s", "45 s"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кристина догоняет со скоростью сближения 5 − 3 = 2 м/с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужно сократить разрыв 36 м.</li><li>36 ÷ 2 = 18 с.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (45 с) — поделили на 0,8?</li><li>A, C, D — ошибочная скорость сближения (например, 36 ÷ 3 или делили на 5).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Догонялки: время = разрыв ÷ разность скоростей.</div></div>"}, {"id": 20, "text": "If x + 3y + 5z = 200 and x + 4y + 7z = 225, what is x + y + z?", "options": ["90", "125", "150", "175", "None of these"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три неизвестных, два уравнения — ищем комбинацию уравнений, дающую x + y + z.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a(x + 3y + 5z) + b(x + 4y + 7z) = x + y + z.</li><li>x: a + b = 1; y: 3a + 4b = 1 → a = 3, b = −2. Проверка z: 15 − 14 = 1 ✓.</li><li>x + y + z = 3 · 200 − 2 · 225 = 600 − 450 = 150.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — неверные коэффициенты комбинации.</li><li>E — значение определяется однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если нужно выражение, а не отдельные переменные — ищите линейную комбинацию.</div></div>"}, {"id": 31, "topic": "M5.2", "text": "<p>Each interior angle of a regular polygon is 135°.</p><p>How many sides does it have?</p>", "image": "", "options": ["7", "8", "9", "10", "16"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол = 180 − 135 = 45°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 360 : 45 = 8. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка.</li><li>C — ошибка: проверьте 360 : 45.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Работайте через внешний угол — так быстрее.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.7", "text": "<p>Evaluate \\(\\dfrac{2^{4} \\times 2^{6}}{2^{7}}\\).</p>", "image": "", "options": ["4", "6", "8", "16", "32"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">При умножении показатели складываются, при делении — вычитаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 + 6 − 7 = 3.</li><li>2<sup>3</sup> = 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — умножили основание на показатель.</li><li>E — перемножили показатели вместо сложения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> aᵐ · aⁿ = aᵐ⁺ⁿ, а не aᵐⁿ.</div></div>", "src": "PL"}, {"id": 33, "topic": "M3.10", "text": "<p>Two similar shapes have corresponding lengths in the ratio 3 : 4. The smaller has area 324 cm².</p><p>What is the area of the larger?</p>", "image": "", "options": ["325 cm²", "432 cm²", "576 cm²", "768 cm²", "1152 cm²"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади относятся как квадраты длин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k² = (4/3)² = <span class=\"fr\"><span>16</span><span>9</span></span>.</li><li>324 · <span class=\"fr\"><span>16</span><span>9</span></span> = 576 см². Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — прибавили вместо умножения.</li><li>B — площадь растёт как k², а не k.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длина ×k, площадь ×k², объём ×k³.</div></div>", "src": "PL"}, {"id": 34, "topic": "M5.16", "text": "<p>A sector has radius 9 cm and angle 40°.</p><p>What is its area, in terms of \\(\\pi\\)?</p>", "image": "", "options": ["\\(\\pi\\) cm²", "\\(18\\pi\\) cm²", "\\(2\\pi\\) cm²", "\\(9\\pi\\) cm²", "\\(81\\pi\\) cm²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь сектора = <span class=\"fr\"><span>θ</span><span>360</span></span> · πr².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>40</span><span>360</span></span> · 81π = 9π см². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — радиус не в квадрате.</li><li>C — это длина дуги.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дуга — от длины окружности, сектор — от площади круга.</div></div>", "src": "PL"}, {"id": 35, "topic": "M4.14", "text": "<p>Find the gradient of the line joining \\((2, 7)\\) and \\((6, 5)\\).</p>", "image": "", "options": ["\\(\\dfrac{1}{2}\\)", "\\(\\dfrac{3}{2}\\)", "−1", "−2", "−\\(\\dfrac{1}{2}\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m = <span class=\"fr\"><span>y₂ − y₁</span><span>x₂ − x₁</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(5 − 7) : (6 − 2) = −<span class=\"fr\"><span>1</span><span>2</span></span>. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложили координаты.</li><li>D — Δx/Δy вместо Δy/Δx.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте в одном порядке сверху и снизу.</div></div>", "src": "PL"}, {"id": 36, "topic": "M4.8", "text": "<p>Given that \\(x^2 + 4x - 1 \\equiv (x + a)^2 + b\\) for all \\(x\\), find \\(b\\).</p>", "image": "", "options": ["−5", "−1", "2", "3", "5"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделите полный квадрат: a = половина коэффициента при x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 2, (x + 2)² = x² + 4x + 4.</li><li>b = −1 − 4 = −5. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — взяли свободный член без поправки.</li><li>C — это a, а не b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте коэффициенты при одинаковых степенях.</div></div>", "src": "PL"}, {"id": 37, "topic": "M2.3", "text": "<p>Two buses leave the station together. One returns every 75 minutes and the other every 45 minutes.</p><p>After how many minutes are they next at the station together?</p>", "image": "", "options": ["15", "120", "225", "450", "3375"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно наименьшее общее кратное (НОК).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОД(75, 45) = 15.</li><li>НОК = 75 · 45 : 15 = 225. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это НОД, а нужен НОК.</li><li>B — сложили интервалы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Снова вместе» — НОК; «разделить поровну» — НОД.</div></div>", "src": "PL"}, {"id": 38, "topic": "M1.2", "text": "<p>Convert 1.5 m³ to cm³.</p>", "image": "", "options": ["150 cm³", "1500 cm³", "15,000 cm³", "1,500,000 cm³", "150,000,000 cm³"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 м = 100 см, значит 1 м³ = 100³ = 1 000 000 см³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,5 · 1 000 000 = 1 500 000 см³. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — умножили на 100, как для длины.</li><li>B — перевели в литры, а не в см³.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Объём — куб коэффициента, площадь — квадрат.</div></div>", "src": "PL"}, {"id": 39, "topic": "M5.10", "text": "<p>Find the midpoint of the line segment joining \\((2, 7)\\) and \\((8, -3)\\).</p>", "image": "", "options": ["(5, 2)", "(10, 4)", "(3, −5)", "(4.5, 2.5)", "(2, 5)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Середина — среднее координат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>((2 + 8)/2; (7 + −3)/2) = (5; 2). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли разделить на 2.</li><li>C — вычли вместо сложения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте x с x, y с y.</div></div>", "src": "PL"}, {"id": 40, "topic": "M3.2", "text": "<p>Write 600 m of 4 km as a fraction in its simplest form.</p>", "image": "", "options": ["\\(\\dfrac{17}{20}\\)", "150", "\\(\\dfrac{3}{20}\\)", "\\(\\dfrac{3}{200}\\)", "\\(\\dfrac{3}{2}\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала одинаковые единицы, потом сокращение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>600 из 4000 → <span class=\"fr\"><span>3</span><span>20</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это оставшаяся часть.</li><li>B — не перевели в одинаковые единицы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дробь имеет смысл только для одинаковых единиц.</div></div>", "src": "PL"}, {"id": 41, "topic": "M5.13", "text": "<p>The bearing of Q from P is 205°.</p><p>What is the bearing of P from Q?</p>", "image": "", "options": ["205°", "115°", "025°", "50°", "155°"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный азимут = исходный ± 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>205° − 180 = 025°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — направление то же.</li><li>E — вычли из 360 — это отражение, а не обратный азимут.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ всегда тремя цифрами.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1200, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      return `<div class="review-item"><span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span></div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1200, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

</style>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>


<!-- ===== Prepline: sign-in gate ===== -->
<style id="prepline-gate-css">
  #pl-gate{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;
