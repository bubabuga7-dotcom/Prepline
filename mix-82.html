<style>

    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }

  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }

  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;

  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;

    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }

  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "M3.11", "text": "<p>₸5,000 is invested at 5% per year compound interest.</p><p>What is it worth after 3 years, to the nearest tenge?</p>", "image": "", "options": ["₸750", "₸5,512", "₸5,750", "₸5,788", "₸6,078"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5000 · 1,05³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5000 · 1,157625 ≈ 5788. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — простые проценты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложный процент — степень.</div></div>", "src": "PL"}, {"id": 2, "topic": "M1.2", "text": "<p>A train travels at 90 km/h. What is this speed in m/s?</p>", "image": "", "options": ["2 m/s", "15 m/s", "25 m/s", "30 m/s", "324 m/s"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим на 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>90 : 3,6 = 25 м/с. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — умножили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> км/ч → м/с: ÷3,6.</div></div>", "src": "PL"}, {"id": 3, "topic": "M4.2", "text": "<p>Solve \\(8^{x} = 16^{x-4}\\).</p>", "image": "", "options": ["-16", "12", "16", "17", "32"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2^{3x} = 2^{4(x − 4)}.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3x = 4x − 16 → x = 16. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одно основание.</div></div>", "src": "PL"}, {"id": 4, "topic": "M2.10", "text": "<p>After a 15% increase a coat costs ₸11,500.</p><p>What did it cost before the increase?</p>", "image": "", "options": ["₸8,846", "₸9,775", "₸10,000", "₸10,200", "₸11,350"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена × 1,15 = 11 500.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>11 500 : 1,15 = 10 000. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вычли 15% от новой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на множитель.</div></div>", "src": "PL"}, {"id": 5, "topic": "M4.13", "text": "<p>On a speed–time graph a straight line joins (0, 0) to (6, 15), with time in seconds and speed in m/s.</p><p>What is the acceleration?</p>", "image": "", "options": ["5 m/s²", "15 m/s²", "\\(\\dfrac{2}{5}\\) m/s²", "\\(\\dfrac{5}{2}\\) m/s²", "\\(\\dfrac{15}{2}\\) m/s²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ускорение = наклон графика скорости.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>15</span><span>6</span></span> = <span class=\"fr\"><span>5</span><span>2</span></span> м/с². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Δv/Δt.</div></div>", "src": "PL"}, {"id": 6, "topic": "M2.9", "text": "<p>Which fraction equals \\(0.1\\overline{6}\\)?</p>", "image": "", "options": ["\\(\\dfrac{1}{3}\\)", "\\(\\dfrac{4}{25}\\)", "\\(\\dfrac{1}{7}\\)", "\\(\\dfrac{1}{6}\\)", "\\(\\dfrac{17}{66}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,1(6) = <span class=\"fr\"><span>16 − 1</span><span>90</span></span> = <span class=\"fr\"><span>15</span><span>90</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>6</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 0,(3).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предпериод → 0 в знаменателе.</div></div>", "src": "PL"}, {"id": 7, "topic": "M4.5", "text": "<p>Expand \\((2x + 3)(2x - 1)\\).</p>", "image": "", "options": ["\\(4x^2 - 8x - 3\\)", "\\(4x^2 + 5x - 3\\)", "\\(4x^2 + 4x + 3\\)", "\\(4x^2 - 2x - 3\\)", "\\(4x^2 + 4x - 3\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4x² − 2x + 6x − 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4x² + 4x − 3. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знак при 6x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Четыре произведения.</div></div>", "src": "PL"}, {"id": 8, "topic": "M3.5", "text": "<p>Rice costs ₸600 for a 300 g pack or ₸1800 for a 1000 g pack.</p><p>Which is better value, and why?</p>", "image": "", "options": ["The 300 g pack, because it costs less in total", "The 1000 g pack, because it is heavier", "They are the same value", "The 300 g pack, because it costs less per gram", "The 1000 g pack, because it costs less per gram"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена за грамм: <span class=\"fr\"><span>600</span><span>300</span></span> = 2; <span class=\"fr\"><span>1800</span><span>1000</span></span> = 1,8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Большая пачка дешевле за грамм. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вес не причина.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте цену единицы.</div></div>", "src": "PL"}, {"id": 9, "topic": "M5.19", "text": "<p>The vector \\(\\begin{pmatrix}6\\\\k\\end{pmatrix}\\) is parallel to \\(\\begin{pmatrix}2\\\\-1\\end{pmatrix}\\).</p><p>What is the value of \\(k\\)?</p>", "image": "", "options": ["-3", "-2", "-1", "2", "3"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Параллельны → пропорциональны: 6 = 3 · 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 3 · (−1) = −3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один вектор = k × другой.</div></div>", "src": "PL"}, {"id": 10, "topic": "M5.13", "text": "<p>On a map with scale 1 : 200,000 two towns are 3.2 cm apart.</p><p>What is the real distance?</p>", "image": "", "options": ["0.64 km", "6.4 km", "7.4 km", "64 km", "640 km"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3,2 · 200 000 = 640 000 см.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6,4 км. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — ошибка порядка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 км = 100 000 см.</div></div>", "src": "PL"}, {"id": 11, "topic": "M5.6", "text": "<p>The point (-4, 2) is translated by the vector \\(\\begin{pmatrix}-4\\\\1\\end{pmatrix}\\).</p><p>What are the coordinates of its image?</p>", "image": "", "options": ["(0, 1)", "(16, 2)", "(-8, 3)", "(-3, -2)", "(-4, 1)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(−4 − 4; 2 + 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−8; 3). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли вектор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложите координаты.</div></div>", "src": "PL"}, {"id": 12, "topic": "M3.10", "text": "<p>A map has scale 1 : 10,000. A lake covers 8 cm² on the map.</p><p>What is the real area of the lake?</p>", "image": "", "options": ["0.0008 km²", "0.008 km²", "0.08 km²", "0.8 km²", "8 km²"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 см = 100 м → 1 см² = 10 000 м².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 · 10 000 = 80 000 м² = 0,08 км². Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ошибка в км².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 км² = 10⁶ м².</div></div>", "src": "PL"}, {"id": 13, "topic": "M2.6", "text": "<p>What is \\(\\sqrt{5^{6}}\\)?</p>", "image": "", "options": ["25", "125", "625", "3125", "7812"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">√(5⁶) = 5³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>125. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 5⁴.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Половина показателя.</div></div>", "src": "PL"}, {"id": 14, "topic": "M3.4", "text": "<p>Three numbers are in the ratio 3 : 4 : 5. The largest is 50 more than the smallest.</p><p>What is their total?</p>", "image": "", "options": ["100", "275", "300", "325", "600"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5 − 3 = 2 части = 50 → часть 25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма 12 · 25 = 300. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 11 частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3 + 4 + 5 = 12.</div></div>", "src": "PL"}, {"id": 15, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(-7 \\lt n \\le -2\\)?</p>", "image": "", "options": ["4", "5", "6", "7", "9"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n = −6, …, −2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 чисел. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — включили −7.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство.</div></div>", "src": "PL"}, {"id": 16, "topic": "M3.11", "text": "<p>₸2,000 is invested at 2% per year compound interest.</p><p>What is it worth after 3 years, to the nearest tenge?</p>", "image": "", "options": ["₸120", "₸2,081", "₸2,120", "₸2,122", "₸2,165"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2000 · 1,02³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2000 · 1,061208 ≈ 2122. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — простые проценты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложный процент.</div></div>", "src": "PL"}, {"id": 17, "topic": "M1.2", "text": "<p>A train travels at 72 km/h. What is this speed in m/s?</p>", "image": "", "options": ["1 m/s", "12 m/s", "20 m/s", "25 m/s", "259 m/s"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">72 : 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>20 м/с. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — умножили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ÷3,6.</div></div>", "src": "PL"}, {"id": 18, "topic": "M4.2", "text": "<p>Solve \\(25^{x} = 125^{x-2}\\).</p>", "image": "", "options": ["-6", "4", "6", "7", "12"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5^{2x} = 5^{3(x − 2)}.</p><div class=\"ex-h\">Решение</div><o lass=\"ex-s\"><li>(−6; −1). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — отражение в оси x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x, y) → (y, x).</div></div>", "src": "PL"}, {"id": 27, "topic": "M3.10", "text": "<p>A map has scale 1 : 20,000. A lake covers 3 cm² on the map.</p><p>What is the real area of the lake?</p>", "image": "", "options": ["0.012 km²", "0.12 km²", "0.6 km²", "1.2 km²", "12 km²"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 см = 200 м → 1 см² = 40 000 м².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 · 40 000 = 120 000 м² = 0,12 км². Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без квадрата масштаба.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь — масштаб².</div></div>", "src": "PL"}, {"id": 28, "topic": "M2.6", "text": "<p>Between which two consecutive whole numbers does \\(\\sqrt{52}\\) lie?</p>", "image": "", "options": ["5 and 6", "6 and 7", "7 and 8", "8 and 9", "9 and 10"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">49 < 52 < 64.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>7 и 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 36 и 49.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ближайшие квадраты.</div></div>", "src": "PL"}, {"id": 29, "topic": "M3.4", "text": "<p>In a club the ratio of boys to girls is 7 : 4. There are 24 more boys than girls.</p><p>How many girls are there?</p>", "image": "", "options": ["32", "40", "56", "88", "96"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 части = 24 → часть 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Девочек 4 · 8 = 32. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — мальчики.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность частей.</div></div>", "src": "PL"}, {"id": 30, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(-4 \\lt n \\le 4\\)?</p>", "image": "", "options": ["6", "7", "8", "9", "10"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n = −3, …, 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 чисел. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — включили −4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое и нестрогое.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
