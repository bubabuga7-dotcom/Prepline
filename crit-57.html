<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct078_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сверяем каждую точку (начальная; итоговая) с таблицей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Все точки есть, кроме Гэри (48; 50) — его точка стоит не там. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные студенты отмечены верно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте точки по одной.</div></div>"}, {"id": 2, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q21 · Parallel reasoning</p>", "image": "images/ct-pp/ct078_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Некоторые могут без тренировок; Джон пробежал → возможно, не тренировался».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: рак лёгких бывает и у некурящих; у Джилл рак → возможно, не курит. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — слишком уверенно.</li><li>B, C — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Возможно» в посылке и в выводе.</div></div>"}, {"id": 3, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q22 · Assumption</p>", "image": "images/ct-pp/ct078_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: больше разнообразия персонала → таких ошибок не будет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: разнообразный коллектив помогает избегать подобных ошибок. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно.</li><li>B, C, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Связь меры с проблемой.</div></div>"}, {"id": 4, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q23 · Weaken</p>", "image": "images/ct-pp/ct078_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: низкие результаты SEND — вина недофинансирования.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если у части учеников состояние ограничивает понимание — разрыв не только из-за денег. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — описывают нужды, которые деньги решают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Причина вне контроля правительства.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q24 · Problem solving</p>", "image": "images/ct-pp/ct078_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время Майи T, Имана t; T = t + 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Иман быстрее на 25% → T = 1,25t.</li><li>1,25t − t = 5 → t = 20 с. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скорость ×1,25 → время ×1,25.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct078_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рыба на фунт = вес · доля рыбы · 2 : цена.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Arctic 30, Banquet 32, Chilco 33, Dyner 37,5, Evertop 35 г/£.</li><li>Dyner. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте рыбу, а не вес котлеты.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q26 · Problem solving</p>", "image": "images/ct-pp/ct078_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Максимум — Австралия 201,2, минимум — Пакистан 3,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>201,2 − 3,5 = 197,7 тыс. $. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не крайние.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Левый столбец, не правый.</div></div>"}, {"id": 8, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q27 · Flaw</p>", "image": "images/ct-pp/ct078_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Удержит показатели → сохранит франшизу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: других причин лишиться франшизы нет. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одно условие ≠ гарантия.</div></div>"}, {"id": 9, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q28 · Parallel reasoning</p>", "image": "images/ct-pp/ct078_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Опоздал → уволят; уволили → опоздал (утверждение следствия).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: громкость ↑ → громче; громко → крутили. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — отрицание следствия (верно).</li><li>D — отрицание антецедента.</li><li>E — верный modus ponens.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Из B не следует A.</div></div>"}, {"id": 10, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q29 · Main conclusion</p>", "image": "images/ct-pp/ct078_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод — во втором предложении.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Идею, что совместное обучение лучшее, надо пересмотреть. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — доводы.</li><li>D — слишком широко.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «It is time to reconsider» — вывод.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q30 · Problem solving</p>", "image": "images/ct-pp/ct078_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Произведение 8: наборы {1,1,8}, {1,2,4}, {2,2,2}.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Перестановки: 3 + 6 + 1 = 10. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропустили набор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте перестановки.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct078_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чай = кофе = n: 1,5n + 2,5n + 3c = 32 → 4n + 3c = 32.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 5, c = 4: 10 + 4 = 14 напитков. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>n = 2, c = 8 — только 12.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дешёвые напитки — больше штук.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct078_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужны кубики на рёбрах «зелёный–синий» без углов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 таких ребра · 3 средних кубика = 12. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — с углами или не те рёбра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угловые кубики касаются красного.</div></div>"}, {"id": 14, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q33 · Assumption</p>", "image": "images/ct-pp/ct078_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">HS2 надо остановить, потому что сёла не выиграют.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: выгоды только для больших городов недостаточно. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скрытая оценка выгоды.</div></div>"}, {"id": 15, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q34 · Principle</p>", "image": "images/ct-pp/ct078_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Право ≠ оправдание; решать надо по морали.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: обидная критика не оправдывается свободой слова. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — другой принцип.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Имею право» не значит «правильно».</div></div>"}, {"id": 16, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q35 · Drawing a conclusion</p>", "image": "images/ct-pp/ct078_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если человек раньше помог, ему помогают одинаково, независимо от симпатии.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, кто помогает другим, скорее получит помощь в ответ. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «всегда» слишком сильно.</li><li>B — о прошлых взглядах психологов не сказано.</li><li>C — «самый важный» не доказан.</li><li>E — о тех, кому не помогали, нет данных.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод из механизма взаимности.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q36 · Problem solving</p>", "image": "images/ct-pp/ct078_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Часы в неделю: Мия 7, Гарриет 10, Мехран 3 → 20 ч = 60 £ → 3 £/ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мехран 9 £ — «Celebrated Six»; Мия 21 £ = 8 + 13; Гарриет 30 £ = 14 + 16.</li><li>Мия получила «Hungry Dinosaurs». Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не сходится.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропорционально времени.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q37 · Problem solving</p>", "image": "images/ct-pp/ct078_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Glink g, creamer 2g, chop 2g + 1, yip y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Я: 16g + 3 + 4y = 47; соперник: 18g + 5 + 3y = 50.</li><li>g = 2, y = 3. Glink = 2. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не верны при g = 2, y = 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Система уравнений.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q38 · Problem solving</p>", "image": "images/ct-pp/ct078_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Начало (32): хэтч 12, седан 8, утилитар 6, универсал 4, вэн 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конец (8): 1, 2, 2, 2, 1.</li><li>Продано: 11, 6, 4, 2, 1 — полоса 4. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не те числа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Продано = было − осталось.</div></div>"}, {"id": 20, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q39 · Main conclusion</p>", "image": "images/ct-pp/ct078_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Моральные оценки, вопреки нашим представлениям, зависят от удачи. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — контраст.</li><li>D, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Whether or not we like to admit it» — вывод.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q40 · Flaw</p>", "image": "images/ct-pp/ct078_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Оба не могут быть правы → истина посередине».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Из этого не следует, что ни одна сторона не права. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ложная середина.</div></div>"}, {"id": 22, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q41 · Assumption</p>", "image": "images/ct-pp/ct078_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дебаты показывают социальные навыки, но не помогают понять лидерский потенциал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: социальные навыки — плохой показатель лидерства. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скрытое звено.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q42 · Problem solving</p>", "image": "images/ct-pp/ct078_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шесть монет разные — значит, это все шесть видов (сумма 385p).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сдача: E + F = x, C + D = x + p, A + B = x + 3p.</li><li>p = 55: 200 + 20, 100 + 10, 50 + 5 ✔. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие цены не дают разных монет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма всех монет известна.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q43 · Problem solving</p>", "image": "images/ct-pp/ct078_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Очки = сумма соседних фишек + число белых соседей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Клетка с 0 во 2-м ряду: соседи 5, 2, 2, 4 = 13 + 1 белая = 14.</li><li>Максимум 14. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие клетки дают ≤ 13.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите клетку с большими соседями.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q44 · Problem solving</p>", "image": "images/ct-pp/ct078_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 и 8 — две мыши → 3 мышь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 и 10 — пара → 10 кошка; 10 и 12 вернули → 12 тоже кошка.</li><li>3 и 12 — точно пара. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — цвет второй карты неизвестен.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка выводов по картам.</div></div>"}, {"id": 26, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q45 · Parallel reasoning</p>", "image": "images/ct-pp/ct078_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Если правда — не нервничал бы; нервничает → вероятно, лжёт». Отрицание следствия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: если бы заботились — не было бы одноразовых стаканов; они есть → не заботятся. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — утверждение следствия.</li><li>A, C, E — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нет ожидаемого следствия → нет условия.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q46 · Problem solving</p>", "image": "images/ct-pp/ct078_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">До 3 событий по 10, 6, 3, 1 или 0 очков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Все суммы от 1 до 23 получаются (15 = 6 + 6 + 3, 22 = 10 + 6 + 6).</li><li>24 — нельзя. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>15, 22 — возможны; 27, 31 — больше 24.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебор сумм.</div></div>"}, {"id": 28, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q47 · Main conclusion</p>", "image": "images/ct-pp/ct078_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем то, что доказывают остальные предложения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Город-машина вредит качеству жизни, жителям важна свобода → значит, мы теряем важное, если слишком планируем. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — доводы.</li><li>A — посылка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод может стоять в середине.</div></div>"}, {"id": 29, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q48 · Problem solving</p>", "image": "images/ct-pp/ct078_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3r + a = 3,5; a + 4c = 8; r + 2c = 3,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма: 4r + 2a + 6c = 15; 2r + 4c = 7.</li><li>2(r + a + c) = 8 → r + a + c = 4 $. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте уравнения, а не решайте каждое.</div></div>"}, {"id": 30, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q49 · Weaken</p>", "image": "images/ct-pp/ct078_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: депутаты лицемерны, критикуя ведущих BBC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если депутаты были известны до парламента — их доход не за счёт общественной должности. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не ослабляют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что ситуации разные.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
