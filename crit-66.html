<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q10 · Parallel reasoning</p>", "image": "images/ct-pp/ct087_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Хочешь X с условием Y; X без Y не бывает → придётся платить больше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C: хочешь мощную экономичную машину; мощные не экономичны → придётся больше тратить на топливо. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — «откажись от желания».</li><li>D — конкуренция, а не «не бывает».</li><li>E — плюсы обоих вариантов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Та же структура и тот же вывод.</div></div>"}, {"id": 2, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q11 · Flaw</p>", "image": "images/ct-pp/ct087_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исландцы здоровы → нужно есть как они.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Здоровье может зависеть от других причин, не только от диеты. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — практические сложности, а не ошибка вывода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 3, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q12 · Flaw</p>", "image": "images/ct-pp/ct087_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше стоматологов — меньше ожирения → вкладываться в стоматологию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Аргумент принимает корреляцию за причину. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q13 · Problem solving</p>", "image": "images/ct-pp/ct087_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дом Дэвида → Барри → магазин → колледж по прямой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Магазин → колледж: 45 − 20 = 25 мин.</li><li>Барри → магазин: 32 − 25 = 7 мин. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Паузы по 3 мин — лишние данные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте отрезки.</div></div>"}, {"id": 5, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q14 · Drawing a conclusion</p>", "image": "images/ct-pp/ct087_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение по таблице.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Синтетическая смола (E) встречается только у фанеры и бальзы — только дерево. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — акрил + полистирол: D, H.</li><li>C — бальзовый цемент и для картона.</li><li>D — картон + акрил тоже 3 вида (DFI).</li><li>E — полистирол + картон: D.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите контрпример.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q15 · Problem solving</p>", "image": "images/ct-pp/ct087_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Массы: 60 м² и 32 м кромки → 0,20 $/м² и 0,25 $/м.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Коста: 135 м² · 0,20 = 27 $; периметр 48 · 0,25 = 12 $.</li><li>Итого 39 $. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E, C — пропорция по площади.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь и периметр масштабируются по-разному.</div></div>"}, {"id": 7, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q16 · Weaken</p>", "image": "images/ct-pp/ct087_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Запретить глубоководное бурение ради безопасности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если запрет поднимет цены на нефть и больше всего ударит по бедным — довод «защитить бедных» оборачивается против. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — не ослабляют.</li><li>D — предположение о будущем.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите вред самой меры.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q17 · Problem solving</p>", "image": "images/ct-pp/ct087_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пачка 300 г = 1386 ккал; одно печенье 60 ккал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1386 : 60 ≈ 23. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Проверка по белку: 32,3 : 1,4 ≈ 23.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пересчёт со 100 г на пачку.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct087_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Голубь летает, пока едет поезд.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поезд: 120 миль при 30 миль/ч = 4 ч.</li><li>Голубь: 40 · 4 = 160 миль. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Не нужно считать каждый отрезок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Время × скорость.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct087_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три фигуры: трапеция, малый и большой треугольники.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Фигуру E нельзя разрезать на эти три части. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D складываются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте площади и углы 45°.</div></div>"}, {"id": 11, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q20 · Assumption</p>", "image": "images/ct-pp/ct087_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Интернет-зависимость → осторожнее с компьютерным обучением.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: компьютерное обучение подразумевает интернет. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — слишком сильно.</li><li>B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Звено «компьютер = интернет».</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct087_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр = 60% от 21 000 = 12 600 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 600 : 28 = 450 мест.</li><li>450 : 30 = 15 рядов. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та цена.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деньги → места → ряды.</div></div>"}, {"id": 13, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q2 · Flaw</p>", "image": "images/ct-pp/ct087_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Учеников оценивают по «веселью», а цель — образование.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не учтено, что интересные уроки могут улучшать образование. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ложное противопоставление.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct087_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Газон: 6 × 4 = 24 − патио 1 − выемка 2 = 21 м².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>21 · 50 г = 1050 г.</li><li>1 кг + 100 г = 14 + 2 = 16 £ — дешевле всего. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 1,2 кг дороже; C — 1 кг не хватит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Комбинируйте пакеты.</div></div>"}, {"id": 15, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q4 · Weaken</p>", "image": "images/ct-pp/ct087_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Деревянные полы модны из-за экологичности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если ламинат и паркет тоже делают с нефтехимией — довод рушится. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — усиливает.</li><li>B, D, E — не про экологичность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разрушьте главную причину.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct087_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем очки без джокера и сравниваем с итогом.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тиа 8 → 14: +6 (победа); Джессика 13 → 19: +6 (победа); Хелена 7 → 13: +6 (победа).</li><li>Каролина +1, Келли +3. Итого 3. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в подсчёте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разница = очки в «джокерном» виде.</div></div>"}, {"id": 17, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q6 · Drawing a conclusion</p>", "image": "images/ct-pp/ct087_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тренировка отложила деменцию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Активный ум задерживает начало деменции. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — оценочно.</li><li>A, C, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прямой вывод из данных.</div></div>"}, {"id": 18, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q7 · Main conclusion</p>", "image": "images/ct-pp/ct087_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лишь 20% реанимированных пережили NDE.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: NDE не имеют чисто физиологической причины. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — доводы.</li><li>C, E — противоположная позиция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore» вводит вывод.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct087_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три петли: вдоль, поперёк и по бокам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · (40 + 20) = 120; 2 · (30 + 20) = 100; 2 · (40 + 30) = 140.</li><li>360 + 20 на узел = 380 см. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — без горизонтальной петли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая петля — периметр сечения.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct087_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Узор 5 × 5 = 25 клеток; деталей 10 + 6 + 4 + 10 + 5 = 35.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Лишняя — 10 клеток: A или D.</li><li>Без D узор собирается. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Без A не хватает внешних столбцов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с подсчёта клеток.</div></div>"}, {"id": 21, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2019 · original Q10 · Assumption</p>", "image": "images/ct-pp/ct087_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод о цикле — по старым записям улова.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: эти записи точны. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Надёжность данных.</div></div>"}, {"id": 22, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q1 · Strengthen</p>", "image": "images/ct-pp/ct087_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Запретить посылки с книгами заключённым.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в посылках находят наркотики — ещё одна причина. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — ослабляют.</li><li>B, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Новый довод за вывод.</div></div>"}, {"id": 23, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q2 · Main conclusion</p>", "image": "images/ct-pp/ct087_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Позитив полезен, но не всегда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: позитивное мышление не всегда помогает. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — примеры.</li><li>C — уступка.</li><li>E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обобщение примеров.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct087_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">После каждого сгиба точка на нижней стороне.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разворачиваем в обратном порядке и переворачиваем: точки ложатся как в B. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та четверть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разворачивайте по одному сгибу.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q4 · Problem solving</p>", "image": "images/ct-pp/ct087_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Семья ≥ 3 детей ↔ братьев + сестёр ≥ 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2б: Лерой, Джемма; 3б: Каллум; 1б1с: Раджив, Эмили, Фатима; 2б1с: Пол.</li><li>2с: Аруна; 1б2с: Кэндис, Марвин; 1б3с: Фиби.</li><li>Итого 11. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропущены клетки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте самого ученика.</div></div>"}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct087_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Осталось 64%; съели 25% от них = 16%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ещё 2 дня по 16% → 64 − 48 = 16%. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неверный остаток.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одинаковое количество, а не процент.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct087_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Zoom вдвое концентрированнее: 1 кг = 2 кг обычного.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цена за «обычный» кг: Zap 2 кг 1,20; Zoom 2 кг 1,24; Zoom 1 кг 1,25; Own 1,25; Zap 1 кг 1,30.</li><li>Лучше всего A. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — почти, но дороже.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приводите к одинаковому числу стирок.</div></div>"}, {"id": 28, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q7 · Assumption</p>", "image": "images/ct-pp/ct087_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из одного случая (Мондриан) объясняют выбор всех художников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: другие художники выбирают Лондон по тем же причинам. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один пример → общее правило.</div></div>"}, {"id": 29, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q8 · Parallel reasoning</p>", "image": "images/ct-pp/ct087_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кто в Вегасе — любит азарт; Джерри не в Вегасе → не любит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: в городе — ненавидят пробки; ты в деревне → любишь пробки. Та же ошибка. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — верное применение правила.</li><li>C, D, E — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отрицание условия + противоположный вывод.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct087_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Машина + топливо на 20 000 миль.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бензин: 50 заправок · 50 = 2500 → 12 500 $ — минимум.</li><li>Автогаз и электро — 13 000; дизель 14 000; водород 14 500. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные дороже.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте полную стоимость.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
