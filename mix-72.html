<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m053_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перебор по времени математики (все три курса в разное время).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>M = 8: S ∈ {10, 11}, E ≠ S → 2 · 2 = 4.</li><li>M = 10: 2 + 1 = 3; M = 11: 2 + 1 = 3. Всего 10. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без учёта совпадений.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебирайте аккуратно.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m053_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">sin 75° = cos 15°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin 15° cos 15° = ½ sin 30° = <span class=\"fr\"><span>1</span><span>4</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — <span class=\"fr\"><span>√3</span><span>4</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Двойной угол.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m053_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">К первой встрече вместе проплыли L, Боб — 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ко второй вместе 3L → Боб 60 = L + 18 → L = 42. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 40.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропорция путей.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m053_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для прямоугольного треугольника S = AD · DB (отрезки касательных к гипотенузе).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>7 · 13 = 91. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 100.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x + r)(y + r) = 2S − … даёт S = xy.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m053_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² + (y − 1)² = <span class=\"fr\"><span>36</span><span>25</span></span> и x² + y² = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 − 2y = <span class=\"fr\"><span>36</span><span>25</span></span> → y = <span class=\"fr\"><span>7</span><span>25</span></span> = 0,28. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 0,25.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите уравнения.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m053_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">r = √2, центры на расстоянии 2 → центральный угол 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сегмент <span class=\"fr\"><span>π</span><span>2</span></span> − 1; линза 2(<span class=\"fr\"><span>π</span><span>2</span></span> − 1) = π − 2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — один сегмент.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сектор − треугольник.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m053_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">a + b = <span class=\"fr\"><span>1</span><span>z</span></span>, a + c = <span class=\"fr\"><span>1</span><span>y</span></span>, b + c = <span class=\"fr\"><span>1</span><span>x</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = ½<span class=\"fr\"><span>1</span><span>z</span></span> + <span class=\"fr\"><span>1</span><span>y</span></span> − <span class=\"fr\"><span>1</span><span>x</span></span> = <span class=\"fr\"><span>xy + xz − yz</span><span>2xyz</span></span> → время <span class=\"fr\"><span>2xyz</span><span>xz + xy − yz</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — производительность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Время = 1/производительность.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m053_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">cos θ = <span class=\"fr\"><span>1 + 4 − 7</span><span>2 · 1 · 2</span></span> = −½.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>θ = <span class=\"fr\"><span>2π</span><span>3</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — <span class=\"fr\"><span>5π</span><span>6</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Теорема косинусов.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m053_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точка пересечения — центр гомотетии: <span class=\"fr\"><span>d</span><span>d + 26</span></span> = <span class=\"fr\"><span>8</span><span>18</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18d = 8d + 208 → d = 20,8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 16,2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подобные прямоугольные треугольники.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m053_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сдвиг боковой стороны даёт треугольник со сторонами 16 − 10 = 6, 13, 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 + 6 < 13 — треугольник не существует → 0. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не проверили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Неравенство треугольника.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m053_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">a > 0, c > 0, оба корня > 0 → b < 0; f(1) < 0, f(−1) > 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Положительны ac и a − b + c → 2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — a + b + c = f(1) < 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a ± b + c = f(±1).</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m053_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">PO = 13, касательные длиной 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Хорда касания XY = 2 · 5 · <span class=\"fr\"><span>12</span><span>13</span></span> = <span class=\"fr\"><span>120</span><span>13</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без расчёта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота к гипотенузе = <span class=\"fr\"><span>ab</span><span>c</span></span>.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m053_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отразим конец (<span class=\"fr\"><span>1</span><span>6</span></span>; 0) по DA, CD, BC: (<span class=\"fr\"><span>13</span><span>6</span></span>; 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(<span class=\"fr\"><span>13</span><span>6</span></span> − <span class=\"fr\"><span>2</span><span>3</span></span>² + 2²) = √(2,25 + 4) = 2,5. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — <span class=\"fr\"><span>8</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отражения выпрямляют путь.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m053_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">D > 0 (корни есть), оба отрицательны; 3142 = 2 · 1571 — целых корней нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Σ <span class=\"fr\"><span>1</span><span>x</span></span> = <span class=\"fr\"><span>−1994</span><span>3142</span></span> > −1. Все A–D ложны. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — модуль меньше 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Виета.</div></div>"}, {"id": 101, "text": "", "image": "images/math-new/m054_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2 * 1 = 4 + 1 = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 * 5 = 9 + 5 = 14. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 9 + 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала скобки.</div></div>"}, {"id": 102, "text": "", "image": "images/math-new/m054_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2¹⁶ − 16 = 16(2¹² − 1) = 16 · 4095.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4095 = 3² · 5 · 7 · 13 → наибольший простой 13. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 17 делит 2¹⁶ + 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2¹² − 1 = (2⁶ − 1)(2⁶ + 1).</div></div>"}, {"id": 103, "text": "", "image": "images/math-new/m054_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x = 1: f(1 + f(1)) = f(5) = 4f(1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(5) = 16. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 4 + 20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте x = 1.</div></div>"}, {"id": 104, "text": "", "image": "images/math-new/m054_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">BN = BP, CM = CP.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P = AB + BP + PC + AC = AN + AM = 14. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без расчёта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отрезки касательных равны.</div></div>"}, {"id": 105, "text": "", "image": "images/math-new/m054_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">A + D = (A + B) − (B + C) + (C + D).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 − 10 + 16 = 18. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Комбинируйте суммы.</div></div>"}, {"id": 107, "text": "", "image": "images/math-new/m054_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>1</span><span>r</span></span> + <span class=\"fr\"><span>1</span><span>s</span></span> = <span class=\"fr\"><span>r + s</span><span>rs</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>6</span><span>2</span></span> = 3. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — только r + s.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Виета.</div></div>"}, {"id": 108, "text": "", "image": "images/math-new/m054_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Удалённое число = 60n − 70(n − 1) = 70 − 10n > 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n < 7 → n = 6. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без условия положительности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Число должно быть положительным.</div></div>"}, {"id": 109, "text": "", "image": "images/math-new/m054_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Магическая сумма 5 × 5: 5 · <span class=\"fr\"><span>26</span><span>2</span></span> = 65.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A = 65 − (20 + 13 + 6 + 4) = 22. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 17.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> n<span class=\"fr\"><span>n² + 1</span><span>2</span></span>.</div></div>"}, {"id": 111, "text": "", "image": "images/math-new/m054_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x + 1)(x² − x + 1) = x³ + 1 = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x³ = −1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма кубов.</div></div>", "topic": "M4.16"}, {"id": 112, "text": "", "image": "images/math-new/m054_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота пересечения: <span class=\"fr\"><span>1</span><span>24</span></span> = <span class=\"fr\"><span>1</span><span>40</span></span> + <span class=\"fr\"><span>1</span><span>h</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>h</span></span> = <span class=\"fr\"><span>1</span><span>60</span></span> → h = 60. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 64.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Гармоническое» правило.</div></div>"}, {"id": 113, "text": "", "image": "images/math-new/m054_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Варианты ≈ 1, поэтому имелось в виду √1,009 (опечатка).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(1 + 0,009) ≈ 1 + 0,0045 = 1,0045. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 1,002.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √(1 + ε) ≈ 1 + ε/2.</div></div>"}, {"id": 118, "text": "", "image": "images/math-new/m054_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x679y делится на 72 = 8 · 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На 8: 79y → 792 → y = 2. На 9: x + 24 ⋮ 9 → x = 3. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 7.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Признаки делимости.</div></div>"}, {"id": 119, "text": "", "image": "images/math-new/m054_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Посчитаем вино после двух переливаний и приравняем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x − 4 = 4<span class=\"fr\"><span>x − 4</span><span>x</span></span> → x = 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают равенства.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доля вина в отобранной части.</div></div>"}, {"id": 120, "text": "", "image": "images/math-new/m054_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Продлим AB и DC до точки E: ∠E = 50° = ∠D → AE = AD; ∠BCE = 50° → BE = BC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = AB + BC → периметр 2AD + 5 = 35 → AD = 15. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Равнобедренные треугольники.</div></div>"}, {"id": 122, "text": "", "image": "images/math-new/m054_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последний элемент Sₙ = 1 + 2 + … + n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>100 · <span class=\"fr\"><span>101</span><span>2</span></span> = 5050. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 5000.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Треугольные числа.</div></div>"}, {"id": 124, "text": "", "image": "images/math-new/m054_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чётный делитель: 2<sup>a</sup> (a = 1…4), 3<sup>b</sup> (0…2), 5<sup>c</sup> (0…1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 3 · 2 = 24. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 30 − …</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте показатели.</div></div>"}, {"id": 126, "text": "", "image": "images/math-new/m054_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Строка 2: 2 3 4 1. Строка 3: в столбце 4 — 2; a ∈ {1, 2} → a = 1, столбец 2 — 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Строка 4: b = 1 (в столбце 2 уже 2, 3, 4). a + b = 2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка заполнения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Латинский квадрат.</div></div>"}, {"id": 130, "text": "", "image": "images/math-new/m054_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычтем первое: z + t + w = 0, 2z + t = 2, y + 2z + 3t + 4w = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = 3, x = −2, остальные свободны.</li><li>В варианте A минус потерян (x = −2 определяется однозначно). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — x и y определены.</li><li>E — решения есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключение переменных.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
