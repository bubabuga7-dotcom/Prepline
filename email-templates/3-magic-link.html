<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your sign-in link — Shyn</title>
</head>
<body style="margin:0;padding:0;background-color:#F4F6F9;font-family:Arial,Helvetica,sans-serif;color:#15181D;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F4F6F9;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:520px;">
          <tr>
            <td align="left" style="padding:0 0 24px 4px;">
              <span style="font-size:28px;font-weight:700;letter-spacing:-1.2px;color:#15181D;">Shyn<span style="color:#3D63A3;">.</span></span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#FFFFFF;border:1px solid #E5E9EF;border-radius:12px;padding:40px 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="font-size:22px;line-height:30px;font-weight:700;color:#15181D;padding-bottom:16px;">Sign in to Shyn</td>
                </tr>
                <tr>
                  <td style="font-size:15px;line-height:24px;color:#6B7480;padding-bottom:28px;">Your secure sign-in link is ready. Use the button below to access your Shyn account without a password.</td>
                </tr>
                <tr>
                  <td align="left" style="padding-bottom:28px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#3D63A3" style="background-color:#3D63A3;border-radius:8px;">
                          <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 26px;border-radius:8px;background-color:#3D63A3;color:#FFFFFF;font-size:14px;line-height:20px;font-weight:700;text-decoration:none;">Sign in to Shyn</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="font-size:12px;line-height:20px;color:#6B7480;padding-bottom:6px;">Or copy and paste this link into your browser:</td>
                </tr>
                <tr>
                  <td style="font-size:12px;line-height:20px;word-break:break-all;overflow-wrap:anywhere;padding-bottom:28px;">
                    <a href="{{ .ConfirmationURL }}" style="color:#3D63A3;text-decoration:underline;">{{ .ConfirmationURL }}</a>
                  </td>
                </tr>
                <tr>
                  <td style="border-top:1px solid #E5E9EF;padding-top:20px;font-size:12px;line-height:20px;color:#6B7480;">If you didn't request this, you can ignore this email.</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 12px;font-size:12px;line-height:18px;color:#6B7480;">Shyn — free NUET preparation</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
