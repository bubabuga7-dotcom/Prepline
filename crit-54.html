<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q30 · Problem solving</p>", "image": "images/ct-pp/ct075_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Идём от конца: сначала узнаём, когда Джойс должна начать работу, потом — на какой автобус успеть, учитывая <b>худший</b> случай по времени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автобус домой в 13:45, до остановки 5 мин → из магазина выйти в <b>13:40</b>.</li><li>Работает 4 часа → начать не позже <b>9:40</b>.</li><li>Автобусы из дома — в :00 и :30. Автобус 9:00 в худшем случае едет 30 мин → 9:30, плюс 5 мин пешком → 9:35 ✓.</li><li>Автобус 9:30 в худшем случае приедет в 10:00 — уже поздно ✗.</li><li>Значит, нужен автобус в 9:00, а до остановки идти до 5 мин → выйти из дома в <b>08:55</b>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li><span class=\"fr\"><span>A</span><span>B</span></span> (08:25, 08:30) — слишком рано, это не «самое позднее».</li><li>D (09:00) — забыли про 5 минут до остановки.</li><li>E (09:25) — расчёт на лучший случай (20 мин в пути) и автобус 9:30.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах «самое позднее/успеть точно» всегда берите <b>худший</b> вариант для каждой задержки.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct075_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена билета зависит от того, сколько билетов уже продано. Найдём все возможные суммы за 10 билетов в субботу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Субботние цены: $20 (первые 200), $30 (следующие 300), $35 (остальные).</li><li>Если покупка попадает на стык $20/$30: сумма = 20a + 30b при a+b = 10 → от $200 до $300 <b>шагом $10</b>.</li><li>Если на стык $30/$35: сумма от $300 до $350 <b>шагом $5</b>.</li><li>$275 — меньше 300, но не кратно 10 → невозможна.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A ($250) — 5 по $20 и 5 по $30.</li><li>C ($300) — все 10 по $30.</li><li>D ($325) — 5 по $30 и 5 по $35.</li><li>E ($350) — все 10 по $35.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебирайте «стыки» ценовых зон — суммы на одном стыке идут шагом, равным разнице цен.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct075_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно 14 кусков по 12 см и 14 по 7 см; склеивать нельзя. Ищем самый дешёвый набор лент без лишних отходов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цена за сантиметр: 30 см — 13,3p, 50 см и 60 см — по 10p. Выгоднее длинные ленты.</li><li>Нижняя граница: всего нужно 14 × 12 + 14 × 7 = 266 см → минимум 266 × 10p = £26,60, значит, не меньше £27.</li><li>Набор на £27: 2 × 60 см (по 5 кусков 12 см) = 10 кусков; 1 × 50 см (4 куска 12 см) → всего 14 больших.</li><li>Ещё 2 × 50 см по 7 кусков 7 см (49 см) = 14 маленьких.</li><li>Итого 2 × £6 + 3 × £5 = <b>£27</b> — равно нижней границе, дешевле нельзя.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (£26) — меньше теоретического минимума £26,60.</li><li>C–E — возможны, но дороже найденного набора.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала посчитайте нижнюю границу (общая длина × лучшая цена за см) — она отсекает слишком дешёвые варианты и подтверждает оптимум.</div></div>"}, {"id": 4, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q33 · Main conclusion</p>", "image": "images/ct-pp/ct075_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем утверждение, ради которого написан весь текст. Ключевая фраза: «But it is now time to call a halt».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Начало (прорывы медицины) — фон.</li><li>«Пора остановиться» — главный вывод.</li><li>Дальше идут причины: дорого, обанкротит страну, продление угасания приносит вред.</li><li>Значит, вывод: работу над новыми методами лечения нужно прекратить.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это вводная часть, а не вывод.</li><li>C, D, E — причины, которые подкрепляют вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слова «But», «now», «therefore» часто стоят прямо перед главным выводом.</div></div>"}, {"id": 5, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q34 · Flaw</p>", "image": "images/ct-pp/ct075_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: соцсети не издатели → значит, ни за что не отвечают. Проверяем, следует ли это.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Издатели отвечают за контент.</li><li>Соцсети — не издатели.</li><li>Вывод «они не отвечают за контент» — скачок: из того, что они не входят в одну группу, не следует, что у них нет <b>никаких</b> подобных обязанностей.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — текст не утверждает, что правительство добьётся успеха.</li><li>C — о будущем в тексте речи нет.</li><li>D — ответственность издателей автор не оспаривает.</li><li>E — текст не говорит, что Facebook не относится серьёзно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «X не принадлежит к группе A, значит, у X нет свойств A» — классическая ошибка.</div></div>"}, {"id": 6, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q35 · Parallel reasoning</p>", "image": "images/ct-pp/ct075_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Структура: две причины бедности; первая исключена → значит, вторая.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бедные либо не считают богатство важным, либо им не повезло.</li><li>Джейн ценит материальное → первая причина отпадает.</li><li>Значит, ей не повезло.</li><li>Ищем ту же схему «А или Б; не А → Б».</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «каждый может разбогатеть трудом» — одна причина, другая схема.</li><li>B — перечисляет способы и делает вывод по их отсутствию.</li><li>C — «сладко только с сахаром или мёдом; нет их → не сладко».</li><li>E — «нужна удача; не выиграл → не везло» — другая логика.</li><li>D — «две дороги; не по горе → по лесу» ✓ — та же схема.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах на параллельное рассуждение запишите схему буквами и сравнивайте только её, а не тему.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q36 · Problem solving</p>", "image": "images/ct-pp/ct075_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем отдельно кирпичи бордюра и плиты внутри, через площади.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Весь двор: 12,5 × 10,5 = 131,25 м².</li><li>Внутри бордюра 25 см: (12,5−0,5) × (10,5−0,5) = 12 × 10 = 120 м².</li><li>Бордюр: 131,25 − 120 = 11,25 м²; кирпич 0,25×0,25 = 0,0625 м² → 180 кирпичей.</li><li>Плиты: 120 ÷ (0,3×0,2 = 0,06) = 2000.</li><li>Всего 2180.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2000) — только плиты.</li><li>C, D, E — ошибки в размерах бордюра (например, вычли 25 см только с одной стороны).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Бордюр уменьшает внутренний размер на ширину с <b>обеих</b> сторон.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q37 · Problem solving</p>", "image": "images/ct-pp/ct075_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение по таблице; ищем ложное.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Fresh fruit: 10, 15, 15, 20, 25, 30, 35%.</li><li>Marmalade (porridge, toast & marmalade): 5, 10, 15, 20, 25, 30, 35%.</li><li>В 2006 и 2007 значения разные → утверждение D неверно.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — toast & jam всегда 5%, больше не было ✓.</li><li>B — 2012: porridge 35% > eggs 10% + 15% = 25% ✓.</li><li>C — porridge + cereals: 40, 50, 60, 70 — по +10 ✓.</li><li>E — блюда с тостом: 20, 25, 35, 40, 45, 50, 55 — растут ✓.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При вопросе «что НЕ верно» проверяйте все варианты — легко ошибиться на первом «похожем».</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q38 · Problem solving</p>", "image": "images/ct-pp/ct075_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Оцениваем исходные доли по круговой диаграмме и пересчитываем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Было примерно: банан 70%, апельсин 20%, яблоко 10%.</li><li>Банан +10% от себя: 70 × 1,1 = 77%.</li><li>Апельсин −10%: 20 × 0,9 = 18%.</li><li>Яблоко = 100 − 77 − 18 = 5% — вдвое меньше.</li><li>Диаграмма B: банан больше, апельсин чуть меньше, яблоко совсем маленькое.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — яблока почти нет (слишком мало).</li><li>C, D — банан уменьшился.</li><li>E — апельсин уменьшился слишком сильно, яблоко не изменилось.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «На 10% больше» — от исходной величины, а не +10 процентных пунктов.</div></div>"}, {"id": 10, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q39 · Principle</p>", "image": "images/ct-pp/ct075_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Принцип: у привилегированных больше ответственности, поэтому их проступок заслуживает более сурового отношения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Капитан или судья получает двойное наказание — и это справедливо.</li><li>Причина: «с наградами приходит ответственность» — вести себя лучше обычных людей.</li><li>B: начальник полиции, взявший взятку, виноват больше, чем тот, кто её дал, — та же идея.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «без исключений» — наоборот, равное отношение.</li><li>C — о ролевых моделях, а не о более строгом спросе.</li><li>D — против выборочной строгости.</li><li>E — смягчение для бедных — о другом.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип должен работать в обе стороны: высокий статус → выше спрос.</div></div>"}, {"id": 11, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q40 · Flaw</p>", "image": "images/ct-pp/ct075_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из «все известные сознательные существа биологические» сделан вывод «только биологические могут быть сознательными».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мы знаем сознание только у живых существ.</li><li>Автор делает вывод: машины <b>никогда</b> не будут сознательными.</li><li>Но «пока не видели» ≠ «невозможно».</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — речь не обо всех природных объектах.</li><li>C — автор как раз признаёт, что сознание загадочно.</li><li>D — скорость развития техники не главная проблема.</li><li>E — растения не меняют логическую ошибку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Все известные X — Y, значит, только Y могут быть X» — частая логическая ошибка.</div></div>"}, {"id": 12, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q41 · Main conclusion</p>", "image": "images/ct-pp/ct075_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — утверждение, которое поддерживают все остальные.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>«Some readers think there is nothing to learn» — мнение, против которого спорят.</li><li>«Historical novels can thus enrich our understanding» — вывод (слово thus).</li><li>Дальше — причины: в истории пробелы, писатель их заполняет.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — причины/факты о пробелах в истории.</li><li>D — чужое мнение, которое оспаривается.</li><li>E — поддерживающая мысль.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слово «<span class=\"fr\"><span>thus</span><span>therefore</span></span>» внутри текста часто указывает на вывод, даже если он не в конце.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q42 · Problem solving</p>", "image": "images/ct-pp/ct075_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перебираем все суммы из трёх (или меньше) мест: 12, 8, 5, 3, 1, 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Одно-три выступления, каждое 0, 1, 3, 5, 8 или 12 очков.</li><li>Проверяем подряд: 22 = 12+5+5, 23 = 12+8+3, 24 = 12+12, 25 = 12+12+1.</li><li>26: нужно 12+12+2 (нет 2), 12+8+6 (нет 6), 8+8+10 (нет)… — невозможно.</li><li>Наименьшее недостижимое — 26.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (22) = 12 + 5 + 5.</li><li>C, D, E (30, 33, 37) — тоже недостижимы, но больше 26.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Наименьшее невозможное» — проверяйте числа по порядку снизу, а не только варианты ответа.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q43 · Problem solving</p>", "image": "images/ct-pp/ct075_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рост больше чем на 100% означает: новая цена <b>больше чем вдвое</b> выше рекомендованной.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Moshling 18,99 → 198,98 ✓.</li><li>LeapPad 79,99 → 225 ✓.</li><li>Doggie Doo 24,99 → 50,00 (> 49,98) ✓.</li><li>Fireman Sam 29,99 → 59,99 (> 59,98) ✓.</li><li>Sylvanian 79,95 → 192,29 ✓.</li><li>Monster High 59,98 = ровно 2×29,99 — не больше ✗; Lego 265,98 = ровно 2×132,99 ✗.</li><li>Итого 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — пропустили Doggie <span class=\"fr\"><span>Doo</span><span>Fireman</span></span> Sam (рост чуть больше 100%).</li><li>D, E — посчитали «ровно вдвое» как «больше чем на 100%».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строго «больше 100%» — значения ровно ×2 не считаются.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q44 · Problem solving</p>", "image": "images/ct-pp/ct075_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена одного телевизора = доход ÷ число проданных. Ищем месяц, когда отношение резко выросло.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Продано (по клеткам): янв 2,5; фев 4; мар 2; апр 3,5; май 4,5; июн 3,5.</li><li>Доход: янв 1,8; фев 2,8; мар 1,4; апр 3,6; май 4,4; июн 3,6.</li><li>Отношение: янв–мар ≈ 0,7, апр–июн ≈ 1,0.</li><li>Цена выросла с начала апреля.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — в феврале и марте отношение то же, что в январе.</li><li>D, E — к маю/июню цена уже выросла (рост начался раньше).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте не столбики по отдельности, а их <b>отношение</b>.</div></div>"}, {"id": 16, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q45 · Drawing a conclusion</p>", "image": "images/ct-pp/ct075_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем вывод, который точно следует из текста и не выходит за его рамки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В Великобритании больше всего опросов на человека.</li><li>Из-за усталости люди отказываются отвечать.</li><li>Это привело к неверным прогнозам.</li><li>Значит, больше опросов — не обязательно точнее.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сравнения точности с другими странами нет.</li><li>B — «невозможно предсказать» — слишком сильно.</li><li>C — «главная причина» — текст говорит лишь «способствовала».</li><li>E — отказ от анкет текст не предлагает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Остерегайтесь слишком сильных слов: «impossible», «main», «always».</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q46 · Problem solving</p>", "image": "images/ct-pp/ct075_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем, на сколько дней хватит коробки до и после изменения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Старая доза: 300 ÷ 6 = 50 дней.</li><li>Новая неделя: 2 × 6 + 5 × 4 = 32 таблетки.</li><li>9 недель = 288 таблеток → 63 дня, осталось 12.</li><li>Чтобы дней было максимум, остаток тратим по 4 в день → ещё 3 дня → 66.</li><li>Разница: 66 − 50 = 16 дней.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — забыли остаток 12 таблеток или посчитали его по 6 в день.</li><li>D, E — считали, что все дни по 4 таблетки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Максимум» — значит выбираем такой порядок дней, при котором остаток растягивается дольше.</div></div>"}, {"id": 18, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q47 · Assumption</p>", "image": "images/ct-pp/ct075_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно найти скрытую посылку: почему именно государственный надзор лучше саморегулирования?</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор против самоконтроля охранных компаний.</li><li>Он требует надзора «беспристрастного, надёжного источника» — государственного агентства.</li><li>Значит, он предполагает, что сотрудники агентства менее склонны к нечестности, чем частные компании.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — рост отрасли не нужен для аргумента.</li><li>B — «в любой отрасли» — слишком широко, автор говорит об охране.</li><li>C — экономичность текущей системы не важна для вывода.</li><li>D — плохая репутация компаний не упоминается и не требуется.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предположение — то, без чего вывод рушится. Проверка: поставьте «не» перед вариантом — развалится ли аргумент?</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q48 · Problem solving</p>", "image": "images/ct-pp/ct075_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем назад от фильма: когда нужно быть в Exbay, на какой поезд успеть, когда выйти.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Фильм 19:20, можно пропустить 5 мин → быть в кино до 19:25.</li><li>От станции 5 мин → поезд должен прибыть в Exbay до 19:20.</li><li>Прибытия в Exbay: 8:02 + 40 мин × k → …18:42, 19:22. Подходит 18:42.</li><li>Этот поезд уходит из Beetown в 18:05.</li><li>Идти 14 мин → выйти в 17:51.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (17:36) — на поезд раньше, не «самое позднее».</li><li>C (18:05) — забыли про 14 мин ходьбы.</li><li>D, E — рассчитаны на поезд, прибывающий в 19:22 (опоздание).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Расписание «каждые 40 минут» — выпишите несколько времён подряд, чтобы не ошибиться.</div></div>"}, {"id": 20, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q49 · Principle</p>", "image": "images/ct-pp/ct075_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Принцип: «естественное» не значит «правильное» или «желательное».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Болезни, засухи, гнев — естественны, но не должны поощряться.</li><li>A: склонность к конкуренции естественна, но это не значит, что её нужно поощрять в школе — тот же принцип.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — о разнице между верой и поведением.</li><li>C — о законах разных стран.</li><li>D — о смысле жизни.</li><li>E — о доверии.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите вариант, где ту же логику применяют к новой ситуации.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2020 · original Q50 · Problem solving</p>", "image": "images/ct-pp/ct075_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем долю золота у каждой команды и сравниваем с формой графиков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Amber <span class=\"fr\"><span>8</span><span>21</span></span> ≈ 38%.</li><li>Emerald <span class=\"fr\"><span>5</span><span>21</span></span> ≈ 24% — самая низкая.</li><li>Garnet <span class=\"fr\"><span>6</span><span>22</span></span> ≈ 27%.</li><li>Jade <span class=\"fr\"><span>6</span><span>16</span></span> ≈ 38%.</li><li>Sapphire <span class=\"fr\"><span>11</span><span>28</span></span> ≈ 39% — чуть выше.</li><li>График D: Amber ≈ Jade ≈ Sapphire высокие, Emerald ниже всех, Garnet чуть выше Emerald.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — Garnet ниже Emerald.</li><li>B, C — показано число золотых медалей, а не доля.</li><li>E — Emerald слишком низко относительно Garnet.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Доля» = золото ÷ <b>все</b> медали команды.</div></div>"}, {"id": 22, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q1 · Main conclusion</p>", "image": "images/ct-pp/ct075_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем главный вывод: что автор советует, исходя из всего сказанного.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Каверзные вопросы ничего не говорят о кандидате.</li><li>Их задают нарциссичные интервьюеры.</li><li>Никто не хочет работать на таких людей.</li><li>Поэтому кандидатам стоит подумать, хотят ли они работать в такой компании.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — факт из начала текста.</li><li>B, C, E — причины, поддерживающие вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Совет «should / well-advised to» часто и есть главный вывод.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q2 · Problem solving</p>", "image": "images/ct-pp/ct075_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лампы мигают вместе каждые НОК(5, 8, 12) секунд.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОК(5, 8, 12) = 120 с.</li><li>45 минут = 2700 с.</li><li>2700 ÷ 120 = 22,5 → 22 раза.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (5) — посчитано в минутах некорректно.</li><li>C (45) — по разу в минуту.</li><li>D, E — использовали произведение или НОК неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Следующие 45 минут» — момент «только что» не считается.</div></div>"}, {"id": 24, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q3 · Flaw</p>", "image": "images/ct-pp/ct075_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент отвергает план из-за проблем с компостируемыми пакетами. Чего не хватает?</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пластик тоже вреден, а план экономит 500 тонн в год.</li><li>Автор говорит лишь, что у новых пакетов «есть проблемы».</li><li>Не показано, что они хуже, чем проблемы пластика.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — польза экономии пластика не оспаривается.</li><li>B — сравнение альтернатив не главное.</li><li>C — о применимости пакетов речи нет.</li><li>E — польза от отказа от пластика описана в тексте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «У нового варианта есть минусы» не доказывает, что он хуже старого — нужно сравнение.</div></div>"}, {"id": 25, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q4 · Principle</p>", "image": "images/ct-pp/ct075_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Принцип: если человек добровольно согласился, он не пострадал несправедливо.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Работник, принявший работу, не эксплуатируется работодателем.</li><li>B: пациент дал информированное согласие на испытание — не может жаловаться на заявленные побочные эффекты. Та же логика.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — похищение не входило в согласие.</li><li>C — увольнение за нарушение контракта — другая логика.</li><li>D — мошенничество — человек не соглашался быть обманутым.</li><li>E — противоположный принцип.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Важно согласие именно на то, что произошло.</div></div>"}, {"id": 26, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q5 · Drawing a conclusion</p>", "image": "images/ct-pp/ct075_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем вывод, который безопасно следует из примеров.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Министры извиняются за то, чего не делали.</li><li>«Извините, если кого-то обидел» перекладывает вину.</li><li>Дети извиняются по принуждению.</li><li>Ни одно не выражает искреннего раскаяния → некоторые «извинения» не настоящие.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — нормативные выводы, которых нет в тексте.</li><li>B — о непрерывности правительства — не сказано.</li><li>E — о прощении в тексте нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод должен объединять все примеры текста.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct075_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шифр Цезаря — сдвиг всех букв на одно и то же число.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая буква шифра J, а должна быть X.</li><li>Сдвиг: от X (24) до J (10 + 26 = 36) — 12 позиций.</li><li>Шестая буква шифра: E (5). Сдвигаем назад на 12: 5 − 12 = −7 → 19 = S.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — ошибки на ±1–2 при подсчёте сдвига.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пишите алфавит с номерами — так меньше шанс ошибиться в счёте.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct075_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перечисляем требования и проверяем каждую маску.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужны детские и взрослые размеры.</li><li>Город и лес (urban + rural).</li><li>Пыль и пыльца — у жены астма от пыльцы.</li><li>Гипоаллергенная — у сына аллергия.</li><li>Air-1 ✗ город; GXi ✗ детский; Optiair ✗ гипоаллергенность; Speed ✗ детский.</li><li>Breathe — всё ✓.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Каждая из остальных не проходит хотя бы по одному требованию (см. шаг 5).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Холод (cold environment) здесь не требуется — не отбрасывайте маску из-за лишнего критерия.</div></div>"}, {"id": 29, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct075_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сообщение — это 12 подряд идущих бит, которые есть в обеих передачах.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проверяем каждый вариант в первой строке.</li><li>Затем во второй.</li><li>Только 101110010100 есть и там, и там.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — есть только в первой передаче.</li><li>B, E — только во второй.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с варианта, который легче найти (редкая комбинация, например «111»).</div></div>"}, {"id": 30, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2021 · original Q9 · Main conclusion</p>", "image": "images/ct-pp/ct075_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — что нужно сделать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Число студентов-заочников упало на 50%.</li><li>«More needs to be done to provide support…» — вывод.</li><li>Опрос (гибкость 44%, деньги 59%) — доказательства.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — факты в начале.</li><li>D, E — данные опроса, которые поддерживают вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация («needs to be done», «should») — частый главный вывод.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
