<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 2, "text": "", "image": "images/math-new/m041_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Множитель (x − a) подходит, если при x = a выражение равно 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 1: 6 + 7 − 18 + 5 = 0.</li><li>Значит, x − 1 — множитель.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: x = −1 даёт 24, а не 0.</li><li>E: x = 2 даёт 45.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставляйте число с противоположным знаком.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m041_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь трапеции = полусумма оснований × высота.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(18x + 10x) : 2 = 14x.</li><li>14x · 3x = 42x².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — забыли поделить на 2.</li><li>C — поделили лишний раз.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Боковая сторона L не нужна.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m041_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все 60 таблеток делятся на непересекающиеся группы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 + 7 + 11 + 6 + 3x = 60, 3x = 24, x = 8.</li><li>С витамином A: только A (12) + A и B (8) + A и C (8) + все три (6) = 34.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли «все три».</li><li>E — лишняя группа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуйте три круга и впишите числа.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m041_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лист = дно + 4 стенки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Объём: x · x · y = 40, значит y = <span class=\"fr\"><span>40</span><span>x²</span></span>.</li><li>Дно: x². Стенки: 4 · x · y = 4x · <span class=\"fr\"><span>40</span><span>x²</span></span> = <span class=\"fr\"><span>160</span><span>x</span></span>.</li><li>S = x² + <span class=\"fr\"><span>160</span><span>x</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли сократить x.</li><li>E — 8 стенок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Крышки нет — только 5 граней.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m041_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касательная BF: BF² = FD · FE.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>FE = 18 + 14 = 32, BF² = 18 · 32 = 576, BF = 24.</li><li>В прямоугольном треугольнике OBF: OF = r + 16.</li><li>(r + 16)² = r² + 576, 32r = 320, r = 10.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — половина радиуса.</li><li>C — диаметр.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус в точке касания перпендикулярен касательной.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m041_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">DE параллельна BC, поэтому ∠ACB = ∠AED.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠ACB = 50°.</li><li>∠BCD = 50° − 30° = 20°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — это ∠DCE.</li><li>E — весь ∠ACB.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соответственные углы при параллельных равны.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m041_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем корни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4√12 = 8√3; 12√108 = 72√3; 10√128 = 80√2; 8√50 = 40√2.</li><li>(80√3 − 120√2) : 10 = 8√3 − 12√2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — не поделили на 10.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √108 = 6√3, √128 = 8√2.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m041_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем на (√3 + √2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Знаменатель: 3 − 2 = 1.</li><li>3√2(√3 + √2) = 3√6 + 6.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знак.</li><li>E — потеряли 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a − b)(a + b) = a² − b².</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m041_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадрат и 4 полукруга радиусом <span class=\"fr\"><span>a</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 полукруга = 2 круга: 2 · π · <span class=\"fr\"><span>a²</span><span>4</span></span> = <span class=\"fr\"><span>πa²</span><span>2</span></span>.</li><li>Итого a² + <span class=\"fr\"><span>πa²</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — посчитали один круг.</li><li>D, E — без квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диаметр полукруга равен стороне.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m041_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Число машин пропорционально углу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Жёлтых: <span class=\"fr\"><span>50</span><span>360</span></span> · 180 = 25.</li><li>Чёрных столько же: 25.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 180 машин на 360° — по 2° на машину.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m041_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приравниваем: одна точка пересечения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + bx + 4 = 3x + 4, x² + (b − 3)x = 0.</li><li>Корни 0 и 3 − b. Совпадают при b = 3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один корень — когда дискриминант равен 0.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m041_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Спортом занимаются 50 − 15 = 35.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Оба вида: 25 + 25 − 35 = 15.</li><li><span class=\"fr\"><span>15</span><span>50</span></span> = <span class=\"fr\"><span>3</span><span>10</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Общих считаем один раз.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m041_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 ♦ 2 = √16 = 4.</li><li>4 ♦ 9 = √36 = 6.</li><li>4 ♦ 6 = √24 = 2√6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — √48.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √24 = √(4 · 6).</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m041_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выбор мальчиков и девочек независим — перемножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мальчики: 10 · 9 : 2 = 45.</li><li>Девочки: 7 · 6 · 5 : 6 = 35.</li><li>45 · 35 = 1575.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — переставлены цифры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок выбора не важен.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m041_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Половина — брусок 3 × 3 × 1,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 9 + 4 · 4,5 = 36.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — половина поверхности куба без новой грани.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разрез добавляет грань.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m041_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ребро = ³√216 = 6. «Периметр» куба — сумма 12 рёбер.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 · 6 = 72 см.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — одно ребро.</li><li>B — 4 ребра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У куба 12 рёбер.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m041_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сейчас Рону 7k, Гермионе 4k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>7k − 10 = 2(4k − 10), k = 10.</li><li>70 + 40 = 110.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 10 лет назад вычитаем у обоих.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m041_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Крыша — равнобедренный прямоугольный треугольник с гипотенузой 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Катет: 10 : √2 = 5√2, два катета: 10√2.</li><li>Периметр: 10 + 8 + 8 + 10√2 = 26 + 10√2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — один катет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Верхняя сторона прямоугольника внутри — не считается.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m041_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мать M, Алекс A.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>M − 5 = 3(A − 5), M + 5 = 2(A + 5).</li><li>3A − 10 = 2A + 5, A = 15, M = 35.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 30 = 3 · 10; 40 = 2 · 20.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m041_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пусть n учеников ниже 60.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>50n + 75(20 − n) = 70 · 20.</li><li>1500 − 25n = 1400, n = 4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — это остальные 16.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средние — через суммы.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m041_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Убираем дробь и собираем x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y(2x + 1) = 4x − 3.</li><li>2xy − 4x = −3 − y.</li><li>x = <span class=\"fr\"><span>y + 3</span><span>4 − 2y</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак у 3.</li><li>E — знак в знаменателе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Все x — в одну сторону.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m041_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коробки независимы — перемножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2</span><span>5</span></span> · <span class=\"fr\"><span>3</span><span>8</span></span> = <span class=\"fr\"><span>6</span><span>40</span></span> = <span class=\"fr\"><span>3</span><span>20</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — <span class=\"fr\"><span>3</span><span>40</span></span> (поделили лишний раз).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Красный из первой: 2 из 5.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m041_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Совпадают каждые НОК = 180 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3600 : 180 = 20.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-5.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m041_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Радиус 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цилиндр: π · 25 · 10 = 250π.</li><li>Шар: <span class=\"fr\"><span>4</span><span>3</span></span> · π · 125 = <span class=\"fr\"><span>500π</span><span>3</span></span>.</li><li>250 : <span class=\"fr\"><span>500</span><span>3</span></span> = 3 : 2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шар — <span class=\"fr\"><span>2</span><span>3</span></span> цилиндра.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m041_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Убираем корень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(y − 1)² = <span class=\"fr\"><span>x + 3</span><span>x</span></span> = 1 + <span class=\"fr\"><span>3</span><span>x</span></span>.</li><li><span class=\"fr\"><span>3</span><span>x</span></span> = y² − 2y = y(y − 2).</li><li>x = <span class=\"fr\"><span>3</span><span>y(y − 2)</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли вычесть 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбейте <span class=\"fr\"><span>x + 3</span><span>x</span></span> на 1 + <span class=\"fr\"><span>3</span><span>x</span></span>.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m041_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вместе — через НОК(40, 42).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОК = 840 с = 14 мин.</li><li>10:14.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — удвоенный.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-6.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m041_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОД всегда делит НОК. 2520 = 2³ · 3² · 5 · 7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>49 = 7², а в 2520 только одна семёрка.</li><li>49 не делит 2520 — не может быть НОД.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные делят 2520.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте деление: 2520 : 49 не целое.</div></div>"}, {"id": 31, "topic": "M4.17", "text": "<p>Solve \\(5x - 3 \\lt 12\\).</p>", "image": "", "options": ["\\(x \\le 3\\)", "\\(x < -3\\)", "\\(x < 3\\)", "\\(x > 3\\)", "\\(x < 1.8\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решайте как уравнение, но при делении на отрицательное меняйте знак.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5x < 15.</li><li>x < 3. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неравенство строгое.</li><li>D — знак неравенства меняется только при делении на отрицательное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на минус переворачивает знак.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.9", "text": "<p>Write 0.\\(\\dot{4}\\dot{5}\\) as a fraction in its simplest form.</p>", "image": "", "options": ["\\(\\dfrac{5}{111}\\)", "\\(\\dfrac{9}{20}\\)", "\\(\\dfrac{5}{11}\\)", "\\(\\dfrac{1}{2}\\)", "\\(\\dfrac{5}{9}\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножьте на 10ⁿ (n — длина периода) и вычтите.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 0,4545…, 100x = 45,4545…</li><li>99x = 45 → x = <span class=\"fr\"><span>5</span><span>11</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — три девятки — для периода из трёх цифр.</li><li>B — это 0,45 без повторения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период из k цифр → знаменатель из k девяток.</div></div>", "src": "PL"}, {"id": 33, "topic": "M4.4", "text": "<p>Factorise fully \\(14x^2y - 21xy^2\\).</p>", "image": "", "options": ["\\(xy(14x - 21y)\\)", "\\(7x(2xy - 3y^2)\\)", "\\(7xy(2x - 3y)\\)", "\\(7xy(3x - 2y)\\)", "\\(7xy(2x + 3y)\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий множитель: НОД чисел и наименьшие степени букв.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОД(14, 21) = 7, общие буквы xy. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не вынесли число.</li><li>B — вынесли не всё: y тоже общий.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Fully» — выносите всё общее.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
