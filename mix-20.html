<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>The symbol ◇ defines a mathematical binary operation such that \\(y ◇ x = \\frac{y^x}{x}\\) for all positive integers.</p><p>What is the value of \\((2 ◇ 3) ◇ 2\\)?</p>", "image": "", "options": ["\\(2 \\times 3^3\\)", "\\(8/3\\)", "\\(32/9\\)", "\\(4\\)", "\\(2^5 \\sqrt{2}/9\\)"], "correct": 2, "verified": true, "src": "M18", "orig": "images/q-65df14023f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выполняем операцию по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2◇3 = <span class=\"fr\"><span>2³</span><span>3</span></span> = <span class=\"fr\"><span>8</span><span>3</span></span>.</li><li><span class=\"fr\"><span>8</span><span>3</span></span>◇2 = <span class=\"fr\"><span>8</span><span>3</span></span>²/2 = <span class=\"fr\"><span><span class=\"fr\"><span>64</span><span>9</span></span></span><span>2</span></span> = <span class=\"fr\"><span>32</span><span>9</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B <span class=\"fr\"><span>8</span><span>3</span></span> — только первый шаг.</li><li>D (4) — неверное возведение.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y◇x = yˣ/x — порядок аргументов важен.</div></div>", "topic": "M4.3"}, {"id": 2, "text": "<p>The mean time for running a race by a group of 20 people was 54 seconds. The times for a second group of people were added and the value of the mean went up to 56 seconds.</p><p>Which formula represents the relationship between the number of people in the second group, \\(P\\), and the mean time of the second group, \\(T\\)?</p>", "image": "", "options": ["\\(P = \\dfrac{40}{T - 54}\\)", "\\(P = \\dfrac{1080}{T - 54}\\)", "\\(P = \\dfrac{40}{T - 56}\\)", "\\(P = \\dfrac{1080}{T - 56}\\)", "\\(P = \\dfrac{1120}{T} - 20\\)"], "correct": 2, "verified": true, "src": "M18", "orig": "images/q-320c6ce9da.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через суммы времён.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>20 · 54 + PT = 56(20 + P).</li><li>1080 + PT = 1120 + 56P.</li><li>P(T − 56) = 40 → P = <span class=\"fr\"><span>40</span><span>T − 56</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли 54 вместо 56.</li><li>B, D — 1080 вместо 40.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Новое среднее (56) — в знаменателе.</div></div>", "topic": "M2.2"}, {"id": 3, "text": "<p>Simplify:</p><p>\\(\\left(\\dfrac{2x^{\\frac{3}{2}}y^3}{\\sqrt{z}}\\right)^2\\)</p>", "image": "", "options": ["\\(\\dfrac{4x^6y^5}{z^2}\\)", "\\(\\dfrac{4x^3y^6}{z}\\)", "\\(\\dfrac{4x^3y^5}{z}\\)", "\\(\\dfrac{4x^{\\frac{5}{2}}y^5}{z}\\)", "\\(\\dfrac{4x^{\\frac{5}{2}}y^5}{z^2}\\)"], "correct": 1, "verified": true, "src": "M18", "orig": "images/q-af06d8262c.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат каждый множитель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4; x³; y⁶; z.</li><li><span class=\"fr\"><span>4x³y⁶</span><span>z</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — y⁵.</li><li>A — x⁶, z².</li><li>D, E — неверные показатели.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (aᵐ)² = a<sup>2m</sup>.</div></div>", "topic": "M4.2"}, {"id": 4, "text": "<p>In statistics, Spearman's rank correlation coefficient is given by the formula:</p><p>\\(r = 1 - \\dfrac{6\\sum d^2}{n(n^2 - 1)}\\)</p><p>Rearrange the formula to make \\(\\sum d^2\\) the subject.</p>", "image": "", "options": ["\\(\\sum d^2 = 1 - \\dfrac{r(n^3 - n)}{6}\\)", "\\(\\sum d^2 = \\left(\\dfrac{(1-r)(n^3 - n)}{6}\\right)^2\\)", "\\(\\sum d^2 = \\dfrac{(1-r)(n^3 - 1)}{6}\\)", "\\(\\sum d^2 = \\dfrac{(1+r)(n^3 - n)}{6}\\)", "\\(\\sum d^2 = \\dfrac{(1-r)(n^3 - n)}{6}\\)"], "correct": 4, "verified": true, "src": "M18", "orig": "images/q-2090ba1a07.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем дробь со Σd².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6Σ<span class=\"fr\"><span>d²</span><span>n(n² − 1)</span></span> = 1 − r.</li><li>Σd² = (1 − r)<span class=\"fr\"><span>n³ − n</span><span>6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неверный перенос.</li><li>B — лишний квадрат.</li><li>C — n³ − 1.</li><li>D — знак r.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> n(n² − 1) = n³ − n.</div></div>", "topic": "M4.7"}, {"id": 5, "text": "<p>Evaluate:</p><p>\\(\\sqrt[3]{\\dfrac{2\\times10^5}{(5\\times10^{-3})^2}} - \\sqrt{(4\\times10^3)-(4\\times10^2)}\\)</p>", "image": "", "options": ["-6.2", "160 - 20\\(\\sqrt{5}\\)", "140", "240 - 20\\(\\sqrt{5}\\)", "1940"], "correct": 4, "verified": true, "src": "M18", "orig": "images/q-39130ba664.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем по частям со степенями 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(5 · 10⁻³)² = 2,5 · 10⁻⁵.</li><li>2 · 10⁵ / 2,5 · 10⁻⁵ = 8 · 10⁹ → ∛ = 2000.</li><li>√3600 = 60 → 2000 − 60 = 1940.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — ошибка в степени.</li><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ∛(8 · 10⁹) = 2 · 10³.</div></div>", "topic": "M2.8"}, {"id": 6, "text": "A new sign for a local business is made of two parts, wood and metal. The metal costs 3 times as much as the wood per unit. The cost of the metal is proportional to the diameter of the sign, and the cost of the wood is proportional to the square of the diameter. If the diameter is doubled, the total cost of the materials triples. What percentage of the cost of the sign, to the nearest whole number, is metal?", "options": ["25%", "33%", "50%", "67%", "75%"], "correct": 2, "verified": true, "src": "M18", "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Металл ∝ d, дерево ∝ d².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2ad + 4bd² = 3(ad + bd²) → ad = bd².</li><li>Металл = дерево → 50%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — использовали «в 3 раза» — лишние данные.</li><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не все данные нужны.</div></div>"}, {"id": 7, "text": "<p>The mean mass of a group of N people is 75 kg.</p><p>Jim, Karen and Leroy join this group, without anyone leaving; the new mean mass is 78 kg.</p><p>The mean mass of Jim, Karen and Leroy is 90 kg.</p><p>What is the value of N?</p>", "image": "", "options": ["4", "12", "15", "30", "48", "90"], "correct": 1, "verified": true, "src": "M18", "review": true, "orig": "images/q-6a45135b1f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через суммы масс.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>75N + 270 = 78(N + 3).</li><li>75N + 270 = 78N + 234 → N = 12.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E, F — не удовлетворяют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средние → суммы.</div></div>", "topic": "M2.2"}, {"id": 8, "text": "<p>The diagram represents the circular cross-section of an artery with external diameter \\(d\\) of 1.6 cm. The thickness \\(t\\) of the artery wall is 1 mm.</p><p>What is the internal cross-sectional area of the artery (shaded in the diagram)?</p>", "image": "images/q-beb8752b14.jpg", "options": ["\\(0.36\\pi\\) mm\\(^2\\)", "\\(14\\pi\\) mm\\(^2\\)", "\\(15\\pi\\) mm\\(^2\\)", "\\(49\\pi\\) mm\\(^2\\)", "\\(225\\pi\\) mm\\(^2\\)"], "correct": 3, "verified": true, "src": "M18", "orig": "images/q-beb8752b14.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внутренний радиус = внешний − толщина стенки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d = 16 мм → R = 8 мм.</li><li>r = 8 − 1 = 7 мм.</li><li>S = 49π мм².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — диаметр 15 вместо радиуса.</li><li>B, C — неверно.</li><li>A — без перевода в мм.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переводите в одинаковые единицы.</div></div>", "topic": "M5.15"}, {"id": 9, "text": "<p>Rearrange the formula \\(\\frac{a}{b} = \\frac{c}{d} + \\frac{e}{f}\\) to make \\(f\\) the subject.</p>", "image": "", "options": ["\\(f = \\frac{bce - ade}{ac}\\)", "\\(f = \\frac{bc + be - ad}{a}\\)", "\\(f = \\frac{bde}{ad - bc}\\)", "\\(f = \\frac{bcd}{ad - be}\\)", "\\(f = \\frac{bc + be}{ad}\\)"], "correct": 2, "verified": true, "src": "M18", "orig": "images/q-4f24b50f16.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем <span class=\"fr\"><span>e</span><span>f</span></span> и переворачиваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>e</span><span>f</span></span> = <span class=\"fr\"><span>a</span><span>b</span></span> − <span class=\"fr\"><span>c</span><span>d</span></span> = <span class=\"fr\"><span>ad − bc</span><span>bd</span></span>.</li><li><span class=\"fr\"><span>f</span><span>e</span></span> = <span class=\"fr\"><span>bd</span><span>ad − bc</span></span> → f = <span class=\"fr\"><span>bde</span><span>ad − bc</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверное приведение к общему знаменателю.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перевернуть можно только всю дробь целиком.</div></div>", "topic": "M4.7"}, {"id": 10, "text": "<p>In triangle <em>PRS</em>, line <em>QT</em> is parallel to side <em>RS</em>.</p><p>\\(RS\\) = 1.5 cm</p><p>\\(TS\\) = 1.8 cm</p><p>\\(QT\\) = 0.3 cm</p><p>[diagram not to scale]</p><p>What is the length of <em>PS</em>?</p>", "image": "images/q-dfffc6eee3.jpg", "options": ["0.25 cm", "0.36 cm", "0.45 cm", "2.05 cm", "2.16 cm", "2.25 cm"], "correct": 5, "verified": true, "src": "M18", "review": true, "orig": "images/q-dfffc6eee3.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">QT ∥ RS → подобие PQT и PRS.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>0,3</span><span>1,5</span></span> = <span class=\"fr\"><span>1</span><span>5</span></span> → PT = <span class=\"fr\"><span>PS</span><span>5</span></span>.</li><li>PS − <span class=\"fr\"><span>PS</span><span>5</span></span> = 1,8 → PS = 2,25.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (0,36) — <span class=\"fr\"><span>1,8</span><span>5</span></span>.</li><li>E (2,16) — 1,8 · 1,2.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> TS = PS − PT.</div></div>", "topic": "M5.5"}, {"id": 11, "text": "<p>The diagram shows a shape made from a quarter circle of radius 6 cm and a right-angled triangle with a hypotenuse of length 9 cm.</p><p>Which of the following expressions gives the area, in square centimetres, of the shape?</p>", "image": "images/q-73f140ff85.jpg", "options": ["\\(3\\pi+9\\sqrt{5}\\)", "\\(3\\pi+9\\sqrt{13}\\)", "\\(9\\pi+9\\sqrt{5}\\)", "\\(9\\pi+9\\sqrt{13}\\)", "\\(9\\pi+18\\sqrt{5}\\)", "\\(9\\pi+27\\sqrt{5}\\)", "\\(36\\pi+9\\sqrt{5}\\)"], "correct": 2, "verified": true, "src": "M18", "review": true, "orig": "images/q-73f140ff85.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четверть круга + прямоугольный треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Четверть: ¼ · 36π = 9π.</li><li>Треугольник: катет 6, гипотенуза 9 → второй катет √45 = 3√5.</li><li>S = ½ · 6 · 3√5 = 9√5.</li><li>Итого 9π + 9√5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E, F — без ½ или неверно.</li><li>A, B — неверная четверть.</li><li>D — √13.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √45 = 3√5.</div></div>", "topic": "M5.15"}, {"id": 12, "text": "<p>All four corners of a rectangle are on the circumference of a circle.</p><p>The rectangle has a perimeter of 24 cm.</p><p>The ratio of length : width for the rectangle is 3 : 1</p><p>[diagram not to scale]</p><p>What is the area of the shaded region in cm\\(^2\\)?</p>", "image": "images/q-6611fbcbd1.jpg", "options": ["\\(\\frac{9}{4}\\pi - 27\\)", "\\(9\\pi - 27\\)", "\\(16\\pi - 32\\)", "\\(20\\pi - 32\\)", "\\(\\frac{81\\pi}{4} - 27\\)", "\\(\\frac{45\\pi}{2} - 27\\)"], "correct": 5, "verified": true, "src": "M18", "review": true, "orig": "images/q-6611fbcbd1.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ прямоугольника = диаметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(3w + w) = 24 → w = 3, длина 9, S = 27.</li><li>d² = 81 + 9 = 90 → r² = 22,5.</li><li>Круг: <span class=\"fr\"><span>45π</span><span>2</span></span> → заштриховано <span class=\"fr\"><span>45π</span><span>2</span></span> − 27.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — r² = <span class=\"fr\"><span>81</span><span>4</span></span>.</li><li>A, B — неверный радиус.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> r² = <span class=\"fr\"><span>d²</span><span>4</span></span>.</div></div>", "topic": "M5.15"}, {"id": 13, "text": "<p>The first four triangular numbers are:</p><p>1, 3, 6, 10</p><p>The difference between the first and second triangular numbers is 2.</p><p>The difference between the second and third triangular numbers is 3.</p><p>The difference between the third and fourth triangular numbers is 4.</p><p>All the triangular numbers follow this pattern.</p><p>The difference between the \\(r^{\\text{th}}\\) triangular number and the \\((r+3)^{\\text{th}}\\) triangular number is 126.</p><p>What is the value of \\(r\\)?</p>", "image": "", "options": ["39", "40", "41", "42", "43"], "correct": 1, "verified": true, "src": "M18", "orig": "images/q-46145c0268.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность треугольных чисел = сумма трёх слагаемых.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>T(r + 3) − T(r) = (r + 1) + (r + 2) + (r + 3) = 3r + 6.</li><li>3r + 6 = 126 → r = 40.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ±1, ±2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> T(k) − T(k − 1) = k.</div></div>", "topic": "M4.18"}, {"id": 14, "text": "<p>The mean mass of a sweet in a bag of 20 sweets must be greater than 10 grams but not greater than 10.5 grams.</p><p>A bag is being filled with sweets. The mean mass of the first 16 sweets is exactly 9.5 grams.</p><p>Four more sweets, each of mass \\(x\\) grams, are added to the bag to bring the mean mass of the 20 sweets into the correct range.</p><p>What is the complete range of possible values of \\(x\\)?</p>", "image": "", "options": ["\\(12 &lt; x \\leq 14.5\\)", "\\(12 &lt; x &lt; 14.5\\)", "\\(12 \\leq x &lt; 14.5\\)", "\\(10.125 &lt; x \\leq 10.725\\)", "\\(10.125 &lt; x &lt; 10.725\\)", "\\(10.125 \\leq x &lt; 10.725\\)"], "correct": 0, "verified": true, "src": "M18", "review": true, "orig": "images/q-cabdd051c5.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Строгое/нестрогое неравенство для суммы масс.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 конфет: 152 г.</li><li>200 < 152 + 4x ≤ 210 → 48 < 4x ≤ 58 → 12 < x ≤ 14,5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — неверные знаки на концах.</li><li>D, E, F — неверный расчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Greater than» — строгое; «not greater than» — ≤.</div></div>", "topic": "M4.17"}, {"id": 15, "text": "<p>Which one of the following is a simplification of \\(\\frac{x}{x-1} - \\frac{x^2+3}{x^2+2x-3}\\)?</p>", "image": "", "options": ["\\(\\frac{1}{x+1}\\)", "\\(\\frac{3}{x+3}\\)", "\\(\\frac{3(x-1)}{(x+1)(x-3)}\\)", "\\(\\frac{3(x+1)}{(x-1)(x+3)}\\)", "\\(\\frac{x^2-3}{(x-1)(x^2+2x-3)}\\)"], "correct": 1, "verified": true, "src": "M18", "orig": "images/q-5b2a959b46.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель (x − 1)(x + 3).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x(x + 3) − (x² + 3) = 3x − 3 = 3(x − 1).</li><li>Сокращаем: <span class=\"fr\"><span>3</span><span>x + 3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ошибки разложения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x² + 2x − 3 = (x − 1)(x + 3).</div></div>", "topic": "M4.6"}, {"id": 16, "text": "<p>The non-zero numbers \\(p\\) and \\(q\\) are such that \\(p + q = 3(p - q)\\)</p><p>What is the value of \\(\\dfrac{pq}{p^2 + q^2}\\)</p>", "image": "", "options": ["\\(\\dfrac{1}{3}\\)", "\\(\\dfrac{2}{5}\\)", "\\(\\dfrac{1}{2}\\)", "\\(\\dfrac{3}{5}\\)", "\\(\\dfrac{2}{3}\\)"], "correct": 1, "verified": true, "src": "M18", "orig": "images/q-7da685e213.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем p через q.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p + q = 3p − 3q → p = 2q.</li><li><span class=\"fr\"><span>pq</span><span>p² + q²</span></span> = <span class=\"fr\"><span>2q²</span><span>5q²</span></span> = <span class=\"fr\"><span>2</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное соотношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Однородные выражения → подставьте q = 1.</div></div>", "topic": "M4.6"}, {"id": 18, "text": "<p>One side of a rectangle is \\((7-\\sqrt{5})\\) cm.</p><p>The rectangle has an area of 66 cm\\(^2\\).</p><p>What is the perimeter, in cm, of the rectangle?</p>", "image": "", "options": ["\\(\\dfrac{35-5\\sqrt{5}}{2}\\)", "\\(35-5\\sqrt{5}\\)", "\\(\\dfrac{35+\\sqrt{5}}{2}\\)", "\\(35+\\sqrt{5}\\)", "\\(\\dfrac{105-15\\sqrt{5}}{2}\\)"], "correct": 3, "verified": true, "src": "M18", "orig": "images/q-4d03d9ae51.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вторая сторона = площадь / первая; убираем корень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>66</span><span>7 − √5</span></span> = 66<span class=\"fr\"><span>7 + √5</span><span>44</span></span> = <span class=\"fr\"><span>21 + 3√5</span><span>2</span></span>.</li><li>P = 2(7 − √5) + (21 + 3√5) = 35 + √5.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — забыли удвоить.</li><li>B, E — неверные знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (7 − √5)(7 + √5) = 44.</div></div>", "topic": "M2.11"}, {"id": 20, "text": "<p>Triangle PQR is equilateral with sides of length 10 cm.</p><p>P, Q, and R are points on the circumference of a circle with centre O.</p><p>Which one of the following is an expression, in centimetres, for the radius of the circle?</p>", "image": "images/q-d434a32e33.jpg", "options": ["\\(5\\cos 60°\\)", "\\(\\dfrac{5}{\\tan 60°}\\)", "\\(5\\sin 60°\\)", "\\(\\dfrac{5}{\\sin 60°}\\)", "\\(5\\tan 60°\\)"], "correct": 3, "verified": true, "src": "M18", "orig": "images/q-d434a32e33.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Радиус описанной окружности равностороннего треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Центральный угол 120°, половина 60°.</li><li>Прямоугольный треугольник: противолежащий катет 5 (половина стороны), гипотенуза r.</li><li>sin 60° = <span class=\"fr\"><span>5</span><span>r</span></span> → r = <span class=\"fr\"><span>5</span><span>sin</span></span> 60°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 5 sin 60° меньше 5.</li><li>A, B, E — неверная функция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Можно проверить: R = <span class=\"fr\"><span>a</span><span>√3</span></span> = <span class=\"fr\"><span>10</span><span>√3</span></span> = <span class=\"fr\"><span>5</span><span>sin</span></span> 60° ✓.</div></div>", "topic": "M5.18"}, {"id": 21, "text": "<p>The graphs of the following functions are drawn:</p><p>1 \\(y = 2x - 1\\)</p><p>2 \\(y = 1 - x^2\\)</p><p>3 \\(y = (1 - x)^2\\)</p><p>4 \\(y = 2 - x\\)</p><p>Which two graphs do <strong>not</strong> intersect?</p>", "image": "", "options": ["1 and 2", "1 and 3", "1 and 4", "2 and 3", "2 and 4"], "correct": 4, "verified": true, "src": "M18", "orig": "images/q-fc8f51671a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не пересекаются ⇔ уравнение без корней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 и 4: 1 − x² = 2 − x → x² − x + 1 = 0.</li><li>D = 1 − 4 < 0 → нет пересечения.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: x² + 2x − 2 = 0 — есть корни.</li><li>B: x² − 4x + 2 = 0 — есть.</li><li>C: прямые с разным наклоном пересекаются.</li><li>D: 2x² − 2x = 0 — есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пересечение → D ≥ 0.</div></div>", "topic": "M4.15"}, {"id": 23, "text": "<p>The diameter XY of a circle has length \\(d\\) cm.</p><p>O is a point on the circumference of this circle such that a new circle with centre O passes through points X and Y.</p><p>P is a point on the new circle and the arc XPY is shown in the diagram.</p><p>Which of the following is an expression for the <strong>perimeter</strong>, in cm, of the shaded region?</p>", "image": "images/q-3626677070.jpg", "options": ["\\(\\dfrac{d(2+\\pi)}{2}\\)", "\\(\\dfrac{d(2+\\sqrt{2}\\pi)}{2}\\)", "\\(\\dfrac{d(4+\\pi)}{4}\\)", "\\(\\dfrac{d(4+\\sqrt{2}\\pi)}{4}\\)", "\\(\\dfrac{d(8+\\pi)}{8}\\)", "\\(\\dfrac{d(8+\\sqrt{2}\\pi)}{8}\\)"], "correct": 3, "verified": true, "src": "M18", "review": true, "orig": "images/q-3626677070.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∠XOY = 90° (опирается на диаметр), значит, OX = <span class=\"fr\"><span>d</span><span>√2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Новая окружность радиуса <span class=\"fr\"><span>d</span><span>√2</span></span>.</li><li>Дуга XPY — четверть: ¼ · 2π · <span class=\"fr\"><span>d</span><span>√2</span></span> = <span class=\"fr\"><span>√2πd</span><span>4</span></span>.</li><li>Периметр: d + <span class=\"fr\"><span>√2πd</span><span>4</span></span> = d<span class=\"fr\"><span>4 + √2π</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — радиус <span class=\"fr\"><span>d</span><span>2</span></span>.</li><li>B, F — неверная доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол на диаметре — прямой.</div></div>", "topic": "M5.16"}, {"id": 24, "text": "<p>What is the mean of \\(\\sqrt{12}\\), \\(\\sqrt{27}\\) and \\(\\sqrt{147}\\)?</p>", "image": "", "options": ["\\(\\sqrt{27}\\)", "\\(\\sqrt{48}\\)", "\\(\\sqrt{62}\\)", "\\(\\sqrt{80}\\)", "\\(\\sqrt{186}\\)", "\\(\\sqrt{432}\\)"], "correct": 1, "verified": true, "src": "M18", "review": true, "orig": "images/q-c01213d0e4.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем корни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√12 = 2√3; √27 = 3√3; √147 = 7√3.</li><li>Сумма 12√3, среднее 4√3 = √48.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — √27.</li><li>C, D, E, F — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4√3 = √(16 · 3).</div></div>", "topic": "M2.11"}, {"id": 25, "text": "<p>Five congruent small rectangles are joined, as shown, to form one large rectangle.</p><p>[diagram not to scale]</p><p>The large rectangle is mathematically similar to each of the small rectangles.</p><p>For each small rectangle, find the ratio</p><p>length of the shorter side : length of the longer side</p>", "image": "images/q-aa8749da3f.jpg", "options": ["\\(1 : \\sqrt{5}\\)", "\\(1 : 2\\sqrt{5}\\)", "\\(1 : 2.5\\)", "\\(1 : 5\\)", "\\(1 : 10\\)"], "correct": 0, "verified": true, "src": "M18", "orig": "images/q-aa8749da3f.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Большой прямоугольник подобен малому.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Большой: 5w × l.</li><li><span class=\"fr\"><span>w</span><span>l</span></span> = <span class=\"fr\"><span>l</span><span>5w</span></span> → l² = 5w² → w : l = 1 : √5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 1 : 5 (без корня).</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подобие — равенство отношений сторон.</div></div>", "topic": "M5.5"}, {"id": 26, "text": "<p>The line with equation \\(y = -2x + 1\\) is reflected in the line with equation \\(x = 2\\)</p><p>Which of the following is the equation of the new line?</p>", "image": "", "options": ["\\(y = -\\dfrac{1}{2}x - 2\\)", "\\(y = -\\dfrac{1}{2}x + 1\\)", "\\(y = -\\dfrac{1}{2}x + \\dfrac{7}{4}\\)", "\\(y = -\\dfrac{1}{2}x + 3\\)", "\\(y = 2x - 7\\)"], "correct": 4, "verified": true, "src": "M18", "orig": "images/q-1b09aa76e8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отражение в x = 2: x → 4 − x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = −2(4 − x) + 1 = 2x − 7.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — перпендикулярные наклоны (−½) — путаница.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отражение в вертикальной прямой меняет знак наклона.</div></div>", "topic": "M5.6"}, {"id": 27, "text": "<p>The area of triangle PQR is 42 cm\\(^2\\).</p><p>The length of PR is 8 cm.</p><p>\\(\\cos\\theta = \\dfrac{3}{4}\\)</p><p>What is the length of QR, in cm?</p>", "image": "images/q-faa8ecb175.jpg", "options": ["4.2", "5.25", "7", "3\\(\\sqrt{7}\\)", "8.4", "10.5", "14", "6\\(\\sqrt{7}\\)"], "correct": 7, "verified": true, "src": "M18", "review": true, "orig": "images/q-faa8ecb175.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь = ½ · a · b · sin θ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin θ = √(1 − <span class=\"fr\"><span>9</span><span>16</span></span>) = <span class=\"fr\"><span>√7</span><span>4</span></span>.</li><li>½ · 8 · QR · <span class=\"fr\"><span>√7</span><span>4</span></span> = QR√7 = 42.</li><li>QR = <span class=\"fr\"><span>42</span><span>√7</span></span> = 6√7.</li></ol><div class=\"ex-a\">Ответ: <b>H</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — использовали cos вместо sin или ошиблись в упрощении.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>42</span><span>√7</span></span> = <span class=\"fr\"><span>42√7</span><span>7</span></span> = 6√7.</div></div>", "topic": "M5.18"}, {"id": 28, "text": "<p>A circle is drawn with centre (3, 5).</p><p>A tangent is drawn to the circle.</p><p>The tangent touches the circle at the point (6, 7).</p><p>What is the gradient of this tangent to the circle?</p>", "image": "", "options": ["-2", "\\(-\\dfrac{3}{2}\\)", "\\(-\\dfrac{2}{3}\\)", "\\(-\\dfrac{1}{2}\\)", "\\(\\dfrac{1}{2}\\)"], "correct": 1, "verified": true, "src": "M18", "orig": "images/q-746cb4668f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касательная ⊥ радиусу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон радиуса: <span class=\"fr\"><span>7 − 5</span><span>6 − 3</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>.</li><li>Касательная: <span class=\"fr\"><span>−3</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — наклон радиуса с минусом.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> k₁ · k₂ = −1.</div></div>", "topic": "M5.10"}, {"id": 29, "text": "<p>In December, the price of a television in a shop was £\\(P\\).</p><p>At the start of January, the price was reduced by £350.</p><p>At the start of February, the price was further reduced by 30% of the January price.</p><p>After the two reductions, the overall decrease in the price of the television was 44%.</p><p>What was \\(P\\)?</p>", "image": "", "options": ["625", "750", "1540", "1750", "2100"], "correct": 3, "verified": true, "src": "M18", "orig": "images/q-9011a67f41.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Составляем уравнение по итоговой цене.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(P − 350) · 0,7 = 0,56P.</li><li>0,7P − 245 = 0,56P → 0,14P = 245 → P = 1750.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не дают 44%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> −44% → остаётся 56%.</div></div>", "topic": "M3.8"}, {"id": 30, "text": "<p>Straight line \\(P\\) has equation \\(y = 3x + 7\\)</p><p>Straight line \\(Q\\) is parallel to \\(P\\) and intersects the \\(y\\)-axis at 2.</p><p>Straight line \\(R\\) is perpendicular to \\(P\\) and intersects \\(P\\) on the \\(y\\)-axis.</p><p>What is the \\(x\\)-coordinate of the point where \\(R\\) intersects \\(Q\\)?</p>", "image": "", "options": ["\\(\\dfrac{5}{6}\\)", "\\(1\\dfrac{1}{2}\\)", "\\(1\\dfrac{5}{7}\\)", "\\(1\\dfrac{7}{8}\\)", "\\(2\\dfrac{7}{10}\\)"], "correct": 1, "verified": true, "src": "M18", "orig": "images/q-d7a86b4b77.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Строим прямые Q и R.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Q: y = 3x + 2.</li><li>R: перпендикулярна P (наклон <span class=\"fr\"><span>−1</span><span>3</span></span>), проходит через (0; 7).</li><li>3x + 2 = <span class=\"fr\"><span>−x</span><span>3</span></span> + 7 → <span class=\"fr\"><span>10x</span><span>3</span></span> = 5 → x = 1,5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный перехват R.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Intersects P on the y-axis» → R проходит через (0; 7).</div></div>", "topic": "M4.10"}, {"id": 31, "topic": "M4.11", "text": "<p>What are the coordinates of the turning point of \\(y = x^{2} - 8x + 18\\)?</p>", "image": "", "options": ["(−4, 18)", "(4, 2)", "(2, 4)", "(4, 18)", "(−4, 2)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделите полный квадрат: y = (x − h)² + k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = (x − 4)² + 2.</li><li>Вершина (4; 2). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак и свободный член.</li><li>C — перепутали координаты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x вершины = −b/2a.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.1", "text": "<p>Which symbol makes this statement true?</p><p>\\(\\dfrac{5}{8} \\;\\square\\; \\dfrac{7}{11}\\)</p>", "image": "", "options": ["≤", "≥", "<", ">", "="], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравните перекрёстным умножением.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 11 = 55 и 7 · 8 = 56. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — дроби не равны, нужен строгий знак.</li><li>B — дроби не равны, нужен строгий знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У отрицательных: больше по модулю — меньше.</div></div>", "src": "PL"}, {"id": 33, "topic": "M2.7", "text": "<p>Evaluate \\(\\dfrac{2^{7} \\times 2^{2}}{2^{6}}\\).</p>", "image": "", "options": ["4", "6", "8", "16", "256"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">При умножении показатели складываются, при делении — вычитаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>7 + 2 − 6 = 3.</li><li>2<sup>3</sup> = 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — умножили основание на показатель.</li><li>E — перемножили показатели вместо сложения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> aᵐ · aⁿ = aᵐ⁺ⁿ, а не aᵐⁿ.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
