<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>The volume of a rectangular solid is equal to 1000 \\(m^3\\). If the length, width and height are increased by 50%, the volume (in \\(m^3\\)) of the new rectangular solid is equal to</p>", "image": "", "options": ["3375", "3500", "1500", "5000", "50000"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-f43d87275e.jpg", "topic": "M3.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждое измерение увеличивается в 1,5 раза → объём в 1,5³ раза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,5³ = 3,375.</li><li>1000 × 3,375 = 3375 м³.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1500) — увеличили объём только на 50%.</li><li>B, D, E — неверный множитель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Увеличение длин на p% меняет объём в (1 + <span class=\"fr\"><span>p</span><span>100</span></span>)³ раз.</div></div>"}, {"id": 2, "text": "<p>If \\(16^x = 4\\) and \\(5^{x+y} = 625\\) then \\(y =\\)</p>", "image": "", "options": ["\\(2\\)", "\\(\\frac{25}{2}\\)", "\\(\\frac{7}{2}\\)", "\\(4\\)", "\\(5\\)"], "correct": 2, "verified": true, "src": "ME2", "orig": "images/q-a2276e43f7.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к одинаковым основаниям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16<sup>x</sup> = 4 → (4²)<sup>x</sup> = 4 → 2x = 1 → x = ½.</li><li>625 = 5⁴ → x + y = 4 → y = 4 − ½ = <span class=\"fr\"><span>7</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (4) — забыли вычесть x.</li><li>A, B, E — неверный x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 16 = 4², 625 = 5⁴ — полезно знать степени.</div></div>"}, {"id": 3, "text": "<p>If \\(a\\) is 20 percent less than \\(b\\), and \\(b\\) is 20 percent greater than 400, then the value of \\(b - a\\) will be</p>", "image": "", "options": ["96", "80", "108", "104", "100"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-36efccf55b.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем b, затем a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>b = 400 · 1,2 = 480.</li><li>a = 480 · 0,8 = 384.</li><li>b − a = 96.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (80) — 20% от 400 вместо 480.</li><li>E (100) — сочли, что a = 400 − 20% и b = 400 + 20%… смешали базы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «a на 20% меньше b» — процент от b.</div></div>"}, {"id": 4, "text": "<p>If \\(p\\) is directly proportional to the square root of \\(q\\) as \\(p = 10\\) when \\(q = 25\\), then the value of \\(q\\) when \\(p = \\sqrt{2}\\) is</p>", "image": "", "options": ["0.25", "4", "2.25", "0.50", "None of these"], "correct": 3, "verified": true, "src": "ME2", "orig": "images/q-4fc1875638.jpg", "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">p = k√q. Находим k, затем q.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 = k · 5 → k = 2.</li><li>√2 = 2√q → √q = <span class=\"fr\"><span>√2</span><span>2</span></span> = <span class=\"fr\"><span>1</span><span>√2</span></span>.</li><li>q = ½ = 0,5.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (0,25) — взяли √q = ½.</li><li>B (4), C — перепутали направление.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После нахождения √q не забудьте возвести в квадрат.</div></div>"}, {"id": 5, "text": "<p>Simplify: \\(\\dfrac{8x^3 - 27}{3 - 2x}\\)</p>", "image": "", "options": ["\\(6x - (2x + 3)^2\\)", "\\(-4x^2 + 6x - 9\\)", "\\(-6x + (2x + 3)^2\\)", "\\(6x + (2x + 3)^2\\)", "\\(2x + 3\\)"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-8dc158eac2.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель — разность кубов, знаменатель — та же скобка со знаком минус.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8x³ − 27 = (2x)³ − 3³ = (2x − 3)(4x² + 6x + 9).</li><li>3 − 2x = −(2x − 3).</li><li>Дробь = −(4x² + 6x + 9) = −4x² − 6x − 9.</li><li>Раскроем вариант A: 6x − (2x + 3)² = 6x − (4x² + 12x + 9) = −4x² − 6x − 9 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (−4x² + 6x − 9) — неверный знак у 6x.</li><li>C, D — неверные знаки при раскрытии скобок.</li><li>E (2x + 3) — забыли разность кубов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a³ − b³ = (a − b)(a² + ab + b²). Ответ может быть записан в «замаскированном» виде — раскрой варианты.</div></div>"}, {"id": 6, "text": "<p>Evaluate \\(\\dfrac{2^{-2}+4^{-1}}{2^{-2}-3^{-1}}\\)</p>", "image": "", "options": ["3", "\\(\\dfrac{1}{3}\\)", "\\(2^{-1}\\)", "\\(-6\\)", "6"], "correct": 3, "verified": true, "src": "ME2", "orig": "images/q-b39ee10dc3.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим отрицательные степени в дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2⁻² = ¼, 4⁻¹ = ¼ → числитель ½.</li><li>3⁻¹ = ⅓ → знаменатель ¼ − ⅓ = <span class=\"fr\"><span>−1</span><span>12</span></span>.</li><li>½ ÷ <span class=\"fr\"><span>−1</span><span>12</span></span> = −6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (6) — потеряли знак минус.</li><li>A, B, C — ошибки в дробях.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a⁻ⁿ = <span class=\"fr\"><span>1</span><span>a</span></span>ⁿ. Знаменатель отрицательный — результат тоже.</div></div>"}, {"id": 7, "text": "<p>If \\(x\\), \\(y\\) and \\(z\\) are positive numbers, with \\(xy = 24\\), \\(xz = 48\\) and \\(yz = 72\\) then \\(x + y + z =\\)</p>", "image": "", "options": ["96", "22", "62", "50", "36"], "correct": 1, "verified": true, "src": "ME2", "orig": "images/q-3436ca4d4b.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножим все три равенства — получим (xyz)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(xy)(xz)(yz) = (xyz)² = 24 · 48 · 72 = 82 944.</li><li>xyz = 288.</li><li>x = <span class=\"fr\"><span>288</span><span>yz</span></span> = <span class=\"fr\"><span>288</span><span>72</span></span> = 4; y = <span class=\"fr\"><span>288</span><span>48</span></span> = 6; z = <span class=\"fr\"><span>288</span><span>24</span></span> = 12.</li><li>x + y + z = 22.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (96), C (62), E (36) — сумма произведений или другие ошибки.</li><li>D (50) — неверные значения переменных.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 4·6 = 24, 4·12 = 48, 6·12 = 72 ✓.</div></div>"}, {"id": 8, "text": "<p>Find the greatest integer value of y which satisfies the inequality:</p><p>\\(x^2 - 7x - 8 &lt; 0\\)</p>", "image": "", "options": ["8", "1", "-8", "7", "-1"], "correct": 3, "verified": true, "src": "ME2", "orig": "images/q-e208d6c061.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем квадратное неравенство и берём наибольшее целое внутри промежутка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 7x − 8 = (x − 8)(x + 1).</li><li>< 0 между корнями: −1 < x < 8.</li><li>Неравенство строгое → 8 не входит; наибольшее целое 7.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (8) — граница не входит.</li><li>B, C, E — не наибольшие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство — концы не включаются.</div></div>"}, {"id": 9, "text": "<p>Find the value of \\(m\\) such that \\((f \\circ g)(x) = (g \\circ f)(x)\\), given \\(f(x) = 3x + 1\\) and \\(g(x) = 2x - m\\).</p>", "image": "", "options": ["\\(-1/2\\)", "\\(1/2\\)", "\\(2\\)", "\\(6\\)", "Cannot be found"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-5053e314a5.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем обе композиции и приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(g(x)) = 3(2x − m) + 1 = 6x − 3m + 1.</li><li>g(f(x)) = 2(3x + 1) − m = 6x + 2 − m.</li><li>6x − 3m + 1 = 6x + 2 − m → −2m = 1 → m = −½.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (½) — ошибка в знаке.</li><li>C, D — неправильное раскрытие скобок.</li><li>E — m находится однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> f∘g = f(g(x)): сначала g, потом f.</div></div>"}, {"id": 10, "text": "<p>The product of the two values of y that satisfy the simultaneous equations \\(x^2 - y = 2\\) and \\(x + y = 4\\) is</p>", "image": "", "options": ["14", "-6", "-21", "4", "None of these"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-56422ba9a9.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем y из одного уравнения в другое.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = x² − 2.</li><li>x + x² − 2 = 4 → x² + x − 6 = 0 → (x + 3)(x − 2) = 0 → x = 2 или −3.</li><li>y = 4 − x: y = 2 или y = 7.</li><li>Произведение: 14.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (−6) — произведение x, а не y.</li><li>C (−21), D (4) — неверные значения y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вопрос про y, а не про x — не перепутайте в конце.</div></div>"}, {"id": 11, "text": "<p>Which value of x satisfies the following equation:</p><p>\\(\\sqrt{2x-5+x}=4\\)</p>", "image": "", "options": ["5", "21", "36", "56", "7"], "correct": 4, "verified": true, "src": "ME2", "orig": "images/q-2086909d3c.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем точки в оба неравенства.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(1; 6): 6 ≥ 1 + 3 = 4 ✓; 1 ≥ <span class=\"fr\"><span>1</span><span>6</span></span> ✓.</li><li>Точка подходит.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−1; −6): −6 ≥ 4 ✗.</li><li>B (2; −1): −1 ≥ 7 ✗.</li><li>D (2; 2): 2 ≥ 7 ✗.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте проверку с более «строгого» неравенства — оно отсекает быстрее.</div></div>"}, {"id": 12, "text": "<p>Find the equation whose roots are 1 more than the roots of \\(x^2 - 3x - 4 = 0\\)</p>", "image": "", "options": ["\\(x^2 - 5x = 0\\)", "\\(x^2 + 5x = 0\\)", "\\(x^2 + 2x + 6 = 0\\)", "\\(x^2 + 4x = 0\\)", "\\(x^2 - 4x + 2 = 0\\)"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-2db1401615.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим корни исходного уравнения, сдвигаем на 1 и собираем новое уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 3x − 4 = (x − 4)(x + 1) → корни 4 и −1.</li><li>Новые корни: 5 и 0.</li><li>Уравнение: (x − 5)(x − 0) = x² − 5x = 0.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (x² + 5x) — корни 0 и −5 (сдвиг в другую сторону).</li><li>D (x² + 4x) — корни 0 и −4.</li><li>C, E — сумма/произведение корней не совпадают (сумма должна быть 5, произведение 0).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте через Виета: сумма корней = −b, произведение = c (при a = 1).</div></div>"}, {"id": 13, "text": "<p>Find the sum of the roots of the given equation</p><p>\\(2x^2 + 6x + 5 = 0\\)</p>", "image": "", "options": ["-6", "3", "5", "5/2", "-3"], "correct": 4, "verified": true, "src": "ME2", "orig": "images/q-3085796713.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма корней квадратного уравнения по теореме Виета: <span class=\"fr\"><span>−b</span><span>a</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 2, b = 6.</li><li>Сумма = <span class=\"fr\"><span>−6</span><span>2</span></span> = −3.</li><li>(Дискриминант 36 − 40 < 0 — корни комплексные, но их сумма всё равно −3.)</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−6) — забыли разделить на a.</li><li>B (3) — потеряли минус.</li><li>C, D — использовали c вместо b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма корней <span class=\"fr\"><span>−b</span><span>a</span></span>, произведение <span class=\"fr\"><span>c</span><span>a</span></span> — работает всегда.</div></div>"}, {"id": 14, "text": "<p>Find the smallest integer value of m when the equation \\(mx^2 + (2m + 1)x + m - 1 = 0\\) has two real roots.</p>", "image": "", "options": ["-1", "1", "8", "-8", "0"], "correct": 1, "verified": true, "src": "ME2", "orig": "images/q-fcd48578ac.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два действительных корня: уравнение должно быть квадратным (m ≠ 0) и D > 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D = (2m + 1)² − 4m(m − 1) = 4m² + 4m + 1 − 4m² + 4m = 8m + 1.</li><li>8m + 1 > 0 → m > <span class=\"fr\"><span>−1</span><span>8</span></span>.</li><li>Наименьшее целое больше <span class=\"fr\"><span>−1</span><span>8</span></span> — это 0, но при m = 0 уравнение линейное (x − 1 = 0), один корень.</li><li>Значит, m = 1.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (0) — уравнение перестаёт быть квадратным.</li><li>A, D (−1, −8) — дают D < 0.</li><li>C (8) — подходит, но не наименьшее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При параметре у x² всегда проверяйте случай, когда он равен 0.</div></div>"}, {"id": 15, "text": "<p>Find the slope of the line passing through points (-4, -4) and (-3, -3).</p>", "image": "", "options": ["1", "\\(\\frac{1}{2}\\)", "\\(\\frac{1}{7}\\)", "7", "Not enough information"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-5b54c90333.jpg", "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон = Δy / Δx.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δy = −3 − (−4) = 1.</li><li>Δx = −3 − (−4) = 1.</li><li>Наклон = 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — ошибки со знаками при вычитании отрицательных чисел.</li><li>E — двух точек достаточно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус на минус: −3 − (−4) = −3 + 4 = 1.</div></div>"}, {"id": 16, "text": "<p>Find the x value that gives the maximum value for the following quadratic equation:</p><p>\\(-x^2 - 12x - 28\\)</p>", "image": "", "options": ["4", "6", "-6", "1/2", "3"], "correct": 2, "verified": true, "src": "ME2", "orig": "images/q-36ee5cc2eb.jpg", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Максимум параболы y = ax² + bx + c (при a < 0) достигается в вершине x = <span class=\"fr\"><span>−b</span><span>2a</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = −1, b = −12.</li><li>x = <span class=\"fr\"><span>−b</span><span>2a</span></span> = −<span class=\"fr\"><span>−12</span><span>2·(−1)</span></span> = <span class=\"fr\"><span>12</span><span>−2</span></span> = −6.</li><li>a < 0 — ветви вниз, значит, это максимум.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (6) — потеряли знак минус.</li><li>A, D, E — не по формуле вершины.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак в формуле <span class=\"fr\"><span>−b</span><span>2a</span></span> — самая частая ошибка. Проверь: −(−6)² − 12·(−6) − 28 = 8 — больше, чем в соседних точках.</div></div>"}, {"id": 17, "text": "<p>The binary operation \\(\\Delta\\) is defined by \\(a\\Delta b = \\frac{\\sqrt{b}}{a^2+b^2}\\). Another binary operation \\(\\nabla\\) is defined by \\(a\\nabla b = \\frac{a\\Delta b}{(b\\Delta a)^2}\\). The value of \\(2\\nabla 4\\) is given by</p>", "image": "", "options": ["20", "40", "1/20", "1/40", "10"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-062a82102b.jpg", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аккуратно считаем по определениям: сначала обе ∆-операции, потом ∇.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2∆4 = <span class=\"fr\"><span>√4</span><span>2² + 4²</span></span> = <span class=\"fr\"><span>2</span><span>20</span></span> = <span class=\"fr\"><span>1</span><span>10</span></span>.</li><li>4∆2 = <span class=\"fr\"><span>√2</span><span>16 + 4</span></span> = <span class=\"fr\"><span>√2</span><span>20</span></span>; в квадрате: <span class=\"fr\"><span>2</span><span>400</span></span> = <span class=\"fr\"><span>1</span><span>200</span></span>.</li><li>2∇4 = <span class=\"fr\"><span>1</span><span>10</span></span> ÷ <span class=\"fr\"><span>1</span><span>200</span></span> = 20.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C <span class=\"fr\"><span>1</span><span>20</span></span> — перевернули деление.</li><li>B, D, E — ошибка в квадрате <span class=\"fr\"><span>√2</span><span>20</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внимательно с порядком аргументов: a∆b ≠ b∆a.</div></div>"}, {"id": 19, "text": "<p>Given that y is a solution to the simultaneous equations \\(x^2 + y^2 = 65\\) and \\(xy = 28\\). What is the value of y when \\(x \\geq 0\\)?</p>", "image": "", "options": ["4", "-4", "-7", "6", "8"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-51671f9b86.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Комбинируем уравнения через (x + y)² и (x − y)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x + y)² = x² + y² + 2xy = 65 + 56 = 121 → x + y = 11 (оба положительны, т.к. xy > 0, x ≥ 0).</li><li>(x − y)² = 65 − 56 = 9 → x − y = ±3.</li><li>Пары: (7; 4) или (4; 7).</li><li>Среди вариантов есть только y = 4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — отрицательные y невозможны при x ≥ 0 и xy > 0.</li><li>D, E — не удовлетворяют xy = 28 с целым x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Система x² + y², xy → всегда через квадраты суммы и разности.</div></div>"}, {"id": 20, "text": "<p>Which of the following can be the general term of the sequence with the first four terms 3, 5, 7, 9?</p>", "image": "", "options": ["\\(2n-1\\)", "\\(2n\\)", "\\(2n+1\\)", "\\(n+1\\)", "\\(n^2+2\\)"], "correct": 2, "verified": true, "src": "ME2", "orig": "images/q-cc104916a6.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Арифметическая прогрессия: шаг 2, значит, формула вида 2n + c.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разность между членами 2 → 2n + c.</li><li>n = 1: 2 + c = 3 → c = 1.</li><li>a_n = 2n + 1. Проверка: 3, 5, 7, 9 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2n − 1) — даёт 1, 3, 5, 7.</li><li>B (2n) — 2, 4, 6, 8.</li><li>D, E — не та разность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коэффициент при n = разность прогрессии.</div></div>"}, {"id": 21, "text": "<p>A sphere has the property that its surface area has the same numerical value as its volume. The length of the radius of the sphere will be</p>", "image": "", "options": ["6", "2", "4", "6", "3"], "correct": 4, "verified": true, "src": "ME2", "orig": "images/q-7e5a326d07.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь сферы 4πr², объём <span class=\"fr\"><span>4</span><span>3</span></span>πr³. Приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4πr² = <span class=\"fr\"><span>4</span><span>3</span></span>πr³.</li><li>Делим обе части на 4πr²: 1 = <span class=\"fr\"><span>r</span><span>3</span></span>.</li><li>r = 3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (6) — это ответ для куба (s³ = 6s²), не путайте.</li><li>B, C, D — не удовлетворяют равенству.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формулы шара: S = 4πr², V = <span class=\"fr\"><span>4</span><span>3</span></span>πr³ — отношение <span class=\"fr\"><span>V</span><span>S</span></span> = <span class=\"fr\"><span>r</span><span>3</span></span>.</div></div>"}, {"id": 22, "text": "<p>In the figure below, arcs AD and BC are semicircles. Assume that AB = BC = CD. What is the ratio of the shaded region to the total region?</p>", "image": "images/q-ef419c5491.jpg", "options": ["\\(\\frac{4}{9}\\)", "\\(\\frac{5}{9}\\)", "\\(\\frac{2}{3}\\)", "\\(\\frac{7}{9}\\)", "\\(\\frac{8}{9}\\)"], "correct": 4, "verified": true, "src": "ME2", "orig": "images/q-ef419c5491.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади полукругов пропорциональны квадратам радиусов. Берём удобные длины: AB = BC = CD = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = 3 → радиус большого полукруга <span class=\"fr\"><span>3</span><span>2</span></span>; BC = 1 → радиус маленького ½.</li><li>Площади ∝ r²: большой ∝ <span class=\"fr\"><span>9</span><span>4</span></span>, маленький ∝ <span class=\"fr\"><span>1</span><span>4</span></span>.</li><li>Закрашенная часть = большой − маленький ∝ <span class=\"fr\"><span>9</span><span>4</span></span> − <span class=\"fr\"><span>1</span><span>4</span></span> = <span class=\"fr\"><span>8</span><span>4</span></span>.</li><li>Доля: <span class=\"fr\"><span>8</span><span>4</span></span> ÷ <span class=\"fr\"><span>9</span><span>4</span></span> = <span class=\"fr\"><span>8</span><span>9</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A <span class=\"fr\"><span>4</span><span>9</span></span>, B <span class=\"fr\"><span>5</span><span>9</span></span> — сравнили диаметры, а не квадраты.</li><li>C, D — неверная доля вычитаемой части.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выбирайте удобные числа для длин, если ответ — отношение.</div></div>"}, {"id": 23, "text": "<p>In the figure below, N lies on MO. In terms of x, y is given by</p>", "image": "images/q-9d368d8cf3.jpg", "options": ["\\(2x\\)", "\\(2x+5\\)", "\\(3x+5\\)", "\\(90-x\\)", "\\(180-x\\)"], "correct": 1, "verified": true, "src": "ME2", "orig": "images/q-9d368d8cf3.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Используем сумму углов треугольника и развёрнутый угол на прямой MO.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В треугольнике MNQ: ∠MNQ = 180° − 2x − (x + 5) = 175° − 3x.</li><li>MO — прямая → углы при N в сумме 180°: (175 − 3x) + y + x = 180.</li><li>y = 2x + 5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2x) — потеряли 5°.</li><li>C (3x + 5) — забыли угол x при N.</li><li>D, E — не учитывают треугольник.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Развёрнутый угол (на прямой) = 180° — самый частый «второй шаг».</div></div>"}, {"id": 24, "text": "<p>Quadrilateral HJKL is a parallelogram. If the diagonals are perpendicular, which statement must be true?</p>", "image": "", "options": ["Quadrilateral HJKL is a square", "Quadrilateral HJKL is a rectangle", "Quadrilateral HJKL is a rhombus", "Quadrilateral HJKL is an isosceles trapezoid", "All of them above"], "correct": 2, "verified": true, "src": "ME2", "orig": "images/q-fd15b5210d.jpg", "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вспоминаем свойства четырёхугольников: перпендикулярные диагонали у параллелограмма — признак ромба.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Параллелограмм с перпендикулярными диагоналями — ромб.</li><li>Квадрат — частный случай (если ещё и углы 90°), но это не обязательно.</li><li>Значит, обязательно верно только «ромб».</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — углы не обязательно прямые.</li><li>D — трапеция не параллелограмм.</li><li>E — верно не всё.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Must be true» — выбирайте самое общее верное утверждение.</div></div>"}, {"id": 25, "text": "<p>Find x</p>", "image": "images/q-b956844cff.jpg", "options": ["\\(6\\sqrt{2}\\)", "\\(4\\sqrt{2}\\)", "\\(3\\sqrt{3}\\)", "\\(\\sqrt{2}\\)", "8"], "correct": 0, "verified": true, "src": "ME2", "orig": "images/q-b956844cff.jpg", "review": true, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">На рисунке прямоугольный треугольник с углом 45° — значит, он равнобедренный (45-45-90).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Углы 90° и 45° → третий угол тоже 45°.</li><li>Значит, катеты равны: оба по 6.</li><li>Гипотенуза в треугольнике 45-45-90 = катет · √2.</li><li>x = 6√2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (4√2), D (√2) — другая длина катета.</li><li>C (3√3) — пропорции треугольника 30-60-90.</li><li>E (8) — не по формуле.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Запомни: 45-45-90 → стороны 1 : 1 : √2; 30-60-90 → 1 : √3 : 2.</div></div>"}, {"id": 26, "text": "<p>This figure contains seven identical squares. What is \\(\\tan(\\angle EDB)\\)?</p>", "image": "images/q-ed7407ab1a.jpg", "options": ["3/4", "4/3", "5/4", "3/5", "5/3"], "correct": 4, "verified": true, "src": "ME2", "orig": "images/q-ed7407ab1a.jpg", "review": true, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вводим координаты: стороны квадратиков = 1. Тогда tg угла считаем по катетам прямоугольного треугольника EDB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A = (0; 0), B = (5; 3) → прямая AB имеет наклон <span class=\"fr\"><span>3</span><span>5</span></span>.</li><li>E = (4; 3), D лежит на AB под E: y = <span class=\"fr\"><span>3</span><span>5</span></span> · 4 = <span class=\"fr\"><span>12</span><span>5</span></span> → D = (4; <span class=\"fr\"><span>12</span><span>5</span></span>).</li><li>Треугольник EDB прямоугольный в E: EB = 1, ED = 3 − <span class=\"fr\"><span>12</span><span>5</span></span> = <span class=\"fr\"><span>3</span><span>5</span></span>.</li><li>tg∠EDB = противолежащий / прилежащий = <span class=\"fr\"><span>EB</span><span>ED</span></span> = 1 ÷ <span class=\"fr\"><span>3</span><span>5</span></span> = <span class=\"fr\"><span>5</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D <span class=\"fr\"><span>3</span><span>5</span></span> — перевёрнутое отношение (это tg угла B).</li><li>A, B, C — отношения сторон из других треугольников.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Координатная сетка из одинаковых квадратов — повод сразу ввести координаты.</div></div>"}, {"id": 27, "text": "<p>What is the value in degrees of obtuse angle between hour hand and minute hand at 3:45 pm?</p>", "image": "", "options": ["180", "157.5", "204", "96", "425"], "correct": 1, "src": "ME2", "orig": "images/q-61843044cd.jpg", "topic": "M5.2"}, {"id": 31, "topic": "M2.2", "text": "<p>Evaluate \\(6 + 2 \\times 3^2 - 4\\).</p>", "image": "", "options": ["14", "20", "28", "38", "68"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Порядок: степень → умножение → сложение и вычитание.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3² = 9, 2 · 9 = 18.</li><li>6 + 18 − 4 = 20. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — c² посчитали как 2c.</li><li>C — потеряли минус.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Степень относится только к числу, на котором стоит.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.13", "text": "<p>The bearing of Q from P is 035°.</p><p>What is the bearing of P from Q?</p>", "image": "", "options": ["305°", "325°", "035°", "145°", "215°"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный азимут = исходный ± 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>035° + 180 = 215°. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вычли из 360 — это отражение, а не обратный азимут.</li><li>C — направление то же.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ всегда тремя цифрами.</div></div>", "src": "PL"}, {"id": 33, "topic": "M5.5", "text": "<p>In triangle ABC, D is on AB and E is on AC with DE parallel to BC. AD = 3 cm, DB = 5 cm and DE = 12 cm.</p><p>Find BC.</p>", "image": "", "options": ["4.5 cm", "17 cm", "20 cm", "32 cm", "34 cm"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольники ADE и ABC подобны; AB = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 8 : 3.</li><li>BC = 12 · <span class=\"fr\"><span>8</span><span>3</span></span> = 32 см. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — коэффициент перевёрнут.</li><li>B — прибавили вместо умножения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте со всей стороной AB, а не с DB.</div></div>", "src": "PL"}, {"id": 34, "topic": "M5.6", "text": "<p>The point (2, −5) is reflected in the line \\(y = 3\\).</p><p>What are the coordinates of the image?</p>", "image": "", "options": ["(−2, −5)", "(4, −5)", "(2, 1)", "(2, 5)", "(2, 11)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точка и образ на одинаковом расстоянии от прямой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y' = 2·3 − (−5) = 11. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — отразили в оси y.</li><li>B — отразили в x = 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуйте прямую — так ошибиться сложнее.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1620, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1620, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
