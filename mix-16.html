<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Solve the equation for all real values of x: \\(x^4 - 13x^2 + 36 = 0\\)</p>", "image": "", "options": ["x = 2, x = 3", "x = -2, x = -3", "x = ±4, x = ±9", "x = ±2, x = ±3", "No real solutions"], "correct": 3, "verified": true, "src": "M37", "orig": "images/q-95b2337a33.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Биквадратное уравнение: замена u = x².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>u² − 13u + 36 = (u − 4)(u − 9) = 0.</li><li>x² = 4 или x² = 9 → x = ±2, ±3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — потеряны знаки ±.</li><li>C — забыли извлечь корень из u.</li><li>E — решения есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После замены не забудьте вернуться к x и учесть ±.</div></div>"}, {"id": 2, "text": "<p>Find the coordinates of the center and the radius of the circle defined by the equation:</p><p>\\(x^2 + y^2 + 4x - 6y - 12 = 0\\)</p>", "image": "", "options": ["Center (-2, 3), Radius 5", "Center (2, -3), Radius 5", "Center (-2, 3), Radius 25", "Center (2, -3), Radius 25", "Center (-4, 6), Radius 5"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-f313b314d7.jpg", "review": true, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделяем полные квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x + 2)² − 4 + (y − 3)² − 9 − 12 = 0.</li><li>(x + 2)² + (y − 3)² = 25 → центр (−2; 3), r = 5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — знаки центра перевёрнуты.</li><li>C, D — радиус 25 — это r².</li><li>E — центр = коэффициенты без деления на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центр = <span class=\"fr\"><span>−D</span><span>2</span></span>; <span class=\"fr\"><span>−E</span><span>2</span></span>.</div></div>"}, {"id": 3, "text": "<p>Evaluate the expression: \\(\\left(64^{-\\frac{2}{3}}+ 9^{0.5}\\right)^{-1}\\)</p>", "image": "", "options": ["\\(\\dfrac{16}{49}\\)", "\\(\\dfrac{49}{16}\\)", "\\(\\dfrac{16}{3}\\)", "\\(\\dfrac{3}{16}\\)", "\\(\\dfrac{1}{7}\\)"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-15f411c1ac.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем степени, затем переворачиваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>64<sup>−2⁄3</sup> = <span class=\"fr\"><span>1</span><span>16</span></span>; 9<sup>0,5</sup> = 3.</li><li><span class=\"fr\"><span>1</span><span>16</span></span> + 3 = <span class=\"fr\"><span>49</span><span>16</span></span>.</li><li><span class=\"fr\"><span>49</span><span>16</span></span>⁻¹ = <span class=\"fr\"><span>16</span><span>49</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не перевернули.</li><li>C, D, E — ошибки с 64<sup>−2⁄3</sup>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 64<sup>2⁄3</sup> = (∛64)² = 16.</div></div>"}, {"id": 4, "text": "<p>Given the function \\(f(x) = \\sqrt{3 - x}\\) and \\(g(x) = x^2 - 1\\). What is the domain of the composite function f(g(x))?</p>", "image": "", "options": ["\\(x \\leq 3\\)", "\\(x \\geq -1\\)", "\\(-2 \\leq x \\leq 2\\)", "\\(x \\leq 2\\)", "\\(x \\geq 2\\) or \\(x \\leq -2\\)"], "correct": 2, "verified": true, "src": "M37", "orig": "images/q-a4183733a3.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подкоренное выражение f(g(x)) должно быть ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(g(x)) = √(3 − (x² − 1)) = √(4 − x²).</li><li>4 − x² ≥ 0 → −2 ≤ x ≤ 2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — область f, а не композиции.</li><li>B, D — неполно.</li><li>E — наоборот.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Область композиции — по итоговой формуле.</div></div>"}, {"id": 5, "text": "<p>The figure shows a triangle ABC where AC = 8, BC = 10, and angle ACB = 120°.</p><p>What is the ratio of area to perimeter of a triangle?</p>", "image": "images/q-d96488df54.jpg", "options": ["\\(\\frac{10\\sqrt{3}}{9+\\sqrt{61}}\\)", "\\(\\frac{9\\sqrt{3}}{10+\\sqrt{61}}\\)", "\\(\\frac{\\sqrt{3}}{9+\\sqrt{61}}\\)", "\\(\\frac{10\\sqrt{3}}{\\sqrt{61}}\\)"], "correct": 0, "verified": true, "src": "M37", "review": true, "orig": "images/q-d96488df54.jpg", "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь через синус, третья сторона — теорема косинусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = ½ · 8 · 10 · sin 120° = 20√3.</li><li>AB² = 64 + 100 − 160 · cos 120° = 164 + 80 = 244 → AB = 2√61.</li><li>P = 18 + 2√61.</li><li><span class=\"fr\"><span>20√3</span><span>18 + 2√61</span></span> = <span class=\"fr\"><span>10√3</span><span>9 + √61</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перепутаны числа.</li><li>C — без 10.</li><li>D — неверный знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> cos 120° = −½ → в формуле знак становится «+».</div></div>"}, {"id": 7, "text": "<p>Find the range of values of k for which the line \\(y = kx + 1\\) does NOT intersect the curve \\(y = x^2 + 3x + 2\\).</p>", "image": "", "options": ["\\(k &lt; 1\\) or \\(k &gt; 5\\)", "\\(1 &lt; k &lt; 5\\)", "\\(k = 1\\) or \\(k = 5\\)", "\\(k &gt; 1\\)", "\\(k &lt; 5\\)"], "correct": 1, "verified": true, "src": "M37", "orig": "images/q-e49164f696.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не пересекаются ⇔ уравнение пересечения не имеет корней (D < 0).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + (3 − k)x + 1 = 0.</li><li>(3 − k)² − 4 < 0 → |3 − k| < 2 → 1 < k < 5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — условие пересечения (D > 0).</li><li>C — касание.</li><li>D, E — неполно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> D < 0 — нет общих точек; D = 0 — касание.</div></div>"}, {"id": 8, "text": "<p>Two solid spheres have surface areas in the ratio 9:25. What is the ratio of their volumes?</p>", "image": "", "options": ["3:5", "9:25", "27:125", "81:625"], "correct": 2, "verified": true, "src": "M37", "review": true, "orig": "images/q-0d4f76c9e2.jpg", "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади ∝ r², объёмы ∝ r³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r₁ : r₂ = √9 : √25 = 3 : 5.</li><li>V₁ : V₂ = 27 : 125.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — отношение радиусов.</li><li>B — площадей.</li><li>D — квадраты площадей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь → корень → радиус → куб → объём.</div></div>"}, {"id": 9, "text": "<p>A physical quantity P is determined by the formula:</p><p>\\(P = \\dfrac{X\\sqrt{Y}}{Z^2}\\)</p><p>If the variables are changed as follows:</p><ul><li>X is increased by 20%.</li><li>Y is increased by 44%.</li><li>Z is decreased by 10%.</li></ul><p>To the nearest percent, describe the overall change in P in percentage terms.</p>", "image": "", "options": ["44% increase", "64% increase", "78% increase", "100% increase"], "correct": 2, "verified": true, "src": "M37", "review": true, "orig": "images/q-acb9425de1.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем коэффициенты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>X × 1,2; √Y × √1,44 = 1,2; Z² × 0,81.</li><li>1,2 · 1,2 / 0,81 = <span class=\"fr\"><span>1,44</span><span>0,81</span></span> ≈ 1,78 → рост ≈ 78%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (44%) — забыли Z.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уменьшение Z в знаменателе увеличивает P.</div></div>"}, {"id": 10, "text": "<p>Two identical circles, each with a radius of 6 cm, are positioned such that the center of each circle lies on the circumference of the other. What is the area of the overlapping region?</p>", "image": "", "options": ["\\(12\\pi - 9\\sqrt{3}\\)", "\\(24\\pi - 18\\sqrt{3}\\)", "\\(18\\pi - 12\\sqrt{2}\\)", "\\(36\\pi - 18\\sqrt{3}\\)", "\\(12\\pi - \\sqrt{3}\\)"], "correct": 1, "verified": true, "src": "M37", "orig": "images/q-1bfe1bfad8.jpg", "review": true, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центры и точка пересечения — равносторонний треугольник → дуги по 120°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сектор 120°: ⅓ · π · 36 = 12π.</li><li>Треугольник: ½ · 36 · sin 120° = 9√3.</li><li>Сегмент: 12π − 9√3; два сегмента: 24π − 18√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — один сегмент.</li><li>D — неверный сектор.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перекрытие двух кругов = два одинаковых сегмента.</div></div>"}, {"id": 11, "text": "<p>In the coordinate plane, a circle has its center at C(3, -4) and is tangent to the y-axis.</p><p>What is the equation of this circle?</p>", "image": "", "options": ["\\((x - 3)^2 + (y + 4)^2 = 9\\)", "\\((x - 3)^2 + (y + 4)^2 = 16\\)", "\\((x + 3)^2 + (y - 4)^2 = 9\\)", "\\((x - 3)^2 + (y + 4)^2 = 25\\)", "\\(x^2 + y^2 = 25\\)"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-637890f9d8.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касание оси y → r = |x центра| = 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 3)² + (y + 4)² = 9.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — r = 4 (касание оси x).</li><li>D — r = 5 (до начала координат).</li><li>C — знаки центра.</li><li>E — центр в начале.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ось y → x-координата; ось x → y-координата.</div></div>"}, {"id": 12, "text": "<p>A geometric progression has a second term of -6 and a fifth term of 48. Find the sum of the first 6 terms.</p>", "image": "", "options": ["-63", "-31.5", "63", "31.5", "-126"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-07888556c6.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим r и a, затем сумму.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>ar⁴</span><span>ar</span></span> = r³ = <span class=\"fr\"><span>48</span><span>−6</span></span> = −8 → r = −2.</li><li>a = <span class=\"fr\"><span>−6</span><span>−2</span></span> = 3.</li><li>S₆ = 3<span class=\"fr\"><span>1 − 64</span><span>1 + 2</span></span> = −63.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — потерян минус.</li><li>B, D — деление на 6.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = a<span class=\"fr\"><span>1 − rⁿ</span><span>1 − r</span></span>.</div></div>"}, {"id": 13, "text": "<p>Calculate the value of:</p><p>\\((200+203+206+\\cdots+797)-(180+183+186+\\cdots+777)\\)</p>", "image": "", "options": ["2000", "3000", "4000", "5000", "6000"], "correct": 2, "verified": true, "src": "M37", "orig": "images/q-c1678e6ec2.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обе последовательности одинаковой длины; каждый член первой больше на 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Членов: <span class=\"fr\"><span>797 − 200</span><span>3</span></span> + 1 = 200.</li><li>Разность пар: 200 − 180 = 20.</li><li>200 · 20 = 4000.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверное число членов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не считайте суммы — вычитайте попарно.</div></div>"}, {"id": 14, "text": "<p>14 Question The area of a right-angled triangle is 240 cm . The lengths of the two legs (the base and the height) are in the ratio 5:12.</p><p>What is the perimeter of this triangle?</p>", "image": "", "options": ["60 cm", "\\(60\\sqrt{2}\\) cm", "80 cm", "\\(80\\sqrt{3}\\) cm", "\\(70\\sqrt{3}\\) cm"], "correct": 1, "verified": true, "src": "M37", "orig": "images/q-b9d7ce2ccf.jpg", "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Катеты 5k и 12k, гипотенуза 13k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 5k · 12k = 30k² = 240 → k² = 8 → k = 2√2.</li><li>P = 30k = 60√2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — k = 2.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Периметр 5-12-13 = 30k.</div></div>"}, {"id": 15, "text": "<p>Solve the inequality: \\(\\frac{3(2-x)}{4} - \\frac{5x+14}{3} \\geq 2x - \\frac{1}{6}\\)</p>", "image": "", "options": ["\\(x \\leq -36/35\\)", "\\(x \\geq -36/53\\)", "\\(x \\leq -36/53\\)", "\\(x \\geq 1\\)", "\\(x \\geq -2\\)"], "correct": 2, "verified": true, "src": "M37", "orig": "images/q-531beb21a0.jpg", "review": true, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем на 12 (НОК знаменателей).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9(2 − x) − 4(5x + 14) ≥ 24x − 2.</li><li>18 − 9x − 20x − 56 ≥ 24x − 2 → −38 − 29x ≥ 24x − 2.</li><li>−36 ≥ 53x → x ≤ <span class=\"fr\"><span>−36</span><span>53</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 35 вместо 53.</li><li>B — знак.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делим на положительное 53 — знак не меняется.</div></div>"}, {"id": 16, "text": "<p>Which of the following expressions has the largest value for 0&lt;x&lt;1</p>", "image": "", "options": ["\\(x\\)", "\\(x^2\\)", "\\(\\sqrt{x}\\)", "\\(x^3\\)"], "correct": 2, "verified": true, "src": "M37", "review": true, "orig": "images/q-b95fda5b6f.jpg", "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для 0 < x < 1 корень увеличивает, степень уменьшает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 0,25: √x = 0,5; x = 0,25; x² = 0,0625; x³ ≈ 0,016.</li><li>Наибольшее √x.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — меньше √x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте конкретное число.</div></div>"}, {"id": 17, "text": "<p>The vertices of a triangle are A(1, 2), B(5, 2), and C(3, 6). What is the area of triangle ABC?</p>", "image": "images/q-75c617d041.jpg", "options": ["4", "8", "12", "16", "6"], "correct": 1, "verified": true, "src": "M37", "orig": "images/q-75c617d041.jpg", "review": true, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание AB горизонтально.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = 4.</li><li>Высота: 6 − 2 = 4.</li><li>S = ½ · 4 · 4 = 8.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — забыли ½.</li><li>A, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Горизонтальная сторона — удобное основание.</div></div>"}, {"id": 18, "text": "<p>A local water reservoir currently contains 150 million liters of water. Due to the onset of the rainy season, the water level is increasing at a steady rate of 40 million liters per month. If the reservoir's maximum capacity is 330 million liters and each month is assumed to contain exactly 30 days, on what date will the reservoir reach its full capacity if the filling began on February 1?</p>", "image": "", "options": ["May 30", "June 1", "June 16", "July 10"], "correct": 2, "verified": true, "src": "M37", "review": true, "orig": "images/q-16662b05cd.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время = нужный объём / скорость.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>330 − 150 = 180 млн л.</li><li><span class=\"fr\"><span>180</span><span>40</span></span> = 4,5 месяца = 135 дней.</li><li>1 февраля + 4 месяца = 1 июня, + 15 дней = 16 июня.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без полумесяца.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 0,5 месяца = 15 дней (по условию месяц = 30 дней).</div></div>"}, {"id": 19, "text": "<p>Simplify the following expression \\(\\frac{(4^5-2^8)(2^{-3}+2^{-5})}{2^2-2^0}\\)</p>", "image": "", "options": ["20", "26", "38", "40", "46"], "correct": 3, "verified": true, "src": "M37", "orig": "images/q-9e58fcbb8b.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем по частям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4⁵ − 2⁸ = 1024 − 256 = 768.</li><li>2⁻³ + 2⁻⁵ = <span class=\"fr\"><span>1</span><span>8</span></span> + <span class=\"fr\"><span>1</span><span>32</span></span> = <span class=\"fr\"><span>5</span><span>32</span></span>.</li><li>768 · <span class=\"fr\"><span>5</span><span>32</span></span> = 120.</li><li>2² − 2⁰ = 3 → <span class=\"fr\"><span>120</span><span>3</span></span> = 40.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без 2.</li><li>B, C, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2⁰ = 1.</div></div>"}, {"id": 20, "text": "<p>In the figure, ABCD is a cyclic quadrilateral. The lines AD and BC intersect at E outside the circle.</p><p>If angle AEB = 30° and angle BAD = 80°, what is the size of angle ADC?</p><p>[diagram not to scale]</p>", "image": "images/q-def4216467.jpg", "options": ["70°", "80°", "100°", "110°", "130°"], "correct": 3, "verified": true, "src": "M37", "orig": "images/q-def4216467.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим ∠ABC из треугольника EAB, затем используем вписанный четырёхугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠ABE = 180° − 30° − 80° = 70° = ∠ABC.</li><li>Противоположные углы вписанного четырёхугольника = 180°.</li><li>∠ADC = 180° − 70° = 110°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (70°) — это ∠B.</li><li>C (100°) — 180 − 80.</li><li>B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный четырёхугольник: ∠A + ∠C = ∠B + ∠D = 180°.</div></div>"}, {"id": 21, "text": "<p>A ship sails 120 nautical miles from a port on a bearing of 120°. It then changes course to a bearing of 210° and continues until it is due South of its original starting port. How far has the ship traveled on the second leg of its journey? (Round to the nearest whole number).</p>", "image": "", "options": ["180 nm", "208 nm", "147 nm", "231 nm"], "correct": 1, "verified": true, "src": "M37", "review": true, "orig": "images/q-59f7d08c36.jpg", "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем перемещения на восток и юг.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первый курс 120°: восток 120 sin 60°... = 120 · sin 120° ≈ 103,9; юг 60.</li><li>Курс 210° — 30° к западу от юга: сдвиг на запад = d · sin 30°.</li><li>d · ½ = 103,9 → d ≈ 208.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — неверное разложение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пеленг отсчитывается от севера по часовой стрелке.</div></div>"}, {"id": 22, "text": "<p>The symbol # defines an operation such that a # b = \\(b^2 - 2ab + a\\). Find the value of (3 # 2) # (2#3).</p>", "image": "", "options": ["-14", "-13", "15", "18", "23"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-5e3af23e38.jpg", "review": true, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем операции по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3#2 = 4 − 12 + 3 = −5.</li><li>2#3 = 9 − 12 + 2 = −1.</li><li>(−5)#(−1) = 1 − 2 · (−5)(−1) + (−5) = 1 − 10 − 5 = −14.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — ошибки знаков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> b² первым — внимательно с порядком аргументов.</div></div>"}, {"id": 23, "text": "<p>Triangle ABC is similar to triangle PQR. The area of triangle ABC is 24 cm , and the area of triangle PQR is 54 cm .</p><p>If the length of side AB is 8 cm, what is the length of the corresponding side PQ?</p>", "image": "images/q-a9c78c812c.jpg", "options": ["12 cm", "13.5 cm", "16 cm", "18 cm", "27 cm"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-a9c78c812c.jpg", "review": true, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади подобных фигур ∝ k².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>54</span><span>24</span></span> = <span class=\"fr\"><span>9</span><span>4</span></span> → k = <span class=\"fr\"><span>3</span><span>2</span></span>.</li><li>PQ = 8 · 1,5 = 12.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (18) — умножили на <span class=\"fr\"><span>9</span><span>4</span></span>.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площади → корень → отношение длин.</div></div>"}, {"id": 24, "text": "<p>Find the coordinates of the points of intersection between the line \\(y = 2x + 3\\) and the circle \\(x^2 + y^2 + x - 2y - 3 = 0\\).</p>", "image": "", "options": ["\\((0, 3)\\) and \\((-9/5, -3/5)\\)", "\\((1, 5)\\) and \\((-3/5, -3)\\)", "\\((-1, 1)\\) and \\((-2, -1)\\)", "\\((-1, 1)\\) and \\((-3, -3)\\)", "\\((0, 3)\\) and \\((1, 5/3)\\)"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-9cfaebbb8b.jpg", "review": true, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подстановка y = 2x + 3 в уравнение окружности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + (2x + 3)² + x − 2(2x + 3) − 3 = 0.</li><li>x² + 4x² + 12x + 9 + x − 4x − 6 − 3 = 5x² + 9x = 0.</li><li>x = 0 → y = 3; x = <span class=\"fr\"><span>−9</span><span>5</span></span> → y = <span class=\"fr\"><span>−3</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие пары не лежат на прямой y = 2x + 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка на прямой отсекает варианты быстро.</div></div>"}, {"id": 25, "text": "<p>A sector of a circle has a fixed perimeter of 20 cm. What is the radius of the sector that maximizes its area?</p>", "image": "", "options": ["2.5 cm", "4 cm", "5 cm", "10 cm", "It depends on the angle."], "correct": 2, "verified": true, "src": "M37", "orig": "images/q-56c044e669.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем площадь сектора через r и находим максимум.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дуга = 20 − 2r.</li><li>S = ½ · r · дуга = r(10 − r) = 25 − (r − 5)².</li><li>Максимум при r = 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — угол определяется через r.</li><li>A, B, D — не вершина параболы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь сектора = ½ · r · длина дуги.</div></div>", "topic": "M5.16"}, {"id": 26, "text": "<p>Find the values of x that satisfy the simultaneous equations: \\(y = 2x - 1\\) \\(x^2 + y^2 = 2\\)</p>", "image": "", "options": ["\\(x = 1\\) and \\(y = 2\\)", "\\(x = 1 + \\sqrt{3}\\) and \\(y = 0.2\\)", "\\(x = 1 + \\sqrt{3}\\) and \\(y = 1 - \\sqrt{3}\\)", "\\(x = 1\\) and \\(x = -0.2\\)", "\\(x = 1 - \\sqrt{3}\\) and \\(y = 1\\)"], "correct": 3, "verified": true, "src": "M37", "orig": "images/q-9eb2aa52cb.jpg", "review": true, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подстановка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + (2x − 1)² = 2 → 5x² − 4x − 1 = 0.</li><li>(5x + 1)(x − 1) = 0 → x = 1 или −0,2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — y = 2 неверно (y = 1).</li><li>B, C, E — неверные корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают значения x.</div></div>"}, {"id": 27, "text": "<p>Point P has coordinates (3,4).</p><ol><li>Point P is reflected across the line y=1 to create Point Q.</li><li>Point Q is then reflected across the y-axis to create Point R.</li></ol><p>What is the distance between Point P and Point R?</p>", "image": "", "options": ["6", "\\(6\\sqrt{2}\\)", "\\(7\\sqrt{2}\\)", "8", "\\(\\sqrt{74}\\) m"], "correct": 1, "verified": true, "src": "M37", "orig": "images/q-7669ca08f7.jpg", "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отражения меняют координаты по правилам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Отражение в y = 1: y → 2 − y → Q(3; −2).</li><li>Отражение в оси y: x → −x → R(−3; −2).</li><li>PR = √(36 + 36) = 6√2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только горизонтальное расстояние.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отражение в y = c: y' = 2c − y.</div></div>"}, {"id": 28, "text": "<p>If \\(4^{x} = 8^{y-1}\\) and \\(9^{y} = 27^{x+1}\\), find the value of x.</p>", "image": "", "options": ["-1", "1/3", "2", "-3/5", "5/3"], "correct": 3, "src": "M37", "orig": "images/q-2b9844ccb0.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к основаниям 2 и 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2<sup>2x</sup> = 2<sup>3(y − 1)</sup> → 2x = 3y − 3.</li><li>3<sup>2y</sup> = 3<sup>3(x + 1)</sup> → 2y = 3x + 3 → y = <span class=\"fr\"><span>3x + 3</span><span>2</span></span>.</li><li>2x = <span class=\"fr\"><span>9x + 9</span><span>2</span></span> − 3 → 4x = 9x + 3 → x = <span class=\"fr\"><span>−3</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не удовлетворяют системе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 = 2², 8 = 2³, 9 = 3², 27 = 3³.</div></div>", "topic": "M4.2"}, {"id": 29, "text": "<p>A circle is inscribed inside a square (the circle touches all four sides of the square). The diagonal of the square is \\(10\\sqrt{2}\\) cm. Find the area of this circle in terms of π.</p>", "image": "", "options": ["π", "25π", "26π/3", "27π", "34π"], "correct": 1, "verified": true, "src": "M37", "orig": "images/q-36b382b8b8.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ квадрата = a√2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 10 → радиус вписанного круга 5.</li><li>S = 25π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E, D — неверный радиус.</li><li>A, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный круг: r = <span class=\"fr\"><span>a</span><span>2</span></span>.</div></div>"}, {"id": 30, "text": "<p>The variable 'y' is inversely proportional to the square of (x-2). When x = 4, y = 5.</p><p>Determine the value of y when x = 7.</p>", "image": "", "options": ["0.8", "1", "1.25", "4", "20"], "correct": 0, "verified": true, "src": "M37", "orig": "images/q-1539c8f2fd.jpg", "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y · (x − 2)² = const.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · (4 − 2)² = 20.</li><li>y = <span class=\"fr\"><span>20</span><span>7 − 2</span></span>² = <span class=\"fr\"><span>20</span><span>25</span></span> = 0,8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1,25) — перевёрнуто.</li><li>E (20) — константа.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная пропорциональность: произведение постоянно.</div></div>"}, {"id": 31, "topic": "M3.2", "text": "<p>Write 250 g of 2 kg as a fraction in its simplest form.</p>", "image": "", "options": ["125", "\\(\\dfrac{7}{8}\\)", "\\(\\dfrac{1}{8}\\)", "\\(\\dfrac{5}{4}\\)", "\\(\\dfrac{1}{80}\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала одинаковые единицы, потом сокращение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>250 из 2000 → <span class=\"fr\"><span>1</span><span>8</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не перевели в одинаковые единицы.</li><li>B — это оставшаяся часть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дробь имеет смысл только для одинаковых единиц.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
