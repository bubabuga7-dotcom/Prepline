<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;

  }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }

  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {

  .review-item {

  @media (max-width: 480px) {

<script>
const questions = [{"id":1,"text":"<p>Simplify the following expression:</p><p>\\(\\left(\\dfrac{4a^{-0.5}b^{4}}{\\sqrt[3]{c^{2}}}\\right)^{3}\\)</p>","image":"","options":["\\(\\dfrac{64b^{12}}{c^{2}a^{1.5}}\\)","\\(\\dfrac{12b^{7}}{a^{1.5}c^{2}}\\)","\\(\\dfrac{64a^{1.5}b^{12}}{c^{2}}\\)","\\(\\dfrac{64b^{12}}{c^{6}a^{-1.5}}\\)"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-eaceef6aaa.jpg","topic":"M4.2"},{"id":2,"text":"<p>Let the operation \\(\\odot\\) be defined for all positive real numbers as:</p><p>\\[a \\odot b = \\frac{a+2b}{ab+1}\\]</p><p>Find the value of x such that \\((4 \\odot x) = 1\\)</p>","image":"","options":["1","1.5","2","2.5","3"],"correct":1,"verified":true,"src":"M32","orig":"images/q-48f1f70ef4.jpg","topic":"M4.3"},{"id":3,"text":"<p>Find the solution set for the following system of inequalities.</p><p>\\(2x^2 + 5x - 3 \\leq 0\\)</p><p>\\(x^2 - 4x + 1 &lt; 0\\)</p>","image":"","options":["\\((2 - \\sqrt{3};\\; 0.5]\\)","\\((2 + \\sqrt{3};\\; 0.5)\\)","\\(x &lt; 2 - \\sqrt{3}\\) and \\(x &gt; 0.5\\)","\\(x &lt; 2 - \\sqrt{3}\\) and \\(x \\geq 0.5\\)"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-18ec724476.jpg","topic":"M4.17"},{"id":4,"text":"<p>The real numbers x and y satisfy the simultaneous equations \\[2x^2 + 4x - 10 - y = 0\\] \\[x^2 - 2x + 6 - y = 0\\] Find the value of \\(\\frac{x}{y}\\) using the coordinate pair (x, y) that contains the largest value of y.</p>","image":"","options":["1/49","\\(- 4/43\\)","4/43","\\(- 6/49\\)"],"correct":1,"verified":true,"src":"M32","review":true,"orig":"images/q-33affc9bb8.jpg","topic":"M4.16"},{"id":5,"text":"<p>Evaluate:</p><p>\\(\\dfrac{2}{\\sqrt{5}+3} + \\dfrac{2}{\\sqrt{5}-3}\\)</p>","image":"","options":["\\(\\sqrt{5}\\)","\\(-\\sqrt{5}\\)","1","\\(-1\\)","1. 5"],"correct":-1,"verified":false,"src":"M32","orig":"images/q-5936512854.jpg"},{"id":6,"text":"<p>Sara had an average score of 88 on her first four tests. She had an average score of 85 on her first five tests. What score did she receive on her fifth test?</p>","image":"","options":["73","75","77","79","81"],"correct":0,"verified":true,"src":"M32","orig":"images/q-70fd1a5a74.jpg","topic":"M2.2"},{"id":7,"text":"<p>In an astrophysics simulation, the gravitational force F between two planets is calculated using the formula: \\(F = \\frac{Gm_1m_2}{r^2}\\)</p><p>If the mass of the first planet is increased by 50%, the mass of the second planet is doubled, and the distance r between them is increased by 25%, what is the resulting percentage change in the gravitational force F?</p>","image":"","options":["It increases by 125%","It increases by 92%","It increases by 140%","It decreases by 8%","It increases by 192%"],"correct":1,"verified":true,"src":"M32","orig":"images/q-557d972e99.jpg","topic":"M3.8"},{"id":8,"text":"<p>A secure system uses passwords that are 5 characters long, using only the digits 1, 2, 3, 4, 5, and 6.</p><p>How many different passwords are possible if the following conditions must be met:</p><ol><li>Repetition of digits is allowed.</li><li>The password must start with an even digit.</li><li>The password must end with the digit \"5\".</li></ol>","image":"","options":["1296","648","216","324","432"],"correct":1,"verified":true,"src":"M32","orig":"images/q-551fc1d26b.jpg","topic":"M2.5"},{"id":9,"text":"<p>Find the equation of the line that passes through the following two points:</p><p>\\(A = (\\frac{-2}{3}, 4)\\) and \\(B = (2. \\ 0.5)\\)</p>","image":"","options":["\\(21x + 16y = 50\\)","\\(16x + 21y = 50\\)","\\(21x - 16y = 42\\)","\\(7x + 8y = 25\\)","\\(21x + 16y = 42\\)"],"correct":0,"verified":true,"src":"M32","orig":"images/q-5ec88aee6d.jpg","topic":"M4.10"},{"id":10,"text":"<p>In a right triangle XYZ, the legs are XY = 2x - 2 and YZ = \\\\(\\\\sqrt{8}x\\\\). The hypotenuse XZ = 2x + 2. Find the value of x.</p>","image":"","options":["1","2","3","4","5"],"correct":-1,"verified":false,"src":"M32","orig":"images/q-088e66d5b2.jpg"},{"id":11,"text":"<p>Simplify the following expression into its simplest form:</p><p>\\(\\dfrac{x^3+9x^2+27x+27}{x^2+6x+9}\\)</p>","image":"","options":["\\(x+1\\)","\\(x+3\\)","\\((x+3)^2\\)","\\(1\\)","\\(x^2+3\\)"],"correct":1,"verified":true,"src":"M32","orig":"images/q-129a991cb8.jpg","topic":"M4.6"},{"id":12,"text":"<p>Let s be the side length of a square and r be the radius of a circle. Suppose both are greater than 1 (1 &lt; s and 1 &lt; r). Consider these statements about their Perimeter and Area:</p><ol><li>If you double the side of a square (2s), its Area becomes four times larger.</li><li>If a circle and a square have the same perimeter, the circle will always have a larger Area.</li><li>A square with a side length of s=4 has a Perimeter equal to its Area.</li></ol><p>Which of these statements are true?</p>","image":"","options":["All three statements","Only statements 1 and 2","Only statements 2 and 3","Only statements 1 and 3","Only statement 1","Only statement 2","Only statement 3","None of the statements"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-f36d0a8b31.jpg","topic":"M3.10"},{"id":13,"text":"<p>A solid sphere is perfectly inscribed inside a right circular cylinder such that it touches the top, the bottom, and the curved side of the cylinder. The total surface area of the cylinder (including the top and bottom bases) is \\\\(150\\\\pi\\\\) square units.</p><p>What is the volume of the region inside the cylinder but outside the sphere?</p>","image":"","options":["\\\\(\\\\dfrac{500}{3\\\\pi}\\\\)","\\\\(\\\\dfrac{500}{3}\\\\pi\\\\)","\\\\(\\\\dfrac{250}{3}\\\\pi\\\\)","\\\\(\\\\dfrac{500}{3\\\\sqrt{\\\\pi}}\\\\)","\\\\(\\\\dfrac{550}{3}\\\\pi\\\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-9cc1f7de33.jpg","topic":"M5.15"},{"id":14,"text":"<p>Under which conditions is the expression</p><p>\\\\(\\\\dfrac{x(y-x)}{y}\\\\)</p><p>positive?</p>","image":"","options":["\\\\(x &lt; 0 &lt; y\\\\)","\\\\(y &lt; x &lt; 0\\\\)","\\\\(0 &lt; y &lt; x\\\\)","\\\\(x &lt; y &lt; 0\\\\)"],"correct":3,"verified":true,"src":"M32","review":true,"orig":"images/q-c892a5c1d1.jpg","topic":"M4.17"},{"id":15,"text":"<p>In the given triangle ABC, AB = AC. P is a point of the vertex in the middle. \\\\(\\\\angle P = 50°\\\\), \\\\(\\\\angle ABP = \\\\angle PCB = a\\\\), find \\\\(\\\\angle B\\\\).</p>","image":"images/q-3793bdc4b6.jpg","options":["50","60","70","100","130"],"correct":-1,"verified":false,"src":"M32","orig":"images/q-3793bdc4b6.jpg","review":true},{"id":16,"text":"<p>Find the value of:</p><p>\\\\(45^2 - 55^2 + 1200\\\\)</p>","image":"","options":["200","1000","2000","2200"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-9bac5cc248.jpg","topic":"M2.2"},{"id":17,"text":"<p>A right circular cylinder with a radius of 1 and a height of 1 has a volume that is the same as the volume of a rectangular solid with dimensions.</p>","image":"","options":["\\(1 * \\pi * 2\\)","\\(\\pi * 1 * 3\\)","\\(\\pi * 2 * 2\\)","\\(\\pi * 2 * 3\\)","\\(1 * 1 * \\pi\\)"],"correct":4,"verified":true,"src":"M32","orig":"images/q-baa070a802.jpg","topic":"M5.15"},{"id":18,"text":"<p>ABCD is a square with side 2 cm, A and B are the center of the quarter circles shown in figure. If PH ⊥ AB, then find PH.</p>","image":"images/q-95ac38ed7b.jpg","options":["\\(\\sqrt{2}\\)","\\(\\sqrt{3}/2\\)","\\(\\sqrt{3}\\)","\\(2\\sqrt{3}\\)","\\(\\sqrt{5}\\)"],"correct":-1,"verified":false,"src":"M32","orig":"images/q-95ac38ed7b.jpg","review":true},{"id":19,"text":"<p>What is the average (arithmetic mean) of 6 consecutive even integers if the greatest of them is x?</p>","image":"","options":["\\(x+5\\)","\\(x+6\\)","\\(x-5\\)","\\(x-7\\)","\\(x+8\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-3dbd56aac4.jpg","topic":"M4.15"},{"id":20,"text":"<p>In the given figure, DC = 5 cm, BC = 6 cm, AD = 4 cm, AB = 9 cm what is the possible value of length BD?</p>","image":"images/q-d4f941e284.jpg","options":["4","12","11","7","13"],"correct":3,"verified":true,"src":"M32","orig":"images/q-d4f941e284.jpg","review":true,"topic":"M5.3"},{"id":21,"text":"<p>How many numbers greater than 150 and less than the largest three-digit number are divisible by 9?</p>","image":"","options":["78","83","89","94","100"],"correct":3,"verified":true,"src":"M32","orig":"images/q-5db1f3708a.jpg","topic":"M2.3"},{"id":22,"text":"<p>The total area of the four equal circles in the figure above is 36π, and the circles are all tangent to one another. What is the diameter of the small circle?</p>","image":"images/q-8e24617f70.jpg","options":["\\(6\\sqrt{2}\\)","\\(6 + \\sqrt{2}\\)","\\(3\\sqrt{2} - 3\\)","\\(6\\sqrt{2} - 6\\)","\\(6\\sqrt{2} + 6\\)"],"correct":3,"verified":true,"src":"M32","orig":"images/q-8e24617f70.jpg","review":true,"topic":"M5.15"},{"id":23,"text":"<p>A chemist needs to prepare 200 ml of a 12% salt solution using a 5% solution and a 20% solution.</p><p>How much of each solution should be mixed?</p>","image":"","options":["\\(80\\frac{2}{3}\\) ml of 5% and 120 ml of 20%","100 ml of 5% and 100 ml of 20%","\\(\\frac{320}{3}\\) ml of 5% and \\(93\\frac{1}{3}\\) ml of 20%","\\(80\\frac{2}{3}\\) ml of 5% and \\(90\\frac{3}{4}\\) ml of 20%"],"correct":2,"verified":true,"src":"M32","review":true,"orig":"images/q-df141429bc.jpg","topic":"M3.5"},{"id":24,"text":"<p>Consider a circle defined by the following general equation:</p><p>\\(x^2 + y^2 - 10x + 4y + 20 = 0\\)</p><p>Find the center of the circle.</p>","image":"","options":["\\(x = 5\\) and \\(y = 0\\)","\\(x =- 5\\) and \\(y =- 2\\)","\\(x = 5\\) and \\(y =- 2\\)","\\(x = 2\\) and \\(y =- 5\\)","\\(x = 2\\) and \\(y = 5\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-99d079af2c.jpg","topic":"M5.10"},{"id":25,"text":"<p>Find the angle at A.</p><p>[Diagram: A horizontal ray points right from point A, with angle \\(3x - 6\\) marked at A. A second ray makes an angle of \\(130^\\circ\\) with the horizontal ray on the right side. The two non-horizontal rays cross each other, with \\(8x + 4\\) labeled near the intersection.]</p>","image":"images/q-a615faf8a5.jpg","options":["30","12","24","50","100"],"correct":-1,"verified":false,"src":"M32","orig":"images/q-a615faf8a5.jpg","review":true},{"id":26,"text":"<p>Each minute, a bacteria population doubles. If starting with one bacterium, a container becomes full in 80 minutes, how long would it take to become full if the container started with 4 bacteria?</p>","image":"","options":["78 min","79 min","80 min","82 min","76 mim"],"correct":0,"verified":true,"src":"M32","orig":"images/q-1e419bc05a.jpg","topic":"M3.11"},{"id":27,"text":"<p>At a gourmet fruit market, Alice bought mangoes for $5 each and Bob bought pineapples for $9 each. In total, they spent $96 for 12 fruits. How many mangoes did Alice buy?</p>","image":"","options":["3","4","5","6"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-0bf8cf0b51.jpg","topic":"M4.15"},{"id":28,"text":"<p>If A percent of B is C, the C is what percent of AB?</p>","image":"","options":["100%","\\(AB/C\\) %","\\(C/AB\\) %","1 %","cannot be determined"],"correct":3,"verified":true,"src":"M32","orig":"images/q-4c4c328d9d.jpg","topic":"M2.10"},{"id":29,"text":"<p>Find the largest root of the quadratic equation:</p><p>\\(2x^2 - 5x - 3 = 0\\)</p>","image":"","options":["3","-1","2. 5","3","4. 7"],"correct":0,"verified":true,"src":"M32","orig":"images/q-939cda87e9.jpg","topic":"M4.16"},{"id":30,"text":"<p>Four consecutive integers are such that four times the smallest is three times the largest. What is the largest of these four integers?</p>","image":"","options":["11","12","13","14"],"correct":1,"verified":true,"src":"M32","review":true,"orig":"images/q-dfbd0b6830.jpg","topic":"M4.15"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
