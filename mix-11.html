<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"<p>Simplify the following expression:</p><p>\\(\\left(\\dfrac{4a^{-0.5}b^{4}}{\\sqrt[3]{c^{2}}}\\right)^{3}\\)</p>","image":"","options":["\\(\\dfrac{64b^{12}}{c^{2}a^{1.5}}\\)","\\(\\dfrac{12b^{7}}{a^{1.5}c^{2}}\\)","\\(\\dfrac{64a^{1.5}b^{12}}{c^{2}}\\)","\\(\\dfrac{64b^{12}}{c^{6}a^{-1.5}}\\)"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-eaceef6aaa.jpg","topic":"M4.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в куб каждый множитель; отрицательную степень переносим в знаменатель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4³ = 64.</li><li>(a<sup>−0,5</sup>)³ = a<sup>−1,5</sup> → в знаменатель a<sup>1,5</sup>.</li><li>(b⁴)³ = b¹².</li><li>(∛(c²))³ = c².</li><li>64b¹² / (c²a<sup>1,5</sup>).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 12 вместо 64 и сложение показателей.</li><li>C — a<sup>1,5</sup> в числителе (потеряли минус).</li><li>D — c⁶ и a<sup>−1,5</sup> в знаменателе — то же, что a в числителе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ∛(c²) = c<sup>2⁄3</sup>, в куб → c².</div></div>"},{"id":2,"text":"<p>Let the operation \\(\\odot\\) be defined for all positive real numbers as:</p><p>\\[a \\odot b = \\frac{a+2b}{ab+1}\\]</p><p>Find the value of x such that \\((4 \\odot x) = 1\\)</p>","image":"","options":["1","1.5","2","2.5","3"],"correct":1,"verified":true,"src":"M32","orig":"images/q-48f1f70ef4.jpg","topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем в определение и решаем уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>4 + 2x</span><span>4x + 1</span></span> = 1.</li><li>4 + 2x = 4x + 1 → 2x = 3 → x = 1,5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — при подстановке дробь ≠ 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: <span class=\"fr\"><span>4 + 3</span><span>6 + 1</span></span> = 1 ✓.</div></div>"},{"id":3,"text":"<p>Find the solution set for the following system of inequalities.</p><p>\\(2x^2 + 5x - 3 \\leq 0\\)</p><p>\\(x^2 - 4x + 1 &lt; 0\\)</p>","image":"","options":["\\((2 - \\sqrt{3};\\; 0.5]\\)","\\((2 + \\sqrt{3};\\; 0.5)\\)","\\(x &lt; 2 - \\sqrt{3}\\) and \\(x &gt; 0.5\\)","\\(x &lt; 2 - \\sqrt{3}\\) and \\(x \\geq 0.5\\)"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-18ec724476.jpg","topic":"M4.17","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем каждое неравенство и берём пересечение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² + 5x − 3 = (2x − 1)(x + 3) ≤ 0 → −3 ≤ x ≤ 0,5.</li><li>x² − 4x + 1 < 0 между корнями 2 ± √3 ≈ 0,27 и 3,73.</li><li>Пересечение: 2 − √3 < x ≤ 0,5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 2 + √3 > 0,5, промежуток пуст.</li><li>C, D — «и» несовместимые условия — пусто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скобки: круглая у 2 − √3 (строгое), квадратная у 0,5 (≤).</div></div>"},{"id":4,"text":"<p>The real numbers x and y satisfy the simultaneous equations \\[2x^2 + 4x - 10 - y = 0\\] \\[x^2 - 2x + 6 - y = 0\\] Find the value of \\(\\frac{x}{y}\\) using the coordinate pair (x, y) that contains the largest value of y.</p>","image":"","options":["1/49","\\(- 4/43\\)","4/43","\\(- 6/49\\)"],"correct":1,"verified":true,"src":"M32","review":true,"orig":"images/q-33affc9bb8.jpg","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Оба уравнения задают y — приравниваем их.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² + 4x − 10 = x² − 2x + 6 → x² + 6x − 16 = 0.</li><li>(x + 8)(x − 2) = 0 → x = −8 или 2.</li><li>y = x² − 2x + 6: при x = −8 y = 86; при x = 2 y = 6.</li><li>Наибольший y = 86 → <span class=\"fr\"><span>x</span><span>y</span></span> = <span class=\"fr\"><span>−8</span><span>86</span></span> = <span class=\"fr\"><span>−4</span><span>43</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — потерян минус.</li><li>A, D — неверные y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала определите нужную пару, потом считайте отношение.</div></div>"},{"id":5,"text":"<p>Evaluate:</p><p>\\(\\dfrac{2}{\\sqrt{5}+3} + \\dfrac{2}{\\sqrt{5}-3}\\)</p>","image":"","options":["\\(\\sqrt{5}\\)","\\(-\\sqrt{5}\\)","1","\\(-1\\)","1. 5"],"correct":1,"verified":true,"src":"M32","orig":"images/q-5936512854.jpg","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель — произведение сопряжённых.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√5 + 3)(√5 − 3) = 5 − 9 = −4.</li><li>Числитель: 2(√5 − 3) + 2(√5 + 3) = 4√5.</li><li><span class=\"fr\"><span>4√5</span><span>−4</span></span> = −√5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — потерян минус.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знаменатель отрицательный: 5 − 9.</div></div>","topic":"M2.11"},{"id":6,"text":"<p>Sara had an average score of 88 on her first four tests. She had an average score of 85 on her first five tests. What score did she receive on her fifth test?</p>","image":"","options":["73","75","77","79","81"],"correct":0,"verified":true,"src":"M32","orig":"images/q-70fd1a5a74.jpg","topic":"M2.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем с суммами баллов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 теста: 4 · 88 = 352.</li><li>5 тестов: 5 · 85 = 425.</li><li>Пятый: 425 − 352 = 73.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — неверная разность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средние → суммы → разность.</div></div>"},{"id":7,"text":"<p>In an astrophysics simulation, the gravitational force F between two planets is calculated using the formula: \\(F = \\frac{Gm_1m_2}{r^2}\\)</p><p>If the mass of the first planet is increased by 50%, the mass of the second planet is doubled, and the distance r between them is increased by 25%, what is the resulting percentage change in the gravitational force F?</p>","image":"","options":["It increases by 125%","It increases by 92%","It increases by 140%","It decreases by 8%","It increases by 192%"],"correct":1,"verified":true,"src":"M32","orig":"images/q-557d972e99.jpg","topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">F ∝ <span class=\"fr\"><span>m₁m₂</span><span>r²</span></span>. Перемножаем коэффициенты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m₁ × 1,5; m₂ × 2 → × 3.</li><li>r × 1,25 → r² × 1,5625.</li><li>3 / 1,5625 = 1,92 → рост на 92%.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (192%) — это новое значение.</li><li>A, C — забыли квадрат или сложили.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изменение = коэффициент − 1.</div></div>"},{"id":8,"text":"<p>A secure system uses passwords that are 5 characters long, using only the digits 1, 2, 3, 4, 5, and 6.</p><p>How many different passwords are possible if the following conditions must be met:</p><ol><li>Repetition of digits is allowed.</li><li>The password must start with an even digit.</li><li>The password must end with the digit \"5\".</li></ol>","image":"","options":["1296","648","216","324","432"],"correct":1,"verified":true,"src":"M32","orig":"images/q-551fc1d26b.jpg","topic":"M2.5","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Правило умножения: позиции независимы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1-я цифра чётная: 2, 4, 6 → 3.</li><li>5-я цифра — 5 → 1.</li><li>Три средние — любые: 6³ = 216.</li><li>3 · 216 · 1 = 648.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (1296) — без условия на первую цифру.</li><li>C (216) — забыли первую.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> С повторениями: каждая позиция — все допустимые цифры.</div></div>"},{"id":9,"text":"<p>Find the equation of the line that passes through the following two points:</p><p>\\(A = (\\frac{-2}{3}, 4)\\) and \\(B = (2. \\ 0.5)\\)</p>","image":"","options":["\\(21x + 16y = 50\\)","\\(16x + 21y = 50\\)","\\(21x - 16y = 42\\)","\\(7x + 8y = 25\\)","\\(21x + 16y = 42\\)"],"correct":0,"verified":true,"src":"M32","orig":"images/q-5ec88aee6d.jpg","topic":"M4.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим наклон, затем уравнение и приводим к общему виду.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон = <span class=\"fr\"><span>0,5 − 4</span><span>2 + <span class=\"fr\"><span>2</span><span>3</span></span></span></span> = −3,5 / <span class=\"fr\"><span>8</span><span>3</span></span> = <span class=\"fr\"><span>−21</span><span>16</span></span>.</li><li>y − 0,5 = <span class=\"fr\"><span>−21</span><span>16</span></span> (x − 2) → 16y − 8 = −21x + 42.</li><li>21x + 16y = 50.</li><li>Проверка A(<span class=\"fr\"><span>−2</span><span>3</span></span>; 4): −14 + 64 = 50 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — неверная константа (42).</li><li>B — перепутаны коэффициенты.</li><li>C, D — неверный наклон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте вторую точку — это отсекает почти все неверные варианты.</div></div>"},{"id":10,"text":"<p>In a right triangle XYZ, the legs are XY = 2x - 2 and YZ = \\(\\sqrt{8}x\\). The hypotenuse XZ = 2x + 2. Find the value of x.</p>","image":"","options":["1","2","3","4","5"],"correct":1,"verified":true,"src":"M32","orig":"images/q-088e66d5b2.jpg","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема Пифагора.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2x − 2)² + 8x² = (2x + 2)².</li><li>4x² − 8x + 4 + 8x² = 4x² + 8x + 4 → 8x² = 16x → x = 2.</li><li>Стороны: 2, √32 = 4√2, 6 ✓ (4 + 32 = 36).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (1) — сторона 2x − 2 = 0.</li><li>C, D, E — не выполняется Пифагор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x = 0 отбрасываем — сторона не может быть ≤ 0.</div></div>","topic":"M5.7"},{"id":11,"text":"<p>Simplify the following expression into its simplest form:</p><p>\\(\\dfrac{x^3+9x^2+27x+27}{x^2+6x+9}\\)</p>","image":"","options":["\\(x+1\\)","\\(x+3\\)","\\((x+3)^2\\)","\\(1\\)","\\(x^2+3\\)"],"correct":1,"verified":true,"src":"M32","orig":"images/q-129a991cb8.jpg","topic":"M4.6","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель — куб суммы, знаменатель — квадрат суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x³ + 9x² + 27x + 27 = (x + 3)³.</li><li>x² + 6x + 9 = (x + 3)².</li><li>Частное: x + 3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — перевёрнутое соотношение степеней.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a + b)³ = a³ + 3a²b + 3ab² + b³: коэффициенты 1, 9, 27, 27 при b = 3.</div></div>"},{"id":12,"text":"<p>Let s be the side length of a square and r be the radius of a circle. Suppose both are greater than 1 (1 &lt; s and 1 &lt; r). Consider these statements about their Perimeter and Area:</p><ol><li>If you double the side of a square (2s), its Area becomes four times larger.</li><li>If a circle and a square have the same perimeter, the circle will always have a larger Area.</li><li>A square with a side length of s=4 has a Perimeter equal to its Area.</li></ol><p>Which of these statements are true?</p>","image":"","options":["All three statements","Only statements 1 and 2","Only statements 2 and 3","Only statements 1 and 3","Only statement 1","Only statement 2","Only statement 3","None of the statements"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-f36d0a8b31.jpg","topic":"M3.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: (2s)² = 4s² ✓.</li><li>2: при равном периметре круг всегда имеет наибольшую площадь ✓.</li><li>3: s = 4 → P = 16, S = 16 ✓.</li><li>Все три верны.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Все остальные варианты исключают хотя бы одно верное утверждение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изопериметрическое свойство: круг — максимальная площадь при данном периметре.</div></div>"},{"id":13,"text":"<p>A solid sphere is perfectly inscribed inside a right circular cylinder such that it touches the top, the bottom, and the curved side of the cylinder. The total surface area of the cylinder (including the top and bottom bases) is \\(150\\pi\\) square units.</p><p>What is the volume of the region inside the cylinder but outside the sphere?</p>","image":"","options":["\\(\\dfrac{500}{3\\pi}\\)","\\(\\dfrac{500}{3}\\pi\\)","\\(\\dfrac{250}{3}\\pi\\)","\\(\\dfrac{500}{3\\sqrt{\\pi}}\\)","\\(\\dfrac{550}{3}\\pi\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-9cc1f7de33.jpg","topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанный шар: цилиндр радиуса r и высоты 2r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Полная поверхность цилиндра: 2πr² + 2πr · 2r = 6πr² = 150π → r = 5.</li><li>Цилиндр: π · 25 · 10 = 250π.</li><li>Шар: <span class=\"fr\"><span>4</span><span>3</span></span>π · 125 = <span class=\"fr\"><span>500π</span><span>3</span></span>.</li><li>Разность: 250π − <span class=\"fr\"><span>500π</span><span>3</span></span> = <span class=\"fr\"><span>250π</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — объём шара.</li><li>A, D — π в знаменателе — ошибка формы.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шар занимает ⅔ цилиндра → остаётся ⅓: <span class=\"fr\"><span>250π</span><span>3</span></span>.</div></div>"},{"id":14,"text":"<p>Under which conditions is the expression</p><p>\\(\\dfrac{x(y-x)}{y}\\)</p><p>positive?</p>","image":"","options":["\\(x &lt; 0 &lt; y\\)","\\(y &lt; x &lt; 0\\)","\\(0 &lt; y &lt; x\\)","\\(x &lt; y &lt; 0\\)"],"correct":3,"verified":true,"src":"M32","review":true,"orig":"images/q-c892a5c1d1.jpg","topic":"M4.17","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Анализируем знаки каждого множителя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: x < y < 0 → x < 0; y − x > 0 → числитель < 0.</li><li>y < 0 → отрицательное / отрицательное = положительное ✓.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: x < 0 < y → числитель < 0, y > 0 → отрицательно.</li><li>B: y < x < 0 → y − x < 0, x < 0 → числитель > 0, y < 0 → отрицательно.</li><li>C: 0 < y < x → y − x < 0, числитель < 0, y > 0 → отрицательно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте числа: x = −2, y = −1 → (−2)<span class=\"fr\"><span>1</span><span>−1</span></span> = 2 > 0 ✓.</div></div>"},{"id":15,"text":"<p>In the given triangle ABC, AB = AC. P is a point of the vertex in the middle. \\(\\angle P = 50°\\), \\(\\angle ABP = \\angle PCB = a\\), find \\(\\angle B\\).</p>","image":"images/q-3793bdc4b6.jpg","options":["50","60","70","100","130"],"correct":0,"verified":true,"src":"M32","orig":"images/q-3793bdc4b6.jpg","review":true,"explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол треугольника PBC равен сумме двух несмежных внутренних.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = AC → ∠B = ∠C = β.</li><li>∠PBC = β − a, ∠PCB = a.</li><li>Угол 50° при P — внешний для треугольника PBC: 50° = (β − a) + a = β.</li><li>∠B = 50°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не используют свойство внешнего угла.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = сумма двух внутренних, не смежных с ним.</div></div>","topic":"M5.2"},{"id":16,"text":"<p>Find the value of:</p><p>\\(45^2 - 55^2 + 1200\\)</p>","image":"","options":["200","1000","2000","2200"],"correct":0,"verified":true,"src":"M32","review":true,"orig":"images/q-9bac5cc248.jpg","topic":"M2.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность квадратов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>45² − 55² = (45 − 55)(45 + 55) = −10 · 100 = −1000.</li><li>−1000 + 1200 = 200.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (2200) — потеряли минус.</li><li>B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак: 45 < 55, разность отрицательна.</div></div>"},{"id":17,"text":"<p>A right circular cylinder with a radius of 1 and a height of 1 has a volume that is the same as the volume of a rectangular solid with dimensions.</p>","image":"","options":["\\(1 * \\pi * 2\\)","\\(\\pi * 1 * 3\\)","\\(\\pi * 2 * 2\\)","\\(\\pi * 2 * 3\\)","\\(1 * 1 * \\pi\\)"],"correct":4,"verified":true,"src":"M32","orig":"images/q-baa070a802.jpg","topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём цилиндра π · 1² · 1 = π.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ищем параллелепипед с объёмом π.</li><li>1 · 1 · π = π ✓.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2π), B (3π), C (4π), D (6π) — больше π.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перемножьте измерения каждого варианта.</div></div>"},{"id":18,"text":"<p>ABCD is a square with side 2 cm, A and B are the center of the quarter circles shown in figure. If PH ⊥ AB, then find PH.</p>","image":"images/q-95ac38ed7b.jpg","options":["\\(\\sqrt{2}\\)","\\(\\sqrt{3}/2\\)","\\(\\sqrt{3}\\)","\\(2\\sqrt{3}\\)","\\(\\sqrt{5}\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-95ac38ed7b.jpg","review":true,"explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">P лежит на обеих дугах → PA = PB = радиус 2 = AB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Треугольник PAB равносторонний со стороной 2.</li><li>PH — его высота: <span class=\"fr\"><span>√3</span><span>2</span></span> · 2 = √3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — высота для стороны 1.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точка пересечения двух дуг радиуса AB с центрами A и B — вершина равностороннего треугольника.</div></div>","topic":"M5.7"},{"id":19,"text":"<p>What is the average (arithmetic mean) of 6 consecutive even integers if the greatest of them is x?</p>","image":"","options":["\\(x+5\\)","\\(x+6\\)","\\(x-5\\)","\\(x-7\\)","\\(x+8\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-3dbd56aac4.jpg","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Среднее арифметическое подряд идущих чисел = среднее крайних.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Числа: x − 10, x − 8, …, x.</li><li>Среднее = <span class=\"fr\"><span>x + x − 10</span><span>2</span></span> = x − 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — плюс: x — наибольшее, среднее меньше.</li><li>D — неверный шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У равноотстоящих чисел среднее = среднее первого и последнего.</div></div>"},{"id":20,"text":"<p>In the given figure, DC = 5 cm, BC = 6 cm, AD = 4 cm, AB = 9 cm what is the possible value of length BD?</p>","image":"images/q-d4f941e284.jpg","options":["4","12","11","7","13"],"correct":3,"verified":true,"src":"M32","orig":"images/q-d4f941e284.jpg","review":true,"topic":"M5.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Неравенство треугольника для обоих треугольников с общей стороной BD.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>ABD: 9 − 4 < BD < 9 + 4 → 5 < BD < 13.</li><li>BCD: 6 − 5 < BD < 6 + 5 → 1 < BD < 11.</li><li>Вместе: 5 < BD < 11 → подходит 7.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4) — меньше 5.</li><li>B, C, E — не меньше 11.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая сторона больше разности и меньше суммы двух других.</div></div>"},{"id":21,"text":"<p>How many numbers greater than 150 and less than the largest three-digit number are divisible by 9?</p>","image":"","options":["78","83","89","94","100"],"correct":3,"verified":true,"src":"M32","orig":"images/q-5db1f3708a.jpg","topic":"M2.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем кратные 9 между 150 и 999.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первое: 153 = 9 · 17.</li><li>Последнее: 990 = 9 · 110 (999 не входит — «less than»).</li><li>110 − 17 + 1 = 94.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — ошибки в границах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Количество от a до b включительно: b − a + 1.</div></div>"},{"id":22,"text":"<p>The total area of the four equal circles in the figure above is 36π, and the circles are all tangent to one another. What is the diameter of the small circle?</p>","image":"images/q-8e24617f70.jpg","options":["\\(6\\sqrt{2}\\)","\\(6 + \\sqrt{2}\\)","\\(3\\sqrt{2} - 3\\)","\\(6\\sqrt{2} - 6\\)","\\(6\\sqrt{2} + 6\\)"],"correct":3,"verified":true,"src":"M32","orig":"images/q-8e24617f70.jpg","review":true,"topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центры четырёх больших кругов — квадрат; малый круг в центре.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь одного 9π → r = 3.</li><li>Квадрат центров со стороной 6, диагональ 6√2.</li><li>Диагональ = 2 больших радиуса + диаметр малого: d = 6√2 − 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — радиус, а не диаметр.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагональ проходит через центр малого круга.</div></div>"},{"id":23,"text":"<p>A chemist needs to prepare 200 ml of a 12% salt solution using a 5% solution and a 20% solution.</p><p>How much of each solution should be mixed?</p>","image":"","options":["\\(80\\frac{2}{3}\\) ml of 5% and 120 ml of 20%","100 ml of 5% and 100 ml of 20%","\\(\\frac{320}{3}\\) ml of 5% and \\(93\\frac{1}{3}\\) ml of 20%","\\(80\\frac{2}{3}\\) ml of 5% and \\(90\\frac{3}{4}\\) ml of 20%"],"correct":2,"verified":true,"src":"M32","review":true,"orig":"images/q-df141429bc.jpg","topic":"M3.5","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по количеству соли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x мл 5% и (200 − x) мл 20%.</li><li>0,05x + 0,2(200 − x) = 0,12 · 200 = 24.</li><li>40 − 0,15x = 24 → x = <span class=\"fr\"><span>320</span><span>3</span></span> ≈ 106,7 мл.</li><li>20%: 200 − <span class=\"fr\"><span>320</span><span>3</span></span> = <span class=\"fr\"><span>280</span><span>3</span></span> = 93⅓ мл.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — даёт 12,5%.</li><li>A, D — сумма объёмов не 200.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соль до смешивания = соль после.</div></div>"},{"id":24,"text":"<p>Consider a circle defined by the following general equation:</p><p>\\(x^2 + y^2 - 10x + 4y + 20 = 0\\)</p><p>Find the center of the circle.</p>","image":"","options":["\\(x = 5\\) and \\(y = 0\\)","\\(x =- 5\\) and \\(y =- 2\\)","\\(x = 5\\) and \\(y =- 2\\)","\\(x = 2\\) and \\(y =- 5\\)","\\(x = 2\\) and \\(y = 5\\)"],"correct":2,"verified":true,"src":"M32","orig":"images/q-99d079af2c.jpg","topic":"M5.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделяем полные квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 10x = (x − 5)² − 25.</li><li>y² + 4y = (y + 2)² − 4.</li><li>(x − 5)² + (y + 2)² = 9 → центр (5; −2).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знаки перевёрнуты.</li><li>D, E — перепутаны x и y.</li><li>A — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x − a)² → центр a (знак меняется).</div></div>"},{"id":25,"text":"<p>Find the angle at A.</p><p>[Diagram: A horizontal ray points right from point A, with angle \\(3x - 6\\) marked at A. A second ray makes an angle of \\(130^\\circ\\) with the horizontal ray on the right side. The two non-horizontal rays cross each other, with \\(8x + 4\\) labeled near the intersection.]</p>","image":"images/q-a615faf8a5.jpg","options":["30","12","24","50","100"],"correct":0,"verified":true,"src":"M32","orig":"images/q-a615faf8a5.jpg","review":true,"explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Строим треугольник: угол при A, внутренний угол 180° − 130° и вертикальный угол 8x + 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угол справа: 180° − 130° = 50°.</li><li>Угол в точке пересечения = 8x + 4 (вертикальные углы).</li><li>(3x − 6) + 50 + (8x + 4) = 180 → 11x = 132 → x = 12.</li><li>∠A = 3 · 12 − 6 = 30°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (12) — это x, а не угол.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают угол, а не x — подставьте найденный x.</div></div>","topic":"M5.2"},{"id":26,"text":"<p>Each minute, a bacteria population doubles. If starting with one bacterium, a container becomes full in 80 minutes, how long would it take to become full if the container started with 4 bacteria?</p>","image":"","options":["78 min","79 min","80 min","82 min","76 mim"],"correct":0,"verified":true,"src":"M32","orig":"images/q-1e419bc05a.jpg","topic":"M3.11","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4 бактерии = 2 удвоения от одной.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 → 2 → 4 за 2 минуты.</li><li>Значит, заполнение на 2 минуты раньше: 80 − 2 = 78.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (76) — вычли 4.</li><li>C — без изменений.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удвоение каждую минуту: ×4 = 2 минуты.</div></div>"},{"id":27,"text":"<p>At a gourmet fruit market, Alice bought ass=\"ex-i\">Раскладываем на множители.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² − 5x − 3 = (2x + 1)(x − 3).</li><li>Корни −½ и 3 → наибольший 3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — меньший корень.</li><li>C — сумма корней.</li><li>B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 18 − 15 − 3 = 0 ✓.</div></div>"},{"id":30,"text":"<p>Four consecutive integers are such that four times the smallest is three times the largest. What is the largest of these four integers?</p>","image":"","options":["11","12","13","14"],"correct":1,"verified":true,"src":"M32","review":true,"orig":"images/q-dfbd0b6830.jpg","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре подряд: n, n + 1, n + 2, n + 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4n = 3(n + 3) → n = 9.</li><li>Наибольшее: 12.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — не удовлетворяют 4n = 3(n + 3).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 4 · 9 = 36 = 3 · 12 ✓.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
