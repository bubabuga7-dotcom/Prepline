<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2020 · original Q10 · Drawing a conclusion</p>", "image": "images/ct-pp/ct088_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Беспилотники почти готовы, а законы об ответственности отстают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужны новые законы, кто отвечает за аварии беспилотников. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — «невозможно» — слишком сильно.</li><li>A, B, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод из поставленной проблемы.</div></div>"}, {"id": 2, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q1 · Principle</p>", "image": "images/ct-pp/ct088_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Комитет следует только логике листа ожидания — медицинской срочности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Решения о пересадке — по медицинской потребности. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не про эмоции.</li><li>C, E — не сказано.</li><li>D — противоположно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что было основанием решения.</div></div>"}, {"id": 3, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q2 · Flaw</p>", "image": "images/ct-pp/ct088_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кто много гуляет — с высокой самооценкой → гуляйте.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Причина может быть обратной: уверенные люди охотнее выходят на улицу. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 4, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q3 · Main conclusion</p>", "image": "images/ct-pp/ct088_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Слава, нагрузка, разочарования вредят детям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: юным артистам нужна дополнительная защита законом. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — доводы.</li><li>E — фон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «These factors would indicate» — вывод.</div></div>"}, {"id": 5, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q4 · Parallel reasoning</p>", "image": "images/ct-pp/ct088_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всем из нашей школы — место; ты не из нашей → место не гарантировано.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: всем старше 60 — проездной; ты младше → бесплатного проезда нет. Та же структура. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — обращение условия.</li><li>C — прямое применение.</li><li>D, E — необходимое условие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Достаточное условие + «не в группе».</div></div>"}, {"id": 6, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q5 · Assumption</p>", "image": "images/ct-pp/ct088_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Хлеб выбрасывают чаще всего → мы его меньше ценим.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: выбрасываем то, что мало ценим. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — альтернативная причина.</li><li>B, C, D — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Звено «отходы → ценность».</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct088_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">10% + 20% + 40% = 70% → остальные 30% = 6 + 27 = 33 кошки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>33 : 0,3 = 110. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — только остаток.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите долю известного числа.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct088_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6 мужчин делят женщин на 6 групп.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В каждой группе рядом с мужчиной максимум 2 женщины (по краям) → максимум 12.</li><li>14 − 12 = 2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не оптимальная рассадка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый мужчина «прикрывает» максимум двух соседок.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct088_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Один дизайн, без блёсток, двойной сгиб, 35 открыток.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Религиозные: 7 пачек · 1,80 = 12,60 £.</li><li>Дед Мороз: 4 пачки · 3,10 = 12,40 £. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — одинарные (не подходят).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Округляйте пачки вверх.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct088_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«20:50» вверх ногами — это 05:02.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>+1 ч 30 мин = 06:32.</li><li>Перевёрнутые 06:32 → «2Ɛ:90». Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный переворот 3 или 6.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переворот: обратный порядок + каждая цифра.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2021 · original Q10 · Problem solving</p>", "image": "images/ct-pp/ct088_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Табличка крутится → буквы должны быть симметричны слева-направо.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>HAWAII: H, A, W, I — все симметричны. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>L, B, D, N, K — несимметричны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте каждую букву.</div></div>"}, {"id": 12, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q1 · Main conclusion</p>", "image": "images/ct-pp/ct088_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лечение не снижает распространённость.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: депрессия останется серьёзной трудноразрешимой проблемой. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После двоеточия — тезис.</div></div>"}, {"id": 13, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q2 · Assumption</p>", "image": "images/ct-pp/ct088_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Школы не должны навязывать идеологию → учить научному атеизму.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: научный атеизм — не идеология. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Иначе вывод противоречит посылке.</div></div>"}, {"id": 14, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q3 · Flaw</p>", "image": "images/ct-pp/ct088_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все успешные уверены в себе → уверенность ведёт к успеху.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Может быть наоборот: успех рождает уверенность. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — тоже слабость, но не главная.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 15, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q4 · Parallel reasoning</p>", "image": "images/ct-pp/ct088_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">X требует Y; у Z нет Y → Z не X.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: эмоция требует содержания; у депрессии его нет → не эмоция. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — обращение условия.</li><li>B, C, D — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Необходимое условие отсутствует.</div></div>"}, {"id": 16, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q5 · Principle</p>", "image": "images/ct-pp/ct088_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кто одобряет убийство (мясо), должен знать, как это происходит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: сторонники смертной казни должны узнать, как она проводится. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — другие обязанности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одобряешь — узнай подробности.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct088_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего 102 кг; яблоки = 2 · лаймы → яблоки + лаймы делятся на 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Апельсины 24: 78 → лаймы 26 = 8 + 18, яблоки 52 = 13 + 17 + 22. ✔</li><li>Другие варианты не делятся на 3 или не раскладываются. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D, E — сумма не делится на 3.</li><li>C — 28 не набрать.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала делимость.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct088_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Взаимных визитов нет → каждой паре — максимум 1 визит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пар C(10,2) = 45; визитов 10k ≤ 45 → k ≤ 4. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 50 визитов > 45.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте пары.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct088_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужен приоритет; берём маленькую сумку 40 × 30 × 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>WassAir: 59 + 15 = 74 $ — сумка влезает в 50 × 40 × 23.</li><li>BritAir 78, TowAir 77, MistAir 80; EasAir без приоритета. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Большая сумка дороже везде.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возьмите меньшую сумку.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct088_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рост: окурки +56%, бутылки +498%, соломинки +201%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Соотношение ≈ 1 : 9 : 3,6 — график A. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — абсолютные числа или порядок.</li><li>D — окурки слишком высокие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент роста, а не количество.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2022 · original Q10 · Problem solving</p>", "image": "images/ct-pp/ct088_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">72 клетки; датчик покрывает «крестик» из 5 клеток.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минимум не меньше 72 : 5 → 15; точный перебор даёт 18 (варианта 18 нет).</li><li>Значит, 6, 10 и 16 невозможны; наименьший возможный вариант — 20. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — меньше нижней границы.</li><li>E — больше, чем нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нижняя граница отсекает малые ответы.</div></div>"}, {"id": 31, "topic": "CON", "text": "Seeds of the steppe tulip will only sprout after they have spent several weeks at a temperature below 5°C. In greenhouses kept above 10°C all year round, no steppe tulip has ever grown from seed.<br><br><b>Which one of the following conclusions can be reliably drawn from the above passage?</b>", "image": "", "options": ["Any seed kept below 5°C for several weeks will sprout.", "Steppe tulips cannot be grown in greenhouses.", "Steppe tulips only flower in winter.", "Cold winters are harmful to most plants.", "A steppe tulip seed that has never been colder than 10°C will not sprout."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Холод ниже 5°C — необходимое условие прорастания.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Семя, которое никогда не было холоднее 10°C, этого условия не получило → не прорастёт. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — путает необходимое и достаточное условие.</li><li>B — тюльпаны можно вырастить не из семян.</li><li>C, D — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Только если» задаёт необходимое условие, а не достаточное.</div></div>", "src": "PL"}, {"id": 32, "topic": "PS", "text": "The mean age of four brothers is 15. When their father is included, the mean age of the five of them is 20.<br><br><b>How old is the father?</b>", "image": "", "options": ["20", "35", "40", "45", "100"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работайте с суммами, а не средними.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма братьев 4 · 15 = 60, всех пятерых 5 · 20 = 100.</li><li>Отец: 100 − 60 = 40. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 20 + 15.</li><li>E — общая сумма.</li><li>A — среднее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее × количество = сумма.</div></div>", "src": "PL"}, {"id": 33, "topic": "WKN", "text": "A new phone app claims to improve sleep. In a trial, 80% of people who used the app for a month said they slept better at the end of the month than at the start. The app must therefore be effective.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "image": "", "options": ["The trial began during the exam period and ended after the exams were over.", "The app plays relaxing sounds at night.", "Sleeping well improves concentration.", "The app was designed with the help of doctors.", "The app is free to download."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет контрольной группы: сон мог улучшиться и без приложения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конец экзаменов — другая причина лучшего сна. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — скорее усиливают.</li><li>C, E — не связаны с эффективностью.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Без сравнения с теми, кто не пользовался, причинный вывод слаб.</div></div>", "src": "PL"}, {"id": 34, "topic": "PS", "text": "A train leaves Astana at 22:40 and arrives in Almaty at 13:15 the next day. Both cities use the same time zone.<br><br><b>How long does the journey take?</b>", "image": "", "options": ["9 h 25 min", "13 h 35 min", "14 h 25 min", "14 h 35 min", "15 h 35 min"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разбейте на части до полуночи и после.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>22:40 → 00:00 = 1 ч 20 мин; 00:00 → 13:15 = 13 ч 15 мин.</li><li>Итого 14 ч 35 мин. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли 13:15 из 22:40.</li><li>C — ошибка с минутами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Через полночь считайте двумя частями.</div></div>", "src": "PL"}, {"id": 35, "topic": "CON", "text": "Every member of the school chess club also belongs to the maths club. Some members of the maths club are in the debating team. Dias is a member of the chess club.<br><br><b>Which one of the following conclusions can be reliably drawn from the above passage?</b>", "image": "", "options": ["Dias is in the debating team.", "Dias belongs to the maths club.", "Some members of the chess club are in the debating team.", "Every member of the maths club plays chess.", "Nobody in the debating team plays chess."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шахматы ⊂ математика.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диас в шахматном клубе → он и в математическом. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — «некоторые» из математиков могут быть не шахматистами.</li><li>D — обращение.</li><li>E — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуйте круги Эйлера.</div></div>", "src": "PL"}, {"id": 36, "topic": "STR", "text": "The city should plant trees along Respublika Avenue to reduce the amount of dust that reaches nearby flats. The leaves of trees trap dust from the air.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "image": "", "options": ["Trees along roads need watering in summer.", "Some residents do not want trees blocking their view.", "On streets where trees were planted, dust in nearby flats fell, while on similar streets without new trees it did not change.", "Dust in the air can cause breathing problems.", "Most trees lose their leaves in winter."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно доказательство, что деревья реально уменьшают пыль в квартирах.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сравнение с похожими улицами без деревьев показывает эффект. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — ослабляет.</li><li>D — объясняет вред пыли, но не эффект деревьев.</li><li>A, B — не о пыли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Лучшее усиление — данные «до/после» с контрольной группой.</div></div>", "src": "PL"}, {"id": 37, "topic": "PS", "text": "In a class of 30 students, 18 study French, 15 study German and 5 study neither language.<br><br><b>How many students study both languages?</b>", "image": "", "options": ["3", "5", "8", "10", "13"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Хотя бы один язык изучают 30 − 5 = 25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18 + 15 − 25 = 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли про 5 «ни одного».</li><li>E — 18 − 5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Круги Эйлера: сумма − пересечение = объединение.</div></div>", "src": "PL"}, {"id": 38, "topic": "ASM", "text": "Reading on paper is better for learning than reading on a screen. In one study, students who read a text on paper remembered more of it a week later than students who read the same text on a tablet.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "image": "", "options": ["Printed books are more expensive than electronic books.", "The students enjoyed reading on paper more than reading on a tablet.", "Every student who read on paper remembered more than every student who read on a tablet.", "The two groups of students were similar in their ability to remember what they read.", "Schools should stop using tablets for teaching."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод о формате верен, только если группы были сравнимы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в «бумажной» группе были ученики с лучшей памятью, разница объясняется ими, а не бумагой. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — не связаны с выводом.</li><li>C — слишком сильно: хватит разницы в среднем.</li><li>E — это следствие, а не допущение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В исследованиях часто скрыто допущение «группы одинаковы».</div></div>", "src": "PL"}, {"id": 39, "topic": "PS", "text": "A recipe uses flour and sugar in the ratio 5 : 2 by weight. Dana has 600 g of flour and 200 g of sugar.<br><br><b>What is the greatest total weight of flour and sugar she can use while keeping to the recipe's ratio?</b>", "image": "", "options": ["560 g", "600 g", "700 g", "800 g", "840 g"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверьте, что закончится первым.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Для 600 г муки нужно 240 г сахара — его не хватает.</li><li>Сахар 200 г → мука 500 г → всего 700 г. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сахара не хватит.</li><li>D — всё подряд, без пропорции.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ограничивает тот ингредиент, которого меньше относительно пропорции.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1260, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1260, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
