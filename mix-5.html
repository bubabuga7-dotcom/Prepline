<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"text": "A brother and sister share 5000 stamps in the ratio 5 : 3. The brother then shares his stamps with two friends in the ratio 3 : 1 : 1, keeping the largest share himself. How many stamps does each friend receive?", "options": ["525", "585", "625", "825", "1250"], "correct": 2, "src": "M12", "id": 1, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два деления по пропорции подряд.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 + 3 = 8 частей → брату <span class=\"fr\"><span>5</span><span>8</span></span> · 5000 = 3125.</li><li>Брат делит 3 : 1 : 1 → 5 частей по 3125 ÷ 5 = 625.</li><li>Каждый друг получает 1 часть = 625.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (1250) — 2 части.</li><li>A, B, D — ошибки в первой пропорции.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При повторном делении базой служит доля брата, а не все 5000.</div></div>"}, {"text": "Simplify: (x² − 16)/√(x − 4)", "options": ["(x + 4)√(x − 4)", "(x − 4)√(x − 4)", "√x + 4", "√x − 4", "x√(x + 4)"], "correct": 0, "src": "M11", "id": 2, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель — разность квадратов; <span class=\"fr\"><span>x − 4</span><span>√</span></span>(x − 4) = √(x − 4).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 16 = (x − 4)(x + 4).</li><li><span class=\"fr\"><span>x − 4</span><span>√</span></span>(x − 4) = √(x − 4).</li><li>Итого: (x + 4)√(x − 4).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сократили не тот множитель.</li><li>C, D, E — неверное обращение с корнем.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>a</span><span>√a</span></span> = √a.</div></div>"}, {"text": "The lowest common multiple of {36, 48, 60} is", "options": ["360", "480", "540", "720", "960"], "correct": 3, "src": "M10", "id": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК = произведение максимальных степеней простых множителей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>36 = 2² · 3²; 48 = 2⁴ · 3; 60 = 2² · 3 · 5.</li><li>Максимальные степени: 2⁴, 3², 5.</li><li>16 · 9 · 5 = 720.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (360) — взяли 2³.</li><li>B, C, E — не делятся на все три числа (например, 480 не делится на 36).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 720 ÷ 36 = 20, ÷ 48 = 15, ÷ 60 = 12 ✓.</div></div>"}, {"text": "What is the inverse function of y = −3x + 12?", "options": ["y = −3x + 12", "y = −x/3 + 12", "y = −x/3 + 4", "y = −3x + 4"], "correct": 2, "src": "M12", "id": 4, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратная функция: меняем x и y местами и выражаем y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = −3y + 12.</li><li>3y = 12 − x → y = 4 − <span class=\"fr\"><span>x</span><span>3</span></span> = <span class=\"fr\"><span>−x</span><span>3</span></span> + 4.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — исходная функция.</li><li>B — забыли разделить 12 на 3.</li><li>D — неверный коэффициент.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: f(0) = 12, обратная f⁻¹(12) = −4 + 4 = 0 ✓.</div></div>"}, {"text": "Solve the inequalities: x + 2 ≤ 5 + 3x ≤ 2x + 7", "options": ["−1.5 ≤ x ≤ −2", "−1.5 ≤ x ≤ 2", "1.5 ≤ x ≤ 2", "1.5 ≤ x ≤ −2", "−2.5 ≤ x ≤ 3"], "correct": 1, "src": "M11", "id": 5, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Двойное неравенство — решаем каждую часть отдельно и берём пересечение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 2 ≤ 5 + 3x → −3 ≤ 2x → x ≥ −1,5.</li><li>5 + 3x ≤ 2x + 7 → x ≤ 2.</li><li>Итого: −1,5 ≤ x ≤ 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — пустые промежутки (левый конец больше правого).</li><li>C — неверный знак.</li><li>E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Промежуток вида 1,5 ≤ x ≤ −2 пуст — такие варианты сразу отбрасывайте.</div></div>"}, {"text": "The diagonal of a cube is a cm. What is the volume of the cube, in cm³?", "options": ["a³/3", "√3·a³/3", "a³/(3√3)", "2a²/(3√3)", "a³"], "correct": 2, "src": "M10", "id": 6, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пространственная диагональ куба = s√3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s√3 = a → s = <span class=\"fr\"><span>a</span><span>√3</span></span>.</li><li>V = s³ = <span class=\"fr\"><span>a³</span><span>√3</span></span>³ = <span class=\"fr\"><span>a³</span><span>3√3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — (√3)³ = 3√3, а не 3.</li><li>B — неверное упрощение.</li><li>D — это не объём (степень a²).</li><li>E — диагональ ≠ сторона.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (√3)³ = 3√3.</div></div>"}, {"text": "Given A ∝ 1/B², B is increased by 40%. What is the percentage change in A?", "options": ["Decrease of 29%", "Decrease of 44%", "Decrease of 49%", "Decrease of 51%", "Decrease of 80%", "Decrease of 96%"], "correct": 2, "src": "M8", "id": 7, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">A обратно пропорционально B²: при B × 1,4 A умножается на <span class=\"fr\"><span>1</span><span>1,4²</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,4² = 1,96.</li><li><span class=\"fr\"><span>1</span><span>1,96</span></span> ≈ 0,51.</li><li>Уменьшение ≈ 49%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (29%) — <span class=\"fr\"><span>1</span><span>1,4</span></span> без квадрата.</li><li>D (51%) — это новое значение, а не изменение.</li><li>B, E, F — ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Изменение» = 1 − новый множитель.</div></div>"}, {"text": "A dodecagon is a polygon with 12 sides. The sum of all the interior angles of a regular dodecagon is", "options": ["1780°", "1800°", "1620°", "1980°", "1820°"], "correct": 1, "src": "M10", "id": 9, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма углов n-угольника (n − 2) · 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(12 − 2) · 180° = 1800°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1620°) — взяли n = 11.</li><li>D (1980°) — n = 13.</li><li>A, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая добавленная сторона +180°.</div></div>"}, {"text": "Simplify: 60/∛0.064", "options": ["√2", "150", "105", "1500", "50"], "correct": 1, "src": "M10", "id": 10, "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,064 — это куб числа 0,4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,4³ = 0,064 → ∛0,064 = 0,4.</li><li>60 ÷ 0,4 = 150.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (1500) — ∛0,064 = 0,04 (ошибка с запятой).</li><li>C, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Кубы: 4³ = 64 → 0,4³ = 0,064.</div></div>"}, {"text": "The solution of the inequality x² + 5x − 14 ≤ 0 is", "options": ["[−2, 7]", "[−7, 2]", "(−7, 2)", "[2, 7)", "(−2, 7]"], "correct": 1, "src": "M12", "id": 11, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем на множители: (x + 7)(x − 2) ≤ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Корни −7 и 2.</li><li>Ветви вверх → ≤ 0 между корнями.</li><li>Концы включены (≤): [−7; 2].</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — круглые скобки: концы не включены.</li><li>A, E — неверные корни (знаки).</li><li>D — не тот промежуток.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадратные скобки — точка входит, круглые — нет.</div></div>"}, {"text": "y = 1 + √((x + 3)/x). Make x the subject.", "options": ["x = 3/(y(y−2))", "x = 3/(y−1)²", "x = 3/(y(y+2))", "x = y(y−2)/3", "x = (y−2)²/3"], "correct": 0, "src": "M12", "id": 12, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем корень, возводим в квадрат, выражаем x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y − 1 = √<span class=\"fr\"><span>x + 3</span><span>x</span></span>.</li><li>(y − 1)² = <span class=\"fr\"><span>x + 3</span><span>x</span></span> = 1 + <span class=\"fr\"><span>3</span><span>x</span></span>.</li><li><span class=\"fr\"><span>3</span><span>x</span></span> = (y − 1)² − 1 = y² − 2y = y(y − 2).</li><li>x = <span class=\"fr\"><span>3</span><span>y(y − 2)</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли вычесть 1.</li><li>C — неверный знак.</li><li>D, E — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>x + 3</span><span>x</span></span> = 1 + <span class=\"fr\"><span>3</span><span>x</span></span> — разбейте дробь, чтобы x был только в одном месте.</div></div>"}, {"text": "The sum of six consecutive odd numbers is 60. What is the smallest of them?", "options": ["1", "2", "3", "4", "5"], "correct": 4, "src": "M12", "id": 13, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шесть подряд нечётных: a, a + 2, …, a + 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма: 6a + (0 + 2 + 4 + 6 + 8 + 10) = 6a + 30.</li><li>6a + 30 = 60 → a = 5.</li><li>5 + 7 + 9 + 11 + 13 + 15 = 60 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — чётные числа.</li><li>A, C — сумма не 60.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее = <span class=\"fr\"><span>60</span><span>6</span></span> = 10 → числа симметричны вокруг 10: 5 … 15.</div></div>"}, {"text": "Five bells start ringing together, at intervals of 3, 6, 9, 12 and 15 seconds. How many times in 60 minutes do they ring together?", "options": ["10 times", "20 times", "30 times", "40 times", "50 times"], "correct": 1, "src": "M11", "id": 14, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Колокола звонят вместе через НОК интервалов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОК(3, 6, 9, 12, 15) = 180 с = 3 мин.</li><li>60 ÷ 3 = 20 раз.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — НОК 6 мин.</li><li>C, D, E — неверный НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> НОК(9, 12, 15) = 180 — остальные (3, 6) уже делят его.</div></div>"}, {"text": "A prize fund of KZT 1 200 000 was shared between first, second and third place in the ratio 12 : 5 : 3. How much did second place receive?", "options": ["KZT 240000", "KZT 300000", "KZT 336000", "KZT 180000", "KZT 150000"], "correct": 1, "src": "M10", "id": 15, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20 частей, второе место — 5 частей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 200 000 ÷ 20 = 60 000.</li><li>5 · 60 000 = 300 000.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (180 000) — третье место.</li><li>A, C, E — ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите одну часть, затем умножьте.</div></div>"}, {"text": "The area of isosceles triangle ABC is 48 cm² and the base BC is 12 cm. Find sin B.", "options": ["4/5", "3/5", "2/3", "5/6"], "correct": 0, "src": "M8", "id": 16, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота равнобедренного треугольника к основанию делит его пополам — получаем прямоугольный треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = ½ · 12 · h = 48 → h = 8.</li><li>Половина основания 6 → AB = √(6² + 8²) = 10.</li><li>sin B = <span class=\"fr\"><span>h</span><span>AB</span></span> = <span class=\"fr\"><span>8</span><span>10</span></span> = <span class=\"fr\"><span>4</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B <span class=\"fr\"><span>3</span><span>5</span></span> — это cos B.</li><li>C, D — неверные стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6-8-10 = удвоенный 3-4-5.</div></div>"}, {"text": "Through how many degrees does the hour hand turn between noon and 16:30 on the same day?", "options": ["150°", "120°", "75°", "90°", "135°"], "correct": 4, "src": "M8", "id": 17, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">30° в час.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12:00 → 16:30 = 4,5 ч.</li><li>4,5 · 30° = 135°.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (150°) — 5 часов.</li><li>B (120°) — 4 часа без получаса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте дробную часть часа.</div></div>"}, {"text": "f(x) = x² − 4 and g(x) = (x + 1)². Describe the transformation of the graph of f(x) that produces the graph of g(x).", "options": ["Translate 1 right, then 4 down", "Translate 1 left, then 4 up", "Translate 4 right, then 1 up", "Translate 1 left, then 4 down", "Translate 1 right, then 4 up"], "correct": 1, "src": "M12", "id": 18, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем g через f: g(x) = f(x + 1) + 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(x + 1) = (x + 1)² − 4.</li><li>Чтобы получить (x + 1)², добавляем 4: g(x) = f(x + 1) + 4.</li><li>x → x + 1 сдвигает график на 1 влево; +4 — вверх.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — x + 1 сдвигает влево, а не вправо.</li><li>D — вниз вместо вверх.</li><li>C — перепутаны числа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> f(x + a) — сдвиг на a <b>влево</b> (против интуиции).</div></div>"}, {"text": "Increasing the speed by 4 km/h on a journey of 32 km reduces the time by 4 hours. What was the original speed?", "options": ["2 km/h", "4 km/h", "6 km/h", "8 km/h", "10 km/h"], "correct": 1, "src": "M11", "id": 19, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разница во времени: <span class=\"fr\"><span>32</span><span>v</span></span> − <span class=\"fr\"><span>32</span><span>v + 4</span></span> = 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>32(v + 4) − 32v = 4v(v + 4).</li><li>128 = 4v(v + 4) → v(v + 4) = 32.</li><li>v² + 4v − 32 = 0 → (v + 8)(v − 4) = 0 → v = 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не проходят проверку: при v = 4 время 8 ч, при 8 км/ч — 4 ч, разница 4 ✓.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставить варианты здесь быстрее, чем решать уравнение.</div></div>"}, {"text": "x and y are integers with x + y < 11 and x > 6. What is the smallest possible value of x − y?", "options": ["-2", "4", "1", "-4", "2"], "correct": 1, "src": "M8", "id": 20, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чтобы x − y было наименьшим, берём x как можно меньше, y как можно больше (по условиям x > 6, x + y < 11).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x > 6 → наименьшее целое x = 7.</li><li>x + y < 11 → y ≤ 10 − x = 3.</li><li>x − y = 7 − 3 = 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — требуют x ≤ 6.</li><li>C, E — y должен быть больше 3, а это нарушает x + y < 11.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для минимума разности: уменьшаемое — минимум, вычитаемое — максимум.</div></div>"}, {"text": "If xy² = 4, what is (x³y⁴ − x²y²)/(x²y²)?", "options": ["3", "7", "4", "8", "11"], "correct": 0, "src": "M10", "id": 21, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим каждое слагаемое числителя на знаменатель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>x³y⁴</span><span>x²y²</span></span> = xy².</li><li><span class=\"fr\"><span>x²y²</span><span>x²y²</span></span> = 1.</li><li>xy² − 1 = 4 − 1 = 3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (4) — забыли −1.</li><li>B, D, E — неверное сокращение степеней.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбивайте дробь на отдельные слагаемые.</div></div>"}, {"text": "T = kx/y. Find the percentage change in T if k, x and y are all increased by 20%.", "options": ["0.2%", "2%", "20%", "22%", "40%"], "correct": 2, "src": "M11", "id": 22, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем множители изменений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>T' = (1,2k)<span class=\"fr\"><span>1,2x</span><span>1,2y</span></span> = 1,2 · <span class=\"fr\"><span>kx</span><span>y</span></span>.</li><li>Рост на 20%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (40%) — не учли деление на y.</li><li>A, B, D — ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Множитель в знаменателе делит результат.</div></div>"}, {"text": "The surface area of a sphere is numerically equal to three times its volume. What is the diameter of the sphere?", "options": ["9", "2", "18", "6", "3"], "correct": 1, "src": "M10", "id": 23, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поверхность = 3 · объём.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4πr² = 3 · <span class=\"fr\"><span>4</span><span>3</span></span>πr³ = 4πr³.</li><li>r = 1 → диаметр 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (3) — это ответ при S = V.</li><li>D (6) — диаметр для S = V.</li><li>A, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают диаметр, а не радиус.</div></div>"}, {"text": "m and n are positive integers with m/n = 2/3. Which pair could NOT be the values of m and n?", "options": ["12 and 18", "102 and 153", "7 and 21", "60 and 90", "34 and 51"], "correct": 2, "src": "M10", "id": 24, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем, какая пара сокращается до <span class=\"fr\"><span>2</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>12</span><span>18</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>; <span class=\"fr\"><span>102</span><span>153</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>; <span class=\"fr\"><span>60</span><span>90</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>; <span class=\"fr\"><span>34</span><span>51</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>.</li><li><span class=\"fr\"><span>7</span><span>21</span></span> = <span class=\"fr\"><span>1</span><span>3</span></span> ≠ <span class=\"fr\"><span>2</span><span>3</span></span> → C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — все равны <span class=\"fr\"><span>2</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно проверять перекрёстно: 3m = 2n.</div></div>"}, {"text": "For which values of k does the equation kx² − 4x + k = 0 have real roots?", "options": ["−2 < k < 2", "−2 ≤ k ≤ 2", "k ≤ 2", "k ≥ −2", "−4 ≤ k ≤ 4"], "correct": 1, "src": "M10", "id": 25, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Действительные корни ⇔ дискриминант ≥ 0 (и отдельно проверяем k = 0).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D = 16 − 4k² ≥ 0 → k² ≤ 4 → −2 ≤ k ≤ 2.</li><li>При k = 0: −4x = 0 → x = 0 — тоже действительный корень ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — строгие знаки исключают k = ±2, где корень двойной.</li><li>C, D — только одна граница.</li><li>E — неверный D.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> D = 0 — один (двойной) корень, но он действительный.</div></div>"}, {"text": "The volume of water increases by 9% when it freezes. How much water is needed to make a piece of ice of volume 40 cm³?", "options": ["36.7 cm³", "40.0 cm³", "38.2 cm³", "38.0 cm³", "37.0 cm³"], "correct": 0, "src": "M10", "id": 26, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лёд = 109% объёма воды.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,09 · W = 40.</li><li>W = 40 ÷ 1,09 ≈ 36,7 см³.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (37,0) — вычли 9% от 40 (≈ 36,4… неверно).</li><li>B, C, D — неверная база.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент считается от воды, а не ото льда.</div></div>"}, {"text": "Ima divided a number by 40 instead of by 8. What should she do to obtain the correct answer?", "options": ["Divide by 40", "Divide by 8", "Multiply by 5", "Multiply by 320", "Divide by 5"], "correct": 2, "src": "M12", "id": 27, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем <span class=\"fr\"><span>x</span><span>40</span></span> и <span class=\"fr\"><span>x</span><span>8</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40 = 5 · 8 → <span class=\"fr\"><span>x</span><span>40</span></span> в 5 раз меньше <span class=\"fr\"><span>x</span><span>8</span></span>.</li><li>Нужно умножить на 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — делить на 5 — уменьшит ещё.</li><li>A, B — неверно.</li><li>D — слишком много.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка на числе: x = 40 → получила 1, нужно 5.</div></div>"}, {"text": "The cube root of the square root of a number is 3. The number is", "options": ["27", "128", "256", "81", "729"], "correct": 4, "src": "M10", "id": 28, "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∛(√n) = n<sup>1⁄6</sup>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n<sup>1⁄6</sup> = 3 → n = 3⁶ = 729.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (27) — 3³.</li><li>D (81) — 3⁴.</li><li>B, C — степени двойки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корни перемножают показатели: ½ · ⅓ = <span class=\"fr\"><span>1</span><span>6</span></span>.</div></div>"}, {"text": "The two shorter sides of a right-angled triangle are in the ratio 1 : 2 and the area is 25. What is the hypotenuse?", "options": ["5√5", "10√5", "5√3", "10", "10√3"], "correct": 0, "src": "M10", "id": 29, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Катеты a и 2a; площадь ½ · a · 2a = a².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a² = 25 → a = 5, катеты 5 и 10.</li><li>Гипотенуза √(25 + 100) = √125 = 5√5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — удвоили.</li><li>D — сложили катеты.</li><li>C, E — √3 из другой формулы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √125 = √(25 · 5) = 5√5.</div></div>"}, {"text": "A solid cube of side 3 cm is cut in half. What is the surface area of each half?", "options": ["9 cm²", "18 cm²", "27 cm²", "36 cm²", "54 cm²"], "correct": 3, "src": "M11", "id": 30, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Половина куба — прямоугольный параллелепипед 3 × 3 × 1,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Две грани 3 × 3: 18.</li><li>Четыре грани 3 × 1,5: 18.</li><li>Итого 36 см².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (27) — половина поверхности куба <span class=\"fr\"><span>54</span><span>2</span></span>, без новой грани.</li><li>E (54) — поверхность целого куба.</li><li>A, B — неполный учёт граней.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разрез добавляет новую грань.</div></div>"}, {"id": 31, "topic": "M2.9", "text": "<p>Write 0.\\(\\dot{8}\\) as a fraction in its simplest form.</p>", "image": "", "options": ["\\(\\dfrac{8}{99}\\)", "\\(\\dfrac{4}{45}\\)", "\\(\\dfrac{4}{5}\\)", "\\(\\dfrac{8}{9}\\)", "\\(\\dfrac{9}{10}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножьте на 10ⁿ (n — длина периода) и вычтите.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 0,888…, 10x = 8,88…</li><li>9x = 8 → x = <span class=\"fr\"><span>8</span><span>9</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это 0,0808…</li><li>B — это 0,088…</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период из k цифр → знаменатель из k девяток.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  var opts = {delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}], throwOnError: false};
  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){
    render(document.body);
    new MutationObserver(function(ms){
      var done = [];
      for (var i = 0; i < ms.length; i++) {
        var t = ms[i].target;
        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
      }
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
