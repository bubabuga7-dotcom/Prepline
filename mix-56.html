<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m121_q01.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскроем 4 произведения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√40·√10 = 20; √40·√8 = √320 = 8√5.</li><li>−√5·√10 = −5√2; −√5·√8 = −2√10.</li><li>20 + 8√5 − 5√2 − 2√10. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — перепутаны корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Упрощайте каждый корень.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m121_q02.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">√(x² − 5) = y − 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 5 = y² − 8y + 16 → x² = y² − 8y + 21.</li><li>x = ±√(y² − 8y + 21). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли +5 к 16.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возведите в квадрат и перенесите.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m121_q03.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставим точки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9 + 3p + q = 2; 4 + 2p + q = 1 → p = −4, q = 5.</li><li>p + 4q = −4 + 20 = 16. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите уравнения.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m121_q04.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель x²(x − 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3x(x − 2) + (x − 2) + 2x² = 5x² − 5x − 2. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без 2x².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Домножайте каждую дробь.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m121_q05.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">R = <span class=\"fr\"><span>a</span><span>√3</span></span> — треугольник равносторонний.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь = <span class=\"fr\"><span>√3</span><span>4</span></span>a². Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без деления на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формула для равностороннего.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m121_q06.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">25^{<span class=\"fr\"><span>3</span><span>2</span></span>} = 125 → 5ⁿ = 625 → n = 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9<sup>m</sup> = <span class=\"fr\"><span>1</span><span>3</span></span> → m = <span class=\"fr\"><span>−1</span><span>2</span></span>.</li><li>2m + n = −1 + 4 = 3. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — m = <span class=\"fr\"><span>1</span><span>2</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите к одному основанию.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m121_q08.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Q : R = 15 : 6, R : S = 6 : 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Q : S = 15 : 20 = 3 : 4. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — перемножили неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уравняйте общий член R.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m121_q09.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">½(x − 1 + x + 5) · x = 120 → x(x + 2) = 120.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 10 → RS = 15 см. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — само x + 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь трапеции.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m121_q10.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x√y = 8 · 3 = 24.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√y = 24 : 6 = 4 → y = 16. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — y без возведения в квадрат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная пропорция.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m121_q11.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средний треугольник: катеты 15 и 20, гипотенуза 25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подобие 3 : 4 : 5. Малый (гипотенуза 15): b = 9.</li><li>Большой (катет 25): a = 25 · <span class=\"fr\"><span>5</span><span>3</span></span> = <span class=\"fr\"><span>125</span><span>3</span></span>.</li><li>a − b = <span class=\"fr\"><span>125</span><span>3</span></span> − <span class=\"fr\"><span>27</span><span>3</span></span> = <span class=\"fr\"><span>98</span><span>3</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — другое соответствие сторон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите коэффициент подобия.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m121_q12.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">36 = 2²·3², 48 = 2⁴·3, 60 = 2²·3·5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОК = 2⁴ · 3² · 5 = 720. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 2⁵·3·5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наибольшие степени.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m121_q13.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ширина w, высота 2w: d² = w² + w² + 4w² = 6w².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>w = <span class=\"fr\"><span>d</span><span>√6</span></span>; V = w · w · 2w = 2w³ = <span class=\"fr\"><span>2d³</span><span>6√6</span></span> = <span class=\"fr\"><span>d³√6</span><span>18</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без деления на 9.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагональ куба/кубоида.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m121_q14.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание 5–12–13 прямоугольное: площадь 30, периметр 30.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 30 + 30h = 360 → h = 10.</li><li>V = 30 · 10 = 300. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без деления на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Боковая = периметр · h.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m121_q15.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК(40, 42) = 840 с = 14 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10:14. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разложите на простые.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m121_q16.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2πr² + 2πrh = πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2r + 2h = rh → h(r − 2) = 2r → h = <span class=\"fr\"><span>2r</span><span>r − 2</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на πr.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m121_q17.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель 640, знаменатель 0,016.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>640 : 0,016 = 40 000 → √ = 200. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 2000.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 10⁻² = 0,01.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m121_q18.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(2 − (3p − 1)) / (1 − p − 6) = −3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 − 3p = 15 + 3p → p = −2; M(6, −7).</li><li>y = −3x + r: −7 = −18 + r → r = 11. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в p.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала p.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m121_q19.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">От центра до вершины: половина стороны 5 и угол 60° у центра.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>R · sin 60° = 5 → R = <span class=\"fr\"><span>5</span><span>sin</span></span> 60°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — умножили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центральный угол 120°, половина — 60°.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m121_q20.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма: 20 · 54 + PT = 56(20 + P).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1080 + PT = 1120 + 56P → P(T − 56) = 40.</li><li>P = <span class=\"fr\"><span>40</span><span>T − 56</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — новое среднее перепутано со старым.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Через общие суммы.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m121_q21.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Брату <span class=\"fr\"><span>5</span><span>8</span></span> · 5000 = 3125.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Другу <span class=\"fr\"><span>1</span><span>5</span></span> = 625. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка в доле.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Две пропорции.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m121_q22.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">½ · 8 · AB = 32 → AB = 8 → ∠AOB = 45°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Круг без сектора 45°: 64π · <span class=\"fr\"><span>7</span><span>8</span></span> = 56π.</li><li>Плюс треугольник 32: 56π + 32. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — весь круг минус меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Равнобедренный прямоугольный — 45°.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m121_q23.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">8t + 12c = 104, t + c = 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>80 + 4c = 104 → c = 6. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — подбор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Система двух уравнений.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m121_q24.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">54 : 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>15 м/с. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — <span class=\"fr\"><span>54</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> км/ч → м/с: делить на 3,6.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m121_q25.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В треугольнике: (3x − 6) + 50° + (8x + 4) = 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(180 − 130 = 50; 8x + 4 — вертикальный угол).</li><li>11x = 132 → x = 12 → ∠A = 30°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — само x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смежный и вертикальный углы.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m121_q26.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">a + 4d = a²; a + 32d = 10(a + 2d).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12d = 9a → d = <span class=\"fr\"><span>3a</span><span>4</span></span> → 4a = a² → a = 4, d = 3.</li><li>a₁₀ = 4 + 27 = 31. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 9d ошибочно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите d через a.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m121_q28.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рост · 1,06 = 159.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>159 : 1,06 = 150 см. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 159 − 6%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный процент — деление.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m121_q29.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(n − 2) · 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18 · 180 = 3240°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — лишние 400°.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма углов многоугольника.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m121_q30.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x ♣ y = (x − y)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 ♣ 4 = 4; 4 ♣ 8 = 16. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — первый шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Узнайте формулу квадрата разности.</div></div>"}, {"id": 31, "topic": "M5.16", "text": "<p>A sector has radius 12 cm and angle 30°.</p><p>What is its area, in terms of \\(\\pi\\)?</p>", "image": "", "options": ["\\(2\\pi\\) cm²", "\\(12\\pi\\) cm²", "\\(\\pi\\) cm²", "\\(144\\pi\\) cm²", "\\(24\\pi\\) cm²"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь сектора = <span class=\"fr\"><span>θ</span><span>360</span></span> · πr².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>30</span><span>360</span></span> · 144π = 12π см². Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это длина дуги.</li><li>C — радиус не в квадрате.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дуга — от длины окружности, сектор — от площади круга.</div></div>", "src": "PL"}, {"id": 32, "topic": "M4.8", "text": "<p>Given that \\(x^2 + 8x + 15 \\equiv (x + a)^2 + b\\) for all \\(x\\), find \\(b\\).</p>", "image": "", "options": ["−1", "1", "4", "15", "31"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделите полный квадрат: a = половина коэффициента при x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 4, (x + 4)² = x² + 8x + 16.</li><li>b = 15 − 16 = −1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — это a, а не b.</li><li>D — взяли свободный член без поправки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте коэффициенты при одинаковых степенях.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
