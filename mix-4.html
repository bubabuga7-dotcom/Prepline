<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"ASB is a quarter circle. PQRS is a rectangle with PQ = 8 and PS = 6. What is the length of the arc AQB?","options":["5π","25","28","10π","14"],"correct":0,"src":"M1","topic":"M5.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершина Q прямоугольника лежит на дуге, значит, SQ — радиус. А SQ — диагональ прямоугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>SQ = √(8² + 6²) = √100 = 10 → r = 10.</li><li>Длина четверти окружности: ¼ · 2πr = ¼ · 20π = 5π.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (10π) — половина окружности.</li><li>B, C, E — длины без π: сложили стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В фигурах «прямоугольник в четверти круга» диагональ = радиус.</div></div>"},{"text":"Given y = 0.2x/(x + 1) and x ≥ 1, what is the range of values of y?","options":["0.1 ≤ y < 0.2","0 < y ≤ 0.1","0 < y < 0.2","0 ≤ y ≤ 0.1","0.1 ≤ y ≤ 0.2"],"correct":0,"src":"M5","id":2,"topic":"M4.12","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исследуем, как ведёт себя y при росте x: дробь <span class=\"fr\"><span>x</span><span>x + 1</span></span> растёт к 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>При x = 1: y = 0,2 · <span class=\"fr\"><span>1</span><span>2</span></span> = 0,1 — входит (x ≥ 1).</li><li>При x → ∞: <span class=\"fr\"><span>x</span><span>x + 1</span></span> → 1, y → 0,2, но никогда не достигает.</li><li>Функция растущая → 0,1 ≤ y < 0,2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 0,2 недостижимо.</li><li>B, D — y больше 0,1, а не меньше.</li><li>C — y не бывает меньше 0,1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предел «стремится, но не достигает» → строгий знак <.</div></div>"},{"text":"For x > 0 the operation ∇x = 3x − 3 is defined. Which expression is equal to ∇16/∇6?","options":["∇3","∇8","∇2","∇9","∇6"],"correct":2,"src":"M7","id":3,"topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычисляем обе ∇-операции и решаем ∇x = результату.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∇16 = 48 − 3 = 45; ∇6 = 18 − 3 = 15.</li><li>45 ÷ 15 = 3.</li><li>3x − 3 = 3 → x = 2 → ∇2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (∇3 = 6), B, D, E — не равны 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ в форме ∇(?) — решаем обратное уравнение.</div></div>"},{"id":4,"text":"Evaluate: (2⁻² + 4⁻¹)/(2⁻² − 3⁻¹)","options":["3","1/3","2⁻¹","−6","6"],"correct":3,"src":"M2","topic":"M2.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим отрицательные степени в дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2⁻² = ¼, 4⁻¹ = ¼ → числитель ½.</li><li>3⁻¹ = ⅓ → знаменатель ¼ − ⅓ = <span class=\"fr\"><span>−1</span><span>12</span></span>.</li><li>½ ÷ <span class=\"fr\"><span>−1</span><span>12</span></span> = −6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (6) — потеряли знак минус.</li><li>A, B, C — ошибки в дробях.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a⁻ⁿ = <span class=\"fr\"><span>1</span><span>a</span></span>ⁿ. Знаменатель отрицательный — результат тоже.</div></div>"},{"text":"The price of potatoes changed over four years by +25%, +20%, −20% and +50%. What is the overall increase over the period, to the nearest 1%?","options":["85%","75%","80%","72%","73%"],"correct":2,"src":"M5","id":5,"topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последовательные проценты перемножаются, а не складываются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Множители: 1,25 · 1,2 · 0,8 · 1,5.</li><li>1,25 · 1,2 = 1,5; 1,5 · 0,8 = 1,2; 1,2 · 1,5 = 1,8.</li><li>Рост 80%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (75%) — просто сложили проценты: 25 + 20 − 20 + 50.</li><li>A, D, E — арифметические ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изменение на p% = умножение на (1 + <span class=\"fr\"><span>p</span><span>100</span></span>).</div></div>"},{"id":6,"text":"Through how many degrees does the hour hand turn between noon and 14:30 on the same day?","options":["180","65","75","60","720"],"correct":2,"src":"M1","topic":"M1.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Часовая стрелка проходит 30° в час.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С 12:00 до 14:30 — 2,5 часа.</li><li>2,5 · 30° = 75°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (180°) — угол минутной стрелки за 30 мин.</li><li>E (720°) — путь минутной стрелки.</li><li>B, D — неточные расчёты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 360° ÷ 12 ч = 30°/ч.</div></div>"},{"id":7,"text":"The product of the two values of y satisfying x² − y = 2 and x + y = 4 is","options":["14","-6","-21","4","None of these"],"correct":0,"src":"M2","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем y из одного уравнения в другое.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = x² − 2.</li><li>x + x² − 2 = 4 → x² + x − 6 = 0 → (x + 3)(x − 2) = 0 → x = 2 или −3.</li><li>y = 4 − x: y = 2 или y = 7.</li><li>Произведение: 14.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (−6) — произведение x, а не y.</li><li>C (−21), D (4) — неверные значения y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вопрос про y, а не про x — не перепутайте в конце.</div></div>"},{"id":8,"text":"If x⊗y = x/y, what is (48⊗3)⊗2?","options":["√2","6√3","2","8","2√2"],"correct":3,"src":"M4","topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Просто выполняем операцию по шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>48⊗3 = <span class=\"fr\"><span>48</span><span>3</span></span> = 16.</li><li>16⊗2 = <span class=\"fr\"><span>16</span><span>2</span></span> = 8.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные варианты — если вместо деления брать корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скобки определяют порядок.</div></div>"},{"id":9,"text":"If 4^(x+2) = 64, what is 8x?","options":["8","4","16","1","32"],"correct":0,"src":"M1","topic":"M2.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим обе части к одному основанию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>64 = 4³ → 4<sup>x+2</sup> = 4³ → x + 2 = 3 → x = 1.</li><li>8x = 8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (1) — это x, а не 8x.</li><li>C, E — ошибка в основании (64 = 2⁶).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте, что спрашивают 8x, а не x.</div></div>"},{"id":10,"text":"An icosagon is a polygon with 20 sides. What is the sum of all the interior angles of a regular icosagon?","options":["3340°","3240°","3640°","3440°","3540°"],"correct":1,"src":"M1","topic":"M5.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма внутренних углов n-угольника = (n − 2) · 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 20 → (20 − 2) · 180° = 18 · 180° = 3240°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ошибки в умножении или взяли n − 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый n-угольник делится на n − 2 треугольника.</div></div>"},{"id":11,"text":"The perimeter of a triangle is 13. The two shorter sides have integer lengths x and x + 1. What could the length of the third side be?","options":["8","10","6","2","4"],"correct":2,"src":"M1","topic":"M5.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Третья сторона выражается через x; применяем неравенство треугольника и условие «две короткие стороны».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>c = 13 − x − (x + 1) = 12 − 2x.</li><li>c — самая длинная: 12 − 2x ≥ x + 1 → x ≤ 3.</li><li>Неравенство треугольника: 12 − 2x < x + (x + 1) → x > 2,75.</li><li>x — целое → x = 3, c = 6. (Стороны 3, 4, 6.)</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — третья сторона больше суммы двух других.</li><li>D, E — тогда третья сторона не самая длинная.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Неравенство треугольника: самая длинная сторона меньше суммы двух других.</div></div>"},{"text":"The hypotenuse of a right-angled triangle is 6 + √5 and one of the shorter sides is 3 + 2√5. What is the length of the third side?","options":["2√3","√(70 + 24√5)","12","3 − √5","14 + 7.5√5"],"correct":0,"src":"M7","id":12,"topic":"M5.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема Пифагора с иррациональными числами: аккуратно раскрываем квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(6 + √5)² = 36 + 12√5 + 5 = 41 + 12√5.</li><li>(3 + 2√5)² = 9 + 12√5 + 20 = 29 + 12√5.</li><li>Разность = 12 → третья сторона √12 = 2√3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложили квадраты вместо вычитания.</li><li>C (12) — забыли корень.</li><li>D, E — ошибки в раскрытии.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a + b)² = a² + 2ab + b² — не теряйте удвоенное произведение.</div></div>"},{"id":13,"text":"The operation ∆ is defined by a∆b = a/b − b/a. Find k such that 3∆k = k∆2.","options":["±2.0","±2.4","±3.0","±5.5","±6.0"],"correct":1,"src":"M1","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем обе стороны по определению и решаем уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3∆k = <span class=\"fr\"><span>3</span><span>k</span></span> − <span class=\"fr\"><span>k</span><span>3</span></span>; k∆2 = <span class=\"fr\"><span>k</span><span>2</span></span> − <span class=\"fr\"><span>2</span><span>k</span></span>.</li><li><span class=\"fr\"><span>3</span><span>k</span></span> + <span class=\"fr\"><span>2</span><span>k</span></span> = <span class=\"fr\"><span>k</span><span>2</span></span> + <span class=\"fr\"><span>k</span><span>3</span></span> → <span class=\"fr\"><span>5</span><span>k</span></span> = <span class=\"fr\"><span>5k</span><span>6</span></span>.</li><li>k² = 6 → k = ±√6 ≈ ±2,45 ≈ ±2,4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (±2), C (±3) — неверно собрали подобные.</li><li>D, E — ошибки в знаменателях.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переносите слагаемые с <span class=\"fr\"><span>1</span><span>k</span></span> в одну сторону, с k — в другую.</div></div>"},{"id":14,"text":"What is 30/∛0.000027?","options":["10","100","1000","10 000","None of these"],"correct":2,"src":"M4","topic":"M2.6","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем маленькое число как 27 · 10⁻⁶ — так легко извлечь кубический корень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,000027 = 27 · 10⁻⁶.</li><li>∛ = 3 · 10⁻² = 0,03.</li><li>30 ÷ 0,03 = 1000.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — ошибка в степени десяти.</li><li>E — ответ есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Кубический корень из 10⁻⁶ = 10⁻².</div></div>"},{"id":15,"text":"If x + 3y + 5z = 200 and x + 4y + 7z = 225, what is x + y + z?","options":["90","125","150","175","None of these"],"correct":2,"src":"M3","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три неизвестных, два уравнения — ищем комбинацию уравнений, дающую x + y + z.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a(x + 3y + 5z) + b(x + 4y + 7z) = x + y + z.</li><li>x: a + b = 1; y: 3a + 4b = 1 → a = 3, b = −2. Проверка z: 15 − 14 = 1 ✓.</li><li>x + y + z = 3 · 200 − 2 · 225 = 600 − 450 = 150.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — неверные коэффициенты комбинации.</li><li>E — значение определяется однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если нужно выражение, а не отдельные переменные — ищите линейную комбинацию.</div></div>"},{"id":16,"text":"John is 20 years older than Brian. Twelve years ago John was twice as old as Brian. How old is Brian now?","options":["32","31","30","33","34"],"correct":0,"src":"M3","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Составляем уравнение «12 лет назад».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сейчас: Брайан B, Джон B + 20.</li><li>12 лет назад: B − 12 и B + 8.</li><li>B + 8 = 2(B − 12) → B = 32.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не проходят проверку: при B = 32 Джону 52; 12 лет назад 40 = 2 · 20 ✓.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разница в возрасте не меняется со временем.</div></div>"},{"id":17,"text":"If a is 20% less than b, and b is 20% more than 400, what is b − a?","options":["96","80","108","104","100"],"correct":0,"src":"M2","topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем b, затем a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>b = 400 · 1,2 = 480.</li><li>a = 480 · 0,8 = 384.</li><li>b − a = 96.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (80) — 20% от 400 вместо 480.</li><li>E (100) — сочли, что a = 400 − 20% и b = 400 + 20%… смешали базы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «a на 20% меньше b» — процент от b.</div></div>"},{"text":"In a quadratic equation the sum of the roots is 0 and the product of the roots is −16. Which is the equation?","options":["x² + 8 = 0","x² − 8 = 0","x² + 16 = 0","x² − 16 = 0"],"correct":3,"src":"M5","id":18,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по Виета: x² − (сумма)x + произведение = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма 0, произведение −16.</li><li>x² − 0·x − 16 = x² − 16 = 0. Корни ±4 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — произведение ±8.</li><li>C (x² + 16) — произведение +16, корней нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак произведения корней = знак свободного члена (при a = 1).</div></div>"},{"text":"If f(x) = x² − 11, for which values of x is f(x) < 25?","options":["x < 5","x < 6","x = 6","−5 < x < 5","−6 < x < 6"],"correct":4,"src":"M7","id":19,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем x² − 11 < 25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² < 36.</li><li>|x| < 6 → −6 < x < 6.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (x < 6) — забыли отрицательную сторону (x = −10 даёт 89).</li><li>D — ошиблись с 36.</li><li>A, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x² < a² ⇔ −a < x < a.</div></div>"},{"text":"A boxing tournament prize fund of KZT 1 200 000 was shared between first, second and third place in the ratio 12 : 5 : 3. How much did third place receive?","options":["KZT 240000","KZT 200000","KZT 336000","KZT 180000","KZT 150000"],"correct":3,"src":"M10","id":20,"topic":"M3.4","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим по пропорции: сумма частей 12 + 5 + 3 = 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Одна часть = 1 200 000 ÷ 20 = 60 000.</li><li>Третье место: 3 · 60 000 = 180 000.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — ошибки в числе частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропорция → найдите «стоимость» одной части.</div></div>"},{"id":21,"text":"If 16^x = 4 and 5^(x+y) = 625, what is y?","options":["2","25/2","7/2","4","5"],"correct":2,"src":"M2","topic":"M2.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к одинаковым основаниям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16<sup>x</sup> = 4 → (4²)<sup>x</sup> = 4 → 2x = 1 → x = ½.</li><li>625 = 5⁴ → x + y = 4 → y = 4 − ½ = <span class=\"fr\"><span>7</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (4) — забыли вычесть x.</li><li>A, B, E — неверный x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 16 = 4², 625 = 5⁴ — полезно знать степени.</div></div>"},{"id":22,"text":"If 24 of the 40 students in a club are girls, what is the ratio of boys to girls?","options":["2:5","3:5","2:3","3:2","5:2"],"correct":2,"src":"M1","topic":"M3.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мальчиков 40 − 24 = 16, затем сокращаем отношение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 : 24 = 2 : 3 (делим на 8).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (3:2) — девочки к мальчикам.</li><li>B (3:5) — девочки к общему числу.</li><li>A — мальчики к общему.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Следите за порядком: «boys to girls».</div></div>"},{"text":"A solid sphere of radius r fits inside a hollow cylinder whose internal diameter and length are both equal to the diameter of the sphere. What fraction of the volume of the cylinder does the sphere occupy?","options":["1/4","1/3","1/2","2/3","3/4"],"correct":3,"src":"M7","id":23,"topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр: радиус r, высота 2r. Сравниваем объёмы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Шар: <span class=\"fr\"><span>4</span><span>3</span></span>πr³.</li><li>Цилиндр: πr² · 2r = 2πr³.</li><li><span class=\"fr\"><span>4</span><span>3</span></span> ÷ 2 = <span class=\"fr\"><span>2</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (½) — ошибка в объёме шара.</li><li>B (⅓) — объём конуса.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Классический факт Архимеда: шар занимает ⅔ описанного цилиндра.</div></div>"},{"text":"If x = −2 + √3, what is x² + 4x + 7?","options":["10","5","9","6","3"],"correct":3,"src":"M5","id":24,"topic":"M4.5","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выделяем полный квадрат: x² + 4x + 7 = (x + 2)² + 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 2 = √3.</li><li>(√3)² + 3 = 3 + 3 = 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (3) — забыли (x + 2)².</li><li>A, B, C — прямая подстановка с ошибками.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Видишь x = −2 + √3 — ищи (x + 2).</div></div>"},{"id":25,"text":"p is directly proportional to √q. When q = 25, p = 10. What is q when p = √2?","options":["0.25","4","2.25","0.50","None of these"],"correct":3,"src":"M2","topic":"M3.9","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">p = k√q. Находим k, затем q.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 = k · 5 → k = 2.</li><li>√2 = 2√q → √q = <span class=\"fr\"><span>√2</span><span>2</span></span> = <span class=\"fr\"><span>1</span><span>√2</span></span>.</li><li>q = ½ = 0,5.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (0,25) — взяли √q = ½.</li><li>B (4), C — перепутали направление.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После нахождения √q не забудьте возвести в квадрат.</div></div>"},{"id":26,"text":"What is (72² − 64²)/(44² − 24²)?","options":["0.16","0.4","0.8","0.64","None of these"],"correct":2,"src":"M4","topic":"M2.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность квадратов в числителе и знаменателе.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>72² − 64² = 8 · 136 = 1088.</li><li>44² − 24² = 20 · 68 = 1360.</li><li><span class=\"fr\"><span>1088</span><span>1360</span></span> = 0,8.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (0,64) — квадрат ответа.</li><li>A, B — ошибки сокращения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>8 · 136</span><span>20 · 68</span></span> = <span class=\"fr\"><span>8 · 2</span><span>20</span></span> = 0,8 — сокращайте до умножения.</div></div>"},{"text":"Find the sum of the values of x for the system y = 2x² and y + 2x = 4.","options":["-1","2","10","-3","6"],"correct":0,"src":"M7","id":27,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем y = 2x² во второе уравнение и используем Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² + 2x = 4 → x² + x − 2 = 0.</li><li>Сумма корней = −1 (корни 1 и −2).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (2) — произведение по модулю.</li><li>D, E, C — неверная подстановка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают сумму — можно не решать до конца.</div></div>"},{"id":28,"text":"Simplify: (x² − 4x)/(x² − 16)","options":["x/4","x/(x+4)","x/(x−4)","1/4","(x−4)/(x−16)"],"correct":1,"src":"M3","topic":"M4.6","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем числитель и знаменатель на множители и сокращаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 4x = x(x − 4).</li><li>x² − 16 = (x − 4)(x + 4).</li><li>Сокращаем (x − 4): <span class=\"fr\"><span>x</span><span>x + 4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — сократили не тот множитель.</li><li>A, D — «сократили» x² как слагаемые.</li><li>E — нельзя сокращать по частям.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сокращать можно только множители, а не слагаемые.</div></div>"},{"text":"Azamat buys a jumper for $60.00 before tax. The shop charges 6% tax on all purchases. If he gives the cashier $70.00, how much change does he receive?","options":["$3.60","$6.40","$7.40","$9.40","$66.40"],"correct":1,"src":"M10","id":29,"topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена с налогом, затем сдача.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>60 · 1,06 = 63,60.</li><li>70 − 63,60 = 6,40.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A ($3,60) — это сам налог.</li><li>C, D — ошибки в вычитании.</li><li>E — это 70 − 3,60.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цена с налогом p% = цена × (1 + <span class=\"fr\"><span>p</span><span>100</span></span>).</div></div>"},{"id":30,"text":"A jewellery shop offers a discount of 40%, and then a further 20% off the reduced price. How much will you pay for a ring priced at $200?","options":["$80","$120","$96","$140","$125"],"correct":2,"src":"M3","topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две скидки подряд перемножаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После 40%: 200 · 0,6 = 120.</li><li>После ещё 20%: 120 · 0,8 = 96.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A ($80) — сложили скидки: 60%.</li><li>B ($120) — только первая скидка.</li><li>D, E — неверный расчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 40% + 20% ≠ 60%: вторая скидка — от уже сниженной цены.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
