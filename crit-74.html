<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "The public parks in our city are closed at sunset for safety reasons. Yet a park that is empty after dark is more dangerous, not less, because there is nobody around to notice trouble. Cities that have kept their parks open and well lit in the evening have found that crime in and around the parks has fallen, as more people use them for walking, sport and meeting friends. Our city should therefore keep its main parks open until late in the evening, with good lighting. The cost of the lighting would be small compared with the cost of dealing with crime.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["The city's parks are closed at sunset for safety reasons.", "The city should keep its main parks open and well lit until late in the evening.", "Keeping parks open in the evening reduces crime.", "The cost of lighting the parks would be small.", "A park that is empty after dark is more dangerous than a busy one."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пустой парк опаснее → держать парки открытыми и освещёнными.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: город должен держать парки открытыми до позднего вечера. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — доводы.</li><li>A — исходная ситуация.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore … should» — вывод.</div></div>"}, {"id": 2, "topic": "PS", "text": "On a long-distance train, each passenger may take 2 bags free, provided each weighs no more than 23 kg. A bag weighing more than 23 kg but no more than 32 kg costs 5,000 ₸ extra. Bags over 32 kg are not accepted. A third bag costs 8,000 ₸, plus a further 5,000 ₸ if it weighs more than 23 kg. Aidana has 76 kg of luggage, which she can divide between up to three bags however she likes.<br><br><b>What is the least she must pay for her luggage?</b>", "options": ["8,000 ₸", "10,000 ₸", "13,000 ₸", "18,000 ₸", "21,000 ₸"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">76 кг: в два мешка максимум 64 кг → нужен третий.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>23 + 23 + 30: два бесплатно, третий 8000 + 5000 = 13 000 ₸.</li><li>Или 32 + 23 + 21: 5000 + 8000 = 13 000 ₸. Меньше нельзя. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — третий ≤ 23 кг, тогда первые два > 23 — доплата.</li><li>D — лишние доплаты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Третий мешок неизбежен.</div></div>"}, {"id": 3, "topic": "MC", "text": "It is a mistake to judge a country's healthcare system only by how long its people live. Life expectancy is affected by many things that have little to do with healthcare, such as diet, income and road safety. A country with an excellent healthcare system may still have a lower life expectancy than another country if its people eat less healthily.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["A healthcare system should not be judged only by life expectancy.", "A country with excellent healthcare may have a lower life expectancy than another country.", "Diet is more important to health than healthcare.", "Life expectancy is affected by diet, income and road safety.", "Healthcare has little effect on how long people live."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тезис: систему здравоохранения нельзя оценивать только по продолжительности жизни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — доводы.</li><li>C, E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Первое предложение — вывод.</div></div>"}, {"id": 4, "topic": "PS", "text": "Dinara runs 2 km on the first day of her training plan, and each day she runs 0.5 km more than the day before.<br><br><b>On which day does the total distance she has run first exceed 50 km?</b>", "options": ["Day 10", "Day 11", "Day 12", "Day 13", "Day 15"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма за n дней: <span class=\"fr\"><span>n</span><span>2</span></span> · (4 + 0,5(n − 1)).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>11 дней: 5,5 · 9 = 49,5 км — ещё нет.</li><li>12 дней: 6 · 9,5 = 57 км. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ровно 49,5 — не больше 50.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Арифметическая прогрессия.</div></div>"}, {"id": 5, "topic": "CON", "text": "A company tested two versions of its website. Version 1 was shown to 5,000 visitors, of whom 150 bought something. Version 2 was shown to 2,000 visitors, of whom 80 bought something.<br><br><b>Which one of the following conclusions is best supported by the information above?</b>", "options": ["Version 2 will always produce more purchases per visitor than Version 1.", "Visitors preferred the design of Version 2.", "Version 2 produced more sales than Version 1.", "The company should stop using Version 1.", "A greater proportion of visitors made a purchase with Version 2 than with Version 1."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Версия 1: <span class=\"fr\"><span>150</span><span>5000</span></span> = 3%; версия 2: <span class=\"fr\"><span>80</span><span>2000</span></span> = 4%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Доля покупателей выше у версии 2. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — продаж больше у версии 1.</li><li>A, B, D — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте доли.</div></div>"}, {"id": 6, "topic": "PS", "text": "A recipe uses flour and sugar in the ratio 5 : 2 by weight. Saule has 600 g of flour and 200 g of sugar.<br><br><b>What is the greatest total weight of flour and sugar she can use while keeping to the ratio?</b>", "options": ["560 g", "600 g", "700 g", "800 g", "840 g"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5 : 2; сахара хватит на 200 г → муки 500 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>500 + 200 = 700 г. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — муки 600 г требует 240 г сахара.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ограничивает то, чего меньше.</div></div>"}, {"id": 7, "topic": "CON", "text": "Every candidate who scores at least 180 in the entrance test is offered an interview. Only candidates who are offered an interview can receive a scholarship. Marat received a scholarship. Nurlan scored 175 in the entrance test.<br><br><b>Which one of the following must be true?</b>", "options": ["Marat was offered an interview.", "Nurlan did not receive a scholarship.", "Marat scored at least 180 in the entrance test.", "Everyone who was offered an interview received a scholarship.", "Nurlan was not offered an interview."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стипендия → было собеседование.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Марат получил стипендию → его пригласили. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — на собеседование могли пригласить и с меньшим баллом.</li><li>B, E — не следуют для Нурлана.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Only» — необходимое условие.</div></div>"}, {"id": 8, "topic": "PS", "text": "Three taxi apps charge as follows:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">App</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Charges</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">X</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">400 ₸ plus 120 ₸ per km</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Y</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">600 ₸ plus 100 ₸ per km; 20% extra at night</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Z</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">150 ₸ per km, minimum fare 1,000 ₸</td></tr></table>Ermek needs a 9 km journey late at night.<br><br><b>What is the cheapest fare available?</b>", "options": ["1,000 ₸", "1,350 ₸", "1,480 ₸", "1,500 ₸", "1,800 ₸"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">9 км ночью.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>X: 400 + 1080 = 1480; Y: (600 + 900) · 1,2 = 1800; Z: 9 · 150 = 1350 (> 1000).</li><li>Минимум 1350 ₸. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — минимум Z, но поездка дороже.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Учтите ночную надбавку.</div></div>"}, {"id": 9, "topic": "ASM", "text": "Most of the accidents in our factory happen during the night shift. So if we stopped working at night, the number of accidents would fall sharply.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The factory could afford to stop working at night.", "Accidents that happen at night are more serious than accidents during the day.", "The accidents happen because of conditions at night, such as tiredness, and would not simply happen during the day if the work were moved.", "The factory employs more workers at night than during the day.", "Most workers prefer to work during the day."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аварии ночью → прекратить ночную работу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: аварии из-за ночных условий и не перейдут на день. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не сдвинутся ли аварии?</div></div>"}, {"id": 10, "topic": "PS", "text": "A train leaves at 22:50. The journey takes 9 hours 25 minutes. The destination's local time is 1 hour behind the time at the departure station.<br><br><b>At what local time does the train arrive?</b>", "options": ["06:15", "07:15", "08:15", "09:15", "21:25"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">22:50 + 9 ч 25 мин = 08:15 по времени отправления.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Местное на 1 ч меньше: 07:15. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без учёта пояса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала по старому времени.</div></div>"}, {"id": 11, "topic": "ASM", "text": "Our shop sold twice as many umbrellas this October as it did last October. Our new window display must have been very effective, since it was put up at the start of this October.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The new window display was expensive.", "Other shops in the area also sell umbrellas.", "Most umbrellas are bought in the autumn.", "The shop sells more umbrellas than any other product.", "It did not rain much more this October than last October."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Зонтов вдвое больше → витрина сработала.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: дождей было не намного больше. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключите погоду.</div></div>"}, {"id": 12, "topic": "PS", "text": "A 4-digit PIN reads the same forwards and backwards (for example 4774). Its first digit cannot be 0.<br><br><b>How many such PINs are there?</b>", "options": ["81", "90", "100", "900", "1,000"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Палиндром abba: a — 1–9, b — 0–9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9 · 10 = 90. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — b без нуля.</li><li>D — 3 свободные цифры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Свободны только 2 цифры.</div></div>"}, {"id": 13, "topic": "ASM", "text": "Five years ago, 40 students at our school took music lessons; this year, 60 do. Music is therefore becoming more popular among our students.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The total number of students at the school has not risen by a similar or greater proportion.", "Music is more popular than art.", "Music lessons have become cheaper.", "Students enjoy their music lessons.", "The school's music teachers are very experienced."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">40 → 60 учеников → музыка популярнее.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: общее число учеников не выросло так же или больше. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нужна доля.</div></div>"}, {"id": 14, "topic": "PS", "text": "A theatre has 20 rows of 25 seats. Twelve seats have been removed to make space for wheelchairs, so it now has 20 × 25 − 12 = 488 seats.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A class of 25 students is split into 5 groups, so each group has 25 ÷ 5 = 5 students.", "Twenty tickets at 25 ₸ each, with 12% off, cost 20 × 25 × 0.88 = 440 ₸.", "A wall 20 m long has posts 2.5 m apart, so there are 20 ÷ 2.5 + 1 = 9 posts.", "A car park has 8 levels of 60 spaces, and 15 spaces are kept for staff, so 8 × 60 − 15 = 465 spaces are available to the public.", "There were 25 people at a meeting, 12 left and 20 more arrived, so 25 − 12 + 20 = 33 were then present."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: строки × места − изъятые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: 8 · 60 − 15. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — процент.</li><li>A, C, E — другой метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Произведение минус число.</div></div>"}, {"id": 15, "topic": "WKN", "text": "In countries where people drink more coffee, a certain liver disease is less common. Drinking coffee must therefore protect people against this disease.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["In countries where people drink more coffee, people also drink much less alcohol, which is a major cause of the disease.", "Coffee contains caffeine.", "Tea is also popular in many of these countries.", "The price of coffee varies from country to country.", "The disease is rare in children."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше кофе — меньше болезни печени → кофе защищает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если там же пьют меньше алкоголя — причина может быть в нём. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Третий фактор.</div></div>"}, {"id": 16, "topic": "PS", "text": "A student's final grade is worked out as 40% of the coursework mark plus 60% of the exam mark. Both marks are whole numbers out of 100. A final grade of 75 or more earns an A. Zarina's coursework mark is 70.<br><br><b>What is the lowest exam mark that would give her an A?</b>", "options": ["75", "78", "79", "80", "83"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,4 · 70 = 28; нужно 0,6x ≥ 47.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x ≥ 78,3 → 79. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 78 даёт 74,8.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Округляйте вверх до целого.</div></div>"}, {"id": 17, "topic": "STR", "text": "A city replaced its old street lamps with brighter LED lamps in half of its districts. In the following year, night-time burglaries fell in these districts. The council concluded that brighter street lighting deters burglars.<br><br><b>Which one of the following, if true, would most strengthen the council's conclusion?</b>", "options": ["Some residents complained that the new lamps were too bright.", "Police patrols were increased in the districts with the new lamps.", "In the districts that kept the old lamps, night-time burglaries did not fall, and daytime burglaries changed by the same small amount in all districts.", "LED lamps use less electricity than the old lamps.", "Burglaries are more common in winter than in summer."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Яркие лампы → меньше краж.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в районах со старыми лампами краж не стало меньше — дело в лампах. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — альтернативная причина.</li><li>A, D, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрольная группа.</div></div>"}, {"id": 18, "topic": "PS", "text": "Asel, Bolat, Dias, Gaukhar and Murat each own one pet: a cat, a dog, a fish, a bird or a rabbit, all different.<br>• Asel does not own the cat or the dog, but her pet has fur.<br>• Bolat owns either the bird or the fish.<br>• Dias owns the dog.<br>• Gaukhar owns neither the fish nor the rabbit.<br>• Murat owns neither the bird nor the cat.<br><br><b>Who owns the fish?</b>", "options": ["Asel", "Bolat", "Dias", "Gaukhar", "Murat"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диас — собака; Асель — пушистый, не кошка → кролик.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мурат — не птица, не кошка → рыбка.</li><li>Болат — птица, Гаухар — кошка. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — Болату остаётся только птица.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с однозначных.</div></div>"}, {"id": 19, "topic": "WKN", "text": "Since the town banned plastic bags, the amount of plastic litter in the river has fallen by 30%. The ban has clearly worked.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Plastic bags take hundreds of years to break down.", "During the same period, a new boat began collecting rubbish from the river every week.", "Some of the plastic litter in the river comes from bottles.", "Since the ban, most shoppers have used cloth bags.", "The ban was unpopular with shopkeepers."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мусора −30% → запрет сработал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если тогда же лодка начала собирать мусор — причина может быть в ней. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — усиливает.</li><li>A, C, E — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 20, "topic": "PS", "text": "Three friends share a taxi that costs 3,600 ₸ for a 12 km trip; the fare is the same for every kilometre. Asel travels the whole 12 km, Bolat gets out after 8 km and Dias after 4 km. For each part of the trip, the cost is shared equally by the people in the taxi at the time.<br><br><b>How much does Asel pay?</b>", "options": ["1,200 ₸", "1,800 ₸", "2,000 ₸", "2,200 ₸", "2,400 ₸"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждые 4 км стоят 1200 ₸.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0–4 км: 1200 : 3 = 400; 4–8 км: 1200 : 2 = 600; 8–12 км: 1200.</li><li>Асель: 400 + 600 + 1200 = 2200 ₸. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — поровну на троих.</li><li>B — пропорционально пути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый отрезок делите на тех, кто едет.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "This newspaper is a reliable source of information, because every edition states that its reporting is accurate and fair.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that accuracy and fairness are the same thing.", "It assumes that all newspapers are biased.", "It does not say which newspaper it is referring to.", "It ignores the fact that the newspaper is popular.", "It uses the newspaper's own claim about itself as evidence that the claim is true."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Газета надёжна, потому что сама так говорит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Круговое рассуждение. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Утверждение доказывает само себя.</div></div>"}, {"id": 22, "topic": "PS", "text": "Posts are placed every 2.5 m along both sides of a straight path 50 m long, with a post at each end of each side.<br><br><b>How many posts are there altogether?</b>", "options": ["20", "21", "40", "42", "44"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">50 : 2,5 = 20 промежутков → 21 столб на сторону.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>21 · 2 = 42. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без концевых столбов.</li><li>B — одна сторона.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Столбов на 1 больше промежутков.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "A famous footballer says that this brand of vitamin tablets improves memory. So taking these tablets will improve your memory.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not say how much the tablets cost.", "It ignores other brands of vitamin tablets.", "It assumes that footballers need a good memory.", "It assumes that everyone wants a better memory.", "It relies on the opinion of someone who is not an expert on the subject."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Футболист хвалит витамины для памяти.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Он не эксперт в этой области. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ложный авторитет.</div></div>"}, {"id": 24, "topic": "PS", "text": "A runner covers 10 km in 50 minutes, so her average speed is 10 ÷ (50 ÷ 60) = 12 km/h.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A cyclist covers 18 km in 45 minutes, so her average speed is 18 ÷ (45 ÷ 60) = 24 km/h.", "A car travelling at 60 km/h for 45 minutes covers 60 × (45 ÷ 60) = 45 km.", "50 minutes is 50 ÷ 60 = 5/6 of an hour.", "At 12 km/h, a runner covers 12 × 2 = 24 km in 2 hours.", "At 5 km/h, a walker takes 10 ÷ 5 = 2 hours to walk 10 km."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Скорость = путь : (минуты : 60).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 18 : (45 : 60) = 24 км/ч. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — умножение.</li><li>C, E — один шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на часть часа.</div></div>"}, {"id": 25, "topic": "FLAW", "text": "The three students from our school who went to the national maths olympiad all won medals. So the students at our school are better at maths than students at other schools.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that winning medals is important.", "It does not say what kind of medals the students won.", "It ignores students who did not want to take part in the olympiad.", "It assumes that the olympiad was difficult.", "It draws a conclusion about all the school's students from a small group chosen because they are strong at maths."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три медалиста → вся школа сильнее.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод о всех из маленькой, специально отобранной группы. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нерепрезентативная выборка.</div></div>"}, {"id": 26, "topic": "PS", "text": "A water tank is three-fifths full. After 24 litres have been used, it is one-third full.<br><br><b>How many litres does the tank hold when full?</b>", "options": ["40", "60", "72", "90", "120"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>3</span><span>5</span></span> − <span class=\"fr\"><span>1</span><span>3</span></span> = <span class=\"fr\"><span>4</span><span>15</span></span> бака = 24 л.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Весь бак 24 · 15 : 4 = 90 л. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — <span class=\"fr\"><span>3</span><span>5</span></span> от 120.</li><li>B — 24 : <span class=\"fr\"><span>2</span><span>5</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность долей.</div></div>"}, {"id": 27, "topic": "PAR", "text": "If the river rises above the warning level, the lower road floods. If the lower road floods, the school bus has to take the long route. So if the river rises above the warning level, the school bus has to take the long route.<br><br><b>Which one of the following most closely parallels the reasoning in the above argument?</b>", "options": ["If it rains, the match is cancelled. It is raining. So the match is cancelled.", "Either a shop's rent is high or its prices are low. This shop's rent is not high. So its prices are low.", "If a shop's rent is high, its prices are high. This shop's prices are high. So its rent is high.", "If a shop is in the city centre, its rent is high. If a shop's rent is high, its prices are high. So if a shop is in the city centre, its prices are high.", "If a shop's prices are high, customers go elsewhere. Customers have gone elsewhere. So the prices must be high."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если A → B, если B → C ⇒ если A → C.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: центр → аренда высокая → цены высокие ⇒ центр → цены высокие. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — modus ponens.</li><li>C, E — обращение.</li><li>B — дилемма.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка условий.</div></div>"}, {"id": 28, "topic": "PS", "text": "A bakery makes cakes. Each cake uses 300 g of flour, 4 eggs and 100 g of butter. Flour costs 450 ₸ per kg, eggs cost 900 ₸ for 10, and butter costs 2,400 ₸ per kg. Each cake sells for 1,500 ₸.<br><br><b>What is the bakery's profit on each cake, counting only the cost of these ingredients?</b>", "options": ["525 ₸", "765 ₸", "795 ₸", "865 ₸", "1,140 ₸"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мука 0,3 · 450 = 135; яйца 4 · 90 = 360; масло 0,1 · 2400 = 240.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Себестоимость 735 ₸; прибыль 1500 − 735 = 765 ₸. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — ошибка в одном ингредиенте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переводите в цену за единицу.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "A person should not be punished for breaking a rule that they had no way of knowing about.<br><br><b>Which one of the following best illustrates this principle?</b>", "options": ["A new student who parked in a staff space on her first day, when there was no sign, should not be fined.", "A driver who ignored a speed-limit sign should be fined.", "People who break the same rule many times should be punished more severely.", "All rules should be written down.", "Everyone has a duty to know the law."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нельзя наказывать за правило, о котором невозможно было знать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: студентка в первый день, без знака. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак был.</li><li>C, D, E — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знать было невозможно.</div></div>"}, {"id": 30, "topic": "PS", "text": "A large cube is made from 64 small cubes (4 × 4 × 4). The outside of the large cube is painted.<br><br><b>How many of the small cubes have paint on exactly one face?</b>", "options": ["8", "16", "20", "24", "32"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одна окрашенная грань — внутренняя часть грани 2 × 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 · 4 = 24. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — углы.</li><li>B — внутренние кубики.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (n − 2)² на грань.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
