<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p>In a modified form of a popular game, each of two players at any turn may put either 'O' or 'X' as she chooses in any blank square of a 3 by 3 grid. She wins if she thereby completes a line of three identical symbols. A player is faced with this situation:</p><p>[Grid: row 1: empty, X, empty; row 2: X, empty, empty; row 3: empty, empty, empty]</p><p>Which one of the following moves ensures that she can win at her next move?</p>", "image": "images/q-73b963fc79.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 2, "verified": true, "src": "CRIT18", "review": true, "orig": "images/q-73b963fc79.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Побеждает тот, кто закончит линию; символ любой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Линия из двух с пропуском даёт победу сопернику.</li><li>O в правом нижнем углу (C) ничего не даёт закончить сейчас, но любой ход соперника создаст линию, которую закончите вы. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные ходы дают шанс сопернику или оставляют ему безопасный ход.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите ход, после которого у соперника нет безопасных ходов.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p>The following table shows the results of a test on smokers trying to quit. Of 240 people, half were given nicotine tablets and half were given a placebo (a substance containing no medication).</p><table class=\"q-table\"><thead><tr><th></th><th>Failed to quit</th><th>Succeeded in quitting</th><th>Total</th></tr></thead><tbody><tr><td>Nicotine</td><td>64</td><td>56</td><td>120</td></tr><tr><td>Placebo</td><td>96</td><td>24</td><td>120</td></tr><tr><td>Total</td><td>160</td><td>80</td><td>240</td></tr></tbody></table><p>The researchers assumed that: of the smokers given nicotine tablets, the same proportion would have quit without using them as would have quit using the placebo.</p><p>How many of the smokers that were given the nicotine tablets can the researchers conclude had quit due to taking the tablets?</p>", "image": "", "options": ["16", "32", "39", "40", "45"], "correct": 1, "verified": true, "src": "CRIT18", "orig": "images/q-f3df57942d.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В группе плацебо бросили 24 из 120 = 20%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>20% группы с никотином (24 чел.) бросили бы и так.</li><li>56 − 24 = 32 бросили благодаря таблеткам. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учитывают базовые 20%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Эффект = результат − то, что было бы и без лечения.</div></div>"}, {"id": 3, "topic": "STR", "text": "<p>In a high speed police chase, police drivers sometimes lose sight of the car they are chasing. But that's no reason to give up. All they have to do is take the first left, and then the first left again. Pursued drivers are likely to keep taking turns as they come up, as this seems instinctively like the best way to lose someone who is following them. They are not going to turn right as this involves waiting and checking for oncoming traffic. Therefore take a couple of left turns and the police car will soon have their criminal in sight once again!</p><p>Which of the following, if true, would strengthen this argument?</p>", "image": "", "options": ["Car chases tend to end with the pursued driver losing control of their vehicle.", "Drivers in TV car chases tend to turn left rather than right when pursued.", "Police drivers are usually able to sustain faster average speeds over a length of time than other drivers.", "Police drivers usually request overhead assistance from a helicopter when chasing criminals in cars.", "Two left turns might take the criminal where they want to be going."], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-e91ef7350f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">План работает, только если полиция догонит после поворотов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C: полиция держит более высокую скорость → разрыв сократится. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — про ТВ, не реальность.</li><li>A, D, E — не по теме или ослабляют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усилитель закрывает слабое место плана.</div></div>"}, {"id": 4, "topic": "FLAW", "text": "<p>The museum has decided to spend money in the hope of staying profitable and, therefore, remaining open. It has opened an expensive new front hall, which is very big and well planned, and will undoubtedly impress new visitors. For serious students, however, it has nothing to offer that was not there before. All the scholars who want to do so already use the museum, they will continue to come however artistic the displays may or may not be. So, it was a waste to spend so much money on appearances, the money should have been spent on improving conditions for those who come to study.</p><p>Which one of the following is the best statement of the flaw in the above argument?</p>", "image": "", "options": ["The museum cannot be sure that new visitors will be attracted by its new front hall.", "There is no evidence that visitors to museums are interested in the conditions in which the contents are displayed.", "If scholars will continue to come anyway, the museum will not make more money by improving their conditions.", "There is no contact or sympathy between serious scholars and members of the general public in museums.", "It is regular users, and not potential new visitors, to the museum who deserve to be rewarded."], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-ffa035790b.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цель трат — прибыль, чтобы музей не закрылся.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор сам говорит: учёные придут в любом случае.</li><li>Значит, тратить на них — не принесёт денег. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не про противоречие внутри аргумента.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте, согласуется ли предложение автора с целью.</div></div>"}, {"id": 5, "topic": "MC", "text": "<p>England is set to become the most crowded country in Europe as its population grows by a third over the next 50 years, according to official projections. There are currently some 50 million people in England, but in 50 years this could hit 68 million - 1,349 for every square mile. Opposition political parties, who have obtained the data from the Office for National Statistics, demanded restrictions on migration levels. The opposition spokeswoman for immigration said \"This demonstrates the real pressure public services are being put under as a result of the failed immigration policy of the present government, which the electorate are increasingly recognising.\" Continued unrestricted population growth will lead to extremist political parties benefiting at the ballot box.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Extremist parties will gain political capital from the growth in population.", "England is set to become the most crowded country in Europe over the next 50 years.", "Public services will come under increasing pressure as a result of immigration policy.", "The electorate are dissatisfied with the government's immigration policy.", "Opposition parties believe immigration is the sole reason for the projected rise in population in England."], "correct": 0, "verified": true, "src": "CRIT18", "orig": "images/q-a6108e0bcd.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последнее предложение — мнение автора.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Рост населения пойдёт на пользу экстремистам. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — данные и цитаты оппозиции.</li><li>E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цитаты чужих людей — не вывод автора.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p>When my father ran a pizza shop he sold pizzas for a fixed amount plus an amount proportional to the ingredients used. A regular pizza uses twice the ingredients of a mini one and a large pizza twice those of a regular one.</p><p>Which one of the following price scales could he have used for mini, regular and large pizzas?</p>", "image": "", "options": ["£0.49, £1.00, £1.96", "£1.00, £2.00, £3.00", "£1.10, £2.20, £3.30", "£1.70, £2.00, £2.40", "£2.00, £3.00, £5.00"], "correct": 4, "verified": true, "src": "CRIT18", "orig": "images/q-6a89eeba62.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена = фикс + ставка × ингредиенты; ингредиенты 1 : 2 : 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Средняя − мини = ставка; большая − средняя = 2 · ставка.</li><li>Только E: +1 £, затем +2 £. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — разности не 1 : 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Фиксированная часть исчезает в разностях.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p>I often order items from a mail order catalogue. The charges for postage and packing (to be added to the order value) are as follows:</p><table class=\"q-table\"><thead><tr><th>Order value</th><th></th><th></th></tr></thead><tbody><tr><td>less than £25.00</td><td>-</td><td>£4.50</td></tr><tr><td>£25.00 to £49.99</td><td>-</td><td>£8.50</td></tr><tr><td>£50.00 to £74.99</td><td>-</td><td>£12.00</td></tr><tr><td>£75.00 to £99.99</td><td>-</td><td>£15.00</td></tr><tr><td>£100.00 and over</td><td>-</td><td>£17.50</td></tr></tbody></table><p>Just before sending off my latest order, I noticed that the current catalogue offers half price postage and packing for orders of 8 or more items. My order was for 7 items, with an order value of £74.60. I could not find anything else I wanted, so I just added the cheapest item in the catalogue (priced at £1.25) to my order.</p><p>By how much did adding the extra item to my order reduce the total cost?</p>", "image": "", "options": ["£3.25", "£4.50", "£4.75", "£5.75", "£6.25"], "correct": 0, "verified": true, "src": "CRIT18", "orig": "images/q-208a1b1e38.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем до и после.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>До: 74,60 + 12 = 86,60 £.</li><li>После: 75,85 + 15 : 2 = 83,35 £.</li><li>Экономия 3,25 £. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли новую ступень доставки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Добавка переводит в новую ступень тарифа.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p>John wishes to have 500 copies of a brochure printed and is offered a choice of two price structures:</p><ol><li>An equal cost for each brochure printed, regardless of number.</li></ol><ol><li>An initial fixed cost followed by a lower cost than structure 1 for each brochure.</li></ol><p>Which one of the following sets of information would be sufficient for him to be able to decide which of the two price structures would be least expensive?</p>", "image": "", "options": ["The number of brochures for which the total bill would be the same by both structure 1 and structure 2.", "An example showing the cost of 500 brochures for structure 1 and 200 brochures using structure 2.", "The cost per brochure using structure 1 and the initial cost using structure 2.", "An example showing the cost of 200 brochures using structure 1 and 200 brochures using structure 2.", "The cost of 1 brochure using structure 1 and 2 brochures using structure 2."], "correct": 0, "verified": true, "src": "CRIT18", "orig": "images/q-c28ee9962a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Схема 2: фикс + меньшая ставка → выгоднее при большом тираже.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Зная точку равенства, сразу видно, какая дешевле для 500. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D, E — данных не хватает.</li><li>C — нет ставки схемы 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точка безубыточности решает такие задачи.</div></div>"}, {"id": 9, "topic": "CON", "text": "<p>Many people who live near to mobile phone masts are worried that radiation from these masts will damage their health. Mobile phones themselves have also been suspected of emitting dangerous levels of radiation, and a report recommended that children should be discouraged from making non-essential calls. Emission of radiation from the masts is much lower than that from a mobile phone. A few seconds making a phone call is comparable to 24 hours of exposure from a mast. Radiation from both these sources is below the international guidelines as to what is a dangerous level, but no one can yet be certain if these guidelines accurately reflect the level of risk.</p><p>Which one of the following can be drawn as a conclusion from the above passage?</p>", "image": "", "options": ["People who use mobile phones are putting their health at risk.", "The international guidelines underestimate the risk to health from low levels of radiation.", "The health risk from living near a phone mast is lower than that from using a mobile phone.", "People who live near mobile phone masts overestimate the risks to their health from these masts.", "If extensive use of mobile phones is not harmful to health, radiation from a mast is unlikely to be a risk."], "correct": 4, "verified": true, "src": "CRIT18", "orig": "images/q-9994fc4742.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вышка облучает намного меньше телефона.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если активное пользование телефоном безвредно, то вышка тем более. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — зависит, сколько говорить.</li><li>A, B, D — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Условный вывод («if…») часто самый надёжный.</div></div>"}, {"id": 10, "topic": "ASM", "text": "<p>University education is not a matter of forcing through the largest number of graduates at the lowest possible short-term cost. This would not serve the needs of the current generation of students and, even from a narrow economic viewpoint, it would not promote economic prosperity in the long term. It is often a poor economic practice to skimp on the production costs of a product, even when you are only interested in the eventual monetary profit to be made from it. But in any event university education has wider purposes than merely the promotion of economic prosperity.</p><p>Which of the following is an underlying assumption of the above argument?</p>", "image": "", "options": ["The principal purpose of university education is to serve the needs of the present generation of students.", "The principal purpose of university education is to promote the long term economic prosperity of the community.", "The more money the manufacturer spends on the production of a product, the greater the eventual profit is likely to be.", "Policies of cost-cutting are likely to reduce the extent to which the university education will achieve its overall purpose.", "Universities should be managed so as to make a monetary profit, but they should also promote certain non-financial values."], "correct": 3, "verified": true, "src": "CRIT18", "orig": "images/q-1a9a4bb4bc.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Экономия на расходах навредит студентам и экономике.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: урезание расходов вредит целям университета. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — берут одну цель.</li><li>C — слишком сильно.</li><li>E — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение связывает «дешевле» и «хуже».</div></div>"}, {"id": 11, "topic": "WKN", "text": "<p>The preservation of First Class sections on trains is indefensible. This is not because it is socially divisive, which it is; nor because it is very expensive, which it also is; but because it inevitably leads to a relatively poorer service in Standard Class sections of trains. Clearly, in order to attract First Class passengers it is necessary to maintain certain levels of discomfort in those compartments which cater to the great majority of travellers. There is, for example, a powerful disincentive to make more space generally available on trains, as one of the main inducements to travel First Class is to escape overcrowding and be assured of a seat. Yet, additional space would add significantly to the safety and comfort of most passengers.</p><p>Which one of the following, if true, would most weaken the above argument?</p>", "image": "", "options": ["More people are now using First Class sections on trains than ever before.", "The whole rail service benefits from the increased revenue generated by the high cost of First Class tickets.", "On many trains the First Class section occupies only a small proportion of the total accommodation.", "No one is excluded from travelling in the First Class sections of trains, provided they are prepared to pay the higher fare.", "Some people who travel in First Class sections of trains would not use the trains if there were no First Class sections."], "correct": 1, "verified": true, "src": "CRIT18", "orig": "images/q-62723eb966.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: первый класс ухудшает стандартный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: доход от первого класса улучшает весь сервис. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не опровергают вред.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабитель показывает обратный эффект.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p>At Marland College, all 120 pupils in year 11 take two languages at GCSE. The table below shows the numbers of pupils taking each language combination.</p><table class=\"q-table\"><thead><tr><th></th><th>French</th><th>German</th><th>Italian</th><th>Spanish</th></tr></thead><tbody><tr><td>Mandarin</td><td>9</td><td>3</td><td>2</td><td>4</td></tr><tr><td>Spanish</td><td>14</td><td>9</td><td>13</td><td></td></tr><tr><td>Italian</td><td>13</td><td>19</td><td></td><td></td></tr><tr><td>German</td><td>24</td><td></td><td></td><td></td></tr></tbody></table><p>What percentage of those taking Spanish are also taking French? (Give your answer to the nearest 1% if necessary).</p>", "image": "", "options": ["12%", "23%", "35%", "39%", "54%"], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-ce598bb276.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем всех, кто учит испанский.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С мандарином 4, французским 14, немецким 9, итальянским 13 = 40.</li><li>14 из 40 = 35%. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знаменатель — все изучающие испанский.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p>The diagram below shows Morden Hall and the network of paths within the grounds.</p><p>When the owner takes his dog for a walk he always starts and finishes at the intersection outside the front door and (keeping to the paths) walks one complete triangular route.</p><p>How many different routes does he have to choose from? (Clockwise and anticlockwise around the same triangle counts as one route only.)</p>", "image": "images/q-2b31c52627.jpg", "options": ["5", "7", "10", "11", "12"], "correct": 3, "verified": true, "src": "CRIT18", "orig": "images/q-2b31c52627.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем треугольные маршруты от входной двери.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Каждый треугольник с вершиной у входа считаем один раз (по и против часовой — один маршрут).</li><li>Их 11. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропуск или двойной счёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Систематично перебирайте пары путей.</div></div>"}, {"id": 15, "topic": "MC", "text": "<p>Although study leave in the run up to exams is traditional, and benefits well-motivated, organised students, recent thinking suggests that it is not the best way to improve results. Some students are required to do housework or help in the family business rather than studying. Many others spend time playing computer games, watching daytime TV or hanging around with friends instead of revising. Schools which provide in-school study areas with teacher supervision and a programme of booster revision sessions are getting more A*s and fewer Ds. It is time to ditch study leave.</p><p>Which one of the following best expresses the main conclusion of the argument?</p>", "image": "", "options": ["Many students do not make good use of their study leave.", "Students who work hard find study leave useful.", "Study leave is not the best way for students to gain high results.", "Study leave ought to be abandoned.", "Traditional methods of education need to be updated to improve results."], "correct": 3, "verified": true, "src": "CRIT18", "orig": "images/q-1f6a45ceab.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод — последнее предложение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пора отказаться от учебного отпуска. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — довод.</li><li>A, B — посылки.</li><li>E — слишком широко.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация в конце — главный вывод.</div></div>"}, {"id": 16, "topic": "CON", "text": "<p>Land reform is urgently needed in the UK. It is well documented that around two-thirds of Britain is owned by just 0.3% of the population. Many of the largest estates have been in the hands of the same families for centuries, and were acquired under outdated feudal laws, often by means of aggression. If these families had any sense of social justice in the 21st century they would by now have voluntarily surrendered all but the acreage they needed for personal privacy. ________________________________________ the state should confiscate all excessive land holdings without compensation and redistribute them into the families of workers and taxpayers at affordable prices.</p><p>Which of the following phrases, inserted in the blank space, most logically completes the above argument?</p>", "image": "", "options": ["In the current economic climate, ...", "On the other hand, ...", "This being the case, ...", "Therefore, on legal grounds, ...", "Since they have not, ..."], "correct": 4, "verified": true, "src": "CRIT18", "orig": "images/q-2f12b5ca86.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Семьи должны были отдать землю сами.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конфискация — потому что не отдали: «Since they have not». Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — не связывают с предыдущим предложением.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Связка должна логически следовать из прошлой фразы.</div></div>"}, {"id": 17, "topic": "PAR", "text": "<p>All trees have leaves. An oak is a tree. Therefore oaks have leaves.</p><p>Which one of the following most closely parallels the reasoning used in the argument?</p>", "image": "", "options": ["All leaves grow on trees. That plant has leaves. Therefore that plant is a tree.", "All oaks have leaves. That tree has leaves. Therefore that tree is an oak.", "All plants have leaves. That leaf is an oak leaf. Therefore all plants are oaks.", "All trees have leaves. That plant has leaves. Therefore that plant is a tree.", "All trees have leaves. That plant is not a tree. Therefore that plant does not have leaves."], "correct": 0, "verified": true, "src": "CRIT18", "orig": "images/q-5e3df63e8c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все деревья с листьями; дуб — дерево → у дуба листья. Верный силлогизм: все A — B; это A → это B.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: все листья растут на деревьях; у растения листья → оно дерево. Та же верная форма. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — утверждение следствия.</li><li>C — бессмыслица.</li><li>E — отрицание антецедента.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите верную форму, а не похожие слова.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p>Megan pays a subscription to Probe Information Services. This is an internet service which allows her to access up-to-date information relevant to her job. The leaflet which came with her application form is reproduced below.</p><table class=\"q-table\"><thead><tr><th></th><th></th><th></th></tr></thead><tbody><tr><td><em>Probe Information Services - Serving you in the Internet Age</em></td><td></td><td></td></tr><tr><td><em>Minimum monthly charge $5 - this gives access to all services and a $5 credit which will be set against the actual use made</em></td><td></td><td></td></tr><tr><td><em>Information category</em></td><td><em>Cost per enquiry</em></td><td><em>Average access and download time</em></td></tr><tr><td>Financial Markets (updated every 20 minutes)</td><td>10c</td><td>30 seconds</td></tr><tr><td>Exchange Rates (updated hourly)</td><td>10c</td><td>30 seconds</td></tr><tr><td>Company News (updated twice a day)</td><td>10c</td><td>1 minute 30 seconds</td></tr><tr><td>Detailed Information</td><td>50c</td><td>2 minutes 30 seconds</td></tr><tr><td>Commodities in World Markets</td><td>10c</td><td>30 seconds</td></tr><tr><td><em>Probe's charges do not include the cost of phone calls. All calls are at local rates</em></td><td></td><td></td></tr></tbody></table><p>Megan's call charges are at local rates of 10c for up to 2 minutes and 5c per additional minute or part of a minute. In the first month, Megan seeks detailed information on 5 companies and uses the other services a total of 42 times.</p><p>How much will Probe bill her?</p>", "image": "", "options": ["$ 5.00", "$ 6.70", "$ 7.50", "$ 9.95", "$ 11.65"], "correct": 1, "verified": true, "src": "CRIT18", "orig": "images/q-90b65d09f1.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Минимальный платёж 5 $ — это кредит на использование.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 50 c + 42 · 10 c = 6,70 $.</li><li>Звонки оплачиваются телефонной компании. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только минимум.</li><li>C, D, E — с лишними суммами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минимум засчитывается, а не прибавляется.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p>A group of Construction students must choose their specialist options from the following list:</p><p>Bricklaying, Damp-proofing, Drainage, Flooring, Joinery, Plastering, Roofing</p><p>Each student must choose three options. The available options may be combined with each other in any way, with the exception of the restrictions that Damp-proofing and Drainage together may not be combined with Bricklaying or Plastering because of timetable constraints, and that students choosing Joinery must also choose Flooring.</p><p>How many possible combinations including Drainage could the students choose from?</p>", "image": "", "options": ["7", "8", "9", "10", "11"], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-d061e7ba3a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">К дренажу добираем 2 предмета из 6: C(6,2) = 15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минус гидроизоляция с кладкой или штукатуркой (2).</li><li>Минус столярка без настила (4).</li><li>15 − 6 = 9. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропущенные ограничения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте всё, потом вычитайте запреты.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p>I am a member of a book club. Every month I must choose at least one book. All books are sold at a discount of £2.00 on shop prices. I pay a fixed charge for postage regardless of which books I order.</p><p>Which one of the following graphs could show the relationship between the number of books ordered in a month and the total saving on shop prices (allowing for postage charge)?</p>", "image": "images/q-ac62e7aab8.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 2, "verified": true, "src": "CRIT18", "review": true, "orig": "images/q-ac62e7aab8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Экономия = 2 £ × книги − почта.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Растёт ровно на 2 £ за книгу и начинается ниже 2 £.</li><li>График C: 0, 2, 4, 6, 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не тот наклон или старт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Линейная зависимость: наклон 2.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p>The mock examination and actual GCSE results for English in one year at Morgan College are shown below:</p><table class=\"q-table\"><thead><tr><th></th><th></th><th>Actual GCSE exams</th><th></th></tr></thead><tbody><tr><td></td><td></td><td>Grades A-C</td><td>Other Grades</td></tr><tr><td>Mock GCSE exams</td><td>Grades A-C</td><td>90</td><td>25</td></tr><tr><td>Mock GCSE exams</td><td>Other grades</td><td>25</td><td>60</td></tr></tbody></table><p>What percentage of pupils had their GCSE results correctly predicted by their mock examination results?</p>", "image": "", "options": ["25.0 %", "50.0 %", "57.5 %", "60.0 %", "75.0 %"], "correct": 4, "verified": true, "src": "CRIT18", "orig": "images/q-81d153d258.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верно предсказано: совпали категории.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>90 + 60 = 150 из 200 = 75%. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та сумма.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Берите диагональ таблицы.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p>The trapezium below may be cut into four identical pieces.</p><p>Which of the following pieces can be used four times (flips and rotations are allowed) to make up the trapezium?</p>", "image": "images/q-fc70d9138a.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 0, "verified": true, "src": "CRIT18", "review": true, "orig": "images/q-fc70d9138a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Трапецию режем на 4 одинаковые части.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Четыре прямоугольные трапеции A: две — середина, две — скошенные края. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не складываются в эту трапецию.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пробуйте края трапеции.</div></div>"}, {"id": 23, "topic": "STR", "text": "<p>Researchers studying the effects of diet on health sometimes use 'randomised intervention trials'. One group - the intervention group - is asked to change some aspect of diet, for example eat less fat or more fruit, while the other group - the control group - is told to eat as normal. At the end of the trial the number of cases of, say, colon cancer, in the two groups can be compared. Such results could be misleading, because as the study progresses, the 'intervention' subjects become less conscientious about sticking to their supposedly healthy diet, so the longer the study goes on, the less the diets of the two groups differ. Yet to get results that are statistically significant, the study must go on as long as possible.</p><p>Which of the following, if true, most strengthens the above argument?</p>", "image": "", "options": ["'Control' subjects often change their diet in response to health information in the media.", "Diets that are low in fat and high in fruit are known to be beneficial to health.", "'Intervention' subjects know that the changes in diet could benefit their health.", "Some people have an inherited tendency to suffer from colon cancer.", "Statisticians who interpret the results take account of the effects of exercise and smoking."], "correct": 0, "verified": true, "src": "CRIT18", "orig": "images/q-964e11a44c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проблема: диеты групп со временем сближаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: контрольная группа тоже меняет диету после новостей → разрыв уменьшается быстрее. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не про сближение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усилитель добавляет вторую причину того же эффекта.</div></div>"}, {"id": 24, "topic": "FLAW", "text": "<p>When police raided a London nightclub known for selling illegal drugs, nine people were arrested. However, everybody was led outside, searched and photographed, whether or not drugs were found in their possession. Visiting a nightclub is not yet a crime, so it is a troubling breach of civil liberties that the police should keep a record of these people. Many of us are more comfortable with dealers operating in dark corners of nightclubs, rather than selling crack openly on busy daytime streets. Therefore, we should simply accept that drugs will be sold in nightclubs and hope they can be contained there.</p><p>Which one of the following best expresses a flaw in the argument?</p>", "image": "", "options": ["It assumes that the only alternative to excessive use of police powers and open drug dealing is acceptance of nightclubs selling drugs.", "It does not follow that the police abused people's civil rights by photographing them.", "It uses one example of a nightclub where drugs are sold to draw the conclusion that nightclubs sell drugs.", "It uses extreme and illogical steps to move from one nightclub raid to the unlikely prospect of crack being sold openly on the streets.", "Just because some people were not in possession of drugs does not mean that they were innocent of taking drugs."], "correct": 0, "verified": true, "src": "CRIT18", "orig": "images/q-7dcea45954.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из рейда автор делает вывод «принять наркотики в клубах».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Будто есть только два варианта. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ложная дилемма.</div></div>"}, {"id": 25, "topic": "MC", "text": "<p>Surveys of public opinion reveal that many people object to the idea of selling bodily organs for transplant. Some object on religious grounds claiming that the body is a sacred and holy thing which must not be violated. Others object on aesthetic grounds simply finding the idea of selling human livers for transplant somehow unpleasant or distasteful. But the sale of bodily organs can not be morally wrong. Everyone has the right to do what they want with their own private property and each person owns their own bodily organs.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["The body is a sacred and holy thing which must not be violated.", "Everyone has a right to do what they want with their own private property.", "Public opinion is strongly opposed to the sale of bodily organs for transplant.", "The sale of bodily organs can not be morally wrong.", "Surveys of public opinion reveal many people are opposed to the sale of bodily organs for transplant."], "correct": 3, "verified": true, "src": "CRIT18", "orig": "images/q-5fb3a7dadc.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — «но не может быть морально неправильной».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — довод.</li><li>A, C, E — чужие мнения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «But» часто вводит вывод.</div></div>"}, {"id": 26, "topic": "PS", "text": "<p>When Anton joined the company that he works for, 8 years ago, his salary was £29000. Each of his 8 annual salary increases has been 10% of his previous salary rounded <strong>up</strong> to the next multiple of £500.</p><p>What is Anton's current salary?</p>", "image": "", "options": ["£52500", "£58500", "£64500", "£67000", "£71000"], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-38a12edd40.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый год +10%, округлить вверх до 500 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>29 000 → 32 000 → 35 500 → 39 500 → 43 500 → 48 000 → 53 000 → 58 500 → 64 500.</li><li>Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка округления.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Округление вверх.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p>The Ruritanian Go Kart Drivers' Championship is decided over a series of 9 races. For each event the winner is allocated 10 points, second gets 8 points and third gets 5 points. All other finishers are given 1 point. The championship leaders' placings are shown below and the drivers all finished in each race.</p><table class=\"q-table\"><thead><tr><th></th><th>Damon</th><th></th><th>Nigel</th><th></th><th>Michael</th><th></th><th>David</th><th></th><th>James</th><th></th></tr></thead><tbody><tr><td><strong>Circuit</strong></td><td><strong>Total</strong></td><td><strong>Pl.</strong></td><td><strong>Total</strong></td><td><strong>Pl.</strong></td><td><strong>Total</strong></td><td><strong>Pl.</strong></td><td><strong>Total</strong></td><td><strong>Pl.</strong></td><td><strong>Total</strong></td><td><strong>Pl.</strong></td></tr><tr><td>Rague</td><td>10</td><td>1</td><td>5</td><td>3</td><td>8</td><td>2</td><td>1</td><td></td><td>1</td><td></td></tr><tr><td>Kolm</td><td>11</td><td></td><td>6</td><td></td><td>16</td><td>2</td><td>11</td><td>1</td><td>6</td><td>3</td></tr><tr><td>Ostrov</td><td>19</td><td>2</td><td>11</td><td>3</td><td>17</td><td></td><td>12</td><td></td><td>16</td><td>1</td></tr><tr><td>Vostok</td><td>29</td><td>1</td><td>19</td><td>2</td><td>18</td><td></td><td>13</td><td></td><td>21</td><td>3</td></tr><tr><td>Billard</td><td>39</td><td>1</td><td>27</td><td>2</td><td>23</td><td>3</td><td>14</td><td></td><td>22</td><td></td></tr><tr><td>Menz</td><td>47</td><td>2</td><td>28</td><td></td><td>24</td><td></td><td>24</td><td>1</td><td>27</td><td>3</td></tr><tr><td>Fondra</td><td>48</td><td></td><td>38</td><td>1</td><td>32</td><td>2</td><td>25</td><td></td><td>32</td><td>3</td></tr><tr><td>Hahn</td><td>49</td><td></td><td>43</td><td>3</td><td>40</td><td>2</td><td>35</td><td>1</td><td>33</td><td></td></tr><tr><td>Limberg</td><td>50</td><td></td><td>51</td><td>2</td><td>41</td><td></td><td>45</td><td>1</td><td>38</td><td>3</td></tr></tbody></table><p>Which was the earliest race after which one of the leaders knew he could not win the Drivers' Championship?</p>", "image": "", "options": ["Billard", "Menz", "Fondra", "Hahn", "Limberg"], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-af6aa73d83.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем гонку, после которой кто-то уже не может догнать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После Fondra осталось 2 гонки (макс. 20 очков).</li><li>Дэвид: 25 + 20 = 45 < 48 у Деймона — уже не выиграет.</li><li>После Menz ещё все могли догнать. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Hahn, Limberg — позже, не самая ранняя.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте с максимумом возможных очков.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p>The diagram shows the dimensions of an office and entrance lobby. I wish to carpet them. Each must have a single piece of carpet with no joins, but I can use two separate pieces for the two rooms. As I intend to do it as inexpensively as possible, I will buy an offcut.</p><p>Which of the following offcut pieces will be suitable?</p>", "image": "images/q-e631e569bd.jpg", "options": ["4.5 x 3.7 m", "5.0 x 4.0 m", "4.2 x 4.4 m", "2.6 x 5.8 m", "4.8 x 4.0 m"], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-e631e569bd.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Офис 4,2 × 2,6 м, холл 2,2 × 1,8 м.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В кусок 4,2 × 4,4: офис по стороне 4,2 (2,6 ширины), остаётся 4,2 × 1,8 под холл.</li><li>Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие куски не вмещают обе части.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте раскладку, а не только площадь.</div></div>"}, {"id": 29, "topic": "CON", "text": "<p>Rather than dumping sewage sludge in the North Sea, it has been suggested that it could be used as fertiliser on agricultural land. However, sewage sludge often contains waste from industry which is contaminated with heavy metals, some of which, e.g. zinc and cadmium, can be absorbed by plants. Zinc is generally present in the sewage in greater amounts than other metals and is a problem for crop production because it will kill plants at concentrations which are too low to cause toxicity to animals. However, concentrations of cadmium can become high enough to make plants dangerous as food without the cadmium having any obvious effect on the growth of plants.</p><p>Which one of the following can be inferred from claims made in the passage?</p>", "image": "", "options": ["If cadmium and zinc were removed from sewage sludge, it could safely be used as fertiliser.", "The greater risk to health from sewage sludge used as fertiliser would be its contamination with zinc.", "If sewage sludge contains cadmium, it is unwise to use it as a fertiliser.", "There is no future in using sewage sludge as a fertiliser.", "Dumping sewage sludge in the North Sea is safer than using it as fertiliser."], "correct": 2, "verified": true, "src": "CRIT18", "orig": "images/q-ef0030c0f9.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кадмий делает еду опасной, не меняя рост растений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, осадок с кадмием неразумно использовать как удобрение. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — могут быть другие металлы.</li><li>B, D, E — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод не должен выходить за текст.</div></div>"}, {"id": 30, "topic": "ASM", "text": "<p>We should restore capital punishment for the offence of pre-meditated murder. It is true that, in the past, occasional mistakes have been made and innocent men have been hanged. However, with the improvements in forensic science and DNA testing, the chances of a mistake have receded. Restoring capital punishment would ensure real justice is done and, incidentally, it would also save the country a considerable amount of money in housing prisoners on long life sentences.</p><p>Which one of the following is an assumption of the above argument?</p>", "image": "", "options": ["Forensic science is a foolproof way of determining guilt.", "Real justice can still be achieved even if there are occasional miscarriages.", "Financial considerations are the most important factors when considering criminal justice legislation.", "Long life sentences will not deter people from committing murder.", "The public would not be against the restoration of capital punishment."], "correct": 1, "verified": true, "src": "CRIT18", "orig": "images/q-62435a9c3d.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор признаёт казни невиновных, но говорит о «настоящей справедливости».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: справедливость возможна даже с редкими ошибками. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно.</li><li>C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение снимает признанное возражение.</div></div>"}, {"id": 31, "topic": "PS", "text": "A wooden cube with edges 3 cm long is painted on all six faces. It is then cut into 27 cubes, each with edges 1 cm long.<br><br><b>How many of the small cubes have paint on exactly two faces?</b>", "image": "", "options": ["6", "8", "12", "18", "24"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две окрашенные грани — у кубиков на рёбрах, но не в углах.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>На каждом из 12 рёбер один такой кубик → 12. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — центры граней (одна грань).</li><li>B — углы (три грани).</li><li>E — по 2 на ребро, как у куба 4 см.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Углы — 3 грани, рёбра — 2, центры граней — 1.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">There is no answer key for this mock yet — the questions are for practice only, without marking.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
