<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "<p>In recent years, urban planners have promoted mixed-use developments—neighborhoods where residential, commercial, and recreational facilities are within walking distance. Advocates argue that such layouts reduce reliance on cars, foster community ties, and increase physical activity. In one city, a pilot district built on this model reported a 25% decrease in local traffic and a 30% increase in local business engagement. Residents also reported feeling more connected to their neighborhood. Therefore, mixed-use development should become the standard for urban planning.</p><p>Which of the following expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Residents report greater satisfaction in mixed-use neighborhoods.", "Mixed-use developments improve local business engagement.", "Urban planning should adopt mixed-use development as a standard.", "Car usage decreased in a pilot district.", "Community ties are important in cities."], "correct": 2, "src": "CRIT39", "orig": "images/q-b79c3314be.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — после «Therefore».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Смешанная застройка должна стать стандартом градостроительства. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — посылки.</li><li>E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore» — вывод.</div></div>"}, {"id": 2, "topic": "FLAW", "text": "<p>Some educational theorists claim that students learn best through digital platforms, pointing to increased engagement when tablets and laptops are used in class. One school that switched entirely to digital materials observed a rise in class participation. However, the school also reduced class sizes and introduced new teaching staff during the same period. The theorists nevertheless cite the case as proof that digital tools are the key to better learning outcomes.</p><p>Which of the following is the best statement of the flaw in the above argument?</p>", "image": "", "options": ["It assumes digital tools were the only factor influencing the outcomes.", "Not all schools can afford digital tools.", "New teaching staff are always more effective.", "Participation does not indicate learning quality.", "Class size has no effect on student outcomes."], "correct": 0, "src": "CRIT39", "orig": "images/q-2ec98a0b8c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В тот же период уменьшили классы и пришли новые учителя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Теоретики считают, что дело только в планшетах. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Несколько изменений — нельзя назвать одну причину.</div></div>"}, {"id": 3, "topic": "ASM", "text": "<p>A public library plans to reduce its print book collection in favor of digital versions. The board argues that digital books are more accessible, especially to younger readers who prefer screens. They also point out that reducing physical books will create space for community events and workshops. However, some patrons, particularly older ones, have voiced concern about losing access to print materials.</p><p>Which one of the following is an underlying assumption of the above argument?</p>", "image": "", "options": ["Most patrons prefer digital books over printed ones.", "Older readers do not visit the library often.", "Community events are more important than reading.", "Digital books are cheaper than physical copies.", "Reducing print books will attract donors."], "correct": 0, "src": "CRIT39", "orig": "images/q-17bea20b85.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: заменить бумажные книги цифровыми.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это разумно, только если большинству читателей цифровые книги удобнее. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение о предпочтениях пользователей.</div></div>"}, {"id": 4, "topic": "STR", "text": "<p>A non-profit group advocates for banning single-use coffee cups, stating that these items contribute significantly to landfill waste. Critics argue that banning them will inconvenience customers and hurt coffee shop revenue. However, the group notes that in other cities where such bans were enacted, reusable cup usage increased rapidly without major effects on business profits.</p><p>Which of the following, if true, would most strengthen the argument above?</p>", "image": "", "options": ["Reusable cups are cheaper for businesses in the long run.", "Customers tend to dislike bringing their own cups.", "Coffee sales declined slightly after bans in other cities.", "Some shops already charge extra for disposable cups.", "Reusable cup production emits less carbon dioxide."], "correct": 0, "src": "CRIT39", "orig": "images/q-4398f593f6.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Критики: запрет повредит кофейням.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если многоразовые стаканы в итоге дешевле для бизнеса — опасения снимаются. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — ослабляют.</li><li>D, E — не про бизнес.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответьте на возражение критиков.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p>Looking in his rearview mirror, Graham sensed that there was something wrong with the number plate of the car behind him. When the car overtook him and he saw its rear plate he realised that the front plate had been upside down.</p><p>[Image: number plate reading S308 CNH]</p><p>What had Graham seen in his rearview mirror?</p>", "image": "images/q-9de8eefdbd.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 3, "src": "CRIT39", "review": true, "orig": "images/q-9de8eefdbd.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Номер, перевёрнутый вверх ногами, отражается в зеркале.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поворот на 180° + зеркальное отражение = отражение сверху вниз.</li><li>Порядок символов сохраняется, каждый символ переворачивается по вертикали: S → Ƨ, N → И, а 3, 0, 8, C, H не меняются.</li><li>Получается «Ƨ308 CИH». Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — изменили 3.</li><li>B — не перевернули N.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте по несимметричным буквам (S, N).</div></div>"}, {"id": 6, "topic": "PS", "text": "<p>A farmer wishes to fix fencing rails to posts which are already in place. The posts are shown in the diagram. The farmer has a supply of rails, each one 2.4 m long. One rail or part of a rail is to be fixed between each pair of posts. (He can cut the rails into smaller lengths.)</p><p>The distances between centres of posts are: 115 cm, 90 cm, 120 cm, 180 cm, 210 cm, 150 cm, 210 cm.</p><p>What is the smallest number of rails that he could use?</p>", "image": "images/q-68424696ee.jpg", "options": ["5", "3", "4", "6", "7"], "correct": 0, "src": "CRIT39", "orig": "images/q-68424696ee.jpg", "review": true, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый промежуток — целая часть одной рейки (240 см). Нужно сложить их по рейкам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма 1075 см → минимум 5 реек (4 · 240 = 960 мало).</li><li>Пример: 210 | 210 | 180 | 150 + 90 | 115 + 120. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — меньше общей длины.</li><li>D, E — больше, чем нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала нижняя граница, потом пример.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p>Deanna keeps a record of the petrol she puts into her car and the current distance it has covered so she can estimate her fuel consumption. When she puts petrol in, sometimes the tank is filled completely and she marks 'FULL' beside the entry if this is so, otherwise the tank is only partly filled.</p><p>Her data for the last month is as follows:</p><table class=\"q-table\"><thead><tr><th>Date</th><th>Total km</th><th>Fuel added</th><th>FULL?</th></tr></thead><tbody><tr><td>2 June</td><td>23,508</td><td>5 litres</td><td></td></tr><tr><td>6 June</td><td>23,805</td><td>37 litres</td><td>FULL</td></tr><tr><td>12 June</td><td>24,350</td><td>25 litres</td><td></td></tr><tr><td>17 June</td><td>24,743</td><td>21 litres</td><td></td></tr><tr><td>23 June</td><td>24,989</td><td>34 litres</td><td>FULL</td></tr><tr><td>27 June</td><td>25,454</td><td>18 litres</td><td></td></tr></tbody></table><p>Which one of the following is the best estimate of her fuel consumption?</p>", "image": "", "options": ["9.9 litres / 100 km", "7.7 litres / 100 km", "1.7 litres / 100 km", "6.8 litres / 100 km", "8.0 litres / 100 km"], "correct": 3, "src": "CRIT39", "orig": "images/q-c58b1c9b92.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точно считать можно только между двумя полными заправками.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>От 6 июня (FULL) до 23 июня (FULL): 24 989 − 23 805 = 1184 км.</li><li>Залито после 6 июня до 23 июня: 25 + 21 + 34 = 80 л.</li><li>80 : 1184 · 100 ≈ 6,8 л/100 км. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — взяли неполные заправки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Полный бак → полный бак» — точный расход.</div></div>"}, {"id": 8, "topic": "FLAW", "text": "<p>A major city introduced electric buses as part of its commitment to reduce carbon emissions. City officials announced that these buses produce zero emissions and therefore contribute nothing to environmental damage. However, environmental groups pointed out that the production and disposal of electric bus batteries release harmful pollutants and require significant energy use. The city's argument ignores these factors in its conclusion.</p><p>Which of the following is the best statement of the flaw in the above argument?</p>", "image": "", "options": ["It fails to consider environmental costs outside of direct emissions.", "Not all buses in the fleet were replaced.", "The city's electricity comes from renewable sources.", "Pollution is not the only environmental issue.", "Battery disposal is not regulated."], "correct": 0, "src": "CRIT39", "orig": "images/q-56664ff6f2.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Город учитывает только выбросы при езде.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не учтён вред от производства и утилизации батарей. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не учтены косвенные затраты.</div></div>"}, {"id": 9, "topic": "ASM", "text": "<p>A startup company plans to reduce employee turnover by introducing unlimited vacation days. Management believes that if employees are given more freedom over their schedules, they will feel more valued and committed to the company. Similar policies at a few other firms have reportedly improved job satisfaction. The company hopes that this change will foster long-term loyalty.</p><p>Which of the following is an underlying assumption of the above argument?</p>", "image": "", "options": ["Greater scheduling freedom leads to stronger employee loyalty.", "Employees prefer vacation over bonuses.", "The company can afford to lose productivity.", "Most employees will take fewer days off than allowed.", "Staff members value transparency."], "correct": 0, "src": "CRIT39", "orig": "images/q-82299b41b8.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: больше свободы → больше преданности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это допущение. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение связывает меру и цель.</div></div>"}, {"id": 10, "topic": "FLAW", "text": "<p>Members of the jury: the defendant claimed in his statement to the police that he had never been to the victim's house in his life. However, the police have a number of witnesses who can testify that this claim is incorrect. Since the only plausible explanation for the defendant lying is that he has something to hide, there can be no doubt that he is guilty of the crime.\"</p><p>A major flaw in the above argument is that:</p>", "image": "", "options": ["It overlooks the principle that a person is innocent until proven guilty.", "It implies that the jury can decide whether the defendant's statement was true.", "It assumes that what he has to hide is his guilt.", "It bases the argument on a claim that is also the conclusion.", "It attacks the defendant rather than the defendant's case."], "correct": 2, "src": "CRIT39", "orig": "images/q-309d3a41f6.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из «он солгал» обвинение делает «он виновен».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Он мог скрывать что-то другое. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скрывать ≠ быть виновным.</div></div>"}, {"id": 11, "topic": "STR", "text": "<p>Hypochondriacs are people with an abnormal anxiety about their health. They think that every symptom of illness, however trivial, is evidence that they have a serious or fatal disease. Over the past few years, a large amount of information relating to disease has appeared on the Internet. The availability of this information, far from being reassuring, is very bad for hypochondriacs, because they are able to spend so much time researching potential illnesses, thus making themselves more and more anxious. Moreover, much of the information is inaccurate. Hypochondriacs should ignore the Internet, and instead seek medical advice and reassurance from their own doctors.</p><p>Which one of the following, if true, most strengthens the above argument?</p>", "image": "", "options": ["Hypochondriacs often mistrust what doctors tell them.", "Doctors are too busy to deal with the problems of hypochondriacs.", "The incidence of hypochondria has not increased over the past few years.", "Hypochondriacs can be referred by doctors for effective treatment of anxiety.", "Hypochondriacs are not the only people who use the Internet for information about illness."], "correct": 3, "src": "CRIT39", "orig": "images/q-5d6a77fe03.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: идите к врачу, а не в интернет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если врач может направить на лечение тревожности — совет полезен. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — ослабляют.</li><li>C, E — не связаны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подтвердите пользу рекомендации.</div></div>"}, {"id": 12, "topic": "MC", "text": "<p>Animal extinction is a problem. Many species which existed when our grandparents were children now no longer exist and each year more animals face extinction. Up to now governments have done relatively little to ensure the survival of animals, despite having the financial resources. Although laws are passed to protect certain 'popular' animals, such as lions and elephants, other less popular animals such as frogs and insects are not protected and are disappearing. Much effort to protect animals is made by wildlife charities that rely on public generosity to carry out their very necessary conservation work. It should be governments that take the leading role and actively ensure that the correct funding and methods are in place to stop animals becoming extinct. The charities' role should be one of support to the governments given their lack of finance.</p><p>Which one of the following is the main conclusion of the above argument?</p>", "image": "", "options": ["Charities do a lot of work to protect animals so additional government support is unlikely to improve the situation.", "Governments should take a more active role in protecting all endangered species.", "Charities do not have sufficient finance to protect endangered species.", "Support should really be for the more popular types of animals rather than less well known types.", "Animal extinction is a problem."], "correct": 1, "src": "CRIT39", "orig": "images/q-eae78b7a43.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — рекомендация.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Правительства должны активнее защищать все исчезающие виды. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — противоречат.</li><li>C, E — посылки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «It should be governments…» — вывод.</div></div>"}, {"id": 13, "topic": "ASM", "text": "<p>Bad breath can be caused by bacteria in the mouth, the smell coming from the compounds that they produce. Chewing cinnamon-flavoured gum can reduce the problem. In a study involving three different types of gum, it was found that gum flavoured with cinnamon was the most effective in reducing the amount of bacteria in the mouth (by more than 50%). A second gum which contained natural flavours (not including cinnamon) was less effective but, because it also contained a plant extract that suppressed bacteria, it eliminated about 40% of the bacteria. The third gum, with no flavouring, produced no significant reduction in bacteria. Thus people who use chewing gum should use that flavoured with cinnamon (or at least one with a plant extract that has a similar effect).</p><p>Which one of the following is an underlying assumption of the above argument?</p>", "image": "", "options": ["Bacteria in the mouth cause no greater problem than bad breath.", "Chewing gum is either unflavoured or has natural flavours.", "People use chewing gum in order to deal with the problem of bad breath.", "Bad breath has no other cause than bacteria in the mouth.", "Cinnamon-flavoured chewing gum is the best method of treating bad breath."], "correct": 2, "src": "CRIT39", "orig": "images/q-36fc12d307.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: выбирайте жвачку с корицей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это разумно, только если люди жуют жвачку от неприятного запаха. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — слишком сильно или не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Совет имеет смысл при этой цели.</div></div>"}, {"id": 14, "topic": "ASM", "text": "<p>One of the best features of the Internet is said to be that it is a vast store of knowledge. Yet, because there is so much of it, accessing the particular piece of information that you want is at least as time consuming as visiting a library and searching for it there. Also, there is no guarantee that the information itself is reliable, because anyone can put any information on the Internet without the information being scrutinised for accuracy. Hence, the books found in libraries are a far better resource for those who wish to increase their knowledge.</p><p>Which one of the following is an assumption underlying the above argument?</p>", "image": "", "options": ["Most of the information on the Internet is inaccurate.", "Visiting libraries is less convenient than using the Internet.", "The content of books is likely to be more reliable than that of the Internet.", "Many contributors to the Internet aim to mislead Internet users.", "Much of the information on the Internet is not useful."], "correct": 2, "src": "CRIT39", "orig": "images/q-e40cbac427.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: книги лучше интернета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: книги надёжнее интернета. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — слишком сильно.</li><li>B — противоречит.</li><li>E — не нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Довод «интернет ненадёжен» работает, только если книги надёжнее.</div></div>"}, {"id": 15, "topic": "MC", "text": "<p>A national art museum held a month-long exhibit with no entrance fee. Attendance doubled compared to previous months, and visitors stayed longer on average. Surveys indicated that many first-time guests felt more welcome and intended to return. The museum board concluded that free access plays a key role in increasing public engagement with the arts.</p><p>Which of the following expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Museum visitors stayed longer during the free exhibit.", "Surveys showed increased visitor satisfaction.", "Free entry increases public engagement in the arts.", "People are more likely to visit new exhibits.", "Museums should offer free admission to attract youth."], "correct": 2, "src": "CRIT39", "orig": "images/q-b7d8d2c79c.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — мнение совета музея.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бесплатный вход повышает интерес к искусству. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — посылки.</li><li>D, E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Concluded that…» — вывод.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p>Stanley and Walter are two old friends who have recently discovered the art of texting. They can't cope with text language, but, when communicating with each other, they use a code that they invented many years ago. The code is a substitution code with a twist. When a particular letter appears for the first time in a message it is encoded as the next letter in the alphabet (A becomes B, Z becomes A). On each subsequent appearance it becomes the next letter again (A becomes C, Z becomes B).</p><p>For example:</p><p>ARE YOU AT HOME TODAY? encodes as BSF ZPV CU IQNG VREDA?</p><p>Stanley is about to text Walter with the following message. THE CONCERT TONIGHT STARTS AT HALF PAST SEVEN</p><p>How will Stanley encode the word SEVEN?</p>", "image": "", "options": ["WHWHQ", "WHWIQ", "WHXHQ", "WHXIQ", "WHWHH"], "correct": 1, "src": "CRIT39", "orig": "images/q-a239675fcd.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем, какой раз встречается каждая буква в сообщении.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S: в STARTS (2), PAST (1) → в SEVEN 4-я → +4 = W.</li><li>E: THE, CONCERT → в SEVEN 3-я → +3 = H; V — 1-я → W; E — 4-я → I.</li><li>N: CONCERT, TONIGHT → 3-я → +3 = Q.</li><li>WHWIQ. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка в счёте повторов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте все буквы с начала сообщения.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p>Ali, Bert, Huck and Tom are the only participants in a somewhat unusual auction. For each item, one of them is given the opportunity to make an opening bid. This bid must be a whole number of dollars. Anyone can then bid more than this, but the bid must be exactly $10 more than the opening bid. If anyone makes this bid he gets the item for the amount of this bid. Otherwise, the person who made the opening bid gets the item for the amount of the opening bid.</p><p>The next item for sale is one that all four want. However, Tom knows that Ali will pay no more than $113 for it, Bert no more than $115, and Huck no more than $118. Tom will pay up to $121 and it is Tom's turn to make the opening bid.</p><p>What is the lowest bid Tom can make and yet ensure that he gets the item?</p>", "image": "", "options": ["$109", "$111", "$112", "$114", "$115"], "correct": 0, "src": "CRIT39", "orig": "images/q-dd42b2f459.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перебить могут, если ставка + 10 не больше их предела.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Самый щедрый соперник — Хак ($118).</li><li>Нужно X + 10 &gt; 118 → X ≥ 109. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — больше, чем нужно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же тип, что crit-7.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p>Nicola works for an international agency which is based in the United Kingdom. One of the most important parts of her job is discussing communication systems with her colleagues worldwide. All of them work from 08:00 to 17:00 local time with a flexible 1-hour lunch break, taken when possible.</p><p>An upgrade to a system needs to be discussed and so a 1-hour video conference has to be organised. The time differences of the colleagues are shown in the table below.</p><table class=\"q-table\"><thead><tr><th>City</th><th>Time difference</th></tr></thead><tbody><tr><td>Accra</td><td>−1 hr</td></tr><tr><td>Addis Ababa</td><td>+2 hrs</td></tr><tr><td>Karachi</td><td>+4 hrs</td></tr><tr><td>Montevideo</td><td>−4 hrs</td></tr><tr><td>Tehran</td><td>+3.5 hrs</td></tr></tbody></table><p>At what local time will the conference start in Tehran?</p>", "image": "", "options": ["14:30", "15:00", "15:30", "16:00", "16:30"], "correct": 2, "src": "CRIT39", "orig": "images/q-847fc2ba88.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим рабочие часы в UK.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Карачи: 04:00–13:00, Монтевидео: 12:00–21:00 → общее только 12:00–13:00 UK.</li><li>Остальные в это время работают.</li><li>В Тегеране это 15:30. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный сдвиг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите пересечение крайних городов.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p>Kevin owns a games shop and is about to order copies of a new game which will be released next week. Because of the game's expected popularity, each retailer is only allowed to place one order. Kevin is confident that he could sell at least 300 copies of the game, but he only has enough space in his shop to store 50 copies. There are two possibilities for additional storage space that he can hire. The first will hold up to 100 copies of the game and would cost $300. The second will hold up to 150 copies of the game and would cost $650. Kevin will make $4 profit on each game sold if he does not hire any additional storage space.</p><p>What is the most profit that Kevin can make from the games that he orders?</p>", "image": "", "options": ["$150", "$200", "$250", "$300", "$350"], "correct": 3, "src": "CRIT39", "orig": "images/q-eb90336a9a.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем варианты хранения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Без аренды: 50 · 4 = $200.</li><li>+100 мест ($300): 150 · 4 − 300 = $300.</li><li>+150 ($650): 200 · 4 − 650 = $150; оба: 1200 − 950 = $250.</li><li>Максимум $300. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не лучший вариант.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переберите все варианты.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p>Having established the relationship between the height and the volume of liquid in this flask, a laboratory worker uses this information to calculate how he should regulate the flow of liquid into the flask so that the height of liquid rises at a constant rate.</p><p>Which one of the following graphs best represents the planned flow of liquid?</p>", "image": "images/q-307bc7fa12.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 2, "src": "CRIT39", "review": true, "orig": "images/q-307bc7fa12.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поток пропорционален ширине колбы на текущей высоте.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Узко внизу → мало; широкая часть → максимум; горлышко → мало и постоянно.</li><li>График C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — в конце больше, чем в начале.</li><li>B — острый пик.</li><li>D — сначала постоянно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в crit-7.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "<p>A diet company claims that 90% of its customers lose weight within the first month of using their meal plan. However, it does not disclose that these customers also signed up for weekly fitness coaching. Furthermore, the company does not provide data on whether these customers kept the weight off in the long term. By focusing only on short-term results, the company may be presenting a misleading picture of the program's effectiveness.</p><p>Which of the following is the best statement of the flaw in the above argument?</p>", "image": "", "options": ["It draws a conclusion based on incomplete evidence.", "Weight loss depends more on exercise than diet.", "Some customers may have had prior health conditions.", "The company's advertising was overly optimistic.", "Customers did not all follow the plan correctly."], "correct": 0, "src": "CRIT39", "orig": "images/q-cd1c6f0b8f.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Результат зависит и от тренировок, долгосрочных данных нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод на неполных данных. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не показаны важные данные.</div></div>"}, {"id": 22, "topic": "ASM", "text": "<p>To reduce the number of traffic accidents, a city installs speed cameras on major roads. Officials argue that drivers will slow down to avoid fines, resulting in safer streets. They also believe that the presence of cameras will serve as a constant reminder to obey speed limits, especially in accident-prone areas.</p><p>Which one of the following is an underlying assumption of the above argument?</p>", "image": "", "options": ["Drivers are more likely to obey laws when penalties are visible.", "Speeding is the primary cause of accidents.", "Cameras are cheaper than hiring more police.", "Fines discourage people from driving entirely.", "The public supports camera surveillance."], "correct": 0, "src": "CRIT39", "orig": "images/q-fe30409eae.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: камеры заставят снижать скорость.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: водители соблюдают правила, когда штраф заметен. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Механизм: видимый штраф → послушание.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p>Charlie's Chicken and Lentil restaurant operates in several countries, with each outlet having exactly the same items on the menu. Company policy is to charge the same basic price, measured in Bolandian dollars, for any item in any country, but this basic price is supplemented by any local taxes. In Bolandia the only tax is a general 25% tax on all restaurant food and drink, and in Charlie's a customer pays $5.00 for a chicken burger with fries, and $2.00 for a soft drink. In Colandia the currency is the colan, and there are exactly two colans to every Bolandian dollar. There is no general tax on restaurant food but there is a special 50% tax on all soft drinks.</p><p>What would a customer in Colandia have to pay for a meal of a chicken burger with fries and a soft drink at Charlie's?</p>", "image": "", "options": ["12.00 colans", "12.80 colans", "13.50 colans", "14.00 colans", "15.00 colans"], "correct": 1, "src": "CRIT39", "orig": "images/q-f280f2ff25.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Базовая цена без налога.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бургер: 5 : 1,25 = 4 $; напиток: 2 : 1,25 = 1,6 $.</li><li>Колан: бургер 8, напиток 1,6 · 1,5 · 2 = 4,8.</li><li>Итого 12,80 колана. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — налог не убран.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала уберите налог Боландии.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p>At 12:45 Jimmy left his home in Pinetrees and cycled to visit his grandmother in Oakville. On his way he stopped for 10 minutes in Rowan for a coffee and then he popped in to see his friend in Yewton. He arrived in Oakville at 16:25. Jimmy cycled at a steady speed of 24 km/h and his average speed for the whole journey, including the stops, was 18 km/h.</p><p>For how long did Jimmy stop in Yewton?</p>", "image": "", "options": ["40 minutes", "45 minutes", "55 minutes", "60 minutes", "70 minutes"], "correct": 1, "src": "CRIT39", "orig": "images/q-55dc45c86b.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время пути 3 ч 40 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Расстояние: 18 · <span class=\"fr\"><span>11</span><span>3</span></span> = 66 км.</li><li>Езда: 66 : 24 = 2 ч 45 мин.</li><li>Остановки 55 мин; минус 10 → в Юэтоне 45 мин. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя скорость включает остановки.</div></div>"}, {"id": 25, "topic": "STR", "text": "<p>An environmental group claims that switching from gas to electric heating in homes will significantly reduce household carbon emissions. Some critics argue that electricity still relies on fossil fuels. However, the group maintains that overall emissions will still be lower due to improved energy efficiency and growing use of renewable energy.</p><p>Which of the following, if true, would most strengthen the group's argument?</p>", "image": "", "options": ["The local power grid is increasingly powered by renewable sources.", "Electric heating systems require less maintenance.", "Gas is currently cheaper than electricity.", "Many homeowners are reluctant to upgrade.", "Electricity rates vary by season."], "correct": 0, "src": "CRIT39", "orig": "images/q-bf37d96b43.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Критики: электричество из ископаемого топлива.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если сеть всё больше на возобновляемой энергии — выбросы ниже. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не про выбросы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответьте на возражение.</div></div>"}, {"id": 26, "topic": "MC", "text": "<p>A tech company introduced a four-day workweek and found that productivity remained stable while employee satisfaction increased. Many employees reported feeling more focused during work hours and appreciated the extra time for rest and family. Management noted a decline in sick days and fewer burnout complaints. Based on this experience, the company concluded that shorter workweeks can improve both performance and well-being.</p><p>Which of the following expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Employees took fewer sick days.", "Staff appreciated more personal time.", "A four-day workweek boosts productivity and well-being.", "Burnout is a common issue in tech jobs.", "The company changed its work culture."], "correct": 2, "src": "CRIT39", "orig": "images/q-b1268f4fc4.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод компании.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Короткая неделя улучшает и работу, и самочувствие. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — посылки.</li><li>D, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Concluded that…» — вывод.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p>During a guided tour of Sindrow Castle, a group of tourists climbed to the top of Fineview Tower. At the top, the guide asked the six children in the group to guess how many steps they had climbed. Their guesses were 155, 157, 167, 168, 179 and 183. The guide revealed that the closest guess was only 3 more or less than the correct number and that two of the other guesses were no more than 10 away.</p><p>How many steps had they climbed?</p>", "image": "", "options": ["160", "164", "171", "176", "178"], "correct": 2, "src": "CRIT39", "orig": "images/q-dfa0b1adac.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем варианты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>171: ближе всех 168 (3); в пределах 10 ещё 167 (4) и 179 (8) — ровно две. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>160, 164 — в пределах 10 три догадки.</li><li>176, 178 — ближайшая не 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте оба условия.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p>William decided to track the number of calories that he consumed on each day last week. The table shows the quantity of calories he consumed at each meal on each day.</p><table class=\"q-table\"><thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody><tr><td>Monday</td><td>500</td><td>1200</td><td>800</td></tr><tr><td>Tuesday</td><td>700</td><td>1500</td><td>800</td></tr><tr><td>Wednesday</td><td>600</td><td>1000</td><td>1000</td></tr><tr><td>Thursday</td><td>600</td><td>1400</td><td>1000</td></tr><tr><td>Friday</td><td>800</td><td>400</td><td>800</td></tr></tbody></table><p>Which of the following bar charts shows the total number of calories for each day?</p>", "image": "images/q-e895b96f78.jpg", "options": ["A", "B", "C", "D", "E"], "correct": 3, "src": "CRIT39", "review": true, "orig": "images/q-e895b96f78.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Суммы по дням: 2500, 3000, 2600, 3000, 2000.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вт и Чт — максимум, Ср чуть выше Пн, Пт — минимум.</li><li>Это график D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — порядок не совпадает.</li><li>C — Ср и Пт не в тех пропорциях.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала посчитайте суммы.</div></div>"}, {"id": 29, "topic": "MC", "text": "<p>A national park installed motion-sensor cameras to monitor wildlife and discovered that several rare species still inhabit the area. Environmentalists welcomed the news, stating it proves that conservation efforts in the region are working. Based on the evidence collected, the park authorities plan to expand protected zones and continue their current policies.</p><p>Which of the following expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Conservation policies in the park should continue.", "Motion-sensor cameras are useful for research.", "Rare species have been rediscovered.", "Protected zones must cover more ground.", "Park officials made the right decision."], "correct": 0, "src": "CRIT39", "orig": "images/q-dfa8288887.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — что делать дальше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужно продолжать текущую политику охраны. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — посылки.</li><li>D, E — не главное.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> План действий — вывод.</div></div>"}, {"id": 30, "topic": "ASM", "text": "<p>A recent university report claims that mandatory volunteer programs increase students' sense of civic responsibility. The report explains that when students are required to participate in community service, they become more aware of local issues and are more likely to continue volunteering in the future. The university plans to expand the program to all undergraduate students.</p><p>Which one of the following is an underlying assumption of the above argument?</p>", "image": "", "options": ["Required volunteering does not lead to resentment or reduced motivation.", "All students have time to participate in community service.", "Civic responsibility can be accurately measured."], "correct": 0, "src": "CRIT39", "review": true, "orig": "images/q-d1ee03fbd9.jpg", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: обязательное волонтёрство повышает ответственность.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это работает, только если принуждение не вызывает обиду и не снижает мотивацию. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — не обязательно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение снимает очевидное возражение.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  }

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
