<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"<p>For much of the twentieth century, mental illness was mainly treated as a medical problem, addressed through diagnosis and hospital-based care. As a result, funding and policy focused largely on clinical services, while social and economic influences on mental health received far less attention. In recent years, however, growing evidence has highlighted the role of factors such as employment, housing and social inclusion in shaping mental wellbeing. For this reason, mental health policy should not rely on medical treatment alone, but should also prioritise long-term social and community-based support. At the same time, some experts continue to argue that clinical care must remain at the centre of any effective system.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>","image":"","options":["Mental health care has failed because too much attention was given to hospitals and medication in the past.","Recent research proves that social factors are more important than medical treatment in mental health care.","Since social conditions affect mental wellbeing, governments should reduce funding for clinical services.","Effective mental health care should combine medical treatment with sustained social and community-based support.","Disagreements about mental health policy will continue because experts hold different views."],"correct":3,"src":"CRIT32","orig":"images/q-4cc32d8e12.jpg"},{"id":2,"text":"<p>To manufacture one <strong>fluxor</strong>, a factory requires 3 kg of <strong>ironite</strong>, 4 kg of <strong>plaxium</strong>, and 6 kg of <strong>zorium</strong>. The factory currently has no stock of any of these materials and is about to receive a single delivery of all three. The manager wants to determine the <strong>maximum number of fluxors</strong> that can be produced from this delivery.</p><p>Which one of the following sets of information, <strong>by itself</strong>, would be sufficient to determine this number?</p>","image":"","options":["There is 300 kg of ironite, 900 kg of zorium, and more plaxium than ironite but less plaxium than zorium","There is 480 kg of plaxium, and there is four times as much zorium as ironite, and more zorium than ironite and plaxium combined","There is 300 kg of ironite, 480 kg of plaxium, and more than three times as much zorium as ironite","There is 900 kg of zorium, and there is twice as much plaxium as ironite, and more than twice as much zorium as plaxium"],"correct":2,"src":"CRIT32","review":true,"orig":"images/q-7ac3bae6f2.jpg"},{"id":3,"text":"<p>After Symbat closed her bookshop, she decided to donate her collection of <strong>art magazines</strong> to a local college.</p><p>Because there were too many magazines to transport at once, <strong>50% of the original collection</strong> was placed in a crate for the first visit. By the end of that day, <strong>two fifths</strong> of the magazines in the crate had been taken.</p><p>At the second visit, a further <strong>30% of the original collection</strong> was added to the crate. During this visit, <strong>three quarters</strong> of the magazines currently in the crate were taken.</p><p>At the third visit, the remaining magazines from the original collection were added to the crate. At this point, there were <strong>42 magazines</strong> available for students to choose from.</p><p>How many magazines were there in the original collection?</p>","image":"","options":["90","120","180","240"],"correct":1,"src":"CRIT32","review":true,"orig":"images/q-e15a75efe3.jpg"},{"id":4,"text":"<p>Universities have expanded mental health provision for students over the past decade, offering counselling services, wellbeing workshops and online support tools. Despite this, levels of stress, anxiety and depression reported by students continue to rise. Academic competition, financial pressure, social isolation and uncertainty about future employment are frequently cited as contributing factors. While universities often frame student mental health as an individual issue requiring personal resilience and coping strategies, critics argue that institutional structures themselves generate many of the pressures students experience. Large class sizes, rigid assessment systems and limited academic support can exacerbate stress, particularly for students from disadvantaged backgrounds.</p><p>Which one of the following can be drawn as a conclusion from the above passage?</p>","image":"","options":["University mental health services are ineffective and should be reduced.","Rising levels of student distress cannot be explained solely by individual vulnerability.","Financial pressure is the most significant cause of poor student mental health.","Universities deliberately ignore the impact of institutional practices on wellbeing.","Personal resilience training is less important than counselling provision."],"correct":1,"src":"CRIT32","orig":"images/q-fd037b1b25.jpg"},{"id":5,"text":"<p>Members of the Shaiji community in southwestern Bangladesh have long relied on plant-based remedies to treat a wide range of illnesses. These remedies are prepared using locally available plants and knowledge passed down through generations. Advocates of traditional medicine argue that such practices should be preserved and integrated into modern health care systems, as they are culturally appropriate and environmentally sustainable. Since these remedies have been used successfully for many years, it follows that incorporating them into formal medical practice would improve health outcomes in the region.</p><p>Which one of the following is an assumption on which the above argument depends?</p>","image":"","options":["Traditional remedies are always safer than pharmaceutical drugs.","Knowledge transmitted through generations is necessarily reliable.","The continued use of a remedy indicates that it has genuine therapeutic benefits.","Modern medical systems are inaccessible to rural communities.","Environmental sustainability should be prioritised over clinical effectiveness."],"correct":2,"src":"CRIT32","orig":"images/q-52f09223cb.jpg"},{"id":6,"text":"<p>Archaeological evidence suggests that the domestication of cats did not result from deliberate human breeding, but rather from a commensal process. Early agricultural settlements attracted rodents, which in turn drew wild cats. Humans tolerated the presence of these cats because they reduced pest populations, while cats benefited from a reliable food source. Over time, this mutually beneficial relationship led to closer proximity between humans and cats. Studies of early domesticated cats also indicate that they show only minor physical and behavioural differences from their wild ancestors. This evidence supports the view that cat domestication occurred gradually as a by-product of early farming practices rather than as a planned human intervention.</p><p>Which one of the following, if true, would most strengthen the above argument?</p>","image":"","options":["Genetic evidence shows that domesticated cats differ only slightly from their wild ancestors.","Early farming communities kept detailed records of animal breeding practices.","Some domesticated animals, such as dogs, show clear signs of selective breeding.","Modern wild cats are incapable of adapting to human environments.","Agricultural societies valued animals primarily for religious reasons."],"correct":0,"src":"CRIT32","orig":"images/q-28b12d0711.jpg"},{"id":7,"text":"<p>Laura's robot is programmed using the three commands: F: take one step forward R: turn right 90 degrees and take one step forward L: turn left 90 degrees and take one step forward For example, the command FRR would lead to the journey shown below (viewed from above):</p><p>The robot is given a new command which makes the journey shown below.</p><p>Which of the following statements is true for the command that makes this journey?</p>","image":"images/q-5300c4ea36.jpg","options":["F is always immediately followed by R","R is always immediately preceded by F","L is always immediately followed by R","R is always immediately preceded by L"],"correct":3,"src":"CRIT32","review":true,"orig":"images/q-5300c4ea36.jpg"},{"id":8,"text":"<p><strong>Samira and Miras both use speedometers on their bicycles to track how fast they ride.</strong> One day they cycle the same path: Samira completes it in <strong>62 minutes</strong>, while Miras takes <strong>54 minutes</strong>. Samira's speedometer records the path length as <strong>12.4 km</strong>, but Miras's speedometer indicates <strong>13.1 km</strong>.</p><p>Samira decides to have her speedometer checked by a certified expert, who tells her that her device <strong>under-estimates distances by 2.8%</strong>. Miras knows that his speedometer may consistently over- or under-estimate distances, but he does not have it checked.</p><p>Miras wants to calculate as accurately as possible his <strong>average speed on the path he cycled with Samira</strong>, and his <strong>average speed on future rides using his own speedometer</strong>.</p><p>Which of the pieces of information below is <strong>unnecessary</strong> to make such calculations?</p>","image":"","options":["Samira completed the path in 62 minutes.","Samira's speedometer recorded the path as 12.4 km.","Samira's speedometer under-estimates distance by 2.8%.","Miras completed the path in 54 minutes.","Miras's speedometer recorded the path as 13.1 km."],"correct":0,"src":"CRIT32","orig":"images/q-c3eb6e988c.jpg"},{"id":9,"text":"<p>Cats appear frequently in literary works across cultures, often depicted as mysterious, independent or morally ambiguous creatures. In some texts they are associated with magic or the supernatural, while in others they serve as loyal companions or symbols of domestic life. Because cats are portrayed in such a wide range of symbolic roles, it is clear that authors use them deliberately to convey complex meanings rather than merely as realistic animals. Therefore, whenever a cat appears in a literary text, it must have a symbolic function essential to the interpretation of the work.</p><p>Which one of the following best expresses the flaw in the above argument?</p>","image":"","options":["It assumes that literary symbolism is consistent across cultures and historical periods.","It overlooks the possibility that some literary details serve no symbolic purpose.","It confuses the author's intention with the reader's interpretation.","It assumes that animals are more symbolically significant than human characters.","It fails to distinguish between positive and negative symbolic meanings."],"correct":1,"src":"CRIT32","orig":"images/q-6748677879.jpg"},{"id":10,"text":"<p>Since the mid-twentieth century, Antarctica has been governed by international agreements that emphasise scientific cooperation and environmental protection. These arrangements are often praised for insulating the continent from geopolitical conflict. However, climate change is increasing access to previously inaccessible areas and resources, raising concerns that states may seek to assert greater control over Antarctic territory. Given these developments, it is likely that climate change will undermine the cooperative political framework that has governed Antarctica since the International Geophysical Year.</p><p>Which one of the following, if true, would most weaken the above argument?</p>","image":"","options":["Scientific research stations in Antarctica have expanded significantly in recent decades.","International treaties governing Antarctica explicitly prohibit territorial claims regardless of environmental change.","Climate change has accelerated faster in polar regions than elsewhere on the planet.","Some states have expressed interest in exploiting Antarctic resources in the future.","Access to Antarctica remains technologically challenging and expensive."],"correct":1,"src":"CRIT32","orig":"images/q-ccb6e956f6.jpg"},{"id":11,"text":"<p>Ai Weiwei is often described as a political dissident whose work challenges the authority of the Chinese state. While his art frequently addresses issues of censorship, surveillance and human rights, it also draws heavily on traditional Chinese cultural forms and historical references. Rather than rejecting China's past, Ai Weiwei reinterprets it, using familiar symbols to expose contradictions within contemporary political discourse. This combination of critique and cultural continuity explains why Ai Weiwei's work resonates both within China and internationally.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>","image":"","options":["Ai Weiwei's art is primarily concerned with opposing the Chinese government.","Traditional cultural symbols are more effective than modern ones in political art.","Ai Weiwei's use of tradition strengthens the impact of his political critique.","International audiences are more receptive to politically critical art than domestic ones.","Contemporary Chinese art cannot be separated from its political context."],"correct":2,"src":"CRIT32","orig":"images/q-dc345dcea6.jpg"},{"id":12,"text":"<p>Damir works for an international agency which is based in the United Kingdom. One of the most important parts of his job is discussing communication systems with his colleagues in different offices.</p><p>All colleagues work from <strong>08:00 to 17:00 local time</strong>, with a <strong>flexible 1-hour lunch break</strong>, taken when possible.</p><p>An upgrade to a system needs to be discussed, so a <strong>1-hour video conference</strong> must be organised. The time differences of the colleagues' locations relative to the UK are shown below.</p><table class=\"q-table\"><thead><tr><th>City (Kazakhstan)</th><th>Time difference</th></tr></thead><tbody><tr><td>Aktau</td><td>+4 hours</td></tr><tr><td>Atyrau</td><td>+4 hours</td></tr><tr><td>Astana</td><td>+5 hours</td></tr><tr><td>Almaty</td><td>+6 hours</td></tr><tr><td>Shymkent</td><td>+5 hours</td></tr></tbody></table><p>What is the latest possible local time in Almaty at which the conference can start?</p>","image":"","options":["15:00","15:30","16:00","16:30"],"correct":2,"src":"CRIT32","review":true,"orig":"images/q-6849542232.jpg"},{"id":13,"text":"<p>Having established the relationship between the height and the volume of liquid in this flask, a laboratory worker uses this information to calculate how he should regulate the flow of liquid into the flask so that the height of liquid rises at a constant rate.</p><p>Which one of the following graphs best represents the planned flow of liquid?</p>","image":"images/q-b7e507174f.jpg","options":["A","B","C","D","E"],"correct":2,"src":"CRIT32","review":true,"orig":"images/q-b7e507174f.jpg"},{"id":14,"text":"<p>To get to university, Dilnaz normally cycles for <strong>15 minutes</strong> to Riverside Stop, takes the next bus to City Campus, and then walks for <strong>25 minutes</strong> to her lecture hall. Whenever Dilnaz arrives at City Campus <strong>later than usual</strong>, she takes a scooter from there to the lecture hall instead. The scooter journey takes <strong>5 minutes</strong>.</p><p>Buses to City Campus depart <strong>every 40 minutes</strong>, and Dilnaz always plans to arrive at Riverside Stop <strong>20 minutes before</strong> her bus is due to depart.</p><p>One morning, Dilnaz arrived at her lecture <strong>15 minutes later than usual</strong>.</p><p>Which of the following would explain why Dilnaz arrived <strong>15 minutes later than usual</strong>?</p>","image":"","options":["Dilnaz arrived at Riverside Stop <strong>15 minutes later than usual</strong>","Dilnaz arrived at Riverside Stop <strong>55 minutes later than usual</strong>","The bus that Dilnaz normally takes was <strong>15 minutes late</strong>","The bus that Dilnaz normally takes was <strong>20 minutes late</strong>"],"correct":0,"src":"CRIT32","review":true,"orig":"images/q-f047c84cbc.jpg"},{"id":15,"text":"<p>False and misleading advertisements distort consumer decision-making by presenting incomplete, ambiguous or deceptive information about products and services. Although most legal systems formally prohibit such practices, enforcement is often inconsistent or slow, allowing companies to continue benefiting financially from misleading claims for extended periods of time. In many cases, the profits gained from such advertisements outweigh the relatively minor penalties that are eventually imposed. Strengthening legal penalties for false advertising would increase the financial and reputational risks faced by companies, thereby deterring them from engaging in misleading practices and protecting consumers more effectively.</p><p>Which one of the following is an assumption on which the above argument depends?</p>","image":"","options":["Consumers always act rationally when given accurate information.","Companies are aware of the legal consequences of false advertising.","Stronger penalties will discourage companies from misleading consumers.","Current advertising regulations are unnecessary.","Courts are capable of identifying misleading claims consistently."],"correct":2,"src":"CRIT32","orig":"images/q-e80aa38b93.jpg"},{"id":16,"text":"<p>Six companies each enter <strong>five employees</strong> into a sales performance competition. To be eligible to win, a company must have <strong>at least three employees finishing in the top 15</strong>.</p><p>To determine the winning company, the <strong>ranking positions</strong> of a company's <strong>top three employees</strong> (as long as they are within the first 15) are added together. The company with the <strong>lowest total score</strong> wins.</p><p>If two companies have the same total, the company whose <strong>best-performing employee</strong> finishes higher is declared the winner.</p><p>The companies of the <strong>first 13 employees</strong> to finish are shown in the table below.</p><table class=\"q-table\"><thead><tr><th>Position</th><th>Employee</th><th>Company</th></tr></thead><tbody><tr><td>1</td><td>Laura</td><td>Red Rockets</td></tr><tr><td>2</td><td>Nurali</td><td>Silver Sparks</td></tr><tr><td>3</td><td>Temirlan</td><td>Green Giants</td></tr><tr><td>4</td><td>Samira</td><td>Alpha Associates</td></tr><tr><td>5</td><td>Yernar</td><td>Blue Blazers</td></tr><tr><td>6</td><td>Danel</td><td>Golden Group</td></tr><tr><td>7</td><td>Riza</td><td>Silver Sparks</td></tr><tr><td>8</td><td>Symbat</td><td>Green Giants</td></tr><tr><td>9</td><td>Damir</td><td>Red Rockets</td></tr><tr><td>10</td><td>Alikhan</td><td>Alpha Associates</td></tr><tr><td>11</td><td>Aigerim</td><td>Blue Blazers</td></tr><tr><td>12</td><td>Mansur</td><td>Alpha Associates</td></tr><tr><td>13</td><td>Miras</td><td>Alpha Associates</td></tr></tbody></table><p>Blue Blazers and Golden Group <strong>do not have an employee finishing in 14th or 15th position</strong>, so they <strong>cannot be the overall winning company</strong>.</p><p>On the basis of the information above, <strong>which other company cannot be the winning company?</strong></p>","image":"","options":["Alpha Associates","Silver Sparks","Red Rockets","Green Giants"],"correct":0,"src":"CRIT32","review":true,"orig":"images/q-fac95dd939.jpg"},{"id":17,"text":"<p>In advanced architectural fabrication, robotic systems are able to adapt their actions in real time by processing visual data from their surroundings. When machine vision detects an unexpected variation in material or structure, the robot adjusts its behaviour accordingly. Therefore, architectural designs that rely on co-robotic fabrication cannot be fully specified in advance, since part of the design process depends on real-time environmental feedback.</p><p>Which one of the following most closely parallels the reasoning used in the above passage?</p>","image":"","options":["When musicians improvise during a performance, the final piece cannot be fully rehearsed in advance because it depends on spontaneous creative decisions.","If a machine is capable of learning from its environment, it must possess consciousness.","Architects who use robotic tools are more innovative than those who do not.","Visual data is more important than numerical data in design processes.","All forms of automation reduce the need for human creativity."],"correct":0,"src":"CRIT32","orig":"images/q-4fb1ddb932.jpg"},{"id":18,"text":"<p>Science fiction frequently depicts aliens as humanoid beings with familiar emotions, social structures and moral systems. Since these depictions reflect human concerns rather than scientific evidence, they tell us more about human culture than about the possibility of extraterrestrial life. Therefore, any attempt to imagine alien life forms is inherently unscientific and incapable of contributing to serious scientific inquiry.</p><p>Which one of the following best expresses the flaw in the above argument?</p>","image":"","options":["It assumes that science fiction aims to make accurate scientific predictions.","It dismisses all speculative thinking as incompatible with scientific reasoning.","It ignores the entertainment value of science fiction narratives.","It assumes that human imagination cannot extend beyond familiar experiences.","It confuses cultural representation with empirical investigation."],"correct":1,"src":"CRIT32","orig":"images/q-ddc0b6aecb.jpg"},{"id":19,"text":"<p>Early space exploration was driven largely by military and political competition during the Cold War. Over time, however, space activity has increasingly involved civilian agencies, private companies and international partnerships. Satellites now play a central role in communication, navigation, climate monitoring and disaster response, making space infrastructure an integral part of everyday life on Earth.</p><p>Which one of the following can be drawn as a conclusion from the above passage?</p>","image":"","options":["Military interests no longer influence space exploration.","Space exploration has become less expensive over time.","Modern societies depend heavily on technologies developed for space.","Private companies have replaced governments in space research.","International cooperation has eliminated political competition in space."],"correct":2,"src":"CRIT32","orig":"images/q-4901b4f419.jpg"},{"id":20,"text":"<p>Damir, Temirlan and Danial are the only participants in an unusual online sale.</p><p>For each item, one of them is chosen to make an <strong>opening offer</strong>, which must be a <strong>whole number of dollars</strong>. After this, anyone may make a higher offer, but it must be <strong>exactly \\$10 more than the opening offer</strong>. If anyone makes this higher offer, they obtain the item for that amount. If no one does, the person who made the opening offer obtains the item for the amount of the opening offer.</p><p>The next item for sale is one that <strong>all three want</strong>. Danial knows that:</p><ul><li>Damir will pay no more than <strong>\\$113</strong> for the item,</li><li>Temirlan will pay no more than <strong>\\$115</strong>.</li></ul><p>Danial himself is willing to pay up to <strong>\\$118</strong>, and it is <strong>Danial's turn to make the opening offer</strong>.</p><p>What is the <strong>lowest opening offer</strong> Danial can make and still <strong>guarantee that he obtains the item</strong>?</p>","image":"","options":["\\$88","\\$98","\\$108","\\$112"],"correct":1,"src":"CRIT32","review":true,"orig":"images/q-93d1ef6946.jpg"},{"id":21,"text":"<p>Aizere uses a printer that produces <strong>40 pages per unit of ink</strong>. She replaces it with a newer printer that produces <strong>50 pages per unit of ink</strong>.</p><p>If Aizere prints <strong>the same number of pages</strong> as before, how much <strong>less ink</strong> will she use?</p>","image":"","options":["5%","10%","20%","25%"],"correct":2,"src":"CRIT32","review":true,"orig":"images/q-1aa8bbd9b5.jpg"},{"id":22,"text":"<p>Murakami Haruki's fiction frequently blends realistic urban settings with surreal or fantastical elements. His protagonists move between ordinary environments—such as cafés, offices or city streets—and dreamlike alternative worlds populated by strange creatures, symbolic spaces or distorted versions of reality. These transitions are often linked to moments of psychological crisis, emotional isolation or existential uncertainty experienced by the characters. Rather than functioning merely as stylistic flourishes or elements of fantasy for their own sake, these surreal components allow Murakami to explore themes of identity, alienation and meaning in ways that would be difficult to achieve through strict realism alone.</p><p>Which one of the following, if true, would most strengthen the above argument?</p>","image":"","options":["Murakami has cited Western surrealist writers as major influences on his work.","Readers often interpret Murakami's fantastical scenes as metaphors for internal states.","Many contemporary Japanese writers employ elements of magical realism.","Murakami's novels are commercially successful both in Japan and abroad.","Some critics argue that realism is more effective than fantasy in literature."],"correct":1,"src":"CRIT32","orig":"images/q-ac947ded98.jpg"},{"id":23,"text":"<p>The growing popularity of K-pop in Romania is often cited as evidence of the increasing influence of Korean culture in Eastern Europe. Concerts by Korean pop groups attract large audiences, Korean music videos are widely viewed online, and Korean fashion trends are frequently imitated by young fans. In addition, many Romanian teenagers actively follow Korean celebrities on social media platforms and engage with Korean-language content, even if they do not speak the language fluently. Since these forms of cultural engagement are becoming more widespread among young people, it follows that Korean cultural values are being widely adopted by Romanian society as a whole.</p><p>Which one of the following best expresses the flaw in the above argument?</p>","image":"","options":["It assumes that cultural consumption leads directly to the adoption of values.","It ignores the economic motivations behind the spread of K-pop.","It fails to consider the role of social media in shaping musical tastes.","It overlooks the influence of other foreign cultural products in Romania.","It underestimates the popularity of local Romanian music."],"correct":0,"src":"CRIT32","orig":"images/q-a58ff5ad5e.jpg"},{"id":24,"text":"<p>If a nation relies heavily on satellite systems for communication and navigation, then disruptions to space infrastructure will have serious consequences for its economy and security. Since modern states increasingly depend on such systems, they must invest in protecting and maintaining their space assets.</p><p>Which one of the following most closely parallels the reasoning used in the above passage?</p>","image":"","options":["If a city relies predominantly on a single power station for electricity, then even minor malfunctions there could trigger cascading effects across essential services; therefore, the city should prioritize the station's protection and upkeep.","A nation that highly values scientific progress must support research institutions adequately, since insufficient funding could hinder long-term innovation and economic competitiveness.","When emerging technologies permeate multiple sectors rapidly, governments ought to implement safeguards and monitoring, because unregulated development might create systemic risks.","States that dedicate substantial resources to national defense are less likely to encounter certain security breaches, though overreliance on defense spending might neglect other vulnerabilities.","Political stability is a critical factor for economic growth, as instability can disrupt markets, deter investment, and hinder development."],"correct":0,"src":"CRIT32","orig":"images/q-ffe96eda3f.jpg"},{"id":25,"text":"<p>The drink called <strong>NutriMix</strong> is a new energy supplement made from a mixture of <strong>Component X</strong> and <strong>Component Y</strong>. The required proportion of X and Y varies for different uses, but there is always <strong>at least as much Y as X</strong>.</p><p>Currently, several NutriMix products are available, as shown in the table below.</p><table class=\"q-table\"><thead><tr><th><strong>Product</strong></th><th><strong>Percentage of X</strong></th><th><strong>Percentage of Y</strong></th><th><strong>Price per 100 ml</strong></th></tr></thead><tbody><tr><td>NutriMix Basic</td><td>50</td><td>50</td><td>$3.00</td></tr><tr><td>NutriMix Plus</td><td>30</td><td>70</td><td>$6.00</td></tr><tr><td>NutriMix Pro</td><td>20</td><td>80</td><td>$7.00</td></tr><tr><td>NutriMix Ultra</td><td>10</td><td>90</td><td>$8.00</td></tr></tbody></table><p>Customers who want a different mixture buy <strong>two</strong> NutriMix products and mix suitable amounts together.</p><p>Ainaz is considering introducing a new NutriMix containing <strong>40% of X and 60% of Y</strong>. Ainaz believes that the price per 100 ml of this new product should be <strong>no more than</strong> what customers would pay if they bought two existing NutriMix products and mixed them to produce a <strong>40 : 60</strong> mixture.</p><p>What is the <strong>highest price per 100 ml</strong> that Alex can charge for the new product?</p>","image":"","options":["$4.25","$4.33","$4.50","$5.00"],"correct":0,"src":"CRIT32","review":true,"orig":"images/q-8a8aaf77db.jpg"},{"id":26,"text":"<p>A <strong>Local Film Club</strong> held <strong>60 screenings</strong> last year. At each screening, <strong>15 films</strong> were shown, with one film in each slot.</p><p>A review of last year's schedule showed that:</p><ul><li>30% of the film slots were for films that were shown only <strong>once</strong> during the year.</li><li>50% of the slots were for films that were shown exactly <strong>twice</strong>.</li><li>Half of the remaining slots were for films that were shown <strong>three times</strong>.</li><li>In addition, there were <strong>4 other films</strong> shown during the year, and the number of times they were screened was in the ratio 4 : 3 : 2 : 1.</li></ul><p>How many <strong>different films</strong> would a member who attended all screenings have seen during the year?</p>","image":"","options":["529","565","629","625"],"correct":0,"src":"CRIT32","review":true,"orig":"images/q-7b73236ea1.jpg"},{"id":27,"text":"<p>In this puzzle there are three pieces, onto which some figures have been glued. The pieces each need to be turned over and fitted into a block, which has holes made in it for the shapes to fit into. The three pieces to be fitted into the block are as follows:</p><p>Which of the following could show the block into which the pieces are placed?</p>","image":"images/q-272604008a.jpg","options":["A","B","C","D","E"],"correct":1,"src":"CRIT32","review":true,"orig":"images/q-272604008a.jpg"},{"id":28,"text":"<p>Critics often argue that Murakami Haruki's global popularity is largely the result of his adoption of Western literary styles and themes. His frequent references to Western music, brands, films and urban lifestyles are said to make his work more accessible to international audiences, particularly readers in Europe and North America. This apparent cultural familiarity is often contrasted with the work of other Japanese authors, whose writing is seen as more deeply rooted in specifically Japanese traditions and therefore less immediately accessible to foreign readers.</p><p>Which one of the following, if true, would most weaken the above argument?</p>","image":"","options":["Murakami's novels are translated into a wide range of languages.","Many internationally successful authors make frequent use of culturally specific references.","Murakami has lived outside Japan for extended periods of his life.","Western readers are more familiar with American culture than Japanese culture.","Murakami's works are often marketed aggressively in foreign countries."],"correct":1,"src":"CRIT32","orig":"images/q-4b5cb4ed32.jpg"},{"id":29,"text":"<p>Some critics argue that companies should not be held legally responsible for misleading advertisements if consumers fail to read the small print carefully or misunderstand complex marketing claims. According to this view, buyers have a duty to inform themselves fully before making purchasing decisions. However, advertising is specifically designed to influence consumer behaviour through selective presentation of information, emotional appeal and persuasive techniques. Moreover, companies typically possess far greater expertise, legal knowledge and financial resources than individual consumers. As a result, it is reasonable to place a higher level of responsibility on advertisers than on consumers for ensuring that information presented in advertisements is clear, accurate and not misleading.</p><p>Which one of the following illustrates the principle underlying the above argument?</p>","image":"","options":["A financial adviser providing complex investment information should ensure clients fully understand the risks, because advisers have more expertise and access to resources than their clients.","Consumers must carefully read all product details, since they are ultimately responsible for their purchasing decisions.","Companies should only advertise products that they themselves manufacture, because misleading claims could harm buyers.","The party initiating a transaction should always bear legal responsibility, regardless of relative knowledge or expertise.","Governments should impose stricter regulations on advertising, to prevent consumers from being misled by complex marketing techniques."],"correct":0,"src":"CRIT32","orig":"images/q-4543452a02.jpg"},{"id":30,"text":"<p>I saw a figure in Minecraft, which had some strange markings on the underside, hovering overhead. My three friends and I each made a drawing of these markings as the craft rotated slowly above us. Three of us drew them correctly. Which of the following drawings is wrong?</p>","image":"images/q-b89655b93e.jpg","options":["A","B","C","D","E"],"correct":2,"src":"CRIT32","review":true,"orig":"images/q-b89655b93e.jpg"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
