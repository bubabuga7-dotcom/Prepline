<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Aygerim, Almaz, Yerkezhan, Kaisar and Madina are going for a drive in a jeep that has five seats, including one driver's seat and four passenger seats. If only Almaz can drive, the number of possible different seating arrangements is</p>", "image": "", "options": ["12", "18", "24", "120", "15"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-c8215e4b62.jpg", "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Место водителя фиксировано, остальные рассаживаются произвольно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Водитель — только Алмаз: 1 способ.</li><li>4 человека на 4 места: 4! = 24.</li><li>Итого 24.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (120) — 5!, забыли ограничение.</li><li>A, B, E — неверный счёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала фиксируйте ограниченные позиции, потом считайте остальные.</div></div>"}, {"id": 2, "text": "<p>If 40% of x is equal to 160% of y, then \\(\\frac{3x-12y}{5}\\) =</p>", "image": "", "options": ["3", "1", "2", "4", "0"], "correct": 4, "verified": true, "src": "ME1", "orig": "images/q-6b15868ac7.jpg", "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из условия выражаем x через y и подставляем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40% x = 160% y → 0,4x = 1,6y → x = 4y.</li><li>3x − 12y = 12y − 12y = 0.</li><li>0 ÷ 5 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — получаются, если неверно выразить x (например, x = <span class=\"fr\"><span>y</span><span>4</span></span>).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала упростите связь (x = 4y), потом подставляйте.</div></div>"}, {"id": 3, "text": "<p>If \\(ab = \\frac{8}{3}\\), \\(bc = 12\\) and \\(ac = 2\\), then a value of \\(\\sqrt[3]{abc}\\) would be</p>", "image": "", "options": ["2", "1", "3", "5", "4"], "correct": 0, "verified": true, "src": "ME1", "orig": "images/q-0410009222.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем три равенства: (abc)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(ab)(bc)(ac) = (abc)² = <span class=\"fr\"><span>8</span><span>3</span></span> · 12 · 2 = 64.</li><li>abc = 8.</li><li>∛8 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (4) — квадратный корень вместо кубического.</li><li>B, C, D — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же приём, что и с xy, xz, yz: перемножить всё.</div></div>"}, {"id": 4, "text": "<p>If \\(4^{x+2} = 64\\) then \\(8^x =\\)</p>", "image": "", "options": ["8", "4", "16", "1", "32"], "correct": 0, "verified": true, "src": "ME1", "orig": "images/q-fd8c38b70f.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к одному основанию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>64 = 4³ → x + 2 = 3 → x = 1.</li><li>8<sup>x</sup> = 8¹ = 8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (1) — это x.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не останавливайтесь на x — спрашивают 8<sup>x</sup>.</div></div>"}, {"id": 5, "text": "<p>The operation \\(\\Delta\\) is defined by the equation \\(a \\Delta b = \\frac{a}{b} - \\frac{b}{a}\\). The value of \\(k\\) if \\(3 \\Delta k = k \\Delta 2\\) is</p>", "image": "", "options": ["\\(\\pm 2.0\\)", "\\(\\pm 2.4\\)", "\\(\\pm 3.0\\)", "\\(\\pm 5.5\\)", "\\(\\pm 6.0\\)"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-2c2d0775f0.jpg", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем обе стороны по определению и решаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>3</span><span>k</span></span> − <span class=\"fr\"><span>k</span><span>3</span></span> = <span class=\"fr\"><span>k</span><span>2</span></span> − <span class=\"fr\"><span>2</span><span>k</span></span>.</li><li><span class=\"fr\"><span>5</span><span>k</span></span> = <span class=\"fr\"><span>5k</span><span>6</span></span> → k² = 6 → k = ±√6 ≈ ±2,4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — неверно собрали подобные.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слагаемые с <span class=\"fr\"><span>1</span><span>k</span></span> — в одну сторону, с k — в другую.</div></div>"}, {"id": 6, "text": "<p>If \\(f(x) = kx\\), where \\(k \\neq 0\\), and \\(g(x) = x + k\\), then which of the following must be true?</p><p>I. \\(f(2x) = 2f(x)\\) &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; II. \\(f(x + 2) = f(x) + 2\\) &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; III. \\(f(g(x)) = g(f(x))\\)</p>", "image": "", "options": ["I only", "II only", "I and II only", "I and III only", "I, II and III"], "correct": 0, "verified": true, "src": "ME1", "orig": "images/q-bb060d3355.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение для произвольного k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I: f(2x) = k·2x = 2kx = 2f(x) — верно всегда ✓.</li><li>II: f(x + 2) = kx + 2k, а f(x) + 2 = kx + 2 — равны только при k = 1.</li><li>III: f(g(x)) = k(x + k) = kx + k²; g(f(x)) = kx + k — равны только при k = 1.</li><li>Всегда верно только I.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — содержат II, которое неверно при k ≠ 1.</li><li>D — содержит III.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Always true» — достаточно одного контрпримера (k = 2), чтобы отбросить утверждение.</div></div>"}, {"id": 7, "text": "<p>\\(\\sqrt{\\dfrac{10\\times(6^4-16)}{32}}=\\)</p>", "image": "", "options": ["\\(\\sqrt{5}\\)", "15", "20", "24", "\\(\\sqrt{10}\\)"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-58cf5617db.jpg", "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычисляем по порядку, начиная с внутренних скобок.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6⁴ = 1296.</li><li>1296 − 16 = 1280.</li><li>1280 ÷ 32 = 40.</li><li>10 · 40 = 400 → √400 = 20.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — ошибки в счёте.</li><li>A, E — забыли умножить на 10 или не извлекли корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6⁴ = 36² = 1296 — удобно считать через квадрат.</div></div>"}, {"id": 8, "text": "<p>A cube is inscribed in a sphere of radius 3. The volume of the cube is</p>", "image": "", "options": ["\\(12\\sqrt{3}\\)", "\\(24\\sqrt{3}\\)", "\\(3\\sqrt{3}\\)", "\\(48\\sqrt{3}\\)", "\\(72\\sqrt{3}\\)"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-8c94677778.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ куба = диаметр шара.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s√3 = 6 → s = 2√3.</li><li>V = (2√3)³ = 24√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка в кубе.</li><li>D, E — неверная сторона.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (2√3)³ = 8 · 3√3.</div></div>"}, {"id": 9, "text": "<p>At which of the following \\(x\\)-values does the parabola defined by \\(y = (x - 1)^2 - 4\\) cross the \\(x\\)-axis?</p>", "image": "", "options": ["-2", "3", "-4", "-3", "1"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-6340532da3.jpg", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 1)² = 4 → x = 3 или −1.</li><li>Из вариантов — 3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — вершина.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Форма (x − h)² + k.</div></div>"}, {"id": 10, "text": "<p>The volume and the surface area of a cube are equal. The length of an edge of this cube will be</p>", "image": "", "options": ["1", "9", "6", "2", "4"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-500c860c66.jpg", "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">s³ = 6s².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s = 6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не удовлетворяют равенству.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Куб со стороной 6: 216 = 216.</div></div>"}, {"id": 11, "text": "<p>On Aigerim's 18th birthday in 2012, she was 159 cm in height, having grown 6% since her birthday in 2011. How tall was she in 2011?</p>", "image": "", "options": ["155 cm", "140 cm", "145 cm", "150 cm", "160 cm"], "correct": 3, "verified": true, "src": "ME1", "orig": "images/q-62a4b2749b.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рост на 6% означает: 159 см = 106% от роста в 2011 году.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x · 1,06 = 159.</li><li>x = 159 ÷ 1,06 = 150 см.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (155) — вычли 6% от 159 (≈ 9,5) неверно.</li><li>C (145) — другое округление.</li><li>B, E — не проходят проверку 150 · 1,06 = 159.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ловушка: «вырос на 6%» — процент от <b>старого</b> значения. Нельзя просто вычесть 6% от нового.</div></div>"}, {"id": 12, "text": "<p>An icosagon is any polygon with twenty sides and twenty angles. The sum of all the interior angles of a regular icosagon is</p>", "image": "", "options": ["3340°", "3240°", "3640°", "3440°", "3540°"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-ee43383228.jpg", "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма внутренних углов n-угольника = (n − 2) · 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 20 → (20 − 2) · 180° = 18 · 180° = 3240°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ошибки в умножении или взяли n − 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый n-угольник делится на n − 2 треугольника.</div></div>"}, {"id": 13, "text": "<p>A cone is inscribed in a hemisphere of radius \\(r\\) so that the base of the cone coincides with the base of the hemisphere. The ratio of the volume of the cone to the volume of the hemisphere is given by</p>", "image": "", "options": ["\\(\\frac{1}{2}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{2r}{3}\\)", "\\(\\frac{r}{2}\\)", "\\(\\frac{r}{3}\\)"], "correct": 0, "verified": true, "src": "ME1", "orig": "images/q-c4a3c4c505.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота конуса равна радиусу полусферы, основания совпадают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конус: V = ⅓πr²h = ⅓πr²·r = ⅓πr³.</li><li>Полусфера: V = ½ · <span class=\"fr\"><span>4</span><span>3</span></span>πr³ = ⅔πr³.</li><li>Отношение: ⅓ ÷ ⅔ = ½.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (¼) — взяли объём целого шара.</li><li>C, D, E — отношение объёмов не может зависеть от r.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение объёмов подобных фигур — безразмерное число, буквы r в ответе быть не может.</div></div>"}, {"id": 14, "text": "<p>In the figure below \\(ASB\\) is a quarter of a circle. \\(PQRS\\) is a rectangle with sides \\(PQ = 8\\) and \\(PS = 6\\). The length of the arc \\(AQB\\) is given by</p>", "image": "images/q-0f4aae33bc.jpg", "options": ["\\(5\\pi\\)", "25", "28", "\\(10\\pi\\)", "14"], "correct": 0, "verified": true, "src": "ME1", "orig": "images/q-0f4aae33bc.jpg", "review": true, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">SQ — радиус и диагональ прямоугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>SQ = √(64 + 36) = 10.</li><li>Дуга = ¼ · 2π · 10 = 5π.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — половина окружности.</li><li>B, C, E — без π.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вершина на дуге → расстояние до центра = радиус.</div></div>"}, {"id": 15, "text": "<p>A triangle has a perimeter 13. The two shorter sides have integer lengths equal to \\(x\\) and \\(x +\\) 1. Which of the following could be the length of the other side?</p>", "image": "", "options": ["8", "10", "6", "2", "4"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-f27c7213c7.jpg", "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Третья сторона выражается через x; применяем неравенство треугольника и условие «две короткие стороны».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>c = 13 − x − (x + 1) = 12 − 2x.</li><li>c — самая длинная: 12 − 2x ≥ x + 1 → x ≤ 3.</li><li>Неравенство треугольника: 12 − 2x < x + (x + 1) → x > 2,75.</li><li>x — целое → x = 3, c = 6. (Стороны 3, 4, 6.)</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — третья сторона больше суммы двух других.</li><li>D, E — тогда третья сторона не самая длинная.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Неравенство треугольника: самая длинная сторона меньше суммы двух других.</div></div>"}, {"id": 16, "text": "<p>The length of the segment in the \\(x - y\\) plane with endpoints at \\((-2, -2)\\) and \\((2, 3)\\) is</p>", "image": "", "options": ["\\(\\sqrt{31}\\)", "9", "\\(\\sqrt{41}\\)", "3", "7"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-d85726f56c.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Формула расстояния.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δx = 4, Δy = 5 → √41.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложили 4 + 5.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3 − (−2) = 5.</div></div>"}, {"id": 17, "text": "<p>A 3 by 4 rectangle is inscribed in a circle. The circumference of the circle is</p>", "image": "", "options": ["\\(4\\pi\\)", "\\(5\\pi\\)", "\\(2.5\\pi\\)", "\\(10\\pi\\)", "\\(3\\pi\\)"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-6291870be9.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ вписанного прямоугольника — диаметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d = 5 → C = 5π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — πr.</li><li>D — 2π · 5.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3-4-5.</div></div>"}, {"id": 18, "text": "<p>In the diagram below, which of the following could be a value of x?</p>", "image": "images/q-906cb7a4f4.jpg", "options": ["40", "10", "50", "20", "15"], "correct": 3, "verified": true, "src": "ME1", "orig": "images/q-906cb7a4f4.jpg", "review": true, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол 5x — внешний угол прямоугольного треугольника BDC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5x = 90° + ∠BCD → 90° < 5x < 180°.</li><li>18 < x < 36 → подходит только 20.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (40), C (50) — 5x > 180°.</li><li>B (10), E (15) — 5x < 90°.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = сумма двух несмежных внутренних.</div></div>"}, {"id": 19, "text": "<p>The number of degrees that the hour hand of a clock moves through between noon and 2.30 in the afternoon of the same day is</p>", "image": "", "options": ["180", "65", "75", "60", "720"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-36b9945521.jpg", "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Часовая стрелка проходит 30° в час.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С 12:00 до 14:30 — 2,5 часа.</li><li>2,5 · 30° = 75°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (180°) — угол минутной стрелки за 30 мин.</li><li>E (720°) — путь минутной стрелки.</li><li>B, D — неточные расчёты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 360° ÷ 12 ч = 30°/ч.</div></div>"}, {"id": 20, "text": "<p>If \\(m\\) and \\(n\\) are the roots of the quadratic equation \\(x^2 + 5x + 8 = 0\\), then the value of \\(\\sqrt{m^2 + n^2}\\) is given by</p>", "image": "", "options": ["9", "5", "4", "3", "6"], "correct": 3, "verified": true, "src": "ME1", "orig": "images/q-01cd827347.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не ищем корни — используем теорему Виета и формулу m² + n² = (m + n)² − 2mn.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m + n = −5, mn = 8.</li><li>m² + n² = 25 − 16 = 9.</li><li>√9 = 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (9) — забыли извлечь корень.</li><li>B (5) — взяли |m + n|.</li><li>C, E — ошибка в 2mn.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Симметричные выражения корней (m² + n², <span class=\"fr\"><span>1</span><span>m</span></span> + <span class=\"fr\"><span>1</span><span>n</span></span> …) всегда считаются через сумму и произведение.</div></div>"}, {"id": 21, "text": "<p>If \\(g(x-1) = x^2 + 2\\), then \\(g(x+1) =\\)</p>", "image": "", "options": ["\\(x^2 + 3\\)", "\\(x^2 + 4x + 6\\)", "\\(x^2 + 2x + 4\\)", "\\(x^2 + 5\\)", "\\(x^2 + 4x + 2\\)"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-383e4062da.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Замена u = x − 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>g(u) = (u + 1)² + 2.</li><li>g(x + 1) = (x + 2)² + 2 = x² + 4x + 6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без +4.</li><li>C — сдвиг на 1, а не на 2.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> От x − 1 до x + 1 — сдвиг на 2.</div></div>"}, {"id": 23, "text": "<p>If \\(x = -8\\), then \\(x^{\\frac{2}{3}} + 2x^{0} =\\)</p>", "image": "", "options": ["-2", "4", "-4", "6", "-6"], "correct": 3, "verified": true, "src": "ME1", "orig": "images/q-0164f9a26b.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дробная степень и нулевая степень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−8)<sup>2⁄3</sup> = (−2)² = 4.</li><li>2x⁰ = 2.</li><li>Итого 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без 2x⁰.</li><li>A, C, E — ошибки со знаком.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала корень, потом квадрат.</div></div>"}, {"id": 24, "text": "<p>Under which conditions the expression \\(\\frac{xy}{x-y}\\) is negative?</p>", "image": "", "options": ["\\(0 &lt; y &lt; x\\)", "\\(x &lt; y &lt; 0\\)", "\\(x &lt; 0 &lt; y\\)", "\\(y &lt; x &lt; 0\\)", "None"], "correct": 1, "verified": true, "src": "ME1", "orig": "images/q-14b481baa5.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знак дроби = знак числителя × знак знаменателя. Проверяем каждый случай.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: x < y < 0 → оба отрицательные, xy > 0; x < y → x − y < 0.</li><li>Положительное ÷ отрицательное = отрицательное ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: 0 < y < x → xy > 0, x − y > 0 → положительно.</li><li>C: x < 0 < y → xy < 0, x − y < 0 → положительно.</li><li>D: y < x < 0 → xy > 0, x − y > 0 → положительно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах на знаки подставьте конкретные числа: например, x = −2, y = −1.</div></div>"}, {"id": 25, "text": "<p>The sum of the roots of \\(2x^3 - 4x^2 + 9x = 0\\) is</p>", "image": "", "options": ["4", "3", "\\(\\frac{1}{2}\\)", "\\(\\frac{3}{4}\\)", "2"], "correct": 4, "verified": true, "src": "ME1", "orig": "images/q-6409419691.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выносим x за скобку: один корень 0, остальные — по Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x(2x² − 4x + 9) = 0.</li><li>x = 0 — первый корень.</li><li>Сумма корней квадратного: −<span class=\"fr\"><span>−4</span><span>2</span></span> = 2.</li><li>Всего: 0 + 2 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4) — забыли поделить на 2.</li><li>B, C, D — ошибки с коэффициентами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для кубического ax³ + bx² + … сумма всех корней = <span class=\"fr\"><span>−b</span><span>a</span></span> = <span class=\"fr\"><span>4</span><span>2</span></span> = 2 — то же самое сразу.</div></div>"}, {"id": 26, "text": "<p>The average of the roots of a quadratic equation is equal to 3 and the difference of the roots is equal to 2. Which of these could be the equation?</p>", "image": "", "options": ["\\(x^2 - 5x + 6 = 0\\)", "\\(x^2 + 5x + 6 = 0\\)", "\\(x^2 - 6x + 8 = 0\\)", "\\(x^2 - 6x - 8 = 0\\)", "\\(x^2 - 6x + 6 = 0\\)"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-9fbf577bf8.jpg", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корни 2 и 4 (среднее 3, разность 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 2)(x − 4) = x² − 6x + 8.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — корни 2 и 3.</li><li>B — отрицательные корни.</li><li>D, E — неверное произведение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x² − (сумма)x + произведение.</div></div>"}, {"id": 27, "text": "<p>If 24 of the 40 students in a club are girls, then the ratio of boys to girls in the club is</p>", "image": "", "options": ["2 : 5", "3 : 5", "2 : 3", "3 : 2", "5 : 2"], "correct": 2, "verified": true, "src": "ME1", "orig": "images/q-c38bea5d0e.jpg", "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мальчиков 16.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 : 24 = 2 : 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — девочки к мальчикам.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок: boys : girls.</div></div>"}, {"id": 31, "topic": "M5.9", "text": "<p>AB is a diameter of a circle and C is a point on the circle. Angle CAB = 28°.</p><p>What is angle CBA?</p>", "image": "", "options": ["28°", "56°", "62°", "118°", "152°"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол, опирающийся на диаметр, — 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>180 − 90 − 28 = 62°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — углы не равны.</li><li>B — это центральный угол.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Видите диаметр — ищите прямой угол.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.17", "text": "<p>Two similar solid statues are made of the same metal. Their heights are in the ratio 3 : 4. The smaller has mass 432 g.</p><p>What is the mass of the larger?</p>", "image": "", "options": ["576 g", "768 g", "1024 g", "1456 g", "2048 g"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Масса ∝ объём ∝ k³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k³ = (4/3)³ = <span class=\"fr\"><span>64</span><span>27</span></span>.</li><li>432 · <span class=\"fr\"><span>64</span><span>27</span></span> = 1024 г. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — масса пропорциональна объёму — k³, а не k.</li><li>B — k² — это для площади.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один материал — масса растёт как объём.</div></div>", "src": "PL"}, {"id": 33, "topic": "M4.18", "text": "<p>The sequence 11, 15, 19, 23, … is arithmetic.</p><p>What is its 25th term?</p>", "image": "", "options": ["99", "100", "107", "111", "275"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">aₙ = a₁ + (n − 1)d.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a₁ = 11, d = 4.</li><li>11 + 24·4 = 107. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли первый член.</li><li>D — взяли d·n вместо d·(n − 1).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте формулу на n = 1.</div></div>", "src": "PL"}, {"id": 34, "topic": "M4.7", "text": "<p>Make \\(t\\) the subject of \\(s = ut + 5t\\).</p>", "image": "", "options": ["\\(t = \\dfrac{s - 5}{u}\\)", "\\(t = s - u - 5\\)", "\\(t = \\dfrac{u + 5}{s}\\)", "\\(t = \\dfrac{s}{5u}\\)", "\\(t = \\dfrac{s}{u + 5}\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вынесите t за скобки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s = t(u + 5) → t = <span class=\"fr\"><span>s</span><span>u + 5</span></span>. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — нельзя переносить 5 отдельно от t.</li><li>B — вычитали вместо деления.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Два слагаемых с t — общий множитель.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1620, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1620, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

    border-top: 1px solid rgba(255,255,255,0.12);

    background: linear-gradient(90deg,#8EADD2,#8EADD2,#C9AA6A);

  }

    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  // render math the moment it lands in the page: MutationObserver callbacks run before the next paint, so raw LaTeX is never shown
  var opts = {delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}], throwOnError: false};
  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){
    render(document.body);
    new MutationObserver(function(ms){
      var done = [];
      for (var i = 0; i < ms.length; i++) {
        var t = ms[i].target;
        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
      }
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
