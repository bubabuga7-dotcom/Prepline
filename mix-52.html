<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m096_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y² = <span class=\"fr\"><span>x² + 2ax</span><span>b</span></span> → by² = x² + 2ax.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Выделим квадрат: (x + a)² = by² + a².</li><li>x = (by² + a²)^{<span class=\"fr\"><span>1</span><span>2</span></span>} − a. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — a не вынесено из-под корня.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дополните до полного квадрата.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m096_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>m</span><span>n</span></span> должно равняться <span class=\"fr\"><span>2</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>7</span><span>21</span></span> = <span class=\"fr\"><span>1</span><span>3</span></span> ≠ <span class=\"fr\"><span>2</span><span>3</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные сокращаются до <span class=\"fr\"><span>2</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократите каждую пару.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m096_q03.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сейчас ему x + y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Через z лет: x + y + z. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вычли y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала найдите текущий возраст.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m096_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.4", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего частей 12 + 5 + 3 = 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 200 000 · <span class=\"fr\"><span>3</span><span>20</span></span> = 180 000. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — делили на 24.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доля = часть / сумма частей.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m096_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">60 · 1,06 = 63,60 $.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>70 − 63,60 = 6,40 $. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только налог.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Налог добавляется к цене.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m096_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сгруппируем: (2 − x)(2 + x) = 4 − x².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 − x²)(4 + x²) = 16 − x⁴; (16 − x⁴)(16 + x⁴) = 256 − x⁸. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак наоборот.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка разностей квадратов.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m096_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∛(√N) = 3 → √N = 27.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>N = 729. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только √N.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратные операции по очереди.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m096_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(n − 2) · 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 · 180 = 1800°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — (n − 3).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формула суммы углов.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m096_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4πr² = 3 · <span class=\"fr\"><span>4</span><span>3</span></span>πr³ = 4πr³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r = 1, диаметр 2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не то уравнение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократите 4πr².</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m096_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ куба s√3 = a → s = <span class=\"fr\"><span>a</span><span>√3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V = <span class=\"fr\"><span>a³</span><span>3√3</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — s = a/∛3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагональ куба = сторона · √3.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m096_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∛0,064 = 0,4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>60 : 0,4 = 150. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — ошибка в запятой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 0,4³ = 0,064.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m096_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x − 4)(x − 9) < 0 → 4 < x < 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наибольшее целое 8. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — коэффициент, не корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Между корнями — отрицательно.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m096_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр 8πr³, шары 2 · <span class=\"fr\"><span>4</span><span>3</span></span>πr³ = <span class=\"fr\"><span>8</span><span>3</span></span>πr³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Свободно <span class=\"fr\"><span>16</span><span>3</span></span>πr³ = 144π → r³ = 27 → r = 3.</li><li>Высота 8r = 24 см. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — радиус в квадрате.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите объём шаров.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m096_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чётных простых 1 (2); делящихся на 7 — 1 (7); на 9 — 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Между 20 и 30: 23, 29 → 2.</li><li>1 + 1 + 0 + 2 = 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — посчитали 9 простым.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Простое делится только на себя.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m096_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разности: 6, ?, ?, 18, 22 — растут на 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6, 10, 14 → x = 3 + 10 = 13 (13 + 14 = 27 ✔). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — шаг 6, 12.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вторые разности постоянны.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m096_q17.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема синусов: PR / sin 45° = RQ / sin 60°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>PR = √6 · <span class=\"fr\"><span>√2</span><span>2</span></span> : <span class=\"fr\"><span>√3</span><span>2</span></span> = <span class=\"fr\"><span>√12</span><span>√3</span></span> = 2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — взяли RQ.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сторона против угла.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m096_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим почленно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>x³y⁴</span><span>x²y²</span></span> − 1 = xy² − 1 = 4 − 1 = 3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложили вместо вычитания.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите через xy².</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m096_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Катеты a и 2a: a² = 25 → a = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Гипотенуза √(25 + 100) = 5√5. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 2a.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь = a · 2a / 2.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m096_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">D = 16 − 4k² ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k² ≤ 4 → −2 ≤ k ≤ 2 (при k = 0 корень x = 0 тоже есть). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — строгие неравенства.</li><li>E — забыли 4 в D.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Действительные корни: D ≥ 0.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m096_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадрат 16; треугольник <span class=\"fr\"><span>√3</span><span>4</span></span> · 16 = 4√3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 : 4√3 = <span class=\"fr\"><span>4</span><span>√3</span></span> = <span class=\"fr\"><span>4√3</span><span>3</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — обратное отношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь правильного треугольника.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m096_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x, y, z лежат на одной прямой → сумма 180°; y = u (вертикальные).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>z = 180 − 71 − 64 = 45°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная пара углов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вертикальные углы равны.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m096_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стрелка: от верхнего плеча вниз по левой стороне → против часовой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Плечо «вверх-влево» → «вниз-влево», плечо «вниз-влево» → «вниз-вправо».</li><li>X сверху, длинное плечо вниз-влево, короткое вниз-вправо. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — поворот по часовой.</li><li>D — угол не 90°.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поворачивайте каждое плечо.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m096_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">g < f между точками пересечения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пересечения при x = −1 и x = 3 → −1 < x < 3. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — где g > f.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите, где парабола ниже прямой.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m096_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вверх 2: +2; влево 3: x → x + 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = (x + 3)² + 4. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вправо.</li><li>E — без сдвига вверх.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x + 3 — влево.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m096_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лёд = вода · 1,09.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40 : 1,09 ≈ 36,7 см³. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 40 − 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный процент — деление.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m096_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Девятиугольник; θ — внешний угол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>360 : 9 = 40°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — восьмиугольник.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма внешних 360°.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m096_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанная окружность треугольника — половина описанной.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Окружности: R, <span class=\"fr\"><span>R</span><span>2</span></span>, <span class=\"fr\"><span>R</span><span>4</span></span>; третий треугольник вписан в окружность <span class=\"fr\"><span>R</span><span>4</span></span>.</li><li>Сторона = √3 · <span class=\"fr\"><span>R</span><span>4</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — четвёртый треугольник.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сторона = √3 · радиус описанной.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m096_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">36 = 2²·3², 48 = 2⁴·3, 60 = 2²·3·5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОК = 2⁴ · 3² · 5 = 720. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 2³ вместо 2⁴.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наибольшие степени каждого простого.</div></div>"}, {"id": 31, "topic": "M4.15", "text": "<p>Solve the simultaneous equations \\(3x + 2y = 7\\) and \\(3x - 2y = 11\\).</p><p>What is \\(x + y\\)?</p>", "image": "", "options": ["−3", "−2", "1", "2", "4"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исключите одну переменную сложением или вычитанием.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Решение: x = 3, y = −1 (проверьте подстановкой в оба уравнения).</li><li>x + y = 2. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это xy.</li><li>E — это x − y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте ответ в оба уравнения.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.4", "text": "<p>I think of a number, multiply it by 2, subtract 11, then divide by 5. The answer is 1.</p><p>What was my number?</p>", "image": "", "options": ["−3", "5", "8", "9", "30"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратные действия в обратном порядке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 · 5 = 5, + 11 = 16, : 2 = 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — при обратном ходе нужно прибавить 11.</li><li>B — не довели обратный ход до конца.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последнее действие отменяется первым.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
