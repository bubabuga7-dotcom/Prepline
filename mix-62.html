<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m127_q01.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">√27 − √12 = 3√3 − 2√3 = √3; √49 + √8 = 7 + 2√2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√3(7 + 2√2) = 7√3 + 2√6. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не упростили первую скобку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Упростите корни заранее.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m127_q03.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">243 = 3⁵: 3ⁿ · 3^{10n} = 3^{121} → n = 11; m = −2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3n + 2m = 33 − 4 = 29. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — m = +2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одно основание.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m127_q04.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S = ½ · AB · AC · sin A.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 6 · 6 · <span class=\"fr\"><span>√3</span><span>2</span></span> = 9√3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без ½.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> sin 120° = <span class=\"fr\"><span>√3</span><span>2</span></span>.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m127_q05.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шесть равносторонних треугольников со стороной 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 · <span class=\"fr\"><span>√3</span><span>4</span></span> · 64 = 96√3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 4 треугольника.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = <span class=\"fr\"><span>3√3</span><span>2</span></span>a².</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m127_q06.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC = 6 → большая полуокружность 3π.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Две малые (диаметр 3): 1,5π + 1,5π = 3π; окружность CB (диаметр 3): 3π.</li><li>Итого 9π. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без окружности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полуокружность = πr.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m127_q07.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = π · 81 · 18 = 1458π.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Половина: 729π. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — весь стакан.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> πr²h.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m127_q08.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол 180 − 160 = 20°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>360 : 20 = 18 сторон. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 360 : 18.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Через внешний угол.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m127_q09.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(G − 12)² = 6(R + 2)² + 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(R + 2)² = <span class=\"fr\"><span>(G − 12)² − 4</span><span>6</span></span> → R = √(…) − 2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак при 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный порядок.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m127_q10.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x(x³ + 5x² − x − 5) = x(x + 5)(x − 1)(x + 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Корни 0, −5, 1, −1 → 4 пересечения. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли x = 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Группировка.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m127_q11.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Брусок 10 · 8 · 3 = 240 минус вырез x · x · 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>240 − 3x² = 165 → x² = 25 → x = 5. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — x² = 16.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Целое минус вырез.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m127_q12.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,(2) = <span class=\"fr\"><span>2</span><span>9</span></span> = <span class=\"fr\"><span>22</span><span>99</span></span>; 0,(63) = <span class=\"fr\"><span>63</span><span>99</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>85</span><span>99</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — <span class=\"fr\"><span>2</span><span>99</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период → 9…9.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m127_q13.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">BC = AC − AB = 4b − 3a; BD = ¼BC.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = 3a + b − ¾a = <span class=\"fr\"><span>9a</span><span>4</span></span> + b. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ½ вместо ¼.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> BD : DC = 1 : 3 → ¼.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m127_q14.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Бок: 3 · 6 · 10 = 180; основания 2 · <span class=\"fr\"><span>√3</span><span>4</span></span> · 36 = 18√3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>180 + 18√3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 16√3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2 основания + 3 грани.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m127_q15.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">17 280 : 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4800 м/с. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ÷6.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на 3,6.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m127_q16.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Координаты: N70°W 30 → (−28,2; 10,3); затем N10°E 50 → (−19,5; 59,5).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Обратно: вектор (19,5; −59,5) → угол от юга к востоку arctg<span class=\"fr\"><span>19,5</span><span>59,5</span></span> ≈ 18,2°.</li><li>S18,2°E. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная точка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разложите на x и y.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m127_q17.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь под графиком.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 2 · 8 + 8 · 8 + ½ · (8 + 4) · 2 + 4 · 4 = 8 + 64 + 12 + 16 = 100. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — участки посчитаны прямоугольниками.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Трапеции и треугольники.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m127_q18.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель = x(x − 1)(x − 4)(x + 2); после сокращения x(x − 4)<span class=\"fr\"><span>x + 2</span><span>x − 1</span></span>, x ≠ 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Метод интервалов: (−∞; −2) ∪ (0; 1) ∪ (4; ∞). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — неверные корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корни −2, 0, 1, 4.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m127_q19.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>3</span><span>4</span></span> − <span class=\"fr\"><span>3</span><span>5</span></span> = <span class=\"fr\"><span>3</span><span>20</span></span> бака = 0,3 л.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бак 2 л. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 0,3 · 5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность долей.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m127_q20.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,05x + 20 = 0,1(100 + x) (мл).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,05x = 10 → x = 200 мл = 0,2 л. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 100 мл.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соль сохраняется.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m127_q21.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадрат вписан в окружность r = 5: диагональ 10 → площадь 50.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Треугольник ½ · 20 · 20 = 200 → <span class=\"fr\"><span>50</span><span>200</span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — площадь квадрата 25.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = <span class=\"fr\"><span>d²</span><span>2</span></span>.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m127_q22.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2 • 4 = 20; 3 ◇ 1 = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>20 • 5 = 400 + 25 = 425. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 545.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала скобки.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m127_q23.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три четверти круга радиуса 3a: <span class=\"fr\"><span>27</span><span>4</span></span>πa².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Закрашенная часть квадрата (по формуле площади многоугольника) = 4a².</li><li>a²(<span class=\"fr\"><span>27π</span><span>4</span></span> + 4). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 2a².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбейте лестницу на части.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m127_q24.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Полукруг <span class=\"fr\"><span>25π</span><span>2</span></span>; треугольник с основанием 10 и высотой 15 − 5 = 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 10 · 10 = 50 → 50 + <span class=\"fr\"><span>25π</span><span>2</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — высота 5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подсказка: h − r.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m127_q25.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x<span class=\"fr\"><span>x − 2</span><span>2</span></span> = 24 → x = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диагонали 8 и 6 → сторона √(4² + 3²) = 5. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — половина диагонали.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Египетский треугольник.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m127_q27.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон данной <span class=\"fr\"><span>2</span><span>3</span></span> → перпендикулярный <span class=\"fr\"><span>−3</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y − 4 = −1,5(x − 3) → y = −1,5x + 8,5. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — тот же наклон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> k₁k₂ = −1.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m127_q29.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(4,256·10⁶ − 4,256·10⁴) / 2,128·10¹¹.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4,256 · 0,99·10⁶ / 2,128·10¹¹ = 2 · 0,99 · 10⁻⁵ ≈ 0,0000198. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите общий множитель.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m127_q30.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">738 = 2 · 369 = 2 · 9 · 41.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2¹ · 3² · 41¹. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 83 не делитель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите по порядку.</div></div>"}, {"id": 31, "topic": "M4.11", "text": "<p>The curve \\(y = x^{2} - 8x + 12\\) crosses the x-axis at A and B.</p><p>What is the length AB?</p>", "image": "", "options": ["2", "4", "6", "8", "12"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Найдите корни, расстояние = разность.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² 2} − 8x + 12 = (x − 2)(x − 6) = 0 → x = 2 или 6.</li><li>AB = 6 − (2) = 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — сложили корни.</li><li>E — взяли свободный член.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длина отрезка всегда положительна.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.5", "text": "<p>In triangle ABC, D is on AB and E is on AC with DE parallel to BC. AD = 5 cm, DB = 8 cm and DE = 15 cm.</p><p>Find BC.</p>", "image": "", "options": ["23 cm", "24 cm", "39 cm", "41 cm", "78 cm"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольники ADE и ABC подобны; AB = 13.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 13 : 5.</li><li>BC = 15 · <span class=\"fr\"><span>13</span><span>5</span></span> = 39 см. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — прибавили вместо умножения.</li><li>B — взяли DB : AD вместо AB : AD.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте со всей стороной AB, а не с DB.</div></div>", "src": "PL"}, {"id": 33, "topic": "M3.9", "text": "<p>\\(y\\) is inversely proportional to \\(\\sqrt{x}\\). When \\(x = 4\\), \\(y = 30\\).</p><p>Find \\(y\\) when \\(x = 9\\).</p>", "image": "", "options": ["20", "21", "40", "45", "67.5"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = <span class=\"fr\"><span>k</span><span>√x</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = 30 · √4 = 60.</li><li>y = 60 : √9 = 20. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — это прямая пропорция.</li><li>E — прямая пропорция и без корня.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Обратно пропорционально» — произведение постоянно.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
