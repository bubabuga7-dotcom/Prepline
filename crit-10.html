<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"<p>Mao Zedong's leadership transformed China through radical political and social campaigns such as land reform, collectivisation, and mass mobilisation. These policies were justified as necessary steps toward equality and national strength, particularly after decades of foreign domination and internal instability. However, the implementation of Mao's vision often relied on coercion, ideological conformity, and the suppression of dissenting voices. The Great Leap Forward and the Cultural Revolution disrupted traditional social structures and produced widespread economic and human suffering. Despite this, Mao's symbolic role as the architect of a unified revolutionary China continued to command loyalty among large segments of the population. This suggests that Mao's historical significance cannot be assessed solely through the immediate outcomes of his policies.</p><p>Which of the following best expresses the main conclusion of the argument above?</p>","image":"","options":["Mao Zedong's political campaigns were primarily responsible for China's economic failures in the mid-twentieth century.","The popular loyalty Mao inspired was based entirely on ideological indoctrination rather than material success.","Mao Zedong's legacy must be evaluated in terms broader than the tangible successes or failures of his policies.","China's unification would not have been possible without coercive political control.","Revolutionary symbolism is more powerful than economic performance in shaping political systems."],"correct":2,"src":"CRIT35","orig":"images/q-f11eb23f9b.jpg"},{"id":2,"text":"<p>Shakespeare is often credited with possessing an exceptionally large vocabulary compared to other writers of his period. This belief is largely based on raw word counts drawn from surviving texts, without sufficient attention to the fragmentary nature of early modern literary records. Many plays and poems from Shakespeare's contemporaries have been lost, while Shakespeare's works have survived in unusually complete form. In addition, spelling variation in early modern English can inflate estimates of lexical diversity. When these factors are taken into account, the apparent uniqueness of Shakespeare's vocabulary becomes less certain. Quantitative claims about linguistic originality therefore depend heavily on the limitations of the available evidence.</p><p>Which of the following conclusions can be most reliably drawn from the passage as a whole?</p>","image":"","options":["Shakespeare's reputation for linguistic brilliance is entirely undeserved.","Shakespeare deliberately employed spelling variation to increase his apparent vocabulary.","Comparisons of Shakespeare's vocabulary with that of his contemporaries are methodologically uncertain.","Early modern writers generally had vocabularies equal to or greater than Shakespeare's.","Statistical approaches to literary analysis should be abandoned altogether."],"correct":2,"src":"CRIT35","orig":"images/q-b905d4cdf6.jpg"},{"id":3,"text":"<p>I sent four pieces of artwork to Arton Gallery to be sold at an exhibition. Arton Gallery provided <em>estimated selling ranges</em> for each item:</p><ul><li>Oil Painting: $900 – $1100</li><li>Bronze Sculpture: $1500 – $1700</li><li>Watercolour Landscape: $500 – $650</li><li>Abstract Print: $300 – $450</li></ul><p>At the exhibition:</p><ul><li>the watercolour landscape sold for <strong>$420</strong>,</li><li>the oil painting sold for <strong>$1050</strong>,</li><li>the abstract print sold for <strong>$380</strong>, and</li><li>the bronze sculpture exceeded its estimated range, selling for <strong>$2100</strong>.</li></ul><p><strong>How much more did the artwork sell for altogether than the <em>midpoint</em> of Arton Gallery's total estimated range?</strong></p>","image":"","options":["$300","$350","$400","$450","$550"],"correct":2,"src":"CRIT35","orig":"images/q-7099451234.jpg"},{"id":4,"text":"<p>There is an old saying: \"Two and a half printers print <strong>five</strong> brochures in three and a half days.\"</p><p>If this is true, how many brochures will <strong>4</strong> printers print in <strong>7</strong> days?</p>","image":"","options":["16","20","22","24","28"],"correct":0,"src":"CRIT35","orig":"images/q-14bb5f1d2f.jpg"},{"id":5,"text":"<p>The growing popularity of the game Genshin Impact across Southeast Asia has been interpreted as evidence of China's increasing cultural influence in the region. Players regularly engage with Chinese-inspired aesthetics, narratives, and mythological elements embedded in the game's design. The game's success has also coincided with heightened online discussion of Chinese culture among younger audiences. Unlike traditional state-sponsored cultural exports, Genshin Impact operates through commercial entertainment rather than explicit political messaging. This suggests that China's soft power in Southeast Asia is being strengthened through indirect and popular cultural channels.</p><p>Which of the following is an underlying assumption of the argument above?</p>","image":"","options":["Players consciously associate their enjoyment of Genshin Impact with positive attitudes toward China.","Cultural products can contribute to soft power even when they are not explicitly political.","Southeast Asian governments actively encourage the consumption of Chinese digital media.","Traditional forms of cultural diplomacy are no longer effective in Southeast Asia.","Online discussions reliably reflect deep cultural or political commitments."],"correct":1,"src":"CRIT35","orig":"images/q-ad91ea4a52.jpg"},{"id":6,"text":"<p>Burger Bonanza Menu</p><p>All burgers include <strong>Bun, Lettuce, and Tomato</strong>.</p><table class=\"q-table\"><thead><tr><th>No</th><th>Burger</th><th>Small</th><th>Large</th></tr></thead><tbody><tr><td>1</td><td>CLASSIC</td><td>$2.50</td><td>$4.00</td></tr><tr><td>2</td><td>CHEESEBURGER</td><td>$3.00</td><td>$4.50</td></tr><tr><td>3</td><td>BACON &amp; CHEESE</td><td>$3.50</td><td>$5.00</td></tr><tr><td>4</td><td>CHICKEN DELIGHT</td><td>$3.50</td><td>$5.00</td></tr><tr><td>5</td><td>VEGGIE</td><td>$3.50</td><td>$5.00</td></tr><tr><td>6</td><td>SPICY BEEF</td><td>$4.00</td><td>$5.50</td></tr><tr><td>7</td><td>SEAFOOD BURGER</td><td>$4.00</td><td>$5.50</td></tr><tr><td>CREATE YOUR OWN BURGER</td><td>Add any topping</td><td>$0.60</td><td>$0.85</td></tr></tbody></table><p><strong>Available toppings for \"Create Your Own Burger\":</strong> Cheese, Bacon, Chicken, Mushroom, Onion, Pepper, Tuna, Prawns, Spicy Beef</p><p><strong>Aniya's order:</strong></p><ol><li><strong>Large BACON &amp; CHEESE</strong></li><li><strong>Small SPICY BEEF</strong></li><li><strong>Large CLASSIC</strong> with <strong>Cheese, Bacon, Mushroom, and Onion</strong></li><li><strong>Small VEGGIE</strong> with <strong>Pepper, Mushroom, and Onion</strong></li><li><strong>Large CHICKEN DELIGHT</strong> with <strong>Cheese, Bacon, and Spicy Beef</strong></li></ol><p><strong>Question:</strong></p><p>What is the total cost of Aniya's order?</p>","image":"","options":["$28.45","$29.25","$30.80","$31.60","$32.25"],"correct":1,"src":"CRIT35","orig":"images/q-bf17b481e1.jpg"},{"id":7,"text":"<p>Early American literature often framed personal freedom as a moral ideal aligned with social responsibility. In The Coquette, the protagonist's pursuit of independence is presented as a challenge to restrictive social norms governing women's behaviour. The novel suggests that her downfall results not from the desire for freedom itself, but from a society unwilling to accommodate female autonomy. Readers are encouraged to interpret her fate as a critique of social hypocrisy rather than personal failure. This implies that the novel ultimately endorses individual freedom as compatible with moral integrity.</p><p>Which of the following, if true, would most weaken the argument above?</p>","image":"","options":["Contemporary readers frequently interpreted the novel as a warning against excessive independence.","The author drew on real historical cases when constructing the narrative.","Male characters in the novel also experience social consequences for their actions.","The novel was published during a period of intense debate over women's education.","Literary critics disagree about whether the novel should be classified as sentimental or didactic."],"correct":0,"src":"CRIT35","orig":"images/q-f3b964c1ef.jpg"},{"id":8,"text":"<p>Across many cultures, the figure of the clown appears in ritual, storytelling, and performance. Clowns often violate social norms through humour, exaggeration, or deliberate foolishness. Rather than undermining social order, these transgressions are frequently tolerated or even celebrated. This tolerance suggests that the clown serves a functional role within society. Specifically, the clown allows communities to explore social tensions without directly challenging established hierarchies.</p><p>Which of the following, if true, would most strengthen the argument above?</p>","image":"","options":["In many countries, clowns mainly perform at children's birthday parties and school events.","Some rulers have banned clowning during times of political crisis.","In several cultures, clown characters appear only in fictional stories, not in real public performances.","In many societies, clowns are allowed to mock powerful figures only during specific festivals, after which normal rules and authority are publicly reaffirmed.","Clowns often use costumes and masks that make it hard to recognise who the performer is."],"correct":3,"src":"CRIT35","orig":"images/q-b50db554b1.jpg"},{"id":9,"text":"<p>Elena updates the access code for her digital locker using a routine based on her postal code. A number is transformed using the following algorithm:</p><ol><li>Take the <strong>last digit</strong> of the number and move it to the <strong>front</strong>.</li><li>Increase <strong>every digit except the first</strong> by 1.</li><li>If any digit becomes <strong>10</strong>, replace it with <strong>0</strong>.</li><li><strong>If the last digit of the number is even, remove it. Otherwise, leave the number unchanged.</strong></li></ol><p>What is the final result when the algorithm is applied to <strong>5799</strong>?</p>","image":"","options":["690","968","9680","96810","9809"],"correct":1,"src":"CRIT35","orig":"images/q-928ea918bf.jpg"},{"id":10,"text":"<p>A hockey team plays <strong>two matches on consecutive days</strong>.</p><ul><li>The <strong>first match is played in Toronto</strong>.</li><li>The <strong>second match is played in Vancouver</strong>.</li></ul><p>After the first match ends in Toronto, the team travels directly to Vancouver for the second match. The distance between Toronto and Vancouver is <strong>4,400 km</strong>.</p><p>The team leaves Toronto <strong>2 hours after the first match finishes</strong> and travels at an <strong>average speed of 800 km/h</strong>.</p><p>The second match in Vancouver is scheduled to start at <strong>19:00 local time</strong>. Vancouver is <strong>3 hours behind Toronto</strong>.</p><p>Which of the following is the <strong>latest possible finishing time of the first match in Toronto</strong> that would still allow the team to arrive in Vancouver <strong>before the second match starts</strong>?</p>","image":"","options":["12:30","13:00","13:30","14:00","14:30"],"correct":4,"src":"CRIT35","orig":"images/q-ef7b15955a.jpg"},{"id":11,"text":"<p>Postfeminist media often presents feminism as a matter of individual choice and personal empowerment. Such representations tend to focus on the experiences of young, white, middle-class women. Women from racialised or economically marginalised groups are significantly underrepresented in these narratives. At the same time, postfeminist discourse claims to promote inclusivity and universal female empowerment. Therefore, postfeminism cannot meaningfully address the concerns of women who fall outside its dominant representational framework.</p><p>Which of the following best identifies the flaw in the reasoning above?</p>","image":"","options":["It assumes that media representation is the sole determinant of political inclusion.","It confuses descriptive claims about media trends with prescriptive claims about feminism as a whole.","It relies on anecdotal rather than systematic evidence.","It treats postfeminism and feminism as entirely unrelated movements.","It assumes that inclusion requires complete uniformity of experience."],"correct":0,"src":"CRIT35","orig":"images/q-f80e13514c.jpg"},{"id":12,"text":"<p>A school notices that many of its highest-scoring students also attend private tutoring sessions. From this, one teacher concludes:</p><p>\"Private tutoring must be necessary for achieving top exam results. Without tutoring, students cannot reach the highest scores.\"</p><p>Which option below uses the same logical structure as the teacher's reasoning?</p>","image":"","options":["Many professional athletes train intensely and also suffer injuries; therefore, injuries are necessary for becoming a professional athlete.","If someone practises a musical instrument daily, they may improve; this person practises daily, so they will definitely improve.","Because many scientific discoveries happened during wars, war is essential for scientific progress.","Talented artists often work late at night; therefore, working late at night causes artistic talent.","Great leaders often face hardship, so anyone who faces hardship can become a great leader."],"correct":0,"src":"CRIT35","orig":"images/q-d6036409a6.jpg"},{"id":13,"text":"<p>For centuries, cochineal red was one of the most valuable pigments in global trade due to its intensity and durability. Its value derived not only from its visual qualities, but also from the complex labour, knowledge, and colonial networks required to produce it. When synthetic red dyes were developed, they were cheaper and easier to manufacture, yet they initially lacked the symbolic and cultural prestige of cochineal. This suggests that the worth of a material is shaped by historical context and social meaning, not merely by functional properties. Cultural value, once established, can persist even when more efficient alternatives exist.</p><p>Which of the following best illustrates the principle underlying the argument above?</p>","image":"","options":["Handwritten letters are often treasured more than emails, even though emails are faster and more convenient.","New technologies always replace older ones because they are more efficient.","Artistic materials should be judged solely on their visual effectiveness.","Economic value is determined entirely by production costs.","Cultural traditions disappear once they become commercially unviable."],"correct":0,"src":"CRIT35","orig":"images/q-b57b4d7a0a.jpg"},{"id":14,"text":"<p>The cyclist <strong>Liam Torres</strong> recently attempted to break his country's <strong>20 km cycling record of 32 minutes 40 seconds</strong>. In order to achieve this, he had to cycle at an average time of better than <strong>78 seconds for each 800m lap</strong>. His <strong>cumulative progress</strong> is shown in the graph below. An entry of 4 means he was 4 seconds behind the schedule after the lap shown, whilst −2 means he was 2 seconds ahead of schedule at that point.</p><p>How much ahead of the schedule did he cycle for the last <strong>4000m</strong>?</p>","image":"images/q-62fc9e9da3.jpg","options":["6 seconds","9 seconds","10 seconds","17 seconds","21 seconds"],"correct":3,"src":"CRIT35","orig":"images/q-62fc9e9da3.jpg","review":true},{"id":15,"text":"<p>The players of Greenfield Hockey Club receive a bonus for every match they win. The size of each bonus depends on the number of goals they score and concede.</p><p>Last week they received <strong>$150</strong> following their <strong>4–1</strong> win against Riverside, and this week they will get <strong>$220</strong> for beating Maplewood <strong>6–2</strong>.</p><p>Which of the following formulae is used to calculate the Greenfield players' bonus when they win a match?</p>","image":"","options":["(goals scored × $40) – (goals conceded × $10)","(goals scored × $45) – (goals conceded × $15)","(goals scored × $50) – (goals conceded × $20)","(goals scored × $55) – (goals conceded × $25)","(goals scored × $60) – (goals conceded × $30)"],"correct":0,"src":"CRIT35","orig":"images/q-cb7490bf62.jpg"},{"id":16,"text":"<p>Contemporary multicultural societies often struggle with meaningful intercultural dialogue despite increased exposure to diversity. Zadie Smith's White Teeth presents characters whose identities are shaped by migration, historical memory, and conflicting cultural expectations. Through narrative complexity and humour, the novel exposes how miscommunication arises not from ignorance alone, but from deeply embedded assumptions about identity and belonging. Classroom engagement with such texts encourages readers to confront these assumptions rather than seek simplified cultural explanations. Literary study in this context becomes less about acquiring factual knowledge of other cultures and more about developing interpretive sensitivity. This pedagogical use of fiction highlights the limits of purely informational approaches to intercultural understanding.</p><p>Which of the following best expresses the main conclusion of the argument above?</p>","image":"","options":["Multicultural societies require new educational strategies to manage cultural diversity.","White Teeth is more effective than sociological texts in teaching cultural difference.","Intercultural understanding cannot be achieved through factual knowledge alone.","Literary humour is a powerful tool for exposing cultural misunderstanding.","Students are often unaware of their own assumptions about identity."],"correct":2,"src":"CRIT35","orig":"images/q-af8d473bbd.jpg"},{"id":17,"text":"<p>A camp counselor is dividing <strong>24 children</strong> into groups for outdoor activities. She lines them up and, starting from the first child, selects <strong>every 4th child</strong> in the line to go <strong>fishing</strong>.</p><p>After sending these children away, she then counts <strong>every 3rd child</strong> of those remaining to go <strong>canoeing</strong>. She then counts <strong>every 2nd child</strong> of the remaining group to go <strong>hiking</strong>.</p><p>Those left will stay for <strong>nature crafts</strong>.</p><p><strong>How many children will do nature crafts?</strong></p>","image":"","options":["4","5","6","7","8"],"correct":2,"src":"CRIT35","orig":"images/q-0045ac0b38.jpg"},{"id":18,"text":"<p>Buddhism has often been described as a single, coherent philosophical system with clearly defined doctrines. However, historical evidence shows that Buddhist traditions developed differently across regions such as India, China, and Japan. Doctrinal emphases, ritual practices, and institutional structures varied significantly depending on cultural and political contexts. Attempts to define an \"original\" or \"pure\" form of Buddhism frequently privilege certain textual traditions over others. This has led scholars to question whether Buddhism can be meaningfully understood as a unified system rather than a family of related traditions. Such diversity complicates efforts to produce a single authoritative account of Buddhist belief.</p><p><strong>Which of the following conclusions is best supported by the information in the passage?</strong></p>","image":"","options":["Buddhism lacks any shared philosophical foundations across its different traditions.","Cultural context plays a significant role in shaping how Buddhist traditions develop.","Textual traditions are more important than lived practice in defining Buddhism.","Scholarly disagreement has prevented accurate study of Buddhist history.","Buddhism has changed so much that its original teachings are no longer relevant."],"correct":1,"src":"CRIT35","orig":"images/q-bd8cb1b16f.jpg"},{"id":19,"text":"<p>Leadership is often evaluated in terms of efficiency, authority, and measurable outcomes. However, such evaluations tend to overlook the relational dimensions of leadership, including trust, moral credibility, and shared purpose. Leaders who prioritise technical competence without attending to these relational aspects may achieve short-term goals but fail to inspire sustained commitment. By contrast, leadership rooted in service and ethical responsibility fosters long-term cohesion within organisations. This suggests that effective leadership cannot be reduced to managerial skill alone.</p><p>Which of the following is a necessary assumption underlying the argument above?</p>","image":"","options":["Organisational success depends more on moral values than on material resources.","Long-term commitment is a relevant criterion for judging leadership effectiveness.","Ethical leadership always produces better measurable outcomes.","Technical competence and relational leadership are mutually exclusive.","Leaders are primarily responsible for organisational failure."],"correct":1,"src":"CRIT35","orig":"images/q-5ad4ae1000.jpg"},{"id":20,"text":"<p>The <strong>Gizmo Tech Company</strong> has five <strong>Regional Sales Managers</strong>, each responsible for one part of the country. They have sales targets for each quarter of the year, which depend on market potential and seasonal fluctuations. The targets and actual performance (+ for above target, − for below target) are shown in the table below.</p><table class=\"q-table\"><thead><tr><th>Name</th><th>Region</th><th>Sales $000</th><th>Quarter 1</th><th>Quarter 2</th><th>Quarter 3</th><th>Quarter 4</th><th>Year</th></tr></thead><tbody><tr><td>Adams</td><td>North</td><td>Target</td><td>700</td><td>950</td><td>800</td><td>650</td><td>3100</td></tr><tr><td></td><td></td><td>Performance</td><td>+150</td><td>+200</td><td>+100</td><td>+250</td><td>+700</td></tr><tr><td>Baker</td><td>East</td><td>Target</td><td>900</td><td>1100</td><td>850</td><td>750</td><td>3600</td></tr><tr><td></td><td></td><td>Performance</td><td>-100</td><td>+300</td><td>-50</td><td>+200</td><td>+350</td></tr><tr><td>Carter</td><td>Midlands</td><td>Target</td><td>1000</td><td>1400</td><td>1000</td><td>900</td><td>4300</td></tr><tr><td></td><td></td><td>Performance</td><td>+50</td><td>-100</td><td>+150</td><td>+100</td><td>+200</td></tr><tr><td>Davis</td><td>West</td><td>Target</td><td>800</td><td>1000</td><td>900</td><td>700</td><td>3400</td></tr><tr><td></td><td></td><td>Performance</td><td>+200</td><td>+150</td><td>+250</td><td>+150</td><td>+750</td></tr><tr><td>Evans</td><td>South</td><td>Target</td><td>1200</td><td>1500</td><td>1200</td><td>1000</td><td>4900</td></tr><tr><td></td><td></td><td>Performance</td><td>-100</td><td>-50</td><td>+200</td><td>+150</td><td>+200</td></tr></tbody></table><p><strong>Question:</strong> Who recorded the biggest sales total for any single quarter during the year?</p>","image":"","options":["Adams","Baker","Carter","Davis","Evans"],"correct":4,"src":"CRIT35","orig":"images/q-ef3b59cc5f.jpg"},{"id":21,"text":"<p>Most countries have some form of inheritance tax. Some countries take into account the number of direct relatives who will inherit, while others do not.</p><p>Ivan has dual citizenship of <strong>Eastern Riveria</strong> and <strong>Western Riveria</strong>, both of which use the same currency. He intends to leave his estate worth <strong>$900,000</strong> to his <strong>3 children</strong> and wants to lose as little as possible to tax.</p><p>How much tax would his estate save if he resided in <strong>Western Riveria</strong>?</p><p><strong>Riverian Inheritance Tax Summary:</strong></p><ul><li><strong>Eastern Riveria:</strong> First <strong>$350,000</strong> tax-free. Any amount over this is taxed at <strong>35%</strong>.</li><li><strong>Western Riveria:</strong> First <strong>$250,000</strong> tax-free. Additionally, a tax-free allowance of <strong>$80,000 for each surviving child</strong>. The remainder is taxed at <strong>25%</strong>.</li></ul>","image":"","options":["$90,000","$115,000","$135,000","$165,000","$200,000"],"correct":0,"src":"CRIT35","orig":"images/q-fa6450c092.jpg"},{"id":22,"text":"<p>The front gear of a mechanical counter has <strong>36 teeth</strong>, the rear gear has <strong>24 teeth</strong>, and the chain has <strong>72 holes</strong>.</p><p>How many revolutions must the <strong>front gear</strong> make before the chain and both gears return to <strong>exactly the same relative positions</strong> (i.e., the same holes are engaging the same teeth on both gears)?</p>","image":"","options":["1","2","3","4","6"],"correct":1,"src":"CRIT35","orig":"images/q-5bc48454aa.jpg"},{"id":23,"text":"<p>Historical policies toward Native American communities were often framed as benevolent attempts at integration and social improvement. In practice, these policies frequently undermined indigenous cultural practices, family structures, and systems of governance. Social welfare interventions, though designed to provide support, sometimes imposed external values that conflicted with Native American conceptions of community and identity. As a result, programs that focused narrowly on economic indicators failed to address deeper social and cultural harm. Recent scholarship emphasises the importance of recognising indigenous perspectives when assessing both historical injustices and contemporary policy outcomes. Without such recognition, well-intentioned reforms risk repeating earlier patterns of marginalisation.</p><p>Which of the following best states the main conclusion of the argument above?</p>","image":"","options":["Social welfare policies have historically been ineffective in improving Native American living conditions.","Economic measures alone are sufficient to evaluate the success of government intervention.","Policies affecting Native Americans must be assessed through frameworks that include indigenous cultural perspectives.","Historical injustices against Native Americans were primarily caused by economic neglect.","Contemporary reforms are unlikely to succeed without significant increases in funding."],"correct":2,"src":"CRIT35","orig":"images/q-ccdb884c28.jpg"},{"id":24,"text":"<p>In many European folk traditions, the wolf is portrayed as a symbol of danger, deception, or moral threat. By contrast, in some other cultural narratives, the wolf appears as a protective or even sacred figure. These divergent portrayals persist despite similar ecological relationships between humans and wolves across regions. Such variation suggests that cultural symbolism does not arise directly from objective encounters with animals. Instead, shared narratives and inherited beliefs play a significant role in shaping how societies interpret the same natural phenomenon. The meaning attributed to the wolf therefore reflects cultural frameworks rather than biological reality.</p><p>Which of the following is an assumption on which the argument depends?</p>","image":"","options":["Human interactions with wolves have been largely peaceful across most historical periods.","Cultural narratives are transmitted independently of environmental conditions.","Similar material conditions do not necessarily produce identical symbolic meanings.","Folklore consistently reflects accurate historical experience.","Biological characteristics of animals are irrelevant to human perception."],"correct":2,"src":"CRIT35","orig":"images/q-dce457fa77.jpg"},{"id":25,"text":"<p>I have booked the conference hall at the Grandview Hotel from 6 pm to 11 pm next Friday for a seminar. The hire charge (including refreshments) has been quoted as:</p><p><strong>$50 plus $15 per hour plus $10 per person.</strong></p><p>I have asked the hotel to cater for <strong>45 people</strong>. How much does the booking cost?</p>","image":"","options":["$575","$625","$675","$725","$775"],"correct":0,"src":"CRIT35","orig":"images/q-6fad15dfb5.jpg"},{"id":26,"text":"<p>Astrology makes claims about human personality and future events based on planetary positions. These claims are often vague enough to apply to a wide range of individuals. Empirical tests have repeatedly failed to demonstrate consistent predictive accuracy in astrological predictions. Scientific theories, by contrast, generate testable hypotheses that can be empirically verified or falsified. Therefore, astrology should be rejected entirely as a source of personal meaning or guidance.</p><p>Which of the following best describes the flaw in the argument above?</p>","image":"","options":["It assumes that all meaningful practices must meet scientific standards of verification.","It overgeneralises from failed predictions to all astrological claims.","It confuses lack of empirical support with deliberate deception.","It ignores historical reasons for astrology's popularity.","It treats science and pseudoscience as indistinguishable categories."],"correct":0,"src":"CRIT35","orig":"images/q-dae8ed36e5.jpg"},{"id":27,"text":"<p>In the sport of Flipball, there are three ways to score points:</p><ul><li>flip = 2 points</li><li>spin = 4 points</li><li>vault = 7 points</li></ul><p>Yesterday the Tigers played the Wolves.</p><ul><li>The Tigers scored <strong>4 vaults, 5 spins, and 10 flips</strong>.</li><li>The Wolves scored <strong>3 vaults, 7 spins, and 8 flips</strong>.</li></ul><p>Who won yesterday's match and by how many points?</p>","image":"","options":["The Tigers by 2 points","The Tigers by 3 points","The Wolves by 3 points","The Wolves by 5 points","The Tigers by 5 points"],"correct":1,"src":"CRIT35","orig":"images/q-4bc8b1b4af.jpg"},{"id":28,"text":"<p>The mango originated in South Asia, where climatic and ecological conditions allowed it to flourish. From this region, the fruit spread to other parts of the world through trade and cultivation. Modern mango varieties grown elsewhere retain genetic characteristics traceable to their South Asian ancestors. This historical continuity has led some scholars to argue that authentic mango cultivation requires conditions similar to those of its original environment. Consequently, mangoes grown outside South Asia are often considered less genuine.</p><p>Which of the following arguments most closely matches the reasoning used above?</p>","image":"","options":["Tea was first cultivated in China; therefore, tea grown elsewhere cannot be of high quality.","Wine grapes originated in the Mediterranean, and many modern varieties retain Mediterranean traits; thus, Mediterranean climates are ideal for viticulture.","Classical architecture developed in ancient Greece, so modern buildings should imitate Greek styles.","Wheat was domesticated in the Fertile Crescent; therefore, wheat grown today must be genetically identical to ancient strains.","Coffee spread globally through trade, so all coffee cultures share the same traditions."],"correct":0,"src":"CRIT35","orig":"images/q-984bb17d1f.jpg"},{"id":29,"text":"<p>Post-Soviet Kazakhstan faced the challenge of constructing a national identity while maintaining political stability in a multiethnic society. State-led narratives emphasised shared history and territorial continuity rather than ethnic homogeneity. This approach aimed to reduce social fragmentation by prioritising civic identity over exclusive cultural definitions. By avoiding policies that privileged a single group, the state sought to balance unity with diversity. The argument implies that inclusive frameworks are more effective for long-term stability in plural societies.</p><p>Which of the following best applies the principle expressed in the passage?</p>","image":"","options":["A company promotes one department's traditions above all others to strengthen internal loyalty.","A school enforces a single cultural curriculum to ensure equal treatment of all students.","A country encourages participation in shared civic institutions rather than defining citizenship by ancestry.","A political movement focuses exclusively on historical grievances to mobilise supporters.","A government suppresses regional identities to prevent political dissent."],"correct":2,"src":"CRIT35","orig":"images/q-a28838b8c4.jpg"},{"id":30,"text":"<p>The board game <em>Letter Quest</em> is played with 80 tiles. Two of the tiles are wildcards; they can represent any letter, but they have no points value. Each of the other tiles has a letter of the alphabet and a points value (between 1 and 8 inclusive) associated with that letter.</p><p>This table shows the distribution of letters and the points value for each letter in <em>Letter Quest</em>:</p><table class=\"q-table\"><thead><tr><th>letter</th><th>number of tiles</th><th>points value</th><th>letter</th><th>number of tiles</th><th>points value</th></tr></thead><tbody><tr><td>A</td><td>7</td><td>1</td><td>N</td><td>5</td><td>1</td></tr><tr><td>B</td><td>3</td><td>3</td><td>O</td><td>6</td><td>1</td></tr><tr><td>C</td><td>2</td><td>3</td><td>P</td><td>2</td><td>4</td></tr><tr><td>D</td><td>4</td><td>2</td><td>Q</td><td>1</td><td>7</td></tr><tr><td>E</td><td>10</td><td>1</td><td>R</td><td>5</td><td>2</td></tr><tr><td>F</td><td>2</td><td>4</td><td>S</td><td>3</td><td>3</td></tr></tbody></table>","image":"images/q-7b379fd6d6.jpg","options":["A","B","C","D","E"],"correct":1,"src":"CRIT35","review":true,"orig":"images/q-7b379fd6d6.jpg"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
