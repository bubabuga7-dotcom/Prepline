<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1120">
<link rel="icon" href="icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prepline">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Train by topic — Prepline</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prepline">
<meta property="og:title" content="Train by topic — Prepline">
<meta property="og:description" content="Practise one NUET topic at a time: quadratics, percentages, assumptions, flaws — with instant feedback.">
<meta property="og:url" content="https://bubabuga7-dotcom.github.io/Prepline/topics.html">
<meta property="og:image" content="https://bubabuga7-dotcom.github.io/Prepline/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Practise one NUET topic at a time: quadratics, percentages, assumptions, flaws — with instant feedback.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prepline.css">
<style>
  .wrap{max-width:860px}
  .head h1{font-size:32px;margin:8px 0 6px}
  .head p{color:var(--ink-2);max-width:640px}
  .view{display:none} .view.on{display:block}
  .muted{color:var(--ink-3);font-size:13.5px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
  .seg button{background:none;border:0;color:var(--ink-2);font:600 13px Inter,sans-serif;padding:6px 14px;border-radius:99px;cursor:pointer}
  .seg button.on{background:var(--gold);color:#0E1A2E}
  .seg button:disabled{opacity:.4;cursor:default}
  .group{margin:18px 0 6px;font:600 11.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .topics{display:flex;flex-direction:column;gap:6px}
  .t{display:grid;grid-template-columns:1fr 150px auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);
     border-radius:var(--r);padding:12px 16px}
  .t:hover{border-color:rgba(132,174,236,.45)}
  .t .nm{font-weight:600;font-size:15px;line-height:1.3}
  .t .nm small{display:block;font:500 12px 'IBM Plex Mono',monospace;color:var(--ink-3);margin-top:3px;font-weight:500}
  .acc{font-size:12px;color:var(--ink-3)}
  .acc .track{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:5px}
  .acc .fill{height:100%;border-radius:3px}
  .acc b{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink)}
  .t .btn{padding:8px 14px;font-size:13px}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--ink-3)}
  .card-top b{color:var(--ink);font-weight:600}
  .prog{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:16px}
  .prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
  .q-img{max-width:100%;background:#fff;border-radius:6px;padding:6px;display:block;margin:0 0 14px}
  .q-text{font-size:16px;line-height:1.6;margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);
       border-radius:7px;padding:11px 14px;font:15px Inter,sans-serif;cursor:pointer;line-height:1.45}
  .opt:hover:not(:disabled){border-color:var(--blue)}
  .opt b{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink-3);min-width:16px;padding-top:2px}
  .opt:disabled{cursor:default}
  .opt.c{border-color:var(--ok);background:rgba(74,222,154,.08)}
  .opt.u{border-color:var(--bad);background:rgba(248,113,113,.08)}
  .opts.row{flex-direction:row;flex-wrap:wrap}
  .opts.row .opt{flex:1;min-width:56px;justify-content:center}
  .res{margin-top:16px;padding:12px 16px;border-radius:7px;font-size:14.5px;display:none}
  .res.ok{display:block;background:rgba(74,222,154,.08);border:1px solid rgba(74,222,154,.35)}
  .res.no{display:block;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .big{font:600 44px 'IBM Plex Mono',monospace;color:var(--gold);line-height:1.1;margin:8px 0 4px}
  .miss{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  .miss a{color:var(--ink-2);font-size:14px;text-decoration:none;border-bottom:1px dashed var(--line);padding:6px 0}
  .miss a:hover{color:var(--blue)}
  .note{margin-top:10px;font-size:13px;color:var(--warn)}
  @media (max-width:640px){
    .head h1{font-size:26px}
    .t{grid-template-columns:1fr auto;gap:10px}
    .t .acc{grid-column:1/-1;order:3}
  }
</style>
</head>
<body>
<aside class="dock" id="dock"></aside>
<main><div class="wrap">
  <div class="head">
    <span class="kicker">Train by topic</span>
    <h1>One topic at a time</h1>
    <p>Pick a topic and solve its questions from every test on the site. You see the right answer straight away, and every attempt counts toward your topic statistics and mistakes deck.</p>
  </div>

  <section class="view on" id="v-list">
    <div class="bar">
      <div class="seg" id="kind">
        <button data-k="math" class="on">Mathematics</button><button data-k="ct">Critical Thinking</button>
      </div>
      <div class="seg" id="sort">
        <button data-s="spec" class="on">Syllabus order</button><button data-s="weak" id="sort-weak">Weakest first</button>
      </div>
    </div>
    <p class="muted" id="hint"></p>
    <div id="list"></div>
  </section>

  <section class="view" id="v-run">
    <div class="panel" id="card"></div>
  </section>
</div></main>

<script src="nav.js"></script>
<script src="tests.js"></script>
<script src="topics-index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script src="explain.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var supa = window.preplineSupa, L = 'ABCDEFGH', INDEX = window.PREPLINE_TOPIC_INDEX || {};
  var NAMES = {
    ASM:'Assumptions', CON:'Conclusions', EF:'External factors', MC:'Main conclusion', FLAW:'Flaws in reasoning',
    'M1.1':'Standard and compound units','M1.2':'Converting between units',
    'M2.1':'Ordering numbers and symbols','M2.2':'The four operations','M2.3':'Primes, factors, multiples, HCF and LCM',
    'M2.4':'Inverse operations and priority','M2.5':'Systematic listing','M2.6':'Squares, cubes and roots',
    'M2.7':'Index laws (numbers)','M2.8':'Standard form','M2.9':'Fractions, decimals and percentages',
    'M2.10':'Using fractions and percentages','M2.11':'Surds and π','M2.12':'Upper and lower bounds',
    'M2.13':'Rounding and accuracy','M2.14':'Approximation and estimation',
    'M3.1':'Scale factors and diagrams','M3.2':'One quantity as a fraction of another','M3.3':'Ratio notation',
    'M3.4':'Dividing in a ratio','M3.5':'Ratio in real contexts','M3.6':'Proportion','M3.7':'Fractions in ratio problems',
    'M3.8':'Percentages and percentage change','M3.9':'Direct and inverse proportion',
    'M3.10':'Lengths, areas and volumes by ratio','M3.11':'Growth, decay and compound interest',
    'M4.1':'Algebraic notation','M4.2':'Index laws (algebra)','M4.3':'Substituting into formulae',
    'M4.4':'Brackets and common factors','M4.5':'Factorising quadratics','M4.6':'Simplifying expressions',
    'M4.7':'Changing the subject','M4.8':'Equations and identities','M4.9':'Coordinates',
    'M4.10':'Straight lines','M4.11':'Quadratic graphs','M4.12':'Graphs of functions',
    'M4.13':'Interpreting graphs','M4.14':'Gradients and areas under graphs','M4.15':'Equations and simultaneous equations',
    'M4.16':'Quadratic equations','M4.17':'Linear inequalities','M4.18':'Sequences','M4.19':'The nth term',
    'M5.1':'Geometrical terms and symmetry','M5.2':'Angle properties','M5.3':'Quadrilaterals and triangles',
    'M5.4':'Congruence criteria','M5.5':'Angles and sides via similarity','M5.6':'Transformations',
    'M5.7':'Pythagoras','M5.8':'Circle terminology','M5.9':'Circle theorems','M5.10':'Coordinate geometry',
    'M5.11':'Faces, edges and vertices','M5.12':'Plans and elevations','M5.13':'Maps and bearings',
    'M5.14':'Areas and volumes of prisms','M5.15':'Circle and solid formulae','M5.16':'Arcs and sectors',
    'M5.17':'Similarity: lengths, areas, volumes','M5.18':'Trigonometric ratios','M5.19':'Vectors'
  };
  var GROUPS = { M1: 'Units', M2: 'Number', M3: 'Ratio and proportion', M4: 'Algebra', M5: 'Geometry and measures', CT: 'Critical Thinking' };
  var CT_ORDER = ['MC', 'CON', 'ASM', 'EF', 'FLAW'];
  var SIZE = 10;
  var kind = 'math', sort = 'spec', stats = {}, user = null, pages = {};
  var run = null;   // {topic, items:[{mock,q}], pos, right, wrong:[]}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function isCT(code) { return !/^M\d/.test(code); }
  function specKey(code) {
    if (isCT(code)) return [9, CT_ORDER.indexOf(code)];
    var p = code.slice(1).split('.'); return [+p[0], +p[1]];
  }
  function cmpSpec(a, b) { var x = specKey(a), y = specKey(b); return x[0] - y[0] || x[1] - y[1]; }
  function accOf(code) { var s = stats[code]; return s && s.total ? Math.round(s.correct / s.total * 100) : null; }
  function colour(p) { return p < 50 ? '#F87171' : p < 70 ? '#F5C451' : p < 85 ? '#84AEEC' : '#4ADE9A'; }
  function testName(id) {
    var t = (window.PREPLINE_TESTS || []).find(function (x) { return x.id === id; });
    if (!t) return id;
    return t.group === 'Original mock exams' ? t.src : (t.kind === 'ct' ? 'CT Test ' : 'Math Test ') + t.n;
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function show(id) { ['v-list', 'v-run'].forEach(function (v) { $(v).classList.toggle('on', v === id); }); window.scrollTo(0, 0); }

  /* ---------- topic list ---------- */
  function drawList() {
    var codes = Object.keys(INDEX).filter(function (c) { return (kind === 'ct') === isCT(c); });
    var weakOk = codes.some(function (c) { return accOf(c) !== null; });
    $('sort-weak').disabled = !weakOk;
    if (sort === 'weak' && !weakOk) sort = 'spec';
    [].forEach.call($('sort').children, function (b) { b.classList.toggle('on', b.dataset.s === sort); });
    $('hint').textContent = user
      ? (weakOk ? 'Your accuracy comes from every test you have saved.' : 'Finish a test or a topic session and your accuracy per topic appears here.')
      : 'Sign in to save your answers and see your accuracy per topic.';

    var h = '';
    if (sort === 'weak') {
      codes.sort(function (a, b) {
        var x = accOf(a), y = accOf(b);
        if (x === null && y === null) return cmpSpec(a, b);
        if (x === null) return 1; if (y === null) return -1;
        return x - y || cmpSpec(a, b);
      });
      h += '<div class="topics">' + codes.map(row).join('') + '</div>';
    } else {
      codes.sort(cmpSpec);
      var last = '';
      codes.forEach(function (c) {
        var g = isCT(c) ? 'CT' : c.split('.')[0];
        if (g !== last) { h += (last ? '</div>' : '') + '<div class="group">' + esc(GROUPS[g] || g) + '</div><div class="topics">'; last = g; }
        h += row(c);
      });
      if (last) h += '</div>';
    }
    $('list').innerHTML = h || '<p class="muted">No topics yet.</p>';
  }
  function row(c) {
    var n = INDEX[c].length, p = accOf(c), s = stats[c];
    var acc = p === null ? '<div class="acc">Not tried yet<div class="track"></div></div>'
      : '<div class="acc"><b>' + p + '%</b> of ' + s.total + ' answered<div class="track"><div class="fill" style="width:' + p + '%;background:' + colour(p) + '"></div></div></div>';
    return '<div class="t"><div class="nm">' + esc(NAMES[c] || c) + '<small>' + esc(c) + ' · ' + n + ' question' + (n === 1 ? '' : 's') + '</small></div>' +
      acc + '<button class="btn" data-go="' + esc(c) + '">Practise</button></div>';
  }

  /* ---------- questions, read from the test pages ---------- */
  async function questionsOf(mock) {
    if (pages[mock]) return pages[mock];
    var html = await (await fetch(mock + '.html')).text();
    var m = html.match(/^const (?:questions|QUESTIONS)\s*=\s*(\[.*\]);\s*$/m);
    var by = {}; (m ? JSON.parse(m[1]) : []).forEach(function (q) { by[q.id] = q; });
    return (pages[mock] = by);
  }
  function renderMath(el) {
    var go = function () { window.renderMathInElement && renderMathInElement(el, { delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false }); };
    if (window.renderMathInElement) return go();
    if (!/\\\(|\\\[/.test(el.textContent) || document.getElementById('katex-js')) return;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css'; document.head.appendChild(l);
    var a = document.createElement('script'); a.id = 'katex-js'; a.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
    a.onload = function () { var b = document.createElement('script'); b.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js'; b.onload = go; document.head.appendChild(b); };
    document.head.appendChild(a);
  }

  /* ---------- a practice session ---------- */
  function start(code, all) {
    var items = shuffle(INDEX[code].map(function (x) { return { mock: x[0], id: x[1] }; }));
    if (!all) items = items.slice(0, SIZE);
    run = { topic: code, items: items, pos: 0, right: 0, wrong: [], all: !!all };
    try { history.replaceState(null, '', '?t=' + encodeURIComponent(code)); } catch (e) {}
    show('v-run');
    next();
  }

  async function next() {
    $('card').innerHTML = '<p class="muted">Loading…</p>';
    while (run.pos < run.items.length) {
      var it = run.items[run.pos], q = null;
      try { q = (await questionsOf(it.mock))[it.id]; } catch (e) {}
      if (q && (q.options || []).length && q.verified !== false) return draw(it, q);
      run.items.splice(run.pos, 1);                       // question removed from the site: skip it
    }
    finish();
  }

  function draw(it, q) {
    var img = q.image || q.img, n = run.items.length;
    var letters = q.options.every(function (o, k) { return o === L[k]; });
    $('card').innerHTML =
      '<div class="card-top"><span><b>' + esc(NAMES[run.topic] || run.topic) + '</b> · ' + (run.pos + 1) + ' of ' + n + '</span>' +
      '<span>' + esc(testName(it.mock)) + ', Q' + it.id + '</span></div>' +
      '<div class="prog"><i style="width:' + (run.pos / n * 100) + '%"></i></div>' +
      '<div data-ex-mock="' + esc(it.mock) + '" data-ex-q="' + it.id + '">' +
      (img ? '<img class="q-img" src="' + esc(img) + '" alt="Question">' : '') +
      (q.text ? '<div class="q-text">' + q.text + '</div>' : '') +
      '<div class="opts' + (letters ? ' row' : '') + '" id="opts">' + q.options.map(function (o, k) {
        return '<button type="button" class="opt" data-k="' + k + '"><b>' + L[k] + '</b><span>' + (letters ? '' : o) + '</span></button>';
      }).join('') + '</div><div class="res" id="res"></div></div>' +
      '<div class="actions"><button class="btn" id="next" style="display:none">' + (run.pos + 1 < n ? 'Next question →' : 'See result →') + '</button>' +
      '<button class="btn ghost" id="quit">End session</button></div>';
    renderMath($('card'));
    $('opts').onclick = function (e) {
      var b = e.target.closest('.opt'); if (!b || b.disabled) return;
      var k = +b.dataset.k, ok = k === q.correct;
      [].forEach.call(this.children, function (x) { x.disabled = true; if (+x.dataset.k === q.correct) x.classList.add('c'); });
      if (!ok) b.classList.add('u');
      var res = $('res');
      if (ok) { run.right++; res.className = 'res ok'; res.innerHTML = '<b>Correct.</b>'; }
      else { run.wrong.push(it); res.className = 'res no'; res.innerHTML = '<b>Not quite.</b> The answer is ' + L[q.correct] + '. Wrong answers go to your mistakes deck.'; }
      save(it, q, ok);
      $('next').style.display = ''; $('next').focus();
    };
    $('next').onclick = function () { run.pos++; next(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    $('quit').onclick = function () { run.items = run.items.slice(0, run.pos + ($('next').style.display === '' ? 1 : 0)); finish(); };
  }

  // one compact row per answer: counts toward topic stats, the mistakes deck and unlocks writing explanations
  function save(it, q, ok) {
    if (!user || !supa) return;
    supa.from('answer_attempts').insert({ mock_id: it.mock, q_ids: [it.id], marks: ok ? 'c' : 'w' }).then(function (r) {
      if (r.error) { console.error('[Prepline] topic practice:', r.error.message); return; }
      var s = stats[run.topic] = stats[run.topic] || { total: 0, correct: 0 };
      s.total++; if (ok) s.correct++;
    });
    if (q.topic) supa.from('question_topics').upsert({ mock_id: it.mock, q_id: it.id, topic: q.topic }, { onConflict: 'mock_id,q_id', ignoreDuplicates: true }).then(function () {});
  }

  function finish() {
    var n = run.items.length, code = run.topic;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (!n) { show('v-list'); drawList(); return; }
    var p = Math.round(run.right / n * 100), more = INDEX[code].length > SIZE;
    var h = '<span class="kicker">' + esc(NAMES[code] || code) + '</span>' +
      '<div class="big">' + run.right + ' / ' + n + '</div>' +
      '<p class="muted">' + p + '% correct' + (user ? '. Saved to your topic statistics.' : '.') + '</p>' +
      (user ? '' : '<p class="note">You are not signed in, so this session was not saved.</p>');
    if (run.wrong.length) {
      h += '<div class="miss"><span class="muted">Missed — open the question in its test:</span>' + run.wrong.map(function (it) {
        return '<a href="' + esc(it.mock) + '.html">' + esc(testName(it.mock)) + ', question ' + it.id + '</a>';
      }).join('') + '</div>';
    }
    h += '<div class="actions"><button class="btn" id="again">' + (more && !run.all ? 'New set of ' + SIZE : 'Again') + '</button>' +
      (more && !run.all ? '<button class="btn ghost" id="all">All ' + INDEX[code].length + ' questions</button>' : '') +
      '<button class="btn ghost" id="back">All topics</button></div>';
    $('card').innerHTML = h;
    $('again').onclick = function () { start(code, run.all); };
    if ($('all')) $('all').onclick = function () { start(code, true); };
    $('back').onclick = function () { show('v-list'); drawList(); };
  }

  /* ---------- wiring ---------- */
  $('kind').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    kind = b.dataset.k; [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    drawList();
  };
  $('sort').onclick = function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    sort = b.dataset.s; drawList();
  };
  $('list').onclick = function (e) { var b = e.target.closest('[data-go]'); if (b) start(b.dataset.go); };
  document.addEventListener('keydown', function (e) {
    if (!$('v-run').classList.contains('on') || e.target.closest('input,textarea')) return;
    var k = e.key.length === 1 ? L.indexOf(e.key.toUpperCase()) : -1; if (k < 0) k = '12345678'.indexOf(e.key);
    var o = document.querySelectorAll('#opts .opt')[k];
    if (o && !o.disabled) o.click();
    else if (e.key === 'Enter' && $('next') && e.target !== $('next') && $('next').style.display === '') $('next').click();
  });

  async function loadStats() {
    stats = {}; user = null;
    if (supa) {
      try { user = (await supa.auth.getUser()).data.user; } catch (e) {}
      if (user && window.preplineTopicStats) {
        try { (await window.preplineTopicStats()).forEach(function (s) { stats[s.topic] = { total: s.total, correct: s.correct }; }); } catch (e) {}
      }
    }
  }

  (async function boot() {
    var t = new URLSearchParams(location.search).get('t');
    if (t && INDEX[t]) kind = isCT(t) ? 'ct' : 'math';
    [].forEach.call($('kind').children, function (x) { x.classList.toggle('on', x.dataset.k === kind); });
    drawList();
    await loadStats();
    if (t && INDEX[t]) start(t); else drawList();
    supa && supa.auth.onAuthStateChange(function (ev) {
      if (ev !== 'SIGNED_IN' && ev !== 'SIGNED_OUT') return;
      loadStats().then(function () { if ($('v-list').classList.contains('on')) drawList(); });
    });
  })();
})();
</script>
</body>
</html>
