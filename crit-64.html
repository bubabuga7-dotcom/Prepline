<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q10 · Assumption</p>", "image": "images/ct-pp/ct085_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из примера синиц в Оксфордшире делают вывод о карибу в Арктике.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: арктические мигрирующие животные адаптируются так же успешно. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ослабляет.</li><li>C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Аналогия должна переноситься.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q11 · Problem solving</p>", "image": "images/ct-pp/ct085_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кошка: 5,3 : 3500 ≈ 0,0015.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мышь 0,09 : 58 ≈ 0,00155 — ближе всего. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Собака 0,0017; кролик 0,0011; голубь 0,0008; белка 0,0043.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переведите кг в г.</div></div>"}, {"id": 3, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q12 · Drawing a conclusion</p>", "image": "images/ct-pp/ct085_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В спорт играют либо ради нагрузки, либо ради соревнования; в бильярд — вряд ли ради нагрузки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, бильярдистов скорее интересует соревнование, чем футболистов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — не следуют.</li><li>C — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Либо — либо» + исключение одного.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q13 · Problem solving</p>", "image": "images/ct-pp/ct085_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Номер вверх ногами = поворот на 180°, затем зеркало.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поворот: «HNↃ 80ƐS»; в зеркале порядок и буквы отражаются → «Ƨ308 CИH». Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — неверно отражены S, 3, C или N.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поворот + зеркало = отражение по вертикали.</div></div>"}, {"id": 5, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q14 · Main conclusion</p>", "image": "images/ct-pp/ct085_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Повышение лимита не уменьшит пробки и увеличит опасность.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: повышать лимит до 150 км/ч — плохая идея. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тезис в первом предложении.</div></div>"}, {"id": 6, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q15 · Principle</p>", "image": "images/ct-pp/ct085_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Соль нужна только гипертоникам → советовать им, а не лишать всех.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: фтор не всем нужен — лучше советы пациентам с проблемами зубов. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — принимать меры для всех.</li><li>C, D — наказание или запрет.</li><li>E — советы вместо запрета, но не «для группы риска».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Меры — только для тех, кому нужно.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct085_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ховеркрафт: 50 мин туда + 20 стоянка → в 70 мин выходит обратно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Паром за 70 мин прошёл 0,7 пути; между ними 0,3.</li><li>Сближение: <span class=\"fr\"><span>1</span><span>100</span></span> + <span class=\"fr\"><span>1</span><span>50</span></span> = <span class=\"fr\"><span>3</span><span>100</span></span> пути в мин → 10 мин.</li><li>70 + 10 = 80 мин = 1 ч 20 мин. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — без стоянки или неверная скорость.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скорости в долях пути.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q17 · Problem solving</p>", "image": "images/ct-pp/ct085_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пролёты: 115, 90, 120, 180, 210, 150, 210 = 1075 см; рейка 240 см.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минимум 1075 : 240 ≈ 4,5 → 5.</li><li>Возможно: 210 | 210 | 180 | 150 + 90 | 120 + 115. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — не хватает длины.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нижняя оценка + пример.</div></div>"}, {"id": 9, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q18 · Principle</p>", "image": "images/ct-pp/ct085_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Конец оправдывает средства? Автор: нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Предотвращение преступления не оправдывает другое. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — против автора.</li><li>C, D — не про принцип.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цель ≠ оправдание.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct085_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем между двумя полными заправками.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>23 805 → 24 989 = 1184 км; залито после первой полной: 25 + 21 + 34 = 80 л.</li><li>80 : 11,84 ≈ 6,8 л/100 км. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E, B — неверный отрезок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полный бак → полный бак.</div></div>"}, {"id": 11, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct085_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">9 витрин по 1,5 м; столы в 4 × 4 м (по 1 м зазора).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C (П-образно): верх 4 м → 2 витрины, внешние стороны по 3 м → 4, внутренние 2 м → 2, внутренний верх 2 м → 1.</li><li>Итого 9. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — длиннее 4 м.</li><li>A, D — мало периметра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Витрина — на прямой край ≥ 1,5 м.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct085_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем плитки с узором «угол»: линия сверху и слева.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проходим по буквам S, P, E, L, L, I, T, O, U, T и отмечаем такие углы.</li><li>Всего 17. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Ошибка на 1–2 — пропущенные углы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте по буквам.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q2 · Problem solving</p>", "image": "images/ct-pp/ct085_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего 64 ч; 4 рабочих по 16 ч = 64 — нужна идеальная укладка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 ч можно дополнить только 4 ч; тогда 9 ч нужно дополнить до 16 — из оставшихся нельзя.</li><li>Значит, 4 мало; 5 хватит. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — нижняя оценка недостижима.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте, сходится ли точно.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct085_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4 стороны, банку можно поворачивать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>КККК, СССС, 3К+1С, 1К+3С, 2К рядом, 2К напротив = 6. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — забыли «напротив»; C — не учли повороты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Повороты не дают новых банок.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q4 · Problem solving</p>", "image": "images/ct-pp/ct085_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Грейс 6-я → после неё стартуют 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Финишировавших: 17 + 1 + 5 = 23; плюс 3 сошли.</li><li>26. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без сошедших.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный порядок.</div></div>"}, {"id": 16, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q5 · Drawing a conclusion</p>", "image": "images/ct-pp/ct085_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала почти угадывание, через несколько дней — лучше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Узнавание — навык, который приходит с опытом, а не врождённый. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — противоречит.</li><li>D, E — не сравнивали.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Улучшение со временем = обучение.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct085_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Малый фургон: 10 + 60 = 70 мин на рейс.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>С 7:30 до 13:00 — 330 мин → 4 рейса = 280 мин.</li><li>Старт 13:00 − 4:40 = 8:20 — на 20 мин позже. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не 4 рейса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте от конца.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct085_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Белый хлеб: 100 + 54 + 2 + 17 = 173% от муки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>250 · 1,73 = 432,5 кг. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без муки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент пекаря — от муки.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct085_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Белок ≥ 20 г, жир ≤ 4 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подходят говядина (2,00) и индейка (2,20).</li><li>Минимум 2,00 £. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Курица — жир 4,1.</li><li>Ветчина, салат — мало белка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Фильтр, потом минимум.</div></div>"}, {"id": 20, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q9 · Assumption</p>", "image": "images/ct-pp/ct085_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Родной язык усваивается без грамматики → второй тоже.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: второй язык усваивается так же, как первый. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Аналогия без обоснования.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q10 · Problem solving</p>", "image": "images/ct-pp/ct085_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Те же 6 плиток, можно переставлять и поворачивать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только в A набор узоров совпадает с исходным. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>В других появляется чужая плитка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте плитки поштучно.</div></div>"}, {"id": 22, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q11 · Main conclusion</p>", "image": "images/ct-pp/ct085_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первое предложение — тезис; «it follows» — промежуточный вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Игра = мышление, значит, детям нужно играть, чтобы развивать мышление. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — промежуточный шаг.</li><li>A, B, E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что подкрепляет остальное.</div></div>"}, {"id": 23, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q12 · Principle</p>", "image": "images/ct-pp/ct085_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вопрос «могло ли это случиться естественно?»; если нет — не делать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наука не должна выходить за пределы естественного. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — вывод, а не принцип.</li><li>B — слишком сильно.</li><li>A, E — не то.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Принцип — общее правило.</div></div>"}, {"id": 24, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q13 · Problem solving</p>", "image": "images/ct-pp/ct085_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лист сложен дважды → вырезы повторяются симметрично 4 раза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В E вырезы стоят не там, где они получились бы при развёртке. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D возможны при разной ориентации сгибов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отразите вырез через обе линии сгиба.</div></div>"}, {"id": 25, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q14 · Weaken</p>", "image": "images/ct-pp/ct085_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отставание США объясняют ожирением и отсутствием спорта.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но в 60-е и 70-е в США курили больше всех — это может быть причиной. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — усиливает.</li><li>A, C, E — не ослабляют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 26, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q15 · Weaken</p>", "image": "images/ct-pp/ct085_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Связь доказана → барсуков надо отстреливать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если ТБ распространяется и по другим причинам — отстрел может не решить проблему. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — мнения.</li><li>C — усиливает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Другие источники заражения.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct085_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сейчас январь → следующий перевод в марте.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>+1 ч: Лондон, Афины, Чикаго, Нью-Йорк; −1 ч: Сантьяго, Сидней.</li><li>Нью-Йорк 11:37 и Сантьяго 11:37. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — разное время.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знаки сдвигов противоположны.</div></div>"}, {"id": 28, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q17 · Main conclusion</p>", "image": "images/ct-pp/ct085_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цены не помогут: важно удобство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: нужно больше готовой здоровой еды. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — отвергнутая идея.</li><li>A, D, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация в конце.</div></div>"}, {"id": 29, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q18 · Strengthen</p>", "image": "images/ct-pp/ct085_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Презумпция согласия резко увеличит число органов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если добровольных доноров мало и не прибавляется — мера нужна. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — ослабляют.</li><li>A — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что иначе не выйдет.</div></div>"}, {"id": 30, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q19 · Strengthen</p>", "image": "images/ct-pp/ct085_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мужчины-модели показывают, что такая одежда не для большинства женщин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если это делает «модельную» фигуру менее желанной — польза подтверждена. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ослабляет.</li><li>B, C, D — слабее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подтвердите заявленную пользу.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
