<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Given that \\(f(x) = x^2 + 2x + 1\\) and \\(g(x) = 2x - 5\\), find the value of \\(f(g(30))\\).</p>", "image": "", "options": ["3000", "3012", "3024", "3126", "3136"], "correct": 4, "verified": true, "src": "M36", "orig": "images/q-beb4c79744.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Замечаем, что f(x) = (x + 1)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>g(30) = 60 − 5 = 55.</li><li>f(55) = 56² = 3136.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — арифметические ошибки при возведении в квадрат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Узнавайте полный квадрат — считать проще.</div></div>"}, {"id": 2, "text": "<p>In the figure below, PA and PB are tangents from an external point P to a circle with center O. Points A and B are on the circle. If the angle APB = 40°, what is the size of angle AOP?</p>", "image": "images/q-9faeb82e1a.jpg", "options": ["40°", "50°", "70°", "130°", "140°"], "correct": 2, "verified": true, "src": "M36", "orig": "images/q-9faeb82e1a.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касательная перпендикулярна радиусу; OP — биссектриса угла APB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠OAP = 90°.</li><li>∠APO = 40°/2 = 20°.</li><li>∠AOP = 180° − 90° − 20° = 70°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (140°) — это ∠AOB.</li><li>B (50°) — 90 − 40.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Две касательные из одной точки симметричны относительно OP.</div></div>"}, {"id": 3, "text": "<p>Solve the equation for x and find a possible positive option: \\(3^{2x+1} = 27^{x^2}\\)</p>", "image": "", "options": ["0.5", "1", "1.5", "2", "3"], "correct": 1, "verified": true, "src": "M36", "orig": "images/q-a0c1aa1030.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к основанию 3 и приравниваем показатели.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>27<sup>x²</sup> = 3<sup>3x²</sup>.</li><li>2x + 1 = 3x² → 3x² − 2x − 1 = 0.</li><li>(3x + 1)(x − 1) = 0 → x = 1 (положительный).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не удовлетворяют уравнению.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 3³ = 27¹ ✓.</div></div>"}, {"id": 5, "text": "<p>In the triangle ABC shown below, a line segment DE is drawn parallel to BC, with D on AB and E on AC.</p><p>We are given lengths AD = 3 cm, DB = 2 cm, and BC = 15 cm. What is the length of DE?</p>", "image": "images/q-d146cb77f0.jpg", "options": ["6 cm", "9 cm", "10 cm", "12 cm", "25 cm"], "correct": 1, "verified": true, "src": "M36", "orig": "images/q-d146cb77f0.jpg", "review": true, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">DE ∥ BC → треугольники ADE и ABC подобны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = 3 + 2 = 5 → k = <span class=\"fr\"><span>3</span><span>5</span></span>.</li><li>DE = <span class=\"fr\"><span>3</span><span>5</span></span> · 15 = 9 см.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (6) — взяли <span class=\"fr\"><span>2</span><span>5</span></span>.</li><li>C, D, E — неверный коэффициент.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение берём к целой стороне AB, а не к DB.</div></div>"}, {"id": 6, "text": "<p>A group of 10 employees at a company has an average salary of $50,000. A new department with N employees joins them, and their average salary is A. After they join, the overall average salary for all employees becomes 54,000$.</p><p>Write an equation that represents A in terms of N:</p>", "image": "", "options": ["\\(54000+\\frac{40000}{N}\\)", "\\(\\frac{40000}{N}\\)", "\\(54000N+\\frac{40000}{N}\\)", "\\(54000+40000N\\)"], "correct": 0, "verified": true, "src": "M36", "review": true, "orig": "images/q-97773a73bf.jpg", "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через суммы зарплат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 · 50 000 + N · A = 54 000(10 + N).</li><li>N · A = 40 000 + 54 000N.</li><li>A = 54 000 + 40 <span class=\"fr\"><span>000</span><span>N</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — потерян член 54 000.</li><li>C, D — неверное деление на N.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка смыслом: новые сотрудники должны получать больше 54 000, чтобы поднять среднее.</div></div>"}, {"id": 8, "text": "<p>The figure shows a sector of a circle with center O and radius 12 cm. The angle of the sector AOB is 30°. OC divides the sector into two equal parts.</p><p>What is the area of this shaded region?</p>", "image": "images/q-d0e86c74c3.jpg", "options": ["\\(6\\pi -18\\) cm", "\\(12\\pi-18\\) cm", "\\(24\\pi-24\\) cm", "\\(36\\pi-8\\) cm", "\\(144\\pi-18\\) cm"], "correct": 0, "verified": true, "src": "M36", "orig": "images/q-d0e86c74c3.jpg", "review": true, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Заштрихована половина сегмента, отсекаемого хордой AB (OC — ось симметрии).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сектор: <span class=\"fr\"><span>30</span><span>360</span></span> · π · 144 = 12π.</li><li>Треугольник AOB: ½ · 12 · 12 · sin 30° = 36.</li><li>Сегмент: 12π − 36 → половина: 6π − 18.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — весь сегмент... с ошибкой.</li><li>C, D, E — неверные площади.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сегмент = сектор − треугольник.</div></div>"}, {"id": 9, "text": "<p>A swimmer crosses a lake (Distance D) at a constant speed of 4 km/h. On the way back, she swims the first half of the distance at 2 km/h. For the final half of the return journey, she speeds up to w km/h.</p><p>If her average speed for the entire round trip is 3 km/h, find the value of w.</p>", "image": "", "options": ["1 km/h", "1.5 km/h", "2 km/h", "3 km/h", "5km/h"], "correct": 3, "verified": true, "src": "M36", "orig": "images/q-c223be36b8.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя скорость = весь путь / всё время.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Путь 2D, средняя 3 → время <span class=\"fr\"><span>2D</span><span>3</span></span>.</li><li>Туда <span class=\"fr\"><span>D</span><span>4</span></span>, обратно <span class=\"fr\"><span>D</span><span>4</span></span> + <span class=\"fr\"><span>D</span><span>2w</span></span>.</li><li><span class=\"fr\"><span>D</span><span>2</span></span> + <span class=\"fr\"><span>D</span><span>2w</span></span> = <span class=\"fr\"><span>2D</span><span>3</span></span> → <span class=\"fr\"><span>1</span><span>2w</span></span> = <span class=\"fr\"><span>1</span><span>6</span></span> → w = 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не дают среднюю 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> D сокращается — его можно взять любым (например, 12).</div></div>"}, {"id": 10, "text": "<p>Simplify the algebraic expression: \\(\\frac{(x^2-4)}{(x^2+4x+4)}\\)</p>", "image": "", "options": ["\\(\\frac{x-2}{(x+2)}\\)", "\\(\\frac{x+2}{x-2}\\)", "\\(1\\)", "\\(-1\\)", "\\(\\frac{x-4}{x+4}\\)"], "correct": 0, "verified": true, "src": "M36", "orig": "images/q-6d0b7eb563.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность квадратов / полный квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 2)<span class=\"fr\"><span>x + 2</span><span>x + 2</span></span>² = <span class=\"fr\"><span>x − 2</span><span>x + 2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перевёрнуто.</li><li>C, D, E — неверное сокращение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сокращаем только множители.</div></div>"}, {"id": 11, "text": "<p>In a 3D figure, a cone and a cylinder have the same base radius 'r' and the same perpendicular height 'h'.</p><p>What is the ratio of the volume of the cone to the volume of the cylinder?</p>", "image": "images/q-81ed468b66.jpg", "options": ["1:1", "1:2", "1:3", "2:3", "3:1"], "correct": 2, "verified": true, "src": "M36", "orig": "images/q-81ed468b66.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём конуса — треть цилиндра с тем же основанием и высотой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конус: ⅓πr²h; цилиндр: πr²h → 1 : 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — перевёрнуто.</li><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пирамида и конус — ⅓ соответствующей призмы/цилиндра.</div></div>"}, {"id": 12, "text": "<p>Simplify the following expression: \\(\\dfrac{4\\sqrt{27}+2\\sqrt{75}-6\\sqrt{32}-3\\sqrt{50}}{3}\\).</p>", "image": "", "options": ["\\(\\dfrac{13\\sqrt{2}}{3}-13\\sqrt{3}\\)", "\\(\\dfrac{13\\sqrt{3}}{3}-13\\sqrt{2}\\)", "\\(\\dfrac{22\\sqrt{3}}{3}-22\\sqrt{2}\\)", "\\(22\\sqrt{3}-13\\sqrt{2}\\)", "\\(\\dfrac{22\\sqrt{3}}{3}-13\\sqrt{2}\\)"], "correct": 4, "verified": true, "src": "M36", "orig": "images/q-d287eebc6e.jpg", "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем каждый корень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4√27 = 12√3; 2√75 = 10√3 → 22√3.</li><li>6√32 = 24√2; 3√50 = 15√2 → 39√2.</li><li><span class=\"fr\"><span>22√3 − 39√2</span><span>3</span></span> = <span class=\"fr\"><span>22√3</span><span>3</span></span> − 13√2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — <span class=\"fr\"><span>39</span><span>3</span></span> ≠ 22.</li><li>A, B, D — неверные коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Группируйте одинаковые корни.</div></div>"}, {"id": 13, "text": "<p>The Least Common Multiple (LCM) of three different positive integers is 1200. Which of the following CANNOT be their Highest Common Factor (HCF)?</p>", "image": "", "options": ["20", "25", "45", "60"], "correct": 2, "verified": true, "src": "M36", "review": true, "orig": "images/q-a28cdca49a.jpg", "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОД всегда делит НОК.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1200 = 2⁴ · 3 · 5².</li><li>45 = 3² · 5 — содержит 3², а в 1200 только 3¹ → 45 не делит 1200.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (20), B (25), D (60) — делят 1200.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка делимости: 1200 ÷ 45 не целое.</div></div>"}, {"id": 14, "text": "<p>In the coordinate plane, find the equation of the line that passes through the point (2, -1) and is perpendicular to the line \\(y = -2x + 5\\).</p>", "image": "", "options": ["\\(y = 2x - 5\\)", "\\(y = -2x + 3\\)", "\\(y = 0.5x + 2\\)", "\\(y = 0.5x - 2\\)", "\\(y = -0.5x\\)"], "correct": 3, "verified": true, "src": "M36", "orig": "images/q-c37a9b9ae8.jpg", "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон перпендикуляра = <span class=\"fr\"><span>−1</span><span>k</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = −2 → перпендикуляр ½.</li><li>y + 1 = ½(x − 2) → y = 0,5x − 2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — неверный перехват.</li><li>A, B, E — неверный наклон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка точки (2; −1): 1 − 2 = −1 ✓.</div></div>"}, {"id": 15, "text": "<p>Given the equation \\(x^2 - \\sqrt{11}x + 1 = 0\\), find the exact value of: \\(x^4 + x^{-4}\\)</p>", "image": "", "options": ["79", "81", "119", "123", "130"], "correct": 0, "verified": true, "src": "M36", "orig": "images/q-7d6c3e5532.jpg", "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим на x и дважды возводим в квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + <span class=\"fr\"><span>1</span><span>x</span></span> = √11.</li><li>x² + <span class=\"fr\"><span>1</span><span>x²</span></span> = 11 − 2 = 9.</li><li>x⁴ + <span class=\"fr\"><span>1</span><span>x⁴</span></span> = 81 − 2 = 79.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (81) — забыли −2.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый раз вычитаем 2.</div></div>"}, {"id": 16, "text": "<p>Find a common set of solutions to solve the inequalities:</p><p>\\(x^2 - 2x - 15 &lt; 0\\) and \\(x^2 - 4x + 6 &lt; 0\\)</p>", "image": "", "options": ["x &lt; -3 or x &gt; 5", "-3 &lt; x &lt; 5", "x &lt; 3 or x &gt; -5", "-5 &lt; x &lt; 3", "No common solutions"], "correct": 4, "verified": true, "src": "M36", "orig": "images/q-f2978181f1.jpg", "review": true, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Второе неравенство не имеет решений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 4x + 6 = (x − 2)² + 2 ≥ 2 > 0 — всегда положительно.</li><li>Значит, < 0 не бывает никогда → общих решений нет.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — решение только первого неравенства.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если D < 0 и ветви вверх — выражение всегда положительно.</div></div>"}, {"id": 17, "text": "<p>Consider the triangle PQR shown below. The lengths of sides PQ and PR are 10 and 6, respectively. The angle QPR between these sides is 60°.</p><p>What is the length of the side QR?</p>", "image": "images/q-60cff096c5.jpg", "options": ["\\(2\\sqrt{19}\\)", "\\(\\sqrt{78}\\)", "8", "14", "\\(2\\sqrt{7}\\)"], "correct": 0, "verified": true, "src": "M36", "orig": "images/q-60cff096c5.jpg", "review": true, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема косинусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>QR² = 100 + 36 − 2 · 10 · 6 · cos 60° = 136 − 60 = 76.</li><li>QR = √76 = 2√19.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без −60.</li><li>D (14) — сложили стороны.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> cos 60° = ½.</div></div>"}, {"id": 18, "text": "<p>A naval convoy of ships, moving at a constant speed of 54 km/h, takes 20 seconds to pass a stationary buoy in the ocean. Later, the same convoy passes through a narrow strait (channel). It takes 80 seconds for the entire convoy to clear the strait, measured from the moment the first ship enters the strait until the last ship exits it.</p><p>What is the length of the strait?</p>", "image": "", "options": ["600 m", "900 m", "1200 m", "1500 m"], "correct": 1, "verified": true, "src": "M36", "review": true, "orig": "images/q-d2ce466b6b.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время прохождения буя даёт длину конвоя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>54 км/ч = 15 м/с.</li><li>Длина конвоя: 15 · 20 = 300 м.</li><li>За 80 с: 1200 м = пролив + конвой → пролив 900 м.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1200) — забыли длину конвоя.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Чтобы полностью пройти пролив, нужно проехать пролив + свою длину.</div></div>"}, {"id": 20, "text": "<p>What is the equation of the circle centered at C(-1, 4) that passes through the origin O(0, 0)?</p>", "image": "", "options": ["\\((x + 1)^2 + (y - 4)^2 = 5\\)", "\\((x - 1)^2 + (y + 4)^2 = 17\\)", "\\((x + 1)^2 + (y - 4)^2 = 17\\)", "\\(x^2 + y^2 = 17\\)", "\\((x + 1)^2 + (y - 4)^2 = 3\\)"], "correct": 2, "verified": true, "src": "M36", "orig": "images/q-e6f8c53910.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Радиус — расстояние от центра до начала координат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r² = 1² + 4² = 17.</li><li>(x + 1)² + (y − 4)² = 17.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — r² = 5.</li><li>B — знаки центра.</li><li>D — центр в начале.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x − a)² → центр a.</div></div>"}, {"id": 21, "text": "<p>An item is sold for $150 after a 20% discount was applied to the original price. What was the original price?</p>", "image": "", "options": ["$120", "$170", "$180", "$187.50", "$200"], "correct": 3, "verified": true, "src": "M36", "orig": "images/q-37b444f334.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">$150 — это 80% исходной цены.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>150 ÷ 0,8 = 187,50.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (180) — добавили 20% к 150.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нельзя просто прибавить 20% к новой цене.</div></div>"}, {"id": 22, "text": "<p>The variable y is inversely proportional to the square root of x. If the value of x is decreased by 36%, what is the percentage change in the value of y?</p>", "image": "", "options": ["25% increase", "20% decrease", "20% increase", "25% decrease"], "correct": 0, "verified": true, "src": "M36", "review": true, "orig": "images/q-cb90c62759.jpg", "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y ∝ <span class=\"fr\"><span>1</span><span>√x</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x × 0,64 → √x × 0,8.</li><li>y × <span class=\"fr\"><span>1</span><span>0,8</span></span> = 1,25 → рост на 25%.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — уменьшение (а связь обратная).</li><li>C — <span class=\"fr\"><span>1</span><span>0,8</span></span> ≠ 1,2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уменьшение на 36% = × 0,64 = 0,8².</div></div>"}, {"id": 24, "text": "<p>24 Question</p><p>The sum to infinity of a geometric progression is 30. A second geometric progression is formed by squaring each term of the original progression. The sum to infinity of this new second progression is 450.</p><p>Find the common ratio (r) of the original progression.</p>", "image": "", "options": ["\\(\\frac{1}{4}\\)", "\\(\\frac{1}{3}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{2}{3}\\)", "\\(\\frac{3}{4}\\)"], "correct": 1, "verified": true, "src": "M36", "orig": "images/q-4ae913af07.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим вторую сумму на первую.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>a</span><span>1 − r</span></span> = 30; <span class=\"fr\"><span>a²</span><span>1 − r²</span></span> = 450.</li><li>Делим: <span class=\"fr\"><span>a</span><span>1 + r</span></span> = 15.</li><li><span class=\"fr\"><span>1 + r</span><span>1 − r</span></span> = <span class=\"fr\"><span>30</span><span>15</span></span> = 2 → r = <span class=\"fr\"><span>1</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не удовлетворяют обоим условиям.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 − r² = (1 − r)(1 + r).</div></div>"}, {"id": 26, "text": "<p>Find the solution pair (x, y) for the simultaneous equations:</p><p>\\(y = x^2 + 2x - 3\\)</p><p>\\(y = x - 1\\)</p>", "image": "", "options": ["(1, 0) and (-2, -3)", "(0, -3) and (1, 0)", "(1, -1) and (-2, 3)", "(2, 5) and (-1, -2)", "(-1, -2) and (-2, -3)"], "correct": 0, "verified": true, "src": "M36", "orig": "images/q-331ebcf428.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приравниваем y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + 2x − 3 = x − 1 → x² + x − 2 = 0.</li><li>x = 1 или −2 → (1; 0) и (−2; −3).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие пары не лежат на прямой y = x − 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте на прямой — быстро.</div></div>"}, {"id": 27, "text": "<p>27 Question</p><p>Consider the following three statements regarding a Rhombus:</p><p>I. A quadrilateral is a Rhombus if it has four equal sides.</p><p>II. A quadrilateral is a Rhombus only if its diagonals are perpendicular.</p><p>III. A quadrilateral is a R hombus if and only if all of its internal angles are 90°.</p><p>Which of the statements is/are true?</p>", "image": "", "options": ["I only", "I and II only", "II and III only", "I, II, and III"], "correct": 1, "verified": true, "src": "M36", "review": true, "orig": "images/q-284cc226da.jpg", "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I: четыре равные стороны — определение ромба ✓.</li><li>II: у любого ромба диагонали перпендикулярны → «ромб только если перпендикулярны» ✓.</li><li>III: углы 90° — это прямоугольник; ромб не обязан ✗.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — пропускает II.</li><li>C, D — включают ложное III.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «P only if Q» = «P ⇒ Q».</div></div>"}, {"id": 28, "text": "<p>Express \\(0.00045 \\times (3.0 * 10^7)\\) in standard form.</p>", "image": "", "options": ["\\(1.35 \\times 10^3\\)", "\\(1.35 \\times 10^4\\)", "\\(13.5 \\times 10^3\\)", "\\(1.35 \\times 10^2\\)", "\\(0.135 \\times 10^5\\)"], "correct": 1, "verified": true, "src": "M36", "orig": "images/q-5e3be0340a.jpg", "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем мантиссы и степени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4,5 · 10⁻⁴ · 3 · 10⁷ = 13,5 · 10³ = 1,35 · 10⁴.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, E — не стандартная форма.</li><li>A, D — неверная степень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стандартная форма: 1 ≤ a < 10.</div></div>"}, {"id": 30, "text": "<p>30 Question</p><p>If</p><p>\\(-5 &lt; m &lt; -2\\) and \\(3 &lt; n &lt; 8,\\)</p><p>What is the range of possible values for the product mn?</p>", "image": "", "options": ["\\(-15 &lt; mn &lt; -16\\)", "\\(-40 &lt; mn &lt; -6\\)", "\\(-40 &lt; mn &lt; -15\\)", "\\(-16 &lt; mn &lt; -6\\)"], "correct": 1, "verified": true, "src": "M36", "review": true, "orig": "images/q-f41d01e396.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m < 0, n > 0 → mn < 0. Ищем крайние значения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Самое отрицательное: −5 · 8 = −40.</li><li>Ближе к нулю: −2 · 3 = −6.</li><li>−40 < mn < −6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — пустой промежуток.</li><li>C, D — неверные концы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебирайте произведения концов промежутков.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">

    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
