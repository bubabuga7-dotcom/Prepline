<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q3 · Principle</p>", "image": "images/ct-pp/ct084_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тактическое голосование — голос не за того, кого хочешь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Выборы должны показать настоящие предпочтения, а такое голосование это искажает. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не тот принцип.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите общий принцип за примером.</div></div>"}, {"id": 2, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q4 · Assumption</p>", "image": "images/ct-pp/ct084_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Правило двух секунд»: проговорить фразу = выдержать дистанцию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: на произнесение фразы уходит не меньше 2 секунд. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Связь между фразой и временем.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct084_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Развёртка тетраэдра — 4 треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мысленно сгибаем: только в A грани сходятся без перекрытий. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>В других две грани ложатся друг на друга.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сгибайте по одному ребру.</div></div>"}, {"id": 4, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q6 · Flaw</p>", "image": "images/ct-pp/ct084_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Футболисты живут меньше → виноват футбол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Продолжительность жизни могут определять и другие факторы. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct084_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">w + s + t = 8; 11w + 8s + 6t = 61.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вычтем 6 · (w + s + t) = 48: 5w + 2s = 13.</li><li>w = 1, s = 4, t = 3 → 1 победа. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>w = 3 даёт отрицательное s.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уберите одну переменную.</div></div>"}, {"id": 6, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q8 · Main conclusion</p>", "image": "images/ct-pp/ct084_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод про оперу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — доводы или не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что доказывают остальные фразы.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct084_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Себестоимость: материалы 1,50 + полчаса работы 2,70 = 4,20 €.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>+70%: 4,20 · 1,7 = 7,14 €. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без наценки на работу; A, D — целый час.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Зарплата — за 30 минут.</div></div>"}, {"id": 8, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q10 · Weaken</p>", "image": "images/ct-pp/ct084_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вводить правила с любителей, чтобы дисциплина поднялась «снизу вверх».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если профессионалы почти не проходят через любительские лиги — эффект до них не дойдёт. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — скорее усиливает.</li><li>A, D, E — не про механизм «снизу вверх».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разорвите механизм.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q11 · Problem solving</p>", "image": "images/ct-pp/ct084_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">515 − 320 = 195 $ → 65 бонусных браслетов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пятница: 205 − 175 = 30 бонусных; осталось 35.</li><li>В другой день максимум 204 (29 бонусных) → 204 и 181 (6 бонусных), два дня по 150.</li><li>205 + 204 + 181 + 150 + 150 = 890. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — все дни по 175+.</li><li>B, E — не хватает бонусов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минимум — бонусы сконцентрировать, остальные дни по 150.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct084_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вторые места только B, D, E; пары (1-й, 2-й) не повторяются; братья Лим не вместе.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Второй B: победители A, C, D, E (4); второй D: A, B, C (3); второй E: A, B, C (3) — ровно 10 раундов.</li><li>Очки: Алан 9, Барри 2 · 3 + 4 = 10, Карл 9, Дэниел 3 + 3 = 6, Эрик 6.</li><li>Побеждает Барри. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Алан и Карл — по 9.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 10 возможных пар = 10 раундов.</div></div>"}, {"id": 11, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q13 · Weaken</p>", "image": "images/ct-pp/ct084_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шокирующие картинки помогают бросить курить.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но там же высокие налоги и запрет рекламы — эффект может быть от них. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — усиливает.</li><li>B, C, D — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Другая причина того же эффекта.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q14 · Problem solving</p>", "image": "images/ct-pp/ct084_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последние 36 км = <span class=\"fr\"><span>2</span><span>5</span></span> остатка после 8-го дня.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Остаток = 90 км = четверть пути.</li><li>Весь путь 360 км. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные данные лишние.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте с конца.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q15 · Problem solving</p>", "image": "images/ct-pp/ct084_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем общий объём краски на 20 комнат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Once Gloss: 16 л = 6 банок по 2,5 л (15 л, 108 €) + 1,25 л (12 €) = 120 €.</li><li>Quick Dry: 20 л = 8 · 20 = 160 €; другие ещё дороже.</li><li>Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (108 €) — краски не хватит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте докупить остаток.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct084_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первые две по 100%, следующие по 25%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Средние: 100, 100, 75, 62,5, 55, 50%.</li><li>Такой спад — на графике C. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не те значения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя = общая сумма / число банок.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q17 · Problem solving</p>", "image": "images/ct-pp/ct084_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ряды идут «змейкой»; 16-17-18 растут слева направо, 12 под 17.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>При стороне 7: 2-й ряд 14, 13, 12 (12 в 3-й колонке, под 17).</li><li>4-й ряд: 28, 27, 26 — 27 над 16, 26 над 17. Всё сходится.</li><li>7 · 7 = 49. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>При других размерах числа не стоят друг над другом.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте соседей по вертикали.</div></div>"}, {"id": 16, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q18 · Assumption</p>", "image": "images/ct-pp/ct084_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем, что НЕ является допущением.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Аргумент говорит, что никотин ТОЖЕ виноват; ему не нужно, чтобы угарный газ без никотина не действовал. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — нужны, иначе вывод о никотине не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Тоже» ≠ «только».</div></div>"}, {"id": 17, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q19 · Flaw</p>", "image": "images/ct-pp/ct084_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чтобы работать эффективно, надо выключить средства связи.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но без мгновенного обмена информацией эффективность тоже может упасть. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не ошибка рассуждения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не учтена обратная сторона.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct084_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Со стула (по диагонали сверху справа) ближе всего круглая клумба.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Она должна быть впереди большой квадратной клумбы, а в A она стоит позади неё. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B–E — возможны с этой точки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ближний предмет перекрывает дальний.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q21 · Problem solving</p>", "image": "images/ct-pp/ct084_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Логотип = две части: пятиугольник со скосом и уголок со скосом.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В D фигуру нельзя разрезать на эти две части. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — части складываются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите разрез по совпадающим краям.</div></div>"}, {"id": 20, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q22 · Drawing a conclusion</p>", "image": "images/ct-pp/ct084_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мало активности в зоне, отвечающей за последствия и эмпатию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осторожный вывод: возможна связь игр и насилия. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D, E — слишком сильно.</li><li>A — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «May be» — осторожно.</div></div>"}, {"id": 21, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2014 · original Q23 · Main conclusion</p>", "image": "images/ct-pp/ct084_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод — после «so».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>СМИ можно сообщать о преступлениях, даже если это вызывает новые. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — доводы.</li><li>B, D — против вывода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «So» вводит вывод.</div></div>"}, {"id": 22, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q1 · Strengthen</p>", "image": "images/ct-pp/ct084_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углерод «сгорел» с горячим кислородом, которого меньше вдали от Солнца.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если углерода в поясе астероидов больше дальше от Солнца — это совпадает с объяснением. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — другое объяснение.</li><li>C, D, E — не усиливают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предсказание теории подтвердилось.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q2 · Problem solving</p>", "image": "images/ct-pp/ct084_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно ≥ 6 × 8 см и фото.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Самая дешёвая: 7 × 10 без поздравления — 1,50 €, делюкс 1,95 €.</li><li>0,45 · 50 = 22,50 €. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>6 × 6 и 7 × 7 — ниже 8 см.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала отбор, потом цена.</div></div>"}, {"id": 24, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q3 · Main conclusion</p>", "image": "images/ct-pp/ct084_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возражение «совпадение» ошибочно из-за эффекта наблюдателя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: не было бы удивительным совпадением, если бы жизнь была только на Земле. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — доводы.</li><li>E — то, что опровергают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что отстаивает автор.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q4 · Problem solving</p>", "image": "images/ct-pp/ct084_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стены: 2 · (4 + 6) · 3,5 = 70 − окно 3 = 67 м²; потолок 24 м².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Второй слой: 20% от 67 = 13,4 м².</li><li>67 + 24 + 13,4 = 104,4 : 24 ≈ 4,35 → 5 банок. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без второго слоя или потолка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Банки — округляйте вверх.</div></div>"}, {"id": 26, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q5 · Weaken</p>", "image": "images/ct-pp/ct084_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Садоводство → интерес к еде → меньше фастфуда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если дети не заинтересовались садоводством — цепочка не запускается. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — про события, не про результат.</li><li>A, C, D — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сломайте первое звено.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct084_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первая половина медленно, вторая втрое быстрее.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Расстояние растёт всё время: пологая линия, затем крутая, время подъёма втрое больше. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сначала быстро.</li><li>B — половины пути не равны.</li><li>C, D — расстояние убывает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наклон = скорость.</div></div>"}, {"id": 28, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q7 · Assumption</p>", "image": "images/ct-pp/ct084_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Фторирование не нужно — из-за симптомов у одной семьи.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: симптомы вызвал фтор в воде. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Причинная связь.</div></div>"}, {"id": 29, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q8 · Parallel reasoning</p>", "image": "images/ct-pp/ct084_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Есть веская причина подозревать вред — действовать сразу, не дожидаясь доказательств; прошлые ошибки, угроза растёт.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: подозреваемого — арестовать сразу; ожидание раньше вело к бедам, угроза выросла. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — проверка до действия.</li><li>C — вред уже доказан.</li><li>D — противоположный вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Действовать по подозрению.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2015 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct084_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три нечётных двузначных числа + их сумма, все 8 цифр разные, без нулей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Перебор даёт, например, 43 15 29 87 или 49 23 15 87 — сумма всегда 87.</li><li>Последняя цифра 7. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие окончания не дают 8 разных цифр.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма — двузначная (8 цифр всего).</div></div>"}];

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
