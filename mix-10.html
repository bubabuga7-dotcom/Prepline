<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"<p>Simplify the following expression:</p><p>\\(\\left(\\dfrac{5a^{1/4}b^{5}}{\\sqrt{c}}\\right)^{2}\\)</p>","image":"","options":["\\(\\dfrac{25a^{0.5}b^{10}}{c}\\)","\\(\\dfrac{25a^{0.5}b^{7}}{c^{2}}\\)","\\(\\dfrac{25a^{0.5}b^{7}}{c^{2}}\\)","\\(\\dfrac{25a^{0.5}b^{9}}{c^{3}}\\)"],"correct":0,"src":"M31","review":true,"orig":"images/q-f3ba2896f2.jpg"},{"id":2,"text":"<p>Let the operation \\(\\odot\\) be defined for all positive real numbers as: \\[a \\odot b = \\frac{ab}{a+2b}\\] If n is a positive integer such that (n\\(\\odot\\)n)\\(\\odot\\)15&gt;1.5, what is the smallest possible value for n?</p>","image":"","options":["5","6","7","11","15"],"correct":3,"src":"M31","orig":"images/q-0aac401be1.jpg"},{"id":3,"text":"<p>Which of the following expressions has the smallest value for 0&lt;x&lt;1?</p>","image":"","options":["\\(x^2\\)","\\(\\sqrt{x}\\)","1/x","\\(x^1\\)","\\(x^{-2}\\)"],"correct":0,"src":"M31","orig":"images/q-77ddb64e97.jpg"},{"id":4,"text":"<p>The real numbers x and y satisfy the simultaneous equations \\(x - y - 4 = 0\\) \\(x^2 + 5x - 9 = y\\) Find the value of \\(x + y\\) using the pair with the smallest value of x</p>","image":"","options":["-9","-13","-14","-15"],"correct":2,"src":"M31","review":true,"orig":"images/q-5652843095.jpg"},{"id":5,"text":"<p>Evaluate:</p><p>\\((-4)^{-2} + 36^{0.5} \\cdot 27^{2/3} - 12^{0}\\)</p>","image":"","options":["53.034","53.0625","53.0630","53.0650","53.0678"],"correct":1,"src":"M31","orig":"images/q-ca0c5ed71d.jpg"},{"id":6,"text":"<p>In a local high school, 40% of the students participate in sports. Of the students who participate in sports, 15% are on the varsity swimming team. What percent of the total student body are members of the varsity swimming team?</p>","image":"","options":["2%","6%","10%","20%","22%"],"correct":1,"src":"M31","orig":"images/q-a83552beb2.jpg"},{"id":7,"text":"<p>In a physics experiment, the Kinetic Energy (K) of an object is calculated using the formula: \\(K = 0.5mv^2\\)</p><p>If the mass (m) is increased by 20% and the velocity (v) is decreased by 30%, what is the resulting percentage change in the Kinetic Energy (K)?</p>","image":"","options":["It decreases by 10%","It decreases by 41.2%","It decreases by 16%","It increases by 14%","It decreases by 58.8%"],"correct":1,"src":"M31","orig":"images/q-a32b57394c.jpg"},{"id":8,"text":"<p>Given the vectors</p><p>\\(\\mathbf{a}=(5 \\;\\; {-2}), \\quad \\mathbf{b}=(1 \\;\\; 3)\\)</p><p>What is the vector a−b?</p>","image":"","options":["\\((6 \\;\\; 1)\\)","\\((4 \\;\\; {-5})\\)","\\((5 \\;\\; {-1})\\)","\\((3 \\;\\; {-5})\\)","\\((4 \\;\\; 5)\\)"],"correct":1,"src":"M31","orig":"images/q-2cf7221047.jpg"},{"id":9,"text":"<p>A parabola is graphed on the xy-coordinate plane. The vertex of the parabola is at (3,−4), and it passes through the point (5,0).</p><p>Which of the following equations represents this parabola?</p>","image":"","options":["\\(y = (x - 3)^2 - 4\\)","\\(y = 2(x + 3)^2 - 4\\)","\\(y = (x - 3)^2 + 4\\)","\\(y = (x + 3)^2 - 4\\)","\\(y = 2(x - 3)^2 + 4\\)"],"correct":0,"src":"M31","orig":"images/q-a5084d9893.jpg"},{"id":10,"text":"<p>An athlete trains by running from their house to a park and then biking from the park to a stadium.</p><ol><li>The athlete runs 6 kilometers at a constant speed of 12 km/h.</li><li>Upon reaching the park, they immediately switch to a bike and travel another 12 kilometers at a constant speed of 24 km/h.</li></ol><p>What is the athlete's average speed for the entire trip from their house to the stadium?</p>","image":"","options":["18 km/h","16 km/h","15 km/h","14 km/h","13 km/h"],"correct":0,"src":"M31","orig":"images/q-01b0cdddf5.jpg"},{"id":11,"text":"<p>Simplify the following expression into its simplest form:</p><p>\\(\\dfrac{x^{-2}-9y^{-2}}{x^{-1}+3y^{-1}} * \\dfrac{xy}{y-3x}\\)</p>","image":"","options":["1","-1","\\(\\dfrac{y+3x}{y-3x}\\)","\\(xy\\)","\\(1/xy\\)"],"correct":0,"src":"M31","orig":"images/q-cb8c140b67.jpg"},{"id":12,"text":"<p>For any real numbers x and y where \\(|x| \\geq |y|\\), consider the following statements:</p><p><strong>1</strong> \\(x^2 \\geq y^2\\)</p><p><strong>2</strong> \\(x \\geq y\\)</p><p><strong>3</strong> \\(|x + y| \\geq |x - y|\\)</p><p>Which of these statements must be true?</p>","image":"","options":["All three statements","Only statements 1 and 2","Only statements 2 and 3","Only statements 1 and 3","Only statement 1","Only statement 2","Only statement 3","None of the statements"],"correct":4,"src":"M31","review":true,"orig":"images/q-fba6659986.jpg"},{"id":13,"text":"<p>A circle is inscribed perfectly inside a square, meaning the circle touches all four sides of the square. If the area of the square is 144 square centimeters, what is the area of the region inside the square but outside the circle?</p>","image":"","options":["\\(144 - 2\\pi\\)","\\(144 - 36\\pi\\)","\\(144 - 144\\pi\\)","\\(144 - 72\\pi\\)","\\(144 - 12\\pi\\)"],"correct":1,"src":"M31","orig":"images/q-d4ac67f6d3.jpg"},{"id":14,"text":"<p>Given the following equation, which describes a relationship between P, Q, and R:</p><p>\\(P = \\frac{2Q+R}{Q-3R}\\)</p><p>Express Q in terms of P and R.</p>","image":"","options":["\\(Q = \\frac{R(3P+1)}{P-2}\\)","\\(Q = \\frac{R3P+R}{P+2}\\)","\\(Q = \\frac{P-2}{R3P+R}\\)","\\(Q = \\frac{R(3P-1)}{P+2}\\)"],"correct":0,"src":"M31","review":true,"orig":"images/q-9fd193d360.jpg"},{"id":15,"text":"<p>In the given figure, ABCD, BEFG, and DHIJ are squares with AB = 2(DH) and DH = 2(BE). If a point is chosen at random inside square ABCD, what is the probability it will be in the shaded region?</p>","image":"images/q-4e99d234e4.jpg","options":["\\(\\frac{1}{3}\\)","\\(\\frac{1}{2}\\)","\\(\\frac{5}{8}\\)","\\(\\frac{11}{16}\\)","\\(\\frac{3}{4}\\)"],"correct":3,"src":"M31","orig":"images/q-4e99d234e4.jpg","review":true},{"id":16,"text":"<p>Simplify the following expression:</p><p>\\(\\frac{1}{3^8} + \\frac{3}{3^9} + \\frac{9}{3^{10}} + \\frac{27}{3^{11}}\\)</p>","image":"","options":["\\(\\frac{1}{3^7}\\)","\\(\\frac{1}{3^8}\\)","\\(\\frac{4}{3^8}\\)","\\(\\frac{12}{3^{11}}\\)","\\(\\frac{10}{3^9}\\)"],"correct":2,"src":"M31","orig":"images/q-c9f0b37133.jpg"},{"id":17,"text":"<p>An equilateral triangle ABC is placed in the coordinate plane. Vertex A is at the origin (0,0), and vertex B is at (6,0). Vertex C lies in the first quadrant.</p><p>What are the coordinates of vertex C, and what is the area of the triangle?</p>","image":"","options":["\\(C(3,3)\\); Area = 9","\\(C(3,3\\sqrt{3})\\); Area = \\(9\\sqrt{3}\\)","\\(C(3,3\\sqrt{3})\\); Area = \\(18\\sqrt{3}\\)","\\(C(6,6)\\); Area = 18","\\(C(3,\\sqrt{3})\\); Area = \\(3\\sqrt{3}\\)"],"correct":1,"src":"M31","orig":"images/q-651f8c4f47.jpg"},{"id":18,"text":"<p>Triangle ABC has a right angle at A.</p><p>Semicircles are drawn with BA, AC, and BC as diameters, as shown. Given that</p><p>AC = 8 and BC = 10, write down the value of one-third of the total shaded area.</p>","image":"images/q-3234ea3cc6.jpg","options":["24","12","8","18","22"],"correct":2,"src":"M31","orig":"images/q-3234ea3cc6.jpg","review":true},{"id":19,"text":"<p>If the relation x+y=z is true, then which of the following is also true?</p>","image":"","options":["\\(x^2 + y^2 = z^2\\)","\\(x^3 + y^3 - 3xyz = z^3\\)","\\(x^2 + y^2 + z^2 = 2xyz\\)","\\(x^3 + y^3 - z^3 =- 3xyz\\)","\\(x^3 + y^3 + z^3 = 3xyz\\)"],"correct":3,"src":"M31","orig":"images/q-3206647a4d.jpg"},{"id":20,"text":"<p>The circle in the diagram has a radius of 6 cm. If the perimeter of the rectangle is 28 cm, what is its area?</p>","image":"images/q-77c35f2a2f.jpg","options":["26","32","28","40","36"],"correct":0,"src":"M31","orig":"images/q-77c35f2a2f.jpg","review":true},{"id":21,"text":"<p>A sector of a circle has a central angle of 45. The arc length of the sector is \\(5\\pi\\) cm.</p><p>What is the radius of the circle?</p>","image":"","options":["8","10","12","15","20"],"correct":4,"src":"M31","orig":"images/q-d505c73c6e.jpg"},{"id":22,"text":"<p>Let ABCD be a rectangle and let P be a point inside the rectangle. If PA = 8, PB = 4, and PD = 7, then PC = ?</p>","image":"images/q-06f1bd9ce2.jpg","options":["1","2","3","\\(\\sqrt{2}\\)","\\(\\sqrt{3}\\)"],"correct":0,"src":"M31","orig":"images/q-06f1bd9ce2.jpg","review":true},{"id":23,"text":"<p>Using the formula \\(V = \\pi r^2 h\\), calculate the value of \\(r^2\\) when: \\(V = 5.024 * 10^{13}\\) and \\(h = 8 * 10^5\\) take \\(\\pi = 3.14\\)</p>","image":"","options":["\\(2 * 10^8\\)","\\(0.2 * 10^8\\)","\\(20 * 10^8\\)","\\(2 * 10^{12}\\)"],"correct":1,"src":"M31","review":true,"orig":"images/q-bba243b6f3.jpg"},{"id":24,"text":"<p>Given the quadratic equation:</p><p>\\(x^2 - (6 * 10^4)x + (8 * 10^8) = 0\\)</p><p>Find the two possible values for x.</p>","image":"","options":["\\(x_1 = 2 * 10^4, x_2 = 4 * 10^4\\)","\\(x_1 = 3 * 10^4, x_2 = 4 * 10^4\\)","\\(x_1 = 4 * 10^4, x_2 = 3 * 10^4\\)","\\(x_1 = 8 * 10^4, x_2 = 4 * 10^4\\)","\\(x_1 = 2 * 10^4, x_2 = 3 * 10^4\\)"],"correct":0,"src":"M31","orig":"images/q-c5884107c7.jpg"},{"id":25,"text":"<p>ABCD is a square with side 1 cm, and E, F, G, and H are centers of given semicircles.</p><p>Find the shaded area.</p>","image":"images/q-fa40ba7b0b.jpg","options":["\\(\\frac{\\pi}{2} - 1\\)","\\(\\pi - 1\\)","\\(\\frac{\\pi}{3} - 1\\)","\\(\\frac{\\pi}{4} - 1/4\\)","\\(2\\pi - 6\\)"],"correct":0,"src":"M31","orig":"images/q-fa40ba7b0b.jpg","review":true},{"id":26,"text":"<p>The minute hand of a clock completes one full rotation in 60 minutes.</p><p>What is the speed of the minute hand in degrees per minute?</p>","image":"","options":["2 degrees per minute","4 degrees per minute","6 degrees per minute","8 degrees per minute"],"correct":2,"src":"M31","review":true,"orig":"images/q-2524415bb4.jpg"},{"id":27,"text":"<p>A coordinate plane shows the locations of three markers used in a physics experiment:</p><ul><li>Point A: \\((2 * 10^3, 5 * 10^3)\\)</li><li>Point B:\\(( 5 * 10^3, 9 * 10^3)\\)</li><li>Point C:\\(( - 1 * 10^3, 1 * 10^3)\\)</li></ul><p>Calculate the distance between Point A and Point B.</p>","image":"","options":["\\(2 * 10^2\\)","\\(3 * 10^2\\)","\\(5 * 10^3\\)","\\(6 * 10^4\\)","\\(7 * 10^2\\)"],"correct":2,"src":"M31","orig":"images/q-76114ed123.jpg"},{"id":28,"text":"<p>In a lab, a sensor only works correctly when the intensity of a signal is above a certain threshold. The relationship is given by the following inequality:</p><p>\\((2 * 10^2)x - 1.5 * 10^5 &gt; 2.5 * 10^5\\)</p><p>Find the range of values for x.</p>","image":"","options":["\\(x &gt; 10^3\\)","\\(x &lt; 10^3\\)","\\(x &gt; 2 * 10^3\\)","\\(x &lt; 2 * 10^3\\)"],"correct":2,"src":"M31","review":true,"orig":"images/q-e98ece78c9.jpg"},{"id":29,"text":"<p>If the sum of two consecutive odd integers is 24, what is the value of the smaller integer?</p>","image":"","options":["13","9","12","11","21"],"correct":3,"src":"M31","orig":"images/q-c387014a1f.jpg"},{"id":30,"text":"<p>The mean weight of fifteen students in a class is exactly 50 kg. The mean weight increases by exactly 2 kg when five new students join the class. What is the mean weight of the five new students?</p>","image":"","options":["52 kg","54 kg","56 kg","58 kg","60 kg"],"correct":3,"src":"M31","orig":"images/q-3d8f501a8c.jpg"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

    <div class="row">

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
