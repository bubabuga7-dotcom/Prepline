<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Simplify the following expression:</p><p>\\(\\left(\\dfrac{5a^{1/4}b^{5}}{\\sqrt{c}}\\right)^{2}\\)</p>", "image": "", "options": ["\\(\\dfrac{25a^{0.5}b^{10}}{c}\\)", "\\(\\dfrac{25a^{0.5}b^{7}}{c^{2}}\\)", "\\(\\dfrac{25a^{0.5}b^{10}}{c^{2}}\\)", "\\(\\dfrac{25a^{0.5}b^{9}}{c^{3}}\\)"], "correct": 0, "src": "M31", "review": true, "orig": "images/q-f3ba2896f2.jpg", "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат каждый множитель отдельно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5² = 25.</li><li>(a<sup>1⁄4</sup>)² = a<sup>1⁄2</sup> = a<sup>0,5</sup>.</li><li>(b⁵)² = b¹⁰.</li><li>(√c)² = c.</li><li>Итог: 25a<sup>0,5</sup> b¹⁰ / c.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — b⁷ и c² (сложили показатели вместо умножения).</li><li>C — c² вместо c.</li><li>D — неверные показатели.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (aᵐ)ⁿ = a<sup>mn</sup>: показатели <b>умножаются</b>.</div></div>"}, {"id": 2, "text": "<p>Let the operation \\(\\odot\\) be defined for all positive real numbers as: \\[a \\odot b = \\frac{ab}{a+2b}\\] If n is a positive integer such that (n\\(\\odot\\)n)\\(\\odot\\)15&gt;1.5, what is the smallest possible value for n?</p>", "image": "", "options": ["5", "6", "7", "11", "15"], "correct": 3, "src": "M31", "orig": "images/q-0aac401be1.jpg", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем по шагам: n⊙n, потом результат ⊙15, и решаем неравенство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n⊙n = <span class=\"fr\"><span>n²</span><span>n + 2n</span></span> = <span class=\"fr\"><span>n</span><span>3</span></span>.</li><li><span class=\"fr\"><span>n</span><span>3</span></span>⊙15 = <span class=\"fr\"><span><span class=\"fr\"><span>n</span><span>3</span></span> · 15</span><span><span class=\"fr\"><span>n</span><span>3</span></span> + 30</span></span> = <span class=\"fr\"><span>5n</span><span><span class=\"fr\"><span>n</span><span>3</span></span> + 30</span></span> = <span class=\"fr\"><span>15n</span><span>n + 90</span></span>.</li><li><span class=\"fr\"><span>15n</span><span>n + 90</span></span> > 1,5 → 15n > 1,5n + 135 → 13,5n > 135 → n > 10.</li><li>Наименьшее целое: 11.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — меньше 10, неравенство не выполняется.</li><li>E (15) — подходит, но не наименьшее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Умножайте числитель и знаменатель на 3, чтобы убрать дробь <span class=\"fr\"><span>n</span><span>3</span></span>.</div></div>"}, {"id": 3, "text": "<p>Which of the following expressions has the smallest value for 0&lt;x&lt;1?</p>", "image": "", "options": ["\\(x^2\\)", "\\(\\sqrt{x}\\)", "1/x", "\\(x^1\\)", "\\(x^{-2}\\)"], "correct": 0, "src": "M31", "orig": "images/q-77ddb64e97.jpg", "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для чисел между 0 и 1 возведение в степень больше 1 уменьшает число.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Возьмём x = 0,5: x² = 0,25; √x ≈ 0,71; <span class=\"fr\"><span>1</span><span>x</span></span> = 2; x = 0,5; x⁻² = 4.</li><li>Наименьшее — x².</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — корень делает число больше.</li><li>C, E — больше 1.</li><li>D — само x больше x².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте конкретное число из промежутка — самый быстрый способ.</div></div>"}, {"id": 4, "text": "<p>The real numbers x and y satisfy the simultaneous equations \\(x - y - 4 = 0\\) \\(x^2 + 5x - 9 = y\\) Find the value of \\(x + y\\) using the pair with the smallest value of x</p>", "image": "", "options": ["-9", "-13", "-14", "-15"], "correct": 2, "src": "M31", "review": true, "orig": "images/q-5652843095.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем y = x − 4 во второе уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² + 5x − 9 = x − 4 → x² + 4x − 5 = 0.</li><li>(x + 5)(x − 1) = 0 → x = −5 или 1.</li><li>Наименьший x = −5 → y = −9.</li><li>x + y = −14.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−9) — только y.</li><li>B, D — арифметические ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внимательно читайте, какую пару брать (наименьший x).</div></div>"}, {"id": 5, "text": "<p>Evaluate:</p><p>\\((-4)^{-2} + 36^{0.5} \\cdot 27^{2/3} - 12^{0}\\)</p>", "image": "", "options": ["53.034", "53.0625", "53.0630", "53.0650", "53.0678"], "correct": 1, "src": "M31", "orig": "images/q-ca0c5ed71d.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем каждое слагаемое отдельно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−4)⁻² = <span class=\"fr\"><span>1</span><span>16</span></span> = 0,0625.</li><li>36<sup>0,5</sup> = 6; 27<sup>2⁄3</sup> = (∛27)² = 9 → 6 · 9 = 54.</li><li>12⁰ = 1.</li><li>0,0625 + 54 − 1 = 53,0625.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — ошибка в <span class=\"fr\"><span>1</span><span>16</span></span> = 0,0625.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отрицательная степень чётная → результат положительный.</div></div>"}, {"id": 6, "text": "<p>In a local high school, 40% of the students participate in sports. Of the students who participate in sports, 15% are on the varsity swimming team. What percent of the total student body are members of the varsity swimming team?</p>", "image": "", "options": ["2%", "6%", "10%", "20%", "22%"], "correct": 1, "src": "M31", "orig": "images/q-a83552beb2.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Процент от процента — перемножаем доли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,15 · 0,4 = 0,06 = 6%.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (22%) — сложили 15 + … неверно.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Of those» — доля от доли.</div></div>"}, {"id": 7, "text": "<p>In a physics experiment, the Kinetic Energy (K) of an object is calculated using the formula: \\(K = 0.5mv^2\\)</p><p>If the mass (m) is increased by 20% and the velocity (v) is decreased by 30%, what is the resulting percentage change in the Kinetic Energy (K)?</p>", "image": "", "options": ["It decreases by 10%", "It decreases by 41.2%", "It decreases by 16%", "It increases by 14%", "It decreases by 58.8%"], "correct": 1, "src": "M31", "orig": "images/q-a32b57394c.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">K ∝ m · v². Перемножаем коэффициенты изменений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m × 1,2; v × 0,7 → v² × 0,49.</li><li>1,2 · 0,49 = 0,588.</li><li>Уменьшение на 1 − 0,588 = 41,2%.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (10%) — сложили +20% и −30%.</li><li>E (58,8%) — это новое значение, а не изменение.</li><li>C, D — забыли квадрат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадрат в формуле → коэффициент скорости тоже в квадрат.</div></div>"}, {"id": 8, "text": "<p>Given the vectors</p><p>\\(\\mathbf{a}=(5 \\;\\; {-2}), \\quad \\mathbf{b}=(1 \\;\\; 3)\\)</p><p>What is the vector a−b?</p>", "image": "", "options": ["\\((6 \\;\\; 1)\\)", "\\((4 \\;\\; {-5})\\)", "\\((5 \\;\\; {-1})\\)", "\\((3 \\;\\; {-5})\\)", "\\((4 \\;\\; 5)\\)"], "correct": 1, "src": "M31", "orig": "images/q-2cf7221047.jpg", "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Векторы вычитаются покомпонентно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(5 − 1; −2 − 3) = (4; −5).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили.</li><li>D, C, E — ошибки в знаках.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> −2 − 3 = −5.</div></div>"}, {"id": 9, "text": "<p>A parabola is graphed on the xy-coordinate plane. The vertex of the parabola is at (3,−4), and it passes through the point (5,0).</p><p>Which of the following equations represents this parabola?</p>", "image": "", "options": ["\\(y = (x - 3)^2 - 4\\)", "\\(y = 2(x + 3)^2 - 4\\)", "\\(y = (x - 3)^2 + 4\\)", "\\(y = (x + 3)^2 - 4\\)", "\\(y = 2(x - 3)^2 + 4\\)"], "correct": 0, "src": "M31", "orig": "images/q-a5084d9893.jpg", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершинная форма y = a(x − h)² + k, затем находим a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вершина (3; −4) → y = a(x − 3)² − 4.</li><li>Через (5; 0): 4a − 4 = 0 → a = 1.</li><li>y = (x − 3)² − 4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — (x + 3): вершина при x = −3.</li><li>C, E — +4: вершина при y = 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y = a(x − h)² + k: знак внутри скобки противоположен координате вершины.</div></div>"}, {"id": 10, "text": "<p>An athlete trains by running from their house to a park and then biking from the park to a stadium.</p><ol><li>The athlete runs 6 kilometers at a constant speed of 12 km/h.</li><li>Upon reaching the park, they immediately switch to a bike and travel another 12 kilometers at a constant speed of 24 km/h.</li></ol><p>What is the athlete's average speed for the entire trip from their house to the stadium?</p>", "image": "", "options": ["18 km/h", "16 km/h", "15 km/h", "14 km/h", "13 km/h"], "correct": 0, "src": "M31", "orig": "images/q-01b0cdddf5.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя скорость = весь путь ÷ всё время (не среднее скоростей!).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Бег: <span class=\"fr\"><span>6</span><span>12</span></span> = 0,5 ч.</li><li>Велосипед: <span class=\"fr\"><span>12</span><span>24</span></span> = 0,5 ч.</li><li>18 км ÷ 1 ч = 18 км/ч.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — пытались усреднить по-другому.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Здесь время на обоих участках одинаковое, поэтому совпало с <span class=\"fr\"><span>12 + 24</span><span>2</span></span>. Так бывает не всегда!</div></div>"}, {"id": 11, "text": "<p>Simplify the following expression into its simplest form:</p><p>\\(\\dfrac{x^{-2}-9y^{-2}}{x^{-1}+3y^{-1}} * \\dfrac{xy}{y-3x}\\)</p>", "image": "", "options": ["1", "-1", "\\(\\dfrac{y+3x}{y-3x}\\)", "\\(xy\\)", "\\(1/xy\\)"], "correct": 0, "src": "M31", "orig": "images/q-cb8c140b67.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель — разность квадратов от x⁻¹ и 3y⁻¹.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x⁻² − 9y⁻² = (x⁻¹ − 3y⁻¹)(x⁻¹ + 3y⁻¹).</li><li>Первая дробь = x⁻¹ − 3y⁻¹ = <span class=\"fr\"><span>1</span><span>x</span></span> − <span class=\"fr\"><span>3</span><span>y</span></span> = <span class=\"fr\"><span>y − 3x</span><span>xy</span></span>.</li><li>Умножаем на <span class=\"fr\"><span>xy</span><span>y − 3x</span></span> → 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак (y − 3x vs 3x − y).</li><li>C, D, E — неполное сокращение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a² − b² = (a − b)(a + b) работает и для отрицательных степеней.</div></div>"}, {"id": 13, "text": "<p>A circle is inscribed perfectly inside a square, meaning the circle touches all four sides of the square. If the area of the square is 144 square centimeters, what is the area of the region inside the square but outside the circle?</p>", "image": "", "options": ["\\(144 - 2\\pi\\)", "\\(144 - 36\\pi\\)", "\\(144 - 144\\pi\\)", "\\(144 - 72\\pi\\)", "\\(144 - 12\\pi\\)"], "correct": 1, "src": "M31", "orig": "images/q-d4ac67f6d3.jpg", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанный круг: диаметр = сторона квадрата.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона = √144 = 12 → радиус 6.</li><li>Площадь круга 36π.</li><li>Оставшаяся площадь = 144 − 36π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — радиус 12.</li><li>E — 12π (длина окружности, а не площадь).</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный круг касается сторон → d = a.</div></div>"}, {"id": 14, "text": "<p>Given the following equation, which describes a relationship between P, Q, and R:</p><p>\\(P = \\frac{2Q+R}{Q-3R}\\)</p><p>Express Q in terms of P and R.</p>", "image": "", "options": ["\\(Q = \\frac{R(3P+1)}{P-2}\\)", "\\(Q = \\frac{R3P+R}{P+2}\\)", "\\(Q = \\frac{P-2}{R3P+R}\\)", "\\(Q = \\frac{R(3P-1)}{P+2}\\)"], "correct": 0, "src": "M31", "review": true, "orig": "images/q-9fd193d360.jpg", "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Освобождаемся от дроби и собираем Q с одной стороны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>P(Q − 3R) = 2Q + R.</li><li>PQ − 3PR = 2Q + R → PQ − 2Q = 3PR + R.</li><li>Q(P − 2) = R(3P + 1) → Q = R<span class=\"fr\"><span>3P + 1</span><span>P − 2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — знак в знаменателе.</li><li>C — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Все слагаемые с Q — в одну сторону, затем выносим Q.</div></div>"}, {"id": 16, "text": "<p>Simplify the following expression:</p><p>\\(\\frac{1}{3^8} + \\frac{3}{3^9} + \\frac{9}{3^{10}} + \\frac{27}{3^{11}}\\)</p>", "image": "", "options": ["\\(\\frac{1}{3^7}\\)", "\\(\\frac{1}{3^8}\\)", "\\(\\frac{4}{3^8}\\)", "\\(\\frac{12}{3^{11}}\\)", "\\(\\frac{10}{3^9}\\)"], "correct": 2, "src": "M31", "orig": "images/q-c9f0b37133.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждое слагаемое приводится к <span class=\"fr\"><span>1</span><span>3⁸</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>3</span><span>3⁹</span></span> = <span class=\"fr\"><span>1</span><span>3⁸</span></span>; <span class=\"fr\"><span>9</span><span>3¹⁰</span></span> = <span class=\"fr\"><span>1</span><span>3⁸</span></span>; <span class=\"fr\"><span>27</span><span>3¹¹</span></span> = <span class=\"fr\"><span>1</span><span>3⁸</span></span>.</li><li>Четыре одинаковых: <span class=\"fr\"><span>4</span><span>3⁸</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — <span class=\"fr\"><span>3</span><span>3⁸</span></span> ≠ <span class=\"fr\"><span>4</span><span>3⁸</span></span>.</li><li>D, E — неверное приведение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3ᵏ/3<sup>8+k</sup> = <span class=\"fr\"><span>1</span><span>3⁸</span></span>.</div></div>"}, {"id": 17, "text": "<p>An equilateral triangle ABC is placed in the coordinate plane. Vertex A is at the origin (0,0), and vertex B is at (6,0). Vertex C lies in the first quadrant.</p><p>What are the coordinates of vertex C, and what is the area of the triangle?</p>", "image": "", "options": ["\\(C(3,3)\\); Area = 9", "\\(C(3,3\\sqrt{3})\\); Area = \\(9\\sqrt{3}\\)", "\\(C(3,3\\sqrt{3})\\); Area = \\(18\\sqrt{3}\\)", "\\(C(6,6)\\); Area = 18", "\\(C(3,\\sqrt{3})\\); Area = \\(3\\sqrt{3}\\)"], "correct": 1, "src": "M31", "orig": "images/q-651f8c4f47.jpg", "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершина C — над серединой AB на высоте равностороннего треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Середина AB: x = 3.</li><li>Высота = <span class=\"fr\"><span>√3</span><span>2</span></span> · 6 = 3√3 → C(3; 3√3).</li><li>S = ½ · 6 · 3√3 = 9√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — забыли ½ в площади.</li><li>A, D, E — неверная высота.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота равностороннего <span class=\"fr\"><span>√3</span><span>2</span></span>a.</div></div>"}, {"id": 18, "text": "<p>Triangle ABC has a right angle at A.</p><p>Semicircles are drawn with BA, AC, and BC as diameters, as shown. Given that</p><p>AC = 8 and BC = 10, write down the value of one-third of the total shaded area.</p>", "image": "images/q-3234ea3cc6.jpg", "options": ["24", "12", "8", "18", "22"], "correct": 2, "src": "M31", "orig": "images/q-3234ea3cc6.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Луночки Гиппократа: сумма заштрихованных луночек равна площади треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = √(100 − 64) = 6.</li><li>Полукруги на катетах вместе = полукруг на гипотенузе (теорема Пифагора для площадей).</li><li>Заштриховано = площадь треугольника = ½ · 6 · 8 = 24.</li><li>Треть: 8.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (24) — вся площадь, а нужна треть.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Читайте вопрос до конца: «one-third of».</div></div>"}, {"id": 19, "text": "<p>If the relation x+y=z is true, then which of the following is also true?</p>", "image": "", "options": ["\\(x^2 + y^2 = z^2\\)", "\\(x^3 + y^3 - 3xyz = z^3\\)", "\\(x^2 + y^2 + z^2 = 2xyz\\)", "\\(x^3 + y^3 - z^3 =- 3xyz\\)", "\\(x^3 + y^3 + z^3 = 3xyz\\)"], "correct": 3, "src": "M31", "orig": "images/q-3206647a4d.jpg", "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если a + b + c = 0, то a³ + b³ + c³ = 3abc. Берём a = x, b = y, c = −z.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + y − z = 0.</li><li>x³ + y³ + (−z)³ = 3 · x · y · (−z).</li><li>x³ + y³ − z³ = −3xyz.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это теорема Пифагора, не следует.</li><li>B, E — неверные знаки.</li><li>C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тождество a³ + b³ + c³ − 3abc = (a + b + c)(…).</div></div>"}, {"id": 20, "text": "<p>The circle in the diagram has a radius of 6 cm. If the perimeter of the rectangle is 28 cm, what is its area?</p>", "image": "images/q-77c35f2a2f.jpg", "options": ["26", "32", "28", "40", "36"], "correct": 0, "src": "M31", "orig": "images/q-77c35f2a2f.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ прямоугольника = диаметр = 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>l² + w² = 144; l + w = 14.</li><li>(l + w)² = 196 = 144 + 2lw → lw = 26.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (36) — r².</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (l + w)² − (l² + w²) = 2lw — находим площадь без самих сторон.</div></div>"}, {"id": 21, "text": "<p>A sector of a circle has a central angle of 45. The arc length of the sector is \\(5\\pi\\) cm.</p><p>What is the radius of the circle?</p>", "image": "", "options": ["8", "10", "12", "15", "20"], "correct": 4, "src": "M31", "orig": "images/q-d505c73c6e.jpg", "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина дуги = (угол/360°) · 2πr.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>45</span><span>360</span></span> · 2πr = <span class=\"fr\"><span>πr</span><span>4</span></span>.</li><li><span class=\"fr\"><span>πr</span><span>4</span></span> = 5π → r = 20.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (10) — диаметр перепутан.</li><li>A, C, D — неверная доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 45° = <span class=\"fr\"><span>1</span><span>8</span></span> окружности.</div></div>"}, {"id": 22, "text": "<p>Let ABCD be a rectangle and let P be a point inside the rectangle. If PA = 8, PB = 4, and PD = 7, then PC = ?</p>", "image": "images/q-06f1bd9ce2.jpg", "options": ["1", "2", "3", "\\(\\sqrt{2}\\)", "\\(\\sqrt{3}\\)"], "correct": 0, "src": "M31", "orig": "images/q-06f1bd9ce2.jpg", "review": true, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема о «британском флаге»: PA² + PC² = PB² + PD² для любой точки P и прямоугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>64 + PC² = 16 + 49 = 65.</li><li>PC² = 1 → PC = 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не удовлетворяют теореме.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Противоположные вершины — суммы квадратов расстояний равны.</div></div>"}, {"id": 23, "text": "<p>Using the formula \\(V = \\pi r^2 h\\), calculate the value of \\(r^2\\) when: \\(V = 5.024 * 10^{13}\\) and \\(h = 8 * 10^5\\) take \\(\\pi = 3.14\\)</p>", "image": "", "options": ["\\(2 * 10^8\\)", "\\(0.2 * 10^8\\)", "\\(20 * 10^8\\)", "\\(2 * 10^{12}\\)"], "correct": 1, "src": "M31", "review": true, "orig": "images/q-bba243b6f3.jpg", "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">r² = <span class=\"fr\"><span>V</span><span>πh</span></span>, считаем со степенями 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>πh = 3,14 · 8 · 10⁵ = 25,12 · 10⁵ = 2,512 · 10⁶.</li><li>5,024 · 10¹³ / 2,512 · 10⁶ = 2 · 10⁷ = 0,2 · 10⁸.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2 · 10⁸) — ошибка в степени на 1.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 5,024 / 2,512 = 2 — числа подобраны специально.</div></div>"}, {"id": 24, "text": "<p>Given the quadratic equation:</p><p>\\(x^2 - (6 * 10^4)x + (8 * 10^8) = 0\\)</p><p>Find the two possible values for x.</p>", "image": "", "options": ["\\(x_1 = 2 * 10^4, x_2 = 4 * 10^4\\)", "\\(x_1 = 3 * 10^4, x_2 = 4 * 10^4\\)", "\\(x_1 = 4 * 10^4, x_2 = 3 * 10^4\\)", "\\(x_1 = 8 * 10^4, x_2 = 4 * 10^4\\)", "\\(x_1 = 2 * 10^4, x_2 = 3 * 10^4\\)"], "correct": 0, "src": "M31", "orig": "images/q-c5884107c7.jpg", "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем два числа с суммой 6 · 10⁴ и произведением 8 · 10⁸ (Виета).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 10⁴ + 4 · 10⁴ = 6 · 10⁴ ✓.</li><li>2 · 10⁴ · 4 · 10⁴ = 8 · 10⁸ ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — сумма или произведение не совпадают.</li><li>D — сумма 12 · 10⁴.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Можно делить всё на 10⁴: x = 10⁴t, t² − 6t + 8 = 0 → t = 2, 4.</div></div>"}, {"id": 25, "text": "<p>ABCD is a square with side 1 cm, and E, F, G, and H are centers of given semicircles.</p><p>Find the shaded area.</p>", "image": "images/q-fa40ba7b0b.jpg", "options": ["\\(\\frac{\\pi}{2} - 1\\)", "\\(\\pi - 1\\)", "\\(\\frac{\\pi}{3} - 1\\)", "\\(\\frac{\\pi}{4} - 1/4\\)", "\\(2\\pi - 6\\)"], "correct": 0, "src": "M31", "orig": "images/q-fa40ba7b0b.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре полукруга вместе покрывают квадрат, а лепестки — дважды.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Радиус ½, площадь полукруга <span class=\"fr\"><span>π</span><span>8</span></span>, вместе <span class=\"fr\"><span>π</span><span>2</span></span>.</li><li><span class=\"fr\"><span>π</span><span>2</span></span> = квадрат + лепестки (лепестки посчитаны дважды).</li><li>Лепестки = <span class=\"fr\"><span>π</span><span>2</span></span> − 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — π − 1 (взяли полные круги).</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Метод «сумма площадей − площадь целого = площадь пересечений».</div></div>"}, {"id": 26, "text": "<p>The minute hand of a clock completes one full rotation in 60 minutes.</p><p>What is the speed of the minute hand in degrees per minute?</p>", "image": "", "options": ["2 degrees per minute", "4 degrees per minute", "6 degrees per minute", "8 degrees per minute"], "correct": 2, "src": "M31", "review": true, "orig": "images/q-2524415bb4.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">360° за 60 минут.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>360 ÷ 60 = 6° в минуту.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая стрелка — 0,5°/мин.</div></div>"}, {"id": 27, "text": "<p>A coordinate plane shows the locations of three markers used in a physics experiment:</p><ul><li>Point A: \\((2 * 10^3, 5 * 10^3)\\)</li><li>Point B:\\(( 5 * 10^3, 9 * 10^3)\\)</li><li>Point C:\\(( - 1 * 10^3, 1 * 10^3)\\)</li></ul><p>Calculate the distance between Point A and Point B.</p>", "image": "", "options": ["\\(2 * 10^2\\)", "\\(3 * 10^2\\)", "\\(5 * 10^3\\)", "\\(6 * 10^4\\)", "\\(7 * 10^2\\)"], "correct": 2, "src": "M31", "orig": "images/q-76114ed123.jpg", "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Формула расстояния; разности координат дают тройку 3-4-5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δx = 3 · 10³, Δy = 4 · 10³.</li><li>d = 5 · 10³.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — ошибка в степени 10.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Узнавайте 3-4-5 с множителем.</div></div>"}, {"id": 28, "text": "<p>In a lab, a sensor only works correctly when the intensity of a signal is above a certain threshold. The relationship is given by the following inequality:</p><p>\\((2 * 10^2)x - 1.5 * 10^5 &gt; 2.5 * 10^5\\)</p><p>Find the range of values for x.</p>", "image": "", "options": ["\\(x &gt; 10^3\\)", "\\(x &lt; 10^3\\)", "\\(x &gt; 2 * 10^3\\)", "\\(x &lt; 2 * 10^3\\)"], "correct": 2, "src": "M31", "review": true, "orig": "images/q-e98ece78c9.jpg", "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем линейное неравенство.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 10²x > 2,5 · 10⁵ + 1,5 · 10⁵ = 4 · 10⁵.</li><li>x > 2 · 10³.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли поделить на 2.</li><li>B, D — знак неравенства перевёрнут (делим на положительное число — знак не меняется).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак меняется только при делении на отрицательное число.</div></div>"}, {"id": 29, "text": "<p>If the sum of two consecutive odd integers is 24, what is the value of the smaller integer?</p>", "image": "", "options": ["13", "9", "12", "11", "21"], "correct": 3, "src": "M31", "orig": "images/q-c387014a1f.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два подряд идущих нечётных: n и n + 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2n + 2 = 24 → n = 11. (11 + 13 = 24 ✓)</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (12) — чётное.</li><li>A — большее число.</li><li>B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее 12 → нечётные по обе стороны: 11 и 13.</div></div>"}, {"id": 30, "text": "<p>The mean weight of fifteen students in a class is exactly 50 kg. The mean weight increases by exactly 2 kg when five new students join the class. What is the mean weight of the five new students?</p>", "image": "", "options": ["52 kg", "54 kg", "56 kg", "58 kg", "60 kg"], "correct": 3, "src": "M31", "orig": "images/q-3d8f501a8c.jpg", "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем с суммами, а не со средними.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Было: 15 · 50 = 750.</li><li>Стало: 20 · 52 = 1040.</li><li>Новые пятеро: 290 → среднее 58.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (52) — новое среднее всего класса.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средние нельзя складывать — переходите к суммам.</div></div>"}, {"id": 31, "topic": "M2.5", "text": "<p>How many different three-digit numbers can be made from the digits 1, 2, 3, 4 if no digit is used more than once?</p>", "image": "", "options": ["4", "12", "24", "48", "64"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перебор по разрядам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 3 · 2 = 24. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это число наборов, а не порядков.</li><li>B — двузначные числа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок важен — это разные числа.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.3", "text": "<p>In an isosceles triangle the angle between the two equal sides is 96°.</p><p>What is each of the other two angles?</p>", "image": "", "options": ["35°", "42°", "48°", "84°", "96°"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы при основании равны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(180 − 96) : 2 = 42°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — считали, что равны два угла по 96°.</li><li>D — забыли разделить на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Определите, какой угол «между равными сторонами».</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
