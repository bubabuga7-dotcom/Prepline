<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"topic":"MC","text":"<p>Health services should find better ways to take blood pressure readings for patients thought to be suffering from high blood pressure (hypertension). One third of patients thought to have high blood pressure may actually have 'white coat' hypertension, according to a new study. 'White coat' hypertension means that a patient's blood pressure is high at the doctor's surgery, probably due to anxiety, but normal in everyday life. In the study, patients said to have hypertension had their blood pressure measured in a normal environment; more than one third of these patients' blood pressures were in the normal range when they were at home or participating in their usual activities. It is worrying that patients are being treated with drugs with some negative side effects to reduce high blood pressure which they do not actually have.</p><p>Which one of the following best expresses the conclusion of the argument above?</p>","image":"","options":["Two thirds of patients said to have hypertension are being wrongly treated.","More effective ways of measuring blood pressure are needed.","Health services could save money currently spent on unnecessarily prescribed drugs.","Anxiety is the most common cause of high blood pressure.","'White coat' hypertension has no medical significance."],"correct":1,"src":"CRIT40","orig":"images/q-2de3500c37.jpg","explain":"The opening sentence is the conclusion: health services need better ways of measuring blood pressure — B. The white-coat study and the worry about drug side effects support it."},{"id":2,"topic":"CON","text":"<p>Many people argue that the many government programmes intended to increase road safety have caused a steady decline in the number of accidents on our roads. However, some observers report that the real number of accidents may be much higher than is shown in the official records as many accidents are not reported by drivers. They also say that during the time when accident figures have decreased, the number of people going to hospitals because of road accidents has stayed constant.</p><p>Which one of the following can be drawn as a conclusion from the above passage?</p>","image":"","options":["Road safety has improved greatly in recent years.","Drivers should be required to report all accidents that occur on the road.","Positive views about continually improving road safety may not be supported by what actually happens.","Government programmes have been unsuccessful in reducing the number of accidents.","Hospital admissions are a good way of measuring changes in the number of accidents on our roads."],"correct":2,"src":"CRIT40","orig":"images/q-a958e9a096.jpg","explain":"Unreported accidents and unchanged hospital admissions suggest the fall in official figures may not be real. So optimism about road safety may not match reality — C."},{"id":3,"topic":"MC","text":"<p>Modern technology has given us the power to use renewable natural resources faster than they can be replaced. The decline of fish numbers provides one example of the way in which modern technology can rapidly use up a natural resource. Modern fishing ships equipped with fish detecting systems and huge nets can gather up vast quantities of fish quicker than the sea can renew them. Because high technology gives us such harmful powers, we must learn to use the renewable resources of the earth carefully, rather than waste them.</p><p>Which one of the following best expresses the main conclusion of the above passage?</p>","image":"","options":["Modern technology simply takes from the environment and destroys its resources.","Fishing is now a serious threat to the world's environment and should cease.","Fish need to be carefully protected to prevent them from being destroyed.","Most people are unaware of the damaging effects of modern technology.","Humans must preserve renewable resources by learning how to use them carefully."],"correct":4,"src":"CRIT40","orig":"images/q-7d3311e2c9.jpg","explain":"'We must learn to use the renewable resources of the earth carefully' — E. Fishing is just the example."},{"id":4,"topic":"ASM","text":"<p>Global warming is threatening the survival of California's redwoods. These trees benefit from coastal fog which is captured by the trees, causing water to drip onto the soil and therefore watering them. Since fog is now 30 percent less frequent than it was 50 years ago the trees will not have this source of water and are therefore likely to begin to die out.</p><p>Which one of the following must be assumed in the above argument?</p>","image":"","options":["Global warming is to blame for the reduction in coastal fog.","The levels of fog will continue to decline.","Other trees will not be able to thrive in these conditions.","Redwoods in other areas of the world are being similarly affected.","Rainfall has also reduced over the past 50 years."],"correct":0,"src":"CRIT40","orig":"images/q-59dd50b1e3.jpg","explain":"The fog decline is used to show global warming threatens the redwoods. That assumes global warming caused the fog decline — A."},{"id":5,"topic":"FLAW","text":"<p>One of the fastestgrowing beauty treatments in Britain, fish pedicures where tiny toothless fish called garra rufa smooth feet by eating dead skin has come under scrutiny from animal rights campaigners. One campaigner said, 'Fish are covered by the Animal Welfare Act. They need a stable environment and clean water, uncontaminated by perfume or lotions.' A spa in London's West End was closed recently by the local council when many of the fish in its pedicure pool died. There should be a complete ban on this type of pedicure, or else there will soon be no garra rufa.</p><p>Which one of the following is the best statement of the flaw in the above argument?</p>","image":"","options":["Beauty spas which offer fish pedicures are not especially numerous at present.","It would be less harmful if people washed their feet before using the spa.","Fish in the wild are likely to die if their environment changes.","The death of the fish in the London spa may not be a typical occurrence.","The public does not immediately associate fish with the Animal Welfare Act."],"correct":3,"src":"CRIT40","orig":"images/q-096790ab35.jpg","explain":"From one spa where fish died, the argument calls for a total ban. That case may not be typical — D."},{"id":6,"topic":"MC","text":"<p>Shower gel is now used much more than soap when people take a shower. This is unfortunate. Shower gel requires much more packaging which means more rubbish. There is also a tendency for people to use more of it when washing in comparison with soap. Therefore more natural resources are consumed in the manufacturing process than would be if people used only soap. So, the trend towards shower gel is bad for the environment. This is because it creates more problems of waste disposal and uses up more resources than soap. We should make people more aware of the environmental impact of such simple decisions.</p><p>Which one of the following is an expression of the main conclusion of the above argument?</p>","image":"","options":["The increased popularity of shower gel is bad for the environment.","It is unfortunate that shower gel has become more popular than soap.","People should be made more aware of the environmental consequences of choosing shower gel.=","The use of shower gel increases the problems of waste disposal.","The manufacture of shower gel is more wasteful of natural resources."],"correct":0,"src":"CRIT40","orig":"images/q-bbcbd3d6be.jpg","explain":"'The trend towards shower gel is bad for the environment' — A. The packaging and resource points support it; C is a further recommendation."},{"id":7,"topic":"STR","text":"<p>Rating figures for music are now much more difficult to calculate compared to a decade ago. The introduction of new formats for selling music means that figures have to be calculated based on more methods such as downloads, in addition to the sales of CDs in shops. Additionally, the availability of more formats means that there is more potential for copies of works to be shared with other fans, who do not pay for them. These fans do not show up in the ratings, so the official ratings do not reflect the relative popularity of a work.</p><p>Which one of the following, if true, would most strengthen the above argument?</p>","image":"","options":["The calculation of ratings based on downloads and sales together is not difficult.","Sharing copies of purchased works with others is against the law.","Artists are not interested in the popularity of their work, just the sales figures.","The sharing of works with other fans is more widespread for certain types of music.","Official ratings have never reflected popularity very well."],"correct":3,"src":"CRIT40","orig":"images/q-7a1b083d92.jpg","explain":"The argument says sharing makes ratings misrepresent popularity. D strengthens it: sharing is more common for some types of music, so their ratings are distorted more than others."},{"id":8,"topic":"ASM","text":"<p>It has been argued that since there has to be some limit on the funding of university education by governments, it would be best to target such funding, giving a lower priority to subjects which provide little benefit to society. Some subjects, such as Medicine, Engineering and Computing should be well funded, because they are clearly of great worth to the community. Subjects such as Classics, Literature and Art should be funded at a much lower level. These subjects are primarily of interest to the individual, and a wealthy society should give some subsidy to hobby subjects. However, it must be recognised that the future of society lies in the training and development of those people who will contribute the most.</p><p>Which one of the following must be assumed in the above argument?</p>","image":"","options":["Subjects which are of interest to individuals can also provide benefit to society.","The training of those people who will contribute most to society requires an increase in government funding in university education.","Medicine, Engineering and Computing are not very interesting subjects to study.","A wealthy society should not subsidise subjects which are of interest only to individuals.","The study at universities of Classics, Literature and Art provides little benefit to society."],"correct":4,"src":"CRIT40","orig":"images/q-e00937dde3.jpg","explain":"The argument funds Classics, Literature and Art less because they provide little benefit to society. That has to be assumed — E."},{"id":9,"topic":"PS","text":"<p>The game of Nudge is played with a set of 15 pieces called 'bumps'. Some bumps weigh 15g, some weigh 30g and some weigh 40g. A full set of bumps has a total weight of 420g and contains a different number of each type. How many 30 g bumps are there in a full set of 15 bumps?</p>","image":"","options":["2","3","5","8","9"],"correct":3,"src":"CRIT40","orig":"images/q-e9e83831dd.jpg","explain":"x + y + z = 15 and 15x + 30y + 40z = 420. Subtract 15 × the first: 15y + 25z = 195, so 3y + 5z = 39. With all three counts different and at least one of each, y = 8, z = 3, x = 4 works (y = 3 gives x = z = 6)."},{"id":10,"topic":"EF","text":"<p>To get to work Kate must drive for 10 minutes to reach Newtown Station, take the next train to Central Station in the city and then walk for 20 minutes to reach her office. Whenever Kate arrives at Central Station later than usual, she takes a taxi from there to her office. The taxi takes 5 minutes to make the journey. Trains to Central Station depart every 30 minutes and Kate always plans to arrive at Newtown Station 20 minutes before her train is due to depart. This morning Kate arrived at work 15 minutes later than usual.</p><p>Which of the following would explain why Kate arrived at work 15 minutes later than usual?</p>","image":"","options":["Kate arrived at Newtown Station 15 minutes later than usual","Kate arrived at Newtown Station 45 minutes later than usual","The train that Kate normally takes was 15 minutes late","The train that Kate normally takes was 20 minutes late","None of them above"],"correct":1,"src":"CRIT40","orig":"images/q-0709e3c9b7.jpg","explain":"Kate normally arrives 20 min before her train. 45 minutes late, she misses it and takes the next one, 30 min later. A taxi then saves her 15 min of walking, so she is 15 min late. (15 min late at Newtown she'd still catch her train; a train 15 or 20 min late is offset by the taxi.)"},{"id":11,"topic":"PS","text":"<p>Sharifah runs at 6km per hour and Leillah runs at 5km per hour. They both run anticlockwise around a circular track of length 500 metres. Leillah starts 200 metres ahead of Sharifah. At what position around the track (measured anticlockwise) will they be when Sharifah first overtakes Leillah?</p>","image":"","options":["100 metres from Sharifah's start point","200 metres from Sharifah's start point","300 metres from Sharifah's start point","400 metres from Sharifah's start point","500 metres from Sharifah's start point"],"correct":1,"src":"CRIT40","orig":"images/q-4f788ee824.jpg","explain":"Sharifah gains 1 km/h and must gain 200 m: 0.2 h. In that time she runs 6 × 0.2 = 1.2 km = 2 laps + 200 m, so they meet 200 m from her start."},{"id":12,"topic":"CON","text":"<p>Ten years ago in many European cities, offices typically had spaces for six bicycles, half of which were never used and spaces for 50 cars which were always full. Today, there are fewer car spaces and many more spaces for bicycles which are always full. This change to cycling may seem strange to some as cycling is more effort. Possible causes are rising fuel prices, the introduction of higher parking charges for drivers in major cities, increasing awareness of environmental issues, expensive public transport and traffic jams.</p><p>Which one of the following can be drawn as a conclusion from the above passage?</p>","image":"","options":["Using a bicycle is now the most popular way of travelling to work.","Travellers are now much more environmentally aware than they were 10 years ago.","People will not cycle to work unless employers provide more cycle spaces on site.","Travellers are now less happy to pay the costs of car use than they were ten years ago.","More people cycle to work now than 10 years ago."],"correct":4,"src":"CRIT40","orig":"images/q-612a8d0b50.jpg","explain":"Office bike spaces are now full and more numerous while car spaces fell. So more people cycle to work than 10 years ago — E. The causes listed are only possible ones."},{"id":13,"topic":"PS","text":"<p>Alice works until 5pm each day from Monday to Friday. On Friday she is planning to go to the cinema with friends. There is a local bus service which passes her workplace, home and cinema. Part of the bus timetable is shown in the table below. Alice plans to take the bus home, where she will get ready to go to the cinema and then she will catch the bus to get to the cinema. It will take Alice 45 minutes to get ready and she will also need 10 minutes when she reaches the cinema to buy her ticket before a film starts. Films start every 15 minutes starting from 6pm.</p><table class=\"q-table\"><thead><tr><th><strong>Work</strong></th><th>16:39</th><th>17:04</th><th>17:39</th><th>18:04</th><th>18:39</th><th>19:04</th><th>19:39</th></tr></thead><tbody><tr><td><strong>Home</strong></td><td>17:08</td><td>17:33</td><td>17:58</td><td>18:33</td><td>18:58</td><td>19:33</td><td>19:58</td></tr><tr><td><strong>Cinema</strong></td><td>17:33</td><td>17:58</td><td>18:33</td><td>18:58</td><td>19:33</td><td>19:58</td><td>20:33</td></tr></tbody></table><p>What is the earliest time that she can watch a film?</p>","image":"","options":["18:15","18:30","18:45","19:00","19.15"],"correct":4,"src":"CRIT40","orig":"images/q-158968defb.jpg","explain":"Bus at 17:04 from work reaches home 17:33. Ready by 18:18, so the 18:33 bus, at the cinema 18:58. Ticket bought by 19:08, so the first film she can see is 19:15."},{"id":14,"topic":"PS","text":"<p>I wish to repaint the walls of my garage. It is 3 metres high, 4 metres wide and 9 metres deep. I shall not need to paint the electronic door which covers one 3 x 4 metre end, nor the window, which is 2 metres wide and 1 metre high, nor the rear door which is 1 metre wide and 2 metres high. 1 litre of paint covers 3 square metres.</p><p>How many 1 litre tins will be needed to complete the painting?</p>","image":"","options":["26","22","25","18","21"],"correct":4,"src":"CRIT40","orig":"images/q-9ee2589b1d.jpg","explain":"Two side walls 2 × (3 × 9) = 54 m² and the back wall 3 × 4 = 12 m² = 66 m². Minus window (2) and door (2) = 62 m². 62 ÷ 3 = 20.7, so 21 tins."},{"id":15,"topic":"PS","text":"<p>In preparation for my holiday in Bolandia last June, I changed €300 into Bolandian dollars every pay day from January to May (I am paid monthly).</p><p>The exchange rates were as follows:</p><table class=\"q-table\"><thead><tr><th></th><th><strong>January</strong></th><th><strong>February</strong></th><th><strong>March</strong></th><th><strong>April</strong></th><th><strong>May</strong></th></tr></thead><tbody><tr><td>€1=</td><td>$2.74</td><td>$2.79</td><td>$2.76</td><td>$2.83</td><td>$2.81</td></tr></tbody></table><p>In preparation for my holiday in Bolandia last June, I changed €300 into Bolandian dollars every pay day from January to May (I am paid monthly).</p><p>The exchange rates were as follows:</p>","image":"","options":["36","48","66","180","105"],"correct":0,"src":"CRIT40","orig":"images/q-62717213e3.jpg"},{"id":16,"topic":"PS","text":"<p>Four teams are taking part in a quiz. Each question is asked to all four teams. If only one team answers correctly, that team scores 10 points. If two teams answer correctly they both score 4 points, if three teams answer correctly they score 2 points each and if all four answer correctly they all score 1 point. After the first 10 questions the scores are as follows: Hoos 31 points Watts 23 points Wenns 15 points Wares 13 points The Wares are disappointed to be in last place at present, particularly as they have answered five questions correctly – more than two of the other teams.</p><p>What is the greatest number of questions that the Hoos may have answered correctly so far?</p>","image":"","options":["6","7","8","9","10"],"correct":0,"src":"CRIT40","orig":"images/q-bdcf50f71a.jpg"},{"id":17,"topic":"PS","text":"<p>To unlock my mobile phone, I have to enter a 4-digit PIN code. The four digits are all different and multiply together to give 360. When the code is written as words, the digits are in alphabetical order.</p><p>Which one of the following additional pieces of information would, by itself, enable you to deduce with certainty that my PIN code is 5492?</p>","image":"","options":["The first digit is 5","The second digit is 4","The third digit is 9","The fourth digit is 2","The fourth digit is 4"],"correct":3,"src":"CRIT40","orig":"images/q-f848821e24.jpg","explain":"Sets of 4 different digits with product 360, written in alphabetical order of their names: 8591 (eight, five, nine, one), 5492 (five, four, nine, two) and 5463 (five, four, six, three). Only 5492 ends in 2, so D identifies it."},{"id":18,"topic":"PS","text":"<p>Varinda is tiling a wall with grey tiles and a decorative strip of thin black tiles, part of which is shown alongside. The grey tiles are 30 x 20cm. The black strip is 5 cm wide and its lower edge is at a height of 1.4m. The gaps between all the tiles are 0.5cm; these are filled with a white compound. There are similar gaps at the edges of the wall, ceiling and floor. He can cut tiles to size where necessary and reuse the cut pieces if they fit with the pattern.</p><p>The wall is 2.25 m high x 1.85 m wide.</p><p>How many grey tiles will he need?</p>","image":"images/q-e7d2d7c104.jpg","options":["56","63","72","80","82"],"correct":2,"src":"CRIT40","orig":"images/q-e7d2d7c104.jpg","review":true},{"id":19,"topic":"PS","text":"<p>A square piece of paper is folded over equally four times and then the corners are cut off.</p><p>The paper is then unfolded to reveal a pattern. Which of the following is the resulting pattern?</p>","image":"images/q-8ba587370e.jpg","options":["A","B","C","D","E"],"correct":0,"src":"CRIT40","review":true,"orig":"images/q-8ba587370e.jpg"},{"id":20,"topic":"PS","text":"<p>100 people voted in a secret ballot for sporting hero of the year. The result was that Alan got 55 votes, Bella 35 votes and Cain 10 votes. After the result had been announced the voters were all asked individually how they voted. 80 said they voted for Alan, 10 for Bella and 10 for Cain.</p><p>What is the lowest number of voters that could be telling the truth?</p>","image":"","options":["35","50","65","75","80"],"correct":0,"src":"CRIT40","orig":"images/q-9c00df2ec3.jpg","explain":"Alan's 55 voters can only claim Bella or Cain 20 times, so at least 35 of them truthfully say Alan. That uses up all Bella and Cain claims, so every Bella and Cain voter must have claimed Alan (35 + 10 + 35 = 80 ✔). Truthful: 35."},{"id":21,"topic":"FLAW","text":"<p>An advertisement claims that a specific brand of cereal improves memory, citing a study where 60% of participants reported feeling more mentally sharp after eating the cereal daily for two weeks. However, the study lacked a control group and did not measure objective memory performance.</p><p>Which of the following is the best statement of the flaw in the above argument?</p>","image":"","options":["The study relied on self-reported feelings rather than objective data.","The cereal contains sugar.","Memory is hard to define.","Not all participants completed the full two weeks.","The study did not include older adults."],"correct":0,"src":"CRIT40","orig":"images/q-d7ce98863b.jpg","explain":"'Feeling sharper' is self-reported, with no control group or memory test — A."},{"id":22,"topic":"ASM","text":"<p>A teacher implemented a new classroom rule: students must put away phones during lessons to improve attention. She observed fewer distractions and more participation in class discussions. She believes this policy directly caused better focus.</p><p>Which of the following is an underlying assumption of the above argument?</p>","image":"","options":["Phones were a primary source of distraction during class.","Students use phones to cheat on tests.","Students appreciate clear classroom rules","Other schools have similar policies.","Participation is more important than test scores."],"correct":0,"src":"CRIT40","orig":"images/q-cfc166cb7f.jpg","explain":"Fewer distractions after banning phones are credited to the ban. That assumes phones were a main source of distraction — A."},{"id":23,"topic":"PS","text":"<p>A local store sells a variety of products related to a television show. The items for sale are books, T-shirts and models of characters who feature in the show. Books cost $8 each, T-shirts cost $12 each and the models are $10 each. Whenever three or more items are bought the cheapest one is reduced to half price. Today, 8 books, 8 T-shirts and 4 models were sold and discounts were applied to 5 of the items.</p><p>What is the difference between the greatest and least possible total amount paid for these items?</p>","image":"","options":["$5","$6","$8","$10","$15"],"correct":1,"src":"CRIT40","orig":"images/q-e58e2bf99c.jpg","explain":"Each transaction of 3+ items halves its cheapest item. Least discount: every discounted transaction contains a book: 5 × $4 = $20. Most: TTT, TTT ($6 each), MMM ($5), TTM ($5), and one with books ($4): $26. Difference $6."},{"id":24,"topic":"PS","text":"<p>Sami is organising a conference and has to provide lunch for the delegates. He expects at least 108 and at most 120 people will attend. For lunch, each delegate will be offered a packet of sandwiches, with a choice of salmon, turkey, or cheese. From experience he knows that at least a quarter of people will choose each type, but no more than a half will choose salmon, no more than a third will choose turkey, and no more than a third will choose cheese. The packets of sandwiches cost Sami $6 each for salmon, $5 each for turkey, and $4 each for cheese. Sami has arranged with the supplier that he can get half the cost back for any packet that is not used. Sami buys exactly the number of packets that will ensure that every delegate can get the type they want.</p><p>What is the least amount of money that Sami could get back when he returns the unused packets to the supplier?</p>","image":"","options":["$36.00","$40.00","$40.50","$45.00","$45.50"],"correct":3,"src":"CRIT40","orig":"images/q-ec5535481e.jpg","explain":"He must cover the worst case for each type: 120 people, up to 60 salmon, 40 turkey, 40 cheese = 140 packets. Least refund: 120 attend, 20 packets unused, with as many as possible being cheap ones. Cheese can't go below 30 chosen, so 10 cheese and 10 turkey unused: 10 × $2 + 10 × $2.50 = $45."},{"id":25,"topic":"PS","text":"<p>Mr Prod has a replicator. He uses it to triple everything he finds. Mrs Quot has a disintegrator. She uses it to destroy half of everything she finds. Ms Subtra is a thief who always steals six apples. One day a farmer left his apple cart unattended in his field. He returned to find he was missing 4 apples. He knows Mr Prod, Mrs Quot and Ms Subtra were the only three people to pass his cart but he does not know the order in which they passed.</p><p>Which one of the following numbers of apples did the farmer definitely not begin the day with?</p>","image":"","options":["4","10","20","28","30"],"correct":2,"src":"CRIT40","orig":"images/q-6b88b89f83.jpg"},{"id":26,"topic":"ASM","text":"<p>There is clear evidence that it is more difficult to score a high examination grade in certain subjects. For example, mathematics and foreign languages are much more difficult than most other subjects, in that a smaller percentage of those who take the examinations gain a high grade. Because schools in Britain want good examination results, they do not encourage students to choose these subjects for their Advanced-level examinations. This is why there is a decline in the numbers studying for university degrees in these subjects. Since the economy of the country is of prime concern, a policy of en couraging those with aptitudes for mathematics and languages should be introduced.</p><p>Which one of the following is an assumption underlying the reasoning in the above passage?</p>","image":"","options":["Students should be required to take examinations in mathematics and languages.","A successful economy needs people with advanced skills in mathematics and languages.","There are many people who have an aptitude for mathematics and foreign languages.","Schools in Britain think that mathematics and languages are not important subjects.","Students could get better results in mathematics and foreign languages if they worked harder."],"correct":1,"src":"CRIT40","orig":"images/q-1897cc3977.jpg","explain":"The argument wants more students in maths and languages because the economy matters most. That assumes the economy needs those skills — B."},{"id":27,"topic":"FLAW","text":"<p>In Britain during the 1970s there was a strike by doctors. It was predicted that because doctors ere not attending to patients, more people would die than would have died if the doctors had not been on strike. But in fact the death rate fell during the strike. We can conclude that treatment by a doctor, far from curing seriously ill people, actually hastens their death.</p><p>Which one of the following states a flaw in the above argument?</p>","image":"","options":["It implies that doctors should not be allowed to strike.","It presents evidence which contradicts its conclusion.","It ignores other possible causes of the fall in death rates.","It assumes a correlation between serious illness and death rates.","It assumes that the prediction about death rates was misguided."],"correct":2,"src":"CRIT40","orig":"images/q-1c84b5429a.jpg","explain":"The death rate fell during the strike, so the argument blames doctors. It ignores other causes, e.g. non-urgent operations being postponed — C."},{"id":28,"topic":"PS","text":"<p>Richard works for 8 hours every day, five days every week. He earns $10 per hour, but also gains a bonus which is calculated based on the quality of his work. At the end of each day Richard's supervisor scores his performance on a scale from 1 to 4. When the five scores for the week have been allocated, the second-lowest score is added to the second-highest score and the total is multiplied by $100 to give the value of the bonus. Last week Richard's scores were 4, 1, 3, 2 and 4; so his bonus was $600. Richard knows that he was given scores of 3, 2 and 3 on Monday to Wednesday this week.</p><p>What score for his work on Thursday would allow Richard to know what the value of his bonus for the week will be?</p>","image":"","options":["1","2","3","4","5"],"correct":1,"src":"CRIT40","orig":"images/q-f55dde1a2d.jpg","explain":"With 3, 2, 3 and a Thursday score of 2, the five scores are 2, 2, 3, 3 and Friday's. Whatever Friday's score (1–4), the second-lowest is 2 and the second-highest is 3: bonus $500 is certain."},{"id":29,"topic":"PS","text":"<p>Some Latin poetry uses the hexameter for each line: the pattern of syllables must conform to specific rules. A hexameter has six feet, and each foot must be one of dactyl, spondee and trochee.</p><table class=\"q-table\"><thead><tr><th>Foot</th><th>Syllable pattern</th></tr></thead><tbody><tr><td>Dactyl</td><td>Long Short Short</td></tr><tr><td>Spondee</td><td>Long Long</td></tr><tr><td>Trochee</td><td>Long Short</td></tr></tbody></table><p>For a standard hexameter, the first four feet must be dactyls or spondees but not all the same, the fifth must be a dactyl, and the last either a spondee or a trochee.</p><p>How many different possible standard hexameter lines are there?</p>","image":"","options":["10","28","30","62","73"],"correct":1,"src":"CRIT40","orig":"images/q-1120367a32.jpg","explain":"First four feet: each dactyl or spondee but not all the same: 2⁴ − 2 = 14 ways. Fifth is a dactyl; sixth has 2 options. 14 × 2 = 28."},{"id":30,"topic":"PS","text":"<p>There are 240 households in the village of Ferr End. A survey has revealed that 40 of the households have no dogs, 116 have one dog, 60 have two dogs and 24 have three dogs. No household has more than three dogs.</p><p>Which one of the following pie charts could illustrate the data for the households that do have at least one dog?</p>","image":"images/q-eee8c7c566.jpg","options":["A","B","C","D","E"],"correct":2,"src":"CRIT40","review":true,"orig":"images/q-eee8c7c566.jpg","explain":"Of the 200 households with dogs: 116 have one (58%), 60 have two (30%) and 24 have three (12%). Pick the pie chart with these proportions — just over half, under a third, and a small slice."}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
