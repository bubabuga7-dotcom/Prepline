<script>
const questions = [{"id": 1, "text": "Many companies now allow employees to work from home for part of the week. Critics say this harms teamwork, because colleagues have fewer chances to share ideas informally. However, the evidence suggests that a mixture of home and office working can combine the advantages of both. Employees save time on travel and report fewer distractions when doing focused work at home, while regular office days still allow meetings and informal conversations. Companies should therefore adopt mixed working, rather than requiring staff to be in the office every day or allowing them to work entirely from home.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["A mixture of home and office working can combine the advantages of both.", "Companies should adopt a mixture of home and office working rather than either extreme.", "Working from home harms teamwork.", "Employees save time on travel when they work from home.", "Regular office days allow informal conversations between colleagues."], "correct": 1, "explain": "The final recommendation, introduced by 'therefore', is the main conclusion. A is an intermediate conclusion that supports it. C is the critics' view, which the passage answers. D and E are reasons for A."}, {"id": 2, "text": "Concert tickets cost 12,000 ₸ in the stalls, 8,000 ₸ in the balcony and 5,000 ₸ in the upper circle. Groups of 10 or more receive 15% off, and students receive 20% off; these discounts cannot be combined. Tickets booked online have a booking fee of 500 ₸ each, which is not discounted. A group of 12 students books balcony seats online.<br><br><b>How much do they pay altogether?</b>", "options": ["76,800 ₸", "82,800 ₸", "87,600 ₸", "96,000 ₸", "102,000 ₸"], "correct": 1, "explain": "The student discount (20%) is better than the group discount (15%): 8,000 ₸ × 0.8 = 6,400 ₸, plus the 500 ₸ fee = 6,900 ₸ per ticket. 12 × 6,900 = 82,800 ₸. 87,600 ₸ uses the group discount; 76,800 ₸ forgets the booking fee."}, {"id": 3, "text": "Reality television programmes are often criticised for encouraging bad behaviour, but they can be valuable. Many people who would never watch a documentary learn something about ways of life very different from their own by watching such programmes. Viewers of a recent series about farming families, for example, said they had come to understand the pressures that farmers face. Not every reality programme does this, of course, but the form itself should not be dismissed.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Reality television can be valuable and should not be dismissed as a form.", "Reality television encourages bad behaviour.", "Reality television is more educational than documentaries.", "A recent reality series helped viewers to understand the pressures on farmers.", "Many viewers learn about different ways of life from reality television."], "correct": 0, "explain": "The passage argues that reality TV can be valuable and should not be dismissed. B is the criticism being answered. E is the main reason and D is an example supporting it. C is not claimed: documentaries are only mentioned as something some people would not watch."}, {"id": 4, "text": "A shop sells pencils only in packs: a pack of 3 costs 100 ₸ and a pack of 10 costs 300 ₸.<br><br><b>What is the least it costs to buy at least 26 pencils?</b>", "options": ["780 ₸", "800 ₸", "867 ₸", "900 ₸", "1,000 ₸"], "correct": 1, "explain": "Two packs of 10 and two packs of 3 give exactly 26 pencils for 600 + 200 = 800 ₸. Three packs of 10 (30 pencils) cost 900 ₸, as do nine packs of 3 (27 pencils). 780 ₸ uses 30 ₸ per pencil, but single pencils are not sold."}, {"id": 5, "text": "Since the city introduced free bus travel for students, the number of students travelling by bus has doubled. Over the same period, the number of students cycling has fallen by a third, and the number walking has hardly changed. Car journeys by parents taking their children to school have fallen only slightly.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Free bus travel has greatly reduced traffic congestion in the city.", "Students prefer travelling by bus to cycling.", "Walking is the least popular way for students to travel.", "Some of the increase in bus use has come from students who used to cycle.", "The free bus travel scheme has failed."], "correct": 3, "explain": "Bus use rose sharply while cycling fell and walking and car use changed little, so it is likely that some former cyclists now take the bus. A is not supported, since car journeys fell only slightly. B claims a general preference; E and C are not supported by the figures given."}, {"id": 6, "text": "Hose A on its own fills a paddling pool in 6 hours. Hose B on its own fills it in 3 hours.<br><br><b>How long do the two hoses take to fill the pool together?</b>", "options": ["1 hour 30 minutes", "1 hour 45 minutes", "2 hours", "4 hours 30 minutes", "9 hours"], "correct": 2, "explain": "In one hour, A fills 1/6 of the pool and B fills 1/3, together 1/6 + 2/6 = 1/2. So they take 2 hours. 4 hours 30 minutes is the average of the two times, which ignores that both work at once."}, {"id": 7, "text": "All the flights from Almaty to Seoul on Tuesdays are operated by Airline K. Airline K does not allow pets in the cabin. Dana will keep her cat with her in the cabin on her flight from Almaty to Seoul.<br><br><b>Which one of the following must be true?</b>", "options": ["Dana's flight is not on a Tuesday.", "Dana's cat will travel in the hold.", "No airline allows pets in the cabin.", "Dana is flying with a different airline on a Tuesday.", "Airline K does not operate flights on other days."], "correct": 0, "explain": "A Tuesday flight would be with Airline K, which does not allow pets in the cabin. Since Dana's cat will be in the cabin, her flight cannot be on a Tuesday. D is impossible, B contradicts the passage, and E and C are not stated."}, {"id": 8, "text": "Arman uses about 18 GB of mobile data a month. His network offers these monthly packages:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Package</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Data</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">S</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 GB</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">1,500 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">M</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10 GB</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2,500 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">L</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">25 GB</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">4,000 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,000 ₸</td></tr></table>Extra data can be added to any package at 400 ₸ per GB.<br><br><b>What is the least he can pay per month?</b>", "options": ["4,000 ₸", "5,200 ₸", "5,700 ₸", "6,000 ₸", "6,700 ₸"], "correct": 0, "explain": "S + 13 GB: 1,500 + 5,200 = 6,700 ₸. M + 8 GB: 2,500 + 3,200 = 5,700 ₸. L covers 18 GB on its own for 4,000 ₸. Unlimited costs 6,000 ₸. The least is 4,000 ₸."}, {"id": 9, "text": "A study found that teenagers who spend more than three hours a day on social media are more likely to feel lonely. So if parents limit their teenagers' use of social media to one hour a day, their children will feel less lonely.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Spending a lot of time on social media causes loneliness, rather than lonely teenagers spending more time on social media.", "Most teenagers use social media every day.", "Teenagers prefer meeting their friends in person.", "Loneliness is common among teenagers.", "Social media companies want to reduce loneliness."], "correct": 0, "explain": "The study shows only a link. Limiting social media would help only if social media use causes the loneliness; if lonely teenagers simply use social media more, the limit would not help. B, D, E and C are not needed for the conclusion."}, {"id": 10, "text": "A film lasts 2 hours 35 minutes, and 20 minutes of advertisements are shown before it starts. The cinema needs 25 minutes between the end of one showing and the start of the next. The first showing starts at 10:30, and every showing must finish by 23:00.<br><br><b>How many times can the film be shown in one day?</b>", "options": ["2", "3", "4", "5", "6"], "correct": 1, "explain": "Each showing takes 20 + 155 = 175 minutes, and the next starts 25 minutes later, so showings start every 200 minutes: 10:30, 13:50, 17:10 and 20:30. The 20:30 showing would end at 23:25, which is too late. So there are 3 showings."}, {"id": 11, "text": "The library has decided to close on Mondays to save money. This will not inconvenience many people, because the library has fewer visitors on Mondays than on any other day.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Other libraries also close on Mondays.", "Most Monday visitors are students.", "Most of the library's visitors come at weekends.", "Closing on Mondays will save a lot of money.", "The number of people who use the library on Mondays is small, not just smaller than on other days."], "correct": 4, "explain": "'Fewer than on other days' does not mean 'few': if thousands use the library on Mondays, many would be inconvenienced. So E must be assumed. D, C, B and A are not needed."}, {"id": 12, "text": "A committee of 2 people is to be chosen from 4 boys and 3 girls. It must include at least one girl.<br><br><b>How many different committees are possible?</b>", "options": ["9", "12", "15", "18", "21"], "correct": 2, "explain": "There are 7 × 6 ÷ 2 = 21 possible pairs in total. Pairs of two boys: 4 × 3 ÷ 2 = 6. So 21 − 6 = 15 committees include at least one girl. 12 counts only pairs with exactly one girl (4 × 3) and forgets pairs of two girls (3)."}, {"id": 13, "text": "In laboratory tests, a new fertiliser increased wheat yields by 20%. Farmers who switch to the new fertiliser can therefore expect their wheat harvests to rise by about 20%.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The price of wheat will rise.", "The researchers who carried out the tests were independent.", "The new fertiliser is cheaper than existing fertilisers.", "Results achieved in laboratory conditions will be repeated in farmers' fields.", "Farmers currently use too little fertiliser."], "correct": 3, "explain": "The argument moves from laboratory results to real farms; this only works if field conditions give similar results. C, A and E are not needed. B would make the tests more trustworthy but does not bridge the gap between laboratory and field."}, {"id": 14, "text": "A shop offers 'buy 2, get the 3rd free'. Seven items at £6 each: in 7 items there are 2 complete groups of 3, so 2 items are free and the cost is 5 × £6 = £30.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["With 20% off, 7 items at £6 cost 7 × 6 × 0.8 = £33.60.", "With £5 off the total, 7 items at £6 cost 42 − 5 = £37.", "At half price, 7 items at £6 cost 7 × 3 = £21.", "Seven items at £6 each cost 7 × 6 = £42.", "A café gives every 5th coffee free. For 12 coffees at 400 ₸, there are 2 complete groups of 5, so 2 coffees are free and the cost is 10 × 400 = 4,000 ₸."], "correct": 4, "explain": "The example finds how many complete groups there are, takes that many items off as free, and multiplies the rest by the price. E follows exactly these steps. A, B and C apply other kinds of discount, and D has no discount at all."}, {"id": 15, "text": "Students who use the school's online homework platform get better marks than those who do not. The school should therefore require all students to use it.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Most of the students who choose to use the platform are those who already work hardest.", "Some teachers prefer to set homework on paper.", "The platform was introduced two years ago.", "The platform is free for the school to use.", "Students can use the platform on their phones."], "correct": 0, "explain": "If the hardest-working students choose the platform, their better marks may come from their effort, not from the platform, so making everyone use it may not help. D slightly supports the proposal; B, C and E are irrelevant to the reasoning."}, {"id": 16, "text": "In a survey of 200 students about their favourite subject, 30% chose Maths, 25% English, 20% Science, 15% History and 10% Art. Of the students who chose Maths, 60% were girls; of those who chose Science, 40% were girls.<br><br><b>How many more girls chose Maths than chose Science?</b>", "options": ["10", "16", "20", "24", "36"], "correct": 2, "explain": "Maths: 30% of 200 = 60 students, 60% of them girls = 36. Science: 20% of 200 = 40 students, 40% girls = 16. Difference: 36 − 16 = 20. The other subjects are not needed."}, {"id": 17, "text": "Tourist numbers in our town fell sharply after the old bridge into the town was closed for repairs. The council believes that the closure is the main cause of the fall.<br><br><b>Which one of the following, if true, would most strengthen the council's view?</b>", "options": ["Tourism is important to the town's economy.", "The repairs are expected to take two years.", "A new hotel opened in the town during the repairs.", "The bridge was built more than a hundred years ago.", "Over the same period, tourist numbers did not fall in nearby towns that are still easy to reach."], "correct": 4, "explain": "If similar towns that are easy to reach kept their visitors, a general fall in tourism is less likely and the bridge closure is a more likely cause. D, B, C and A do not help to show what caused the fall."}, {"id": 18, "text": "Three boxes are labelled 'Apples', 'Oranges' and 'Mixed'. Every label is wrong. You take one fruit from the box labelled 'Mixed', and it is an apple.<br><br><b>What does the box labelled 'Oranges' contain?</b>", "options": ["Apples only", "Oranges only", "A mixture of apples and oranges", "Either apples only or a mixture", "It cannot be determined"], "correct": 2, "explain": "The box labelled 'Mixed' cannot contain a mixture, and it contains an apple, so it holds apples only. The box labelled 'Oranges' cannot hold oranges only, and the apples are already placed, so it must hold the mixture. The box labelled 'Apples' holds oranges."}, {"id": 19, "text": "A survey found that people who own a pet live longer, on average, than people who do not. Owning a pet must therefore improve people's health.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Pet owners spend a lot of money on food for their animals.", "The survey included both cat owners and dog owners.", "Some kinds of pet live longer than others.", "Dogs need to be taken for regular walks.", "People who are seriously ill are often unable to look after a pet, and so are less likely to own one."], "correct": 4, "explain": "If ill people are less likely to own pets, pet owners would live longer on average even if pets had no effect on health: the link would be explained by health affecting pet ownership. D might suggest how pets could help, which supports the argument; A, C and B are irrelevant."}, {"id": 20, "text": "Four painters, all working at the same rate, can paint a school in 6 days.<br><br><b>How many days would 3 painters take to paint the same school?</b>", "options": ["4.5", "8", "9", "10", "24"], "correct": 1, "explain": "The job needs 4 × 6 = 24 painter-days. Three painters need 24 ÷ 3 = 8 days. 4.5 days wrongly assumes that fewer painters would finish faster."}, {"id": 21, "text": "Professor Sarsenova argues that the school day should start an hour later because teenagers need more sleep. But if we let students sleep as long as they like, they will never learn discipline. Her proposal should therefore be rejected.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that teenagers need more sleep.", "It attacks the professor's character instead of her argument.", "It ignores the cost of changing the school timetable.", "It assumes that discipline is less important than sleep.", "It attacks a more extreme proposal than the one that was actually made."], "correct": 4, "explain": "The professor proposed starting one hour later, not letting students sleep as long as they like. The argument rejects a distorted version of her proposal. A and D are not assumed; C is not a flaw in the reasoning; B does not describe what happens, since her character is not mentioned."}, {"id": 22, "text": "A rectangular field measures 120 m by 80 m. A path 2 m wide runs all the way round the field, just inside its edge.<br><br><b>What is the area of the path?</b>", "options": ["392 m²", "400 m²", "776 m²", "784 m²", "800 m²"], "correct": 3, "explain": "The area inside the path is (120 − 4) × (80 − 4) = 116 × 76 = 8,816 m². The whole field is 9,600 m². The path is 9,600 − 8,816 = 784 m². 800 m² is 2 m × the full perimeter (400 m), which counts the four corner squares twice."}, {"id": 23, "text": "Some people complain that our factory pollutes the river. But other factories in the region pollute far more than we do, so we should not have to change anything.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not say how much the other factories pollute.", "It assumes that pollution is harmful.", "It assumes that the river is important to local people.", "The fact that others cause more pollution does not show that the factory's own pollution is acceptable.", "It ignores the cost of reducing pollution."], "correct": 3, "explain": "Comparing itself with worse polluters does not answer the complaint about the factory's own pollution. A, C, E and B do not explain why the conclusion fails to follow."}, {"id": 24, "text": "A recipe uses 3 eggs to make 12 pancakes. To make 20 pancakes, I need 3 × 20 ÷ 12 = 5 eggs.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A car travels 75 km on 6 litres of fuel, so its fuel use is 75 ÷ 6 = 12.5 km per litre.", "A car uses 6 litres of fuel to travel 75 km. To travel 200 km, it needs 6 × 200 ÷ 75 = 16 litres.", "Twelve pancakes shared between 4 people gives 12 ÷ 4 = 3 each.", "Three pens cost £12, so one pen costs 12 ÷ 3 = £4.", "If 3 workers take 12 days to do a job, 6 workers take 12 × 3 ÷ 6 = 6 days."], "correct": 1, "explain": "The example scales a quantity in direct proportion: multiply by the new amount and divide by the old one. B does exactly this. E also multiplies and divides, but it is inverse proportion (more workers, fewer days), which is a different method."}, {"id": 25, "text": "In a telephone survey carried out between 10:00 and 12:00 on weekdays, 70% of the people who answered said they were satisfied with the city's bus service. So most of the city's bus users are satisfied with the service.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["People who are at home to answer the phone on weekday mornings may not be typical of bus users, many of whom are at work or school at that time.", "70% is not a large enough majority to draw a conclusion.", "It assumes that bus fares in the city are low.", "The survey did not ask about the city's trains.", "It does not say how many buses the city has."], "correct": 0, "explain": "The survey reached only people at home on weekday mornings, who may not be typical bus users, and many of them may not use buses at all. B is wrong: 70% is clearly 'most'. D, C and E are irrelevant."}, {"id": 26, "text": "A school has 840 students. The ratio of junior students to senior students is 3 : 4. A quarter of the juniors and a third of the seniors walk to school.<br><br><b>How many students walk to school?</b>", "options": ["210", "245", "250", "270", "280"], "correct": 2, "explain": "Juniors: 3/7 × 840 = 360; seniors: 480. Walkers: 360 ÷ 4 + 480 ÷ 3 = 90 + 160 = 250. 245 applies the average of a quarter and a third to everyone; 210 and 280 apply one fraction to all 840 students."}, {"id": 27, "text": "Some of the students in the choir are in Year 10. Some Year 10 students play football. So some of the students in the choir play football.<br><br><b>Which one of the following contains the same flaw as the above argument?</b>", "options": ["None of the cars in the car park is red. So none of them is new.", "All the cars in the car park are red. All red cars are new. So all the cars in the car park are new.", "Some of the cars in the car park are red. So some of them are not red.", "Some of the cars in the car park are red. Some red things are expensive. So some of the cars in the car park are expensive.", "Some of the cars in the car park are red. All red cars are new. So some of the cars in the car park are new."], "correct": 3, "explain": "The original links two 'some' statements: the Year 10 students in the choir need not be the ones who play football. D makes the same error. B and E are valid; A and C make different errors."}, {"id": 28, "text": "An electricity meter read 14,230 kWh on 1 March and 14,610 kWh on 1 April. The first 300 kWh used in a month cost 25 ₸ per kWh, and any further units cost 35 ₸ per kWh.<br><br><b>What was the bill for March?</b>", "options": ["7,500 ₸", "9,500 ₸", "10,300 ₸", "11,800 ₸", "13,300 ₸"], "correct": 2, "explain": "Units used: 14,610 − 14,230 = 380 kWh. Cost: 300 × 25 + 80 × 35 = 7,500 + 2,800 = 10,300 ₸. 9,500 ₸ charges every unit at 25 ₸; 13,300 ₸ charges every unit at 35 ₸."}, {"id": 29, "text": "Teachers should not give extra marks for neat handwriting in a history examination, because the examination is meant to test knowledge of history, not handwriting.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["Teachers should give extra marks to students who work hard.", "History examinations should include questions about handwriting.", "Students with neat handwriting should receive higher marks in every subject.", "All examinations should be typed rather than handwritten.", "In a cooking competition judged on taste, the judges should not give points for how expensive the ingredients were."], "correct": 4, "explain": "The principle is that an assessment should reward only what it is designed to measure. E applies this to a taste competition. C and A contradict the principle; D and B are about other matters."}, {"id": 30, "text": "A square sheet of paper is folded in half, and then folded in half again in the other direction, giving a smaller square four layers thick. A single hole is punched through all the layers.<br><br><b>How many holes are there when the paper is unfolded?</b>", "options": ["1", "2", "3", "4", "8"], "correct": 3, "explain": "The punch goes through all four layers at once, making one hole in each layer, so there are 4 holes when the paper is opened out."}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
        ${q.explain ? `<details style="margin-top:8px;font-size:14px;line-height:1.55"><summary style="cursor:pointer;color:var(--gold,#C9A227);font-weight:600">Why ${'ABCDE'[q.correct]}?</summary><div style="margin-top:6px;opacity:.9">${q.explain}</div></details>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

           background:rgba(6,10,20,.78);backdrop-filter:blur(4px);padding:20px}

  #pl-gate .box{max-width:420px;width:100%;background:#111A2E;border:1px solid rgba(255,255,255,.14);
                border-radius:10px;padding:26px 28px;font-family:Inter,system-ui,sans-serif;color:#E6ECF7}
  #pl-gate h3{font-family:Sora,Inter,sans-serif;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
  #pl-gate p{font-size:14px;line-height:1.55;color:#B4C0D6;margin:0 0 18px}
  #pl-gate .row{display:flex;gap:10px;flex-wrap:wrap}
  #pl-gate button{font:600 14px Inter,sans-serif;padding:11px 22px;border-radius:5px;cursor:pointer;border:0}
  #pl-gate .go{background:#C9A227;color:#10192C}
  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6ECF7}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>

<script src="test-ux.js"></script>
</body>
</html>
