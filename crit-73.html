<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "Many companies now allow employees to work from home for part of the week. Critics say this harms teamwork, because colleagues have fewer chances to share ideas informally. However, the evidence suggests that a mixture of home and office working can combine the advantages of both. Employees save time on travel and report fewer distractions when doing focused work at home, while regular office days still allow meetings and informal conversations. Companies should therefore adopt mixed working, rather than requiring staff to be in the office every day or allowing them to work entirely from home.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["A mixture of home and office working can combine the advantages of both.", "Companies should adopt a mixture of home and office working rather than either extreme.", "Working from home harms teamwork.", "Employees save time on travel when they work from home.", "Regular office days allow informal conversations between colleagues."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Смешанный формат объединяет плюсы → компаниям стоит его ввести.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: компании должны выбрать смешанную работу. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — промежуточный вывод.</li><li>C — позиция критиков.</li><li>D, E — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore … should» — вывод.</div></div>"}, {"id": 2, "topic": "PS", "text": "Concert tickets cost 12,000 ₸ in the stalls, 8,000 ₸ in the balcony and 5,000 ₸ in the upper circle. Groups of 10 or more receive 15% off, and students receive 20% off; these discounts cannot be combined. Tickets booked online have a booking fee of 500 ₸ each, which is not discounted. A group of 12 students books balcony seats online.<br><br><b>How much do they pay altogether?</b>", "options": ["76,800 ₸", "82,800 ₸", "87,600 ₸", "96,000 ₸", "102,000 ₸"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Скидки не суммируются → выбираем студенческую 20%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8000 · 0,8 = 6400 + сбор 500 = 6900 ₸.</li><li>12 · 6900 = 82 800 ₸. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без сборов.</li><li>C — групповая скидка 15%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сбор не скидывается.</div></div>"}, {"id": 3, "topic": "MC", "text": "Reality television programmes are often criticised for encouraging bad behaviour, but they can be valuable. Many people who would never watch a documentary learn something about ways of life very different from their own by watching such programmes. Viewers of a recent series about farming families, for example, said they had come to understand the pressures that farmers face. Not every reality programme does this, of course, but the form itself should not be dismissed.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Reality television can be valuable and should not be dismissed as a form.", "Reality television encourages bad behaviour.", "Reality television is more educational than documentaries.", "A recent reality series helped viewers to understand the pressures on farmers.", "Many viewers learn about different ways of life from reality television."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Реалити-шоу ценны, их нельзя отвергать как жанр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — позиция критиков.</li><li>D, E — доводы.</li><li>C — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тезис + финальная фраза.</div></div>"}, {"id": 4, "topic": "PS", "text": "A shop sells pencils only in packs: a pack of 3 costs 100 ₸ and a pack of 10 costs 300 ₸.<br><br><b>What is the least it costs to buy at least 26 pencils?</b>", "options": ["780 ₸", "800 ₸", "867 ₸", "900 ₸", "1,000 ₸"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пачка 10 дешевле на карандаш (30 ₸ против 33).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 10 + 2 · 3 = 26 → 600 + 200 = 800 ₸.</li><li>3 · 10 = 900 ₸ — дороже. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — дробные пачки.</li><li>A — нельзя купить 26 по 30 ₸.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переберите комбинации.</div></div>"}, {"id": 5, "topic": "CON", "text": "Since the city introduced free bus travel for students, the number of students travelling by bus has doubled. Over the same period, the number of students cycling has fallen by a third, and the number walking has hardly changed. Car journeys by parents taking their children to school have fallen only slightly.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Free bus travel has greatly reduced traffic congestion in the city.", "Students prefer travelling by bus to cycling.", "Walking is the least popular way for students to travel.", "Some of the increase in bus use has come from students who used to cycle.", "The free bus travel scheme has failed."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автобусников вдвое больше, велосипедистов на треть меньше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Часть прироста — бывшие велосипедисты. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — машин почти столько же.</li><li>B, C, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Откуда новые пассажиры?</div></div>"}, {"id": 6, "topic": "PS", "text": "Hose A on its own fills a paddling pool in 6 hours. Hose B on its own fills it in 3 hours.<br><br><b>How long do the two hoses take to fill the pool together?</b>", "options": ["1 hour 30 minutes", "1 hour 45 minutes", "2 hours", "4 hours 30 minutes", "9 hours"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">За час: <span class=\"fr\"><span>1</span><span>6</span></span> + <span class=\"fr\"><span>1</span><span>3</span></span> = <span class=\"fr\"><span>1</span><span>2</span></span> бассейна.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вместе — 2 часа. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — среднее времён.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте скорости.</div></div>"}, {"id": 7, "topic": "CON", "text": "All the flights from Almaty to Seoul on Tuesdays are operated by Airline K. Airline K does not allow pets in the cabin. Dana will keep her cat with her in the cabin on her flight from Almaty to Seoul.<br><br><b>Which one of the following must be true?</b>", "options": ["Dana's flight is not on a Tuesday.", "Dana's cat will travel in the hold.", "No airline allows pets in the cabin.", "Dana is flying with a different airline on a Tuesday.", "Airline K does not operate flights on other days."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По вторникам — только авиакомпания K; K не берёт животных в салон.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дана летит с кошкой в салоне → не во вторник. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — противоречит.</li><li>C, D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрапозиция.</div></div>"}, {"id": 8, "topic": "PS", "text": "Arman uses about 18 GB of mobile data a month. His network offers these monthly packages:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Package</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Data</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">S</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 GB</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">1,500 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">M</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10 GB</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2,500 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">L</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">25 GB</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">4,000 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,000 ₸</td></tr></table>Extra data can be added to any package at 400 ₸ per GB.<br><br><b>What is the least he can pay per month?</b>", "options": ["4,000 ₸", "5,200 ₸", "5,700 ₸", "6,000 ₸", "6,700 ₸"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нужно 18 ГБ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>L (25 ГБ) — 4000 ₸; M + 8 ГБ = 2500 + 3200 = 5700 ₸.</li><li>Минимум 4000 ₸. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — S + 13 ГБ.</li><li>D — безлимит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Иногда больший пакет дешевле.</div></div>"}, {"id": 9, "topic": "ASM", "text": "A study found that teenagers who spend more than three hours a day on social media are more likely to feel lonely. So if parents limit their teenagers' use of social media to one hour a day, their children will feel less lonely.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Spending a lot of time on social media causes loneliness, rather than lonely teenagers spending more time on social media.", "Most teenagers use social media every day.", "Teenagers prefer meeting their friends in person.", "Loneliness is common among teenagers.", "Social media companies want to reduce loneliness."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Много соцсетей ↔ одиночество → ограничить соцсети.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: соцсети вызывают одиночество, а не наоборот. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 10, "topic": "PS", "text": "A film lasts 2 hours 35 minutes, and 20 minutes of advertisements are shown before it starts. The cinema needs 25 minutes between the end of one showing and the start of the next. The first showing starts at 10:30, and every showing must finish by 23:00.<br><br><b>How many times can the film be shown in one day?</b>", "options": ["2", "3", "4", "5", "6"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сеанс 20 + 155 = 175 мин; между началами 200 мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10:30–13:25, 13:50–16:45, 17:10–20:05.</li><li>Следующий 20:30–23:25 — поздно. 3 сеанса. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — четвёртый не успевает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выпишите расписание.</div></div>"}, {"id": 11, "topic": "ASM", "text": "The library has decided to close on Mondays to save money. This will not inconvenience many people, because the library has fewer visitors on Mondays than on any other day.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Other libraries also close on Mondays.", "Most Monday visitors are students.", "Most of the library's visitors come at weekends.", "Closing on Mondays will save a lot of money.", "The number of people who use the library on Mondays is small, not just smaller than on other days."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В понедельник меньше всего посетителей → неудобств мало.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: их мало в абсолютном смысле, а не просто меньше других дней. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Меньше ≠ мало.</div></div>"}, {"id": 12, "topic": "PS", "text": "A committee of 2 people is to be chosen from 4 boys and 3 girls. It must include at least one girl.<br><br><b>How many different committees are possible?</b>", "options": ["9", "12", "15", "18", "21"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все пары минус пары без девочек.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C(7,2) − C(4,2) = 21 − 6 = 15. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — только 1 девочка.</li><li>E — все пары.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Хотя бы один» — через дополнение.</div></div>"}, {"id": 13, "topic": "ASM", "text": "In laboratory tests, a new fertiliser increased wheat yields by 20%. Farmers who switch to the new fertiliser can therefore expect their wheat harvests to rise by about 20%.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The price of wheat will rise.", "The researchers who carried out the tests were independent.", "The new fertiliser is cheaper than existing fertilisers.", "Results achieved in laboratory conditions will be repeated in farmers' fields.", "Farmers currently use too little fertiliser."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В лаборатории +20% → у фермеров +20%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: результаты повторятся в поле. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Лаборатория ≠ реальность.</div></div>"}, {"id": 14, "topic": "PS", "text": "A shop offers 'buy 2, get the 3rd free'. Seven items at £6 each: in 7 items there are 2 complete groups of 3, so 2 items are free and the cost is 5 × £6 = £30.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["With 20% off, 7 items at £6 cost 7 × 6 × 0.8 = £33.60.", "With £5 off the total, 7 items at £6 cost 42 − 5 = £37.", "At half price, 7 items at £6 cost 7 × 3 = £21.", "Seven items at £6 each cost 7 × 6 = £42.", "A café gives every 5th coffee free. For 12 coffees at 400 ₸, there are 2 complete groups of 5, so 2 coffees are free and the cost is 10 × 400 = 4,000 ₸."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем полные группы и бесплатные позиции.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: 12 кофе → 2 полные группы по 5 → 2 бесплатно. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — без групп.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Целые группы.</div></div>"}, {"id": 15, "topic": "WKN", "text": "Students who use the school's online homework platform get better marks than those who do not. The school should therefore require all students to use it.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Most of the students who choose to use the platform are those who already work hardest.", "Some teachers prefer to set homework on paper.", "The platform was introduced two years ago.", "The platform is free for the school to use.", "Students can use the platform on their phones."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пользователи платформы лучше учатся → обязать всех.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если платформу выбирают и так прилежные — причина в них. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Самоотбор.</div></div>"}, {"id": 16, "topic": "PS", "text": "In a survey of 200 students about their favourite subject, 30% chose Maths, 25% English, 20% Science, 15% History and 10% Art. Of the students who chose Maths, 60% were girls; of those who chose Science, 40% were girls.<br><br><b>How many more girls chose Maths than chose Science?</b>", "options": ["10", "16", "20", "24", "36"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Математика: 60 чел., девочек 36. Естествознание: 40 чел., девочек 16.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>36 − 16 = 20. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — только девочки, выбравшие естествознание.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проценты от разных групп.</div></div>"}, {"id": 17, "topic": "STR", "text": "Tourist numbers in our town fell sharply after the old bridge into the town was closed for repairs. The council believes that the closure is the main cause of the fall.<br><br><b>Which one of the following, if true, would most strengthen the council's view?</b>", "options": ["Tourism is important to the town's economy.", "The repairs are expected to take two years.", "A new hotel opened in the town during the repairs.", "The bridge was built more than a hundred years ago.", "Over the same period, tourist numbers did not fall in nearby towns that are still easy to reach."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мост закрыт → туристов меньше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в соседних городах с открытыми дорогами спада нет — дело в мосте. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — нейтрально.</li><li>A, B, D — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрольная группа.</div></div>"}, {"id": 18, "topic": "PS", "text": "Three boxes are labelled 'Apples', 'Oranges' and 'Mixed'. Every label is wrong. You take one fruit from the box labelled 'Mixed', and it is an apple.<br><br><b>What does the box labelled 'Oranges' contain?</b>", "options": ["Apples only", "Oranges only", "A mixture of apples and oranges", "Either apples only or a mixture", "It cannot be determined"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все ярлыки неверны; из «Смесь» достали яблоко.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>«Смесь» — не смесь → только яблоки.</li><li>«Апельсины» — не апельсины, яблоки заняты → смесь. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — определяется однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с ярлыка «Смесь».</div></div>"}, {"id": 19, "topic": "WKN", "text": "A survey found that people who own a pet live longer, on average, than people who do not. Owning a pet must therefore improve people's health.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Pet owners spend a lot of money on food for their animals.", "The survey included both cat owners and dog owners.", "Some kinds of pet live longer than others.", "Dogs need to be taken for regular walks.", "People who are seriously ill are often unable to look after a pet, and so are less likely to own one."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Владельцы питомцев живут дольше → питомцы полезны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если больные не могут держать питомцев — причина обратная. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — скорее усиливает.</li><li>A, B, C — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 20, "topic": "PS", "text": "Four painters, all working at the same rate, can paint a school in 6 days.<br><br><b>How many days would 3 painters take to paint the same school?</b>", "options": ["4.5", "8", "9", "10", "24"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4 маляра · 6 дней = 24 человеко-дня.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>24 : 3 = 8 дней. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — прямая пропорция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная пропорция.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "Professor Sarsenova argues that the school day should start an hour later because teenagers need more sleep. But if we let students sleep as long as they like, they will never learn discipline. Her proposal should therefore be rejected.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that teenagers need more sleep.", "It attacks the professor's character instead of her argument.", "It ignores the cost of changing the school timetable.", "It assumes that discipline is less important than sleep.", "It attacks a more extreme proposal than the one that was actually made."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предлагают начинать на час позже, а спорят со «спать сколько хочешь».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Атакуют более крайнее предложение («соломенное чучело»). Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — о характере ничего нет.</li><li>A, C, D — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Чучело вместо оппонента.</div></div>"}, {"id": 22, "topic": "PS", "text": "A rectangular field measures 120 m by 80 m. A path 2 m wide runs all the way round the field, just inside its edge.<br><br><b>What is the area of the path?</b>", "options": ["392 m²", "400 m²", "776 m²", "784 m²", "800 m²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дорожка внутри поля.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>120 · 80 − 116 · 76 = 9600 − 8816 = 784 м². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без углов.</li><li>B — 2 · (120 + 80) · 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Большой минус малый.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "Some people complain that our factory pollutes the river. But other factories in the region pollute far more than we do, so we should not have to change anything.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not say how much the other factories pollute.", "It assumes that pollution is harmful.", "It assumes that the river is important to local people.", "The fact that others cause more pollution does not show that the factory's own pollution is acceptable.", "It ignores the cost of reducing pollution."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Другие загрязняют больше → нам ничего не менять.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>То, что другие хуже, не делает собственное загрязнение допустимым. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «А у них хуже».</div></div>"}, {"id": 24, "topic": "PS", "text": "A recipe uses 3 eggs to make 12 pancakes. To make 20 pancakes, I need 3 × 20 ÷ 12 = 5 eggs.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A car travels 75 km on 6 litres of fuel, so its fuel use is 75 ÷ 6 = 12.5 km per litre.", "A car uses 6 litres of fuel to travel 75 km. To travel 200 km, it needs 6 × 200 ÷ 75 = 16 litres.", "Twelve pancakes shared between 4 people gives 12 ÷ 4 = 3 each.", "Three pens cost £12, so one pen costs 12 ÷ 3 = £4.", "If 3 workers take 12 days to do a job, 6 workers take 12 × 3 ÷ 6 = 6 days."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: количество · новое : старое.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: 6 · 200 : 75 = 16 л. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — обратная пропорция.</li><li>A, C, D — один шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прямая пропорция.</div></div>"}, {"id": 25, "topic": "FLAW", "text": "In a telephone survey carried out between 10:00 and 12:00 on weekdays, 70% of the people who answered said they were satisfied with the city's bus service. So most of the city's bus users are satisfied with the service.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["People who are at home to answer the phone on weekday mornings may not be typical of bus users, many of whom are at work or school at that time.", "70% is not a large enough majority to draw a conclusion.", "It assumes that bus fares in the city are low.", "The survey did not ask about the city's trains.", "It does not say how many buses the city has."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Опрос утром в будни → вывод обо всех пассажирах.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Кто дома утром в будни — нетипичная выборка. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 70% достаточно.</li><li>C, D, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Репрезентативность.</div></div>"}, {"id": 26, "topic": "PS", "text": "A school has 840 students. The ratio of junior students to senior students is 3 : 4. A quarter of the juniors and a third of the seniors walk to school.<br><br><b>How many students walk to school?</b>", "options": ["210", "245", "250", "270", "280"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 : 4 из 840 → младших 360, старших 480.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>360 : 4 + 480 : 3 = 90 + 160 = 250. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — третья часть от всех.</li><li>B — перепутаны доли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доля каждой группы отдельно.</div></div>"}, {"id": 27, "topic": "FLAW", "text": "Some of the students in the choir are in Year 10. Some Year 10 students play football. So some of the students in the choir play football.<br><br><b>Which one of the following contains the same flaw as the above argument?</b>", "options": ["None of the cars in the car park is red. So none of them is new.", "All the cars in the car park are red. All red cars are new. So all the cars in the car park are new.", "Some of the cars in the car park are red. So some of them are not red.", "Some of the cars in the car park are red. Some red things are expensive. So some of the cars in the car park are expensive.", "Some of the cars in the car park are red. All red cars are new. So some of the cars in the car park are new."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Некоторые A — B; некоторые B — C → некоторые A — C (ошибка).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: некоторые машины красные; некоторые красные вещи дорогие → некоторые машины дорогие. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — верные выводы.</li><li>A, C — другие ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Некоторые + некоторые» ничего не дают.</div></div>"}, {"id": 28, "topic": "PS", "text": "An electricity meter read 14,230 kWh on 1 March and 14,610 kWh on 1 April. The first 300 kWh used in a month cost 25 ₸ per kWh, and any further units cost 35 ₸ per kWh.<br><br><b>What was the bill for March?</b>", "options": ["7,500 ₸", "9,500 ₸", "10,300 ₸", "11,800 ₸", "13,300 ₸"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Расход 14 610 − 14 230 = 380 кВт·ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>300 · 25 + 80 · 35 = 7500 + 2800 = 10 300 ₸. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — всё по 25.</li><li>E — всё по 35.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ступенчатый тариф.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "Teachers should not give extra marks for neat handwriting in a history examination, because the examination is meant to test knowledge of history, not handwriting.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["Teachers should give extra marks to students who work hard.", "History examinations should include questions about handwriting.", "Students with neat handwriting should receive higher marks in every subject.", "All examinations should be typed rather than handwritten.", "In a cooking competition judged on taste, the judges should not give points for how expensive the ingredients were."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Оценивать только то, что проверяется.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: на конкурсе вкуса не давать баллы за внешний вид. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Критерий = цель проверки.</div></div>"}, {"id": 30, "topic": "PS", "text": "A square sheet of paper is folded in half, and then folded in half again in the other direction, giving a smaller square four layers thick. A single hole is punched through all the layers.<br><br><b>How many holes are there when the paper is unfolded?</b>", "options": ["1", "2", "3", "4", "8"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре слоя → четыре отверстия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — восемь слоёв было бы при 3 сгибах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отверстий = слоёв.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

           background:rgba(12,14,17,.78);backdrop-filter:blur(4px);padding:20px}
