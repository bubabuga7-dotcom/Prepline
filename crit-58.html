<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA 2022 · original Q50 · Problem solving</p>", "image": "images/ct-pp/ct079_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина кольца по знаку 1: до P 88 км, от P до знака 1 — 9 км (по знаку 5) → 97 км.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проверяем расстояния между городами на каждом знаке: P→Q 19, Q→R 22, R→S 17, S→T 15, T→P 24.</li><li>На знаке 4: T 9, P 31 → T→P = 22, а P→Q = 21 — не сходится.</li><li>Ошибка в знаке 4 (P должно быть 33). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Знаки 1, 2, 3, 5 дают одинаковые расстояния.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте разности, а не сами числа.</div></div>"}, {"id": 2, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q1 · Principle</p>", "image": "images/ct-pp/ct079_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чем больше ездишь — тем больше платишь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: платят только те, кто смотрит канал. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — по доходу.</li><li>B — наоборот, частые платят меньше.</li><li>E — по цели использования.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Плата по использованию.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q2 · Problem solving</p>", "image": "images/ct-pp/ct079_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Занятые = полная + частичная + самозанятые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мужчины: 55,4 + 2,3 + 8,8 = 66,5.</li><li>Женщины: 28,4 + 20,5 + 2,8 = 51,7.</li><li>Разница 14,8. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропущена категория.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Читайте определение «занятости».</div></div>"}, {"id": 4, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q3 · Flaw</p>", "image": "images/ct-pp/ct079_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше огнетушителей → меньше пожаров в машинах?</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Огнетушитель тушит, но не предотвращает пожар — аргумент связывает число пожаров с их отсутствием. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — про тушение, это не главное.</li><li>A, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Потушить ≠ предотвратить.</div></div>"}, {"id": 5, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q4 · Assumption</p>", "image": "images/ct-pp/ct079_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Оценки растут без роста способностей → учителя лучше натаскивают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: экзамены не стали легче. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — противоречит аргументу.</li><li>C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключите альтернативную причину.</div></div>"}, {"id": 6, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q5 · Assumption</p>", "image": "images/ct-pp/ct079_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Меньше аппетит → похудеют.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: кто меньше хочет есть, тот меньше ест. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Звено «аппетит → еда».</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct079_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разгон до постоянной скорости, резкое замедление, малая постоянная скорость.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только график A. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — начинаются с максимума.</li><li>C — снова ускоряется.</li><li>E — мгновенный сброс без плато.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скорость с нуля.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct079_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Страниц 32k; центр — страницы 16k и 16k + 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>96 и 97: 96 = 16 · 6 → журнал 192 страницы. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>15 и 16, 30 и 31, 63 и 64 — центр должен начинаться с чётной кратной 16.</li><li>50 и 51 — 50 не кратно 16.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центр — половина числа страниц.</div></div>"}, {"id": 9, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q8 · Problem solving</p>", "image": "images/ct-pp/ct079_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сенаж: 1-й укос — только 1 акр по краю, 2-й и 3-й — всё поле.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 · 7 + 10 · 5 + 10 · 4 = 97. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — первый укос со всего поля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Первый укос — только край.</div></div>"}, {"id": 10, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q9 · Main conclusion</p>", "image": "images/ct-pp/ct079_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Использование частных машин нужно ограничить. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — доводы.</li><li>B — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Must be curbed» — вывод.</div></div>"}, {"id": 11, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q10 · Flaw</p>", "image": "images/ct-pp/ct079_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Меньше половины избирателей «за» → поглощения не будет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но часть может воздержаться, и сторона выиграет с меньшинством голосов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Большинство голосовавших ≠ большинство всех.</div></div>"}, {"id": 12, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q11 · Main conclusion</p>", "image": "images/ct-pp/ct079_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Повысить зарплату или рисковать закрытием.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод: если не повысить зарплату, бизнес может закрыться. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — шаги цепочки.</li><li>E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Итог цепочки причин.</div></div>"}, {"id": 13, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct079_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Lenton: 50 + (m − 80); Dunford: 60 + 0,5m.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>50 + m − 80 = 60 + 0,5m → 0,5m = 90 → m = 180. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не равны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уравнение тарифов.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q13 · Problem solving</p>", "image": "images/ct-pp/ct079_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изнутри буквы видны зеркально слева направо.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужны буквы, симметричные по вертикали: M, I, T, A — все симметричны.</li><li>MITA. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>TIME, WEEM — E несимметрична.</li><li>NONA — N несимметрична.</li><li>DOOD — D несимметрична.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок сверху вниз не меняется.</div></div>"}, {"id": 15, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q14 · Problem solving</p>", "image": "images/ct-pp/ct079_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Свинья 85 кг — 2,5 кг, 72 кг — 2,0 кг корма в день.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Всего 4,5 кг; половину заменяет картофель → 2,25 кг. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без замены картофелем.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>50</span><span>50</span></span> — половина корма.</div></div>"}, {"id": 16, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q15 · Assumption</p>", "image": "images/ct-pp/ct079_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Траты не меняют продолжительность жизни → не влияют на здоровье.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: продолжительность жизни — надёжная мера здоровья. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мера должна отражать то, о чём вывод.</div></div>"}, {"id": 17, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q16 · Flaw</p>", "image": "images/ct-pp/ct079_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поиск бесполезен, потому что данные могут быть неточными.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Из того, что данные старые, не следует, что они неточны. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — так и рассуждает автор, это не ошибка.</li><li>A, D, E — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Старое ≠ неверное.</div></div>"}, {"id": 18, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q17 · Weaken</p>", "image": "images/ct-pp/ct079_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Передачи усиливают страх, а боятся больше всего пожилые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если пожилые меньше всех смотрят такие передачи — страх не из-за них. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не ослабляют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разорвите связь «передачи → страх».</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct079_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем сальдо каждого банка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Barkers: отдал 7, получил 7 → 0.</li><li>Floyds: отдал 9, получил 5 → должен 4.</li><li>National: отдал 5, получил 9 → получает 4. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — неверное сальдо.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Взаимные долги взаимозачитываются.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct079_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Расход за месяц = следующее показание − текущее.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ноябрь: 3281 − 3029 = 252 — максимум. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Февраль 246, остальные меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Показание 1-го — начало месяца.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct079_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знаки округлены: «20» → [19,5; 20,5), «18» → [17,5; 18,5).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Между первым и последним знаком чуть больше 1 мили.</li><li>Сейчас ≥ 19,5 − «чуть больше 1» → чуть меньше 18,5. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не учли первый знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Совмещайте все ограничения.</div></div>"}, {"id": 22, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q21 · Drawing a conclusion</p>", "image": "images/ct-pp/ct079_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Только много интересных животных привлекают публику; без публики — нет прибыли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Зоопарки с упором на охрану и несколько редких видов вряд ли прибыльны. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — не сказано.</li><li>B — обратное условие.</li><li>E — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка условий.</div></div>"}, {"id": 23, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q22 · Main conclusion</p>", "image": "images/ct-pp/ct079_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Лучше полностью вегетарианское сельское хозяйство. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — доводы.</li><li>A — уступка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «It would be preferable» — вывод.</div></div>"}, {"id": 24, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q23 · Drawing a conclusion</p>", "image": "images/ct-pp/ct079_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">За 5 лет смертность выше на 25% у принимавших препарат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пятилетних испытаний может быть недостаточно. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — смертность ≠ продолжительность жизни.</li><li>C, D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q24 · Problem solving</p>", "image": "images/ct-pp/ct079_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n человек → n + 1 ложка; с бабушкой n + 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Было 5 пачек за 5 недель, стало 6 → <span class=\"fr\"><span>n + 2</span><span>n + 1</span></span> = <span class=\"fr\"><span>6</span><span>5</span></span>.</li><li>n + 1 = 5 → n = 4. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не то отношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Расход пропорционален ложкам.</div></div>"}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct079_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сгибаем по каждой пунктирной линии и смотрим, где окажутся вырезы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В E полукруг стоит на стороне, где после такого сгиба выреза быть не может. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D получаются сгибом по одной из линий.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Верхний край без выреза.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q26 · Problem solving</p>", "image": "images/ct-pp/ct079_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ближайшие сеансы после 16:30.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Скала 16:50 → 19:05; Миссия 17:30 → 19:20; Empire 17:40 → 19:10.</li><li>Встретятся в 19:20. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — кто-то ещё в зале.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте по самому позднему концу.</div></div>"}, {"id": 28, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q27 · Principle</p>", "image": "images/ct-pp/ct079_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если одному сделать исключение — придётся всем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C: всех магазинных воров надо преследовать, иначе остальные ждут того же. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — ограничение вместимости.</li><li>D — противоположный принцип.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прецедент для всех.</div></div>"}, {"id": 29, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q28 · Flaw</p>", "image": "images/ct-pp/ct079_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Боится полётов → паникует в любом кризисе.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конкретная фобия не означает общую склонность к панике. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Частное ≠ общее.</div></div>"}, {"id": 30, "topic": "PAR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">TSA Specimen · original Q29 · Parallel reasoning</p>", "image": "images/ct-pp/ct079_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Хочешь X — надо Y; я хочу X → сделаю Y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: хочет победить → надо тренироваться; решила победить → будет тренироваться. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — другая структура.</li><li>B — делает Y → будет X.</li><li>C — желание мира ≠ условие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Желание + необходимое условие.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
