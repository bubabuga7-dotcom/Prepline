<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m123_q01.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала перемножим скобки: (√5 − 2)(√5 + 4) = 5 + 2√5 − 8 = 2√5 − 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2√5 − 3)² = 20 + 9 − 12√5 = 29 − 12√5. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — с √2, его тут нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (ab)² = a²b².</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m123_q02.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ветви вниз, вершина (−1; 6), f(0) = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>−x² − 2x + 5: вершина x = −1, f(−1) = 6. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вершина в x = 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x вершины = <span class=\"fr\"><span>−b</span><span>2a</span></span>.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m123_q03.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">by² = x² + 2ax → (x + a)² = by² + a².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = (by² + a²)^{<span class=\"fr\"><span>1</span><span>2</span></span>} − a. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — a под корнем.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полный квадрат.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m123_q04.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 ∞ 4 = 3⁸.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(3⁸) ∞ 2 = (3⁸)⁴ = 3³². Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 3^{8·3}.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y^{2x}: при x = 2 — четвёртая степень.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m123_q05.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол C прямой → A + B = 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin A = <span class=\"fr\"><span>3</span><span>5</span></span> → tg A = <span class=\"fr\"><span>3</span><span>4</span></span> → tg B = <span class=\"fr\"><span>4</span><span>3</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — cos A.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> tg B = ctg A.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m123_q06.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5,4·10⁴ = 0,54·10⁵.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,52 + 0,54 = 2,06 → 2,06·10⁵. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — не стандартный вид.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите к одной степени.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m123_q07.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона 12; шесть равносторонних треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 · <span class=\"fr\"><span>√3</span><span>4</span></span> · 144 = 216√3. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — один треугольник × 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = <span class=\"fr\"><span>3√3</span><span>2</span></span>a².</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m123_q08.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2xy⁻²y⁴ / 4xy = <span class=\"fr\"><span>y</span><span>2</span></span> → в степени −1: <span class=\"fr\"><span>2</span><span>y</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>xy / (2x³y) = <span class=\"fr\"><span>1</span><span>2x²</span></span>.</li><li><span class=\"fr\"><span>2</span><span>y</span></span> · <span class=\"fr\"><span>1</span><span>2x²</span></span> = <span class=\"fr\"><span>1</span><span>x²y</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без степени −1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала упростите скобку.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m123_q09.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма = 10 · <span class=\"fr\"><span>a + 2a</span><span>2</span></span> = 15a = 675 → a = 45.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Последняя 90 = 45 + 9d → d = 5. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — <span class=\"fr\"><span>45</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> От первого к десятому — 9 шагов.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m123_q10.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коэффициент 24 : 16 = <span class=\"fr\"><span>3</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2y − 3 = 15 → y = 9; x + 7 = 18 : 1,5 = 12 → x = 5.</li><li>x + y = 14. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — другое соответствие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наибольшая к наибольшей.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m123_q11.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,3(28) = <span class=\"fr\"><span>328 − 3</span><span>990</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>325</span><span>990</span></span> = <span class=\"fr\"><span>65</span><span>198</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 0,(318).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предпериод → 9 и 0.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m123_q12.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6a + 8(500 − a) = 7,52 · 500 = 3760.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4000 − 2a = 3760 → a = 120 г. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 8%-го раствора 380.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Масса спирта сохраняется.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m123_q13.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сегмент = сектор − треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сектор <span class=\"fr\"><span>150</span><span>360</span></span> · 36π = 15π; треугольник ½ · 36 · sin 150° = 9.</li><li>15π − 9. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — треугольник 6.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> sin 150° = ½.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m123_q14.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.19", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">QR = 2b, QX = ¾ · 2b = 1,5b.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>SX = SP + PQ + QX = −b + a + 1,5b = ½b + a. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак при b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Идите по известным векторам.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m123_q15.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Время Мариан: 54 · 1,8 = 97,2 мин = 1,62 ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>70 · 1,62 ≈ 113 км. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 80% меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> +80% → ×1,8.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m123_q16.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагонали делятся пополам: середина (−1,5; 0,5).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Четвёртая: (2 · (−1,5) + 2; 2 · 0,5 − 1) = (−1; 0). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та середина.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма противоположных вершин одинакова.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m123_q18.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(√a + √b)² = a + b + 2√(ab).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a + b = 0,3; ab = 0,02.</li><li><span class=\"fr\"><span>1</span><span>a</span></span> + <span class=\"fr\"><span>1</span><span>b</span></span> = 0,3 : 0,02 = 15. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — неверное ab.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма обратных = сумма / произведение.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m123_q19.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">16 : 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>160</span><span>36</span></span> = <span class=\"fr\"><span>40</span><span>9</span></span> м/с. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — делили на 3,2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на 3,6.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m123_q20.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый раз площадь × (<span class=\"fr\"><span>1</span><span>3</span></span>² + <span class=\"fr\"><span>2</span><span>3</span></span>²) = <span class=\"fr\"><span>5</span><span>9</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Четвёртый квадрат — три шага: <span class=\"fr\"><span>5</span><span>9</span></span>³ = <span class=\"fr\"><span>125</span><span>729</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — два шага.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте шаги.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m123_q21.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр πr²l + полушар <span class=\"fr\"><span>2</span><span>3</span></span>πr³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>πr²</span><span>3</span></span> · (3l + 2r). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — целый шар.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите <span class=\"fr\"><span>πr²</span><span>3</span></span>.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m123_q22.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">R = <span class=\"fr\"><span>s</span><span>√2</span></span>, r = <span class=\"fr\"><span>s</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>R² : r² = <span class=\"fr\"><span>s²</span><span>2</span></span> : <span class=\"fr\"><span>s²</span><span>4</span></span> = 2 : 1. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — отношение радиусов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площади — квадрат радиусов.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m123_q23.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Периметр 26 · ¼ = 6,5; площадь 32 · (¼)² = 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — площадь × ¼.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь ∝ k².</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m123_q24.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон 2x + 3y + 1 = 0: <span class=\"fr\"><span>−2</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2p − p + 1</span><span>1 − 2p</span></span> = <span class=\"fr\"><span>−2</span><span>3</span></span> → 3p + 3 = 4p − 2 → p = 5. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Параллельные — равные наклоны.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m123_q25.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3x² − 2x − 1 = (3x + 1)(x − 1) → дробь = <span class=\"fr\"><span>1</span><span>x(x − 1)</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 − <span class=\"fr\"><span>1</span><span>x(x − 1)</span></span> = <span class=\"fr\"><span>4x² − 4x − 1</span><span>x(x − 1)</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — x + 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разложите и сократите.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m123_q26.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = 48h; апофема √(36 + h²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>48h = 144 + 24√(36 + h²) → 2h − 6 = √(36 + h²).</li><li>4h² − 24h + 36 = 36 + h² → h = 8. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — h = 6 не подходит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Апофема — через половину стороны.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m123_q27.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">f(2ˣ) = 2 · (2ˣ)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 2^{2x} = 2^{2x+1}. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставляйте g в f.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m123_q29.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём каждой — <span class=\"fr\"><span>1</span><span>125</span></span> → длины <span class=\"fr\"><span>1</span><span>5</span></span> → площади <span class=\"fr\"><span>1</span><span>25</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>100 · 25 = 2500 см². Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — линейно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> k³ → k → k².</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m123_q30.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В каждом маленьком треугольнике две буквы = 180° − угол при пересечении.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Углы пересечений — углы четырёхугольника (360°).</li><li>4 · 180 − 360 = 360°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без вычета.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вертикальные углы.</div></div>"}, {"id": 31, "topic": "M4.14", "text": "<p>Find the gradient of the line joining \\((0, -1)\\) and \\((3, 8)\\).</p>", "image": "", "options": ["\\(\\dfrac{7}{3}\\)", "6", "\\(\\dfrac{1}{3}\\)", "3", "−3"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m = <span class=\"fr\"><span>y₂ − y₁</span><span>x₂ − x₁</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(8 − (−1)) : (3 − 0) = 3. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили координаты.</li><li>C — Δx/Δy вместо Δy/Δx.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте в одном порядке сверху и снизу.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.13", "text": "<p>The bearing of Q from P is 330°.</p><p>What is the bearing of P from Q?</p>", "image": "", "options": ["330°", "300°", "030°", "150°", "240°"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный азимут = исходный ± 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>330° − 180 = 150°. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — направление то же.</li><li>C — вычли из 360 — это отражение, а не обратный азимут.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ всегда тремя цифрами.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
