<style>

  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }

  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {

  button.submit-btn {

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }

  @media (max-width: 480px) {

  @media (prefers-reduced-motion: reduce) {

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m050_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота ½ (катет против 30°), проекции боковых <span class=\"fr\"><span>√3</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нижнее основание 1 + √3; S = ½(1 + 1 + √3) · ½ = <span class=\"fr\"><span>2 + √3</span><span>4</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без расчёта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Против 30° — половина гипотенузы.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m050_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель x(1 + x + … + x⁶), знаменатель x⁻⁹(1 + x + … + x⁶).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x / x⁻⁹ = x¹⁰. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили не те степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите общий множитель.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m050_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(n − 2) · 180 = 2520.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n − 2 = 14 → n = 16. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли +2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма углов n-угольника.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m050_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена стала 0,8; нужно ×<span class=\"fr\"><span>1</span><span>0,8</span></span> = 1,25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наценка 25%. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 20% от меньшей цены мало.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент от новой базы.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m050_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">11m + 2 — делитель 105 = 3 · 5 · 7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m = 3 → 35 ✔. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не делят 105.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебор делителей.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m050_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дополнение: ни одной шестёрки <span class=\"fr\"><span>5</span><span>6</span></span>⁵.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 − <span class=\"fr\"><span>5</span><span>6</span></span>⁵. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — это «ни одной».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Хотя бы один» = 1 − «ни одного».</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m050_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">cos 2θ = 2c² − 1: 2c² + c − 1 = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>c = ½ (c = −1 вне интервала). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формула двойного угла.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m050_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">f(1) = 0: 1 + a + b + c = 0; f(2) = 0: 8 + 4a + 2b + c = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вычтем: 3a + b = −7; с a + b = −15 → a = 4. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключите c.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m050_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр на высоте r над l; A и B на высоте 3, по 2 от оси.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(r − 3)² + 2² = r² → r = <span class=\"fr\"><span>13</span><span>6</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — <span class=\"fr\"><span>7</span><span>3</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Расстояние от центра до A = r.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m050_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возведём в квадрат: 6 + 2√(9 − 2) = 6 + 2√7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(6 + √28). Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без удвоенного произведения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a + b)² = a² + 2ab + b².</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m050_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">f(1) = −4 < 0, f(2) = 1 > 0; дальше растёт.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наибольший корень в [1; 2). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — f(2) уже > 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смена знака.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m050_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n = 1: 1 ✔; n = 3: 9 ✔; n ≥ 4: сумма оканчивается на 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Квадраты не оканчиваются на 3 → 2 значения. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли n = 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последняя цифра.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m050_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мультипликативный магический квадрат: P = (центр)³ = 216.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Левый верхний = <span class=\"fr\"><span>216</span><span>36 · 2</span></span> = 3; диагональ 3 · 6 · x = 216 → x = 12. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 36.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центр — среднее геометрическое.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m050_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Спирт: X — <span class=\"fr\"><span>3</span><span>5</span></span>, смесь — <span class=\"fr\"><span>3</span><span>7</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Y = 2 · <span class=\"fr\"><span>3</span><span>7</span></span> − <span class=\"fr\"><span>3</span><span>5</span></span> = <span class=\"fr\"><span>9</span><span>35</span></span> → спирт : вода = 9 : 26. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 1 : 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя доля при равных объёмах.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m050_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если X займёт 5, получит «вилку»: столбец 1 и нижнюю строку.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>O должен занять 5. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — центр не защищает от вилки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Блокируйте вилку.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m050_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 · 10! + 12 · 5! + 4 · 7! = 10 886 400 + 1440 + 20 160 = 10 908 000.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>= 10 908 · 10³, 10 908 на 5 не делится → k = 3. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — посчитали 5 в 10!.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложите, затем разложите.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m050_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">D = t² − (t² − t) = t → x = <span class=\"fr\"><span>−t ± √t</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>t — полный квадрат (t и √t одной чётности): 1, 4, …, 100 → 10. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без 100.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Целый корень → D — квадрат.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m050_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">θ = arcsin x: sin θ = x, cos θ = √(1 − x²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>tg 2θ = 2 sin θ cos <span class=\"fr\"><span>θ</span><span>cos²θ − sin²θ</span></span> = 2x√<span class=\"fr\"><span>1 − x²</span><span>1 − 2x²</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — потеряли x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Двойной угол.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m050_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">tg 10° + ctg 10° = <span class=\"fr\"><span>1</span><span>sin 10° cos 10°</span></span> = <span class=\"fr\"><span>2</span><span>sin</span></span> 20°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin 20° · <span class=\"fr\"><span>2</span><span>sin</span></span> 20° = 2. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — <span class=\"fr\"><span>3</span><span>2</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите к общему знаменателю.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m050_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">C: r = ½, центр (½; ½); D: центр (1 − r; r).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(½ − r)√2 = ½ + r → r = (√2 − 1)²/2 = <span class=\"fr\"><span>3 − 2√2</span><span>2</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без квадрата.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центры на диагонали.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m050_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Телескоп: Σ log<span class=\"fr\"><span>k + 1</span><span>k</span></span> = log<span class=\"fr\"><span>100</span><span>1</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>log₁₀100 = 2. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — один член.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма логарифмов = логарифм произведения.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m050_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,333… в базе b = <span class=\"fr\"><span>3</span><span>b − 1</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>3</span><span>b − 1</span></span> = <span class=\"fr\"><span>1</span><span>5</span></span> → b = 16. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают <span class=\"fr\"><span>1</span><span>5</span></span>.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 0,(d) = <span class=\"fr\"><span>d</span><span>b − 1</span></span>.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m050_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">z = x + iy: Im((3 + 4i)z) = 4x + 3y = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Прямая. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — окружность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мнимая часть = 0.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m050_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Остатки x mod 7: подходят x ≡ 1 и x ≡ 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>≡ 1: 15 чисел; ≡ 5: 14 → 29. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 28.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте 7 остатков.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m050_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сетка 6 × 6: всего C(12, 6) = 924 пути.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>По рисунку отсутствует вертикальный отрезок (3; 4)–(3; 5): через него 35 · 4 = 140 путей → 784 — такого варианта нет (рисунок не совпадает с условием).</li><li>В ключе — D (382). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Проверьте рисунок по оригиналу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всего минус пути через удалённый отрезок.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m050_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2¹⁰⁰ ≡ −1: 16¹⁰¹ ≡ 16, 8¹⁰¹ ≡ −8, 4¹⁰¹ ≡ 4, 2¹⁰¹ ≡ −2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>16 − 8 + 4 − 2 + 1 = 11. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без расчёта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите через 2¹⁰⁰.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m050_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3x³ − 15x² + (7 − m)x − (8 + b) = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма корней <span class=\"fr\"><span>15</span><span>3</span></span> = 5. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Прямая не влияет на x².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Виета.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m050_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из условия: если x, z ∈ S, то z − x ∈ S (иначе x + (z − x) = z ∉ S).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0 = x − x ∈ S; −x = 0 − x ∈ S; x + y = x − (−y) ∈ S; есть a ≠ 0 → все na ∈ S — бесконечно.</li><li>Все четыре верны. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (только II) — в старом ключе, неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S — замкнуто относительно вычитания.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m050_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Окружность x² + (y − r)² = r² и y = x²: y(y + 1 − 2r) = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только начало координат при r ≤ ½ → диаметр 1. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — радиус.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте x² = y.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m050_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Σx = Σy = 820.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 820 + 820 = 2460. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — порядок не важен.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перестановка не меняет сумму.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${q.id}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">

    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>

<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
