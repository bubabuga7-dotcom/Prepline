<style>

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);

  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;

    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);

  button.submit-btn {

  }

  @media (max-width: 480px) {

    .review-item { flex-wrap: wrap; gap: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "Many people assume that the decline of high-street shops is caused by the growth of online shopping. Yet in towns where parking charges have been abolished, the number of empty shops has fallen, even though online sales have continued to rise. It seems that the cost and difficulty of reaching the town centre matter more to shoppers than the convenience of buying online. Local councils that want to revive their high streets should therefore look first at the price of parking, rather than at ways of competing with internet retailers. After all, a council can set its own parking charges, but it has no control over the growth of online shopping.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Councils that want to revive their high streets should first consider the price of parking.", "Abolishing parking charges reduces the number of empty shops in a town.", "The cost and difficulty of reaching a town centre matter more to shoppers than the convenience of online shopping.", "The growth of online shopping is not the cause of the decline of high-street shops.", "Councils have no control over the growth of online shopping."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пример с отменой платы за парковку → рекомендация советам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: советам стоит начать с цены парковки. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — промежуточные доводы.</li><li>D — слишком сильно.</li><li>E — довод в конце.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore» вводит вывод.</div></div>"}, {"id": 2, "topic": "PS", "text": "An online shop offers the delivery options below. Delivery times are counted in working days (Monday to Friday) starting from the working day after the order. Orders worth more than £50, not counting delivery, receive £5 off any delivery option.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Option</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Delivery time</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Weight limit</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Economy</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£3.50</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 working days</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Standard</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£5.00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">3 working days</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Express</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£8.50</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">next working day</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Heavy</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£12.00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">3 working days</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Heavy Express</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£18.00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">next working day</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20 kg</td></tr></table>On Thursday Nurlan orders goods worth £56 that weigh 6 kg. He needs them by Tuesday of the following week.<br><br><b>What is the least he can pay for delivery?</b>", "options": ["£0.00", "£3.50", "£7.00", "£12.00", "£13.00"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6 кг → только Heavy (12 £) или Heavy Express (18 £).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Heavy: 3 рабочих дня с пятницы — Пт, Пн, Вт → успевает.</li><li>Заказ > 50 £ → скидка 5 £: 12 − 5 = 7 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без скидки.</li><li>B — Economy до 2 кг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала вес, потом срок, потом скидка.</div></div>"}, {"id": 3, "topic": "MC", "text": "It is often said that children who read a great deal will become good writers. But reading alone is not enough. A child who reads widely absorbs vocabulary and sentence patterns, yet without regular practice in writing these remain passive knowledge, which the child recognises but cannot produce. Studies of language learning show that the ability to understand a language always develops ahead of the ability to produce it. Teachers who want to improve their pupils' writing should not simply set more reading; they must give pupils frequent opportunities to write and to receive feedback on what they have written.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Feedback is more important than practice when learning to write.", "The ability to understand a language develops before the ability to produce it.", "Reading widely does not, on its own, make children good writers.", "Children absorb vocabulary and sentence patterns from reading.", "To improve pupils' writing, teachers must give them frequent writing practice with feedback, rather than simply more reading."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чтения мало — нужна практика письма с обратной связью.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: учителя должны давать частую практику письма с разбором. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — промежуточный вывод.</li><li>B, D — доводы.</li><li>A — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация в конце.</div></div>"}, {"id": 4, "topic": "PS", "text": "A cyclist leaves Ashby at 08:30 to ride 60 km to Corton. She rides at 20 km/h for 45 minutes, stops for a 15-minute rest, and then rides the rest of the way at 18 km/h.<br><br><b>At what time does she arrive in Corton?</b>", "options": ["11:30", "11:45", "12:00", "12:15", "12:30"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">45 мин при 20 км/ч = 15 км → 9:15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Отдых до 9:30; осталось 45 км при 18 км/ч = 2,5 ч.</li><li>Прибытие 12:00. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — без отдыха или неверное время.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбейте путь на участки.</div></div>"}, {"id": 5, "topic": "CON", "text": "In a study, volunteers learned a list of 30 words. Half of them then slept for eight hours, while the other half stayed awake for the same period. When tested, those who had slept recalled on average 40% more words than those who had stayed awake. A further group was tested immediately after learning the words, with no delay at all; they recalled about the same number of words as the volunteers who had slept.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Sleep improves people's ability to learn new information.", "People who are tested immediately have better memories than people who stay awake.", "People who sleep eight hours a night have better memories than people who sleep less.", "Sleep seems to protect recently learned information from being forgotten, rather than adding to it.", "Staying awake for eight hours permanently damages the memory."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Спавшие помнят столько же, сколько проверенные сразу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сон не улучшает память, а защищает от забывания. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — противоречит контрольной группе.</li><li>B, C, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравните с группой без задержки.</div></div>"}, {"id": 6, "topic": "PS", "text": "In a class, the ratio of boys to girls is 3 : 5. After 6 more boys join the class, the ratio of boys to girls becomes 3 : 4.<br><br><b>How many students are now in the class?</b>", "options": ["48", "56", "64", "70", "76"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мальчики 3k, девочки 5k; (3k + 6) : 5k = 3 : 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12k + 24 = 15k → k = 8: девочек 40, мальчиков 30.</li><li>Всего 70. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — до прихода 6 мальчиков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Число девочек не изменилось.</div></div>"}, {"id": 7, "topic": "CON", "text": "Every member of the debating team also belongs to either the history society or the science club, but not to both. No member of the science club is in Year 11. Aigerim is in Year 11 and is a member of the debating team.<br><br><b>Which one of the following must be true?</b>", "options": ["Aigerim is a member of the history society.", "Aigerim is the only Year 11 student on the debating team.", "Aigerim is a member of the science club.", "No member of the debating team belongs to the science club.", "All members of the history society are in Year 11."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дебатёр → история ИЛИ наука; в науке нет 11-классников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Айгерим — 11-класс → не в науке → в истории. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D, E — не следуют.</li><li>C — противоречит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключение одного варианта.</div></div>"}, {"id": 8, "topic": "PS", "text": "A family's electricity costs 40p per kWh between 07:00 and 23:00 and 15p per kWh between 23:00 and 07:00. Their washing machine uses 2 kWh per wash and their dishwasher uses 1.4 kWh per run. Each week they do 5 washes and 7 dishwasher runs, all during the day.<br><br><b>How much would they save each week by running all of these at night?</b>", "options": ["£2.50", "£2.97", "£4.95", "£7.92", "£10.89"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В неделю: 5 · 2 + 7 · 1,4 = 19,8 кВт·ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Экономия 40 − 15 = 25p за кВт·ч → 19,8 · 0,25 = 4,95 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — дневная стоимость; B — ночная.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разница тарифов × объём.</div></div>"}, {"id": 9, "topic": "ASM", "text": "The government plans to cut the number of road accidents by lowering the speed limit on country roads from 90 km/h to 70 km/h. But most accidents on country roads happen on bends, where drivers are already travelling well below 70 km/h. The new speed limit will therefore do little to reduce the number of accidents.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Lower speeds on the straight roads leading up to bends would not reduce the number of accidents on the bends.", "Most drivers obey the speed limit on country roads.", "Accidents on bends are more serious than accidents on straight roads.", "The government has not considered any other way of reducing accidents.", "Drivers on country roads travel more slowly than drivers on motorways."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аварии на поворотах, где и так медленно → лимит не поможет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: медленнее на прямых перед поворотами — аварий не меньше. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> А если скорость на подходе важна?</div></div>"}, {"id": 10, "topic": "PS", "text": "Three buses leave the depot together at 06:00 and run round different circular routes, returning to the depot at the end of each circuit. Bus 1 takes 40 minutes per circuit, Bus 2 takes 50 minutes and Bus 3 takes 60 minutes. They run without stopping.<br><br><b>When will all three buses next be at the depot at the same time?</b>", "options": ["08:30", "10:00", "12:00", "16:00", "18:00"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК(40, 50, 60) = 600 мин = 10 ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>06:00 + 10 ч = 16:00. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 4 ч не делится на 50 мин.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Встреча — НОК периодов.</div></div>"}, {"id": 11, "topic": "ASM", "text": "Last winter the city council spent twice as much on gritting icy roads as it did the winter before, yet the number of accidents caused by ice went up. Spending money on gritting clearly does not reduce accidents, so the council should save the money next winter.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Most accidents in winter are caused by ice.", "Last winter was not much colder or icier than the winter before.", "Gritting is the only way of making roads safer in winter.", "The council's budget will be smaller next year.", "Drivers drive more carefully on roads that have not been gritted."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Посыпали вдвое больше, а аварий больше → посыпка бесполезна.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: зима была не холоднее и не обледенелее. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — ослабляет.</li><li>A, C, D — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключите альтернативную причину.</div></div>"}, {"id": 12, "topic": "PS", "text": "A café's lunch deal is one main course (choice of 4), one drink (choice of 3), and either a dessert (choice of 5) or a side salad – but not both.<br><br><b>How many different lunch deals are possible?</b>", "options": ["17", "60", "72", "80", "120"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основное 4 × напиток 3 × (десерт 5 или салат 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 3 · 6 = 72. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без салата; E — десерт и салат вместе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Или» — складываем варианты.</div></div>"}, {"id": 13, "topic": "ASM", "text": "Far fewer young people buy newspapers than did so twenty years ago. However, the number of young people who read news articles online every day has risen sharply. Young people today are therefore no less interested in current affairs than young people were twenty years ago.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Printed newspapers will soon stop being published.", "News published online is more accurate than news in printed newspapers.", "Older people still buy printed newspapers.", "Young people twenty years ago did not read news online.", "Reading news articles online shows at least as much interest in current affairs as buying a newspaper did."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Газет меньше, онлайн-новостей больше → интерес не упал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: чтение новостей онлайн показывает не меньший интерес. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Замена должна быть равноценной.</div></div>"}, {"id": 14, "topic": "PS", "text": "To find the area of a path 1 m wide round a rectangular lawn 10 m by 6 m, I calculate (12 × 8) − (10 × 6) = 36 m².<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A picture 30 cm by 20 cm has a frame 5 cm wide all round, so the area of the frame is (40 × 30) − (30 × 20) = 600 cm².", "A tile 20 cm square covers 400 cm², so 25 tiles cover 1 m².", "A room is 5 m long, 4 m wide and 3 m high, so its volume is 60 m³.", "A field is 10 m by 6 m, so a fence round it is 2 × (10 + 6) = 32 m long.", "A pool is 25 m long, so swimming 8 lengths covers 200 m."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: площадь большого прямоугольника − площадь внутреннего.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: рамка = (40 · 30) − (30 · 20). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — другой метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитание площадей.</div></div>"}, {"id": 15, "topic": "WKN", "text": "Patients at Riverside Hospital who were treated by doctors with more than twenty years' experience had a lower death rate than patients treated by less experienced doctors. This shows that the hospital's younger doctors are less skilled and need more training.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Some of the experienced doctors have recently taken extra training courses.", "At Riverside Hospital, the most seriously ill patients are usually treated by the younger doctors in the emergency department.", "Experienced doctors at the hospital earn much higher salaries than younger doctors.", "The hospital's overall death rate is lower than the national average.", "The hospital employs more younger doctors than experienced ones."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У опытных врачей смертность ниже → молодые хуже.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если самых тяжёлых пациентов лечат молодые — разница не в умении. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не объясняют разницу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разные группы пациентов.</div></div>"}, {"id": 16, "topic": "PS", "text": "A wall is 6.0 m long and 2.5 m high. It has a door 0.9 m wide and 2.0 m high, and a window 1.5 m wide and 1.2 m high, which will not be painted. The wall needs two coats of paint. One litre of paint covers 6 m², and paint is sold only in 2-litre tins.<br><br><b>How many tins of paint are needed?</b>", "options": ["1", "2", "3", "4", "5"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стена 15 м² − дверь 1,8 − окно 1,8 = 11,4 м².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Два слоя: 22,8 м² : 6 = 3,8 л → 2 банки по 2 л. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — один слой.</li><li>C — неверное округление.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Банки — вверх.</div></div>"}, {"id": 17, "topic": "STR", "text": "A company introduced a four-day working week for its office staff, with no change in pay. In the following year, the number of days taken as sick leave fell by a third, and output per employee stayed the same. The managers concluded that the shorter week had improved staff wellbeing without harming productivity.<br><br><b>Which one of the following, if true, would most strengthen the managers' conclusion?</b>", "options": ["Several other companies in the same industry have also introduced a four-day week.", "There had been an unusually severe outbreak of flu in the region in the year before the change.", "The company took on extra staff during the year.", "Office rents in the city rose during the year.", "During the same year, sick leave did not fall at the company's other offices, which kept a five-day week."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четырёхдневка → меньше больничных.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в других офисах той же компании больничных не стало меньше — дело в четырёхдневке. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ослабляет (раньше была эпидемия).</li><li>A, C, D — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрольная группа.</div></div>"}, {"id": 18, "topic": "PS", "text": "Aru, Bek, Dina and Erzhan each ordered a different drink: tea, coffee, juice or water.<br>• Aru did not order a hot drink (tea or coffee).<br>• Bek ordered neither tea nor juice.<br>• Dina ordered neither coffee nor water.<br>• Erzhan did not order water or a hot drink.<br><br><b>Who ordered coffee?</b>", "options": ["Aru", "Bek", "Dina", "Erzhan", "It cannot be determined"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ержан: не вода, не горячее → сок.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дина: не кофе, не вода → чай (сок занят).</li><li>Ару: не горячее → вода. Бек → кофе. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Однозначно определено.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начните с самого жёсткого условия.</div></div>"}, {"id": 19, "topic": "WKN", "text": "Districts with more fast-food restaurants have higher rates of obesity. To reduce obesity, the city should limit the number of fast-food restaurants that may open in each district.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Obesity rates have been rising across the whole country.", "Fast-food restaurants employ many young people.", "Some fast-food restaurants now offer salads.", "Fast-food companies choose to open restaurants in districts where people already eat a lot of fast food.", "Limiting the number of restaurants would reduce the city's income from business taxes."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше фастфуда — больше ожирения → ограничить фастфуд.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если фастфуд открывается там, где люди уже полные, — причина обратная. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 20, "topic": "PS", "text": "The table shows how many students at a school chose each foreign language in 2023 and in 2025.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Language</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">French</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">German</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Chinese</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Spanish</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Turkish</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2023</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">120</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">80</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">40</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">150</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">30</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2025</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">150</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">104</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">56</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">195</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">39</td></tr></table><br><br><b>Which language had the greatest percentage increase from 2023 to 2025?</b>", "options": ["French", "German", "Chinese", "Spanish", "Turkish"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Процент роста.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Франц. 25%, нем. 30%, кит. 40%, исп. 30%, тур. 30%.</li><li>Китайский. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — наибольший рост в штуках.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на исходное значение.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "We surveyed people at the city's gyms and found that 85% of them think the council should spend more money on sports facilities. So most people in the city want more money spent on sports facilities.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not say how many people took part in the survey.", "It confuses what people want with what is good for them.", "It assumes that the council has money available to spend.", "It assumes that people who use gyms never use other sports facilities.", "It draws a conclusion about everyone in the city from people who are especially likely to support sports facilities."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Опрос в спортзалах → вывод о всех жителях.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Выборка из людей, особенно заинтересованных в спорте. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Репрезентативность.</div></div>"}, {"id": 22, "topic": "PS", "text": "A phone costs £480 if paid for in cash. A shop also offers two payment plans:<br>Plan 1: pay 10% of the cash price now, then £39 a month for 12 months.<br>Plan 2: pay £60 now, then £37 a month for 12 months.<br><br><b>How much more than the cash price does the more expensive plan cost?</b>", "options": ["£12", "£24", "£36", "£48", "£60"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">План 1: 48 + 12 · 39 = 516 £; план 2: 60 + 12 · 37 = 504 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дороже план 1: 516 − 480 = 36 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — план 2 (+24).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравните с наличной ценой.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "To be admitted to the university's medicine course, an applicant must have top grades in chemistry. Dana has top grades in chemistry, so she will certainly be admitted.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that chemistry is the most important subject for medicine.", "It treats a condition that must be met for admission as if it were enough on its own to guarantee admission.", "It does not explain why chemistry is required.", "It assumes that the university's entry requirements will not change.", "It assumes that only students with top grades in chemistry apply."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Химия — условие приёма → Дана с химией точно поступит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Необходимое условие принято за достаточное. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Необходимое ≠ достаточное.</div></div>"}, {"id": 24, "topic": "PS", "text": "If each of 6 people shakes hands once with every other person, the number of handshakes is 6 × 5 ÷ 2 = 15.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["If each of 8 teams plays every other team once, the number of games is 8 × 7 ÷ 2 = 28.", "Three people can stand in a line in 3 × 2 × 1 = 6 different orders.", "Six chairs have 6 × 4 = 24 legs.", "Using 5 letters, with repeats allowed, there are 5 × 5 = 25 two-letter codes.", "If each of 8 teams plays every other team twice, home and away, the number of games is 8 × 7 = 56."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n · (n − 1) : 2 — пары без повторов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 8 команд, каждая с каждой раз → 8 · 7 : 2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — дважды, без деления.</li><li>B, C, D — другой метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая пара — один раз.</div></div>"}, {"id": 25, "topic": "FLAW", "text": "The number of cyclists killed on the roads has risen over the past ten years, while the number of drivers killed has fallen. Cycling must therefore now be more dangerous than driving.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that the roads have become busier.", "It ignores the fact that cycling is good for people's health.", "It assumes that all cyclists' deaths are caused by drivers.", "It compares numbers of deaths without taking into account how many people cycle and drive, or how far they travel.", "It relies on figures covering only ten years."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Число смертей сравнивают без числа участников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не учтено, сколько людей ездит на велосипеде и машине. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нужны доли, а не числа.</div></div>"}, {"id": 26, "topic": "PS", "text": "A tank holds 1,200 litres. It starts empty. A pipe fills it at 40 litres per minute, but a drain is also open and empties it at 15 litres per minute. After 20 minutes the drain is closed, and the pipe keeps filling the tank.<br><br><b>How long does it take, in total, to fill the tank?</b>", "options": ["30 minutes", "35 minutes", "37.5 minutes", "40 minutes", "48 minutes"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20 мин: (40 − 15) · 20 = 500 л.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осталось 700 л при 40 л/мин = 17,5 мин.</li><li>Итого 37,5 мин. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без стока; E — сток всё время.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разные этапы — разные скорости.</div></div>"}, {"id": 27, "topic": "FLAW", "text": "All good chefs can make bread. Marat can make bread. So Marat is a good chef.<br><br><b>Which one of the following contains the same flaw as the above argument?</b>", "options": ["All dogs are animals. Rex is a dog. So Rex is an animal.", "Some teachers are musicians. Some musicians are poets. So some teachers are poets.", "No fish can fly. This creature can fly. So it is not a fish.", "All good chefs can make bread. Marat is not a good chef. So Marat cannot make bread.", "All successful novelists keep a diary. Aliya keeps a diary. So Aliya is a successful novelist."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все A — B; X — B → X — A (обращение).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: все успешные писатели ведут дневник; Алия ведёт → успешна. Та же ошибка. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — верные выводы.</li><li>D — другая ошибка.</li><li>B — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте буквы.</div></div>"}, {"id": 28, "topic": "PS", "text": "Sanzhar must choose exactly three modules. Each module meets once a week, as shown below.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Module</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Day</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Time</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Economics</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Monday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10:00–12:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Biology</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Monday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">13:00–15:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">History</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Tuesday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">14:00–16:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Physics</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Wednesday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:00–11:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Law</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Wednesday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">13:00–15:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Art</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Thursday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10:00–12:00</td></tr></table>He must take Physics. He cannot take two modules on the same day. He works on Tuesday afternoons. At least one of his modules must be in the afternoon.<br><br><b>Which one of the following could be his choice of modules?</b>", "options": ["Physics, History and Art", "Physics, Law and Art", "Physics, Economics and Biology", "Physics, Biology and Art", "Physics, Economics and Art"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Физика (ср); не два в один день; вторник после обеда занят; хоть один после обеда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: физика, биология (пн, после обеда), искусство (чт). Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — история во вторник после обеда.</li><li>B — два в среду.</li><li>C — два в понедельник.</li><li>E — нет послеобеденного.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте каждое условие.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "Scientists who receive money from a company should not be allowed to judge the safety of that company's products, even if they are completely honest, because the public must be able to trust that such judgements are independent.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["A referee should not officiate at a match in which his brother is playing.", "A judge who makes a serious mistake should be removed from office.", "Doctors should tell patients about all the side effects of their medicine.", "Companies should pay scientists well so that they do honest work.", "Teachers should mark their own students' exams because they know them best."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Даже честный человек не должен судить при конфликте интересов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: судья не должен судить матч с участием брата. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Видимость независимости.</div></div>"}, {"id": 30, "topic": "PS", "text": "A clock with an hour hand and a minute hand shows exactly 3:30.<br><br><b>What is the smaller angle between the two hands?</b>", "options": ["60°", "75°", "90°", "105°", "120°"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Минутная на 180°, часовая — 3,5 · 30° = 105°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>180 − 105 = 75°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — часовая будто на 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая стрелка тоже движется.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  .pl-bar .pl-count { font: 500 13px 'Inter', system-ui, sans-serif; opacity: .75; }
  .pl-bar .pl-submit {
    font: 600 14px 'Inter', system-ui, sans-serif; color: #fff; cursor: pointer; border: 0;
    background: linear-gradient(90deg,#8EADD2,#8EADD2,#C9AA6A);
    padding: 11px 26px; border-radius: 999px;
  }
  .pl-noselect, .pl-noselect * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  @media print { body.pl-noprint * { display: none !important; } }
</style>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
