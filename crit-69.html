<script>
const questions = [{"id": 1, "text": "Many people assume that the decline of high-street shops is caused by the growth of online shopping. Yet in towns where parking charges have been abolished, the number of empty shops has fallen, even though online sales have continued to rise. It seems that the cost and difficulty of reaching the town centre matter more to shoppers than the convenience of buying online. Local councils that want to revive their high streets should therefore look first at the price of parking, rather than at ways of competing with internet retailers. After all, a council can set its own parking charges, but it has no control over the growth of online shopping.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Councils that want to revive their high streets should first consider the price of parking.", "Abolishing parking charges reduces the number of empty shops in a town.", "The cost and difficulty of reaching a town centre matter more to shoppers than the convenience of online shopping.", "The growth of online shopping is not the cause of the decline of high-street shops.", "Councils have no control over the growth of online shopping."], "correct": 0, "explain": "The recommendation introduced by 'therefore' is what the passage is trying to establish. C is an intermediate conclusion drawn from the evidence and used to support A. D overstates the passage, which only says other factors matter more. B summarises the evidence, and E is an additional reason given after the conclusion."}, {"id": 2, "text": "An online shop offers the delivery options below. Delivery times are counted in working days (Monday to Friday) starting from the working day after the order. Orders worth more than £50, not counting delivery, receive £5 off any delivery option.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Option</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Delivery time</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Weight limit</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Economy</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£3.50</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 working days</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Standard</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£5.00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">3 working days</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Express</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£8.50</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">next working day</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Heavy</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£12.00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">3 working days</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20 kg</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Heavy Express</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£18.00</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">next working day</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20 kg</td></tr></table>On Thursday Nurlan orders goods worth £56 that weigh 6 kg. He needs them by Tuesday of the following week.<br><br><b>What is the least he can pay for delivery?</b>", "options": ["£0.00", "£3.50", "£7.00", "£12.00", "£13.00"], "correct": 2, "explain": "6 kg rules out Economy, Standard and Express. Heavy takes 3 working days: Friday, Monday, Tuesday, so it arrives in time. With £5 off (order over £50) it costs £7.00. £3.50 is Express with the discount, but Express does not take 6 kg; £13.00 is Heavy Express."}, {"id": 3, "text": "It is often said that children who read a great deal will become good writers. But reading alone is not enough. A child who reads widely absorbs vocabulary and sentence patterns, yet without regular practice in writing these remain passive knowledge, which the child recognises but cannot produce. Studies of language learning show that the ability to understand a language always develops ahead of the ability to produce it. Teachers who want to improve their pupils' writing should not simply set more reading; they must give pupils frequent opportunities to write and to receive feedback on what they have written.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Feedback is more important than practice when learning to write.", "The ability to understand a language develops before the ability to produce it.", "Reading widely does not, on its own, make children good writers.", "Children absorb vocabulary and sentence patterns from reading.", "To improve pupils' writing, teachers must give them frequent writing practice with feedback, rather than simply more reading."], "correct": 4, "explain": "The final sentence is the recommendation the whole passage supports. C ('reading alone is not enough') is an intermediate conclusion that leads to it. D and B are reasons. A is never claimed: the passage asks for both practice and feedback."}, {"id": 4, "text": "A cyclist leaves Ashby at 08:30 to ride 60 km to Corton. She rides at 20 km/h for 45 minutes, stops for a 15-minute rest, and then rides the rest of the way at 18 km/h.<br><br><b>At what time does she arrive in Corton?</b>", "options": ["11:30", "11:45", "12:00", "12:15", "12:30"], "correct": 2, "explain": "In 45 minutes at 20 km/h she covers 15 km, leaving 45 km. At 18 km/h that takes 2.5 hours. Total time: 45 min + 15 min + 2 h 30 min = 3 h 30 min, so she arrives at 12:00."}, {"id": 5, "text": "In a study, volunteers learned a list of 30 words. Half of them then slept for eight hours, while the other half stayed awake for the same period. When tested, those who had slept recalled on average 40% more words than those who had stayed awake. A further group was tested immediately after learning the words, with no delay at all; they recalled about the same number of words as the volunteers who had slept.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Sleep improves people's ability to learn new information.", "People who are tested immediately have better memories than people who stay awake.", "People who sleep eight hours a night have better memories than people who sleep less.", "Sleep seems to protect recently learned information from being forgotten, rather than adding to it.", "Staying awake for eight hours permanently damages the memory."], "correct": 3, "explain": "Those who slept remembered about as much as people tested at once, while those who stayed awake remembered less. So sleep seems to prevent forgetting rather than improve recall beyond the original level. A is wrong because the learning happened before the sleep. E and C go far beyond one study. B talks about better memories as a personal trait, but the groups only differ in the delay before the test."}, {"id": 6, "text": "In a class, the ratio of boys to girls is 3 : 5. After 6 more boys join the class, the ratio of boys to girls becomes 3 : 4.<br><br><b>How many students are now in the class?</b>", "options": ["48", "56", "64", "70", "76"], "correct": 3, "explain": "Let there be 3x boys and 5x girls. Then (3x + 6) : 5x = 3 : 4, so 12x + 24 = 15x and x = 8. Originally 24 boys and 40 girls (64 students); now 30 boys and 40 girls, 70 in total. 64 is the size before the new boys joined."}, {"id": 7, "text": "Every member of the debating team also belongs to either the history society or the science club, but not to both. No member of the science club is in Year 11. Aigerim is in Year 11 and is a member of the debating team.<br><br><b>Which one of the following must be true?</b>", "options": ["Aigerim is a member of the history society.", "Aigerim is the only Year 11 student on the debating team.", "Aigerim is a member of the science club.", "No member of the debating team belongs to the science club.", "All members of the history society are in Year 11."], "correct": 0, "explain": "As a debater, Aigerim belongs to the history society or the science club. Being in Year 11, she cannot be in the science club, so she must be in the history society. C contradicts this. E, D and B may or may not be true: nothing tells us about other students."}, {"id": 8, "text": "A family's electricity costs 40p per kWh between 07:00 and 23:00 and 15p per kWh between 23:00 and 07:00. Their washing machine uses 2 kWh per wash and their dishwasher uses 1.4 kWh per run. Each week they do 5 washes and 7 dishwasher runs, all during the day.<br><br><b>How much would they save each week by running all of these at night?</b>", "options": ["£2.50", "£2.97", "£4.95", "£7.92", "£10.89"], "correct": 2, "explain": "Energy used: 5 × 2 + 7 × 1.4 = 19.8 kWh. Each kWh is 25p cheaper at night, so the saving is 19.8 × 25p = 495p = £4.95. £7.92 is the daytime cost and £2.97 the night-time cost."}, {"id": 9, "text": "The government plans to cut the number of road accidents by lowering the speed limit on country roads from 90 km/h to 70 km/h. But most accidents on country roads happen on bends, where drivers are already travelling well below 70 km/h. The new speed limit will therefore do little to reduce the number of accidents.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Lower speeds on the straight roads leading up to bends would not reduce the number of accidents on the bends.", "Most drivers obey the speed limit on country roads.", "Accidents on bends are more serious than accidents on straight roads.", "The government has not considered any other way of reducing accidents.", "Drivers on country roads travel more slowly than drivers on motorways."], "correct": 0, "explain": "The argument treats the speed on the bend as the only speed that matters. If slower driving on the approach made drivers take bends more safely, the new limit could reduce accidents after all, so A must be assumed. B is not needed (if drivers ignored the limit, the conclusion would be even stronger). C, D and E are irrelevant to whether the limit would work."}, {"id": 10, "text": "Three buses leave the depot together at 06:00 and run round different circular routes, returning to the depot at the end of each circuit. Bus 1 takes 40 minutes per circuit, Bus 2 takes 50 minutes and Bus 3 takes 60 minutes. They run without stopping.<br><br><b>When will all three buses next be at the depot at the same time?</b>", "options": ["08:30", "10:00", "12:00", "16:00", "18:00"], "correct": 3, "explain": "We need the smallest time that is a multiple of 40, 50 and 60 minutes: 600 minutes = 10 hours. 06:00 + 10 hours = 16:00. 08:30 adds 40 + 50 + 60 minutes; 12:00 is a multiple of 40 and 60 only."}, {"id": 11, "text": "Last winter the city council spent twice as much on gritting icy roads as it did the winter before, yet the number of accidents caused by ice went up. Spending money on gritting clearly does not reduce accidents, so the council should save the money next winter.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Most accidents in winter are caused by ice.", "Last winter was not much colder or icier than the winter before.", "Gritting is the only way of making roads safer in winter.", "The council's budget will be smaller next year.", "Drivers drive more carefully on roads that have not been gritted."], "correct": 1, "explain": "If last winter had far more ice, accidents could rise even though gritting prevented many of them. The argument only works if the two winters are comparable, so B must be assumed. E would actually support a different argument; C, A and D are not needed for the conclusion."}, {"id": 12, "text": "A café's lunch deal is one main course (choice of 4), one drink (choice of 3), and either a dessert (choice of 5) or a side salad – but not both.<br><br><b>How many different lunch deals are possible?</b>", "options": ["17", "60", "72", "80", "120"], "correct": 2, "explain": "The third item has 5 + 1 = 6 choices (any of 5 desserts, or the salad). So 4 × 3 × 6 = 72. 60 forgets the salad option; 17 adds instead of multiplying."}, {"id": 13, "text": "Far fewer young people buy newspapers than did so twenty years ago. However, the number of young people who read news articles online every day has risen sharply. Young people today are therefore no less interested in current affairs than young people were twenty years ago.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Printed newspapers will soon stop being published.", "News published online is more accurate than news in printed newspapers.", "Older people still buy printed newspapers.", "Young people twenty years ago did not read news online.", "Reading news articles online shows at least as much interest in current affairs as buying a newspaper did."], "correct": 4, "explain": "The argument replaces one measure of interest (buying newspapers) with another (reading online). For the conclusion to follow, reading online must count as evidence of at least the same level of interest. B, C and A are irrelevant; D is simply a fact about the past and does not help the conclusion follow."}, {"id": 14, "text": "To find the area of a path 1 m wide round a rectangular lawn 10 m by 6 m, I calculate (12 × 8) − (10 × 6) = 36 m².<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A picture 30 cm by 20 cm has a frame 5 cm wide all round, so the area of the frame is (40 × 30) − (30 × 20) = 600 cm².", "A tile 20 cm square covers 400 cm², so 25 tiles cover 1 m².", "A room is 5 m long, 4 m wide and 3 m high, so its volume is 60 m³.", "A field is 10 m by 6 m, so a fence round it is 2 × (10 + 6) = 32 m long.", "A pool is 25 m long, so swimming 8 lengths covers 200 m."], "correct": 0, "explain": "The example adds the border to both dimensions, works out the larger area and subtracts the inner area. A does exactly the same with the frame. D uses the same numbers but works out a perimeter, a different method."}, {"id": 15, "text": "Patients at Riverside Hospital who were treated by doctors with more than twenty years' experience had a lower death rate than patients treated by less experienced doctors. This shows that the hospital's younger doctors are less skilled and need more training.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Some of the experienced doctors have recently taken extra training courses.", "At Riverside Hospital, the most seriously ill patients are usually treated by the younger doctors in the emergency department.", "Experienced doctors at the hospital earn much higher salaries than younger doctors.", "The hospital's overall death rate is lower than the national average.", "The hospital employs more younger doctors than experienced ones."], "correct": 1, "explain": "If younger doctors treat the sickest patients, a higher death rate among their patients is expected even if they are just as skilled. That gives another explanation for the figures. C, D and E do not affect the comparison, and A concerns the other group of doctors."}, {"id": 16, "text": "A wall is 6.0 m long and 2.5 m high. It has a door 0.9 m wide and 2.0 m high, and a window 1.5 m wide and 1.2 m high, which will not be painted. The wall needs two coats of paint. One litre of paint covers 6 m², and paint is sold only in 2-litre tins.<br><br><b>How many tins of paint are needed?</b>", "options": ["1", "2", "3", "4", "5"], "correct": 1, "explain": "Wall: 6.0 × 2.5 = 15 m². Door 1.8 m² and window 1.8 m² leave 11.4 m². Two coats: 22.8 m², needing 22.8 ÷ 6 = 3.8 litres, so 2 tins (4 litres). Without subtracting the door and window you would need 5 litres and 3 tins; with only one coat, 1 tin."}, {"id": 17, "text": "A company introduced a four-day working week for its office staff, with no change in pay. In the following year, the number of days taken as sick leave fell by a third, and output per employee stayed the same. The managers concluded that the shorter week had improved staff wellbeing without harming productivity.<br><br><b>Which one of the following, if true, would most strengthen the managers' conclusion?</b>", "options": ["Several other companies in the same industry have also introduced a four-day week.", "There had been an unusually severe outbreak of flu in the region in the year before the change tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Physics</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Wednesday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:00–11:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Law</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Wednesday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">13:00–15:00</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Art</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Thursday</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10:00–12:00</td></tr></table>He must take Physics. He cannot take two modules on the same day. He works on Tuesday afternoons. At least one of his modules must be in the afternoon.<br><br><b>Which one of the following could be his choice of modules?</b>", "options": ["Physics, History and Art", "Physics, Law and Art", "Physics, Economics and Biology", "Physics, Biology and Art", "Physics, Economics and Art"], "correct": 3, "explain": "A includes History on Tuesday afternoon, when he works. B and C each put two modules on one day. E has no afternoon module. D (Wednesday morning, Monday afternoon, Thursday morning) meets every rule."}, {"id": 29, "text": "Scientists who receive money from a company should not be allowed to judge the safety of that company's products, even if they are completely honest, because the public must be able to trust that such judgements are independent.<br><br><b>Which one of the following best illustrates the principle underlying the above argument?</b>", "options": ["A referee should not officiate a let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
        ${q.explain ? `<details style="margin-top:8px;font-size:14px;line-height:1.55"><summary style="cursor:pointer;color:var(--gold,#C9A227);font-weight:600">Why ${'ABCDE'[q.correct]}?</summary><div style="margin-top:6px;opacity:.9">${q.explain}</div></details>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  .pl-scroll .pl-q:last-of-type { border-bottom: 0; }
  .pl-scroll .pl-num {
    font: 700 12px 'Inter', system-ui, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; opacity: .5; margin-bottom: 8px;
  }
  .pl-scroll .pl-img {
    max-width: 100%; border-radius: 8px; margin: 4px 0 12px;
    background: #fff; padding: 4px; -webkit-user-drag: none; user-drag: none;
    pointer-events: none;
  }
  .pl-scroll .pl-text { margin-bottom: 12px; line-height: 1.55; }
  .pl-scroll .pl-opts { display: flex; flex-direction: column; gap: 7px; }
  .pl-scroll .pl-opt {
    text-align: left; font: 400 14.5px 'Inter', system-ui, sans-serif; color: inherit;
    cursor: pointer; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 14px;
    transition: border-color .15s, background .15s;
  }
  .pl-scroll .pl-opt:hover { border-color: rgba(167,139,250,0.55); }
  .pl-scroll .pl-opt.sel {
    background: rgba(167,139,250,0.18); border-color: rgba(167,139,250,0.85);
  }
  .pl-bar {
    position: sticky; bottom: 0; display: flex; gap: 14px; align-items: center;
    justify-content: space-between; margin-top: 8px; padding: 12px 4px;
    background: rgba(10,14,30,0.9); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .pl-bar .pl-count { font: 500 13px 'Inter', system-ui, sans-serif; opacity: .75; }
  .pl-bar .pl-submit {
    font: 600 14px 'Inter', system-ui, sans-serif; color: #fff; cursor: pointer; border: 0;
    background: linear-gradient(90deg,#60A5FA,#A78BFA,#F472B6);
    padding: 11px 26px; border-radius: 999px;
  }
  .pl-noselect, .pl-noselect * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  @media print { body.pl-noprint * { display: none !important; } }
</style>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

           background:rgba(6,10,20,.78);backdrop-filter:blur(4px);padding:20px}

  #pl-gate h3{font-family:Sora,Inter,sans-serif;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}

  #pl-gate .go{background:#C9A227;color:#10192C}
  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6ECF7}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
