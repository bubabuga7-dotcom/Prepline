<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormFix</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1d2a26;--muted:#5d6b66;--line:#d6dedb;--accent:#0f766e;--red:#b42318;--green:#067647}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--accent);color:#fff;padding:16px}
header h1{margin:0;font-size:24px}
header p{margin:0;opacity:.9}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 16px 0}
nav button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
main{padding:16px;max-width:900px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
h2{margin:0 0 12px;font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;min-width:160px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.small{padding:5px 10px;font-size:13px}
.btn.red{background:var(--red)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;color:var(--muted)}
.msg{margin-top:12px;padding:10px;border-radius:6px}
.msg.ok{background:#e7f6ec;color:var(--green)}
.msg.err{background:#fdecea;color:var(--red)}
.sql{font-family:Consolas,monospace;font-size:13px;background:#eef2f1;padding:8px;border-radius:6px;margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>DormFix</h1><p>Dormitory repair reports</p></header>

<nav>
  <button data-tab="find" class="on">Find reports</button>
  <button data-tab="new">New report</button>
  <button data-tab="stats">Statistics</button>
</nav>

<main>
  <section id="find">
    <h2>Find reports</h2>
    <div class="row">
      <label>Dormitory <select id="fDorm"></select></label>
      <button class="btn" id="btnFind">Find</button>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>ID</th><th>Category</th><th>Location</th><th>Status</th><th>New status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="msg" id="msgFind" hidden></div>
    <div class="sql" id="sqlFind"></div>
  </section>

  <section id="new" hidden>
    <h2>New report</h2>
    <div class="row">
      <label>Student <select id="nStudent"><option>U001</option><option>U002</option><option>U003</option><option>U004</option><option>U005</option></select></label>
      <label>Dormitory <select id="nDorm"></select></label>
      <label>Category <select id="nCat"></select></label>
    </div>
    <div class="row">
      <label>Location <input id="nLoc" placeholder="Floor 3, room 312"></label>
      <label>Problem <input id="nDesc" placeholder="Light does not turn on" style="min-width:260px"></label>
    </div>
    <button class="btn" id="btnSend">Send report</button>
    <div class="msg" id="msgNew" hidden></div>
    <div class="sql" id="sqlNew" hidden></div>
  </section>

  <section id="stats" hidden>
    <h2>Reports by category</h2>
    <button class="btn" id="btnStats">Show statistics</button>
    <div class="wrap" style="margin-top:12px"><table style="min-width:0">
      <thead><tr><th>Category</th><th>Total reports</th></tr></thead>
      <tbody id="statRows"></tbody>
    </table></div>
    <div class="sql">SELECT category_id, COUNT(*) AS total_reports FROM report GROUP BY category_id;</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// connection to the DormFix database in Supabase
const db = supabase.createClient("https://ghtdjqblyqwvwvkdzffg.supabase.co", "sb_publishable_7uDUdBAkWu9C-6ZHXwa9XA_QymGZTzf");
const $ = id => document.getElementById(id);
const STATUSES = ["Submitted", "Assigned", "In progress", "Resolved", "Closed"];
let catName = {};

function message(el, text, ok) { el.hidden = false; el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach(s => s.hidden = s.id !== b.dataset.tab);
});

async function loadLists() {
  const dorms = (await db.from("dormitory").select("*")).data || [];
  const cats = (await db.from("category").select("*")).data || [];
  dorms.forEach(d => { $("fDorm").add(new Option(d.name, d.dormitory_id)); $("nDorm").add(new Option(d.name, d.dormitory_id)); });
  cats.forEach(c => { catName[c.category_id] = c.name; $("nCat").add(new Option(c.name, c.category_id)); });
}

// 1. SELECT with WHERE
async function findReports() {
  const dorm = $("fDorm").value;
  const { data, error } = await db.from("report").select("*").eq("dormitory_id", dorm).order("report_id");
  $("sqlFind").textContent = "SELECT * FROM report WHERE dormitory_id = '" + dorm + "';";
  if (error) return message($("msgFind"), "Error: " + error.message, false);
  $("rows").innerHTML = "";
  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.report_id}</td><td>${catName[r.category_id]}</td><td>${r.location_detail}</td><td>${r.status}</td>
      <td><select>${STATUSES.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <button class="btn small">Update</button></td><td><button class="btn small red">Delete</button></td>`;
    const buttons = tr.querySelectorAll("button");
    buttons[0].onclick = () => updateStatus(r.report_id, tr.querySelector("select").value);
    buttons[1].onclick = () => deleteReport(r.report_id, buttons[1]);
    $("rows").appendChild(tr);
  });
}

// 2. UPDATE
async function updateStatus(id, status) {
  const { error } = await db.from("report").update({ status: status, updated_at: new Date().toISOString() }).eq("report_id", id);
  if (error) return message($("msgFind"), "Error: " + error.message, false);
  await findReports();
  $("sqlFind").textContent = "UPDATE report SET status = '" + status + "' WHERE report_id = '" + id + "';";
  message($("msgFind"), "Report " + id + " updated: status is now " + status + ".", true);
}

// 3. DELETE (second click confirms)
async function deleteReport(id, btn) {
  if (btn.textContent !== "Sure?") { btn.textContent = "Sure?"; return; }
  const { error } = await db.from("report").delete().eq("report_id", id);
  if (error) return message($("msgFind"), "Report " + id + " cannot be deleted because other records are linked to it.", false);
  await findReports();
  $("sqlFind").textContent = "DELETE FROM report WHERE report_id = '" + id + "';";
  message($("msgFind"), "Report " + id + " deleted.", true);
}

// 4. INSERT
async function sendReport() {
  const loc = $("nLoc").value.trim(), desc = $("nDesc").value.trim();
  if (!loc || !desc) return message($("msgNew"), "Please fill in Location and Problem.", false);
  const last = (await db.from("report").select("report_id").order("report_id", { ascending: false }).limit(1)).data[0];
  const id = "DF-" + (Number(last.report_id.slice(3)) + 1);
  const now = new Date().toISOString();
  const { error } = await db.from("report").insert({
    report_id: id, student_id: $("nStudent").value, dormitory_id: $("nDorm").value, category_id: $("nCat").value,
    location_detail: loc, description: desc, status: "Submitted", created_at: now, updated_at: now });
  if (error) return message($("msgNew"), "Error: " + error.message, false);
  $("nLoc").value = ""; $("nDesc").value = "";
  message($("msgNew"), "Report " + id + " sent. Status: Submitted.", true);
  $("sqlNew").hidden = false;
  $("sqlNew").textContent = "INSERT INTO report (report_id, student_id, dormitory_id, category_id, location_detail, description, status) VALUES ('" + id + "', ...);";
}

// 5. COUNT + GROUP BY
async function showStats() {
  const { data, error } = await db.from("report_stats").select("*").order("category_id");
  if (error) return;
  $("statRows").innerHTML = data.map(s => `<tr><td>${catName[s.category_id]}</td><td>${s.total_reports}</td></tr>`).join("");
}

$("btnFind").onclick = findReports;
$("btnSend").onclick = sendReport;
$("btnStats").onclick = showStats;
loadLists().then(findReports);
</script>
</body>
</html>
