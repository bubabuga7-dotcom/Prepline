<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m004_q01.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 4, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем всё на простые множители 2 и 5 и смотрим на знаки показателей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10<sup>c−2d</sup> = 2<sup>c−2d</sup> · 5<sup>c−2d</sup>; 20<sup>2c+d</sup> = 2<sup>4c+2d</sup> · 5<sup>2c+d</sup>; 8<sup>c</sup> = 2<sup>3c</sup>; 125<sup>c+d</sup> = 5<sup>3c+3d</sup>.</li><li>Степень 2: (c − 2d) + (4c + 2d) − 3c = 2c.</li><li>Степень 5: (c − 2d) + (2c + d) − (3c + 3d) = −4d.</li><li>2<sup>2c</sup> · 5<sup>−4d</sup> целое ⇔ 2c ≥ 0 и −4d ≥ 0 → c > 0 и d < 0 (оба ненулевые).</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Варианты с c < 0 дают дробь <span class=\"fr\"><span>1</span><span>2<sup>…</sup></span></span>.</li><li>Варианты с d > 0 дают 5 в знаменателе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Числа вида 2<sup>a</sup>·5<sup>b</sup> — целые, только если оба показателя ≥ 0.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m004_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">b = √5 / c, подставляем c = <span class=\"fr\"><span>1</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>b = √5 ÷ <span class=\"fr\"><span>1</span><span>3</span></span> = 3√5.</li><li>a = b³ = 27 · 5√5 = 135√5 ≈ 301,87.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — умножили на c вместо деления.</li><li>C, D — ошибка в кубе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на <span class=\"fr\"><span>1</span><span>3</span></span> = умножение на 3.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m004_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим знаменатель в квадрат и сокращаем степени.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2de³f)² = 4d²e⁶f².</li><li><span class=\"fr\"><span>4d³e⁴f²</span><span>4d²e⁶f²</span></span> = d · e<sup>−2</sup>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — лишняя 2.</li><li>C — знак показателя e.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>e⁴</span><span>e⁶</span></span> = e<sup>−2</sup>.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m004_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим радиус; хорда стягивает оставшуюся четверть окружности (90°).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12π = ¾ · 2πr → r = 8.</li><li>Концы дуги и центр образуют угол 360° − 270° = 90°.</li><li>Хорда = r√2 = 8√2.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (8) — радиус.</li><li>E (16) — диаметр.</li><li>A, B — неверный радиус.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Кратчайшее расстояние — хорда, а не дуга.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m004_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый маленький куб имеет ребро <span class=\"fr\"><span>b</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Исходная поверхность: 6b².</li><li>Маленький куб: 6 · <span class=\"fr\"><span>b</span><span>2</span></span>² = 1,5b²; восемь: 12b².</li><li>Разница: 6b².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (12b²) — суммарная площадь, а не разница.</li><li>A, B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разрезы добавляют новые грани — площадь растёт.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m004_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">DF = 2 делим в отношении 4 : 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>DE = <span class=\"fr\"><span>8</span><span>13</span></span>, EF = <span class=\"fr\"><span>18</span><span>13</span></span>.</li><li>До середины EF: <span class=\"fr\"><span>8</span><span>13</span></span> + <span class=\"fr\"><span>9</span><span>13</span></span> = <span class=\"fr\"><span>17</span><span>13</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — только половина EF.</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 + 9 = 13 частей.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m004_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре равных угла → прямоугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма углов 360° → каждый 90° (III ✓).</li><li>Стороны не обязаны быть равными (I ✗).</li><li>Диагонали прямоугольника не обязательно перпендикулярны (II ✗).</li><li>Верно только III → D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — I и II верны только для квадрата.</li><li>B, C — неверно.</li><li>A — III верно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не путайте прямоугольник с квадратом. (В исходном ключе был E — исправлено.)</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m004_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем знаменатели дробей-«хвостов».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A = 2014 + <span class=\"fr\"><span>1</span><span>2014</span></span>.</li><li>У B знаменатель 2014 + <span class=\"fr\"><span>1</span><span>2014</span></span> > 2014 → B < A.</li><li>У C знаменатель 2014 + <span class=\"fr\"><span>1</span><span>2014 + <span class=\"fr\"><span>1</span><span>2014</span></span></span></span> — меньше, чем у B, но больше 2014 → B < C < A.</li><li>Порядок: B, C, A → вариант C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (C, B, A) — перепутано сравнение B и C.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Больше знаменатель — меньше дробь. (Исходный ключ D — исправлено.)</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m004_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем целые решения x² + y² = 169 с отрицательными x и y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>169 = 25 + 144 = 5² + 12².</li><li>Точки (−5; −12) и (−12; −5).</li><li>Ровно две.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — точек конечное число.</li><li>A, B, D — неверный счёт.</li><li>(−13; 0) не подходит: 0 не отрицательно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 5-12-13 — пифагорова тройка. (Исходный ключ E — исправлено.)</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m004_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем u = s − 1 и решаем f(u) = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>u² + 2u − 2 = 1 → u² + 2u − 3 = 0 → u = 1 или −3.</li><li>s = u + 1 = 2 или −2.</li><li>Наименьшее: −2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−3) — это u.</li><li>D, E — неверно / не наименьшее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте вернуться от u к s.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m004_q12.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 7, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем коэффициенты (ax + b)³ = a³x³ + 3a²bx² + 3ab²x + b³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a³ = 8 → a = 2.</li><li>b³ = −3√3 → b = −√3.</li><li>3a²b = 3 · 4 · (−√3) = −12√3 = −p → p = 12√3.</li></ol><div class=\"ex-a\">Ответ: <b>H</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак (−p = −12√3).</li><li>B, C, F, G — неверный коэффициент.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 3ab² = 3 · 2 · 3 = 18 ✓.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m004_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работаем в процентах от всех членов клуба.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Женщины 60%, мужчины 40%.</li><li>Мужчины-крикетисты: ⅖ · 40% = 16%.</li><li>Женщины — ⅔ крикетистов, значит, мужчины — ⅓ → крикетистов 48%, женщин среди них 32%.</li><li>Женщины-теннисистки: 60 − 32 = 28% = <span class=\"fr\"><span>7</span><span>25</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D <span class=\"fr\"><span>11</span><span>25</span></span> — 44%: перепутаны доли.</li><li>A, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобная база: 100 человек.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m004_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не определено, когда подкоренное ≤ 0 (корень в знаменателе).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 − x² ≤ 0 → x² ≥ 1.</li><li>x ≤ −1 или x ≥ 1 → вариант C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — там функция как раз определена.</li><li>A — только точки ±1 (пропущены |x| > 1).</li><li>B — пропущены ±1 (там знаменатель 0).</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При x = ±1 знаменатель 0 — тоже не определено. (Исходный ключ D — исправлено.)</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m004_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средняя скорость туда-обратно — среднее гармоническое: <span class=\"fr\"><span>2v₁v₂</span><span>v₁ + v₂</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 21 · <span class=\"fr\"><span>v</span><span>21 + v</span></span> = 26,25.</li><li>42v = 26,25 · 21 + 26,25v → 15,75v = 551,25 → v = 35.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (31,5) — простое среднее 21 и 42?</li><li>A, B — неверно.</li><li>E — данных хватает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Расстояние сокращается — его можно не знать.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m004_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма шести чисел 18; крайние в сумме 10 → остальные четыре дают 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: 1 + 1 + 1 + 1 = 4 ≠ 8 → невозможно.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — сумма 8 и числа помещаются между крайними.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте сначала сумму.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m004_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение через 5 лет; ищем контрпримеры.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I: B + 5 и 3B + 5 — уже не в отношении 3 : 1 ✗.</li><li>II: разница в возрасте сохраняется ✓.</li><li>III: Анзельм 3B, Кэтрин B + 4. При B = 1: 3 и 5 — Анзельм младше ✗.</li><li>Обязательно только II → B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — III не обязано (маленький Бартоломью).</li><li>A, D — I ложно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Must be true» — достаточно одного контрпримера. (Исходный ключ E — исправлено.)</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m004_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем числа вида 6k ± 1 (на 1 или 5 меньше кратного 6), которые не простые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Такие числа < 50: 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31, 35, 37, 41, 43, 47, 49.</li><li>Не простые: 1, 25, 35, 49 → 4.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (3) — забыли 1 (1 не простое).</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 — не простое число.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m004_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">FG — пространственная диагональ w × w × 2w.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d² = 6w² → w = <span class=\"fr\"><span>d</span><span>√6</span></span>.</li><li>V = 2w³ = <span class=\"fr\"><span>2d³</span><span>6√6</span></span> = <span class=\"fr\"><span>d³√6</span><span>18</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — огромные коэффициенты.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пространственная диагональ √(a² + b² + c²).</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m004_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">EG ∥ DH → треугольники FEG и FDH подобны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>FD</span><span>FE</span></span> = <span class=\"fr\"><span>5</span><span>4</span></span>.</li><li>Площади: k² = <span class=\"fr\"><span>25</span><span>16</span></span> → <span class=\"fr\"><span>25a</span><span>16</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — k без квадрата.</li><li>B — перевёрнуто.</li><li>A, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь — k².</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m004_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание 5-12-13 → прямоугольный треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S осн = 30.</li><li>2 · 30 + 30h = 360 → h = 10.</li><li>V = 300.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без ½.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Боковая поверхность = периметр × высота.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m004_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим нули знаменателей и складываем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: ±2 → 0. B: x³ − x = 0 → 0, ±1 → 0. C: x² = 9 → ±3 → 0. D: 0 → 0.</li><li>E: x² − x = 0 → 0 и 1 → сумма 1 ≠ 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — у всех сумма 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Симметричные пары ±a дают сумму 0.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m004_q28.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 1, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение; для ложных ищем контрпример.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: сложим неравенства: 2x > 2 → x > 1 ✓.</li><li>2: x = 10, y = −1 удовлетворяет условиям, а y > 5 нет ✗.</li><li>3: x + y = 100, x − y = −1 → произведение −100 < −24 ✗.</li><li>Верно только 1 → B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 1 всегда верно.</li><li>Остальные включают 2 или 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте неравенства одного знака. (Исходный ключ A — исправлено.)</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m004_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем систему.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>t = 2s − 7 → 3s + 10s − 35 = 10 → s = <span class=\"fr\"><span>45</span><span>13</span></span>, t = <span class=\"fr\"><span>−1</span><span>13</span></span>.</li><li>½s + 3t = <span class=\"fr\"><span>45</span><span>26</span></span> − <span class=\"fr\"><span>6</span><span>26</span></span> = <span class=\"fr\"><span>39</span><span>26</span></span> = 1,5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дроби можно проверить в обоих уравнениях.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m004_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Освобождаемся от дроби и собираем z.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p(r² + z) = √q + z.</li><li>pr² + pz = √q + z → z(p − 1) = √q − pr².</li><li>z = <span class=\"fr\"><span>√q − pr²</span><span>p − 1</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — знак.</li><li>B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слагаемые с z — в одну сторону.</div></div>"}, {"id": 31, "topic": "M2.11", "text": "<p>Write \\(\\dfrac{21}{\\sqrt{7}}\\) with a rational denominator, in its simplest form.</p>", "image": "", "options": ["\\(21\\sqrt{7}\\)", "\\(\\dfrac{\\sqrt{7}}{21}\\)", "\\(147\\sqrt{7}\\)", "\\(3\\sqrt{7}\\)", "\\(\\dfrac{21}{7}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножьте числитель и знаменатель на √7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>21√7</span><span>7</span></span>, сокращаем. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли разделить на 7.</li><li>B — перевернули дробь.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √n · √n = n.</div></div>", "src": "PL"}, {"id": 32, "topic": "M4.4", "text": "<p>Factorise fully \\(12x^2y - 18xy^2\\).</p>", "image": "", "options": ["\\(xy(12x - 18y)\\)", "\\(6x(2xy - 3y^2)\\)", "\\(6xy(2x - 3y)\\)", "\\(6xy(3x - 2y)\\)", "\\(6xy(2x + 3y)\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий множитель: НОД чисел и наименьшие степени букв.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОД(12, 18) = 6, общие буквы xy. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — не вынесли число.</li><li>B — вынесли не всё: y тоже общий.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Fully» — выносите всё общее.</div></div>", "src": "PL"}, {"id": 33, "topic": "M2.5", "text": "<p>In how many ways can ₸20 be paid exactly using only ₸2 and ₸5 coins?</p>", "image": "", "options": ["2", "3", "4", "5", "6"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перебирайте число пятёрок; остаток должен делиться на 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Варианты (двушки; пятёрки): (0; 4), (5; 2), (10; 0). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — пропустили вариант.</li><li>C — посчитали лишний вариант.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Систематический перебор — по одной переменной.</div></div>", "src": "PL"}, {"id": 34, "topic": "M4.18", "text": "<p>The sequence 7, 5, 3, 1, … is arithmetic.</p><p>What is its 25th term?</p>", "image": "", "options": ["−50", "−43", "−41", "−37", "175"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">aₙ = a₁ + (n − 1)d.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a₁ = 7, d = −2.</li><li>7 + 24·−2 = −41. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли первый член.</li><li>B — взяли d·n вместо d·(n − 1).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте формулу на n = 1.</div></div>", "src": "PL"}, {"id": 35, "topic": "M5.13", "text": "<p>The bearing of Q from P is 248°.</p><p>What is the bearing of P from Q?</p>", "image": "", "options": ["068°", "248°", "158°", "136°", "112°"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный азимут = исходный ± 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>248° − 180 = 068°. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — направление то же.</li><li>E — вычли из 360 — это отражение, а не обратный азимут.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ всегда тремя цифрами.</div></div>", "src": "PL"}, {"id": 36, "topic": "M5.6", "text": "<p>The point (5, 3) is reflected in the line \\(y = 1\\).</p><p>What are the coordinates of the image?</p>", "image": "", "options": ["(−5, 3)", "(5, 5)", "(5, −1)", "(−3, 3)", "(5, −3)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точка и образ на одинаковом расстоянии от прямой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y' = 2·1 − (3) = −1. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — отразили в оси y.</li><li>D — отразили в x = 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуйте прямую — так ошибиться сложнее.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
