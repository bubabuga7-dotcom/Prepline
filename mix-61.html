<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m126_q01.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(a + b)² − (a − b)² = 4ab.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4√6·√3 = 4√18 = 12√2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 2ab.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность квадратов.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m126_q02.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2x² + 3x + 1 = (2x + 1)(x + 1); x² − 3x − 4 = (x − 4)(x + 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2x + 1</span><span>x − 4</span></span> = 2 + <span class=\"fr\"><span>9</span><span>x − 4</span></span>. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 2(x − 4) = 2x − 8, остаток 9.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выделите целую часть.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m126_q03.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(1 − <span class=\"fr\"><span>x</span><span>3</span></span>)² = <span class=\"fr\"><span>y − 3</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 − <span class=\"fr\"><span>x</span><span>3</span></span> = √<span class=\"fr\"><span>y − 3</span><span>2</span></span> → x = 3 − 3√<span class=\"fr\"><span>y − 3</span><span>2</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — знак при 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный порядок действий.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m126_q04.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2,1 · 6 = 12,6; 10⁸ · 10⁻⁵ = 10³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12,6·10³ = 1,26·10⁴. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — не стандартный вид.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мантисса от 1 до 10.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m126_q05.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6 г на 25 см.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 · <span class=\"fr\"><span>30</span><span>25</span></span> = 7,2 г. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 6 + 0,4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прямая пропорция.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m126_q06.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4p + 2q = 6; 16p + 4q = −4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p = −2, q = 7 → q − p = 9. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — p + q.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте точки.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m126_q07.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пространственная диагональ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(3² + 4² + 12²) = √169 = 13. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — сложили, а не по Пифагору.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √(a² + b² + c²).</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m126_q08.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,1(26) = <span class=\"fr\"><span>126 − 1</span><span>990</span></span> = <span class=\"fr\"><span>125</span><span>990</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>= <span class=\"fr\"><span>25</span><span>198</span></span> (вариант C). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D — другие дроби.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Предпериод → 0 в знаменателе.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m126_q09.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Радиус × 0,75 → объём × 0,75³ = <span class=\"fr\"><span>27</span><span>64</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>192 · <span class=\"fr\"><span>27</span><span>64</span></span> = 81 см³. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — линейно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Объём ∝ r³.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m126_q10.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC — диаметр → ∠ABC = 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>По рисунку: (x + 35) + (2x − 17) = 90 → 3x = 72 → x = 24. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>В тексте опечатка «x + 3» — тогда x не целое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол на диаметр — прямой.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m126_q11.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = 48h; апофема √(36 + h²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>48h = 144 + 24√(36 + h²) → 2h − 6 = √(36 + h²) → h = 8. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — подбор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Апофема через полусторону.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m126_q12.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">7155 − 7095 = 60 единиц.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>60 · 15p = 900p. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 50 единиц.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность показаний.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m126_q15.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">8 • 2 = 4, 4 • 9 = 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 • 6 = √24. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — неверный шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала скобки.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m126_q16.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагональ малого квадрата 2a = диаметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Большой квадрат 4a², круг πa² → (4 − π)a². Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — полукруг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> r = a.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m126_q17.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Расстояние между сторонами = s√3 = 12 → s = 4√3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = <span class=\"fr\"><span>3√3</span><span>2</span></span> · 48 = 72√3. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — s = 6.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шесть равносторонних треугольников.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m126_q18.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">½(2x + 4) · x = 120 → x(x + 2) = 120.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 10 → RS = 15. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — x + 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь трапеции.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m126_q19.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона ромба √(2,5² + 1,5²) = √8,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>√68</span><span>√8,5</span></span> = √8 = 2√2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — k².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Половины диагоналей — катеты.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m126_q20.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">108 = 4 · 27.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2² · 3³. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 72.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на простые.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m126_q21.webp", "options": ["A", "B", "C", "D"], "correct": 3, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внутри: 3⁻² · a² · b².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Степень −1: 3² · a⁻² · b⁻². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — b⁻¹.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала скобка.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m126_q22.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вверх 2, влево 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = (x + 3)² + 4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — вправо.</li></ul><d x-t\"><b>⚠ Ловушка / совет.</b> Подстановка.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m126_q26.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК(3, 6, 9, 12, 15) = 180 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3600 : 180 = 20 раз. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — НОК 120.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вместе — через НОК.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m126_q27.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,8P = 1,04C → P = 1,3C.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Прибыль 30%. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — сложили проценты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Свяжите цену и себестоимость.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m126_q28.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>360</span><span>n</span></span> − <span class=\"fr\"><span>360</span><span>n + 3</span></span> = 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1080 = 4n(n + 3) → n² + 3n − 270 = 0 → n = 15. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — подбор.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = <span class=\"fr\"><span>360</span><span>n</span></span>.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m126_q29.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">5a + 10(50 − a) = 400.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>500 − 5a = 400 → a = 20. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 10-тенговые.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Система.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m126_q30.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Минутная 240°, часовая 170°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>70°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 75°.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая движется.</div></div>"}, {"id": 31, "topic": "M5.3", "text": "<p>In an isosceles triangle the angle between the two equal sides is 52°.</p><p>What is each of the other two angles?</p>", "image": "", "options": ["26°", "52°", "64°", "76°", "128°"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы при основании равны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(180 − 52) : 2 = 64°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — равны углы при основании, а не этот.</li><li>D — считали, что равны два угла по 52°.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Определите, какой угол «между равными сторонами».</div></div>", "src": "PL"}, {"id": 32, "topic": "M4.16", "text": "<p>Solve \\(2x^{2} - 3x - 5 = 0\\).</p>", "image": "", "options": ["\\(x = -\\dfrac{5}{2}\\) or \\(x = 1\\)", "\\(x = 5\\) or \\(x = -1\\)", "\\(x = \\dfrac{5}{2}\\) or \\(x = 1\\)", "\\(x = \\dfrac{5}{2}\\) or \\(x = -1\\)", "\\(x = \\dfrac{2}{5}\\) or \\(x = -1\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разложите на множители.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² - 3x - 5 = (2x − 5)(x + 1).</li><li>x = <span class=\"fr\"><span>5</span><span>2</span></span> или x = −1. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знаки корней перепутаны.</li><li>B — забыли разделить на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте корни подстановкой.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
