<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://bubabuga7-dotcom.github.io/Prepline/twin.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15181D">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="icon" href="icons/favicon-48.png" type="image/png">
<title>Your Twin — Shyn</title>
<meta name="description" content="Your mistakes from the Formula quiz become a twin who argues the wrong way. Prove it wrong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prepline.css?v=02c0bfea">
<style>
  .wrap{max-width:820px}
  .head h1{font-size:32px;margin:8px 0 6px}
  .head p{color:var(--ink-2);max-width:620px}
  .muted{color:var(--ink-3);font-size:13.5px}
  .twin-top{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;margin:22px 0 10px}
  .twin-svg{width:200px;height:260px}
  .twin-svg .body{fill:var(--panel);stroke:var(--line);stroke-width:2}
  .twin-svg .crack{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .6s,stroke-width .6s}
  .twin-svg .crack.suspected{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
  .twin-svg .crack.confirmed{stroke:var(--bad);stroke-width:3.5}
  .twin-svg .crack.healing{stroke:var(--gold);stroke-width:2.5;opacity:.95}
  .twin-svg .crack.healed{opacity:0}
  .tstat{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink-3)}
  .tstat b{color:var(--ink);font-size:22px;display:block;font-family:Sora,Inter,sans-serif}
  .tstats{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 14px}
  .list{display:flex;flex-direction:column;gap:8px;margin:18px 0}
  .item{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;flex-wrap:wrap}
  .item .nm{font-size:15px}
  .tag{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
  .tag.suspected{color:var(--bad);border-color:rgba(222,139,139,.4)}
  .tag.confirmed{color:#fff;background:var(--bad);border-color:var(--bad)}
  .tag.healing{color:var(--gold);border-color:rgba(157,184,220,.5)}
  .tag.healed{color:var(--ok);border-color:rgba(125,195,160,.5)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
  .say{position:relative;background:var(--bg-2,#1D2127);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px;font-size:15.5px;line-height:1.55}
  .say .who{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--bad);display:block;margin-bottom:4px}
  .say.calm .who{color:var(--gold)}
  .steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .step{display:flex;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font:15px/1.5 Inter,sans-serif;cursor:pointer}
  .step b{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink-3)}
  .step:hover:not(:disabled){border-color:var(--blue)}
  .step.no{border-color:var(--line);opacity:.6}
  .step.bad{border-color:var(--bad);background:rgba(222,139,139,.08)}
  .step:disabled{cursor:default}
  .note{font-size:14px;color:var(--ink-2);margin:6px 0 0;min-height:1.4em}
  .phase{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--gold);margin:16px 0 6px;text-transform:uppercase}
  .opt.c{border-color:var(--ok);background:rgba(125,195,160,.1)}
  .opt.u{border-color:var(--bad);background:rgba(222,139,139,.1)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font:15px Inter,sans-serif;cursor:pointer}
  .opt:disabled{cursor:default}
  .demo-tag{display:inline-block;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--blue);border:1px solid var(--line);border-radius:4px;padding:2px 8px;margin-bottom:10px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .duel{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
  .mini{width:72px;height:94px}
  .mini .body{fill:var(--panel);stroke:var(--line);stroke-width:2}
  .mini .crack{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .8s,opacity .8s,stroke-width .8s}
  .mini .crack.confirmed,.mini .crack.suspected{stroke:var(--bad)}
  .mini .crack.healing{stroke:var(--gold);stroke-width:4;opacity:1;filter:drop-shadow(0 0 4px rgba(157,184,220,.7))}
  .fixed-cap{font:600 13px Inter,sans-serif;color:var(--gold);margin-top:6px}
  .mini .crack.healed{opacity:0}
  .done{background:var(--panel);border:1px solid rgba(125,195,160,.45);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14.5px}
  .done summary{cursor:pointer;color:var(--ink)}
  .done[open] summary{margin-bottom:8px}
  .heal-cap{font-size:12.5px;color:var(--ink-3);margin-top:6px}
  .say .who{display:block}
  @media (max-width:640px){.twin-top{grid-template-columns:1fr;justify-items:center;text-align:center}.tstats{justify-content:center}}
</style>
</head>
<body>
<aside class="dock" id="dock"></aside>
<main><div class="wrap">
  <div class="head">
    <span class="kicker">Math · Formulas</span>
    <h1>Your Twin</h1>
    <p>We saved your mistakes. Now they can argue back. Each crack is a wrong formula you chose in the formula quiz. Find the wrong step, fix it, and prove how much you’ve improved.</p>
  </div>
  <div id="home">
    <div class="twin-top">
      <svg class="twin-svg" id="svg" viewBox="0 0 200 260" aria-label="Your twin"></svg>
      <div>
        <div class="tstats" id="stats"></div>
        <p class="muted" id="hint"></p>
        <p class="muted" id="save" style="margin-top:6px"></p>
        <div class="actions"><button class="btn ghost" id="demo">Try a demo</button><a class="btn ghost" href="formulas.html">Formula quiz →</a></div>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div id="play" style="display:none"><div class="panel" id="card"></div></div>
</div></main>

<script src="nav.js?v=0ffe34d9"></script>
<script src="twin.js?v=916d7109"></script>
<script>
(function () {
  var T = window.PreplineTwin, $ = function (id) { return document.getElementById(id); };
  var NAMES = {}; T.TRAPS.forEach(function (t) { NAMES[t[0]] = t[3]; });
  var LABEL = { suspected: 'suspected', confirmed: 'confirmed', healing: 'healing', healed: 'gone' };
  var ORDER = ['confirmed', 'suspected', 'healing', 'healed'];
  /* one crack path per misconception, placed on the silhouette */
  function crackPath(i) {
    var x = 68 + (i * 37) % 64, y = 102 + (i * 53) % 86, d = 'M' + x + ' ' + y;
    for (var k = 0; k < 4; k++) { x += ((i + k) % 2 ? 7 : -6) + (k % 3); y += 9 + (i * k) % 6; d += ' L' + x + ' ' + y; }
    return d;
  }
  var BODY = '<circle class="body" cx="100" cy="48" r="30"/><path class="body" d="M55 92 Q100 70 145 92 L160 200 Q100 230 40 200 Z"/>';
  function idx(id) { for (var i = 0; i < T.TRAPS.length; i++) if (T.TRAPS[i][0] === id) return i; return 0; }
  function mini(id, state) {
    return '<svg class="mini" viewBox="0 0 200 260" aria-hidden="true">' + BODY + '<path id="mcrack" class="crack ' + state + '" d="' + crackPath(idx(id)) + '"/></svg>';
  }
  function drawHome() {
    var m = T.state(), ids = Object.keys(m);
    var svg = BODY;
    T.TRAPS.forEach(function (t, i) { var c = m[t[0]]; if (c) svg += '<path class="crack ' + c.state + '" d="' + crackPath(i) + '"/>'; });
    $('svg').innerHTML = svg;
    var n = function (st) { return ids.filter(function (id) { return m[id].state === st; }).length; };
    $('stats').innerHTML = '<span class="tstat"><b>' + n('confirmed') + '</b>confirmed</span><span class=\"tstat\"><b>' + n('suspected') + '</b>suspected</span>' +
      '<span class="tstat"><b>' + n('healing') + '</b>healing</span><span class=\"tstat\"><b>' + n('healed') + '</b>gone</span>';
    var sv = T.owner() === 'guest' ? 'Your progress is stored only on this device. Sign in so you don’t lose it.'
      : T.pending() ? 'Saved on this device. Will sync to your account when you’re online (' + T.pending() + ').' : 'Progress saved to your account.';
    $('save').textContent = sv;
    $('hint').textContent = ids.length
      ? 'A crack appears when you choose a known wrong formula in the formula quiz. It gets deeper if you choose it again in another quiz. Win a round and it starts healing. A review unlocks after 3 days.'
      : 'No cracks yet. Your Twin is built from the wrong formulas you choose in the formula quiz. Start with a demo.';
    $('list').innerHTML = ids.sort(function (a, b) { return ORDER.indexOf(m[a].state) - ORDER.indexOf(m[b].state); })
      .map(function (id) {
        var c = m[id], has = !!T.ROUNDS[id], btn = '';
        if (has && (c.state === 'confirmed' || c.state === 'suspected')) btn = '<button class="btn sm" data-r="' + id + '\">Challenge →</button>';
        else if (has && T.checkDue(c)) btn = '<button class="btn sm" data-c="' + id + '\">Delayed review →</button>';
        else if (c.state === 'healing') btn = '<span class=\"muted\">Review unlocks ' + new Date(c.healFrom + 3 * T.DAY).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + '</span>';
        else if (!has && c.state !== 'healed') btn = '<span class=\"muted\">Round coming soon</span>';
        return '<div class="item"><span class="nm">' + (NAMES[id] || id) + '</span><span class="tag ' + c.state + '">' + LABEL[c.state] + '</span>' + btn + '</div>';
      }).join('');
  }
  $('list').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.r) round(b.dataset.r, false); else if (b.dataset.c) check(b.dataset.c, false, null);
  };
  $('demo').onclick = function () { round('area-k', true); };

  /* a finished stage folds into one line (tap to see it again); the next stage scrolls into view */
  function fold(box, text, note) {
    var prev = box.previousElementSibling, d = document.createElement('details');
    d.className = 'done';
    d.innerHTML = '<summary>✓ ' + text + '</summary>';
    box.parentNode.insertBefore(d, box);
    d.appendChild(box);
    if (note && note.textContent) d.appendChild(note);
    if (prev && prev.classList.contains('phase')) prev.remove();
  }
  function into(el) { setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function back() { $('play').style.display = 'none'; $('home').style.display = ''; drawHome(); window.scrollTo(0, 0); }
  var DEMO = '<span class=\"demo-tag\">DEMO · PROGRESS NOT SAVED</span>';
  function say(text, calm) { return '<div class="say' + (calm ? ' calm' : '') + '\"><span class=\"who\">YOU v1.0</span>' + text + '</div>'; }

  /* a round: find the wrong step → pick the fix → twin's line → fresh check (first try counts) */
  function round(id, demo) {
    var R = T.ROUNDS[id], m = T.state(), c = m[id] || {};
    var vi = demo ? 0 : (c.next || 0) % R.versions.length, v = R.versions[vi];
    var rec = { id: id, kind: 'round', v: vi, at: Date.now(), steps: [], fixes: [], check: [], first: null };
    $('home').style.display = 'none'; $('play').style.display = '';
    $('card').innerHTML = (demo ? DEMO : '') +
      '<div class="duel">' + mini(id, demo ? 'confirmed' : (c.state || 'confirmed')) + '<div>' + say(v.claim) + '</div></div>' +
      '<div class=\"phase\">1 · Tap the wrong step</div><div class=\"steps\" id=\"steps\">' +
      v.steps.map(function (st, i) { return '<button class="step" data-i="' + i + '"><b>' + (i + 1) + '</b><span>' + st + '</span></button>'; }).join('') +
      '</div><p class="note" id="note"></p><div id="fix"></div>';
    $('steps').onclick = function (e) {
      var b = e.target.closest('.step'); if (!b || b.disabled) return;
      var i = +b.dataset.i; rec.steps.push(i);
      if (i !== v.bad) { b.classList.add('no'); b.disabled = true; $('note').textContent = 'Twin: «' + v.replies[i] + '»'; return; }
      [].forEach.call($('steps').children, function (x) { x.disabled = true; });
      b.classList.add('bad');
      fold($('steps'), '1 · Wrong step ' + (v.bad + 1) + ': ' + v.steps[v.bad], $('note'));
      fixPhase();
      into($('fix'));
    };
    function fixPhase() {
      var order = shuffle([0, 1, 2, 3]);
      $('fix').innerHTML = '<div class=\"phase\">2 · Fix this step</div><div class=\"opts\" id=\"fx\">' +
        order.map(function (k) { return '<button class="opt" data-k="' + k + '">' + R.fixes[k] + '</button>'; }).join('') + '</div><p class="note" id="fnote"></p><div id="after"></div>';
      $('fx').onclick = function (e) {
        var b = e.target.closest('.opt'); if (!b || b.disabled) return;
        var k = +b.dataset.k; rec.fixes.push(k);
        if (k !== 0) { b.classList.add('u'); b.disabled = true; $('fnote').textContent = 'Twin: «' + R.fixReplies[k] + '»'; return; }
        [].forEach.call($('fx').children, function (x) { x.disabled = true; });
        b.classList.add('c'); $('fnote').textContent = '';
        fold($('fx'), '2 · Your fix: ' + R.fixes[0], $('fnote'));
        $('after').innerHTML = '<div class="duel" style="margin-top:14px">' + mini(id, demo ? 'confirmed' : (c.state || 'confirmed')) + '<div>' + say(v.line, true) + '</div></div>' +
          '<button class=\"btn\" id=\"tocheck\">Test yourself with a new problem →</button>';
        $('tocheck').onclick = function () { check(id, demo, rec); };
        into($('after'));
      };
    }
  }

  /* the check: only a first-try answer moves the crack */
  function check(id, demo, rec) {
    var R = T.ROUNDS[id], p = R.check(), delayed = !rec, c0 = (T.state()[id] || {}).state || 'confirmed';
    rec = rec || { id: id, kind: 'check', at: Date.now(), steps: [], fixes: [], check: [], first: null };
    $('home').style.display = 'none'; $('play').style.display = '';
    var t0 = Date.now();
    $('card').innerHTML = (demo ? DEMO : '') +
      '<div class="duel">' + mini(id, demo ? 'confirmed' : c0) + '<div>' +
      '<div class="phase" style="margin-top:0">' + (delayed ? 'Delayed review · only your first attempt counts' : '3 · New problem · only your first attempt counts') + '</div>' +
      '<p style="font-size:16px;line-height:1.55;margin:4px 0 0">' + p.q + '</p><div class="heal-cap" id="cap"></div></div></div>' +
      '<div class="opts" id="ck" style="margin-top:12px">' +
      p.opts.map(function (o, k) { return '<button class="opt" data-k="' + k + '">' + o + '</button>'; }).join('') + '</div><p class="note" id="res"></p><div class="actions" id="end"></div>';
    $('ck').onclick = function (e) {
      var b = e.target.closest('.opt'); if (!b || b.disabled) return;
      var k = +b.dataset.k; rec.check.push(k);
      if (rec.first === null) rec.first = k === p.ans;
      if (k !== p.ans) { b.classList.add('u'); b.disabled = true; $('res').textContent = 'Not quite. Try again — but this attempt won’t heal the crack.'; return; }
      [].forEach.call($('ck').children, function (x) { x.disabled = true; });
      b.classList.add('c');
      rec.ms = Date.now() - t0;
      var msg, heal = false;
      if (demo) {
        heal = rec.first;
        msg = rec.first ? 'Correct on your first try — the crack starts healing.' : 'Solved, but not on your first try: in a real round, your Twin would return with a new version of this trap.';
        if (heal) $('cap').innerHTML = '<div class=\"fixed-cap\">You fixed your Twin’s reasoning.</div>Demo — progress not saved.';
      } else {
        T.record(delayed ? 'check' : 'round', id, { first: !!rec.first, v: rec.v || 0, steps: rec.steps, fixes: rec.fixes, check: rec.check, ms: rec.ms });
        if (rec.first) {
          heal = true; $('cap').innerHTML = '<div class=\"fixed-cap\">You fixed your Twin’s reasoning.</div>';
          msg = delayed ? 'Correct on your first try after 3+ days. The crack is gone.' : 'Correct on your first try. The crack is healing. Review unlocks in 3 days.';
        } else msg = 'Solved, but not on your first try. Your Twin will return with a new version of this trap.';
      }
      if (heal) { var mc = document.getElementById('mcrack'); if (mc) setTimeout(function () { mc.setAttribute('class', 'crack ' + (delayed && !demo ? 'healed' : 'healing')); }, 150); }
      $('res').textContent = p.why + ' ' + msg;
      $('end').innerHTML = '<button class=\"btn\" id=\"home-b\">Back to your Twin</button>';
      $('home-b').onclick = back;
    };
  }

  document.addEventListener('prepline:twin-changed', function () { if ($('home').style.display !== 'none') drawHome(); });
  drawHome();
  if (location.hash === '#demo') round('area-k', true);
})();
</script>
<script src="vendor/supabase/supabase.js?v=2.118.0"></script>
