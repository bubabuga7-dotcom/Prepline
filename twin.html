<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://bubabuga7-dotcom.github.io/Prepline/twin.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15181D">
<link rel="icon" href="icons/favicon-48.png" type="image/png">
<title>Your twin — Prepline</title>
<meta name="description" content="Your mistakes from the Formula quiz become a twin who argues the wrong way. Prove it wrong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prepline.css">
<style>
  .wrap{max-width:820px}
  .head h1{font-size:32px;margin:8px 0 6px}
  .head p{color:var(--ink-2);max-width:620px}
  .muted{color:var(--ink-3);font-size:13.5px}
  .twin-top{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;margin:22px 0 10px}
  .twin-svg{width:200px;height:260px}
  .twin-svg .body{fill:var(--panel);stroke:var(--line);stroke-width:2}
  .twin-svg .crack{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .6s,stroke-width .6s}
  .twin-svg .crack.suspected{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
  .twin-svg .crack.confirmed{stroke:var(--bad);stroke-width:3.5}
  .twin-svg .crack.healing{stroke:var(--gold);stroke-width:1.5;opacity:.55}
  .twin-svg .crack.healed{opacity:0}
  .tstat{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink-3)}
  .tstat b{color:var(--ink);font-size:22px;display:block;font-family:Sora,Inter,sans-serif}
  .tstats{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 14px}
  .list{display:flex;flex-direction:column;gap:8px;margin:18px 0}
  .item{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;flex-wrap:wrap}
  .item .nm{font-size:15px}
  .tag{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
  .tag.suspected{color:var(--bad);border-color:rgba(222,139,139,.4)}
  .tag.confirmed{color:#fff;background:var(--bad);border-color:var(--bad)}
  .tag.healing{color:var(--gold);border-color:rgba(201,170,106,.5)}
  .tag.healed{color:var(--ok);border-color:rgba(125,195,160,.5)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
  .say{position:relative;background:var(--bg-2,#1D2127);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px;font-size:15.5px;line-height:1.55}
  .say .who{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--bad);display:block;margin-bottom:4px}
  .say.calm .who{color:var(--gold)}
  .steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .step{display:flex;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font:15px/1.5 Inter,sans-serif;cursor:pointer}
  .step b{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink-3)}
  .step:hover:not(:disabled){border-color:var(--blue)}
  .step.no{border-color:var(--line);opacity:.6}
  .step.bad{border-color:var(--bad);background:rgba(222,139,139,.08)}
  .step:disabled{cursor:default}
  .note{font-size:14px;color:var(--ink-2);margin:6px 0 0;min-height:1.4em}
  .phase{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--gold);margin:16px 0 6px;text-transform:uppercase}
  .opt.c{border-color:var(--ok);background:rgba(125,195,160,.1)}
  .opt.u{border-color:var(--bad);background:rgba(222,139,139,.1)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font:15px Inter,sans-serif;cursor:pointer}
  .opt:disabled{cursor:default}
  .demo-tag{display:inline-block;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--blue);border:1px solid var(--line);border-radius:4px;padding:2px 8px;margin-bottom:10px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  @media (max-width:640px){.twin-top{grid-template-columns:1fr;justify-items:center;text-align:center}.tstats{justify-content:center}}
</style>
</head>
<body>
<aside class="dock" id="dock"></aside>
<main><div class="wrap">
  <div class="head">
    <span class="kicker">Mathematics · formulas</span>
    <h1>Your twin</h1>
    <p>We kept your mistakes. Now they can argue. Every crack is one wrong idea you picked in the Formula quiz. Find the wrong step, fix it, and prove you are stronger.</p>
  </div>
  <div id="home">
    <div class="twin-top">
      <svg class="twin-svg" id="svg" viewBox="0 0 200 260" aria-label="Your twin"></svg>
      <div>
        <div class="tstats" id="stats"></div>
        <p class="muted" id="hint"></p>
        <div class="actions"><button class="btn ghost" id="demo">Try it on an example</button><a class="btn ghost" href="formulas.html">Formula quiz →</a></div>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div id="play" style="display:none"><div class="panel" id="card"></div></div>
</div></main>

<script src="nav.js"></script>
<script src="twin.js"></script>
<script>
(function () {
  var T = window.PreplineTwin, $ = function (id) { return document.getElementById(id); };
  var NAMES = {}; T.TRAPS.forEach(function (t) { NAMES[t[0]] = t[3]; });
  var LABEL = { suspected: 'suspected', confirmed: 'confirmed', healing: 'healing', healed: 'healed' };
  /* one crack path per misconception, placed on the silhouette */
  function crackPath(i) {
    var x = 68 + (i * 37) % 64, y = 102 + (i * 53) % 86, d = 'M' + x + ' ' + y;
    for (var k = 0; k < 4; k++) { x += ((i + k) % 2 ? 7 : -6) + (k % 3); y += 9 + (i * k) % 6; d += ' L' + x + ' ' + y; }
    return d;
  }
  function drawHome() {
    var m = T.load(), ids = Object.keys(m);
    var open = ids.filter(function (id) { return m[id].state !== 'healed'; });
    var svg = '<circle class="body" cx="100" cy="48" r="30"/><path class="body" d="M55 92 Q100 70 145 92 L160 200 Q100 230 40 200 Z"/>';
    T.TRAPS.forEach(function (t, i) { var c = m[t[0]]; if (c) svg += '<path class="crack ' + c.state + '" d="' + crackPath(i) + '"/>'; });
    $('svg').innerHTML = svg;
    var n = function (s) { return ids.filter(function (id) { return m[id].state === s; }).length; };
    $('stats').innerHTML = '<span class="tstat"><b>' + n('confirmed') + '</b>confirmed</span><span class="tstat"><b>' + n('suspected') + '</b>suspected</span>' +
      '<span class="tstat"><b>' + n('healing') + '</b>healing</span><span class="tstat"><b>' + n('healed') + '</b>gone</span>';
    $('hint').textContent = ids.length ? 'A crack appears when you pick a known wrong formula in the Formula quiz, and deepens if you pick it again in another quiz. Win a round to start healing it; a check after 3 days closes it.'
      : 'No cracks yet. Your twin is built from the wrong formulas you pick in the Formula quiz. Try a round on an example first.';
    $('list').innerHTML = ids.sort(function (a, b) { return ['confirmed', 'suspected', 'healing', 'healed'].indexOf(m[a].state) - ['confirmed', 'suspected', 'healing', 'healed'].indexOf(m[b].state); })
      .map(function (id) {
        var c = m[id], has = !!T.ROUNDS[id], btn = '';
        if (has && (c.state === 'confirmed' || c.state === 'suspected')) btn = '<button class="btn sm" data-r="' + id + '">Fight it →</button>';
        else if (has && T.checkDue(c)) btn = '<button class="btn sm" data-c="' + id + '">Delayed check →</button>';
        else if (c.state === 'healing') btn = '<span class="muted">Check opens ' + new Date(c.healFrom + 3 * T.DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</span>';
        else if (!has && c.state !== 'healed') btn = '<span class="muted">Round coming soon</span>';
        return '<div class="item"><span class="nm">' + (NAMES[id] || id) + '</span><span class="tag ' + c.state + '">' + LABEL[c.state] + '</span>' + btn + '</div>';
      }).join('');
  }
  $('list').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.r) round(b.dataset.r, false); else if (b.dataset.c) check(b.dataset.c, false, null);
  };
  $('demo').onclick = function () { round('area-k', true); };

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function back() { $('play').style.display = 'none'; $('home').style.display = ''; drawHome(); window.scrollTo(0, 0); }

  /* a round: find the wrong step → pick the fix → twin's line → fresh check (first try counts) */
  function round(id, demo) {
    var R = T.ROUNDS[id], m = T.load(), c = m[id] || {};
    var vi = demo ? 0 : (c.next || 0) % R.versions.length, v = R.versions[vi];
    var rec = { id: id, kind: 'round', v: vi, at: Date.now(), steps: [], fixes: [], check: [], first: null };
    $('home').style.display = 'none'; $('play').style.display = '';
    var card = $('card');
    card.innerHTML = (demo ? '<span class="demo-tag">EXAMPLE · NOT SAVED</span>' : '') +
      '<div class="say"><span class="who">YOU v1.0</span>' + v.claim + '</div>' +
      '<div class="phase">1 · Tap the wrong step</div><div class="steps" id="steps">' +
      v.steps.map(function (s, i) { return '<button class="step" data-i="' + i + '"><b>' + (i + 1) + '</b><span>' + s + '</span></button>'; }).join('') +
      '</div><p class="note" id="note"></p><div id="fix"></div>';
    $('steps').onclick = function (e) {
      var b = e.target.closest('.step'); if (!b || b.disabled) return;
      var i = +b.dataset.i; rec.steps.push(i);
      if (i !== v.bad) { b.classList.add('no'); b.disabled = true; $('note').textContent = 'Twin: «' + v.replies[i] + '»'; return; }
      [].forEach.call($('steps').children, function (x) { x.disabled = true; });
      b.classList.add('bad'); $('note').textContent = 'Twin: «Хм. А что тут не так?»';
      fixPhase();
    };
    function fixPhase() {
      var order = shuffle([0, 1, 2, 3]);
      $('fix').innerHTML = '<div class="phase">2 · Fix the step</div><div class="opts" id="fx">' +
        order.map(function (k) { return '<button class="opt" data-k="' + k + '">' + R.fixes[k] + '</button>'; }).join('') + '</div><div id="after"></div>';
      $('fx').onclick = function (e) {
        var b = e.target.closest('.opt'); if (!b || b.disabled) return;
        var k = +b.dataset.k; rec.fixes.push(k);
        if (k !== 0) { b.classList.add('u'); b.disabled = true; return; }
        [].forEach.call($('fx').children, function (x) { x.disabled = true; });
        b.classList.add('c');
        $('after').innerHTML = '<div class="say calm" style="margin-top:14px"><span class="who">YOU v1.0</span>' + v.line + '</div>' +
          '<button class="btn" id="tocheck">Now check it on a new problem →</button>';
        $('tocheck').onclick = function () { check(id, demo, rec); };
      };
    }
  }

  /* the check: only a first-try answer without hints moves the crack */
  function check(id, demo, rec) {
    var R = T.ROUNDS[id], p = R.check(), delayed = !rec;
    rec = rec || { id: id, kind: 'check', at: Date.now(), steps: [], fixes: [], check: [], first: null };
    $('home').style.display = 'none'; $('play').style.display = '';
    var t0 = Date.now();
    $('card').innerHTML = (demo ? '<span class="demo-tag">EXAMPLE · NOT SAVED</span>' : '') +
      '<div class="phase">' + (delayed ? 'Delayed check · first try counts' : '3 · New problem · first try counts') + '</div>' +
      '<p style="font-size:16px;line-height:1.55;margin:4px 0 12px">' + p.q + '</p><div class="opts" id="ck">' +
      p.opts.map(function (o, k) { return '<button class="opt" data-k="' + k + '">' + o + '</button>'; }).join('') + '</div><p class="note" id="res"></p><div class="actions" id="end"></div>';
    $('ck').onclick = function (e) {
      var b = e.target.closest('.opt'); if (!b || b.disabled) return;
      var k = +b.dataset.k; rec.check.push(k);
      if (rec.first === null) rec.first = k === p.ans;
      if (k !== p.ans) { b.classList.add('u'); b.disabled = true; $('res').textContent = 'Not quite. Try again — but this attempt no longer heals the crack.'; return; }
      [].forEach.call($('ck').children, function (x) { x.disabled = true; });
      b.classList.add('c');
      rec.ms = Date.now() - t0;
      var msg;
      if (demo) msg = rec.first ? 'Right first time. In a real round this crack would start healing.' : 'Solved, but not first time: in a real round the twin would come back with another version.';
      else {
        var m = T.load(), c = m[id] || (m[id] = { state: 'confirmed', runs: [] });
        if (rec.first) {
          if (delayed) { c.state = 'healed'; msg = 'Right first time after 3+ days. The crack is gone.'; }
          else { c.state = 'healing'; c.healFrom = Date.now(); msg = 'Right first time. The crack is healing; a check opens in 3 days.'; }
        } else {
          c.state = 'confirmed'; c.next = (c.next || 0) + 1;
          msg = 'Solved, but not first time. The twin will come back with another version of this trap.';
        }
        if (!delayed) c.next = rec.first ? (c.next || 0) : c.next;
        T.save(m); T.log(rec);
      }
      $('res').textContent = p.why + ' ' + msg;
      $('end').innerHTML = '<button class="btn" id="home-b">Back to your twin</button>';
      $('home-b').onclick = back;
    };
  }

  drawHome();
  if (location.hash === '#demo') round('area-k', true);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
</body>
</html>
