<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct049_q01.webp", "options": ["A", "B", "C", "D"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Малую ёмкость S сначала на медленный насос.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Половина S — за <span class=\"fr\"><span>S</span><span>12</span></span> мин; большая получает S.</li><li>Вторая половина — за <span class=\"fr\"><span>S</span><span>24</span></span> мин; большая получает ещё <span class=\"fr\"><span>S</span><span>4</span></span>.</li><li>Большая = 1,25 S → на 25% больше. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Время одинаково для обоих насосов.</div></div>"}, {"id": 2, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q17 · Flaw</p>", "image": "images/ct-pp/ct049_q02.webp", "options": ["A", "B", "C", "D"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Если тайно — риск управляем. Не тайно — неуправляем».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это отрицание антецедента. A — та же ошибка. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Из «не A» не следует «не B».</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct049_q03.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6 пятен, каждое красное или жёлтое: 2⁶ = 64.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Убираем > 4 одного цвета: 1 + 6 + 1 + 6 = 14.</li><li>64 − 14 = 50. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не всё убрали.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всё минус запрещённое.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q19 · Problem solving</p>", "image": "images/ct-pp/ct049_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Смертей на аварию = % смертей : % аварий.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Крейсерский полёт <span class=\"fr\"><span>16</span><span>8</span></span> = 2,0 — максимум. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Взлёт 1,5, посадка 0,48, снижение 1,0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение, а не абсолютное число.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct049_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Снижение + заход + финальный заход + посадка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>11 + 12 + 3 + 1 = 27% от 90 мин ≈ 24 мин. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — пропущен этап.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложите нужные этапы.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q21 · Problem solving</p>", "image": "images/ct-pp/ct049_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Саботаж: 1960-е ≈ 5%, в другие десятилетия 9–11%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Самый явный выбивающийся случай. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Погода не падала равномерно, механика 2010-х близка к норме.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите отклонение от ряда.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q22 · Problem solving</p>", "image": "images/ct-pp/ct049_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2015 — «самый безопасный» без учёта саботажа.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Имеет смысл, только если саботаж не влияет на безопасность полётов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключение данных — скрытое допущение.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q23 · Problem solving</p>", "image": "images/ct-pp/ct049_q08.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цифры a, a+1, c, c+1; a + c + 1 = (a + 1)c.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a(c − 1) = 1 → a = 1, c = 2.</li><li>ПИН 1223, последняя цифра 3. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не решают уравнение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Упростите уравнение.</div></div>"}, {"id": 9, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q24 · Flaw</p>", "image": "images/ct-pp/ct049_q09.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одно исследование в Канберре → поощрять кошек везде.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: Канберра типична. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обобщение по одному месту.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct049_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чтобы вторая сумма s была мала — первой 100 $, остальным максимум ниже s.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>100 + (s−1) + (s−2) + (s−3) + s ≥ 200 → s ≥ 26,5.</li><li>s = 27 $. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не минимум.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минимизация: другие — максимально.</div></div>"}, {"id": 11, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q26 · Strengthen</p>", "image": "images/ct-pp/ct049_q11.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: нужно больше действий, чтобы помочь женщинам и детям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Грудное вскармливание полезно и матери → помощь женщинам. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — не усиливают.</li><li>B — причина не в рекламе, ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усилитель поддерживает обе части вывода.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q27 · Problem solving</p>", "image": "images/ct-pp/ct049_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цены: 5, 8, 6, 8, 12, 9, 10 = 58.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Мэдди бесплатно в «четыре плюс одна»; Олли за полцены с Нелли (−5).</li><li>58 − 12 − 5 = 41 $. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — хуже распределение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Бесплатной делайте самую дорогую.</div></div>"}, {"id": 13, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q28 · Drawing a conclusion</p>", "image": "images/ct-pp/ct049_q13.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий скрининг без пользы, целевой — оправдан.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Целевые программы эффективнее. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнительный вывод.</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q29 · Problem solving</p>", "image": "images/ct-pp/ct049_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кубик 0–5 (сумма напротив 5) и кубик 2–7 (сумма 9).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только C — три соседние грани одного кубика без пары напротив. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пара напротив вместе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Противоположные не видны вместе.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct049_q16.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дизайн на 2 больше конструкции.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конструкция D − 2, оценка D − 11, исследование 61 − 3D.</li><li>Исследование отличается > 2 от обеих → D = 17, исследование = 10. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — нарушают условия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите всё через одну переменную.</div></div>"}, {"id": 17, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q32 · Drawing a conclusion</p>", "image": "images/ct-pp/ct049_q17.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Условно незаменимые — делаются из других только иногда.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Тирозин — из фенилаланина, цистеин — из метионина. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не те пары.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Читайте определение в тексте.</div></div>"}, {"id": 18, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q33 · Problem solving</p>", "image": "images/ct-pp/ct049_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Таблица 2: 5 мг/кг · 70 = 350 мг.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Таблица 1: 4 · 0,8 · 70 = 224 мг.</li><li>Разница 126 мг. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не то умножение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Следите за единицами.</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q34 · Problem solving</p>", "image": "images/ct-pp/ct049_q19.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Новорождённый: 2,5% от 560 г = 14 г белка; 8 недель: 7 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Изолейцин на грамм белка тот же → 2 : 1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — по объёму, а не белку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте через белок.</div></div>"}, {"id": 20, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2018 · original Q35 · Problem solving</p>", "image": "images/ct-pp/ct049_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Детское молоко: His 21, Thr 44; у взрослых Thr 19.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>21 · <span class=\"fr\"><span>19</span><span>44</span></span> ≈ 9 мг. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та пропорция.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропорция по треонину.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct049_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Базовая + налоги = 280 = 168 + 112.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>168 · 1,2 + 112 · 1,1 + 25 = 349,80 $. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не раздельный рост.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждая часть растёт по-своему.</div></div>"}, {"id": 22, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q2 · Strengthen</p>", "image": "images/ct-pp/ct049_q22.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дети всё чаще со смартфоном вместо людей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угроза развитию реальна. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про механизм.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усилитель подтверждает механизм.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct049_q23.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Люк и кондиционер: только Cronal и Elox.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Elox — 180 $ за неделю, сверх бюджета.</li><li>Cronal: 150 $, трансфер есть. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Bezza — нет люка и кондиционера.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала обязательные условия.</div></div>"}, {"id": 24, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q4 · Flaw</p>", "image": "images/ct-pp/ct049_q24.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Меньше онлайн-продаж ≠ меньше продаж вообще.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Покупатели могут уйти в магазины, где тоже налог. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переток, а не потеря.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct049_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стрелки на противоположных гранях и смотрят в одну сторону.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В B после сборки стрелки смотрят в разные стороны. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — стрелки параллельны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте направление.</div></div>"}, {"id": 26, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q6 · Drawing a conclusion</p>", "image": "images/ct-pp/ct049_q26.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цена мерит ценность, только когда платят.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Для бесплатных приложений нужны другие способы. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Граница применимости.</div></div>"}, {"id": 27, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct049_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из 164 положительных 72 — истинные.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>72 : 164 ≈ 44%. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не тот знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знаменатель — все положительные.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct049_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Паром: X 00:00 → Y 02:30, ждёт до 03:45, назад 06:15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Следующее отправление 07:30 → цикл 7,5 ч.</li><li>Рейс каждые 1,5 ч → 5 паромов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — без ожидания.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цикл : интервал.</div></div>"}, {"id": 29, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q13 · Main conclusion</p>", "image": "images/ct-pp/ct049_q29.webp", "options": ["A", "B", "C", "D"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всё ведёт к одной мысли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Культура питья — главная причина разницы цен. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Главный вывод.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2019 · original Q14 · Problem solving</p>", "image": "images/ct-pp/ct049_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всего 400; секторы ≈ 40%, 27%, 23%, 10%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Без среды (100): чт 120, пн 80, пт 70, вт 30 из 300 — совпадает. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не совпадают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пробуйте убрать один день.</div></div>"}, {"id": 31, "topic": "MC", "text": "It is often claimed that learning a second language at school is a waste of time, because so many adults forget the language they studied. But the value of language study does not lie only in being able to speak the language later. Students who learn a second language become more aware of how their own language works, and they practise memory skills that help in other subjects. School language lessons are therefore worthwhile even for students who later forget most of the language.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "image": "", "options": ["Many adults forget the language they studied at school.", "Language study helps students in other subjects.", "Learning a second language makes students more aware of their own language.", "School language lessons are worthwhile even for students who later forget most of the language.", "Schools should teach two foreign languages instead of one."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Therefore» вводит вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осознание родного языка и память — доводы в пользу последнего предложения. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — чужой довод.</li><li>B, C — доводы.</li><li>E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите слова therefore, so, thus.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
