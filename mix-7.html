<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;

  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"text":"Which inequality is equivalent to p + s > p − s?","options":["p > s","p > 0","s > p","s > 0","s < 0"],"correct":3,"src":"M14","id":1,"topic":"M4.17","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем: вычитаем p из обеих частей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p + s > p − s → s > −s.</li><li>2s > 0 → s > 0.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — p сокращается, от него ничего не зависит.</li><li>E — противоположный знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Одинаковые слагаемые в обеих частях можно убрать.</div></div>"},{"text":"A trader sold 30% of his goods at 40% below the wholesale price and the rest at 40% above it. What is the profit on all the goods?","options":["15%","16%","18%","32%"],"correct":1,"src":"M14","id":2,"topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Принимаем оптовую стоимость всего товара за 100.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>30 единиц продано по 0,6 → 18.</li><li>70 единиц продано по 1,4 → 98.</li><li>Выручка 116 при затратах 100 → прибыль 16%.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — неверная доля проданного.</li><li>D (32%) — взвесили проценты неправильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобная база 100 превращает проценты в числа.</div></div>"},{"text":"Mary's height increased by 20% from age 5 to age 10, by 15% from 10 to 15, and by 10% from 15 to 20. By how much did her height increase from age 5 to age 20?","options":["38.2%","45%","50%","51.8%","None of these"],"correct":3,"src":"M14","id":3,"topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последовательные проценты перемножаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,2 · 1,15 = 1,38.</li><li>1,38 · 1,1 = 1,518.</li><li>Рост 51,8%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (45%) — сложили 20 + 15 + 10.</li><li>A, C — арифметика.</li><li>E — ответ есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложные проценты всегда больше суммы (при росте).</div></div>"},{"text":"(2 − x)(16 + x⁴)(4 + x²)(2 + x) is equal to","options":["x⁸ + 8x⁶ − 4x⁴ + 2x² − 256","x⁸ − 256","256 − x⁸","x⁸ − 8x⁶ + 4x⁴ − 2x² + 256","x⁸ + 256"],"correct":2,"src":"M10","id":4,"topic":"M4.5","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Группируем скобки по разности квадратов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2 − x)(2 + x) = 4 − x².</li><li>(4 − x²)(4 + x²) = 16 − x⁴.</li><li>(16 − x⁴)(16 + x⁴) = 256 − x⁸.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак наоборот (порядок 2 − x, а не x − 2).</li><li>E — сумма вместо разности.</li><li>A, D — лишние слагаемые.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цепочка разностей квадратов «схлопывается».</div></div>"},{"text":"The missing term x in the sequence −3, 3, x, 27, 45, 67 is","options":["15","19","22","13","21"],"correct":3,"src":"M10","id":5,"topic":"M4.18","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Смотрим на разности между соседними членами.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разности: 3 − (−3) = 6; 45 − 27 = 18; 67 − 45 = 22.</li><li>Разности растут на 4: 6, 10, 14, 18, 22.</li><li>x = 3 + 10 = 13; проверка 13 + 14 = 27 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (15), B (19), C (22), E (21) — нарушают закономерность разностей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если разности не постоянны — посмотрите на «разности разностей».</div></div>"},{"text":"Evaluate (x^0.25 + y^(−1))/x^0.25 when x = 16 and y = 8.","options":["19/16","5/16","1","17/16","9/16"],"correct":3,"src":"M11","id":6,"topic":"M2.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем степени: 16<sup>0,25</sup> = ⁴√16 = 2, 8⁻¹ = <span class=\"fr\"><span>1</span><span>8</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Числитель: 2 + <span class=\"fr\"><span>1</span><span>8</span></span> = <span class=\"fr\"><span>17</span><span>8</span></span>.</li><li>Делим на 2: <span class=\"fr\"><span>17</span><span>16</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E <span class=\"fr\"><span>9</span><span>16</span></span> — ошибка в сложении.</li><li>A, B, C — неверная степень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Степень 0,25 = корень четвёртой степени.</div></div>"},{"text":"w, x, y and z are integers with w < x², x > y², y² < z² and x > z. Which inequality must be true?","options":["w < x","w > y","w < z","x > y","y < z"],"correct":3,"src":"M14","id":7,"topic":"M2.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для любого целого y верно y² ≥ y. Используем цепочку неравенств из условия (x > y²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x > y² (из условия).</li><li>y² ≥ y для целых y (при y ≤ 0 квадрат неотрицателен; при y ≥ 1 y² ≥ y).</li><li>Значит, x > y² ≥ y → x > y.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — можно подобрать числа, где они нарушаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Must be true» — ищите следствие, работающее для всех целых, включая отрицательные.</div></div>"},{"text":"What is the volume of a cube whose surface area is 150?","options":["25","100","125","1000","15625"],"correct":2,"src":"M11","id":8,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из площади поверхности находим ребро.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6s² = 150 → s² = 25 → s = 5.</li><li>V = 125.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (25) — это s².</li><li>D, E — неверно.</li><li>B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У куба 6 граней.</div></div>"},{"text":"a = 2^x, b = 3^x and c = 5^x. Express 90^x in terms of a, b and c.","options":["(abc)²","a²bc²","ab²c","a²b⁴c²"],"correct":2,"src":"M14","id":9,"topic":"M2.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем 90 на простые множители.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>90 = 2 · 3² · 5.</li><li>90<sup>x</sup> = 2<sup>x</sup> · (3<sup>x</sup>)² · 5<sup>x</sup> = a · b² · c.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — (abc)² = 900<sup>x</sup>.</li><li>B, D — неверные степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (3²)<sup>x</sup> = (3<sup>x</sup>)² = b².</div></div>"},{"text":"a is the number of even prime numbers; b is the number of primes divisible by 7; c is the number of primes divisible by 9; d is the number of primes between 20 and 30. What is a + b + c + d?","options":["7","4","8","3","5"],"correct":1,"src":"M10","id":10,"topic":"M2.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем каждую величину.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a: чётное простое только 2 → 1.</li><li>b: простое, делящееся на 7, — только 7 → 1.</li><li>c: кратное 9 не бывает простым → 0.</li><li>d: простые между 20 и 30 — 23, 29 → 2.</li><li>Сумма: 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — посчитали лишние простые.</li><li>D — пропустили одно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Простое число делится только на 1 и само на себя — поэтому «делящихся на 7» ровно одно.</div></div>"},{"text":"Solve the equation t − 3 = √(9 − t). The solution set is","options":["{0}","{0, −5}","{0, 5}","{5}","{2, 5}"],"correct":3,"src":"M8","id":11,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат и обязательно проверяем корни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(t − 3)² = 9 − t → t² − 6t + 9 = 9 − t → t² − 5t = 0.</li><li>t = 0 или t = 5.</li><li>Проверка t = 0: −3 = √9 = 3 ✗.</li><li>Проверка t = 5: 2 = √4 = 2 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — включают посторонний корень 0.</li><li>B, E — неверные корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корень не бывает отрицательным → левая часть должна быть ≥ 0.</div></div>"},{"text":"A circular logo is enlarged so that the new diameter is 50% greater than the original. By what percentage does the area increase?","options":["225","50","125","250","80"],"correct":2,"src":"M8","id":12,"topic":"M3.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь ∝ квадрату диаметра.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диаметр × 1,5 → площадь × 2,25.</li><li>Рост на 125%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (225) — это новая площадь в % от старой.</li><li>B (50) — линейный рост.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Increase» = новое − 100%.</div></div>"},{"text":"Travelling at 2/3 of her usual speed, Chelsea arrives at school 20 minutes late. How many minutes does the journey take at her usual speed?","options":["48","50","40","32","45"],"correct":2,"src":"M8","id":13,"topic":"M3.9","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">При скорости ⅔ время больше в 1,5 раза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Новое время = 1,5T.</li><li>1,5T − T = 0,5T = 20 мин.</li><li>T = 40 мин.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (45), A (48), B, D — не дают разницу 20 мин.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скорость × k → время ÷ k.</div></div>"},{"text":"One pipe fills a pool 4 hours faster than another. The slower pipe ran for 7 hours, then the second pipe was opened and together they finished in 2 hours. How long does each pipe take to fill the pool on its own?","options":["14 and 18 hours","8 and 12 hours","11 and 15 hours","9 and 13 hours","10 and 14 hours"],"correct":1,"src":"M12","id":14,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем время быстрой трубы t, медленной t + 4. Медленная работала 9 ч, быстрая 2 ч.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>9</span><span>t + 4</span></span> + <span class=\"fr\"><span>2</span><span>t</span></span> = 1.</li><li>Проверим t = 8: <span class=\"fr\"><span>9</span><span>12</span></span> + <span class=\"fr\"><span>2</span><span>8</span></span> = ¾ + ¼ = 1 ✓.</li><li>Ответ: 8 и 12 часов.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — при подстановке сумма ≠ 1 (например, 10 и 14: <span class=\"fr\"><span>9</span><span>14</span></span> + <span class=\"fr\"><span>2</span><span>10</span></span> ≈ 0,84).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Медленная труба работала 7 + 2 = 9 часов — частая ловушка.</div></div>"},{"text":"The graph of a quadratic function f(x) has its minimum at (−1, 1). If f(a) = f(1), which value could a take?","options":["-1","2","0","-3","-2"],"correct":3,"src":"M8","id":15,"topic":"M4.11","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Парабола симметрична относительно оси x = −1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ось симметрии x = −1.</li><li>Расстояние от 1 до −1 равно 2 → симметричная точка −1 − 2 = −3.</li><li>f(−3) = f(1).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−1) — вершина.</li><li>B, C, E — не симметричны точке 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точки x₁ и x₂ с равными значениями: <span class=\"fr\"><span>x₁ + x₂</span><span>2</span></span> = ось.</div></div>"},{"text":"The area of a triangle is 2 cm². The base is 3 cm longer than the height. Find the base and the height.","options":["5 and 2","4 and 1","6 and 3","7 and 4","8 and 5"],"correct":1,"src":"M12","id":16,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь ½ · основание · высота.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · (h + 3) · h = 2 → h² + 3h − 4 = 0.</li><li>(h + 4)(h − 1) = 0 → h = 1, основание 4.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные: площадь не 2 (например, 5 · 2 / 2 = 5).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставить варианты — быстрее.</div></div>"},{"text":"Find the equation with roots 2 + √3 and 2 − √3.","options":["x² − 4x − 1 = 0","x² + 4x + 1 = 0","x² − 4x + 1 = 0","x² + x − 4 = 0","x² − x + 4 = 0"],"correct":2,"src":"M14","id":17,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по сумме и произведению корней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма: 4. Произведение: 4 − 3 = 1.</li><li>x² − 4x + 1 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неверный знак произведения.</li><li>B — неверный знак суммы.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (2 + √3)(2 − √3) = 1.</div></div>"},{"text":"If y∝x = y^(2x) for positive integers, then (3∝4)∝2 =","options":["3²⁴","3³²","3⁸","3¹²","3¹⁶"],"correct":1,"src":"M8","id":18,"topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По определению y∝x = y<sup>2x</sup>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3∝4 = 3<sup>8</sup>.</li><li>3⁸∝2 = (3⁸)<sup>4</sup> = 3³².</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (3¹⁶) — 3⁸ · 2 вместо (3⁸)⁴.</li><li>C (3⁸) — только первый шаг.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (aᵐ)ⁿ = a<sup>mn</sup>.</div></div>"},{"text":"a = 3/(5 + X), b = (3 + X)/5 and c = (3 + X)/(5 + X), where X is an integer greater than 0. Which is true?","options":["a < b < c for all X","a < c < b for all X","b < a < c for all X","b < c < a for all X","c < a < b for all X","c < b < a for all X","The order depends on X"],"correct":1,"src":"M14","id":19,"topic":"M2.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем дроби с общими числителями/знаменателями.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a и c: знаменатель 5 + X общий, числители 3 < 3 + X → a < c.</li><li>c и b: числитель 3 + X общий, знаменатели 5 + X > 5 → c < b.</li><li>a < c < b для всех X > 0.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные порядки нарушают одно из сравнений.</li><li>G — порядок не зависит от X.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При одинаковом числителе больше та дробь, у которой знаменатель меньше.</div></div>"},{"text":"Make x the subject of √(2/x + 1) = y − 3.","options":["x = 2/((y−4)(y−2))","x = (y−4)/2","x = (y−3)²/2","x = 2/((y+4)(y+2))"],"correct":0,"src":"M14","id":20,"topic":"M4.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат и выражаем x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2</span><span>x</span></span> + 1 = (y − 3)².</li><li><span class=\"fr\"><span>2</span><span>x</span></span> = y² − 6y + 9 − 1 = y² − 6y + 8 = (y − 2)(y − 4).</li><li>x = <span class=\"fr\"><span>2</span><span>(y − 2)(y − 4)</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — неверные знаки.</li><li>B, C — забыли перевернуть дробь.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y² − 6y + 8: корни 2 и 4.</div></div>"},{"text":"Mitchell spends 30% of his day sleeping, 35% working, 5% at the gym, a further 5 hours at home, and the rest in his car. How many minutes a day does he spend in his car?","options":["2.2","60","120","132","432"],"correct":3,"src":"M12","id":22,"topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим проценты в часы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>30 + 35 + 5 = 70% от 24 ч = 16,8 ч.</li><li>+ 5 ч дома = 21,8 ч.</li><li>Машина: 24 − 21,8 = 2,2 ч = 132 мин.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2,2) — это часы, а не минуты.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте перевести часы в минуты.</div></div>"},{"text":"f(x, y) = 2x² − y² and g(x) = 2^x. What is f(g(x), g(x))?","options":["2^(x−1)","2^(−x)","2^(x−2)","2^(3x)","2^(2x)"],"correct":4,"src":"M8","id":23,"topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем 2<sup>x</sup> вместо x и y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(2<sup>x</sup>, 2<sup>x</sup>) = 2(2<sup>x</sup>)² − (2<sup>x</sup>)² = (2<sup>x</sup>)².</li><li>(2<sup>x</sup>)² = 2<sup>2x</sup>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 2<sup>3x</sup>: неверно сложили степени.</li><li>A, B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2a² − a² = a².</div></div>"},{"text":"A class has 6 more boys than girls, and the ratio of boys to girls is 5/3. How many students are there in total?","options":["18","24","30","32","36"],"correct":1,"src":"M14","id":24,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мальчики 5k, девочки 3k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5k − 3k = 2k = 6 → k = 3.</li><li>Всего 8k = 24.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — разность не 6 или отношение не 5:3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разница в «частях» связывает отношение с реальными числами.</div></div>"},{"text":"What is half of 2²⁰?","options":["2¹⁰","2²¹","2¹⁹","2⁻¹⁰"],"correct":2,"src":"M14","id":25,"topic":"M2.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Половина = деление на 2¹.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2²⁰ ÷ 2 = 2¹⁹.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2¹⁰) — «половина показателя» — частая ошибка.</li><li>B — умножили на 2.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делить степень пополам ≠ делить число пополам.</div></div>"},{"text":"One root of ax² + bx + c = 0 is twice the other. What is the relationship between a, b and c?","options":["4b² = 4c","2b² = 9ac","2b² = 9a","b² = 8ac","9b² = 2ac"],"correct":1,"src":"M14","id":26,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корни r и 2r. Используем Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма: 3r = <span class=\"fr\"><span>−b</span><span>a</span></span> → r = <span class=\"fr\"><span>−b</span><span>3a</span></span>.</li><li>Произведение: 2r² = <span class=\"fr\"><span>c</span><span>a</span></span>.</li><li>2 · <span class=\"fr\"><span>b²</span><span>9a²</span></span> = <span class=\"fr\"><span>c</span><span>a</span></span> → 2b² = 9ac.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (b² = 8ac) — это для корней r и ... другое отношение.</li><li>A, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: x² − 3x + 2 = 0 (корни 1 и 2): 2 · 9 = 18 = 9 · 1 · 2 ✓.</div></div>"},{"text":"Line g is parallel to 2x + 5y − 1 = 0 and passes through (2, 3). The equation of line g is","options":["2x − 5y = 19","−2x + 5y = 19","2x + 5y = −4","2x + 5y = −2","2x + 5y = 19"],"correct":4,"src":"M11","id":27,"topic":"M4.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Параллельная прямая имеет ту же левую часть 2x + 5y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x + 5y = C.</li><li>Подставляем (2; 3): 4 + 15 = 19.</li><li>2x + 5y = 19.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — изменён наклон.</li><li>C, D — неверная константа.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Параллельные прямые: одинаковые коэффициенты при x и y.</div></div>"},{"text":"A square of side 3 cm is cut from each corner of a square sheet, and the edges are folded up to make an open box of volume 48 cm³. What was the side of the original sheet?","options":["10","2","9","8","14"],"correct":0,"src":"M14","id":28,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание коробки (s − 6) × (s − 6), высота 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3(s − 6)² = 48 → (s − 6)² = 16.</li><li>s − 6 = 4 → s = 10.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (8) — вычли 3 вместо 6.</li><li>A ✓; B, C, E — объём не 48.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол вырезают с <b>обеих</b> сторон: −2 · 3.</div></div>"},{"text":"f(−x) = f(x) for all x, and the point (3, 8) lies on the graph of f. Which point must also lie on the graph?","options":["(−8, −3)","(−3, −8)","(−3, 8)","(3, −8)","(8, 3)"],"correct":2,"src":"M14","id":29,"topic":"M4.12","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">f(−x) = f(x) — функция чётная, график симметричен относительно оси y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(−3) = f(3) = 8 → точка (−3; 8).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — симметрия относительно оси x/начала координат.</li><li>A, E — поменяли координаты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Чётная — симметрия по y; нечётная (f(−x) = −f(x)) — по началу координат.</div></div>"},{"text":"Evaluate: 1/(√2 + 2) + 1/(√2 − 2)","options":["2√2","−2","−√2","4"],"correct":2,"src":"M14","id":30,"topic":"M2.11","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к общему знаменателю.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√2 + 2)(√2 − 2) = 2 − 4 = −2.</li><li>Числитель: (√2 − 2) + (√2 + 2) = 2√2.</li><li><span class=\"fr\"><span>2√2</span><span>−2</span></span> = −√2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли знаменатель.</li><li>B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сопряжённые знаменатели дают рациональное число.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<style id="prepline-gate-css">
  #pl-gate{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;
