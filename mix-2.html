<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"The surface area of a sphere is numerically equal to its volume. What is the radius?","options":["6","2","4","9","3"],"correct":4,"src":"M2","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь сферы 4πr², объём (4/3)πr³. Приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4πr² = (4/3)πr³.</li><li>Делим обе части на 4πr²: 1 = r/3.</li><li>r = 3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (6) — это ответ для куба (s³ = 6s²), не путайте.</li><li>B, C, D — не удовлетворяют равенству.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Формулы шара: S = 4πr², V = (4/3)πr³ — отношение V/S = r/3.</div></div>"},{"id":2,"text":"The sum of the numerator and the denominator of a fraction is 47. If 2 is subtracted from the denominator and 5 is added to the numerator, the value of the fraction becomes 2/3. Find the fraction.","options":["15/32","15/64","30/64","15/28","None of these"],"correct":0,"src":"M3","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем дробь n/d и составляем систему из двух условий.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n + d = 47.</li><li>(n + 5)/(d − 2) = 2/3 → 3(n + 5) = 2(d − 2) → 3n + 15 = 2d − 4.</li><li>Подставляем d = 47 − n: 3n + 15 = 94 − 2n − 4 → 5n = 75 → n = 15, d = 32.</li><li>Проверка: 20/30 = 2/3 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — сумма числителя и знаменателя не 47.</li><li>D (15/28) — сумма 43.</li><li>E — ответ есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте варианты на первое условие (сумма 47) — это быстро отсекает лишние.</div></div>"},{"id":3,"text":"Find the sum of the roots of 2x² + 6x + 5 = 0.","options":["−6","3","5","5/2","−3"],"correct":4,"src":"M2","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма корней квадратного уравнения по теореме Виета: −b/a.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 2, b = 6.</li><li>Сумма = −6/2 = −3.</li><li>(Дискриминант 36 − 40 < 0 — корни комплексные, но их сумма всё равно −3.)</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−6) — забыли разделить на a.</li><li>B (3) — потеряли минус.</li><li>C, D — использовали c вместо b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма корней −b/a, произведение c/a — работает всегда.</div></div>"},{"id":4,"text":"The figure is made up of seven identical squares. What is tan(∠EDB)?","image":"images/q-e2f98fb82f.png","options":["3/4","4/3","5/4","3/5","5/3"],"correct":4,"src":"M2","topic":"M5.18","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вводим координаты: стороны квадратиков = 1. Тогда tg угла считаем по катетам прямоугольного треугольника EDB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A = (0; 0), B = (5; 3) → прямая AB имеет наклон 3/5.</li><li>E = (4; 3), D лежит на AB под E: y = 3/5 · 4 = 12/5 → D = (4; 12/5).</li><li>Треугольник EDB прямоугольный в E: EB = 1, ED = 3 − 12/5 = 3/5.</li><li>tg∠EDB = противолежащий / прилежащий = EB/ED = 1 ÷ 3/5 = 5/3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (3/5) — перевёрнутое отношение (это tg угла B).</li><li>A, B, C — отношения сторон из других треугольников.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Координатная сетка из одинаковых квадратов — повод сразу ввести координаты.</div></div>"},{"id":5,"text":"HJKL is a parallelogram whose diagonals are perpendicular. Which statement must be true?","options":["HJKL is a square","HJKL is a rectangle","HJKL is a rhombus","HJKL is an isosceles trapezium","All of these are true"],"correct":2,"src":"M2","topic":"M5.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вспоминаем свойства четырёхугольников: перпендикулярные диагонали у параллелограмма — признак ромба.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Параллелограмм с перпендикулярными диагоналями — ромб.</li><li>Квадрат — частный случай (если ещё и углы 90°), но это не обязательно.</li><li>Значит, обязательно верно только «ромб».</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — углы не обязательно прямые.</li><li>D — трапеция не параллелограмм.</li><li>E — верно не всё.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Must be true» — выбирайте самое общее верное утверждение.</div></div>"},{"id":6,"text":"Goofy is 3 years older than Donald and the product of their ages is 130. Which equation has Donald's age as one of its solutions?","options":["x² − 3x − 130 = 0","x² + 3x − 130 = 0","x² + 3x + 130 = 0","x² − 3x + 130 = 0","None of these"],"correct":1,"src":"M4","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дональду x лет, Гуфи x + 3. Произведение = 130.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x(x + 3) = 130.</li><li>x² + 3x − 130 = 0.</li><li>(Корни 10 и −13 → Дональду 10, Гуфи 13.)</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это если Гуфи младше (x − 3).</li><li>C, D — знак у 130 не тот.</li><li>E — уравнение есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте: 10 · 13 = 130 ✓.</div></div>"},{"id":7,"text":"Under which condition is the expression xy/(x − y) negative?","options":["0 < y < x","x < y < 0","x < 0 < y","y < x < 0","None of these"],"correct":1,"src":"M1","topic":"M2.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знак дроби = знак числителя × знак знаменателя. Проверяем каждый случай.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B: x < y < 0 → оба отрицательные, xy > 0; x < y → x − y < 0.</li><li>Положительное ÷ отрицательное = отрицательное ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A: 0 < y < x → xy > 0, x − y > 0 → положительно.</li><li>C: x < 0 < y → xy < 0, x − y < 0 → положительно.</li><li>D: y < x < 0 → xy > 0, x − y > 0 → положительно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В задачах на знаки подставьте конкретные числа: например, x = −2, y = −1.</div></div>"},{"id":8,"text":"x₁ and x₂ are the non-negative roots of 3x² + 2mx + 1 = 0, where x₁ = 3x₂. Find m.","options":["−2","2","4","1","−4"],"correct":0,"src":"M3","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Корни 3t и t. Используем Виета: произведение и сумма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Произведение: 3t · t = 3t² = c/a = 1/3 → t² = 1/9 → t = 1/3 (неотрицательный).</li><li>Сумма: 3t + t = 4t = 4/3.</li><li>По Виета сумма = −2m/3 → −2m/3 = 4/3 → m = −2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (2) — потеряли знак в −b/a.</li><li>C, E (±4) — забыли поделить на коэффициент 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если корни связаны (x₁ = 3x₂), обозначьте их через один параметр.</div></div>"},{"id":9,"text":"If f(x) = √(9 − x²), how many integers lie in the domain of f?","options":["6","0","7","5","Infinitely many"],"correct":2,"src":"M3","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Под корнем должно быть неотрицательное число.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9 − x² ≥ 0 → x² ≤ 9 → −3 ≤ x ≤ 3.</li><li>Целые: −3, −2, −1, 0, 1, 2, 3 — всего 7.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (6) — забыли 0.</li><li>D (5) — не включили концы ±3.</li><li>E — промежуток конечный.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте 0 и концы промежутка, если неравенство нестрогое.</div></div>"},{"text":"Evaluate: (725² − 275²)/((97² − 49)(1 − 1/26))","options":["0","50","45","100/97","450/97"],"correct":1,"src":"M5","id":10,"topic":"M2.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разность квадратов в числителе и знаменателе превращает большие числа в простые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>725² − 275² = (725 − 275)(725 + 275) = 450 · 1000 = 450 000.</li><li>97² − 49 = 97² − 7² = 90 · 104 = 9360.</li><li>1 − 1/26 = 25/26 → 9360 · 25/26 = 9000.</li><li>450 000 ÷ 9000 = 50.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — числитель не равен 0.</li><li>C (45) — ошибка в множителе 25/26.</li><li>D, E — не упростили до конца.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Увидели a² − b² с «некрасивыми» числами — сразу раскладывайте.</div></div>"},{"id":11,"text":"How many four-digit numbers can be formed from the digits 0, 2, 4 and 8 without repeating a digit?","options":["18","36","27","24","64"],"correct":0,"src":"M3","topic":"M2.5","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем перестановки, помня, что число не начинается с 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая цифра: 2, 4 или 8 → 3 варианта.</li><li>Оставшиеся 3 цифры (включая 0) ставим в любом порядке: 3! = 6.</li><li>3 · 6 = 18.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (24) — все 4! перестановок, включая начинающиеся с 0.</li><li>B, C, E — повторы цифр или неверный подсчёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ограничение на первую цифру учитывайте первым.</div></div>"},{"text":"For all x and y, x♣y = x² − 2xy + y². What is the value of (2♣4)♣8?","options":["12","16","1","20","4"],"correct":1,"src":"M5","id":12,"topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² − 2xy + y² = (x − y)². Операция — квадрат разности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2♣4 = (2 − 4)² = 4.</li><li>4♣8 = (4 − 8)² = 16.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (4) — посчитали только внутреннюю операцию.</li><li>A, C, D — арифметические ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Узнавайте формулы сокращённого умножения в «новых операциях».</div></div>"},{"text":"In right-angled triangle ABC, sin A = 3/5. What is cot B?","options":["5/4","4/5","5/3","3/4","4/3"],"correct":3,"src":"M7","id":13,"topic":"M5.18","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В прямоугольном треугольнике sin A = противолежащий / гипотенуза. Строим треугольник 3-4-5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Прямой угол при C: BC = 3 (против A), AB = 5.</li><li>AC = √(25 − 9) = 4.</li><li>cot B = прилежащий / противолежащий для B = BC/AC = 3/4.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (4/3) — это tg B (перевёрнуто).</li><li>A, C — отношения с гипотенузой.</li><li>B (4/5) — это cos A.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для острых углов прямоугольного треугольника: cot B = tg A.</div></div>"},{"id":14,"text":"The mean of the roots of a quadratic equation is 3 and the difference between the roots is 2. Which equation fits?","options":["x² − 5x + 6 = 0","x² + 5x + 6 = 0","x² − 6x + 8 = 0","x² − 6x − 8 = 0","x² − 6x + 6 = 0"],"correct":2,"src":"M1","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Среднее корней 3 → сумма 6; разность 2 → корни 2 и 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x₁ + x₂ = 6, x₁ − x₂ = 2 → x₁ = 4, x₂ = 2.</li><li>(x − 2)(x − 4) = x² − 6x + 8.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — корни 2 и 3 (среднее 2,5).</li><li>B — корни отрицательные.</li><li>D, E — произведение корней не 8.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уравнение по корням: x² − (сумма)x + (произведение) = 0.</div></div>"},{"id":15,"text":"√(10 × (6⁴ − 16)/32) = ?","options":["√5","15","20","24","√10"],"correct":2,"src":"M1","topic":"M2.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычисляем по порядку, начиная с внутренних скобок.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6⁴ = 1296.</li><li>1296 − 16 = 1280.</li><li>1280 ÷ 32 = 40.</li><li>10 · 40 = 400 → √400 = 20.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — ошибки в счёте.</li><li>A, E — забыли умножить на 10 или не извлекли корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 6⁴ = 36² = 1296 — удобно считать через квадрат.</div></div>"},{"text":"An integer m leaves a remainder of 5 when divided by 6. What is the remainder when 4m is divided by 6?","options":["0","1","2","4","5"],"correct":2,"src":"M5","id":16,"topic":"M2.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем m в виде 6k + 5 и умножаем на 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m = 6k + 5.</li><li>4m = 24k + 20 = 24k + 18 + 2 = 6(4k + 3) + 2.</li><li>Остаток 2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (5) — остаток не сохраняется при умножении.</li><li>B, D — 20 ÷ 6 даёт остаток 2, а не 1 или 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Остаток произведения = остаток (4 · 5 = 20) при делении на 6 → 2. Проверка на числе: m = 5 → 20 ÷ 6 = 3 ост. 2.</div></div>"},{"id":17,"text":"Which is the equation of the line through the points (−1, −4) and (3, 8)?","options":["y = x/3 + 7","y = −x/3 + 9","y = 3x − 1","y = −3x − 7"],"correct":2,"src":"M3","topic":"M4.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим угловой коэффициент, затем свободный член.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон = (8 − (−4))/(3 − (−1)) = 12/4 = 3.</li><li>y = 3x + c, подставляем (−1; −4): −4 = −3 + c → c = −1.</li><li>y = 3x − 1. Проверка: (3; 8): 9 − 1 = 8 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — наклон ±1/3 (перевёрнутая дробь).</li><li>D — наклон −3 (ошибка в знаке).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте обе точки в ответ — быстрая проверка.</div></div>"},{"id":18,"text":"The operation ∇x = 3x − 3 is defined for x > 0. What is ∇7/∇3, expressed in the form ∇(?)","options":["∇3","∇8","∇2","∇9","∇6"],"correct":2,"src":"M3","topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем ∇7 и ∇3, делим, и находим, при каком x операция даёт это число.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∇7 = 21 − 3 = 18; ∇3 = 9 − 3 = 6.</li><li>18 ÷ 6 = 3.</li><li>∇x = 3 → 3x − 3 = 3 → x = 2 → ответ ∇2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (∇3) — ∇3 = 6, а не 3.</li><li>B, D, E — не дают значение 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ должен быть в виде ∇(?): решите уравнение ∇x = результату.</div></div>"},{"text":"It is now 1:15. What will the time be when the hour hand has turned through 10°?","options":["1:25","1:35","2:15","3:15","11:15"],"correct":1,"src":"M7","id":19,"topic":"M1.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Часовая стрелка проходит 360° за 12 часов, то есть 30° в час = 0,5° в минуту.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10° ÷ 0,5° = 20 минут.</li><li>1:15 + 20 мин = 1:35.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — это движение минутной стрелки или целые часы.</li><li>A (1:25) — посчитали 1° в минуту.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая стрелка: 0,5°/мин; минутная: 6°/мин.</div></div>"},{"id":20,"text":"The operation ∆ is defined by a∆b = √b/(a² + b²), and the operation ∇ by a∇b = (a∆b)/((b∆a)²). What is 2∇4?","options":["20","40","1/20","1/40","10"],"correct":0,"src":"M2","topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аккуратно считаем по определениям: сначала обе ∆-операции, потом ∇.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2∆4 = √4/(2² + 4²) = 2/20 = 1/10.</li><li>4∆2 = √2/(16 + 4) = √2/20; в квадрате: 2/400 = 1/200.</li><li>2∇4 = (1/10) ÷ (1/200) = 20.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1/20) — перевернули деление.</li><li>B, D, E — ошибка в квадрате √2/20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внимательно с порядком аргументов: a∆b ≠ b∆a.</div></div>"},{"id":21,"text":"If ab = 8/3, bc = 12 and ac = 2, what is the cube root of abc?","options":["2","1","3","5","4"],"correct":0,"src":"M1","topic":"M4.6","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем три равенства: (abc)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(ab)(bc)(ac) = (abc)² = 8/3 · 12 · 2 = 64.</li><li>abc = 8.</li><li>∛8 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (4) — квадратный корень вместо кубического.</li><li>B, C, D — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же приём, что и с xy, xz, yz: перемножить всё.</div></div>"},{"text":"A quadratic equation has solutions a and b, where a + b = −5 and ab = 3. Which is the equation?","options":["x² + 5x + 3 = 0","x² − 5x − 3 = 0","x² − 5x + 3 = 0","x² + 3x + 5 = 0","x² + 5x − 3 = 0","x² + 3x − 5 = 0"],"correct":0,"src":"M7","id":22,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по сумме и произведению корней: x² − (a + b)x + ab = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a + b = −5 → −(a + b) = +5.</li><li>ab = 3.</li><li>x² + 5x + 3 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — знак у 5x не тот.</li><li>B, E — знак у свободного члена не тот.</li><li>D, F — перепутаны коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус перед суммой — главная ловушка.</div></div>"},{"id":23,"text":"Nicky and Christina run a race. Christina gives Nicky a head start of 36 metres. Christina runs at 5 m/s and Nicky at 3 m/s. After how many seconds does Christina catch Nicky?","options":["15 s","18 s","25 s","30 s","45 s"],"correct":1,"src":"M3","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кристина догоняет со скоростью сближения 5 − 3 = 2 м/с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужно сократить разрыв 36 м.</li><li>36 ÷ 2 = 18 с.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (45 с) — поделили на 0,8?</li><li>A, C, D — ошибочная скорость сближения (например, 36 ÷ 3 или делили на 5).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Догонялки: время = разрыв ÷ разность скоростей.</div></div>"},{"text":"The range of the function f(x) = x² − 14x + 43 is","options":["(−∞, +∞)","x ≤ 7","y ≥ −6","y ≤ −6","x ≥ 0"],"correct":2,"src":"M5","id":24,"topic":"M4.11","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Множество значений параболы — от вершины вверх (при a > 0). Выделяем полный квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 14x + 43 = (x − 7)² − 49 + 43 = (x − 7)² − 6.</li><li>(x − 7)² ≥ 0 → f(x) ≥ −6.</li><li>Range: y ≥ −6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — парабола ограничена снизу.</li><li>B, E — это ограничения на x, а не на y.</li><li>D — ветви вверх, а не вниз.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Range — про y, domain — про x.</div></div>"},{"id":25,"text":"Which value of x satisfies the equation √(2x − 5 + x) = 4?","options":["5","21","36","56","7"],"correct":4,"src":"M2","topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем подкоренное выражение, возводим в квадрат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x − 5 + x = 3x − 5.</li><li>√(3x − 5) = 4 → 3x − 5 = 16 → x = 7.</li><li>Проверка: √16 = 4 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (21) — забыли привести подобные или поделить на 3.</li><li>A, C, D — не проходят проверку.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После возведения в квадрат всегда проверяйте корень.</div></div>"},{"id":26,"text":"What is the sum of the roots of 2x³ − 4x² + 9x = 0?","options":["4","3","1/2","3/4","2"],"correct":4,"src":"M1","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выносим x за скобку: один корень 0, остальные — по Виета.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x(2x² − 4x + 9) = 0.</li><li>x = 0 — первый корень.</li><li>Сумма корней квадратного: −(−4)/2 = 2.</li><li>Всего: 0 + 2 = 2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (4) — забыли поделить на 2.</li><li>B, C, D — ошибки с коэффициентами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Для кубического ax³ + bx² + … сумма всех корней = −b/a = 4/2 = 2 — то же самое сразу.</div></div>"},{"id":27,"text":"The curved surface of a skateboard ramp is a quarter of a cylinder of radius r feet and height h feet, together with a flat rectangular section. Which formula gives the area of the top surface of the ramp?","options":["2rh + 2πr²","2rh + 2πrh","2rh + (1/4)πr²","2rh + (1/2)πrh","None of these formulae"],"correct":3,"src":"M3","topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верхняя поверхность = ¼ боковой поверхности цилиндра + плоский прямоугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Боковая поверхность цилиндра = 2πrh; четверть = ½πrh.</li><li>Плоская часть — прямоугольник 2r × h = 2rh.</li><li>Сумма: 2rh + ½πrh.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — использовали πr² (площадь круга), а не боковую поверхность.</li><li>B — взяли всю боковую поверхность цилиндра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изогнутая поверхность — это часть боковой поверхности (2πrh), а не основания.</div></div>"},{"id":28,"text":"For which value of b does the system {2x + 5y = 3; −5x + by = 14} have no solution?","options":["5","5/2","−25/2","5/3","5/14"],"correct":2,"src":"M3","topic":"M4.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет решений ⇔ прямые параллельны: коэффициенты при x и y пропорциональны, а свободные члены — нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2/(−5) = 5/b → 2b = −25 → b = −25/2.</li><li>Проверка: 3/14 ≠ 2/(−5) → прямые не совпадают ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не дают пропорциональности коэффициентов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропорциональны и свободные члены → бесконечно много решений; не пропорциональны → решений нет.</div></div>"},{"id":29,"text":"Find the smallest integer value of m for which mx² + (2m + 1)x + (m − 1) = 0 has two real roots.","options":["−1","1","8","−8","0"],"correct":1,"src":"M2","topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два действительных корня: уравнение должно быть квадратным (m ≠ 0) и D > 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D = (2m + 1)² − 4m(m − 1) = 4m² + 4m + 1 − 4m² + 4m = 8m + 1.</li><li>8m + 1 > 0 → m > −1/8.</li><li>Наименьшее целое больше −1/8 — это 0, но при m = 0 уравнение линейное (x − 1 = 0), один корень.</li><li>Значит, m = 1.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (0) — уравнение перестаёт быть квадратным.</li><li>A, D (−1, −8) — дают D < 0.</li><li>C (8) — подходит, но не наименьшее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При параметре у x² всегда проверяйте случай, когда он равен 0.</div></div>"},{"id":30,"text":"Find the gradient of the line through the points (−4, −4) and (−3, −3).","options":["1","1/2","1/7","7","Not enough information"],"correct":0,"src":"M2","topic":"M4.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Наклон = Δy / Δx.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δy = −3 − (−4) = 1.</li><li>Δx = −3 − (−4) = 1.</li><li>Наклон = 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — ошибки со знаками при вычитании отрицательных чисел.</li><li>E — двух точек достаточно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус на минус: −3 − (−4) = −3 + 4 = 1.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#DADDE2}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
