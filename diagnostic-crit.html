<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;

    transition: background-position .4s, box-shadow .3s, transform .15s;

  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }

  @media (max-width: 480px) {

    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "It is not always clear whether a doctor should tell the truth to a patient or not. On the one hand, patients have a right to know what is the matter with them and what the future holds, so that they can make their own informed decisions, however upsetting the truth may be. It is a simple issue of human rights. But on the other hand, a patient's health may sometimes be better served by not knowing a frightening truth. For instance, a doctor may believe that a patient's medical condition will actually worsen if they realise how serious it is. Therefore, there are cases in which doctors have no choice: they must decide in favour of deceiving the patient.<br><br><b>Which of the following is an underlying assumption of the above argument?</b>", "options": ["Patients accept that a doctor has a responsibility to decide what will be in their best interests.", "Doctors have a duty to conceal the truth if they believe it will frighten the patient.", "Doctors have a duty to tell their patients the truth even when the truth would upset them.", "Doctors have a greater responsibility for a patient's well-being than for their right to know the truth.", "It is the responsibility of doctors to respect a patient's human rights whatever their medical condition."], "correct": 3, "src": "ASM", "topic": "ASM", "explain": "The argument jumps from \"there is a conflict between the right to know and the patient's health\" to \"doctors <i>must</i> deceive\". That only follows if health/well-being matters more than the right to the truth — that is D.<br>B is stronger than the argument (it says deceiving is needed only when health would worsen, not whenever the truth is frightening); C and E point the other way; A is about patients' views, which the argument never uses."}, {"id": 2, "text": "In attempting to reduce the high injury toll from road offences such as drink-driving, successive governments have tended to rely on the deterrent effect of increasingly severe penalties. However, severe penalties can act as a deterrent only if potential offenders believe that the chances of being detected are moderate or high. Recent surveys have shown that people perceive the chance of detection for the offence of drink-driving as being very small.<br><br><b>Which one of the following can be concluded from the passage above?</b>", "options": ["Severe penalties for the offence of drink-driving do not constitute an effective deterrent.", "Successive governments have not tackled the problem of drink-driving.", "Drink-driving offenders have a misguided perception of their chances of detection.", "Penalties for road offences such as drink-driving should be even more severe.", "There must be better ways to tackle drink-driving, for example education."], "correct": 0, "src": "CON", "topic": "CON", "explain": "The passage gives two premises: severe penalties deter only if people think detection is fairly likely, and people think detection for drink-driving is very unlikely. Put together: severe penalties for drink-driving do not work as a deterrent — A.<br>B, D and E go beyond the passage; C assumes the perception is wrong, which the passage does not say."}, {"id": 3, "text": "In the UK, most people open a bank account in their teenage years. There is then a tendency not to change banks: eleven per cent of bank customers are still with the bank their parents set them up with when they were a child and haven’t changed it since. This strongly suggests that, contrary to what most commentators say, people are not unhappy with the service that their banks provide.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>", "options": ["Nearly two-thirds of UK bank customers have changed banks and two per cent have switched over five times.", "Bank customers say that they feel that all banks provide the same level of service.", "Nearly two-thirds of customers say they are happy with their bank’s service.", "Bank services change as people get older and their needs change.", "It is not difficult to change banks."], "correct": 0, "src": "EF", "topic": "EF", "explain": "The argument says people are happy with their banks because they don't change them, using the 11% who never switched. A shows the opposite: almost two-thirds <i>have</i> changed, some many times, so not changing is not the typical behaviour and the evidence collapses.<br>C would strengthen; B, D and E don't show that the 11% figure misrepresents customers."}, {"id": 4, "text": "It would be a good idea if the police force was separated into two divisions, one for proper policing i.e. protecting citizens and upholding law and order, and the other for road traffic. This second division could be combined with traffic wardens as basically they are doing a similar job: obtaining money from road users. Perhaps then there would be a proper focus put on catching criminals and protecting the law-abiding public, and we would have a police force doing the job they were actually intended to do.<br><br><b>Which one of the following best describes the flaw in the above argument?</b>", "options": ["It overlooks the fact that many traffic offences are both criminal and a serious danger to the public.", "It rests on the false assumption that the police do not protect citizens or catch criminals.", "It ignores the fact that traffic wardens and the police have different duties and different powers.", "It wrongly equates protecting citizens with catching criminals.", "It implies that the police once did the job they were supposed to do."], "correct": 0, "src": "FLAW", "topic": "FLAW", "explain": "The argument treats road traffic work as just \"obtaining money from road users\", separate from protecting the public. But many traffic offences (e.g. dangerous or drunk driving) are crimes that endanger people, so traffic policing <i>is</i> protecting citizens — A."}, {"id": 5, "text": "<b>Choose your answer from the image above:</b>", "options": ["A", "B", "C", "D", "E"], "correct": 0, "src": "MC", "image": "images/q-dd00338267.png", "topic": "MC", "explain": "Everything in the passage (the stealing example, the tone/exclamation-mark comparison) supports the first sentence: adding 'right' or 'wrong' adds nothing to the factual content — A.<br>B is the example used as evidence; E is the explanation of what such words do instead; C contradicts the passage; D is not discussed."}, {"id": 6, "text": "<p>Public funding for the arts has long been controversial. Opponents argue that taxpayer money should not be spent on things like experimental theatre or abstract sculpture that do not benefit everyone. However, supporters point out that public funding has enabled access to art for wider audiences, supported cultural education in schools, and preserved national heritage. Without such funding, many smaller projects would never get off the ground. Therefore, government support for the arts is a justified and important use of public funds.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Art should be accessible to everyone.", "Supporting the arts helps preserve national identity.", "The arts deserve public funding.", "Most people do not appreciate experimental theatre.", "Public funds are often wasted."], "correct": 2, "src": "CRIT31", "orig": "images/q-23a7966427.jpg", "explain": "The last sentence, introduced by \"Therefore\", is the conclusion: government support for the arts is a justified use of public funds — C. A and B are reasons supporting it; D and E are not claimed.", "topic": "MC"}, {"id": 7, "text": "<p>Population density depends on both population and country area. Thus, the density of Belize is the population 269,736 divided by the country area 22,968, giving a density of about 12 people per square kilometre.</p><p>Find the country in the table which has the smallest population density. Which option includes this country?</p><table class=\"q-table\"><thead><tr><th>Country</th><th>Population</th><th>Area (km\\(^2\\))</th></tr></thead><tbody><tr><td>Belize</td><td>269,736</td><td>22,968</td></tr><tr><td>Djibouti</td><td>793,078</td><td>23,200</td></tr><tr><td>Estonia</td><td>1,329,697</td><td>45,108</td></tr><tr><td>Latvia</td><td>2,306,988</td><td>64,600</td></tr><tr><td>Panama</td><td>3,231,502</td><td>75,517</td></tr><tr><td>Bhutan</td><td>2,162,546</td><td>47,000</td></tr><tr><td>Montenegro</td><td>630,548</td><td>14,026</td></tr><tr><td>French Guiana</td><td>187,056</td><td>91,000</td></tr><tr><td>New Caledonia</td><td>236,838</td><td>18,575</td></tr><tr><td>Solomon Islands</td><td>477,742</td><td>28,896</td></tr><tr><td>Equatorial Guinea</td><td>503,519</td><td>28,051</td></tr><tr><td>Monaco</td><td>35,253</td><td>1</td></tr><tr><td>The Bahamas</td><td>323,063</td><td>13,878</td></tr><tr><td>Pitcairn Islands</td><td>67</td><td>5</td></tr><tr><td>Vanuatu</td><td>211,367</td><td>12,189</td></tr></tbody></table>", "image": "", "options": ["Belize, Djibouti, Estonia", "Latvia, Panama, Bhutan", "Montenegro, French Guiana, New Caledonia", "Solomon Islands, Equatorial Guinea, Monaco", "The Bahamas, Pitcairn Islands, Vanuatu"], "correct": 2, "src": "CRIT31", "orig": "images/q-b88c2855fb.jpg", "explain": "Density = population ÷ area. Most countries are above 10 people/km² (Monaco is about 35,000). French Guiana: 187,056 ÷ 91,000 ≈ 2 people/km² — by far the smallest. It is in option C.", "topic": "PS"}, {"id": 8, "text": "<p>Many people assume that working long hours is a sign of dedication and productivity. However, research consistently shows that people who work more than 50 hours a week are actually less productive overall. Fatigue, stress, and poor work-life balance contribute to a decline in focus and efficiency. Some companies that adopted shorter workweeks have even reported increased output. Clearly, working fewer hours can lead to better overall performance.</p><p>Which one of the following best expresses the main conclusion of the above argument?</p>", "image": "", "options": ["Long hours damage workers' health.", "Companies should let employees choose their hours.", "Productivity decreases when people work too much.", "Working fewer hours can increase productivity.", "Employees prefer shorter workweeks."], "correct": 3, "src": "CRIT31", "orig": "images/q-ba180be336.jpg", "explain": "The final sentence (\"Clearly…\") is the conclusion: working fewer hours can lead to better performance — D. C is the reason (research on long hours) that supports it; the others are not claimed.", "topic": "MC"}, {"id": 9, "text": "<p>A recent advertisement promoting green tea claimed that people who consume it daily experience significantly lower levels of stress. This claim was based on a small study involving 50 volunteers, all of whom drank green tea every day for one week. At the end of the trial, most participants reported feeling calmer and more relaxed. The company behind the advertisement concluded that green tea directly reduces stress and recommended it as a natural solution. However, the study included no control group and relied entirely on self-reported data.</p><p>Which of the following, if true, most weakens the argument?</p>", "image": "", "options": ["The participants already preferred green tea before the study.", "Stress is difficult to measure objectively.", "The study didn't compare green tea to other drinks.", "Only 50 people participated in the study.", "People often exaggerate their feelings in surveys."], "correct": 0, "src": "CRIT34", "orig": "images/q-d845cab33c.jpg", "explain": "The claim is that green tea itself reduces stress. If the volunteers already liked green tea, they probably expected to feel better and reported feeling calmer for that reason, not because of the tea — A.<br>C and D repeat weaknesses the passage already states; B and E are general points that don't target this study as directly.", "topic": "WKN"}, {"id": 10, "text": "<p>Aruzhan is using a traditional family recipe that calls for 3 cups of flour to make 12 shelpeks. The recipe proportions are carefully balanced to ensure the texture and taste come out just right. One day, the Aruzhan decides to make only 8 muffins, since she doesn't need the full batch. She wants to keep the ingredient ratios consistent so that the quality of the muffins remains unchanged. To do this, she needs to calculate how much flour is required when preparing a smaller portion.</p><p>How much flour should she use to make 8 shelpek?</p>", "image": "", "options": ["1.5 cups", "2 cups", "2.25 cups", "2.5 cups", "3 cups"], "correct": 1, "src": "CRIT34", "orig": "images/q-001f8db23a.jpg", "explain": "3 cups make 12, so each one needs 3 ÷ 12 = ¼ cup. For 8: 8 × ¼ = 2 cups.", "topic": "PS"}];

let state = { idx: 0, answers: {}, timeLeft: 600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  let verdict;
  if (pct >= 80) verdict = 'A strong start — you can move straight on to the full tests.';
  else if (pct >= 50) verdict = 'The basics are there, but you should work through several full tests.';
  else verdict = 'There is room to grow — start with full tests on the topics where you made most mistakes.';

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:14px; margin-bottom:16px; color:var(--text-bright);">${verdict}</p>
    <a href="crit.html" style="display:inline-block; text-decoration:none; background:var(--grad); color:#15181D; font-weight:600; padding:10px 20px; border-radius:10px; margin-bottom:20px;">Go to the full tests &rarr;</a>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
