<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m058_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">¾ банок весят 20 − 14 = 6 → все банки 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Кулер 20 − 8 = 12. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 20 − 10.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите вес всех банок.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m058_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">∠BDA = 180° − B − <span class=\"fr\"><span>A</span><span>2</span></span>, A = 180° − B − C.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠BDA = 90° − <span class=\"fr\"><span>B − C</span><span>2</span></span> = 90 − 10 = 80°. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 85.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите через B − C.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m058_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одной победы мало: C = 12, а A или B получит ≥ 4 → 16.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Две победы: C = 20, A и B — по 12 + 4 + 2 = 18. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — одной игры мало.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Худший случай для соперников.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m058_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый час удвоение: 2 · 2ᴺ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2ᴺ⁺¹. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — начинали с одной.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начальное число × 2ᴺ.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m058_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Всё к основанию 2: 2^{<span class=\"fr\"><span>1</span><span>3</span></span>} · 2^{<span class=\"fr\"><span>3</span><span>4</span></span>} · 2^{<span class=\"fr\"><span>1</span><span>3</span></span>} / 2^{<span class=\"fr\"><span>13</span><span>12</span></span>}.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2^{<span class=\"fr\"><span>4 + 9 + 4 − 13</span><span>12</span></span>} = 2^{<span class=\"fr\"><span>1</span><span>3</span></span>} = ∛2. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте дробные показатели.</div></div>", "topic": "M2.7"}, {"id": 7, "text": "", "image": "images/math-new/m058_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вклад: 350 · 12 / 0,09 ≈ 46 667. Нужно 350 · 1,15 = 402,5 в месяц.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>402,5 · 12 / 0,08 = 60 375. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без +15%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Годовой доход = 12 месяцев.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m058_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона × <span class=\"fr\"><span>1</span><span>√2</span></span> на каждом шаге.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9-й квадрат: 6 · <span class=\"fr\"><span>1</span><span>√2</span></span>⁸ = <span class=\"fr\"><span>6</span><span>16</span></span> = <span class=\"fr\"><span>3</span><span>8</span></span>; периметр <span class=\"fr\"><span>3</span><span>2</span></span>. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — на шаг меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Два шага — сторона пополам.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m058_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стенка 13 × h = 39 → h = 3; отсечён прямоугольный треугольник 5–12–13.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Малый отсек ½ · 5 · 12 · 3 = 90; коробка 15 · 12 · 3 = 540.</li><li>Большой 540 − 90 = 450. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — вся коробка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Целое минус малый отсек.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m058_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>3(N + 3) − 3</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>3N + 6</span><span>3</span></span> = N + 2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — N + 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Раскройте скобки.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m058_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мег перед Бобом — ровно половина всех порядков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5!/2 = 60. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — все порядки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Симметрия.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m058_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подъём = V / S дна = 2 / 12 фута.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>6</span></span> фута = 2 дюйма. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — в футах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переведите единицы.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m058_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Излишки: 25 − 16 = 9, 16 − 9 = 7, 9 − 4 = 5, 4 − 1 = 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>24 из 50 заполнено → 48%, пусто 52%. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — спрашивают пустое.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Читайте вопрос.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m058_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общая касательная в B: MB = MT = MP → ∠PBT = 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угол касательной и хорды: ∠BTP = ∠BAT = 48° → ∠BPT = 42°.</li><li>∠PCB = ∠BPT = 42°. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 48.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол между касательной и хордой = вписанному.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m058_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(<span class=\"fr\"><span>x</span><span>5</span></span> + 7) · 5 = x + 35.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Больше на 35. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — +7.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Раскройте скобку.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m058_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нижний: 3 × 5 = 15; верхний: (8 − 3)(9 − 5) = 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>35. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 8 · 9 + …</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стороны по координатам.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m058_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК(18, 24) = 72.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>72 делится на 12. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 16 не делит 72.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делится на НОК.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m058_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждое из следующих пяти больше на 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>w + 25. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — +5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 5 · 5.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m058_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дробная часть = целая / 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4,8: 4 : 5 = 0,8 ✔. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 2,42 ≠ 2,4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте варианты.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m058_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Осталось 300° → длина дуги 2π · 12 · <span class=\"fr\"><span>5</span><span>6</span></span> = 20π = 2πr → r = 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>h = √(12² − 10²) = √44. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (√140) — в старом ключе, неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Образующая = радиус листа.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m058_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прибавки растут: 1, 3, 6, 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Возрастающая, всё круче — график D. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — линейный.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Смотрите на разности.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m058_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По графику f(0) = −1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(−1) = −2. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — f(0).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Изнутри наружу.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m058_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ширина 2a, высота 3b − (−b) = 4b.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8ab. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 3b.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разности координат.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m058_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">t = ad: t + <span class=\"fr\"><span>2</span><span>t</span></span> = 4 → t² + <span class=\"fr\"><span>4</span><span>t²</span></span> = 16 − 4 = 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 · 12 = 36. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без вычета 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадрат суммы.</div></div>"}, {"id": 31, "topic": "M4.18", "text": "<p>The sequence 2, 9, 16, 23, … is arithmetic.</p><p>What is its 25th term?</p>", "image": "", "options": ["50", "156", "170", "175", "177"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">aₙ = a₁ + (n − 1)d.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a₁ = 2, d = 7.</li><li>2 + 24·7 = 170. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — умножили первый член на n.</li><li>D — забыли первый член.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте формулу на n = 1.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.15", "text": "<p>A cone has base radius 3 cm and perpendicular height 10 cm.</p><p>What is its volume, in terms of \\(\\pi\\)?</p>", "image": "", "options": ["\\(90\\pi\\) cm³", "\\(30\\pi\\) cm³", "\\(10\\pi\\) cm³", "\\(120\\pi\\) cm³", "\\(45\\pi\\) cm³"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = ⅓πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>⅓ · 9 · 10 = 30 → 30π. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли ⅓.</li><li>C — радиус не в квадрате.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Конус = ⅓ цилиндра.</div></div>", "src": "PL"}, {"id": 33, "topic": "M3.8", "text": "<p>A price is increased by 30%, then the new price is decreased by 10%.</p><p>What is the overall percentage change?</p>", "image": "", "options": ["+20%", "−17%", "+40%", "+17%", "+16%"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножьте множители изменений.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,3 · 0,9 = 1,17.</li><li>Изменение: +17%. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — проценты нельзя просто складывать — они от разных сумм.</li><li>B — перепутали знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последовательные проценты — умножение, а не сложение.</div></div>", "src": "PL"}, {"id": 34, "topic": "M5.13", "text": "<p>The bearing of Q from P is 118°.</p><p>What is the bearing of P from Q?</p>", "image": "", "options": ["298°", "118°", "062°", "028°", "242°"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный азимут = исходный ± 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>118° + 180 = 298°. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — направление то же.</li><li>E — вычли из 360 — это отражение, а не обратный азимут.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответ всегда тремя цифрами.</div></div>", "src": "PL"}, {"id": 35, "topic": "M5.11", "text": "<p>How many edges does a pentagonal prism have?</p>", "image": "", "options": ["7", "10", "12", "15", "17"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Призма с n-угольным основанием: 3n рёбер; пирамида: 2n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проверка по Эйлеру: V − E + F = 10 − 15 + 7 = 2. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это число граней.</li><li>B — это число вершин.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> F + V = E + 2.</div></div>", "src": "PL"}, {"id": 36, "topic": "M2.13", "text": "<p>Round 615.48 to 2 significant figures.</p>", "image": "", "options": ["62", "620", "600", "1240", "615"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Значащие цифры считаются с первой ненулевой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая ненулевая цифра — начало счёта; округляем по следующей цифре: 620. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — округлили до 2 знаков после запятой или потеряли разряд.</li><li>C — это 1 значащая цифра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нули в начале не считаются, нули-заполнители в конце сохраняем.</div></div>", "src": "PL"}, {"id": 37, "topic": "M5.18", "text": "<p>In a right-angled triangle the side opposite angle θ is 3 cm, the side adjacent to θ is 4 cm and the hypotenuse is 5 cm.</p><p>What is \\(\\sin\\theta\\)?</p>", "image": "", "options": ["\\(\\dfrac{3}{4}\\)", "\\(\\dfrac{7}{5}\\)", "\\(\\dfrac{4}{5}\\)", "\\(\\dfrac{3}{5}\\)", "\\(\\dfrac{5}{3}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">SOH CAH TOA.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>sin θ = <span class=\"fr\"><span>3</span><span>5</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перепутали функцию.</li><li>C — перепутали стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> sin = противолежащий/гипотенуза, cos = прилежащий/гипотенуза, tan = противолежащий/прилежащий.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
