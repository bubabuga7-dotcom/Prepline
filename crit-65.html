<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2016 · original Q20 · Principle</p>", "image": "images/ct-pp/ct086_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знаменитости подают пример → другие делают так же.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D: директора поощряют переработку, показывая пример сами. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — уважать мнение во всём.</li><li>B — обратный пример.</li><li>C, E — без идеи «личного примера».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Влияние через пример.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct086_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">За круг: красных 4, синих 1, зелёных 3, жёлтых 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>За 6 кругов: −24, −6, −18, −12; каждого цвета было n.</li><li>Синих n − 6 = половина остатка (4n − 60) → 2n − 12 = 4n − 60 → n = 24.</li><li>Всего 96. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не дают «половину синих».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Составьте уравнение.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q2 · Problem solving</p>", "image": "images/ct-pp/ct086_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вид сбоку — линии там, где меняется рельеф профиля.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сверяем расстояния между линиями с уступами сечения; E не совпадает ни с одной стороной. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — виды с разных сторон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый уступ = линия.</div></div>"}, {"id": 4, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct086_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Письмо в 15:00 Лондона; часы работы 8:00–17:15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Прага (16:00) и Оттава (10:00) читают сразу — в 15:00 по Лондону.</li><li>Найроби и Москва (18:00) прочтут в 8:00 местного = 5:00 Лондона.</li><li>15:00 → 5:00 = 14 ч. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Канберра, Джакарта, Гонконг прочтут раньше — до 0:00 Лондона.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переводите всё во время Лондона.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q4 · Problem solving</p>", "image": "images/ct-pp/ct086_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">7 предметов — делим на посылки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 + 3: 1,30 + 0,95 = 2,25 £ — минимум. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>5 + 2 = 2,30; 2 + 2 + 3 = 2,35; одной посылкой 3,30.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переберите разбиения.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct086_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">От двери: шкаф справа в углу, кровать на той же стороне длиннее половины комнаты, стол у другой стены.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Так расположено только в A. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>В других шкаф слева, или кровать короткая, или стол не там.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Встаньте в дверях мысленно.</div></div>"}, {"id": 7, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q6 · Problem solving</p>", "image": "images/ct-pp/ct086_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сетка n × n: горизонтальных (n + 1) · n, вертикальных столько же.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 × 10: 2 · 11 · 10 = 220. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 11 · 11 · 2; D — забыли крайнюю линию.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверьте на 2 × 2: 12.</div></div>"}, {"id": 8, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q7 · Drawing a conclusion</p>", "image": "images/ct-pp/ct086_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перешли на никотин, а его долгосрочный вред неизвестен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не стоит считать е-сигареты безопасной заменой. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — «так же вредны» — слишком сильно.</li><li>A, B, C — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод.</div></div>"}, {"id": 9, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q8 · Drawing a conclusion</p>", "image": "images/ct-pp/ct086_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пальмовое масло вредно, но замена может требовать ещё больше леса.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Запрет одного пальмового масла не решит всех проблем. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — не сказано.</li><li>C, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Учтите «Yet…».</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct086_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Бег 6 км/ч (1 ч), отдых 20 мин, 10 км/ч до Банби, 20 мин, велосипед 16 км/ч до Карстона.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклоны растут, в 14:10 — в Карстоне, стоянка до 15:00, обратно 24 км за 50 мин — самый крутой спуск.</li><li>Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — мгновенное возвращение.</li><li>B, D — первый участок самый быстрый.</li><li>C — неверные паузы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наклон = скорость.</div></div>"}, {"id": 11, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q10 · Flaw</p>", "image": "images/ct-pp/ct086_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод о сайтах — из опыта одной пользовательницы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Один пример не позволяет обобщать. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один случай ≠ правило.</div></div>"}, {"id": 12, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q11 · Weaken</p>", "image": "images/ct-pp/ct086_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Индустрия: траление может быть полезно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если сети уничтожают многие исчезающие виды — вред очевиден. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — усиливают.</li><li>B, C — не о природе.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите реальный вред.</div></div>"}, {"id": 13, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q12 · Assumption</p>", "image": "images/ct-pp/ct086_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Убрать капитана, чтобы команда сплотилась.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: его поступки подорвали дух команды. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — слишком сильно.</li><li>B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Звено «скандал → команда».</div></div>"}, {"id": 14, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q13 · Problem solving</p>", "image": "images/ct-pp/ct086_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">За цикл Люк проходит 50 м, щенок — 100 вперёд и 50 назад = 150 м.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Щенок втрое быстрее; Люк: 1 км за 12 мин = 5 км/ч.</li><li>Щенок 15 км/ч. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 100 + 100 м за цикл.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение путей = отношение скоростей.</div></div>"}, {"id": 15, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q14 · Weaken</p>", "image": "images/ct-pp/ct086_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Курсов больше, рабочих мест нет → жёсткая конкуренция.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если многие выпускники уходят в другие профессии — конкуренция меньше. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — усиливают.</li><li>E — не по теме.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уменьшите число претендентов.</div></div>"}, {"id": 16, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q15 · Problem solving</p>", "image": "images/ct-pp/ct086_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Калории за полчаса = половина часового значения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Джози (100 кг): 175 + 120 = 295.</li><li>Гарри 255, Джесси 230, Холли 195, Пол 190. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переводите минуты в долю часа.</div></div>"}, {"id": 17, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q16 · Assumption</p>", "image": "images/ct-pp/ct086_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Банк и так покрывает мошенничество → страховка не нужна.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: страховка покрывает только расходы по мошенничеству с картами. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ослабляет.</li><li>B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> А если страховка покрывает больше?</div></div>"}, {"id": 18, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q17 · Principle</p>", "image": "images/ct-pp/ct086_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Налог на топливо должен идти на дороги и транспорт.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Принцип: деньги от деятельности тратить на эту же сферу.</li><li>D: доходы от спорта — на развитие спорта. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — приоритеты внутри темы.</li><li>E — отмена налогов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деньги — туда, откуда пришли.</div></div>"}, {"id": 19, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q18 · Main conclusion</p>", "image": "images/ct-pp/ct086_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Очки → лучше оценки → выше доход и налоги, чем стоимость очков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: правительство должно оплатить очки бедным детям. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация = вывод.</div></div>"}, {"id": 20, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q19 · Flaw</p>", "image": "images/ct-pp/ct086_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Без ограничений риск для здоровья снизится.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но без ограничений больше подростков пострадало бы от обычного алкоголя. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Учтите исходную проблему.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2017 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct086_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два порядка поездки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Арундел → Чичестер: Чичестер с 14:24, нужно ≥ 18:24 → поезд 18:37 → 20:20.</li><li>Чичестер → Арундел: Арундел с 14:12, ≥ 18:12 → поезд 18:13 → 19:47.</li><li>Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — не хватает 4 часов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переберите оба порядка.</div></div>"}, {"id": 22, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct086_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Альфа 120 + 38 − 55 = 103; Бета 120 + 72 − 25 = 167; Гамма 120 + 34 − 64 = 90.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Доли: 46%, 29%, 25% — диаграмма E. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — половина; D — почти равные.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сохраняется сумма 360.</div></div>"}, {"id": 23, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q2 · Drawing a conclusion</p>", "image": "images/ct-pp/ct086_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем столбцы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Насекомые ≈ рыбы во все три года. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — неверно по графику.</li><li>D — не ровно 4.</li><li>E — прирост птиц не самый большой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте каждое слово.</div></div>"}, {"id": 24, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q3 · Drawing a conclusion</p>", "image": "images/ct-pp/ct086_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Столовые приборы меняют восприятие вкуса.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ресторанам стоит внимательно выбирать приборы. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — слишком сильно.</li><li>C — не следует.</li><li>D — не обязательно осознанно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Практический вывод.</div></div>"}, {"id": 25, "topic": "MC", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q4 · Main conclusion</p>", "image": "images/ct-pp/ct086_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод — первое предложение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Видеоигры лучше для здоровья детей, чем ТВ. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — доводы.</li><li>B — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тезис в начале.</div></div>"}, {"id": 26, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct086_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20 дней: сырные 60, паприка 40, чили 20; поштучно 60 £.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сыр: 36 + 24 = 21 £ (экономия 9).</li><li>Паприка: 36 + 4 шт. = 14,50 (экономия 5,50).</li><li>Чили: 12 + 6 + 2 шт. = 8 (экономия 2).</li><li>Итого 16,50 £. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные наборы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точное количество — без лишних пачек.</div></div>"}, {"id": 27, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q6 · Drawing a conclusion</p>", "image": "images/ct-pp/ct086_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Большой мозг кита не нужен, колибри справляется с малым.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Размер мозга и сложность задач не обязательно связаны. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод из примера колибри.</div></div>"}, {"id": 28, "topic": "PRIN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q7 · Principle</p>", "image": "images/ct-pp/ct086_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Люди не решают сами → производитель должен устранить проблему.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: автопроизводители ставят ограничители скорости. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — информирование людей.</li><li>B — налоги государства.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ответственность на производителе.</div></div>"}, {"id": 29, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q8 · Strengthen</p>", "image": "images/ct-pp/ct086_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Единственный способ — отстрел барсуков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если барсуку нужно 5 ежегодных прививок — вакцинация непрактична. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — ослабляют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Уберите альтернативу.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">IMAT 2018 · original Q9 · Problem solving</p>", "image": "images/ct-pp/ct086_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Порядок граней вокруг вершины снаружи — как на развёртке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вокруг вершины P–G–R по часовой: G → P → R (= R → G → P).</li><li>В D: R → P → G — обратный порядок, невозможен. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — правильный порядок той же вершины.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Зеркальный порядок не получить.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
