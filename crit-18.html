<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
const questions = [{"id": 1, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q31 · Problem solving</p>", "image": "images/ct-pp/ct039_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">С 7 этажа лифт каждый раз едет к ближайшему вызову, включая новый на 7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Идём по порядку остановок: до 16 этажа он обслужит 5 этажей. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — нарушают правило «ближайший».</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пишите остановки по шагам.</div></div>"}, {"id": 2, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q32 · Problem solving</p>", "image": "images/ct-pp/ct039_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем изменение в % с 1997 на 1998.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Картофель: 81,2 → 117,1 ≈ +44% — намного больше остальных. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие культуры менялись меньше.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте проценты, а не абсолютные числа.</div></div>"}, {"id": 3, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q33 · Problem solving</p>", "image": "images/ct-pp/ct039_q03.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Столбики: рост, плато, затем спад.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Так ведёт себя только животноводство: 942, 1036, 1033, 968, 858. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие строки — другая форма.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сверяйте форму графика.</div></div>"}, {"id": 4, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q34 · Drawing a conclusion</p>", "image": "images/ct-pp/ct039_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ищем то, что прямо видно в таблице.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только D подтверждается цифрами. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные утверждают причину или тренд за пределами лет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не выходите за данные.</div></div>"}, {"id": 5, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2009 · original Q35 · Problem solving</p>", "image": "images/ct-pp/ct039_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Доход от овец: 245,1 → 237,4, падение 7,7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Потеря от падения фунта на 5% — около 63% этого падения. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Доля = часть : всё падение.</div></div>"}, {"id": 6, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q1 · Problem solving</p>", "image": "images/ct-pp/ct039_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">ИМТ = масса : рост².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Джей ≈ 49 кг, Чарли ≈ 58 кг.</li><li>Алекс: 172 − 107 = 65 кг.</li><li>65 : 1,62² ≈ 25. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Масса = ИМТ · рост².</div></div>"}, {"id": 7, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q2 · Flaw</p>", "image": "images/ct-pp/ct039_q07.webp", "options": ["A", "B", "C", "D"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Аргумент: финансирование искусства → сильная экономика.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Может быть наоборот: только сильная экономика может финансировать искусство. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 8, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q3 · Problem solving</p>", "image": "images/ct-pp/ct039_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Применяем подсказки по одной, вычёркивая игроков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Для белого ромба остаётся только Эрин. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие исключаются подсказками.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Таблица исключений помогает.</div></div>"}, {"id": 9, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q4 · Drawing a conclusion</p>", "image": "images/ct-pp/ct039_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Текст объясняет, почему спам растёт, несмотря на фильтры.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Из этих причин следует C. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие выходят за текст.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод должен опираться на причины из текста.</div></div>"}, {"id": 10, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q5 · Problem solving</p>", "image": "images/ct-pp/ct039_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6 партий; каждая — 40 мин подготовки + 5 мин остывания.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Новая партия каждые 45 мин: 1:40, 2:25, 3:10, 3:55, 4:40, 5:25.</li><li>Последняя выходит в 5:50, остывает к 5:55. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — забыли остывание.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Во время остывания готовить нельзя.</div></div>"}, {"id": 11, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q6 · Weaken</p>", "image": "images/ct-pp/ct039_q11.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Модель предполагает удвоение CO₂ к концу сжигания через 50 лет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если CO₂ сильно сократят раньше (2), катастрофа не следует.</li><li>1 — не важно (модель гипотетична), 3 — не атакует. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — включают 1 или 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Атакуйте допущение модели.</div></div>"}, {"id": 12, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q7 · Problem solving</p>", "image": "images/ct-pp/ct039_q12.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Залипшие сегменты только добавляют свет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Настоящая первая цифра — подмножество «8» без максимум 3 сегментов, счёт ≤ 501.</li><li>Подходят 0 (005) и 2 (205). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>3 — не хватает сегментов, 4 — нет такого сегмента, 6, 8, 9 — слишком большой счёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебирайте цифры по сегментам.</div></div>"}, {"id": 13, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q8 · Drawing a conclusion</p>", "image": "images/ct-pp/ct039_q13.webp", "options": ["A", "B", "C", "D"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Первый абзац противопоставляет социализацию и биологию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Оспаривается традиционный взгляд A. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не тот взгляд.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что оспаривают — то и «традиционное» мнение.</div></div>"}, {"id": 14, "topic": "WKN", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q9 · Weaken</p>", "image": "images/ct-pp/ct039_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предпочтение мерили временем с игрушкой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если агрессивный пол отбирал лучшие игрушки, время показывает доступ, а не предпочтение. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не ослабляют метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите другую причину того же результата.</div></div>"}, {"id": 15, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q10 · Assumption</p>", "image": "images/ct-pp/ct039_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предпочтение = время с игрушкой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: время надёжно показывает интерес. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение о методе измерения.</div></div>"}, {"id": 16, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q11 · Drawing a conclusion</p>", "image": "images/ct-pp/ct039_q16.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Две фотографии — две обезьяны в один момент.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не показывают общий ответ, как у людей (1), и даже предпочтение (2) — нужно сравнение времени. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — принимают 1 или 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Снимок ≠ исследование.</div></div>"}, {"id": 17, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q12 · Problem solving</p>", "image": "images/ct-pp/ct039_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">36 клеток, 3 цвета поровну → по 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма всех пяти плиток: <span class=\"fr\"><span>16</span><span>14</span></span>/15 (чёрный/серый/белый).</li><li>Убираем плитку <span class=\"fr\"><span>4</span><span>2</span></span>/3 → <span class=\"fr\"><span>12</span><span>12</span></span>/12. Это C (или D). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — не дают <span class=\"fr\"><span>12</span><span>12</span></span>/12.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте лишнее и найдите плитку с ним.</div></div>"}, {"id": 18, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q13 · Flaw</p>", "image": "images/ct-pp/ct039_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Неизбежность плохих новостей не говорит об их правдивости.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вывод «их можно игнорировать» неверен. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Неизбежно» ≠ «ложно».</div></div>"}, {"id": 19, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q14 · Problem solving</p>", "image": "images/ct-pp/ct039_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем сегменты, которые меняются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: два правых сегмента; 6: все, кроме верхнего правого.</li><li>Из 1 в 6 меняются 6 сегментов. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Ни одной паре не нужны все 7.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте пары цифр.</div></div>"}, {"id": 20, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q15 · Drawing a conclusion</p>", "image": "images/ct-pp/ct039_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Мальчики > 1700, девочки < 800 погибших или раненых.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>При похожем числе мальчиков и девочек мальчики в 2+ раза чаще. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — причины, которых нет в данных.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не добавляйте причины.</div></div>"}, {"id": 21, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q16 · Problem solving</p>", "image": "images/ct-pp/ct039_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Противоположные грани: 1–6, 2–5, 3–4 — вместе не видны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проверяем ориентацию граней после двух поворотов на 90°.</li><li>Подходит только D. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — видны противоположные грани или не та ориентация.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма противоположных граней = 7.</div></div>"}, {"id": 22, "topic": "FLAW", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q17 · Flaw</p>", "image": "images/ct-pp/ct039_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из одного разграбленного музея — «безопасно только в Британском».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Один случай не значит, что другие музеи разграбят. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обобщение по одному случаю.</div></div>"}, {"id": 23, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q18 · Problem solving</p>", "image": "images/ct-pp/ct039_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждая H — 40 см², лист — 792 см².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В квадратах 8 × 8 помещается только 12.</li><li>Поворачивая и вкладывая H друг в друга, помещаем 15. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неоптимальная раскладка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь даёт верхнюю границу, не ответ.</div></div>"}, {"id": 25, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q20 · Problem solving</p>", "image": "images/ct-pp/ct039_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В 2005 Испания — 34 из 228 млн, ≈ 15%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В 1980 было ≈ 58 млн; 15% ≈ 9 млн. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не та доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перенос доли на другой год.</div></div>"}, {"id": 26, "topic": "CON", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q21 · Drawing a conclusion</p>", "image": "images/ct-pp/ct039_q26.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 5, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждый пункт.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1: 1955–80 ≈ 2 млн/год, 1980–2005 ≈ 7 млн/год — больше чем в 3 раза ✔.</li><li>2: 68 + 33 = 101 из 228 ≈ 44% ✔.</li><li>3: (500 − 228) : 25 ≈ 10,9 млн/год ✔.</li><li>Все три. Ответ F.</li></ol><div class=\"ex-a\">Ответ: <b>F</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — пропускают пункты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте средний прирост в год.</div></div>"}, {"id": 27, "topic": "STR", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q22 · Strengthen</p>", "image": "images/ct-pp/ct039_q27.webp", "options": ["A", "B", "C", "D"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прошлые спады сменялись возвратом к тренду.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поэтому спад 2009 «не обязательно» отменяет прогноз — скромный и обоснованный вывод. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — переоценивают или недооценивают.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод легче поддержать.</div></div>"}, {"id": 28, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q23 · Problem solving</p>", "image": "images/ct-pp/ct039_q28.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пар: 15 · 14 : 2 = 105.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Нужны однозначное число и одно из 10, 12, 13, 14, 15 (11 повторяет цифру).</li><li>С 10: 8 вариантов; с 12–15: по 7.</li><li>8 + 4 · 7 = 36; 36 : 105 = <span class=\"fr\"><span>12</span><span>35</span></span>. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не исключили совпадающие цифры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте благоприятные пары аккуратно.</div></div>"}, {"id": 29, "topic": "ASM", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q24 · Assumption</p>", "image": "images/ct-pp/ct039_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вулканизм отвергнут, и автор говорит: удар — единственное объяснение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если других объяснений вымирания нет. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вывод не зависит от этого.</li><li>B, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Единственное» после отказа от одной версии — скрытое допущение.</div></div>"}, {"id": 30, "topic": "PS", "text": "<p style=\"font-size:12px;opacity:.6;font-weight:500\">BMAT 2010 · original Q25 · Problem solving</p>", "image": "images/ct-pp/ct039_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сейчас: я 9, 4♦7♦ = 22, 5♣8♠ = 13, 2♥9♣ = 11.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Меняю 2♠ на 7♦: у меня 7♥7♦ = 14, у той руки 4♦2♠ = 6.</li><li>Другие 13, 11, 6 — я первый. Ответ A (14).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>18 или 20 оставляют руку 22 — я второй.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Важно ослабить лидера, а не только усилиться.</div></div>"}, {"id": 31, "topic": "STR", "text": "Reading aloud to toddlers improves their vocabulary. In a study, toddlers whose parents read to them every day knew more words at the age of three than toddlers who were rarely read to.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "image": "", "options": ["Most parents enjoy reading to their children.", "Children's books have become more expensive.", "In the study, the two groups of families had similar levels of income and parental education.", "Toddlers who watch television also learn new words.", "Some toddlers who were rarely read to had large vocabularies."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главная угроза — другие различия между семьями.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если доход и образование одинаковы, остаётся объяснение «чтение». Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — не по теме.</li><li>D — не о чтении.</li><li>E — ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключение альтернативной причины усиливает причинный вывод.</div></div>", "src": "PL"}];

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? '' : (ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`)}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
