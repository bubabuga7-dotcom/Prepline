<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m032_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сокращаем правую дробь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>77</span><span>165</span></span> = <span class=\"fr\"><span>7</span><span>15</span></span> = <span class=\"fr\"><span>21</span><span>45</span></span>.</li><li>28x = 21 → x = 0,75.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите к знаменателю 45.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m032_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три равных треугольника с вершиной в нижнем левом углу делят прямой угол: по 30°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Боковые стороны равны стороне квадрата → углы при основании <span class=\"fr\"><span>180 − 30</span><span>2</span></span> = 75°.</li><li>У верхнего треугольника угол 75° отсчитывается от левой стороны.</li><li>Закрашенный угол: 90° − 75° = 15°.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (30°) — угол при вершине.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Равнобедренный: углы при основании равны.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m032_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Скорость = путь / время.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая часть: <span class=\"fr\"><span>10</span><span>20</span></span> = 0,5.</li><li>Остальная: <span class=\"fr\"><span>90</span><span>80</span></span> = 1,125.</li><li>0,5 : 1,125 = 4 : 9.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — перевёрнуто или неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Возьмите путь 100 и время 100.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m032_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">⅔b = ¾g.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>b = 9k, g = 8k; сдали 6k + 6k = 12k.</li><li><span class=\"fr\"><span>12</span><span>17</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное соотношение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приравняйте сдавших.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m032_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Хорда касается малой окружности → R² − r² = 6².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>π(R² − r²) = 36π.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиус к точке касания ⊥ хорде.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m032_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножаем и переводим в мг.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 · 10⁻²⁵ · 8 · 10⁶ = 3,2 · 10⁻¹⁸ кг.</li><li>× 10⁶ мг/кг → 3,2 · 10⁻¹² мг.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — в килограммах.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 кг = 10⁶ мг.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m032_q07.webp", "options": ["A", "B", "C", "D"], "correct": 1, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">S = ½ · катет · катет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 + √2)(2 − √2) = 6 − 2√2.</li><li>½ → 3 − √2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка раскрытия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √2 · √2 = 2.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m032_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,9 · 0,8 = 0,72.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Скидка 28%.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сложили 10 + 20.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вторая скидка — от сниженной цены.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m032_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сухое вещество не меняется.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>34 · 0,2 = 6,8.</li><li>6,8 / 0,85 = 8.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите неизменную величину.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m032_q10.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 4, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем точки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4p + 2q = 6; 16p + 4q = −4.</li><li>8p = −16 → p = −2, q = 7.</li><li>q − p = 9.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибка знака.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите удвоенное первое.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m032_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Треугольники EAB и EDC подобны (AB ∥ CD).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AE : ED = 3 : 9 → AE = 1.</li><li>S(AEC) = ½ · AE · CD = ½ · 1 · 9 = 4,5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный AE.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота к стороне AE — расстояние CD.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m032_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>a² + b²</span><span>ab</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a + b = <span class=\"fr\"><span>q</span><span>p</span></span>, ab = <span class=\"fr\"><span>r</span><span>p</span></span>.</li><li><span class=\"fr\"><span><span class=\"fr\"><span>q²</span><span>p²</span></span> − <span class=\"fr\"><span>2r</span><span>p</span></span></span><span><span class=\"fr\"><span>r</span><span>p</span></span></span></span> = <span class=\"fr\"><span>q² − 2rp</span><span>rp</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a² + b² = (a + b)² − 2ab.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m032_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота пересечения: <span class=\"fr\"><span>1</span><span>h</span></span> = <span class=\"fr\"><span>1</span><span>a</span></span> + <span class=\"fr\"><span>1</span><span>b</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>24</span></span> = <span class=\"fr\"><span>1</span><span>40</span></span> + <span class=\"fr\"><span>1</span><span>H</span></span> → <span class=\"fr\"><span>1</span><span>H</span></span> = <span class=\"fr\"><span>1</span><span>60</span></span> → H = 60.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Классическая задача о столбах.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m032_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем дробь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Σd² = (1 − r)<span class=\"fr\"><span>n³ − n</span><span>6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — лишний квадрат.</li><li>C — n³ − 1.</li><li>D — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> n(n² − 1) = n³ − n.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m032_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол 2θ = θ + угол при мельнице → треугольник равнобедренный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Расстояние от второй точки до мельницы = 5.</li><li>От первой: 2 · 5 cos θ = 10 cos θ.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без удвоения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Основание равнобедренного = 2 · боковая · cos угла.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m032_q16.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскладываем на простые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2: 64 + 18 = 82; 3: 15 + 36 = 51; 5: 15; 17: 17.</li><li>Сумма 165.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное разложение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 18¹⁸ = 2¹⁸ · 3³⁶.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m032_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через середину (4; 2), наклон −2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>y = −2x + 10.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — не через середину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Наклон AB ½ → перпендикуляр −2.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m032_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанный 22,5° → центральный 45°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>⅛πr² = 32π → r = 16.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный угол.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центральный = 2 × вписанный.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m032_q19.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 1, "topic": "M2.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a и c: одинаковый знаменатель → a &lt; c.</li><li>c и b: одинаковый числитель, 5 + x &gt; 5 → c &lt; b.</li><li>a &lt; c &lt; b → B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — ключ ошибочен.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-7. (Исходный ключ D — исправлено.)</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m032_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Δy/Δx.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>9</span><span>−3</span></span> = −3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — перевёрнуто.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус на минус.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m032_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">N ≡ 1 (mod 12), N ≡ 2 (mod 5).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>13, 25, 37 → 37 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не все усл ">Угол пятиугольника 108°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠FBC = 108 − 60 = 48°.</li><li>BF = BC → ∠FCB = <span class=\"fr\"><span>180 − 48</span><span>2</span></span> = 66°.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сам ∠FBC.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> BF = AB = BC.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m032_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высоты одинаковые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S(ABCD) = (5c + c)<span class=\"fr\"><span>h</span><span>2</span></span> = 3ch.</li><li>S(DEC) = <span class=\"fr\"><span>ch</span><span>2</span></span> → 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без c.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Основание DC, высота трапеции.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m032_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">× 3,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,75 · 3,6 = 6,3.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 м/с = 3,6 км/ч.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m032_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² + 4x − 12 ≥ 0 → (x + 6)(x − 2) ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x ≤ −6 или x ≥ 2 → D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ключ ошибочен.</li><li>E — неверные корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ≥ 0 — снаружи. (Исходный ключ A — исправлено.)</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m032_q29.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Включения-исключения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>35 + 25 − 6 + 3 = 57.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — не вычли общих.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Общих считаем один раз.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m032_q30.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 4, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2πr² + 2πrh = πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>h = <span class=\"fr\"><span>2r</span><span>r − 2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>H — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-3.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
