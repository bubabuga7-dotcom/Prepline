<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m016_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У вписанного четырёхугольника противоположные углы в сумме 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>29° и 43° не могут быть противоположными (их сумма не 180°), значит, они соседние.</li><li>Противоположные им: 180° − 29° = 151° и 180° − 43° = 137°.</li><li>Наибольший — 151°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (137°) — второй по величине.</li><li>C (72°) — сумма данных углов.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный четырёхугольник ⇔ сумма противоположных углов 180°.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m016_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Биссектриса угла параллелограмма отсекает равнобедренный треугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠ABE = ∠EBC = ∠AEB (накрест лежащие) → AE = AB.</li><li>Аналогично DE = DC = AB.</li><li>AD = AE + ED = 2AB = 14 → AB = 7.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не используют равнобедренные треугольники.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Биссектриса + параллельные стороны → равные углы → равнобедренный треугольник.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m016_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Медиана к гипотенузе равна её половине → треугольник CNB равнобедренный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>CN = NB → ∠NCB = ∠B = 56°.</li><li>В треугольнике CKB: ∠KCB = 90° − 56° = 34°.</li><li>∠KCN = 56° − 34° = 22°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — это сами острые углы.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол между медианой и высотой из прямого угла = разность острых углов.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m016_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вписанный угол — половина центрального, опирающегося на ту же дугу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠PQF = 42° → дуга PF = 84° → ∠POF = 84°.</li><li>K, O, F на одной прямой → ∠KOP = 180° − 84° = 96°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (42°) — сам вписанный угол.</li><li>E (48°) — 90 − 42.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Центральный угол = 2 × вписанный.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m016_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Чем шире сечение, тем медленнее растёт уровень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>График: сначала быстро, потом медленно, потом снова быстро.</li><li>Узко внизу → широко посередине → узкое горлышко.</li><li>Это круглая колба A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — внизу широко (сначала медленно).</li><li>C, D — сужение посередине.</li><li>E — внизу узко, вверху широко (ускорения в конце нет).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Крутой участок графика = узкая часть сосуда.</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m016_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем потраченное с планом за 4 месяца.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В месяц: 12 600 ÷ 12 = 1050.</li><li>За 4 месяца: 4200.</li><li>4580 − 4200 = 380.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1050) — месячный бюджет.</li><li>B, D, E — неверное число месяцев.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивать нужно с планом на тот же срок.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m016_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>100 + n</span><span>n</span></span> = <span class=\"fr\"><span>100</span><span>n</span></span> + 1 — целое, если n делит 100.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1, 2, 4, 5 делят 100; 3 — нет.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — делители 100.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разбейте дробь на слагаемые.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m016_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Простые между 60 и 70: 61 и 67.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>61 + 67 = 128.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — одно число.</li><li>C, D, E — включили составные (63, 69 …).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 63 = 7 · 9, 69 = 3 · 23, 65 = 5 · 13.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m016_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 ⊙ 45 = √225 = 15.</li><li>15 ⊙ 60 = √900 = 30.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — неверный порядок или без корня.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала внутренние скобки.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m016_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем границы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10%: 35,50 + 3,55 = 39,05.</li><li>15%: 35,50 + 5,325 = 40,825.</li><li>Между $39 и $41.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не охватывают промежуток.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Итог = цена + чаевые.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m016_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Освобождаемся от дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4 − x = x(2 + x) = 2x + x².</li><li>x² + 3x − 4 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не заметили, что выражение уже равно 0.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не решайте до конца — нужное выражение уже получилось.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m016_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Берём три наименьших простых больше 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>23, 29, 31.</li><li>23 + 29 + 31 = 83.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — меньше 83, такой суммы не получить.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 21, 25, 27 — не простые.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m016_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через 10 лет Джек вдвое старше Билла.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>J = B + 14.</li><li>B + 24 = 2(B + 10) → B = 4, J = 18.</li><li>Через 5 лет: 23.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (19) — неверно.</li><li>Остальные — не тот момент времени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрашивают возраст через 5 лет.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m016_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>3</span><span>5</span></span> за 8 часов → <span class=\"fr\"><span>1</span><span>5</span></span> за <span class=\"fr\"><span>8</span><span>3</span></span> часа.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Осталось <span class=\"fr\"><span>2</span><span>5</span></span> → 2 · <span class=\"fr\"><span>8</span><span>3</span></span> = <span class=\"fr\"><span>16</span><span>3</span></span> ч = 5 ч 20 мин.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 5,5 ч: перевели <span class=\"fr\"><span>1</span><span>3</span></span> часа как 30 мин.</li><li>C, D, E — неверная доля.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ⅓ часа = 20 минут.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m016_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">√<span class=\"fr\"><span>2x</span><span>3</span></span> = x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2x</span><span>3</span></span> = x² → x = <span class=\"fr\"><span>2</span><span>3</span></span> (x &gt; 0).</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перевёрнуто.</li><li>A, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делим на x, т.к. x ≠ 0.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m016_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подстановка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>−3y + 5y = 16 → 2y = 16 → y = 8.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li><li>A — это x.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x = −24, y = 8: −24 + 40 = 16 ✓.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m016_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Через число побед.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>80 + 0,5(n − 100) = 0,7n.</li><li>30 = 0,2n → n = 150.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные не дают 70%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 80 + 25 = 105 = 70% от 150 ✓.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m016_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Включения-исключения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Хотя бы одно из двух: 30 − 3 = 27.</li><li>Оба: 14 + 18 − 27 = 5.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> |A ∩ B| = |A| + |B| − |A ∪ B|.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m016_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переносим дроби в одну сторону.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>x</span></span> + <span class=\"fr\"><span>2</span><span>x</span></span> = 2 − 1 → <span class=\"fr\"><span>3</span><span>x</span></span> = 1 → x = 3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перевёрнуто.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дроби с одинаковым знаменателем складываются.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m016_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не сдавших тест 70% — это 12 + 30 = 42 человека.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,7N = 42 → N = 60.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — 42 не составляют 70%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «12 и 30» относятся к тем, кто ещё не сдал тест.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m016_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Извлекаем корень с ±.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x − 1 = ±20 → x = 21 или −19.</li><li>x − 5 = 16 или −24.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не 16 и не −24.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забывайте отрицательный корень.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m016_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(10a + b) + (10b + a) = 11(a + b).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма всегда кратна 11.</li><li>181 не делится на 11.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — кратны 11 (15, 11, 9, 4 · 11).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Перевёрнутые» числа в сумме — всегда кратны 11.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m016_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь равностороннего треугольника ∝ квадрату стороны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A = <span class=\"fr\"><span>√3</span><span>4</span></span>a².</li><li>По теореме Пифагора a² + b² = c² → A₁ + A₂ = A₃.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — нет связи между квадратами площадей.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Теорема Пифагора работает для любых подобных фигур на сторонах.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m016_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Восстанавливаем пирамиду сверху вниз и снизу вверх.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3-й ряд: 49, m, 35; 89 = m + 35 → m = 54; второй ряд: 103, 89 → вершина 192.</li><li>4-й ряд: w, x, y, 11; y + 11 = 35 → y = 24; x + y = 54 → x = 30; w = 49 − 30 = 19.</li><li>Нижний ряд: a, b, 18, d, e; b = 30 − 18 = 12, a = 7; d = 24 − 18 = 6, e = 11 − 6 = 5.</li><li>Угловые: 192 + 7 + 5 = 204.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки при восстановлении.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте с клеток, где известны два соседа.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m016_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выносим 2ⁿ.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Числитель: 2ⁿ(16 − 2) = 14 · 2ⁿ.</li><li>Знаменатель: 2 · 8 · 2ⁿ = 16 · 2ⁿ.</li><li><span class=\"fr\"><span>14</span><span>16</span></span> = <span class=\"fr\"><span>7</span><span>8</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное вынесение степени.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2ⁿ⁺⁴ = 16 · 2ⁿ.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m016_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Смотрим на разности.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разности: 3, 7, 15, 31 — каждая вдвое + 1.</li><li>Следующая: 63 → 58 + 63 = 121.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D, E — неверная закономерность.</li><li>B — удвоение без учёта.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 3, 7, 15, 31 = 2ⁿ − 1.</div></div>"}, {"id": 31, "topic": "M4.19", "text": "<p>Find an expression for the nth term of 9, 6, 3, 0, …</p>", "image": "", "options": ["\\(9n - 3\\)", "\\(-3n + 13\\)", "\\(-3n + 9\\)", "\\(3n + 6\\)", "\\(-3n + 12\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">nth term = dn + (a₁ − d).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d = −3, a₁ − d = 12.</li><li>Проверка n = 1: 9. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перепутали a и d.</li><li>C — свободный член — это a₁ − d, а не a₁.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте n = 1 и n = 2.</div></div>", "src": "PL"}, {"id": 32, "topic": "M4.12", "text": "<p>\\(f(x) = 2x + 3\\) and \\(g(x) = x^2 + 2\\).</p><p>Find \\(f(g(2))\\).</p>", "image": "", "options": ["13", "15", "17", "42", "51"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала внутренняя функция g, потом f.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>g(2) = 6.</li><li>f(6) = 2·6 + 3 = 15. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили f и g.</li><li>D — перемножили f и g.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> f(g(x)): g действует первой.</div></div>", "src": "PL"}, {"id": 33, "topic": "M2.13", "text": "<p>Round 38,452 to 3 significant figures.</p>", "image": "", "options": ["38,500", "38,450", "38,000", "3850", "385"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Значащие цифры считаются с первой ненулевой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая ненулевая цифра — начало счёта; округляем по следующей цифре: 38 500. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — это 4 значащие цифры.</li><li>C — это 2 значащая цифра.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нули в начале не считаются, нули-заполнители в конце сохраняем.</div></div>", "src": "PL"}, {"id": 34, "topic": "M4.2", "text": "<p>Simplify \\(\\dfrac{6x^{5}}{3x^{2}}\\).</p>", "image": "", "options": ["\\(2 x^{7}\\)", "\\(2 x^{4}\\)", "\\(3 x^{3}\\)", "\\(2 x^{-3}\\)", "\\(2 x^{3}\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коэффициенты делятся, показатели вычитаются.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6 : 3 = 2; 5 − (2) = 3. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — при делении показатели вычитают.</li><li>B — разделили показатели.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> xᵃ / xᵇ = xᵃ⁻ᵇ.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
