<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>In the figure above, \\(AB = BC\\) and \\(DE = EF = DF\\). If the measure of \\(\\angle ABC\\) is \\(30°\\) and the measure of \\(\\angle BDE\\) is \\(50°\\), what is the measure of \\(\\angle DFA\\)?</p>", "image": "images/q-8c8503f522.jpg", "options": ["\\(30°\\)", "\\(35°\\)", "\\(40°\\)", "\\(45°\\)", "\\(50°\\)"], "correct": 1, "src": "GEO", "orig": "images/q-8c8503f522.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Используем свойства равнобедренного и равностороннего треугольников и развёрнутый угол на прямой AB.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AB = BC, ∠B = 30° → углы при основании <span class=\"fr\"><span>180 − 30</span><span>2</span></span> = 75°, значит, ∠A = 75°.</li><li>DEF равносторонний → ∠EDF = 60°.</li><li>На прямой AB в точке D: ∠FDA = 180° − 50° − 60° = 70°.</li><li>В треугольнике ADF: ∠DFA = 180° − 75° − 70° = 35°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (30°) — взяли ∠B.</li><li>C, D, E — ошибка в одном из углов (например, ∠A = 30°).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Развёрнутый угол 180° связывает углы разных треугольников.</div></div>"}, {"id": 2, "text": "<p>In the figure above, point \\(O\\) is the center of the circle. If \\(x = 40\\), what is the value of \\(y\\)?</p>", "image": "images/q-d8d24632a4.jpg", "options": ["40", "50", "60", "70", "80"], "correct": 3, "src": "GEO", "orig": "images/q-d8d24632a4.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стороны из центра O — радиусы, значит, треугольник равнобедренный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Угол при O = x = 40°.</li><li>Углы при основании равны: y = <span class=\"fr\"><span>180° − 40°</span><span>2</span></span> = 70°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (40) — взяли угол при вершине.</li><li>B (50) — 90 − 40.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Два радиуса → равнобедренный треугольник — одно из главных наблюдений в задачах с окружностью.</div></div>"}, {"id": 3, "text": "<p>In \\(\\triangle XYZ\\) above, \\(XZ\\) is \\(\\frac{6}{7}\\) of \\(h\\), the length of the altitude. What is the area of \\(\\triangle XYZ\\) in terms of \\(h\\)?</p>", "image": "images/q-93f47e1e4a.png", "options": ["\\(\\frac{h^2}{3}\\)", "\\(\\frac{3h^2}{7}\\)", "\\(\\frac{3h}{7}\\)", "\\(\\frac{6h^2}{7}\\)", "\\(\\frac{12h^2}{7}\\)"], "correct": 1, "src": "GEO", "orig": "images/q-93f47e1e4a.png", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь = ½ · основание · высота, основание выражено через h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>XZ = <span class=\"fr\"><span>6</span><span>7</span></span>h.</li><li>S = ½ · <span class=\"fr\"><span>6</span><span>7</span></span>h · h = <span class=\"fr\"><span>3h²</span><span>7</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D <span class=\"fr\"><span>6h²</span><span>7</span></span> — забыли ½.</li><li>C <span class=\"fr\"><span>3h</span><span>7</span></span> — нет квадрата.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь всегда содержит произведение двух длин → h².</div></div>"}, {"id": 4, "text": "<p>If the area of the square in the figure above is 81 and the perimeter of each of the 4 triangles is 30, what is the perimeter of the figure outlined by the solid line?</p>", "image": "images/q-2f695947f8.jpg", "options": ["36", "72", "80", "84", "120"], "correct": 3, "src": "GEO", "orig": "images/q-2f695947f8.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый треугольник использует одну сторону квадрата; в контур входят только две внешние стороны треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь 81 → сторона квадрата 9.</li><li>Периметр треугольника 30 = 9 + две внешние стороны → внешние = 21.</li><li>Контур состоит из 4 пар внешних сторон: 4 · 21 = 84.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (120) — 4 · 30: посчитали и стороны квадрата.</li><li>A (36) — периметр квадрата.</li><li>B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Стороны, общие с квадратом, внутри фигуры и в периметр не входят.</div></div>"}, {"id": 5, "text": "<p>In the figure above, what is the sum, in terms of \\(n\\), of the degree measures of the four angles marked with arrows?</p>", "image": "images/q-c4c187deb0.jpg", "options": ["\\(n\\)", "\\(2n\\)", "\\(180 - n\\)", "\\(360 - n\\)", "\\(360 - 2n\\)"], "correct": 4, "src": "GEO", "orig": "images/q-c4c187deb0.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вертикальные углы равны, поэтому в каждом из двух треугольников есть угол n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В каждом треугольнике два отмеченных угла = 180° − n.</li><li>Два треугольника: 2(180° − n) = 360° − 2n.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — только один треугольник.</li><li>D — вычли n один раз.</li><li>A, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вертикальные углы — равны.</div></div>"}, {"id": 6, "text": "<p>Three lines intersect in a point as shown in the figure above. Which of the following pairs of angle measures is NOT sufficient for determining all six angle measures?</p>", "image": "images/q-092bff9a6c.png", "options": ["\\(t\\) and \\(z\\)", "\\(t\\) and \\(y\\)", "\\(s\\) and \\(x\\)", "\\(r\\) and \\(t\\)", "\\(r\\) and \\(s\\)"], "correct": 0, "src": "GEO", "orig": "images/q-092bff9a6c.png", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три прямые дают 6 углов: три пары вертикальных, сумма трёх разных значений 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чтобы найти всё, нужны два <b>разных</b> значения.</li><li>t и z — вертикальные, т.е. равны: это одно значение, недостаточно.</li><li>Любая другая пара даёт два разных значения → третье = 180° − их сумма.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — каждая пара из разных групп, этого достаточно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вертикальные углы несут одну и ту же информацию.</div></div>"}, {"id": 7, "text": "<p>The letter H is symmetric with respect to two different lines, as shown by the dotted lines in the figure above. Which of the following letters is symmetric with respect to at least two different lines?</p>", "image": "images/q-a41c4e6f41.png", "options": ["A", "B", "C", "D", "E"], "correct": 3, "src": "GEO", "review": true, "orig": "images/q-a41c4e6f41.png", "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем у каждой буквы оси симметрии.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>K — одна горизонтальная ось.</li><li>L — нет осей.</li><li>M — одна вертикальная.</li><li>X — вертикальная и горизонтальная (и диагонали) ✓.</li><li>Y — одна вертикальная.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — только одна ось.</li><li>B — ни одной.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мысленно «сложите» букву по линии — половинки должны совпасть.</div></div>"}, {"id": 8, "text": "<p>The smallest squares in Figure A and Figure B are all equal in size. If the area of Figure A is 26 square centimeters, what is the area of Figure B ?</p>", "image": "images/q-6d31deda42.jpg", "options": ["12 sq cm", "14 sq cm", "16 sq cm", "18 sq cm", "20 sq cm"], "correct": 2, "src": "GEO", "orig": "images/q-6d31deda42.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим площадь одного маленького квадрата из фигуры A.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В фигуре A 13 квадратиков → 26 ÷ 13 = 2 см² каждый.</li><li>В фигуре B 8 квадратиков → 8 · 2 = 16 см².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверно посчитано число квадратиков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте квадратики аккуратно, отмечая уже посчитанные.</div></div>"}, {"id": 9, "text": "<p>In the figure above, what is the value of \\(z\\)?</p>", "image": "images/q-618c4fa0e5.jpg", "options": ["55", "60", "65", "70", "75"], "correct": 2, "src": "GEO", "orig": "images/q-618c4fa0e5.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота делит треугольник на два прямоугольных; в каждом острые углы в сумме 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Правый: 2y + 40 = 90 → y = 25.</li><li>Левый: y + z = 90 → z = 65.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверно найден y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Острые углы прямоугольного треугольника дают 90°.</div></div>"}, {"id": 10, "text": "<p>If \\(AB = BC\\) and \\(\\overline{BD}\\) bisects \\(\\overline{AC}\\) in the figure above, which of the following CANNOT be concluded?</p>", "image": "images/q-dda8603b72.jpg", "options": ["\\(w = x\\)", "\\(w = z\\)", "\\(x = y\\)", "\\(AD = DC\\)", "\\(\\overline{BD} \\perp \\overline{AC}\\)"], "correct": 0, "src": "GEO", "orig": "images/q-dda8603b72.jpg", "review": true, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В равнобедренном треугольнике медиана к основанию является и высотой, и биссектрисой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>BD — медиана → AD = DC ✓.</li><li>Значит, BD ⊥ AC ✓ и BD делит угол B пополам → x = y ✓.</li><li>Углы при основании равны → w = z ✓.</li><li>w и x — разные углы одного прямоугольного треугольника (w + x = 90°), равными они быть не обязаны.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — все следуют из свойств равнобедренного треугольника.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «CANNOT be concluded» — ищите утверждение, которое может быть ложным.</div></div>"}, {"id": 11, "text": "<p>In the figure above, if \\(z = 30\\), what is the value of \\(x + y\\)?</p>", "image": "images/q-27f7f1f7b9.jpg", "options": ["60", "150", "180", "210", "330"], "correct": 3, "src": "GEO", "orig": "images/q-27f7f1f7b9.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Три прямые образуют треугольник; x и y — внешние углы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Два других угла треугольника: 180° − 30° = 150° в сумме.</li><li>x и y дополняют их до 180°: x + y = 360° − 150° = 210°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (150) — сумма внутренних углов.</li><li>A, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма двух внешних углов = 180° + третий внутренний угол.</div></div>"}, {"id": 12, "text": "<p>In the figure above, if \\(AB\\) is a line, what is the value of \\(y\\)?</p>", "image": "images/q-ffcb3168ca.jpg", "options": ["108", "114", "117", "120", "135"], "correct": 0, "src": "GEO", "orig": "images/q-ffcb3168ca.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы на одной стороне прямой AB в сумме 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ниже AB пять углов x: 5x = 180 → x = 36.</li><li>Выше AB: y + 2x = 180 → y = 180 − 72 = 108.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — неверное число углов x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Развёрнутый угол = 180°.</div></div>"}, {"id": 13, "text": "<p>In the figure above, \\(\\overline{AE}\\) and \\(\\overline{CD}\\) are each perpendicular to \\(\\overline{CE}\\). If \\(x = y\\), the length of \\(\\overline{AB}\\) is 4, and the length of \\(\\overline{BD}\\) is 8, what is the length of \\(\\overline{CE}\\)?</p>", "image": "images/q-17072d9fc7.png", "options": ["\\(3\\sqrt{2}\\) (approximately 4.24)", "\\(6\\sqrt{2}\\) (approximately 8.49)", "\\(8\\sqrt{2}\\) (approximately 11.31)", "\\(10\\sqrt{2}\\) (approximately 14.14)", "\\(12\\sqrt{2}\\) (approximately 16.97)"], "correct": 1, "src": "GEO", "orig": "images/q-17072d9fc7.png", "review": true, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">При x = y треугольники становятся равнобедренными прямоугольными (45-45-90).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>ABE: прямой угол при E, x = y → по 45°; гипотенуза AB = 4 → BE = <span class=\"fr\"><span>4</span><span>√2</span></span> = 2√2.</li><li>∠CBD = ∠ABE = 45° (вертикальные) → BCD тоже 45-45-90; BD = 8 → CB = <span class=\"fr\"><span>8</span><span>√2</span></span> = 4√2.</li><li>CE = 2√2 + 4√2 = 6√2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (12√2) — умножили гипотенузы на √2.</li><li>A, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В 45-45-90 катет = гипотенуза/√2.</div></div>"}, {"id": 14, "text": "<p>In the figure above, arc \\(SBT\\) is one quarter of a circle with center \\(R\\) and radius 6. If the length plus the width of rectangle \\(ABCR\\) is 8, then the perimeter of the shaded region is</p>", "image": "images/q-563c014139.jpg", "options": ["\\(8 + 3\\pi\\)", "\\(10 + 3\\pi\\)", "\\(14 + 3\\pi\\)", "\\(1 + 6\\pi\\)", "\\(12 + 6\\pi\\)"], "correct": 1, "src": "GEO", "orig": "images/q-563c014139.jpg", "review": true, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагонали прямоугольника равны, а одна из них (RB) — радиус.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>RB = 6 → AC = 6.</li><li>SA = 6 − AR, CT = 6 − RC → SA + CT = 12 − (AR + RC) = 12 − 8 = 4.</li><li>Дуга = ¼ · 2π · 6 = 3π.</li><li>Периметр = 4 + 6 + 3π = 10 + 3π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли AC.</li><li>C — посчитали 8 вместо 4.</li><li>D, E — неверная дуга.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагонали прямоугольника равны — классический трюк.</div></div>"}, {"id": 15, "text": "<p>In the figure above, points \\(P\\), \\(A\\), and \\(B\\) are equally spaced on line \\(\\ell\\) and points \\(P\\), \\(Q\\), and \\(R\\) are equally spaced on line \\(m\\). If \\(PB = 4\\), \\(PR = 6\\), and \\(AQ = 4\\), what is the perimeter of quadrilateral \\(QABR\\)?</p>", "image": "images/q-cc65846aa9.jpg", "options": ["13", "14", "15", "16", "17"], "correct": 4, "src": "GEO", "orig": "images/q-cc65846aa9.jpg", "review": true, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">A и Q — середины PB и PR, значит, AQ — средняя линия треугольника PBR.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>PA = AB = 2; PQ = QR = 3.</li><li>BR = 2 · AQ = 8.</li><li>Периметр QABR = QA + AB + BR + RQ = 4 + 2 + 8 + 3 = 17.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — не учли, что BR вдвое больше AQ.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Средняя линия = половина третьей стороны.</div></div>"}, {"id": 16, "text": "<p>In the figure above, the perimeter of the triangle is \\(4 + 2\\sqrt{2}\\). What is the value of \\(x\\)?</p>", "image": "images/q-a0a7db28f2.jpg", "options": ["\\(2\\)", "\\(4\\)", "\\(\\sqrt{2}\\)", "\\(2\\sqrt{2}\\)", "\\(2 + \\sqrt{2}\\)"], "correct": 0, "src": "GEO", "orig": "images/q-a0a7db28f2.jpg", "review": true, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Равнобедренный прямоугольный треугольник: стороны x, x, x√2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Периметр: x(2 + √2) = 4 + 2√2 = 2(2 + √2).</li><li>x = 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (2√2) — это гипотенуза.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вынесите общий множитель — уравнение сразу решается.</div></div>"}, {"id": 17, "text": "<p>The three-dimensional figure represented above consists of rectangular and triangular faces. Each rectangular face has area \\(r\\) and each triangular face has area \\(t\\). What is the total surface area of the figure, in terms of \\(r\\) and \\(t\\)?</p>", "image": "images/q-db5ed1a082.jpg", "options": ["\\(2r + t\\)", "\\(3r + 2t\\)", "\\(4r + 3t\\)", "\\(6rt\\)", "\\(r^3t^2\\)"], "correct": 1, "src": "GEO", "orig": "images/q-db5ed1a082.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Это треугольная призма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Прямоугольных граней 3 → 3r.</li><li>Треугольных 2 → 2t.</li><li>3r + 2t.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — неверное число граней.</li><li>D, E — площади не перемножаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У призмы n-угольник: n боковых граней + 2 основания.</div></div>"}, {"id": 18, "text": "<p>In the figure above, \\(y + z =\\)</p>", "image": "images/q-13f27dda76.jpg", "options": ["180", "195", "215", "230", "245"], "correct": 4, "src": "GEO", "orig": "images/q-13f27dda76.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y и z — внешние углы треугольника.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Верхний угол = 180° − 115° = 65°.</li><li>Два других внутренних в сумме 115°.</li><li>y + z = 360° − 115° = 245°.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сумма углов треугольника.</li><li>B, C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = 180° − внутренний.</div></div>"}, {"id": 19, "text": "<p>The figure above shows part of a circle whose circumference is 45. If arcs of length 2 and length \\(b\\) continue to alternate around the entire circle so that there are 18 arcs of each length, what is the degree measure of each of the arcs of length \\(b\\)?</p>", "image": "", "options": ["\\(4^\\circ\\)", "\\(6^\\circ\\)", "\\(10^\\circ\\)", "\\(16^\\circ\\)", "\\(20^\\circ\\)"], "correct": 0, "src": "GEO", "orig": "images/q-d11026223f.png", "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина окружности складывается из всех дуг.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18 · 2 + 18 · b = 45 → 18b = 9 → b = 0,5.</li><li>В градусах: <span class=\"fr\"><span>0,5</span><span>45</span></span> · 360° = 4°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — путают длину и градусы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Градусная мера дуги = (длина дуги / длина окружности) · 360°.</div></div>"}, {"id": 20, "text": "<p>If the five line segments in the figure above are all congruent, what is the ratio of the length of \\(\\overline{AC}\\) (not shown) to the length of \\(\\overline{BD}\\)?</p>", "image": "images/q-60d16223c6.jpg", "options": ["\\(\\sqrt{2}\\) to 1", "\\(\\sqrt{3}\\) to 1", "\\(\\sqrt{2}\\) to 2", "\\(\\sqrt{3}\\) to 2", "\\(\\sqrt{3}\\) to \\(\\sqrt{2}\\)"], "correct": 1, "src": "GEO", "orig": "images/q-60d16223c6.jpg", "review": true, "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все пять отрезков равны → ABD и BCD — равносторонние, ABCD — ромб.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>BD = s.</li><li>AC — две высоты равносторонних треугольников: 2 · <span class=\"fr\"><span>√3</span><span>2</span></span>s = √3·s.</li><li>AC : BD = √3 : 1.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — √2 для квадрата.</li><li>D — забыли удвоить высоту.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота равностороннего треугольника <span class=\"fr\"><span>√3</span><span>2</span></span>s.</div></div>"}, {"id": 21, "text": "<p>In the figure above, if \\(x = 70\\) and \\(y = 40\\) and the dotted lines bisect the angles with measures \\(x°\\) and \\(y°\\), what is the value of \\(z\\) ?</p>", "image": "images/q-eb769488cd.png", "options": ["30", "40", "45", "50", "55"], "correct": 4, "src": "GEO", "orig": "images/q-eb769488cd.png", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">z составлен из половин углов x и y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 70 = 35, ½ · 40 = 20.</li><li>z = 35 + 20 = 55.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, D — взяли не те половины.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Биссектриса делит угол пополам.</div></div>"}, {"id": 22, "text": "<p>If all interior angles of the polygon above are congruent, then \\(x\\) =</p>", "image": "images/q-e66d1cda5f.png", "options": ["60", "65", "72", "80", "84"], "correct": 2, "src": "GEO", "orig": "images/q-e66d1cda5f.png", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все углы равны → правильный пятиугольник; x — внешний угол.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма внешних углов любого многоугольника = 360°.</li><li>x = 360° ÷ 5 = 72°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (60) — шестиугольник.</li><li>D, E, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внутренний угол правильного 5-угольника 108°, внешний 72°.</div></div>"}, {"id": 23, "text": "<p>In the xy-plane above, points \\(Q\\) and \\(S\\) are the centers of the circles, which are tangent to the x-axis. What is the slope of line \\(QS\\) (not shown)?</p>", "image": "images/q-70d7c7aa34.jpg", "options": ["\\(\\frac{1}{8}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{7}{8}\\)", "1"], "correct": 1, "src": "GEO", "orig": "images/q-70d7c7aa34.jpg", "review": true, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Окружность касается оси x → центр на высоте радиуса.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Q = (3; 3), S = (11; 5) по рисунку.</li><li>Наклон = <span class=\"fr\"><span>5 − 3</span><span>11 − 3</span></span> = <span class=\"fr\"><span>2</ 00.</li><li>49 − 14x + x² + 49 + 14x + x² = 98 + 2x² = 100.</li><li>x² = 1 → 49 + x² = 50.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (100) — гипотенуза в квадрате.</li><li>D (98) — без 2x².</li><li>B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a − b)² + (a + b)² = 2a² + 2b² — средние члены сокращаются.</div></div>"}, {"id": 26, "text": "<p>The figures above represent three pieces of cardboard. All angles of the cardboard pieces are right angles, all short sides have length 1, and all long sides have length 2. Which of the following figures could be made from only the three pieces of cardboard without overlapping or cutting them?</p><p>I.</p><p>[Figure I: An L-shaped figure with dimensions labeled 3 (top), 3 (right side), 2 (bottom inner), 1 (inner step)]</p><p>II.</p><p>[Figure II: A staircase-shaped figure with dimensions labeled 2 (top), 4 (left side), 2 (inner), 1 (right upper), 1 (inner step)]</p><p>III.</p><p>[Figure III: A staircase-shaped figure with dimensions labeled 1 (top), 4 (left side), 1 (inner step), 2 (right side), 3 (bottom), 1 (right bottom)]</p>", "image": "images/q-1c7bd86d55.jpg", "options": ["None", "I only", "II only", "III only", "I and II"], "correct": 2, "src": "GEO", "orig": "images/q-1c7bd86d55.jpg", "review": true, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади фигур должны совпадать с суммарной площадью трёх кусков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Куски: 1 + 5 + 3 = 9 единичных квадратов.</li><li>Фигуры I и III имеют площадь ≠ 9 → невозможно.</li><li>Фигура II — площадь 9, куски в неё помещаются.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — включают I или III, где площадь не совпадает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка площади — самый быстрый фильтр в задачах «собери фигуру».</div></div>"}, {"id": 27, "text": "<p>How many more degrees of arc are there in \\(\\frac{1}{4}\\) of a circle than in \\(\\frac{1}{5}\\) of a circle?</p>", "image": "", "options": ["9°", "18°", "24°", "30°", "36°"], "correct": 1, "src": "GEO", "orig": "images/q-7946b7d333.jpg", "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переводим доли окружности в градусы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>¼ · 360° = 90°; ⅕ · 360° = 72°.</li><li>90 − 72 = 18°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>1</span><span>4</span></span> − <span class=\"fr\"><span>1</span><span>5</span></span> = <span class=\"fr\"><span>1</span><span>20</span></span> = 18°.</div></div>"}, {"id": 28, "text": "<p>The figure above shows the dimensions of a pedestal constructed of 4 layers of marble. Each layer is a rectangular solid that is 1 foot high and has a square base. How many cubic feet of marble make up the pedestal?</p>", "image": "images/q-75dcc3df44.jpg", "options": ["14", "16", "30", "36", "80"], "correct": 2, "src": "GEO", "orig": "images/q-75dcc3df44.jpg", "review": true, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре слоя-параллелепипеда высотой 1 фут.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Основания 4, 3, 2, 1 → площади 16, 9, 4, 1.</li><li>Объём = 30 фут³.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (16) — только нижний слой.</li><li>D, E — неверные размеры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Объём слоя = площадь основания × высота.</div></div>"}, {"id": 31, "topic": "M5.11", "text": "<p>How many edges does a pentagonal pyramid have?</p>", "image": "", "options": ["6", "7", "10", "12", "20"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Призма с n-угольным основанием: 3n рёбер; пирамида: 2n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Проверка по Эйлеру: V − E + F = 6 − 10 + 6 = 2. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это число граней.</li><li>B — ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> F + V = E + 2.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.15", "text": "<p>A cone has base radius 6 cm and perpendicular height 10 cm.</p><p>What is its volume, in terms of \\(\\pi\\)?</p>", "image": "", "options": ["\\(480\\pi\\) cm³", "\\(120\\pi\\) cm³", "\\(360\\pi\\) cm³", "\\(20\\pi\\) cm³", "\\(180\\pi\\) cm³"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = ⅓πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>⅓ · 36 · 10 = 120 → 120π. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — взяли диаметр.</li><li>C — забыли ⅓.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Конус = ⅓ цилиндра.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1680, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1680, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  var pending = null;
  function draw(){
    if(!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false
    });
  }
  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }
  window.addEventListener("load", function(){
    schedule();
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  });
})();
</script>
