<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;

    --glass-line: rgba(255,255,255,0.14);

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }

  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {

    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;

  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;

  }

    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;

    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }

    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"text": "A woman has 5 pairs of shoes, 5 skirts and 5 shirts. One pair of shoes is black and one shirt is brown. She will not wear the black shoes with the brown shirt. How many different outfits can she make?", "options": ["100", "120", "125", "80", "90"], "correct": 1, "src": "M5", "id": 1, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем все комбинации, затем вычитаем запрещённые.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Без ограничений: 5 · 5 · 5 = 125 нарядов.</li><li>Запрещённые: чёрные туфли + коричневая рубашка + любая из 5 юбок = 5.</li><li>125 − 5 = 120.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (125) — забыли ограничение.</li><li>A (100) — вычли 25 (как будто запрет на всю пару «туфли или рубашка»).</li><li>D, E — неверный подсчёт запрещённых.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Всего минус запрещённые» обычно проще, чем считать разрешённые напрямую.</div></div>"}, {"id": 2, "text": "m and n are the roots of x² + 5x + 8 = 0. What is √(m² + n²)?", "options": ["9", "5", "4", "3", "6"], "correct": 3, "src": "M1", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не ищем корни — используем теорему Виета и формулу m² + n² = (m + n)² − 2mn.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m + n = −5, mn = 8.</li><li>m² + n² = 25 − 16 = 9.</li><li>√9 = 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (9) — забыли извлечь корень.</li><li>B (5) — взяли |m + n|.</li><li>C, E — ошибка в 2mn.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Симметричные выражения корней (m² + n², <span class=\"fr\"><span>1</span><span>m</span></span> + <span class=\"fr\"><span>1</span><span>n</span></span> …) всегда считаются через сумму и произведение.</div></div>"}, {"id": 3, "text": "For which value of K is the identity a³ + b³ + c³ = (a + b + c)³ − 3(a + b + c)(ab + ac + bc) + Kabc true for all a, b and c?", "options": ["-6", "-3", "0", "3", "6"], "correct": 3, "src": "M4", "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Раскрываем правую часть и смотрим, сколько abc не хватает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(a + b + c)³ = a³ + b³ + c³ + 3Σa²b + 6abc.</li><li>(a + b + c)(ab + ac + bc) = Σa²b + 3abc → умножаем на 3: 3Σa²b + 9abc.</li><li>Разность: a³ + b³ + c³ − 3abc.</li><li>Чтобы получить a³ + b³ + c³, добавляем 3abc → K = 3.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — перепутан знак.</li><li>C — тождество без abc неверно.</li><li>E — посчитали 6abc без учёта 9abc.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Быстрая проверка: a = b = c = 1 → 3 = 27 − 3·3·3 + K → K = 3.</div></div>"}, {"id": 4, "text": "On her 18th birthday in 2012 Aigerim was 159 cm tall, having grown 6% since 2011. How tall was she in 2011?", "options": ["155 cm", "140 cm", "145 cm", "150 cm", "160 cm"], "correct": 3, "src": "M1", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рост на 6% означает: 159 см = 106% от роста в 2011 году.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x · 1,06 = 159.</li><li>x = 159 ÷ 1,06 = 150 см.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (155) — вычли 6% от 159 (≈ 9,5) неверно.</li><li>C (145) — другое округление.</li><li>B, E — не проходят проверку 150 · 1,06 = 159.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ловушка: «вырос на 6%» — процент от <b>старого</b> значения. Нельзя просто вычесть 6% от нового.</div></div>"}, {"id": 5, "text": "On a journey a certain weight of luggage is carried free of charge, and every extra kilogram costs $10. Laa-Laa's luggage weighs 50 kg and she was charged $150. Po's luggage weighs 30 kg. How much will Po pay?", "options": ["$0", "$30", "$50", "$90", "$100"], "correct": 0, "src": "M4", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим, сколько килограммов провозится бесплатно, из данных о Лаа-Лаа.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Заплатила $150 → платных кг 150 ÷ 10 = 15.</li><li>Бесплатно 50 − 15 = 35 кг.</li><li>У По 30 кг < 35 → платить не нужно, $0.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B ($30), C ($50) — неправильно считают бесплатную норму.</li><li>D, E — считают все кг платными.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала найдите скрытый параметр (бесплатная норма).</div></div>"}, {"id": 6, "text": "What is the length of the line segment with endpoints (−2, −2) and (2, 3)?", "options": ["√31", "9", "√41", "3", "7"], "correct": 2, "src": "M1", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Длина отрезка — формула расстояния (теорема Пифагора).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Δx = 2 − (−2) = 4, Δy = 3 − (−2) = 5.</li><li>d = √(4² + 5²) = √41.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (9) — сложили 4 + 5.</li><li>A, D, E — арифметические ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус на минус: 3 − (−2) = 5.</div></div>"}, {"id": 8, "text": "f(x) = kx (k ≠ 0) and g(x) = x + k. Which of these statements is always true? I. f(2x) = 2f(x)  II. f(x + 2) = f(x) + 2  III. f(g(x)) = g(f(x))", "options": ["I only", "II only", "I and II", "I and III", "I, II and III"], "correct": 0, "src": "M1", "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Проверяем каждое утверждение для произвольного k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I: f(2x) = k·2x = 2kx = 2f(x) — верно всегда ✓.</li><li>II: f(x + 2) = kx + 2k, а f(x) + 2 = kx + 2 — равны только при k = 1.</li><li>III: f(g(x)) = k(x + k) = kx + k²; g(f(x)) = kx + k — равны только при k = 1.</li><li>Всегда верно только I.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, E — содержат II, которое неверно при k ≠ 1.</li><li>D — содержит III.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Always true» — достаточно одного контрпримера (k = 2), чтобы отбросить утверждение.</div></div>"}, {"id": 9, "text": "Find the largest integer value of x satisfying x² − 7x − 8 < 0.", "options": ["8", "1", "-8", "7", "-1"], "correct": 3, "src": "M2", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Решаем квадратное неравенство и берём наибольшее целое внутри промежутка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 7x − 8 = (x − 8)(x + 1).</li><li>< 0 между корнями: −1 < x < 8.</li><li>Неравенство строгое → 8 не входит; наибольшее целое 7.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (8) — граница не входит.</li><li>B, C, E — не наибольшие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство — концы не включаются.</div></div>"}, {"id": 10, "text": "y is a solution of the system x² + y² = 65 and xy = 28. What is y, given that x ≥ 0?", "options": ["4", "-4", "-7", "6", "8"], "correct": 0, "src": "M2", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Комбинируем уравнения через (x + y)² и (x − y)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x + y)² = x² + y² + 2xy = 65 + 56 = 121 → x + y = 11 (оба положительны, т.к. xy > 0, x ≥ 0).</li><li>(x − y)² = 65 − 56 = 9 → x − y = ±3.</li><li>Пары: (7; 4) или (4; 7).</li><li>Среди вариантов есть только y = 4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C — отрицательные y невозможны при x ≥ 0 и xy > 0.</li><li>D, E — не удовлетворяют xy = 28 с целым x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Система x² + y², xy → всегда через квадраты суммы и разности.</div></div>"}, {"id": 11, "text": "Which formula could be the general term of the sequence 3, 5, 7, 9?", "options": ["2n-1", "2n", "2n+1", "n+1", "n²+2"], "correct": 2, "src": "M2", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Арифметическая прогрессия: шаг 2, значит, формула вида 2n + c.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разность между членами 2 → 2n + c.</li><li>n = 1: 2 + c = 3 → c = 1.</li><li>a_n = 2n + 1. Проверка: 3, 5, 7, 9 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2n − 1) — даёт 1, 3, 5, 7.</li><li>B (2n) — 2, 4, 6, 8.</li><li>D, E — не та разность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Коэффициент при n = разность прогрессии.</div></div>"}, {"id": 12, "text": "A cone is inscribed in a hemisphere of radius r so that the base of the cone coincides with the base of the hemisphere. What is the ratio of the volume of the cone to the volume of the hemisphere?", "options": ["1/2", "1/4", "2r/3", "r/2", "r/3"], "correct": 0, "src": "M1", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота конуса равна радиусу полусферы, основания совпадают.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Конус: V = ⅓πr²h = ⅓πr²·r = ⅓πr³.</li><li>Полусфера: V = ½ · <span class=\"fr\"><span>4</span><span>3</span></span>πr³ = ⅔πr³.</li><li>Отношение: ⅓ ÷ ⅔ = ½.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (¼) — взяли объём целого шара.</li><li>C, D, E — отношение объёмов не может зависеть от r.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отношение объёмов подобных фигур — безразмерное число, буквы r в ответе быть не может.</div></div>"}, {"id": 13, "text": "In the diagram, N lies on MO. What is y in terms of x?", "image": "images/q-e4a80a9421.png", "options": ["2x", "2x+5", "3x+5", "90-x", "180-x"], "correct": 1, "src": "M2", "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Используем сумму углов треугольника и развёрнутый угол на прямой MO.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В треугольнике MNQ: ∠MNQ = 180° − 2x − (x + 5) = 175° − 3x.</li><li>MO — прямая → углы при N в сумме 180°: (175 − 3x) + y + x = 180.</li><li>y = 2x + 5.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2x) — потеряли 5°.</li><li>C (3x + 5) — забыли угол x при N.</li><li>D, E — не учитывают треугольник.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Развёрнутый угол (на прямой) = 180° — самый частый «второй шаг».</div></div>"}, {"text": "Simplify: 3x · (3x^(−1/3))³", "options": ["1/9", "1", "81", "x²/9", "x²", "81x²"], "correct": 2, "src": "M7", "id": 14, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим скобку в куб, потом умножаем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(3x<sup>−1⁄3</sup>)³ = 27 · x<sup>−1</sup> = <span class=\"fr\"><span>27</span><span>x</span></span>.</li><li>3x · <span class=\"fr\"><span>27</span><span>x</span></span> = 81.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>F (81x²) — неверно сложили степени.</li><li>A, D — перевернули степень.</li><li>B, E — забыли коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (x<sup>a</sup>)<sup>b</sup> = x<sup>ab</sup>: <span class=\"fr\"><span>−1</span><span>3</span></span>·3 = −1.</div></div>"}, {"text": "A square and an equilateral triangle each have side 4. The ratio of the area of the square to the area of the triangle is", "options": ["2√3/2", "2/3", "4√3/3", "1/3", "5√3/3"], "correct": 2, "src": "M7", "id": 15, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь квадрата s², площадь равностороннего треугольника <span class=\"fr\"><span>√3</span><span>4</span></span>s².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Квадрат: 16.</li><li>Треугольник: <span class=\"fr\"><span>√3</span><span>4</span></span> · 16 = 4√3.</li><li>16 / (4√3) = <span class=\"fr\"><span>4</span><span>√3</span></span> = <span class=\"fr\"><span>4√3</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — без √3: забыли формулу площади треугольника.</li><li>A, E — неверное упрощение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Иррациональность в знаменателе убираем: <span class=\"fr\"><span>4</span><span>√3</span></span> = <span class=\"fr\"><span>4√3</span><span>3</span></span>.</div></div>"}, {"id": 16, "text": "Given a² + b² = 4ab and a > b > 0, what is (a − b)/(a + b)?", "options": ["1/(2√3)", "1/√3", "√3", "2√3", "√6"], "correct": 1, "src": "M4", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим искомое выражение в квадрат — тогда появятся a² + b², которые известны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>a − b</span><span>a + b</span></span>² = <span class=\"fr\"><span>a² + b² − 2ab</span><span>a² + b² + 2ab</span></span>.</li><li>= <span class=\"fr\"><span>4ab − 2ab</span><span>4ab + 2ab</span></span> = <span class=\"fr\"><span>2ab</span><span>6ab</span></span> = <span class=\"fr\"><span>1</span><span>3</span></span>.</li><li>a > b > 0 → выражение положительное → <span class=\"fr\"><span>1</span><span>√3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — ошибка в коэффициенте.</li><li>C (√3) — перевёрнутая дробь.</li><li>E — неверно упростили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Когда дано a² + b² = k·ab, ищите выражения (a ± b)².</div></div>"}, {"text": "If a + b = s and a − b = t, what is ab?", "options": ["st", "(s−t)/2", "(s+t)/2", "(s²−t²)/4", "(s²−t²)/2"], "correct": 3, "src": "M5", "id": 17, "topic": "M4.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем a и b через s и t.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = <span class=\"fr\"><span>s + t</span><span>2</span></span>, b = <span class=\"fr\"><span>s − t</span><span>2</span></span>.</li><li>ab = (s + t)<span class=\"fr\"><span>s − t</span><span>4</span></span> = <span class=\"fr\"><span>s² − t²</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (st) — просто перемножили.</li><li>B, C — это b и a, а не произведение.</li><li>E — делим на 2 вместо 4.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: a = 3, b = 1 → s = 4, t = 2 → <span class=\"fr\"><span>16 − 4</span><span>4</span></span> = 3 ✓.</div></div>"}, {"id": 18, "text": "If g(x − 1) = x² + 2, what is g(x + 1)?", "options": ["x²+3", "x²+4x+6", "x²+2x+4", "x²+5", "x²+4x+2"], "correct": 1, "src": "M1", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Заменой находим g(u) в общем виде, потом подставляем x + 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>u = x − 1 → x = u + 1 → g(u) = (u + 1)² + 2.</li><li>g(x + 1) = (x + 2)² + 2 = x² + 4x + 4 + 2 = x² + 4x + 6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — забыли +4 из квадрата.</li><li>C — подставили x + 1 вместо x + 2.</li><li>A, D — неверный сдвиг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> g(x + 1) — это g(x − 1) со сдвигом на 2: подставьте x + 2 вместо x в x² + 2.</div></div>"}, {"text": "Evaluate: ((−1/8)^(−1/3))⁵", "options": ["32", "−32", "−1/32", "1", "2"], "correct": 1, "src": "M5", "id": 19, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отрицательная степень переворачивает дробь, <span class=\"fr\"><span>1</span><span>3</span></span> — кубический корень.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>−1</span><span>8</span></span><sup>−1⁄3</sup> = (−8)<sup>1⁄3</sup> = −2.</li><li>(−2)⁵ = −32.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (32) — потеряли минус (нечётная степень сохраняет знак).</li><li>C <span class=\"fr\"><span>−1</span><span>32</span></span> — забыли перевернуть дробь.</li><li>D, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Кубический корень из отрицательного числа существует и отрицателен.</div></div>"}, {"text": "A = (x + y)²zQ/P. x and y are each increased by 50%, z is decreased by 20%, P is doubled and Q is unchanged. What is the overall change in A?", "options": ["Decrease of 10%", "Increase of 10%", "Increase of 2.5%", "Decrease of 2.5%", "Decrease of 20%", "Increase of 20%"], "correct": 0, "src": "M7", "id": 21, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем множитель изменения A.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x и y +50% → x + y × 1,5 → (x + y)² × 2,25.</li><li>z −20% → × 0,8.</li><li>P × 2 → A ÷ 2.</li><li>2,25 · 0,8 ÷ 2 = 0,9 → уменьшение на 10%.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, F — неверно учтено P.</li><li>C, D — ошибка в квадрате (1,5² = 2,25).</li><li>E — забыли рост x + y.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перемножайте коэффициенты изменений, а не складывайте проценты.</div></div>"}, {"id": 23, "text": "Aygerim, Almaz, Yerkezhan, Kaisar and Madina are going for a drive in a jeep that has five seats, including one driver's seat and four passenger seats. If only Almaz can drive, the number of possible different seating arrangements is", "options": ["12", "18", "24", "120", "15"], "correct": 2, "src": "M1", "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Место водителя фиксировано, остальные рассаживаются произвольно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Водитель — только Алмаз: 1 способ.</li><li>4 человека на 4 места: 4! = 24.</li><li>Итого 24.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (120) — 5!, забыли ограничение.</li><li>A, B, E — неверный счёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала фиксируйте ограниченные позиции, потом считайте остальные.</div></div>"}, {"text": "12 identical machines complete an order in 8 days. How many extra machines are needed to reduce the time by 2 days?", "options": ["2", "3", "4", "6", "9"], "correct": 2, "src": "M7", "id": 24, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём работы в «машино-днях» постоянен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 · 8 = 96 машино-дней.</li><li>Срок 8 − 2 = 6 дней → 96 ÷ 6 = 16 машин.</li><li>Нужно 16 − 12 = 4 дополнительных.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (6) — сократили на 2 дня → +... пропорционально неверно.</li><li>A, B, E — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вопрос про «дополнительные» — не забудьте вычесть уже имеющиеся.</div></div>"}, {"text": "The inequalities y ≥ x² + 3 and x ≥ 1/y define a region. Which point lies in this region?", "options": ["(-1, -6)", "(2, -1)", "(1, 6)", "(2, 2)"], "correct": 2, "src": "M7", "id": 25, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем точки в оба неравенства.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(1; 6): 6 ≥ 1 + 3 = 4 ✓; 1 ≥ <span class=\"fr\"><span>1</span><span>6</span></span> ✓.</li><li>Точка подходит.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−1; −6): −6 ≥ 4 ✗.</li><li>B (2; −1): −1 ≥ 7 ✗.</li><li>D (2; 2): 2 ≥ 7 ✗.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте проверку с более «строгого» неравенства — оно отсекает быстрее.</div></div>"}, {"id": 26, "text": "If 3x + 2y = 5 and 5x + 4y = 9, what is 4x + 3y?", "options": ["6", "7", "0", "4", "5"], "correct": 1, "src": "M3", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не решаем систему — складываем уравнения.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(3x + 2y) + (5x + 4y) = 5 + 9.</li><li>8x + 6y = 14 → 4x + 3y = 7.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — следствие лишних вычислений с ошибкой. (Решение x = 1, y = 1 подтверждает: 4 + 3 = 7.)</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите комбинацию уравнений, дающую нужное выражение сразу.</div></div>"}, {"text": "What is the smallest integer k for which x² + 5x + k = 0 has no solutions?", "options": ["6", "7", "8", "4", "12"], "correct": 1, "src": "M7", "id": 27, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет решений ⇔ дискриминант отрицателен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>D = 25 − 4k < 0 → k > 6,25.</li><li>Наименьшее целое: 7.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (6) — D = 1 > 0, два корня.</li><li>C, E — подходят, но не наименьшие.</li><li>D (4) — есть корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство + «целое» → округляйте вверх.</div></div>"}, {"id": 28, "text": "A regular hexagon is divided into 6 equal triangles. The perimeter of the hexagon is 48 cm. What is the height of each triangle?", "options": ["4", "4√3", "6√3", "8", "8√3"], "correct": 1, "src": "M3", "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Правильный шестиугольник состоит из 6 равносторонних треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона = 48 ÷ 6 = 8 см.</li><li>Высота равностороннего треугольника = <span class=\"fr\"><span>√3</span><span>2</span></span> · 8 = 4√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (8√3) — забыли поделить на 2.</li><li>D (8) — это сторона.</li><li>A, C — неверная формула.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота равностороннего: <span class=\"fr\"><span>√3</span><span>2</span></span>·a.</div></div>"}, {"text": "a is inversely proportional to b². When a = 9, b = 4. What is the positive value of b when a = 4?", "options": ["6", "9", "20.25", "36"], "correct": 0, "src": "M7", "id": 29, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратная пропорциональность к b²: a·b² = const.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9 · 4² = 144.</li><li>4 · b² = 144 → b² = 36 → b = 6.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (9), D (36) — не извлекли корень или перепутали.</li><li>C (20,25) — посчитали прямую пропорциональность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Inversely proportional to b²» → a = <span class=\"fr\"><span>k</span><span>b²</span></span>.</div></div>"}, {"text": "A boy walks at 4 km/h and runs at 6 km/h. By running to school he saves 3 minutes 45 seconds. How far, in km, does he live from school?", "options": ["0.625", "0.75", "7.0", "4.5", "0.125"], "correct": 1, "src": "M5", "id": 30, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разница во времени ходьбы и бега = 3 мин 45 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 мин 45 с = 3,75 мин = <span class=\"fr\"><span>3,75</span><span>60</span></span> ч = <span class=\"fr\"><span>1</span><span>16</span></span> ч.</li><li><span class=\"fr\"><span>d</span><span>4</span></span> − <span class=\"fr\"><span>d</span><span>6</span></span> = <span class=\"fr\"><span>d</span><span>12</span></span>.</li><li><span class=\"fr\"><span>d</span><span>12</span></span> = <span class=\"fr\"><span>1</span><span>16</span></span> → d = <span class=\"fr\"><span>12</span><span>16</span></span> = 0,75 км.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — ошибка в переводе времени.</li><li>C, D — слишком большие расстояния (разница была бы десятки минут).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всегда переводите время в те же единицы, что скорость (часы).</div></div>"}, {"id": 31, "topic": "M4.4", "text": "<p>Factorise fully \\(10x^2y - 15xy^2\\).</p>", "image": "", "options": ["\\(5x(2xy - 3y^2)\\)", "\\(5xy(2x - 3y)\\)", "\\(5xy(3x - 2y)\\)", "\\(xy(10x - 15y)\\)", "\\(5xy(2x + 3y)\\)"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий множитель: НОД чисел и наименьшие степени букв.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>НОД(10, 15) = 5, общие буквы xy. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вынесли не всё: y тоже общий.</li><li>C — перепутали коэффициенты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Fully» — выносите всё общее.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.19", "text": "<p>\\(\\mathbf{a} = \\begin{pmatrix}3\\\\2\\end{pmatrix}\\) and \\(\\mathbf{b} = \\begin{pmatrix}0\\\\4\\end{pmatrix}\\).</p><p>Find \\(|2\\mathbf{a} + \\mathbf{b}|\\).</p>", "image": "", "options": ["14", "\\(\\sqrt{45}\\)", "100", "10", "\\(\\sqrt{102}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала вектор, потом длина √(x² + y²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2a + b = (6; 8).</li><li>√(36 + 64) = √100. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили компоненты.</li><li>B — забыли умножить a на 2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длина вектора — теорема Пифагора.</div></div>", "src": "PL"}, {"id": 33, "topic": "M1.2", "text": "<p>A fish tank is a cuboid 80 cm long, 50 cm wide and 20 cm high.</p><p>How many litres of water does it hold when full?</p>", "image": "", "options": ["8 litres", "13.2 litres", "80 litres", "160 litres", "800 litres"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 литр = 1000 см³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V = 80 · 50 · 20 = 80,000 см³.</li><li>80,000 : 1000 = 80 л. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — делили на 10 000.</li><li>B — посчитали площадь поверхности, а не объём.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Литр — это куб 10 × 10 × 10 см.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  .pl-noselect, .pl-noselect * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  @media print { body.pl-noprint * { display: none !important; } }
</style>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<script>
(function(){
  // render math the moment it lands in the page: MutationObserver callbacks run before the next paint, so raw LaTeX is never shown
  var opts = {delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}], throwOnError: false};
  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){
    render(document.body);
    new MutationObserver(function(ms){
      var done = [];
      for (var i = 0; i < ms.length; i++) {
        var t = ms[i].target;
        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
      }
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
