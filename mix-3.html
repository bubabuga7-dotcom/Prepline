<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;

  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;

<script>
const questions = [{"text": "A woman has 5 pairs of shoes, 5 skirts and 5 shirts. One pair of shoes is black and one shirt is brown. She will not wear the black shoes with the brown shirt. How many different outfits can she make?", "options": ["100", "120", "125", "80", "90"], "correct": 1, "src": "M5", "id": 1, "topic": "M2.5", "explain": "Without the rule: 5 × 5 × 5 = 125 outfits. Outfits with the black shoes and the brown shirt: 1 × 5 skirts × 1 = 5. 125 − 5 = 120."}, {"id": 2, "text": "m and n are the roots of x² + 5x + 8 = 0. What is √(m² + n²)?", "options": ["9", "5", "4", "3", "6"], "correct": 3, "src": "M1", "topic": "M4.16", "explain": "m + n = −5 and mn = 8. m² + n² = (m + n)² − 2mn = 25 − 16 = 9, so √9 = 3."}, {"id": 3, "text": "For which value of K is the identity a³ + b³ + c³ = (a + b + c)³ − 3(a + b + c)(ab + ac + bc) + Kabc true for all a, b and c?", "options": ["-6", "-3", "0", "3", "6"], "correct": 3, "src": "M4", "topic": "M4.8", "explain": "Expand: (a+b+c)³ = a³+b³+c³ + 3Σa²b + 6abc and (a+b+c)(ab+ac+bc) = Σa²b + 3abc.<br>So (a+b+c)³ − 3(a+b+c)(ab+ac+bc) = a³+b³+c³ − 3abc. Adding 3abc gives a³+b³+c³, so K = 3."}, {"id": 4, "text": "On her 18th birthday in 2012 Aigerim was 159 cm tall, having grown 6% since 2011. How tall was she in 2011?", "options": ["155 cm", "140 cm", "145 cm", "150 cm", "160 cm"], "correct": 3, "src": "M1", "topic": "M3.8", "explain": "159 cm is 106% of the 2011 height: 159 ÷ 1.06 = 150 cm."}, {"id": 5, "text": "On a journey a certain weight of luggage is carried free of charge, and every extra kilogram costs $10. Laa-Laa's luggage weighs 50 kg and she was charged $150. Po's luggage weighs 30 kg. How much will Po pay?", "options": ["$0", "$30", "$50", "$90", "$100"], "correct": 0, "src": "M4", "topic": "M4.15", "explain": "Let F kg be free. Laa-Laa paid for 50 − F kg: 10(50 − F) = 150, so F = 35 kg. Po's 30 kg is under the free amount, so he pays $0."}, {"id": 6, "text": "What is the length of the line segment with endpoints (−2, −2) and (2, 3)?", "options": ["√31", "9", "√41", "3", "7"], "correct": 2, "src": "M1", "topic": "M5.10", "explain": "Distance = √((2 − (−2))² + (3 − (−2))²) = √(16 + 25) = √41."}, {"id": 7, "text": "If i² = −1, what is i¹⁴ + i¹⁵ + i¹⁶ + i¹⁷?", "options": ["0", "1", "2i", "1−i", "2+2i"], "correct": 0, "src": "M3", "topic": "M2.7", "explain": "Powers of i repeat every 4: i¹⁴ = i² = −1, i¹⁵ = −i, i¹⁶ = 1, i¹⁷ = i. Sum: −1 − i + 1 + i = 0."}, {"id": 8, "text": "f(x) = kx (k ≠ 0) and g(x) = x + k. Which of these statements is always true? I. f(2x) = 2f(x)  II. f(x + 2) = f(x) + 2  III. f(g(x)) = g(f(x))", "options": ["I only", "II only", "I and II", "I and III", "I, II and III"], "correct": 0, "src": "M1", "topic": "M4.8", "explain": "I: f(2x) = 2kx = 2f(x) — always.<br>II: f(x + 2) = kx + 2k, equal to kx + 2 only when k = 1.<br>III: f(g(x)) = kx + k² and g(f(x)) = kx + k, equal only when k = 1.<br>Only I is always true."}, {"id": 9, "text": "Find the largest integer value of x satisfying x² − 7x − 8 < 0.", "options": ["8", "1", "-8", "7", "-1"], "correct": 3, "src": "M2", "topic": "M4.16", "explain": "x² − 7x − 8 = (x − 8)(x + 1) &lt; 0 for −1 &lt; x &lt; 8. The largest integer is 7."}, {"id": 10, "text": "y is a solution of the system x² + y² = 65 and xy = 28. What is y, given that x ≥ 0?", "options": ["4", "-4", "-7", "6", "8"], "correct": 0, "src": "M2", "topic": "M4.15", "explain": "(x + y)² = 65 + 2·28 = 121 and (x − y)² = 65 − 56 = 9. xy &gt; 0 and x ≥ 0, so both are positive: x + y = 11, x − y = ±3, giving (x, y) = (7, 4) or (4, 7). Of these, only y = 4 is an option."}, {"id": 11, "text": "Which formula could be the general term of the sequence 3, 5, 7, 9?", "options": ["2n-1", "2n", "2n+1", "n+1", "n²+2"], "correct": 2, "src": "M2", "topic": "M4.18", "explain": "The terms go up by 2, so the rule is 2n + c. For n = 1: 2 + c = 3, c = 1. General term 2n + 1."}, {"id": 12, "text": "A cone is inscribed in a hemisphere of radius r so that the base of the cone coincides with the base of the hemisphere. What is the ratio of the volume of the cone to the volume of the hemisphere?", "options": ["1/2", "1/4", "2r/3", "r/2", "r/3"], "correct": 0, "src": "M1", "topic": "M5.15", "explain": "The cone's height is r (from the base to the top of the hemisphere). Cone: ⅓πr²·r = ⅓πr³. Hemisphere: ⅔πr³. Ratio ⅓ ÷ ⅔ = ½."}, {"id": 13, "text": "In the diagram, N lies on MO. What is y in terms of x?", "image": "images/q-e4a80a9421.png", "options": ["2x", "2x+5", "3x+5", "90-x", "180-x"], "correct": 1, "src": "M2", "topic": "M5.2", "explain": "In triangle MNQ: ∠MNQ = 180° − 2x − (x + 5) = 175° − 3x.<br>MO is a straight line, so the angles at N on one side add to 180°: (175 − 3x) + y + x = 180, giving y = 2x + 5."}, {"text": "Simplify: 3x · (3x^(−1/3))³", "options": ["1/9", "1", "81", "x²/9", "x²", "81x²"], "correct": 2, "src": "M7", "id": 14, "topic": "M4.2", "explain": "(3x^(−1/3))³ = 27x⁻¹. Then 3x · 27/x = 81."}, {"text": "A square and an equilateral triangle each have side 4. The ratio of the area of the square to the area of the triangle is", "options": ["2√3/2", "2/3", "4√3/3", "1/3", "5√3/3"], "correct": 2, "src": "M7", "id": 15, "topic": "M5.14", "explain": "Square: 4² = 16. Triangle: (√3/4)·4² = 4√3. Ratio 16/(4√3) = 4/√3 = 4√3/3."}, {"id": 16, "text": "Given a² + b² = 4ab and a > b > 0, what is (a − b)/(a + b)?", "options": ["1/(2√3)", "1/√3", "√3", "2√3", "√6"], "correct": 1, "src": "M4", "topic": "M4.6", "explain": "Square the expression: (a − b)²/(a + b)² = (a² + b² − 2ab)/(a² + b² + 2ab) = (4ab − 2ab)/(4ab + 2ab) = 1/3. It is positive (a &gt; b &gt; 0), so the answer is 1/√3."}, {"text": "If a + b = s and a − b = t, what is ab?", "options": ["st", "(s−t)/2", "(s+t)/2", "(s²−t²)/4", "(s²−t²)/2"], "correct": 3, "src": "M5", "id": 17, "topic": "M4.5", "explain": "a = (s + t)/2 and b = (s − t)/2, so ab = (s² − t²)/4."}, {"id": 18, "text": "If g(x − 1) = x² + 2, what is g(x + 1)?", "options": ["x²+3", "x²+4x+6", "x²+2x+4", "x²+5", "x²+4x+2"], "correct": 1, "src": "M1", "topic": "M4.3", "explain": "Let u = x − 1: g(u) = (u + 1)² + 2. Then g(x + 1) = (x + 2)² + 2 = x² + 4x + 6."}, {"text": "Evaluate: ((−1/8)^(−1/3))⁵", "options": ["32", "−32", "−1/32", "1", "2"], "correct": 1, "src": "M5", "id": 19, "topic": "M2.7", "explain": "(−1/8)^(−1/3) = (−8)^(1/3) = −2, and (−2)⁵ = −32."}, {"id": 20, "text": "h(n) is defined as the product of all the even numbers from 2 to n inclusive. What is h(50)?", "options": ["50!", "2×5!", "2^50", "2^25 × 25!", "2^58 × 20!"], "correct": 3, "src": "M2", "topic": "M4.6", "explain": "2 · 4 · 6 ⋯ 50 = (2·1)(2·2)(2·3)⋯(2·25): there are 25 factors of 2, times 1·2·⋯·25. So h(50) = 2²⁵ × 25!."}, {"text": "A = (x + y)²zQ/P. x and y are each increased by 50%, z is decreased by 20%, P is doubled and Q is unchanged. What is the overall change in A?", "options": ["Decrease of 10%", "Increase of 10%", "Increase of 2.5%", "Decrease of 2.5%", "Decrease of 20%", "Increase of 20%"], "correct": 0, "src": "M7", "id": 21, "topic": "M3.8", "explain": "x + y grows by 50%, so (x + y)² × 1.5² = 2.25. z × 0.8, P × 2 (divide by 2). A × 2.25 × 0.8 ÷ 2 = 0.9: a decrease of 10%."}, {"id": 22, "text": "For which non-zero value of k is the polynomial p(x) = x² + 3x + k divisible by x + k?", "options": ["-1", "3", "2", "-4", "-2"], "correct": 2, "src": "M1", "topic": "M4.5", "explain": "Divisible by x + k means p(−k) = 0: k² − 3k + k = k² − 2k = 0, so k = 2 (k ≠ 0)."}, {"id": 23, "text": "Aygerim, Almaz, Yerkezhan, Kaisar and Madina are going for a drive in a jeep that has five seats, including one driver's seat and four passenger seats. If only Almaz can drive, the number of possible different seating arrangements is", "options": ["12", "18", "24", "120", "15"], "correct": 2, "src": "M1", "topic": "M2.5", "explain": "Almaz must drive (1 way). The other 4 people fill 4 seats in 4! = 24 ways."}, {"text": "12 identical machines complete an order in 8 days. How many extra machines are needed to reduce the time by 2 days?", "options": ["2", "3", "4", "6", "9"], "correct": 2, "src": "M7", "id": 24, "topic": "M3.9", "explain": "The order is 12 × 8 = 96 machine-days. In 6 days it needs 96 ÷ 6 = 16 machines: 4 extra."}, {"text": "The inequalities y ≥ x² + 3 and x ≥ 1/y define a region. Which point lies in this region?", "options": ["(-1, -6)", "(2, -1)", "(1, 6)", "(2, 2)"], "correct": 2, "src": "M7", "id": 25, "topic": "M4.3", "explain": "Check (1, 6): 6 ≥ 1² + 3 = 4 ✔ and 1 ≥ 1/6 ✔. The others fail the first inequality (e.g. (2, 2): 2 ≥ 7 is false)."}, {"id": 26, "text": "If 3x + 2y = 5 and 5x + 4y = 9, what is 4x + 3y?", "options": ["6", "7", "0", "4", "5"], "correct": 1, "src": "M3", "topic": "M4.15", "explain": "Add the equations: 8x + 6y = 14, so 4x + 3y = 7."}, {"text": "What is the smallest integer k for which x² + 5x + k = 0 has no solutions?", "options": ["6", "7", "8", "4", "12"], "correct": 1, "src": "M7", "id": 27, "topic": "M4.16", "explain": "No real solutions when the discriminant is negative: 25 − 4k &lt; 0, k &gt; 6.25. Smallest integer 7."}, {"id": 28, "text": "A regular hexagon is divided into 6 equal triangles. The perimeter of the hexagon is 48 cm. What is the height of each triangle?", "options": ["4", "4√3", "6√3", "8", "8√3"], "correct": 1, "src": "M3", "topic": "M5.7", "explain": "Perimeter 48 gives side 8. The triangles are equilateral with side 8, height = (√3/2)·8 = 4√3."}, {"text": "a is inversely proportional to b². When a = 9, b = 4. What is the positive value of b when a = 4?", "options": ["6", "9", "20.25", "36"], "correct": 0, "src": "M7", "id": 29, "topic": "M3.9", "explain": "a·b² is constant: 9 · 16 = 144. When a = 4: b² = 36, b = 6."}, {"text": "A boy walks at 4 km/h and runs at 6 km/h. By running to school he saves 3 minutes 45 seconds. How far, in km, does he live from school?", "options": ["0.625", "0.75", "7.0", "4.5", "0.125"], "correct": 1, "src": "M5", "id": 30, "topic": "M4.15", "explain": "3 min 45 s = 1/16 h. d/4 − d/6 = d/12 = 1/16, so d = 0.75 km."}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
