<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;

  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;

  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "Many people believe that eating late in the evening causes weight gain. However, studies comparing people who eat the same total amount of food each day find little difference in weight between those who eat late and those who eat early. What matters for weight is how much a person eats overall, not when they eat it. People who want to lose weight should therefore concentrate on reducing the total amount they eat, rather than worrying about the time of their last meal. Late eating may still be a problem for some people, but only if it leads them to eat more in total.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Studies find little difference in weight between early and late eaters.", "Late eating can lead some people to eat more in total.", "What matters for weight is the total amount eaten, not the time it is eaten.", "People who want to lose weight should concentrate on how much they eat in total rather than on when they eat.", "Eating late in the evening does not cause weight gain."], "correct": 3, "explain": "The advice introduced by 'therefore' is the main conclusion. C is an intermediate conclusion drawn from the studies and used to support D. E overstates the passage, which admits that late eating can be a problem for some people. B and A are a qualification and the evidence."}, {"id": 2, "text": "A swimming pool charges as follows:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Ticket</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Notes</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Single swim</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">1,200 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Students 25% off</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10-swim card</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Valid for 2 months; no student discount</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Monthly pass</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">7,500 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited swims for one month; students 25% off</td></tr></table>Daniyar is a student. He will swim 12 times in one month.<br><br><b>What is the least he can pay for these swims?</b>", "options": ["5,625 ₸", "7,500 ₸", "10,000 ₸", "10,800 ₸", "11,800 ₸"], "correct": 0, "explain": "Singles: 12 × 900 ₸ = 10,800 ₸. Card plus two singles: 10,000 + 1,800 = 11,800 ₸. Monthly pass with the student discount: 7,500 × 0.75 = 5,625 ₸, the cheapest. 7,500 ₸ forgets the discount."}, {"id": 3, "text": "Local newspapers are disappearing, and this is bad for democracy. Without journalists attending council meetings and courts, decisions made by local officials go unreported, and mistakes and wrongdoing are less likely to be discovered. National newspapers cannot fill this gap, because they rarely cover local matters. Social media spreads local news quickly, but most of it is opinion rather than carefully checked reporting. Governments should therefore consider ways of supporting local journalism, such as tax relief for local news organisations.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Local news organisations should receive tax relief.", "National newspapers rarely cover local matters.", "Most local news on social media is opinion rather than checked reporting.", "Governments should consider ways of supporting local journalism.", "The disappearance of local newspapers is bad for democracy."], "correct": 3, "explain": "The final recommendation is the main conclusion. E is an intermediate conclusion that the rest of the passage supports and that leads to D. B and C explain why others cannot fill the gap. A is only one example of the kind of support the conclusion recommends."}, {"id": 4, "text": "Two candles are the same length. One burns down completely in 4 hours and the other in 6 hours, each at a steady rate. They are lit at the same time.<br><br><b>After how long is one candle exactly twice as long as the other?</b>", "options": ["2 hours", "2 hours 24 minutes", "3 hours", "3 hours 30 minutes", "4 hours"], "correct": 2, "explain": "After t hours the lengths are 1 − t/4 and 1 − t/6 of the original. Setting 1 − t/6 = 2(1 − t/4) gives t/3 = 1, so t = 3 hours: one candle is then 1/4 of its length and the other 1/2."}, {"id": 5, "text": "In 2015, 40% of the households in a town had a fast internet connection; by 2025 the figure was 85%. Over the same period, the proportion of the town's working population who work from home at least two days a week rose from 5% to 25%.<br><br><b>Which one of the following conclusions is best supported by the information above?</b>", "options": ["The number of households in the town increased between 2015 and 2025.", "Most people with a fast internet connection work from home.", "By 2025, most of the town's workers worked from home.", "The spread of fast internet connections may have made it easier for more people in the town to work from home.", "Fast internet connections cause people to work from home."], "correct": 3, "explain": "The two changes happened together, and fast internet would make home working easier, so D is a reasonable, cautious conclusion. E claims a definite cause, which the figures cannot show. B, C and A are not supported (25% is not 'most')."}, {"id": 6, "text": "At a school, 45% of the students are boys. 20% of the boys and 30% of the girls belong to a sports club.<br><br><b>What percentage of all the students belong to a sports club?</b>", "options": ["24.5%", "25%", "25.5%", "26.5%", "50%"], "correct": 2, "explain": "Boys in the club: 20% of 45% = 9% of all students. Girls: 30% of 55% = 16.5%. Total 25.5%. 25% is the simple average of 20% and 30%, which ignores the different numbers of boys and girls."}, {"id": 7, "text": "The museum opens on Mondays only if it has received new funding. Whenever the museum opens on Mondays, it employs extra staff. This month the museum has not employed any extra staff.<br><br><b>Which one of the following must be true?</b>", "options": ["The museum will receive new funding next month.", "If the museum receives new funding, it will open on Mondays.", "The museum has not received new funding.", "The museum is not opening on Mondays this month.", "The museum cannot afford extra staff."], "correct": 3, "explain": "Opening on Mondays always means extra staff; there are no extra staff, so it is not opening on Mondays. C does not follow: funding is needed for Monday opening, but the museum might have the funding and still not open. B reverses the first statement. A and E are not supported."}, {"id": 8, "text": "Four internet providers offer these deals:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Provider</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Monthly fee</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Installation</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Minimum contract</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">A</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12 months</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">B</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,500 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Free</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12 months</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">C</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">4,000 ₸ for the first 6 months, then 7,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12 months</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">D</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">7,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Free</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">None</td></tr></table><br><br><b>Which provider is cheapest over the first 12 months?</b>", "options": ["Provider A", "Provider B", "Provider C", "Provider D", "A and B cost the same"], "correct": 2, "explain": "A: 20,000 + 12 × 5,000 = 80,000 ₸. B: 12 × 6,500 = 78,000 ₸. C: 10,000 + 6 × 4,000 + 6 × 7,000 = 76,000 ₸. D: 84,000 ₸. C is cheapest."}, {"id": 9, "text": "A new motorway would cut the journey time between the two cities from three hours to two. This would encourage more businesses to set up in the region, creating thousands of jobs. The government should therefore build the motorway.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The two cities are the largest in the country.", "Most people in the region own cars.", "The motorway would be finished on time.", "The motorway would not damage the environment.", "Shorter journey times are an important factor for businesses deciding where to set up."], "correct": 4, "explain": "The link between the motorway and new jobs depends on businesses caring about journey times. If they did not, a faster road would not attract them. C, B, A and D are not needed for the argument's reasoning."}, {"id": 10, "text": "A one-hour meeting must be held when three colleagues are all free.<br>• Aru: 09:00–12:00 and 14:00–17:00<br>• Bek: 10:30–13:00 and 15:30–18:00<br>• Dana: 08:00–11:30 and 15:00–16:00<br><br><b>At what time must the meeting start?</b>", "options": ["09:00", "10:30", "11:00", "15:00", "15:30"], "correct": 1, "explain": "Aru and Bek are both free 10:30–12:00 and 15:30–17:00. Dana is also free 10:30–11:30 (one hour) and 15:30–16:00 (only 30 minutes). So the meeting must start at 10:30."}, {"id": 11, "text": "Our school canteen has sold far more salads since it began displaying them at the front of the counter. The canteen should therefore also display fruit at the front of the counter, so that students will buy more fruit.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Students like salad more than fruit.", "Fruit is healthier than salad.", "Salads are cheaper than fruit.", "The canteen makes a profit on fruit.", "Displaying food at the front of the counter would affect fruit sales in a similar way to salad sales."], "correct": 4, "explain": "The argument expects what happened with salads to happen with fruit; this only follows if the display position works in the same way for both. B, A, D and C are not required."}, {"id": 12, "text": "Five runners take part in a race. Gold, silver and bronze medals are awarded to the first three, and there are no ties.<br><br><b>In how many different ways can the three medals be awarded?</b>", "options": ["10", "60", "120", "125", "243"], "correct": 1, "explain": "Gold can go to any of 5 runners, silver to any of the remaining 4, and bronze to any of the remaining 3: 5 × 4 × 3 = 60. 10 counts only which three runners win medals, not who gets which medal."}, {"id": 13, "text": "The Kazakh language courses run by the city have long waiting lists. The city should therefore offer more courses, since this will allow more adults to learn Kazakh.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The people on the waiting lists would actually attend the extra courses if they were offered.", "Learning Kazakh is difficult for adults.", "The current teachers are well qualified.", "Most people on the waiting lists are young.", "The courses are free."], "correct": 0, "explain": "Long waiting lists only show that more courses would help if the people on them would really take up the places. If many had lost interest or moved away, extra courses might stay half empty. B, E, D and C are not needed."}, {"id": 14, "text": "A car loses 20% of its value each year. A car worth £10,000 is worth 10,000 × 0.8 × 0.8 = £6,400 after 2 years.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A car loses 20% a year, so after 2 years it has lost 40% of its value: 10,000 × 0.6 = £6,000.", "20% of £10,000 is £2,000.", "A price that rises from £8,000 to £10,000 has increased by 25%.", "A car worth £10,000 loses £2,000 a year, so after 2 years it is worth £6,000.", "A town's population grows by 10% a year. Starting from 5,000, after 2 years it is 5,000 × 1.1 × 1.1 = 6,050."], "correct": 4, "explain": "The example applies the same percentage change twice by multiplying by the same factor twice. E does the same with growth. A adds the percentages instead; D subtracts a fixed amount each year; B and C are single steps."}, {"id": 15, "text": "Employees who take part in the company's voluntary fitness programme take fewer sick days than other employees. The programme is therefore reducing sickness among the company's staff.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Employees who are often ill are less likely to sign up for a voluntary fitness programme.", "Sick days are recorded accurately by the company.", "Some employees do sport outside work.", "The fitness programme costs the company a lot of money.", "Fitness programmes are popular in many companies."], "correct": 0, "explain": "If healthier employees are the ones who choose to join, the programme's members would take fewer sick days even if the programme had no effect. B slightly strengthens the argument; D, E and C are irrelevant."}, {"id": 16, "text": "The table shows the number of visitors to a website, in thousands, in the first six months of a year.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Month</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Jan</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Feb</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Mar</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Apr</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">May</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Jun</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Visitors (thousands)</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">120</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">135</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">150</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">140</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">175</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">210</td></tr></table><br><br><b>If the number of visitors keeps growing at the same percentage rate each month as it did from May to June, about how many thousand visitors will there be in August?</b>", "options": ["280", "294", "302", "315", "350"], "correct": 2, "explain": "From May to June visitors grew by 35/175 = 20%. July: 210 × 1.2 = 252; August: 252 × 1.2 = 302.4, about 302 thousand. 280 adds 35 thousand each month instead of 20%."}, {"id": 17, "text": "Since the city introduced a 30 km/h speed limit in residential streets, the number of pedestrians injured in those streets has fallen by 25%. The speed limit has made residential streets safer for pedestrians.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["Speed cameras were installed in residential streets at the same time.", "Most drivers dislike the new speed limit.", "Children often play in residential streets.", "The limit was introduced after a campaign by parents.", "Over the same period, the number of people wal let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
        ${q.explain ? `<details style="margin-top:8px;font-size:14px;line-height:1.55"><summary style="cursor:pointer;color:var(--gold,#C9A227);font-weight:600">Why ${'ABCDE'[q.correct]}?</summary><div style="margin-top:6px;opacity:.9">${q.explain}</div></details>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<style id="prepline-gate-css">
  #pl-gate{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;
           background:rgba(6,10,20,.78);backdrop-filter:blur(4px);padding:20px}
  #pl-gate.on{display:flex}
  #pl-gate .box{max-width:420px;width:100%;background:#111A2E;border:1px solid rgba(255,255,255,.14);
                border-radius:10px;padding:26px 28px;font-family:Inter,system-ui,sans-serif;color:#E6ECF7}
  #pl-gate h3{font-family:Sora,Inter,sans-serif;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
  #pl-gate p{font-size:14px;line-height:1.55;color:#B4C0D6;margin:0 0 18px}
  #pl-gate .row{display:flex;gap:10px;flex-wrap:wrap}
  #pl-gate button{font:600 14px Inter,sans-serif;padding:11px 22px;border-radius:5px;cursor:pointer;border:0}
  #pl-gate .go{background:#C9A227;color:#10192C}
  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6ECF7}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
