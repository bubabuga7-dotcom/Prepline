<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "Many people believe that eating late in the evening causes weight gain. However, studies comparing people who eat the same total amount of food each day find little difference in weight between those who eat late and those who eat early. What matters for weight is how much a person eats overall, not when they eat it. People who want to lose weight should therefore concentrate on reducing the total amount they eat, rather than worrying about the time of their last meal. Late eating may still be a problem for some people, but only if it leads them to eat more in total.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Studies find little difference in weight between early and late eaters.", "Late eating can lead some people to eat more in total.", "What matters for weight is the total amount eaten, not the time it is eaten.", "People who want to lose weight should concentrate on how much they eat in total rather than on when they eat.", "Eating late in the evening does not cause weight gain."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Важно, сколько едят, а не когда → худеющим стоит следить за общим количеством.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод — рекомендация. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — промежуточный вывод.</li><li>A, B — доводы.</li><li>E — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore … should» — вывод.</div></div>"}, {"id": 2, "topic": "PS", "text": "A swimming pool charges as follows:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Ticket</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Notes</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Single swim</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">1,200 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Students 25% off</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10-swim card</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Valid for 2 months; no student discount</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Monthly pass</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">7,500 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited swims for one month; students 25% off</td></tr></table>Daniyar is a student. He will swim 12 times in one month.<br><br><b>What is the least he can pay for these swims?</b>", "options": ["5,625 ₸", "7,500 ₸", "10,000 ₸", "10,800 ₸", "11,800 ₸"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Студент, 12 заплывов за месяц.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Разовые: 12 · 900 = 10 800; карта 10 000 + 2 · 900 = 11 800.</li><li>Месячный со скидкой: 7500 · 0,75 = 5625 ₸. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без студенческой скидки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Безлимит при частых визитах.</div></div>"}, {"id": 3, "topic": "MC", "text": "Local newspapers are disappearing, and this is bad for democracy. Without journalists attending council meetings and courts, decisions made by local officials go unreported, and mistakes and wrongdoing are less likely to be discovered. National newspapers cannot fill this gap, because they rarely cover local matters. Social media spreads local news quickly, but most of it is opinion rather than carefully checked reporting. Governments should therefore consider ways of supporting local journalism, such as tax relief for local news organisations.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Local news organisations should receive tax relief.", "National newspapers rarely cover local matters.", "Most local news on social media is opinion rather than checked reporting.", "Governments should consider ways of supporting local journalism.", "The disappearance of local newspapers is bad for democracy."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Исчезновение местных газет вредит демократии → нужна поддержка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный вывод: правительству стоит поддержать местную журналистику. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — промежуточный вывод.</li><li>A — пример.</li><li>B, C — доводы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Итоговая рекомендация.</div></div>"}, {"id": 4, "topic": "PS", "text": "Two candles are the same length. One burns down completely in 4 hours and the other in 6 hours, each at a steady rate. They are lit at the same time.<br><br><b>After how long is one candle exactly twice as long as the other?</b>", "options": ["2 hours", "2 hours 24 minutes", "3 hours", "3 hours 30 minutes", "4 hours"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Остатки: 1 − <span class=\"fr\"><span>t</span><span>4</span></span> и 1 − <span class=\"fr\"><span>t</span><span>6</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 − <span class=\"fr\"><span>t</span><span>6</span></span> = 2 · (1 − <span class=\"fr\"><span>t</span><span>4</span></span>) → <span class=\"fr\"><span>t</span><span>3</span></span> = 1 → t = 3 ч. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — решали «одна вдвое короче» неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Составьте уравнение на длины.</div></div>"}, {"id": 5, "topic": "CON", "text": "In 2015, 40% of the households in a town had a fast internet connection; by 2025 the figure was 85%. Over the same period, the proportion of the town's working population who work from home at least two days a week rose from 5% to 25%.<br><br><b>Which one of the following conclusions is best supported by the information above?</b>", "options": ["The number of households in the town increased between 2015 and 2025.", "Most people with a fast internet connection work from home.", "By 2025, most of the town's workers worked from home.", "The spread of fast internet connections may have made it easier for more people in the town to work from home.", "Fast internet connections cause people to work from home."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Интернет 40% → 85%, удалёнка 5% → 25%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Быстрый интернет, возможно, облегчил работу из дома. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — причинность не доказана.</li><li>B, C — неверно по цифрам.</li><li>A — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «May have» — осторожно.</div></div>"}, {"id": 6, "topic": "PS", "text": "At a school, 45% of the students are boys. 20% of the boys and 30% of the girls belong to a sports club.<br><br><b>What percentage of all the students belong to a sports club?</b>", "options": ["24.5%", "25%", "25.5%", "26.5%", "50%"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,45 · 20% + 0,55 · 30%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9% + 16,5% = 25,5%. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — простое среднее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Взвешенное среднее.</div></div>"}, {"id": 7, "topic": "CON", "text": "The museum opens on Mondays only if it has received new funding. Whenever the museum opens on Mondays, it employs extra staff. This month the museum has not employed any extra staff.<br><br><b>Which one of the following must be true?</b>", "options": ["The museum will receive new funding next month.", "If the museum receives new funding, it will open on Mondays.", "The museum has not received new funding.", "The museum is not opening on Mondays this month.", "The museum cannot afford extra staff."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Открыт по понедельникам → нанимает доп. персонал.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Персонала нет → по понедельникам не открыт. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — финансирование не обязательно ведёт к открытию.</li><li>B — обращение.</li><li>A, E — не следуют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрапозиция.</div></div>"}, {"id": 8, "topic": "PS", "text": "Four internet providers offer these deals:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Provider</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Monthly fee</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Installation</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Minimum contract</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">A</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12 months</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">B</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,500 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Free</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12 months</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">C</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">4,000 ₸ for the first 6 months, then 7,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">12 months</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">D</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">7,000 ₸</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Free</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">None</td></tr></table><br><br><b>Which provider is cheapest over the first 12 months?</b>", "options": ["Provider A", "Provider B", "Provider C", "Provider D", "A and B cost the same"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стоимость за 12 месяцев.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 60 000 + 20 000 = 80 000; B: 78 000.</li><li>C: 24 000 + 42 000 + 10 000 = 76 000; D: 84 000. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — второй по цене.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Учтите установку.</div></div>"}, {"id": 9, "topic": "ASM", "text": "A new motorway would cut the journey time between the two cities from three hours to two. This would encourage more businesses to set up in the region, creating thousands of jobs. The government should therefore build the motorway.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The two cities are the largest in the country.", "Most people in the region own cars.", "The motorway would be finished on time.", "The motorway would not damage the environment.", "Shorter journey times are an important factor for businesses deciding where to set up."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Быстрее дорога → больше бизнеса → рабочие места.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: время в пути важно для выбора места бизнесом. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Звено «дорога → бизнес».</div></div>"}, {"id": 10, "topic": "PS", "text": "A one-hour meeting must be held when three colleagues are all free.<br>• Aru: 09:00–12:00 and 14:00–17:00<br>• Bek: 10:30–13:00 and 15:30–18:00<br>• Dana: 08:00–11:30 and 15:00–16:00<br><br><b>At what time must the meeting start?</b>", "options": ["09:00", "10:30", "11:00", "15:00", "15:30"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общие окна свободы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Утро: 10:30–11:30 (ровно час).</li><li>После обеда: 15:30–16:00 — мало. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — до 12:00 Дана занята с 11:30.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пересекайте интервалы.</div></div>"}, {"id": 11, "topic": "ASM", "text": "Our school canteen has sold far more salads since it began displaying them at the front of the counter. The canteen should therefore also display fruit at the front of the counter, so that students will buy more fruit.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Students like salad more than fruit.", "Fruit is healthier than salad.", "Salads are cheaper than fruit.", "The canteen makes a profit on fruit.", "Displaying food at the front of the counter would affect fruit sales in a similar way to salad sales."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">С салатами сработало → с фруктами сработает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: размещение подействует на фрукты так же. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Аналогия.</div></div>"}, {"id": 12, "topic": "PS", "text": "Five runners take part in a race. Gold, silver and bronze medals are awarded to the first three, and there are no ties.<br><br><b>In how many different ways can the three medals be awarded?</b>", "options": ["10", "60", "120", "125", "243"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Порядок важен: золото, серебро, бронза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 4 · 3 = 60. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без порядка.</li><li>D — с повторами.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Размещения.</div></div>"}, {"id": 13, "topic": "ASM", "text": "The Kazakh language courses run by the city have long waiting lists. The city should therefore offer more courses, since this will allow more adults to learn Kazakh.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["The people on the waiting lists would actually attend the extra courses if they were offered.", "Learning Kazakh is difficult for adults.", "The current teachers are well qualified.", "Most people on the waiting lists are young.", "The courses are free."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Очередь длинная → больше курсов → больше выучат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: люди из очереди действительно придут. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Спрос реальный?</div></div>"}, {"id": 14, "topic": "PS", "text": "A car loses 20% of its value each year. A car worth £10,000 is worth 10,000 × 0.8 × 0.8 = £6,400 after 2 years.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A car loses 20% a year, so after 2 years it has lost 40% of its value: 10,000 × 0.6 = £6,000.", "20% of £10,000 is £2,000.", "A price that rises from £8,000 to £10,000 has increased by 25%.", "A car worth £10,000 loses £2,000 a year, so after 2 years it is worth £6,000.", "A town's population grows by 10% a year. Starting from 5,000, after 2 years it is 5,000 × 1.1 × 1.1 = 6,050."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: умножение на коэффициент каждый год.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: 5000 · 1,1 · 1,1. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложение процентов.</li><li>D — одинаковая сумма.</li><li>B, C — один шаг.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сложные проценты.</div></div>"}, {"id": 15, "topic": "WKN", "text": "Employees who take part in the company's voluntary fitness programme take fewer sick days than other employees. The programme is therefore reducing sickness among the company's staff.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Employees who are often ill are less likely to sign up for a voluntary fitness programme.", "Sick days are recorded accurately by the company.", "Some employees do sport outside work.", "The fitness programme costs the company a lot of money.", "Fitness programmes are popular in many companies."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Участники программы реже болеют → программа помогает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если часто болеющие реже записываются — причина в отборе. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не про причину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Самоотбор.</div></div>"}, {"id": 16, "topic": "PS", "text": "The table shows the number of visitors to a website, in thousands, in the first six months of a year.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Month</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Jan</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Feb</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Mar</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Apr</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">May</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Jun</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Visitors (thousands)</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">120</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">135</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">150</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">140</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">175</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">210</td></tr></table><br><br><b>If the number of visitors keeps growing at the same percentage rate each month as it did from May to June, about how many thousand visitors will there be in August?</b>", "options": ["280", "294", "302", "315", "350"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Май → июнь: 175 → 210 = +20%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Июль 252, август 302,4 ≈ 302 тыс. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — рост на 35 тыс. в месяц.</li><li>B — +20% от 210 дважды неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процентный, а не абсолютный рост.</div></div>"}, {"id": 17, "topic": "STR", "text": "Since the city introduced a 30 km/h speed limit in residential streets, the number of pedestrians injured in those streets has fallen by 25%. The speed limit has made residential streets safer for pedestrians.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["Speed cameras were installed in residential streets at the same time.", "Most drivers dislike the new speed limit.", "Children often play in residential streets.", "The limit was introduced after a campaign by parents.", "Over the same period, the number of people walking in residential streets did not fall, and pedestrian injuries on main roads, where the limit did not change, stayed the same."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Лимит → пострадавших −25%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если пешеходов не стало меньше — риск реально снизился. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — альтернативная причина.</li><li>B, C, D — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Исключите падение числа пешеходов.</div></div>"}, {"id": 18, "topic": "PS", "text": "Three sisters, Aliya, Bota and Saule, are all different ages. Exactly one of these statements is true:<br>1. Aliya is the oldest.<br>2. Bota is not the oldest.<br>3. Saule is not the youngest.<br><br><b>Who is the oldest?</b>", "options": ["Aliya", "Bota", "Saule", "Aliya or Saule", "It cannot be determined"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Ровно одно утверждение истинно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если Алия старшая — верны 1 и 2 → нельзя.</li><li>Если старшая Сауле — верны 2 и 3 → нельзя.</li><li>Старшая Бота: 1, 2 ложны, 3 верно (Сауле средняя). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — определяется однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебор вариантов.</div></div>"}, {"id": 19, "topic": "WKN", "text": "A study of 1,000 marathon runners found that those who wore a particular brand of running shoe finished faster on average. The brand claims that its shoes make runners faster.<br><br><b>Which one of the following, if true, would most weaken the brand's claim?</b>", "options": ["A marathon is just over 42 km long.", "Many runners also wear the shoes for training.", "The brand's shoes are very expensive and are mostly bought by experienced, serious runners.", "The brand's shoes are lighter than most others.", "The study was carried out by independent researchers."], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В этих кроссовках бегут быстрее → кроссовки ускоряют.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если их покупают в основном опытные бегуны — дело в бегунах. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — скорее усиливает.</li><li>A, B, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Самоотбор.</div></div>"}, {"id": 20, "topic": "PS", "text": "A recipe needs 2.5 cups of milk, where 1 cup = 240 ml. Milk is sold in 1-litre cartons. Aigul is making the recipe 3 times.<br><br><b>How many cartons of milk must she buy?</b>", "options": ["1", "2", "3", "4", "8"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3 · 2,5 = 7,5 стакана · 240 мл = 1800 мл.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 пакета по 1 л. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без умножения на 3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пакеты — вверх.</div></div>"}, {"id": 21, "topic": "FLAW", "text": "The new phone has many more features than the old model, so everyone should upgrade to it.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It does not say how many new features there are.", "It assumes that everyone owns a phone.", "It ignores phones made by other companies.", "It assumes that having more features makes the phone better for everyone, when many people may not need them.", "It assumes that the new phone is expensive."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше функций → всем обновиться.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Больше функций не обязательно лучше для каждого. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Лучше для всех?</div></div>"}, {"id": 22, "topic": "PS", "text": "On a map with a scale of 1 : 50,000, a walking route measures 13 cm. Gulmira walks at a steady 5 km/h.<br><br><b>How long will the walk take?</b>", "options": ["1 hour 3 minutes", "1 hour 18 minutes", "1 hour 30 minutes", "2 hours 10 minutes", "13 hours"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">13 см · 50 000 = 650 000 см = 6,5 км.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6,5 : 5 = 1,3 ч = 1 ч 18 мин. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 1,3 ч как 1 ч 3 мин.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 0,3 ч = 18 мин.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "The average income in Town A is higher than the average income in Town B. So Ermek, who lives in Town A, must earn more than Saule, who lives in Town B.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that Ermek has a job.", "It assumes that the two towns have the same population.", "It ignores differences in the cost of living between the towns.", "It assumes that what is true on average of a town's population must be true of every person in it.", "It does not say how much higher the average income in Town A is."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Средний доход города → доход конкретного жителя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Свойство среднего перенесено на каждого. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее ≠ каждый.</div></div>"}, {"id": 24, "topic": "PS", "text": "In a knockout tournament with 32 players, every match knocks out exactly one player, so 32 − 1 = 31 matches are needed to find the winner.<br><br><b>Which one of the following uses the same method of reasoning as the example above?</b>", "options": ["A bar of chocolate with 24 squares is broken into single squares, one break at a time; each break increases the number of pieces by one, so 24 − 1 = 23 breaks are needed.", "In a league of 32 teams where every team plays every other once, there are 32 × 31 ÷ 2 = 496 matches.", "A bar of chocolate has 4 rows of 6 squares, so it has 4 × 6 = 24 squares.", "32 players can be put into 32 ÷ 2 = 16 pairs.", "A rope 24 m long cut into 1 m pieces gives 24 ÷ 1 = 24 pieces."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый шаг убирает ровно один «кусок» → шагов на 1 меньше.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 24 квадратика → 23 разлома. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — круговой турнир.</li><li>C, D, E — умножение/деление.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Инвариант «минус один».</div></div>"}, {"id": 25, "topic": "FLAW", "text": "Every time I have worn my lucky shirt to a match this season, our team has won. I wore it to the last five matches, and we won all of them. So my shirt helps the team to win.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that because two things have happened together, one must have caused the other.", "It assumes that the team will keep winning.", "It assumes that the shirt has been washed.", "It does not say which sport the team plays.", "It ignores the shirts worn by the other team's supporters."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Рубашка и победы совпадали → рубашка помогает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Совпадение принято за причину. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Корреляция ≠ причина.</div></div>"}, {"id": 26, "topic": "PS", "text": "300 ml of a drink containing 20% juice is mixed with 200 ml of a drink containing 45% juice.<br><br><b>What percentage of the mixture is juice?</b>", "options": ["25%", "30%", "32.5%", "35%", "65%"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сок: 300 · 0,2 + 200 · 0,45 = 60 + 90 = 150 мл.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>150 : 500 = 30%. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — простое среднее.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Через объёмы.</div></div>"}, {"id": 27, "topic": "FLAW", "text": "If a student studies every day, she will pass the exam. Asel does not study every day. So she will not pass the exam.<br><br><b>Which one of the following contains the same flaw as the above argument?</b>", "options": ["All plants that are watered every day grow. This plant has grown. So it is watered every day.", "If a plant grows, it has been watered. This plant has grown. So it has been watered.", "If a plant is watered every day, it will grow. This plant has not grown. So it is not watered every day.", "If a plant is watered every day, it will grow. This plant is watered every day. So it will grow.", "If a plant is watered every day, it will grow. This plant is not watered every day. So it will not grow."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если A → B; не A → не B (отрицание условия).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>E: полив → рост; не поливают → не вырастет. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — верные выводы.</li><li>A, B — обращение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте буквы.</div></div>"}, {"id": 28, "topic": "PS", "text": "A courier charges by parcel size. A parcel must be within both the weight limit and the size limit for its category.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Category</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Maximum weight</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Maximum size</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Price</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Small</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">2 kg</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">45 × 35 × 16 cm</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">1,500 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Medium</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">10 kg</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">61 × 46 × 46 cm</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">3,500 ₸</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Large</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">20 kg</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">100 × 60 × 60 cm</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">6,000 ₸</td></tr></table>Ainur's box measures 50 × 40 × 20 cm and weighs 1.8 kg.<br><br><b>How much will it cost to send?</b>", "options": ["1,500 ₸", "3,500 ₸", "5,000 ₸", "6,000 ₸", "7,500 ₸"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коробка 50 × 40 × 20 не влезает в Small (45 см максимум).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Medium 61 × 46 × 46 и ≤ 10 кг — подходит: 3500 ₸. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — по весу да, по размеру нет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Оба условия сразу.</div></div>"}, {"id": 29, "topic": "PRIN", "text": "Companies that make a profit from selling products should pay the cost of recycling those products when they are thrown away.<br><br><b>Which one of the following best illustrates this principle?</b>", "options": ["A company that sells drinks in plastic bottles should pay for the bottles to be collected and recycled.", "Plastic bottles should be banned.", "People who buy drinks in plastic bottles should take the bottles to be recycled themselves.", "The government should build more recycling plants.", "Companies should use recycled materials in their products."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Кто зарабатывает на товаре — платит за его переработку.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: продавец напитков платит за переработку бутылок. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — платит покупатель.</li><li>B, D, E — другие принципы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Кто получает прибыль.</div></div>"}, {"id": 30, "topic": "PS", "text": "The hour hand and the minute hand of a clock are together at exactly 12 noon.<br><br><b>Counting 12 noon but not 12 midnight, how many times are the two hands exactly together between 12 noon and 12 midnight?</b>", "options": ["6", "10", "11", "12", "24"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Стрелки совпадают 11 раз за 12 часов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Включая полдень и не включая полночь — 11. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — каждый час (на самом деле реже).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Совпадение каждые <span class=\"fr\"><span>12</span><span>11</span></span> ч.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
