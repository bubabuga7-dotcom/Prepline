<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;

  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "M5.19", "text": "<p>\\(\\mathbf{a} = \\) \\(\\begin{pmatrix}-3\\\\1\\end{pmatrix}\\) and \\(\\mathbf{b} = \\) \\(\\begin{pmatrix}-1\\\\-2\\end{pmatrix}\\).</p><p>Find \\(2\\mathbf{a} - 2\\mathbf{b}\\).</p>", "image": "", "options": ["\\(\\begin{pmatrix}6\\\\-4\\end{pmatrix}\\)", "\\(\\begin{pmatrix}-8\\\\-2\\end{pmatrix}\\)", "\\(\\begin{pmatrix}-4\\\\6\\end{pmatrix}\\)", "\\(\\begin{pmatrix}-5\\\\4\\end{pmatrix}\\)", "\\(\\begin{pmatrix}4\\\\-6\\end{pmatrix}\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">a − b = (−3 + 1; 1 + 2) = (−2; 3).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(a − b) = (−4; 6). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте покоординатно.</div></div>", "src": "PL"}, {"id": 2, "topic": "M5.13", "text": "<p>The bearing of B from A is 110°.</p><p>What is the bearing of A from B?</p>", "image": "", "options": ["070°", "200°", "250°", "290°", "300°"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратный азимут: +180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>110 + 180 = 290°. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 180 − 110.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ±180°.</div></div>", "src": "PL"}, {"id": 3, "topic": "M5.6", "text": "<p>The point (4, -2) is reflected in the line \\(y = x\\).</p><p>What are the coordinates of its image?</p>", "image": "", "options": ["(-2, 4)", "(-4, -2)", "(-4, 2)", "(2, -4)", "(4, 2)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отражение в y = x: (x, y) → (y, x).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(−2; 4). Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — отражение в начале.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Поменяйте местами.</div></div>", "src": "PL"}, {"id": 4, "topic": "M3.10", "text": "<p>Two mathematically similar bottles have heights in the ratio 2 : 3. The smaller bottle holds 640 ml.</p><p>How much does the larger bottle hold?</p>", "image": "", "options": ["960 ml", "1440 ml", "2160 ml", "2800 ml", "4320 ml"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём × <span class=\"fr\"><span>3</span><span>2</span></span>³ = <span class=\"fr\"><span>27</span><span>8</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>640 · <span class=\"fr\"><span>27</span><span>8</span></span> = 2160 мл. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — линейно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Объём ∝ k³.</div></div>", "src": "PL"}, {"id": 5, "topic": "M2.6", "text": "<p>Between which two consecutive whole numbers does \\(\\sqrt{75}\\) lie?</p>", "image": "", "options": ["6 and 7", "7 and 8", "8 and 9", "9 and 10", "10 and 11"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">64 < 75 < 81.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 и 9. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 49 и 64.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ближайшие квадраты.</div></div>", "src": "PL"}, {"id": 6, "topic": "M3.4", "text": "<p>Three numbers are in the ratio 1 : 2 : 4. The largest is 75 more than the smallest.</p><p>What is their total?</p>", "image": "", "options": ["50", "150", "175", "200", "525"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">4 − 1 = 3 части = 75 → часть 25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма 7 · 25 = 175. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — 6 частей.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 + 2 + 4 = 7.</div></div>", "src": "PL"}, {"id": 7, "topic": "M2.1", "text": "<p>How many integers \\(n\\) satisfy \\(-10 \\lt n \\le -6\\)?</p>", "image": "", "options": ["3", "4", "5", "6", "16"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">n = −9, −8, −7, −6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — включили −10.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Строгое неравенство.</div></div>", "src": "PL"}, {"id": 8, "topic": "M3.11", "text": "<p>A population of 1,000 bacteria grows by 50% every hour.</p><p>After how many whole hours does it first exceed 2,000?</p>", "image": "", "options": ["1", "2", "3", "4", "5"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1000 → 1500 → 2250.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Через 2 часа. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — простые проценты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый час × 1,5.</div></div>", "src": "PL"}, {"id": 9, "topic": "M1.2", "text": "<p>A metal has density 1.2 g/cm³. What is the mass, in kg, of a 250 cm³ block?</p>", "image": "", "options": ["0.03 kg", "0.208 kg", "0.3 kg", "3 kg", "300 kg"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m = ρV = 1,2 · 250 = 300 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,3 кг. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — делили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Масса = плотность × объём.</div></div>", "src": "PL"}, {"id": 10, "topic": "M4.2", "text": "<p>Simplify \\(\\dfrac{(3x^{4})^{3}}{x^{3}}\\).</p>", "image": "", "options": ["\\(27x^{15}\\)", "\\(3x^{9}\\)", "\\(27x^{4}\\)", "\\(27x^{9}\\)", "\\(9x^{9}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(3x⁴)³ = 27x¹².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>27x¹² / x³ = 27x⁹. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 3² вместо 3³.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Степень на каждый множитель.</div></div>", "src": "PL"}, {"id": 11, "topic": "M2.10", "text": "<p>A price changes from $40 to $52.</p><p>What is the percentage change?</p>", "image": "", "options": ["+30%", "+23.1%", "+35%", "+12%", "−30%"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>52 − 40</span><span>40</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>+30%. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — делили на 52.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делим на старое.</div></div>", "src": "PL"}, {"id": 12, "topic": "M4.13", "text": "<p>A speed–time graph shows a cyclist speeding up steadily from rest to 10 m/s in 5 s, staying at 10 m/s for 20 s, then slowing steadily to rest in 4 s.</p><p>How far does the cyclist travel?</p>", "image": "", "options": ["122.5 m", "200 m", "245 m", "270 m", "290 m"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь под графиком.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 5 · 10 + 20 · 10 + ½ · 4 · 10 = 25 + 200 + 20 = 245 м. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — без ½.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Треугольники + прямоугольник.</div></div>", "src": "PL"}, {"id": 13, "topic": "M2.9", "text": "<p>Write \\(\\dfrac{3}{8}\\) as a percentage.</p>", "image": "", "options": ["3.75%", "35%", "37.5%", "42.5%", "375%"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>3</span><span>8</span></span> = 0,375.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>37,5%. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ÷10.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> × 100%.</div></div>", "src": "PL"}, {"id": 14, "topic": "M4.5", "text": "<p>Factorise \\(x^2 + 10x + 24\\).</p>", "image": "", "options": ["\\((x - 4)(x + 6)\\)", "\\((x + 4)(x - 6)\\)", "\\((x + 4)(x + 6)\\)", "\\((x - 4)(x - 6)\\)", "\\((x + 5)(x + 5)\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Произведение 24, сумма 10: 4 и 6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x + 4)(x + 6). Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — 25.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Виета.</div></div>", "src": "PL"}, {"id": 15, "topic": "M3.5", "text": "<p>Rice costs ₸600 for a 500 g pack or ₸1512 for a 1200 g pack.</p><p>Which is better value, and why?</p>", "image": "", "options": ["The 1200 g pack, because it is heavier", "They are the same value", "The 1200 g pack, because it costs less per gram", "The 500 g pack, because it costs less in total", ity 7.8 g/cm³. What is the mass, in kg, of a 1,500 cm³ block?</p>", "image": "", "options": ["0.192 kg", "1.17 kg", "11.7 kg", "117 kg", "11700 kg"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">7,8 · 1500 = 11 700 г.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>11,7 кг. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ÷10.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 кг = 1000 г.</div></div>", "src": "PL"}, {"id": 25, "topic": "M4.2", "text": "<p>Simplify \\((x^{1/2})^{3} \\times x^{-1}\\).</p>", "image": "", "options": ["\\(x^{1/2}\\)", "\\(x^{-3/2}\\)", "\\(x^{3}\\)", "\\(x^{0}\\)", "\\(x^{5/2}\\)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x^{<span class=\"fr\"><span>3</span><span>2</span></span>} · x⁻¹.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x^{<span class=\"fr\"><span>1</span><span>2</span></span>}. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сложили <span class=\"fr\"><span>3</span><span>2</span></span> + 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Складывайте показатели.</div></div>", "src": "PL"}, {"id": 26, "topic": "M2.10", "text": "<p>After a 25% increase a coat costs ₸18,750.</p><p>What did it cost before the increase?</p>", "image": "", "options": ["₸12,500", "₸14,062", "₸15,000", "₸15,200", "₸18,500"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">18 750 : 1,25.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>15 000. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вычли 25% от новой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на множитель.</div></div>", "src": "PL"}, {"id": 27, "topic": "M4.13", "text": "<p>On a speed–time graph a straight line joins (0, 2) to (3, 11), with time in seconds and speed in m/s.</p><p>What is the acceleration?</p>", "image": "", "options": ["3 m/s²", "6 m/s²", "\\(\\dfrac{1}{3}\\) m/s²", "\\(\\dfrac{11}{3}\\) m/s²", "\\(\\dfrac{13}{2}\\) m/s²"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>11 − 2</span><span>3</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 м/с². Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — без начальной скорости.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Δv/Δt.</div></div>", "src": "PL"}, {"id": 28, "topic": "M2.9", "text": "<p>Which fraction equals \\(0.\\overline{36}\\)?</p>", "image": "", "options": ["\\(\\dfrac{8}{11}\\)", "\\(\\dfrac{1}{3}\\)", "\\(\\dfrac{4}{11}\\)", "\\(\\dfrac{9}{25}\\)", "\\(\\dfrac{5}{11}\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,(36) = <span class=\"fr\"><span>36</span><span>99</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>4</span><span>11</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — 0,36.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период → 99.</div></div>", "src": "PL"}, {"id": 29, "topic": "M4.5", "text": "<p>Factorise \\(x^2 - 8x + 12\\).</p>", "image": "", "options": ["\\((x - 1)(x - 7)\\)", "\\((x + 2)(x + 6)\\)", "\\((x - 2)(x + 6)\\)", "\\((x + 2)(x - 6)\\)", "\\((x - 2)(x - 6)\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Произведение 12, сумма −8: −2 и −6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 2)(x − 6). Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Виета.</div></div>", "src": "PL"}, {"id": 30, "topic": "M3.5", "text": "<p>Rice costs ₸750 for a 300 g pack or ₸2375 for a 1000 g pack.</p><p>Which is better value, and why?</p>", "image": "", "options": ["The 300 g pack, because it costs less in total", "The 1000 g pack, because it is heavier", "The 1000 g pack, because it costs less per gram", "They are the same value", "The 300 g pack, because it costs less per gram"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">За грамм: <span class=\"fr\"><span>750</span><span>300</span></span> = 2,5; <span class=\"fr\"><span>2375</span><span>1000</span></span> = 2,375.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Большая выгоднее. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — вес не причина.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Цена единицы.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
