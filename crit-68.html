<script>
const questions = [{"id": 1, "text": "Public libraries should stay open in the evenings. Many people who work during the day have no other time to borrow books or to use a computer free of charge. Students preparing for examinations often have no quiet place to study at home. Although longer opening hours would increase staffing costs, these costs are small compared with the overall library budget, and the benefit to the community would be considerable.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Public libraries should stay open in the evenings.", "The cost of evening opening would be small compared with the library budget.", "Many working people can only visit a library in the evening.", "Students need a quiet place in which to study.", "Libraries benefit the community more than any other public service."], "correct": 0, "explain": "The first sentence is what the passage wants us to accept; every other sentence is a reason for it. C and D are reasons, B answers an objection (cost), and E is never stated."}, {"id": 2, "text": "A sports centre offers the memberships below. Off-peak means before 4 pm on weekdays.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Membership</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Monthly fee</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">When you can use the gym</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Fitness classes</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Basic</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£20</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Off-peak only</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Not available</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Standard</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£32</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any time</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£4 per class</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Premium</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£45</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any time</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Included</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Student</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£25</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any time</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£4 per class (students only)</td></tr></table>Daniyar is not a student. He works until 5 pm on weekdays and wants to attend 12 fitness classes a month.<br><br><b>What is the least he can pay per month?</b>", "options": ["£20", "£32", "£45", "£73", "£80"], "correct": 2, "explain": "Basic is off-peak only and has no classes; Student is not available to him. Standard costs £32 + 12 × £4 = £80. Premium costs £45 with classes included, so £45 is the least. £73 is the Student price, which he cannot use."}, {"id": 3, "text": "Cities that build more roads usually find that congestion returns within a few years, because new roads encourage people to make car journeys they would not otherwise have made. So building new roads is not an effective long-term answer to congestion. Our city council should therefore spend its transport budget on better buses and trams rather than on the planned ring road. Better public transport gives people a real alternative to driving.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Better public transport gives people a real alternative to driving.", "Traffic congestion can never be solved in the long term.", "New roads encourage people to make extra car journeys.", "Building new roads is not an effective long-term answer to congestion.", "The council should spend its transport budget on public transport rather than on the ring road."], "correct": 4, "explain": "'So building new roads is not effective' is an intermediate conclusion: it is itself a reason for the final recommendation introduced by 'therefore'. The main conclusion is the recommendation about the budget. C and A are reasons; B goes far beyond the passage."}, {"id": 4, "text": "Aidana lives a 10-minute walk from Ashton station. Her office is a 15-minute walk from Bayford station, and she must be at the office by 9:00. The morning trains from Ashton to Bayford are shown below.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Departs Ashton</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">07:15</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">07:40</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">08:05</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">08:30</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Arrives Bayford</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">08:05</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">08:20</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">08:55</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:10</td></tr></table><br><br><b>What is the latest time she can leave home?</b>", "options": ["07:05", "07:30", "07:45", "07:55", "08:20"], "correct": 1, "explain": "She must reach Bayford by 8:45. The 08:05 train arrives at 8:55, too late, so she needs the 07:40 train (arrives 8:20). Leaving home 10 minutes earlier gives 07:30. 07:55 would be right only if the 08:05 train were early enough."}, {"id": 5, "text": "Some parents argue that young children should not be allowed smartphones because the devices distract them from schoolwork. But a smartphone can also be used to look up information, to practise a foreign language and to stay in touch with parents. Banning the devices altogether would deprive children of these benefits. Rather than banning smartphones, parents should agree clear rules with their children about when the phones may be used.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Smartphones can be useful for children's learning.", "Children should use smartphones only to keep in touch with their parents.", "Banning smartphones would deprive children of their benefits.", "Smartphones distract young children from schoolwork.", "Instead of banning smartphones, parents should set clear rules about their use."], "correct": 4, "explain": "The final sentence is the recommendation the whole passage supports. C is an intermediate conclusion (it supports E), A is a reason, D is the opposing view being answered, and B is not said."}, {"id": 6, "text": "A rectangular garden is 12 m long and 8 m wide. It is to be fenced on all sides except for a gateway 1.5 m wide. Fencing is sold only in whole panels 2 m long, costing £18 each.<br><br><b>What is the total cost of the fencing panels needed?</b>", "options": ["£342.00", "£346.50", "£360.00", "£378.00", "£720.00"], "correct": 2, "explain": "Perimeter = 2 × (12 + 8) = 40 m; without the gateway, 38.5 m. 38.5 ÷ 2 = 19.25, so 20 whole panels are needed: 20 × £18 = £360. £346.50 forgets to round up; £342 rounds down."}, {"id": 7, "text": "Over the past ten years the number of people visiting the town museum has fallen every year, even though the museum stopped charging for entry five years ago. During the same period the museum has not changed its permanent exhibitions, whereas museums in neighbouring towns that regularly put on new exhibitions have seen their visitor numbers rise.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Museums with free entry attract fewer visitors than museums that charge.", "Entry charges have no effect on the number of people who visit museums.", "People who used to visit the town museum now visit museums in neighbouring towns.", "The cost of entry is unlikely to be the main reason for the fall in visitors to the town museum.", "The town museum will have to close unless it puts on new exhibitions."], "correct": 3, "explain": "Visitor numbers kept falling after entry became free, so price is unlikely to be the main cause. B and A generalise far beyond one museum; E predicts closure, which is not supported; C is possible but the passage gives no evidence about where the visitors went."}, {"id": 8, "text": "A taxi charges £3.00 at the start of every journey, plus £1.20 for each complete kilometre travelled. Waiting time is charged at £0.25 per minute. Assel's journey was 9.5 km long and included 6 minutes of waiting in traffic.<br><br><b>How much was her fare?</b>", "options": ["£12.30", "£13.80", "£15.30", "£15.90", "£16.50"], "correct": 2, "explain": "Only complete kilometres are charged: 9 × £1.20 = £10.80. Waiting: 6 × £0.25 = £1.50. Total £3.00 + £10.80 + £1.50 = £15.30. £15.90 charges 9.5 km; £13.80 leaves out the waiting; £12.30 leaves out the starting charge."}, {"id": 9, "text": "All the trains that stop at Elmford also stop at Greyhill. Some of the trains that stop at Greyhill continue to the coast. No train that continues to the coast runs after 10 pm.<br><br><b>Which one of the following conclusions can be drawn from the above information?</b>", "options": ["Every train that stops at Greyhill also stops at Elmford.", "Some of the trains that stop at Elmford continue to the coast.", "No train that stops at Elmford runs after 10 pm.", "Trains that run after 10 pm do not stop at Greyhill.", "A train that stops at Elmford and continues to the coast does not run after 10 pm."], "correct": 4, "explain": "Any train that continues to the coast does not run after 10 pm, whatever else it does, so E must be true. C and B could be false: an Elmford train might not go to the coast. A reverses the first statement. D could be false: a late train could stop at Greyhill without going to the coast."}, {"id": 10, "text": "A conference runs every day from Wednesday 28 February to Tuesday 6 March inclusive, in a year that is not a leap year. No sessions are held on Saturdays or Sundays.<br><br><b>On how many days are sessions held?</b>", "options": ["4", "5", "6", "7", "8"], "correct": 1, "explain": "The dates are 28 Feb (Wed), 1 Mar (Thu), 2 (Fri), 3 (Sat), 4 (Sun), 5 (Mon), 6 (Tue): 7 days. Without Saturday and Sunday, sessions are held on 5 days. 7 forgets the weekend; 8 treats the year as a leap year."}, {"id": 11, "text": "Our school canteen should stop selling sugary drinks. Last year the canteen at Westgate School stopped selling them, and the amount of sugar its pupils consumed during the school day fell sharply. Our pupils would therefore also consume much less sugar during the school day if we did the same.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Westgate School has more pupils than our school.", "Our pupils would not simply bring sugary drinks from home or buy them elsewhere instead.", "Pupils at Westgate School now drink more water than before.", "The canteen makes most of its profit from selling sugary drinks.", "Sugary drinks are the main cause of tooth decay among school pupils."], "correct": 1, "explain": "The conclusion needs our pupils to react as Westgate's did. If they replaced canteen drinks with drinks from elsewhere, their sugar intake would not fall, so B must be assumed. E, A, D and C are not needed for the conclusion to follow."}, {"id": 12, "text": "Two machines fill bottles at a constant rate. Machine P fills 120 bottles in 4 minutes. Machine Q fills 90 bottles in 2 minutes.<br><br><b>Working together, how long will the two machines take to fill 1,500 bottles?</b>", "options": ["15 minutes", "18 minutes", "20 minutes", "25 minutes", "35 minutes"], "correct": 2, "explain": "P fills 30 bottles a minute and Q fills 45, so together 75 a minute. 1,500 ÷ 75 = 20 minutes."}, {"id": 13, "text": "Mira's train is due to arrive at the central station at 9:40. Her interview starts at 10:00 in an office that is a ten-minute walk from the station. So Mira will be on time for her interview.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Interviewers prefer candidates who arrive early.", "Mira has walked from the station to the office before.", "The interview will last less than an hour.", "Mira will take a taxi from the station.", "The train will not arrive late."], "correct": 4, "explain": "The reasoning only works if the train actually arrives at 9:40 (or not much later). That is taken for granted but not stated. The other options are not needed: D would even contradict the plan to walk."}, {"id": 14, "text": "A shop reduced the price of a coat by 20%. A week later it reduced the new price by a further 25%. The coat now costs £54.<br><br><b>What was the original price of the coat?</b>", "options": ["£78.30", "£81.00", "£90.00", "£98.18", "£108.00"], "correct": 2, "explain": "After both reductions the price is 0.8 × 0.75 = 0.6 of the original, so the original was £54 ÷ 0.6 = £90. £98.18 treats the reductions as 45% off in total; £81 adds 25% and then 20% back on to £54."}, {"id": 15, "text": "Electric scooters should be banned from pavements. Pedestrians, especially elderly people and young children, can be seriously injured when they are hit by a scooter travelling at speed.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Elderly people walk on pavements more often than other people do.", "Most people who ride electric scooters are young.", "Riding an electric scooter on the road is completely safe.", "A ban would reduce the number of pedestrians hit by scooters on pavements.", "Electric scooters are more dangerous than bicycles."], "correct": 3, "explain": "The argument recommends a ban because of injuries to pedestrians; this only makes sense if the ban would actually reduce those collisions. Comparisons with bicycles (E), the age of riders (B) and road safety (C) are not needed."}, {"id": 16, "text": "The code for a locker has three different digits, each chosen from 1, 2, 3, 4 and 5. The digits must increase from left to right, and the first digit must be odd.<br><br><b>How many different codes are possible?</b>", "options": ["6", "7", "10", "12", "60"], "correct": 1, "explain": "First digit 1: choose two of 2, 3, 4, 5 in increasing order = 6 codes. First digit 3: only 3-4-5 = 1 code. First digit 5: no larger digits remain. Total 7. 10 ignores the odd-first rule."}, {"id": 17, "text": "A survey of 2,000 adults found that people who regularly eat breakfast are less likely to be overweight than people who skip it. Eating breakfast must therefore help people to control their weight.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["A similar survey in another country produced the same result.", "People who eat breakfast say that they feel more energetic in the morning.", "Many breakfast cereals contain a lot of sugar.", "Many people who skip breakfast do so because they are already trying to lose weight.", "The survey included equal numbers of men and women."], "correct": 3, "explain": "If overweight people tend to skip breakfast in order to diet, the link could run the other way: being overweight leads to skipping breakfast, rather than breakfast keeping weight down. A strengthens the argument; C, E and B do not affect the causal claim."}, {"id": 18, "text": "Five friends – Arman, Bota, Daulet, Erlan and Samal – sit in a row of five seats numbered 1 to 5 from left to right.<br>• Daulet sits in seat 3.<br>• Erlan sits next to Daulet.<br>• Samal sits immediately to the left of Bota.<br>• Arman sits at one end of the row.<br>• Samal sits to the left of Daulet.<br><br><b>Who sits in seat 4?</b>", "options": ["Arman", "Bota", "Daulet", "Erlan", "Samal"], "correct": 3, "explain": "Samal is left of Daulet (seat 3) with Bota immediately to her right, so Samal and Bota take seats 1 and 2. Erlan must be next to Daulet, so he takes seat 4, and Arman takes the end seat 5."}, {"id": 19, "text": "In the year after new cycle lanes were built across the city, the number of people cycling to work rose by 40%. This shows that providing cycle lanes encourages people to cycle.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["In the same year, the number of people cycling to work in nearby cities without new cycle lanes did not change.", "Many cyclists prefer to ride on quiet residential let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
        ${q.explain ? `<details style="margin-top:8px;font-size:14px;line-height:1.55"><summary style="cursor:pointer;color:var(--gold,#C9A227);font-weight:600">Why ${'ABCDE'[q.correct]}?</summary><div style="margin-top:6px;opacity:.9">${q.explain}</div></details>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

<style id="prepline-gate-css">
  #pl-gate{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;
           background:rgba(6,10,20,.78);backdrop-filter:blur(4px);padding:20px}
  #pl-gate.on{display:flex}
  #pl-gate .box{max-width:420px;width:100%;background:#111A2E;border:1px solid rgba(255,255,255,.14);
                border-radius:10px;padding:26px 28px;font-family:Inter,system-ui,sans-serif;color:#E6ECF7}
  #pl-gate h3{font-family:Sora,Inter,sans-serif;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
  #pl-gate p{font-size:14px;line-height:1.55;color:#B4C0D6;margin:0 0 18px}
  #pl-gate .row{display:flex;gap:10px;flex-wrap:wrap}
  #pl-gate button{font:600 14px Inter,sans-serif;padding:11px 22px;border-radius:5px;cursor:pointer;border:0}
  #pl-gate .go{background:#C9A227;color:#10192C}
  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E6ECF7}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
