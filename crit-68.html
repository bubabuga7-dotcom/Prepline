<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "topic": "MC", "text": "Public libraries should stay open in the evenings. Many people who work during the day have no other time to borrow books or to use a computer free of charge. Students preparing for examinations often have no quiet place to study at home. Although longer opening hours would increase staffing costs, these costs are small compared with the overall library budget, and the benefit to the community would be considerable.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Public libraries should stay open in the evenings.", "The cost of evening opening would be small compared with the library budget.", "Many working people can only visit a library in the evening.", "Students need a quiet place in which to study.", "Libraries benefit the community more than any other public service."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Тезис — в первом предложении, дальше доводы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Библиотеки должны работать по вечерам. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — доводы.</li><li>E — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что доказывают остальные фразы.</div></div>"}, {"id": 2, "topic": "PS", "text": "A sports centre offers the memberships below. Off-peak means before 4 pm on weekdays.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Membership</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Monthly fee</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">When you can use the gym</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Fitness classes</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Basic</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£20</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Off-peak only</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Not available</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Standard</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£32</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any time</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£4 per class</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Premium</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£45</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any time</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Included</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Student</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£25</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Any time</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£4 per class (students only)</td></tr></table>Daniyar is not a student. He works until 5 pm on weekdays and wants to attend 12 fitness classes a month.<br><br><b>What is the least he can pay per month?</b>", "options": ["£20", "£32", "£45", "£73", "£80"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Данияр работает до 17:00 → «Basic» (до 16:00, без занятий) не подходит.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Standard: 32 + 12 · 4 = 80 £; Premium: 45 £ с занятиями.</li><li>Минимум 45 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без занятий и вне его времени.</li><li>E — Standard дороже.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала отбросьте неподходящие тарифы.</div></div>"}, {"id": 3, "topic": "MC", "text": "Cities that build more roads usually find that congestion returns within a few years, because new roads encourage people to make car journeys they would not otherwise have made. So building new roads is not an effective long-term answer to congestion. Our city council should therefore spend its transport budget on better buses and trams rather than on the planned ring road. Better public transport gives people a real alternative to driving.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Better public transport gives people a real alternative to driving.", "Traffic congestion can never be solved in the long term.", "New roads encourage people to make extra car journeys.", "Building new roads is not an effective long-term answer to congestion.", "The council should spend its transport budget on public transport rather than on the ring road."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Дороги не решают пробки» — промежуточный вывод.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Главный: совет должен тратить бюджет на общественный транспорт, а не на кольцевую. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — промежуточный вывод.</li><li>A, C — доводы.</li><li>B — слишком сильно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Therefore» после промежуточного вывода.</div></div>"}, {"id": 4, "topic": "PS", "text": "Aidana lives a 10-minute walk from Ashton station. Her office is a 15-minute walk from Bayford station, and she must be at the office by 9:00. The morning trains from Ashton to Bayford are shown below.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Departs Ashton</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">07:15</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">07:40</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">08:05</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">08:30</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Arrives Bayford</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">08:05</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">08:20</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">08:55</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">09:10</td></tr></table><br><br><b>What is the latest time she can leave home?</b>", "options": ["07:05", "07:30", "07:45", "07:55", "08:20"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В офисе к 9:00 → в Бэйфорде не позже 8:45.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подходит поезд 7:40 (прибывает 8:20).</li><li>Выйти из дома за 10 мин: 7:30. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — поезд 8:05 приходит в 8:55, поздно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Считайте от конца.</div></div>"}, {"id": 5, "topic": "MC", "text": "Some parents argue that young children should not be allowed smartphones because the devices distract them from schoolwork. But a smartphone can also be used to look up information, to practise a foreign language and to stay in touch with parents. Banning the devices altogether would deprive children of these benefits. Rather than banning smartphones, parents should agree clear rules with their children about when the phones may be used.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Smartphones can be useful for children's learning.", "Children should use smartphones only to keep in touch with their parents.", "Banning smartphones would deprive children of their benefits.", "Smartphones distract young children from schoolwork.", "Instead of banning smartphones, parents should set clear rules about their use."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не запрещать, а договориться о правилах.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — доводы.</li><li>D — позиция оппонентов.</li><li>B — не сказано.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Rather than…, should…» — вывод.</div></div>"}, {"id": 6, "topic": "PS", "text": "A rectangular garden is 12 m long and 8 m wide. It is to be fenced on all sides except for a gateway 1.5 m wide. Fencing is sold only in whole panels 2 m long, costing £18 each.<br><br><b>What is the total cost of the fencing panels needed?</b>", "options": ["£342.00", "£346.50", "£360.00", "£378.00", "£720.00"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Периметр 2 · (12 + 8) = 40 м − ворота 1,5 = 38,5 м.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>38,5 : 2 = 19,25 → 20 панелей.</li><li>20 · 18 = 360 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — дробные панели.</li><li>A — 19 панелей не хватит.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Панели — только целые, вверх.</div></div>"}, {"id": 7, "topic": "CON", "text": "Over the past ten years the number of people visiting the town museum has fallen every year, even though the museum stopped charging for entry five years ago. During the same period the museum has not changed its permanent exhibitions, whereas museums in neighbouring towns that regularly put on new exhibitions have seen their visitor numbers rise.<br><br><b>Which one of the following conclusions is best supported by the passage above?</b>", "options": ["Museums with free entry attract fewer visitors than museums that charge.", "Entry charges have no effect on the number of people who visit museums.", "People who used to visit the town museum now visit museums in neighbouring towns.", "The cost of entry is unlikely to be the main reason for the fall in visitors to the town museum.", "The town museum will have to close unless it puts on new exhibitions."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вход стал бесплатным, а посетителей меньше; соседи с новыми выставками растут.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цена входа вряд ли главная причина спада. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, E — слишком сильно.</li><li>C — не известно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Осторожный вывод.</div></div>"}, {"id": 8, "topic": "PS", "text": "A taxi charges £3.00 at the start of every journey, plus £1.20 for each complete kilometre travelled. Waiting time is charged at £0.25 per minute. Assel's journey was 9.5 km long and included 6 minutes of waiting in traffic.<br><br><b>How much was her fare?</b>", "options": ["£12.30", "£13.80", "£15.30", "£15.90", "£16.50"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Целые км: 9 (9,5 не считается).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 + 9 · 1,20 + 6 · 0,25 = 3 + 10,80 + 1,50 = 15,30 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — посчитали 9,5 км.</li><li>B — без ожидания.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Complete kilometre» — округление вниз.</div></div>"}, {"id": 9, "topic": "CON", "text": "All the trains that stop at Elmford also stop at Greyhill. Some of the trains that stop at Greyhill continue to the coast. No train that continues to the coast runs after 10 pm.<br><br><b>Which one of the following conclusions can be drawn from the above information?</b>", "options": ["Every train that stops at Greyhill also stops at Elmford.", "Some of the trains that stop at Elmford continue to the coast.", "No train that stops at Elmford runs after 10 pm.", "Trains that run after 10 pm do not stop at Greyhill.", "A train that stops at Elmford and continues to the coast does not run after 10 pm."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Элмфорд ⊂ Грейхилл; часть Грейхилла — к морю; к морю — не после 22:00.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поезд из Элмфорда, идущий к морю, — не после 22:00. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — обращение.</li><li>B, C — не обязательно.</li><li>D — не следует.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Верен только прямой вывод.</div></div>"}, {"id": 10, "topic": "PS", "text": "A conference runs every day from Wednesday 28 February to Tuesday 6 March inclusive, in a year that is not a leap year. No sessions are held on Saturdays or Sundays.<br><br><b>On how many days are sessions held?</b>", "options": ["4", "5", "6", "7", "8"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не високосный: 28 февраля → 1 марта.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ср 28, Чт 1, Пт 2, (Сб 3, Вс 4), Пн 5, Вт 6.</li><li>5 дней. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — с выходными.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пропустите выходные.</div></div>"}, {"id": 11, "topic": "ASM", "text": "Our school canteen should stop selling sugary drinks. Last year the canteen at Westgate School stopped selling them, and the amount of sugar its pupils consumed during the school day fell sharply. Our pupils would therefore also consume much less sugar during the school day if we did the same.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Westgate School has more pupils than our school.", "Our pupils would not simply bring sugary drinks from home or buy them elsewhere instead.", "Pupils at Westgate School now drink more water than before.", "The canteen makes most of its profit from selling sugary drinks.", "Sugary drinks are the main cause of tooth decay among school pupils."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">В Уэстгейте сработало → сработает и у нас.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: ученики не принесут сладкие напитки из дома. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не обойдут ли запрет?</div></div>"}, {"id": 12, "topic": "PS", "text": "Two machines fill bottles at a constant rate. Machine P fills 120 bottles in 4 minutes. Machine Q fills 90 bottles in 2 minutes.<br><br><b>Working together, how long will the two machines take to fill 1,500 bottles?</b>", "options": ["15 minutes", "18 minutes", "20 minutes", "25 minutes", "35 minutes"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">P: 30 бут./мин, Q: 45 бут./мин → 75 бут./мин.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1500 : 75 = 20 мин. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверные скорости.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скорости складываются.</div></div>"}, {"id": 13, "topic": "ASM", "text": "Mira's train is due to arrive at the central station at 9:40. Her interview starts at 10:00 in an office that is a ten-minute walk from the station. So Mira will be on time for her interview.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Interviewers prefer candidates who arrive early.", "Mira has walked from the station to the office before.", "The interview will last less than an hour.", "Mira will take a taxi from the station.", "The train will not arrive late."], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Поезд в 9:40 + 10 мин → успеет к 10:00.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: поезд не опоздает. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — не нужны.</li><li>A, C — не по теме.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Что, если поезд опоздает?</div></div>"}, {"id": 14, "topic": "PS", "text": "A shop reduced the price of a coat by 20%. A week later it reduced the new price by a further 25%. The coat now costs £54.<br><br><b>What was the original price of the coat?</b>", "options": ["£78.30", "£81.00", "£90.00", "£98.18", "£108.00"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">−20%, потом −25%: 0,8 · 0,75 = 0,6.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>54 : 0,6 = 90 £. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли 45% от 54.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный процент — делите.</div></div>"}, {"id": 15, "topic": "ASM", "text": "Electric scooters should be banned from pavements. Pedestrians, especially elderly people and young children, can be seriously injured when they are hit by a scooter travelling at speed.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Elderly people walk on pavements more often than other people do.", "Most people who ride electric scooters are young.", "Riding an electric scooter on the road is completely safe.", "A ban would reduce the number of pedestrians hit by scooters on pavements.", "Electric scooters are more dangerous than bicycles."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Запрет на тротуарах ради безопасности пешеходов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Допущение: запрет уменьшит число сбитых. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — слишком сильно.</li><li>A, B, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Мера должна работать.</div></div>"}, {"id": 16, "topic": "PS", "text": "The code for a locker has three different digits, each chosen from 1, 2, 3, 4 and 5. The digits must increase from left to right, and the first digit must be odd.<br><br><b>How many different codes are possible?</b>", "options": ["6", "7", "10", "12", "60"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возрастающие тройки из 1–5, первая цифра нечётная.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Начало 1: из {2,3,4,5} выбрать 2 → 6.</li><li>Начало 3: 345 → 1; начало 5 — нельзя.</li><li>7. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — все возрастающие тройки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Порядок задан — считайте сочетания.</div></div>"}, {"id": 17, "topic": "WKN", "text": "A survey of 2,000 adults found that people who regularly eat breakfast are less likely to be overweight than people who skip it. Eating breakfast must therefore help people to control their weight.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["A similar survey in another country produced the same result.", "People who eat breakfast say that they feel more energetic in the morning.", "Many breakfast cereals contain a lot of sugar.", "Many people who skip breakfast do so because they are already trying to lose weight.", "The survey included equal numbers of men and women."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Завтракающие реже полные → завтрак помогает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если пропускают завтрак именно те, кто уже худеет — причина обратная. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — усиливают или нейтральны.</li><li>C, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратная причинность.</div></div>"}, {"id": 18, "topic": "PS", "text": "Five friends – Arman, Bota, Daulet, Erlan and Samal – sit in a row of five seats numbered 1 to 5 from left to right.<br>• Daulet sits in seat 3.<br>• Erlan sits next to Daulet.<br>• Samal sits immediately to the left of Bota.<br>• Arman sits at one end of the row.<br>• Samal sits to the left of Daulet.<br><br><b>Who sits in seat 4?</b>", "options": ["Arman", "Bota", "Daulet", "Erlan", "Samal"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Даулет — 3; Самал левее Даулета и сразу слева от Боты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Самал 1, Бота 2 (иначе Бота на 3).</li><li>Арман на краю → 5; Ерлан рядом с Даулетом → 4. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные места заняты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Начинайте с жёстких условий.</div></div>"}, {"id": 19, "topic": "STR", "text": "In the year after new cycle lanes were built across the city, the number of people cycling to work rose by 40%. This shows that providing cycle lanes encourages people to cycle.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["In the same year, the number of people cycling to work in nearby cities without new cycle lanes did not change.", "Many cyclists prefer to ride on quiet residential streets.", "Some drivers complained that the cycle lanes made the roads narrower.", "Cycle lanes are cheaper to build than new roads.", "Fuel prices rose sharply during the same year."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дорожки → +40% велосипедистов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в соседних городах без дорожек роста не было — дело в дорожках. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — альтернативная причина (ослабляет).</li><li>B, C, D — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Контрольная группа.</div></div>"}, {"id": 20, "topic": "PS", "text": "A recipe for 4 people uses 300 g of rice. To cook for 6 people I need 300 ÷ 4 × 6 = 450 g of rice.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["A car travels 150 km in 2 hours. At the same speed it travels 150 ÷ 2 × 3 = 225 km in 3 hours.", "A box of 12 eggs costs £3, so one egg costs 25p.", "A room is 5 m long and 4 m wide, so its area is 20 m².", "Six friends share a £30 bill equally, so each pays £5.", "A plant grows 2 cm a week, so after 5 weeks it is 10 cm taller."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Метод: на 1 единицу, затем умножить.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 150 : 2 · 3 = 225 км. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — только деление.</li><li>C, E — только умножение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление + умножение.</div></div>"}, {"id": 21, "topic": "WKN", "text": "Students who belong to the school chess club achieve higher maths grades than other students. The headteacher concludes that playing chess improves mathematical ability, and plans to make chess lessons compulsory for everyone.<br><br><b>Which one of the following, if true, would most weaken the headteacher's reasoning?</b>", "options": ["Only students who already have the highest maths grades are invited to join the chess club.", "Several famous mathematicians were also keen chess players.", "Members of the chess club also enjoy other board games.", "Compulsory chess lessons would require extra teachers.", "The chess club meets twice a week after school."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Шахматисты лучше в математике → шахматы улучшают математику.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в клуб берут только лучших по математике — причина обратная. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — усиливает.</li><li>C, D, E — не по сути.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отбор участников.</div></div>"}, {"id": 22, "topic": "PS", "text": "A school needs buses for 130 students. Each bus holds 25 students. 130 ÷ 25 = 5.2, so 6 buses are needed.<br><br><b>Which one of the following uses the same method of calculation as the example above?</b>", "options": ["Fifty eggs are packed in boxes of 6. 50 ÷ 6 = 8.3, so 9 boxes are needed.", "Books 30 mm thick are put on a shelf 1,000 mm long. 1,000 ÷ 30 = 33.3, so 33 books fit.", "Seven tickets cost £12 each, so they cost £84 in total.", "Three tests scored 60, 70 and 80, so the average score is 70.", "A £40 jacket is reduced by 10%, so it costs £36."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Деление и округление вверх.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: 50 : 6 = 8,3 → 9 коробок. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — округление вниз.</li><li>C, D, E — другой метод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Остаток требует ещё одной единицы.</div></div>"}, {"id": 23, "topic": "FLAW", "text": "Every successful business owner I have met works more than sixty hours a week. My brother works more than sixty hours a week, so his business is bound to succeed.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that the brother enjoys running his business.", "It ignores the possibility that some unsuccessful business owners work fewer than sixty hours a week.", "It assumes that nobody can work more than sixty hours a week.", "It assumes that working long hours is enough to make a business succeed, when it may only be something that successful business owners have in common.", "It relies only on the brother's own opinion of his business."], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все успешные работают > 60 ч → брат работает > 60 ч → успешен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Долгая работа может быть необходимой, но не достаточной. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Необходимое ≠ достаточное.</div></div>"}, {"id": 24, "topic": "PS", "text": "The table shows the monthly rainfall in a town.<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Month</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Jan</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Feb</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Mar</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Apr</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">May</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Jun</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Rainfall (mm)</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">80</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">65</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">70</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">55</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">40</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">30</td></tr></table><br><br><b>In which month did the rainfall fall by the greatest percentage compared with the month before?</b>", "options": ["February", "March", "April", "May", "June"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Процент падения к предыдущему месяцу.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Фев −18,8%, Апр −21,4%, Май −27,3%, Июн −25%.</li><li>Май. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — наибольшее падение не в %.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Делите на предыдущий месяц.</div></div>"}, {"id": 25, "topic": "FLAW", "text": "Since the new manager arrived, the football team has won six of its eight matches. In the eight matches before she arrived, it won only two. Clearly the new manager's tactics caused the improvement.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?</b>", "options": ["It assumes that winning matches is important to the team.", "It ignores other changes that may have happened at the same time, such as new players joining or easier opponents.", "It is based on too many matches to be reliable.", "It does not state how many goals the team scored.", "It assumes that the manager will stay at the club for a long time."], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Новый тренер → больше побед.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Не учтены другие изменения в то же время (новые игроки и т. п.). Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Другие — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> После ≠ вследствие.</div></div>"}, {"id": 26, "topic": "PS", "text": "A fish tank is 60 cm long, 30 cm wide and 40 cm high. It is filled with water to 5 cm below the top. 1 litre = 1,000 cm³.<br><br><b>How many litres of water does the tank contain?</b>", "options": ["6.3", "54", "63", "72", "630"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вода на 5 см ниже верха → высота 35 см.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>60 · 30 · 35 = 63 000 см³ = 63 л. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — до самого верха.</li><li>A, E — ошибка в 10 раз.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте 5 см.</div></div>"}, {"id": 27, "topic": "PAR", "text": "If the bridge is closed, traffic is diverted through the town centre. Traffic is not being diverted through the town centre. So the bridge is not closed.<br><br><b>Which one of the following most closely parallels the reasoning used in the above argument?</b>", "options": ["If the river floods, the footpath is closed. The footpath is not closed. So the river has not flooded.", "All the guests have arrived, so the party can begin.", "If the shop is open, its lights are on. Its lights are on. So the shop is open.", "If Sara revises, she will pass the test. Sara did not revise. So she will not pass the test.", "Either the bus is late or I have missed it. I have not missed it. So the bus is late."], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Если A, то B; не B → не A (верная форма).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A: река разлилась → тропа закрыта; тропа открыта → не разлилась. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — обращение.</li><li>D — отрицание условия.</li><li>B, E — другая структура.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Modus tollens.</div></div>"}, {"id": 28, "topic": "PS", "text": "Kemal makes about 4 hours of phone calls a month. He is choosing between these plans:<table style=\"border-collapse:collapse;margin:10px 0;font-size:14px\"><tr><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Plan</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Monthly fee</th><th style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:700\">Calls</th></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">X</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£10</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">5p per minute</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Y</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£18</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">200 minutes included, then 3p per minute</td></tr><tr><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Z</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">£25</td><td style=\"border:1px solid currentColor;padding:4px 10px;text-align:left;font-weight:400\">Unlimited</td></tr></table><br><br><b>Which plan is al smaller cubes.<br><br><b>How many of the small cubes have red paint on exactly two faces?</b>", "options": ["6", "8", "12", "18", "24"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Куб 3 × 3 × 3; две окрашенные грани — у кубиков на рёбрах (не углы).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 рёбер · 1 кубик = 12. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — углы (3 грани).</li><li>A — центры граней (1 грань).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Углы — 3, рёбра — 2, грани — 1.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 3600, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=fa20c0b3"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
