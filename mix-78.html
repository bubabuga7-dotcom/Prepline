<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m059_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">12% от 25%.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,25 · 0,12 = 0,03 → 3%. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — сложили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Процент от процента — умножение.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m059_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>A + B</span><span>A + B</span></span>² = <span class=\"fr\"><span>1</span><span>A + B</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>A + B ≥ 2 → никогда не целое. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — сокращаются до целых при некоторых A, B.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> A² + 2AB + B² = (A + B)².</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m059_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">3⁻² − (−2)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>9</span></span> − 4 = <span class=\"fr\"><span>−35</span><span>9</span></span>. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Y² ≥ 0 всегда.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m059_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2,4 мили = 12 отрезков по <span class=\"fr\"><span>1</span><span>5</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,25 + 12 · 0,25 = 4,25. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — без посадки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посчитайте отрезки.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m059_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(2k^{<span class=\"fr\"><span>1</span><span>2</span></span>})⁻² = <span class=\"fr\"><span>1</span><span>4k</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли 2².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Степень на каждый множитель.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m059_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">RS + RT = ST → R между S и T, SR = 20.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>SU = 12 → RU = 20 − 12 = 8. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — SU.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Нарисуйте отрезок.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m059_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По графику h(5) = 5 → k = 5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>h(10) = 7. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это k.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала k, затем h(2k).</div></div>", "topic": "M4.12"}, {"id": 9, "text": "", "image": "images/math-new/m059_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Коэффициент при x: −(8 + k) = −5k → k = 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>m = 8k = 16. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — m = 8.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приравняйте коэффициенты.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m059_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">f⁻¹(x) = 2x + 3.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x + 3 + 4x + 3 = 12 → x = 1. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — ошибка в обратной.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y = <span class=\"fr\"><span>x − 3</span><span>2</span></span> → x = 2y + 3.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m059_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разница 0,25 · (5 − 1).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>$1,00. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 0,25 · 5.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность значений формулы.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m059_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x < y, x + y ≥ 1000 → y > 500 → III верно.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Десятки: 7 + 5 (+ перенос) = 2 или 3 → II не обязательно; I тоже нет. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — II не всегда.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите контрпримеры.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m059_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2ˢ = 2ᵘ + 2ᵛ возможно только при u = v = s − 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>I ✗, II ✗, III ✔. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — u = v.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Двоичная запись.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m059_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">r² = 3² + 3² = 18.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>18π. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — радиус вместо площади.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> S = πr².</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m059_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y, xy, x²y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — y².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Геометрическая прогрессия.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m059_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Работают 75 — это верхняя граница.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Все 75 могут быть без семьи и петь. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — минимум, а не максимум.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Максимум пересечения — меньшее из множеств.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m059_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый лепесток — два сегмента радиуса ½ по 90°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сегмент: <span class=\"fr\"><span>π</span><span>16</span></span> − <span class=\"fr\"><span>1</span><span>8</span></span>; 8 сегментов: <span class=\"fr\"><span>π</span><span>2</span></span> − 1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — радиус 1.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сектор − треугольник.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m059_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">B = A − 1, C = A − 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2A + A − 1 + 3A − 6 = 6A − 7. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — ошибка в C.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выразите через A.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m059_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сыр c, молоко и шоколад по 3c.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Всё: 135c + 24c + 69c = 228c; часть: 60c + c + 15c = 76c → <span class=\"fr\"><span>1</span><span>3</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — штуки, а не цены.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всё в одной единице.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m059_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Закраска = площадь треугольника − 3 сектора по 60° = (√3 − <span class=\"fr\"><span>π</span><span>2</span></span>)r².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√3 − <span class=\"fr\"><span>π</span><span>2</span></span>)r² = √3 − <span class=\"fr\"><span>π</span><span>2</span></span> → r = 1. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (2) — в старом ключе, неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сторона треугольника центров 2r.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m059_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь в 64 раза → длины в 8 раз → объём в 512 раз.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>64 : 512 = 0,125. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — делили на 64.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> k → k² → k³.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m059_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M2.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">A — 1, C — 4; Бенни и Фрэнсис на (2; 5) или (3; 6).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пара (4; 7) невозможна — место 4 занято → ни Бенни, ни Фрэнсис не встанут на 7-е. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — Бенни нельзя, но Дэррилу можно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перебор позиций.</div></div>"}, {"id": 31, "topic": "M5.14", "text": "<p>A prism has a triangular cross-section with base 10 cm and perpendicular height 6 cm. The prism is 9 cm long.</p><p>What is its volume?</p>", "image": "", "options": ["25 cm³", "30 cm³", "90 cm³", "270 cm³", "540 cm³"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">V = площадь сечения × длина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½·10·6 = 30.</li><li>30 · 9 = 270 см³. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — сложили.</li><li>B — забыли длину.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Призма — без ⅓, пирамида — с ⅓.</div></div>", "src": "PL"}, {"id": 32, "topic": "M4.14", "text": "<p>Find the gradient of the line joining \\((1, 3)\\) and \\((4, 12)\\).</p>", "image": "", "options": ["3", "6", "−3", "1.5", "\\(\\dfrac{1}{3}\\)"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">m = <span class=\"fr\"><span>y₂ − y₁</span><span>x₂ − x₁</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(12 − 3) : (4 − 1) = 3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — ошибка.</li><li>E — Δx/Δy вместо Δy/Δx.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычитайте в одном порядке сверху и снизу.</div></div>", "src": "PL"}, {"id": 33, "topic": "M3.3", "text": "<p>A map has scale 1 : 20,000. Two villages are 7.5 km apart.</p><p>How far apart are they on the map?</p>", "image": "", "options": ["3.75 cm", "37.5 cm", "150 cm", "375 cm", "3750 cm"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 км = 100 000 см.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>7,5 км = 750,000 см.</li><li>750,000 : 20,000 = 37,5 см. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — умножили на масштаб вместо деления.</li><li>E — перевели км в м, а не в см.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Переведите в одни единицы, потом делите на масштаб.</div></div>", "src": "PL"}, {"id": 34, "topic": "M5.3", "text": "<p>In an isosceles triangle the angle between the two equal sides is 110°.</p><p>What is each of the other two angles?</p>", "image": "", "options": ["17.5°", "35°", "55°", "70°", "110°"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Углы при основании равны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(180 − 110) : 2 = 35°. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — забыли разделить на 2.</li><li>E — равны углы при основании, а не этот.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Определите, какой угол «между равными сторонами».</div></div>", "src": "PL"}, {"id": 35, "topic": "M2.9", "text": "<p>Write 0.\\(\\dot{2}\\) as a fraction in its simplest form.</p>", "image": "", "options": ["\\(\\dfrac{2}{99}\\)", "\\(\\dfrac{1}{45}\\)", "\\(\\dfrac{1}{5}\\)", "\\(\\dfrac{2}{9}\\)", "\\(\\dfrac{3}{10}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножьте на 10ⁿ (n — длина периода) и вычтите.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = 0,222…, 10x = 2,22…</li><li>9x = 2 → x = <span class=\"fr\"><span>2</span><span>9</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это 0,0202…</li><li>B — это 0,022…</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Период из k цифр → знаменатель из k девяток.</div></div>", "src": "PL"}, {"id": 36, "topic": "M3.2", "text": "<p>Write 40 cm of 3 m as a fraction in its simplest form.</p>", "image": "", "options": ["\\(\\dfrac{13}{15}\\)", "\\(\\dfrac{40}{3}\\)", "\\(\\dfrac{1}{75}\\)", "\\(\\dfrac{2}{15}\\)", "\\(\\dfrac{4}{3}\\)"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала одинаковые единицы, потом сокращение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40 из 300 → <span class=\"fr\"><span>2</span><span>15</span></span>. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это оставшаяся часть.</li><li>B — не перевели в одинаковые единицы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дробь имеет смысл только для одинаковых единиц.</div></div>", "src": "PL"}, {"id": 37, "topic": "M3.6", "text": "<p>8 workers can paint a school in 9 days.</p><p>How long would 3 workers take, working at the same rate?</p>", "image": "", "options": ["14 days", "24 days", "26 days", "48 days", "72 days"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Больше рабочих — меньше дней: объём работы w·d постоянен.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 · 9 = 72 человеко-дней.</li><li>72 : 3 = 24 дней. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли разницу в рабочих.</li><li>E — это человеко-дни, а не дни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала проверьте: прямая или обратная пропорция?</div></div>", "src": "PL"}, {"id": 38, "topic": "M4.19", "text": "<p>Find an expression for the nth term of −4, 2, 8, 14, …</p>", "image": "", "options": ["\\(6n - 4\\)", "\\(-6n + 2\\)", "\\(6n - 10\\)", "\\(-4n + 6\\)", "\\(6n - 9\\)"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">nth term = dn + (a₁ − d).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>d = 6, a₁ − d = −10.</li><li>Проверка n = 1: −4. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — свободный член — это a₁ − d, а не a₁.</li><li>D — перепутали a и d.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте n = 1 и n = 2.</div></div>", "src": "PL"}, {"id": 39, "topic": "M5.19", "text": "<p>\\(\\mathbf{a} = \\begin{pmatrix}4\\\\-2\\end{pmatrix}\\) and \\(\\mathbf{b} = \\begin{pmatrix}2\\\\-5\\end{pmatrix}\\).</p><p>Find \\(|3\\mathbf{a} + \\mathbf{b}|\\).</p>", "image": "", "options": ["\\(\\sqrt{75}\\)", "317", "\\(\\sqrt{85}\\)", "25", "\\(\\sqrt{317}\\)"], "correct": 4, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала вектор, потом длина √(x² + y²).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3a + b = (14; −11).</li><li>√(196 + 121) = √317. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — вычли квадраты.</li><li>B — забыли корень.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Длина вектора — теорема Пифагора.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
