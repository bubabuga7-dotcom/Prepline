<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слабые места — Prepline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E;
    --text: #C9D2F0;
    --text-bright: #F2F5FF;
    --blue: #60A5FA;
    --violet: #A78BFA;
    --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass: rgba(255,255,255,0.05);
    --glass-line: rgba(255,255,255,0.12);
    --dock-w: 84px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg);
    line-height: 1.6; overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; }
  a { color: inherit; }
  main { margin-left: var(--dock-w); position: relative; z-index: 1; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px 90px; }

  .page-photo { position: fixed; inset: 0; z-index: 0;
    background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,14,30,0.74) 0%, rgba(10,14,30,0.86) 100%); }

  .dock {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--dock-w); z-index: 100;
    display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 10px;
    background: rgba(12,16,36,0.72); backdrop-filter: blur(16px);
    border-right: 1px solid var(--glass-line);
  }
  .dock a {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
    color: var(--text); text-decoration: none; font-weight: 700;
    transition: background .2s, color .2s;
  }
  .dock a:hover { background: rgba(167,139,250,0.16); color: var(--text-bright); }
  .dock .logo { background: var(--grad); color: #fff; font-family: 'Sora', sans-serif; }

  .head { margin-bottom: 34px; }
  .head h1 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 8px; }
  .head p { font-size: 15px; opacity: .82; max-width: 620px; }

  .card {
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(12px); border-radius: 18px; padding: 22px 24px; margin-bottom: 18px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 26px; }
  .stat b { display: block; font-family: 'Sora', sans-serif; font-size: 26px; color: var(--text-bright); }
  .stat span { font-size: 12.5px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    font: 600 13.5px 'Inter', sans-serif; color: var(--text); cursor: pointer;
    background: var(--glass); border: 1px solid var(--glass-line);
    padding: 8px 18px; border-radius: 999px; transition: all .2s;
  }
  .tab:hover { border-color: rgba(167,139,250,0.5); }
  .tab.on { background: var(--grad); color: #fff; border-color: transparent; }

  .row {
    display: grid; grid-template-columns: 1fr 74px; gap: 14px; align-items: center;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .row:last-child { border-bottom: none; }
  .row .name { font-size: 14.5px; color: var(--text-bright); }
  .row .code { font-size: 12px; opacity: .55; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.09); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; transition: width .5s; }
  .pct { text-align: right; font-family: 'Sora', sans-serif; font-size: 17px; color: var(--text-bright); font-variant-numeric: tabular-nums; }
  .pct small { display: block; font: 400 11.5px 'Inter', sans-serif; opacity: .6; }
  .thin { opacity: .5; font-size: 12px; }

  .msg { padding: 40px 4px; text-align: center; opacity: .75; font-size: 15px; }
  .btn {
    display: inline-block; margin-top: 14px; font: 600 14px 'Inter', sans-serif; color: #fff;
    text-decoration: none; background: var(--grad); padding: 11px 26px; border-radius: 999px;
  }
  @media (max-width: 780px) {
    :root { --dock-w: 0px; }
    .dock { flex-direction: row; top: auto; width: 100%; height: 62px; justify-content: space-around;
      border-right: none; border-top: 1px solid var(--glass-line); }
    .wrap { padding-bottom: 90px; }
  }
</style>
</head>
<body>
<div class="page-photo"></div>

<aside class="dock">
  <a href="index.html" class="logo">P</a>
  <a href="math.html" title="Математика">∑</a>
  <a href="crit.html" title="Critical Thinking">CT</a>
  <a href="weak-spots.html" title="Слабые места">◎</a>
</aside>

<main>
  <div class="wrap">
    <div class="head">
      <h1>Слабые места</h1>
      <p>Разбор по темам официальной спецификации NUET. Считаются все попытки,
         сохранённые в облако. Темы отсортированы от худшей к лучшей.</p>
    </div>

    <div class="card stats" id="stats" style="display:none;">
      <div class="stat"><b id="sTotal">—</b><span>ответов</span></div>
      <div class="stat"><b id="sAcc">—</b><span>верно</span></div>
      <div class="stat"><b id="sTopics">—</b><span>тем затронуто</span></div>
      <div class="stat"><b id="sWorst">—</b><span>худшая тема</span></div>
    </div>

    <div class="tabs" id="tabs" style="display:none;">
      <button class="tab on" data-f="all">Всё</button>
      <button class="tab" data-f="math">Математика</button>
      <button class="tab" data-f="ct">Critical Thinking</button>
    </div>

    <div class="card" id="list"><div class="msg">Загружаю…</div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
const NAMES = {
  ASM:'Assumptions — скрытые предположения',
  CON:'Conclusions — какой вывод следует',
  EF:'External Factors — внешние факторы',
  MC:'Main Conclusion — главный вывод',
  FLAW:'Flaws — ошибка в рассуждении',
  'M1.1':'Стандартные и составные единицы',
  'M1.2':'Перевод между единицами',
  'M2.1':'Порядок чисел, знаки сравнения',
  'M2.2':'Четыре действия с числами',
  'M2.3':'Простые числа, НОД и НОК',
  'M2.4':'Обратные операции, порядок действий',
  'M2.5':'Систематический перебор вариантов',
  'M2.6':'Квадраты, кубы и корни',
  'M2.7':'Законы степеней (числа)',
  'M2.8':'Стандартный вид числа',
  'M2.9':'Дробь ↔ десятичная ↔ процент',
  'M2.10':'Дроби, десятичные и проценты в расчётах',
  'M2.11':'Точные вычисления с корнями и π',
  'M2.12':'Верхние и нижние границы',
  'M2.13':'Округление и точность',
  'M2.14':'Оценка и прикидка',
  'M3.1':'Масштаб, планы и карты',
  'M3.2':'Часть от величины в виде дроби',
  'M3.3':'Запись отношений',
  'M3.4':'Деление величины в отношении',
  'M3.5':'Отношения в реальных задачах',
  'M3.6':'Пропорция',
  'M3.7':'Дроби в задачах на отношения',
  'M3.8':'Проценты и процентное изменение',
  'M3.9':'Прямая и обратная пропорциональность',
  'M3.10':'Отношения длин, площадей и объёмов',
  'M3.11':'Рост и убывание, сложный процент',
  'M4.1':'Алгебраическая запись',
  'M4.2':'Законы степеней (алгебра)',
  'M4.3':'Подстановка в формулы',
  'M4.4':'Подобные слагаемые, раскрытие скобок',
  'M4.5':'Разложение квадратного трёхчлена',
  'M4.6':'Упрощение выражений и дробей',
  'M4.7':'Выражение переменной из формулы',
  'M4.8':'Уравнение и тождество',
  'M4.9':'Координаты',
  'M4.10':'Прямая: наклон и пересечения',
  'M4.11':'Парабола: корни и вершина',
  'M4.12':'Графики функций',
  'M4.13':'Чтение графиков в реальных задачах',
  'M4.14':'Наклон графика и площадь под ним',
  'M4.15':'Системы уравнений',
  'M4.16':'Квадратные уравнения',
  'M4.17':'Линейные неравенства',
  'M4.18':'Последовательности: правила',
  'M4.19':'n-й член последовательности',
  'M5.1':'Термины, обозначения, симметрия',
  'M5.2':'Углы: прямые, параллельные, многоугольники',
  'M5.3':'Свойства четырёхугольников и треугольников',
  'M5.4':'Признаки равенства треугольников',
  'M5.5':'Углы и стороны через равенство и подобие',
  'M5.6':'Поворот, отражение, перенос, подобие',
  'M5.7':'Теорема Пифагора',
  'M5.8':'Термины окружности',
  'M5.9':'Теоремы об окружности',
  'M5.10':'Геометрия на координатной плоскости',
  'M5.11':'Объёмные тела: грани, рёбра, вершины',
  'M5.12':'Виды и проекции объёмных тел',
  'M5.13':'Карты, чертежи, азимуты',
  'M5.14':'Площади фигур, объём призмы',
  'M5.15':'Окружность и объёмные тела: формулы',
  'M5.16':'Дуги и секторы',
  'M5.17':'Подобие: длины, площади, объёмы',
  'M5.18':'Тригонометрические отношения',
  'M5.19':'Векторы'
};
const MIN_TRIES = 4;           // меньше этого — данных мало, вывод недостоверен
let AGG = [];

function colour(p) {
  if (p < 50) return '#F87171';
  if (p < 70) return '#FBBF24';
  if (p < 85) return '#A78BFA';
  return '#34D399';
}

function render(filter) {
  const box = document.getElementById('list');
  let rows = AGG;
  if (filter === 'math') rows = rows.filter(r => r.topic[0] === 'M' && r.topic.includes('.'));
  if (filter === 'ct')   rows = rows.filter(r => !r.topic.includes('.'));

  if (!rows.length) { box.innerHTML = '<div class="msg">По этому разделу пока нет данных.</div>'; return; }

  box.innerHTML = rows.map(r => {
    const p = Math.round(r.correct / r.total * 100);
    const weak = r.total < MIN_TRIES;
    return `<div class="row">
      <div>
        <div class="name">${NAMES[r.topic] || r.topic}</div>
        <div class="code">${r.topic}${weak ? ' · <span class="thin">мало данных</span>' : ''}</div>
        <div class="bar"><i style="width:${p}%;background:${weak ? 'rgba(255,255,255,0.25)' : colour(p)}"></i></div>
      </div>
      <div class="pct">${p}%<small>${r.correct} из ${r.total}</small></div>
    </div>`;
  }).join('');
}

async function load() {
  const box = document.getElementById('list');
  const supa = window.preplineSupa;
  if (!supa) { box.innerHTML = '<div class="msg">Не удалось подключиться к базе.</div>'; return; }

  const { data: { user } } = await supa.auth.getUser();
  if (!user) {
    box.innerHTML = '<div class="msg">Войди в аккаунт, чтобы увидеть разбор по темам.<br>' +
      'Кнопка входа — в правом верхнем углу.</div>';
    return;
  }

  const { data, error } = await supa
    .from('answer_log').select('topic, correct')
    .not('topic', 'is', null).limit(20000);

  if (error) { box.innerHTML = '<div class="msg">Ошибка: ' + error.message + '</div>'; return; }
  if (!data || !data.length) {
    box.innerHTML = '<div class="msg">Пока нет данных. Пройди любой тест — ' +
      'разбор появится здесь автоматически.<a class="btn" href="crit.html">Начать тест</a></div>';
    return;
  }

  const map = {};
  data.forEach(r => {
    if (!map[r.topic]) map[r.topic] = { topic: r.topic, total: 0, correct: 0 };
    map[r.topic].total++;
    if (r.correct) map[r.topic].correct++;
  });

  AGG = Object.values(map).sort((a, b) => {
    const wa = a.total < MIN_TRIES, wb = b.total < MIN_TRIES;
    if (wa !== wb) return wa ? 1 : -1;                     // «мало данных» — вниз
    return (a.correct / a.total) - (b.correct / b.total);  // худшие — вверх
  });

  const total = data.length;
  const correct = data.filter(r => r.correct).length;
  const solid = AGG.filter(r => r.total >= MIN_TRIES);
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sAcc').textContent = Math.round(correct / total * 100) + '%';
  document.getElementById('sTopics').textContent = AGG.length;
  document.getElementById('sWorst').textContent = solid.length ? solid[0].topic : '—';
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('tabs').style.display = 'flex';

  render('all');
}

document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  e.target.classList.add('on');
  render(e.target.dataset.f);
});

setTimeout(load, 350);   // ждём инициализацию prepline-supabase.js
</script>
</body>
</html>
