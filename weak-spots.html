<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weak spots — Prepline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E;
    --text: #C9D2F0;
    --text-bright: #F2F5FF;
    --blue: #60A5FA;
    --violet: #A78BFA;
    --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass: rgba(255,255,255,0.05);
    --glass-line: rgba(255,255,255,0.12);
    --dock-w: 84px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg);
    line-height: 1.6; overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; }
  a { color: inherit; }
  main { margin-left: var(--dock-w); position: relative; z-index: 1; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px 90px; }

  .page-photo { position: fixed; inset: 0; z-index: 0;
    background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,14,30,0.74) 0%, rgba(10,14,30,0.86) 100%); }

  .dock {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--dock-w); z-index: 100;
    display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 10px;
    background: rgba(12,16,36,0.72); backdrop-filter: blur(16px);
    border-right: 1px solid var(--glass-line);
  }
  .dock a {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
    color: var(--text); text-decoration: none; font-weight: 700;
    transition: background .2s, color .2s;
  }
  .dock a:hover { background: rgba(167,139,250,0.16); color: var(--text-bright); }
  .dock .logo { background: var(--grad); color: #fff; font-family: 'Sora', sans-serif; }

  .head { margin-bottom: 34px; }
  .head h1 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 8px; }
  .head p { font-size: 15px; opacity: .82; max-width: 620px; }

  .card {
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(12px); border-radius: 18px; padding: 22px 24px; margin-bottom: 18px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 26px; }
  .stat b { display: block; font-family: 'Sora', sans-serif; font-size: 26px; color: var(--text-bright); }
  .stat span { font-size: 12.5px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    font: 600 13.5px 'Inter', sans-serif; color: var(--text); cursor: pointer;
    background: var(--glass); border: 1px solid var(--glass-line);
    padding: 8px 18px; border-radius: 999px; transition: all .2s;
  }
  .tab:hover { border-color: rgba(167,139,250,0.5); }
  .tab.on { background: var(--grad); color: #fff; border-color: transparent; }

  .row {
    display: grid; grid-template-columns: 1fr 74px; gap: 14px; align-items: center;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .row:last-child { border-bottom: none; }
  .row .name { font-size: 14.5px; color: var(--text-bright); }
  .row .code { font-size: 12px; opacity: .55; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.09); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; transition: width .5s; }
  .pct { text-align: right; font-family: 'Sora', sans-serif; font-size: 17px; color: var(--text-bright); font-variant-numeric: tabular-nums; }
  .pct small { display: block; font: 400 11.5px 'Inter', sans-serif; opacity: .6; }
  .thin { opacity: .5; font-size: 12px; }

  .msg { padding: 40px 4px; text-align: center; opacity: .75; font-size: 15px; }
  .btn {
    display: inline-block; margin-top: 14px; font: 600 14px 'Inter', sans-serif; color: #fff;
    text-decoration: none; background: var(--grad); padding: 11px 26px; border-radius: 999px;
  }
  @media (max-width: 780px) {
    :root { --dock-w: 0px; }
    .dock { flex-direction: row; top: auto; width: 100%; height: 62px; justify-content: space-around;
      border-right: none; border-top: 1px solid var(--glass-line); }
    .wrap { padding-bottom: 90px; }
  }
</style>
</head>
<body>
<div class="page-photo"></div>

<aside class="dock">
  <a href="index.html" class="logo">P</a>
  <a href="math.html" title="Mathematics">∑</a>
  <a href="crit.html" title="Critical Thinking">CT</a>
  <a href="weak-spots.html" title="Weak spots">◎</a>
</aside>

<main>
  <div class="wrap">
    <div class="head">
      <h1>Weak spots</h1>
      <p>A breakdown by topic from the official NUET specification. Every attempt
         saved to the cloud is counted. Topics run from weakest to strongest.</p>
    </div>

    <div class="card stats" id="stats" style="display:none;">
      <div class="stat"><b id="sTotal">—</b><span>answers</span></div>
      <div class="stat"><b id="sAcc">—</b><span>correct</span></div>
      <div class="stat"><b id="sTopics">—</b><span>topics covered</span></div>
      <div class="stat"><b id="sWorst">—</b><span>weakest topic</span></div>
    </div>

    <div class="tabs" id="tabs" style="display:none;">
      <button class="tab on" data-f="all">All</button>
      <button class="tab" data-f="math">Mathematics</button>
      <button class="tab" data-f="ct">Critical Thinking</button>
    </div>

    <div class="card" id="list"><div class="msg">Loading...</div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
const NAMES = {
  "ASM": "Assumptions — unstated premises",
  "CON": "Conclusions — what follows from the passage",
  "EF": "External factors — what would weaken or strengthen",
  "MC": "Main conclusion — the point being argued",
  "FLAW": "Flaws — errors in the reasoning",
  "M1.1": "Standard and compound units: speed, density, unit pricing",
  "M1.2": "Converting between units, including area, volume and compound units",
  "M2.1": "Ordering integers, decimals and fractions; the symbols = ≠ < > ≤ ≥",
  "M2.2": "The four operations with integers, decimals and fractions; place value",
  "M2.3": "Primes, factors, multiples, HCF, LCM, prime factorisation",
  "M2.4": "Inverse operations, cancellation, priority of operations",
  "M2.5": "Systematic listing strategies",
  "M2.6": "Squares, cubes, square roots and cube roots",
  "M2.7": "Index laws for numerical expressions",
  "M2.8": "Standard form, a × 10ⁿ",
  "M2.9": "Converting between decimals, percentages and fractions",
  "M2.10": "Fractions, decimals and percentages in calculations; equivalent fractions",
  "M2.11": "Exact calculation with surds and π; rationalising denominators",
  "M2.12": "Upper and lower bounds",
  "M2.13": "Rounding to decimal places and significant figures; error intervals",
  "M2.14": "Approximation and estimation",
  "M3.1": "Scale factors, scale diagrams and maps",
  "M3.2": "Expressing one quantity as a fraction of another",
  "M3.3": "Ratio notation",
  "M3.4": "Dividing a quantity in a given ratio",
  "M3.5": "Ratio in real contexts: conversion, scaling, mixing, concentrations",
  "M3.6": "Proportion; relating ratios to fractions and linear functions",
  "M3.7": "Fractions within ratio problems",
  "M3.8": "Percentages, percentage change, original value, simple interest",
  "M3.9": "Direct and inverse proportion, including powers",
  "M3.10": "Comparing lengths, areas and volumes by ratio; similarity and scale factors",
  "M3.11": "Growth and decay, compound interest, iterative processes",
  "M4.1": "Algebraic notation",
  "M4.2": "Index laws in algebra",
  "M4.3": "Substituting numerical values into formulae; algebraic vocabulary",
  "M4.4": "Collecting terms, expanding brackets, common factors, products of binomials",
  "M4.5": "Factorising quadratics, including the difference of two squares",
  "M4.6": "Simplifying expressions and rational expressions",
  "M4.7": "Rearranging formulae to change the subject",
  "M4.8": "Equations and identities; showing expressions are equivalent",
  "M4.9": "Coordinates in all four quadrants",
  "M4.10": "Straight lines: gradient, intercepts, parallel and perpendicular",
  "M4.11": "Quadratics: roots, intercepts, turning points, completing the square",
  "M4.12": "Graphs: linear, quadratic, cubic, reciprocal, exponential, trigonometric",
  "M4.13": "Interpreting graphs in real contexts, including kinematics",
  "M4.14": "Gradients of graphs and areas under graphs",
  "M4.15": "Setting up and solving equations and simultaneous equations",
  "M4.16": "Solving quadratic equations",
  "M4.17": "Linear inequalities in one or two variables",
  "M4.18": "Generating terms of a sequence",
  "M4.19": "The nth term of linear and quadratic sequences",
  "M5.1": "Geometrical terms, notation and symmetry",
  "M5.2": "Angles at a point, on a line, in parallels, triangles and polygons",
  "M5.3": "Properties of quadrilaterals and types of triangle",
  "M5.4": "Congruence criteria for triangles: SSS, SAS, ASA, RHS",
  "M5.5": "Angles and sides using congruence, similarity and quadrilateral properties",
  "M5.6": "Rotation, reflection, translation and enlargement",
  "M5.7": "Pythagoras' theorem in 2 and 3 dimensions",
  "M5.8": "Circle terms: chord, tangent, arc, sector, segment",
  "M5.9": "Circle theorems",
  "M5.10": "Geometrical problems on coordinate axes",
  "M5.11": "Faces, edges and vertices of solids",
  "M5.12": "Plans and elevations of 3-D shapes",
  "M5.13": "Maps, scale drawings and three-figure bearings",
  "M5.14": "Area of triangles, parallelograms and trapezia; volume of prisms",
  "M5.15": "Circle and cylinder formulae; perimeter, area, surface area and volume",
  "M5.16": "Arc length, angles and area of sectors",
  "M5.17": "Congruence and similarity: lengths, areas and volumes",
  "M5.18": "Trigonometric ratios and exact values",
  "M5.19": "Vectors"
};
const MIN_TRIES = 4;           // below this the sample is too small to trust
let AGG = [];

function colour(p) {
  if (p < 50) return '#F87171';
  if (p < 70) return '#FBBF24';
  if (p < 85) return '#A78BFA';
  return '#34D399';
}

function render(filter) {
  const box = document.getElementById('list');
  let rows = AGG;
  if (filter === 'math') rows = rows.filter(r => r.topic[0] === 'M' && r.topic.includes('.'));
  if (filter === 'ct')   rows = rows.filter(r => !r.topic.includes('.'));

  if (!rows.length) { box.innerHTML = '<div class="msg">No data for this section yet.</div>'; return; }

  box.innerHTML = rows.map(r => {
    const p = Math.round(r.correct / r.total * 100);
    const weak = r.total < MIN_TRIES;
    return `<div class="row">
      <div>
        <div class="name">${NAMES[r.topic] || r.topic}</div>
        <div class="code">${r.topic}${weak ? ' · <span class="thin">not enough data</span>' : ''}</div>
        <div class="bar"><i style="width:${p}%;background:${weak ? 'rgba(255,255,255,0.25)' : colour(p)}"></i></div>
      </div>
      <div class="pct">${p}%<small>${r.correct} of ${r.total}</small></div>
    </div>`;
  }).join('');
}

async function load() {
  const box = document.getElementById('list');
  const supa = window.preplineSupa;
  if (!supa) { box.innerHTML = '<div class="msg">Could not connect to the database.</div>'; return; }

  const { data: { user } } = await supa.auth.getUser();
  if (!user) {
    box.innerHTML = '<div class="msg">Sign in to see the breakdown by topic.<br>' +
      'The sign-in button is in the top right corner.</div>';
    return;
  }

  let data, error = null;
  try { data = await window.preplineTopicStats(); } catch (e) { error = e; }

  if (error) { box.innerHTML = '<div class="msg">Error: ' + (error.message || error) + '</div>'; return; }
  if (!data || !data.length) {
    box.innerHTML = '<div class="msg">No data yet. Take any test — ' +
      'the breakdown will appear here automatically.<a class="btn" href="crit.html">Start a test</a></div>';
    return;
  }

  const map = {};
  data.forEach(r => { map[r.topic] = { topic: r.topic, total: r.total, correct: r.correct }; });

  AGG = Object.values(map).sort((a, b) => {
    const wa = a.total < MIN_TRIES, wb = b.total < MIN_TRIES;
    if (wa !== wb) return wa ? 1 : -1;                     // 'not enough data' goes to the bottom
    return (a.correct / a.total) - (b.correct / b.total);  // weakest first
  });

  const total = data.length;
  const correct = data.filter(r => r.correct).length;
  const solid = AGG.filter(r => r.total >= MIN_TRIES);
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sAcc').textContent = Math.round(correct / total * 100) + '%';
  document.getElementById('sTopics').textContent = AGG.length;
  document.getElementById('sWorst').textContent = solid.length ? solid[0].topic : '—';
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('tabs').style.display = 'flex';

  render('all');
}

document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  e.target.classList.add('on');
  render(e.target.dataset.f);
});

setTimeout(load, 350);   // wait for prepline-supabase.js to initialise
</script>
</body>
</html>
