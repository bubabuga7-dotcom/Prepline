<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "<p>Solve the equation for x: \\(8^{x-1} = 4^{x+1}\\)</p>", "image": "", "options": ["1", "2", "3", "4", "5"], "correct": 4, "verified": true, "src": "M39", "orig": "images/q-c7ba98019a.jpg", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим обе части к основанию 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8<sup>x−1</sup> = 2<sup>3x−3</sup>; 4<sup>x+1</sup> = 2<sup>2x+2</sup>.</li><li>3x − 3 = 2x + 2 → x = 5.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — не удовлетворяют: например, x = 3: 8² = 64 ≠ 4⁴ = 256.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 8⁴ = 4096 = 4⁶ ✓.</div></div>"}, {"id": 2, "text": "<p>In the figure below, A, B, C, and D are points on a circle. AC is the diameter of the circle.</p><p>If angles BAC = 30°, ACD=45°, and BC=6cm, what is the area of the shaded region? [Diagram is not to scale]</p>", "image": "images/q-2e430fe37d.jpg", "options": ["\\(30\\pi - 36\\sqrt{2}\\)", "\\(36\\pi - (18\\sqrt{3} + 36)\\)", "\\(36\\pi - 36\\sqrt{3}\\)", "\\(36\\pi - (36 - 18\\sqrt{3})\\)", "\\(36\\pi - 6\\sqrt{3}\\)"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-2e430fe37d.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AC — диаметр, значит, углы B и D прямые. Заштриховано: круг − четырёхугольник ABCD.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Треугольник ABC (30-60-90): BC = 6 → AC = 12 (r = 6), AB = 6√3.</li><li>S(ABC) = ½ · 6 · 6√3 = 18√3.</li><li>Треугольник ACD (45-45-90): AD = CD = 6√2 → S = 36.</li><li>Заштриховано: 36π − (18√3 + 36).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — посчитан только удвоенный ABC.</li><li>D — знак у 18√3.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вписанный угол, опирающийся на диаметр, — 90°.</div></div>"}, {"id": 3, "text": "<p>A regular decagon is a polygon with ten equal sides and ten equal angles. What is the sum of all the interior angles of a regular decagon, and what is the measure of each individual interior angle?</p>", "image": "", "options": ["Sum = 1,800\\(^\\circ\\); Each angle = 180\\(^\\circ\\)", "Sum = 1,440\\(^\\circ\\); Each angle = 144\\(^\\circ\\)", "Sum = 1,260\\(^\\circ\\); Each angle = 126\\(^\\circ\\)", "Sum = 1,620\\(^\\circ\\); Each angle = 162\\(^\\circ\\)", "Sum = 1,080\\(^\\circ\\); Each angle = 108\\(^\\circ\\)"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-e165bdda92.jpg", "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(n − 2) · 180°, затем делим на n.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сумма: 8 · 180° = 1440°.</li><li>Каждый: 144°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D, E — неверное n.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол 36° → внутренний 144°.</div></div>"}, {"id": 4, "text": "<p>A cube has the property that its total surface area has the same numerical value as its volume. What is the length of the side (edge) of this cube?</p>", "image": "", "options": ["\\(s=2\\)", "\\(s=4\\)", "\\(s=6\\)", "\\(s=8\\)", "\\(s=12\\)"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-ba1a3c5bf7.jpg", "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">6s² = s³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s = 6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — не удовлетворяют.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Классика: у куба со стороной 6 площадь и объём = 216.</div></div>"}, {"id": 5, "text": "<p>Points P(-2, 3) and Q(4, -1) are two endpoints of a diameter of a circle.</p><p>What are the coordinates of the center of the circle?</p>", "image": "", "options": ["(1, 1)", "(2, 2)", "(1, 2)", "(3, 1)", "(2, 1)"], "correct": 0, "verified": true, "src": "M39", "orig": "images/q-49fef2a62c.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Центр — середина диаметра.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>−2 + 4</span><span>2</span></span>; <span class=\"fr\"><span>3 − 1</span><span>2</span></span> = (1; 1).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — ошибки в среднем.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Середина = среднее координат.</div></div>"}, {"id": 6, "text": "<p>If:</p><ul><li>w = the number of prime numbers that are multiples of 3;</li><li>x = the number of prime numbers that are also squares of numbers;</li><li>y = the number of prime numbers between 10 and 20;</li><li>z = the number of odd prime numbers less than 10;</li></ul><p>Then, find the value of w+x+y+z.</p>", "image": "", "options": ["6", "7", "8", "9", "10"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-2036da6de4.jpg", "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем каждую величину.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>w: простые, кратные 3 — только 3 → 1.</li><li>x: квадраты не бывают простыми → 0.</li><li>y: 11, 13, 17, 19 → 4.</li><li>z: нечётные простые < 10: 3, 5, 7 → 3.</li><li>Сумма 8.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — посчитали 2 нечётным или 9 простым.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 2 — единственное чётное простое.</div></div>"}, {"id": 7, "text": "<p>The binary operation \\(*\\) is defined by:</p><p>\\[a * b = \\frac{b^2}{a + \\sqrt{b}}\\]</p><p>What is the value of <strong>4*9</strong>?</p>", "image": "", "options": ["81", "81/7", "81/8", "81/9", "82"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-20b1c32095.jpg", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем a = 4, b = 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>b² = 81; a + √b = 4 + 3 = 7.</li><li><span class=\"fr\"><span>81</span><span>7</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — √9 = 4?</li><li>A — без знаменателя.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √9 = 3.</div></div>"}, {"id": 8, "text": "<p>Two triangles, T1 and T2, are similar. The height of T1 is 4 cm and the corresponding height of T2 is 6 cm. If the area of T1 is 20 cm\\(^2\\), what is the area of T2?</p>", "image": "", "options": ["30 cm\\(^2\\)", "40 cm\\(^2\\)", "45 cm\\(^2\\)", "60 cm\\(^2\\)", "90 cm\\(^2\\)"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-6f21a170ff.jpg", "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади подобных ∝ k².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k = <span class=\"fr\"><span>6</span><span>4</span></span> = 1,5 → k² = 2,25.</li><li>20 · 2,25 = 45.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (30) — умножили на k.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высоты тоже соответствуют коэффициенту подобия.</div></div>"}, {"id": 9, "text": "<p>A class of 20 students has a mean test score of 70. Another class of 30 students has a mean test score of 80.</p><p>What is the combined mean score of all 50 students?</p>", "image": "", "options": ["74", "75", "76", "77", "78"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-cb2e16ba9e.jpg", "topic": "M2.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Взвешенное среднее.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Суммы: 20 · 70 = 1400; 30 · 80 = 2400.</li><li><span class=\"fr\"><span>3800</span><span>50</span></span> = 76.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (75) — простое среднее 70 и 80, без учёта размеров классов.</li><li>A, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Больший класс сильнее влияет на среднее.</div></div>"}, {"id": 11, "text": "<p>A cone has a base radius of 5 cm and a vertical height of 12 cm. What is the curved surface area of the cone?</p>", "image": "images/q-c1bf32f6e9.jpg", "options": ["60π cm\\(^2\\)", "65π cm\\(^2\\)", "120π cm\\(^2\\)", "130π cm\\(^2\\)", "144π cm\\(^2\\)"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-c1bf32f6e9.jpg", "review": true, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Боковая поверхность конуса πrl, l — образующая.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>l = √(25 + 144) = 13.</li><li>π · 5 · 13 = 65π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — высота вместо образующей.</li><li>D — 2πrl.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Боковая поверхность использует образующую, а не высоту.</div></div>"}, {"id": 12, "text": "<p>A rescue helicopter leaves a base at point A and flies on a bearing of 060° for 40 km to reach a stranded boat at point B. After the rescue, the helicopter flies on a bearing of 150° for 30 km to a hospital at point C. What is the direct distance from the base (A) to the hospital (C)?</p>", "image": "", "options": ["50 km", "70 km", "\\(10\\sqrt{7}\\) km", "65 km", "\\(50\\sqrt{2}\\) km"], "correct": 0, "verified": true, "src": "M39", "orig": "images/q-3504745680.jpg", "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Найдём угол в точке B между направлениями.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Обратно на A — пеленг 060° + 180° = 240°.</li><li>На C — 150°.</li><li>Угол: 240° − 150° = 90°.</li><li>AC = √(40² + 30²) = 50 км.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (70) — сложили расстояния.</li><li>C, D, E — неверный угол.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный пеленг = пеленг ± 180°.</div></div>"}, {"id": 13, "text": "<p>If f(x) = x² + 3 and g(x) = \\(\\sqrt{x}\\), evaluate f(g(5)).</p>", "image": "", "options": ["\\(\\sqrt{28}\\)", "8", "5\\(\\sqrt{5}\\) + 3", "25", "\\(\\sqrt{8}\\)"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-5158c4ff3b.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сначала g, затем f.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>g(5) = √5.</li><li>f(√5) = 5 + 3 = 8.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — f(5) − 3?</li><li>A, C, E — неверный порядок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (√5)² = 5.</div></div>"}, {"id": 14, "text": "<p>Point P is 13 cm away from the center O of a circle. A tangent line PT is drawn from P to the circle, touching at point T. The length of the tangent PT is 12 cm. Altitude is drawn from point T to the line segment PO at point D. What is the area of triangle TDO?</p>", "image": "images/q-73109c7658.jpg", "options": ["\\(\\frac{25}{13}\\) cm\\(^2\\)", "\\(\\frac{25}{169}\\) cm\\(^2\\)", "\\(\\frac{1500}{169}\\) cm\\(^2\\)", "\\(\\frac{750}{169}\\) cm\\(^2\\)", "\\(\\frac{750}{13}\\) cm\\(^2\\)"], "correct": 3, "verified": true, "src": "M39", "orig": "images/q-73109c7658.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прямой угол между касательной и радиусом; высота в прямоугольном треугольнике.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>OT = √(169 − 144) = 5.</li><li>OD = <span class=\"fr\"><span>OT²</span><span>OP</span></span> = <span class=\"fr\"><span>25</span><span>13</span></span>.</li><li>TD = OT · PT / OP = <span class=\"fr\"><span>60</span><span>13</span></span>.</li><li>S = ½ · <span class=\"fr\"><span>25</span><span>13</span></span> · <span class=\"fr\"><span>60</span><span>13</span></span> = <span class=\"fr\"><span>750</span><span>169</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без ½.</li><li>A, B, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Высота к гипотенузе: h = <span class=\"fr\"><span>ab</span><span>c</span></span>.</div></div>"}, {"id": 15, "text": "<p>If \\(a^2b = 5\\), find the numerical value of the following expression:</p><p>\\(\\frac{a^6b^3 - a^2b}{a^2b}\\)</p>", "image": "", "options": ["4", "15", "24", "25", "124"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-d2b3879561.jpg", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">a⁶b³ = (a²b)³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(a²b)³ = 125.</li><li><span class=\"fr\"><span>125 − 5</span><span>5</span></span> = 24.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (124) — без деления.</li><li>D (25) — (a²b)².</li><li>A, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите выражение через данную комбинацию.</div></div>"}, {"id": 16, "text": "<p>16 Question</p><p>Two runners, Alice and Bob, are at the same starting point on a circular track that is 400 meters long.</p><ul><li>Alice runs at a constant speed of 5 m/s.</li><li>Bob runs at a constant speed of 3 m/s.</li></ul><p>If they start running at the same time in the same direction, how many seconds will pass before Alice overtakes Bob for the first time?</p>", "image": "", "options": ["80 seconds", "133.3 seconds", "200 seconds", "400 seconds", "800 seconds"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-0d34d2758b.jpg", "topic": "M1.1", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обгон = отрыв на один круг (400 м).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Скорость сближения: 5 − 3 = 2 м/с.</li><li><span class=\"fr\"><span>400</span><span>2</span></span> = 200 с.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (80) — <span class=\"fr\"><span>400</span><span>5</span></span>.</li><li>B (133,3) — <span class=\"fr\"><span>400</span><span>3</span></span>.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В одну сторону — разность скоростей.</div></div>"}, {"id": 17, "text": "<p>In triangle ABC, AB = 5 cm, AC = 8 cm, and the angle BAC = 60°.</p><p>What is the perimeter of triangle ABC?</p>", "image": "images/q-2396092c6c.jpg", "options": ["10 cm", "\\(10\\sqrt{3}\\) cm", "20 cm", "\\(20\\sqrt{3}\\) cm", "40 cm"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-2396092c6c.jpg", "review": true, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема косинусов, затем периметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>BC² = 25 + 64 − 2 · 5 · 8 · ½ = 49 → BC = 7.</li><li>P = 5 + 8 + 7 = 20.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без одной стороны.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 5-7-8 с углом 60° — частый «красивый» треугольник.</div></div>"}, {"id": 18, "text": "<p>Find the Least Common Multiple (LCM) and the Highest Common Factor (HCF) of the following three numbers: 24, 90, and 120.</p>", "image": "", "options": ["LCM: 360; HCF: 6", "LCM: 720; HCF: 12", "LCM: 180; HCF: 3", "LCM: 540; HCF: 6", "LCM: 360; HCF: 12"], "correct": 0, "verified": true, "src": "M39", "orig": "images/q-1deda618eb.jpg", "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разложение на простые множители.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>24 = 2³ · 3; 90 = 2 · 3² · 5; 120 = 2³ · 3 · 5.</li><li>НОК: 2³ · 3² · 5 = 360.</li><li>НОД: 2 · 3 = 6.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — НОД 12 не делит 90.</li><li>C, D — неверный НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> НОК — максимальные степени, НОД — минимальные.</div></div>"}, {"id": 19, "text": "<p>Solve the quadratic inequality: \\(x^2 - x - 6 \\geq 0\\)</p>", "image": "", "options": ["-2 \\(\\leq\\) x \\(\\leq\\) 3", "x \\(\\leq\\) -2 or x \\(\\geq\\) 3", "-3 \\(\\leq\\) x \\(\\leq\\) 2", "x \\(\\leq\\) -3 or x \\(\\geq\\) 2", "x = 3 or x = -2"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-482108004c.jpg", "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x − 3)(x + 2) ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Корни −2 и 3.</li><li>Ветви вверх, ≥ 0 снаружи: x ≤ −2 или x ≥ 3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — промежуток для ≤ 0.</li><li>C, D — неверные корни.</li><li>E — только граничные точки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ≥ 0 при ветвях вверх — вне корней.</div></div>"}, {"id": 20, "text": "<p>What is the radius of the circle described by the equation:</p><p>\\(x^2 + y^2 - 4x + 6y - 3 = 0\\)</p>", "image": "", "options": ["\\(\\sqrt{3}\\)", "\\(\\sqrt{10}\\)", "4", "16", "\\(\\sqrt{16}\\)"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-705b000cac.jpg", "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Полные квадраты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 2)² + (y + 3)² = 3 + 4 + 9 = 16 → r = 4.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — r².</li><li>E — √16 = 4, но записано не в простейшем виде.</li><li>A, B — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> r² = свободный член после переноса.</div></div>"}, {"id": 21, "text": "<p>Rationalize the denominator of: \\(\\frac{4}{(\\sqrt{5}-1)}\\)</p>", "image": "", "options": ["\\(\\sqrt{5}+1\\)", "\\(4(\\sqrt{5}+1)\\)", "\\(\\sqrt{5}-1\\)", "\\(2(\\sqrt{5}+1)\\)", "\\(1\\)"], "correct": 0, "verified": true, "src": "M39", "orig": "images/q-68eefe11d6.jpg", "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем на сопряжённое √5 + 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√5 − 1)(√5 + 1) = 4.</li><li>4<span class=\"fr\"><span>√5 + 1</span><span>4</span></span> = √5 + 1.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — забыли сократить.</li><li>D — неверно сократили.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сопряжённое убирает корень.</div></div>"}, {"id": 22, "text": "<p>22 Question</p><p>A chemist has two bottles of alcohol solution.</p><ul><li>Bottle A contains a 10% alcohol solution.</li><li>Bottle B contains a 40% alcohol solution.</li></ul><p>How many liters of Bottle B must be mixed with 20 liters of Bottle A to create a final mixture that is exactly 20% alcohol?</p>", "image": "", "options": ["5 liters", "10 liters", "15 liters", "20 liters", "25 liters"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-b368fa7735.jpg", "topic": "M3.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Уравнение по количеству спирта.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>0,1 · 20 + 0,4b = 0,2(20 + b).</li><li>2 + 0,4b = 4 + 0,2b → b = 10 л.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не дают 20%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Правило рычага: (20 − 10) : (40 − 20) = 1 : 2 → B вдвое меньше A.</div></div>"}, {"id": 23, "text": "<p>In the figure below, ABCD is a cyclic quadrilateral. The side AB is extended to a point E.</p><p>If angle ADC = 110°, what is the size of the exterior angle CBE?</p>", "image": "images/q-0522b73e2d.jpg", "options": ["70°", "90°", "100°", "110°", "120°"], "correct": 3, "verified": true, "src": "M39", "orig": "images/q-0522b73e2d.jpg", "review": true, "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внешний угол вписанного четырёхугольника равен противоположному внутреннему.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∠ABC = 180° − 110° = 70°.</li><li>∠CBE = 180° − 70° = 110°.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (70°) — это ∠ABC.</li><li>B, C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Внешний угол = противолежащий внутренний.</div></div>"}, {"id": 24, "text": "<p>Find the x-coordinates of the intersection points of the line \\(y = x + 2\\) and the parabola \\(y = x^2\\).</p>", "image": "", "options": ["\\(x = 1, x = 2\\)", "\\(x = -1, x = 2\\)", "\\(x = 1, x = -2\\)", "\\(x = -1, x = -2\\)", "\\(x = 0, x = 4\\)"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-a3a3fed2c6.jpg", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² = x + 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − x − 2 = 0 → (x − 2)(x + 1) = 0 → x = 2, −1.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C, D — знаки.</li><li>A, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: x = −1: 1 = 1 ✓.</div></div>"}, {"id": 25, "text": "<p>A tech company purchased a high-end server for $10,000.</p><ul><li>In the first year, the value of the server depreciated (decreased) by 20%.</li><li>In the second year, due to a global chip shortage, the market value of this specific model appreciated (increased) by 15% from its value at the end of the first year.</li></ul><p>What is the final value of the server at the end of the second year, and what is the overall percentage change from the original price?</p>", "image": "", "options": ["9200$ 8% decrease", "9500$ 5% decrease", "9800$ 2% decrease", "9600$ 4% decrease", "10000$ 0% change"], "correct": 0, "verified": true, "src": "M39", "orig": "images/q-00d2912d86.jpg", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Последовательные проценты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>10 000 · 0,8 = 8000.</li><li>8000 · 1,15 = 9200 → −8%.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — сложили −20% + 15% = −5%.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рост считается от уже уменьшенной цены.</div></div>"}, {"id": 26, "text": "<p>Find the sum of the first 8 terms of an arithmetic sequence where the first term is 4, and the last term is 18.</p>", "image": "", "options": ["44", "88", "176", "100", "72"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-88a6b16214.jpg", "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сумма арифметической прогрессии: n<span class=\"fr\"><span>a₁ + aₙ</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8 · <span class=\"fr\"><span>4 + 18</span><span>2</span></span> = 88.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — без деления на 2.</li><li>A — делили на 4.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не нужна разность — достаточно первого и последнего.</div></div>"}, {"id": 27, "text": "<p>Given the functions:</p><ul><li>\\(f(x)=2x+k\\)</li><li>\\(g(x)=3x-4\\)</li></ul><p>If the composite function \\((f\\circ g)(x)=6x-5\\), what is the value of the constant k?</p>", "image": "", "options": ["k=-3", "k=0", "k=3", "k=5", "k=11"], "correct": 2, "verified": true, "src": "M39", "orig": "images/q-3901d2a795.jpg", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем f(g(x)) и сравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2(3x − 4) + k = 6x − 8 + k.</li><li>−8 + k = −5 → k = 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li><li>B, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сравнивайте свободные члены.</div></div>"}, {"id": 28, "text": "<p>Which value of x satisfies the following equation: \\(\\sqrt{4x - 4} + x = 9\\)</p>", "image": "", "options": ["1", "2", "3", "4", "5"], "correct": 4, "verified": true, "src": "M39", "orig": "images/q-7fc4620915.jpg", "review": true, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем корень; проверяем корни.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√(4x − 4) = 9 − x.</li><li>4x − 4 = 81 − 18x + x² → x² − 22x + 85 = 0 → x = 5 или 17.</li><li>x = 17: 9 − 17 < 0 ✗. x = 5: √16 = 4 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — не удовлетворяют уравнению.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подстановка вариантов здесь самая быстрая.</div></div>"}, {"id": 30, "text": "<p>30 Question</p><p>Quadrilateral PQRS is a parallelogram. If the diagonals are congruent, which statement must be true?</p>", "image": "", "options": ["Quadrilateral PQRS is a square", "Quadrilateral PQRS is a rectangle", "Quadrilateral PQRS is a rhombus", "Quadrilateral PQRS is a kite", "None of the above"], "correct": 1, "verified": true, "src": "M39", "orig": "images/q-431b864bdd.jpg", "topic": "M5.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Параллелограмм с равными диагоналями — прямоугольник.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Равные диагонали → все углы прямые.</li><li>Это прямоугольник (не обязательно квадрат).</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — квадрат требует ещё равных сторон.</li><li>C — ромб: перпендикулярные диагонали.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Равные диагонали — прямоугольник; перпендикулярные — ромб.</div></div>"}, {"id": 31, "topic": "M2.4", "text": "<p>I think of a number, multiply it by 5, subtract 4, then divide by 3. The answer is 12.</p><p>What was my number?</p>", "image": "", "options": ["6", "8", "9", "10", "36"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обратные действия в обратном порядке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 · 3 = 36, + 4 = 40, : 5 = 8. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — при обратном ходе нужно прибавить 4.</li><li>D — нарушили порядок обратных действий.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Последнее действие отменяется первым.</div></div>", "src": "PL"}, {"id": 32, "topic": "M2.14", "text": "<p>By rounding each number to 1 significant figure, estimate \\(\\dfrac{4.87 \\times 61.3}{0.512}\\).</p>", "image": "", "options": ["60", "150", "300", "600", "6000"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Округлите до 1 значащей цифры: 5, 60, 0,5.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>5 · 60 : 0,5 = 600. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — умножили на знаменатель.</li><li>C — забыли разделить.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Деление на 0,2 — то же, что умножение на 5.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">5 questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],

  function schedule(){ clearTimeout(pending); pending = setTimeout(draw, 60); }

  });
})();
