<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "Find the y-intercept of f(x) = 2x² − 11x.", "options": ["0", "11/2", "2/11", "1/2", "5"], "correct": 0, "src": "M3", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Точка пересечения с осью y — это значение функции при x = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Подставляем x = 0: f(0) = 2·0² − 11·0.</li><li>f(0) = 0, значит, график проходит через начало координат (0; 0).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B <span class=\"fr\"><span>11</span><span>2</span></span> — это второй корень, точка пересечения с осью <b>x</b>.</li><li>C, D, E — случайные числа, не f(0).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> y-intercept → подставь x = 0; x-intercepts → реши f(x) = 0. Не путай.</div></div>"}, {"text": "p is directly proportional to √q. When q = 25, p = 10. What is p when q = 36?", "options": ["12", "4", "8", "6", "16"], "correct": 0, "src": "M7", "id": 2, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">«Прямо пропорционально √q» записываем как p = k√q и находим k.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>p = k√q.</li><li>10 = k·√25 = 5k → k = 2.</li><li>При q = 36: p = 2·√36 = 2·6 = 12.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — ошибки в k или забыли корень.</li><li>E (16) — пропорциональность к q, а не к √q.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Любая пропорциональность: сначала найди коэффициент k из известной пары значений.</div></div>"}, {"id": 3, "text": "Given 19 > x ≥ 1 and y = 6/(x − 7), what is the range of values of y?", "options": ["−1 ≤ y ≤ 1/2", "y ≤ −1 or y > 1/2", "y < −1 or y < 1/2", "−1 < y < 1/2", "y ≥ 1/2"], "correct": 1, "src": "M4", "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = <span class=\"fr\"><span>6</span><span>x − 7</span></span> — гипербола с разрывом при x = 7. Разбиваем промежуток на две части: левее и правее 7.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>При 1 ≤ x < 19 знаменатель x − 7 меняется от −6 до 12, причём x ≠ 7.</li><li>Левая часть: −6 ≤ x − 7 < 0. При x − 7 = −6 получаем y = −1; при приближении к 0 y → −∞. Значит, y ≤ −1.</li><li>Правая часть: 0 < x − 7 < 12. При x − 7 → 12 получаем y → <span class=\"fr\"><span>6</span><span>12</span></span> = ½ (не достигается); при x − 7 → 0 y → +∞. Значит, y > ½.</li><li>Итого: y ≤ −1 или y > ½.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — диапазон «между» −1 и ½; как раз эти значения y <b>не</b> принимает.</li><li>C — неверные знаки неравенств.</li><li>E — потеряна левая ветвь (y ≤ −1).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Следите за концами: x = 1 включён (≤, значит y = −1 входит), x = 19 не включён (> ½, строго).</div></div>"}, {"id": 4, "text": "Find x.", "image": "images/q-03baabab3d.png", "options": ["6√2", "4√2", "3√3", "√2", "8"], "correct": 0, "src": "M2", "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">На рисунке прямоугольный треугольник с углом 45° — значит, он равнобедренный (45-45-90).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Углы 90° и 45° → третий угол тоже 45°.</li><li>Значит, катеты равны: оба по 6.</li><li>Гипотенуза в треугольнике 45-45-90 = катет · √2.</li><li>x = 6√2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (4√2), D (√2) — другая длина катета.</li><li>C (3√3) — пропорции треугольника 30-60-90.</li><li>E (8) — не по формуле.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Запомни: 45-45-90 → стороны 1 : 1 : √2; 30-60-90 → 1 : √3 : 2.</div></div>"}, {"id": 5, "text": "At which value of x does the quadratic function −x² − 12x − 28 reach its maximum?", "options": ["4", "6", "−6", "1/2", "3"], "correct": 2, "src": "M2", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Максимум параболы y = ax² + bx + c (при a < 0) достигается в вершине x = <span class=\"fr\"><span>−b</span><span>2a</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = −1, b = −12.</li><li>x = <span class=\"fr\"><span>−b</span><span>2a</span></span> = −<span class=\"fr\"><span>−12</span><span>2·(−1)</span></span> = <span class=\"fr\"><span>12</span><span>−2</span></span> = −6.</li><li>a < 0 — ветви вниз, значит, это максимум.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (6) — потеряли знак минус.</li><li>A, D, E — не по формуле вершины.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Знак в формуле <span class=\"fr\"><span>−b</span><span>2a</span></span> — самая частая ошибка. Проверь: −(−6)² − 12·(−6) − 28 = 8 — больше, чем в соседних точках.</div></div>"}, {"id": 6, "text": "A 3 by 4 rectangle is inscribed in a circle. What is the circumference of the circle?", "options": ["4π", "5π", "2.5π", "10π", "3π"], "correct": 1, "src": "M1", "topic": "M5.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Прямоугольник, вписанный в окружность: его диагональ — это диаметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диагональ = √(3² + 4²) = √25 = 5.</li><li>Диаметр d = 5.</li><li>Длина окружности C = πd = 5π.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (2,5π) — это πr, а не 2πr.</li><li>D (10π) — взяли 5 как радиус.</li><li>A, E — по сторонам, а не по диагонали.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Египетский треугольник 3-4-5 встречается очень часто — узнавай его сразу.</div></div>"}, {"text": "If r builders build s houses in t days, how many builders are needed to build x houses in y days?", "options": ["xy/(str)", "rt/(sxy)", "rtx/(sy)", "rsx/(ty)", "sty/(rx)"], "correct": 2, "src": "M5", "id": 7, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем в «строителе-днях»: сколько работы нужно на один дом.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>r строителей за t дней = rt строитель-дней, и это s домов.</li><li>Один дом = <span class=\"fr\"><span>rt</span><span>s</span></span> строитель-дней.</li><li>x домов = <span class=\"fr\"><span>rtx</span><span>s</span></span> строитель-дней.</li><li>Сделать за y дней → строителей нужно <span class=\"fr\"><span>rtx</span><span>sy</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — переставлены множители. Проверка здравым смыслом: больше домов (x) → больше строителей (x в числителе); больше дней (y) → меньше строителей (y в знаменателе). Подходит только C.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяй ответ «логикой направлений»: что должно увеличивать результат — в числителе, что уменьшать — в знаменателе.</div></div>"}, {"text": "Two tins hold equal volumes of paint. The first is used to paint an equilateral triangle of side 25 cm. The second is used to paint 25 smaller equilateral triangles. What is the side of one smaller triangle?", "options": ["1", "5", "2", "10", "None of these"], "correct": 1, "src": "M5", "id": 8, "topic": "M3.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Одинаковое количество краски → одинаковая <b>площадь</b>. Площади подобных фигур относятся как квадраты сторон.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь большого треугольника = 25 площадей маленьких.</li><li>Отношение площадей 25 : 1 → отношение сторон √25 = 5 : 1.</li><li>Сторона маленького = 25 ÷ 5 = 5 см.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (1) — поделили 25 на 25: путают площадь и длину.</li><li>C, D — не согласуются с отношением 5.</li><li>E — ответ есть.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подобие: длины × k → площади × k² → объёмы × k³.</div></div>"}, {"text": "N people board a bus at the terminus. At the first stop half of them get off and one person gets on. At the second stop a third of them get off and one person gets on. There are now 15 passengers. What is N?", "options": ["40", "62", "60", "58", "48"], "correct": 0, "src": "M5", "id": 9, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем, сколько людей в автобусе после каждой остановки, и решаем уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После 1-й остановки: <span class=\"fr\"><span>N</span><span>2</span></span> + 1.</li><li>На 2-й выходит треть → остаётся ⅔ от этого, и заходит 1: ⅔(<span class=\"fr\"><span>N</span><span>2</span></span> + 1) + 1.</li><li>⅔(<span class=\"fr\"><span>N</span><span>2</span></span> + 1) + 1 = 15 → ⅔(<span class=\"fr\"><span>N</span><span>2</span></span> + 1) = 14 → <span class=\"fr\"><span>N</span><span>2</span></span> + 1 = 21 → N = 40.</li><li>Проверка: 40 → 21 → 14 + 1 = 15 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D, E — не проходят проверку (например, 60 → 31 → дробное число людей).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В таких задачах быстрее всего — подставить варианты с конца.</div></div>"}, {"id": 10, "text": "Given x² − 3x + 1 = 0, what is the value of x³ + 1/x³?", "options": ["15", "36", "18", "9", "24"], "correct": 2, "src": "M3", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Делим уравнение на x, получаем x + <span class=\"fr\"><span>1</span><span>x</span></span>, а потом используем формулу куба суммы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 3x + 1 = 0 → делим на x: x − 3 + <span class=\"fr\"><span>1</span><span>x</span></span> = 0 → x + <span class=\"fr\"><span>1</span><span>x</span></span> = 3.</li><li>(x + <span class=\"fr\"><span>1</span><span>x</span></span>)³ = x³ + 3x + <span class=\"fr\"><span>3</span><span>x</span></span> + <span class=\"fr\"><span>1</span><span>x³</span></span> = x³ + <span class=\"fr\"><span>1</span><span>x³</span></span> + 3(x + <span class=\"fr\"><span>1</span><span>x</span></span>).</li><li>x³ + <span class=\"fr\"><span>1</span><span>x³</span></span> = 3³ − 3·3 = 27 − 9 = 18.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (15), D (9) — неправильно вычли 3(x + <span class=\"fr\"><span>1</span><span>x</span></span>).</li><li>B (36), E (24) — другие ошибки в формуле.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шаблон: если известно x + <span class=\"fr\"><span>1</span><span>x</span></span> = a, то x² + <span class=\"fr\"><span>1</span><span>x²</span></span> = a² − 2, x³ + <span class=\"fr\"><span>1</span><span>x³</span></span> = a³ − 3a.</div></div>"}, {"id": 11, "text": "Simplify: (8x³ − 27)/(3 − 2x)", "options": ["6x − (2x+3)²", "−4x² + 6x − 9", "−6x + (2x+3)²", "6x + (2x+3)²", "2x + 3"], "correct": 0, "src": "M2", "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Числитель — разность кубов, знаменатель — та же скобка со знаком минус.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>8x³ − 27 = (2x)³ − 3³ = (2x − 3)(4x² + 6x + 9).</li><li>3 − 2x = −(2x − 3).</li><li>Дробь = −(4x² + 6x + 9) = −4x² − 6x − 9.</li><li>Раскроем вариант A: 6x − (2x + 3)² = 6x − (4x² + 12x + 9) = −4x² − 6x − 9 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (−4x² + 6x − 9) — неверный знак у 6x.</li><li>C, D — неверные знаки при раскрытии скобок.</li><li>E (2x + 3) — забыли разность кубов.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> a³ − b³ = (a − b)(a² + ab + b²). Ответ может быть записан в «замаскированном» виде — раскрой варианты.</div></div>"}, {"id": 12, "text": "The door of a doll's house is 5 times as long as it is wide. The area of the door is 125 cm². What is its width?", "options": ["30 cm", "25 cm", "15 cm", "10 cm", "5 cm"], "correct": 4, "src": "M4", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем ширину w, тогда длина 5w, и пишем площадь.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь = w · 5w = 5w².</li><li>5w² = 125 → w² = 25 → w = 5 см.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (25 см) — это длина, а не ширина.</li><li>A, C, D — не дают площадь 125 (например, 10 × 50 = 500).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 5 × 25 = 125 ✓.</div></div>"}, {"id": 13, "text": "The volume and the surface area of a cube are numerically equal. What is the length of one edge?", "options": ["1", "9", "6", "2", "4"], "correct": 2, "src": "M1", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём куба s³, площадь поверхности 6s². Приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s³ = 6s².</li><li>Делим на s² (s > 0): s = 6.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (1) — тогда объём 1, площадь 6.</li><li>B, D, E — не удовлетворяют s³ = 6s².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> У куба 6 граней, поэтому поверхность 6s².</div></div>"}, {"text": "Evaluate: (√5 − √2)² · (√5 + √2)²", "options": ["9", "−19 − 8√10", "49", "61 + 20√10"], "correct": 0, "src": "M7", "id": 14, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Удобнее сначала перемножить скобки, а потом возвести в квадрат: a²b² = (ab)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(√5 − √2)(√5 + √2) = 5 − 2 = 3 (разность квадратов).</li><li>Произведение квадратов = 3² = 9.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, D — раскрыли каждую скобку отдельно и ошиблись.</li><li>C (49) — сложили, а не вычли (5 + 2 = 7).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a − b)(a + b) = a² − b² — с корнями это убирает иррациональность.</div></div>"}, {"id": 15, "text": "In the diagram, the arcs AD and BC are semicircles and AB = BC = CD. What is the ratio of the shaded region to the whole area?", "image": "images/q-26800374cc.png", "options": ["4/9", "5/9", "2/3", "7/9", "8/9"], "correct": 4, "src": "M2", "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади полукругов пропорциональны квадратам радиусов. Берём удобные длины: AB = BC = CD = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>AD = 3 → радиус большого полукруга <span class=\"fr\"><span>3</span><span>2</span></span>; BC = 1 → радиус маленького ½.</li><li>Площади ∝ r²: большой ∝ <span class=\"fr\"><span>9</span><span>4</span></span>, маленький ∝ <span class=\"fr\"><span>1</span><span>4</span></span>.</li><li>Закрашенная часть = большой − маленький ∝ <span class=\"fr\"><span>9</span><span>4</span></span> − <span class=\"fr\"><span>1</span><span>4</span></span> = <span class=\"fr\"><span>8</span><span>4</span></span>.</li><li>Доля: <span class=\"fr\"><span>8</span><span>4</span></span> ÷ <span class=\"fr\"><span>9</span><span>4</span></span> = <span class=\"fr\"><span>8</span><span>9</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A <span class=\"fr\"><span>4</span><span>9</span></span>, B <span class=\"fr\"><span>5</span><span>9</span></span> — сравнили диаметры, а не квадраты.</li><li>C, D — неверная доля вычитаемой части.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выбирайте удобные числа для длин, если ответ — отношение.</div></div>"}, {"text": "The perimeter of a square of area 4x² is", "options": ["2x", "√2 x", "8x", "2√2 x", "4x"], "correct": 2, "src": "M7", "id": 17, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из площади находим сторону квадрата, потом периметр.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площадь = сторона² = 4x² → сторона = 2x.</li><li>Периметр = 4 · 2x = 8x.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (2x) — это сторона, а не периметр.</li><li>E (4x) — умножили 4 на x, забыв найти сторону.</li><li>B, D — ошибочные корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √(4x²) = 2x (при x > 0).</div></div>"}, {"text": "Solve the inequality: x(2x + 6) ≤ 8", "options": ["x = 1; x = −4", "x ≤ 1; x ≤ −4", "4 ≤ x ≤ −1", "−4 ≤ x ≤ 1"], "correct": 3, "src": "M5", "id": 18, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Переносим всё в одну сторону, раскладываем на множители, смотрим знак параболы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x² + 6x ≤ 8 → 2x² + 6x − 8 ≤ 0 → x² + 3x − 4 ≤ 0.</li><li>(x + 4)(x − 1) ≤ 0, корни −4 и 1.</li><li>Ветви вверх → парабола ≤ 0 между корнями: −4 ≤ x ≤ 1.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это только точки, где равно 8.</li><li>B — «x ≤ 1; x ≤ −4» — неверная область.</li><li>C — «4 ≤ x ≤ −1» — неверные числа и пустое множество.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «≤ 0» при ветвях вверх — между корнями; «≥ 0» — снаружи.</div></div>"}, {"id": 19, "text": "The volume of a cuboid is 1000 m³. If its length, width and height are each increased by 50%, what is the new volume, in m³?", "options": ["3375", "3500", "1500", "5000", "50000"], "correct": 0, "src": "M2", "topic": "M3.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждое измерение увеличивается в 1,5 раза → объём в 1,5³ раза.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1,5³ = 3,375.</li><li>1000 × 3,375 = 3375 м³.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (1500) — увеличили объём только на 50%.</li><li>B, D, E — неверный множитель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Увеличение длин на p% меняет объём в (1 + <span class=\"fr\"><span>p</span><span>100</span></span>)³ раз.</div></div>"}, {"id": 20, "text": "Find the equation whose roots are each 1 greater than the roots of x² − 3x − 4 = 0.", "options": ["x² − 5x = 0", "x² + 5x = 0", "x² + 2x + 6 = 0", "x² + 4x = 0", "x² − 4x + 2 = 0"], "correct": 0, "src": "M2", "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим корни исходного уравнения, сдвигаем на 1 и собираем новое уравнение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² − 3x − 4 = (x − 4)(x + 1) → корни 4 и −1.</li><li>Новые корни: 5 и 0.</li><li>Уравнение: (x − 5)(x − 0) = x² − 5x = 0.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (x² + 5x) — корни 0 и −5 (сдвиг в другую сторону).</li><li>D (x² + 4x) — корни 0 и −4.</li><li>C, E — сумма/произведение корней не совпадают (сумма должна быть 5, произведение 0).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте через Виета: сумма корней = −b, произведение = c (при a = 1).</div></div>"}, {"id": 21, "text": "If 40% of x is equal to 160% of y, what is the value of (3x − 12y)/5?", "options": ["3", "1", "2", "4", "0"], "correct": 4, "src": "M1", "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из условия выражаем x через y и подставляем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>40% x = 160% y → 0,4x = 1,6y → x = 4y.</li><li>3x − 12y = 12y − 12y = 0.</li><li>0 ÷ 5 = 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A–D — получаются, если неверно выразить x (например, x = <span class=\"fr\"><span>y</span><span>4</span></span>).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала упростите связь (x = 4y), потом подставляйте.</div></div>"}, {"id": 22, "text": "x, y and z are positive numbers such that xy = 24, xz = 48 and yz = 72. What is x + y + z?", "options": ["96", "22", "62", "50", "36"], "correct": 1, "src": "M2", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Перемножим все три равенства — получим (xyz)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(xy)(xz)(yz) = (xyz)² = 24 · 48 · 72 = 82 944.</li><li>xyz = 288.</li><li>x = <span class=\"fr\"><span>288</span><span>yz</span></span> = <span class=\"fr\"><span>288</span><span>72</span></span> = 4; y = <span class=\"fr\"><span>288</span><span>48</span></span> = 6; z = <span class=\"fr\"><span>288</span><span>24</span></span> = 12.</li><li>x + y + z = 22.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (96), C (62), E (36) — сумма произведений или другие ошибки.</li><li>D (50) — неверные значения переменных.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 4·6 = 24, 4·12 = 48, 6·12 = 72 ✓.</div></div>"}, {"id": 23, "text": "If x = −8, what is the value of x^(2/3) + 2x⁰?", "options": ["−2", "4", "−4", "6", "−6"], "correct": 3, "src": "M1", "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дробная степень: x<sup>2⁄3</sup> = (∛x)². Любое число в нулевой степени = 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>∛(−8) = −2.</li><li>(−2)² = 4.</li><li>x⁰ = 1, 2x⁰ = 2.</li><li>4 + 2 = 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, E — отрицательный результат: ошибка со знаком при возведении в квадрат.</li><li>B (4) — забыли 2x⁰.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала извлекайте корень, потом возводите в степень — так проще и без ошибок со знаком.</div></div>"}, {"id": 24, "text": "A cube is inscribed in a sphere of radius 3. What is the volume of the cube?", "options": ["12√3", "24√3", "3√3", "48√3", "72√3"], "correct": 1, "src": "M1", "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Куб, вписанный в шар: диагональ куба = диаметр шара.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Диагональ куба со стороной s: s√3.</li><li>s√3 = 2 · 3 = 6 → s = <span class=\"fr\"><span>6</span><span>√3</span></span> = 2√3.</li><li>Объём: (2√3)³ = 8 · 3√3 = 24√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (12√3) — ошибка при возведении в куб.</li><li>D, E — взяли диаметр как сторону или забыли √3.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагональ грани — s√2, пространственная диагональ — s√3.</div></div>"}, {"id": 25, "text": "Find m such that (f∘g)(x) = (g∘f)(x), where f(x) = 3x + 1 and g(x) = 2x − m.", "options": ["−1/2", "1/2", "2", "6", "Cannot be determined"], "correct": 0, "src": "M2", "topic": "M4.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем обе композиции и приравниваем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>f(g(x)) = 3(2x − m) + 1 = 6x − 3m + 1.</li><li>g(f(x)) = 2(3x + 1) − m = 6x + 2 − m.</li><li>6x − 3m + 1 = 6x + 2 − m → −2m = 1 → m = −½.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B (½) — ошибка в знаке.</li><li>C, D — неправильное раскрытие скобок.</li><li>E — m находится однозначно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> f∘g = f(g(x)): сначала g, потом f.</div></div>"}, {"id": 26, "text": "5 apples, 3 pears and 2 bananas cost £3.18. 4 apples, 8 pears and 3 bananas cost £4.49. How much more does an apple cost than a pear?", "options": ["5p", "6p", "7p", "8p", "More information is needed"], "correct": 3, "src": "M4", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Неизвестных три, уравнений два — но нужна только разность a − p. Исключаем бананы.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>В пенсах: 5a + 3p + 2b = 318 и 4a + 8p + 3b = 449.</li><li>Умножим первое на 3, второе на 2: 15a + 9p + 6b = 954; 8a + 16p + 6b = 898.</li><li>Вычтем: 7a − 7p = 56 → a − p = 8 пенсов.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — арифметические ошибки при вычитании.</li><li>E — данных достаточно, ведь нужна только разность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не спешите отвечать «нужно больше данных» — часто нужная комбинация находится.</div></div>"}, {"text": "Lori inherited 40% of her father's estate. After paying tax of 30% on the inheritance, what percentage of her father's estate does she keep?", "options": ["10%", "12%", "25%", "28%", "30%"], "correct": 3, "src": "M7", "id": 27, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Процент от процента — перемножаем доли.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наследство: 40% = 0,4 состояния.</li><li>Остаётся после налога 70%: 0,4 × 0,7 = 0,28.</li><li>28% состояния.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (10%) — вычли 40 − 30.</li><li>B (12%) — посчитали налог (0,4 × 0,3), а не остаток.</li><li>E (30%) — взяли процент налога.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «После налога 30%» = остаётся 70%.</div></div>"}, {"id": 28, "text": "At which positive value of x does the parabola y = (x − 1)² − 4 cross the x-axis?", "options": ["−2", "3", "−1", "−3", "1"], "correct": 1, "src": "M1", "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Пересечение с осью x — там, где y = 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(x − 1)² − 4 = 0 → (x − 1)² = 4.</li><li>x − 1 = ±2 → x = 3 или x = −1.</li><li>Положительный корень — 3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (−1) — второй корень, но отрицательный.</li><li>E (1) — это x вершины.</li><li>A, D — неверные знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Форма (x − h)² + k сразу даёт вершину (h; k) и упрощает решение.</div></div>"}, {"id": 29, "text": "If x = 1 + √2, what is the value of x² − 2x + 1?", "options": ["1 + √2", "√2 − 1", "2", "√2", "2 + √2"], "correct": 2, "src": "M3", "topic": "M4.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Узнаём формулу квадрата разности: x² − 2x + 1 = (x − 1)².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x − 1 = √2.</li><li>(x − 1)² = (√2)² = 2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — подставили, но не упростили.</li><li>B, D — забыли возвести в квадрат.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перед подстановкой иррационального числа ищите формулу сокращённого умножения.</div></div>"}, {"id": 30, "text": "A father is three times as old as his son and the sum of their ages is 76 years. How old is the son?", "options": ["19", "21", "25", "31"], "correct": 0, "src": "M3", "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Обозначаем возраст сына s, отца 3s, складываем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>s + 3s = 76 → 4s = 76 → s = 19.</li><li>Проверка: отцу 57, 57 + 19 = 76 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — сумма с утроенным возрастом не даёт 76 (например, 21 + 63 = 84).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Всегда делайте быструю проверку подстановкой.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

    background: #fff; padding: 4px; -webkit-user-drag: none; user-drag: none;
    pointer-events: none;
  }
  .pl-scroll .pl-text { margin-bottom: 12px; line-height: 1.55; }
  .pl-scroll .pl-opts { display: flex; flex-direction: column; gap: 7px; }
  .pl-scroll .pl-opt {
    text-align: left; font: 400 14.5px 'Inter', system-ui, sans-serif; color: inherit;
    cursor: pointer; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 14px;
    transition: border-color .15s, background .15s;
  }
  .pl-scroll .pl-opt:hover { border-color: rgba(142,173,210,0.55); }
  .pl-scroll .pl-opt.sel {
    background: rgba(142,173,210,0.18); border-color: rgba(142,173,210,0.85);
  }
  .pl-bar {
    position: sticky; bottom: 0; display: flex; gap: 14px; align-items: center;
    justify-content: space-between; margin-top: 8px; padding: 12px 4px;
    background: rgba(21,24,29,0.9); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .pl-bar .pl-count { font: 500 13px 'Inter', system-ui, sans-serif; opacity: .75; }
  .pl-bar .pl-submit {
    font: 600 14px 'Inter', system-ui, sans-serif; color: #fff; cursor: pointer; border: 0;
    background: linear-gradient(90deg,#8EADD2,#8EADD2,#C9AA6A);
    padding: 11px 26px; border-radius: 999px;
  }
  .pl-noselect, .pl-noselect * {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  @media print { body.pl-noprint * { display: none !important; } }
</style>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  #pl-gate h3{font-family:Sora,Inter,sans-serif;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}

  #pl-gate .back{background:transparent;border:1px solid rgba(255,255,255,.18);color:#DADDE2}
</style>
<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
