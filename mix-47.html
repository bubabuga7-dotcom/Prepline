<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m031_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Внутренний + внешний = 180°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Внешний = <span class=\"fr\"><span>180 − 150</span><span>2</span></span> = 15°.</li><li>n = <span class=\"fr\"><span>360</span><span>15</span></span> = 24.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный внешний угол.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Через внешний угол — проще всего.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m031_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">20:24 = 8:24.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Минутная: 24 · 6 = 144°.</li><li>Часовая: 8 · 30 + 24 · 0,5 = 252°.</li><li>252 − 144 = 108°.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — без сдвига часовой стрелки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Часовая стрелка: 0,5° в минуту.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m031_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x(y + 1) = xy + x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = <span class=\"fr\"><span>5</span><span>3</span></span> − <span class=\"fr\"><span>7</span><span>6</span></span> = ½; y = <span class=\"fr\"><span>7</span><span>2</span></span> − <span class=\"fr\"><span>7</span><span>6</span></span> = <span class=\"fr\"><span>7</span><span>3</span></span>.</li><li>(x + 1)(y + 1) = <span class=\"fr\"><span>3</span><span>2</span></span> · <span class=\"fr\"><span>10</span><span>3</span></span> = 5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — арифметика.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Или: xy + x + y + 1 = <span class=\"fr\"><span>7</span><span>6</span></span> + ½ + <span class=\"fr\"><span>7</span><span>3</span></span> + 1 = 5.</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m031_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Продолжения AC и HF отсекают по 1 с каждой стороны от DE.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Внешний угол восьмиугольника 45°: C выше D на <span class=\"fr\"><span>1</span><span>√2</span></span> и левее на <span class=\"fr\"><span>1</span><span>√2</span></span>.</li><li>Прямая AC доходит до уровня DE ещё на 1 − <span class=\"fr\"><span>1</span><span>√2</span></span> левее.</li><li>PD = 1, EQ = 1 → PQ = 3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный наклон AC.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно ввести координаты.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m031_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отмеченные углы — углы двух многоугольников, образованных пересечением.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Каждая тройка отмеченных углов вместе с углом пересечения даёт 360° вокруг точки/в четырёхугольнике.</li><li>Итого 2 · 360° = 720°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный счёт.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма углов четырёхугольника 360°.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m031_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона квадрата 5, ромб QRTU со стороной 5 и высотой <span class=\"fr\"><span>20</span><span>5</span></span> = 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>U = (3; 4) относительно Q.</li><li>Часть ромба вне квадрата — треугольник с катетами 3 и 4: 6.</li><li>Внутри квадрата: 20 − 6 = 14 → закрашено 25 − 14 = 11.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — 25 − 20.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> QU = 5, высота 4 → сдвиг 3 (3-4-5).</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m031_q07.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2(a + b) = 3(a − b).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a = 5b → 5 : 1.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки в знаках.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: 12 = 3 · 4 ✓.</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m031_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем варианты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>60 + 30 = 90; 24 − 9 = 15 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не дают сумму 90 или разницу 15.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сначала проверьте сумму.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m031_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">2x + 3y = 6x − y → y = x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>7x − x</span><span>2x</span></span> = 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите связь x и y.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m031_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">AI = IY, угол при Y между севером (на A) и I — 60° → треугольник равносторонний.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Обратный пеленг: 060° + 180° = 240°.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный пеленг ±180°.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m031_q12.webp", "options": ["A", "B", "C", "D"], "correct": 0, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Теорема синусов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>PR</span><span>sin</span></span> 45° = <span class=\"fr\"><span>√6</span><span>sin</span></span> 60°.</li><li>PR = √6 · <span class=\"fr\"><span><span class=\"fr\"><span>√2</span><span>2</span></span></span><span><span class=\"fr\"><span>√3</span><span>2</span></span></span></span> = 2.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный угол.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Против известной стороны — известный угол.</div></div>"}, {"id": 13, "text": "", "image": "images/math-new/m031_q13.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">ab² = const.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>144 = 4b² → b = 6.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — b².</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-44.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m031_q14.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 3, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подстановка.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2 · 9 · 10⁻⁶ · 2,5 · 10⁴ = 0,45 = 4,5 · 10⁻¹.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не стандартная форма.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 1 ≤ a &lt; 10.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m031_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вычитаем дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>n + 1</span><span>n + 2</span></span> − <span class=\"fr\"><span>n</span><span>n + 1</span></span> = <span class=\"fr\"><span>1</span><span>(n + 1)(n + 2)</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-25.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m031_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.12", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Нет пересечения ⇔ D &lt; 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 и 4: x² + x + 5 = 0, D &lt; 0.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные пары пересекаются.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приравняйте.</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m031_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Основание 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>n = 2p + 3q.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 8 = 2³.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> 4 = 2², 8 = 2³.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m031_q19.webp", "options": ["A", "B", "C", "D", "E", "F"], "correct": 4, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">× 15: 15 : 10 : 12.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>C = 12 частей = 3000 → часть 250.</li><li>37 · 250 = 9250.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (9000) — ключ ошибочен.</li><li>A — C = <span class=\"fr\"><span>4</span><span>5</span></span> целого.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-8. (Исходный ключ D — исправлено.)</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m031_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">p + q = 3p − 3q → p = 2q.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>2q²</span><span>5q²</span></span> = <span class=\"fr\"><span>2</span><span>5</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте q = 1.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m031_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Отражение в оси x, затем поворот по часовой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(3; −4) → (3; 4) → (4; −3).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — против часовой.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> По часовой: (x; y) → (y; −x).</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m031_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2a + b = 7; −a + 4b = 7 → a = b = <span class=\"fr\"><span>7</span><span>3</span></span>.</li><li>a + b = <span class=\"fr\"><span>14</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вычтите уравнения.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m031_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Четыре четверти = круг.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2r)² − πr² = r²(4 − π).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — знак.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сторона квадрата 2r.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m031_q24.webp", "options": ["A", "B", "C", "D", "E", "F", "G"], "correct": 3, "topic": "M3.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">0,5 · 1,2 · 0,7 = 0,42.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>84 / 0,42 = 200.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — сложили проценты.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Множители перемножаются.</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m031_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² + 2x − 8 ≥ 0 → (x + 4)(x − 2) ≥ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x ≤ −4 или x ≥ 2.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знаки корней.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ≥ 0 — снаружи.</div></div>"}, {"id": 26, "text": "", "image": "images/math-new/m031_q26.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вторая дробь — четверть первой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(1 + ¼) = <span class=\"fr\"><span>5</span><span>4</span></span> → <span class=\"fr\"><span>5√11</span><span>3√11 + 16</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — изменён знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Выносите общий множитель.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m031_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Z + 35 + Z = 140.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Z = 52,5, M = 87,5 → 5 : 3.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сократите на 17,5.</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m031_q28.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 6, "topic": "M2.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">НОК = 180 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3600 / 180 = 20.</li></ol><div class=\"ex-a\">Ответ: <b>G</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный НОК.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Тот же вопрос был в mix-5.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m031_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый вписанный квадрат — половина площади предыдущего.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>256 → 128 → 64 → 32.</li><li>Закрашено: 64 − 32 = 32.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — 16.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вершины на серединах → площадь ÷ 2.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m031_q30.webp", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "correct": 2, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">½ · a · 2a = 18 → a² = 18.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>c² = a² + 4a² = 90 → 3√10.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> c = a√5.</div></div>"}, {"id": 31, "topic": "M5.17", "text": "<p>Two similar solid statues are made of the same metal. Their heights are in the ratio 2 : 3. The smaller has mass 432 g.</p><p>What is the mass of the larger?</p>", "image": "", "options": ["648 g", "972 g", "1458 g", "1890 g", "2916 g"], "correct": 2, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Масса ∝ объём ∝ k³.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>k³ = (3/2)³ = <span class=\"fr\"><span>27</span><span>8</span></span>.</li><li>432 · <span class=\"fr\"><span>27</span><span>8</span></span> = 1458 г. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — масса пропорциональна объёму — k³, а не k.</li><li>B — k² — это для площади.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Один материал — масса растёт как объём.</div></div>", "src": "PL"}, {"id": 32, "topic": "M5.10", "text": "<p>A circle has equation \\((x + 1)^2 + (y - 4)^2 = 9\\).</p><p>What are its centre and radius?</p>", "image": "", "options": ["centre (−1, 4), radius 3", "centre (4, −1), radius 3", "centre (−1, 4), radius 9", "centre (1, −4), radius 3", "centre (1, −4), radius 9"], "correct": 0, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x − a)² + (y − b)² = r²: центр (a; b), радиус r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Центр (−1; 4), r = √9 = 3. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — перепутали координаты.</li><li>C — радиус — корень из правой части.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минус в скобке — плюс в координате и наоборот.</div></div>", "src": "PL"}];
let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
