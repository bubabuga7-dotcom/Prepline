<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "In the UK, most people open a bank account in their teenage years. There is then a tendency not to change banks: eleven per cent of bank customers are still with the bank their parents set them up with when they were a child and haven’t changed it since. This strongly suggests that, contrary to what most commentators say, people are not unhappy with the service that their banks provide.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>", "options": ["Nearly two-thirds of UK bank customers have changed banks and two per cent have switched over five times.", "Bank customers say that they feel that all banks provide the same level of service.", "Nearly two-thirds of customers say they are happy with their bank’s service.", "Bank services change as people get older and their needs change.", "It is not difficult to change banks."], "correct": 0, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод опирается на «тенденцию не менять банк», а доказательство — всего 11% клиентов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если почти две трети клиентов меняли банк, а некоторые — больше пяти раз, то никакой тенденции оставаться нет.</li><li>Значит, люди как раз уходят — вероятно, потому что недовольны. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — тоже немного ослабляет, но не опровергает сам факт, на котором стоит вывод.</li><li>C — усиливает вывод.</li><li>D, E — не говорят, довольны ли люди.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сильнее всего ослабляет вариант, который опровергает главный факт аргумента.</div></div>"}, {"id": 2, "text": "The United States attempts to reduce the supply of illegal drugs by intercepting shipments and eradicating illegal crops. Despite these efforts, illegal drugs are still readily available, because growers, for example those in Colombia, move to different areas and plant smaller plots that are harder to find. So more effort should be made to reduce demand. This does not simply mean reducing the total number of people using illegal drugs. Because the important task is to cut consumption by heavy users, drug-dependent criminals in the country's jails should be treated for their addiction. In this way drug-related social problems can be reduced.<br><br><b>Which one of the following, if true, most strengthens the above argument?</b>", "options": ["The price of drugs has not fallen despite efforts to reduce their supply.", "Statistics show that many crops of illegal drugs in Colombia have been eradicated.", "Most of the drug users in US jails do not want treatment for their drug addiction.", "Heavy drug users are responsible for committing most of the drug-related crime.", "The majority of the US public are in favour of rehabilitating prisoners who are drug users."], "correct": 3, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Усилить — подтвердить связь «лечить тяжёлых наркоманов в тюрьмах → меньше социальных проблем».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор считает, что важнее всего снизить потребление тяжёлыми наркоманами.</li><li>Если именно они совершают большинство преступлений, лечение действительно уменьшит проблемы. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — про предложение наркотиков, а не про спрос.</li><li>C — ослабляет: лечиться они не хотят.</li><li>E — мнение публики не доказывает, что мера сработает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите вариант, который закрывает пробел между причиной и результатом.</div></div>"}, {"id": 3, "text": "The effect of shortening degree courses at universities from three years to two would be that students would have two-thirds as much time to think about their subject. The result would be graduates whose understanding of their subject was shallower and whose intellectual development was much less extended. Any measure that leads to a lowering of the quality of graduates should be resisted by universities.<br><br><b>Which one of the following conclusions can reliably be drawn from the above passage?</b>", "options": ["University graduates at present have an in-depth understanding of their subject.", "Universities should oppose the shortening of degree courses to two years.", "Universities are not proposing to reduce the length of degree courses to two years.", "Students should oppose moves by universities to shorten degree courses.", "Universities should adopt more rigorous standards for the award of degrees."], "correct": 1, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод должен следовать из текста напрямую, без новых идей.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Короткий курс → выпускники хуже.</li><li>Всё, что ухудшает выпускников, университеты должны отвергать.</li><li>Значит, университеты должны выступать против двухлетних курсов. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — про нынешних выпускников ничего не сказано.</li><li>C — текст не говорит, что предлагают университеты.</li><li>D — речь о студентах, а не об университетах.</li><li>E — новая идея.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Соедините две посылки: «X ведёт к Y» + «всё, что ведёт к Y, плохо».</div></div>"}, {"id": 4, "text": "Scientists are now developing genetically modified crop plants that produce their own pesticide. But pesticides are only effective if they are not overused; if they are applied continuously for long periods, then the pests that they are supposed to kill develop resistance to them. Pesticides only remain effective against pests, therefore, if periods are left during which they are not used. The genetically modified crop plants will produce pesticides continuously.<br><br><b>Which of the following is a conclusion that can reliably be drawn from the above passage?</b>", "options": ["The pesticides produced by the genetically modified crop plants become ineffective against pests.", "The genetic modification of crop plants will make the crops unusable, as they will be contaminated with pesticide.", "The genetically modified crop plants will help to prevent the overuse of pesticides.", "The development of genetically modified crop plants will enable more effective use of pesticides, since periods may be left when they are not used.", "The development of genetically modified crop plants will mean that pesticides need no longer be sprayed onto fields."], "correct": 0, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Соединяем посылки.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Пестициды работают, только если есть перерывы.</li><li>ГМ-растения выделяют пестицид непрерывно, без перерывов.</li><li>Значит, их пестициды перестанут действовать. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — про заражение урожая в тексте нет.</li><li>C, D — противоречат тексту: перерывов не будет.</li><li>E — слишком далеко от текста.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод — то, что обязательно следует из всех посылок вместе.</div></div>"}, {"id": 5, "text": "It is not always clear whether a doctor should tell the truth to a patient or not. On the one hand, patients have a right to know what is the matter with them and what the future holds, so that they can make their own informed decisions, however upsetting the truth may be. It is a simple issue of human rights. But on the other hand, a patient's health may sometimes be better served by not knowing a frightening truth. For instance, a doctor may believe that a patient's medical condition will actually worsen if they realise how serious it is. Therefore, there are cases in which doctors have no choice: they must decide in favour of deceiving the patient.<br><br><b>Which of the following is an underlying assumption of the above argument?</b>", "options": ["Patients accept that a doctor has a responsibility to decide what will be in their best interests.", "Doctors have a duty to conceal the truth if they believe it will frighten the patient.", "Doctors have a duty to tell their patients the truth even when the truth would upset them.", "Doctors have a greater responsibility for a patient's well-being than for their right to know the truth.", "It is the responsibility of doctors to respect a patient's human rights whatever their medical condition."], "correct": 3, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Допущение — то, без чего вывод не работает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Автор признаёт два права: знать правду и быть здоровым.</li><li>Вывод: иногда врач обязан обмануть.</li><li>Это верно, только если здоровье пациента важнее права знать правду. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — про мнение пациентов не нужно.</li><li>B — слишком широко: «если напугает» ≠ «если навредит».</li><li>C, E — противоречат выводу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: отрицаем вариант. Если права важнее — вывод рушится. Значит, D — допущение.</div></div>"}, {"id": 6, "text": "In European countries the incidence of cancer is higher than in non-European developing countries. This difference in cancer rates cannot be due to a greater genetic susceptibility to cancer amongst Europeans, because statistics show that Europeans who migrate to developing countries decrease their chances of getting cancer and that those from developing countries who migrate to Europe increase their chances of getting cancer. Since there are major differences in diet between Europe and developing countries, it is reasonable to conclude that the higher cancer rates in Europe are due to certain cancer-causing foods.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["Diet is not a major cause of cancer in developing countries.", "Southern European countries have far lower cancer rates than countries in Northern Europe.", "Stress is a contributory cause of cancer and Europeans experience higher than average stress in their daily lives.", "Diet is a contributory cause of many other health problems besides cancer.", "People who migrate from developing countries to Europe are relatively young and healthy."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор объясняет разницу в раке диетой. Ослабить — дать другую причину, тоже связанную с жизнью в Европе.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Миграция показывает: дело в образе жизни, а не в генах.</li><li>Но если европейцы живут в стрессе, а стресс вызывает рак — причиной может быть стресс, а не еда. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — про развивающиеся страны, не объясняет Европу.</li><li>B — различия внутри Европы не опровергают роль диеты.</li><li>D — про другие болезни.</li><li>E — может объяснить переезжающих, но не всю Европу.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина — самый частый способ ослабить.</div></div>"}, {"id": 7, "text": "Athletes who have huge potential to draw both live and television audiences expect to be rewarded financially for their skill and hours of dedication in training. However, large prize money at televised meetings does nothing to help future generations of athletes who need time off work and good facilities to achieve their potential. The only fair solution is to take a levy from top athletes' pay to ensure money is available to help the up-and-coming participants. Otherwise the burden will fall on the general taxpayer, or on the future athletes and their families, with the result that some will inevitably fail simply through lack of money.<br><br><b>Which of the following is an assumption on which the argument depends?</b>", "options": ["The majority of top athletes come from poor backgrounds.", "Countries which give financial help to young athletes produce more winners.", "It is not fair for the general taxpayer to have to subsidise athletics.", "It is not possible to train and have a part-time job.", "Top athletes deserve the large rewards they receive in return for their efforts."], "correct": 2, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор называет решение «единственно справедливым», чтобы бремя не легло на налогоплательщиков.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Он считает, что если платить будут налогоплательщики — это плохо.</li><li>Значит, он допускает: несправедливо, чтобы налогоплательщики финансировали спорт. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — о бедности и победах в тексте речи нет.</li><li>D — слишком сильно: работа мешает, но не обязательно невозможна.</li><li>E — противоположно смыслу сбора.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слово «справедливо» в выводе — ищите допущение о справедливости.</div></div>"}, {"id": 8, "text": "One of the most catastrophic scenarios that could hit this planet would be a world without fish. Surely this is a matter for the UN to act on - and swiftly. Areas of ocean should be set aside as no-go zones for trawlers of any nationality, to enable our dwindling fish stocks to have somewhere to reproduce with impunity. We are told that farmed fish is just as good, but this is futile if the wild fish that are fed to the farmed fish disappear. This crisis should be moved right to the top of the global agenda.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["At present fish cannot reproduce safely in the wild.", "There is not enough publicity about the fishing crisis.", "Farmed fish does not taste as good as wild fish.", "Fish farming is impossible without wild fish as food.", "Foreign trawlers are responsible for dwindling fish stocks."], "correct": 3, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Фраза «выращенная рыба бесполезна, если исчезнет дикая» держится на допущении.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Она работает, только если рыбу на фермах кормят дикой рыбой и без неё фермы невозможны. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно.</li><li>B — про рекламу.</li><li>C — про вкус речи нет.</li><li>E — автор говорит о судах любых стран.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Найдите связку в аргументе, которую автор не доказал.</div></div>"}, {"id": 9, "text": "<b>Choose your answer from the image above:</b>", "options": ["A", "B", "C", "D", "E"], "correct": 0, "src": "MC", "image": "images/q-dd00338267.png", "topic": "MC", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — тезис, который всё остальное поясняет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первая фраза: этическое слово ничего не добавляет к фактам.</li><li>Пример с кражей и восклицательным знаком — пояснение. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — частный пример.</li><li>C — противоречит тексту.</li><li>D — о чувствах вывода нет.</li><li>E — промежуточная мысль.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пример не может быть главным выводом.</div></div>"}, {"id": 10, "text": "Ecotourism now accounts for twenty per cent of tourists. It should provide a sustainable alternative to overuse of natural resources. However, tourists may introduce new diseases to animal populations. Mongooses and meerkats in Botswana have died from tuberculosis caught from humans, and gorillas in East Africa picked up new internal parasites after the introduction of tourism. Moreover, the presence of humans in increased numbers has been shown to stress polar bears, penguins, dolphins and rainforest birds, affecting their natural routines and reducing breeding success.<br><br><b>Which of the following can reliably be inferred from the above passage?</b>", "options": ["Subtle changes to wildlife health may not be apparent to a casual observer.", "Many ecotourist projects are ecologically viable.", "Dolphins become increasingly frenetic when tourist boats are present.", "Guidelines for ecotourism mostly address obvious issues such as changes in land use or cutting down trees.", "The benefits of sustainable resources may be outweighed by harm to wildlife."], "correct": 4, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод из текста: экотуризм должен помогать природе, но вредит животным.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Туристы заражают животных и вызывают стресс.</li><li>Значит, польза от экотуризма может перекрываться вредом. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — о наблюдателях и правилах в тексте нет.</li><li>B — противоположно.</li><li>C — слишком конкретно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слово «may» делает вывод осторожным — такие обычно верны.</div></div>"}, {"id": 11, "text": "<b>Choose your answer from the image above:</b>", "options": ["A", "B", "C", "D", "E"], "correct": 3, "src": "MC", "image": "images/q-3125e3909e.png", "topic": "MC", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — то, к чему автор подводит словами «It follows that».</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Только экономическое развитие, снижая спрос на большие семьи, решит проблему перенаселения. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — посылки или детали.</li><li>C — не говорится.</li><li>E — противопоставление, а не вывод.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Слова «it follows that / therefore» отмечают вывод.</div></div>"}, {"id": 12, "text": "The recent campaign to reduce the number of people who drive while over the legal alcohol limit was very successful. But reducing it further is going to be difficult without addressing one of the main problems: people in rural areas have no choice, in the absence of public transport, but to use their cars. People who live in towns and cities can use buses, trains or readily available taxis if they want to go out for a drink. Furthermore, they don't have to go far to find pubs and clubs. Unless the Government wants the level of drink-driving to increase, it needs to ensure that far more pubs and clubs are built in rural areas.<br><br><b>Which one of the following, if true, would most strengthen the above argument?</b>", "options": ["The legal alcohol limit for drivers is likely to be lowered in the near future.", "The public have been made much more aware of the dangers of drink-driving.", "Many pubs in rural areas are closing because of the reduced numbers of customers.", "The population of rural areas is predicted to increase over the next twenty years.", "The police concentrate their drink-driving campaign in towns and cities."], "correct": 3, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Предложение автора — строить пабы в деревне. Усилить — показать, что проблема будет расти.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если сельское население увеличится, без пабов рядом пьяных водителей станет больше. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — общие факты о вождении.</li><li>C — показывает, что пабам в деревне трудно.</li><li>E — про работу полиции.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усилить можно, показав масштаб проблемы.</div></div>"}, {"id": 13, "text": "It would be a good idea if the police force was separated into two divisions, one for proper policing i.e. protecting citizens and upholding law and order, and the other for road traffic. This second division could be combined with traffic wardens as basically they are doing a similar job: obtaining money from road users. Perhaps then there would be a proper focus put on catching criminals and protecting the law-abiding public, and we would have a police force doing the job they were actually intended to do.<br><br><b>Which one of the following best describes the flaw in the above argument?</b>", "options": ["It overlooks the fact that many traffic offences are both criminal and a serious danger to the public.", "It rests on the false assumption that the police do not protect citizens or catch criminals.", "It ignores the fact that traffic wardens and the police have different duties and different powers.", "It wrongly equates protecting citizens with catching criminals.", "It implies that the police once did the job they were supposed to do."], "correct": 0, "src": "FLAW", "topic": "FLAW", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор считает, что дорожная полиция — это просто сбор денег.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но многие нарушения на дороге — преступления и реальная опасность.</li><li>Значит, это тоже «настоящая» полиция. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — автор так не утверждает.</li><li>C — автор как раз предлагает их объединить.</li><li>D, E — не главные ошибки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите, что автор упустил.</div></div>"}, {"id": 14, "text": "<b>Choose your answer from the image above:</b>", "options": ["A", "B", "C", "D", "E"], "correct": 2, "src": "CON", "image": "images/q-27ced43ab9.png", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Два варианта ставят независимость BBC под угрозу; остаётся лицензия.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Налоги и реклама угрожают независимости.</li><li>Лицензия таких проблем не имеет, хоть её и критикуют.</li><li>Значит, лицензия — лучший вариант. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — слишком сильно: альтернативы есть.</li><li>B — при лицензии риска нет.</li><li>D, E — новые темы.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если все варианты, кроме одного, плохи, — вывод про этот один.</div></div>"}, {"id": 15, "text": "Many people suffer from depression in modern society. This can be alleviated through drugs such as Prozac, which alter the chemical balance of the brain. However, the individual can undergo psychotherapy, which involves talking through problems with a sympathetic and skilled fellow human being with a view to putting the subject in a more positive frame of mind. Depressed individuals who do not like the idea of their brain chemistry being altered should therefore choose psychotherapy.<br><br><b>Which one of the following is an underlying assumption of the above argument?</b>", "options": ["Psychotherapy is more effective than drugs in treating depression.", "Alternative medicine is preferable to conventional medicine.", "Psychotherapy cannot be combined with drug treatments.", "Depression is caused by the pace of modern life.", "Psychotherapy does not alter the individual's brain chemistry."], "correct": 4, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод: кто не хочет менять химию мозга — пусть выбирает психотерапию.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Это верно, только если психотерапия химию мозга не меняет. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — эффективность не обсуждается.</li><li>B, D — новые темы.</li><li>C — не нужно для вывода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение часто «соединяет» вывод с условием.</div></div>"}, {"id": 16, "text": "Conspicuous consumption does not make us happy. Buying a flashy car sends the message: 'I've got so many resources, I can afford to squander them.' Paying more for organic foods signals another desirable trait: conscientiousness. We put too much effort into sending signals that don't actually impress others and cause us stress. We evolved into emotionally well-balanced individuals thousands of years ago. To be truly happy now, we should devote more time to the activities that dominated life back then: being at one with nature, being with children, or holding face-to-face conversations. We need to evaluate our lives and make sure they include many of those things we were doing 250,000 years ago.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?</b>", "options": ["Sending out signals to impress others is a waste of time.", "We need to decide what is really important in our lives.", "Our ancestors were emotionally better balanced than we are today.", "To be really happy, we should behave more like our ancestors did.", "Today's complex and competitive lifestyle makes us discontented and unhappy."], "correct": 3, "src": "MC", "topic": "MC", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Главный вывод — рекомендация в конце.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Чтобы быть счастливыми, нужно жить как предки: природа, дети, живое общение. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — посылки.</li><li>B — слишком общо.</li><li>C — промежуточная мысль.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «To be truly happy, we should…» — это вывод.</div></div>"}, {"id": 17, "text": "A market research company conducted a survey into the relative popularity of two soft drinks with the following results (all figures are percentages): The same number of people were surveyed in each age group.<br><br><b>Which one of the following conclusions can be justifiably drawn from the results?</b>", "options": ["Drink A is consistently more popular than Drink B.", "There were more people with a preference for Drink B than with no preference.", "More people in the age group 5-15 expressed a preference than did not.", "Fewer people had a preference than those who did not.", "More than 20% of people did not know which they preferred."], "correct": 1, "src": "CON", "image": "images/q-eafab7e57c.png", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Групп одинаковое количество — можно складывать проценты.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Предпочитают B: 20 + 31 + 33 + 19 = 103.</li><li>Без предпочтения: 33 + 12 + 22 + 34 = 101.</li><li>103 &gt; 101. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — в 25–35 B популярнее.</li><li>C — 48 против 52.</li><li>D — с предпочтением больше.</li><li>E — в среднем «не знаю» 18,5%.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверяйте каждый вариант по таблице.</div></div>"}, {"id": 18, "text": "The problem of insect pests on crops is a difficult one and is often solved by spraying crops with pesticides. However, there are many other insects which survive by feeding on the pests that we are trying to kill. The pesticides also kill these insects. It would be better to stop wasting money or pesticides and let other insects control the problem of pests for us.<br><br><b>Which one of the following is the best statement of the flaw in the argument above?</b>", "options": ["It ignores the fact that pesticides may be more effective at controlling the problem than these other insects.", "It fails to consider the other problems that are associated with pesticides.", "It fails to establish that there is a positive benefit offered by allowing the insects to control the problem rather than using pesticides.", "It does not establish that there are any problems for the crops presented by these other insects.", "It offers no explanation to justify the statement that pests on crops present a problem."], "correct": 0, "src": "FLAW", "topic": "FLAW", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор предлагает отказаться от пестицидов в пользу полезных насекомых.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Но он не сравнил, что лучше работает.</li><li>Пестициды могут убивать вредителей эффективнее. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — не важно для вывода.</li><li>C, D, E — не главная ошибка.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ошибка «упустил альтернативу» — очень частая.</div></div>"}, {"id": 19, "text": "There have been a growing number of calls to phase out the smallest denomination coins. The single penny is almost useless for purchasing items by itself. It would be simpler if prices were rounded to the nearest five pence and this would reduce the amount of small change carried around. But this view does not take into consideration that this will inevitably lead to price increases. Very few people would be concerned about paying £1 instead of 99 pence, but it is not the consumer who benefits from the 1% price increase. A single penny may not be worth much, but those who save them do eventually have enough to purchase something useful. There are many charities that also benefit from these small coins as donations.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?</b>", "options": ["Small denomination coins should be donated to charity.", "Coins are an unimportant part of currency.", "People should not worry about price increases if small coins are withdrawn.", "People should be encouraged to save their small denomination coins.", "Consumers and charities would lose out if small denomination coins were withdrawn."], "correct": 4, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вывод из текста: отмена мелких монет вредна.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Цены вырастут, выигрывают не покупатели.</li><li>Благотворительность получает мелкие монеты.</li><li>Значит, потребители и благотворительность потеряют. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — рекомендации, которых в тексте нет.</li><li>B, C — противоречат тексту.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Вывод объединяет все доводы.</div></div>"}, {"id": 20, "text": "University education is not a matter of forcing through the largest number of graduates at the lowest possible short-term cost. This would not serve the needs of the current generation of students and, even from a narrow economic viewpoint, it would not promote economic prosperity in the long term. It is often a poor economic practice to skimp on the production costs of a product, even when you are only interested in the eventual monetary profit to be made from it. But in any event university education has wider purposes than merely the promotion of economic prosperity.<br><br><b>Which of the following is an underlying assumption of the above argument?</b>", "options": ["The principal purpose of university education is to serve the needs of the present generation of students.", "The principal purpose of university education is to promote the long term economic prosperity of the community.", "The more money the manufacturer spends on the production of a product, the greater the eventual profit is likely to be.", "Policies of cost-cutting are likely to reduce the extent to which the university education will achieve its overall purpose.", "Universities should be managed so as to make a monetary profit, but they should also promote certain non-financial values."], "correct": 3, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор против экономии на образовании.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Он считает, что экономия навредит и деньгам, и более широким целям.</li><li>Это верно, только если сокращение затрат мешает университету выполнять свою задачу. Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — автор говорит, что цели шире.</li><li>C — слишком сильно.</li><li>E — автор против идеи прибыли.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение связывает «экономить» и «хуже результат».</div></div>"}, {"id": 21, "text": "In a high speed police chase, police drivers sometimes lose sight of the car they are chasing. But that’s no reason to give up. All they have to do is take the first left, and then the first left again. Pursued drivers are likely to keep taking turns as they come up, as this seems instinctively like the best way to lose someone who is following them. They are not going to turn right as this involves waiting and checking for oncoming traffic. Therefore take a couple of left turns and the police car will soon have their criminal in sight once again!<br><br><b>Which of the following, if true, would strengthen this argument?</b>", "options": ["Car chases tend to end with the pursued driver losing control of their vehicle.", "Drivers in TV car chases tend to turn left rather than right when pursued.", "Police drivers are usually able to sustain faster average speeds over a length of time than other drivers.", "Police drivers usually request overhead assistance from a helicopter when chasing criminals in cars.", "Two left turns might take the criminal where they want to be going."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Совет держится на идее: беглецы поворачивают налево.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если полиция в среднем быстрее, она сможет догнать после двух поворотов. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — другие способы погони.</li><li>B — ТВ не доказательство.</li><li>E — ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усиливает то, что делает план реально выполнимым.</div></div>"}, {"id": 22, "text": "A recent study by a drugs company found that the amount of money spent on a specific pill used for the treatment of Alzheimer's disease in the UK showed wide regional variation. Alzheimer's is a condition associated with the ageing process. In some areas the expenditure was as low as £1 per head of the population over 65 whereas in others it was as high as £10 per head. These pills are the most effective treatment for this condition that is currently available. Therefore, this is another example of 'post-code lottery' where the effectiveness of treatment for a health condition will depend upon where you live.<br><br><b>Which one of the following is an assumption underlying the above argument?</b>", "options": ["The pills are very successful in halting the progress of Alzheimer's disease.", "The drugs company that did the research doesn't have a vested interest in selling the pills.", "There are no regional variations in the incidence of Alzheimer's in the 65+ age group.", "There are no regional variations in the number of people in the 65+ age group.", "It is not possible to develop Alzheimer's disease below the age of 65."], "correct": 2, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Разные траты по регионам называются «лотереей». Это справедливо, только если больные распределены одинаково.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если в одном регионе больных больше — тратят больше, и это не лотерея.</li><li>Нужно допущение: частота болезни по регионам одинаковая. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — расходы уже считаются на человека 65+.</li><li>A, B, E — не нужны для вывода.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: если болезнь распределена по-разному — вывод рушится.</div></div>"}, {"id": 23, "text": "High street stores should not be able to sell financial products, because consumers should not be misled into buying products they may not need by staff who do not understand what they are selling. Financial products require an understanding of financial services, and very few high street retailers have members of staff in store who can fully explain the benefits and disadvantages of the financial products being sold.<br><br><b>Which one of the following, if true, most strengthens the above argument?</b>", "options": ["Many high street stores have been fined by the financial regulator for mis-selling financial products.", "Many stores offer incentives to customers to encourage them to sign up for store cards.", "Consumers are supplied with full details of the terms and conditions for all financial products that they sign up for.", "Many people do not understand the financial products they purchase yet still benefit from them.", "Most people do not read the terms and conditions of products and services that they sign up to."], "correct": 0, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: магазины вводят людей в заблуждение.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если магазины уже штрафовали за неправильные продажи — это подтверждает. Ответ A.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — про скидки.</li><li>C — ослабляет.</li><li>D — ослабляет.</li><li>E — про чтение условий.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Реальные случаи — сильное подтверждение.</div></div>"}, {"id": 24, "text": "'People who see America as 'The Great Satan' often forget how, whatever the nation's faults, it is truly heaving with free debate. After his re-election in 2004 the public and media began turning against George W Bush with a ferocity which matched only their bewildering support for him previously. Every day newspapers revealed polls that were more damaging for the president. The bookshops were packed with anti-administration best-sellers. At number one was Fiasco by Thomas E Ricks about, obviously, the war in Iraq. Nor are the shops just small, political outlets, you could find: 100 Ways America Is Screwing Up The World; Losing Our Democracy; How GWB Misleads America, and dozens of similar titles, even in major chain stores.'<br><br><b>The above argument rests on the implicit assumption that:</b>", "options": ["if free debate is permitted, anti-administration feelings are bound to be expressed.", "if popular opinion and the media turn against the administration, considerable free debate must be taking place.", "polls are an accurate indicator of popular opinion.", "by rights George W Bush should not have been re-elected in 2004.", "the Bush administration, for all its faults, has encouraged free debate by the public and the media."], "correct": 1, "src": "ASM", "topic": "ASM", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Из того, что СМИ и люди критикуют власть, автор делает вывод о свободе дебатов.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Он допускает: если мнение повернулось против власти, свободная дискуссия есть. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — обратное направление.</li><li>C — опросы — лишь деталь.</li><li>D, E — не нужны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Допущение — мост от фактов к выводу.</div></div>"}, {"id": 25, "text": "Action should be taken to prevent the use of children as low-cost labour in poor Asian countries in industries such as electronics, garment, shoe and toy manufacture. Nothing short of a ban on child labour is acceptable. Child labour is an attractive proposition for employers: children have quick fingers, good eyesight and are often more productive than adults and do not have to be paid very much. And there's a ready supply, thanks to the number of children dropping out of education because their parents cannot afford to educate them. If children have to work they are denied their childhood and education.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>", "options": ["Laws governing the minimum age for employment do not exist everywhere.", "It is well known that children work more consistently than adults.", "Without the children's wages, the family could not afford to educate them anyway.", "Without cheap child labour, the cost of manufactured goods would rise.", "International agencies have long been pressing for free education for all."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: работа лишает детей образования. Ослабить — показать, что без работы образования тоже нет.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если без зарплаты детей семья не сможет их учить — запрет не даст образования. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — не противоречат.</li><li>D — экономика, не главный довод.</li><li>E — не влияет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ослабьте посылку, на которой стоит вывод.</div></div>"}, {"id": 26, "text": "One of the greatest achievements of English grammar schools was the development and dissemination of a sophisticated system of standard punctuation for the English language. The complex rules for the use of commas conveyed a range of precise meanings, while the choice between semi-colon, colon and full stop expressed the exact, and often subtle, relationship between statements. Without this kind of attention to punctuation, there is bound to be a loss of precision communication and in thinking. The current use of commas to join statements together, without any regard for grammar or the nature of the link between them, lacks rigour and covers up lazy thinking.<br><br><b>Which one of the following can be drawn as a conclusion from the above?</b>", "options": ["Most writers do not want to waste time thinking through the exact connections between their ideas.", "Only a minority of people ever grasped the finer aspects of the traditional system of punctuation.", "Schools should go back to teaching the traditional system of punctuation.", "The government should reintroduce grammar schools into the UK.", "The vocabulary and grammar of a language naturally evolve over time, and the same is true of punctuation."], "correct": 2, "src": "CON", "topic": "CON", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Традиционная пунктуация важна, а современная — небрежная.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Значит, школам стоит вернуться к старой системе. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — новые факты.</li><li>D — слишком далеко.</li><li>E — противоположно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Рекомендация вытекает из «старое лучше нового».</div></div>"}, {"id": 27, "text": "Electrical goods retailers often offer 'extended warranties' which guarantee free repairs if the product breaks down during the term of the warranty. Salespeople are keen to persuade customers to buy these warranties because they gain substantial commission from them. Customers may also be tempted to buy them, since they ensure that the purchaser will not be faced with huge repair bills. However, surveys by consumer protection agencies show that the average cost of repairs per customer is less than the average cost of a warranty. Anybody buying electrical goods would, therefore, be well-advised not to buy an extended warranty, as it represents poor value for money.<br><br><b>Which one of the following, if true, would weaken the above argument?</b>", "options": ["Salespeople knowingly mislead their customers into purchasing a poor value scheme.", "The average cost of repairs is low because for the majority of electrical purchases the actual cost is zero.", "No extended warranty scheme would be viable for the retailer if the average cost of repairs exceeded the cost of the warranty.", "In most warranty agreements there are clauses which state that certain kinds of repair are not covered.", "With or without an extended warranty, customers have statutory rights which retailers are obliged to observe."], "correct": 1, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор сравнивает средние суммы. Ослабить — показать, что среднее обманывает.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если у большинства ремонт стоит 0, а у немногих — огромные суммы, гарантия — это страховка от редкой большой траты. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — усиливает.</li><li>C — тоже усиливает.</li><li>D, E — не про ценность.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Среднее значение скрывает редкие большие расходы.</div></div>"}, {"id": 28, "text": "In recent years there has been a great deal of media attention focused on the private lives of politicians and world leaders, with particular attention paid to their personal relationships. There are those who suggest that this attention is unwarranted because only their professional abilities are important to their political role. This attitude fails to consider that the public have little insight into the day-to-day lives of world leaders and, indeed, few points of reference. Personal lives offer common ground. In democratic states leaders are elected based on how the public perceive them, and private lives can offer an insight into an individual's values. The personal aspects of a politician's life should continue to be reported if the electorate find it important.<br><br><b>Which one of the following, if true, most strengthens the above argument?</b>", "options": ["All those in the public eye are subjected to media attention.", "Some politicians have high profile affairs.", "Attention on their private lives can cause leaders to lose their focus.", "Many of the public are very interested in the family lives of sports personalities.", "Most politicians claim to be respectable and honest in all aspects of their lives."], "correct": 4, "src": "FLAW", "topic": "FLAW", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Личная жизнь показывает ценности. Усилить — показать, что это важно знать.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если политики заявляют, что честны во всём — личная жизнь проверяет эти слова. Ответ E.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — не про политиков.</li><li>B — частный случай.</li><li>C — ослабляет.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Усиливает то, что делает информацию полезной избирателю.</div></div>"}, {"id": 29, "text": "Most city centres in the UK are now covered by sophisticated CCTV cameras which can record crimes being committed. Many towns and cities report a reduction in crime where cameras are installed: for example, Airdrie reported a 75% fall in crime and Kings Lynn reported a massive 90% reduction. Thus, they are a real success in controlling 'opportunistic' crime.<br><br><b>Which one of the following, if true, most weakens the above argument?</b>", "options": ["Not all cameras are manned and recording.", "The cameras tend to be sited only in the centres of towns and cities.", "CCTV usually forms part of 'anti-crime' packages which include an extra police presence.", "The cameras are an overreaction to the actions of a small minority.", "The camera images are often too poor quality to be of use in court convictions."], "correct": 2, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Падение преступности объясняют камерами. Ослабить — другая причина.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Если вместе с камерами добавили полицию — падение может быть из-за неё. Ответ C.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — про качество камер.</li><li>B — не объясняет падение.</li><li>D — мнение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Альтернативная причина.</div></div>"}, {"id": 30, "text": "The preservation of First Class sections on trains is indefensible. This is not because it is socially divisive, which it is; nor because it is very expensive, which it also is; but because it inevitably leads to a relatively poorer service in Standard Class sections of trains. Clearly, in order to attract First Class passengers it is necessary to maintain certain levels of discomfort in those compartments which cater to the great majority of travellers. There is, for example, a powerful disincentive to make more space generally available on trains, as one of the main inducements to travel First Class is to escape overcrowding and be assured of a seat. Yet, additional space would add significantly to the safety and comfort of most passengers.<br><br><b>Which one of the following, if true, would most weaken the above argument?</b>", "options": ["More people are now using First Class sections on trains than ever before.", "The whole rail service benefits from the increased revenue generated by the high cost of First Class tickets.", "On many trains the First Class section occupies only a small proportion of the total accommodation.", "No one is excluded from travelling in the First Class sections of trains, provided they are prepared to pay the higher fare.", "Some people who travel in First Class sections of trains would not use the trains if there were no First Class sections."], "correct": 1, "src": "EF", "topic": "EF", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Автор: первый класс ухудшает стандартный. Ослабить — показать пользу для всех.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Дорогие билеты первого класса приносят деньги, которые улучшают весь сервис. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — не отвечают на довод.</li><li>D, E — не про качество стандартного класса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Покажите, что «вред» на деле даёт выгоду.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js?v=1c2c9c12"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + esc(q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (esc(q.text) ? '<div class="pl-text">' + esc(q.text) + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
