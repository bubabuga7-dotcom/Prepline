<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Critical Thinking #2 — Prepline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(96,165,250,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(244,114,182,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<script>
const questions = [{"id": 1, "text": "Studies of fossilised remains indicate that, every 20 to 30 million years, life on Earth experiences a sudden and mass extinction of all or most of its dominant species. Yet, in each case, within some 5 to 10 million years the diversity of species on the planet is as great, if not greater, than it had been previously, since the demise of the dominant species allows more minority species to flourish. Whatever disasters we may wreak on the planet, life in the long term will not only survive but actually increase in richness and diversity.<br><br><b>Which one of the following, if true, most weakens the above argument?<\/b>", "options": ["The consequences of a global nuclear holocaust are not known.", "It can be difficult to draw precise conclusions about dates from fossil records.", "Human technology will soon be advanced enough to prevent most natural catastrophes.", "Some species are able to withstand the most extreme forms of environmental change.", "Some species have died out due to dramatic changes in climate."], "correct": 0, "src": "EF"}, {"id": 2, "text": "Couples who have more than two children are being ‘irresponsible’ by creating an unbearable burden on the environment, the government’s Sustainable Development adviser has warned. The adviser says that curbing population growth through contraception must be at the heart of policies to fight global warming. Political leaders and ‘green’ campaigners should stop dodging the issue of environmental harm caused by an expanding population. Each baby born in the UK will, during his or her lifetime, burn carbon roughly equivalent to 21⁄2 acres of woodland – an area the size of Trafalgar Square. The UK population, now 62 million, will exceed 70 million by 2028. On average, women born outside the UK have 2.5 children compared with 1.7 for those born in the UK. The global population of 7 billion is expected to rise to 9.2 billion by 2050. Governments of both developed and developing nations must act to limit family size if they are serious about reducing energy consumption.<br><br><b>Which one of the following, if true, most strengthens the above argument?<\/b>", "options": ["Large families are the norm in many developing nations, often for good economic reasons.", "Methods of reducing carbon footprint by other means are being developed.", "Many babies are born to men and women who did not intend or wish to become parents.", "Governments of developed nations will meet fierce resistance to plans to limit family size.", "Many men and women are unable to have children."], "correct": 2, "src": "EF"}, {"id": 3, "text": "Another pair of British media personalities have announced their separation. Both are well-paid personalities who profit enormously from the publicity they attract from their behaviour. Media personalities like them usually employ agents who can generate publicity, arrange well-paid personal appearances and sell stories and photo shoots to glossy magazines. These agents probably generate more income for some media personalities than their original activity, such as singing. Therefore it's clear that talent is no longer rewarded.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?<\/b>", "options": ["These personalities may not be talented.", "Many performers may be rewarded for their own original talent as well.", "Agents generate a large amount of income for their clients.", "Agents may be destroying talent by their actions.", "Personalities do not have to choose to employ agents."], "correct": 1, "src": "FLAW"}, {"id": 4, "text": "In the case of plastic drink bottles, recycling is not the best answer to the problem of garbage disposal. Ninety five per cent of soft-drink bottles sold in the United States are made of a compound of polyethylene (PET) which poses recycling problems. They are potentially carcinogenic if recycled into new food or drink containers. Recycled PET tends to absorb other chemicals before re-melting and these chemicals could leach into food or drink that is stored in a recycled container. However, if disposed of in landfill sites, plastic is not harmful to the environment. It can be squashed flat, so that it occupies little space and it is inert. Unlike other waste, it does not leach into soil or water, nor does it produce a dangerous build-up of methane.<br><br><b>Which of the following is an underlying assumption of the argument above?<\/b>", "options": ["The space in presently available landfill sites will soon be exhausted.", "Soft-drink bottles should be made from materials which can be recycled.", "The burning of plastic rubbish is inadvisable because it produces toxic chemicals.", "Apart from food and drink containers, there is little use for recycled PET.", "A reduction in the amount of plastic produced would ease the problems of garbage disposal."], "correct": 3, "src": "ASM"}, {"id": 5, "text": "A Prime Minister has a difficult judgement to make when deciding whether to sack one of their ministers or not. Faced, for example, with a minister involved in some kind of scandal, the Prime Minister might feel they should sack them to show they stand up for integrity and high moral standards, or, on the other hand, allow them to remain in post for other reasons such as loyalty to a colleague or a belief that they are, on balance, doing a good job. Sacking ministers shows that the Prime Minister is prepared to live by principles, even if by so doing they lose valued colleagues. The electorate will judge the Prime Minister to have acted with integrity: that is an invaluable perception for anyone wishing to remain in power.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?<\/b>", "options": ["It is in the Prime Minister’s electoral interests to err on the side of sacking.", "Restoring public trust at a time when the reputation of politicians is low is a priority.", "Ministers are often sacked for a relatively minor wrongdoing when this is not in the interests", "Ministers involved in scandals should always be sacked.", "Politicians seek to stay in power at all costs."], "correct": 0, "src": "CON"}, {"id": 6, "text": "'Organic food is no healthier than other produce, scientists claim.' This was the headline in an article published in 2009 in The Independent. It reported that a comprehensive review of 50 years of evidence showed no appreciable difference in nutrient levels between organic and conventional farm produce. If the review is correct shoppers will think twice about buying organic food, especially if the price difference remains significant. Only if people really do receive some health benefit in return for the extra money will the current upward trend in organic sales continue.<br><br><b>Which one of the following presents the strongest challenge to the above argument?<\/b>", "options": ["Shoppers who read The Independent are more likely to buy organic produce than readers of other newspapers.", "Most shoppers take more notice of price than they do of nutritional benefits when choosing to buy.", "If the review is correct, shoppers will have received no health benefit in the past 50 years, yet organic sales have continued to rise.", "If organic food had more nutritional value than conventional farm produce, scientists would have found out long before now.", "If there is no appreciable difference in nutrient levels there is no advantage for shoppers in switching back to conventional produce."], "correct": 2, "src": "EF"}, {"id": 7, "text": "<b>Выбери ответ по изображению выше:<\/b>", "options": ["A", "B", "C", "D", "E"], "correct": 2, "src": "CON", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCwAAAJiBAMAAAD+vk6FAAAAGFBMVEX////7+/vq6urKysqZmZljY2IzNDMNDgzBzYZiAADOkElEQVR42uz965cdx3UnCv4iDkgColgZEVmSCPBRmZEHEgmKQp3MA7olWjZQVWBP292rbZGUZ41nvrQl6+vMve3233DHPX9Au+07d803G4C6b8+Hu1qoKsjWSG4JlXlKlvkQUfkAJaKKUp2MOKCJKoqsjPkQmedRDzxIkaLl2muRqJM QNNo5zJFuhp3DYqqJ5Lk/3OVm/trB7D2H1uyMP8r1/MvZo9V7BsvjJ52/NDCr0g7Q7Phd4Dvf/K9y9qrAeEVVdmHPrDSg8R//bLXZqnyA+YsQC/MOTtnmNl6cv4DxGOLyS8ClPxVnJ2r8h83TfvmTFz9pC5/7pERhv/O/33fSC/8Jjz8eXKiRqnZDnffiKv+iS2HK8nNQibUHfrJoX/odPjqTJGRb+S84ScxHX2ySaLH6+usJrjlhj+9y+nCQfx4q8eD/c1a4e/e9vx+es9qEU19/JuG9TzrUPPnwk9KX3t9HjRo1atSoUaNGjRo1atR43PD/A8n1LYcLf0bwAAAAAElFTkSuQmCC"}, {"id": 9, "text": "School science lessons were once the place of bangs, flashes, smells, blood and droplets of mercury on the bench. Few, if any, people ever died from these experiences. Now, the activities that once made science fun are rare – banned on health and safety grounds. It has been reported that governments are concerned about the decreasing percentage of students enrolling on science courses at universities. If they do wish to reverse this trend, they need to take steps to curtail the pervasive 'health and safety' culture in which we now live.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["It does not matter if only a few people died as a result of school science lessons.", "Doing exciting activities in science lessons leads to a higher take-up of science courses at university.", "There is no reason to ban science practicals that are only minimally dangerous.", "Health and safety legislation has had only a negative effect on education.", "Science is only fun if it is dangerous."], "correct": 1, "src": "ASM"}, {"id": 10, "text": "In 1997 the UK Government banned the owning of handguns after a man went on the rampage, killing several people, with a collection of legally owned firearms. In the time since then the number of crimes involving firearms as a whole has increased. The number involving legally owned firearms has gone up by 0.1% as compared to a 5% increase overall.<br><br><b>Which one of the following could be reliably concluded from the above information?<\/b>", "options": ["Banning handguns has simply increased gun crime.", "The number of legally owned firearms has decreased.", "The number of crimes involving handguns has stayed the same.", "The law change in 1997 has not resulted in a reduction in gun crime.", "It has become easier to acquire illegal firearms."], "correct": 3, "src": "CON"}, {"id": 11, "text": "Despite recent improvements to their training, a new study suggests that the police are as susceptible as the general public to holding false beliefs about crime and punishment. Participants in the study were questioned about their views on a number of crime-related myths such as ‘capital punishment is an effective way to deter criminal activity’ – myths, because they are unsupported by research evidence. Police were just as likely to endorse the misconceptions as the lay participants and, moreover, were more confident in their false beliefs. This is a worrying example of a ‘scientist–practitioner gap’, a term which describes a situation where professionals do not accept the evidence of research relevant to their roles. Studies have shown that training can permanently reduce the ‘scientist–practitioner gap’. Police officers need more training.<br><br><b>Which one of the following, if true, most strengthens the above argument?<\/b>", "options": ["The recruitment process for new police officers often fails to identify false beliefs held by applicants.", "The majority of police officers do not support the return of capital punishment.", "The science–practitioner gap is a common phenomenon in many professions, not just the police.", "Police training has often been criticised in the media for being insufficiently practical.", "Police officers whose views are not evidence-based are more likely to have complaints made against them by members of the public."], "correct": 4, "src": "EF"}, {"id": 12, "text": "At first glance, there is no phenomenon creepier than crop circles - huge geometric designs that appear in fields overnight seemingly without cause, explanation or reason. UFO enthusiasts are quick to supply all three, by attributing the patterns to alien visitors seeking to communicate with humans, using laser beams or other advanced technology to flatten the crops. These fanciful claims can fortunately be dismissed thanks to two quite mundane observations. Firstly, ordinary Earth-born individuals have repeatedly demonstrated how to produce the effects with nothing more elaborate than a rope and a plank. Secondly, there is a clear parallel for the phenomenon in the form of urban graffiti. Sneaking into fields to make crop circles is simply a rural variation of a widespread and well-documented human urge.<br><br><b>Which one of the following is an implicit, underlying assumption that is made by the argument?<\/b>", "options": ["Where two explanations compete we should accept the more ordinary one.", "There is nothing difficult or technical about producing crop circles.", "Alien visitors would not try to communicate with humans by flattening crops.", "No visits from intelligent aliens have as yet been documented.", "The appearance overnight of huge geometrical designs is creepy if it can not be explained."], "correct": 0, "src": "ASM"}, {"id": 13, "text": "Catalytic convertors are increasingly being fitted to cars as a means of reducing some of the harmful emissions from car exhausts. But, though they eliminate one form of pollution, their action serves only to create another one. Ground-level ozone is kept at very low levels in the cities by some of the pollutants catalysts remove. So the more catalytic convertors that are fitted, the more such ozone can build up. Since ozone is a major cause of choking summer smogs, we can assume that people with breathing difficulties, such as asthmatics, will be much worse off the more that catalytic converter are used. We should stop fitting cars with catalytic convertors.<br><br><b>Which of the following, if true, would most weaken the above argument?<\/b>", "options": ["Most cars are not fitted with a catalytic convertor.", "Catalytic convertors are the best-known method of reducing harmful car emissions.", "The pollutants that catalytic converter remove can create breathing difficulties.", "The number of cases of people with breathing difficulties has risen over the past few years.", "Air pollution affecting people with breathing difficulties is also caused by emissions from industry."], "correct": 2, "src": "EF"}, {"id": 14, "text": "Researchers studying the effects of diet on health sometimes use 'randomised intervention trials'. One group - the intervention group - is asked to change some aspect of diet, for example eat less fat or more fruit, while the other group - the control group - is told to eat as normal. At the end of the trial the number of cases of, say, colon cancer, in the two groups can be compared. Such results could be misleading, because as the study progresses, the 'intervention' subjects become less conscientious about sticking to their supposedly healthy diet, so the longer the study goes on, the less the diets of the two groups differ. Yet to get results that are statistically significant, the study must go on as long as possible.<br><br><b>Which of the following, if true, most strengthens the above argument?<\/b>", "options": ["'Control' subjects often change their diet in response to health information in the media.", "Diets that are low in fat and high in fruit are known to be beneficial to health.", "'Intervention' subjects know that the changes in diet could benefit their health.", "Some people have an inherited tendency to suffer from colon cancer.", "Statisticians who interpret the results take account of the effects of exercise and smoking."], "correct": 0, "src": "EF"}, {"id": 15, "text": "There was a 17 per cent decline in public library use in the UK between 1993 and 2003 according to a report by CABE (The Commission for Architecture and the Built Environment). They suggest this is not due to a lack of public interest in reading books. Rather it is the authoritarian style and image of libraries with their rules about silence and fines for late returns of books. Those few libraries that have moved away from this image such as the one in Bournemouth, which provide cafes and 'chill-out' zones, have seen a 40 per cent increase in library use. Therefore it is clear that the future of the function of the UK library service will be more assured if all libraries follow this lead.<br><br><b>Which one of the following, if true, would most strengthen the above argument?<\/b>", "options": ["The decline in public library use has not occurred in other European countries.", "The main users of public libraries are school children looking for reference books.", "Bookshops have experienced an increase in sales since 1993.", "The use of computers in libraries has increased over the same period.", "Few people who use new-style libraries use them to borrow books."], "correct": 2, "src": "EF"}, {"id": 16, "text": "<b>Выбери ответ по изображению выше:<\/b>", "options": ["A", "B", "C", "D", "E"], "correct": 2, "src": "MC", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCoAAAJgBAMAAAC+aJ/JAAAAGFBMVEX///////7+//74+Pji4uKio6I8PTsFBgUHnHo7AADUe0lEQVR42uz923ccx5kvCv4isyCRlMmKyAIkAmoRmVkF2qK723UB2Lvdq3cXCgD3Wnafs0SQsNfsp3NIiX49M2fa81/MvMstrTUPMw8iQWmfs073LBOXcrtt9yaJqpQtk6KAykxJNgg2URlRskXIzaqMeYjMqixceBOltvog1pKIyoz4bvFlZMSX8YsP2C/7Zb/sl/2yX/bLftkv+2W/7Jcvu2j7Jng6xfyPoYYOQJ8ufnPYe2ISM3/+fu/H+LdvJG9ZH00f8/dqmOWp2Rt9woyKB/BJnfnm8ztoKX65So9OavaZjZ1tZ29AH/397D2xaw3tWxsz5qNbIFe51y+oPn1kAwBmsi/f3Fn5BgB92vSeRnedfWYDwMweRp0p3Nxu4iceJaaKtl165YklZckHxLDQ/8ume7UbqMC2+1Q+Qx/Ep9JfO8kvyZXsxpHYSM3Gt3bWmLZhW4+h8Q4C6sJAcRfezFI82dN4iJXomr3HmGRYO0z8pF6RsqTrkaEnl/QJ201ut6D2wPFXZ6ErPocMlrVnrZQVfs7OijSS7tMYEB5Y6Ocy8SOWFFBIN1Z0kS9XvwglZGPzaXkTDeb36rzakUd4wAGp/gpr4gvqMnntC3/lCwBho/3FPrAaQGTDbywTCujTefWyLqr/gPGp3hs8r96g6p8pM/Grr6I+bQJATl0IF5xkNQBa/EMmyGaTNTCeB0p9VwAAzbDLJ/4nqtNe6GOi7saiTqu6DvxItc6C06WQ6zbqKJ206EakYfevLrWkKpFNpmR8xffjhtlYQqdHv2vcb ry farming is seen as cruel to the animals involved. Rabbit meat, in particular, is selling well as it is tastier than chicken and is cheaper than beef or pork. Games are also low in fat and cholesterol. If people are really concerned about animal welfare they should take advantage of the increased availability of game in the supermarkets. They will also be getting a nutritious and cheap diet.<br><br><b>Which of the following best expresses the underlying assumption in the above argument?<\/b>", "options": ["Supermarkets want to improve their animal welfare image.", "The influence of celebrity chefs on shoppers cannot be underestimated.", "No game meat is produced using factory farming methods.", "Cheapness does not necessarily provide good value.", "Supermarkets always respond to customer demands."], "correct": 2, "src": "ASM"}, {"id": 18, "text": "The funding situation for educational provision in UK prisons is a national disgrace. Prisons provide free room and board, and inmates are frequently given access to the internet, cable TV, and gym facilities. At the same time, lengthy waiting lists exist for prison literacy classes, and ever increasing budget cuts put pressure on prison library resources. Meanwhile, it is estimated that at least half of UK prisoners possess a reading age of eleven or less. If society wants to reduce the chances of prisoners reoffending upon their release, we must give them the opportunity to develop the literacy skills they need to build a successful life outside prison.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["Prison is too easy for inmates.", "There is no educational value associated with watching TV or using the internet.", "Education is a right, not a privilege.", "Prisoners have lower levels of intelligence than those of the general population.", "Prison sentences should aim to rehabilitate criminals, not just punish them."], "correct": 1, "src": "ASM"}, {"id": 19, "text": "Many drivers deliberately break traffic laws, both because they are convinced that there is little chance of getting caught and because, even if they are caught, the penalties do not act as a sufficient deterrent. For example, people who would never think of stealing money even when they need it, think nothing of routinely exceeding a 30mph limit even in a street where children are playing. It is clear, then, that a substantial reduction in road accidents can be achieved only by catching more motorists who break the law and by increasing the penalties for such law-breakers.<br><br><b>Which one of the following is an assumption of the above argument?<\/b>", "options": ["The number of road accidents is increasing because motorists are ignoring the traffic laws.", "Drivers who have been convicted of a traffic offense think nothing of continuing to break the law.", "People who break the traffic laws are a significant cause of road accidents.", "If the penalties for stealing were less severe, people would think nothing of stealing money when they needed it.", "If the penalties for traffic offenses were increased, drivers would not break the law so frequently."], "correct": 2, "src": "ASM"}, {"id": 20, "text": "\"There are more police officers than ever before in the history of this country. We have more police officers and more community support officers. That is why, last week, crime was down. Crime is down 30 per cent.\"<br><br><b>Which of the following states the flaw in the argument above?<\/b>", "options": ["Community support officers don't have the same powers as police officers.", "Crime levels can be measured in different ways.", "Crime could have fallen if there had been no increase in policing.", "The fact that crime was down last week does not mean it will stay down.", "Having more police officers may mean more crime is being detected."], "correct": 2, "src": "FLAW"}, {"id": 21, "text": "In cricket, the world's fastest bowlers bowl at speeds of over ninety miles per hour. When the bowler releases the ball he is less than twenty metres away from the batsman, which means that the batsman has less than half a second to react to the ball and select his shot. According to scientists this is impossible, as there is simply not enough time for the necessary thought processes and muscle responses to occur. And yet this is exactly what happens. This just shows how science can all too easily fail to explain things due to its own limitations.<br><br><b>Which of the following, if true, would most weaken the above argument?<\/b>", "options": ["In order to play against bowling of this pace, the batsman's response has become a learned reflex rather than a conscious decision.", "It is only with the aid of high technology speed cameras that the speed of the bowler's delivery can be established.", "Tennis players often have to return serves which are travelling in excess of a hundred miles per hour over similar distances.", "There is much that science has yet to discover about the ways that the mind works and how it affects the body.", "Batsmen can often be too slow to react to fast bowling and consequently get badly hurt."], "correct": 0, "src": "EF"}, {"id": 22, "text": "There has been a recent trend to paint speed cameras bright yellow so that they can be seen easily and so act as a deterrent to speeding motorists. This is the exact opposite of what should happen. If cameras are obvious, drivers tend to drive very fast between them and brake hard when they see one ahead, which is a very dangerous practice. If cameras were virtually invisible, drivers would have to keep within the speed limits all of the time for fear of being caught unawares.<br><br><b>Which one of the following can be drawn as a conclusion of the above passage?<\/b>", "options": ["Painting speed cameras yellow does not make them a deterrent to speeding motorists.", "Making speed cameras easily visible is the exact opposite of a sensible policy.", "The point of installing speed cameras is to encourage drivers to reduce their speed.", "When speed cameras are easily visible drivers drive in a very dangerous way.", "If speed cameras were difficult to see, drivers would be likely to keep within speed limits."], "correct": 1, "src": "CON"}, {"id": 23, "text": "French golfer, Jean Van de Velde, appeared to throw away his big chance to win the Open Championship, after giving up what could only be described as an unassailable lead. Most players would have been distraught to have victory snatched from them in such a way. But, interviewed afterwards, Van de Velde pointed out that it was, after all, only a game: There are worse things in life, he said. Really? It may be refreshing to hear a top competitor express such a philosophical attitude, but it also explains fully why the prize eluded him. At that level you have to believe that nothing is worse than losing.<br><br><b>Which one of the following is an underlying assumption of the above argument?<\/b>", "options": ["If winning had mattered more to him, Van de Velde would have won.", "Anyone can win the top tournaments if they believe they can do it.", "Nothing in sport is worse than losing.", "Van de Velde was very unlucky in the last stages of the game.", "Van de Velde should have cared more about losing."], "correct": 0, "src": "ASM"}, {"id": 24, "text": "Random drug-testing of prisoners was introduced in 1995 in order to solve the many problems associated with prisoners taking drugs. Since cannabis can be detected in the body up to a month after having been smoked, prisoners are tempted to switch to heroin, which stays in the system for only 48 hours. As a result, since drug-testing was introduced, cannabis use has declined by a fifth whereas heroin use has doubled. Heroin is not only a much more damaging drug than cannabis, but it is also extremely addictive. There is evidence that heroin addiction encourages prisoners to intimidate others in order to pay for the drug.<br><br><b>Which one of the following is a conclusion which can be drawn from the above passage?<\/b>", "options": ["The test for detection of heroin in the body should be improved.", "Since 1995, cannabis use in prisons is at a lower level than heroin use.", "The drug-problem in prisons cannot be solved by random drug-testing.", "The system of drug-testing of prisoners has not solved the drug-problem in prisons.", "The level of intimidation in prisons has doubled since the introduction of random drug-testing."], "correct": 3, "src": "CON"}, {"id": 25, "text": "Increasing quantities of personal data are recorded and stored on computers: for example, where and when you use your mobile phone or what purchases you make in the supermarket. This poses a potential threat to our privacy. The Data Protection Act forbids the use of this information for a purpose other than that for which it was collected, apart from instances in which serious crime could be prevented or detected. We must not allow this principle to be abandoned because our liberty depends on it. Although at present there is no malign political purpose to which this information is put, we cannot be certain that this will never be the case.<br><br><b>Which one of the following best expresses the main conclusion of the above argument?<\/b>", "options": ["Our liberty depends upon personal data remaining confidential.", "We must not allow the data protection principle to be abandoned.", "We cannot be certain that governments will not misuse personal data.", "The Data Protection Act does not interfere with the detection of crime.", "The recording and storing of personal data poses a threat to our privacy."], "correct": 1, "src": "MC"}, {"id": 26, "text": "Increased wealth in many regions and an ever-growing population have produced an unprecedented demand for fish. This increased demand is occurring at a time when over 70% of the world’s marine fish stocks are now overfished or already fished at full capacity. One possible solution is the continued expansion of aquaculture, a long-standing means of farming fish for human consumption. Controls must be put into place, however, to manage the potential environmental risks associated with fish farming, such as water pollution and transmission of disease to adjacent wild fish populations. Moreover, the aquaculture sector has yet to devise effective methods for rearing some commercially popular predator species, such as tuna, without having to feed them wild-caught fish, which contributes to the pressure on our oceans.<br><br><b>Which one of the following can be drawn as a conclusion from the above passage?<\/b>", "options": ["We should encourage people to switch from consuming marine fish species to consuming freshwater fish species, such as those living in lakes and rivers.", "Nothing can be done to make fishing in the oceans less damaging to the state of fish stocks.", "In the long term, people may have to adopt a vegetarian diet due to the environmental problems associated with the production of all kinds of fish and meat products.", "At present, fish farms should avoid trying to rear predator fish, such as tuna.", "The farming of only some kinds of fish is likely to result in environmental damage."], "correct": 3, "src": "CON"}, {"id": 27, "text": "Despite the recent decline in numbers of people getting married, it appears that there is still much to recommend it. Married people are happier, wealthier and live longer. Husbands and wives have a lower risk of disease and a higher life expectancy. They smoke less, drink less and eat more healthily. Those who get married and stay married have on average double the amount of wealth of those who never marry. Surveys show that they are happier than single people and less likely to experience mid-life depression. Married couples benefit from stronger networks of support, with relatives providing more care and assistance in old age and in times of need. Finding and committing to a marriage partner is a goal well worth pursuing.<br><br><b>Which one of the following, if true, most weakens the above reasoning?<\/b>", "options": ["Research suggests that being married boosts the chances of surviving cancer.", "Statistics on marriage do not differentiate between those who have children and those who do not.", "In many countries, being married gives advantages in terms of tax payments.", "Individuals in conflict-ridden relationships are more prone to illness than happy couples.", "Wealthier couples are four times more likely to marry than poorer couples."], "correct": 4, "src": "EF"}, {"id": 28, "text": "An intensely irritating fashion among politicians of all parties is to use the sound bite 'doing the right thing' to justify whatever action they have taken or propose to take. The phrase cleverly implies that if you do not agree with the action you are an immoral person – and no-one wants to be that. Taken to its logical conclusion, all we need are politicians who have some sixth sense that tells them what 'the right thing' is, and, hey presto, we can trust them to act on our behalf without any need for accountability. This is nothing short of dangerous brainwashing.<br><br><b>Which one of the following can be drawn as a conclusion of the passage above?<\/b>", "options": ["Sound bites are used to avoid proper explanations for decisions.", "Politicians always think they know what is the right thing to do.", "Politicians should give proper rationales for their decisions, not glib sound bites.", "Irritating sound bites have the effect of alienating the general public.", "Politicians prefer to avoid giving a proper rationale for their decisions."], "correct": 2, "src": "CON"}, {"id": 29, "text": "The museum has decided to spend money in the hope of staying profitable and, therefore, remaining open. It has opened an expensive new front hall, which is very big and well planned, and will undoubtedly impress new visitors. For serious students, however, it has nothing to offer that was not there before. All the scholars who want to do so already use the museum, they will continue to come however artistic the displays may or may not be. So, it was a waste to spend so much money on appearances, the money should have been spent on improving conditions for those who come to study.<br><br><b>Which one of the following is the best statement of the flaw in the above argument?<\/b>", "options": ["The museum cannot be sure that new visitors will be attracted by its new front hall.", "There is no evidence that visitors to museums are interested in the conditions in which the contents are displayed.", "If scholars will continue to come anyway, the museum will not make more money by improving their conditions.", "There is no contact or sympathy between serious scholars and members of the general public in museums.", "It is regular users, and not potential new visitors, to the museum who deserve to be rewarded."], "correct": 2, "src": "FLAW"}, {"id": 30, "text": "There has been a significant rise in the number of children with rickets. This has resulted from the airless, indoor world we have created for ourselves. Rickets is caused by a deficiency of vitamin D, which is produced in response to sunlight on the skin. Where children used to play outside they mostly stay indoors immersed in virtual realities via various electronic media. Instead of long summer evenings outdoors, we close the curtains to prevent sunlight falling on our screens. The lure of technology is compounded by adult fears of the risks to children if they are left to roam free in the outside world; in any case there are fewer accessible public spaces for open air activity. Curing this will require an awful lot more than vitamin pills.<br><br><b>Which one of the following, if true, most weakens the above argument?<\/b>", "options": ["There has been a large growth in areas designated as national parks and in urban parkland.", "Diet has a much more significant effect on vitamin D intake than sunlight.", "The incidence of rickets is confined to a few hundred cases a year.", "In the 19th century, when the incidence of rickets was much higher, terrible air pollution and smog affected the large population of city dwellers.", "Many people can’t afford or be relied on to take vitamin D supplements."], "correct": 1, "src": "EF"}];

    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img src="${q.image}" class="question-img" alt="Рисунок к вопросу">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Назад</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Завершить тест</button>'
        : '<button class="nav-btn" id="next">Далее &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: история результатов (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // первая попытка — истории ещё нет
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">История попыток &middot; лучший результат ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Итог</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Процент</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Не отвечено</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${q.id}. ${q.text}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Твой ответ: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--sage); font-weight:600;">Правильный: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Пройти ещё раз</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<!-- ===== Prepline × Supabase: авторизация + облачное сохранение ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: перехватываем saveAttempt — localStorage остаётся, добавляем облако */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: saveAttempt нет, оборачиваем finish */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>
