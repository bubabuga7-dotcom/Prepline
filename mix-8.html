<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.12);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --no: #F87171; --no-bg: rgba(248,113,113,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }

  a.back { color: var(--text); opacity: 0.7; text-decoration: none; font-size: 14px; }
  a.back:hover { opacity: 1; color: var(--violet); }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,14,30,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-line);
  }
  .topbar-inner { max-width: 760px; margin: 0 auto; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }

  #timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500;

    font-weight: 500; margin-bottom: 8px; display: inline-block;

  .q-text { font-size: 15px; color: var(--text-bright); font-weight: 500; margin-bottom: 14px; }
  .q-img { max-width: 100%; height: auto; border-radius: 10px; background: #fff; padding: 8px; margin: 0 0 14px; display: block; }
  .opt {
    display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;

    color: var(--text); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;

<script>
const QUESTIONS = [{"id":1,"text":"A right-angled triangle has a horizontal side of (4 + √2) cm and a vertical side of (2 − √2) cm. Calculate the area of the triangle.","img":"images/q-51f54129d5.png","options":["(3 − 3√2) cm²","(3 + 3√2) cm²","(3 − √2) cm²","(5 − √2) cm²","(5 − 3√2) cm²","(5 + 3√2) cm²"],"correct":2,"topic":"M2.11"},{"id":2,"text":"Simplify: ( 2x3/2y³ / √z )²","img":null,"options":["4x⁶y⁵ / z²","4x³y⁶ / z","4x³y⁵ / z","4x<sup>5/2</sup>y⁵ / z","4x<sup>5/2</sup>y⁵ / z²"],"correct":1,"topic":"M4.2"},{"id":3,"text":"Spearman's rank correlation coefficient is given by r = 1 − 6Σd² / (n(n² − 1)). Make Σd² the subject.","img":null,"options":["Σd² = 1 − r(n³ − n)/6","Σd² = ((1 − r)(n³ − n)/6)²","Σd² = (1 − r)(n³ − 1)/6","Σd² = (1 + r)(n³ − n)/6","Σd² = (1 − r)(n³ − n)/6"],"correct":4,"topic":"M4.7"},{"id":4,"text":"These graphs are drawn: 1) y = 3x − 2;  2) y = x²;  3) y = 1 − x²;  4) y = x + 6. Which pair of graphs does not intersect?","img":null,"options":["1 and 2","1 and 3","2 and 3","2 and 4","3 and 4"],"correct":4,"topic":"M4.15"},{"id":5,"text":"A solid sphere of radius r fits inside a hollow cylinder whose internal diameter and length are both equal to the diameter of the sphere. What fraction of the volume of the cylinder does the sphere occupy?","img":null,"options":["1/4","1/3","1/2","2/3","3/4"],"correct":3,"topic":"M5.15"},{"id":6,"text":"PQR is an isosceles triangle with PQ = PR = 6 cm and QR = 8 cm. What is the tangent of angle PQR?","img":null,"options":["2/√13","2/√5","2/3","3/2","√5/2","√13/2"],"correct":4,"topic":"M5.18"},{"id":7,"text":"a = 3/(5 + X), b = (3 + X)/5 and c = (3 + X)/(5 + X), where X is an integer greater than zero. Which is true?","img":null,"options":["a &lt; b &lt; c for all X","a &lt; c &lt; b for all X","b &lt; a &lt; c for all X","b &lt; c &lt; a for all X","c &lt; a &lt; b for all X","c &lt; b &lt; a for all X","The order depends on X"],"correct":1,"topic":"M2.1"},{"id":8,"text":"A town football club raised money for charity. The total was shared between funds A, B and C in the ratio 1 : 2/3 : 4/5. Fund C received £3 000. How much was raised in total during the year?","img":null,"options":["£3 750","£7 000","£8 250","£9 000","£9 250","£12 375"],"correct":4,"topic":"M3.4"},{"id":9,"text":"Simplify: (2x+3)/(2x−3) + (2x−3)/(2x+3) − 2","img":null,"options":["0","2(2x−1) / ((2x−3)(2x+3))","18 / ((2x−3)(2x+3))","36 / ((2x−3)(2x+3))","8(x²−2) / ((2x−3)(2x+3))","12 / (2x−3)"],"correct":3,"topic":"M4.6"},{"id":10,"text":"Given 4p × 8q = 2n, express n in terms of p and q.","img":null,"options":["n = p + q","n = 2p + 3q","n = 2p + 4q","n = p + q + 5","n = 6pq"],"correct":1,"topic":"M4.2"},{"id":11,"text":"The diagram shows part of a glass structure. PQRS is a horizontal square of side 1 m, and the point X is 4 m vertically above P. What is the cosine of the angle between XR and the horizontal?","img":"images/q-1aa803f952.png","options":["1/3","√2/4","√2/(2√3)","4/(3√2)","2/√3","1/√17","1/17"],"correct":0,"topic":"M5.18"},{"id":12,"text":"Given x = 4.6 × 10⁷ and y = 2 × 10⁶, what is (x + 7y)/(x − 2y)?","img":null,"options":["10/7","1 2/3","3.1","7","10","31"],"correct":0,"topic":"M2.8"},{"id":13,"text":"Square ABCD, with vertices (1,1), (−1,1), (−1,−1) and (1,−1), is rotated 90° clockwise about the origin and then reflected in the line y = x. Which transformation returns the square to its original orientation?","img":null,"options":["Reflection in the x-axis","Reflection in the y-axis","Reflection in the line y = −x","Rotation of 90° clockwise about the origin","Rotation of 90° anticlockwise about the origin"],"correct":1,"topic":"M5.6"},{"id":14,"text":"The variables x, y and z are related as follows: x is directly proportional to the square of z, and y is inversely proportional to the cube of z. Which correctly describes the relationship between x and y?","img":null,"options":["The square of x is directly proportional to the cube of y","The square of x is inversely proportional to the cube of y","The cube of x is directly proportional to the square of y","The cube of x is inversely proportional to the square of y","x is directly proportional to y⁶"],"correct":3,"topic":"M3.9"},{"id":15,"text":"A shape is made from three cubes, the largest at the bottom and the smallest on top. At each join, the corners of the smaller cube lie at the midpoints of the sides of a face of the larger cube. The side of the smallest cube is 1 cm. What is the total surface area of the shape?","img":"images/q-9ab1ea4c2e.png","options":["30 cm²","32 cm²","33 cm²","36 cm²","39 cm²","42 cm²"],"correct":3,"topic":"M5.15"},{"id":16,"text":"A pattern is formed by four circles that touch at the top point (diagram not to scale). The diameters are d, 2d, 3d and 4d. Find the area of the shaded part of the pattern.","img":"images/q-6247ad2579.png","options":["(5/2)πd²","4πd²","(1/4)πd²","10πd²","(3/2)πd²"],"correct":0,"topic":"M5.15"},{"id":17,"text":"Evaluate: ∛( 2×10⁵ / (5×10⁻³)² ) − √( 4×10³ − 4×10² )","img":null,"options":["−6.2","160 − 20√5","140","240 − 20√5","1940"],"correct":4,"topic":"M2.8"},{"id":18,"text":"In triangle ABC (not to scale), tan A = 1/6 and tan B = 2/3. M is the midpoint of AB. What is tan θ?","img":"images/q-fc1365cd5c.png","options":["1/9","5/12","4/9","1/2","5/6"],"correct":2,"topic":"M5.18"},{"id":19,"text":"A new sign for a local business is made of two parts, wood and metal. The metal costs 3 times as much as the wood per unit. The cost of the metal is proportional to the diameter of the sign, and the cost of the wood is proportional to the square of the diameter. If the diameter is doubled, the total cost of the materials triples. What percentage of the cost of the sign, to the nearest 1%, is metal?","img":null,"options":["25%","33%","50%","67%","75%"],"correct":2,"topic":"M3.9"},{"id":20,"text":"w, x, y and z are integers with w &lt; x², x &gt; y², y² &lt; z² and x &gt; z. Which inequality must be true?","img":null,"options":["w &lt; x","w &gt; y","w &lt; z","x &gt; y","y &lt; z"],"correct":3,"topic":"M2.1"},{"id":21,"text":"There are two containers of different capacity. The larger is full of water and the smaller is empty. Water is poured from the larger into the smaller until the volumes of water in them are equal. The water in the larger container is now a fraction p of its capacity, and the water in the smaller is a fraction q of its capacity. Which must be true?","img":null,"options":["p + q = 1 (but p and q are not necessarily 0.5 each)","p = 0.5 and q = 0.5","p = 0.5 and q &gt; 0.5","p &gt; 0.5 and q = 0.5","p &gt; 0.5 and q &gt; 0.5"],"correct":2,"topic":"M3.2"},{"id":22,"text":"The total surface area of a cylinder is numerically equal to its volume. The radius is r cm and the height is h cm. Express h in terms of r.","img":null,"options":["h = 2r/(r − 2)","h = 2r/(r + 2)","h = r + 2","h = r − 2","h = 2r(r − 2)"],"correct":0,"topic":"M4.7"},{"id":23,"text":"A pattern is built by joining points one third of the way along the sides of a square, forming a second square. The process is then repeated. Find the area of the fourth square as a fraction of the area of the original square.","img":null,"options":["1/27","5√5/81","125/729","25/81","5√5/27"],"correct":2,"topic":"M3.10"},{"id":24,"text":"The binary operation © is defined by x © y = √(x/y). What is (24 © 6) © 2?","img":null,"options":["√2","6√3","2","2√2","1"],"correct":4,"topic":"M4.3"},{"id":25,"text":"Solve the inequality: x² + 5x − 14 ≤ 0","img":null,"options":["[−2, 7]","[−7, 2]","(−7, 2)","[2, 7)","(−2, 7]"],"correct":1,"topic":"M4.16"},{"id":26,"text":"The equation 2x(ax − 4) − x² + 6 = 0 has no real roots. What is the smallest possible integer value of a?","img":null,"options":["−1","2","3","4","5"],"correct":1,"topic":"M4.16"},{"id":27,"text":"Given x − y = 4 and x² − y² = 24, find xy.","img":null,"options":["96","48","32","5","Cannot be determined"],"correct":3,"topic":"M4.5"},{"id":28,"text":"The line ax − by = −9 passes through A(−1, 3) and B(−3, 0). Find a + b.","img":null,"options":["5","6","8","10","12"],"correct":0,"topic":"M4.15"},{"id":29,"text":"The point A(a, b) lies in the fourth quadrant of the coordinate plane. In which quadrant does the point B(−a, −b) lie?","img":null,"options":["I","II","III","IV"],"correct":1,"topic":"M4.9"},{"id":30,"text":"47 is split into three numbers. The second is 8 more than the first and 10 less than the third. Find the first number.","img":null,"options":["3","5","7","9","12"],"correct":2,"topic":"M4.15"}];
const DURATION = 30 * 60;

const state = { answers: {}, finished: false, timeLeft: DURATION };
const LETTERS = ['A','B','C','D','E','F','G'];

function render() {
  const root = document.getElementById('quiz');
  root.innerHTML = QUESTIONS.map(q => `
    <div class="q-card" id="qc-${q.id}">
      <span class="q-num">Question ${q.id} / 30</span>
      <div class="q-text">${q.text}</div>
      ${q.img ? `<img loading="lazy" class="q-img" src="${q.img}" alt="Diagram for question ${q.id}">` : ''}
      ${q.options.map((o,i) => `
        <button class="opt" data-q="${q.id}" data-i="${i}">
          <span class="letter">${LETTERS[i]}.</span><span>${o}</span>
        </button>`).join('')}
    </div>`).join('');

  root.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.finished) return;
      const qid = +btn.dataset.q, idx = +btn.dataset.i;
      state.answers[qid] = idx;
      document.querySelectorAll(`.opt[data-q="${qid}"]`).forEach(o => o.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
}

function finish(reason) {
  if (state.finished) return;
  state.finished = true;
  clearInterval(timerInt);

  let score = 0;
  QUESTIONS.forEach(q => { if (state.answers[q.id] === q.correct) score++; });

  /* Prepline: save the result */
  let hist = [];
  try {
    const key = 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
    hist = JSON.parse(localStorage.getItem(key) || '[]');
    hist.push({ t: Date.now(), s: score, n: QUESTIONS.length });
    localStorage.setItem(key, JSON.stringify(hist.slice(-50)));
  } catch (e) {}

  QUESTIONS.forEach(q => {
    const card = document.getElementById('qc-' + q.id);
    const user = state.answers[q.id];
    card.querySelectorAll('.opt').forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      else if (i === user) btn.classList.add('wrong');
    });
    const ok = user === q.correct;
    const div = document.createElement('div');
    div.className = 'review-answer';
    div.innerHTML = ok
      ? `<span class="ok">&#10003; Correct.</span> Correct answer: ${LETTERS[q.correct]}`
      : `<span class="no">&#10007; ${user === undefined ? 'No answer' : 'Incorrect'}.</span> Correct answer: <b>${LETTERS[q.correct]}</b> — ${q.options[q.correct]}`;
    card.appendChild(div);
  });

  const res = document.getElementById('result');
  res.style.display = 'block';
  document.getElementById('score-num').textContent = score + ' / 30';
  const pct = Math.round(score / 30 * 100);
  document.getElementById('score-text').textContent =
    (reason === 'time' ? 'Time is up. ' : '') + pct + '% — the breakdown is under each question.';
  if (hist.length >= 2) {
    const best = Math.max.apply(null, hist.map(a => a.s));
    const prev = hist.slice(-6, -1).reverse().map(a => {
      const d = new Date(a.t);
      return d.toLocaleDateString('ru-RU') + ' — ' + a.s + '/' + a.n;
    }).join(' &middot; ');
    const el = document.createElement('p');
    el.style.cssText = 'margin-top:10px;font-size:13px;opacity:0.75;';
    el.innerHTML = 'Best: <b>' + best + '/30</b>. Previous: ' + prev;
    document.getElementById('result').appendChild(el);
  }
  document.getElementById('submit-btn').style.display = 'none';
  res.scrollIntoView({ behavior: 'smooth' });
}

const timerEl = document.getElementById('timer');
const timerInt = setInterval(() => {
  state.timeLeft--;
  const m = Math.floor(state.timeLeft / 60), s = state.timeLeft % 60;
  timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  if (state.timeLeft <= 300) timerEl.classList.add('low');
  if (state.timeLeft <= 0) finish('time');
}, 1000);

document.getElementById('submit-btn').addEventListener('click', () => {
  const unanswered = QUESTIONS.filter(q => !(q.id in state.answers)).length;
  if (unanswered > 0 && !confirm('Unanswered: ' + unanswered + ' question(s). Finish anyway?')) return;
  finish('manual');
});
</script>

<!-- ===== Prepline x Supabase: auth + cloud saving ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 9px 20px;
  }
  .pl-nav button:disabled { opacity: .35; cursor: default; }
  .pl-nav span { font: 500 13px 'Inter', system-ui, sans-serif; opacity: .7; }
</style>

<script id="prepline-mix8-fix">
(function () {
  function boot() {
    if (typeof render !== 'function' || typeof QUESTIONS === 'undefined') return;

    var quiz = document.getElementById('quiz');
    if (!quiz) return;

    // 1. главное: нарисовать вопросы
    if (!quiz.querySelector('.q-card')) {
      try { render(); } catch (e) { console.error('[Prepline] render:', e); return; }
    }

    var cards = [].slice.call(quiz.querySelectorAll('.q-card'));
    if (!cards.length) return;

    // 2. переключатель режимов
    var bar = document.createElement('div');
    bar.className = 'pl-mode';
    bar.innerHTML = '<button type="button" data-m="all" class="on">Scroll view</button>' +
                    '<button type="button" data-m="one">One at a time</button>';
    quiz.parentNode.insertBefore(bar, quiz);

    var nav = document.createElement('div');
    nav.className = 'pl-nav';
    nav.style.display = 'none';
    nav.innerHTML = '<button type="button" id="pl-prev">&larr; Back</button>' +
                    '<span id="pl-pos"></span>' +
                    '<button type="button" id="pl-next">Next &rarr;</button>';
    quiz.parentNode.insertBefore(nav, quiz.nextSibling);

    var idx = 0;
    var mode = 'all';

    function paint() {
      if (mode === 'all') {
        for (var i = 0; i < cards.length; i++) cards[i].style.display = '';
        nav.style.display = 'none';
        return;
      }
      for (var j = 0; j < cards.length; j++) cards[j].style.display = (j === idx ? '' : 'none');
      nav.style.display = 'flex';
      document.getElementById('pl-pos').textContent = 'Question ' + (idx + 1) + ' of ' + cards.length;
      document.getElementById('pl-prev').disabled = (idx === 0);
      document.getElementById('pl-next').disabled = (idx === cards.length - 1);
    }

    var mb = bar.querySelectorAll('button');
    for (var k = 0; k < mb.length; k++) {
      mb[k].onclick = function () {
        mode = this.dataset.m;
        for (var n = 0; n < mb.length; n++) mb[n].classList.toggle('on', mb[n].dataset.m === mode);
        paint();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }
    document.getElementById('pl-prev').onclick = function () {
      idx = Math.max(0, idx - 1); paint(); window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    document.getElementById('pl-next').onclick = function () {
      idx = Math.min(cards.length - 1, idx + 1); paint(); window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // при показе результатов возвращаем ленту, чтобы был виден весь разбор
    var res = document.getElementById('result');
    if (res && window.MutationObserver) {
      new MutationObserver(function () {
        if (res.style.display === 'block' && mode !== 'all') {
          mode = 'all';
          for (var n = 0; n < mb.length; n++) mb[n].classList.toggle('on', mb[n].dataset.m === 'all');
          paint();
        }
      }).observe(res, { attributes: true, attributeFilter: ['style'] });
    }

    paint();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<div id="pl-gate">
  <div class="box">
    <h3>Sign in to start this test</h3>
    <p>Sign in or create an account to start this test. Your results will be saved to your account.</p>
    <div class="row">
      <button class="go" id="plGateGo">Sign in or create an account</button>
      <button class="back" id="plGateBack">Back to the list</button>
    </div>
  </div>
</div>
<script id="prepline-gate">
(function () {
  const gate = document.getElementById('pl-gate');
  if (!gate) return;

  function show(){ gate.classList.add('on'); }
  function hide(){ gate.classList.remove('on'); }

  document.getElementById('plGateGo').onclick = () => {
    hide();
    const pill = document.getElementById('plPill');
    if (pill) pill.click();          // открываем штатное окно входа
  };
  document.getElementById('plGateBack').onclick = () => {
    const isCT = /crit-\d/.test(location.pathname);
    location.href = isCT ? 'crit.html' : 'math.html';
  };

  async function check(){
    const supa = window.preplineSupa;
    if (!supa) return;               // база не поднялась — не мешаем работать
    try {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) show(); else hide();
    } catch (e) { /* молча пропускаем */ }
  }

  setTimeout(check, 500);
  const supa = window.preplineSupa;
  if (supa && supa.auth && supa.auth.onAuthStateChange) {
    supa.auth.onAuthStateChange(() => check());
  }
})();
</script>
