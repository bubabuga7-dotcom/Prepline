<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест 8 — Prepline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1E; --card: rgba(14,20,48,0.72); --text: #C9D2F0; --text-bright: #F2F5FF;
    --blue: #60A5FA; --violet: #A78BFA; --pink: #F472B6;
    --grad: linear-gradient(90deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%);
    --glass-line: rgba(255,255,255,0.12);
    --ok: #34D399; --ok-bg: rgba(52,211,153,0.14);
    --no: #F87171; --no-bg: rgba(248,113,113,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,30,0.78) 0%, rgba(10,14,30,0.88) 100%); }
  h1, h2, h3 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 80px; position: relative; z-index: 1; }
  a.back { color: var(--text); opacity: 0.7; text-decoration: none; font-size: 14px; }
  a.back:hover { opacity: 1; color: var(--violet); }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,14,30,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-line);
  }
  .topbar-inner { max-width: 760px; margin: 0 auto; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
  .topbar h1 { font-size: 17px; }
  #timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500;
    color: var(--text-bright); background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-line); padding: 4px 14px; border-radius: 999px;
  }
  #timer.low { color: #FCA5A5; border-color: rgba(248,113,113,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }

  .q-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .q-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 500; margin-bottom: 8px; display: inline-block;
  }
  .q-text { font-size: 15px; color: var(--text-bright); font-weight: 500; margin-bottom: 14px; }
  .q-img { max-width: 100%; height: auto; border-radius: 10px; background: #fff; padding: 8px; margin: 0 0 14px; display: block; }
  .opt {
    display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
    border: 1px solid var(--glass-line); background: rgba(255,255,255,0.03);
    color: var(--text); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
    font-size: 14px; font-family: inherit; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(167,139,250,0.09); }
  .opt .letter { font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: var(--violet); flex-shrink: 0; }
  .opt.selected { border-color: var(--blue); background: rgba(96,165,250,0.14); color: var(--text-bright); }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); color: #D1FAE5; }
  .opt.wrong { border-color: var(--no); background: var(--no-bg); color: #FECACA; }
  .opt:disabled { cursor: default; }

  .submit-row { text-align: center; margin-top: 28px; }
  .btn {
    display: inline-block; border: none; cursor: pointer;
    background: var(--grad); background-size: 200% 100%;
    color: #fff; font-weight: 600; font-size: 15px; font-family: inherit;
    padding: 14px 30px; border-radius: 999px;
    transition: background-position .4s, box-shadow .3s;
  }
  .btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(167,139,250,0.5); }

  #result {
    display: none; background: var(--card); border: 1px solid var(--glass-line);
    border-radius: 14px; padding: 24px; margin-bottom: 20px; text-align: center;
  }
  #result .score {
    font-family: 'IBM Plex Mono', monospace; font-size: 42px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #result p { margin-top: 4px; opacity: 0.85; }
  .review-answer { font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--glass-line); }
  .review-answer .ok { color: var(--ok); font-weight: 600; }
  .review-answer .no { color: var(--no); font-weight: 600; }
  .progress { font-size: 13px; opacity: 0.7; margin: 14px 0 18px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="page-photo"></div>

<div class="topbar">
  <div class="topbar-inner">
    <h1>Mixed Mock #8 · Математика</h1>
    <div id="timer">30:00</div>
  </div>
</div>

<div class="wrap">
  <a href="math.html" class="back">&larr; К списку моков</a>
  <p class="progress">30 вопросов · 30 минут · источник: Mock 6 (ответы сверены по решениям)</p>
  <div id="result">
    <div class="score" id="score-num"></div>
    <p id="score-text"></p>
  </div>
  <div id="quiz"></div>
  <div class="submit-row"><button class="btn" id="submit-btn">Завершить тест</button></div>
</div>

<script>
const QUESTIONS = [{"id": 1, "text": "Прямоугольный треугольник имеет горизонтальную сторону (4 + √2) см и вертикальную (2 − √2) см. Вычислите площадь треугольника.", "img": "images/q-51f54129d5.png", "options": ["(3 − 3√2) см²", "(3 + 3√2) см²", "(3 − √2) см²", "(5 − √2) см²", "(5 − 3√2) см²", "(5 + 3√2) см²"], "correct": 2}, {"id": 2, "text": "Упростите: ( 2x<sup>3/2</sup>y³ / √z )²", "img": null, "options": ["4x⁶y⁵ / z²", "4x³y⁶ / z", "4x³y⁵ / z", "4x<sup>5/2</sup>y⁵ / z", "4x<sup>5/2</sup>y⁵ / z²"], "correct": 1}, {"id": 3, "text": "Коэффициент ранговой корреляции Спирмена: r = 1 − 6Σd² / (n(n² − 1)). Выразите Σd².", "img": null, "options": ["Σd² = 1 − r(n³ − n)/6", "Σd² = ((1 − r)(n³ − n)/6)²", "Σd² = (1 − r)(n³ − 1)/6", "Σd² = (1 + r)(n³ − n)/6", "Σd² = (1 − r)(n³ − n)/6"], "correct": 4}, {"id": 4, "text": "Построены графики: 1) y = 3x − 2; 2) y = x²; 3) y = 1 − x²; 4) y = x + 6. Какая пара графиков <b>не</b> пересекается?", "img": null, "options": ["1 и 2", "1 и 3", "2 и 3", "2 и 4", "3 и 4"], "correct": 4}, {"id": 5, "text": "Сплошной шар радиуса r вписан в полый цилиндр: внутренний диаметр и длина цилиндра равны диаметру шара. Какую долю объёма цилиндра занимает шар?", "img": null, "options": ["1/4", "1/3", "1/2", "2/3", "3/4"], "correct": 3}, {"id": 6, "text": "PQR — равнобедренный треугольник, PQ = PR = 6 см, QR = 8 см. Чему равен тангенс угла PQR?", "img": null, "options": ["2/√13", "2/√5", "2/3", "3/2", "√5/2", "√13/2"], "correct": 4}, {"id": 7, "text": "Дано: a = 3/(5+X), b = (3+X)/5, c = (3+X)/(5+X), где X — целое число больше нуля. Что верно?", "img": null, "options": ["a &lt; b &lt; c при всех X", "a &lt; c &lt; b при всех X", "b &lt; a &lt; c при всех X", "b &lt; c &lt; a при всех X", "c &lt; a &lt; b при всех X", "c &lt; b &lt; a при всех X", "Порядок зависит от X"], "correct": 1}, {"id": 8, "text": "Городской футбольный клуб собирал деньги на благотворительность. Итог разделили между фондами A, B и C в отношении 1 : 2/3 : 4/5. Фонд C получил £3 000. Сколько всего собрали за год?", "img": null, "options": ["£3 750", "£7 000", "£8 250", "£9 000", "£9 250", "£12 375"], "correct": 4}, {"id": 9, "text": "Упростите: (2x+3)/(2x−3) + (2x−3)/(2x+3) − 2", "img": null, "options": ["0", "2(2x−1) / ((2x−3)(2x+3))", "18 / ((2x−3)(2x+3))", "36 / ((2x−3)(2x+3))", "8(x²−2) / ((2x−3)(2x+3))", "12 / (2x−3)"], "correct": 3}, {"id": 10, "text": "Дано 4<sup>p</sup> × 8<sup>q</sup> = 2<sup>n</sup>. Выразите n через p и q.", "img": null, "options": ["n = p + q", "n = 2p + 3q", "n = 2p + 4q", "n = p + q + 5", "n = 6pq"], "correct": 1}, {"id": 11, "text": "На рисунке — часть стеклянной конструкции. PQRS — горизонтальный квадрат со стороной 1 м, точка X находится на 4 м вертикально выше P. Чему равен косинус угла между XR и горизонталью?", "img": "images/q-1aa803f952.png", "options": ["1/3", "√2/4", "√2/(2√3)", "4/(3√2)", "2/√3", "1/√17", "1/17"], "correct": 0}, {"id": 12, "text": "Дано x = 4.6 × 10⁷ и y = 2 × 10⁶. Чему равно (x + 7y)/(x − 2y)?", "img": null, "options": ["10/7", "1 2/3", "3.1", "7", "10", "31"], "correct": 0}, {"id": 13, "text": "Квадрат ABCD с вершинами (1,1), (−1,1), (−1,−1), (1,−1) повернули на 90° по часовой стрелке вокруг начала координат, затем отразили относительно прямой y = x. Какое преобразование вернёт квадрат в исходную ориентацию?", "img": null, "options": ["Отражение относительно оси x", "Отражение относительно оси y", "Отражение относительно прямой y = −x", "Поворот на 90° по часовой стрелке вокруг начала координат", "Поворот на 90° против часовой стрелки вокруг начала координат"], "correct": 1}, {"id": 14, "text": "Переменные x, y, z связаны так: x прямо пропорционален квадрату z; y обратно пропорционален кубу z. Что верно описывает связь x и y?", "img": null, "options": ["Квадрат x прямо пропорционален кубу y", "Квадрат x обратно пропорционален кубу y", "Куб x прямо пропорционален квадрату y", "Куб x обратно пропорционален квадрату y", "x прямо пропорционален y⁶"], "correct": 3}, {"id": 15, "text": "Фигура составлена из трёх кубов: самый большой снизу, самый маленький сверху. В местах соединения углы меньшего куба лежат в серединах сторон грани большего. Сторона наименьшего куба — 1 см. Какова полная площадь поверхности фигуры?", "img": "images/q-9ab1ea4c2e.png", "options": ["30 см²", "32 см²", "33 см²", "36 см²", "39 см²", "42 см²"], "correct": 3}, {"id": 16, "text": "Узор образован четырьмя окружностями, касающимися в верхней точке (рисунок не в масштабе). Диаметры: d, 2d, 3d и 4d. Найдите площадь закрашенной части узора.", "img": "images/q-6247ad2579.png", "options": ["(5/2)πd²", "4πd²", "(1/4)πd²", "10πd²", "(3/2)πd²"], "correct": 0}, {"id": 17, "text": "Вычислите: ∛( 2×10⁵ / (5×10⁻³)² ) − √( 4×10³ − 4×10² )", "img": null, "options": ["−6.2", "160 − 20√5", "140", "240 − 20√5", "1940"], "correct": 4}, {"id": 18, "text": "В треугольнике ABC (не в масштабе): tan A = 1/6, tan B = 2/3. M — середина AB. Чему равен tan θ?", "img": "images/q-fc1365cd5c.png", "options": ["1/9", "5/12", "4/9", "1/2", "5/6"], "correct": 2}, {"id": 19, "text": "Вывеска состоит из двух частей: дерево и металл. Металл втрое дороже дерева. Стоимость металла пропорциональна диаметру вывески, стоимость дерева — квадрату диаметра. Если диаметр удвоить, общая стоимость материалов утроится. Какой процент стоимости вывески (с точностью до 1%) составляет металл?", "img": null, "options": ["25%", "33%", "50%", "67%", "75%"], "correct": 2}, {"id": 20, "text": "w, x, y, z — целые числа: w &lt; x², x &gt; y², y² &lt; z², x &gt; z. Какое неравенство <b>обязательно</b> верно?", "img": null, "options": ["w &lt; x", "w &gt; y", "w &lt; z", "x &gt; y", "y &lt; z"], "correct": 3}, {"id": 21, "text": "Есть два сосуда разной ёмкости. Больший полон воды, меньший пуст. Воду переливают из большего в меньший, пока объёмы воды в них не сравняются. Объём воды в большом теперь p от его ёмкости, в малом — q от его ёмкости. Что обязательно верно?", "img": null, "options": ["p + q = 1 (но p и q не обязательно по 0.5)", "p = 0.5 и q = 0.5", "p = 0.5 и q &gt; 0.5", "p &gt; 0.5 и q = 0.5", "p &gt; 0.5 и q &gt; 0.5"], "correct": 2}, {"id": 22, "text": "Полная площадь поверхности цилиндра численно равна его объёму. Радиус — r см, высота — h см. Выразите h через r.", "img": null, "options": ["h = 2r/(r − 2)", "h = 2r/(r + 2)", "h = r + 2", "h = r − 2", "h = 2r(r − 2)"], "correct": 0}, {"id": 23, "text": "Узор строится соединением точек, лежащих на трети длины сторон квадрата — образуется второй квадрат. Процесс повторяется. Найдите площадь четвёртого квадрата как долю площади исходного.", "img": null, "options": ["1/27", "5√5/81", "125/729", "25/81", "5√5/27"], "correct": 2}, {"id": 24, "text": "Бинарная операция © определена как x © y = √(x/y). Чему равно (24 © 6) © 2?", "img": null, "options": ["√2", "6√3", "2", "2√2", "1"], "correct": 4}, {"id": 25, "text": "Решите неравенство: x² + 5x − 14 ≤ 0", "img": null, "options": ["[−2, 7]", "[−7, 2]", "(−7, 2)", "[2, 7)", "(−2, 7]"], "correct": 1}, {"id": 26, "text": "Уравнение 2x(ax − 4) − x² + 6 = 0 не имеет действительных корней. Каково наименьшее возможное целое значение a?", "img": null, "options": ["−1", "2", "3", "4", "5"], "correct": 1}, {"id": 27, "text": "Даны уравнения x − y = 4 и x² − y² = 24. Найдите xy.", "img": null, "options": ["96", "48", "32", "5", "Невозможно найти"], "correct": 3}, {"id": 28, "text": "Прямая ax − by = −9 проходит через A(−1, 3) и B(−3, 0). Найдите a + b.", "img": null, "options": ["5", "6", "8", "10", "12"], "correct": 0}, {"id": 29, "text": "Точка A(a, b) лежит в четвёртой четверти координатной плоскости. В какой четверти лежит точка B(−a, −b)?", "img": null, "options": ["I", "II", "III", "IV"], "correct": 1}, {"id": 30, "text": "Число 47 разделили на три числа. Второе число на 8 больше первого и на 10 меньше третьего. Найдите первое число.", "img": null, "options": ["3", "5", "7", "9", "12"], "correct": 2}];
const DURATION = 30 * 60;

const state = { answers: {}, finished: false, timeLeft: DURATION };
const LETTERS = ['A','B','C','D','E','F','G'];

function render() {
  const root = document.getElementById('quiz');
  root.innerHTML = QUESTIONS.map(q => `
    <div class="q-card" id="qc-${q.id}">
      <span class="q-num">Вопрос ${q.id} / 30</span>
      <div class="q-text">${q.text}</div>
      ${q.img ? `<img loading="lazy" class="q-img" src="${q.img}" alt="Чертёж к вопросу ${q.id}">` : ''}
      ${q.options.map((o,i) => `
        <button class="opt" data-q="${q.id}" data-i="${i}">
          <span class="letter">${LETTERS[i]}.</span><span>${o}</span>
        </button>`).join('')}
    </div>`).join('');

  root.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.finished) return;
      const qid = +btn.dataset.q, idx = +btn.dataset.i;
      state.answers[qid] = idx;
      document.querySelectorAll(`.opt[data-q="${qid}"]`).forEach(o => o.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
}

function finish(reason) {
  if (state.finished) return;
  state.finished = true;
  clearInterval(timerInt);

  let score = 0;
  QUESTIONS.forEach(q => { if (state.answers[q.id] === q.correct) score++; });

  /* Prepline: сохранение результата */
  let hist = [];
  try {
    const key = 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
    hist = JSON.parse(localStorage.getItem(key) || '[]');
    hist.push({ t: Date.now(), s: score, n: QUESTIONS.length });
    localStorage.setItem(key, JSON.stringify(hist.slice(-50)));
  } catch (e) {}

  QUESTIONS.forEach(q => {
    const card = document.getElementById('qc-' + q.id);
    const user = state.answers[q.id];
    card.querySelectorAll('.opt').forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      else if (i === user) btn.classList.add('wrong');
    });
    const ok = user === q.correct;
    const div = document.createElement('div');
    div.className = 'review-answer';
    div.innerHTML = ok
      ? `<span class="ok">&#10003; Верно.</span> Правильный ответ: ${LETTERS[q.correct]}`
      : `<span class="no">&#10007; ${user === undefined ? 'Нет ответа' : 'Неверно'}.</span> Правильный ответ: <b>${LETTERS[q.correct]}</b> — ${q.options[q.correct]}`;
    card.appendChild(div);
  });

  const res = document.getElementById('result');
  res.style.display = 'block';
  document.getElementById('score-num').textContent = score + ' / 30';
  const pct = Math.round(score / 30 * 100);
  document.getElementById('score-text').textContent =
    (reason === 'time' ? 'Время вышло. ' : '') + pct + '% — разбор ответов под каждым вопросом.';
  if (hist.length >= 2) {
    const best = Math.max.apply(null, hist.map(a => a.s));
    const prev = hist.slice(-6, -1).reverse().map(a => {
      const d = new Date(a.t);
      return d.toLocaleDateString('ru-RU') + ' — ' + a.s + '/' + a.n;
    }).join(' &middot; ');
    const el = document.createElement('p');
    el.style.cssText = 'margin-top:10px;font-size:13px;opacity:0.75;';
    el.innerHTML = 'Лучший: <b>' + best + '/30</b>. Прошлые: ' + prev;
    document.getElementById('result').appendChild(el);
  }
  document.getElementById('submit-btn').style.display = 'none';
  res.scrollIntoView({ behavior: 'smooth' });
}

const timerEl = document.getElementById('timer');
const timerInt = setInterval(() => {
  state.timeLeft--;
  const m = Math.floor(state.timeLeft / 60), s = state.timeLeft % 60;
  timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  if (state.timeLeft <= 300) timerEl.classList.add('low');
  if (state.timeLeft <= 0) finish('time');
}, 1000);

document.getElementById('submit-btn').addEventListener('click', () => {
  const unanswered = QUESTIONS.filter(q => !(q.id in state.answers)).length;
  if (unanswered > 0 && !confirm('Без ответа: ' + unanswered + ' вопрос(ов). Завершить?')) return;
  finish('manual');
});
</script>

<!-- ===== Prepline × Supabase: авторизация + облачное сохранение ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="prepline-supabase.js"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: перехватываем saveAttempt — localStorage остаётся, добавляем облако */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: saveAttempt нет, оборачиваем finish */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>
