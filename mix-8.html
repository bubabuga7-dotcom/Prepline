<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id":1,"text":"<p>A right-angled triangle has a horizontal side of (4 + √2) cm and a vertical side of (2 − √2) cm. Calculate the area of the triangle.</p>","image":"images/q-51f54129d5.png","options":["(3 − 3√2) cm²","(3 + 3√2) cm²","(3 − √2) cm²","(5 − √2) cm²","(5 − 3√2) cm²","(5 + 3√2) cm²"],"correct":2,"topic":"M2.11","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь прямоугольного треугольника = ½ · катет · катет. Аккуратно раскрываем скобки с корнями.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(4 + √2)(2 − √2) = 8 − 4√2 + 2√2 − 2 = 6 − 2√2.</li><li>½ · (6 − 2√2) = 3 − √2 см².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, E — неверное раскрытие (−3√2).</li><li>B, F — неверные знаки.</li><li>D — забыли −2 от √2 · √2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √2 · √2 = 2 — не забывайте этот член.</div></div>"},{"id":2,"text":"<p>Simplify: ( 2x3/2y³ / √z )²</p>","image":"","options":["4x⁶y⁵ / z²","4x³y⁶ / z","4x³y⁵ / z","4x<sup>5/2</sup>y⁵ / z","4x<sup>5/2</sup>y⁵ / z²"],"correct":1,"topic":"M4.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим в квадрат каждый множитель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2² = 4.</li><li>(x<sup>3⁄2</sup>)² = x³; (y³)² = y⁶.</li><li>(√z)² = z.</li><li><span class=\"fr\"><span>4x³y⁶</span><span>z</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — y⁵ вместо y⁶.</li><li>A — (x<sup>3⁄2</sup>)² ≠ x⁶; z² вместо z.</li><li>D, E — показатель x не изменили.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (aᵐ)ⁿ = a<sup>m·n</sup>.</div></div>"},{"id":3,"text":"<p>Spearman's rank correlation coefficient is given by r = 1 − 6Σd² / (n(n² − 1)). Make Σd² the subject.</p>","image":"","options":["Σd² = 1 − r(n³ − n)/6","Σd² = ((1 − r)(n³ − n)/6)²","Σd² = (1 − r)(n³ − 1)/6","Σd² = (1 + r)(n³ − n)/6","Σd² = (1 − r)(n³ − n)/6"],"correct":4,"topic":"M4.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Изолируем дробь со Σd², затем умножаем на знаменатель.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>6Σ<span class=\"fr\"><span>d²</span><span>n(n² − 1)</span></span> = 1 − r.</li><li>Σd² = (1 − r) · n<span class=\"fr\"><span>n² − 1</span><span>6</span></span> = (1 − r)<span class=\"fr\"><span>n³ − n</span><span>6</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — неправильно перенесли 1.</li><li>B — лишний квадрат.</li><li>C — n³ − 1 вместо n³ − n.</li><li>D — знак у r.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> n(n² − 1) = n³ − n.</div></div>"},{"id":4,"text":"<p>These graphs are drawn: 1) y = 3x − 2;  2) y = x²;  3) y = 1 − x²;  4) y = x + 6. Which pair of graphs does not intersect?</p>","image":"","options":["1 and 2","1 and 3","2 and 3","2 and 4","3 and 4"],"correct":4,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Не пересекаются — уравнение «приравниваем графики» не имеет действительных корней.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3 и 4: 1 − x² = x + 6 → x² + x + 5 = 0.</li><li>D = 1 − 20 < 0 → корней нет.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (1, 2): x² − 3x + 2 = 0 → корни 1, 2.</li><li>B (1, 3): x² + 3x − 3 = 0 → D > 0.</li><li>C (2, 3): 2x² = 1 → корни есть.</li><li>D (2, 4): x² − x − 6 = 0 → корни 3, −2.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Пересечение ⇔ D ≥ 0 у полученного уравнения.</div></div>"},{"id":5,"text":"<p>A solid sphere of radius r fits inside a hollow cylinder whose internal diameter and length are both equal to the diameter of the sphere. What fraction of the volume of the cylinder does the sphere occupy?</p>","image":"","options":["1/4","1/3","1/2","2/3","3/4"],"correct":3,"topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Цилиндр: радиус r, высота 2r.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Шар: <span class=\"fr\"><span>4</span><span>3</span></span>πr³; цилиндр: 2πr³.</li><li><span class=\"fr\"><span><span class=\"fr\"><span>4</span><span>3</span></span></span><span>2</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — ошибка в объёме шара.</li><li>B — формула конуса.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Шар занимает ⅔ описанного цилиндра (Архимед).</div></div>"},{"id":6,"text":"<p>PQR is an isosceles triangle with PQ = PR = 6 cm and QR = 8 cm. What is the tangent of angle PQR?</p>","image":"","options":["2/√13","2/√5","2/3","3/2","√5/2","√13/2"],"correct":4,"topic":"M5.18","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Высота из вершины P равнобедренного треугольника делит основание пополам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Половина QR = 4.</li><li>Высота = √(36 − 16) = √20 = 2√5.</li><li>tg Q = высота / половина основания = <span class=\"fr\"><span>2√5</span><span>4</span></span> = <span class=\"fr\"><span>√5</span><span>2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B <span class=\"fr\"><span>2</span><span>√5</span></span> — перевёрнуто (это ctg Q).</li><li>C, D — без корня.</li><li>A, F — с √13: неверная высота.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> tg = противолежащий / прилежащий катет.</div></div>"},{"id":7,"text":"<p>a = 3/(5 + X), b = (3 + X)/5 and c = (3 + X)/(5 + X), where X is an integer greater than zero. Which is true?</p>","image":"","options":["a &lt; b &lt; c for all X","a &lt; c &lt; b for all X","b &lt; a &lt; c for all X","b &lt; c &lt; a for all X","c &lt; a &lt; b for all X","c &lt; b &lt; a for all X","The order depends on X"],"correct":1,"topic":"M2.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сравниваем дроби с общим числителем или знаменателем.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>a и c: общий знаменатель 5 + X, 3 < 3 + X → a < c.</li><li>c и b: общий числитель 3 + X, 5 + X > 5 → c < b.</li><li>a < c < b.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные нарушают одно из сравнений; порядок не зависит от X.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка на X = 1: a = 0,5, c ≈ 0,67, b = 0,8 ✓.</div></div>"},{"id":8,"text":"<p>A town football club raised money for charity. The total was shared between funds A, B and C in the ratio 1 : 2/3 : 4/5. Fund C received £3 000. How much was raised in total during the year?</p>","image":"","options":["£3 750","£7 000","£8 250","£9 000","£9 250","£12 375"],"correct":4,"topic":"M3.4","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Избавляемся от дробей в отношении: умножаем на 15.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>1 : <span class=\"fr\"><span>2</span><span>3</span></span> : <span class=\"fr\"><span>4</span><span>5</span></span> = 15 : 10 : 12.</li><li>C = 12 частей = £3000 → 1 часть = £250.</li><li>Всего 37 частей = £9250.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (£3750) — взяли C = <span class=\"fr\"><span>4</span><span>5</span></span> от целого.</li><li>D (£9000) — неверное число частей.</li><li>B, C, F — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Дробные отношения → умножаем на НОК знаменателей.</div></div>"},{"id":9,"text":"<p>Simplify: (2x+3)/(2x−3) + (2x−3)/(2x+3) − 2</p>","image":"","options":["0","2(2x−1) / ((2x−3)(2x+3))","18 / ((2x−3)(2x+3))","36 / ((2x−3)(2x+3))","8(x²−2) / ((2x−3)(2x+3))","12 / (2x−3)"],"correct":3,"topic":"M4.6","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к общему знаменателю (2x − 3)(2x + 3) = 4x² − 9.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(2x + 3)² = 4x² + 12x + 9; (2x − 3)² = 4x² − 12x + 9.</li><li>Сумма: 8x² + 18.</li><li>−2(4x² − 9) = −8x² + 18.</li><li>Числитель: 36 → <span class=\"fr\"><span>36</span><span>(2x − 3)(2x + 3)</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — «дроби взаимно обратны, значит, сумма 2» — неверно.</li><li>C (18) — забыли второе +18.</li><li>B, E, F — ошибки раскрытия.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>a</span><span>b</span></span> + <span class=\"fr\"><span>b</span><span>a</span></span> − 2 = (a − b)²/(ab): (6)²/(…) = 36/(…).</div></div>"},{"id":10,"text":"<p>Given 4p × 8q = 2n, express n in terms of p and q.</p>","image":"","options":["n = p + q","n = 2p + 3q","n = 2p + 4q","n = p + q + 5","n = 6pq"],"correct":1,"topic":"M4.2","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к основанию 2.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>4<sup>p</sup> = 2<sup>2p</sup>; 8<sup>q</sup> = 2<sup>3q</sup>.</li><li>2<sup>2p</sup> · 2<sup>3q</sup> = 2<sup>2p + 3q</sup> = 2<sup>n</sup>.</li><li>n = 2p + 3q.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без учёта степеней оснований.</li><li>C — 8 = 2³, а не 2⁴.</li><li>E — произведение показателей неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> При умножении степеней с одинаковым основанием показатели складываются.</div></div>"},{"id":11,"text":"<p>The diagram shows part of a glass structure. PQRS is a horizontal square of side 1 m, and the point X is 4 m vertically above P. What is the cosine of the angle between XR and the horizontal?</p>","image":"images/q-1aa803f952.png","options":["1/3","√2/4","√2/(2√3)","4/(3√2)","2/√3","1/√17","1/17"],"correct":0,"topic":"M5.18","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол между XR и горизонталью: проекция XR на пол — это PR.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>R диагонально противоположна P → PR = √2 м.</li><li>XR = √(PR² + 4²) = √(2 + 16) = √18 = 3√2.</li><li>cos = <span class=\"fr\"><span>PR</span><span>XR</span></span> = <span class=\"fr\"><span>√2</span><span>3√2</span></span> = <span class=\"fr\"><span>1</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>F <span class=\"fr\"><span>1</span><span>√17</span></span> — взяли PR = 1 (сторону, а не диагональ).</li><li>B, C, D, E, G — неверные стороны.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Угол с горизонталью: прилежащий катет — проекция на пол.</div></div>"},{"id":12,"text":"<p>Given x = 4.6 × 10⁷ and y = 2 × 10⁶, what is (x + 7y)/(x − 2y)?</p>","image":"","options":["10/7","1 2/3","3.1","7","10","31"],"correct":0,"topic":"M2.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к одной степени 10⁷.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>7y = 1,4 · 10⁷; 2y = 0,4 · 10⁷.</li><li>x + 7y = 6 · 10⁷; x − 2y = 4,2 · 10⁷.</li><li><span class=\"fr\"><span>6</span><span>4,2</span></span> = <span class=\"fr\"><span>10</span><span>7</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки с порядками (например, y = 2 · 10⁷).</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приведите числа к одной степени — дальше простая арифметика.</div></div>"},{"id":13,"text":"<p>Square ABCD, with vertices (1,1), (−1,1), (−1,−1) and (1,−1), is rotated 90° clockwise about the origin and then reflected in the line y = x. Which transformation returns the square to its original orientation?</p>","image":"","options":["Reflection in the x-axis","Reflection in the y-axis","Reflection in the line y = −x","Rotation of 90° clockwise about the origin","Rotation of 90° anticlockwise about the origin"],"correct":1,"topic":"M5.6","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Записываем обе операции как преобразования координат.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Поворот на 90° по часовой: (x; y) → (y; −x).</li><li>Отражение в y = x: (y; −x) → (−x; y).</li><li>Итог: (x; y) → (−x; y) — отражение в оси y.</li><li>Повторное отражение в оси y возвращает всё назад.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — отражение в оси x даёт (x; −y).</li><li>D, E — повороты не отменяют отражение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Отражение — само себе обратное.</div></div>"},{"id":14,"text":"<p>The variables x, y and z are related as follows: x is directly proportional to the square of z, and y is inversely proportional to the cube of z. Which correctly describes the relationship between x and y?</p>","image":"","options":["The square of x is directly proportional to the cube of y","The square of x is inversely proportional to the cube of y","The cube of x is directly proportional to the square of y","The cube of x is inversely proportional to the square of y","x is directly proportional to y⁶"],"correct":3,"topic":"M3.9","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем всё через z и исключаем его.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x = kz² → z ∝ x<sup>1⁄2</sup>.</li><li>y ∝ <span class=\"fr\"><span>1</span><span>z³</span></span> ∝ x<sup>−3⁄2</sup>.</li><li>Возводим в квадрат: y² ∝ <span class=\"fr\"><span>1</span><span>x³</span></span> → x³ обратно пропорционален y².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — прямая пропорциональность, а связь обратная (x растёт, y падает).</li><li>B — степени перепутаны.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Если z растёт, x растёт, а y падает → связь обратная.</div></div>"},{"id":15,"text":"<p>A shape is made from three cubes, the largest at the bottom and the smallest on top. At each join, the corners of the smaller cube lie at the midpoints of the sides of a face of the larger cube. The side of the smallest cube is 1 cm. What is the total surface area of the shape?</p>","image":"images/q-9ab1ea4c2e.png","options":["30 cm²","32 cm²","33 cm²","36 cm²","39 cm²","42 cm²"],"correct":3,"topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Квадрат на серединах сторон грани имеет сторону <span class=\"fr\"><span>s</span><span>√2</span></span>. Значит, кубы со сторонами 2, √2, 1.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Площади граней: 4, 2, 1.</li><li>Всего граней: 6 · (4 + 2 + 1) = 42.</li><li>Каждое соединение прячет две грани меньшего куба: 2 · 2 + 2 · 1 = 6.</li><li>42 − 6 = 36 см².</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>F (42) — не учли спрятанные грани.</li><li>E (39) — вычли только по одной грани.</li><li>A, B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждое соединение прячет площадь меньшей грани дважды: на нижнем и на верхнем кубе.</div></div>"},{"id":16,"text":"<p>A pattern is formed by four circles that touch at the top point (diagram not to scale). The diameters are d, 2d, 3d and 4d. Find the area of the shaded part of the pattern.</p>","image":"images/q-6247ad2579.png","options":["(5/2)πd²","4πd²","(1/4)πd²","10πd²","(3/2)πd²"],"correct":0,"topic":"M5.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площади кругов ∝ квадратам диаметров: 1, 4, 9, 16 (в единицах <span class=\"fr\"><span>πd²</span><span>4</span></span>).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Заштрихованные кольца: (16 − 9) + (4 − 1) = 10 единиц.</li><li>10 · <span class=\"fr\"><span>πd²</span><span>4</span></span> = <span class=\"fr\"><span>5</span><span>2</span></span>πd².</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D (10πd²) — забыли /4.</li><li>B, C, E — неверный выбор колец.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь через диаметр: <span class=\"fr\"><span>πD²</span><span>4</span></span>.</div></div>"},{"id":17,"text":"<p>Evaluate: ∛( 2×10⁵ / (5×10⁻³)² ) − √( 4×10³ − 4×10² )</p>","image":"","options":["−6.2","160 − 20√5","140","240 − 20√5","1940"],"correct":4,"topic":"M2.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Считаем каждую часть отдельно, работая со степенями 10.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(5 · 10⁻³)² = 25 · 10⁻⁶.</li><li>2 · 10⁵ / (25 · 10⁻⁶) = 0,08 · 10¹¹ = 8 · 10⁹ → ∛ = 2000.</li><li>√(4000 − 400) = √3600 = 60.</li><li>2000 − 60 = 1940.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (140) — ошибка в степени 10.</li><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> ∛(8 · 10⁹) = 2 · 10³.</div></div>"},{"id":18,"text":"<p>In triangle ABC (not to scale), tan A = 1/6 and tan B = 2/3. M is the midpoint of AB. What is tan θ?</p>","image":"images/q-fc1365cd5c.png","options":["1/9","5/12","4/9","1/2","5/6"],"correct":2,"topic":"M5.18","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Опускаем высоту h из C и выражаем отрезки на AB через h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>tg A = <span class=\"fr\"><span>h</span><span>AH</span></span> = <span class=\"fr\"><span>1</span><span>6</span></span> → AH = 6h.</li><li>tg B = <span class=\"fr\"><span>h</span><span>HB</span></span> = <span class=\"fr\"><span>2</span><span>3</span></span> → HB = 1,5h.</li><li>AB = 7,5h → AM = 3,75h.</li><li>MH = 6h − 3,75h = 2,25h → tg θ = <span class=\"fr\"><span>h</span><span>2,25h</span></span> = <span class=\"fr\"><span>4</span><span>9</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверное положение M относительно H.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Удобно выражать все отрезки через одну и ту же высоту h.</div></div>"},{"id":19,"text":"<p>A new sign for a local business is made of two parts, wood and metal. The metal costs 3 times as much as the wood per unit. The cost of the metal is proportional to the diameter of the sign, and the cost of the wood is proportional to the square of the diameter. If the diameter is doubled, the total cost of the materials triples. What percentage of the cost of the sign, to the nearest 1%, is metal?</p>","image":"","options":["25%","33%","50%","67%","75%"],"correct":2,"topic":"M3.9","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Металл ∝ d, дерево ∝ d². Условие «при удвоении d стоимость утраивается» связывает их.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Металл = ad, дерево = bd².</li><li>После удвоения: 2ad + 4bd² = 3(ad + bd²).</li><li>ad = bd² → металл и дерево стоят одинаково.</li><li>Металл — 50%.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E (75%) — использовали «в 3 раза дороже» — это лишняя информация.</li><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не каждое число в условии нужно для решения.</div></div>"},{"id":20,"text":"<p>w, x, y and z are integers with w &lt; x², x &gt; y², y² &lt; z² and x &gt; z. Which inequality must be true?</p>","image":"","options":["w &lt; x","w &gt; y","w &lt; z","x &gt; y","y &lt; z"],"correct":3,"topic":"M2.1","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Для любого целого y верно y² ≥ y.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x > y² (из условия).</li><li>y² ≥ y → x > y.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C, E — можно подобрать контрпримеры.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Ищите неравенство, которое следует при любых целых, включая отрицательные.</div></div>"},{"id":21,"text":"<p>There are two containers of different capacity. The larger is full of water and the smaller is empty. Water is poured from the larger into the smaller until the volumes of water in them are equal. The water in the larger container is now a fraction p of its capacity, and the water in the smaller is a fraction q of its capacity. Which must be true?</p>","image":"","options":["p + q = 1 (but p and q are not necessarily 0.5 each)","p = 0.5 and q = 0.5","p = 0.5 and q &gt; 0.5","p &gt; 0.5 and q = 0.5","p &gt; 0.5 and q &gt; 0.5"],"correct":2,"topic":"M3.8","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объёмы воды стали равны, значит, в каждом половина исходного объёма L.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Большой: V = <span class=\"fr\"><span>L</span><span>2</span></span> → p = 0,5.</li><li>Малый: q = <span class=\"fr\"><span><span class=\"fr\"><span>L</span><span>2</span></span></span><span>S</span></span>, а S < L → q > 0,5.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — q ≠ 0,5, т.к. S < L.</li><li>D, E — p = 0,5 точно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Половина большого объёма заполняет малый сосуд больше чем наполовину.</div></div>"},{"id":22,"text":"<p>The total surface area of a cylinder is numerically equal to its volume. The radius is r cm and the height is h cm. Express h in terms of r.</p>","image":"","options":["h = 2r/(r − 2)","h = 2r/(r + 2)","h = r + 2","h = r − 2","h = 2r(r − 2)"],"correct":0,"topic":"M4.7","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Полная поверхность 2πr² + 2πrh = объём πr²h.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Делим на πr: 2r + 2h = rh.</li><li>h(r − 2) = 2r → h = <span class=\"fr\"><span>2r</span><span>r − 2</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак в знаменателе.</li><li>C, D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Полная поверхность включает два основания.</div></div>"},{"id":23,"text":"<p>A pattern is built by joining points one third of the way along the sides of a square, forming a second square. The process is then repeated. Find the area of the fourth square as a fraction of the area of the original square.</p>","image":"","options":["1/27","5√5/81","125/729","25/81","5√5/27"],"correct":2,"topic":"M3.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый новый квадрат: сторона² = <span class=\"fr\"><span>1</span><span>3</span></span>² + <span class=\"fr\"><span>2</span><span>3</span></span>² от старой стороны².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>1</span><span>9</span></span> + <span class=\"fr\"><span>4</span><span>9</span></span> = <span class=\"fr\"><span>5</span><span>9</span></span> — коэффициент площади.</li><li>Четвёртый квадрат — три шага: <span class=\"fr\"><span>5</span><span>9</span></span>³ = <span class=\"fr\"><span>125</span><span>729</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D <span class=\"fr\"><span>25</span><span>81</span></span> — два шага.</li><li>A — неверный коэффициент.</li><li>B, E — коэффициент для стороны, а не площади.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Fourth square» — исходный первый, значит, три перехода.</div></div>"},{"id":24,"text":"<p>The binary operation © is defined by x © y = √(x/y). What is (24 © 6) © 2?</p>","image":"","options":["√2","6√3","2","2√2","1"],"correct":4,"topic":"M4.3","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">По шагам.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>24 © 6 = √4 = 2.</li><li>2 © 2 = √1 = 1.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C (2) — только первый шаг.</li><li>A, B, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Скобки определяют порядок.</div></div>"},{"id":25,"text":"<p>Solve the inequality: x² + 5x − 14 ≤ 0</p>","image":"","options":["[−2, 7]","[−7, 2]","(−7, 2)","[2, 7)","(−2, 7]"],"correct":1,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">(x + 7)(x − 2) ≤ 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Корни −7 и 2.</li><li>Между корнями, включая концы: [−7; 2].</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — концы не включены.</li><li>A, E — знаки корней перепутаны.</li><li>D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадратные скобки — точка входит.</div></div>"},{"id":26,"text":"<p>The equation 2x(ax − 4) − x² + 6 = 0 has no real roots. What is the smallest possible integer value of a?</p>","image":"","options":["−1","2","3","4","5"],"correct":1,"topic":"M4.16","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Приводим к виду Ax² + Bx + C и требуем D < 0.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2ax² − 8x − x² + 6 = (2a − 1)x² − 8x + 6.</li><li>D = 64 − 24(2a − 1) < 0 → 2a − 1 > <span class=\"fr\"><span>8</span><span>3</span></span> → a > <span class=\"fr\"><span>11</span><span>6</span></span> ≈ 1,83.</li><li>Наименьшее целое: 2.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A (−1) — тогда D > 0.</li><li>C, D, E — подходят, но не наименьшие.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Не забудьте коэффициент −x² из условия.</div></div>"},{"id":27,"text":"<p>Given x − y = 4 and x² − y² = 24, find xy.</p>","image":"","options":["96","48","32","5","Cannot be determined"],"correct":3,"topic":"M4.5","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">x² − y² = (x − y)(x + y).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + y = <span class=\"fr\"><span>24</span><span>4</span></span> = 6.</li><li>x − y = 4 → x = 5, y = 1.</li><li>xy = 5.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — перемножили данные числа.</li><li>E — данных хватает.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Разность квадратов — ключ к системе.</div></div>"},{"id":28,"text":"<p>The line ax − by = −9 passes through A(−1, 3) and B(−3, 0). Find a + b.</p>","image":"","options":["5","6","8","10","12"],"correct":0,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Подставляем обе точки в уравнение прямой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>B(−3; 0): −3a = −9 → a = 3.</li><li>A(−1; 3): −3 − 3b = −9 → b = 2.</li><li>a + b = 5.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — ошибки знаков.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Точку на оси (y = 0) подставляйте первой — уходит одна переменная.</div></div>"},{"id":29,"text":"<p>The point A(a, b) lies in the fourth quadrant of the coordinate plane. In which quadrant does the point B(−a, −b) lie?</p>","image":"","options":["I","II","III","IV"],"correct":1,"topic":"M4.10","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Знаки координат по четвертям.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>IV четверть: a > 0, b < 0.</li><li>−a < 0, −b > 0 → II четверть.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C, D — неверные знаки.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (−a; −b) — симметрия относительно начала координат: I ↔ III, II ↔ IV.</div></div>"},{"id":30,"text":"<p>47 is split into three numbers. The second is 8 more than the first and 10 less than the third. Find the first number.</p>","image":"","options":["3","5","7","9","12"],"correct":2,"topic":"M4.15","explain":"<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Выражаем все числа через первое.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Первое x, второе x + 8, третье x + 18.</li><li>3x + 26 = 47 → x = 7.</li><li>7 + 15 + 25 = 47 ✓.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — сумма не 47.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «10 less than the third» → третье = второе + 10.</div></div>"}];

let state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };

function fmt(s) {
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render() {
  const app = document.getElementById('app');
  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: questions.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  let correctCount = 0;
  questions.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = Math.round((correctCount/questions.length)*100);

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${questions.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    ${questions.map(q => {
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '&#10003;' : '&#10007;'}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${ok ? '' : `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>`}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script src="vendor/supabase/supabase.js?v=2.118.0"></script>
<script src="prepline-supabase.js?v=94bf63bf"></script>
<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        let score = 0;
        questions.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, questions.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), questions, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>

  var opts = {delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}], throwOnError: false};
  function render(el){ if(!window.renderMathInElement || !el) return; try { renderMathInElement(el, opts); } catch(e) {} }
  function hasMath(el){ var t = el.textContent || ""; return t.indexOf("\\(") >= 0 || t.indexOf("\\[") >= 0; }
  function start(){
    render(document.body);
    new MutationObserver(function(ms){
      var done = [];
      for (var i = 0; i < ms.length; i++) {
        var t = ms[i].target;
        if (!ms[i].addedNodes.length || t.nodeType !== 1 || done.indexOf(t) >= 0) continue;
        if (t.closest(".katex") || !hasMath(t)) continue;
        done.push(t); render(t);
      }
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
