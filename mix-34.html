<style>
  :root {
    --bg: #15181D; --card: rgba(14,20,48,0.72); --text: #C8CDD4; --text-bright: #DADDE2;
    --blue: #8EADD2; --violet: #8EADD2; --pink: #C9AA6A;
    --grad: linear-gradient(90deg, #8EADD2 0%, #8EADD2 50%, #C9AA6A 100%);
    --glass-line: rgba(255,255,255,0.14);
    --ok: #7DC3A0; --ok-bg: rgba(125,195,160,0.14);
    --danger: #DE8B8B; --danger-bg: rgba(222,139,139,0.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  .page-photo { position: fixed; inset: 0; z-index: 0; background: url('bg-milkyway.jpg') center / cover no-repeat; }
  .page-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,24,29,0.78) 0%, rgba(21,24,29,0.88) 100%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; opacity: 0.7; transition: opacity .2s, color .2s; }
  a.back:hover { opacity: 1; color: var(--violet); }
  h2 { font-family: 'Sora', sans-serif; color: var(--text-bright); letter-spacing: -0.02em; font-size: 20px; margin: 16px 0 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; opacity: 0.85; }
  .timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text-bright); opacity: 1;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-line); padding: 2px 12px; border-radius: 999px;
  }
  .timer.low { color: #E3A1A1; border-color: rgba(222,139,139,0.5); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--grad); transition: width 0.25s; border-radius: 3px; }
  .question { font-size: 17px; font-weight: 600; color: var(--text-bright); margin-bottom: 18px; }
  .question-img { max-width: 100%; border: 1px solid var(--glass-line); border-radius: 10px; margin-bottom: 16px; display: block; background: #fff; padding: 6px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .opt {
    text-align: left; border: 1px solid var(--glass-line); border-radius: 10px; padding: 13px 16px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 15px; font-family: inherit; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--violet); background: rgba(142,173,210,0.12); transform: translateX(3px); }
  .opt.selected {
    border: 2px solid var(--blue); background: rgba(142,173,210,0.16);
    color: var(--text-bright); font-weight: 500;
  }
  .nav-row { display: flex; justify-content: space-between; }
  button.nav-btn {
    border: 1.5px solid var(--glass-line); color: var(--text-bright); background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  button.nav-btn:hover:not(:disabled) { border-color: var(--violet); transform: translateY(-1px); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.submit-btn {
    border: none; color: #fff;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s, transform .15s;
    box-shadow: 0 8px 24px -10px rgba(201,170,106,0.5);
  }
  button.submit-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); transform: translateY(-1px); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--glass-line); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  .stat-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .review-item {
    border: 1px solid var(--glass-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mark { font-weight: 700; margin-left: 12px; flex-shrink: 0; }
  .mark.ok { color: var(--ok); }
  .mark.no { color: var(--danger); }
  .restart-btn {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: var(--grad); background-size: 200% 100%; background-position: 0% 50%;
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-position .4s, box-shadow .3s;
  }
  .restart-btn:hover { background-position: 100% 50%; box-shadow: 0 12px 36px -10px rgba(142,173,210,0.55); }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
    h2 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-grid { gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-num { font-size: 19px; }
    .stat-label { font-size: 11px; }
    .topbar { flex-wrap: wrap; gap: 6px; }
    .review-item { flex-wrap: wrap; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }

<script>
const questions = [{"id": 1, "text": "", "image": "images/math-new/m018_q01.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем всё на 6, чтобы убрать дроби.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>3(x − 2) − 4(3 − x) &lt; 6(x − 4).</li><li>3x − 6 − 12 + 4x &lt; 6x − 24 → 7x − 18 &lt; 6x − 24.</li><li>x &lt; −6.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — перевёрнут знак.</li><li>C, D, E — ошибки при раскрытии скобок.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> −⅔(3 − x) = −2 + ⅔x — следите за знаком.</div></div>"}, {"id": 2, "text": "", "image": "images/math-new/m018_q02.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Возводим дробь в квадрат, затем умножаем на <span class=\"fr\"><span>1</span><span>10</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>(5x³y^½ / z<sup>3⁄2</sup>)² = <span class=\"fr\"><span>25x⁶y</span><span>z³</span></span>.</li><li><span class=\"fr\"><span>25</span><span>10</span></span> = <span class=\"fr\"><span>5</span><span>2</span></span> → <span class=\"fr\"><span>5x⁶y</span><span>2z³</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B — забыли <span class=\"fr\"><span>1</span><span>10</span></span>.</li><li>D — без 2 в знаменателе.</li><li>E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (y^½)² = y; (z<sup>3⁄2</sup>)² = z³.</div></div>"}, {"id": 3, "text": "", "image": "images/math-new/m018_q03.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Сторона = периметр/4, площадь = сторона².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Сторона: 9 − √3.</li><li>(9 − √3)² = 81 − 18√3 + 3 = 84 − 18√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — забыли (√3)² = 3.</li><li>C, E — это не площадь.</li><li>D — неверное удвоенное произведение.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> (a − b)² = a² − 2ab + b².</div></div>"}, {"id": 4, "text": "", "image": "images/math-new/m018_q04.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Упрощаем корни во второй скобке.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>√24 = 2√6 → вторая скобка = √6.</li><li>(√12 − √8) · √6 = √72 − √48 = 6√2 − 4√3.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D — знаки наоборот.</li><li>A, C, E — неверные корни.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> √72 = 6√2, √48 = 4√3.</div></div>"}, {"id": 5, "text": "", "image": "images/math-new/m018_q05.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Умножаем на p и собираем S.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S = pq(S − r) = pqS − pqr.</li><li>pqr = pqS − S = S(pq − 1).</li><li>S = <span class=\"fr\"><span>pqr</span><span>pq − 1</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак в знаменателе.</li><li>B — знак числителя.</li><li>C, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Все слагаемые с S — в одну сторону.</div></div>"}, {"id": 6, "text": "", "image": "images/math-new/m018_q06.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.16", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Дуга RQ с центром P → PR = PQ = x; дуга PR с центром Q → QR = QP = x.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Все стороны равны x → треугольник равносторонний.</li><li>S = <span class=\"fr\"><span>√3</span><span>4</span></span>x².</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>D <span class=\"fr\"><span>x²</span><span>4</span></span> — без √3.</li><li>A, B, E — неверная формула.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Радиусы одной дуги равны. (Исходный ключ D — исправлено.)</div></div>"}, {"id": 7, "text": "", "image": "images/math-new/m018_q07.webp", "options": ["A", "B", "C", "D"], "correct": 2, "topic": "M2.8", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = <span class=\"fr\"><span>z</span><span>x²</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x² = 9 · 10⁸.</li><li>2,7 · 10⁶ / (9 · 10⁸) = 0,3 · 10⁻² = 0,003.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, E — ошибка в степени на 2.</li><li>A, D — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> <span class=\"fr\"><span>10⁶</span><span>10⁸</span></span> = 10⁻².</div></div>"}, {"id": 8, "text": "", "image": "images/math-new/m018_q08.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M4.6", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Общий знаменатель x²(x − 2).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>2x(x − 2) + x² − 3(x − 2).</li><li>2x² − 4x + x² − 3x + 6 = 3x² − 7x + 6.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, C — неверные числители.</li><li>D — неверный знаменатель.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Каждый числитель домножаем на недостающий множитель.</div></div>"}, {"id": 9, "text": "", "image": "images/math-new/m018_q09.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.15", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Объём = конус + полушар.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>⅓πr²h + ⅔πr³ = ⅔πr³(1 + <span class=\"fr\"><span>h</span><span>2r</span></span>).</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B, C, D — корни здесь ни при чём.</li><li>E — удвоено: ⅔πr²(2r + h) = <span class=\"fr\"><span>4</span><span>3</span></span>πr³ + ⅔πr²h.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> В варианте A в скане потеряна r: должно быть <span class=\"fr\"><span>h</span><span>2r</span></span>.</div></div>"}, {"id": 10, "text": "", "image": "images/math-new/m018_q10.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">NQ = RQ − RN, обе длины — через катет PR = 8.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>RQ = <span class=\"fr\"><span>8</span><span>tg</span></span> 36°.</li><li>RN = 8 · tg 25°.</li><li>NQ = <span class=\"fr\"><span>8</span><span>tg</span></span> 36° − 8 tg 25°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D, E — угол 44° или половина катета.</li><li>C — cot вместо tg.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> tg угла = противолежащий / прилежащий.</div></div>"}, {"id": 11, "text": "", "image": "images/math-new/m018_q11.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M1.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">1 км = 1000 м, 1 мин = 60 с.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>V км/мин = <span class=\"fr\"><span>1000V</span><span>60</span></span> м/с = <span class=\"fr\"><span>50V</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — делили на 3600 (часы).</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Минуты, а не часы.</div></div>"}, {"id": 12, "text": "", "image": "images/math-new/m018_q12.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Касательная ⊥ радиусу ON.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон ON: <span class=\"fr\"><span>6</span><span>4</span></span> = <span class=\"fr\"><span>3</span><span>2</span></span> → касательная <span class=\"fr\"><span>−2</span><span>3</span></span>.</li><li>y − 6 = −⅔(x − 4) → y = <span class=\"fr\"><span>−2x</span><span>3</span></span> + <span class=\"fr\"><span>26</span><span>3</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>C — неверный свободный член.</li><li>B — наклон не тот.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> k₁ · k₂ = −1.</div></div>"}, {"id": 14, "text": "", "image": "images/math-new/m018_q14.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M2.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Оставшееся = n · ¾ · ⅗.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>После еды: ¾n.</li><li>Отдала ⅖ → осталось ⅗ · ¾n = <span class=\"fr\"><span>9n</span><span>20</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, D — отданная часть.</li><li>C, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> «Of the remaining» — от остатка.</div></div>"}, {"id": 15, "text": "", "image": "images/math-new/m018_q15.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Диагонали ромба перпендикулярны и проходят через N.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Наклон PR: 2 → QS: −½.</li><li>y − 3 = −½(x − 2) → y = <span class=\"fr\"><span>−x</span><span>2</span></span> + 4.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>E — знак наклона не тот.</li><li>A, B, C — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Диагонали ромба — перпендикулярны.</div></div>"}, {"id": 16, "text": "", "image": "images/math-new/m018_q16.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Угол 3x − 80 отмечен как больший (рефлексный) угол в центре; меньший центральный = 2 · вписанный.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Меньший центральный угол: 360 − (3x − 80) = 440 − 3x.</li><li>440 − 3x = 2(x − 15) → 470 = 5x → x = 94.</li><li>x + 3° = 97°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — взяли меньший угол как 3x − 80.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Посмотрите, какой угол отмечен дугой в центре.</div></div>"}, {"id": 17, "text": "", "image": "images/math-new/m018_q17.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.7", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">PS — общий катет двух прямоугольных треугольников.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>RS = k, SQ = 2k.</li><li>PS² = 36b² − k² = 144a² − 4k² → 3k² = 144a² − 36b² → k² = 48a² − 12b².</li><li>PS² = 36b² − 48a² + 12b² = 48(b² − a²).</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, B, D, E — неверно составлены уравнения.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Приравняйте два выражения для PS².</div></div>"}, {"id": 18, "text": "", "image": "images/math-new/m018_q18.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M3.3", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\"><span class=\"fr\"><span>3p</span><span>4q</span></span> = <span class=\"fr\"><span>8</span><span>21</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>p</span><span>q</span></span> = 8 · <span class=\"fr\"><span>4</span><span>21 · 3</span></span> = <span class=\"fr\"><span>32</span><span>63</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без коэффициентов 3 и 4.</li><li>C — перевёрнуто.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Перемножайте крест-накрест.</div></div>"}, {"id": 19, "text": "", "image": "images/math-new/m018_q19.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.13", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Путь = площадь под графиком скорость–время.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>½ · 10 · p + 30 · p + ½ · 20 · p = 45p.</li><li>45p = 1260 → p = 28.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверная площадь трапеции.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Трапеция: ½(60 + 30) · p = 45p.</div></div>"}, {"id": 20, "text": "", "image": "images/math-new/m018_q20.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M4.10", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Находим k из наклона, затем уравнение прямой.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>(1 − k) − 1</span><span>7 − 2k − 1</span></span> = <span class=\"fr\"><span>−k</span><span>6 − 2k</span></span> = ¼ → k = −3.</li><li>P(−5; 1), Q(7; 4).</li><li>y = 1 + ¼(x + 5) → при x = 0: r = <span class=\"fr\"><span>9</span><span>4</span></span>.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверный k.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Проверка: <span class=\"fr\"><span>4 − 1</span><span>7 + 5</span></span> = ¼ ✓.</div></div>"}, {"id": 21, "text": "", "image": "images/math-new/m018_q21.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.17", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Фигура = треугольник ABC + треугольник ACD.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>S(ABC) = ½ · 3 · 5 = 7,5; AC = √34.</li><li>Подобие: <span class=\"fr\"><span>AB</span><span>AC</span></span> = <span class=\"fr\"><span>BC</span><span>CD</span></span> → CD = <span class=\"fr\"><span>3√34</span><span>5</span></span>.</li><li>S(ACD) = ½ · √34 · <span class=\"fr\"><span>3√34</span><span>5</span></span> = 10,2.</li><li>Итого 17,7.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверное соответствие сторон.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Прямые углы B и C — соответственные.</div></div>"}, {"id": 22, "text": "", "image": "images/math-new/m018_q22.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Вершина x = <span class=\"fr\"><span>−p</span><span>2</span></span>.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>−p</span><span>2</span></span> = 1,5 → p = −3.</li><li>2,25 − 4,5 + q = 4 → q = 6,25.</li><li>q − p = 9,25.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — знак.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Подставьте вершину в уравнение, чтобы найти q.</div></div>"}, {"id": 23, "text": "", "image": "images/math-new/m018_q23.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M5.2", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">У дельтоида два противоположных угла равны (S = Q).</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>x + 2x + 3x + 3x = 360 → 9x = 360 → x = 40.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — не учли, что четвёртый угол равен 3x.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Сумма углов четырёхугольника 360°.</div></div>"}, {"id": 24, "text": "", "image": "images/math-new/m018_q24.webp", "options": ["A", "B", "C", "D", "E"], "correct": 4, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Площадь правильного 12-угольника через радиус: 12 · ½R² sin 30°.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>12 · ½ · 36 · ½ = 108.</li><li>Шестиугольник: <span class=\"fr\"><span>3√3</span><span>2</span></span>x² = 108 → x² = <span class=\"fr\"><span>72</span><span>√3</span></span> = 24√3.</li></ol><div class=\"ex-a\">Ответ: <b>E</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — удвоено.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Площадь 12-угольника = 3R².</div></div>"}, {"id": 25, "text": "", "image": "images/math-new/m018_q25.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.5", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">RV ∥ LU → треугольники QRV и QLU подобны.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>36</span><span>33 + 3x</span></span> = <span class=\"fr\"><span>30</span><span>30 + 2x</span></span> → 18x = 90 → x = 5.</li><li>LU = 40, LQ = 48.</li><li>VQ = √(36² − 30²) = 6√11; UQ = √(48² − 40²) = 8√11.</li><li>VU = 2√11.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> LQ = LR + RQ = 12 + 36.</div></div>"}, {"id": 27, "text": "", "image": "images/math-new/m018_q27.webp", "options": ["A", "B", "C", "D", "E"], "correct": 0, "topic": "M4.11", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">y = (x − q)² + r — вершинная форма.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Вершина по графику (3; −4) → r = −4.</li></ol><div class=\"ex-a\">Ответ: <b>A</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>B — знак.</li><li>C — это q.</li><li>D, E — корни/перехват.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> x² − 2xq + q² = (x − q)².</div></div>"}, {"id": 28, "text": "", "image": "images/math-new/m018_q28.webp", "options": ["A", "B", "C", "D", "E"], "correct": 3, "topic": "M3.9", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">s = k√t → s² ∝ t.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li><span class=\"fr\"><span>45</span><span>36</span></span>² = 1,5625.</li><li>t = 0,4 · 1,5625 = 0,625.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — линейно.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Квадрат отношения s.</div></div>"}, {"id": 29, "text": "", "image": "images/math-new/m018_q29.webp", "options": ["A", "B", "C", "D", "E"], "correct": 2, "topic": "M5.14", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Все рёбра 6; высота из прямоугольного треугольника с полудиагональю.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Полудиагональ основания: 3√2.</li><li>h = √(36 − 18) = 3√2.</li><li>V = ⅓ · 36 · 3√2 = 36√2.</li></ol><div class=\"ex-a\">Ответ: <b>C</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — без √2.</li><li>Остальные — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Боковое ребро, высота и полудиагональ — прямоугольный треугольник.</div></div>"}, {"id": 30, "text": "", "image": "images/math-new/m018_q30.webp", "options": ["A", "B", "C", "D", "E"], "correct": 1, "topic": "M5.18", "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Апофема — катет прямоугольного треугольника с полустороной 4.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Центральный угол на сторону: 72° → половина 36°.</li><li>Угол между стороной и радиусом: 54°.</li><li>Апофема = 4 · tg 54°.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A, C — неверные углы.</li><li>D, E — неверно.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Апофема = <span class=\"fr\"><span>a</span><span>2</span></span>·tg 54° для пятиугольника.</div></div>"}, {"id": 31, "topic": "M2.12", "text": "<p>A rectangle is 14 cm long and 11 cm wide, both measured to the nearest centimetre.</p><p>What is the upper bound of its area?</p>", "image": "", "options": ["141.75 cm²", "154 cm²", "159.5 cm²", "166.75 cm²", "180 cm²"], "correct": 3, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Верхняя граница произведения = верхняя × верхняя.</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>Границы: 14,5 и 11,5 см.</li><li>14,5 · 11,5 = 166,75 см². Ответ D.</li></ol><div class=\"ex-a\">Ответ: <b>D</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — это нижняя граница.</li><li>B — это значение без учёта точности.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> До ближайшего целого — это ±0,5.</div></div>", "src": "PL"}, {"id": 32, "topic": "M3.11", "text": "<p>A population grows by 50% each year. After 2 years it is 9000.</p><p>What was it at the start?</p>", "image": "", "options": ["2250", "4000", "4500", "6000", "8000"], "correct": 1, "explain": "<div class=\"ex\"><div class=\"ex-h\">✦ Идея</div><p class=\"ex-i\">Каждый год — умножение на 1,5, значит назад — деление на 1,5².</p><div class=\"ex-h\">Решение</div><ol class=\"ex-s\"><li>9000 : 2,25 = 4000. Ответ B.</li></ol><div class=\"ex-a\">Ответ: <b>B</b></div><div class=\"ex-h ex-x\">✗ Почему не другие</div><ul class=\"ex-n\"><li>A — дважды отняли 50% — проценты от разных чисел.</li><li>C — разделили на 1 + 100%, как при простом проценте.</li></ul><div class=\"ex-t\"><b>⚠ Ловушка / совет.</b> Обратный сложный процент — деление.</div></div>", "src": "PL"}];

  if (state.finished) { renderResults(app); return; }

  const q = questions[state.idx];
  const answeredCount = Object.keys(state.answers).length;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${state.idx+1} of ${questions.length}</span>
      <span class="timer ${state.timeLeft < 60 ? 'low' : ''}" id="timer">${fmt(state.timeLeft)}</span>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(answeredCount/questions.length)*100}%"></div></div>
    ${q.image ? `<img loading="lazy" src="${q.image}" class="question-img" alt="Figure for the question">` : ''}
    <div class="question">${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i) => `<button class="opt ${state.answers[q.id]===i ? 'selected' : ''}" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev" ${state.idx===0 ? 'disabled' : ''}>&larr; Back</button>
      ${state.idx === questions.length-1
        ? '<button class="submit-btn" id="submit">Finish test</button>'
        : '<button class="nav-btn" id="next">Next &rarr;</button>'}
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => { state.answers[q.id] = parseInt(btn.dataset.i); render(); };
  });
  const prev = document.getElementById('prev');
  if (prev) prev.onclick = () => { state.idx = Math.max(0, state.idx-1); render(); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { state.idx = Math.min(questions.length-1, state.idx+1); render(); };
  const submit = document.getElementById('submit');
  if (submit) submit.onclick = finish;
}

function finish() {
  clearInterval(state.timerId);
  state.finished = true;
  saveAttempt();
  render();
  appendHistory();
}

/* === Prepline: attempt history (localStorage) === */
function mockKey() {
  return 'prepline:' + ((location.pathname.split('/').pop() || 'mock').replace('.html','') || 'mock');
}
function saveAttempt() {
  try {
    let score = 0;
    const verifiedQs = questions.filter(q => q.verified !== false);
    verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    hist.push({ t: Date.now(), s: score, n: verifiedQs.length });
    localStorage.setItem(mockKey(), JSON.stringify(hist.slice(-50)));
  } catch (e) {}
}
function appendHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(mockKey()) || '[]');
    if (hist.length < 2) return; // first attempt — no history yet
    const best = Math.max.apply(null, hist.map(a => a.s));
    const rows = hist.slice(-10).reverse().map(a => {
      const d = new Date(a.t);
      const ds = d.toLocaleDateString('ru-RU') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      const pct = Math.round(a.s / a.n * 100);
      return '<div class="review-item"><span>' + ds + '</span>' +
        '<span class="mark ' + (a.s === best ? 'ok' : '') + '">' + a.s + '/' + a.n + ' &middot; ' + pct + '%</span></div>';
    }).join('');
    const div = document.createElement('div');
    div.innerHTML = '<h2 style="margin-top:28px">Attempt history &middot; best result ' + best + '/' + hist[hist.length-1].n + '</h2>' + rows;
    const app = document.getElementById('app');
    const rb = app.querySelector('.restart-btn');
    if (rb) app.insertBefore(div, rb); else app.appendChild(div);
  } catch (e) {}
}

function renderResults(app) {
  const verifiedQs = questions.filter(q => q.verified !== false);
  let correctCount = 0;
  verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) correctCount++; });
  const pct = verifiedQs.length ? Math.round((correctCount/verifiedQs.length)*100) : 0;

  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Result</div><div class="stat-num">${correctCount}/${verifiedQs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Percentage</div><div class="stat-num">${pct}%</div></div>
      <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-num">${questions.length - Object.keys(state.answers).length}</div></div>
    </div>
    <p style="font-size:13px; opacity:0.7; margin-bottom:16px;">Questions without a verified answer key do not count towards the score — they are greyed out, for practice only.</p>
    ${questions.map(q => {
      const unverified = q.verified === false;
      const ok = state.answers[q.id] === q.correct;
      const userAns = q.id in state.answers ? q.options[state.answers[q.id]] : '—';
      const correctAns = unverified ? null : q.options[q.correct];
      return `<div class="review-item" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>Question ${questions.indexOf(q)+1}${q.text ? ': ' + q.text : ''}</span><span class="mark ${unverified ? '' : (ok ? 'ok' : 'no')}" style="${unverified ? 'color:var(--text); opacity:0.6; font-weight:500; font-size:12px;' : ''}">${unverified ? 'no key' : (ok ? '&#10003;' : '&#10007;')}</span>
        </div>
        ${q.image ? `<img loading="lazy" src="${q.image}" style="max-width:100%; border:1px solid var(--glass-line); border-radius:8px; margin-top:8px; background:#fff; padding:4px;" alt="Question ${q.id}">` : ''}
        ${unverified ? `<div style="font-size:13px; margin-top:6px; opacity:0.6;">Your answer: ${userAns} &nbsp;·&nbsp; the answer has not been verified yet, practice only</div>` : ''}
        ${(!unverified && !ok) ? `<div style="font-size:13px; margin-top:6px;"><span style="color:var(--danger);">Your answer: ${userAns}</span> &nbsp;·&nbsp; <span style="color:var(--ok); font-weight:600;">Correct: ${correctAns}</span></div>` : ''}
      </div>`;
    }).join('')}
    <button class="restart-btn" id="restart">Take it again</button>
  `;
  document.getElementById('restart').onclick = () => {
    state = { idx: 0, answers: {}, timeLeft: 1800, timerId: null, finished: false };
    startTimer();
    render();
  };
}

function startTimer() {
  state.timerId = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) { finish(); return; }
    render();
  }, 1000);
}

startTimer();
render();
</script>

<script>
(function () {
  function mockId() { return (location.pathname.split('/').pop() || 'mock').replace('.html',''); }

  if (typeof saveAttempt === 'function') {
    /* mix-1..7: hook saveAttempt — localStorage stays, cloud is added */
    const orig = saveAttempt;
    saveAttempt = function () {
      orig();
      try {
        const verifiedQs = questions.filter(q => q.verified !== false);
        let score = 0;
        verifiedQs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
        window.preplineSaveResult(mockId(), score, verifiedQs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), verifiedQs, state.answers);
      } catch (e) { console.error('[Prepline]', e); }
    };
  } else if (typeof finish === 'function') {
    /* mix-8: no saveAttempt, wrap finish instead */
    const origFinish = finish;
    finish = function (reason) {
      const was = state.finished;
      origFinish(reason);
      try {
        if (!was && state.finished) {
          const qs = (typeof QUESTIONS !== 'undefined') ? QUESTIONS : questions;
          let score = 0;
          qs.forEach(q => { if (state.answers[q.id] === q.correct) score++; });
          window.preplineSaveResult(mockId(), score, qs.length);
        window.preplineSaveAnswers && window.preplineSaveAnswers(mockId(), qs, state.answers);
        }
      } catch (e) { console.error('[Prepline]', e); }
    };
  }
})();
</script>

<script id="prepline-scroll-view">
(function () {
  if (typeof questions === 'undefined' || typeof state === 'undefined') return;
  if (typeof render !== 'function') return;

  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  if (!app) return;

  var wrap = app.parentNode;
  var host = document.createElement('div');
  host.id = 'pl-scroll-host';
  host.className = 'pl-scroll pl-noselect';
  host.style.display = 'none';
  wrap.insertBefore(host, app.nextSibling);

  var bar = document.createElement('div');
  bar.className = 'pl-mode';
  bar.innerHTML = '<button type="button" data-m="one" class="on">One at a time</button>' +
                  '<button type="button" data-m="all">Scroll view</button>';
  wrap.insertBefore(bar, app);

  var mode = 'one';

  function esc(s) { return String(s == null ? '' : s); }

  function draw() {
    var parts = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      var opts = '';
      for (var k = 0; k < (q.options || []).length; k++) {
        var on = state.answers[q.id] === k ? ' sel' : '';
        opts += '<button type="button" class="pl-opt' + on + '" data-q="' + q.id +
                '" data-i="' + k + '">' + (LETTERS[k] || (k + 1)) + ') ' + (q.options[k]) + '</button>';
      }
      parts.push(
        '<div class="pl-q" id="pl-q-' + q.id + '">' +
          '<div class="pl-num">Question ' + (i + 1) + ' of ' + questions.length + '</div>' +
          (q.image ? '<img loading="lazy" class="pl-img" src="' + q.image + '" alt="Figure">' : '') +
          (q.text ? '<div class="pl-text">' + q.text + '</div>' : '') +
          '<div class="pl-opts">' + opts + '</div>' +
        '</div>');
    }
    var answered = Object.keys(state.answers).length;
    parts.push(
      '<div class="pl-bar">' +
        '<span class="pl-count">' + answered + ' of ' + questions.length + ' answered</span>' +
        '<button type="button" class="pl-submit" id="pl-submit">Finish test</button>' +
      '</div>');
    host.innerHTML = parts.join('');

    var btns = host.querySelectorAll('.pl-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].onclick = function () {
        var qid = parseInt(this.dataset.q, 10);
        state.answers[qid] = parseInt(this.dataset.i, 10);
        var sibs = this.parentNode.querySelectorAll('.pl-opt');
        for (var s = 0; s < sibs.length; s++) sibs[s].classList.remove('sel');
        this.classList.add('sel');
        var c = host.querySelector('.pl-count');
        if (c) c.textContent = Object.keys(state.answers).length + ' of ' + questions.length + ' answered';
      };
    }
    var sub = document.getElementById('pl-submit');
    if (sub) sub.onclick = function () {
      var left = questions.length - Object.keys(state.answers).length;
      if (left > 0 && !confirm('Unanswered: ' + left + ' question(s). Finish anyway?')) return;
      setMode('one');
      if (typeof finish === 'function') finish();
    };
  }

  function setMode(m) {
    if (state.finished) m = 'one';
    mode = m;
    var on = (m === 'all');
    host.style.display = on ? 'block' : 'none';
    app.style.display = on ? 'none' : '';
    document.body.classList.toggle('pl-noprint', on);
    var mb = bar.querySelectorAll('button');
    for (var i = 0; i < mb.length; i++) mb[i].classList.toggle('on', mb[i].dataset.m === m);
    if (on) { draw(); } else { render(); }
  }

  var mbtns = bar.querySelectorAll('button');
  for (var i = 0; i < mbtns.length; i++) {
    mbtns[i].onclick = function () { setMode(this.dataset.m); };
  }

  // в сплошном режиме мешаем самому простому копированию
  host.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  host.addEventListener('dragstart', function (e) { e.preventDefault(); });
  host.addEventListener('copy', function (e) { e.preventDefault(); });

  // после завершения теста режим прокрутки прячется, показываем результаты
  var origFinish = window.finish;
  if (typeof origFinish === 'function') {
    window.finish = function () {
      if (mode === 'all') setMode('one');
      return origFinish.apply(this, arguments);
    };
  }
})();
</script>
